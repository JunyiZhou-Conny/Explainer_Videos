  zh_subtitle: '授课老师登录后的那次运行 / 五个文件'
  first_use: 'S15[3]：授课老师登录后的那次运行，在课程 repo 上列出五个文件，和它的 v21 版本是同一组，数出来是 5。'
  note: 'A17, C1.'
- en: 'your account probably cannot access the class bucket / replace the address and the tag / your version 20 gives 4'
  zh_subtitle: '多半 / 地址 / v20 版本'
  first_use: 'S15[3]：你的账号多半访问不了课程的 bucket，所以用你自己的 repo：换掉地址和 tag；你的 v20 版本会得到 4。'
  note: 'A6: version 20 → v20 版本.'
- en: 'your repo is private / an access token in the address / make it public / work through it'
  zh_subtitle: '私有 / 访问令牌 / 公开'
  first_use: 'S15[3]：你的 repo 是私有的，所以要在地址里放一个访问令牌，或者把它设成公开。'
  note: 'A14, A16: a GitHub access token → 访问令牌. Pause and work through it → 暂停一下，从头做一遍.'
- en: 'cell 19 / asks quietly for dataset v25 / prints nothing / did it work'
  zh_subtitle: '第 19 个单元格 / 悄悄地 / dataset v25'
  first_use: 'S15[4]：第 19 个单元格悄悄地要 dataset v25，什么都没打印。'
  note: 'D4: dataset_v25. Did it work? → 它成功了吗？ (A10: must not say no).'
- en: 'the next cell fails / no such folder / without the quiet flag / unknown Git revision'
  zh_subtitle: '没有这个目录 / --quiet 参数 / 未知的 Git 修订版本'
  first_use: 'S15[5]：去掉 --quiet 参数，错误就出来了：未知的 Git 修订版本。'
  note: 'A7. No. → 没有。 The next cell fails: no such folder → 下一个单元格失败了：没有这个目录. D4: the --quiet flag.'
- en: 'the class repo only has tags v20, v21 and v30 / the stored count of 3 / left over from an older run / the quiet flag hides errors too'
  zh_subtitle: 'v20 / v21 / v30 / 存下来的计数'
  first_use: 'S15[5]：存下来的计数 3 是以前某次运行留下的；--quiet 参数连错误也一起藏起来了。'
  note: 'The class repo only has tags v20, v21 and v30 → 课程的 repo 只有 v20、v21 和 v30 这几个 tag.'
# ---------------------------------------------------------------- S16: monitoring, teardown and recap
- en: 'a quick prediction / three questions, three tools / match / Delta Lake / Iceberg / lakeFS'
  zh_subtitle: '快速预测 / 配对 / Delta Lake / Iceberg / lakeFS'
  first_use: 'S16[0]：把 Delta Lake 或 Iceberg、DVC 和 lakeFS 配对上去。'
  note: 'A quick prediction: three questions, three tools → 快速预测一下：三个问题，三个工具 (D6).'
- en: 'the table formats / no single standard / your project milestone / a light tool like this'
  zh_subtitle: '表格式 / 统一的标准 / 项目里程碑 / 轻量的工具'
  first_use: 'S16[1]：没有统一的标准；你的项目里程碑接受这样的轻量工具。'
  note: 'DVC, lakeFS, then the table formats → DVC、lakeFS，然后是表格式.'
- en: 'monitoring / quality / freshness / drift / cost / broken steps'
  zh_subtitle: '监控 / 质量 / 新鲜度 / 漂移 / 成本 / 出错的步骤'
  first_use: 'S16[2]：课上最后讲监控：盯住质量、新鲜度、漂移、成本和出错的步骤。'
  note: 'L6, L8: drift → 漂移.'
- en: 'versioning tells you what changed / monitoring tells you that something changed'
  zh_subtitle: '版本管理 / 监控'
  first_use: 'S16[2]：版本管理告诉你改了什么；监控告诉你有东西变了。'
  note: 'A4.'
- en: 'on one map / signs tickets for the photos / a rule on the bucket satisfies the browser''s bouncer'
  zh_subtitle: '一张地图 / 签票 / 保安'
  first_use: 'S16[3]：放在一张地图上看：Label Studio 跑在 container 里，替照片签票。'
  note: 'Never 签发票 (发票 is an invoice). A rule on the bucket satisfies the browser''s bouncer → bucket 上的一条规则，让浏览器的保安放行.'
- en: 'labels are small notes / a mounted bucket feeds DVC / photos are filed by fingerprint / a tag pins the list'
  zh_subtitle: '小纸条 / 归档 / 锁定'
  first_use: 'S16[3]：每条 label 是一张小纸条；挂载的 bucket 给 DVC 供数据。'
  note: 'Photos are filed by fingerprint; a tag pins the list → 照片按指纹归档；一个 tag 锁定这份列表.'
- en: 'Monday''s photos come back with one dvc get / their labels join in exercise E7'
  zh_subtitle: '周一的照片 / 练习 E7'
  first_use: 'S16[3]：所以周一的照片用一次 dvc get 就能拿回来；它们的 label 会在练习 E7 里接上。'
  note: 'A17.'
- en: '5 questions to test yourself / One: … Five: / who fetches the photos / swap addresses / what changes on a rename / where do the bytes sit after a push / without the DVC store'
  zh_subtitle: '五道自测题 / 第一题 / 第五题 / 互换地址 / 改名'
  first_use: 'S16[4]：第五题：没有 DVC store，dvc get 会怎样？'
  note: 'D6. One: who fetches the photos, and why does the bucket need its CORS rule? → 第一题：谁去取照片，bucket 为什么需要它的 CORS 规则？ Two → 第二题：命令行 container 和你的浏览器，为什么不能互换地址？ Three → 第三题：指针文件里有什么，改名时什么会变？ Four → 第四题：push 之后，字节都在哪儿？ D4: Without the dvc_store.'
- en: 'cleanup is the README''s three commands / keep the labeling bucket / remove its CORS rule with dash r'
  zh_subtitle: '清理 / 标注用的 bucket / -r'
  first_use: 'S16[5]：如果你保留标注用的 bucket，就用 -r 删掉它的 CORS 规则。'
  note: 'Cleanup is the README''s three commands; pause and run them → 清理就是 README 的三条命令；暂停一下，把它们跑一遍. D4: with -r.'
- en: 'buckets cost money until you delete them / never delete the DVC store while any tag should still work / a tag is only a pointer'
  zh_subtitle: '花钱 / 指针'
  first_use: 'S16[5]：每个 bucket 在你删除之前都要花钱，但只要还有哪个 tag 要用，就绝不要删 DVC store；tag 只是一个指针。'
  note: 'A8: 指针 (a tag) vs 指针文件. BRIEF: deleting dvc_store is never cleanup.'
- en: 'delete the key and its JSON file when the course is done'
  zh_subtitle: '课程结束后'
  first_use: 'S16[5]：课程结束后，删掉密钥和它的 JSON 文件。'
  note: 'A14.'
- en: 'answers are in the exercises / Lecture 13 / trains from a prepared zip / a tagged version / reproducible'
  zh_subtitle: '答案 / 练习 / 第 13 讲 / zip / 可复现'
  first_use: 'S16[6]：第 13 讲用一个准备好的 zip 来训练；要是用打了 tag 的版本，那次运行就能复现。'
  note: 'D6: Answers are in the exercises. → 答案在练习里。'
