- en: "The lecture ends with monitoring: watch quality, freshness, drift, cost and broken steps. Versioning tells you what changed; monitoring tells you that something changed."
  zh:
  - "课上最后讲监控：盯住质量、新鲜度、漂移、成本和出错的步骤。"
  - "版本管理告诉你改了什么；监控告诉你有东西变了。"
- en: "On one map: Label Studio runs in a container and signs tickets for the photos. A rule on the bucket satisfies the browser's bouncer. Labels are small notes; a mounted bucket feeds DVC. Photos are filed by fingerprint; a tag pins the list. So Monday's photos come back with one dvc get; their labels join in exercise E7."
