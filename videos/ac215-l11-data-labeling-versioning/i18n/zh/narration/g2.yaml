  - "你的账号多半访问不了课程的 bucket，所以用你自己的 repo：换掉地址和 tag；你的 v20 版本会得到 4。"
  - "你的 repo 是私有的，所以要在地址里放一个访问令牌，或者把它设成公开。"
  - "暂停一下，从头做一遍。"
