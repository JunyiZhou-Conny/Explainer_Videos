S15:
- en: "Now, time travel from anywhere: the lecture's phrase for reaching an earlier version, which works only while its files are kept. The command dvc get, with a tag, walks the rope. It clones the repo at that tag, reads that commit's config to find the bucket, then fetches the manifest, then the photos."
  zh:
  - "现在来看从任何地方做时间旅行：这是课上的说法，指回到之前的某个版本，前提是它的文件还保留着。"
  - "命令 dvc get 带上一个 tag，就会顺着这根绳子走。"
  - "它在那个 tag 上 clone 这个 repo，读那个 commit 的配置找到 bucket，然后取 manifest，再取照片。"
- en: "Open the notebook from the README and save a copy. Install DVC, load the libraries, and sign in with your Google account. Then list a repo, fetch a version, and count the files."
  zh:
  - "打开 README 里的 notebook，保存一份副本。"
  - "装 DVC、加载库，再用你的 Google 账号登录。"
  - "然后列出一个 repo，取一个版本，数一数文件。"
- en: "Our stand-in is not signed in, and pip gives it a newer DVC, 3.67.1, at the time of recording. Listing the class repo fails with a 401, and look where: at the manifest, because DVC fetches the list first, in the rope's order."
  zh:
  - "我们的替身没有登录，而 pip 给它装了一个更新的 DVC，录制时是 3.67.1。"
  - "列出课程的 repo 时报了 401，看看是在哪儿：在 manifest 那一步，因为 DVC 先取列表，按绳子的顺序来。"
- en: "The instructor's signed-in run lists five files on the class repo, the same set as its version 21, and counts 5. Your account probably cannot access the class bucket, so use your repo: replace the address and the tag; your version 20 gives 4. Your repo is private, so put an access token in the address, or make it public. Pause and work through it."
