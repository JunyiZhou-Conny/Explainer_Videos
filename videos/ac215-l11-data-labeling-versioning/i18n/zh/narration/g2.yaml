  - "每条 label 是一张小纸条；挂载的 bucket 给 DVC 供数据。"
  - "照片按指纹归档；一个 tag 锁定这份列表。"
  - "所以周一的照片用一次 dvc get 就能拿回来；它们的 label 会在练习 E7 里接上。"
- en: "5 questions to test yourself. One: who fetches the photos, and why does the bucket need its CORS rule? Two: why can't the command line container and your browser swap addresses? Three: what is in the pointer file, and what changes on a rename? Four: where do the bytes sit after a push? Five: without the DVC store, what does dvc get do?"
