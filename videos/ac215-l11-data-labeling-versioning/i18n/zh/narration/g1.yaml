# zh narration for S01-S08 (part 1, group g1: the hook and the map, the key and 21 photos, Label Studio in one
# docker run, who touches the bytes, CORS on the bucket, a label is a record, compose and cleanup), sentence-aligned
# to script.md: one zh sentence per English sentence (explainer.voice.split_sentences; 56 SAY lines, 167 sentences).
# Terms and rules: ../GLOSSARY.md, ../glossary.yaml.
# Subtitles only: there is no Chinese voice in this series, so no say: and no anchors (rule D2); the zh line
# is shown on the English timing, so each sentence keeps the English order of ideas (A9, D8): no condition or
# time clause moved to the front where the English puts it last.
# Artifacts the checker does not allow in a displayed line are written as the SAY says them (rule A6):
# cheese_dataset -> cheese dataset; cheeses_unlabeled / cheeses_labeled -> cheeses unlabeled / cheeses labeled;
# depends_on -> depends on 这个设置.
# Error messages the SAY paraphrases are translated (A7): file not found -> 找不到文件; its data folder is not
# writable -> 它的数据目录不可写; legacy token authentication has been disabled for this organization -> 这个组织
#已经停用了 legacy token 身份验证; it cannot connect -> 连不上; the first call is refused -> 第一次调用被拒绝了.
# The instructor rule (A17): the instructor -> 授课老师, never a name and never the on-screen mask.
# en_display: the English subtitle line where the SAY spells an artifact as words (rule D4: cheese_dataset,
# data-service-account.json, cheeses_unlabeled / cheeses_labeled, -d, -p 8080:8080, -v, -e, -a, localhost:8080,
# Image Classification, Settings / Cloud Storage, /secrets, Sync, -c, -m, Account & Settings, -p -k, Organization,
# API Tokens Settings, -t, Cheese labels, depends_on); null = the SAY text.
S01:
- en: "Two folders, both called cheese dataset, with the same file names and the same count. On Monday you trained a model on one of them. On Friday the model got worse, and nobody touched the code. So which photos, with which labels, did that model see? And can you get exactly those back?"
  zh:
  - "两个目录，都叫 cheese dataset，文件名一样，数量也一样。"
  - "周一你在其中一个上训练了模型。"
  - "周五模型变差了，可谁都没动过代码。"
  - "那么，这个模型看到的是哪些照片、带着哪些 label？"
  - "还能把它们一模一样地拿回来吗？"
  en_display:
  - "Two folders, both called cheese_dataset, with the same file names and the same count."
  - null
  - null
  - null
  - null
- en: "Most of us answer with file names: final, final version 2, final final version 3, until nobody knows which one is final."
  zh:
  - "我们大多数人靠文件名来回答：final、final 第 2 版、final final 第 3 版，直到没人知道哪个才是 final。"
- en: "Here is a better answer: one short line. In part 2 you will compute this exact string on your own laptop from 4 cheese photos. It will match the instructor's tag in the class repo, character for character. How can one line pin down about 600 kilobytes of photos?"
  zh:
  - "更好的答案是：一行字。"
  - "第二部分里，你会在自己的笔记本上，用 4 张奶酪照片算出这个一模一样的字符串。"
  - "它会和授课老师在课程 repo 里打的 tag 对上，一个字符都不差。"
  - "一行字，怎么能锁定大约 600 KB 的照片？"
- en: "And before that, when someone clicks gouda, where does that word actually go?"
  zh:
  - "在那之前，有人点了 gouda，这个词到底去了哪儿？"
- en: "To follow along you need Docker Desktop, a Google Cloud project with billing and your own bucket, and a GitHub account. This lecture stores a few megabytes in the cloud, and gold tags mark where. The tracker in the top left follows both READMEs. A yellow your-turn tag means pause and run it; a gray extra tag marks a check that is not in the README. Every command is in the study guide."
  zh:
  - "跟着做，你需要 Docker Desktop、一个开通了结算的 Google Cloud 项目和你自己的 bucket，还有一个 GitHub 账号。"
  - "这一讲会在云端存几 MB 数据，金色标签会标出在哪儿。"
  - "左上角的进度条跟着两份 README 走。"
  - "看到黄色的 your turn 标签，就暂停，自己跑一遍；灰色的 extra 标签表示这个检查 README 里没有。"
  - "每条命令都在学习指南里。"
S02:
- en: "First, the map. The lecture draws unlabeled cheese photos, then labeled ones, then training, and the arrow in between asks how. Labels are the ground truth a model learns from and is graded against. The model's mistakes, once labeled, go into the next dataset version."
  zh:
  - "先看地图。"
  - "课上先画未标注的奶酪照片，再画标注好的，然后是训练，中间的箭头在问怎么做到。"
  - "这些 label 就是 ground truth：模型从中学习，也拿它来评分。"
  - "模型犯的错，标注之后，会进入下一个数据集版本。"
- en: "Underneath, the two stations this lecture builds. Part 1 is the labeling station: Label Studio and a small command line container, with one bucket for photos and labels. Part 2 is the versioning station: one DVC container, a bucket with two folders, your own GitHub repo, and Colab to view versions. The code does not connect the halves yet; exercise E7 does."
  zh:
  - "下面是这一讲要搭的两个站。"
  - "第一部分是标注站：Label Studio 和一个小小的命令行 container，再加一个放照片和 label 的 bucket。"
  - "第二部分是版本管理站：一个 DVC container、一个有两个目录的 bucket、你自己的 GitHub repo，还有用来查看版本的 Colab。"
  - "代码还没把这两半连起来；练习 E7 会连。"
- en: "Now, the lecture's recall quiz. Docker network, cloud credentials, Docker Compose: where will each one show up today?"
  zh:
  - "现在来做课上的回顾小测。"
  - "Docker 网络、云端凭据、Docker Compose：今天它们各自会出现在哪里？"
- en: "The network lets the command line container call Label Studio by name. The credentials are one key file, mounted into every container. And Compose is the README's extra section, which starts both containers together."
  zh:
  - "有了网络，命令行 container 就能按名字调用 Label Studio。"
  - "凭据就是一个密钥文件，挂载进每个 container。"
  - "Compose 则是 README 的 Extra 一节，它把两个 container 一起启动。"
- en: "Clone the data-labeling repo and move into it; pause and run it. Give Docker more than 4 gigabytes of memory, as the README asks; the setting is now under Settings, Resources."
  zh:
  - "把 data-labeling 这个 repo clone 下来，再进去；暂停一下，自己跑一遍。"
  - "给 Docker 超过 4 GB 的内存，README 是这么要求的；这个设置现在在 Settings 里的 Resources 下面。"
- en: "An extra git log shows this video's commit, from October 2025; an extra listing shows the scripts, cli.py and three pictures."
  zh:
  - "额外跑一下 git log，能看到这个视频用的 commit，是 2025 年 10 月的；再额外列一下目录，有几个脚本、cli.py 和三张图。"
- en: "Next, the secrets folder, beside the repo and never inside it; it serves both repos today. Pause and make it; an extra tree view matches the README."
  zh:
  - "接下来是 secrets 目录，放在 repo 旁边，绝不放在里面；今天两个 repo 都用它。"
  - "暂停一下，建好它；额外用 tree 看一下，和 README 一致。"
S03:
- en: "Now the key. In the console, create a service account named data-service-account, with the Storage Admin role. Then create one JSON key, saved in your secrets folder as data-service-account dot json. This role is broader than needed: it covers every bucket in the project. Pause and create yours."
  zh:
  - "现在是密钥。"
  - "在控制台里建一个服务账号，名字叫 data-service-account，角色是 Storage Admin。"
  - "然后建一个 JSON 密钥，存进你的 secrets 目录，文件名是 data-service-account.json。"
  - "这个角色的权限比需要的大：它覆盖项目里的每一个 bucket。"
  - "暂停一下，建一个你自己的。"
  en_display:
  - null
  - null
  - "Then create one JSON key, saved in your secrets folder as data-service-account.json."
  - null
  - null
- en: "An extra listing shows the key in place: a stand-in, explained in scene 5."
  zh:
  - "额外列一下目录，密钥已经就位：这是一个替身，第 5 个场景会解释。"
- en: "Download the unlabeled photos from the README link; we use curl, and a browser works too. Then extract the zip. Pause and do both. Notice that every image comes with a twin in a hidden Mac folder."
  zh:
  - "从 README 的链接下载未标注的照片；我们用 curl，用浏览器也行。"
  - "然后解压这个 zip。"
  - "暂停一下，两件都做了。"
  - "注意，每张图片都在一个隐藏的 Mac 目录里有个双胞胎。"
- en: "A quick prediction: the zip held 42 files. How many tasks should Label Studio make?"
  zh:
  - "快速预测一下：这个 zip 里有 42 个文件。"
  - "Label Studio 应该建多少个 task？"
- en: "21. An extra count shows 21 images, one of them a PNG, plus 21 Mac metadata files. Upload only the images, or you get 21 broken tasks. The lecture calls this curation, dropping junk before it becomes a task."
  zh:
  - "21 个。"
  - "额外数一下：21 张图片，其中一张是 PNG，另外还有 21 个 Mac 元数据文件。"
  - "只上传图片，不然你会得到 21 个坏掉的 task。"
  - "课上把这叫做数据整理：在垃圾文件变成 task 之前就把它们去掉。"
- en: "One more extra, for part 2: each photo's fingerprint, computed from its bytes alone. Same bytes, same string; change one byte, and it changes completely. Remember the first one."
  zh:
  - "再来一个额外检查，为第二部分准备：每张照片的指纹，只由它的字节算出来。"
  - "同样的字节，同样的字符串；改一个字节，它就完全变了。"
  - "记住第一个。"
- en: "Then create your bucket with a name of your own, since names are global, and keep the defaults. Add two folders, cheeses unlabeled and cheeses labeled, and upload the 21 images into the first. Pause and set it up. A gold tag: storage starts here, a fraction of a cent a month."
  zh:
  - "然后用你自己起的名字建 bucket，因为名字是全局唯一的，其他保持默认设置。"
  - "再加两个目录，cheeses unlabeled 和 cheeses labeled，把 21 张图片上传到第一个里。"
  - "暂停一下，把它配好。"
  - "金色标签：存储费用从这里开始，每月不到一美分。"
  en_display:
  - null
  - "Add two folders, cheeses_unlabeled and cheeses_labeled, and upload the 21 images into the first."
  - null
  - null
S04:
- en: "The README runs Label Studio from a ready-made image, in your own container, so no outside labeling service sees your photos. Its script creates the network only if it is missing, and removes any old container with that name."
  zh:
  - "README 用一个现成的 image，在你自己的 container 里跑 Label Studio，所以没有任何外部的标注服务能看到你的照片。"
  - "它的脚本只在网络不存在时才创建网络，还会删掉同名的旧 container。"
- en: "Then one docker run, flag by flag. The flag dash d runs it in the background, and the network flag puts it on a private street. Then dash p, 8080 colon 8080, publishes the port: a door in your laptop wall. Two dash v flags mount a database folder and your secrets; the dash e lines set the login and key path."
  zh:
  - "然后是一条 docker run，一个参数一个参数地看。"
  - "参数 -d 让它在后台运行，--network 参数把它放到一条私有的街道上。"
  - "然后，-p 8080:8080 发布这个 port：笔记本墙上的一扇门。"
  - "两个 -v 参数挂载一个数据库目录和你的 secrets；-e 这几行设置登录信息和密钥路径。"
  en_display:
  - null
  - "The flag -d runs it in the background, and the network flag puts it on a private street."
  - "Then -p 8080:8080 publishes the port: a door in your laptop wall."
  - "Two -v flags mount a database folder and your secrets; the -e lines set the login and key path."
- en: "Pause and run sh docker-shell.sh; it pulls the image. Then the README's check, docker container ls: up, port 8080 published."
  zh:
  - "暂停一下，跑 sh docker-shell.sh；它会拉取 image。"
  - "然后是 README 的检查，docker container ls：状态是 Up，port 8080 已发布。"
- en: "But look again 25 seconds later, with an extra dash a: exited. Something to ponder: where do you look first?"
  zh:
  - "可是 25 秒后加一个额外的 -a 再看一次：Exited。"
  - "来想一个问题：你先看哪儿？"
  en_display:
  - "But look again 25 seconds later, with an extra -a: exited."
  - null
- en: "The logs. Label Studio explains itself: its data folder is not writable. It runs as user 1001, but Docker created the missing folder as root."
  zh:
  - "看日志。"
  - "Label Studio 自己说明了原因：它的数据目录不可写。"
  - "它以用户 1001 运行，可 Docker 是以 root 身份创建这个缺失的目录的。"
- en: "The fix is an extra, for Linux; Docker Desktop for Mac normally avoids this. Give the folder to user 1001 with sudo chown, run the script again, and now it stays up. On Linux, pause and do the same."
  zh:
  - "修法是一个额外步骤，只针对 Linux；Mac 上的 Docker Desktop 一般不会遇到。"
  - "用 sudo chown 把目录交给用户 1001，再跑一次脚本，这次它就一直保持运行了。"
  - "在 Linux 上，暂停一下，照样做一遍。"
- en: "Extra checks: the logs show a box offering version 1.23.2, newer than this image, which ran 1.23.0 at the time of recording. The tag is latest, so yours may differ."
  zh:
  - "额外检查：日志里有个框，提示有 1.23.2 版本，比这个 image 新，这个 image 录制时跑的是 1.23.0。"
  - "它的 tag 是 latest，所以你的可能不一样。"
- en: "Open localhost 8080 and log in with the username and password from lines 19 and 20 of your script. Create a project with the image classification template, with the choices brie, gouda, gruyere and parmigiano. Pause and do it. Underneath, our stand-in calls replay the page's requests: we are logged in, and project 1 holds the four cheeses."
  zh:
  - "打开 localhost:8080，用你脚本第 19 行和第 20 行里的用户名和密码登录。"
  - "建一个项目，用 Image Classification 模板，选项是 brie、gouda、gruyere 和 parmigiano。"
  - "暂停一下，照着做。"
  - "下方是我们的替身调用，重放了页面发出的请求：我们已经登录，项目 1 里有四种奶酪。"
  en_display:
  - "Open localhost:8080 and log in with the username and password from lines 19 and 20 of your script."
  - "Create a project with the Image Classification template, with the choices brie, gouda, gruyere and parmigiano."
  - null
  - null
S05:
- en: "Back in the project, open settings, then cloud storage, and add source storage, where the photos come from. Use the README's values: Google Cloud Storage, your bucket, the prefix cheeses unlabeled, and pre-signed URLs on. If a checkbox is missing, carry on. Leave the credentials empty: that means the key the container already has."
  zh:
  - "回到项目里，打开 Settings，再进 Cloud Storage，添加 source storage，也就是照片的来源。"
  - "用 README 给的值：Google Cloud Storage、你的 bucket、前缀 cheeses unlabeled，打开 pre-signed URL。"
  - "要是少了某个复选框，继续就行。"
  - "凭据留空：意思是用 container 里已经有的那个密钥。"
  en_display:
  - "Back in the project, open Settings, then Cloud Storage, and add source storage, where the photos come from."
  - "Use the README's values: Google Cloud Storage, your bucket, the prefix cheeses_unlabeled, and pre-signed URLs on."
  - null
  - null
- en: "Then click Check Connection. Here it fails: file not found. An extra listing shows why: slash secrets inside Label Studio is empty. The target storage, where labels go, with the prefix cheeses labeled, fails too, with a vaguer message."
  zh:
  - "然后点 Check Connection。"
  - "这里失败了：找不到文件。"
  - "额外列一下目录就知道原因：Label Studio 里面的 /secrets 是空的。"
  - "存放 label 的 target storage，前缀是 cheeses labeled，也失败了，报错更含糊。"
  en_display:
  - null
  - null
  - "An extra listing shows why: /secrets inside Label Studio is empty."
  - "The target storage, where labels go, with the prefix cheeses_labeled, fails too, with a vaguer message."
- en: "One honest note about this recording. This machine has no Google account, no bucket, no browser, and no SSH route to GitHub. The key in the folder listings is an obviously invalid stand-in, moved out before every cloud step. So each cloud step here fails exactly the way a misplaced key fails. That is the most common mistake in this lecture. Every success you should expect is tagged recorded, with its source, and clicks and uploads are replayed locally, tagged stand-in."
  zh:
  - "关于这次录制，如实说一句。"
  - "这台机器没有 Google 账号，没有 bucket，没有浏览器，也没有通往 GitHub 的 SSH 通道。"
  - "目录列表里的密钥是一个明显无效的替身，每个云端步骤之前都会移走。"
  - "所以这里每一个云端步骤失败的方式，都和密钥放错位置时一模一样。"
  - "这正是这一讲里最常见的错误。"
  - "你应该看到的每个成功结果都标着 recorded，并注明出处；点击和上传则在本地重放，标着 stand-in。"
- en: "With a real key, add both storages and click sync: one task per photo, 21 for you. Our stand-in imports 3 tasks with the same kind of addresses. Pause, add both, and sync."
  zh:
  - "有了真的密钥，两个存储都加上，点 Sync：一张照片一个 task，你那边是 21 个。"
  - "我们的替身导入了 3 个 task，地址也是同一类的。"
  - "暂停一下，两个都加上，再点 Sync。"
  en_display:
  - "With a real key, add both storages and click Sync: one task per photo, 21 for you."
  - null
  - null
- en: "So who touches the photos? Label Studio holds the key and lists the bucket; your browser asks for task 1. Something to ponder: your browser never sees the key, so how can it show a private photo?"
  zh:
  - "那么，谁在碰这些照片？"
  - "Label Studio 拿着密钥，列出 bucket 里的东西；你的浏览器请求 task 1。"
  - "来想一个问题：你的浏览器从没见过密钥，它怎么能显示一张私有的照片？"
- en: "With a signed ticket. Label Studio does not relay the photos; it signs a web address with the key: permission for one photo, for a short time. Your browser carries that ticket straight to Google, and the key stays in the container. Then the thumbnails break, and the README warns you: it is CORS."
  zh:
  - "靠一张签了名的票。"
  - "Label Studio 不中转照片；它用密钥给一个网址签名：只许看一张照片，只在很短的时间里有效。"
  - "你的浏览器拿着这张票直接去找 Google，密钥一直留在 container 里。"
  - "接着缩略图坏掉了，README 也提醒了你：是 CORS 的问题。"
S06:
- en: "The page comes from localhost 8080, the photo from Google's storage address: a different origin. When the page's own code fetches the photo, as Label Studio does, your browser hands the answer over only if it carries a header that allows this origin. Google adds that header only if the bucket has its own CORS rule."
  zh:
  - "页面来自 localhost:8080，照片来自 Google 的存储地址：这是另一个 origin。"
  - "页面自己的代码去取照片时，像 Label Studio 这样，你的浏览器把响应交给这段代码，只有一个前提：它带着允许这个 origin 的响应头。"
  - "Google 加上这个响应头，也只有一个前提：bucket 有它自己的 CORS 规则。"
  en_display:
  - "The page comes from localhost:8080, the photo from Google's storage address: a different origin."
  - null
  - null
- en: "A small slip: the README blames a reverse DNS lookup, but the cause is that same-origin rule."
  zh:
  - "有一个小疏漏：README 把问题归到反向 DNS 查询上，其实原因就是这条同源规则。"
- en: "The README sets the rule from a second container. Put your bucket name on line 23 of docker-shell-CLI.sh, then run it with sh. The ID in the prompt changes every run, and Apple Silicon says aarch64 where this machine says x86. Pause and do both."
  zh:
  - "README 用第二个 container 来设置这条规则。"
  - "把你的 bucket 名字写到 docker-shell-CLI.sh 的第 23 行，再用 sh 运行它。"
  - "提示符里的 ID 每次运行都会变，Apple Silicon 上显示 aarch64，这台机器上显示的是 x86。"
  - "暂停一下，两件都做了。"
- en: "This container joins the same street and calls Label Studio by name, not localhost. It mounts the repo by its folder name, so keep that name."
  zh:
  - "这个 container 加入同一条街道，按名字调用 Label Studio，而不是 localhost。"
  - "它按目录名挂载这个 repo，所以别改这个名字。"
- en: "Inside, run python cli.py dash c, then dash m; pause and run them. Here both stop at the storage client: file not found, because ADC looks for the key. The code builds one rule, any origin, GET only, max age one hour, and patches the bucket."
  zh:
  - "在里面先跑 python cli.py -c，再跑 -m；暂停一下，把它们跑一遍。"
  - "这里两条都卡在存储客户端：找不到文件，因为 ADC 在找密钥。"
  - "代码构造一条规则：任意 origin、只允许 GET、max age 一小时，然后 patch 到 bucket 上。"
  en_display:
  - "Inside, run python cli.py -c, then -m; pause and run them."
  - null
  - null
- en: "With a real key, dash c prints the rule, and dash m prints the bucket settings. Now the header arrives and the thumbnails load. The max age only caches preflight checks, which a plain image request never makes."
  zh:
  - "有了真的密钥，-c 会打印这条规则，-m 会打印 bucket 的设置。"
  - "这下响应头来了，缩略图也加载出来了。"
  - "这个 max age 只缓存预检请求，而普通的图片请求从来不发预检请求。"
  en_display:
  - "With a real key, -c prints the rule, and -m prints the bucket settings."
  - null
  - null
- en: "Something to ponder. You ran dash c and refreshed, and the thumbnails are still broken. Name two suspects."
  zh:
  - "来想一个问题。"
  - "你跑了 -c 也刷新了，缩略图还是坏的。"
  - "说出两个嫌疑点。"
  en_display:
  - null
  - "You ran -c and refreshed, and the thumbnails are still broken."
  - null
- en: "One: the rule missed your bucket. Dash c failed, or line 23 names another bucket of yours; dash m shows which bucket got it. Two: your browser reused cached answers; hard refresh. And curl never met a bouncer: CORS is a browser rule, not access control."
  zh:
  - "第一个：规则没加到你的 bucket 上。"
  - "要么 -c 失败了，要么第 23 行写的是你的另一个 bucket；-m 会显示哪个 bucket 拿到了规则。"
  - "第二个：你的浏览器用了缓存的响应；强制刷新一下。"
  - "而 curl 从来没遇到过保安：CORS 是浏览器的规则，不是访问控制。"
  en_display:
  - null
  - "-c failed, or line 23 names another bucket of yours; -m shows which bucket got it."
  - null
  - null
S07:
- en: "Back in Label Studio, click a task, pick a cheese, and submit; repeat for a few. Pause and label some. Here is what one click becomes, as a stand-in call: a small JSON document whose result says choices, gouda."
  zh:
  - "回到 Label Studio，点开一个 task，选一种奶酪，然后点 Submit；重复几次。"
  - "暂停一下，标注几张。"
  - "一次点击会变成什么，用替身调用来看：一个小小的 JSON 文档，result 里写着 choices 是 gouda。"
- en: "Label Studio saves it in its database, and the target storage writes a copy to cheeses labeled, pointing back at the photo, which never moved. The slide sorts photos into rows, but on disk a label is a small JSON note, and a labeled dataset is photos plus notes. In the console, that folder shows one JSON file per annotation. Open one to see the note."
  zh:
  - "Label Studio 把它存进自己的数据库，target storage 再往 cheeses labeled 里写一份副本，指回那张从没移动过的照片。"
  - "课件把照片按行分了类，但在磁盘上，一条 label 就是一张 JSON 小纸条，标注好的数据集就是照片加上小纸条。"
  - "在控制台里，这个目录里每条标注对应一个 JSON 文件。"
  - "打开一个就能看到这张小纸条。"
  en_display:
  - "Label Studio saves it in its database, and the target storage writes a copy to cheeses_labeled, pointing back at the photo, which never moved."
  - null
  - null
  - null
- en: "The command line container calls Label Studio by name. Something to ponder: what if its address were localhost 8080?"
  zh:
  - "命令行 container 按名字调用 Label Studio。"
  - "来想一个问题：要是它的地址写成 localhost:8080 呢？"
  en_display:
  - null
  - "Something to ponder: what if its address were localhost:8080?"
- en: "It cannot connect: inside a container, localhost is that container, and nothing listens there. The name works, because the Docker network keeps a phone book of container names."
  zh:
  - "连不上：在 container 里面，localhost 指的就是这个 container，那里什么都没在监听。"
  - "名字能用，是因为 Docker 网络维护着一本 container 名字的电话簿。"
- en: "To list labels from code, copy your access token from Account and Settings, then run the README command: python cli.py dash p, dash k, and your token. Pause and try it. On Label Studio 1.23.0 it fails with a 401; ours says legacy token authentication has been disabled for this organization."
  zh:
  - "要从代码里列出 label，先从 Account & Settings 复制你的访问令牌，再跑 README 的命令：python cli.py -p -k，后面跟你的令牌。"
  - "暂停一下，试一试。"
  - "在 Label Studio 1.23.0 上它会报 401；我们这边的报错说，这个组织已经停用了 legacy token 身份验证。"
  en_display:
  - "To list labels from code, copy your access token from Account & Settings, then run the README command: python cli.py -p -k and your token."
  - null
  - null
- en: "An extra check shows why: this version has two kinds of token. The page shows a newer personal token by default, the legacy kind is switched off, and cli.py speaks only legacy."
  zh:
  - "额外检查一下就知道原因：这个版本有两种令牌。"
  - "页面默认显示较新的 personal token，legacy 那种是关掉的，而 cli.py 只认 legacy。"
- en: "The fix: in organization, API token settings, enable legacy tokens. Then copy the legacy token, not the personal one. Pause and do both."
  zh:
  - "修法：在 Organization 的 API Tokens Settings 里启用 legacy token。"
  - "然后复制 legacy token，不是 personal token。"
  - "暂停一下，两件都做了。"
  en_display:
  - "The fix: in Organization, API Tokens Settings, enable legacy tokens."
  - null
  - null
- en: "Run dash p again, and it lists project 1, cheese labels. Then dash t with your token: 3 tasks in our stand-in, 21 for you; ours has one labeled, as gouda. Pause and run both. The README's sample says amanita; the format is the same."
  zh:
  - "再跑一次 -p，它列出了项目 1：Cheese labels。"
  - "然后带上你的令牌跑 -t：我们的替身里是 3 个 task，你那边是 21 个；我们的有一张标注成了 gouda。"
  - "暂停一下，两条都跑一遍。"
  - "README 的示例写的是 amanita；格式是一样的。"
  en_display:
  - "Run -p again, and it lists project 1, Cheese labels."
  - "Then -t with your token: 3 tasks in our stand-in, 21 for you; ours has one labeled, as gouda."
  - null
  - null
S08:
- en: "The README's extra section runs both containers from one compose file. Leave the command line container with exit, stop Label Studio, and check with docker ps; pause and do it. Then run sh docker-shell-compose.sh. Here it stops on a name conflict: docker stop leaves the container behind, still holding its name."
  zh:
  - "README 的 Extra 一节用一个 compose 文件跑起两个 container。"
  - "用 exit 退出命令行 container，停掉 Label Studio，再用 docker ps 检查；暂停一下，照着做。"
  - "然后跑 sh docker-shell-compose.sh。"
  - "这里它因为名字冲突停下了：docker stop 会把 container 留在那儿，名字还被它占着。"
- en: "An extra docker rm frees the name; pause, remove it, and run the compose script again. This time Compose creates Label Studio plus a one-off command line container."
  zh:
  - "额外跑一下 docker rm 把名字腾出来；暂停一下，删掉它，再跑一次 compose 脚本。"
  - "这次 Compose 创建了 Label Studio，外加一个一次性的命令行 container。"
- en: "An extra echo prints the README's bucket name: compose keeps its own copy, on line 17 of docker-compose.yml, so edit it too."
  zh:
  - "额外用 echo 打印出来的，是 README 里的 bucket 名字：compose 自己存了一份，在 docker-compose.yml 的第 17 行，所以这里也要改。"
- en: "And the first call is refused: the depends on setting starts Label Studio first, but does not wait until it listens. After an extra wait loop, project 1 is back, because the same folder is mounted."
  zh:
  - "而第一次调用被拒绝了：depends on 这个设置会先启动 Label Studio，但不会等到它开始监听。"
  - "额外加一个等待循环之后，项目 1 回来了，因为挂载的是同一个目录。"
  en_display:
  - "And the first call is refused: the depends_on setting starts Label Studio first, but does not wait until it listens."
  - null
- en: "Label Studio keeps running after you exit the command line container. Then the README's cleanup: list, stop, prune, and list the images; pause and run them. The prune also removed the network, so next time run docker-shell.sh first."
  zh:
  - "Label Studio 一直在跑，你退出命令行 container 之后也一样。"
  - "然后是 README 的清理：列出、停止、prune，再列出 image；暂停一下，把它们跑一遍。"
  - "这次 prune 把网络也删了，所以下次要先跑 docker-shell.sh。"
- en: "Something to ponder: after docker system prune, is your labeled project gone?"
  zh:
  - "来想一个问题：跑完 docker system prune，你标注好的项目没了吗？"
- en: "No. The database file is still in the mounted folder, and prune never touches folders you mount. But the photos they point at can change under them: same name, new picture. So how do you freeze exactly which photos a model saw? That is part 2."
  zh:
  - "没有。"
  - "数据库文件还在挂载的目录里，prune 从不碰你挂载的目录。"
  - "可它们指向的照片可能被悄悄换掉：同样的名字，新的图片。"
  - "那么，一个模型看过的到底是哪些照片，怎么把它准确地冻结下来？"
  - "这就是第二部分。"
