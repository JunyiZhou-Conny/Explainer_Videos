# Bilibili metadata for the release (tools/release_episode.py → PUBLISH.json → the Mac publish worker)
publish:
  title_zh: "AC215 第11讲跟练 · 数据标注与版本管理：Label Studio、CORS、DVC 与 gcsfuse"
  description_zh: |
    哈佛 AC215（MLOps & LLMOps，2026 秋）第 11 讲教程的逐条命令跟练：上半场照着 dlops-io/data-labeling 的 README，
    用一条 docker run 在本地跑起 Label Studio，看 source / target storage 和 pre-signed URL 怎样让浏览器直接从 GCS 取图、
    为什么要在 bucket 上配置 CORS，理解一条标注其实是一条 JSON 记录，用容器名 DNS 和 API token 从 CLI 容器读回标注
    （包括 Label Studio 1.23 默认关闭 legacy token 导致的 401 和修法），再试一遍 docker-compose 的 Extra。
    下半场照着 dlops-io/data-versioning：从 data-versioning-ac215 starter 建自己的仓库（含 Dockerfile 一行修复），
    用 gcsfuse 和 bind mount 把 bucket 挂成文件夹，看 dvc add 怎样按 md5 指纹存文件、.dvc 指针文件进 git、数据本身进 dvc_store，
    打 dataset_v20 / v21 两个 tag，推送时只多传两个对象，最后在 Colab 里用 dvc get --rev 回到任意版本。
    边看边暂停，在自己的电脑上跑每一条命令；本讲会在 GCS 里存少量数据，视频用金色标签标出计费点，结尾有完整收尾清单。
    英文旁白，中英双语字幕。

    教程仓库：https://github.com/dlops-io/data-labeling
    教程仓库：https://github.com/dlops-io/data-versioning
    学习笔记（全部命令、真实输出和练习答案）：https://github.com/JunyiZhou-Conny/MLOps_Learning/blob/main/guides/L11-data-labeling-versioning.md

    课程与教程内容来自 Harvard AC215 课程组（Pavlos Protopapas 等）；本视频是个人学习用的非官方讲解，引用课件只注明页码，不展示课件。
  tags_zh: [AC215, MLOps, 数据标注, Label Studio, 数据版本管理, DVC, CORS, GCS, 哈佛, 教程跟练]
  tid: 231
