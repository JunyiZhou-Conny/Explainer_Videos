  title_zh: "项目周记 E6 · 后端怎么选：每一块做什么、谁落选了、数据结构保护了谁"
  description_zh: |
    我的创业项目（给中国家长和在美留学生的就医导航原型）每周 PR 的概念讲解，第 6 集。
    原型现在没有后端：数据只存在一台设备的浏览器里，家长在国内看不到孩子在波士顿存的保险卡。一份 223 行的决策记录怎么选后端：为什么页面决定了语言（不是 Python）、为什么数据库选 Postgres、为什么登录只用邮箱验证码、为什么用容器；最小的数据结构怎样保护人（身份写定、只有学生能发起关联、家长只读、不存保险卡图片）；四个角度的审查和一个只差一个词的 bug；以及还没定的事。
    所有数据都是虚构的；不是医疗建议。英文旁白，中英双语字幕。
  tags_zh: [AI, AI agent, 软件工程, 后端, 数据库, 隐私, 创业, 科普]
  tid: 231
