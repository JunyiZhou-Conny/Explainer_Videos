# Chinese subtitle glossary for 项目周记 E6 (subtitles only: the narration is English). Policy as in E2–E5.
policy: "Mandarin first; product, company and API names and the team's working words stay in English; numbers as digits; half-width space between Chinese and Latin/digits."
terms:
- {en: backend, zh_subtitle: "后端"}
- {en: server, zh_subtitle: "服务器"}
- {en: database, zh_subtitle: "数据库"}
- {en: login, zh_subtitle: "登录"}
- {en: container, zh_subtitle: "容器"}
- {en: decision record, zh_subtitle: "决策记录"}
- {en: family link, zh_subtitle: "家庭关联"}
- {en: invite code, zh_subtitle: "邀请码"}
- {en: one-time code, zh_subtitle: "邮箱验证码"}
- {en: hash, zh_subtitle: "哈希"}
- {en: migration, zh_subtitle: "迁移文件"}
- {en: proposal / adopted, zh_subtitle: "提议 / 已采纳"}
- {en: agent, zh_subtitle: "agent"}
allowed_spoken_latin: [agent, Python, JavaScript, TypeScript, PR, Hono, Zod, Postgres, Better, Auth, Docker, Compose, Mac, Windows,
  Express, NestJS, Supabase, MongoDB, SQLite, QQ, Bugbot, bot, issue, bug, AI]
