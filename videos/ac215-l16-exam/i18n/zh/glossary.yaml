# Chinese (zh-CN) glossary and translation rules for ac215-l16-exam (AC215 lecture 16, System Tradeoffs: networking,
# runtime config and capacity, with lecture 10 (Connecting to the Cloud) as the opener; EXAM EDITION for Quiz 4: a 12-15
# minute concept-first explainer, no README walk and no captures; evidence panels from dlops-io/cheese-app-v0 @ cb6fb94
# and dlops-io/cheese-app-v2 @ 14f2a14), code-switching version, SUBTITLES ONLY. Audience: Chinese-speaking AC215 grad
# students the day before Quiz 4 who read technical English fluently; register of a Chinese MLOps TA running a review
# session the day before the quiz. Precedents and source of the shared decisions: the series pilot
# videos/ac215-l01-vms-venvs/i18n/zh (repo, 笔记本, 服务账号, 密钥, 虚拟机), the container lectures ac215-l02-containers-1
# to ac215-l04-flexible-workflow-ports (container, image, port, push, pull, tag, digest, registry, Dockerfile, 发布, 门,
# 挂载, 层, 配置卡片, localhost, 监听, IP 地址, 子网), ac215-l05-rag (embedding, 语言模型, 向量数据库, 检索), ac215-l06-agents-1
# (schema), the latest finished follow-along ac215-l08-llm-finetuning (endpoint, 托管, 列, 交付, and the rule layout A1-I3
# this file follows) and the sibling exam editions ac215-l13-exam (副本) and ac215-l14-exam (考前精讲版, 小测, 题目, 选项,
# 选 B, 灰色标签, 课件第 n 页, 现场运行, 工作负载). Every term L1-L14 already decided keeps its form; what is new here is the
# networking, configuration and capacity vocabulary (A3): addresses, ports and the load balancer, subnets, route tables
# and NAT, the browser outside the VPC, build once and secrets at startup, replicas bounded by database connections, and
# relational plus vector data; plus worker in the closed English list (A1 c).
# There is NO Chinese voice in this series: the Chinese lines are subtitles on the English timing (the bilingual band of
# output/<id>.zh-en.mp4, <id>.zh.srt, <id>.zh-en.srt / .ass). So no say:, no anchors, no readings, no durations: only
# display rules. But `python -m explainer.i18n check` still applies its voice hygiene to the displayed line when a
# sentence has no say: (brackets, maths symbols, letter_letter names, Latin words not listed here, a missing half-width
# space): rules A6, B3 and D3 are how the Chinese line stays clean without say:.
# Human-readable copy in Chinese: GLOSSARY.md (keep the two in sync; both term tables come from the same data).
# terms[].zh_subtitle = the subtitle form (titles and companions use A4's written register); terms[].first_use = one
# example sentence (SNN[k]: scene SNN, SAY block k counted from 0), each one passes the checker; terms[].note = rules.
# Read by: python -m explainer.i18n check (Latin words allowed in a subtitle line: every Latin word of zh_subtitle and
# first_use, plus allowed_spoken_latin) and explainer/subtitles.py (2-3 word English phrases of `en` are kept on one
# English line; 2-7 character Chinese headwords of zh_subtitle are registered in jieba; I3).
video: ac215-l16-exam
lang: zh-CN (mainland Simplified Chinese)
audience: 'Chinese-speaking AC215 (MLOps & LLMOps) grad students the day before Quiz 4: they did L1-L14 (a VM, containers, docker run with a published port, localhost:9000, a service-account key mounted from secrets/, the cheese app''s API and frontend), sat or skimmed Lectures 10 and 16, may never have deployed into a VPC, and want to answer conceptual multiple-choice questions on private vs public addresses and the load balancer, subnets, route tables and NAT, where browser code must send requests, build-once runtime configuration and secrets, autoscaling bounded by database connections, and PostgreSQL + pgvector, and say why each wrong option is wrong. They watch on a laptop with no clone open.'
voice: none          # subtitles only (video.yaml: Chinese = i18n/zh/narration/*.yaml on the English timing)
policy: 'The Mandarin of a Chinese MLOps TA running a review session the day before Quiz 4, code-switching only where such a speaker really does, written as subtitles under an English narration. The viewers already say 起一个 container, 构建 image, 发布一个 port, 调一个 endpoint, push 到 registry; this video adds 起一个 worker and the networking words they say in Chinese (子网, 路由表, 负载均衡器, 安全组, 副本, 连接池), with VPC, NAT, DNS and the AWS gateway names as the screen shows them. Every choice passes three tests: what is said in a real review session; the standard, searchable Chinese name (AWS / Google Cloud 中文文档 and the Chinese networking and database literature: 私有地址, 公网地址, 子网, 公有子网, 私有子网, 路由表, 默认路由, 最长前缀匹配, 安全组, 负载均衡器, 域名, 解析器, 权威 DNS, 自动扩缩, 副本, 连接池, 外键, 事务, 向量检索); and consistency with the series (L1-L14: every form they fixed is kept). (1) Artifacts verbatim: what the viewer matches on screen (addresses, blocks, ports, localhost:9000, api.example.com, /api, /secrets, -p 9000:9000, os.environ, the values debug and info, the printed too many connections, the route targets local, Internet Gateway and NAT Gateway, the Predict button) is copied letter for letter, never translated, inflected or quoted; the exceptions the checker forces are names with an underscore and the characters = + − ÷ ⌊ ⌋, written the way the narration says them (A6, B3). Nothing on screen is translated in this series: code panels, README panels, the redrawn lecture diagrams, packet envelopes, chips, lecture tags, takeaway cards, ponder cards and recap rows stay English; only the narration is. (2) Lab-speech English, a closed list: from L1 repo; from L2-L4 container, image, port, push, pull, tag, digest, registry, Dockerfile; from L5 embedding; from L6 schema; from L8 endpoint; new here worker. (3) Everything else in standard Chinese (A3). (4) The video''s metaphors by meaning, one word each: 告警, 门, 隧道, 大门, 小本子, 坏掉的那一跳, 插槽, 去处, 卡片, 弹开, 隐患. (5) Written register for titles, meta.yaml and companion docs: 容器, 镜像, 仓库, 镜像仓库（registry）, 端口, 端点（endpoint）, 工作进程（worker）, 虚拟私有云（VPC）, 网络地址转换（NAT）, NAT 网关（NAT Gateway）, 互联网网关（Internet Gateway）, 应用负载均衡器（ALB）. (6) The bilingual band puts the English sentence under every Chinese line, so the Chinese line carries no glosses and no brackets at all. (7) No person''s name; the course''s practice questions are never quoted (A9, A10). (8) The toolkit''s constraints are part of the policy: one Chinese sentence per English sentence (73 blocks, 206 sentences), a checker-clean display line (D3), an en_display wherever the SAY spells an artifact out as words (D4), the English clause order kept (D9). Mainland Simplified Chinese; relaxed, clear review-session speech, never slangy.'
rules:
- '[A1] Code-switching scope. English stays in three places only. (a) Artifacts, copied letter for letter: addresses, blocks and ports as on screen (127.0.0.1, 0.0.0.0, 10.0.2.5, 10.0.3.7, 10.0.0.0/16, /16, /24, /0, 0.0.0.0/0, 192.168, 172.16, 172.31, 9000, 3200, 8000, 443), hosts, URLs and paths (localhost, localhost:9000, localhost:3200, api.example.com, /api, /secrets, the secrets 目录), the flag -p 9000:9000 and uvicorn''s host, code names written the way the SAY says them (A6: next public base API URL, next public, Google Application Credentials, log level, proxy pass; os.environ as printed), values (debug, info), the printed error (too many connections), the screen words the narration names (the Predict button, the route targets local, Internet Gateway and NAT Gateway, the layout letter B) and the tag illustration. (b) Products, organisations, the course and acronyms: AC215, Google, Google Cloud, Amazon, Compute Engine, Cloud Load Balancing, Cloud NAT, Cloud SQL for PostgreSQL, AlloyDB, Docker, FastAPI, uvicorn, Nginx, ChromaDB, PostgreSQL, pgvector, Git, README, Cheese App; VPC, NAT, IP, DNS, HTTP, HTTPS, SSH, API, SQL, CPU, HTML, CSS, JavaScript. (c) Words Chinese MLOps engineers really say in English in a review session, a closed list: from L1 repo; from L2-L4 container, image, port, push, pull, tag, digest, registry, Dockerfile; from L5 embedding; from L6 schema; from L8 endpoint; new here worker. A word joins (c) only when lab speech really uses the English and the Chinese is stilted or collides with another term. Never English for flavour: subnet, route table, load balancer, firewall, security group, packet, replica, autoscaler, connection pool, staging, secret manager, foreign key, transaction and everything in A3 are Chinese.'
- '[A2] container and image (as L2-L14). The subtitles say container and image: 同一个 container, 把 image 构建一次, container image, 每个环境各一个 image; measure word 个. build → 构建, rebuild → 重新构建, mount → 挂载, layer → 层, settings (the image config) → 配置. Titles, chapter names and meta.yaml write 容器 and 镜像 (A4).'
- '[A3] The networking, configuration and capacity vocabulary (new in this video). Addresses: IP address → IP 地址, private / public address → 私有地址 / 公网地址, private network → 私有网络, packet → 数据包, interface → 网络接口, listen → 监听, bound to → 绑定到, the tunnel → 隧道, a port is a 门 (L04), router → 路由器, DNS name → 域名, resolver → 解析器, authoritative DNS → 权威 DNS, load balancer → 负载均衡器, firewall → 防火墙, security group → 安全组, the reply → 回复, the task → 任务 (FastAPI 任务), clients → 客户端, visitor → 访客, the service → 服务. Routing: block of addresses → 地址块, bits → 位, subnet → 子网, public / private subnet → 公有子网 / 私有子网, private app / data subnet → 私有应用子网 / 私有数据子网, route table → 路由表, the local route → local 路由, the default row / route → 默认那一行 / 默认路由, matches → 匹配, the most specific match wins → 最具体的那条匹配胜出, rewrites the source → 改写源地址, mapping → 映射, NAT''s notebook → 小本子, dropped → 丢弃, connections that start inside → 从里面发起的连接, uninvited → 不请自来, hop → 一跳, stalls → 卡住. Browser: static host → 静态托管, static files → 静态文件, the front door → 大门, frontend → 前端, relative path → 相对路径, layout B → 布局 B, proxy → 代理, path rule → 路径规则, build time → 构建时, compiled into → 编译进, inbound → 入站. Configuration: release → 发布, deployment → 部署, immutable → 不可变, development / staging / production → 开发环境 / 预发环境 / 生产环境, runtime values → 运行时的值, environment variable → 环境变量, secret and key → 密钥, secret manager → 密钥管理服务, workload → 工作负载, authorized → 获得授权的, run script → 运行脚本, bake into → 打进, rotate → 轮换, promote → 晋级, inject → 注入, teammate → 队友. Capacity: autoscaler → 自动扩缩器, replica → 副本, signal → 信号, processor use → CPU 使用率, policy → 策略, target → 目标值, minimum / maximum → 最小值 / 最大值, downstream → 下游, connection → 连接, connection limit → 连接数上限, connection pool → 连接池, connection pooler → 连接池代理, other clients → 其他客户端, admin console → 管理控制台, batch job → 批处理任务, slots → 插槽, round down → 向下取整, database tier → 数据库规格, at peak → 高峰时. Database: relational → 关系型, foreign key → 外键, transaction → 事务, all or nothing → 全有或全无, vector search → 向量检索, similarity search → 相似度检索, vector store → 向量库, metadata → 元数据, sync → 同步, column → 列, query → 查询, managed → 托管, the provider → 云厂商, patching → 打补丁, backups → 备份, recovery → 恢复, restore tests → 恢复演练, virtual machine → 虚拟机. The video''s metaphors by meaning, one word each: 告警 (alarms), 门 (a port), 隧道 (the -p tunnel), 大门 (the front door), 小本子 (NAT''s notebook), 坏掉的那一跳 (the dead hop), 插槽 (slots), 去处 (homes), 卡片 (chips), 弹开 (bounce off), 隐患 (the quiet problem).'
- '[A4] Written vs spoken. The subtitles say container / image / repo / registry / port / endpoint / worker / VPC / NAT; titles, chapter names, meta.yaml and companion docs write 容器 / 镜像 / 仓库 / 镜像仓库（registry）/ 端口 / 端点（endpoint）/ 工作进程（worker）/ 虚拟私有云（VPC）/ 网络地址转换（NAT）, the gateways as NAT 网关（NAT Gateway）and 互联网网关（Internet Gateway）, the ALB as 应用负载均衡器（ALB）, with the English in brackets at the first use of a core concept (brackets are fine outside the narration). VPC, NAT, DNS, CIDR, PostgreSQL and pgvector stay in writing too. Code names are unaffected.'
- '[A5] Writing artifacts. Copied letter for letter; never translated, inflected, quoted or put in 《》. Add a Chinese head noun where it helps: secrets 目录, Predict 按钮, local 路由, FastAPI 任务, next public 变量, 公网 HTTPS 域名. No sentence opens with an artifact or a lower-case kept-English word (localhost, uvicorn, pgvector, os.environ, next public …, -p, /api, image, container, port, push, repo, registry, endpoint, worker): put a Chinese word first (所谓 localhost……; 这个 -p 9000:9000……; 把 image……; 所有 next public 变量……; 私有子网里的一个 worker……). Capitalized names, acronyms and option letters (Cheese App, NAT, VPC, DNS, SSH, IP, FastAPI, PostgreSQL, ChromaDB, README, Google, Internet Gateway, A, B, C, D) may open a sentence.'
- '[A6] Names with an underscore and code expressions (as L3-L14). With no say:, the checker reads the display line as spoken text and rejects letter_letter, brackets, = and the maths signs. So the Chinese line writes them the way the narration says them: NEXT_PUBLIC_BASE_API_URL → next public base API URL; NEXT_PUBLIC_ variables → next public 变量; GOOGLE_APPLICATION_CREDENTIALS → Google Application Credentials; LOG_LEVEL=debug → log level 是 debug; proxy_pass → proxy pass. APP_ENV, FEATURE_FLAG and myapp:v1.4 are on screen only (the SAY never names them). The English line gets the literal form through en_display (D4).'
- '[A7] Words to keep apart. 私有 (private address, subnet, network, registry) ≠ 公网 (a public address, IP, endpoint, the HTTPS name) ≠ 公有子网 (the public subnet, AWS 中文文档) ≠ 公开 (a public website; public by design → 本来就是公开的). 路由 (a route; to route) ≠ 路由表 ≠ 路由器 (your home router). local 路由 (the route target, as on screen) ≠ 本地 (never used for it) ≠ 在笔记本上 (on the laptop). 门 (a port, L04) ≠ 大门 (the public front door) ≠ Gateway (the gateway names stay English). 小本子 (NAT''s notebook) ≠ notebook (L06/L08''s Colab notebook) ≠ 笔记本 (the laptop). 任务 (the lecture''s FastAPI task behind the load balancer) ≠ 批处理任务 (a batch job) ≠ L08''s 微调任务 and L13''s 训练任务. 服务 (whatever listens on a port; a PostgreSQL service; a vector search service) — there is no Cloud Run service here. 客户端 (other clients; public clients; a database client) ≠ 访客 (a visitor) ≠ 浏览器. 密钥 is both the key and a secret (the video treats them as one); 密钥管理服务 is the secret manager. 连接 (a connection) ≠ 连接池 (a replica''s pool) ≠ 连接池代理 (a pooler). 地址块 (a CIDR block) ≠ 层 (an image layer). 规格 (a database tier) ≠ 版本 (a version tag). 题目 (a quiz question) ≠ 问题 / 隐患 (an alarm''s problem). 课件 (the slides) ≠ 课上 (the lecture) ≠ 课程团队 (the staff).'
- '[A8] Register: a TA running a review session the day before the quiz (as L14). Short, direct sentences; exam words where the English is about the quiz (题目, 选项, 选 C, 小测, 就想：); the viewer is 你 (never 您, 大家, 同学们). Chinese word order inside a clause; clause order follows the English (D9). No translationese: not 让我们…… (say 我们来……, 先……), not 这就是为什么…… (say 所以……), few 被 sentences. No internet slang. Carry the spoken rhythm by meaning: Start on the laptop → 先从笔记本说起; Move the same container into the cloud → 把同一个 container 搬到云上; Now NAT fails → 现在 NAT 坏了; Now the wrong way → 再看错误的做法; Two more facts → 再说两点; Classify it first → 先分类; So read the rule off the picture → 所以，直接从图上读出规则.'
- '[A9] Precision. Translate the quantifiers: only 只, every 每个 / 每次, all 全部, always 永远, never 绝不 / 从不, both 都, alone 光 / 只. Numbers exactly as said (C1). Slide-versus-repo differences are said kindly and briefly, as the SAY does (S02: the lecture''s port 8000, the course repo''s 9000; S06: ChromaDB stands in for a connection pool). Ponder questions: three cards, P1 S03[8], P2 S05[7], P3 S06[6]. The lead-in and the stem never give the answer away: S03[8] must not name NAT or say how replies come back; S05[7] must not say who can read the key; S06[6] must not add up the 180. Pause here if you want. → 想停一下的话，就在这里暂停。 The reveal opens with the letter as the English does (C. → 选 C。; D. → 选 D。; B, 200. → 选 B，200。), and the wrong options as the English names them (A, the Internet Gateway, would … → A，Internet Gateway，也……; B fails: → B 不对：). The course''s practice questions are never quoted, paraphrased or answered, here or anywhere in i18n/zh, and their numbers never appear.'
- '[A10] Names. Products, companies and the course keep Latin script (A1 b); 哈佛 only in titles and descriptions. Course: AC215; lecture n → 第 n 讲 (Lectures 10 and 16 → 第 10 讲和第 16 讲); the lecture → 课上; the slides → 课件; slide n → 课件第 n 页; the lecture''s layout B → 课上的布局 B; the instructor → 授课老师, never named (the SAY never names anyone); the course staff → 课程团队. The lecture draws Amazon names → 课上画的是 Amazon 的名字. Project ids, keys, key-file names and endpoint ids are never written in a Chinese line; the placeholders api.example.com and 10.0.2.5 are the lecture''s own.'
- '[A11] The screen stays English. This series translates only the narration: code panels (comments included), README panels and excerpt chips, the redrawn lecture diagrams and their labels (VPC, subnets, route rows, Internet Gateway, NAT Gateway, ALB, Route 53, ECR, the CIDR ruler, the NAT mapping line, slide 52''s four boxes, slide 76''s triptych), the packet envelopes (src → dst), the lecture tags (Lecture 16 · slides 13–14, Lecture 10 · slide 11), the chips (illustration, the lecture''s picture (AWS names), stateful: reply allowed, longer prefix wins), the takeaway cards, the ponder cards and their reasons, and the recap rows are English, and the scenes need no language changes. Where the narration names something on screen, the subtitle writes it as shown (Predict 按钮; local 路由; Internet Gateway; NAT Gateway; too many connections); what the narration says in its own words is translated (the gray tag → 灰色标签; the front door → 大门; NAT''s notebook → 小本子; the slots → 插槽).'
- '[A12] Mainland Simplified Chinese only: 默认, 程序, 代码, 文件, 网络, 视频, 信息, 账号, 函数, 参数, 配置, 内存, 数据库, 数据包, 路由, 端口, 子网, 网关, 服务器, 连接; never 預設, 程式, 程式碼, 檔案, 網路, 影片, 帳號, 函式, 引數, 組態, 記憶體, 資料庫, 封包, 路由器 as 路由, 連接埠, 子網路, 閘道, 伺服器, 連線 in traditional or Taiwan forms.'
- '[A13] The series list (the ac215-video skill''s list) in this video. container and image throughout (S01, S02, S05, S07); port (S02, S04); repo (S05[5]); registry, push, pull, tag, digest (S05); Dockerfile (S05[7], S05[9]); embedding (S07[3]); schema (S07[5]); endpoint (S04[9], S08[2]). pipeline, volume, venv, PATH, prompt, token, bucket, CI and agent are not in this script. Kept English and new here (A1 c): worker.'
- '[B1] Spacing. One half-width space between Hanzi and Latin letters, digits or an artifact (是 10.0.2.5, port 是 9000, 课件第 13 页, 早上 9 点, 第 10 讲, secrets 目录, 4.5, 100 个连接). The checker reports a missing space on every displayed sentence. Spaces inside an artifact as they are (Cloud Load Balancing, Google Application Credentials, -p 9000:9000); never add one inside an artifact (10.0.0.0/16, localhost:9000). No space next to full-width punctuation. Never U+00A0 / U+202F.'
- '[B2] Punctuation. Chinese uses full-width ，。、；：？！“”……, also next to an artifact. Lists use 、 (HTML、CSS 和 JavaScript; 外键、事务和相似度检索). No brackets of any kind. “” only for a translated quotation; artifacts, screen words and the README''s clause (translated in place, S05[5]) are never quoted. One Chinese sentence (for one English sentence) has no 。？！ inside: use ，；：. The takeaway''s think: and the recap''s ordinals take a full-width colon (就想：……; 第一：……).'
- '[B3] Symbols the checker rejects (= < > + → ← × ÷ ≈ ≤ ≥ −, ⌊ ⌋, brackets, letter_letter, a digit followed by !): never in the Chinese line; say them in words. minus → 减去; divided by → 除以; rounded down → 向下取整; plus (PostgreSQL plus pgvector; plus 30 others) → 加; 10 replicas times 15 → 10 个副本，每个 15 个; 0.0.0.0 slash 0 → 0.0.0.0/0 (the slash is allowed). Allowed and kept as on screen: . in addresses and names (10.0.2.5, os.environ, api.example.com), / in blocks and paths (10.0.0.0/16, /api, /secrets), - in the flag (-p), : in host:port (localhost:9000, -p 9000:9000).'
- '[C1] Numbers. Digits for what the SAY or the screen writes as digits, with no thousands separator: addresses exactly as on screen (10.0.2.5, 10.0.3.7, 127.0.0.1, 0.0.0.0, 192.168, 172.16 到 172.31), blocks (10.0.0.0/16, /16, /24, /0), ports (9000, 3200, 8000, 443), counts (65536, 256, 32 位, 16 位, 100 个连接, 10, 90, 20, 4.5, 4, 15, 30, 10 个副本, 150, 180, 200, 250), lectures and slides (第 10 讲, 课件第 13 页, 课件第 24 页), times (早上 9 点). Small narrative counts the SAY writes as words use Hanzi: 三个告警, 三个子网, 两趟, 两个数据库, 三个去处, 七条规则, 五种最相似的奶酪, 十个 15 的连接池, 一个小时. Ordinals in Hanzi: 第一个告警, 第一道题, 第一：……第七：.'
- '[C2] Units and times. At 9 in the morning → 早上 9 点; Within an hour → 不到一个小时; Last week → 上周; This morning → 今天早上; at startup → 启动时; at build time → 构建时; at import → 导入时; at peak → 高峰时; one day → 总有一天. No prices (the GOLD price tag is a picture). Hashes, digests, project ids and the commits are never read out.'
- '[D1] Sentence alignment (explainer/i18n.py). In narration/*.yaml every SAY line of script.md has one entry (73 blocks); `en` equals the SAY line byte for byte; `zh` has exactly as many items as explainer.voice.split_sentences finds English sentences (206 in this script). Restructure only inside a sentence; never merge or split sentences. Short sentences are items of their own: First alarm. → 第一个告警。; Third alarm. → 第三个告警。; Start on the laptop. → 先从笔记本说起。; Now NAT fails. → 现在 NAT 坏了。; C. → 选 C。; D. → 选 D。; Classify it first. → 先分类。; Divide by 20 per replica: 4.5. → 除以每个副本的 20：得 4.5。 (one item); That fits under 200. → 200 装得下。; Each recap rule that is its own English sentence is its own item. Run `python -m explainer.i18n check videos/ac215-l16-exam --lang zh` until it prints OK.'
- '[D2] No say:, no anchors. There is no Chinese voice: never write say: and never write anchors:. The subtitles are timed by the English audio; the toolkit pairs each Chinese sentence with its English one by position.'
- '[D3] A checker-clean display line. With no say:, every displayed sentence must pass explainer.i18n.spoken_problems: no brackets (B2), no maths symbols (B3), no letter_letter names (A6), no ! after a digit, no clause ending in 种 followed by ，。！？ (五种最相似的奶酪 inside a clause is fine), a half-width space between Hanzi and Latin letters or digits (B1), each sentence ending in 。！？ or ……, and every Latin word listed in this glossary (zh_subtitle, first_use or allowed_spoken_latin). The checker cuts words with [A-Za-z][A-Za-z''.-]* and ignores one-letter words: api.example.com, os.environ and app.example.com stay whole, localhost:9000 is localhost, -p 9000:9000 is p (ignored), 10.x is x (ignored), AC215 is AC. A Latin word it reports is either an English word to translate (usually) or a missing artifact: add the artifact to allowed_spoken_latin and to its term. Plurals are left out on purpose (no replicas, connections except in the printed too many connections, images, tasks): a plural it reports is an English inflection to drop (两个 image, 三个副本).'
- '[D4] The English line (en_display). The bilingual band shows the SAY sentence, and the SAY spells artifacts out as words for the voice. Every such sentence gets an en_display item with the literal on-screen form, the rest word for word as the SAY; the other sentences of the block are null. Spoken form → literal (script.md''s list plus this glossary''s additions): localhost 3200 → localhost:3200; localhost 9000 → localhost:9000; Dash p, 9000 to 9000 → -p 9000:9000; api dot example dot com → api.example.com; 10.0.0.0 slash 16 → 10.0.0.0/16; Slash 16 leaves … / Slash 24 leaves … → /16 leaves … / /24 leaves …; 0.0.0.0 slash 0 → 0.0.0.0/0; slash 16 beats slash 0 → /16 beats /0; a 10 dot address / 10 dot addresses → a 10.x address / 10.x addresses; slash api → /api; next public base API URL → NEXT_PUBLIC_BASE_API_URL; Next public variables → NEXT_PUBLIC_ variables; Google Application Credentials → GOOGLE_APPLICATION_CREDENTIALS; slash secrets → /secrets; os dot environ → os.environ; log level debug → LOG_LEVEL=debug; proxy pass → proxy_pass. Not changed: host 0.0.0.0, port 9000 (the SAY''s words are the screen''s). Underscore names (A6) are restored to their literal form only in en_display; the Chinese line keeps the spaced form. The English video''s own .srt is unaffected.'
- '[D5] Content parity. Each Chinese sentence translates its English sentence only: no added addresses, commands, glosses, Chinese screen names or explanations; kept-English words get no Chinese explanation (the English line is right below); ponder questions get no answers (A9). The head words A5 needs (所谓, 这个, 把, 所有) carry no content.'
- '[D6] Fixed phrases. First alarm. / Second alarm. / Third alarm. → 第一个告警。/ 第二个告警。/ 第三个告警。 That is the first / second alarm. → 这就是第一个 / 第二个告警。 If the question says X, think: Y → 题目里出现 X，就想：Y (S02[9], S03[11], S04[9], S07[6]); If a question asks how to …, think: → 题目问怎么……，就想：(S05[10]); If the question gives …, think: → 题目给了……，就想：(S06[9]). First / Second / Third question. → 第一 / 第二 / 第三道题。 Pause here if you want. → 想停一下的话，就在这里暂停。 Which statement is true? → 哪个说法是对的？ C. → 选 C。 X fails: → X 不对： NAT only carries connections that start inside → NAT 只转发从里面发起的连接 (S03[6], S03[11], S08[1]). Downstream limits still bound the result → 下游的限制仍然约束着结果. Never place secrets in source code, in container images, or in Git → 绝不要把密钥放进源代码、container image 或 Git. Seven rules for the quiz. → 小测的七条规则。 One: … Seven: → 第一：……第七：…… Trace the request first. → 先追踪请求。 Good luck on the quiz. → 小测加油。'
- '[D7] Files. narration/g1.yaml = S01-S04 (the hook, addresses and the front door, subnets, route tables and NAT, the browser outside the VPC; 39 blocks, 113 sentences), narration/g2.yaml = S05-S08 (build once, the connection budget, one database, the recap; 34 blocks, 93 sentences). The video has no parts; the two files only split the work. Each file opens with a comment (coverage; the rules it applies: A6 spaced names, B3 symbols in words, C1 numbers and addresses, D4 en_display, no say: / anchors:) and keeps the script''s order. Double-quoted strings; escape a literal double quote or backslash for YAML.'
- '[D8] Length on the English timing. The Chinese is read while the English plays; the band switches where the English cues switch. Each Chinese sentence should read in about the time the English sentence is heard: at most about 2 units per English word (a Hanzi counts 1, a Latin letter 0.55), so drop redundant connectives and repeated subjects, never content. Long artifacts cost length too (Google Application Credentials 15.4 units, Cloud SQL for PostgreSQL 11.6, next public base API URL 11.0, Cloud Load Balancing 9.9, api.example.com 7.2): don''t repeat them where the English doesn''t; after the first mention use a short reference (这个变量, 这个域名, 这个地址, 这条路由).'
- '[D9] Keep the English clause order (a series lesson, ac215-video skill). The toolkit pairs Chinese and English clause by clause, so a Chinese sentence that puts a condition first when the English puts it last swaps meaning between two neighbouring cues. Conditions, purposes and time adverbials sit where the English has them: A route alone is not enough, slide 13 adds: … → 光有路由还不够，课件第 13 页补充说：……; Ship that to a visitor, and localhost means the visitor''s laptop → 把它发给访客，localhost 就成了访客自己的笔记本; That works when one public front door serves both → 这在一个公网大门同时提供页面和 API 时行得通 (the when clause inside the main clause is also fine); The next replica cannot connect, though its processor is idle → 下一个副本连不上，尽管它的 CPU 闲着; set it as the maximum, because the autoscaler does not know the database limit → 再把它设成最大值，因为自动扩缩器不知道数据库的上限.'
- '[G1] Width. Bilingual band: Chinese line at most 30 units, English line 96 characters; Chinese-only subtitles (.zh.srt) 22 units a line, 2 lines a cue. Write clauses of at most about 24 units separated by ，；： so the splitter has clean cut points; give Google Application Credentials, Cloud SQL for PostgreSQL and next public base API URL a clause of their own.'
- '[G2] Cue endings: the toolkit strips a cue''s final 。，、；： and keeps ？！…… and a closing ” (subtitles.strip_end). Prefer a Chinese word over ''artifact + full stop'' at the end of a sentence where it reads as well (both are valid).'
- '[G3] Never split a name. The splitter treats a space between two Latin words in a Chinese line as a good cut point, so Google Application Credentials, next public base API URL, Cloud Load Balancing or Cloud SQL for PostgreSQL could land on two lines. Put such names at the end of a clause, after a full-width colon or 、, with little Chinese around them, and check every cue with one of them in the rendered .zh.srt.'
- '[H1] Titles (meta.yaml). Video and chapter titles use the written register (A4: 容器, 镜像, 端口, 虚拟私有云（VPC）, NAT 网关); questions keep their question mark; the English colon structure is kept; code names stay as they are (meta.yaml is not read by the checker, so brackets are fine). Core-concept chapters carry their English short name for search where the Chinese is not the usual search word (NAT 网关（NAT Gateway）, 负载均衡器（load balancer）), as L1-L14 do. exam edition → 考前精讲版 (as L14). System Tradeoffs → 系统权衡; with L10 → 含第 10 讲. The metaphors keep their picture: three alarms → 三个告警, a front door → 大门, the connection budget → 连接数预算, Seven rules for the quiz → 小测的七条规则.'
- '[H2] Description (Bilibili / YouTube): two or three sentences, written register, this glossary''s terms: AC215 lecture 16''s exam edition for Quiz 4 with lecture 10 as the opener, concept-first, with the demo repos dlops-io/cheese-app-v0 and dlops-io/cheese-app-v2 as evidence; what it teaches (localhost, private and public addresses, ports, DNS and the load balancer; subnets, route tables and the NAT gateway; why browser code must call the public HTTPS endpoint; one immutable image with runtime configuration and secrets injected at startup; max replicas bounded by database connections; PostgreSQL + pgvector); English narration with Chinese and bilingual subtitles; no live runs. Never a person''s name, never the practice questions.'
- '[H3] Companions: i18n/zh/README.md (and exercises.md if made) are translated with this glossary in the written register (A4). Close with a term table: English | the word used here | other common renderings (VPC: 虚拟私有云 / 专有网络; subnet: 子网; route table: 路由表; NAT gateway: NAT 网关; Internet Gateway: 互联网网关 / Internet 网关; load balancer: 负载均衡器 / 负载均衡; security group: 安全组; private / public IP: 私有 IP / 公网 IP（私网 IP / 公有 IP）; replica: 副本; autoscaler: 自动扩缩器 / 自动伸缩; connection pool: 连接池; staging: 预发环境 / 预生产环境 / 测试环境; promote: 晋级 / 提升; secret manager: 密钥管理服务 / Secret Manager; foreign key: 外键; transaction: 事务; vector search: 向量检索 / 向量搜索).'
- '[H4] Code and commands in the companions stay byte for byte: code blocks, commands, file names and inline `code` are unchanged; only # comments and the surrounding prose are translated.'
- '[I1] (Request, open since L3) `explainer.i18n check` applies its spoken-text hygiene (_SPOKEN_BAD) to the display line when a sentence has no say:. For a subtitles-only video (voice: none here) those checks protect nothing and force A6 and B3 (here: NEXT_PUBLIC_BASE_API_URL, GOOGLE_APPLICATION_CREDENTIALS, LOG_LEVEL=debug, proxy_pass, the − ÷ and floor signs of S06). Proposal: when the glossary''s voice is none, skip _SPOKEN_BAD for display-only sentences (keep the Latin-word, spacing and sentence-end checks).'
- '[I2] (To do, from L1 I3) `_cuts` in explainer/subtitles.py treats a space between Latin words in a Chinese line as a good cut point, so a name can be split (G3). Proposal: in a Chinese line, treat a run of Latin words separated only by spaces as unbreakable unless it alone exceeds a line.'
- '[I3] (Note) explainer/subtitles.py reads every video''s glossary.yaml: the 2-3 word English alternatives of each term''s en field are kept on one English line, and the 2-7 character Chinese headwords of zh_subtitle are registered in jieba, in every video''s subtitles. The en and zh_subtitle fields of this file therefore list real terms only (no sentences).'
terms:
# ---------------------------- The hook: three alarms on launch day
- en: 'launch day / the Cheese App / last week / in the cloud / inside a private network / three alarms go off / within an hour'
  zh_subtitle: 'Cheese App / 上线日 / 云上 / 私有网络 / 告警'
  first_use: 'S01[0]：Cheese App 上线日。'
  note: 'The app name as the SAY capitalizes it (Cheese App may open a sentence; L03 wrote the lower-case cheese app mid-sentence). alarm → 告警 (three alarms go off → 三个告警响了; First alarm. → 第一个告警。). in the cloud → 在云上; a private network → 私有网络 (written: 虚拟私有云（VPC）, A4). Within an hour → 不到一个小时.'
- en: 'language model / an outside language model / chat answers / time out / the saved chat history / the database / loads fine'
  zh_subtitle: '语言模型 / 外部的语言模型 / 超时 / 聊天记录 / 数据库'
  first_use: 'S01[1]：调用外部语言模型的聊天回答都超时了。'
  note: 'L05: language model → 语言模型; the language model API → 语言模型 API. time out → 超时. loads fine → 照常加载.'
- en: 'the page / every visitor / the Predict button / the developer''s laptop / worked'
  zh_subtitle: '页面 / 访客 / Predict 按钮 / 开发者的笔记本'
  first_use: 'S01[2]：页面对每个访客都能加载，但 Predict 按钮失败了。'
  note: 'visitor → 访客 (≠ 客户端, A7). The button''s label Predict stays as on screen (A11). laptop → 笔记本 (L01; never notebook, A7).'
- en: 'traffic doubles / the autoscaler adds replicas / the newest ones / fail with too many connections / their processors sit idle'
  zh_subtitle: '流量 / 自动扩缩器 / 副本 / too many connections / CPU'
  first_use: 'S01[3]：最新的几个副本报 too many connections 失败了，而它们的 CPU 闲着。'
  note: 'replica → 副本 (L13); autoscaler → 自动扩缩器 (Kubernetes 中文文档: 自动扩缩). The printed error too many connections stays (A1 a). processor → CPU: the screen''s gauge reads CPU and a TA says CPU (processor use → CPU 使用率; its processor is idle → 它的 CPU 闲着). At 9 in the morning → 早上 9 点.'
- en: 'one problem nobody has noticed yet / the production key / inside the container image / the quiet problem'
  zh_subtitle: '生产环境的密钥 / 隐患'
  first_use: 'S01[4]：生产环境的密钥就放在 container image 里面。'
  note: 'key → 密钥 (L01). problem here is a hidden risk → 隐患 (one problem nobody has noticed yet → 还有一个没人注意到的隐患; S05[0] the quiet problem → 那个悄无声息的隐患). container image as the SAY says it (A2).'
- en: 'mechanism / Lectures 10 and 16 / addresses / routes and NAT / the browser / configuration / capacity / the database'
  zh_subtitle: '机制 / 第 10 讲 / 第 16 讲 / 地址 / 路由 / 浏览器 / 配置 / 容量'
  first_use: 'S01[5]：每个告警都对应第 10 讲和第 16 讲里的一个机制。'
  note: 'The plan sentence keeps the English list order: 从地址，到路由和 NAT，到浏览器，到配置，到容量，最后到数据库.'
- en: 'the gray tag / top right / names the slides behind each idea / a live run / illustration'
  zh_subtitle: '灰色标签 / 课件 / 现场运行'
  first_use: 'S01[6]：这里没有任何现场运行。'
  note: 'L14: the gray tag → 灰色标签; a live run → 现场运行. The tags (Lecture 16 · slide 71, illustration, the lecture''s picture (AWS names)) stay English on screen (A11).'
- en: 'the quiz / a question / the question says / option / First question / Pause here if you want'
  zh_subtitle: '小测 / 题目 / 选项 / 第一道题'
  first_use: 'S03[8]：想停一下的话，就在这里暂停。'
  note: 'A8 (L14): the quiz → 小测 (Quiz 4 only on screen); a question → 题目; option → 选项. First / Second / Third question. → 第一 / 第二 / 第三道题。 Pause here if you want. → 想停一下的话，就在这里暂停。'
# ---- From localhost to a front door: addresses, ports, the load balancer
- en: 'the course app / uvicorn starts FastAPI / host 0.0.0.0 / port 9000 / listen on every interface / bound to 127.0.0.1 / answer only from inside the container'
  zh_subtitle: '课程的应用 / uvicorn / FastAPI / host / 0.0.0.0 / 127.0.0.1 / 网络接口 / 监听 / 绑定'
  first_use: 'S02[0]：在课程的应用里，uvicorn 在 container 里启动 FastAPI，host 是 0.0.0.0，port 是 9000。'
  note: 'host is the uvicorn option on screen (--host 0.0.0.0), kept as the SAY says it: That host means listen on every interface → 这个 host 的意思是：在所有网络接口上监听. L04: listen → 监听; 0.0.0.0 and 127.0.0.1 as digits. Bound to 127.0.0.1 instead → 要是绑定到 127.0.0.1.'
- en: 'the container is sealed off / publish a port / dash p, 9000 to 9000 / the tunnel / the laptop''s door / the container''s door'
  zh_subtitle: 'container / port / 发布 / -p 9000:9000 / 隧道 / 门'
  first_use: 'S02[1]：这个 -p 9000:9000，就是从笔记本的门通进 container 那扇门的隧道。'
  note: 'L04/L05: port stays, publish → 发布, a port is a 门. The flag is written as on screen in the Chinese line; en_display restores Dash p, 9000 to 9000 → -p 9000:9000 (D4). The sentence cannot open with -p (A5): 这个 -p 9000:9000…….'
- en: 'localhost / localhost 3200 / localhost 9000 / this machine / the one the code runs on / served at'
  zh_subtitle: 'localhost / localhost:3200 / localhost:9000 / 机器'
  first_use: 'S02[2]：所谓 localhost，永远指这台机器：代码运行的那一台。'
  note: 'L04: localhost stays (谁的 localhost). Written as on screen with the colon (localhost:9000); en_display restores localhost 9000 → localhost:9000. Lower-case localhost never opens a sentence (A5): 所谓 localhost……; 这个 localhost…….'
- en: 'IP address / picks the machine / picks the service on it / private / addresses that start with 10 / 192.168 / 172.16 through 172.31 / the internet does not route them'
  zh_subtitle: 'IP 地址 / 私有地址 / 192.168 / 172.16 / 172.31 / 互联网'
  first_use: 'S02[3]：IP 地址选的是机器，port 选的是机器上的服务。'
  note: 'L04: IP 地址. private → 私有 (私有地址, 私有子网); public → 公网 (公网地址, 公网 IP) or 公有 (公有子网), A7. Addresses that start with 10 → 以 10 开头的地址; 172.16 through 172.31 → 172.16 到 172.31. route (verb) → 路由 (互联网不会路由它们).'
- en: 'move the same container into the cloud / 10.0.2.5 / a packet / from the internet / nobody out there has a route to a private address'
  zh_subtitle: '10.0.2.5 / 数据包 / 路由'
  first_use: 'S02[4]：在私有网络里，它的地址是 10.0.2.5。'
  note: 'packet → 数据包 (V1''s envelope; the screen''s src → dst stays English). IP addresses as digits with dots, exactly as on screen (C1).'
- en: 'your router keeps the world out / the public finds you / a DNS name / a firewall starts closed / a load balancer lets traffic in'
  zh_subtitle: '路由器 / 域名 / 防火墙 / 负载均衡器'
  first_use: 'S02[5]：在云上，外界通过域名找到你，防火墙一开始是关着的，负载均衡器把流量放进来。'
  note: 'load balancer → 负载均衡器 in the subtitles (the screen''s ALB and api-alb stay English; written 应用负载均衡器（ALB）). DNS name → 域名; the public (people on the internet) → 外界; router → 路由器 (≠ 路由, A7). firewall → 防火墙.'
- en: 'resolver / the authoritative DNS / api dot example dot com / the load balancer''s public address / port 443'
  zh_subtitle: '解析器 / 权威 DNS / api.example.com / 公网地址 / 443'
  first_use: 'S02[6]：然后浏览器连到负载均衡器的 port 443。'
  note: 'resolver → 解析器; the authoritative DNS → 权威 DNS (DNS 中文资料的标准说法). The lecture''s placeholder domain as on screen: api.example.com; en_display restores api dot example dot com.'
- en: 'ends the HTTPS connection / sends its own request / the task / the task''s port 8000 / security group / allows only the load balancer / a stranger''s packet bounces / the reply / the firewall remembers the connection / stateful'
  zh_subtitle: 'HTTPS 连接 / 请求 / 任务 / FastAPI 任务 / 安全组 / 回复 / 有状态'
  first_use: 'S02[7]：在那里，安全组只允许负载均衡器访问 port 8000。'
  note: 'task (the lecture''s running FastAPI container behind the ALB, AWS 中文文档的“任务”) → 任务 (FastAPI 任务 at first use, S03[1]); ≠ 批处理任务 (S06), ≠ L08''s 微调任务 and L13''s 训练任务 (A7). security group → 安全组; ends the connection → 终止连接; the firewall remembers the connection → 防火墙记得这条连接 (the screen chip stateful: reply allowed stays English).'
- en: 'SSH reaches the machine / clients reach the service / the lecture draws Amazon names / the neighbors / Compute Engine / Cloud Load Balancing / Cloud NAT'
  zh_subtitle: 'SSH / 客户端 / 服务 / Amazon / Compute Engine / Cloud Load Balancing / Cloud NAT'
  first_use: 'S02[8]：SSH 连到机器，而客户端连到服务。'
  note: 'the service (whatever listens on a port) → 服务; there is no Cloud Run service in this video (A7). The lecture draws Amazon names → 课上画的是 Amazon 的名字; the neighbors → 对应的产品. Product names in Latin script, each in its own clause or after 、 (G3).'
- en: 'If the question says X, think: Y / a 10 dot address / private, unreachable from the internet / public clients / the private target'
  zh_subtitle: '公网客户端 / 私有目标'
  first_use: 'S02[9]：题目里出现 localhost，就想：代码运行的那台机器。'
  note: 'The takeaway formula, fixed for all seven cards (D6): If the question says X, think: Y → 题目里出现 X，就想：Y; If a question asks …, think → 题目问……，就想；If the question gives …, think → 题目给了……，就想. a 10 dot address → 10 开头的地址 (en_display: a 10.x address).'
# --------------------------- Private subnets, route tables and NAT
- en: 'VPC / one block of addresses / 10.0.0.0 slash 16 / the slash counts the fixed bits out of 32 / slash 16 leaves 16 bits to vary / 65,536 addresses / slash 24 / 256'
  zh_subtitle: 'VPC / 地址块 / 10.0.0.0/16 / /24 / 位'
  first_use: 'S03[0]：一个 VPC 就是一整块地址，这里是 10.0.0.0/16。'
  note: 'VPC stays (A1 b; written 虚拟私有云（VPC）). CIDR blocks are written as on screen with the slash (10.0.0.0/16, /16, /24); en_display restores the SAY''s slash (D4). bits → 位 (32 位里固定的位数); 65,536 → 65536 (C1).'
- en: 'subnet / three subnets / a public one for the load balancer / a private app subnet for the FastAPI tasks / a private data subnet for the database'
  zh_subtitle: '子网 / 公有子网 / 私有应用子网 / 私有数据子网'
  first_use: 'S03[1]：课上把它切成三个子网。'
  note: 'L04: subnet → 子网. AWS 中文文档: public / private subnet → 公有子网 / 私有子网. The lecture cuts it → 课上把它切成.'
- en: 'route table / the VPC''s own block / the local route / the default row / 0.0.0.0 slash 0 / Internet Gateway / NAT Gateway / the default route'
  zh_subtitle: '路由表 / local 路由 / 默认路由 / 0.0.0.0/0 / Internet Gateway / NAT Gateway'
  first_use: 'S03[2]：每个子网都有一张路由表。'
  note: 'The route rows'' targets stay as on screen (A1 a, A11): local → local 路由 (never 本地路由, A7), Internet Gateway, NAT Gateway (the lecture''s AWS names; written 互联网网关（Internet Gateway）, NAT 网关（NAT Gateway）). the default row → 默认那一行; the default route → 默认路由.'
- en: 'a route alone is not enough / slide 13 adds / a public address / an open firewall / necessary, not sufficient'
  zh_subtitle: '课件第 13 页 / 公网地址'
  first_use: 'S03[3]：光有路由还不够，课件第 13 页补充说：机器还需要公网地址和打开的防火墙。'
  note: 'D9: the English order is kept (the claim, then slide 13 adds, then what it adds). slide n → 课件第 n 页 (L14).'
