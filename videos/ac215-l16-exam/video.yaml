audience: "AC215 student the day before Quiz 4: sat (or skimmed) Lectures 10 and 16, has run the cheese app's containers on a laptop (docker-shell.sh, localhost:9000, the secrets folder), may never have deployed into a VPC; wants to answer conceptual multiple-choice questions on private vs public addresses and the load balancer, subnets, route tables and NAT, where browser code must send requests, build-once runtime configuration and secrets, autoscaling bounded by database connections, and PostgreSQL + pgvector, and say why the wrong options are wrong"
voice: {backend: kokoro, voice: af_heart, speed: 0.9}
# Chinese: subtitles only (i18n/zh/narration/*.yaml on the English timing), no Chinese voice;
# build with --burn for the copy with bilingual subtitles burned in (output/<id>.zh-en.mp4).
