scenes:
  - {file: scenes/s01_launch.py,     cls: LaunchDay,        title: "Launch day: three alarms"}
  - {file: scenes/s02_address.py,    cls: LaptopToCloud,    title: "From localhost to a front door"}
  - {file: scenes/s03_nat.py,        cls: RouteAndNat,      title: "Private subnets, route tables and NAT"}
  - {file: scenes/s04_browser.py,    cls: BrowserOutside,   title: "The browser lives outside the VPC"}
  - {file: scenes/s05_config.py,     cls: BuildOnce,        title: "Build once, configure at startup"}
  - {file: scenes/s06_capacity.py,   cls: ConnectionBudget, title: "Autoscaling meets the connection budget"}
  - {file: scenes/s07_database.py,   cls: OneDatabase,      title: "Relational plus vectors: one database"}
  - {file: scenes/s08_recap.py,      cls: Recap,            title: "Seven rules for the quiz"}
publish:
  title_zh: "AC215 第16讲（含第10讲）· 考前精讲：私有子网与 NAT、浏览器在 VPC 外、启动时注入配置、连接数预算、pgvector"
  description_zh: |
    哈佛 AC215（MLOps & LLMOps，2026 秋）第 16 讲 System Tradeoffs 的考前精讲版，同时覆盖第 10 讲的网络考点，约 17 分钟，为 Quiz 4 准备。
    从「上线当天的三个报警」讲起，用动画讲清：localhost、私有地址与公网入口（DNS → 负载均衡）的区别，VPC、子网、路由表和 NAT（NAT 坏了哪些连接还能通），浏览器在 VPC 之外所以必须调用公网 API 地址，同一个镜像只构建一次、配置和密钥在启动时注入，自动扩容受数据库连接数预算限制（(上限 − 其他客户端) ÷ 每个副本的连接数），以及用 PostgreSQL + pgvector 在一个托管数据库里同时满足事务约束和向量检索。中间有三道新的选择题可以暂停作答，最后是七条速记规则。
    代码面板引用 dlops-io/cheese-app-v0 和 cheese-app-v2 仓库的原文。英文旁白，中英双语字幕。

    教程仓库：https://github.com/dlops-io/cheese-app-v0
    学习笔记：https://github.com/JunyiZhou-Conny/MLOps_Learning/blob/main/guides/L10-cloud-connect-cheese-app-v0.md

    课程与教程内容来自 Harvard AC215 课程组（Pavlos Protopapas 等）；本视频是个人学习用的非官方讲解，引用课件只注明页码，不展示课件。
  tags_zh: [AC215, MLOps, 考前复习, VPC, NAT, 负载均衡, 云网络, PostgreSQL, pgvector, 哈佛]
  tid: 231
