description: |
  这期精读差分隐私的开山之作：Cynthia Dwork、Frank McSherry、Kobbi Nissim 和 Adam Smith 的论文《Calibrating Noise to Sensitivity in Private Data Analysis》（TCC 2006；中文意译：在隐私数据分析中按敏感度校准噪声）。这篇论文提出了今天所说的差分隐私（differential privacy），2017 年获得哥德尔奖。视频从一个只做减法的攻击讲起，一直讲到论文的定义、拉普拉斯机制和它证明的一个局限。

  适合谁看：刚接触差分隐私的研究生和研究者，尤其是做强化学习、机器学习、医学影像的同学。只需要基础的概率知识。旁白是组会讲论文的风格：概念用中文文献的标准术语，query、transcript 这类口头本来就说英文的词保留英文。

  你会学到：
  · 为什么精确的统计数字也会泄露隐私，“去掉姓名”（去标识化）为什么不够
  · 差分隐私的定义：改动任何一个人的记录，任何输出的概率之比最多是 e^ε（论文里叫 ε-不可区分性）
  · 敏感度：一条记录最多能让答案变化多少；直方图的敏感度为什么总是 2，与桶的数量无关
  · 拉普拉斯机制：噪声尺度 = 敏感度 / ε，一个不等式就证完；为什么不用均匀噪声，也不用高斯噪声
  · 隐私预算：自适应地问很多个 query 时，隐私损失怎样累加（定理 1）
  · 交互式 vs 一次性发布：为什么满足差分隐私的公开表答不好大多数奇偶 query，除非数据库大到指数级
  · 后续发展：(ε, δ)-差分隐私、指数机制、组合定理、本地化差分隐私、DP-SGD、2020 年美国人口普查
  片中有 8 处“暂停想一想”，结尾还有 3 道自测题，建议先自己想，再看答案。

  章节：见下方时间轴

