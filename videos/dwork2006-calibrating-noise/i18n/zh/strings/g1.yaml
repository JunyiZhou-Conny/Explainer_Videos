# On-screen strings of S01 (s01_hook.py), S02 (s02_map.py) and S03 (s03_setup.py), plus the strings
# these scenes share with later scenes (the keys are global: one English key, one Chinese string).
# Identity entries mark strings that intentionally stay English (names, citations, kept-English list
# words, notation), so build/i18n/missing.zh.json lists only real gaps.
# Glyph-indexed strings stay byte-identical: "Dwork · McSherry · Nissim · Smith" (s01 reveals the
# names by glyph runs, 27 glyphs), "TCC 2006" (s02 copies venue[:3] into the TCC caption) and
# "Sub-Linear Queries" (s02 colours glyphs 0, 4, 10).
# Not here on purpose: single letters / symbols (H, T, F, M, ?, ✗), see glossary rule E3: the coin
# glyphs stay H/T. E3's outcome label "H（正面）→ “是”" does not fit (measured: it ends at x = 0.36, inside
# the crowd grid, which starts at x = -0.31), and "正面（H）" on the branch sits 0.04 above the coin like a
# caption of it. So the branch labels read 正面 / 反面 (where the English sat, right of the coin) and the
# outcomes read "H →“是”" / "T →“否”" next to the second coin's H/T face, while the voice says
# 正面答“是”，反面答“否”. The S03 title phrase's t2c key "sensitivity" is translated by group g3 (敏感度);
# "noise" (噪声) is here.

