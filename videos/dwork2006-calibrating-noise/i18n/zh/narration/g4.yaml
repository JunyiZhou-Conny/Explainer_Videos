"S11":
- "en": "Now the last part of the paper. Statisticians and data miners traditionally prefer the non-interactive model: sanitize the data once, publish it, and let anyone compute anything. Can that work under this definition?"
  "zh":
  - "来看这篇 paper 的最后一部分。"
  - "统计学家和数据挖掘研究者传统上偏爱非交互式模型：数据只做一次隐私处理，发布出去，谁想算什么都行。"
  - "在这个定义下，行得通吗？"
  "anchors":
    "Statisticians": "统计学家"
    "sanitize the data": "数据只做一次隐私处理"
    "publish it": "发布出去"
    "and let anyone": "谁想算什么都行"
    "Can that work": "在这个定义下"
- "en": "The paper proves a striking limit. Let each row be a string of d bits. Here is a family of simple counting queries: give each row its own mask, a subset of bit positions, and count the rows with an odd number of ones inside their mask. Each query has sensitivity one, so an interactive curator can answer any one of them with noise of about one over epsilon."
  "zh":
  - "原文证明了一个惊人的局限。"
  - "假设每条记录都是一个 d 位的比特串。"
  - "这里有一族简单的 counting query：给每条记录一个自己的 mask（掩码），也就是一组比特位置，统计有多少条记录在自己的 mask 内有奇数个 1。"
  - "每个 query 的敏感度都是 1，所以交互式的管理者回答任意一个，噪声只要 1/ε 左右。"
  "say":
  - null
  - null
  - "这里有一族简单的 counting query：给每条记录一个自己的 mask，也就是一组比特位置，统计有多少条记录在自己的 mask 内有奇数个一。"
  - "每个 query 的敏感度都是一，所以交互式的管理者回答任意一个，噪声只要艾普西隆分之一左右。"
  "en_display":
  - null
  - null
  - null
  - "Each query has sensitivity 1, so an interactive curator can answer any one of them with noise of about 1/ε."
  "anchors":
    "Let each row": "假设每条记录"
    "Here is a family": "这里有一族"
    "give each row": "给每条记录"
    "and count the rows": "统计有多少条记录"
    "Each query has": "每个 query 的敏感度"
    "so an interactive curator": "所以交互式的管理者"
- "en": "But a one-shot release must prepare for all of them at once. Theorem 3 shows that for at least two thirds of these queries, the release looks almost the same for a random database where every row has even parity, true answer zero, as for one where every row is odd, true answer n. The most extreme difference possible, and it cannot be seen, unless the database is exponentially large: roughly, every four extra bits per row doubles the rows you would need."
  "zh":
  - "但一次性发布必须同时为所有 query 做好准备。"
  - "定理 3 表明，对其中至少 2/3 的 query，发布结果看起来几乎一样：无论随机数据库里每条记录都有偶数个 1，真实答案为 0，还是每条记录都有奇数个 1，真实答案为 n。"
  - "这是可能的最大差别，却根本看不出来，除非数据库大到指数级：粗略地说，每条记录每多 4 个比特，需要的记录数就翻一倍。"
  "say":
  - null
  - "定理三表明，对其中至少三分之二的 query，发布结果看起来几乎一样：无论随机数据库里每条记录都有偶数个一，真实答案为零，还是每条记录都有奇数个一，真实答案为 n。"
  - null
  "en_display":
  - null
  - "Theorem 3 shows that for at least 2/3 of these queries, the release looks almost the same for a random database where every row has even parity, true answer 0, as for one where every row is odd, true answer n."
  - "The most extreme difference possible, and it cannot be seen, unless the database is exponentially large: roughly, every 4 extra bits per row doubles the rows you would need."
  "anchors":
    "Theorem 3": "定理 3"
    "the release looks": "发布结果看起来"
    "for a random database": "无论随机数据库里"
    "as for one where": "还是每条记录"
    "The most extreme": "这是可能的最大差别"
    "and it cannot be seen": "却根本看不出来"
    "unless the database": "除非数据库"
    "roughly, every four": "粗略地说"
- "en": "Pause and ponder: couldn't an analyst just ask the interactive curator all of these queries too?"
  "zh":
  - "暂停想一想：分析者就不能把这些 query，也都拿去问交互式的管理者吗？"
  "anchors":
    "couldn't an analyst": "分析者就不能"
- "en": "No: the budget would run out. The curator only has to answer the few questions someone actually asks, chosen later. A published release cannot know which few those will be, so it must be ready for all of them at once. That is where it breaks."
  "zh":
  - "不行：预算会用光。"
  - "管理者只需回答真正有人问的那几个问题，而且问题是后来才选的。"
  - "发布的结果没法预知是哪几个，所以必须同时为所有问题做好准备。"
  - "问题就出在这里。"
  "anchors":
    "the few questions": "真正有人问的"
    "chosen later": "后来才选的"
    "A published release": "发布的结果"
    "so it must be ready": "所以必须同时"
    "That is where": "问题就出在这里"
- "en": "The proof idea uses two facts. Privacy forces the release to treat every possible row almost alike. And a random mask splits all rows into two halves mixed like salt and pepper, so the even half is like a random poll of everything. Then the chain trick: start from completely random rows, and swap them one at a time for even ones. Each swap barely moves the output, and unless n is huge, all n swaps together barely move it. The same goes for odd rows, so both databases look like random rows."
  "zh":
  - "证明思路用到两个事实。"
  - "隐私迫使发布结果对每种可能的记录几乎一视同仁。"
  - "而随机的 mask 把所有记录分成两半，像椒盐一样混在一起，所以偶数那一半就像对全体的随机抽样。"
  - "接着是链式 trick：从完全随机的记录出发，一条一条地换成偶数记录。"
  - "每次替换对输出几乎没影响；除非 n 极大，n 次加起来也几乎没影响。"
  - "换成奇数记录也一样，所以两个数据库看起来都像随机记录。"
  "anchors":
    "Privacy forces": "隐私迫使"
    "And a random mask": "而随机的 mask"
    "mixed like salt": "像椒盐一样"
    "so the even half": "所以偶数那一半"
    "Then the chain trick": "接着是链式 trick"
    "and swap them": "一条一条地换成"
    "Each swap": "每次替换"
    "and unless n is huge": "除非 n 极大"
    "The same goes": "换成奇数记录也一样"
    "so both databases": "所以两个数据库"
- "en": "Warner's coin, randomized response, where each person scrambles their own row so nobody holds the raw data, is even more limited. Proposition 2: even when every row uses the same mask, for most masks it cannot estimate the odd count unless n is exponentially large."
  "zh":
  - "Warner 的硬币，也就是随机响应：每个人自己扰动自己的记录，所以没有人持有原始数据；它的局限还要更大。"
  - "命题 2：即使每条记录都用同一个 mask，对大多数 mask，它也估计不出有多少条记录在 mask 内有奇数个 1，除非 n 大到指数级。"
  "anchors":
    "where each person": "每个人自己扰动"
    "so nobody holds": "所以没有人持有"
    "is even more limited": "它的局限还要更大"
    "even when every row": "即使每条记录"
    "for most masks": "对大多数 mask"
    "unless n is": "除非 n"
  "say":
  - null
  - "命题二：即使每条记录都用同一个 mask，对大多数 mask，它也估计不出有多少条记录在 mask 内有奇数个一，除非 n 大到指数级。"
- "en": "Careful with the quantifiers. For any one query known in advance, a one-shot release can answer it well. What is impossible, unless the database is exponentially large, is one private release that answers most of them. The lesson: for broad, flexible accuracy with strong privacy, keep the curator in the loop."
  "zh":
  - "注意量词。"
  - "对任意单个、事先已知的 query，一次性发布都能把它答好。"
  - "除非数据库大到指数级，单单一次发布不可能既满足差分隐私，又答好其中的大多数。"
  - "结论是：想对各种问题都灵活地答准，又要强隐私，就让可信的管理者留在回路里。"
  "anchors":
    "For any one query": "对任意单个"
    "What is impossible": "除非数据库大到指数级"
    "is one private release": "单单一次发布"
    "The lesson": "结论是"
    "keep the curator": "就让可信的管理者"
"S12":
- "en": "Back to our map, to see what grew from this paper. The same year, in an invited paper titled simply Differential Privacy, Dwork introduced the name the field still uses. Another 2006 paper, with Kenthapadi, McSherry, Mironov and Naor, added a tiny slack, delta. Remember the Gaussian whose ratio escaped the band in the tails? Delta pays for those rare tails, and lets the bell curve back in."
  "zh":
  - "回到地图上，看看这篇 paper 的后续发展。"
  - "同一年，Dwork 发表了一篇特邀论文，标题就叫《Differential Privacy》，给这个领域起了沿用至今的名字。"
  - "另一篇 2006 年的 paper，她与 Kenthapadi、McSherry、Mironov 和 Naor 合作，引入了一个极小的松弛量 δ。"
  - "还记得高斯噪声的比值在尾部冲出带外吗？"
  - "δ 替这些罕见的尾部买单，让钟形曲线又回来了。"
  "say":
  - null
  - "同一年，Dwork 发表了一篇特邀论文，标题就叫 Differential Privacy，给这个领域起了沿用至今的名字。"
  - "另一篇二零零六年的 paper，她与 Kenthapadi、McSherry、Mironov 和 Naor 合作，引入了一个很小的松弛量 delta。"
  - null
