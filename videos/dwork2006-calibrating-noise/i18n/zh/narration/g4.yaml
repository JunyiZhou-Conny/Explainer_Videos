- "en": "Warner's coin, the model Section four showed is most limited, is what we now call local differential privacy, used by Google in Chrome and by Apple on iPhones. Why the weakest model? Nobody has to be trusted with the raw data, and with millions of users, a few simple statistics can afford the noise."
  "zh":
  - "Warner 的硬币，也就是第 4 节里证明局限最大的那个模型，正是今天所说的本地化差分隐私，Google 用在 Chrome 浏览器里，苹果用在 iPhone 上。"
  - "为什么偏偏是最弱的模型？"
  - "原始数据不用托付给任何人；用户上百万时，几个简单的统计量也扛得住噪声。"
  "en_display":
