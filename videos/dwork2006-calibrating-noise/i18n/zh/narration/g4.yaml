- "en": "Scoring every possible answer became McSherry and Talwar's exponential mechanism. The privacy budget grew into a theory of composition, with a surprise from Dwork, Rothblum and Vadhan: allow that tiny delta, and the total loss of k questions grows only like the square root of k."
  "zh":
  - "给每个可能的答案打分，后来成了 McSherry 和 Talwar 的指数机制。"
  - "隐私预算发展成了一套组合定理，Dwork、Rothblum 和 Vadhan 还带来了一个惊喜：只要允许那个极小的 δ，k 个问题的总损失就只按根号 k 增长。"
  "say":
  - null
