# Chinese narration for S10-S13 (group g4), sentence-aligned to script.md SAY lines.
# Terminology and rules: ../GLOSSARY.md / ../glossary.yaml.
"S10":
- "en": "Sensitivity reaches far beyond counts. Three examples from the paper."
  "zh":
  - "敏感度的用处远不止 counting query。"
  - "原文举了三个例子。"
  "anchors":
    "Three examples": "三个例子"
- "en": "First, picture a social network where each possible link is one row of the database. How many links must you cut to split the network in two? That minimum cut moves by at most one when one link changes, so it is one-sensitive. In general, any question of the form, how many rows would you have to change to make something true, has sensitivity one."
  "zh":
  - "第一，想象一个社交网络，每条可能的边都是数据库里的一条记录。"
  - "至少要切断多少条边，才能把网络一分为二？"
  - "这个最小割，只要改动一条边，最多变化 1，所以敏感度为 1。"
  - "一般来说，凡是“要改动多少条记录才能让某件事成立”这类问题，敏感度都是 1。"
  "en_display":
  - null
  - null
  - "That minimum cut moves by at most 1 when one link changes, so it is 1-sensitive."
  - "In general, any question of the form, how many rows would you have to change to make something true, has sensitivity 1."
  "anchors":
    "each possible link": "每条可能的边"
    "How many links": "至少要切断多少条边"
    "That minimum cut": "这个最小割"
    "when one link changes": "只要改动一条边"
    "so it is one-sensitive": "所以敏感度为 1"
    "In general": "一般来说"
    "how many rows": "要改动多少条记录"
    "to make something true": "才能让某件事成立"
    "has sensitivity one": "敏感度都是 1"
- "en": "Second: if an algorithm that rarely looks at any particular row, like one working from a small random sample, approximates f to within sigma most of the time, on every database, then f has sensitivity at most two sigma. That is Lemma 1."
  "zh":
  - "第二：如果一个算法对任何一条记录都很少去看，比如只看一个小随机样本，它在大多数时候能把 f 近似到 σ 以内，对每个数据库都如此，那么 f 的敏感度最多是两倍 σ。"
  - "这就是引理 1。"
  "say":
  - "第二：如果一个算法对任何一条记录都很少去看，比如只看一个小随机样本，它在大多数时候能把 f 近似到 sigma 以内，对每个数据库都如此，那么 f 的敏感度最多是两倍 sigma。"
  - null
  "en_display":
  - "Second: if an algorithm that rarely looks at any particular row, like one working from a small random sample, approximates f to within σ most of the time, on every database, then f has sensitivity at most 2σ."
  - null
  "anchors":
    "like one working": "比如只看一个小随机样本"
    "approximates f": "它在大多数时候"
    "on every database": "对每个数据库都如此"
    "then f has": "那么 f 的敏感度"
    "That is Lemma 1": "这就是引理 1"
- "en": "Third, the answer need not be a number: a ranking, a set, a string of bits, anything with a distance between answers. Pick an output with probability that decays exponentially with its distance from the true answer, at a rate of epsilon over twice the sensitivity. For bit strings, that flips each bit with probability a little below one half: Warner's coin again, applied to the answer."
  "zh":
  - "第三，答案不一定是一个数：一个排名、一个集合、一个比特串，凡是答案之间能定义距离的都行。"
  - "选中某个输出的概率，随它到真实答案的距离呈指数衰减，速率是 ε 除以两倍敏感度。"
  - "对比特串来说，这就是每个比特以略低于 1/2 的概率翻转：又是 Warner 的硬币，这次用在了答案上。"
  "say":
  - null
  - "选中某个输出的概率，随它到真实答案的距离呈指数衰减，速率是艾普西隆除以两倍敏感度。"
  - "对比特串来说，这就是每个比特以略低于二分之一的概率翻转：又是 Warner 的硬币，这次用在了答案上。"
  "en_display":
  - null
  - "Pick an output with probability that decays exponentially with its distance from the true answer, at a rate of ε over twice the sensitivity."
  - "For bit strings, that flips each bit with probability a little below 1/2: Warner's coin again, applied to the answer."
  "anchors":
    "a ranking": "一个排名"
    "a set": "一个集合"
    "a string of bits": "一个比特串"
