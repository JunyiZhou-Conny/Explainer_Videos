- "en": "In 2016, Abadi and colleagues made it practical to train deep networks privately: clip each example's gradient, like our income cap, which bounds its sensitivity; add Gaussian noise; and track the budget over thousands of steps. If you train models on patient data, this is your entry point. A trained network is just another f of x, and attacks that ask whether a patient was in the training set are our subtraction attack, scaled up."
  "zh":
  - "2016 年，Abadi 和合作者让差分隐私下的深度网络训练切实可行：把每个样本的梯度 clip（梯度裁剪）到一定大小以内，就像我们的收入上限，从而限制了敏感度；加上高斯噪声；并在成千上万步里跟踪预算。"
  - "用病人数据训练模型的话，这就是你的切入点。"
  - "训练好的网络不过是又一个 f(x)；问“某个病人在不在训练集里”的攻击，就是我们那个做减法的攻击，只是放大了。"
  "say":
  - "二零一六年，Abadi 和合作者让差分隐私下的深度网络训练切实可行：把每个样本的梯度 clip 到一定大小以内，就像我们的收入上限，从而限制了敏感度；加上高斯噪声；并在成千上万步里跟踪预算。"
  - null
