  - "第三，尺度为敏感度除以 ε 的拉普拉斯噪声，就能让它满足差分隐私，而且误差不随数据库增长。"
  - "第四，一张满足差分隐私的公开表，答不好大多数简单的奇偶 query，除非数据库大到指数级。"
