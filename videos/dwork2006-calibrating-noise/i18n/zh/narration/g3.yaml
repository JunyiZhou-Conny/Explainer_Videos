S09:
- en: "One question is never enough. Real analysts ask many, adaptively, each chosen after seeing earlier answers. Maybe you spot a spike in one bin, and zoom in."
  zh:
  - "一个问题永远不够。"
  - "现实中的分析者会自适应地问很多个，每个都是看了前面的答案才选的。"
  - "比如某个桶冒出尖峰，就放大看看。"
- en: "The paper's Theorem 1 handles this. Write the probability of the whole transcript as a product, step by step. The analyst's choice of the next question is the same in both worlds, so in the ratio it cancels, leaving one Laplace ratio per answer. If you know reinforcement learning, this is the trajectory-ratio trick: whatever is identical in both worlds cancels, and the per-step log ratios add up."
  zh:
  - "原文的定理 1 处理的就是这个。"
  - "看整份 transcript（交互历史）：把它的概率一步一步写成乘积。"
  - "分析者怎么选下一个问题，在两个世界里都一样，所以在比值里会约掉，每个答案只剩一个拉普拉斯比值。"
  - "懂强化学习的话，这就是算轨迹概率比时的那个 trick：凡是两个世界里相同的都约掉，每一步的对数比值相加。"
  say:
  - null
  - "看整份 transcript：把它的概率一步一步写成乘积。"
  - null
  - null
