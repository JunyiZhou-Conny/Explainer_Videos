  - "为什么？"
  - "取对数之后，拉普拉斯密度是个帐篷形，两边的斜率是 1/λ，绝不会更陡。"
  - "把帐篷平移过去，两个帐篷的高度差，永远不超过平移量乘以这个斜率。"
  - "这就是整个设计原则：隐私需要对数密度处处不陡的噪声。"
