    "whatever is identical": "凡是两个世界"
    "the per-step": "每一步的对数比值"
- en: "So privacy losses add up, and epsilon behaves like a budget. Each answer spends part of it; once it is spent, the curator stops. That is the answer to Dinur and Nissim: the budget makes the limit on questions explicit and measurable."
