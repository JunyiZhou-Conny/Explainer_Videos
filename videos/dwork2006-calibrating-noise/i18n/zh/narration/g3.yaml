  - "噪声超过了 n，比人数可能取到的任何值都大，答案成了纯噪声。"
  - "这不是拉普拉斯噪声的问题。"
  - "任意两个数据库之间，都有一条最多 n 步的链，每步只改一条记录，概率之比最多是 e^ε，所以两端之比最多是 e^(nε)。"
  - "如果 nε 极小，所有数据库看起来都一样，什么也学不到。"
  - "这种链式 trick 叫 hybrid argument（混合论证），最后还会再出现。"
