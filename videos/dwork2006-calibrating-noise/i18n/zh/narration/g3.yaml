- en: "Look at the edges. An output of fifty-one and a half is possible if the true count is forty-two, but impossible if it is forty-one: the same infinite ratio that sank the random-row mechanism. Good noise must never rule an output out."
  zh:
  - "看看边缘。"
  - "输出 51.5，真实人数是 42 就可能，是 41 就不可能：又是那个无穷大比值，随机发布一条记录的机制当初就栽在这上面。"
  - "好的噪声，绝不能把任何输出排除在外。"
