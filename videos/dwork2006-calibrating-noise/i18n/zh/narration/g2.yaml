- en: "Notice what this does not promise. If a study reveals that smokers get more heart disease, and Alice smokes, people may now think she is at higher risk. That is not a privacy violation: the same lesson could be learned from everyone else's data, so it would happen even if Alice's row were replaced by someone else's."
  zh:
  - "再来看它不保证什么。"
  - "假如研究发现吸烟者更容易得心脏病，而 Alice 吸烟，别人现在就可能觉得她风险更高。"
  - "这不算侵犯隐私：同样的结论从其他人的数据里也能得出，所以就算把 Alice 的记录换成别人的，也照样会发生。"
