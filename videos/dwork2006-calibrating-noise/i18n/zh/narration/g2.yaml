  - "关键是想象两个世界。"
  - "一边是数据库 x。"
  - "另一边是 x′：只有一条记录不同。"
  - "比如 Alice 那条。"
  - "这样的一对叫相邻数据库（也叫相邻数据集）。"
  - "医院例子里多了 Alice；这里是她的记录变了。"
  - "总之，谁的记录都不该影响太大。"
