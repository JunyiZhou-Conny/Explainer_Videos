S06:
- en: "So how much noise do we need? It depends on a single property of the query: its sensitivity, the most that changing one row can ever change the answer, over all pairs of neighboring databases, including ones that do not exist yet."
  zh:
  - "那噪声到底要加多少？"
  - "这只取决于 query 的一个性质：它的敏感度，也就是改变一条记录最多能让答案变化多少，取遍每一对相邻数据库，包括还不存在的那些。"
  anchors:
    "its sensitivity": "它的敏感度"
    "the most that": "也就是改变"
    "over all pairs": "取遍每一对"
- en: "For a counting query, like our hospital count, one row changes the answer by at most one. Sensitivity one."
  zh:
  - "对 counting query（计数查询），比如医院那个，一条记录最多让答案变 1。"
  - "敏感度是 1。"
  say:
  - "对 counting query，比如医院那个，一条记录最多让答案变一。"
  - null
  anchors:
    # placed by display position: the subtitle-only gloss pushes 一条记录 late, so the target is the
    # clause before it (比如 is shown at ~0.53 of the line; 一条记录 is spoken at ~0.49 of the clip)
    "one row changes": "比如医院那个"
  en_display:
  - "For a counting query, like our hospital count, one row changes the answer by at most 1."
  - "Sensitivity 1."
- en: "Now a histogram: split the possible values of a row into d bins, and release how many rows fall in each. Before I show you, pause: if Alice's row changes, how much can the whole histogram change in total? Does it depend on the number of bins?"
  zh:
  - "再看直方图：把一条记录的可能取值分成 d 个桶，发布每个桶的记录数。"
  - "先别急着看答案，暂停一下：如果 Alice 的记录变了，整个直方图总共能变多少？"
  - "这和桶的数量有关吗？"
  anchors:
    "split the possible values": "把一条记录"
    "and release how many": "发布每个桶"
    "if Alice's row changes": "如果 Alice 的记录变了"
    "how much can the whole": "整个直方图"
- en: "She moves out of one bin and into another: one count goes down by one, another goes up by one. Total change: two. Adding up absolute changes across coordinates like this is the L1 norm, the paper's way to measure sensitivity for lists of numbers. And it is two whether there are five bins or five thousand. It does not depend on the dimension at all."
  zh:
  - "她从一个桶搬到另一个桶：一个桶少了 1，另一个桶多了 1。"
  - "总变化量：2。"
  - "像这样把各个分量变化的绝对值加起来，就是 L1 范数，原文就用它来衡量一列数的敏感度。"
  - "而且它总是 2，不管是 5 个桶还是 5000 个桶。"
  - "它和维度完全无关。"
  anchors:
    "one count goes down": "一个桶少了"
    "another goes up": "另一个桶多了"
    "is the L1 norm": "L1 范数"
    "the paper's way": "原文就用它"
  en_display:
  - "She moves out of one bin and into another: one count goes down by 1, another goes up by 1."
  - "Total change: 2."
  - null
  - "And it is 2 whether there are 5 bins or 5000."
  - null
- en: "Contrast that with: what is the largest income in the database? One billionaire can move that answer by a billion, and with no cap there is no limit at all. The standard fix is to cap every value, say at a million, first. Remember that trick: it is exactly what private deep learning does to gradients."
  zh:
  - "对比一下：数据库里最高的收入是多少？"
  - "一个亿万富翁，就能让答案变动 10 亿，不封顶就根本没有上限。"
  - "标准做法是先给每个值封顶，比如 100 万。"
  - "这个 trick 要记住：差分隐私深度学习对梯度做的就是这个。"
  anchors:
    "and with no cap": "不封顶"
- en: "Two things to remember. Sensitivity is a property of the function alone, not of the particular database, and it is not chosen by policy. Epsilon is a choice. Sensitivity is a fact."
  zh:
  - "有两点要记住。"
  - "敏感度只取决于函数本身，与具体的数据库无关，也不是人为选定的。"
  - "ε 是选择。"
  - "敏感度是事实。"
