    "and Alice smokes": "而 Alice 吸烟"
    "people may now": "别人现在"
    "the same lesson": "同样的结论"
    "so it would happen": "所以就算"
S05:
- en: "Why demand a ratio bound for every single output? Cryptography often settles for something weaker: statistical distance, half the area between the two curves. Equivalently, the most the probability of any event can differ between the worlds. The paper shows why that is not enough here."
  zh:
  - "为什么每个输出的比值都要有上界？"
  - "密码学常常满足于更弱的东西：统计距离（即 TV 距离），也就是两条曲线间面积的一半。"
  - "等价地说，就是任意事件的概率在两个世界间的最大差距。"
  - "原文说明了它在这里为什么不够。"
  say:
  - null
  - "密码学常常满足于更弱的东西：统计距离，也就是两条曲线间面积的一半。"
  - null
  - null
  anchors:
    "statistical distance": "统计距离"
    "half the area": "也就是两条曲线间"
- en: "Consider this mechanism: pick one row at random and publish it, word for word. Change one person's row, and the output distribution moves by only one over n. For a big database that is tiny, so by the averaged measure this looks private."
  zh:
  - "看这个机制：随机挑一条记录，原样发布。"
  - "改动一个人的记录，输出分布只会变化 1/n。"
  - "数据库很大时这点变化微不足道，所以按平均来衡量，它看起来不泄露隐私。"
  say:
  - null
  - "改动一个人的记录，输出分布只会变化 n 分之一。"
  - null
  anchors:
    "pick one row": "随机挑一条记录"
    "moves by only": "只会变化"
    "by the averaged measure": "按平均来衡量"
  en_display:
  - null
  - "Change one person's row, and the output distribution moves by only 1/n."
  - null
- en: "But every output is somebody's complete record. The ratio test catches it: the output showing Alice's real value has probability one over n in one world, and zero in the other. The ratio is infinite."
  zh:
  - "可每个输出都是某个人的完整记录。"
  - "比值这一关能拦住它：显示 Alice 真实取值的输出，一个世界里概率是 1/n，另一个是 0。"
  - "比值是无穷大。"
  say:
  - null
  - "比值这一关能拦住它：显示 Alice 真实取值的输出，一个世界里概率是 n 分之一，另一个是零。"
  - null
  anchors:
