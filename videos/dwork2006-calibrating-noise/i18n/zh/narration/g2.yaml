    "for now, a single": "目前就是"
    "a whole distribution": "一整个输出分布"
- en: "Pick any output t, and compare the heights of the two curves there. Slide t along and watch their ratio. A private mechanism keeps that ratio close to one everywhere: never above e to the epsilon, never below e to the minus epsilon."
  zh:
  - "任取一个输出 t，比较两条曲线在这里的高度。"
  - "滑动 t，看它们的比值。"
  - "满足差分隐私的机制，让比值处处接近 1：不超过 e^ε，也不低于 e^(−ε)。"
  say:
  - null
  - null
  - "满足差分隐私的机制，让比值处处接近一：不超过 E 的艾普西隆次方，也不低于 E 的负艾普西隆次方。"
  anchors:
    "compare the heights": "比较两条曲线"
    "A private mechanism": "满足差分隐私的机制"
    "never above": "不超过"
    "never below": "也不低于"
  en_display:
  - null
  - null
  - "A private mechanism keeps that ratio close to 1 everywhere: never above e^ε, never below e^(−ε)."
- en: "That is the paper's definition, which it calls epsilon-indistinguishability. The log of the ratio is the privacy loss at t. For every pair of neighbors, every analyst and every output, it must be at most epsilon in absolute value. The absolute value makes it symmetric: a ratio of two and a ratio of one half count the same. For small epsilon, e to the epsilon is about one plus epsilon."
  zh:
  - "这就是原文的定义，叫作 ε-不可区分性（即 ε-差分隐私）。"
  - "比值的对数，就是 t 处的隐私损失。"
  - "对任意一对相邻数据库、任意分析者、任意输出，它的绝对值都不能超过 ε。"
  - "取绝对值就对称了：比值是 2 还是 1/2，都算一样。"
  - "ε 很小的时候，e^ε 约等于 1 + ε。"
