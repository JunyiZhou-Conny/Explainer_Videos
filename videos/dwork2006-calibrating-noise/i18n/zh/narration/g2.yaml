- en: "Let's test it on Warner's coin from our map. Pause and ponder: if Alice's true answer is yes, how likely is she to say yes? And if it is no?"
  zh:
  - "拿地图上 Warner 的硬币试试。"
  - "暂停想一想：如果 Alice 的真实答案为“是”，她有多大概率说“是”？"
  - "换成“否”呢？"
  anchors:
    "how likely is she": "有多大概率"
- en: "If the truth is yes, she says yes three quarters of the time: heads, or tails then heads. If it is no, only the second coin can say yes: one quarter. The worst ratio is three, so the coin satisfies the definition with epsilon equal to the log of three, about one point one."
  zh:
  - "真实答案为“是”，她说“是”的概率是 3/4：正面，或者先反后正。"
  - "换成“否”，只有第二枚硬币能让她说“是”：1/4。"
  - "最坏的比值是 3，所以硬币满足定义，ε 就等于 3 的对数，大约 1.1。"
  say:
  - "真实答案为“是”，她说“是”的概率是四分之三：正面，或者先反后正。"
  - "换成“否”，只有第二枚硬币能让她说“是”：四分之一。"
  - "最坏的比值是三，所以硬币满足定义，艾普西隆就等于三的对数，大约一点一。"
  anchors:
    "or tails then heads": "或者先反后正"
    "If it is no": "换成“否”"
    "with epsilon equal": "ε 就等于"
  en_display:
