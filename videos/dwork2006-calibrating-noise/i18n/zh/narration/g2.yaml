- en: "Run the mechanism, the curator's randomized answering rule, in each world. Whatever the analyst gets to see, the paper calls the transcript; for now, a single noisy answer. Because the mechanism is random, each world gives a whole distribution of possible outputs."
  zh:
  - "运行这个机制，也就是数据管理者随机作答的规则，两个世界各一次。"
  - "分析者能看到的一切，原文叫 transcript（交互历史）；目前就是一个带噪声的答案。"
  - "因为机制是随机的，每个世界都给出一整个输出分布。"
  say:
  - null
  - "分析者能看到的一切，原文叫 transcript；目前就是一个带噪声的答案。"
