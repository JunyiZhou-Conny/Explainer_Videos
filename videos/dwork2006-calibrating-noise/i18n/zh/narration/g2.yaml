  - "The ratio test catches it: the output showing Alice's real value has probability 1/n in one world, and 0 in the other."
  - null
- en: "Averages let catastrophes slip through, as long as each is rare for any single person. A ratio bound rules them out everywhere. It also settles our rounding question: at the jump, one world gives that answer with probability one, the other with probability zero. To pass this test, a mechanism has to be random."
  zh:
  - "平均值会放过灾难，只要每场灾难对每个人都很罕见。"
  - "而比值上界会处处把它们排除在外。"
  - "它也解答了四舍五入那道题：在跳变处，一个世界给出这个答案的概率是 1，另一个是 0。"
  - "想过这一关，机制就必须是随机的。"
