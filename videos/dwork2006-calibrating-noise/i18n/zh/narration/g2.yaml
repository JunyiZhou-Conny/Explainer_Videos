  - "If it is no, only the second coin can say yes: 1/4."
  - "The worst ratio is 3, so the coin satisfies the definition with ε = ln 3, about 1.1."
- en: "Now be the attacker, trying to tell the two worlds apart. By Bayes' rule, your new odds are your old odds times exactly this ratio, so they move by at most a factor of e to the epsilon, whatever you knew before. Starting from fifty-fifty, epsilon one tenth leaves you at most fifty-two and a half percent sure; epsilon one, at most seventy-three. Epsilon is set by policy; the paper calls it the leakage."
  zh:
  - "现在你是攻击者，想区分这两个世界。"
  - "按贝叶斯公式，后验概率比恰好是先验概率比乘这个比值，所以变化倍数最多是 e^ε，无论你之前知道什么。"
  - "从五五开出发，ε 取 0.1，最多有 52.5% 的把握；取 1，最多 73%。"
  - "ε 是人为选定的；原文管它叫 leakage（泄露量）。"
  say:
