    # notebooks have no commit: the copies used are in assets/source/colab/ (downloaded 2026-10-17),
    # their saved outputs in assets/terminal/expected/colab-*.txt (tagged "recorded").
    - {name: "Cheese Quiz", url: "https://colab.research.google.com/drive/14UKW-Z7kFPuCwVqyUFcLxeA1KF70fwfm?usp=sharing",
       sections: ["Prerequisites", "LLM to Agent", "Managing LLM Inputs", "Tools, MCP", "Cheese Quiz Guild"]}
    - {name: "Travel Planner", url: "https://colab.research.google.com/drive/1I_jJEHJsVkGxNoSC1c4wEoVF2QL6vCVY?usp=sharing",
