id: ac215-l06-agents-1
title: "AC215 · Lecture 6 — LLM: Agents I (follow-along: llm-rag, llm-agent-google-adk)"
papers: []                     # not a paper: a course tutorial walkthrough
course:
  name: "AC215 · MLOps & LLMOps (Harvard, Fall 2026)"
  lecture: 6
  lecture_title: "LLM: Agents I"
  ed: https://edstem.org/us/courses/97373/lessons/166030/
  repos:
    # L06's README section; S05 repeats the three L05 steps it stands on (Prerequisites,
    # Run LLM RAG Container, Load Embeddings into Vector Database) for a viewer starting fresh.
    - {repo: dlops-io/llm-rag, branch: main, commit: e17a39f35bc07b440f573def480adaf4703f8b91,
       sections: ["Agents", "Prerequisites", "Run LLM RAG Container", "Load Embeddings into Vector Database"]}
    # quoted for comparison only, not followed:
    #   68e0bde = the staff's committed char-split embeddings (stand in for --embed, loaded for real in S05);
    #   96d5fd7 = the Tolminc book before 85bba32 rewrote it (out.txt quotes this old text, S07).
    - {repo: dlops-io/llm-rag, branch: main, commit: 68e0bdecba017b506c7646d710b1fbf1bc6b31fc,
       sections: ["llmrag/outputs/embeddings-char-split-*.jsonl"]}
    - {repo: dlops-io/llm-rag, branch: main, commit: 96d5fd78d24607e20ae84d5339ed62abaadff17d,
       sections: ["input-datasets/books/Tolminc Cheese.txt"]}
    # the whole root README; module READMEs and code quoted for orientation:
    #   1-baseline (S11), 3-mcp-tools (S12), 4-production-ready/app/runner.py (S08), 5-custom-agent (S13).
    - {repo: dlops-io/llm-agent-google-adk, branch: main, commit: f89faa79de744f6a046e30dff24b3b6f1d73720b,
       sections: ["Getting Started", "Running Agents"]}
