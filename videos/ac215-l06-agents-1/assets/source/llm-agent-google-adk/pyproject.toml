# Root dependencies for running `adk web` from any tutorial folder
# Note: google-adk[all] extra doesn't exist, use base package instead

[project]
name = "google-adk-tutorial"
version = "0.1.0"
description = "Comprehensive Google ADK tutorial series"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=1.8.0",
    "google-genai>=0.2.0",
    "python-dotenv>=1.0.0",
    "litellm>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "mcp>=1.0.0",
    "google-cloud-aiplatform>=1.71.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=2.0.0",
]

[tool.uv]
package = false  # This is not an installable package, just a virtual environment
