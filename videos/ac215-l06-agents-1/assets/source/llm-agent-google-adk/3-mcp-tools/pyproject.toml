[project]
name = "adk-tutorial-mcp"
version = "0.1.0"
description = "Tutorial 3: MCP tool integration with Google ADK"
requires-python = ">=3.10"
dependencies = [
    "google-adk[all]>=1.8.0",
    "python-dotenv>=1.0.0",
    "mcp>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/adk_tutorial_baseline"]


[tool.uv]
dev-dependencies = []
