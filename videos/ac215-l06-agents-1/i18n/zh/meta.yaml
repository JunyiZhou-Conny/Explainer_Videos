# Chinese (zh-CN) metadata for ac215-l06-agents-1 (read by explainer/i18n.py meta(), used by explainer/build.py for
# the subtitles' chapters and the zh descriptions): video title, part titles, chapter titles keyed by scene file
# stem (as video.yaml's scenes), and the Bilibili / YouTube description.
# Titles follow GLOSSARY.md rule H1: written register (容器, 仓库, 克隆, 智能体, 会话, 提示词; A4), questions keep
# their question mark, the English colon structure is kept (第 1 次调用：……, ADK：……, harness：……), commands, folder
# and file names stay as they are (adk web in lower case, as L1's "apt、git 和仓库"; meta.yaml is not read by
# `explainer.i18n check`, so brackets and underscores are fine here), and the core-concept chapters carry their
# English short name for search (智能体（agent）, 会话（session）), as L1, L3 and L5 do. harness stays English in
# writing too (no settled Chinese term; it is L07's topic).
