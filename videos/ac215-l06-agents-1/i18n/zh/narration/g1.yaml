# zh narration for S01-S08 (part 1, group g1: what an agent is, and function calling by hand), sentence-aligned
# to script.md v2: one zh sentence per English sentence (explainer.voice.split_sentences; 78 SAY lines, 172
# sentences). Terms and rules: ../GLOSSARY.md, ../glossary.yaml (binding).
# Subtitles only: there is no Chinese voice in this series, so no say: and no anchors (rule D2); the zh line is
# shown on the English timing, so each sentence keeps the English order of ideas and about its length (D8, D9).
# Underscore names are written the way the SAY speaks them, with a Chinese noun where it helps (rule A6: get book
# by author, 搜索文本, tool config, mode 设为 any / mode 为 ANY, GCP project 变量, chunk type 用 char-split); no
# brackets and no symbols the checker refuses (B2, B3). Numbers as on screen, without thousands separators (C1:
# 1505, 8248, 3509, 1269); model IDs as in the code (C2: gpt-4o). Commands sit at the end of a clause, after a
# full-width colon (G3). Sentences never open with an artifact or a lower-case kept-English word (A5). The ponder
# lines (S03[5], S04[7], S08[1]) give nothing away (A9).
# en_display: the English subtitle line where the SAY spells an artifact as words (rule D4: get_book_by_author,
# llm-rag, MLOps_Learning, gpt-4o, LLM, GCP_PROJECT, python cli.py --agent / --load --chunk_type char-split,
# docker-volumes/, --get, tool_config, mode="any", "mode": "ANY", DefaultCredentialsError, response.text);
# null = the SAY text.
# Proofread (subtitles step 3), in two sessions. The first, cut off by a usage limit, re-punctuated or reworded
# S01[4]-[7], S02[0], S02[5], S03[1], S03[2], S04[6], S05[7], S05[8], S06[2]-[4], S06[8], S07[7]-[9], S08[2], S08[5]
# and S08[8]. The second (2026-10-20) checked every sentence against script.md and the glossary, kept those edits,
# and ran all 172 sentences through explainer.subtitles.tracks(timing="en") on an estimated English timing (2.9
# words/s, no renders yet) at the band width (30) and the .zh.srt width (22): each band piece sits over its own
# English clause, and no command, model ID or kept-English name is split across lines or cues. It changed S03[1]
# (每一步改的是输入), S03[3] (并不是模型记住的), S05[1] (把两件事都做了, D6) and S05[7] (a comma, so the band cuts
# after embed 这一步). Repeat that check on the rendered timing before publishing.
S01:
- en: "Here's a question for a cheese expert: describe where cheese making is important in the instructor's book. In the staff's recorded run, these two lines print before the answer: a function called get book by author, and its arguments."
  zh:
  - "这是一个问奶酪专家的问题：描述一下，在授课老师的书里，奶酪制作在哪些地方很重要。"
  - "在课程团队录下的那次运行里，回答之前先打印了这两行：一个叫 get book by author 的函数，以及它的参数。"
  en_display:
  - null
  - "In the staff's recorded run, these two lines print before the answer: a function called get_book_by_author, and its arguments."
- en: "Ten passages came back, all from one book, filtered by author. But Gemini runs in Google's data center, where localhost means nothing. So who searched your database, and who chose the book?"
  zh:
  - "返回了 10 个段落，全都来自同一本书，按作者过滤。"
  - "但 Gemini 跑在 Google 的数据中心，在那里 localhost 毫无意义。"
  - "所以，是谁搜索了你的数据库，又是谁选了这本书？"
- en: "The lecture asks a bigger version: plan five days in Paris, and replan if it rains or a flight is late. A model can draft a plan, and RAG can fetch facts, but neither can act."
  zh:
  - "课上问的是一个更大的版本：规划在巴黎的五天，并且在下雨或航班延误时重新规划。"
  - "模型能起草一份计划，RAG 能取回事实，但两者都没法行动。"
- en: "What's missing: live systems, tools that act, and the autonomy to decide."
  zh:
  - "缺的是：实时系统、能行动的工具，以及自主决定的能力。"
- en: "Today we climb toward that in three steps. By hand, with L-L-M rag's agent; with a framework, Google's Agent Development Kit; and with a harness, in Colab notebooks."
  zh:
  - "今天我们分三步，一步步向它靠近。"
  - "先手写，用 llm-rag 的 agent；再用框架，Google 的 Agent Development Kit；最后用 harness，在 Colab notebook 里。"
  en_display:
  - null
  - "By hand, with llm-rag's agent; with a framework, Google's Agent Development Kit; and with a harness, in Colab notebooks."
- en: "The tracker, top left, shows the step; the gray tag, top right, names the lecture slides. Pause at each yellow your-turn tag, and run the command."
  zh:
  - "左上角的进度条显示当前步骤；右上角的灰色标签标出对应的课件。"
  - "看到黄色的 your turn 标签就暂停，自己跑一遍命令。"
- en: "You'll need the database and key from lecture 5, Docker, uv, Node, and two more keys: one from Google AI Studio, one from OpenAI, with billing on."
  zh:
  - "你需要第 5 讲的数据库和密钥，Docker、uv、Node，再加两个密钥：一个来自 Google AI Studio，一个来自 OpenAI，并且开通计费。"
- en: "We recorded on October 18, 2026, without keys. Docker, Chroma, uv, the ADK web server and two MCP servers ran for real; every model call stopped unsent, or was refused. Model answers are the staff's saved outputs."
  zh:
  - "我们在 2026 年 10 月 18 日录制，没有任何密钥。"
  - "Docker、Chroma、uv，ADK 的 web 服务器和两个 MCP server，都是真实运行的；每次模型调用都没发出去就停了，或者被拒绝了。"
  - "模型的回答都是课程团队保存的输出。"
- en: "On screen we hide the instructor's name; your terminal shows it. Every command is in the study guide, in the MLOps Learning repo."
  zh:
  - "画面上我们隐去了授课老师的名字；你的终端里会显示。"
  - "每条命令都在学习指南里，就在 MLOps Learning 这个 repo 里。"
  en_display:
  - null
  - "Every command is in the study guide, in the MLOps_Learning repo."
S02:
- en: "First the ideas, in the Cheese Quiz. Save a copy in Drive, then add your OpenAI key in the Secrets panel, under the name shown, with notebook access on."
  zh:
  - "先讲概念，在 Cheese Quiz 里。"
  - "点 Save a copy in Drive，再在 Secrets 面板里用画面上的名字添加你的 OpenAI 密钥，并打开 Notebook access。"
- en: "The install cell installs two packages, unpinned, and hides all output: if imports fail later, rerun it without that redirect. Then download the quiz files, and pause to run the setup."
  zh:
  - "安装单元格装两个包，没有 pin 版本，还隐藏了全部输出：如果后面 import 失败，就去掉那个重定向再跑一次。"
  - "然后下载测验文件，暂停一下，把准备工作跑一遍。"
- en: "Now the notebook asks one question three ways, with the same model each time: what's the best cheese for a grilled cheese sandwich? Lane 1, the base LLM: one call to GPT-4o, one answer, in under 3 seconds."
  zh:
  - "现在 notebook 用三种方式问同一个问题，每次都用同一个模型：做烤奶酪三明治，最好用哪种奶酪？"
  - "第 1 条通道，基础 LLM：调用 gpt-4o 一次，一个回答，不到 3 秒。"
  en_display:
  - null
  - "Lane 1, the base LLM: one call to gpt-4o, one answer, in under 3 seconds."
- en: "Lane 2, the reasoning LLM: Python methods run in a fixed order. Analyze, split into 4 sub-questions, answer and verify each, then combine. That's 11 calls and 39 seconds, and its token total is only an estimate."
  zh:
  - "第 2 条通道，推理 LLM：几个 Python 方法按固定的顺序运行。"
  - "分析，拆成 4 个子问题，逐个回答并验证，最后合并。"
  - "一共 11 次调用、39 秒，而它的 token 总数只是估算。"
- en: "The lecture calls a multi-call system like this a reasoning engine. Here your Python orders the calls, so it's a reasoning workflow, not a reasoning model."
  zh:
  - "课上把这种多次调用的系统叫作推理引擎。"
  - "这里由你的 Python 安排调用顺序，所以它是推理工作流，不是推理模型。"
- en: "Lane 3, the agent: the same model, plus instructions and a web search tool that OpenAI hosts. Its answer reports two searches, and it stopped on its own after 13 seconds. It also reports one tool used, but that counts tools configured, not calls."
  zh:
  - "第 3 条通道，agent：同一个模型，加上指令和一个 OpenAI 托管的网页搜索工具。"
  - "它的回答显示做了两次搜索，13 秒后它自己停了下来。"
  - "它还显示用了一个工具，但这个数统计的是配置的工具，不是调用次数。"
- en: "The lecture defines an agent as an LLM, given instructions and tools, that runs on its own until the task is done. Of its five blocks, one decides the next step: dynamic control, the steering wheel."
  zh:
  - "课上对 agent 的定义是：一个 LLM，给它指令和工具，它自己运行，直到任务完成。"
  - "它的五个组件里，有一个决定下一步：动态控制，也就是方向盘。"
- en: "So an agent isn't a smarter model: the model was the same in all three lanes. What changed is who steers, and the tools. Every call is paid; pause, and run the three lanes."
  zh:
  - "所以 agent 并不是更聪明的模型：三条通道用的是同一个模型。"
  - "变的是谁掌方向盘，还有工具。"
  - "每次调用都要付费；暂停一下，把三条通道都跑一遍。"
S03:
- en: "Next section: managing the model's inputs. LLMs are stateless functions. Every call is a fresh envelope, and the model knows only what's inside."
  zh:
  - "下一节：管理模型的输入。"
  - "LLM 是无状态的函数。"
  - "每次调用都是一个全新的信封，模型只知道信封里的东西。"
- en: "The notebook keeps the model and question fixed, and changes the inputs each step. A system prompt, retrieved documents, earlier turns, a profile from past sessions, a tool's output, an output schema."
  zh:
  - "这个 notebook 固定模型和问题，每一步改的是输入。"
  - "先是 system prompt、检索到的文档、之前几轮，再是以往 session 的用户画像、工具的输出和输出 schema。"
- en: "Watch the top pick change: cheddar, American, then mild cheeses for kids, then Havarti. Then a mild cheddar from Whole Foods, and finally the same pick as strict JSON."
  zh:
  - "注意看首选的变化：切达、美式奶酪，然后是给孩子吃的温和奶酪，再然后是哈瓦蒂。"
  - "接着是 Whole Foods 的一款温和切达，最后是同一个首选，写成严格的 JSON。"
- en: "Step 4 shows what memory really is. The earlier turns aren't remembered: the code sends them again, every time. Memory is paper you put back in the envelope."
  zh:
  - "第 4 步展示了记忆到底是什么。"
  - "之前几轮对话并不是模型记住的：代码每次都把它们重新发一遍。"
  - "记忆，就是你放回信封里的纸。"
- en: "The lecture groups these sheets into two building blocks: instructions and memory. Next lecture names the craft: context engineering."
  zh:
  - "课上把这几页纸归成两个组件：指令和记忆。"
  - "下节课会给这门手艺起个名字：上下文工程。"
- en: "Now look closely at the code of step 2. Can you spot the slip?"
  zh:
  - "现在仔细看看第 2 步的代码。"
  - "你能找出这个小疏漏吗？"
- en: "The system prompt goes in with the role user, and the question with the role system."
  zh:
  - "这里 system prompt 用的角色是 user，问题用的角色却是 system。"
- en: "Swap those two roles before comparing; from step 3 on, they're right. Pause, and run the seven steps."
  zh:
  - "先把这两个角色对调，再去比较；从第 3 步开始，它们就是对的。"
  - "暂停一下，把这七步跑一遍。"
- en: "And notice step 6: the code pasted a tool's output into the envelope. But how does a model ask for a tool?"
  zh:
  - "再注意第 6 步：代码把一个工具的输出贴进了信封。"
  - "可是，模型要怎么请求一个工具呢？"
S04:
- en: "In lecture 5, RAG was a straight line: question, retrieval, model, response. The lecture's recap makes retrieval smarter: steps around the search, whether to retrieve at all, grading, rewriting, and web search."
  zh:
  - "在第 5 讲里，RAG 是一条直线：问题、检索、模型、回答。"
  - "课上的回顾让检索更聪明：搜索前后的步骤、到底要不要检索、评分、改写，还有网页搜索。"
- en: "Agentic RAG puts a model in front of that menu, and lets it choose."
  zh:
  - "Agentic RAG 把一个模型放在这份菜单前面，让它来选。"
- en: "L-L-M rag's agents section is agentic RAG with a menu of two. Its README says: let the L-L-M decide how to retrieve. Search one author's book, or search all books."
  zh:
  - "在 llm-rag 里，Agents 一节就是 Agentic RAG，菜单上只有两项。"
  - "它的 README 说：让 LLM 决定怎么检索。"
  - "搜一位作者的书，或者搜全部的书。"
  en_display:
  - "llm-rag's Agents section is Agentic RAG with a menu of two."
  - "Its README says: let the LLM decide how to retrieve."
  - null
- en: "Here's the first menu item, written by hand: a name, which the model will write back, and a description; with the parameter descriptions, the only documentation the model sees. Parameters come as a JSON schema."
  zh:
  - "这是第一个菜单项，是手写的：一个名字，模型会把它写回来，还有一段描述；它和参数描述一起，是模型能看到的唯一文档。"
  - "参数以 JSON schema 的形式给出。"
- en: "The author must be one of 9 names in an enum. The search text's description even coaches the model: expand the search term to a sentence or two. And both fields are required."
  zh:
  - "作者必须是 enum 里 9 个名字之一。"
  - "搜索文本的描述甚至在指导模型：把搜索词扩展成一两句话。"
  - "而且两个字段都是必填的。"
- en: "Now the real function. Two more arguments, the collection and an embedding function, aren't in the schema: your code supplies them. The model controls only the author and the search text."
  zh:
  - "再看真正的函数。"
  - "还有两个参数，collection 和一个 embedding 函数，不在 schema 里：由你的代码提供。"
  - "模型能控制的只有作者和搜索文本。"
- en: "The lecture says a tool-using agent must pick the right tool, format its inputs, and interpret its outputs. Here the model picks and formats only by writing; your code runs the tool."
  zh:
  - "课上说，会用工具的 agent 必须选对工具，整理好输入格式，并解读输出。"
  - "在这里，模型选工具、整理格式，全靠写出来；运行工具的是你的代码。"
- en: "Here are the 11 books in the collection, beside the 9 names in the enum."
  zh:
  - "这是 collection 里的 11 本书，旁边是 enum 里的 9 个名字。"
- en: "Two books. The cottage cheese recipe book, 178 chunks, has an author who isn't on the list. The Woman's Institute book, 1,505 chunks, has no author at all: a file name slip in lecture 5."
  zh:
  - "两本书。"
  - "那本茅屋奶酪食谱，178 个 chunk，作者不在名单上。"
  - "Woman's Institute 那本书，1505 个 chunk，干脆没有作者：这是第 5 讲里那个文件名的小疏漏。"
- en: "Both stay reachable by the search across all books. Now the stage: Gemini in Google's cloud, two containers on your laptop, and a boundary between."
  zh:
  - "这两本书仍然能通过搜索全部的书找到。"
  - "现在看舞台：Gemini 在 Google 的云上，两个 container 在你的笔记本上，中间隔着一条边界。"
- en: "The model never gets your database, only a menu. Call 1 returns an order: a function name and arguments. Your code runs it; call 2 sends back the result."
  zh:
  - "模型从来拿不到你的数据库，只拿到一份菜单。"
  - "第 1 次调用返回一张点单：函数名和参数。"
  - "你的代码执行它；第 2 次调用把结果发回去。"
S05:
- en: "Lecture 5 ended on one command; today we run it. Starting fresh? Clone L-L-M rag, and put the service account key in a secrets folder beside it; otherwise, go to your folder."
  zh:
  - "第 5 讲停在了一条命令上；今天我们来运行它。"
  - "从头开始？"
  - "把 llm-rag clone 下来，把服务账号密钥放进它旁边的 secrets 目录；不是的话，就进到你的目录。"
  en_display:
  - null
  - null
  - "Clone llm-rag, and put the service account key in a secrets folder beside it; otherwise, go to your folder."
- en: "Step 1: cd L-L-M rag. Step 2: edit docker-shell.sh, and set GCP project to your own project ID; we used a placeholder. Pause, and do both."
  zh:
  - "第 1 步：cd llm-rag。"
  - "第 2 步：编辑 docker-shell.sh，把 GCP project 变量改成你自己的项目 ID；我们用的是占位值。"
  - "暂停一下，把两件事都做了。"
  en_display:
  - "Step 1: cd llm-rag."
  - "Step 2: edit docker-shell.sh, and set GCP_PROJECT to your own project ID; we used a placeholder."
  - null
- en: "Step 3: sh docker-shell.sh. Compose starts Chroma first. The pull message after it looks like an error but is harmless: there's no such image online, so Compose builds it."
  zh:
  - "第 3 步：sh docker-shell.sh。"
  - "Compose 先启动 Chroma。"
  - "后面那条 pull 的消息看起来像报错，其实无害：网上没有这个 image，所以 Compose 自己构建。"
- en: "After about 40 seconds of building, the banner prints. Python 3.12.15 and uv 0.13.1, at the time of recording. After the at sign comes the container's ID, new every run; pause, and get to this prompt."
  zh:
  - "构建大约 40 秒后，出现横幅。"
  - "录制时是 Python 3.12.15 和 uv 0.13.1。"
  - "提示符里 @ 符号后面是 container ID，每次运行都不一样；暂停一下，走到这个提示符。"
- en: "An extra check from a second terminal: docker ps. Chroma publishes port 8000; remember that port for part 2."
  zh:
  - "在第二个终端里做一个额外检查：docker ps。"
  - "Chroma 发布了 port 8000；记住这个 port，第二部分会用到。"
- en: "Now the agents section, step 1: python cli.py, dash dash agent, chunk type char split. On a fresh clone it fails at once: the collection does not exist. That's line 429, before any call to Gemini."
  zh:
  - "现在是 Agents 一节的第 1 步：python cli.py --agent，chunk type 用 char-split。"
  - "在新的 clone 上，它马上就失败：collection 不存在。"
  - "那是第 429 行，在任何 Gemini 调用之前。"
  en_display:
  - "Now the Agents section, step 1: python cli.py --agent --chunk_type char-split."
  - null
  - null
- en: "The agent needs the index from lecture 5. Kept that database? It's in the docker volumes folder; if you chunked before September 22, pull and rebuild it. Otherwise, chunk, embed and load again."
  zh:
  - "这个 agent 需要第 5 讲的索引。"
  - "那个数据库还留着吗？"
  - "它在 docker-volumes 目录里；如果你是在 9 月 22 日之前分块的，先 pull，再重建它。"
  - "否则就重新分块、向量化、加载。"
  en_display:
  - null
  - null
  - "It's in the docker-volumes/ folder; if you chunked before September 22, pull and rebuild it."
  - null
- en: "We had no key, so the staff's committed embeddings stood in for the embed step."
  zh:
  - "我们没有密钥，所以 embed 这一步，用的是课程团队 commit 过的 embedding。"
- en: "Then the load step: python cli.py, dash dash load, chunk type char split. 11 books, 8,248 chunks; the instructor's story is just 24 of them. An extra get command confirms the collection answers; pause, and load yours."
  zh:
  - "再加载：python cli.py --load，chunk type 用 char-split。"
  - "11 本书，8248 个 chunk；授课老师的故事只占其中 24 个。"
  - "一条额外的 --get 命令确认 collection 能正常响应；暂停一下，加载你自己的。"
  en_display:
  - "Then the load step: python cli.py --load --chunk_type char-split."
  - null
  - "An extra --get command confirms the collection answers; pause, and load yours."
S06:
- en: "After the collection lookup, the agent function builds the user's turn: the question, with the role user. Then comes the first call to Gemini."
  zh:
  - "查完 collection 之后，agent 函数组装出用户这一轮：问题，角色是 user。"
  - "接着是对 Gemini 的第一次调用。"
- en: "Three settings: temperature zero, the menu as tools, and a tool config with mode any. The lecture lists temperature as a design choice. Zero keeps the tool choice nearly repeatable."
  zh:
  - "三个设置：temperature 设为 0，菜单作为工具，以及一个 mode 设为 any 的 tool config。"
  - "课上把 temperature 列为一个设计选择。"
  - "设为 0，工具的选择就几乎可以复现。"
  en_display:
  - "Three settings: temperature zero, the menu as tools, and a tool_config with mode=\"any\"."
  - null
  - null
- en: "An extra one-liner shows what mode any becomes: the enum value ANY. The model must answer with a function call."
  zh:
  - "一行额外的命令显示，mode 设为 any 变成了什么：enum 值 ANY。"
  - "模型必须用一个函数调用来回答。"
  en_display:
  - "An extra one-liner shows what mode=\"any\" becomes: the enum value ANY."
  - null
- en: "In the lecture, a good agent may decide not to search at all; Self-RAG starts with that decision. Ours can't: on call 1, mode any forces a tool call. It chooses which search, never whether."
  zh:
  - "在课上，一个好的 agent 可能决定根本不去搜索；Self-RAG 就是从这个决定开始的。"
  - "我们的不行：在第 1 次调用里，mode 设为 any 会强制调用工具。"
  - "它选的是搜哪一个，从来不是搜不搜。"
  en_display:
  - null
  - "Ours can't: on call 1, mode=\"any\" forces a tool call."
  - null
- en: "What does Gemini actually receive? An extra script runs the same code, but prints the request instead of sending it. One envelope: the question, both declarations with the enum, mode ANY, temperature zero."
  zh:
  - "Gemini 实际收到的是什么？"
  - "一个额外的脚本运行同样的代码，但把请求打印出来，而不是发出去。"
  - "一个信封：问题、带着 enum 的两个声明，mode 为 ANY，temperature 为 0。"
  en_display:
  - null
  - null
  - "One envelope: the question, both declarations with the enum; \"mode\": \"ANY\", temperature zero."
- en: "And no system instruction: as in lecture 5, cli.py defines one and never sends it."
  zh:
  - "而且没有 system instruction：和第 5 讲一样，cli.py 定义了一个，却从来没发出去。"
- en: "Now step 1 again, with the collection loaded. The lookup passes and the question prints, but the first model call needs your key: default credentials error, file not found."
  zh:
  - "现在再跑第 1 步，collection 已经加载了。"
  - "查找通过了，问题也打印出来了，但第一次模型调用需要你的密钥：报 DefaultCredentialsError，找不到文件。"
  en_display:
  - null
  - "The lookup passes and the question prints, but the first model call needs your key: DefaultCredentialsError, file not found."
- en: "Here's what the staff saw. The model's whole answer is a function call: get book by author, with the instructor as author, and the search text, cheese making importance location."
  zh:
  - "下面是课程团队看到的。"
  - "模型的整个回答就是一个函数调用：get book by author，作者填的是授课老师，搜索文本是 cheese making importance location。"
  en_display:
  - null
  - "The model's whole answer is a function call: get_book_by_author, with the instructor as author, and the search text, cheese making importance location."
- en: "Four words, though the description asked for a sentence or two. There's also an ID, and a thought signature; we'll meet it again."
  zh:
  - "四个词，而描述要求的是一两句话。"
  - "还有一个 ID，以及一个 thought signature；我们之后还会再见到它。"
- en: "The SDK ran nothing; it only has declarations. So far, one paid call. Pause here, and run step 1 with your key."
  zh:
  - "SDK 什么都没运行；它手里只有声明。"
  - "到目前为止，一次付费调用。"
  - "在这里暂停，用你的密钥跑第 1 步。"
S07:
- en: "Back in your Python, a dispatcher matches each call's name, runs the real function with the model's arguments, and wraps the result as a function response."
  zh:
  - "回到你的 Python 里，分发器按名字匹配每个调用，用模型给的参数运行真正的函数，再把结果包装成函数响应。"
- en: "Without a key, an extra script feeds the staff's recorded call through the tutorial's own dispatcher, against our collection."
  zh:
  - "没有密钥时，一个额外的脚本把课程团队录下的调用，送进教程自己的分发器，对着我们的 collection 运行。"
- en: "One stand-in: without Google we can't embed the search text, so a stored chunk's vector stands in, and the 10 chunks may differ from a real query's."
  zh:
  - "有一个替身：没有 Google，我们没法把搜索文本向量化，所以用一个已存 chunk 的向量来替代，这 10 个 chunk 可能和真实查询返回的不一样。"
- en: "Out come 10 passages from today's story, about Mara and Anja. Joined into one string of 3,509 characters, they're stapled to the call as its response."
  zh:
  - "出来的是今天这个故事里的 10 个段落，讲的是 Mara 和 Anja。"
  - "它们拼成一个 3509 个字符的字符串，作为响应钉在这个调用上。"
- en: "Call 2 sends three things: the question, the model's own turn, unchanged, and your function responses. The tools go along again, but no tool config: the mode is back to automatic."
  zh:
  - "第 2 次调用发送三样东西：问题、原封不动的模型自己那一轮，以及你的函数响应。"
  - "工具也再次一起发过去，但没有 tool config：mode 回到了自动。"
  en_display:
  - null
  - "The tools go along again, but no tool_config: the mode is back to automatic."
- en: "Inside, the model's turn carries its thought signature: Gemini's thinking models sign their turn, and want it back exactly as sent. Resending the turn unchanged keeps the seal."
  zh:
  - "模型那一轮里面带着它的 thought signature：Gemini 的思考模型会给自己的那一轮签名，并要求原样发回。"
  - "原封不动地发回这一轮，封印就不会破。"
- en: "The staff's answer? An Alpine valley, its caves, and transhumance, the seasonal movement of livestock. The two calls used 247 and 1,269 tokens."
  zh:
  - "课程团队拿到的回答呢？"
  - "一个阿尔卑斯山谷、它的山洞，还有转场放牧，也就是牲畜随季节迁移。"
  - "两次调用分别用了 247 和 1269 个 token。"
- en: "So, who searched your database? Gemini wrote the call and chose the book; your Python ran it, on your laptop. That's two model calls and one embedding call per question, all paid."
  zh:
  - "所以，是谁搜索了你的数据库？"
  - "Gemini 写出了调用，选了那本书；你的 Python 运行了它，就在你的笔记本上。"
  - "每个问题要两次模型调用，加一次 embedding 调用，全都要付费。"
- en: "But today's book never says transhumance, nor three other words from this run: the commit that added this output also rewrote the book. The staff's index was built from the old text."
  zh:
  - "可今天这一版的书里从没出现过转场放牧，这次运行里的另外三个词也没有：加入这份输出的那个 commit，同时重写了这本书。"
  - "课程团队的索引是用旧文本建的。"
- en: "Your run on today's book draws on passages like these: Mara, the curd, the wheels. An index answers from what was loaded."
  zh:
  - "你在今天这一版书上跑，会用到这样的段落：Mara、凝乳、奶酪轮。"
  - "索引按加载进去的内容来回答。"
- en: "One small slip: the README promises the response, but line 478 prints the whole response object. Print response dot text for just the answer."
  zh:
  - "一个小疏漏：README 说会打印回答，但第 478 行打印的是整个 response 对象。"
  - "改成打印 response.text，就只有回答了。"
  en_display:
  - null
  - "Print response.text for just the answer."
- en: "Step 2 links to the course's hosted Cheese Agent Tool, up at the time of recording; try it in Chrome."
  zh:
  - "第 2 步链接到课程托管的 Cheese Agent Tool，录制时还在线；在 Chrome 里试试。"
S08:
- en: "The lecture's agent runs until the task is done. L-L-M rag's agent ran one lap: a forced tool call, then an answer. The README calls it an agent; by the lecture's definition, it's the smallest piece of one."
  zh:
  - "课上的 agent 会一直运行，直到任务完成。"
  - "而 llm-rag 的 agent 只跑了一圈：一次强制的工具调用，然后一个回答。"
  - "README 把它叫作 agent；按课上的定义，它只是 agent 最小的一块。"
  en_display:
  - null
  - "llm-rag's agent ran one lap: a forced tool call, then an answer."
  - null
- en: "Here's a question about that one lap."
  zh:
  - "关于这一圈，有一个问题。"
- en: "It prints a response whose only part is a function call, with no text, and the program ends. Nothing runs that call; a loop would run it, and ask again."
  zh:
  - "它打印出的 response 只有一个部分，就是函数调用，没有文本，然后程序就结束了。"
  - "没有任何东西去执行这个调用；换成循环，就会执行它，再问一次。"
- en: "The lecture draws the agent as a hub: the core and its instructions become a decision maker, with spokes to a planner, tools, and memory. Unroll the spoke to the tools into a loop."
  zh:
  - "课上把 agent 画成一个轮毂：核心和它的指令成为决策者，辐条通向规划器、工具和记忆。"
  - "把通向工具的那根辐条展开，就成了一个循环。"
- en: "What ends the loop? The stop rule: a reply with no function call is the final response. The model decides it's done by answering in plain text."
  zh:
  - "循环靠什么结束？"
  - "停止规则：一个不含函数调用的回复，就是最终回复。"
  - "模型认定自己做完了，办法就是用纯文本回答。"
- en: "In code you see the loop from outside: the ADK Runner streams events, this wrapper keeps the final response, and the loop runs inside the library."
  zh:
  - "在代码里，你是从外面看这个循环的：ADK 的 Runner 以流的形式输出事件，这个包装函数留下最终回复，循环本身在库里面运行。"
- en: "You also cap it, in case it never stops: 12 turns in the Cheese Quiz Guild, 16 iterations in the newsletter. Hitting the Agents SDK cap ends the run with an error."
  zh:
  - "你还要给它设个上限，以防它永远不停：Cheese Quiz Guild 里是 12 轮，简报里是 16 次迭代。"
  - "碰到 Agents SDK 的上限，运行就会以报错结束。"
- en: "The lecture's building blocks gray out dynamic control. You configure the model, instructions, tools and memory; the loop is the block a framework writes for you."
  zh:
  - "课上的组件图把动态控制标成了灰色。"
  - "你来配置模型、指令、工具和记忆；循环则是框架替你写好的那个组件。"
- en: "Before part 2, tear down. Type exit; an extra docker ps then shows Chroma still up, on port 8000. Then docker compose down: two harmless warnings, and it stops."
  zh:
  - "第二部分之前，先把它拆掉。"
  - "输入 exit；再用一条额外的 docker ps，会看到 Chroma 还在运行，在 port 8000 上。"
  - "然后运行 docker compose down：两条无害的警告之后，它就停了。"
- en: "Your index stays on disk, and part 2 also needs port 8000. Pause and tear down. In part 2, a framework runs this loop for us."
  zh:
  - "你的索引会留在磁盘上，而第二部分也要用 port 8000。"
  - "暂停一下，把它拆掉。"
  - "第二部分，由框架替我们跑这个循环。"
