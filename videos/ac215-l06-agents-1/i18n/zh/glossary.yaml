  note: 'Standard Chinese.'
- en: 'the lecture''s formula / an LLM plus reasoning, instructions and tools / the formula gains two pieces'
  zh_subtitle: '公式 / 推理'
  first_use: 'S16[4]：课上的公式，LLM 加上推理、指令和工具，多了两块：框架运行的循环，以及由你的代码强制执行的检查。'
  note: 'B3: plus → 加上, never +.'
# ---------------------------------------------------------------- The envelope: the model's inputs
- en: 'envelope / a fresh envelope / sheets / paper / stateless functions / what''s inside'
  zh_subtitle: '信封 / 纸 / 无状态'
  first_use: 'S03[0]：每次调用都是一个全新的信封，模型只知道信封里的东西。'
  note: 'V2''s metaphor, one word each: 信封, 纸 (these sheets → 这几页纸).'
