  note: 'The search text the model wrote stays English (it is on screen, A1 a).'
- en: 'ID / thought signature / Gemini''s thinking models / sign their turn / the seal / exactly as sent / unchanged'
  zh_subtitle: 'ID / thought signature / 思考模型 / 签名 / 封印 / 原封不动'
  first_use: 'S07[5]：原封不动地发回这一轮，封印就不会破。'
  note: 'A3: thought signature stays (the API field thoughtSignature on screen); thinking models → 思考模型; seal → 封印 (V3''s seal on the envelope).'
- en: 'turn / the user''s turn / the model''s own turn / the earlier turns / turn 1 / every turn'
  zh_subtitle: '轮'
