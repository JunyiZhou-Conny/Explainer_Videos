  first_use: 'S03[1]：先是 system prompt、检索到的文档、之前几轮，再是以往 session 的用户画像、工具的输出和输出 schema。'
  note: 'L05: system prompt stays. prompt (the LLM''s) stays; a shell prompt is 提示符 (A7). Next section: managing the model''s inputs → 下一节：管理模型的输入.'
