# Chinese (zh-CN) glossary and translation rules for ac215-l06-agents-1 (AC215 lecture 6, LLM: Agents I:
# a follow-along of dlops-io/llm-rag's Agents section @ e17a39f, dlops-io/llm-agent-google-adk @ f89faa7 and three
# Colab notebooks: Cheese Quiz, Travel Planner, Cheese Newsletter · Harness), code-switching version, SUBTITLES ONLY.
# Audience: Chinese-speaking AC215 grad students who read technical English fluently; register of a Chinese
# MLOps TA running a lab section. Precedents and source of the shared decisions: the series pilot
# videos/ac215-l01-vms-venvs/i18n/zh (repo, clone, commit, pin, lock 文件, import, 解析, 及以上, wheel), the container
# lectures ac215-l02-containers-1, ac215-l03-mega-pipeline, ac215-l04-flexible-workflow-ports (token, Ctrl-C, 关卡,
# and the subtitles-only rule set this file follows) and ac215-l05-rag (chunk, embedding, collection, 向量化, 索引,
# 替身, 通道, 一个小疏漏). Every term L1-L5 already decided keeps their form; what is new here is the agent vocabulary
# (function declarations, function calls and responses, the loop, Runner, session, MCP, the harness, A3), and the
# pins of build/review_spoken.md item 7 (any is mode's value, never 任何; the State tab's entries are 项, never 密钥)
# and item 12 (the en_display list, D4), which script.md's header asks this stage to apply.
# There is NO Chinese voice in this series: the Chinese lines are subtitles on the English timing (the bilingual
# band of output/<id>.zh-en.mp4, <id>.zh.srt, <id>.zh-en.srt / .ass). So no say:, no anchors, no readings, no
# durations, no rules about how numbers or symbols are spoken (L1's C2-C5 and F1-F6 are dropped): only display
# rules. But `python -m explainer.i18n check` still applies its voice hygiene to the displayed line when a
# sentence has no say: (brackets, maths symbols, letter_letter names, Latin words not listed here, a missing
# half-width space): rules A6, B3 and D3 are how the Chinese line stays clean without say:.
# Human-readable copy in Chinese: GLOSSARY.md (keep the two in sync; both term tables are generated from one list).
# terms[].zh_subtitle = the display form (Chinese subtitle line; titles use the written forms of A4);
# terms[].first_use = an example sentence for the translators, as SNN[k]：<one Chinese sentence for one English
# sentence of SAY block k, 0-based>; each one passes the checker;
# rules are tagged [A1]..[I2]: A terms, B typography, C numbers, D narration file, G subtitles, H titles and
# companions, I toolkit notes. (L1's E on-screen strings and F voice rules do not apply: nothing on screen is
# translated in this series, and there is no voice.)
# Read by: python -m explainer.i18n check (Latin words allowed in the Chinese line: every Latin word of
# zh_subtitle and first_use, plus allowed_spoken_latin, which lists the words as the checker's regex
# [A-Za-z][A-Za-z'.-]* cuts them: gemini-3.1-flash-lite is gemini- and flash-lite, gpt-4o is gpt-, .env is env,
# .env.example is env.example, .adk is adk, 1-baseline is baseline, AC215 is AC, localhost:8000 is localhost) and
# explainer/subtitles.py, for EVERY video (2-3 word English phrases of `en` are kept on one English line;
# 2-7 character Chinese headwords of zh_subtitle are registered in jieba, so zh_subtitle holds terms, not
# example phrases).
video: ac215-l06-agents-1
lang: zh-CN (mainland Simplified Chinese)
audience: 'Chinese-speaking AC215 (MLOps & LLMOps) grad students who read Python (async/await at a reading level) and have used a chat assistant; did L1 (uv, pyproject.toml, uv.lock), L2-L4 (containers, docker-shell.sh, a mounted service-account key) and L5 (llm-rag''s RAG pipeline and its ChromaDB collection); have never written a tool for an LLM, used an agent framework or heard of MCP. They follow along with their ~/AC215/llm-rag clone (L5''s collection still on disk), a fresh clone of dlops-io/llm-agent-google-adk and a Colab copy of the Cheese Quiz. Register of a Chinese MLOps TA running a lab section.'
voice: none          # subtitles only (video.yaml: Chinese = i18n/zh/narration/*.yaml on the English timing)
policy: 'The Mandarin of a Chinese MLOps TA walking a lab section through the steps, code-switching only where such a speaker really does, written as subtitles under an English narration. The viewers already say 起一个 container, pull 下来, 把 repo clone 下来, 写 prompt, 调 embedding 模型, 建一个 collection, and this lecture adds 这个 agent, 建一个 session, 跑一下 notebook, temperature 调成 0, enum 里的值, JSON schema, MCP server, thought signature. Every choice passes three tests: what is said in a real lab section; the standard, searchable Chinese name (Google''s Chinese Gemini docs, the Chinese OpenAI, ADK and MCP literature: 函数调用, 函数声明, 函数响应, 思考模型, 模型上下文协议, 上下文工程, 护栏); and consistency with the series (L1 decided the shared words, L2-L4 the container, key and network words, L5 the RAG words). (1) Artifacts verbatim: what the viewer types or matches on screen (commands, flags, file and folder names, paths, package names, model IDs, code names and values, terminal text and error names, the words of the Colab and ADK screens, the on-screen tags, README headings, the search text the model wrote) is copied letter for letter, never translated, inflected or quoted; the exceptions the checker forces are names with an underscore and the characters = + < > ( ) [ ], written the way the narration says them (A6, B3). Nothing on screen is translated in this series: terminal output, code panels, README cards, the schematic Colab and ADK screens, tags, trackers, lecture tags and the pause-and-ponder cards stay English; only the narration is. (2) Lab-speech English, a closed list: from L1 repo, clone, commit, pin, lock 文件, import; from L2-L4 container, image, pull, pipeline, port, localhost, API, ID, token; from L5 chunk, embedding, collection, prompt, system prompt, LLM, agent; new in L6 notebook, session, schema (JSON schema), enum, temperature, system instruction, thought signature, SDK, MCP''s host / client / server, harness, wheel, dev UI. (3) Everything else in standard Chinese: 工具, 工具调用, 函数调用, 函数声明, 函数响应, 参数, 字段, 必填, 描述, 分发器, 结果, 请求, 回复, 最终回复, 循环, 停止规则, 上限, 迭代, 轮, 事件, 状态, 记忆, 指令, 组件, 动态控制, 决策者, 规划器, 编排, 工作流, 框架, 推理引擎, 推理工作流, 推理模型, 思考模型, 协议, 模型上下文协议, 定制集成, 子进程, 标准输入输出, 工具集, 过滤器, 服务器, web 服务器, 浏览器, 重定向, 标识符, 遥测, 占位符, 单元格, 运行时, 护栏, 成功标准, 审批, 批准, 回执, 上下文工程, 深度研究, 交接, 校验器, 总结器, 分类器, 处理函数, 结构化输出, 解析, 包, 虚拟环境. (4) The video''s metaphors by meaning, one word each: 方向盘 (steering wheel), 通道 (lane, as L5), 信封 and 纸 (envelope, sheets), 菜单 and 点单 (menu, order), 封印 (seal), 替身 (stand-in, L5), 轮毂 and 辐条 (hub, spokes), 白板 and 格子 (whiteboard, cells), 插头 (plug), 流水线 (assembly line), 关卡 and 印章 (gate, stamp), 回执 (receipt), 便条 (note), 舞台 and 边界 (stage, boundary). (5) Written register for titles, meta.yaml and companion docs: 容器, 镜像, 仓库, 克隆, 提交, 端口, 提示词, 系统提示词, 嵌入向量, 集合（collection）, 智能体（agent）, 会话（session）, Colab 笔记本（notebook）, MCP 服务器（MCP server）; harness stays harness. (6) The bilingual band puts the English sentence under every Chinese line, so the Chinese line carries no glosses and no brackets at all (the checker forbids them without say:). (7) The toolkit''s constraints are part of the policy: one Chinese sentence per English sentence (153 blocks, 337 sentences), a checker-clean display line (D3), an en_display wherever the SAY spells an artifact out as words (D4), the English clause order kept (D9). Mainland Simplified Chinese; relaxed, clear lab-section speech, never slangy.'
rules:
- '[A1] Code-switching scope. English stays in three places only. (a) Artifacts, copied letter for letter: commands and subcommands (cd llm-rag, sh docker-shell.sh, python cli.py --agent, python cli.py --load, --get, docker ps, docker compose down, exit, git clone, cd google-adk-tutorial, cd llm-agent-google-adk, ls, grep, curl, uv sync, uv python pin 3.13, uv run adk web, uv run adk --version, adk telemetry disable, --port 8080, git status, npx, Ctrl-C; --chunk_type by A6), file and folder names and paths (cli.py, docker-shell.sh, .env, .env.example, .adk, docker-volumes, secrets, llm-rag, llm-agent-google-adk, google-adk-tutorial, 1-baseline, baseline, baseline.agent), package names (onnxruntime, sentence-transformers), code names and values (enum, ANY, any, user, system, response, response.text, finalize, yes, USERS, clarification, tools; the underscore names by A6), model IDs (gpt-4o, gemini-2.5-flash, gemini-3.1-flash-lite, gemini-2.0-flash; C2), terminal text and errors (DefaultCredentialsError, Internal Server Error, API key not valid, address already in use, 406), the search text the model wrote (cheese making importance location), the words of the screens (Save a copy in Drive, Secrets, Notebook access, the State tab, dev UI), README headings (Agents, Running Agents; A11) and the on-screen tags the narration names (your turn; A11). (b) Products, organizations, courses and names: AC215, MLOps Learning, Google, Google AI Studio, AI Studio, Gemini, OpenAI, Microsoft, Agent Framework, Agents SDK, SDK, Agent Development Kit, ADK, Runner, Colab, Drive, Docker, Compose, Chroma, Python, CPython, uv, Node, npx, FastMCP, MCP, PyTorch, CUDA, Linux, Chrome, JSON, HTML, URL, RAG, Agentic RAG, Self-RAG, Corrective RAG, Cheese Quiz, Cheese Quiz Guild, Guild, Travel Planner, Cheese Agent Tool, Whole Foods, Woman''s Institute, Mara, Anja, student. (c) Words Chinese MLOps engineers really say in English in a lab section, a closed list: from L1 repo, clone, commit, pin, lock 文件, import; from L2-L4 container, image, pull, pipeline, port, localhost, API, ID, token; from L5 chunk, embedding, collection, prompt (an LLM prompt only), system prompt, LLM, agent; new here notebook (A3), session (A3), schema and JSON schema (A3), enum (A3), temperature (A3), system instruction (A3), thought signature (A3), SDK, MCP''s host, client and server (A3), harness (A3), wheel (already in L1''s docs), dev UI. A word joins (c) only when lab speech really uses the English and the Chinese is stilted, ambiguous or collides with another term. Never English for flavour: tool, tool call, function call, function declaration, function response, dispatcher, arguments, parameters, fields, required, description, request, response (the model''s answer), reply, final response, loop, lap, stop rule, cap, iteration, turn, event, state, memory, instructions, building block, dynamic control, decision maker, planner, orchestrator, orchestration, workflow, framework, library, wrapper, protocol, custom integration, child process, toolset, filter, server (outside MCP), web server, browser, redirect, identifier, telemetry, placeholder, cell, runtime, classifier, label, handler, structured output, guardrail, success criteria, approval, pending, approved, receipt, handoff, deep research, context engineering, reasoning engine, thinking model, catalog and newsletter are Chinese.'
- '[A2] container and image (as L2-L5). The subtitles say container and image: 两个 container, container ID, 网上没有这个 image; measure word 个. Titles, chapter names, meta.yaml and companion docs write 容器 and 镜像 (A4); never 镜像 in a subtitle. pull stays (后面那条 pull 的消息; 先 pull，再重建它, a git pull here); pulls in (a dependency) → 引入, never pull (Chroma 引入的 onnxruntime). build → 构建 (Compose 自己构建).'
- '[A3] The agent vocabulary (new in this lecture). agent stays (这个 agent, agent 函数, agent 循环, LLM agent, 顺序 agent, 并行 agent, 编排 agent, 专家 agent, 主 agent, 自定义 agent); written register 智能体（agent）. The lecture''s frame (SLIDES.md): LLM core → LLM 核心, instructions → 指令 (an instruction → 一条指令), tools → 工具, memory → 记忆 (never 内存), dynamic control → 动态控制, building blocks / five blocks → 组件 / 五个组件, the anatomy → agent 结构图, decision maker → 决策者, planner → 规划器, hub / spokes → 轮毂 / 辐条, base LLM → 基础 LLM, reasoning LLM → 推理 LLM, reasoning engine → 推理引擎, reasoning workflow → 推理工作流, reasoning model → 推理模型, a multi-call system → 多次调用的系统, live systems → 实时系统, tools that act → 能行动的工具, the autonomy to decide → 自主决定的能力, Agentic RAG / Self-RAG / Corrective RAG stay, data / action / orchestration tools → 数据工具 / 行动工具 / 编排工具, handoffs → 交接, agents as tools → 把 agent 当工具用, deep research → 深度研究, a lead agent → 主 agent, synthesis → 汇总, success criteria → 成功标准, guardrails → 护栏 (hard / soft → 硬护栏 / 软护栏), context engineering → 上下文工程, the lecture''s formula → 课上的公式. Function calling: function declaration → 函数声明, function call → 函数调用, tool call → 工具调用, a forced tool call → 一次强制的工具调用, function response → 函数响应, dispatcher → 分发器, the real function → 真正的函数, arguments / parameters → 参数, fields → 字段, required → 必填, description → 描述, parameter descriptions → 参数描述, JSON schema and schema stay (output schema → 输出 schema), enum stays (enum 值 ANY), temperature stays (temperature 设为 0), tool config stays (A6), mode 设为 any / mode 为 ANY (A6, B3; any is the value, never 任何), automatic → 自动, request → 请求, system instruction stays, thought signature stays, thinking models → 思考模型, the search text → 搜索文本 (A6), call 1 / call 2 → 第 1 次调用 / 第 2 次调用, a model call → 模型调用, a paid call → 付费调用, token stays (L4). The loop: loop → 循环, one lap → 一圈, stop rule → 停止规则, final response → 最终回复, reply → 回复, plain text → 纯文本, cap → 上限, turns → 轮, iterations → 迭代, events → 事件, streams events → 以流的形式输出事件, wrapper → 包装函数, the library → 库, framework → 框架; Runner and Agents SDK stay. ADK: session stays (written 会话（session）), state → 状态, session state → session 状态, the State tab → State 标签页, history of events → 事件历史, output key stays (A6), placeholder → 占位符, root agent stays (A6), validator / planner / summarizer → 校验器 / 规划器 / 总结器, sequential / parallel agent → 顺序 / 并行 agent, dev UI stays, the agent dropdown → agent 下拉菜单, app name → app 名, identifier → 标识符, telemetry → 遥测, usage data → 使用数据, web server → web 服务器, module / module folders → 模块 / 模块目录, quick start → 快速入门. MCP: MCP stays, the Model Context Protocol → 模型上下文协议, protocol → 协议, custom integration → 定制集成, host, client and MCP server stay (remote MCP server → 远程 MCP server; FastMCP server; 文件系统 server), toolset → 工具集, the filter → 过滤器, child process → 子进程, standard input and output → 标准输入输出, thread → 线程, client process → client 进程, network access → 网络访问. Notebooks: notebook stays (written Colab 笔记本（notebook）), cell → 单元格, runtime → 运行时, the Secrets panel → Secrets 面板. The harness: harness stays (also in the written register), outer layer → 外层, gate → 关卡, stamp → 印章, pending / approved → 待批准 / 已批准, approval → 批准, receipt → 回执, claim → 声称, a note → 便条, orchestrator → 编排 agent, specialist → 专家 agent, researcher / editor → 研究员 / 编辑, draft → 草稿, newsletter → 简报, reader → 读者, mock catalog → 模拟清单, classifier → 分类器, label → 标签 (A7), handler → 处理函数, if statements → if 语句, else branch → else 分支, structured output → 结构化输出, assembly line → 流水线, hop → 一跳.'
- '[A4] Written vs spoken. The subtitles say repo / clone / commit / container / image / port / prompt / system prompt / embedding / collection / agent / session / notebook / MCP server / token / pin / lock 文件; titles, chapter names, meta.yaml and companion docs write 仓库 / 克隆 / 提交 / 容器 / 镜像 / 端口 / 提示词 / 系统提示词 / 嵌入向量 / 集合（collection） / 智能体（agent） / 会话（session） / Colab 笔记本（notebook） / MCP 服务器（MCP server） / 词元（token） / 固定版本（pin） / 锁文件（lock file), with the English in brackets at the first use of a core concept (brackets are fine outside the narration). harness stays harness in writing too. repo as a subject → 这个 repo. Commands are unaffected (git clone, uv python pin 3.13).'
- '[A5] Writing artifacts. Copied letter for letter (case, dots, slashes, hyphens unchanged); never translated, inflected, quoted, put in 《》 or code formatting. Add a Chinese head noun where needed: docker-shell.sh 这个脚本, .env 文件, llm-rag 目录, docker-volumes 目录, 1-baseline 这个名字, get book by author 这个函数, apply confirmation 这个函数, send email 这个工具, finalize 工具, USERS 单元格, --get 命令, docker ps 这条命令. No sentence opens with an artifact or a lower-case kept-English word: put a Chinese word first (这个 agent……; 这个 notebook……; 这里 system prompt……; 在 baseline 里……; 而 llm-rag 的 agent……; 额外的 ls 显示……; 按 Ctrl-C……), so no subtitle starts in lower case either. Product names, capitalized acronyms and class names (ADK, MCP, LLM, RAG, SDK, Runner, Gemini, Google, OpenAI, Python, Chroma, Compose, Colab, Agentic RAG, Self-RAG, README) may open a sentence.'
- '[A6] Names with an underscore (as L3-L5). With no say:, the checker reads the display line as the spoken text and rejects letter_letter; the SAY never reads these names with their underscores either. So the Chinese line writes them the way the narration says them: the underscore becomes a space, case as in the SAY, always with a Chinese head noun or in an obvious name slot; where the English only points at one, it is named by its role. Mapping: get_book_by_author → get book by author 这个函数; search_content → 搜索文本; tool_config → tool config; mode="any" → mode 设为 any (the enum value ANY → enum 值 ANY; mode ANY → mode 为 ANY); output_key → output key; mcp_servers → MCP servers 参数 (作为 MCP servers 参数传进去，而不是 tools); tool_filter → 过滤器; needs_confirmation → needs confirmation; apply_confirmation → apply confirmation 这个函数; send_email → send email (the tool; the plain verb sending email → 发邮件); finalize_itinerary → finalize (the SAY''s word); root_agent → root agent; GCP_PROJECT → GCP project 变量; GOOGLE_API_KEY= → Google API key 的等号后面; --chunk_type char-split → chunk type 用 char-split (so python cli.py --agent --chunk_type char-split is written ''python cli.py --agent，chunk type 用 char-split。''); mcp_tools and custom_agent are not in the SAY. The English line gets the literal form through en_display (D4). When the toolkit lets display lines keep underscores (I1), swap these spaced forms back to the literal ones.'
- '[A7] Words to keep apart. 笔记本 (laptop) ≠ notebook (Colab) ≠ 记忆 (memory, never 内存). 单元格 (a notebook cell) ≠ 格子 / 那一格 (a whiteboard cell). 组件 (the lecture''s building blocks) ≠ 模块 (ADK''s module folders, the ADK module on MCP). 点单 (the menu metaphor''s order: 第 1 次调用返回一张点单) ≠ 顺序 (who plans the order: 顺序由谁来定). 规划器 (the planner node of the lecture''s diagrams, deep research''s planner, baseline''s TravelPlanner) ≠ 课上的旅行规划 (S11[5]''s the lecture''s planner: the travel example of slides 20-22) ≠ 规划 (the verb: plan a trip → 规划一次旅行). 服务器 (web 服务器, 服务器日志, 停掉服务器) ≠ MCP server / FastMCP server / 文件系统 server (MCP''s role name) ≠ 服务 (services: 十个服务; a Compose service). 清单 (mock catalog → 模拟清单) ≠ 目录 (a folder) ≠ 名单 (the readers'' list, the 9 names). 回执 (receipt: proof an action happened) ≠ 小票 (L1''s lock-file metaphor, not used here). 关卡 (gate, as L4''s three gates) ≠ 门 (L4/L5''s published host port) ≠ 印章 (stamp). 标签 (a classifier''s label) ≠ the on-screen tags (always named: your turn 标签, 灰色标签) ≠ State 标签页 (a tab). 密钥 (key: API key, service-account key, the AI Studio key) ≠ 项 (the State tab''s entries, never 密钥 or 键) ≠ output key (ADK''s argument) ≠ Google API key (the variable). token (an LLM token) ≠ 密钥. 回答 (the model''s answer) ≠ 回复 (reply: 最终回复, 三条回复) ≠ 函数响应 (function response) ≠ response 对象 (the code''s response). 调用 (a call: 第 1 次调用, 模型调用) ≠ 函数调用 (function call: the model''s order) ≠ 工具调用 (tool call). 参数 (arguments, parameters) ≠ 字段 (a schema''s fields). 轮 (turn: a turn of the conversation, 第 1 轮, 12 轮) ≠ 圈 (lap: 只跑了一圈) ≠ 迭代 (iteration) ≠ 一跳 (hop). 上限 (cap, upper bound) ≠ 设上限 (capping a key). 占位符 (the README address''s placeholder, an instruction''s {key}) ≠ 占位值 (the placeholder GCP project) ≠ 占位密钥 (placeholder key). 重建 (an index or database, L5) ≠ 构建 (an image) ≠ 重写 (rewrote the book). 批准 / 已批准 / 待批准 (approval, approved, pending) ≠ confirmation (only inside the names needs confirmation, apply confirmation). 拆掉 (tear down) ≠ 停掉 (stop: 按 Ctrl-C 停掉服务器) ≠ 删除 (delete: the virtual environment, the runtime) ≠ 断开连接 (disconnect). prompt (an LLM''s) ≠ 提示符 (a shell''s: 走到这个提示符). 授课老师 (the instructor) ≠ 课程团队 (the staff) ≠ 课上 (the lecture) ≠ 课件 (the lecture slides).'
- '[A8] Register: a TA in a lab section. Short instructions with spoken verbs (跑, 装, 敲, 改, 贴, 删, 拆, 选); the viewer is 你 (one-to-one follow-along; never 您, 大家, 同学们); 我们 is us at recording time (我们没有密钥). Chinese word order inside a clause; clause order follows the English (D9). No translationese: not 让我们…… (say 我们来……, 先……), not 这就是为什么…… (say 所以……), few 被 sentences, no stacked 一个……的. No internet slang. Carry the spoken rhythm by meaning: Here''s a question for a cheese expert → 这是一个问奶酪专家的问题; What''s missing → 缺的是; Here''s the first menu item → 这是第一个菜单项; Now the real function → 再看真正的函数; Two books. → 两本书。; Here''s what the staff saw → 下面是课程团队看到的; The staff''s answer? → 课程团队拿到的回答呢？; So, who searched your database? → 所以，是谁搜索了你的数据库？; Why? → 为什么？; Now the harness → 现在来看 harness; Back in your Python → 回到你的 Python 里; Ours can''t → 我们的不行; First answer: the code → 第一种答案：代码.'
- '[A9] Precision. Translate the quantifiers: only 只, every 每个 / 每次, all 全部 / 全都, about 大约, at most 最多, nearly 几乎, never 从不 / 绝不, whenever 只要, at once 马上 / 同时 by context (fails at once → 马上就失败; fills its cells at once → 同时填满). at the time of recording is always 录制时, never dropped. Counts, line numbers, step numbers and versions exactly as on screen (C1). Errata are mild and always followed by the fix, all in one phrase: a small slip → 一个小疏漏 (A small slip: / One small slip: → 一个小疏漏：; Two more slips: → 还有两个小疏漏：; a file name slip in lecture 5 → 第 5 讲里那个文件名的小疏漏; Can you spot the slip? → 你能找出这个小疏漏吗？). Pause-and-ponder (after S04[7], S08[1], S09[9], S13[5], S14[3]; S03[5]''s spot-it and S12[1]''s 5-second beat too) asks and never answers, and the wording must not give it away: S04[7] must not say two books or that they are still reachable; S08[1] must not mention a missing loop; S09[9] must not mention 3.15 or ''the newest''; S13[5] must not mention letter case; S14[3] must not say it runs on the human''s message or before the agent starts; S03[5] must not name the swapped roles; S12[1] must not say custom integration. Money: Every call is paid → 每次调用都要付费; So far, one paid call → 到目前为止，一次付费调用; all paid → 全都要付费; Every turn is paid → 每一轮都要付费; Web search is billed per call → 网页搜索按次计费 (really per call here: OpenAI''s hosted search); with billing on → 开通计费; delete or cap the other two keys → 把另外两个密钥删掉，或者给它们设上限.'
- '[A10] Names. Products, companies and the course keep Latin script (A1 b); 哈佛 only in titles and descriptions. Course: AC215; lecture n → 第 n 讲 (lecture 7 sketches handoffs → 第 7 讲会简单讲讲交接); next lecture → 下节课; the lecture → 课上; the lecture slides → 课件; part 1 / part 2 → 第一部分 / 第二部分; this video → 这期视频. the instructor → 授课老师, never named (On screen we hide the instructor''s name → 画面上我们隐去了授课老师的名字); the instructor''s book / story → 授课老师的书 / 故事; the staff → 课程团队; the course''s hosted Cheese Agent Tool → 课程托管的 Cheese Agent Tool. Book authors never appear (the 9 names live only in the enum panel on screen); books by title or description (the cottage cheese recipe book → 那本茅屋奶酪食谱; the Woman''s Institute book → Woman''s Institute 那本书). The story''s Mara and Anja stay. The two running questions (describe where cheese making is important in the instructor''s book; what''s the best cheese for a grilled cheese sandwich?) and the README''s descriptions (let the LLM decide how to retrieve; search one author''s book, or search all books) are the narration''s words and are translated; the search text the model wrote, cheese making importance location, is on screen and stays. Quoted instructions are translated: follow the assembly line strictly → 严格按流水线来; no embedded URLs → 不要嵌入 URL; expand the search term to a sentence or two → 把搜索词扩展成一两句话. Cheeses in Chinese (切达, 美式奶酪, 哈瓦蒂, 茅屋奶酪), the store Whole Foods stays; places in Chinese (巴黎, 加州). The user name student stays; container and session IDs are never read out.'
- '[A11] The screen stays English. This series translates only the narration: terminal output and prompts, terminal titles, code panels (comments included), README cards, the schematic Colab and ADK screens, the trackers (llm-rag › Agents › step k of N, ADK › Getting Started, Colab · Cheese Quiz › …), lecture tags (Lecture 6 · slides 25–27), the call 1 → your code → call 2 strip, diagram labels, the stamps (PENDING, APPROVED), tags (your turn, extra, illustration, recorded · the staff''s last saved run, expected, stand-in, real run · no key, real run · placeholder key, built, not sent, at the time of recording, erratum, fix · not in the README, your numbers will differ, concept · lecture only, what if · just watch, paid · per call) and the ponder cards are English, and the scenes need no language changes. So where the narration names something on screen, the subtitle writes it as shown: 黄色的 your turn 标签 (L2-L5); the gray tag → 灰色标签; the State tab → State 标签页; the Secrets panel → Secrets 面板; Notebook access; Save a copy in Drive. What the narration says in its own words is translated: an extra check → 额外检查, the tracker → 进度条, the agent dropdown → agent 下拉菜单. README headings stay (Agents 一节, Running Agents 一节); a narration paraphrasing the README says README 里说…….'
- '[A12] Mainland Simplified Chinese only: 默认, 程序, 代码, 文件, 目录, 数据库, 服务器, 网络, 内存, 磁盘, 脚本, 视频, 用户名, 信息, 账号, 函数, 参数, 字段, 字符串, 标识符, 单元格, 运行时, 预览; never 預設, 程式, 程式碼, 檔案, 資料夾, 資料庫, 伺服器, 網路, 記憶體, 磁碟, 腳本, 影片, 使用者, 帳號, 函式, 引數, 欄位, 字串, 識別碼, 儲存格, 執行階段.'
- '[A13] The series list (the ac215-video skill''s list) in this lecture. agent is the lead (47 uses, A3); prompt and system prompt (S03, S15; L5); embedding three times (embedding 函数, commit 过的 embedding, embedding 调用); pipeline once (S11[5] 这条 pipeline); port many times (port 8000, 8080, 8001; L4/L5: 发布); container twice and image once; commit, pull, repo, clone, pin, lock 文件 and import as L1-L5. Not in this script: Dockerfile, PATH (only on screen, in no python3 on PATH), endpoint, LoRA, CI, push; volume only inside the folder name docker-volumes (an artifact: docker-volumes 目录, never 卷 or volume).'
- '[B1] Spacing. One half-width space between Hanzi and Latin letters, digits or an artifact (输入 exit, Python 3.12.15, 第 429 行, port 8000, 8248 个 chunk, 2690 美元, 1.6 GB, .env 文件, agent 函数, enum 里). The checker reports a missing space on every displayed sentence. Spaces inside an artifact as they are (uv run adk web); never add one inside an artifact. No space next to full-width punctuation (……cd llm-agent-google-adk。, 读者，). A space between @ and Hanzi too (@ 符号后面). Never U+00A0 / U+202F as a fake no-break space.'
- '[B2] Punctuation. Chinese uses full-width ，。、；：？！“”……, also next to an artifact (输入 exit。). Lists use 、 (校验器、规划器、总结器). No brackets of any kind: （）, (), 《》, 【】, [], <> (the checker rejects them without say:, and the bilingual band needs no glosses). “” only for an idea or word quoted in Chinese; artifacts, tag names, book titles, screen words, terminal text and text the model wrote are never quoted. One Chinese sentence (for one English sentence) has no 。？！ inside: use ，；： (S01[2] 课上问的是一个更大的版本：规划在巴黎的五天…… is one sentence); prefer one colon per sentence. 第 N 步 and 第一题……第五题 take a full-width colon before their content. Questions keep ？.'
- '[B3] Symbols the checker rejects (= < > + → ← ^ ≤ ≥ × ÷ ≈, == != +=, a digit followed by !, brackets, letter_letter): never copied into the Chinese line; say them in words or rephrase. mode="any" → mode 设为 any; "mode": "ANY" → mode 为 ANY; GOOGLE_API_KEY= → Google API key 的等号后面; LLM plus reasoning, instructions and tools → LLM 加上推理、指令和工具; Ctrl+C → Ctrl-C (L4); the {key} placeholder → 占位符; 8000:8000 is never needed (say port 8000). Allowed and kept as on screen: . and / in paths and file names (.env, .env.example, .adk, baseline.agent, response.text, cli.py), the : of localhost:8000, - in flags and names (--agent, --load, --get, --port 8080, --version, 1-baseline, char-split, gpt-4o, Ctrl-C), @ (@ 符号后面), %.'
- '[C1] Numbers in displayed text. Everything that echoes a number on screen, in the terminal, the code, the slides or written as digits in the SAY uses Arabic digits with no thousands separator, as the terminal prints them (8248, 1505, 3509, 1269, 2690, 6000): step numbers (第 1 步, 第 6 步), turns (第 1 轮……第 4 轮), call numbers (第 1 次调用, 第 2 次调用), lane and plug numbers (第 1 条通道, 第 3 个插头), line numbers (第 429 行, 第 478 行), counts (10 个段落, 9 个名字, 11 本书, 178 个 chunk, 1505 个 chunk, 8248 个 chunk, 24 个, 4 个子问题, 11 次调用, 3509 个字符, 247 和 1269 个 token, 12 轮, 16 次迭代, 7 项, 189 个包, 14 个工具, 最多 2 轮审查, 3 个城市, 6 家酒店, 5 个搜索工具), port 8000 / 8080 / 8001, 406, versions, sizes, times, money, dates. Small narrative counts and ordinals the SAY writes as words use Hanzi: 三步, 两个密钥, 五天, 五个组件, 三条通道, 三种方式, 两行, 两次调用, 三样东西, 两本书, 四个词, 两个 container, 三类, 十个服务, 三个插头, 三个 LLM agent, 三条回复, 三项, 三次模型调用, 六个模块目录, 四个目录, 两件事, 两条无害的警告, 五次搜索, 四次编辑调用, 四位读者, 两位, 三个工具, 三个错误, 第一部分 / 第二部分, 第一题……第五题, 第一种 / 第二种 / 第三种答案, 第一个菜单项. The sentence-initial Ten passages came back (10 on screen) → 返回了 10 个段落.'
- '[C2] Units, versions, model IDs and dates. Sizes as on screen with a half-width space: 1.6 GB, 3 GB. Times: 大约 40 秒, 不到 3 秒, 39 秒, 13 秒. Money: 2690 美元，上限 6000 (dollars → 美元; never converted to yuan). Versions with their names: Python 3.12.15, uv 0.13.1, CPython 3.15.0, CPython 3.13, Python 3.10 及以上, Python 3.14, ADK 1.8 及以上, ADK 2.12.0, 2.12 版, 旧版本 1.27.5. Model IDs as in the code, the same on both lines: gpt-4o, gemini-2.5-flash, gemini-3.1-flash-lite, gemini-2.0-flash (L5 C2; the English line through en_display, D4). Dates: 2026 年 10 月 18 日 (October 18, 2026), 9 月 22 日 (September 22).'
- '[D1] Sentence alignment (explainer/i18n.py). In narration/*.yaml every SAY line of script.md has one entry (153 blocks); `en` equals the SAY line byte for byte; `zh` has exactly as many items as explainer.voice.split_sentences finds English sentences (337 in this script). Restructure only inside a sentence; never merge or split sentences. Short sentences are items of their own: Starting fresh? → 从头开始？; Kept that database? → 那个数据库还留着吗？; Two books. → 两本书。; Why? → 为什么？; The staff''s answer? → 课程团队拿到的回答呢？; Test yourself. → 自测一下。; Install Node. → 安装 Node。; Now the harness. → 现在来看 harness。; That''s the gate. → 这就是关卡。; Now the real function. → 再看真正的函数。; What ends the loop? → 循环靠什么结束？. Run `python -m explainer.i18n check videos/ac215-l06-agents-1 --lang zh` until it prints OK.'
- '[D2] No say:, no anchors. There is no Chinese voice: never write say: (the display line is the only text) and never write anchors: (anchors only time animation beats for a Chinese-voiced render). The subtitles are timed by the English audio; the toolkit pairs each Chinese sentence with its English one by position.'
- '[D3] A checker-clean display line. With no say:, every displayed sentence must pass explainer.i18n.spoken_problems: no brackets (B2), no maths symbols (B3), no letter_letter names (A6), no ! after a digit, no clause ending in 种 followed by ，。！？ (最好用哪种奶酪？ is fine, 有几种。 is not), a half-width space between Hanzi and Latin letters or digits (B1), each sentence ending in 。！？ or …… (optionally followed by ” or 」), and every Latin word listed in this glossary (zh_subtitle, first_use or allowed_spoken_latin). The checker cuts words with [A-Za-z][A-Za-z''.-]* and ignores one-letter words: gemini-3.1-flash-lite is gemini- and flash-lite, gemini-2.5-flash is gemini- and flash, gpt-4o is gpt-, .env is env, .env.example is env.example, .adk is adk, 1-baseline is baseline, AC215 is AC, localhost:8000 is localhost, --port is port, Woman''s stays Woman''s, Ctrl-C stays Ctrl-C. A Latin word it reports is either an English word to translate (usually) or a missing artifact: add the artifact, cut the same way, to allowed_spoken_latin and to its term. Plurals are left out on purpose (except agents and tools, which are names: Agents SDK, the tools argument; no calls, sessions, tokens, notebooks, cells): a plural it reports is an English inflection to drop (12 轮, 三个 LLM agent, 247 个 token).'
- '[D4] The English line (en_display). The bilingual band shows the SAY sentence, and the SAY spells artifacts out as words for the voice. Every such sentence gets an en_display item with the literal on-screen form, the rest word for word as the SAY; the other sentences of the block are null. Spoken form → literal (script.md''s header list and review_spoken item 12, plus the model IDs of C2): L-L-M rag → llm-rag; L-L-M agent google ADK → llm-agent-google-adk; cd L-L-M rag → cd llm-rag; cd google ADK tutorial → cd google-adk-tutorial; cd L-L-M agent google ADK → cd llm-agent-google-adk; dot env → .env; dot env dot example → .env.example; the dot env at the repository root → the .env at the repository root; dot ADK folder → .adk/ folder; python cli.py, dash dash agent, chunk type char split → python cli.py --agent --chunk_type char-split; python cli.py, dash dash load, chunk type char split → python cli.py --load --chunk_type char-split; An extra get command → An extra --get command; GCP project → GCP_PROJECT; the docker volumes folder → the docker-volumes/ folder; get book by author → get_book_by_author; mode any → mode="any"; mode ANY / the enum value ANY → "mode": "ANY" / ANY; tool config → tool_config; default credentials error → DefaultCredentialsError; response dot text → response.text; O-N-N-X runtime → onnxruntime; sentence transformers → sentence-transformers; uv run ADK web → uv run adk web; uv run ADK dash dash version → uv run adk --version; ADK telemetry disable → adk telemetry disable; localhost 8000 → localhost:8000; dash dash port 8080 → --port 8080; control C → Ctrl+C; Google API key equals → GOOGLE_API_KEY=; 1 baseline → 1-baseline; baseline dot agent → baseline.agent; output key → output_key; MCP servers, not tools → mcp_servers, not tools; needs confirmation → needs_confirmation; apply confirmation → apply_confirmation; send email → send_email; the users cell → the USERS cell; MLOps Learning repo → MLOps_Learning repo; GPT-4o → gpt-4o; Gemini 2.5 Flash / 2.5 Flash → gemini-2.5-flash; Gemini 3.1 Flash-Lite → gemini-3.1-flash-lite; Gemini 2.0 Flash → gemini-2.0-flash. Underscore names (A6) are restored to their literal form only in en_display; the Chinese line keeps the spaced form. The English video''s own .srt is unaffected.'
- '[D5] Content parity. Each Chinese sentence translates its English sentence only: no added commands, flags, glosses, Chinese screen names or explanations; 额外 only where the English says extra; kept-English words get no Chinese explanation (the English line is right below); ponder questions get no answers (A9). the project file is 项目文件, without adding pyproject.toml; the quick start is 快速入门, without adding QUICKSTART.md.'
- '[D6] Fixed phrases. Pause, and do both. → 暂停一下，把两件事都做了。 pause, and get to this prompt → 暂停一下，走到这个提示符 pause, and load yours → 暂停一下，加载你自己的 Pause here, and run step 1 with your key. → 在这里暂停，用你的密钥跑第 1 步。 Pause and tear down. → 暂停一下，把它拆掉。 Pause, and set up yours. → 暂停一下，把你的设置好。 Pause, and get your sync to succeed. → 暂停一下，让你的 sync 跑成功。 Pause, and get the dev UI open on baseline. → 暂停一下，在 dev UI 里打开 baseline。 pause, and plan a trip → 暂停一下，规划一次旅行 Pause, and run the MCP cells. → 暂停一下，把 MCP 的单元格跑一遍。 pause, and run the Guild → 暂停一下，跑一遍 Guild pause, and run the four turns → 暂停一下，把这四轮跑一遍 pause, and run the demo → 暂停一下，跑一遍演示 pause, and run the three lanes → 暂停一下，把三条通道都跑一遍 Pause, and run the seven steps. → 暂停一下，把这七步跑一遍。 pause to run the setup → 暂停一下，把准备工作跑一遍 Pause at each yellow your-turn tag, and run the command. → 看到黄色的 your turn 标签就暂停，自己跑一遍命令。 With your key, look for … → 有密钥的话，要找的是…… With your key, ask the agent to list files. → 有密钥的话，让 agent 列出文件。 An extra check from a second terminal: → 在第二个终端里做一个额外检查： An extra check, … → 额外检查一下：…… An extra one-liner / An extra script / An extra request / Another extra request / Extra curl commands / An extra grep / An extra ls / an extra curl / An extra get command / an extra docker ps / An extra git status → 一行额外的命令 / 一个额外的脚本 / 一个额外的请求 / 另一个额外的请求 / 额外的几条 curl 命令 / 额外的 grep / 额外的 ls / 额外的 curl / 一条额外的 --get 命令 / 再用一条额外的 docker ps / 额外的 git status. which isn''t in the README either → 这也不在 README 里; a question the README doesn''t mention → 一个 README 里没提的问题. Step N: → 第 N 步：; Now the agents section, step 1: → 现在是 Agents 一节的第 1 步：; Running agents, step 1, … → Running Agents 一节的第 1 步，……. at the time of recording → 录制时. A small slip … → 一个小疏漏…… (A9). Here''s what the staff saw. → 下面是课程团队看到的。 In the staff''s saved run, … → 在课程团队保存的运行里，…… Test yourself. → 自测一下。 One: … Five: → 第一题：……第五题：. Answers and every command are in the exercises and the study guide. → 答案和每条命令都在练习和学习指南里。 Next lecture: the harness itself. → 下节课：harness 本身。 In part 2, … → 第二部分，…… Part 2: … → 第二部分：……'
- '[D7] Files. narration/g1.yaml = S01-S08 (part 1: what an agent is, and function calling by hand; 78 blocks, 172 sentences), narration/g2.yaml = S09-S16 (part 2: frameworks own the loop; 75 blocks, 165 sentences), video.yaml''s two parts; each file opens with a comment (coverage; the rules it applies: A6 spaced names, B3 symbols in words, C1 numbers without separators, C2 model IDs, D4 en_display, no say: / anchors:) and keeps the script''s order. Double-quoted strings; escape a literal double quote or backslash for YAML.'
- '[D8] Length on the English timing. The Chinese is read while the English plays; the band switches where the English cues switch (a Chinese piece that reads faster than 9 units/s gets at most 1 s more). Each Chinese sentence should read in about the time the English sentence is heard: at most about 2 units per English word (a Hanzi counts 1, a Latin letter 0.55), so drop redundant connectives and repeated subjects, never content. Long artifacts cost length too (llm-agent-google-adk 11 units, gemini-3.1-flash-lite 11.6, cheese making importance location 18.2, python cli.py --agent 11.6, adk telemetry disable 11.6): don''t repeat them where the English doesn''t; after the first mention in a block, use a short reference (这个 repo, 这个函数, 这条命令, 这个模型).'
- '[D9] Keep the English clause order (a series lesson, ac215-video skill). The toolkit pairs Chinese and English clause by clause, so a Chinese sentence that puts a condition first (如果……，就……) swaps meaning between two neighbouring cues. Conditions, purposes and time adverbials sit where the English has them: an English condition first stays first (if imports fail later, rerun it → 如果后面 import 失败，就……再跑一次); with the main clause first in English, the Chinese keeps the main clause first or puts the condition inside the same clause with no comma before the main verb (So this step fails whenever uv picks 3.15 → 所以这一步只要 uv 选中 3.15 就会失败; replan if it rains or a flight is late → 并且在下雨或航班延误时重新规划; Swap those two roles before comparing → 先把这两个角色对调，再去比较).'
- '[G1] Width. Bilingual band: Chinese line at most 30 units, English line 96 characters; Chinese-only subtitles (.zh.srt) 22 units a line, 2 lines a cue. Write clauses of at most about 24 units separated by ，；： so the splitter has clean cut points; avoid an unpunctuated clause over 30 units (cheese making importance location alone is 18.2 units: give it a clause of its own).'
- '[G2] Cue endings: the toolkit strips a cue''s final 。，、；： and keeps ？！…… and a closing ” (subtitles.strip_end). Prefer a Chinese word over ''artifact + full stop'' at the end of a sentence where it reads as well (……复制成 .env 文件。 reads steadier than ……复制成 .env。; both are valid).'
- '[G3] Never split a command. The splitter treats a space between two Latin words in a Chinese line as a good cut point, so uv run adk web could land on two lines and the viewer could not copy it. Put the whole command at the end of a clause, after a full-width colon (第 3 步：sh docker-shell.sh。; 然后安装：uv sync。; 修复办法是一条额外的命令：uv python pin 3.13。), at most one command per cue, with little Chinese around it. A command with an underscore name is not written whole: split it into command and remark by A6 (python cli.py --agent，chunk type 用 char-split); a command too long for a line is named the way the SAY names it, and the terminal and the English line show it. Check every cue with a command in the rendered .zh.srt.'
- '[H1] Titles (meta.yaml). Video, part and chapter titles use the written register (A4: 容器, 仓库, 克隆, 智能体, 会话, 提示词); questions keep their question mark; the English colon structure is kept (第 1 次调用：……; ADK：……; harness：……); commands, folder and file names stay as they are (adk web in lower case, as L1''s apt、git 和仓库; meta.yaml is not read by the checker, so brackets and underscores are fine there). Core-concept chapters carry their English short name for search, as L1, L3 and L5 do: 智能体（agent）, 会话（session）. LLM: Agents I → LLM 智能体 I (as L2''s 容器 I); part 1 what an agent is, and function calling by hand → 智能体是什么，以及手写函数调用; part 2 frameworks own the loop → 循环交给框架; the harness → harness.'
- '[H2] Description (Bilibili / YouTube): two or three sentences, written register, this glossary''s terms: AC215 lecture 6''s follow-along of dlops-io/llm-rag''s Agents section, dlops-io/llm-agent-google-adk and three Colab notebooks; what the viewer does and learns (base LLM vs reasoning workflow vs agent, every call a stateless envelope; function declarations, function calls, the two calls and the thought signature; the agent loop, its stop rule and turn caps; ADK setup, uv sync failing on Python 3.15 and uv python pin 3.13, folder names, Runner, session and state; MCP; three ways to orchestrate; the harness: a Python-computed budget, an approval gate only a human opens, success judged by a receipt on disk); English narration with Chinese and bilingual subtitles; terminal output recorded on 2026-10-18 without any keys, so the model answers are the staff''s saved outputs, and the key-dependent steps show the command, the real error and what to look for.'
- '[H3] Companions: i18n/zh/README.md (and exercises.md / digest.md if made) are translated with this glossary in the written register (仓库, 克隆, 提交, 容器, 镜像, 端口, 提示词, 系统提示词, 嵌入向量（embedding）, 集合（collection）, 智能体（agent）, 会话（session）, Colab 笔记本（notebook）, 函数声明, 函数调用, 函数响应, 模型上下文协议（MCP）, MCP 服务器（MCP server）, 护栏, 上下文工程); harness stays English in writing too and is explained once at its first use: harness（套在 agent 外面、由代码执行检查的一层）. Brackets and underscores are fine there (not checked). Headings and `<summary>答案</summary>` are translated. Close with a term table: English | the word used here | other common renderings (agent: 智能体 / 代理; function calling: 函数调用 / 工具调用; thought signature: 思维签名; session: 会话; harness: 外壳 / 驾驭框架; handoff: 移交 / 交接; guardrail: 护栏 / 防护栏; token: 词元 / 令牌).'
- '[H4] Code and commands in the companions stay byte for byte: code blocks, commands, file names and inline `code` are unchanged; only # comments and the surrounding prose are translated.'
- '[I1] (Request, open since L3) `explainer.i18n check` applies its spoken-text hygiene (_SPOKEN_BAD: brackets, maths symbols, letter_letter names) to the display line when a sentence has no say:. For a subtitles-only video (this series; no languages.zh.voice in video.yaml, voice: none in the glossary) those checks protect nothing and force A6 and B3 (most of all here: get_book_by_author, tool_config, mode="any", output_key, mcp_servers, needs_confirmation, apply_confirmation, send_email, GOOGLE_API_KEY=, Ctrl+C). Proposal: when the glossary''s voice is none, skip _SPOKEN_BAD for display-only sentences (keep the Latin-word, spacing and sentence-end checks). Then A6 and B3 become: copy the literal form.'
- '[I2] (To do, from L1 I3) `_cuts` in explainer/subtitles.py treats a space between Latin words in a Chinese line as a good cut point, so a command can be split (G3). Proposal: in a Chinese line, treat a run of Latin words separated only by spaces as unbreakable unless it alone exceeds a line.'
terms:
# ---------------------------------------------------------------- The lecture's frame: what an agent is
- en: 'agent / agents / an agent / the agent / the agent function / LLM agents / AI agent'
  zh_subtitle: 'agent / agent 函数 / LLM agent / 智能体（书面）'
  first_use: 'S02[6]：课上对 agent 的定义是：一个 LLM，给它指令和工具，它自己运行，直到任务完成。'
  note: 'A3: agent stays (the series list; L05 A13 announced it). Measure word 个. Never opens a sentence: 这个 agent……, 而 llm-rag 的 agent…… (A5). Written register 智能体（agent）. LLM agents (ADK LlmAgent) → LLM agent; the agent function → agent 函数.'
- en: 'LLM / LLMs / the model / base LLM / reasoning LLM / LLM core / the core / the same model'
  zh_subtitle: 'LLM / 模型 / 基础 LLM / 推理 LLM / LLM 核心 / 核心'
  first_use: 'S02[2]：第 1 条通道，基础 LLM：调用 gpt-4o 一次，一个回答，不到 3 秒。'
  note: 'LLM stays (A1 c; may open a sentence, A5). LLMs are stateless functions → LLM 是无状态的函数 (no plural). LLM core (slides 27, 35, 41) → LLM 核心; the core → 核心.'
- en: 'reasoning engine / reasoning workflow / reasoning model / multi-call system / orders the calls'
  zh_subtitle: '推理引擎 / 推理工作流 / 推理模型'
  first_use: 'S02[4]：这里由你的 Python 安排调用顺序，所以它是推理工作流，不是推理模型。'
  note: 'Slides 16-18. The lecture calls a multi-call system a reasoning engine → 课上把这种多次调用的系统叫作推理引擎.'
- en: 'its five blocks / building blocks / instructions / tools / memory / dynamic control / anatomy / gray out dynamic control'
  zh_subtitle: '组件 / 指令 / 工具 / 记忆 / 动态控制 / 结构图'
  first_use: 'S02[6]：它的五个组件里，有一个决定下一步：动态控制，也就是方向盘。'
  note: 'Slides 27-41. block → 组件, never 模块 (that is ADK''s module folders, A7); the lecture''s anatomy → 课上的 agent 结构图; gray out → 标成灰色. memory → 记忆, never 内存. In the lecture''s blocks → 对应课上的组件.'
- en: 'steering wheel / who steers / who holds the steering wheel / decides the next step'
  zh_subtitle: '方向盘'
  first_use: 'S02[7]：变的是谁掌方向盘，还有工具。'
  note: 'V1''s metaphor for dynamic control; one word: 方向盘.'
- en: 'lane / the three lanes / Lane 1 / Lane 2 / Lane 3 / run the three lanes'
  zh_subtitle: '通道'
  first_use: 'S02[7]：所以 agent 并不是更聪明的模型：三条通道用的是同一个模型。'
  note: 'The series'' lane (L05 review_spoken 16): 通道, measure word 条; Lane 1 → 第 1 条通道 (C1). Never 车道 or 赛道.'
- en: 'decision maker / hub / spokes / planner / the spoke to the tools / unroll'
  zh_subtitle: '决策者 / 轮毂 / 辐条 / 规划器'
  first_use: 'S08[3]：把通向工具的那根辐条展开，就成了一个循环。'
  note: 'Slide 41''s picture, our metaphor (review_spoken 7.1: spoke is a noun). The lecture''s planner node → 规划器; the lecture''s travel planner (S11[5]) is 课上的旅行规划 (A7).'
- en: 'live systems / tools that act / the autonomy to decide / act / neither can act'
  zh_subtitle: '实时系统 / 自主性 / 行动'
  first_use: 'S01[3]：缺的是：实时系统、能行动的工具，以及自主决定的能力。'
  note: 'Slides 20-22.'
- en: 'plan five days in Paris / replan / it rains / a flight is late / the lecture''s trip / a bigger version'
  zh_subtitle: '巴黎 / 重新规划 / 航班延误 / 旅行'
  first_use: 'S01[2]：课上问的是一个更大的版本：规划在巴黎的五天，并且在下雨或航班延误时重新规划。'
  note: 'Place names in Chinese (巴黎, 加州). The condition stays inside its clause, with no comma before the main verb (D9). rehearses the lecture''s trip → 演练的就是课上那趟旅行.'
- en: 'RAG / a straight line / retrieval / the lecture''s recap / steps around the search / whether to retrieve / grading / rewriting / web search'
  zh_subtitle: 'RAG / 检索 / 评分 / 改写 / 网页搜索'
  first_use: 'S04[0]：课上的回顾让检索更聪明：搜索前后的步骤、到底要不要检索、评分、改写，还有网页搜索。'
  note: 'L05''s words (检索, 改写). steps around the search → 搜索前后的步骤 (L05''s 检索前 / 检索后). grade their retrieval → 给检索结果打分.'
- en: 'agentic RAG / Agentic RAG / Self-RAG / Corrective RAG / puts a model in front of that menu'
  zh_subtitle: 'Agentic RAG / Self-RAG / Corrective RAG'
  first_use: 'S04[1]：Agentic RAG 把一个模型放在这份菜单前面，让它来选。'
  note: 'The slides'' names (slides 9-14), as Chinese engineers say them; may open a sentence. Never 代理式 RAG in a subtitle.'
- en: 'data tools / action tools / orchestration tools / the three families / hand work to another agent'
  zh_subtitle: '数据工具 / 行动工具 / 编排工具'
  first_use: 'S12[0]：课上把工具分成三类。'
  note: 'Slide 51. like finalizing a trip or sending email → 比如敲定行程或者发邮件 (plain verbs here, not the tool names).'
- en: 'handoffs / agents as tools / lecture 7 sketches handoffs'
  zh_subtitle: '交接'
  first_use: 'S13[7]：这些教程是把 agent 当工具用；第 7 讲会简单讲讲交接。'
  note: 'Chinese (the OpenAI Agents SDK''s Chinese docs say 交接); never handoff in a subtitle.'
- en: 'deep research / tree of agents / lead agent / parallel web searchers / synthesis / report'
  zh_subtitle: '深度研究 / 主 agent / 汇总 / 报告'
  first_use: 'S13[0]：教程搭了类似的树：Cheese Quiz Guild，还有简报。'
  note: 'Slides 44-49. a lead agent, a planner, parallel web searchers, and a synthesis into a report → 一个主 agent、一个规划器、几个并行的网页搜索 agent，最后汇总成一份报告.'
- en: 'success criteria / guardrails / hard guardrail / soft guardrail'
  zh_subtitle: '成功标准 / 护栏 / 硬护栏 / 软护栏'
  first_use: 'S14[7]：课上把成功标准放在指令里，把护栏放在决策者里。'
  note: 'Slides 36-37.'
- en: 'context engineering / the craft / next lecture names the craft'
  zh_subtitle: '上下文工程'
  first_use: 'S03[4]：下节课会给这门手艺起个名字：上下文工程。'
  note: 'Standard Chinese.'
- en: 'harness / the harness / outer layer / the harness itself / a harness run'
  zh_subtitle: 'harness / 外层'
  first_use: 'S15[5]：下节课把这个外层叫作 harness。'
  note: 'A3: stays English: no settled Chinese term, and it is L07''s topic (dlops-io/agent-harness). Written register keeps harness; the companions gloss it once (H3). Lower case, never opens a sentence: 现在来看 harness.'
- en: 'framework / frameworks own the loop / the framework''s loop / a framework writes it for you'
  zh_subtitle: '框架'
