# QLoRA" (Qwen3 0.6B, NF4 4-bit loading, LoRA r = 8 on the query and value projections, 1,146,880 trainable parameters,
# 450 steps, loss and perplexity before and after, adapters, merge, push); BRIEF.md and script.md v2. Recorded October 31,
# 2026 without a service-account key and without a GPU (script.md S01[6]): every README command ran as written in its
# container, the ones that reach Google stop at the missing key, the working outputs are the README's documented ones
# (expected) and the course staff's saved A100 Colab run (recorded). Paste the chapter timestamps from
# output/chapters.txt and the study guide, tutorial repo and Ed links (video.yaml course:) under it when uploading.
description: |
  AC215（哈佛 MLOps & LLMOps）第 8 讲“LLM 微调”的跟练视频，分两条路线：路线 A 照着 dlops-io/llm-finetuning 的 README，在两个 Docker 容器里让教师模型 Gemini 批量生成一份人设问答数据集，整理成 CSV 和 Gemini 要求的 JSONL，上传到你自己的存储桶，再交给 Google 托管的 Gemini 微调任务，通过端点（endpoint）和微调后的模型对话；路线 B 在课程的 Colab 笔记本“Tutorial - Finetuning with QLoRA”里亲手微调 Qwen3 0.6B：从全参数微调的 120 GB 显存账单讲起，拆解量化（absmax、按块常数、NF4、双重量化）、LoRA 的低秩更新（W₀ 加上 B 乘 A，只训练 115 万个参数）和 QLoRA 的训练设置，用 loss 和困惑度评估，最后保存适配器（adapter）、合并模型并清理资源。贯穿全片的结论是：微调教会的是口吻，不是事实——风格学得会，事实没有保证。英文旁白，配中文和中英双语字幕；终端输出录于 2026-10-31，录制时没有服务账号密钥，也没有 GPU，所以每条 README 命令都照原样真实运行，连接 Google 的命令停在缺少密钥这一步，正常运行时的输出来自 README 的说明和课程团队保存的 A100 Colab 运行。
