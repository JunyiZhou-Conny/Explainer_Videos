# zh narration for S01-S09 (part 1, group g1: track A, Gemini writes a persona dataset and a managed tuning job
# trains on it), sentence-aligned to script.md v2: one zh sentence per English sentence
# (explainer.voice.split_sentences; 66 SAY lines, 192 sentences). Terms and rules: ../GLOSSARY.md,
# ../glossary.yaml (binding).
# Subtitles only: there is no Chinese voice in this series, so no say: and no anchors (rule D2); the zh line is
# shown on the English timing, so each sentence keeps the English order of ideas and about its length (D8, D9:
# S03[2] and S07[7] keep the condition where the English puts it, S09[2] keeps 否则 after 把它贴到那里).
# Underscore names and code expressions are written the way the SAY speaks them (rule A6: drop duplicates,
# train test split, wait for job 设为 false, 迭代次数); no brackets and no symbols the checker refuses (B2, B3:
# 0 乘 0, 19 乘 2). Numbers as on screen without thousands separators, million / billion as 万 / 亿 (C1: 16444,
# 1000, 5.96 亿, 115 万); money in 美元 / 美分 and model names as the SAY says them (C2: 2 美元, 0.008 美元,
# 112.73 美元, 57 美分, Gemini 3.1 Flash Lite, Gemini 1.5 Flash, OPT 350m). Commands sit at the end of a clause,
# after a full-width colon (G3). Sentences never open with an artifact or a lower-case kept-English word (A5).
# The persona's name never appears: 授课老师 / 授课老师的口吻 (A10); generated sentences are translated inside “”.
# The ponder lead-ins (S05[6], S08[8]) give nothing away (A9).
# en_display: the English subtitle line where the SAY spells an artifact as words (rule D4: source: not found,
# /app, /secrets, --rm, /.venv, ls -la /secrets, python cli.py --help / --generate / --prepare / --upload /
# --train / --chat, .json.json, $2, KeyError: 'question', drop_duplicates, train_test_split, git status,
# DefaultCredentialsError, Uploading file, docker ps -a, Training job started, Tuned model info: None,
# wait_for_job=False, $0.008, $112.73); null = the SAY text.
S01:
- en: "Why is the sky blue? We asked two versions of the same small language model. Both answers come from the course staff's saved Colab run."
  zh:
  - "天空为什么是蓝色的？"
  - "我们问了同一个小语言模型的两个版本。"
  - "两个回答都来自课程团队保存的 Colab 运行。"
- en: "The original answers like a textbook. The fine-tuned one opens with a cheesy greeting in the instructor's voice, and then explains."
  zh:
  - "原版的回答像教科书。"
  - "微调后的那个，开口先来一句奶酪味十足的问候，用的是授课老师的口吻，然后才解释。"
- en: "Now check the physics. One blames refraction, the other water molecules. Both are wrong: air molecules scatter blue light more than red. The voice changed completely; the facts did not get better."
  zh:
  - "再看物理。"
  - "一个怪折射，另一个怪水分子。"
  - "两个都错了：空气分子对蓝光的散射比对红光更强。"
  - "口吻完全变了；事实却没有变好。"
- en: "Chat models learn their habits the same way; the lecture shows one that starts with the words, sure, here's. This one kept 596 million weights frozen and trained 1.15 million new ones. It took about 3 and a half minutes on an A100, and fits in a file of about 4.6 megabytes."
  zh:
  - "聊天模型的习惯也是这样学来的；课上展示过一个，开口总是 Sure, here's。"
  - "这个模型冻结了 5.96 亿个权重，只训练了 115 万个新的。"
  - "在 A100 上用了大约三分半钟，存下来的文件大约 4.6 MB。"
- en: "So what did it learn, and what didn't it? Two tracks answer that. In track A, the README, Gemini writes a persona dataset and Google tunes Gemini for you. In track B, the course Colab, you fine-tune an open model yourself and keep the weights."
  zh:
  - "那它学到了什么，又没学到什么？"
  - "两条路线来回答这个问题。"
  - "路线 A 走 README：由 Gemini 写一份人设数据集，再由 Google 替你微调 Gemini。"
  - "路线 B 走课程的 Colab：你自己微调一个开源模型，权重留在你手里。"
- en: "The tracker, top left, shows the step; the gray tag, top right, shows the lecture slides. When a tag says your turn, pause and run the command."
  zh:
  - "左上角的进度条显示当前步骤；右上角的灰色标签指向课件。"
  - "看到标签写着 your turn，就暂停，自己跑这条命令。"
- en: "One honest limit: we recorded this on October 31, 2026, with no service account key and no GPU. Every README command ran exactly as written; the ones that talk to Google stop at the missing key, and we keep those real errors. Working outputs come from the README and the saved Colab run."
  zh:
  - "有一个限制要说清楚：这段是 2026 年 10 月 31 日录的，没有服务账号密钥，也没有 GPU。"
  - "README 里的每条命令都照原样跑了；要连 Google 的命令都停在缺少密钥这一步，这些真实的报错我们都保留了。"
  - "正常运行的输出来自 README 和课程团队保存的 Colab 运行。"
S02:
- en: "There are three ways to change what a model says. A prompt changes the input every time you ask. Retrieval, the RAG app from lecture 5, adds looked-up text to the input. Both leave the model itself untouched."
  zh:
  - "要改变模型说的话，有三种办法。"
  - "一个 prompt，在你每次提问时改变输入。"
  - "检索，也就是第 5 讲的 RAG 应用，把查到的文本加进输入。"
  - "这两种都不碰模型本身。"
- en: "Fine-tuning turns the third dial: it changes the weights, by showing the model many examples of an input and the output you want. In this course that usually means instruction fine-tuning: pairs of an instruction and its answer. A persona is a task-specific fine-tune."
  zh:
  - "微调转的是第三个旋钮：它改的是权重，办法是给模型看大量的例子，每个例子是一个输入加上你想要的输出。"
  - "在这门课里，通常指的是指令微调：一条指令和它的回答，成对出现。"
  - "人设属于针对特定任务的微调。"
- en: "Compare a model that was never instruction-tuned. The notebook gives OPT 350m the words, hello, my cheese name is. It simply keeps going: my cheese name is cheese, I'm not sure if you're joking or not."
  zh:
  - "对比一个从没做过指令微调的模型。"
  - "这个 notebook 给 OPT 350m 的开头是：“你好，我的奶酪名字是”。"
  - "它就这么接着往下写：“我的奶酪名字是奶酪，我不确定你是不是在开玩笑”。"
- en: "An instruction-tuned model answers instead of continuing, often with a habit like, sure, here's. Our fine-tuned Qwen answers the way the instructor would. That's the lesson of the saved run: style is learnable; facts are not guaranteed."
  zh:
  - "经过指令微调的模型会回答，而不是续写，常常还带着一个习惯，比如 Sure, here's。"
  - "我们微调后的 Qwen，会以授课老师的方式回答。"
  - "这就是保存的那次运行给我们的一课：风格学得会；事实没有保证。"
- en: "A useful mental model: fine-tuning moves the model's default voice; RAG changes the open book on its desk. In track A, Google trains the model and you never see a weight. In track B, you train a small adapter on a Colab GPU, and it is yours to save."
  zh:
  - "一个好用的理解方式：微调动的是模型默认的口吻；RAG 换的是它桌上摊开的那本书。"
  - "路线 A 里，Google 训练模型，你一个权重都看不到。"
  - "路线 B 里，你在 Colab 的 GPU 上训练一个小 adapter，存下来就是你的。"
S03:
- en: "Start in your workspace, the AC215 folder, with Docker installed and running. The README only links the repository, so cloning it is an extra step. Your prompt shows your own user name and machine."
  zh:
  - "从你的工作区开始，也就是 AC215 目录，Docker 要装好并且在运行。"
  - "README 只给了 repo 的链接，所以 clone 它算是额外的一步。"
  - "你的提示符显示的是你自己的用户名和机器名。"
- en: "Recorded at the commit on screen; yours may be newer. Inside are two folders, dataset-creator and gemini-finetuner, each with the same six files. The autotrain folder is not part of the README, so leave it alone."
  zh:
  - "录制时用的是画面上的 commit；你的可能更新。"
  - "里面有两个目录，dataset-creator 和 gemini-finetuner，各有同样的六个文件。"
  - "这个 autotrain 目录不在 README 里，所以别动它。"
- en: "Step 2 happens in the cloud console. Create a service account called llm-service-account with two roles: Storage Admin, and Agent Platform User, formerly Vertex AI User. Under keys, add a JSON key, which downloads to your laptop. If you kept the account from lecture 5, reuse it."
  zh:
  - "第 2 步在云控制台里做。"
  - "创建一个叫 llm-service-account 的服务账号，给它两个角色：Storage Admin，以及 Agent Platform User，以前叫 Vertex AI User。"
  - "在密钥那一页添加一个 JSON 密钥，它会下载到你的笔记本上。"
  - "如果你留着第 5 讲的那个账号，就直接复用。"
- en: "Step 3: make a folder called secrets next to the repository, not inside it. Move the key in and name it exactly llm-service-account.json; with hidden file extensions it can end up as dot json dot json. Ours stays empty on purpose. Watch what that does."
  zh:
  - "第 3 步：在 repo 旁边建一个叫 secrets 的目录，不要建在 repo 里面。"
  - "把密钥移进去，名字必须正好是 llm-service-account.json；如果隐藏了文件扩展名，它可能会变成 .json.json。"
  - "我们的故意留空。"
  - "看看这会怎样。"
  en_display:
  - null
  - "Move the key in and name it exactly llm-service-account.json; with hidden file extensions it can end up as .json.json."
  - null
  - null
- en: "Why next to the repository? A key outside the clone can never be committed by accident. The env.dev file looks two folders up from wherever the script runs, so both container folders reach the same key."
  zh:
  - "为什么放在 repo 旁边？"
  - "放在 clone 外面的密钥，永远不会被不小心 commit 进去。"
  - "这个 env.dev 文件从脚本运行的位置往上找两级目录，所以两个 container 目录拿到的是同一个密钥。"
- en: "An extra step 4, implied by the file's own comments: in env.dev, set your own project ID and bucket name on lines 6 and 7. The scripts pass both into the containers."
  zh:
  - "额外的第 4 步，是这个文件自己的注释暗示的：在 env.dev 的第 6、7 行填上你自己的项目 ID 和 bucket 名称。"
  - "脚本会把这两项传进 container。"
- en: "The README also assumes the Agent Platform and Storage APIs are enabled, and a bucket of your own. Bucket names are global, and cheese-dataset belongs to the course. Pause here and finish all four steps."
  zh:
  - "README 还默认你已经启用了 Agent Platform 和 Storage 的 API，并且有一个你自己的 bucket。"
  - "每个 bucket 的名称都是全局唯一的，cheese-dataset 是课程的。"
  - "在这里暂停，把四步都做完。"
S04:
- en: "Step 1 of the dataset section: go into the dataset-creator folder. Step 2: sh docker-shell.sh. The first build installs everything. Here it took 45 seconds on a fast connection; expect a few minutes. If you see source, not found, the fix is coming."
  zh:
  - "数据集那一节的第 1 步：进入 dataset-creator 目录。"
  - "第 2 步：sh docker-shell.sh。"
  - "第一次构建会把所有东西装好。"
  - "这里网速快，用了 45 秒；你那边可能要几分钟。"
  - "如果看到 source: not found，修法马上就讲。"
  en_display:
  - null
  - null
  - null
  - null
  - "If you see source: not found, the fix is coming."
- en: "What did the script do? It reads env.dev, builds the image, and runs it with two folders mounted: this folder becomes slash app, and your secrets folder becomes slash secrets. Three variables carry the key's path, your project and your bucket. The dash dash rm flag removes the container when you exit."
  zh:
  - "这个脚本做了什么？"
  - "它读取 env.dev，构建 image，再挂载两个目录运行它：这个目录变成 /app，你的 secrets 目录变成 /secrets。"
  - "三个环境变量分别带着密钥的路径、你的项目和你的 bucket。"
  - "这个 --rm 参数会在你退出时删掉 container。"
  en_display:
  - null
  - "It reads env.dev, builds the image, and runs it with two folders mounted: this folder becomes /app, and your secrets folder becomes /secrets."
  - null
  - "The --rm flag removes the container when you exit."
- en: "Read the banner kindly: it says activated before the activation line runs, and the prompt never shows an app prefix. Both are harmless; an extra check shows Python comes from slash dot venv, and your settings arrived. The part after app and the at sign is the container ID; yours will differ."
  zh:
  - "对横幅宽容一点：激活那一行还没运行，它就说已激活，提示符也从来不显示 app 前缀。"
  - "两个都无害；额外检查一下，Python 来自 /.venv，你的设置也都传进来了。"
  - "提示符里 app 和 @ 符号后面那一段，就是 container ID；你的会不一样。"
  en_display:
  - null
  - "Both are harmless; an extra check shows Python comes from /.venv, and your settings arrived."
  - null
- en: "Step 3 is the README's tip: ls dash la slash secrets, inside the container. With a key, you'd see llm-service-account.json here. Ours shows only the folder itself, on purpose."
  zh:
  - "第 3 步是 README 的提示：在 container 里运行 ls -la /secrets。"
  - "有密钥的话，你会在这里看到 llm-service-account.json。"
  - "我们的只显示目录本身，是故意的。"
  en_display:
  - "Step 3 is the README's tip: ls -la /secrets, inside the container."
  - null
  - null
- en: "Step 4: python cli.py dash dash help. Three flags: generate, prepare and upload. It works without a key, because the code only looks for credentials when it first calls Google. Pause, and get to this prompt."
  zh:
  - "第 4 步：python cli.py --help。"
  - "三个参数：generate、prepare 和 upload。"
  - "没有密钥也能用，因为代码只在第一次调用 Google 时才去找凭据。"
  - "暂停一下，走到这个提示符。"
  en_display:
  - "Step 4: python cli.py --help."
  - null
  - null
  - null
- en: "Two traps, shown as extras from a second terminal. On Debian, Ubuntu or WSL, sh is dash, which has no source command: run bash docker-shell.sh instead. And from the repository root, the script cannot find env.dev: cd into the folder first."
  zh:
  - "两个坑，作为额外的演示，在第二个终端里跑。"
  - "在 Debian、Ubuntu 或 WSL 上，sh 就是 dash，它没有 source 命令：改用 bash docker-shell.sh。"
  - "还有，在 repo 根目录下，脚本找不到 env.dev：先 cd 进这个目录。"
- en: "One more extra: docker images reports 1.64 gigabytes. The lockfile installs 133 packages, among them the RAG lecture's chromadb and langchain, which this code never imports."
  zh:
  - "再来一个额外的：用 docker images 看，有 1.64 GB。"
  - "这个 lock 文件装了 133 个包，其中有 RAG 那一讲的 chromadb 和 langchain，而这份代码从来不导入它们。"
S05:
- en: "The lecture's instruction dataset has three parts per example: an instruction, optional context, and the output you want. The tutorial drops the context: each example is a question and an answer. Who writes a hundred of them? Another model, a teacher."
  zh:
  - "课上讲的指令数据集，每个例子有三部分：一条指令、可选的上下文，以及你想要的输出。"
  - "教程去掉了上下文：每个例子就是一个问题加一个回答。"
  - "一百组这样的例子，谁来写？"
  - "另一个模型，也就是教师模型。"
- en: "Here the teacher is Gemini 3.1 Flash Lite, called in the global location. It gets a system instruction describing the persona, an input prompt asking for 20 pairs, and a JSON schema that fixes the answer's shape: question and answer objects."
  zh:
  - "这里的教师模型是 Gemini 3.1 Flash Lite，在 global 区域调用。"
  - "它拿到一段描述人设的系统指令，一个要 20 组问答的输入 prompt，还有一个 JSON schema，规定回答的形状：question 和 answer 两个字段。"
- en: "Step 1: python cli.py dash dash generate. With a key, it costs cents: the README estimates 2 dollars per 1,000 iterations. Without one, every batch prints the same line: the key file was not found. And yet the exit status is zero, which means success. Remember that zero."
  zh:
  - "第 1 步：python cli.py --generate。"
  - "有密钥的话，只花几美分：README 估计每 1000 次迭代 2 美元。"
  - "没有密钥的话，每一批都打印同一行：密钥文件找不到。"
  - "可退出码却是 0，也就是成功。"
  - "记住这个 0。"
  en_display:
  - "Step 1: python cli.py --generate."
  - "With a key, it costs cents: the README estimates $2 per 1,000 iterations."
  - null
  - null
  - null
- en: "Step 2 explains the system prompt, which lives in cli.py. It tells the teacher to open each answer with one of the instructor's catchphrases, such as good question, or glad you ask. And it asks for technical, passionate answers."
  zh:
  - "第 2 步讲的是 system prompt，它就写在 cli.py 里。"
  - "它要教师模型在每个回答开头用一句授课老师的口头禅，比如 good question，或者 glad you ask。"
  - "它还要求回答要专业、有激情。"
- en: "Step 3 is the input prompt, asking for 20 diverse pairs. Step 4: the number of iterations is a constant on line 170, not a flag; edit it for a bigger dataset. Temperature 0.9 adds variety, and the response schema makes Gemini return JSON in that shape."
  zh:
  - "第 3 步是输入 prompt，要 20 组各不相同的问答。"
  - "第 4 步：迭代次数是第 170 行的一个常量，不是参数；想要更大的数据集，就改它。"
  - "把 temperature 设成 0.9 是为了增加多样性，response schema 让 Gemini 按那个形状返回 JSON。"
- en: "With a key, the files would hold answers like the README's samples: Yello, this is the instructor, your cheese monker. A small slip: the README's prompt excerpt lists older openers than cli.py, but cli.py's own samples still open with Yello and Welcome. Expect a mix."
  zh:
  - "有密钥的话，这些文件里会是 README 样例那样的回答：“Yello，我是授课老师，你的 cheese monker”。"
  - "一个小疏漏：README 摘录的 prompt 列的开场白比 cli.py 的旧，但 cli.py 自己的样例还是以 Yello 和 Welcome 开头。"
  - "你会看到两样混着出现。"
- en: "One question before we move on. The prompt asks the teacher for specifics, such as optimal pH levels."
  zh:
  - "继续之前，先想一个问题。"
  - "这个 prompt 要教师模型给出具体细节，比如最适 pH 值。"
- en: "It becomes a training target. The student learns to say it, confidently, in the instructor's voice. Synthetic data carries the teacher's mistakes, so check what the teacher wrote."
  zh:
  - "它会变成训练目标。"
  - "学生模型学着把它说出来，说得很自信，用的是授课老师的口吻。"
  - "合成数据会带上教师模型的错误，所以要检查教师模型写了什么。"
S06:
- en: "Now step 1 of the prepare section, as a student would type it right after that run: python cli.py dash dash prepare. Zero errors, a shape of zero by zero, and then a crash: key error, question, from line 243 of cli.py."
  zh:
  - "现在到 prepare 那一节的第 1 步，就像学生跑完刚才那条会直接敲的：python cli.py --prepare。"
  - "0 个错误，形状是 0 乘 0，然后崩溃：cli.py 第 243 行报 KeyError: 'question'。"
  en_display:
  - "Now step 1 of the prepare section, as a student would type it right after that run: python cli.py --prepare."
  - "Zero errors, a shape of zero by zero, and then a crash: KeyError: 'question', from line 243 of cli.py."
- en: "Trace it back. In generate, each batch runs inside a try block, and the except on line 200 catches any exception, prints it, and carries on. So no file was written, and the command still exited with zero."
  zh:
  - "往回追。"
  - "在 generate 里，每一批都在一个 try 块里运行，第 200 行的 except 会捕获任何异常，打印出来，然后继续。"
  - "所以一个文件都没写出来，这条命令却还是以 0 退出。"
- en: "Prepare found no files, built an empty table, and failed the first time it read the question column. The error was there all along; the catch-all only moved it one command later. Read the lines, not the exit code."
  zh:
  - "这次 prepare 没找到文件，就建了一张空表，第一次读 question 列就失败了。"
  - "错误一直都在；那个全捕获的 except 只是把它推迟到了下一条命令。"
  - "看输出的内容，别只看退出码。"
- en: "The fix is the key itself: put it in the secrets folder with the exact name, and check with ls dash la slash secrets."
  zh:
  - "修法就是密钥本身：把它放进 secrets 目录，名字要完全一致，再用这条命令检查：ls -la /secrets。"
  en_display:
  - "The fix is the key itself: put it in the secrets folder with the exact name, and check with ls -la /secrets."
- en: "So we can watch a real run, an extra: five hand-written files, tagged scripted, in exactly the shape Gemini returns. They hold 20 pairs, where Gemini would write about a hundred; your generate writes its own. Note the 1-byte CSV the failed run left behind."
  zh:
  - "为了看一次真实的运行，额外加一步：五个手写的文件，标着 scripted，形状和 Gemini 返回的完全一样。"
  - "里面一共 20 组，Gemini 会写一百组左右；你的 generate 会写出它自己的。"
  - "注意失败的那次运行留下的 1 字节 CSV。"
- en: "Now prepare again. Five files processed, zero errors, and a shape of 19 by 2. The last scripted pair repeats the first question on purpose, and drop duplicates on line 233 removed it. Every answer opens with a catchphrase."
  zh:
  - "现在再跑一次 prepare。"
  - "处理了五个文件，0 个错误，形状是 19 乘 2。"
  - "最后一组脚本数据故意重复了第一个问题，第 233 行的 drop duplicates 把它去掉了。"
  - "每个回答都以一句口头禅开头。"
  en_display:
  - null
  - null
  - "The last scripted pair repeats the first question on purpose, and drop_duplicates on line 233 removed it."
  - null
- en: "The rows are saved as instruct-dataset.csv: the lecture's term, in the file name. Pause, and run generate and prepare yourself."
  zh:
  - "这些行保存成 instruct-dataset.csv：文件名里用的就是课上的术语。"
  - "暂停一下，自己跑一遍 generate 和 prepare。"
S07:
- en: "Step 2 of prepare is about format. Follow one pair. It starts as a CSV row. Lines 241 to 247 glue it into one text with human and bot labels, the text column the repository's autotrain folder reads. Track A doesn't use that one."
  zh:
  - "接下来是 prepare 那一节的第 2 步，讲的是格式。"
  - "跟着一组问答走一遍。"
  - "它一开始是 CSV 里的一行。"
  - "第 241 到 247 行把它拼成一段文本，加上 human 和 bot 标记，也就是 repo 里 autotrain 目录读的那个 text 列。"
  - "路线 A 用不到它。"
- en: "Lines 251 to 257 build what Gemini tuning expects: a list called contents, with a user turn and a model turn, each holding parts and text."
  zh:
  - "第 251 到 257 行构造出 Gemini 微调要的格式：一个叫 contents 的列表，里面有 user 这一轮和 model 这一轮，每一轮都带着 parts 和 text。"
- en: "An extra look at the real train.jsonl: the same nesting as the README's example, but each example on a single line. That's the L in JSONL: JSON lines."
  zh:
  - "额外看一眼真正的 train.jsonl：嵌套方式和 README 的例子一样，只是每个样本只占一行。"
  - "这就是 JSONL 里的 L：JSON lines。"
- en: "Then train test split holds out 10 percent with a fixed seed: 17 examples for training, 2 for validation. The code's comment says Gemini accepts at most 256 validation examples, hence the cap."
  zh:
  - "然后 train test split 用固定的随机种子留出 10%：17 个样本用来训练，2 个用来验证。"
  - "代码注释说 Gemini 最多接受 256 个验证样本，所以才有这个上限。"
  en_display:
  - "Then train_test_split holds out 10 percent with a fixed seed: 17 examples for training, 2 for validation."
  - null
- en: "Whatever the wrapping, training is still next-word prediction, now on the instructor's answers."
  zh:
  - "不管外面怎么包装，训练的仍然是预测下一个词，只不过现在预测的是授课老师的回答。"
- en: "An extra from the laptop side: the bind mount left these files in your clone. Git status shows the data folder as ignored, so it stays out of your commits."
  zh:
  - "额外从笔记本这边看一眼：bind mount 把这些文件留在了你的 clone 里。"
  - "用 git status 看，data 目录是被忽略的，所以它不会进到你的 commit 里。"
  en_display:
  - null
  - "git status shows the data folder as ignored, so it stays out of your commits."
- en: "Next section, upload: python cli.py dash dash upload. This time it fails loudly, with a default credentials error: file not found. With a key, no output is documented. Look for one line per file starting with uploading file, five in all, then find them in your bucket."
  zh:
  - "下一节是 upload：python cli.py --upload。"
  - "这次它失败得很明显，报的是 DefaultCredentialsError：文件找不到。"
  - "有密钥的话，README 也没写会输出什么。"
  - "要找的是每个文件一行、以 Uploading file 开头的输出，一共五行，然后去你的 bucket 里找到它们。"
  en_display:
  - "Next section, upload: python cli.py --upload."
  - "This time it fails loudly, with a DefaultCredentialsError: file not found."
  - null
  - "Look for one line per file starting with Uploading file, five in all, then find them in your bucket."
- en: "A small slip: the README never says to create that bucket, and upload assumes it exists. Make it first. If you just changed env.dev, restart the container. Then pause and upload."
  zh:
  - "一个小疏漏：README 从没说要建这个 bucket，而 upload 默认它已经存在。"
  - "先把它建好。"
  - "如果你刚改过 env.dev，就重启 container。"
  - "然后暂停，上传。"
S08:
- en: "On to the fine-tune section. Type exit; the container removes itself, and an extra docker ps dash a shows nothing left. Step 1: go to the gemini-finetuner folder."
  zh:
  - "接下来是微调那一节。"
  - "输入 exit，container 会自己删掉；额外跑一个 docker ps -a，什么都没剩下。"
  - "第 1 步：进入 gemini-finetuner 目录。"
  en_display:
  - null
  - "Type exit; the container removes itself, and an extra docker ps -a shows nothing left."
  - null
- en: "An extra edit the README leaves out: lines 10 and 11 still point at the course bucket, cheese-dataset. Point them at your own. The folder is mounted into the container, so there's no need to rebuild."
  zh:
  - "README 漏掉了一个额外的修改：第 10、11 行还指向课程的 bucket，cheese-dataset。"
  - "把它们改成你自己的。"
  - "这个目录挂载进了 container，所以不用重新构建。"
- en: "Step 2: sh docker-shell.sh again. It's instant: every layer up to uv sync is cached, because both folders share the same Dockerfile, pyproject and lockfile, as an extra diff shows."
  zh:
  - "第 2 步：再跑一次 sh docker-shell.sh。"
  - "一下就好了：uv sync 之前的每一层都有缓存，因为两个目录共用同一个 Dockerfile、pyproject 和 lock 文件，额外跑一个 diff 就能看到。"
- en: "Step 3: python cli.py dash dash help shows two flags, train and chat. The train client creates tuning jobs in us-central1. The chat client calls the tuned model in the multi-region location US, at its own address."
  zh:
  - "第 3 步：python cli.py --help 显示两个参数，train 和 chat。"
  - "负责训练的客户端在 us-central1 创建微调任务。"
  - "负责聊天的客户端调用多区域 US 里的微调后的模型，用的是它自己的地址。"
  en_display:
  - "Step 3: python cli.py --help shows two flags, train and chat."
  - null
  - null
- en: "The train function wraps your bucket files as tuning datasets, and asks for one epoch and an adapter of size four. By our reading, that's Google's managed version of the idea you'll build in part 2. One call starts the job."
  zh:
  - "这个 train 函数把你 bucket 里的文件包装成微调数据集，要求跑一个 epoch，adapter 大小为 4。"
  - "按我们的理解，这就是你在第二部分要亲手搭的那个思路的 Google 托管版本。"
  - "一次调用就启动了这个任务。"
- en: "Step 1 of the fine-tune model section: python cli.py dash dash train. The experimental warning is harmless. Then the missing key: no job was created."
  zh:
  - "微调模型那一节的第 1 步：python cli.py --train。"
  - "实验性警告没有关系。"
  - "然后是缺少密钥：没有创建任务。"
  en_display:
  - "Step 1 of the fine-tune model section: python cli.py --train."
  - null
  - null
- en: "With a key, look for training job started, a job name in us-central1, and after a minute, tuned model info, none. Main calls train with wait for job set to false, so the command hands in the job and leaves, like a ticket at the dry cleaner. Read the cost table next, then pause and start your job."
  zh:
  - "有密钥的话，要找的是 Training job started、us-central1 里的一个任务名，一分钟后还有 Tuned model info: None。"
  - "这里 main 调用 train 时把 wait for job 设为 false，所以这条命令交了任务就走，就像在干洗店拿一张取衣单。"
  - "接下来看价格表，然后暂停，启动你的任务。"
  en_display:
  - "With a key, look for Training job started, a job name in us-central1, and after a minute, Tuned model info: None."
  - "Main calls train with wait_for_job=False, so the command hands in the job and leaves, like a ticket at the dry cleaner."
  - null
- en: "Training needs far more GPU memory than a laptop has; here that's Google's problem. Step 2: watch the job in the console until it says succeeded, with a tuned model and an endpoint."
  zh:
  - "训练需要的显存比笔记本多得多；在这里，那是 Google 要操心的事。"
  - "第 2 步：在控制台里盯着这个任务，直到它显示 succeeded，并且有了微调后的模型和一个 endpoint。"
- en: "A question to pause on."
  zh:
  - "暂停一下，想一个问题。"
- en: "On Google's hardware in us-central1, reading your bucket directly. Deleting the container loses nothing: it only submitted the job."
  zh:
  - "在 Google 位于 us-central1 的硬件上，直接读取你的 bucket。"
  - "删掉 container 不会丢任何东西：它只是提交了任务。"
S09:
- en: "Step 1 of the cost section: the README's table. At 0.008 dollars per thousand tokens, 16,444 documents over 3 epochs come to 112 dollars 73; the table calls that way too much data. 88 documents cost about 57 cents."
  zh:
  - "费用那一节的第 1 步：README 里的价格表。"
  - "按每千个 token 0.008 美元算，16444 个文档跑 3 个 epoch，一共 112.73 美元；表里说这数据太多了。"
  - "88 个文档大约 57 美分。"
  en_display:
  - null
  - "At $0.008 per thousand tokens, 16,444 documents over 3 epochs come to $112.73; the table calls that way too much data."
  - null
- en: "A small slip: the table prices Gemini 1.5 Flash for 3 epochs, while the code tunes Gemini 3.1 Flash Lite for 1. Treat these numbers as stale and check the pricing page the README links."
  zh:
  - "一个小疏漏：这张表算的是 Gemini 1.5 Flash 跑 3 个 epoch，而代码微调的是 Gemini 3.1 Flash Lite，跑 1 个。"
  - "这些数字就当是过时的，去看 README 链接的价格页面。"
- en: "Before you chat, one more extra edit. Line 107 still holds the instructor's endpoint. Copy yours from the console: a path ending in locations, US, endpoints and an ID. Paste it there; otherwise chat points at the instructor's endpoint, which your key can't reach."
  zh:
  - "聊天之前，还有一个额外的修改。"
  - "第 107 行写的还是授课老师的 endpoint。"
  - "从控制台复制你自己的：一个以 locations、US、endpoints 和一个 ID 结尾的路径。"
  - "把它贴到那里；否则 chat 会指向授课老师的 endpoint，你的密钥访问不了。"
- en: "Step 2: python cli.py dash dash chat. It prints its question, how is cheese made in Greece, answered the instructor's way. Then it prints the serving location, US, and the same missing key. Pause and run it once your endpoint is in."
  zh:
  - "第 2 步：python cli.py --chat。"
  - "它会打印它的问题，“希腊的奶酪是怎么做的”，用授课老师的方式回答。"
  - "然后打印部署区域 US，还有同样的缺少密钥。"
  - "暂停一下，填好你的 endpoint 之后跑一遍。"
  en_display:
  - "Step 2: python cli.py --chat."
  - null
  - null
  - null
- en: "The README shows a working endpoint's answer to an older question: the same Yello opener. Your answer will differ."
  zh:
  - "README 展示了一个能用的 endpoint 对一个旧问题的回答：开场白同样是 Yello。"
  - "你的回答会不一样。"
- en: "Step 3, the hosted demo, is optional. Step 4: the console's training monitor shows your job's loss curves and its data distribution."
  zh:
  - "第 3 步是托管的演示，可选。"
  - "第 4 步：控制台的训练监控会显示你这次任务的 loss 曲线和数据分布。"
- en: "That's track A: a teacher wrote the data, Google ran the job, and you have an endpoint to call. And you never saw a single weight. In part 2, the weights are in your hands."
  zh:
  - "这就是路线 A：教师模型写数据，Google 跑任务，你有一个 endpoint 可以调用。"
  - "而你一个权重都没见过。"
  - "第二部分，权重就在你自己手里了。"
