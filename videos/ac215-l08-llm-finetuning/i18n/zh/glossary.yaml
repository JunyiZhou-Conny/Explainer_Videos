  first_use: 'S15[1]：在 100 个测试样本、30681 个 token 上，基座模型的 loss 是 2.65，困惑度 14.15。'
  note: 'C1 digits without separators.'
- en: 'disable adapter / switch the adapter off / catastrophic forgetting / losing old skills while learning new ones / one switch away'
  zh_subtitle: 'disable adapter / 灾难性遗忘 / 开关'
  first_use: 'S15[2]：这正是课上讲灾难性遗忘时的要点，也就是学新本事时丢了旧本事；用 LoRA 的话，原来的模型只差一个开关。'
  note: 'A6: disable_adapter() → disable adapter (en_display restores). Slides 9-10, 36.'
- en: 'every base answer starts with the word the / welcome / Yello / an illustration / the measured numbers'
  zh_subtitle: 'The / 示意'
  first_use: 'S15[3]：那些柱子只是示意；实测的数字就在旁边。'
  note: 'The opener word as printed: 都以 The 开头 (A10).'
- en: 'What does the drop measure? / this style is what the model now expects'
  zh_subtitle: '风格'
  first_use: 'S15[4]：它说明这种风格是模型现在预期的，而不是它的回答更正确了。'
- en: 'the voice transferred, the physics did not'
  zh_subtitle: '口吻'
  first_use: 'S15[5]：再看天空：口吻学过去了，物理没有。'
  note: 'Pause, and run step 5 → 暂停一下，跑第 5 步 (D6).'
- en: 'a fresh 16-bit model / the baselines differ / a published benchmark / style fit / answer quality'
  zh_subtitle: '基线 / 基准测试 / 风格契合度 / 回答质量'
  first_use: 'S15[6]：两点友情提示。'
  note: 'baseline → 基线 (L07).'
# ---------------------------------------------------------------- Ship it, tear down, recap
- en: 'saves your work / the adapters / 4.6 megabytes in float 32 / your Drive / with the tokenizer'
  zh_subtitle: 'adapter / Drive / tokenizer'
  first_use: 'S16[0]：先存 adapter：1146880 个数，用 FP32 存大约 4.6 MB，连同 tokenizer 一起存到你的 Drive。'
- en: 'the merge / a fresh 16-bit copy of the base / round back onto 16 levels / the merged model / 1.2 gigabytes'
  zh_subtitle: '合并 / 合并后的模型'
  first_use: 'S16[1]：合并后的模型大约 1.2 GB。'
  note: 'Not into the 4-bit weights → 不是加进 4 位的权重里.'
- en: 'push / a private Hugging Face repository / ship / an adapter that needs its base / a merged model that stands alone / Google''s endpoint'
  zh_subtitle: 'push / Hugging Face / 交付'
  first_use: 'S16[2]：所以你可以交付三样东西：一个离不开基座的 adapter，一个能独立运行的合并模型，或者 Google 的 endpoint，权重不在你手里。'
  note: 'push stays (L02-L04); a private Hugging Face repository → 私有的 Hugging Face repo.'
- en: 'Teardown / docker image rm / delete the dataset folder / keep for lecture 10 / delete unused service account keys / disconnect and delete the Colab runtime'
  zh_subtitle: '清理 / docker image rm / 运行时'
  first_use: 'S16[3]：退出 container，用 docker image rm 删掉两个 image。'
  note: 'Teardown. → 清理。 Pause, and tear down. → 暂停一下，把它们都清理掉。 runtime → 运行时 (the menu words Disconnect and delete runtime stay where the screen is meant).'
- en: 'Here''s where we are / Five questions to test yourself / the study guide / the exercises / MLOps Learning / lecture 9 / lecture 10'
  zh_subtitle: '学习指南 / 练习 / MLOps Learning'
  first_use: 'S16[6]：学习指南和练习都在 MLOps Learning 里。'
  note: 'L05-L07. Here''s where we are → 回顾一下. en_display MLOps Learning → MLOps_Learning (D4).'
# ---------------------------------------------------------------- Course, names, products
- en: 'AC215 / the lecture / the lecture slides / the slide / the instructor / the staff / lecture n / part 1 / part 2'
  zh_subtitle: 'AC215 / 课件 / 授课老师 / 课程团队'
  first_use: 'S11[3]：课件上写的是 18 和 69；四舍五入应该是 19 和 70。'
  note: 'A10 (L01-L07). lecture n → 第 n 讲; the instructor → 授课老师, never named; the slide → 课件.'
- en: 'products: Google / Google Cloud / Gemini / Docker / Colab / Drive / Hugging Face / Qwen / OPT / TensorBoard / Python / uv / JSON / CSV / SDK / GPU / CPU / T4 / A100'
  zh_subtitle: 'Google / Google Cloud / Gemini / Docker / Colab / Drive / Hugging Face / Qwen / OPT / TensorBoard / Python / uv / JSON / CSV / SDK / GPU / CPU / T4 / A100'
  first_use: 'S10[0]：免费的 T4 就够了。'
  note: 'Latin script (A1 b). GPU measure word 块 (五块 GPU, 一块 T4).'
- en: 'at the time of recording / a small slip / two kind notes'
  zh_subtitle: '录制时 / 小疏漏'
  first_use: 'S10[2]：第 5 节导入这些库，打印版本，录制时是 torch 2.11 和 transformers 5.16，然后挂载你的 Drive。'
  note: 'A9: at the time of recording → 录制时, never dropped; a small slip → 一个小疏漏, always followed by the fix.'
