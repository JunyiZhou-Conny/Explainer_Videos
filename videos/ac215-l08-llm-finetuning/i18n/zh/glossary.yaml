# Chinese (zh-CN) glossary and translation rules for ac215-l08-llm-finetuning (AC215 lecture 8, LLM: Finetuning: a
# follow-along of dlops-io/llm-finetuning @ 44ef6f0, the whole README (track A: a persona dataset made with Gemini, then a
# managed Gemini tuning job), and the course Colab "Tutorial - Finetuning with QLoRA" (track B)), code-switching version,
# SUBTITLES ONLY. Audience: Chinese-speaking AC215 grad students who read technical English fluently; register of a Chinese
# MLOps TA running a lab section. Precedents and source of the shared decisions: the series pilot
# videos/ac215-l01-vms-venvs/i18n/zh (repo, clone, commit, pin, lock 文件, shell, 笔记本, 服务账号, 密钥, 来想一个问题), the
# container lectures ac215-l02-containers-1, ac215-l03-mega-pipeline, ac215-l04-flexible-workflow-ports (bucket, bind mount,
# 层, 退出码, the subtitles-only rule set this file follows), ac215-l05-rag (RAG, 检索, 语言模型, 权重, token, 横幅, 一个小疏漏),
# ac215-l06-agents-1 (微调, notebook, schema, temperature, 区域, 单元格, Colab's screen words) and ac215-l07-agent-harness
# (diff, 坑, 基线, 课程团队, the rule layout A1-I3). Every term L1-L7 already decided keeps its form; what is new here is the
# fine-tuning vocabulary (A3): the persona dataset and its teacher, the managed tuning job, the memory bill, quantization,
# LoRA, training and evaluation; plus endpoint (the series list's word, first used here), LoRA, QLoRA, PEFT, adapter, epoch,
# batch, loss, dropout, tokenizer, trainer, absmax and unscale in the closed English list.
# There is NO Chinese voice in this series: the Chinese lines are subtitles on the English timing (the bilingual band of
# output/<id>.zh-en.mp4, <id>.zh.srt, <id>.zh-en.srt / .ass). So no say:, no anchors, no readings, no durations, no rules
# about how numbers or symbols are spoken (L1's C2-C5 and F1-F6 are dropped): only display rules. But
# `python -m explainer.i18n check` still applies its voice hygiene to the displayed line when a sentence has no say:
# (brackets, maths symbols, letter_letter names, Latin words not listed here, a missing half-width space): rules A6, B3 and
# D3 are how the Chinese line stays clean without say:.
# Human-readable copy in Chinese: GLOSSARY.md (keep the two in sync; both term tables come from the same data).
# terms[].zh_subtitle = the subtitle form (titles and companions use A4's written register); terms[].first_use = one
# example sentence (SNN[k]: scene SNN, SAY block k counted from 0), each one passes the checker; terms[].note = rules.
# Read by: python -m explainer.i18n check (Latin words allowed in a subtitle line: every Latin word of zh_subtitle and
# first_use, plus allowed_spoken_latin) and explainer/subtitles.py (2-3 word English phrases of `en` are kept on one
# English line; 2-7 character Chinese headwords of zh_subtitle are registered in jieba; I3).
video: ac215-l08-llm-finetuning
lang: zh-CN (mainland Simplified Chinese)
audience: 'Chinese-speaking AC215 (MLOps & LLMOps) grad students who did L1-L7 (uv and lockfiles; containers, bind mounts and docker-shell.sh; L05''s RAG with the same llm-service-account and secrets folder; structured outputs), know basic ML (a loss, an optimizer, a training loop), have heard of LoRA but never fine-tuned an LLM. They follow along with their ~/AC215/llm-finetuning clone open and Docker running, optionally with a GCP project and key, and the course Colab Tutorial - Finetuning with QLoRA in another tab. Register of a Chinese MLOps TA running a lab section.'
voice: none          # subtitles only (video.yaml: Chinese = i18n/zh/narration/*.yaml on the English timing)
policy: 'The Mandarin of a Chinese MLOps TA walking a lab section through the steps, code-switching only where such a speaker really does, written as subtitles under an English narration. The viewers already say 起一个 container, 把 repo clone 下来, 写 prompt, 跑一下 notebook, 建一个 bucket, 看 diff, 这个 token; this lecture adds 训练一个 adapter, 跑 2 个 epoch, batch 大小 4, loss 降到 1.35, 调一个 endpoint, 用 LoRA / QLoRA, 加 dropout, 用 tokenizer 套模板. Every choice passes three tests: what is said in a real lab section; the standard, searchable Chinese name (the Chinese deep-learning literature: 微调, 全参数微调, 指令微调, 参数高效微调, 权重, 梯度, 优化器状态, 激活值, 梯度检查点, 量化, 反量化, 双重量化, 分位数, 秩, 低秩, 重参数化, 困惑度, 灾难性遗忘, 显存); and consistency with the series (L1 decided the shared words, L2-L4 the container and bucket words, L5 the RAG and model words, L6 微调, schema, temperature and 区域, L7 diff and 基线: every form they fixed is kept). (1) Artifacts verbatim: what the viewer types or matches on screen (commands, flags, file and folder names, paths, the service-account, bucket and location names, role names, error and printed text, JSON keys, package names, the model names, dtype names, the Colab screen words, README headings, the persona''s openers as the outputs print them, the on-screen tags) is copied letter for letter, never translated, inflected or quoted; the exceptions the checker forces are names with an underscore and the characters = + < > | ( ) [ ] α, written the way the narration says them (A6, B3). Nothing on screen is translated in this series: terminal output, code panels, README cards, recorded-output boxes, the schematic console and Colab drawings, tags, trackers, lecture tags, diagram labels and the ponder cards stay English; only the narration is. (2) Lab-speech English, a closed list: from L1 repo, clone, commit, pin, lock 文件, shell; from L2-L4 container, image, base image, pull, push, port, API, ID, token, Dockerfile, bucket, bind mount; from L5 prompt, system prompt, LLM, RAG, CLI, embedding; from L6 notebook, schema, SDK, temperature; from L7 diff; new in L08 endpoint (the series list''s word, first used here), LoRA, QLoRA, PEFT, adapter, epoch, batch (a training batch only), loss, dropout, tokenizer, trainer, absmax, unscale. (3) Everything else in standard Chinese: 微调, 全参数微调, 指令微调, 参数高效微调, 指令数据集, 数据集, 人设, 口吻, 开场白, 口头禅, 教师模型, 学生模型, 合成数据, 训练目标, 问答对, 风格, 事实, 权重, 参数, 可训练参数, 冻结, 基座模型, 预训练, 服务账号, 密钥, 角色, 控制台, 项目, 区域, 多区域, 系统指令, 输入, 输出, 上下文, 检索, 迭代, 退出码, 异常, 形状, 列, 行, 样本, 验证, 随机种子, 预测下一个词, 微调任务, 客户端, 托管, 显存, 内存, 梯度, 优化器, 优化器状态, 滑动平均, 激活值, 前向传播, 反向传播, 梯度检查点, 分页, 学习率, 序列, 量化, 反量化误差, 桶, 区间, 块, 常数, 分位数, 双重量化, 精度, 范围, 线性层, 输出头, 归一化层, 聊天模板, 前缀, 秩, 矩阵, 投影矩阵, 更新量, 正态分布, 均匀分布, 正则化, 困惑度, 灾难性遗忘, 基线, 基准测试, 合并, 交付, 清理, 价格表, 训练监控, 运行时, 单元格. (4) The video''s metaphors by meaning, one word each: 三个旋钮 (three dials), 桌上摊开的那本书 (the open book on its desk), 砖 and 模具 (bricks, mould), 传送带 and 带子 (conveyor, ribbon), 显存柱 (the memory column), 桶 (buckets), 细条 (strips), 开关 (the adapter switch), 干洗店的取衣单 (the dry-cleaner ticket). (5) Written register for titles, meta.yaml and companion docs: 容器, 镜像, 仓库, 克隆, 提交, 存储桶, 绑定挂载, 提示词, 系统提示词, 端点（endpoint）, 适配器（adapter）, 轮次（epoch）, 批次（batch）, 损失（loss）, 分词器（tokenizer）, 训练器（trainer）; LoRA, QLoRA, PEFT, NF4 stay. (6) The bilingual band puts the English sentence under every Chinese line, so the Chinese line carries no glosses and no brackets at all (the checker forbids them without say:). (7) The persona''s name never appears: the narration and the subtitles say the instructor → 授课老师 (A10). (8) The toolkit''s constraints are part of the policy: one Chinese sentence per English sentence (119 blocks, 357 sentences), a checker-clean display line (D3), an en_display wherever the SAY spells an artifact out as words (D4), the English clause order kept (D9). Mainland Simplified Chinese; relaxed, clear lab-section speech, never slangy.'
rules:
- '[A1] Code-switching scope. English stays in three places only. (a) Artifacts, copied letter for letter: commands and subcommands (git clone, cd, ls -la /secrets, sh docker-shell.sh, bash docker-shell.sh, python cli.py --help, python cli.py --generate, python cli.py --prepare, python cli.py --upload, python cli.py --train, python cli.py --chat, exit, docker ps -a, docker images, docker image rm, git status, uv sync, diff), flags (--generate, --prepare, --upload, --train, --chat, --help, --rm), file and folder names and paths (env.dev, cli.py, docker-shell.sh, Dockerfile, pyproject, llm-service-account.json, instruct-dataset.csv, train.jsonl, test.jsonl, dataset-creator, gemini-finetuner, autotrain, secrets, data, /app, /secrets, /.venv, .json.json), service-account, bucket and location names (llm-service-account, cheese-dataset, global, us-central1, US), role names (Storage Admin, Agent Platform User, Vertex AI User), error and printed text (KeyError: ''question'', source: not found, DefaultCredentialsError, Uploading file, Training job started, Tuned model info: None, succeeded), JSON keys and role values (contents, parts, text, user, model, assistant, question, answer), code names written the way the SAY says them (A6: drop duplicates, train test split, wait for job, prepare model for k-bit training, target modules, disable adapter, im start, im end; Linear4bit as printed), package names (transformers, bitsandbytes, trl, peft, torchao, chromadb, langchain, torch), Colab screen words (File, Save a copy in Drive, Runtime, Change runtime type, Secrets, Part A, Part B), the model names as said (Gemini 3.1 Flash Lite, Gemini 1.5 Flash, Qwen3 0.6B, OPT 350m), dtype names (NF4, FP16, BF16, FP32, fp16, bf16), the persona''s openers as the outputs print them (Yello, Welcome, good question, glad you ask, cheese lovers, cheese monker, The, Sure, here''s) and the on-screen tags the narration names (your turn, scripted). (b) Products, organisations, the course and names: AC215, Google, Google Cloud, Cloud Storage, Agent Platform, Vertex AI, Gemini, Docker, Colab, Drive, Hugging Face, Qwen, OPT, TensorBoard, Adam, Python, uv, Debian, Ubuntu, WSL, JSON, JSONL, CSV, SDK, GPU, CPU, T4, A100, README, MLOps Learning. (c) Words Chinese MLOps engineers really say in English in a lab section, a closed list: from L1 repo, clone, commit, pin, lock 文件, shell; from L2-L4 container, image, base image, pull, push, port, API, ID, token, Dockerfile, bucket, bind mount; from L5 prompt, system prompt, LLM, RAG, CLI, embedding; from L6 notebook, schema, SDK, temperature; from L7 diff; new in L08 endpoint (the series list''s word, first used here), LoRA, QLoRA, PEFT, adapter, epoch, batch (a training batch only), loss, dropout, tokenizer, trainer, absmax, unscale. A word joins (c) only when lab speech really uses the English and the Chinese is stilted or collides with another term. Never English for flavour: fine-tuning, weights, parameters, gradient, optimizer, quantization, rank, perplexity, persona, teacher, dataset, checkpointing, activations, merge, teardown and everything in this list are Chinese (A3): 微调, 全参数微调, 指令微调, 参数高效微调, 指令数据集, 数据集, 人设, 口吻, 开场白, 口头禅, 教师模型, 学生模型, 合成数据, 训练目标, 问答对, 风格, 事实, 权重, 参数, 可训练参数, 冻结, 基座模型, 预训练, 服务账号, 密钥, 角色, 控制台, 项目, 区域, 多区域, 系统指令, 输入, 输出, 上下文, 检索, 迭代, 退出码, 异常, 形状, 列, 行, 样本, 验证, 随机种子, 预测下一个词, 微调任务, 客户端, 托管, 显存, 内存, 梯度, 优化器, 优化器状态, 滑动平均, 激活值, 前向传播, 反向传播, 梯度检查点, 分页, 学习率, 序列, 量化, 反量化误差, 桶, 区间, 块, 常数, 分位数, 双重量化, 精度, 范围, 线性层, 输出头, 归一化层, 聊天模板, 前缀, 秩, 矩阵, 投影矩阵, 更新量, 正态分布, 均匀分布, 正则化, 困惑度, 灾难性遗忘, 基线, 基准测试, 合并, 交付, 清理, 价格表, 训练监控, 运行时, 单元格.'
- '[A2] container and image (as L2-L7). The subtitles say container, image, base image, bind mount, as a TA does in the lab: 构建 image, 启动 container, container ID, 重启 container, 删掉两个 image; measure word 个. mount → 挂载, build → 构建, layer → 层 (cached → 有缓存). Titles, chapter names, meta.yaml and companion docs write 容器, 镜像, 基础镜像, 绑定挂载 (A4).'
- '[A3] The fine-tuning vocabulary (new in this lecture). fine-tune → 微调 (L06; never fine-tune in a subtitle), full fine-tuning → 全参数微调, instruction fine-tuning → 指令微调, an instruction-tuned model → 经过指令微调的模型, parameter-efficient fine-tuning → 参数高效微调, PEFT stays. persona → 人设, voice (a way of speaking) → 口吻, catchphrases → 口头禅, openers → 开场白, teacher → 教师模型, student (a model) → 学生模型, synthetic data → 合成数据, training target → 训练目标, Q&A pair → 一组问答 / 问答对, next-word prediction → 预测下一个词. Memory: GPU memory → 显存, CPU memory → 内存, activations → 激活值, gradients → 梯度, optimizer states → 优化器状态, running averages → 滑动平均, gradient checkpointing → 梯度检查点, paging → 分页, forward / backward pass → 前向传播 / 反向传播. Quantization: quantization → 量化, buckets → 桶, range → 区间, dequantization error → 反量化误差, block → 块, constant → 常数, quantiles → 分位数, levels → 级别, double quantization → 双重量化, n-bit → n 位 (4 位存储，16 位计算), precision → 精度, range (of a float) → 范围. LoRA: rank → 秩, the update → 更新量, decompose → 分解, W naught → W₀, alpha over r → alpha 除以 r, B times A → B 乘 A, adapters → adapter, the query / value projection → query 投影 / value 投影, projections → 投影矩阵, a transformer block → 层, additive / selective / reparameterization → 加性 / 选择性 / 重参数化, dropout stays, regularization → 正则化. Training: epoch stays, a training batch stays (batch 大小为 4), learning rate → 学习率, the trainer stays, the tokenizer stays, steps → 步 (450 步), loss stays (loss 曲线, the loss falls → loss 从……降到……). Evaluation: perplexity → 困惑度, base model → 基座模型, the fine-tuned model → 微调后的模型, catastrophic forgetting → 灾难性遗忘, baseline → 基线, benchmark → 基准测试, style fit → 风格契合度. Saving: merge → 合并, the merged model → 合并后的模型, ship → 交付. Track A: tuning job → 微调任务, client → 客户端, managed → 托管, location → 区域 (L06), multi-region → 多区域, endpoint stays, cost table → 价格表, training monitor → 训练监控. The video''s metaphors by meaning, one word each: 三个旋钮 (three dials), 桌上摊开的那本书 (the open book), 砖 (bricks), 模具 (mould), 传送带 (conveyor), 带子 (ribbon), 显存柱 (the memory column), 柱子 (bars), 桶 (buckets), 细条 (strips), 开关 (the adapter switch), 干洗店的取衣单 (the dry-cleaner ticket).'
- '[A4] Written vs spoken. The subtitles say repo / clone / commit / container / image / bucket / bind mount / prompt / system prompt / notebook / token / endpoint / adapter / epoch / batch / loss / tokenizer / trainer; titles, chapter names, meta.yaml and companion docs write 仓库 / 克隆 / 提交 / 容器 / 镜像 / 存储桶 / 绑定挂载 / 提示词 / 系统提示词 / Colab 笔记本（notebook）/ 词元（token）/ 端点（endpoint）/ 适配器（adapter）/ 轮次（epoch）/ 批次（batch）/ 损失（loss）/ 分词器（tokenizer）/ 训练器（trainer）, with the English in brackets at the first use of a core concept (brackets are fine outside the narration). LoRA, QLoRA, PEFT, RAG and NF4 stay in writing too. Commands are unaffected.'
- '[A5] Writing artifacts. Copied letter for letter (case, dots, slashes, hyphens unchanged); never translated, inflected, quoted, put in 《》 or code formatting. Add a Chinese head noun where it helps: secrets 目录, data 目录, autotrain 目录, AC215 目录, question 列, text 列, global 区域, docker-shell.sh 这个脚本, Linear4bit 层. No sentence opens with an artifact or a lower-case kept-English word: put a Chinese word first (这次 prepare……; 在 generate 里……; 用 docker images 看……; 用 git status 看……; 这个 lock 文件……; 这里 main……; 这个 loss……; 每个 bucket……; 这个 notebook……; 负责训练的客户端……), so no subtitle starts in lower case. Capitalized names, acronyms and dtype names (Gemini, Qwen3, OPT, Colab, Google, README, RAG, LoRA, QLoRA, PEFT, NF4, BF16, FP16, KeyError, W₀, Part A) may open a sentence.'
- '[A6] Names with an underscore and code expressions (as L3-L7). With no say:, the checker reads the display line as the spoken text and rejects letter_letter, brackets, < > | and =; the SAY never reads these names with their underscores either. So the Chinese line writes them the way the narration says them, with a Chinese head noun or in an obvious name slot: drop_duplicates → drop duplicates; train_test_split → train test split; wait_for_job=False → wait for job 设为 false; prepare_model_for_kbit_training → prepare model for k-bit training; target_modules → target modules; disable_adapter() → disable adapter; <|im_start|> / <|im_end|> → im start / im end; NUM_ITERATIONS → 迭代次数 (the SAY says the number of iterations); q_proj / v_proj → query 投影 / value 投影 (the SAY''s words); MLOps_Learning → MLOps Learning; W₀ stays (W naught); alpha over r → alpha 除以 r; (19, 2) → 19 乘 2. The English line gets the literal form through en_display (D4).'
- '[A7] Words to keep apart. bucket (Cloud Storage) ≠ 桶 (a quantization bucket, S11). 块 (a quantization block of 64 weights) ≠ 层 (a transformer block or a layer: 28 层, 每层, 线性层, LoRA 层, an image layer). 显存 (GPU memory) ≠ 内存 (CPU memory) ≠ 记忆 (never in this video). 口吻 (the persona''s way of speaking) ≠ 声音 (audio; not used). 学生模型 (the student model) ≠ 学生 (a learner). 教师模型 (the teacher) ≠ 授课老师 (the instructor, never named). 笔记本 (laptop) ≠ notebook (the Colab notebook). 第一部分 / 第二部分 (the video''s parts) ≠ Part A / Part B (the notebook''s headings, verbatim) ≠ 第 n 节 (a notebook or README section) ≠ 第 n 步 (a tracker or notebook step) ≠ n 步 (training steps: 450 步) ≠ 章 (a chapter of this video: 训练那一章). 一批 (a generation batch in --generate) ≠ batch (a training batch). 标记 (human / bot labels, the chat-template markers) ≠ 标签 (an on-screen tag: 灰色标签). 系统指令 (Gemini''s system instruction) ≠ system prompt (the README''s word) ≠ 提示符 (a shell prompt). 验证 (validation examples) ≠ 测试 (the test split) ≠ 检查 (check, ls -la /secrets). 基座模型 (base model) ≠ base image (A2). 全捕获的 except (the catch-all) ≠ 兜底 (L07''s fallback). 参数 (a flag; a model parameter) — disambiguate by context: 三个参数：generate……; 3.758 亿个参数. 微调任务 (the tuning job) ≠ 任务 elsewhere. 区域 (location) ≠ 位置. 课件 (the slides) ≠ 课上 (the lecture) ≠ 课程团队 (the staff).'
- '[A8] Register: a TA in a lab section. Short instructions with spoken verbs (跑, 装, 改, 贴, 删, 存, 输入, 点); the viewer is 你 (never 您, 大家, 同学们); 我们 is us at recording time (我们没有密钥). Chinese word order inside a clause; clause order follows the English (D9). No translationese: not 让我们…… (say 我们来……, 先……), not 这就是为什么…… (say 所以……), few 被 sentences, no stacked 一个……的. No internet slang. Carry the spoken rhythm by meaning: Now check the physics → 再看物理; Start small → 先从小的说起; Trace it back → 往回追; Now prepare again → 现在再跑一次 prepare; Which layers? → 哪些层？; Did it work? → 有效吗？; Teardown. → 清理。; Everything is frozen. → 全都冻结了。; Ours never needs to. → 我们的用不着。'
- '[A9] Precision. Translate the quantifiers: only 只, every 每个 / 每次, all 全部, about 大约, at most 最多, never 从不, exactly 正好 / 完全. at the time of recording is always 录制时, never dropped. Counts, line numbers, step numbers and versions exactly as on screen (C1). Errata are mild and always followed by the fix: A small slip: … → 一个小疏漏：……; slide slips said kindly (课件上写的是 18 和 69；四舍五入应该是 19 和 70). Printed outcomes as printed: KeyError: ''question''; Tuned model info: None; source: not found; Uploading file; Training job started; succeeded. Pause-and-ponder: five questions (S05[6], S08[8], S10[3], S12[1], S13[7]); the lead-in (One question before we move on. → 继续之前，先想一个问题。; A question to pause on. → 暂停一下，想一个问题。; Now, try it yourself. → 现在，你自己试试。) never answers, and the line under a ponder card must not give it away: S05[6] must not say the teacher can be wrong; S08[8] must not say where the job runs; S10[3] must not give the 120 GB total; S12[1] must not explain the 375.8 vs 596 gap; S13[7] must not give the two counts. Money: 2 美元, 0.008 美元, 112.73 美元, 57 美分; never converted.'
- '[A10] Names. Products, companies and the course keep Latin script (A1 b); 哈佛 only in titles and descriptions. Course: AC215; lecture n → 第 n 讲 (the RAG app from lecture 5 → 第 5 讲的 RAG 应用; lecture 9 / lecture 10 → 第 9 讲 / 第 10 讲); the lecture → 课上; the lecture slides / the slide → 课件; part 1 / part 2 → 第一部分 / 第二部分; this video → 这期视频; the instructor → 授课老师, never named; the staff → 课程团队. The persona''s name never appears in any Chinese line or file: the screen shows the GRAY ‹instructor› chip, the narration says the instructor, and so do the subtitles (Yello, this is the instructor, your cheese monker → “Yello，我是授课老师，你的 cheese monker”; in the instructor''s voice → 用授课老师的口吻). The Hugging Face account, project numbers, endpoint IDs, container IDs and keys are never written or read out. Model output quoted in the narration: the opener words stay as printed (Yello, Welcome, The, Sure, here''s, welcome welcome welcome, cheese lovers, good question, glad you ask), whole generated sentences are translated inside “” (hello, my cheese name is → “你好，我的奶酪名字是”; my cheese name is cheese, I''m not sure if you''re joking or not → “我的奶酪名字是奶酪，我不确定你是不是在开玩笑”; how is cheese made in Greece → “希腊的奶酪是怎么做的”), because the recorded box above shows the English. The user name student stays.'
- '[A11] The screen stays English. This series translates only the narration: terminal output and prompts, terminal titles, code panels (comments included), README cards, recorded-output and quote boxes, the schematic console and Colab drawings, the trackers (README › Dataset › Run Container, Colab › Step 4 · Fine-tune, step k of N), lecture tags (Lecture 8 · slides 43–51), V1-V8''s labels, dtype tags, the extra cards, the tags (your turn, extra, illustration, recorded · the staff''s saved Colab run (A100), expected, scripted, no key, billed, estimate, at the time of recording, erratum, your id will differ, concept · lecture only, free) and the ponder and recap cards are English, and the scenes need no language changes. Where the narration names something on screen, the subtitle writes it as shown (标签写着 your turn; 标着 scripted); what the narration says in its own words is translated (the tracker → 进度条, the gray tag → 灰色标签, an extra → 额外的一步, the memory column → 显存柱).'
- '[A12] Mainland Simplified Chinese only: 默认, 程序, 代码, 文件, 目录, 数据, 数据集, 网络, 脚本, 视频, 信息, 账号, 函数, 参数, 字段, 单元格, 运行时, 配置, 内存, 显存, 优化器, 矩阵; never 預設, 程式, 程式碼, 檔案, 資料夾, 資料, 資料集, 網路, 腳本, 影片, 帳號, 函式, 引數, 欄位, 儲存格, 執行階段, 組態, 記憶體, 最佳化器, 矩陣 in traditional forms.'
- '[A13] The series list (the ac215-video skill''s list) in this lecture. container and image in S04, S08 and S16; Dockerfile once (S08[2]); prompt (the input prompt, the system prompt, a prompt changes the input); token (S09''s cost table, S12, S14, S15); endpoint (S08, S09, S16) and LoRA (S10-S16) are used for the first time in the series; embedding (S11, S12); pipeline, volume, venv (only as the path /.venv), PATH, agent (only in the role name Agent Platform User), CI and port are not in this script. Not in the series list but kept here (A1 c, new): QLoRA, PEFT, adapter, epoch, batch, loss, dropout, tokenizer, trainer, absmax, unscale.'
- '[B1] Spacing. One half-width space between Hanzi and Latin letters, digits or an artifact (输入 exit, 第 243 行, 133 个包, 1.64 GB, 112.73 美元, secrets 目录, 4 位, 秩 8, 3.758 亿, 2026 年 10 月 31 日, W₀ 从来没变). The checker reports a missing space on every displayed sentence. Spaces inside an artifact as they are (python cli.py --prepare, docker image rm, Gemini 3.1 Flash Lite); never add one inside an artifact. No space next to full-width punctuation (……sh docker-shell.sh。; 4.6 MB，……). Never U+00A0 / U+202F.'
- '[B2] Punctuation. Chinese uses full-width ，。、；：？！“”……, also next to an artifact. Lists use 、 (transformers、bitsandbytes 和 trl; 加性、选择性和重参数化). No brackets of any kind: （）, (), 《》, 【】, [], <> (the checker rejects them without say:, and the bilingual band needs no glosses). “” only for an idea or a translated quotation (a model''s generated sentence, A10); artifacts, tag names, screen words, terminal text and the opener words are never quoted. One Chinese sentence (for one English sentence) has no 。？！ inside: use ，；：. 第 N 步 takes a full-width colon before its content when the English has one (Step 2: sh docker-shell.sh. → 第 2 步：sh docker-shell.sh。). The printed error KeyError: ''question'' and source: not found keep their own ASCII colon and quotes (A1 a).'
- '[B3] Symbols the checker rejects (= < > + → ← ^ ≤ ≥ × ÷ ≈ α ε σ, == != +=, a digit followed by !, brackets, letter_letter, <|…|>): never copied into the Chinese line; say them in words (A6). 19 by 2 → 19 乘 2; 2,048 by 1,024 → 2048 乘 1024; alpha over r → alpha 除以 r; B times A → B 乘 A; 2 times 10 to the minus 4 → 2 乘 10 的负 4 次方; 127 over the largest → 127 除以最大值; 1.5 becomes 19 → 1.5 变成 19; 120, then 40, then 12 → 120、40、再到 12 GB. Allowed and kept as on screen: . and / in paths and names (cli.py, /secrets, /.venv, train.jsonl), - in flags and names (--prepare, docker ps -a, us-central1, dataset-creator, k-bit), % (10%, 0.3%), the ASCII colon and quotes inside printed text (KeyError: ''question''), @ (@ 符号), and W₀ (the subscript is not a maths symbol for the checker).'
- '[C1] Numbers in displayed text. Everything that echoes a number on screen, in the terminal, the code, the slides or written as digits in the SAY uses Arabic digits with no thousands separator, as the trainer prints them (1146880, 2293760, 5046272, 2097152, 24576, 16384, 40960, 16444, 30681, 1000, 2048, 1024): step and section numbers (第 1 步, 第 2.1 节 or 2.1 as the SAY, 第 6、7 行, 第 241 到 247 行), lectures (第 5 讲), counts (133 个包, 20 组问答, 17 个样本, 2 个, 900 个, 100 个测试样本, 28 层, 450 步, 2 个 epoch), sizes, times, money, dates, versions. Millions and billions the SAY says in words become 万 / 亿 with digits: 596 million → 5.96 亿, 1.15 million → 115 万, 375.8 million → 3.758 亿, 440 million → 4.4 亿, 220 million → 2.2 亿, 155.6 million → 1.556 亿, 10 billion → 100 亿, 0.6 billion → 6 亿, over 2 million → 200 多万. Small narrative counts the SAY writes as words use Hanzi: 两个回答, 三个旋钮, 两条路线, 六个文件, 两个角色, 四步, 五个文件, 两个坑, 三个参数, 三大类, 七个矩阵, 五道题, 三样东西, 两点友情提示, 一百组左右, 第三个旋钮.'
- '[C2] Units, versions, model names, money and dates. Sizes as on screen with a half-width space: 4.6 MB, 23 MB, 1.64 GB, 1.2 GB, 20 GB, 120 GB, 24 GB. Times: 45 秒, 大约三分半钟 (about 3 and a half minutes), 3 分 36 秒, 6 到 7 分钟. Bits: n 位 (4 位, 16 位, 32 位). Percent: 10%, 0.3%. Money as on screen, never converted: 2 美元, 0.008 美元, 112.73 美元, 57 美分, 几美分. Versions with their names: torch 2.11, transformers 5.16 (at the time of recording → 录制时). Model names as the SAY says them, the same on both lines: Gemini 3.1 Flash Lite, Gemini 1.5 Flash, Qwen3 0.6B, OPT 350m (the code''s gemini-3.1-flash-lite is on screen; unlike L05, no en_display is needed). Dates: 2026 年 10 月 31 日 (October 31, 2026). Hashes, IDs and the commit are never read out.'
- '[D1] Sentence alignment (explainer/i18n.py). In narration/*.yaml every SAY line of script.md has one entry (119 blocks); `en` equals the SAY line byte for byte; `zh` has exactly as many items as explainer.voice.split_sentences finds English sentences (357 in this script). Restructure only inside a sentence; never merge or split sentences. Short sentences are items of their own: Now check the physics. → 再看物理。; Remember that zero. → 记住这个 0。; Trace it back. → 往回追。; Teardown. → 清理。; Which layers? → 哪些层？; Did it work? → 有效吗？; Start small. → 先从小的说起。; Two kind notes. → 两点友情提示。; Everything is frozen. → 全都冻结了。. Run `python -m explainer.i18n check videos/ac215-l08-llm-finetuning --lang zh` until it prints OK.'
- '[D2] No say:, no anchors. There is no Chinese voice: never write say: and never write anchors:. The subtitles are timed by the English audio; the toolkit pairs each Chinese sentence with its English one by position.'
- '[D3] A checker-clean display line. With no say:, every displayed sentence must pass explainer.i18n.spoken_problems: no brackets (B2), no maths symbols (B3), no letter_letter names (A6), no ! after a digit, no clause ending in 种 followed by ，。！？ (三种办法 is fine inside a clause; never 有三种。), a half-width space between Hanzi and Latin letters or digits (B1), each sentence ending in 。！？ or …… (optionally followed by ” or 」), and every Latin word listed in this glossary (zh_subtitle, first_use or allowed_spoken_latin). The checker cuts words with [A-Za-z][A-Za-z''.-]* and ignores one-letter words: Qwen3 is Qwen, NF4 is NF, us-central1 is us-central, Linear4bit is Linear and bit, AC215 is AC, 350m is m (ignored), KeyError: ''question'' is KeyError and question'', env.dev, cli.py, train.jsonl and llm-service-account.json stay whole, --prepare is prepare, here''s stays whole. A Latin word it reports is either an English word to translate (usually) or a missing artifact: add the artifact, cut the same way, to allowed_spoken_latin and to its term. Plurals are left out on purpose (no adapters, epochs, tokens, layers, images, buckets): a plural it reports is an English inflection to drop (两个 adapter, 2 个 epoch, 所有 token, 两个 image).'
- '[D4] The English line (en_display). The bilingual band shows the SAY sentence, and the SAY spells artifacts out as words for the voice. Every such sentence gets an en_display item with the literal on-screen form, the rest word for word as the SAY; the other sentences of the block are null. Spoken form → literal (script.md''s header list plus this glossary''s additions): python cli.py dash dash generate / prepare / upload / train / chat / help → python cli.py --generate / --prepare / --upload / --train / --chat / --help; sh docker-shell.sh and bash docker-shell.sh as written; ls dash la slash secrets → ls -la /secrets; slash app → /app; slash secrets → /secrets; slash dot venv → /.venv; dash dash rm → --rm; docker ps dash a → docker ps -a; docker image rm as written; dot json dot json → .json.json; source, not found → source: not found; key error, question → KeyError: ''question''; tuned model info, none → Tuned model info: None; training job started → Training job started; uploading file → Uploading file; wait for job set to false → wait_for_job=False; disable adapter → disable_adapter(); prepare model for k-bit training → prepare_model_for_kbit_training; drop duplicates → drop_duplicates; train test split → train_test_split; target modules → target_modules; im start / im end → <|im_start|> / <|im_end|>; W naught → W₀; alpha over r → α/r; MLOps Learning → MLOps_Learning; money: 112 dollars 73 → $112.73, 0.008 dollars → $0.008, 2 dollars → $2, 57 cents → 57¢ only where the screen writes it so. Underscore names (A6) are restored to their literal form only in en_display; the Chinese line keeps the spaced form. The English video''s own .srt is unaffected.'
- '[D5] Content parity. Each Chinese sentence translates its English sentence only: no added commands, flags, glosses, Chinese screen names or explanations; 额外 only where the English says extra; kept-English words get no Chinese explanation (the English line is right below); ponder questions get no answers (A9). The few head words A5 needs (这个, 这次, 这里, 用, 负责训练的) carry no content.'
- '[D6] Fixed phrases. Pause here and finish all four steps. → 在这里暂停，把四步都做完。 Pause, and get to this prompt. → 暂停一下，走到这个提示符。 Pause, and run generate and prepare yourself. → 暂停一下，自己跑一遍 generate 和 prepare。 Then pause and upload. → 然后暂停，上传。 Read the cost table next, then pause and start your job. → 接下来看价格表，然后暂停，启动你的任务。 Pause and run it once your endpoint is in. → 暂停一下，填好你的 endpoint 之后跑一遍。 Pause and run part A. → 暂停一下，跑完 Part A。 Pause, and run part B. → 暂停一下，跑完 Part B。 Pause, and run steps 1 to 3. → 暂停一下，把第 1 到第 3 步跑一遍。 Pause and run it. → 暂停一下，跑一遍。 Pause and train. → 暂停一下，开始训练。 Pause, and run step 5. → 暂停一下，跑第 5 步。 Pause, and tear down. → 暂停一下，把它们都清理掉。 When a tag says your turn, pause and run the command. → 看到标签写着 your turn，就暂停，自己跑这条命令。 With a key, … → 有密钥的话，…… Without one, … → 没有密钥的话，…… An extra … / As an extra … → 额外加一步：…… / 额外跑一个…… Step N: → 第 N 步： Step N of the … section → ……那一节的第 N 步 at the time of recording → 录制时. A small slip: … → 一个小疏漏：…… One question before we move on. → 继续之前，先想一个问题。 A question to pause on. → 暂停一下，想一个问题。 Now, try it yourself. → 现在，你自己试试。 Five questions to test yourself. → 五道题，自测一下。 Here''s where we are. → 回顾一下。 In part 2, … → 第二部分，……'
- '[D7] Files. narration/g1.yaml = S01-S09 (part 1: track A, a persona dataset with Gemini and a managed tuning job; 66 blocks, 192 sentences), narration/g2.yaml = S10-S16 (part 2: track B, QLoRA in Colab; 53 blocks, 165 sentences), video.yaml''s two parts; each file opens with a comment (coverage; the rules it applies: A6 spaced names, B3 symbols in words, C1 numbers without separators and 万 / 亿, C2 money and model names, D4 en_display, no say: / anchors:) and keeps the script''s order. Double-quoted strings; escape a literal double quote or backslash for YAML.'
- '[D8] Length on the English timing. The Chinese is read while the English plays; the band switches where the English cues switch (a Chinese piece that reads faster than 9 units/s gets at most 1 s more). Each Chinese sentence should read in about the time the English sentence is heard: at most about 2 units per English word (a Hanzi counts 1, a Latin letter 0.55), so drop redundant connectives and repeated subjects, never content. Long artifacts cost length too (prepare model for k-bit training 17.6 units, llm-service-account.json 13.2, python cli.py --generate 13.2, Gemini 3.1 Flash Lite 11.6): don''t repeat them where the English doesn''t; after the first mention in a block, use a short reference (这条命令, 这个文件, 这个任务, 这个模型).'
- '[D9] Keep the English clause order (a series lesson, ac215-video skill). The toolkit pairs Chinese and English clause by clause, so a Chinese sentence that puts a condition first (如果……，就……) when the English puts it last swaps meaning between two neighbouring cues. Conditions, purposes and time adverbials sit where the English has them: With a key, it costs cents → 有密钥的话，只花几美分; If you just changed env.dev, restart the container → 如果你刚改过 env.dev，就重启 container; Paste it there; otherwise chat points at the instructor''s endpoint → 把它贴到那里；否则 chat 会指向授课老师的 endpoint; Paging moves optimizer state to CPU memory when the GPU fills up → 分页会在 GPU 显存满了的时候，把优化器状态挪到 CPU 内存里 (the when clause stays inside the main clause, no comma before the verb is also fine); Pause and run it once your endpoint is in → 暂停一下，填好你的 endpoint 之后跑一遍 (the condition after the main clause, as in the English).'
- '[G1] Width. Bilingual band: Chinese line at most 30 units, English line 96 characters; Chinese-only subtitles (.zh.srt) 22 units a line, 2 lines a cue. Write clauses of at most about 24 units separated by ，；： so the splitter has clean cut points; avoid an unpunctuated clause over 30 units (Agent Platform User and the model names get a clause of their own).'
- '[G2] Cue endings: the toolkit strips a cue''s final 。，、；： and keeps ？！…… and a closing ” (subtitles.strip_end). Prefer a Chinese word over ''artifact + full stop'' at the end of a sentence where it reads as well (……进入 dataset-creator 目录。 reads steadier than ……进入 dataset-creator。; both are valid).'
- '[G3] Never split a command. The splitter treats a space between two Latin words in a Chinese line as a good cut point, so python cli.py --prepare could land on two lines and the viewer could not copy it. Put the whole command at the end of a clause, after a full-width colon (第 2 步：sh docker-shell.sh。; 第 1 步：python cli.py --generate。), at most one command per cue, with little Chinese around it. Check every cue with a command in the rendered .zh.srt.'
- '[H1] Titles (meta.yaml). Video, part and chapter titles use the written register (A4: 容器, 镜像, 提示词, 端点, 存储桶); questions keep their question mark; the English colon structure is kept (量化：……; LoRA：……); commands, file names and code names stay as they are (meta.yaml is not read by the checker, so brackets are fine there). Core-concept chapters carry their English short name for search, as L1, L3, L5-L7 do: 端点（endpoint）, 量化, LoRA, 困惑度. LLM: Finetuning → LLM 微调; the metaphors keep their picture (three dials → 三个旋钮; a thin correction → 一层薄薄的修正; 16 buckets per weight → 每个权重 16 个桶; the 120 GB bill → 120 GB 的账单).'
- '[H2] Description (Bilibili / YouTube): two or three sentences, written register, this glossary''s terms: AC215 lecture 8''s follow-along of dlops-io/llm-finetuning and the course''s QLoRA Colab notebook; what the viewer does and learns (track A: a Gemini teacher writes a persona dataset, prepared as CSV and JSONL, uploaded to a bucket and tuned by a managed Gemini tuning job served at an endpoint; track B: quantization, NF4, LoRA and QLoRA training of Qwen3 0.6B, perplexity and saving; the lesson: fine-tuning teaches a voice, not facts); English narration with Chinese and bilingual subtitles; terminal output recorded on 2026-10-31 without a service-account key or GPU, so the cloud commands stop at the missing key, the working outputs are the README''s and the course staff''s saved Colab run. Never the persona''s or the instructor''s name.'
- '[H3] Companions: i18n/zh/README.md (and exercises.md / digest.md if made) are translated with this glossary in the written register (A4). Close with a term table: English | the word used here | other common renderings (fine-tuning: 微调 / 精调; endpoint: 端点 / 终端节点; adapter: 适配器; epoch: 轮次 / 训练轮数; loss: 损失; perplexity: 困惑度; quantization: 量化; rank: 秩; gradient checkpointing: 梯度检查点 / 激活重计算; persona: 人设 / 角色; catastrophic forgetting: 灾难性遗忘; tokenizer: 分词器; tuning job: 微调任务 / 调优作业).'
- '[H4] Code and commands in the companions stay byte for byte: code blocks, commands, file names and inline `code` are unchanged; only # comments and the surrounding prose are translated.'
- '[I1] (Request, open since L3) `explainer.i18n check` applies its spoken-text hygiene (_SPOKEN_BAD: brackets, maths symbols, letter_letter names) to the display line when a sentence has no say:. For a subtitles-only video (no languages.zh.voice in video.yaml, voice: none here) those checks protect nothing and force A6 and B3 (here: drop_duplicates, train_test_split, wait_for_job=False, prepare_model_for_kbit_training, target_modules, disable_adapter(), <|im_start|>, <|im_end|>, α/r, q_proj, v_proj, MLOps_Learning). Proposal: when the glossary''s voice is none, skip _SPOKEN_BAD for display-only sentences (keep the Latin-word, spacing and sentence-end checks).'
- '[I2] (To do, from L1 I3) `_cuts` in explainer/subtitles.py treats a space between Latin words in a Chinese line as a good cut point, so a command can be split (G3). Proposal: in a Chinese line, treat a run of Latin words separated only by spaces as unbreakable unless it alone exceeds a line.'
- '[I3] (Note) explainer/subtitles.py reads every video''s glossary.yaml: the 2-3 word English alternatives of each term''s en field are kept on one English line, and the 2-7 character Chinese headwords of zh_subtitle are registered in jieba, in every video''s subtitles. The en and zh_subtitle fields of this file therefore list real terms only (no sentences).'
terms:
# ---------------------------------------------------------------- The hook: a voice, not facts
- en: 'Why is the sky blue? / the sky / the physics / refraction / water molecules / air molecules / scatter blue light more than red'
  zh_subtitle: '天空 / 折射 / 水分子 / 空气分子 / 散射'
  first_use: 'S01[2]：两个都错了：空气分子对蓝光的散射比对红光更强。'
  note: 'The hook question is asked plainly: Why is the sky blue? → 天空为什么是蓝色的？ (S01[0]). One blames refraction, the other water molecules → 一个怪折射，另一个怪水分子. the physics → 物理 (Now check the physics → 再看物理; the physics did not → 物理没有).'
- en: 'language model / a small language model / two versions of the same model / the original / the fine-tuned one / a textbook'
  zh_subtitle: '语言模型 / 原版 / 教科书'
  first_use: 'S01[1]：原版的回答像教科书。'
  note: 'L05: language model → 语言模型. the original (model) → 原版 / 原来的模型; the fine-tuned one → 微调后的那个.'
- en: 'fine-tune / fine-tuning / fine-tuned / tunes / full fine-tuning'
  zh_subtitle: '微调 / 全参数微调'
  first_use: 'S02[1]：微调转的是第三个旋钮：它改的是权重，办法是给模型看大量的例子，每个例子是一个输入加上你想要的输出。'
  note: 'L06 decided: 微调, never fine-tune in a subtitle. full fine-tuning → 全参数微调 (the lecture''s Full Parameter). Google tunes Gemini → Google 替你微调 Gemini. The notebook title Tutorial - Finetuning with QLoRA stays (A11).'
- en: 'instruction fine-tuning / instruction-tuned / never instruction-tuned / instruction dataset / instruction / context / output / task-specific fine-tune'
