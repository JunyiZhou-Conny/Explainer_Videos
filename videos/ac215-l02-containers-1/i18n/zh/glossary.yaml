  note: 'File names with their dot (D4: en_display .dockerignore). add one listing dot git, dot venv and your secrets folder → 加一个，写上 .git、.venv 和你的 secrets 目录.'
- en: 'hidden git folder / dot git / index file / the editor''s VS Code folder / git history'
