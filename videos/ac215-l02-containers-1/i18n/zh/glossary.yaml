# Chinese (zh-CN) glossary and translation rules for ac215-l02-containers-1 (AC215 lecture 2, Containers I,
# a follow-along of dlops-io/simple-translate: "Developing App using Containers", "Pushing Docker Image to
# Docker Hub", "Running App on VM using Docker"), code-switching version, SUBTITLES ONLY.
# Audience: Chinese-speaking AC215 grad students who read technical English fluently; register of a Chinese
# MLOps TA running a lab section. Precedents and sources of the shared decisions:
# videos/ac215-l01-vms-venvs/i18n/zh (the series pilot: every term L1 decided keeps L1's form unless a rule
# below says why not) and videos/ac215-l03-mega-pipeline/i18n/zh (Containers II, written in parallel: the
# container vocabulary below is the same, so L2 and L3 read as one series; L3 names L2's pictures 包裹 and
# 多米诺骨牌, and L2 introduces them).
# There is NO Chinese voice in this series: the Chinese lines are subtitles on the English timing (the bilingual
# band of output/<id>.zh-en.mp4, <id>.zh.srt, <id>.zh-en.srt / .ass). So no say:, no anchors, no readings, no
# durations: only display rules. L1's spoken-form rules (F1-F6, C2-C5, say: readings such as 三点十一点二 or
# 点 venv) do not apply. But `python -m explainer.i18n check` still applies its voice hygiene to the displayed
# line when a sentence has no say: (brackets, maths symbols, letter_letter names, Latin words not listed here,
# a missing half-width space): rule D3 is how the Chinese line stays clean without say:.
# Human-readable copy in Chinese: GLOSSARY.md (keep the two in sync).
# terms[].zh_subtitle = the display form (Chinese subtitle line; titles use the written forms of A4);
# terms[].first_use = an example sentence for the translators, in the scene where the term first appears
# (each one passes the checker);
# rules are tagged [A1]..[I2]: A terms, B typography, C numbers, D narration file, G subtitles, H titles and
# companions, I toolkit notes. (L1's E on-screen strings and F voice rules do not apply: nothing on screen is
# translated in this series, and there is no voice.)
# Read by: python -m explainer.i18n check (Latin words allowed in the Chinese line: every Latin word of
# zh_subtitle and first_use, plus allowed_spoken_latin, which lists the words as the checker's regex
# [A-Za-z][A-Za-z'.-]* cuts them: simple-translate-ac215 is simple-translate-ac, /usr/local/bin is usr, local
# and bin, linux/amd64 is linux and amd, UTF-8 is UTF-) and explainer/subtitles.py (2-3 word English phrases of
# `en` are kept on one English line in every video; 2-7 character Chinese headwords of zh_subtitle are
# registered in jieba for every video, so zh_subtitle holds terms, not example phrases).
video: ac215-l02-containers-1
lang: zh-CN (mainland Simplified Chinese)
audience: 'Chinese-speaking AC215 (MLOps & LLMOps) grad students who know Python and basic ML, read technical English fluently, did L1 (a cloud VM, venvs, uv) and Tutorial 0 (Docker Desktop, a GCP project), and are new to Dockerfiles, images and containers; they follow along on their own laptop with the simple-translate README open, then on a VM of their own. Register of a Chinese MLOps TA running a lab section.'
voice: none          # subtitles only (video.yaml: Chinese = i18n/zh/narration/*.yaml on the English timing)
policy: 'The Mandarin of a Chinese MLOps TA walking a lab section through the steps, code-switching only where such a speaker really does, written as subtitles under an English narration. The viewers are Chinese-speaking AC215 grad students who read technical English fluently and already say 开一台 VM, 把 repo clone 下来, 激活 venv, 写个 Dockerfile, 构建 image, 起一个 container, 打 tag, push 到 Docker Hub, pull 下来. Every choice passes three tests: what is said in a real lab section; the standard, searchable Chinese name (Docker and Google Cloud Chinese docs); and consistency with the series (L1 decided the shared terms; L3 uses the same container vocabulary). (1) Artifacts verbatim: what the viewer types or matches on screen (commands, flags, file and folder names, paths, image and package names, Dockerfile instructions, config fields, terminal text and error text, the README''s headings) is copied letter for letter, never translated, inflected or quoted; the exceptions the checker forces (an underscore, =, < >, brackets or quotes inside the artifact) are described in words (A6) and the English line shows the literal (D4). Nothing on screen is translated in this series: terminal output, code panels, README cards, tags, the trackers and the pause-and-ponder cards stay English; only the narration is. (2) Lab-speech English, a closed list: from L1 VM, venv, shell, root, repo, clone, commit, pin; for the container lectures container, image, Dockerfile, base image, registry, tag (打 tag), push, pull, digest, socket, Docker daemon, attestation, locale, ID. (3) Everything else in standard Chinese: 层, 只读层, 可写层, 配置卡片, 指令, 构建, 重新构建, 构建步骤, 构建上下文, 构建器, 缓存, 层缓存, 精简视图, 完整日志, 校验和, 指纹, 进程, 主进程, 内核, 平台, 多平台, 机器码, 模拟器, 仓库 (a Docker Hub repository), 账号, 用户名, 访问令牌, 密码, 读写权限, 后台服务, 根目录, 工作目录, 提示符, 终端, 目录, 包, 软件包, 软件包列表, 激活, 部署, 计费. (4) The video''s metaphors by meaning, one word each: 配方 (the Dockerfile as a recipe), 配置卡片, 类 and 实例, 货架 (registry shelves), 包裹 (the build context), 多米诺骨牌 (the cache wave, picture only), 菜单 (a multi-platform tag), 门 (the socket), 计价器, 梯子 and 级 (L1), 数轴 (L1). (5) Written register for titles, meta.yaml and companion docs: 容器, 镜像, 基础镜像, 镜像仓库, 标签, 推送, 拉取, 仓库, 克隆, 提交. (6) The bilingual band puts the English sentence under every Chinese line, so the Chinese line carries no glosses and no brackets at all (the checker forbids them without say:). (7) The toolkit''s constraints are part of the policy: one Chinese sentence per English sentence (129 blocks, 371 sentences), a checker-clean display line (D3), an en_display wherever the SAY spells an artifact out as words (D4). Mainland Simplified Chinese; relaxed, clear lab-section speech, never slangy.'
rules:
- '[A1] Code-switching scope. English stays in three places only. (a) Artifacts, copied letter for letter: commands and subcommands (docker container ls, docker stop, docker system prune, docker system prune -a, docker image ls, git clone, cd, ls, ls -a, cat, docker build, docker run, docker image inspect, git status, git add -f, git diff, git checkout, diff, diff -u, cp, python cli.py, python --version, which python, source, exec bash, bash -c, echo $$, exit, docker ps -a, docker history, docker login, docker tag, docker push, docker buildx use default, sudo apt install docker.io, sudo apt-get update, sudo docker --version, sudo docker run --rm -ti dlops/simple-translate, sudo docker login, pip install uv, uv sync), flags (--rm, -t, -i, -ti, -f, -a, -u, -p, -c, --progress, --platform, --version), file and folder names (Dockerfile, Dockerfile.txt, .dockerignore, .gitignore, .git, .vscode, .venv, /.venv, .venv/bin/activate, cli.py, pyproject.toml, uv.lock, docker-shell.sh, docker-build-push.sh, README, /usr/local/bin, /bin/bash), image, tag and package names (python:3.12-slim-bookworm, simple-translate, simple-translate-ac215, dlops/simple-translate, hello-world, latest, library, docker.io, uv, pip, art), Dockerfile instructions and config fields (FROM, RUN, COPY, ENV, ENTRYPOINT, CMD, null, requires-python), platform names (linux/amd64, amd64, arm64), builder names (default, desktop-linux), terminal text and error text (CACHED, DONE, failed to read dockerfile, nothing to commit, ModuleNotFoundError, No module named art, cannot execute binary file, push access denied, Mounted from library/python, exec format error, no matching manifest, Unable to locate package, Not Found, permission denied, toomanyrequests, dangling images, digest), the on-screen tags when the narration names them (your turn, extra; A11) and the README''s headings (Developing App using Containers, Build Docker Image, Run Docker Container, Pushing Docker Image to Docker Hub, Running App on VM using Docker). The exceptions are artifacts the checker rejects (A6). (b) Products, organisations, the course and names: Docker, Docker Desktop, Docker Hub, Google, Google Cloud, Debian, bookworm, Python, CPython, Git, Git Bash, VS Code, Mac, Windows, Linux, Intel, AMD, Apple Silicon, CPU, E2, SSH, UTF-8, AC215, Tutorial 0, MLOps Learning, simple-translate, dlops, student, app. (c) A closed list of words Chinese MLOps engineers say in English in a lab section: from L1 VM, venv, shell, root, repo, clone, commit, pin; new in the container lectures (same list as L3) container, image, Dockerfile, base image, registry, tag (打 tag), push, pull, digest, socket, Docker daemon, attestation, locale, ID. A word joins (c) only if lab speech really uses the English and the Chinese is stiff, ambiguous or collides with another term (镜像 also means a mirror; 套接字 and 守护进程 are textbook words; 证明 means proof; 区域设置 / 语言环境 / 本地化 compete for locale). Never English for flavour: no layer, build, builder, cache, build context, kernel, process, platform, emulator, menu, token, password, account, user name, folder, terminal, package, prompt, flag, deploy.'
- '[A2] container and image. The subtitles say container and image, as a TA does in the lab: 起一个 container, 构建 image, image 里, container 停了; measure word 个 (一个 container, 两个 image, 两个名字一个 ID). Titles, chapter names, meta.yaml and companion docs write 容器 and 镜像 (A4), as L1 did in its preview sentences and as Docker''s Chinese docs do. Never 镜像 in a subtitle (it is also the everyday word for a Debian mirror, which L1 calls 软件源). image name → image 名; the image''s top folder → image 的根目录; the official Python image → 官方的 Python image; a Docker image → 一个 Docker image; base image stays base image (it is also the on-screen brace label), written 基础镜像. L1 wrote 容器 / 镜像 for the next-lecture preview; from L2 on the subtitles code-switch (same as L3).'
- '[A3] The rest of Docker in Chinese. build → 构建 (构建 image, 再构建一次, 这次构建); rebuild → 重新构建; build step (BuildKit''s [k/4]) → 构建步骤 (Docker caches every build step → Docker 会缓存每一个构建步骤; the four steps → 四个构建步骤; the FROM step / the pip step / the apt and pip step → FROM 那一步 / pip 那一步 / apt 和 pip 那一步); build context → 构建上下文; builder → 构建器 (multi-platform builder → 多平台构建器; the builder names default and desktop-linux stay); layer → 层 (一层, 7 层, 加一层, 两个新层); read-only layer → 只读层; writable layer → 可写层 (a thin writable layer → 一层薄薄的可写层); cache → 缓存 (layer cache → 层缓存; reused → 重用; the cache comes back → 缓存回来了); the terminal words CACHED and DONE stay; compact view → 精简视图; full log → 完整日志; instruction → 指令 (RUN 指令, 一次读一条指令); config card → 配置卡片 (only write on the card → 只写在卡片上; config only → 只是配置); start-up command line → 启动命令行; default arguments → 默认参数; the program to start → 要启动的程序; process → 进程, main process → 主进程, process number 1 → 1 号进程; kernel → 内核; platform → 平台; machine code → 机器码; emulator → 模拟器, emulated → 模拟运行; run → 运行 / 跑; start a container → 启动 container / 起一个 container; exit → 退出 (the command exit stays); stop → 停止 / 停了; delete → 删除 / 删掉; deploy → 部署; push / pull stay (written 推送 / 拉取); download → 下载 (Docker downloads an image → Docker 下载了一个 image; uv downloads its own Python → uv 自己下载一个 Python); upload each layer → 上传每一层; tag (verb) → 打 tag (tag the image → 给 image 打 tag); log in → 登录; sign up → 注册.'
- '[A4] Written vs spoken pairs. Subtitles say repo / clone / commit / container / image / base image / registry / tag / push / pull; titles, chapter names, meta.yaml and the companion docs write 仓库 / 克隆 / 提交 / 容器 / 镜像 / 基础镜像 / 镜像仓库 / 标签 / 推送 / 拉取. The repo as a subject is 这个 repo. Commands are unaffected (git clone, docker push, docker tag stay).'
- '[A5] Writing artifacts. Copied verbatim (case, dots, slashes, hyphens unchanged); never translated, inflected, quoted, put in 《》 or code formatting. Add a Chinese head noun where it helps: docker build 这条命令, Dockerfile.txt 这个文件, .dockerignore 文件, .git 目录, /usr/local/bin 目录, --rm 参数, RUN 指令, FROM 那一行, simple-translate 这个 image, desktop-linux 这个构建器. Never start a sentence with a lower-case artifact or kept-English word (image, container, registry, tag, repo, pip, bash, exit, git diff, docker-build-push.sh, -t, --rm): put a Chinese word first (一个 image 就是……; 而 container……; 像 Docker Hub 这样的 registry……; 所谓 tag……; 这个 repo……; 输入 docker build……; 用 git diff……; 参数 -t……; 那 exit 做了什么？), so the subtitle never opens on a lower-case word. A capitalized name, product or instruction may open a sentence (Docker, README, Dockerfile, Git, VM, FROM, ENTRYPOINT, CMD, RUN), as the English does. When the SAY shortens a command the screen shows in full (an extra image ls), write it as the screen shows it (docker image ls).'
- '[A6] Artifacts the checker rejects. With no say:, the checker reads the display line as speech and rejects letter_letter names, = < > + and brackets of any kind. So these artifacts are never copied into the Chinese line; they are described the way the narration says them, and the English line shows the literal through en_display (D4). Table: VIRTUAL_ENV (the virtual env variable) → virtual env 这个变量; raise_exception=True (raise exception equals True) → 把 raise exception 设为 True; --progress=plain → --progress 参数设成 plain; --platform=linux/amd64 → --platform 参数设成 linux/amd64; the README placeholder <USER NAME> → 你的用户名, so <USER NAME>/simple-translate-ac215 → 你的用户名/simple-translate-ac215 and docker login -u <USER NAME> -p <ACCESS TOKEN> → docker login，-u 加你的用户名，-p 加你的令牌; exit() (exit with parentheses) → 带括号的 exit; the prompt''s (app) (app in parentheses) → 带括号的 app; No module named ''art'' → No module named art (the quotes would also glue to the word); ENTRYPOINT ["/bin/bash"] → ENTRYPOINT /bin/bash; CMD ["-c", "source .venv/bin/activate && exec bash"] → CMD 加上 -c 和一条带引号的命令 (the SAY describes it the same way); python cli.py -t "Good morning" -s "en" -d "es" (the README''s translation) → 输入 README 里的翻译：Good morning，从英语翻成西班牙语; docker run --rm simple-translate -c "source .venv/bin/activate && python cli.py -d fr" → never written, the SAY only says 自己的 -c 字符串; less-than and greater-than signs → 小于号和大于号. When the toolkit lets display lines keep these characters (I1), the literals may replace the descriptions.'
- '[A7] Disambiguation pairs. 第 k 步 (the README''s Dockerfile Step 1 to 5, the only steps the narration numbers) vs 构建步骤 (a BuildKit build step, never numbered in this script) vs the tracker''s step k of N (English on screen, never read out). 层 (an image layer) vs 可写层 (the container''s) vs 一级 (a rung of L1''s ladder). 仓库 (a Docker Hub repository) vs repo (the git repository; written 仓库 only in titles and docs, where the Docker Hub one is always Docker Hub 仓库) vs registry (Docker Hub as a whole; written 镜像仓库). tag (a Docker tag; 打 tag) vs 标签 (the on-screen tags: 黄色的 your turn 标签, 灰色的 extra 标签; in writing 标签 is the Docker tag). 配方 (the Dockerfile as a recipe) vs 参考答案 (the solution, Dockerfile.txt). 包裹 (the build context as a parcel) vs 包 (a Python package: 11 个包) vs 软件包 (an apt / Debian package: 92 个新软件包). 构建 (build) vs 运行 (run) vs 部署 (deploy). 复制 (COPY, cp) vs 下载 (download) vs pull. 退出 (exit) vs 停止 (a container stops, docker stop) vs 删除 (--rm deletes, delete the VM) vs 清理 (docker system prune, clean up) vs 回收 (reclaim space). 根目录 (the top folder /) vs root (the user) vs base image (the base). 提示符 (a shell or Python prompt) vs 提示 (a hint). 参数 (flags, default arguments) vs 指令 (Dockerfile instructions) vs 命令 (commands; CMD stays CMD). 进程 (a process) vs 程序 (a program: the program to start, the Python program). 内核 (kernel) vs 核心 (only in the gloss the core of the operating system). 平台 (a CPU platform) vs 菜单 (a multi-platform tag) vs 一行 (a row of the menu). 货架 (registry shelves) vs L1''s 架子 (sys.path). 门 (the Docker socket) vs L1''s 门 (PATH folders; the same picture family). 校验和 (checksum of the copied files) vs 指纹 (fingerprint: the cache badge, the digest) vs digest (the printed word). 访问令牌 (the Docker Hub access token; 令牌 for short once introduced) vs 密码 (a password). 账号 (an account) vs 用户名 (a user name). 磁盘占用 / 内容大小 (docker image ls: DISK USAGE / CONTENT SIZE). 小疏漏 (a small slip) vs 小缺口 (a small gap) vs 小小的不一致 (a small mismatch) vs 小错误 (a small mistake), as L3. 错误 (generic) vs 异常 (a Python exception) vs 报错 (the message on screen) vs 运行时错误 (runtime error), as L1.'
- '[A8] Register: a TA running a lab section. Short instructions, colloquial verbs (装, 跑, 删, 敲, 输入, 改, 建); address the viewer as 你 (one-to-one follow-along; never 您, 大家, 同学们); 我们 is us at recording time (我们没有账号，所以没法跑). Chinese word order; restructure freely inside a sentence. No translationese: no 让我们… (use 我们来… / 先…), no 这就是为什么… (use 所以…), few 被 passives, no chains of 一个…的. No internet slang. Carry the spoken rhythm by meaning: Here''s a fresh virtual machine → 这是一台全新的虚拟机; Just watch → 先看就好; Hold that thought → 先记住这个问题; One surprise → 有个意外; Here''s why the final dot matters → 末尾那个点为什么重要，原因在这儿; Remember lecture 1 → 回想一下第 1 讲; for real → 这次是真的; plenty → 够用了; slid in between → 插到了中间; Docker is fine → Docker 没问题; That''s not a Docker problem → 这不是 Docker 的问题; Before you go, clean up → 走之前，先清理一下.'
- '[A9] Precision. Translate hedges exactly: only 只, every 每个, all 全部, may 可能, usually 通常, under 不到, about 大约, or newer / and newer 及以上, the newest stable 最新的稳定版, by default 默认, right away 马上, at once 一次就. at the time of recording is always 录制时 and never dropped (3.12.15, 0.13.0, 3.15.0, Docker 29, 518 MB, 144 MB, 20.10.24, 26.1.5). Versions, sizes, counts, line numbers and Step numbers match the screen exactly. Errata are gentle and always followed by the fix: a small slip 一个小疏漏 (the README says build the docker container; docker login -p), a small gap 一个小缺口 (no .dockerignore; apt-get update skipped), a small mismatch 一个小小的不一致 (requires-python vs the 3.12 image; the README pulls the instructor''s image). Ponder questions (S06, S07, S09, S11, S13) ask without answering, and the wording must not give the answer away (S07 must not say uv downloads a Python; S06 must not hint the packages are missing; S13 must not say no).'
- '[A10] Names. Products, companies and course names stay Latin (A1 b); 哈佛 only in titles and the description. Course: AC215; lecture 1 → 第 1 讲; last lecture → 上节课; next time → 下节课; today → 今天; part 1 / part 2 → 第一部分 / 第二部分; Containers 2 (next lecture''s title) → 容器 II, as L3''s title; Tutorial 0 stays; the instructor → 授课老师 (never a name); the instructor''s image dlops/simple-translate stays. The user name student, the VM name ac215-l02, the image names simple-translate and simple-translate-ac215, the Docker Hub namespace library and the venv prompt app stay; a container ID is never read out.'
- '[A11] The screen stays English. This series translates the narration only: terminal output and prompts, terminal titles, code panels (comments included), README cards, the three trackers (README › Developing App using Containers, step k of N), tags (your turn, extra, illustration, stand-in · local registry, not Docker Hub, watch only · don''t type, erratum, real capture · 2026-10-13, at the time of recording, preview), the cost dial and the pause-and-ponder cards are all English, and the scenes need no language changes. So when the narration names an on-screen tag, the subtitle names it as the screen shows it: 黄色的 your turn 标签, 灰色的 extra 标签 (L1 wrote “轮到你了” and “额外” because it planned translated tags; L2 and L3 have none). Everything the narration says in its own words is translated: an extra check → 额外检查, as an extra → 这是额外的一步, a stand-in → 替身, the tracker → 进度条, code panels → 代码面板. Narration paraphrasing the README says README 里说…….'
- '[A12] Mainland Simplified Chinese only: 默认, 程序, 代码, 文件, 目录, 服务器, 网络, 内存, 磁盘, 脚本, 视频, 用户名, 信息, 账号, 令牌, 进程, 字节; never 預設, 程式, 程式碼, 檔案, 資料夾, 伺服器, 網路, 記憶體, 磁碟, 腳本, 影片, 使用者, 帳號, 權杖, 行程.'
- '[B1] Spacing. One half-width space between Chinese and Latin letters, digits or artifacts (输入 docker build, Python 3.12, 第 49 行, 11 个包, 518 MB, .git 目录, container 里, 1 号进程, M 系列 Mac). The checker reports a missing space on every displayed sentence. Spaces inside an artifact stay as they are (docker run --rm -ti simple-translate); never add one inside an artifact. No space next to full-width punctuation (……cd simple-translate。, 是 bash，). A slash joining a Chinese placeholder to an artifact takes no space (你的用户名/simple-translate-ac215). Never fake a no-break space with U+00A0 / U+202F.'
- '[B2] Punctuation. Full-width ，。、；：？！“”…… in Chinese text, also next to artifacts (输入 exit。). Lists use 、 (bash、Python、uv). No brackets of any kind, neither （） nor () nor 《》 nor 【】: the checker rejects them on a line with no say:, and the bilingual band needs no gloss. “” only for a quoted thought or word in Chinese; artifacts and tag names are never quoted. No 。？！ inside one Chinese sentence (one per English sentence): use ，；： instead. A full-width colon after 第 N 步 when a description follows. Questions keep ？. The dash —— is allowed (the house font draws it) but a ： usually reads better.'
- '[B3] Symbols and lone dots. The checker rejects maths symbols on a line with no say: (= < > + → ← ^ ≤ ≥ × ÷ ≈, == != +=), a digit followed by !, and letter_letter names (A6). So relations are said in words: 3.13 及以上 (never >=3.13), 低于 3.15, 小于号和大于号. Allowed and kept as on screen: / in paths and names (/usr/local/bin, linux/amd64, dlops/simple-translate), . in file names, - in flags and names, : inside an image name (python:3.12-slim-bookworm), && (用 && 串起来), $$ (echo $$), @ (@ 符号后面). A lone . or ./ is said in words, because a bare dot vanishes among Chinese punctuation: the final dot of the build command → 末尾那个点; COPY copies this folder, dot, into dot slash → 把这个目录，也就是那个点，复制到 image 的根目录，也就是点斜杠 (the English line shows . and ./ through en_display).'
- '[C1] Numbers in display text. Arabic digits for everything that echoes the screen, the terminal or the code: Step numbers (第 1 步 to 第 5 步), line numbers (第 3 行, 第 6 行, 第 7 行, 第 11 行, 第 12 行, 第 49 行), counts the screen shows (7 层 with the 7 layers counter, 4 层, 11 个包, 92 个新软件包, 91 个, exit code 126, 1 号进程, 0 字节), versions, sizes, the date. Chinese numerals for small narrative counts and ordinals: 四个词, 三个进度条, 两个 Python, 两个名字, 一个 ID, 两层新的 / 两个新层, 四个构建步骤, 三行 ENV, 四段, 五个平台, 两种 arm, 两个办法, 两件可选的杂事, 第一部分 / 第二部分, 第一题…第五题, 一个月. When the English uses a word for a number the screen shows as a digit, follow the screen (in seven layers, with the 7 layers counter → 一共 7 层); when the screen shows nothing, follow the English (pause and run both → 两条都跑一遍).'
- '[C2] Units, versions and dates. Sizes as Docker prints them, with a half-width space and the English unit: 50 MB, 63 KB, 518 MB, 144 MB, 97.5 MB, 250 KB, 125 MB, 107 MB, 118 MB; zero bytes → 0 字节; under 50 megabytes compressed → 压缩后不到 50 MB. Versions with their name: Python 3.12, Python 3.12.15, Python 3.14.7, CPython 3.15.0, Python 3.13, uv 0.13.0, uv 0.12.15, Docker 29, 20.10.24, 26.1.5, Debian 12, Debian 13. Ranges: 3.13 及以上; the Python range is open → Python 的范围没有上限. Dates: September 16 → 9 月 16 日; a month apart → 相隔一个月. In speech units are never read out: there is no voice.'
- '[D1] Sentence alignment (explainer/i18n.py). One entry per SAY line of script.md in narration/*.yaml (129 blocks); `en` byte-equal to the SAY line; `zh` has exactly one item per English sentence as split by explainer.voice.split_sentences (371 in this script). Restructure only inside a sentence; never merge or split. Short sentences keep their own item: It''s 3.14.7. → 是 3.14.7。; No. → 不能。 (S06, S13: the answer to a will-it-run question); Why? → 为什么？; Rebuild. → 再构建一次。; Answer Y. → 输入 Y。; Type exit. → 输入 exit。; Now predict. → 先预测一下。; Now a puzzle. → 先出个小题。; Now ponder. → 来想一想。; Now the answer. → 现在揭晓答案。; Two optional chores. → 还有两件可选的杂事。; And why sudo? → 那为什么要 sudo？. Run python -m explainer.i18n check videos/ac215-l02-containers-1 --lang zh until it prints OK.'
- '[D2] No say:, no anchors. There is no Chinese voice: never write say: (the display line is the only text) and never write anchors: (they only place animation beats for a Chinese-voiced render). The subtitles are timed by the English audio; the toolkit pairs each Chinese sentence with its English sentence by position.'
- '[D3] A checker-clean display line. With no say:, every displayed sentence must pass explainer.i18n.spoken_problems: no brackets (B2), no maths symbols (B3), no letter_letter names (A6), no digit followed by !, no clause ending in 种 followed by ，。！？ (rephrase: 两种比较少见的。 is fine, 有两种。 is not), a half-width space between Hanzi and Latin or digits (B1), each sentence ending in 。！？ or …… (optionally followed by ” or 」), and every Latin word in this glossary (zh_subtitle, first_use or allowed_spoken_latin). The checker cuts words with the regex [A-Za-z][A-Za-z''.-]*: simple-translate-ac215 is the word simple-translate-ac, ac215-l02 is ac, /.venv is venv, arm64 is arm, UTF-8 is UTF-. A Latin word it reports is either an English word to translate (the usual case) or a missing artifact: add the artifact to allowed_spoken_latin, cut the same way, and to the matching term.'
- '[D4] The English line (en_display). In the bilingual band the English line shows the SAY sentence, which spells artifacts out for the voice. Every such sentence gets an en_display item with the literal on-screen form, otherwise word for word the SAY sentence; null for the other sentences of the block. Table (SAY → en_display): dash dash rm → --rm; dash t i → -ti; dash t / dash f / dash a / dash u / dash p / dash c / dash i → -t / -f / -a / -u / -p / -c / -i; dash dash progress equals plain → --progress=plain; dash dash platform equals linux slash amd64 → --platform=linux/amd64; linux slash amd64 → linux/amd64; slash bin slash bash → /bin/bash; slash dot venv → /.venv; dot venv → .venv; user local bin → /usr/local/bin; dot dockerignore / dockerignore file → .dockerignore / .dockerignore file; the gitignore file → the .gitignore file; the final dot / this folder, dot → . ; dot slash → ./; docker dot I-O → docker.io; dlops slash simple-translate → dlops/simple-translate; your user name, slash simple-translate-ac215 → <your user name>/simple-translate-ac215; echo dollar dollar → echo $$; docker ps dash a → docker ps -a; git add dash f → git add -f; sudo docker dash dash version → sudo docker --version; docker system prune dash a → docker system prune -a; desktop linux → desktop-linux; FROM python, 3.12, slim bookworm → FROM python:3.12-slim-bookworm; mounted from library python → Mounted from library/python; the virtual env variable → the VIRTUAL_ENV variable; raise exception equals True → raise_exception=True; exit with parentheses → exit(); no module named art → No module named ''art''; too many requests → toomanyrequests; unable to locate package → Unable to locate package. The README placeholder keeps the SAY''s your user name. The English video''s own .srt is unaffected.'
- '[D5] Content parity. Each Chinese sentence translates its English sentence and nothing more: no added commands, flags, glosses, Chinese console names or explanations; 额外 only where the English marks an extra; no Chinese gloss of a kept-English term (the English line is right below). The one licensed change is writing an artifact as the screen shows it where the SAY shortens or spells it (A5, B3), and naming .git and .vscode by their folder names where the SAY says the hidden git folder and the editor''s VS Code folder (隐藏的 .git 目录, 编辑器的 .vscode 目录).'
- '[D6] Fixed patterns. Pause and run it. → 暂停一下，自己跑一遍。 Pause and run both. → 暂停一下，两条都跑一遍。 Pause and do it. / Pause and do that. → 暂停一下，照着做。 Pause and do it now. → 现在就暂停去做。 Pause and build. → 暂停一下，构建一次。 Pause and build again. → 暂停一下，再构建一次。 Pause and run the build. → 暂停一下，跑一下构建。 Pause and create the file. → 暂停一下，把文件建好。 Pause and make yours. → 暂停一下，建好你自己的令牌。 Pause and log in. → 暂停一下，登录。 Pause and run it with your own name. → 暂停一下，用你自己的用户名跑一遍。 Pause now: create your VM, and wait until … → 现在暂停：创建你的 VM，等到…… pause after it → 跑完先暂停. Pause and run it, then … → 暂停一下，自己跑一遍，然后…… Just watch → 先看就好; just watch those → 那些只看就好. When the yellow your-turn tag appears, pause and run the command → 看到黄色的 your turn 标签，就暂停，自己跑这条命令. a gray extra tag marks a check that isn''t in the README → 灰色的 extra 标签表示这个检查 README 里没有. One extra check, not in the README: / An extra check, not in the README: → 额外检查一下，README 里没有这一步： an extra / as an extra / another extra → 这是额外的一步 / 作为额外的一步 / 又一个额外检查. Two extra checks → 两个额外检查. this scene and the next are extras / this scene is all extras → 这一段和下一段都是额外内容 / 这一段全是额外内容. Something to ponder: → 来想一个问题： Now predict. → 先预测一下。 Now a puzzle. → 先出个小题。 Now ponder. → 来想一想。 Now the answer. → 现在揭晓答案。 And the opening question: → 再回到开头那个问题： That answers the question from part 1. → 第一部分留下的问题，这下有答案了。 Hold that thought → 先记住这个问题. Step N adds … → 第 N 步加上…… Dockerfile step 1 → Dockerfile 的第 1 步. Type exit. / Type exit to leave. → 输入 exit。 / 输入 exit 退出。 Five questions to test yourself. → 五道自测题。 One: … Five: → 第一题：…… 第五题： The answers are in the exercises, and every command is in the study guide. → 答案在练习里，每条命令都在学习指南里。 Next time, Containers 2: → 下节课是容器 II：'
- '[D7] Files. narration/g1.yaml = S01-S09 (part 1), narration/g2.yaml = S10-S16 (part 2), as in L1; each starts with a comment header (what it covers, the rules it applies: A6 described artifacts, D4 en_display, no say:/anchors) and keeps the script order. Strings in double quotes; YAML-escape a literal double quote or backslash.'
- '[D8] Length on the English timing. The Chinese is read while the English is heard, and the band switches where the English pieces switch (a Chinese piece that would read faster than 9 units a second gets at most 1 s more). Keep each Chinese sentence about as long to read as the English is to hear: as a rule of thumb at most about 2 units per English word (a CJK character 1, a Latin character 0.55), so cut filler connectives and repeated subjects, never content. Long artifacts count (sudo docker run --rm -ti dlops/simple-translate is about 26 units, python:3.12-slim-bookworm about 14): do not repeat them where the English does not.'
- '[G1] Widths. Bilingual band: a Chinese line holds at most 30 units, the English line 96 characters; the Chinese-only sidecar (.zh.srt) holds 22 units a line, 2 lines a cue. Write clauses of at most about 24 units, separated by ，；：, so the splitter has clean places to cut; avoid a clause longer than 30 units with no punctuation.'
- '[G2] Cue endings: the toolkit drops a cue-final 。，、；： and keeps ？！…… and a closing ” (subtitles.strip_end). Do not end a sentence on an artifact plus a full stop if a Chinese word can close it (……这个 image。 reads better than ……simple-translate。, but both are valid).'
- '[G3] Commands are never broken. The splitter treats a space between two Latin words in a Chinese line as a good cut, so docker run --rm -ti simple-translate or docker system prune -a can land on two lines, which a viewer cannot copy. Put a whole command at the end of a clause after a full-width colon (第 2 步加一行：ENTRYPOINT /bin/bash。), at most one command per cue, with little Chinese around it. The longest commands written out here are sudo docker run --rm -ti dlops/simple-translate (about 26 units) and docker buildx use default; a command that does not fit one line or contains A6 characters is described (docker tag，先写 simple-translate，再写你的用户名/simple-translate-ac215). Check every cue with a command in the rendered .zh.srt.'
- '[H1] Titles (meta.yaml). Video, part and chapter titles in the written register (A4: 容器, 镜像, 基础镜像, 镜像仓库, 标签, 推送, 仓库, 克隆); questions keep their question mark; the English colon structure is kept (Dockerfile 第 1 步：FROM); commands, instructions and file names stay as they are (meta.yaml is not checked, so brackets are fine there). The core-concept chapter carries the English short name for search: 镜像、层、容器与镜像仓库（registry）. Containers I → 容器 I (L3 is 容器 II). The scenes that share an English title with L1 share its Chinese (Tear down, recap, and what''s next → 收尾、回顾和下节预告).'
- '[H2] Description (Bilibili / YouTube): two or three sentences: this is the AC215 lecture 2 follow-along of dlops-io/simple-translate; what the viewer builds and learns (the five-step Dockerfile, build and run, image vs container, ENTRYPOINT and CMD, why a Python 3.12 image runs 3.15, the layer cache, tag and push, platforms, a one-command deploy on a VM with only Docker); English narration with Chinese and bilingual subtitles, every README command verbatim and in order, captures dated 2026-10-13. Written register, terms of this glossary.'
- '[H3] Companions: i18n/zh/README.md (and exercises.md / digest.md if made) are translated with this glossary in the written register (容器, 镜像, 基础镜像, 镜像层, 可写层, 构建上下文, 层缓存, 镜像仓库（registry）, 仓库, 标签, 推送, 拉取, 访问令牌, 多平台构建, 守护进程（daemon）); brackets and underscores are fine there (not checked). Headings and <summary>答案</summary> are translated. A term table at the end: English | the term used here | common variants (镜像层, 构建缓存, 注册中心, 虚悬镜像 for dangling image, 套接字, 守护进程, 清单列表 for manifest list, 构建证明 for attestation).'
- '[H4] Code and commands stay byte-identical in the companions: code blocks, commands, file names and inline `code` are unchanged; only # comments and the prose around them are translated.'
- '[I1] (request, same as L3''s I1) explainer.i18n check applies its voice hygiene (_SPOKEN_BAD: brackets, maths symbols, letter_letter names) to the display line when a sentence has no say:. For a subtitles-only video (this series; video.yaml has no languages.zh.voice and this glossary says voice: none) those checks guard nothing and force A6 and B3. Proposal: skip _SPOKEN_BAD for display-only sentences when the glossary''s voice is none (keep the Latin-word, spacing and sentence-end checks). Then A6 shrinks to the literals: virtual env 这个变量 → VIRTUAL_ENV 这个变量, --progress=plain, --platform=linux/amd64, exit().'
- '[I2] (todo, from L1 I3) explainer/subtitles.py''s _cuts treats a space between Latin words in a Chinese line as a good cut, so commands can be split (G3). Proposal: in a Chinese line, treat a run of Latin tokens separated only by spaces as unbreakable unless it alone exceeds a line.'
terms:
# ---------------------------------------------------------------- the four words: image, layer, container, registry
- en: 'image / images / a Docker image / the official Python image / image name'
  zh_subtitle: 'image / Docker image / image 名 / 镜像（书面）'
  first_use: 'S01：Docker 下载了一个 image，一共 7 层，然后在里面启动一个 shell。S02：一个 Docker image 把这些全都打包成一个可以复制的东西：系统文件、Python、各种包和代码。'
  note: 'Lab speech (A2), measure word 个. Titles, meta.yaml and docs write 镜像 (A4). Never 镜像 in a subtitle (also the everyday word for a mirror). the official Python image → 官方的 Python image; the image''s top folder → image 的根目录.'
- en: 'container / containers / a container is not a small VM'
  zh_subtitle: 'container / 容器（书面）'
  first_use: 'S02：运行一个 image，就得到一个 container：还是那些层，共用，再在最上面加一层薄薄的可写层，外加一个主进程。S02：而且，container 不是一台小 VM。'
  note: 'Lab speech (A2), measure word 个. Titles and docs write 容器. Never 集装箱.'
- en: 'base image / the base image''s Python / inherited from the base image'
  zh_subtitle: 'base image / 基础镜像（书面）'
  first_use: 'S04：额外用 docker image inspect 读一下配置卡片：没有 ENTRYPOINT，CMD 是 python3，是从 base image 继承来的。'
  note: 'Lab speech, and the on-screen brace label base image. the pip of the base image → base image 自带的 pip; from the base → 来自 base image. Written register 基础镜像.'
- en: 'layer / layers / read-only layer / a stack of read-only layers / in seven layers / add a layer'
  zh_subtitle: '层 / 只读层 / 镜像层（书面）'
  first_use: 'S02：一个 image 就是一叠只读层。每一层放的是某个构建步骤新增或改动的文件。'
  note: 'What Chinese engineers say (镜像层 in writing). Never layer in a subtitle. in seven layers (with the 7 layers counter on screen) → 一共 7 层 (C1); add a layer → 加一层; no layer is added → 也没有加层.'
- en: 'writable layer / a thin writable layer / writable layer and all'
  zh_subtitle: '可写层'
  first_use: 'S02：进程结束，container 就停了，而 --rm 会把它删掉，连同可写层一起。'
  note: 'As L3. thin → 薄薄的.'
- en: 'process / main process / process number 1 / the container lives as long as that process'
  zh_subtitle: '进程 / 主进程'
  first_use: 'S09：第二次运行时，额外检查 echo $$ 显示 bash 是 1 号进程。只要这个进程还在，container 就还在。'
  note: 'process number 1 → 1 号进程; PID 1 is on screen only. It ended the container''s process → 它结束了 container 的进程.'
- en: 'class / instance'
  zh_subtitle: '类 / 实例'
  first_use: 'S02：可以把 image 想成一个类，每个 container 就是一个实例。'
  note: 'The OOP analogy. 实例 is also L1''s GCP instance; the console page VM instances stays English.'
- en: 'registry / a registry like Docker Hub / stores images by name / shelves'
  zh_subtitle: 'registry / 货架 / 镜像仓库（书面）'
  first_use: 'S02：像 Docker Hub 这样的 registry，按名字把 image 存在货架上。'
  note: 'Lab speech; written 镜像仓库. shelves → 货架 (a store''s shelves), never L1''s 架子 (sys.path shelves). Kept apart from 仓库 (one Docker Hub repository, A7).'
- en: 'tag / a tag / tagged latest / tag the image / latest'
  zh_subtitle: 'tag / 打 tag / latest / 标签（书面）'
  first_use: 'S02：所谓 tag，就是指向某一个 image 的名字，比如 latest。S12：接着给 image 打 tag。'
  note: 'Lab speech: 打 tag, tag 是 latest. In subtitles 标签 is reserved for the on-screen video tags (your turn 标签); in writing 标签 is the Docker tag (chapter 打标签并推送).'
- en: 'kernel / Linux kernel / the core of the operating system / isolated processes / share one Linux kernel'
  zh_subtitle: '内核 / Linux 内核 / 相互隔离的进程'
  first_use: 'S02：VM 会启动自己的内核，也就是操作系统的核心。而 container 是一些相互隔离的进程，共用同一个 Linux 内核。'
  note: 'Standard Chinese. 核心 only inside the gloss the core of the operating system.'
- en: 'Docker Desktop / hidden Linux VM / a small, hidden Linux VM / right on the VM''s own Linux'
  zh_subtitle: 'Docker Desktop / Linux VM'
  first_use: 'S02：在 Mac 或 Windows 笔记本上，Docker Desktop 用一台隐藏的小 Linux VM 来提供这个内核。在云上的 VM 里，Docker 直接跑在 VM 自己的 Linux 上。'
  note: 'unlike Docker Desktop on a Mac → 不像 Mac 上的 Docker Desktop.'
- en: 'operating system / system files / libraries / setup / had to cooperate'
  zh_subtitle: '操作系统 / 系统文件 / 库'
  first_use: 'S02：在第 1 讲里，每台新 VM 都要重新配置一遍，还得操作系统配合。S02：第 1 讲里 venv 隔离不了的东西，系统文件和库，现在都装进了盒子里。'
  note: 'L1: speech never shortens 操作系统 to OS. the box → 盒子 (the TEAL box of the picture).'
# ---------------------------------------------------------------- the Dockerfile and its instructions
- en: 'Dockerfile / a file called Dockerfile / capital D, no extension / the recipe'
  zh_subtitle: 'Dockerfile / 配方'
  first_use: 'S02：配方就是 Dockerfile，Docker 一次读一条指令。S04：在 simple-translate 目录里建一个叫 Dockerfile 的文件：大写 D，没有扩展名。'
  note: 'The file name and the course''s word. recipe → 配方, one word throughout (the recipe for this image → 这个 image 的配方; ship the image, not the recipe → 交付 image，而不是配方). Kept apart from 参考答案 (the solution).'
- en: 'instruction / instructions / one instruction at a time / add a layer / only write on the card'
  zh_subtitle: '指令'
  first_use: 'S02：会改文件的指令，比如 RUN 和 COPY，会加一层。别的指令，比如 CMD，只写在卡片上。'
  note: 'Never 命令 for a Dockerfile instruction (命令 is a command typed in the terminal). add a layer → 加一层; only write on the card → 只写在卡片上.'
- en: 'Dockerfile instructions: FROM / ENTRYPOINT / RUN / COPY / CMD / ENV / the FROM line / the COPY line'
  zh_subtitle: 'FROM / ENTRYPOINT / RUN / COPY / CMD / ENV / FROM 那一行 / COPY 那一行'
  first_use: 'S06：第 3 步加两条指令。RUN pip install uv 用 base image 自带的 pip 来装 uv。'
  note: 'Verbatim, upper case as in the Dockerfile. three ENV lines → 三行 ENV.'
- en: 'Step 1 to Step 5 (the README''s Dockerfile steps) / Dockerfile step 1 / Step 2 adds one line'
  zh_subtitle: '第 1 步 / 第 2 步 / 第 5 步'
  first_use: 'S04：Dockerfile 的第 1 步只有一条指令：FROM python:3.12-slim-bookworm。S05：第 2 步加一行：ENTRYPOINT /bin/bash。'
  note: 'The only steps the narration numbers (the README numbers only these five). The trackers'' step k of N stay English on screen. A BuildKit step is a 构建步骤, never 第 k 步 (A7).'
- en: 'python:3.12-slim-bookworm / slim / bookworm / the official Python image, on a slim Debian 12 called bookworm'
  zh_subtitle: 'python:3.12-slim-bookworm / slim / bookworm'
  first_use: 'S04：这是官方的 Python image，基于精简版的 Debian 12，代号 bookworm。'
  note: 'The SAY spells it FROM python, 3.12, slim bookworm; the Chinese line writes the image name as on screen, en_display gives FROM python:3.12-slim-bookworm (D4). slim → 精简版; bookworm → 代号 bookworm (L1).'
- en: 'config card / the card / settings like environment variables / config only / zero bytes'
  zh_subtitle: '配置卡片 / 环境变量 / 只是配置'
  first_use: 'S02：旁边还有一张小小的配置卡片：放环境变量这类设置，还有要启动哪个程序。'
  note: 'The picture of the image config (L3 refers to it as L2''s 配置卡片). The ENV, ENTRYPOINT and CMD rows are zero bytes: config only → ENV、ENTRYPOINT 和 CMD 这几行都是 0 字节：只是配置.'
- en: 'ENTRYPOINT / CMD / the entrypoint / the command (slot) / default arguments / the program to start / null'
  zh_subtitle: 'ENTRYPOINT / CMD / 默认参数 / null'
  first_use: 'S05：可以把 ENTRYPOINT 想成要启动的程序，把 CMD 想成它的默认参数。S05：ENTRYPOINT 是 bash，CMD 现在是 null。'
  note: 'the program to start → 要启动的程序. The SAY''s lower-case the entrypoint and the command (as config slots) are written ENTRYPOINT and CMD, as the card tiles show. Setting an entrypoint resets the command you inherited → 一设置 ENTRYPOINT，从 base image 继承来的 CMD 就被清空了.'
- en: 'start-up command line / one command line / join / bash, dash c, then that string / the string / a quoted command'
  zh_subtitle: '启动命令行 / 字符串'
  first_use: 'S08：在卡片上，ENTRYPOINT 和 CMD 拼成一条命令行：bash、-c，再加上那个字符串。单独的 bash -c 会运行这个字符串，然后退出。'
  note: 'join → 拼成; CMD holds dash c and one quoted command → CMD 包含 -c 和一条带引号的命令 (A6: the literal with brackets and quotes is never written).'
- en: 'exec bash / swaps this bash for an interactive one / sources the activate script / interactive'
  zh_subtitle: 'exec bash / 交互式 / activate 脚本'
  first_use: 'S08：接着 exec bash 把这个 bash 换成一个交互式的 bash，它保留新的 PATH，还给你一个提示符。'
  note: 'source stays as the command (source 一下, L1); the activate script → activate 脚本 (L1).'
- en: 'solution / Dockerfile.txt / the README points to a solution / copy it over yours with cp'
  zh_subtitle: '参考答案 / Dockerfile.txt / cp'
