# Chinese (zh-CN) metadata for ac215-l20-deployment-pulumi (read by explainer/i18n.py meta(), used by
# explainer/build.py for the subtitles' chapters and the zh descriptions): video title, part titles, chapter
# titles keyed by scene file stem (as video.yaml's scenes), and the Bilibili / YouTube description.
# Titles follow GLOSSARY.md rule H1: written register (容器, 镜像, 仓库, 端口, 虚拟机, 镜像仓库, 堆栈（stack）,
# 置备（provisioning）; A4), the English colon structure kept (nginx：唯一的公共入口; Pulumi：期望状态，而不是步骤;
# 第 2 步：带时间戳的镜像), commands, tools and names as they are (Docker Hub, nginx, Pulumi, SSH, OS Login), the
# core-concept chapters with their English short name once for search (期望状态（desired state）, 置备（provisioning）),
# questions keep their question mark, and S16 in the series' 收尾 pattern. 跟练 = follow-along; Deployment → 部署.
# The title agrees in substance with video.yaml's publish.title_zh ("AC215 第20讲跟练 · 部署：先手动把奶酪 App 部署到一台
# GCP VM，再用 Pulumi 把同样的部署写成代码"), in the series pattern of the other meta.yaml titles; the Bilibili upload
# itself uses publish.title_zh.
# SERIES RULE (A16): no title, chapter or description names the instructor, and none names the unmerged staff branch.
# meta.yaml is not read by `explainer.i18n check`, so brackets are fine here.
title: "AC215 · 第 20 讲：部署——先手动把奶酪应用部署到一台虚拟机，再用 Pulumi 写成代码（跟练：cheese-app-v3）"

parts:
