# Two or three sentences (rule H2), written register, consistent with video.yaml's publish.description_zh but
# without the course-credit line's names (A16). Facts: script.md v2 (S01-S16, two parts at the README's own seam
# between "Deployment to GCP (Manual)" and "Deployment to GCP (Single VM Instance)"); README @ 3ecef56 (main, unchanged
# on the recording day, 2026-11-05); the manual part captured on a fresh Debian 12 stand-in VM, the Docker Hub and
# Pulumi parts on a laptop without a Google account or Docker Hub login, so every cloud step stops at its first real
# error and the successful outcome is described, never shown as output; the toolbox's Dockerfile needed two one-line
# fixes on the recording day; five pause-and-ponder cards and a closing test-yourself set. Paste the chapter
# timestamps from output/chapters.txt under it when uploading.
description: |
  AC215（哈佛 MLOps & LLMOps）第 20 讲“部署”的跟练视频，对照课件逐页讲解，并照着 dlops-io/cheese-app-v3 的 README 一步一步做：上半场手动部署，把镜像推到 Docker Hub，在 Google Cloud 上开一台虚拟机并装好 Docker，建好目录、密钥文件和 Docker 网络，依次启动向量数据库、一次性的加载器（载入 14,356 个 chunk）、API 和前端，最后让 nginx 作为唯一的公共入口；讲清 location 块怎样用一个结尾斜杠去掉 /api-service 前缀，防火墙为什么只开放 80 和 443，以及为什么停掉前端整个网站都会挂掉。
  下半场把同样的部署写成代码：基础设施即代码和 Pulumi 的工作方式（期望状态、state 与实际情况的对比、preview / up / --refresh / -y / destroy），启用四个 API、两个权限不同的服务账号、部署工具箱容器（录制当天它的 Dockerfile 需要两处一行修改才能构建）、OS Login 和 SSH 密钥，再用两个 Pulumi 项目完成课上的六个步骤：带时间戳的镜像、虚拟机与防火墙、置备（provisioning）、通过 SSH 部署容器和 nginx，最后 destroy 并逐项清理。
  英文旁白，配中文和中英双语字幕；录制环境没有 Google 账号，每个云端步骤都展示到它真实的第一个报错为止，并说明你自己的输出应该是什么；虚拟机、磁盘、外部 IP 和镜像存储都会产生费用（视频用金色标签标出），每个部分结尾都有删除步骤和清理清单。
