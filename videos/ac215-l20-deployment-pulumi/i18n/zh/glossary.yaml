# Chinese (zh-CN) glossary and translation rules for ac215-l20-deployment-pulumi (AC215 lecture 20, Deployment:
# the FULL follow-along of dlops-io/cheese-app-v3 @ 3ecef56 (main, 2025-11-28, unchanged on the recording day
# 2026-11-05; the course site links main), README sections "Deployment to GCP (Manual)", "Deployment to GCP (Single VM
# Instance)" and "Delete the Compute Instance / Persistent disk"), code-switching version, SUBTITLES ONLY.
# Audience: Chinese-speaking AC215 grad students who read technical English fluently; register of a Chinese MLOps TA
# running a lab section.
# Precedents and sources of the shared decisions: the series pilot videos/ac215-l01-vms-venvs/i18n/zh (VM, 虚拟机,
# SSH 进去, 控制台, 机器类型, 启动磁盘, 外部 IP, 结算 / 计费, 删除 vs 停止, repo, clone, commit, 分支, 录制时); the
# container lectures ac215-l02-containers-1 to ac215-l04-flexible-workflow-ports (container, image, tag, Dockerfile,
# port, push, pull, registry, 发布, 构建, 构建器, 平台, 缓存, 警告, 无害, 网络, 电话簿, 挂载, volume); ac215-l05-rag (chunk,
# embedding, Chroma, 向量数据库, collection); ac215-l09-ci-testing (路由, 横幅, Ctrl-C); ac215-l10-cloud-connect (加载器,
# Docker 网络, 服务账号, 角色, 令牌, 替身, 如实说明, 小疏漏); ac215-l11-data-labeling-versioning (entrypoint, 一个小疏漏,
# 授课老师); ac215-l14-serverless-deployment (部署, 无服务器, Artifact Registry 仓库 ≠ repo, 存储桶 in the written
# register, the file layout this one follows: rules A-I, term tables per scene, D4 en_display, D9 clause order);
# the exam edition ac215-l16-exam (防火墙, 反向代理, 单点故障-style cloud vocabulary); and ac215-l18-apis-frontend, the
# app this video deploys (前端, 后端, 浏览器, 服务器, 请求, 状态码, 前缀, the A6 / B3 / D3 checker rules, 想一想 for "A
# question."). Every form they fixed is kept where it agrees with this video's captures.
# The BRIEF's glossary heads-up (BRIEF.md "Notes": keep VM, container, image, registry, Docker Hub, Artifact Registry,
# network, port, firewall, network tag, VPC, disk, nginx, reverse proxy, location, upstream, Pulumi, stack, project,
# config, state, backend, provider, resource, preview, refresh, destroy, Output, StackReference, service account, key,
# OS Login, SSH, passphrase, toolbox, timestamp tag in English) was weighed: series consistency wins where an earlier
# lecture fixed a Chinese form (网络 L4/L10, 防火墙 / 反向代理 L16, 磁盘 / 启动磁盘 L1, 服务账号 / 角色 / 密钥 L10/L14,
# 项目 L1/L10, 部署 L14, 工具箱 by the script's own metaphor table); the Pulumi and Terraform words Chinese engineers
# really say in English stay English (stack, state, config, provider, backend, stack reference, provisioning, trigger,
# passphrase, heredoc, location, scopes); resource → 资源, desired state → 期望状态, plan → 计划 (decisions in
# GLOSSARY.md "关键决定").
# There is NO Chinese voice in this series (docs/AC215_SERIES.md rule 8): the Chinese lines are subtitles on the
# English timing (the bilingual band of output/<id>.zh-en.mp4, <id>.zh.srt, <id>.zh-en.srt / .ass). So no say:,
# no anchors, no readings, no durations: only display rules. But `python -m explainer.i18n check` still applies
# its voice hygiene to the displayed line when a sentence has no say: (brackets, maths symbols, letter_letter
# names, Latin words not listed here, a missing half-width space): rules A6, B3 and D3 are how the Chinese line
# stays clean without say:. This lecture's underscored names (deploy_images, deploy_single_vm, create_instance.py,
# provision_instance.py, setup_containers.py, setup_webserver.py, retain_on_delete, instance_ip, docker_build.Image,
# log_format, GCP_PROJECT, CHROMADB_HOST, PULUMI_ACCESS_TOKEN) are written the way the narration says them; the
# plan symbols + ~ - +- and the shell's || true and <…> placeholders likewise (A6, B3).
# SERIES RULE: the instructor's name never appears in a subtitle, a title or the description (A16). Nor does the
# unmerged staff branch (script.md: "never named or shown").
# Human-readable copy in Chinese: GLOSSARY.md (keep the two in sync; its term tables come from this file's data).
# terms[].zh_subtitle = the display form (Chinese subtitle line; titles use the written forms of A4);
# terms[].first_use = an example sentence for the translators, as SNN[k]：<one Chinese sentence for one English
# sentence of SAY block k of scene SNN, k from 0>; each one passes the checker; the narration files reuse them;
# terms[].note = usage (English → Chinese) and the rule tags.
# rules are tagged [A1]..[I3]: A terms, B typography, C numbers, D narration file, G subtitles, H titles and
# companions, I toolkit notes. (L1's E on-screen strings and F voice rules do not apply: nothing on screen is
# translated in this series, and there is no voice.)
# Read by: python -m explainer.i18n check (Latin words allowed in the Chinese line: every Latin word of
# zh_subtitle and first_use, plus allowed_spoken_latin, which lists the words as the checker's regex
# [A-Za-z][A-Za-z'.-]* cuts them: /api-service/status is api-service and status, Pulumi.dev.yaml stays whole,
# cheese-app-v3 is cheese-app-v, AC215 is AC, N2D is N and D) and explainer/subtitles.py, for EVERY video (2-3 word
# English phrases of `en` are kept on one English line; 2-7 character Chinese headwords of zh_subtitle are
# registered in jieba, so zh_subtitle holds terms, not example phrases).
video: ac215-l20-deployment-pulumi
lang: zh-CN (mainland Simplified Chinese)
audience: 'Chinese-speaking AC215 (MLOps & LLMOps) grad students who know Python and basic ML, read technical English fluently, did L1-L18 (a cloud VM, SSH, apt and deleting the VM; Docker images and containers, -p HOST:CONTAINER, bind mounts and docker-shell.sh, Docker networks and container names; service accounts and JSON keys in secrets/ next to the repo; Cloud Run in L14; the cheese app''s API, frontend, vector DB and loader running locally in L18), saw Lecture 20 (one deck, Deployment: Pulumi), and are new to a reverse proxy and its location blocks, prefix stripping, a firewall that opens ports by network tag, infrastructure as code, Pulumi''s loop (program → desired state → diff → provider calls), projects and stacks, state backends, preview / up / --refresh / -y / destroy, OS Login and the sa_ user, Docker over SSH, stack references, remote commands and scripts that are safe to run twice; they follow along with cheese-app-v3 cloned next to their secrets/ folder, Docker running, a GCP project with billing and a Docker Hub account, pausing to run every step. Real money is involved (a VM, two disks, an external IP, registry storage, a state bucket). Register of a Chinese MLOps TA running a lab section.'
voice: none          # subtitles only (video.yaml: Chinese = i18n/zh/narration/*.yaml on the English timing)
policy: 'The Mandarin of a Chinese MLOps TA walking a lab section through a deployment, code-switching only where such a speaker really does, written as subtitles under an English narration. The viewers already say 开一台 VM, SSH 进去, 把 repo clone 下来, 起一个 container, 构建 image, push 到 registry, 发布一个 port, 挂载一个目录, 进到 container 的 shell 里, 按 Ctrl-C, 报 404, 删掉 VM; this lecture adds 在前面放一个 nginx, 走反向代理, 剪掉前缀, 加网络标记, 开防火墙, 写成代码, 跑 pulumi up, 先看 preview, 切 stack, 存 state, 调 provider, 带 --refresh, 别随手加 -y, 进工具箱, 开 OS Login, 生成 SSH 密钥, 走 SSH 部署 container, 跑 destroy. Every choice passes three tests: what is said in a real lab section; the standard, searchable Chinese name (the Google Cloud Chinese console and docs: 控制台, 虚拟机实例, 机器类型, 启动磁盘, 外部 IP, 防火墙规则, 网络标记, 服务账号, 角色, 结算, 计费; the Docker and nginx Chinese literature: 反向代理, 构建器, 构建缓存, 挂载, 网络, 重启策略; general engineering: 基础设施即代码, 期望状态, 资源, 声明式, 单点故障, 校验和, 文件系统, 格式化, 私钥, 公钥, 访问令牌, 占位符, 重定向); and consistency with the series (L1-L18 and the exam editions: every form they fixed is kept). (1) Artifacts verbatim: what the viewer types or matches on screen (commands, flags, file and folder names, paths and URLs, container, network and image names, package and tool names, env vars, console labels and role names, the README headings named as headings, error and log text the narration quotes, status codes) is copied letter for letter, never translated, inflected or quoted; the exceptions the checker forces (an underscore, + = < > or brackets inside the artifact) are written the way the narration says them (A6) and the English line shows the literal (D4). Nothing on screen is translated in this series: terminal output, code panels, README cards, the EXPECTED panel, the schematic console and browser windows, the V1-V8 set pieces, the six-step strip, tags, trackers, lecture tags and the pause-and-ponder and test-yourself cards stay English; only the narration is. (2) Lab-speech English, a closed list (A1 c): from the series repo, clone, commit, container, image, tag, Dockerfile, port, localhost, bucket, registry, push, pull, pipeline, chunk, embedding, collection, volume, shell, entrypoint, diff, release, URL, API, ID, IP, JSON, YAML, CNN, VM, SSH; new here stack, state, config, provider, backend, stack reference, provisioning, trigger, staging, passphrase, heredoc, location, socket, scopes, playbook. (3) Everything else in standard Chinese (A3, A7-A10, A14, A15). (4) The video''s pictures by meaning, one word each, every time: 唯一的公共入口 (one public door: port 80 and nginx), 剪刀 (the scissors: the trailing slash that strips /api-service), 电话簿 (Docker DNS, as L4, L10 and L18; not the script''s suggested 通讯录), 指示灯 (lamps), 工具箱 (the deployment toolbox), 替身 (the stand-in VM, as L10), 围栏 / 门 (the VM''s fences and the firewall gates), 密封的信封 (an Output), 多米诺骨牌 (the provisioning chain), 管道 (the stack reference pipe), 积木 (each command added a block). (5) Written register for titles, meta.yaml and companion docs: 仓库, 克隆, 容器, 镜像, 端口, 镜像仓库（registry）, 存储桶, 虚拟机（VM）, 堆栈（stack）, 状态（state）, 提供方（provider）, 置备（provisioning）. (6) The bilingual band puts the English sentence under every Chinese line, so the Chinese line carries no glosses and no brackets at all (the checker forbids them without say:). (7) The toolkit''s constraints are part of the policy: one Chinese sentence per English sentence (155 blocks, 351 sentences), a checker-clean display line (D3), an en_display wherever the SAY spells an artifact out as words (D4), the English clause order kept (D9). Mainland Simplified Chinese; relaxed, clear lab-section speech, never slangy.'
rules:
- '[A1] Code-switching scope. English stays in three places only. (a) Artifacts, copied letter for letter: commands as typed or named (docker login, docker run, docker rm -f, docker ps, sudo docker --version, curl, echo, cat, exit, sh docker-shell.sh, git log, gcloud auth list, ssh-keygen, pulumi up, pulumi preview, pulumi destroy, pulumi config, pulumi stack init dev, pulumi stack select dev, pulumi login --local, config set, stack init, npm install, blkid, mkfs; the full README command pulumi up --stack dev --refresh -y and pulumi destroy --stack dev --refresh -y), flags (--password-stdin, --rm, --refresh, --stack dev, -y, -i /secrets/ssh-key-deployment, --version), file and folder names (nginx.conf, service.py, docker-shell.sh, Dockerfile, deployment.json, gcp-service.json, Pulumi.yaml, Pulumi.dev.yaml, inventory.yml, ssh-key-deployment, persistent-folder, secrets, conf/nginx, src/deployment, frontend-react, /data, /mnt/disk-1, /secrets, /app; the underscored ones as the SAY says them, A6), repositories (cheese-app-v3), container, network and image names (api-service, frontend, vector-db, cheese-app-vector-db, cheese-app-network, appnetwork, nginx, vector-db-cli), the stack name organization/deploy-images/dev and the stacks dev, staging, production, URLs and paths (/api-service, /api-service/status, /status, /docs, /chroma/chroma), ports (22, 80, 443, 3000, 8000, 9000), status codes and their words (200 OK, 403 Forbidden, 404 Not Found), the network tags and rule name (http-server, https-server, allow-http, compute.Firewall), packages (google-cloud-sdk, google-cloud-cli, buildx, compose), Debian code names (bullseye, bookworm), console labels and role names (VM instances, Compute Admin, Compute OS Login, Artifact Registry Administrator, Storage Admin, Storage Object Viewer, Vertex AI Administrator, Artifact Registry Reader; the API names Compute Engine, Service Usage, Cloud Resource Manager, Artifact Registry), the README headings the SAY names by their exact name (Run vector db cli), the page title Formaggio, the log, error and code text the narration quotes (A13). (b) Products and proper names: Google Cloud, GCP, Compute Engine, Artifact Registry, GCR, Vertex AI, Gemini, OS Login, Docker, Docker Hub, BuildKit, Chroma, TensorFlow, uvicorn, nginx, Next.js, npm, Pulumi, Ansible, Kubernetes, kubectl, gcloud, GitHub, GitHub Actions, Git, Debian, Ubuntu, Python, Apple, Mac, AC215, dlops (the course''s Docker Hub account). (c) Lab-speech English, a closed list: the series'' repo, clone, commit, container, image, tag, Dockerfile, port, localhost, bucket, registry, push, pull, pipeline, chunk, embedding, collection, volume, shell, entrypoint, diff, release, URL, API, ID, IP, JSON, YAML, CNN, VM, SSH; new in this lecture stack, state, config, provider, backend (Pulumi''s state backend only, A7), stack reference, provisioning, trigger, staging, passphrase, heredoc, location (the nginx block), socket, scopes, playbook. Nothing else is code-switched.'
- '[A2] container, image, port, VM and the laptop, as L1-L18. The subtitles say container, image, port, VM (起一个 container, 构建 image, 发布 port 80, 开一台 VM, SSH 进 VM), measure words 个 container / 个 image / 台 VM / 块磁盘; virtual machine → 虚拟机 (one virtual machine in Google Cloud → Google Cloud 里的一台虚拟机), VM → VM (follow the English, L1 A2); a VM instance → VM 实例; the VM instances list → VM 实例列表 (the console page is named VM instances when the SAY names it as a page: open VM instances → 打开 VM instances); your laptop → 你的笔记本; your own computer → 你自己的电脑; the laptop''s Docker → 你笔记本上的 Docker. Titles, chapter names, meta.yaml and companion docs write 容器, 镜像, 端口, 虚拟机（VM） (A4).'
- '[A3] Deployment, the web server and the cloud (L1, L14, L16). deploy → 部署 (deploy the containers → 部署 container; the automated deployment → 自动化部署; manual route → 手动部署); deployment, scaling and automation → 部署、扩展和自动化; the server → 服务器 (Users need a server → 用户需要的是一台服务器); web server → Web 服务器 (a web server in front → 在前面放一台 Web 服务器); reverse proxy → 反向代理 (L16); forward → 转发; listens on → 监听; the console → 控制台 (In the console → 在控制台里); machine type → 机器类型; boot disk → 启动磁盘; disk → 磁盘; data disk → 数据磁盘; a second disk → 第二块磁盘; external IP → 外部 IP (L1); firewall → 防火墙 (L16); firewall rule → 防火墙规则; network tag → 网络标记 (the Google Cloud Chinese console''s word); the network edge → 网络边界; a cloud network → 云网络 (the VPC: write VPC only where the SAY says VPC); billing → 结算 (a Google Cloud project with billing → 一个开通了结算的 Google Cloud 项目); bills while it runs → 运行时计费; costs real money → 会花真钱; roughly two dollars a day → 大约每天两美元; project → 项目 (GCP project and Pulumi project alike; your group''s project → 你们组的项目; the README''s default → README 的默认值 / README 的默认项目); your project ID → 你的项目 ID; region / zone → 区域 / 可用区 (L1, if a revision says them).'
- '[A4] Written vs spoken pairs. Subtitles say repo / clone / container / image / port / VM / registry / bucket / stack / state / provider / provisioning; titles, chapter names, meta.yaml and the companion docs write 仓库 / 克隆 / 容器 / 镜像 / 端口 / 虚拟机（VM）/ 镜像仓库（registry）/ 存储桶 / 堆栈（stack）/ 状态（state）/ 提供方（provider）/ 置备（provisioning）, each gloss once per document. Products stay as they are everywhere (Pulumi, nginx, Docker Hub, Artifact Registry, OS Login).'
- '[A5] Writing artifacts. Copied verbatim (case, dots, slashes, hyphens, colons unchanged); never translated, inflected, quoted, put in 《》 or code formatting. Add a Chinese head noun where it helps: nginx.conf 文件, secrets 目录, src/deployment 目录, cheese-app-network 网络, api-service 这个 container, --refresh 参数, http-server 标记, Run vector db cli 这一节. A lower-case command, tool, flag or file name never opens a Chinese sentence (as the English never does): The web server looks up … → Web 服务器……; Up previews … → 命令 up 先预览……; Destroy plays … → pulumi destroy 把……; Exec into … → 用 exec 进到……; Create instance builds … → 在 create instance 里，先……; Many providers → 支持很多 provider.'
- '[A6] Artifacts the checker rejects. With no say:, the checker reads the display line as speech and rejects letter_letter names, maths symbols (+ = < > → and friends) and brackets of any kind. So these are never copied into the Chinese line; they are written the way the narration says them, and the English line carries the literal (D4): deploy_images → deploy images; deploy_single_vm → deploy single VM; create_instance / provision_instance / setup_containers / setup_webserver (.py) → create instance / provision instance / setup containers / setup webserver; retain_on_delete → retain on delete; instance_ip → instance IP; docker_build.Image → docker build Image; log_format → log format; GCP_PROJECT → GCP project 变量 (never just GCP project, which is the GCP 项目); CHROMADB_HOST → Chroma DB host; PULUMI_ACCESS_TOKEN must be set → Pulumi access token must be set; the plan symbols + ~ - +- → 加号、波浪号、减号、加减号; the README placeholder <…> → 占位符 and its angle brackets → 尖括号 (never the characters); Ctrl+C → Ctrl-C (L18). Allowed as written, because the checker accepts them: || true (no Latin word with an underscore, no maths sign), sa_ (nothing follows the underscore: 以 sa_ 开头的用户名), blkid, mkfs, organization/deploy-images/dev, -i /secrets/ssh-key-deployment, /api-service/status.'
- '[A7] Words to keep apart. backend → backend only for Pulumi''s state backend (the local backend → 本地 backend; a bucket login → 登录 bucket) ≠ 后端 (the app''s backend, L18; not said in this script). state → state (Pulumi''s record of what it created: its state, the state file, the state bucket → 它的 state、state 文件、state bucket) ≠ 期望状态 (desired state) ≠ 当前状态 (current state, S09[4]: compares desired with current → 比较期望状态和当前状态) ≠ 实际情况 (reality: what really exists). config → config for Pulumi''s config (config set, the config shows → config 显示, Pulumi config replaces it → Pulumi 的 config 取代了它) ≠ 配置 (generic: a Docker config → 一份 Docker 配置, its config file → 它的配置文件, nginx''s config). project → 项目 (GCP and Pulumi) ≠ repo (Git; this repository → 这个 repo) ≠ 仓库 (an Artifact Registry repository → Artifact Registry 仓库 / registry 仓库, as L14). provider → provider (Pulumi''s plugins; a Docker provider whose host is SSH → 一个 host 是 SSH 的 Docker provider) ≠ 服务方 (L14''s translation service). output → 输出 (Pulumi outputs: six outputs → 六个输出; an output, a sealed envelope → 一个输出，一个密封的信封) ≠ 打印 (a command prints → 打印 / 输出; yours prints updated → 你的会输出 Updated). redirection → 重定向 (the shell''s < >; L18''s HTTP 307 is another video). network → 网络 (Docker network: cheese-app-network 网络; cloud network: 云网络; network tag: 网络标记; network share → 网络共享). key → 密钥 (service-account key, SSH key) ≠ 令牌 (access token, L10) ≠ 凭据 (credentials). builder → 构建器 ≠ build → 构建. image layer → image 层 ≠ the VM''s Docker.'
- '[A8] Pulumi and infrastructure as code (new in this lecture). infrastructure as code → 基础设施即代码 (That is infrastructure as code. → 这就是基础设施即代码。); a real programming language → 一门真正的编程语言; Pulumi program → Pulumi 程序; says what should exist, not what to do → 说的是应该存在什么，而不是要做什么; desired state → 期望状态; a tree of resources → 一棵资源树; resource → 资源; constructor → 构造函数; logical name → 逻辑名; arguments → 参数; registers the resource → 注册这个资源; the command line tool → 命令行工具; loads its state → 加载它的 state; checks that state against what really exists → 拿这个 state 和实际存在的东西核对; difference → 差异; plan line → 计划里的一行; the plan → 计划; create / update / delete / replace → 创建 / 更新 / 删除 / 替换; providers, plugins for Google Cloud, Docker and more → provider，也就是 Google Cloud、Docker 等等的插件; makes the API calls → 去调 API; stack → stack (stacks of one program → 同一个程序的不同 stack); environment → 环境; stack init / select → stack init / stack select (commands); its full name → 它的全名; the local backend → 本地 backend; a bucket login → 登录 bucket; Pulumi offers its own cloud → Pulumi 会推荐它自己的云服务; preview → preview (the command and its run: a preview never builds → preview 从来不构建; the real preview → 真正的 preview); up → up (run up → 运行 up; each up → 每次 up); destroy → destroy (the command; the destroy block → destroy 那一块); refresh → refresh / --refresh (refresh only as a flag → refresh 只作为参数出现; the refresh flag → --refresh 参数); dash y → -y; stack reference → stack reference; output → 输出 (A7); remote command → 远程命令; provisioning → provisioning (step 4; the verb provision it → provision 实例 only as the file name''s action in S14[3]); trigger → trigger; checksum → 校验和; idempotent / safe to run twice → 跑两次也安全 / 可以放心重跑 (speech never says 幂等, as L1); declarative → 声明式; components → 组件; principles → 原则.'
- '[A9] Register: a TA running a lab section. Short instructions, colloquial verbs (跑, 起, 停, 开, 敲, 改, 贴, 加, 存, 拷, 删, 点, 挑, 收拾, 推, 拉); address the viewer as 你 (one-to-one follow-along; never 您, 大家, 同学们; Rather than each of you installing → README 没让你们每人各装一套 is the one plural, as the English); 我们 is us at recording time (ours holds just the placeholder → 我们的只有占位符; our recording machine → 我们录制用的机器; our stand-in → 我们的替身). Chinese word order inside a clause; the English clause order is kept (D9). No translationese: not 让我们…… (say 我们来…… / 先……), not 这就是为什么…… (say 所以……), few 被, no strings of 一个……的. No internet slang. Carry the spoken rhythm by meaning: Let''s count what we typed → 我们来数一数敲了什么; Let''s draw the goal properly → 我们把目标好好画一遍; Now the puzzle → 现在回答开头的谜题; Last → 最后; Next → 接下来; Then → 然后; Better: → 更好的做法：; Run it again. → 再跑一次。; Two footnotes. → 两个补充说明。; One surprise: → 有个意外：.'
- '[A10] Precision. Translate hedges and quantifiers exactly: only 只, every 每个 / 每次, each 每个 / 各, all 全部 / 所有, at once 马上, almost 几乎, about 大约, roughly 大约, never 从不 / 从没 / 千万别 (never show it → 千万别给人看), still 还 / 仍然, already 已经, again 又 / 再, first 先, once 一次 / 只……一次 (looks up … once, at start → 只在启动时查一次), exactly 正好 / 原样 (typed exactly as the README prints it → 照 README 印的原样敲), too 也, at the time of recording → 录制时 (no tool version is spoken; the tags stay on screen); the recording day → 录制当天; our recording → 我们的录制. Counts, ports, codes, sizes and times match the screen (C1). Keep 我们的 / 你的 (yours prints … → 你的会输出……; yours goes on to … → 你的会继续……). Errata and the slide-vs-capture differences are said as gently and briefly as the English, one phrase each for the whole video, as L5 and L9-L18: A small slip: → 有一个小疏漏：(S05 Chroma saves to /data; S12 inventory.yml; S15 the SSH command without the key); A small note: → 说明一点：(S02 /status); One note: → 说明一点：(S15 the Gemini model); One honest note: → 如实说一句：(S01, the sandbox framing, the series phrase); One step is missing from the README → README 漏了一步; the slide draws its arrowheads the other way → 课件上的箭头方向是反的; slide 21 still calls it GCR, its retired name → 课件第 21 页还叫它 GCR，这是它退役的旧名字. Never as correcting anyone. The sandbox framing (S01[7]) is as plain as the English, no apology; every later honest error is just the next line (Ours … ; yours … → 我们的……；你的……). Ponder questions (S05[6], S07[9], S09[9], S14[10], S15[8]) ask only, without hints: S05[6] does not say still / in the database; S07[9] does not say firewall / no; S09[9] does not say nothing / empty; S14[10] does not say erase / data; S15[8] names neither key. The answers use the question''s own words (No. → 不会。 for S05, 不能。 for S07; Nothing to do. → 什么都不用做。; Because formatting erases. → 因为格式化会清空数据。; The gcp service key → gcp-service 的密钥).'
- '[A11] The screen stays English. This series translates the narration only: terminal output and prompts, terminal titles (cheese-app-vm, laptop, laptop · toolbox), code panels (comments included), README cards and the EXPECTED panel, the trackers (README › Deployment to GCP (Manual), README › Deployment to GCP (Single VM Instance), step k of N, extra captions), the lecture tags (Lecture 20 · slides a–b), tags (your turn, extra, extra · our spelling, extra · not for you, extra · recording only, illustration, expected · README:306–314, erratum, at the time of recording, the README''s default · change to yours, the GOLD cost tags and the disk chip), the schematic console, Docker Hub and browser windows, the V1-V8 set pieces, the six-step strip (1 Setup · 2 Images · 3 VM · 4 Provision · 5 Containers · 6 Web server), the puzzle card and sticky note, and the pause-and-ponder and test-yourself cards are English; no scene changes for Chinese. When the SAY names a screen tag, the subtitle copies it or names it by colour: 黄色的 your turn 标签; 金色标签; 进度条. The narration''s own words are translated: the tracker → 进度条; an extra → 额外 (An extra check → 一个额外检查; Three extra curl checks → 三个额外的 curl 检查; The extra preview → 额外的 preview; extra, and not for you → 这是额外步骤，你不用照做); code panels name their file and lines → 代码面板标出文件和行号; the README card → README 卡片; the six steps → 六步.'
