invalid_grant: Invalid grant: account not found, has no installation candidate, Skipping preview build, No credentialed accounts, Created stack ''dev''); http server → http-server; https server → https-server; allow http → allow-http; compute Firewall → compute.Firewall; persistent folder → persistent-folder; conf nginx → conf/nginx; frontend react → frontend-react; src deployment → src/deployment; vector db cli → vector-db-cli; or true → || true; the remove flag → --rm; ssh keygen → ssh-keygen; ssh key deployment → ssh-key-deployment; google cloud SDK → google-cloud-sdk; google cloud CLI → google-cloud-cli; docker build Image → docker_build.Image; instance IP → instance_ip; plus, tilde, minus, plus minus → +, ~, -, +-; slash api service slash status → /api-service/status; dash i slash secrets slash ssh key deployment → -i /secrets/ssh-key-deployment; pulumi stack init dev, pulumi stack select dev, stack init, config set → as is; block ID → blkid; make file system → mkfs; dash dash version → --version; E O F → EOF; N 2 D → N2D; A M D 64, ARM 64 → AMD64, ARM64; S A → sa_; version three point zero → version 3.0; log format → log_format. Not restored: the README step headings, port numbers, the stage and step numbers. The English video''s own .srt is not affected.'
- '[D5] Content parity. Each Chinese sentence translates its English sentence only: no added commands, flags, glosses, Chinese screen names or explanations; kept-English words get no Chinese explanation (the English line is right below); ponder questions get no answers (A10). Head words A5 needs (这个, 命令, 参数, 目录, 文件, 标记, 网络, 变量, 这一节) carry no content. An extra in the English is 额外; marked extra → 标成 extra.'
- '[D6] Fixed patterns (L9-L18''s, extended). The tracker in the corner names the README step, code panels name their file and lines, and a yellow tag, your turn, means pause and run it. → 角落里的进度条标出 README 的哪一步，代码面板标出文件和行号，黄色的 your turn 标签表示暂停一下，自己跑一遍。 Pause and run it. → 暂停一下，跑一遍。 Pause here and install Docker on your VM. → 在这里暂停一下，在你的 VM 上装好 Docker。 Pause and run these three steps. → 暂停一下，把这三步跑一遍。 Pause and run both containers now. → 暂停一下，现在把两个 container 都跑起来。 Pause and start both. → 暂停一下，两个都启动起来。 Pause and open your site. → 暂停一下，打开你的网站。 Pause and delete yours; the list should be empty. → 暂停一下，删掉你的；列表应该是空的。 Pause and place your keys. → 暂停一下，把你的密钥放好。 Pause and make both edits. → 暂停一下，把两处都改好。 Pause and run both. → 暂停一下，两个都跑一遍。 Pause, run all three, and check Docker Hub. → 暂停一下，三个都跑一遍，再去 Docker Hub 上看看。 Pause, set all three, and check them with pulumi config. → 暂停一下，三个都设好，再用 pulumi config 检查。 Then pause and run up. → 然后暂停一下，运行 up。 Pause and run yours. → 暂停一下，跑你的。 A question. → 想一想。 (as the earlier lectures) Remember the earlier question? → 还记得前面那个问题吗？ Hold that thought → 先记住这一点. Today''s puzzle: → 今天的谜题：. Now the puzzle. → 现在回答开头的谜题。 Test yourself. → 自测一下。 Your teardown checklist. → 你的清理清单。 One: … Six: → 第一：……第六：. Stage n: → 第 n 阶段：. Step n: → 第 n 步：. Fix 1: / Fix 2: → 修复 1：/ 修复 2：. A small slip: → 有一个小疏漏：; A small note: / One note: → 说明一点：; One honest note: → 如实说一句：; One surprise: → 有个意外：; Better: → 更好的做法：; An extra check: → 一个额外检查：; Two footnotes. → 两个补充说明。 Picture words (policy 4): one public door → 唯一的公共入口; the phone book → 电话簿; the toolbox → 工具箱; a stand-in → 替身; the fences → 围栏; firewall gates → 防火墙门; a sealed envelope → 密封的信封; a block (S08) → 一块积木; the prefix was cut → 前缀被剪掉了.'
- '[D7] Files. narration/g1.yaml = S01-S08 (part 1, by hand: the hook, the goal and the README''s check, Docker Hub, the VM with Docker, folders, key and network, the vector DB and its loader, the API and the frontend, nginx as one public door and the puzzle''s answer, the twenty-one commands and the manual teardown); narration/g2.yaml = S09-S16 (part 2, as code: desired state, setup with two keys, the toolbox fixed twice, SSH and OS Login, the images stack, the VM stack and provisioning, containers over SSH and the test, destroy and recap). Each file starts with a comment naming its scenes and the script version it was made from (script.md v2, 2026-11-06).'
- '[D8] Length on the English timing. The Chinese is read while the English plays; the band switches where the English switches. Each Chinese sentence should be readable in the time its English sentence is heard: at most about 2 units per English word (a Hanzi counts 1, a Latin letter 0.55), so drop redundant connectives and repeated subjects, never content. Long artifacts cost length too (pulumi up --stack dev --refresh -y 17.6, pulumi destroy --stack dev --refresh -y 20.4, organization/deploy-images/dev 17.6, -i /secrets/ssh-key-deployment 17, Invalid grant: account not found 17.6, Artifact Registry Administrator 17, syntax error near unexpected token newline 22.5, Pulumi access token must be set 17.6, has no installation candidate 15.4, cheese-app-vector-db 11): do not repeat what the English does not; after the first time use the short form (这个 container, 这个文件, 这个 stack, 这个参数, 这个报错).'
- '[D9] Keep the English clause order (series lesson, ac215-video skill). The toolkit pairs Chinese and English clause by clause; a condition the English puts last but the Chinese puts first swaps meaning between two neighbouring cues. Keep conditions, purposes and time phrases where the English has them: delete this VM now, before part 2 → 现在就删掉这台 VM，在第 2 部分之前; We create it with one extra gcloud line in the next step, once the deployment container runs; skip it, and the push fails → 我们在下一步用一行额外的 gcloud 命令创建它，等部署 container 跑起来以后；跳过这一步，push 就会失败; Four: the part 1 VM, if it still runs → 第四：第 1 部分的 VM，如果它还在运行; The state bucket, last, once no stack holds anything → state bucket，最后删，等没有任何 stack 还占着东西的时候; Yours lists the deployment account as active; if not, check … → 你的会把 deployment 账号列为 active；如果没有，就检查……. Where the English opens with if, with, without, while, when, in, then or so (S02[5], S03[8], S07[2].1, S12[1].1, S13[3].1, S13[3].2, S16[1].0), the Chinese opens the same way.'
- '[G1] Width. Bilingual band: a Chinese line at most 30 units, an English line 96 characters; .zh.srt cues 22 units a line, 2 lines. Keep clauses under about 24 units, separated by ，；：、 so the cutter has clean cuts; never a clause over 30 units without a mark. The long artifacts (D8) take a clause of their own; S01[3], S02[0], S04[0], S04[1], S07[2], S09[0], S10[2], S10[3], S11[1], S11[9], S14[4] and S15[10] get a comma at each English clause break.'
- '[G2] Cue ends: the toolkit strips 。，、；： at the end of each cue and keeps ？！…… and a closing ” (subtitles.strip_end). Prefer ending a clause on a Chinese word rather than on artifact + 。 where the English allows (……放进 secrets 目录里。 reads better than ……secrets。); the quoted terminal text (access denied, Compiled successfully, 403 Forbidden, No credentialed accounts) may close a sentence as it does in the English.'
- '[G3] Names and commands are never split. The cutter treats a space between two Latin words in a Chinese line as a good cut, so pulumi up --stack dev --refresh -y, pulumi destroy --stack dev --refresh -y, pulumi stack init dev, pulumi login --local, gcloud auth list, docker rm -f, sudo docker --version, Invalid grant: account not found, No credentialed accounts, syntax error near unexpected token newline, has no installation candidate, Pulumi access token must be set, Run vector db cli, Compute OS Login, Artifact Registry Administrator, Storage Object Viewer, Vertex AI Administrator, Cloud Resource Manager, do you want to perform this update and deploy single VM could land on two lines. Put them at a clause end, after a full-width colon or 、, with little Chinese around them, at most one long label per cue; after the .zh.srt is rendered, check every cue with a command, a log phrase or a role name.'
- '[H1] Titles (meta.yaml). Video, part and chapter titles in the written register (A4: 容器, 镜像, 仓库, 端口, 虚拟机（VM）, 镜像仓库, 堆栈（stack）, 置备（provisioning）); questions keep their question mark; the English colon structure is kept (nginx：唯一的公共入口; Pulumi：期望状态，而不是步骤; 第 2 步：带时间戳的镜像); commands, tools and names as they are (Docker Hub, nginx, Pulumi, OS Login, SSH, Artifact Registry); meta.yaml is not read by the checker, so brackets are fine there. The video title uses the series pattern AC215 · 第 n 讲：…（跟练：…）, in substance the same as video.yaml''s publish.title_zh (部署：先手动把奶酪 App 部署到一台 GCP VM，再用 Pulumi 把同样的部署写成代码). The core-concept chapters carry their English short name once where the Chinese is not the usual search word (期望状态（desired state）; 置备（provisioning）). The recap follows the series 收尾 pattern (Destroy, recap, and what''s next → destroy、回顾和下节预告). No title names the instructor (A16).'
- '[H2] Description (Bilibili / YouTube): two or three sentences, written register, this glossary''s terms: the follow-along of AC215 lecture 20 against the slides and the README step by step (part 1 by hand: Docker Hub, a VM with Docker, five containers with a one-shot loader, nginx as the only public entrance; part 2 as code: Pulumi''s desired state, two service accounts, the toolbox''s two one-line fixes, OS Login and SSH, two Pulumi projects for the lecture''s six steps, destroy and the teardown checklist), the honest-errors framing (no Google account on the recording machine), the GOLD costs. No instructor name (A16); the course credit line with names lives only in video.yaml''s publish block.'
- '[H3] Companions: i18n/zh/README.md (and exercises.md / digest.md if made) are translated with this glossary in the written register (A4: 仓库, 克隆, 容器, 镜像, 端口, 虚拟机（VM）, 镜像仓库（registry）, 存储桶, 堆栈（stack）, 状态（state）, 提供方（provider）, 置备（provisioning）, 反向代理, 防火墙, 网络标记, 服务账号, 密钥), each gloss once per document.'
- '[H4] Code and commands in companions stay byte for byte: code blocks, commands, file names and inline `code` are unchanged; only # comments and the prose around them are translated.'
- '[I1] (request, open since L3) explainer.i18n check applies the voice hygiene of the display line when a sentence has no say: (_SPOKEN_BAD: brackets, maths symbols, letter_letter names, the 种 rule). For a subtitles-only video (this series; video.yaml has no Chinese voice) the display could be allowed brackets and underscores, which would let deploy_images, retain_on_delete and the plan symbols be written literally. Until then A6 and B3 apply.'
- '[I2] (open, from L1 I3) explainer/subtitles.py _cuts treats a space between Latin words in a Chinese line as a good cut, so commands, log phrases and role names can be split (G3). Proposal: in a Chinese line, treat a run of Latin words joined only by spaces as one token.'
- '[I3] (note) explainer/subtitles.py reads every video''s glossary.yaml: 2-3 word English phrases of each term''s en are kept on one English line, and the 2-7 character Chinese headwords of zh_subtitle are registered in jieba, for all videos'' subtitles. So every zh_subtitle here holds terms separated by " / ", never example phrases.'
terms:
# ---------------------------------------------------------------- S01 One container stops, the site goes dark
- en: 'stopped one container / the frontend / restarted the web server in front of it / still up / vector database'
  zh_subtitle: '停掉 / 前端 / Web 服务器 / 重启 / 向量数据库'
  first_use: 'S01[0]：我们停掉了一个 container，也就是前端，又重启了它前面的 Web 服务器。'
  note: 'A3, A15. The API container is still up, and so is the vector database → API 的 container 还在运行，向量数据库也是. web server → Web 服务器 (capital W, a space before 服务器, B1).'
- en: 'the whole site answers nothing / the address of the API / today''s puzzle / dead'
  zh_subtitle: '整个网站 / 地址 / 谜题 / 不通'
  first_use: 'S01[2]：今天的谜题：API 明明在运行，为什么它的地址也不通了？'
  note: 'D6. Yet the whole site answers nothing, the address of the API included → 可整个网站什么都不响应，连 API 的地址也一样. We answer it once we have built this by hand → 我们会在手动把它建出来以后回答 (D9: the main clause first, as the English).'
- en: 'the lecture''s picture of deployment / one virtual machine in Google Cloud / port 80 the only door / build it twice / by hand / as code'
  zh_subtitle: '部署 / 虚拟机 / Google Cloud / 唯一的入口 / 手动 / 写成代码'
  first_use: 'S01[3]：我们把它建两遍：先手动，再写成代码。'
  note: 'A2, A3, policy 4. Here is the goal, the lecture''s picture of deployment: the containers from your laptop move to one virtual machine in Google Cloud, with port 80 the only door → 目标在这里，也就是课上画的部署图：你笔记本上的 container 搬到 Google Cloud 里的一台虚拟机上，port 80 是唯一的入口 (G1: a comma at each clause break).'
- en: 'course roadmap / the marker / deployment, scaling and automation / users need a server'
  zh_subtitle: '课程路线图 / 标记 / 扩展 / 自动化 / 服务器'
  first_use: 'S01[4]：在课程路线图上，标记已经移到了部署、扩展和自动化。'
  note: 'A16. Everything so far ran on your own computer → 到目前为止，一切都跑在你自己的电脑上. Users need a server → 用户需要的是一台服务器.'
- en: 'cheese app version 3 / your secrets folder beside it / a Google Cloud project with billing / Docker Hub account / real money / deleting everything'
  zh_subtitle: 'cheese-app-v3 / secrets 目录 / 结算 / Docker Hub 账号 / 花真钱'
  first_use: 'S01[5]：这会花真钱，所以每个部分最后都会把所有东西删掉。'
  note: 'A3, A14, C2. You need cheese app version 3 with your secrets folder beside it, a Google Cloud project with billing, and a Docker Hub account → 你需要 cheese-app-v3，旁边放着你的 secrets 目录，还要一个开通了结算的 Google Cloud 项目和一个 Docker Hub 账号.'
- en: 'tracker / README step / code panels name their file and lines / yellow tag / your turn / pause and run it'
  zh_subtitle: '进度条 / 代码面板 / 行号 / your turn 标签'
  first_use: 'S01[6]：角落里的进度条标出 README 的哪一步，代码面板标出文件和行号，黄色的 your turn 标签表示暂停一下，自己跑一遍。'
  note: 'A11, D6, as L9-L18.'
- en: 'one honest note / recording machine / no Google account / no Docker Hub login / a machine you own / first honest error / what yours prints'
  zh_subtitle: '如实说一句 / 录制用的机器 / 登录 / 报错'
  first_use: 'S01[7]：如实说一句：我们录制用的机器没有 Google 账号，也没有登录 Docker Hub。'
  note: 'A10, A13: the sandbox framing, said once, plain. What runs on a machine you own is real; every cloud step stops at its first honest error, and we say what yours prints → 在自己的机器上能跑的都是真的；每个云端步骤都停在它第一个真实的报错处，我们会说你的会输出什么.'
# ---------------------------------------------------------------- S02 From your laptop to one VM
- en: 'a browser sends a request / passes pages to the frontend / data calls / asks the vector database'
  zh_subtitle: '浏览器 / 请求 / 页面 / 数据请求'
  first_use: 'S02[0]：浏览器把请求发到 port 80，nginx 在那里把页面交给 port 3000 上的前端，把数据请求交给 9000 上的 API。'
  note: 'L18 A3. Let''s draw the goal properly → 我们把目标好好画一遍. The API asks the vector database on 8000 → API 去问 8000 上的向量数据库.'
- en: 'arrowheads the other way / the way they travel / four containers / a fifth / a loader that fills the vector database once and then leaves'
  zh_subtitle: '箭头 / 加载器 / 第五个'
  first_use: 'S02[1]：还有第五个：一个加载器，它把向量数据库填满一次，然后就退出。'
  note: 'A10, A15. The slide draws its arrowheads the other way; we draw requests the way they travel → 课件上的箭头方向是反的；我们按请求实际走的方向画. The slide shows four containers → 课件上画了四个 container.'
- en: 'the manual route / four stages / push the images / set up the VM / deploy the containers / put a web server in front / our map for part 1'
  zh_subtitle: '手动部署 / 四个阶段 / push / 部署 / 地图'
  first_use: 'S02[2]：课上把手动部署分成四个阶段：push image、配置 VM、部署 container，再在前面放一台 Web 服务器。'
  note: 'A3, A16. That is our map for part 1 → 这就是我们第 1 部分的地图.'
- en: 'starts with a check, not a command / run locally / shows its docs / home page'
  zh_subtitle: '检查 / 本地 / 文档页 / 首页'
  first_use: 'S02[3]：README 一开头是一个检查，不是命令：你的 container 都在本地跑着。'
  note: 'A15. The vector database is up, the API shows its docs on port 9000, and the frontend its home page on 3000 → 向量数据库已经起来了，API 在 port 9000 上显示文档页，前端在 3000 上显示首页.'
- en: 'a small note / slash status / a better API check / version three point zero / which code runs'
  zh_subtitle: '说明一点 / /status / 版本 3.0'
  first_use: 'S02[4]：说明一点：在这份代码上，/status 比文档页更适合用来检查 API。'
  note: 'A10, C2, D4 (slash status → /status; version 3.0). It answers version three point zero, so you know which code runs → 它返回版本 3.0，所以你知道跑的是哪份代码.'
- en: 'lecture 18 / a refactored version 2 / version 3 / this repository''s scripts / main / the branch the course site links / this November 2025 commit / git log'
  zh_subtitle: '第 18 讲 / 重构 / v2 / v3 / main 分支 / 课程网站 / git log'
  first_use: 'S02[6]：我们跟着 main 分支走，也就是课程网站链接的那个分支；录制当天它停在 2025 年 11 月的这个 commit 上。'
  note: 'A16, C2, D9. If you followed lecture 18 lately, it now teaches a refactored version 2; here you run version 3, with this repository''s scripts → 如果你最近跟过第 18 讲，它现在讲的是重构过的 v2；这里你跑的是 v3，用的是这个 repo 自己的脚本. READMEs change; git log shows which one you have → README 会变；git log 能告诉你手上的是哪一版. main always with 分支, never opening a sentence (L18). The staff branch is never named (A16).'
# ---------------------------------------------------------------- S03 Images to Docker Hub
- en: 'stage 1 / push the images / access token / account settings / a password for scripts / never show it'
  zh_subtitle: '第 1 阶段 / 访问令牌 / 账号设置 / 千万别给人看'
  first_use: 'S03[0]：在你的 Docker Hub 账号设置里创建一个访问令牌；它是给脚本用的密码，所以千万别给人看。'
  note: 'A14, D6. Stage 1: push the images. → 第 1 阶段：push image。 token → 令牌 (L10).'
- en: 'typed exactly as the README prints it / the login fails / syntax error near unexpected token newline / angle brackets / redirections / the whole placeholder, brackets included'
  zh_subtitle: '原样 / 登录 / 尖括号 / 重定向 / 占位符'
  first_use: 'S03[1]：尖括号对 shell 来说是重定向，所以要把整个占位符换掉，连尖括号一起。'
  note: 'A6, A13, B3: never the < > characters. Typed exactly as the README prints it, the login fails: syntax error near unexpected token newline → 照 README 印的原样敲，登录会失败：syntax error near unexpected token newline (en_display: the screen form with `newline'', D4).'
- en: 'better / the flag password standard in / shell history'
  zh_subtitle: '更好的做法 / --password-stdin / shell 历史记录'
  first_use: 'S03[2]：更好的做法：--password-stdin 参数让令牌不会进到你的 shell 历史记录里。'
  note: 'A14, D4 (password standard in → --password-stdin).'
- en: 'the Docker Hub script / each service folder / user name / dlops, the course account / change it to yours'
  zh_subtitle: 'Docker Hub 脚本 / 服务目录 / 用户名 / dlops'
  first_use: 'S03[3]：第 11 行把用户名设成 dlops，也就是课程的账号：改成你自己的。'
  note: 'A1 b. Now the Docker Hub script, one in each service folder → 现在是 Docker Hub 脚本，每个服务目录里各有一个.'
- en: 'creates and selects a new BuildKit builder / builds, then builds again to push / AMD64 and ARM64 / AMD64 only'
  zh_subtitle: 'BuildKit / 构建器 / 构建 / AMD64 / ARM64'
  first_use: 'S03[4]：第 27 行创建并选中一个新的 BuildKit 构建器；脚本先构建一遍，再构建一遍来 push。'
  note: 'L2-L4: builder → 构建器. The API script builds for AMD64 and ARM64; the frontend script, AMD64 only → API 的脚本为 AMD64 和 ARM64 构建；前端的脚本只构建 AMD64 (D4: A M D 64 → AMD64).'
- en: 'inside frontend react / outside any docker shell / compiled successfully / the warning / builder cache'
  zh_subtitle: 'frontend-react / docker shell / Compiled successfully / 警告 / 构建器的缓存'
  first_use: 'S03[5]：在 frontend-react 里、在任何 docker shell 之外运行它。'
  note: 'A13. It prints dlops, creates the builder, and builds: compiled successfully → 它打印出 dlops，创建构建器，然后构建：Compiled successfully. The warning says this build stays in the builder cache → 这条警告是说，这次构建的结果只留在构建器的缓存里.'
- en: 'the push / access denied / not logged in / pushed'
  zh_subtitle: 'push / access denied / pushed'
  first_use: 'S03[6]：我们不是 dlops，也没有登录；换成你的用户名并登录后，这里会显示 pushed。'
  note: 'A13. Then the push: access denied → 接着是 push：access denied.'
- en: 'run the same script in api service and vector db / two-platform builds / check Docker Hub / skip this stage / the public dlops images / a little older than the code'
  zh_subtitle: 'api-service / vector-db / 双平台构建 / 公开的 image'
  first_use: 'S03[8]：跳过这个阶段，第 1 部分也照样能跑，用的是公开的 dlops image，比代码稍微旧一点。'
  note: 'D6, D9. Run the same script in api service and vector db; we did not capture those two-platform builds → 在 api-service 和 vector-db 里跑同一个脚本；那两个双平台构建我们没有录. If you pushed yours, replace dlops with your user name in the VM commands → 如果你 push 了自己的，就在 VM 的命令里把 dlops 换成你的用户名.'
# ---------------------------------------------------------------- S04 A VM with Docker, folders and a network
- en: 'stage 2 / set up the VM / the console / create a VM instance with the defaults / machine type N2D / a 50 gigabyte disk / HTTP and HTTPS allowed'
  zh_subtitle: '第 2 阶段 / 控制台 / VM 实例 / 默认值 / 机器类型 / N2D / 磁盘'
