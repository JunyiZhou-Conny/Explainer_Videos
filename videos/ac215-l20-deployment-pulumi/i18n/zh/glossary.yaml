- '[A13] Errors, status codes and terminal words. The series keeps short terminal text verbatim (L11 A7, L14 A13, L18 A13): the viewer looks for it in the terminal. Write the screen''s words and capitalisation, without the screen''s quotes and backticks (B2): syntax error near unexpected token newline (the screen quotes `newline''), access denied, No such container, Compiled successfully, Welcome to AC215, loading CNN model, 404 Not Found, pull access denied, has no installation candidate, Invalid grant: account not found (as L18: the screen''s case and colon, not the SAY''s comma), No credentialed accounts, no such file, no active account, Updated, Created stack dev (the screen quotes dev), Pulumi access token must be set (A6), Skipping preview build, 403 Forbidden, host not found in upstream, 200 OK, pushed, active. Translated: what the SAY paraphrases rather than quotes (the build stops → 构建停下; the login fails → 登录会失败; the error is harmless here → 这个报错在这里是无害的; the same error → 同一个报错; the login error → 登录报错; fails that lookup and exits → 这次查找失败，直接退出). The question Pulumi asks is quoted as on screen (do you want to perform this update).'
- '[A14] Accounts, keys and access (L10, L14, L15). service account → 服务账号; role → 角色 (six roles → 六个角色); the deployment account → deployment 账号 / deployment 服务账号 (the account''s name stays: deployment, gcp-service); a JSON key → 一个 JSON 密钥; rename it → 改名为; the key path → 密钥路径; your keys → 你的密钥; the narrow account / the narrow key → 窄权限的账号 / 窄权限的密钥; admin rights → 管理员权限; reads images and stored files → 读取 image 和存储的文件; stored objects → 存储的对象; credentials → 凭据; activates the deployment account → 激活 deployment 账号; lists the deployment account as active → 把 deployment 账号列为 active; a compromised VM → 一台被攻破的 VM; scopes, a list of what the VM may call → scopes，也就是 VM 可以调用哪些服务的清单; access token → 访问令牌 (it is a password for scripts → 它是给脚本用的密码); shell history → shell 历史记录; OS Login → OS Login (turn OS Login on → 打开 OS Login; the OS Login profile → OS Login 的个人资料); SSH key → SSH 密钥; the private key → 私钥; the public half → 公钥 / 另一半是公钥; passphrase → passphrase (No passphrase → 不设 passphrase); press Enter twice → 按两次回车; a username that starts with S A → 一个以 sa_ 开头的用户名; your masked username → 你被遮住的用户名; never show or commit it → 千万别给人看，也别 commit.'
- '[A15] Containers on the VM and the app (L2-L5, L10, L18). pull → pull; stop and remove → 停掉并删除; run detached → 在后台运行; publishing port 8000 → 发布 port 8000; restarting always → restart always (the flag''s value) / 一直重启 (the idea); restart policy → 重启策略; a data folder mounted → 挂载一个数据目录; mounts → 挂载; the phone book → 电话簿 (A Docker network''s name lookup, L4, L10, L18); finds the database by name, not by address → 按名字找到数据库，而不是按地址; the loader → 加载器 (a one-shot loader → 一次性的加载器); the vector database → 向量数据库 (vector DB → 向量数据库; the database → 数据库); collection → collection; precomputed → 预先算好的; the heartbeat → 心跳; the API → API; the frontend → 前端; the home page → 首页; the docs page → 文档页; the base API URL → API 的基础 URL; the root → 根路径; logs → 日志 (follow each log → 跟踪每个日志); an interactive variant → 一个交互式的版本; is in use → 已经被占用了; start order → 启动顺序; the container list → container 列表; the footer → 页脚; the chat → 聊天; the chat history and the model → 聊天记录和模型; the API''s helper files → API 的辅助文件; a GitHub release → GitHub 的一个 release; the model → 模型.'
- '[A16] The lecture, the course and the slides. Course: AC215; lecture n → 第 n 讲 (Lecture 21 … lecture 22 … lecture 23 → 第 21 讲……第 22 讲……第 23 讲; If you followed lecture 18 lately → 如果你最近跟过第 18 讲); the lecture → 课上 (The lecture splits … → 课上把……分成; the lecture''s picture → 课上画的那张图; The lecture lists seven commands → 课上列了七个命令; the lecture''s last step → 课上的最后一步); the slide → 课件 (The slide draws … → 课件上画的……; the banner on the slide → 课件上的横幅; slide 21 → 课件第 21 页; a slide of its own → 专门的一页); the course roadmap → 课程路线图; an earlier version of the course → 课程早先的一个版本; part 1 / part 2 (the video''s parts) → 第 1 部分 / 第 2 部分; stage n (the lecture''s four manual stages) → 第 n 阶段; step n (slide 19''s six automated steps, the only "step n" the SAY says) → 第 n 步; Steps 3–4 → 第 3、4 步; the README → README; the README''s default → README 的默认值; the next heading → 下一个小节; the exercises and the study guide → 练习和学习指南. SERIES RULE: the instructor''s name never appears in a subtitle, a title, a chapter name or the description; this script never names the instructor; a later revision that does says the instructor → 授课老师, and the masked ‹instructor› on screen is never written into a subtitle. The unmerged staff branch is never named either.'
- '[A17] The series list (the ac215-video skill''s list) in this video: container and image throughout; Dockerfile (S11); port (S01, S02, S04-S07, S09, S14, S15); volume (not said; mounts are 挂载); pipeline (not said); repo (S02, S07, S09, S15); commit (S02, S04); push / pull (S03, S05, S06, S13, S15); registry (S10, S11, S13, S16); bucket (S06, S09, S11, S13, S14, S16); VM (S01-S08, S10, S12, S14-S16); SSH (S04, S12, S14, S15); chunk, embedding, collection (S05); entrypoint, diff (S11); prompt, agent, LoRA, endpoint, CI (not in this script; if a revision says them, they stay English as in the series).'
- '[B1] Spacing. One half-width space between Chinese and Latin letters, digits or artifacts (第 20 讲, 第 3 步, 第 2 阶段, port 80, 返回 404, 14,356 个 chunk, 11 个文件, 50 GB, 大约 5 GB, 大约 92 秒, 第 27 行, 第 9 到 17 行, VM 上, 跑 pulumi up, 在 /secrets 里). The checker reports a missing space on every displayed sentence. Spaces inside an artifact stay as they are (Compute OS Login, Invalid grant: account not found, pulumi up --stack dev --refresh -y), never added inside one. No space next to full-width punctuation (……/status。, 返回 404：). No U+00A0 / U+202F.'
- '[B2] Punctuation. Full-width ，。、；：？！“”…… in Chinese text, also next to artifacts. Lists use 、 (persistent-folder、secrets 和 conf/nginx; 80、3000、9000 和 8000; Compute Engine、Service Usage、Cloud Resource Manager 和 Artifact Registry). The paths the SAY reads with commas are written as paths (organization, deploy images, dev → organization/deploy-images/dev; slash api service slash status → /api-service/status; change into src, deployment → 进到 src/deployment). No brackets of any kind: （）, (), 《》, 【】, [], <>; the checker rejects them in a line without say:, and the band needs no glosses. “” only for translated quotations; artifacts, tags and quoted terminal text never get quotation marks (and lose the screen''s own quotes and backticks, A13). Inside one Chinese sentence (one English sentence) no 。？！: use ，；：. No ASCII ? or ! in the Chinese line. Questions keep ？. The ASCII colon, slash, dot and hyphen inside an artifact stay (Invalid grant: account not found, /api-service, nginx.conf, Pulumi.dev.yaml, -y).'
- '[B3] Symbols the checker rejects (+ = < > → ← ^ ≤ ≥ × ÷ ≈, == != +=, a digit followed by !, brackets, letter_letter): never in the Chinese line; written in words (A6). plus, tilde, minus, plus minus → 加号、波浪号、减号、加减号; angle brackets → 尖括号; Desired equals state equals reality → 期望状态等于 state，也等于实际情况; push true → push 设为 true; Ctrl+C → Ctrl-C.'
