- '[D1] Sentence alignment (explainer/i18n.py). One entry per SAY line of script.md in narration/*.yaml (155 blocks); `en` byte-equal to the SAY line; `zh` has exactly one item per English sentence as split by explainer.voice.split_sentences (351 in this script: part 1 S01-S08 70 blocks, 152 sentences; part 2 S09-S16 85 blocks, 199 sentences). Short English sentences stay short Chinese sentences (SSH in. → SSH 进去。; Run it again. → 再跑一次。; Part 2. → 第 2 部分。; A question. → 想一想。; No. → 不会。 / 不能。; Who logs in? → 谁来登录？; Test yourself. → 自测一下。).'
- '[D2] No say:, no anchors. There is no Chinese voice: never write say: (the display line is the only text) and never write anchors: (they only place animation beats for a Chinese-voiced render). The subtitles are timed by the English audio; the toolkit pairs each Chinese sentence with its English sentence and cuts both at matching clause marks.'
