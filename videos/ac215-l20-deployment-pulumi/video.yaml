# Bilibili metadata for the release (tools/release_episode.py → PUBLISH.json → the Mac publish worker)
publish:
  title_zh: "AC215 第20讲跟练 · 部署：先手动把奶酪 App 部署到一台 GCP VM，再用 Pulumi 把同样的部署写成代码"
  description_zh: |
    哈佛 AC215（MLOps & LLMOps，2026 秋）第 20 讲教程的逐条命令跟练，照着 dlops-io/cheese-app-v3 的 README 一步一步做：
    上半场（手动部署）：把镜像推到 Docker Hub，在 VM 上安装 Docker，建好目录、secret 和 Docker network，
    依次启动 vector DB、一次性的 loader（载入 14,356 个 chunk）、API 和前端，最后用 nginx 作为唯一的公网入口；
    看懂 nginx 的 location 和去掉 /api-service 前缀的那一个字符，以及为什么停掉前端整个网站都会挂掉。
    下半场（Pulumi）：desired state、state 与 reality 的对比，preview / up / --refresh / -y / destroy；
    启用 API、两个 service account 各自的权限、部署工具箱容器（录制当天 Dockerfile 需要两处一行修改才能构建）、
    OS Login 与 SSH key；两个 Pulumi 项目对应课件的六个步骤：带时间戳的镜像、VM 与防火墙、provisioning、通过 SSH 部署容器、nginx。
    对照课件逐页讲解：部署目标架构、Pulumi 的工作方式、stack、两个 service account 的分工，以及“别忘了删除”。
    录制环境没有 Google 账号：每个云端步骤都展示到它真实的第一个报错为止，并说明你的输出应是什么。边看边暂停，在自己的项目里跑每一条命令；VM、磁盘和镜像存储会产生费用，视频结尾有完整的清理清单。
    英文旁白，中英双语字幕。

    教程仓库：https://github.com/dlops-io/cheese-app-v3
    学习笔记（全部命令、真实输出和练习答案）：https://github.com/JunyiZhou-Conny/MLOps_Learning/blob/main/guides/L20-deployment-pulumi.md

    课程与教程内容来自 Harvard AC215 课程组（Pavlos Protopapas 等）；本视频是个人学习用的非官方讲解，引用课件只注明页码，不展示课件。
  tags_zh: [AC215, MLOps, 部署, Pulumi, 基础设施即代码, GCP, Docker, nginx, 哈佛, 教程跟练]
  tid: 231
