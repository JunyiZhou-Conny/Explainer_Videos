publish:
  title_zh: "项目周记 E2 ·「思考了 3 秒」到底是什么：隐藏的推理、只流进度的流式输出和一张收据"
  description_zh: |
    我的创业项目（给中国家长和在美留学生的就医导航原型）每周 PR 的概念讲解，第 2 集。
    分诊聊天里「正在思考 · 11 秒」时，模型在做什么？推理模型先写给自己看的 token 不返回、但按输出计费，思考强度决定它想多少；我们的服务器收下模型的流，却只把「写到哪一格、写了多少字」的进度发给页面，因为没检查过的字一旦上屏就收不回来；写到「紧急」时提前给出我们写好的 911 提醒；检查过的回答再用 2.5 秒回放出来；展开后看到的是一张能核对的收据，而不是模型的推理原文。
    也讲了思维链从 2022 年的提示词技巧到推理模型的来历、这些做法是怎么一步步做出来的，以及还在等我拍板的几个决定。所有案例都是虚构的；不是医疗建议。英文旁白，中英双语字幕。
  tags_zh: [AI, 大模型, 推理模型, 思维链, 流式输出, OpenAI API, 产品设计, 创业, 科普]
  tid: 231
