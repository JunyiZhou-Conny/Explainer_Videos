# Chinese subtitles for 项目周记 E2 (the narration is English; these lines are only shown),
# sentence-aligned to script.md. Rules: ../GLOSSARY.md.

S01:
- en: 'While you wait for an answer, our app says: thinking, eleven seconds.'
  zh:
  - 等回答的时候，我们的 app 显示：正在思考，11 秒。
- en: 'Afterwards it folds into a receipt: thought for 22 seconds, which is the whole wait. Open it, and the wait splits in two: only 13.5 seconds of thinking, then 8.7 seconds of writing.'
  zh:
  - 回答出来以后，它折叠成一张收据：思考了 22 秒，这是整个等待的时间。
  - 点开，等待分成两段：真正的思考只有 13.5 秒，然后是写 8.7 秒。
- en: Thinking about what? Three years ago, no chat app showed you a model thinking. And why does ours show you a clock, but never the thoughts?
  zh:
  - 在思考什么？
  - 三年前，还没有哪个聊天 app 会给你看模型在思考。
  - 那为什么我们给你看一个计时器，却从不给你看思考的内容？
S02:
- en: 'The idea is older than the apps. In January 2022, Google researchers showed that a model solves more problems if you ask it to write out its steps first. They called it chain of thought. Months later, one sentence did it: let''s think step by step. It was a trick in the prompt.'
  zh:
  - 这个想法比这些 app 更早。
  - 2022 年 1 月，Google 的研究者发现：先让模型把步骤写出来，它能解出更多题。
  - 他们把它叫作思维链，chain of thought。
  - 几个月后，一句话就做到了：「Let's think step by step」。
  - 这是写在提示词里的一个技巧。
- en: In September 2024, OpenAI released o1, a model trained with reinforcement learning to reason before it answers. OpenAI chose not to show the raw thoughts, citing user experience, competitive advantage, and the chance to monitor them, and showed a summary written by a model instead.
  zh:
  - 2024 年 9 月，OpenAI 发布了 o1：一个用强化学习训练、先推理再回答的模型。
  - OpenAI 选择不展示原始的思考内容，理由是用户体验、竞争优势，以及可以监控这些思考；它改为展示一段由模型写的摘要。
- en: Others chose differently. DeepSeek's R1 handed its reasoning text to developers. Claude 3.7 showed its raw thinking, as a research preview. From Claude 4, long thinking was summarized, and today's Claude API returns only a summary.
  zh:
  - 别家做了不同的选择。
  - DeepSeek 的 R1 把推理文本交给了开发者。
  - Claude 3.7 展示了原始的思考内容，作为研究预览。
  - 从 Claude 4 开始，长的思考会被摘要；今天的 Claude API 只返回摘要。
- en: 'Today, thinking is a setting you choose and pay for. OpenAI calls it reasoning effort. Our menu puts it next to the model choice, Luna, Terra and two others, with three levels: low, medium and high.'
  zh:
  - 今天，思考是一个你自己选、自己付钱的设置。
  - OpenAI 把它叫作 reasoning effort，也就是思考强度。
  - 我们的菜单把它放在选模型的旁边，有 Luna、Terra 和另外两个模型，思考强度分三档：低、中、高。
S03:
- en: Here is what happens inside one call. A model writes one small piece of text at a time, a token. A reasoning model first writes tokens for itself. Those are its thoughts.
  zh:
  - 看看一次调用里面发生了什么。
  - 模型一次写一小段文字，叫作 token。
  - 推理模型会先写一些给自己看的 token。
  - 那就是它的思考。
- en: OpenAI never sends those tokens back. They stay hidden, but they take up room, and you pay for them at the output price.
  zh:
  - OpenAI 从不把这些 token 发回来。
  - 它们是隐藏的，但会占用上下文空间，而且按输出的价格计费。
- en: 'Only then does it write the answer, our thirteen-box form. So our stopwatch can tell the two apart. Thinking is the time until the first character of the answer arrives: the model reads the request, then reasons in hidden tokens. Writing runs from there until the model finishes; then the checker runs.'
  zh:
  - 然后它才写回答，也就是我们那张 13 格的表。
  - 所以我们的计时器能把两段分开。
  - 思考，是到回答的第一个字到达为止的时间：模型先读完请求，再用隐藏的 token 推理。
  - 写，是从那里到模型写完；然后检查器开始运行。
- en: 'The effort setting sets how much thinking the model may do. Even on the same setting, the model decides how much it needs: your greeting thought for 1.6 seconds, a real question about the student clinic for 13.5.'
  zh:
  - 思考强度决定模型最多可以想多少。
  - 即使设置一样，模型也会自己决定需要想多少：你的问候想了 1.6 秒，一个关于学校医疗中心的真实问题想了 13.5 秒。
- en: If the thoughts are hidden, what exactly are you paying for, and how would you know?
  zh:
  - 既然思考是隐藏的，你到底在为什么付钱，又怎么知道？
- en: Every response ends with a usage report, and it counts the reasoning tokens inside the output tokens. Our server reads it, and the price list turns those counts into the dollar figure on the receipt.
  zh:
  - 每次回复最后都有一份 usage 报告，它把推理 token 算在输出 token 里。
  - 我们的服务器读取这份报告，价格表把这些数字换算成收据上的金额。
S04:
- en: 'Why show anything while you wait? The decision record puts it plainly: ten to thirty seconds of waiting, and nobody can tell what is happening. Most chat apps answer that by streaming: every few words travel to your screen the moment they are written, over a pipe called server-sent events.'
  zh:
  - 等的时候，为什么要显示点什么？
  - 决策记录说得很直白：干等 10 到 30 秒，人不知道在发生什么。
  - 大多数聊天 app 的办法是流式输出：每写出几个词，就立刻送到你的屏幕上，走的是一条叫 server-sent events 的通道。
- en: Our server does receive that stream from OpenAI. But it does not pass the words on. It reads the form as it fills, notes which box the model is in, counts the characters, and sends the page only progress, one small line of JSON at a time.
  zh:
  - 我们的服务器确实从 OpenAI 收到了这条流。
  - 但它不把这些文字转发出去。
  - 它一边读这张逐渐填满的表，一边记下模型写到了哪一格、写了多少字，然后只把进度发给页面，每次一小行 JSON。
- en: 'That is what you watch: thinking, eleven seconds. Writing the places to go, 320 characters so far. Checking. The page never sees a word before the checker has.'
  zh:
  - 你看到的就是这些：正在思考，11 秒。
  - 正在写去处和步骤，已写 320 字。
  - 正在检查。
  - 在检查器看过之前，页面一个字也看不到。
S05:
- en: Why not stream the words, the way Claude does, and pull them back if the checker objects?
  zh:
  - 为什么不像 Claude 那样直接流式显示文字，检查不过再收回？
- en: 'Because a screen cannot unsay something. If a dose or a made-up phone number flashes for two seconds, a worried parent may already have a screenshot. So the decision record says: stream the progress, not the text.'
  zh:
  - 因为屏幕上说出去的话收不回来。
  - 如果一个剂量或者一个编造的电话号码在屏幕上闪了两秒，着急的家长可能已经截了图。
  - 所以决策记录写的是：流式传输进度，而不是文字。
- en: You asked for streaming. The agent, working unattended, chose this kind on its own, and wrote it down as a proposal that is still waiting for your yes.
  zh:
  - 你要的是流式输出。
  - agent 在无人值守时自己选了这种做法，并把它写成一份提议，还在等你点头。
S06:
- en: Progress streaming has one more trick. The form's first five boxes are all about urgency, so the model writes them first.
  zh:
  - 进度流式输出还有一招。
  - 表的前五格都和紧急程度有关，所以模型最先写它们。
- en: 'The moment those first boxes say emergency, the server raises a flag, and the page shows a warning we wrote ourselves: possibly life-threatening, don''t wait, call 911 now.'
  zh:
  - 前几格一说是紧急情况，服务器就打上紧急标记，页面显示一段我们自己写好的提醒：可能危及生命，不用等，现在就打 911。
- en: In a real test, the warning appeared at 3.5 seconds, and the checked answer at about 21 seconds. And since an emergency is never taken back, that answer is bound to agree.
  zh:
  - 在一次真实测试里，提醒在第 3.5 秒出现，检查过的回答在大约第 21 秒才到。
  - 而且紧急判断从不收回，所以那个回答一定和提醒一致。
S07:
- en: 'When the checked answer finally arrives, the page plays it out in at most two and a half seconds: sentences type themselves, lists drop in whole. It looks like streaming. It is a replay of text that has already passed.'
  zh:
  - 检查过的回答终于到达时，页面最多用两秒半把它展示出来：句子逐字打出来，列表整块出现。
  - 看起来像流式输出。
  - 其实是一段回放，回放的是已经通过检查的文字。
- en: 'Emergency answers skip the show and appear at once. And the stop button really stops: the page hangs up, and the server cancels the model call it was paying for.'
  zh:
  - 紧急回答跳过这段表演，立刻全部显示。
  - 停止按钮也是真的停止：页面挂断，服务器取消它正在付钱的那次模型调用。
S08:
- en: 'On Wednesday morning, Boston time, the streaming went in within twenty minutes. A few minutes later, a note for the menu: switching model or effort starts a fresh cache, so on Terra that first answer costs about five times as much.'
  zh:
  - 周三上午，波士顿时间，流式输出在 20 分钟之内做好了。
  - 几分钟后，菜单加了一条说明：切换模型或思考强度会从一份新的缓存开始，所以在 Terra 上，那第一次回答大约贵 5 倍。
- en: 'Much of the rest of the day went to what reviews found: keeping the 911 warning through stop, retry and dropped connections, and a test that fails if any four consecutive characters of the model''s text show up in the progress lines before the result. That test is the proof that no words reach the page before the checker has passed them.'
  zh:
  - 那天剩下的很多时间，花在了 review 发现的问题上：在停止、重试和断线时都保住 911 提醒；还有一个测试，只要模型原文里任意连续 4 个字符在结果之前出现在进度行里，它就失败。
  - 这个测试证明：检查器放行之前，没有一个字会到达页面。
S09:
- en: 'So what sits behind "thought for 22 seconds"? Claude''s app also shows a timer while it thinks, and, like ChatGPT, opens onto a summary of the model''s reasoning. Ours opens onto a receipt: the timings, the sources, the check, the judgment, the model and the price.'
  zh:
  - 那么，「思考了 22 秒」后面是什么？
  - Claude 的 app 在思考时也显示计时器，并且和 ChatGPT 一样，点开是一段模型推理的摘要。
  - 我们的点开是一张收据：用时、依据、检查、判断、模型和价格。
- en: The reason is in the decision record. Raw reasoning may contain diagnostic guesses, and nothing has checked it. In a medical product, a guess on screen reads like a diagnosis.
  zh:
  - 原因写在决策记录里。
  - 推理原文里可能有诊断性的猜测，而且没有任何东西检查过它。
  - 在医疗产品里，屏幕上的一个猜测，读起来就像一个诊断。
S10:
- en: Where could this go? OpenAI can return a summary of the hidden reasoning. But a summary is written by a model too, so it would have to pass the same checker before anyone sees it. The progress line could name real steps, like checking the clinic's hours. And the agent raised a developer-only switch to see unchecked drafts while tuning prompts. It was not built.
  zh:
  - 还能往哪里走？
  - OpenAI 可以返回隐藏推理的摘要。
  - 但摘要也是模型写的，所以在任何人看到之前，它也得通过同一个检查器。
  - 进度行可以说出真实的步骤，比如正在核对诊所的营业时间。
  - agent 还提过一个只给开发者用的开关，在调提示词时看没检查过的草稿。
  - 它没有被做出来。
- en: Three decisions wait for you. Progress-only streaming and the model menu are written down as proposals; the developer switch, as an open question.
  zh:
  - 有三个决定在等你。
  - 只流进度的流式输出和模型菜单，被写成了提议；开发者开关，被写成了一个待定的问题。
S11:
- en: 'So, thought for 22 seconds. First thinking: hidden tokens the model writes for itself, billed but never sent. Then writing, which our server watches box by box, passing on progress but not words. An early warning when the first boxes say emergency. A replay once the checker has passed it. And a receipt instead of the thoughts.'
  zh:
  - 所以，思考了 22 秒。
  - 先是思考：模型写给自己的隐藏 token，要付钱，但从不发回。
  - 然后是写，我们的服务器一格一格地盯着，只转发进度，不转发文字。
  - 前几格一说紧急，就提前给出提醒。
  - 检查器通过之后，再回放一遍。
  - 最后，用一张收据代替思考内容。
- en: Three questions. What exactly does our stopwatch call thinking? Why do the urgency boxes come first in the form? And what would a reasoning summary need before it could be shown?
  zh:
  - 三个问题。
  - 我们的计时器到底把什么叫作思考？
  - 为什么和紧急程度有关的几格排在表的最前面？
  - 一段推理摘要要先经过什么，才能给人看？
- en: 'Next time, the page itself: what we copied from Claude''s app, what we refused, and what we could invent.'
  zh:
  - 下一集讲页面本身：我们从 Claude 的 app 学了什么、拒绝了什么，还能发明什么。
