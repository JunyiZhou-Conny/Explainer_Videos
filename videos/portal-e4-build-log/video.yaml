  title_zh: "项目周记 E4 · 两天、一百多个提交：agent 是怎么干活的，谁做的决定"
  description_zh: |
    我的创业项目（给中国家长和在美留学生的就医导航原型）每周 PR 的概念讲解，第 4 集。
    两个分诊 PR 的 109 个提交全是 agent 做的，放在同一个时钟上看：工作怎么组织（issue、分支、草稿 PR、两个 review bot、交接和决策记录）；第一天下午的骨架和 4 个互不通信的 agent 做的事实核对；晚上 9 点 21 分从规则引擎转向「模型判断、检查器把关」；和 bot 一来一回地修；第二天排队的修复 agent、为什么先复现再修、两次用量上限；检查器从 459 行长到 1,326 行的打地鼠，以及第二天夜里先用约 3,000 种说法攻击自己的检查器，判错过的 1,060 个留作测试；花了多少钱（只说有记录的数字）；哪些是我的决定、哪些是 agent 自己定的，以及还有 12 个问题在等我。
    所有案例都是虚构的；不是医疗建议。英文旁白，中英双语字幕。
  tags_zh: [AI, AI agent, 软件工程, 代码审查, 测试, Claude, 创业, 科普]
  tid: 231
