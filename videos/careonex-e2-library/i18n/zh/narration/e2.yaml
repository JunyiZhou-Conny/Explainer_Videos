# Chinese subtitles for CareOneX E2 (no narrator: these lines are only shown, never spoken),
# sentence-aligned to script.md. Rules: ../GLOSSARY.md.

S01:
- en: "CareOneX has two halves. One half talks to a family on the phone. The other half runs long before any call: it builds the library that every answer comes from."
  zh:
  - "CareOneX 分成两半。"
  - "一半在电话里和家属对话。"
  - "另一半在任何来电之前就已经运行：它搭建一座资料库，每个回答都从这里来。"

- en: "This episode is about the library: five containers that turn 20 public documents into 232 searchable passages."
  zh:
  - "这一集讲资料库：五个容器（container）把 20 份公开文档变成 232 段可以检索的文字。"

- en: "Why build a library at all? When a caller asks about an income limit, the agent must answer from an official document. It is not allowed to answer from memory, because these numbers change every year."
  zh:
  - "为什么要先建资料库？"
  - "来电者问到收入上限时，agent 必须根据官方文件回答。"
  - "它不能凭记忆回答，因为这些数字每年都会变。"

- en: "So every answer starts as one of these passages. Let's follow a document through the five containers, one at a time."
  zh:
  - "所以每个回答都从这样一段文字开始。"
  - "我们跟着一份文档，依次走过这五个容器。"

S02:
- en: "Everything starts with one spreadsheet, the source list. It names 20 public documents that the team approved."
  zh:
  - "一切从一张表格开始：来源清单（source list）。"
  - "它列出了团队批准的 20 份公开文档。"

- en: "More than half come from New Jersey's Division of Aging Services. The rest come from Medicaid, Medicare, Veterans Affairs and Disability Services. 11 are web pages, 8 are PDFs, and 1 is a summary the team wrote from the state's 2026 documents."
  zh:
  - "一半以上来自新泽西州老龄服务司（DoAS）。"
  - "其余来自 Medicaid、Medicare、退伍军人事务部（VA）和残障服务司。"
  - "其中 11 份是网页，8 份是 PDF，还有 1 份是团队根据州政府 2026 年的文件整理的摘要。"

- en: "Each row carries what an answer needs later: the program, the web address, the date the rules took effect, and a fingerprint of the file, called a hash."
  zh:
  - "每一行都记着回答以后要用到的信息：项目名称、网址、规则生效的日期，以及文件的“指纹”，也就是 hash（哈希值）。"

- en: "The source list is the pipeline's only input. To add a document, you add a row and rebuild, because the list is built into the data container's image."
  zh:
  - "来源清单是整条 pipeline 唯一的输入。"
  - "要加一份文档，就加一行再重新 build，因为这张清单是打包进 data 容器镜像里的。"

S03:
- en: "The first container, data, makes sure one S3 bucket exists. It is versioned and encrypted, and it holds public documents only. No caller information ever goes into it."
  zh:
  - "第一个容器 data 负责确保有一个 S3 bucket（存储桶）。"
  - "它开启了版本管理和加密，而且只存放公开文档。"
  - "来电者的任何信息都不会放进去。"

- en: "Its name starts with ac215 on purpose. The team's S3 permissions only reach buckets whose names start with ac215, so nothing in this course can touch the company's production buckets, which are named careonex."
  zh:
  - "它的名字以 ac215 开头，是有意为之。"
  - "团队的 S3 权限只覆盖名字以 ac215 开头的 bucket，所以这门课里的任何东西都碰不到公司以 careonex 命名的生产环境 bucket。"

- en: "The second container, ingest, downloads every document and computes its hash. If the bucket already holds a file with that hash, it skips it. Otherwise it uploads the new version."
  zh:
  - "第二个容器 ingest 下载每一份文档，并计算它的 hash。"
  - "如果 bucket 里已经有同样 hash 的文件，就跳过。"
  - "否则就上传新版本。"

- en: "Next to every file it writes a small sidecar of metadata: the program, the year, the state, the effective date. Later, search can filter on these fields, for example only JACC."
  zh:
  - "它还会在每个文件旁边写一个小的元数据文件，叫 sidecar：项目、年份、州、生效日期。"
  - "之后检索时就能按这些字段过滤，比如只看 JACC。"

- en: "Every run also writes a manifest: exactly which file versions it saw. That manifest is the version of the whole dataset."
  zh:
  - "每次运行还会写一份 manifest（清单），准确记录它看到了哪些文件版本。"
  - "这份 manifest 就是整个数据集的版本号。"

S04:
- en: "Here is something we tested while making this video. We downloaded every document twice, a few seconds apart, the same way ingest does. All 8 PDFs came back identical, and still matched their hash in the source list. But 5 of the 11 web pages came back with different bytes the second time."
  zh:
  - "做这期视频时，我们做了一个测试。"
  - "我们把每份文档都下载了两次，间隔几秒钟，方式和 ingest 完全一样。"
  - "8 份 PDF 两次都一模一样，而且仍然和来源清单里的 hash 对得上。"
  - "但 11 个网页里有 5 个，第二次下载回来的字节不一样。"

- en: "The text on those pages had not changed. On nj.gov, a bot-protection script with a random number is sometimes added at the end. On va.gov, a fresh random code, called a nonce, is stamped on dozens of tags every time. So the hash of a downloaded file cannot tell you whether the rules changed."
  zh:
  - "这些网页上的文字其实没有变。"
  - "在 nj.gov 上，页面末尾有时会多出一段带随机数的防爬虫脚本。"
  - "在 va.gov 上，每次都会给几十个标签打上一个新的随机码，叫 nonce。"
  - "所以，下载文件的 hash 没法告诉你规则有没有变。"

- en: "That is extract's job. It turns every file into clean text, written as Markdown. The hash of that text is the real signal that a document's content moved."
  zh:
  - "这正是 extract 的任务。"
  - "它把每个文件转成干净的文本，格式是 Markdown。"
  - "这段文本的 hash，才是文档内容真正变化的信号。"

- en: "Getting web pages right took three versions. Version 1 used a library that guesses the main content, and it silently dropped eligibility paragraphs. Version 2 deleted navigation first, but nj.gov wraps the whole page inside its navigation bar, so pages came out empty. Version 3 finds the main region first, and only then strips."
  zh:
  - "网页的处理改了三个版本才做对。"
  - "第 1 版用了一个自动“猜”正文的库，结果悄悄丢掉了讲申请资格的段落。"
  - "第 2 版先删导航栏，可 nj.gov 把整个页面包在导航栏里面，结果页面变成空的。"
  - "第 3 版先找到正文区域，然后才做删除。"

- en: "PDFs go through a library called pymupdf4llm. It keeps headings, and it turns tables into Markdown tables, so a number stays in the same row as its label."
  zh:
  - "PDF 交给一个叫 pymupdf4llm 的库处理。"
  - "它保留标题，并把表格转成 Markdown 表格，这样一个数字就和它的标签留在同一行。"

S05:
- en: "Search should not hand the agent a 22-page guide. It should return a passage short enough to read at once, and specific enough to answer one question. So the chunk container cuts every document into pieces called chunks."
  zh:
  - "检索不该把一份 22 页的指南整个丢给 agent。"
  - "它应该返回一段文字：短到一眼能读完，又具体到能回答一个问题。"
  - "所以 chunk 容器把每份文档切成小块，叫 chunk（文本块）。"

- en: "Rule one: a heading starts a new chunk, and every chunk carries its full path of headings. So the line \"income limit 4,855 dollars\" never travels without the word JACC."
  zh:
  - "第一条规则：每个标题开始一个新的 chunk，而且每个 chunk 都带着它完整的标题路径。"
  - "这样，“收入上限 4,855 美元”这一行就永远不会和 JACC 这个词分开。"

- en: "A table stays in one chunk. Only a table bigger than the cap is split, between rows, with its first row repeated on every piece. Long text is split at paragraph or sentence breaks, aiming for about 1,600 characters, with a cap of 2,800. Scraps under 200 characters are merged into a neighbour."
  zh:
  - "一张表格放在同一个 chunk 里。"
  - "只有比上限还大的表格才会被切开：按行切，每一块都重复表格的第一行。"
  - "长文本在段落或句子之间切开，目标大约 1,600 个字符，上限 2,800。"
  - "少于 200 个字符的碎片会并入相邻的 chunk。"

- en: "On all 20 documents this gives 232 chunks. The two longest PDFs, the program guide and the Medicare booklet, make up almost half of them. Most chunks are far below the target: the median is about 850 characters, because headings come often."
  zh:
  - "20 份文档一共切出 232 个 chunk。"
  - "最长的两份 PDF，也就是项目指南和 Medicare 手册，几乎占了一半。"
  - "大多数 chunk 远小于目标：中位数大约 850 个字符，因为标题出现得很频繁。"

- en: "Each chunk is stored as its own file, with its own sidecar. That sidecar must stay under 1 kilobyte: Bedrock silently skips any chunk whose metadata is bigger, and still reports the job as complete."
  zh:
  - "每个 chunk 存成单独的文件，有自己的 sidecar。"
  - "这个 sidecar 必须小于 1 KB：元数据一旦更大，Bedrock 就会悄悄跳过这个 chunk，却仍然报告任务完成。"

S06:
- en: "The last container, kb-sync, turns every chunk into a vector. An embedding model, Amazon Titan Text Embeddings v2, reads the chunk and returns 1,024 numbers."
  zh:
  - "最后一个容器 kb-sync 把每个 chunk 变成一个向量。"
  - "一个 embedding 模型，Amazon Titan Text Embeddings v2，读入 chunk，输出 1,024 个数字。"

- en: "Think of those numbers as a direction in a space with 1,024 axes. Chunks with similar meaning point in similar directions, and the angle between two of them, measured by cosine similarity, is how search compares them."
  zh:
  - "可以把这些数字想成一个有 1,024 个坐标轴的空间里的一个方向。"
  - "意思相近的 chunk 指向相近的方向；两个方向之间的夹角用余弦相似度（cosine similarity）来衡量，检索就靠它来比较。"

- en: "The vectors live in an S3 Vectors index called program-kb. On top sits a Bedrock Knowledge Base whose data source is the chunks folder. Its own chunking is switched off, because our chunk container has already done that job."
  zh:
  - "这些向量存在一个叫 program-kb 的 S3 Vectors 索引里。"
  - "上面是一个 Bedrock Knowledge Base（知识库），它的数据源就是 chunks 文件夹。"
  - "知识库自带的切块功能是关掉的，因为我们自己的 chunk 容器已经做完了这件事。"

- en: "kb-sync starts an ingestion job and waits for it to finish. Then it writes the knowledge base's ID into the bucket, which is how the retrieve container finds it."
  zh:
  - "kb-sync 启动一个导入任务（ingestion job），并等它完成。"
  - "然后它把知识库的 ID 写进 bucket，retrieve 容器就是靠这个找到知识库的。"

- en: "Why S3 Vectors? It costs cents a month, while the alternatives start at about 45 or 175 dollars a month. The price is speed: about a tenth to a third of a second per search, and on a phone call every tenth of a second counts."
  zh:
  - "为什么选 S3 Vectors？"
  - "它每月只要几美分，而其他方案每月起步大约 45 或 175 美元。"
  - "代价是速度：每次检索大约十分之一到三分之一秒，而在电话里，每十分之一秒都很重要。"

S07:
- en: "Two habits run through the whole pipeline. Each container owns one folder of the bucket and leaves the others alone. And each one skips work that is already done, so running everything again is cheap and safe."
  zh:
  - "整条 pipeline 贯穿着两个习惯。"
  - "每个容器只管 bucket 里属于自己的那个文件夹，不碰别人的。"
  - "而且每个容器都会跳过已经做完的工作，所以整个重跑一遍既便宜又安全。"

- en: "Now, what is open. Three things turned up while we made this video. First, one page, Veterans Affairs' Home and Community Based Services, comes out of extract as little more than the site menu. Its list of services sits in an element named flex-menu, and the rule that strips menus throws it away."
  zh:
  - "那么，还有哪些问题没解决？"
  - "做这期视频时，我们发现了三件事。"
  - "第一，退伍军人事务部的居家与社区服务（Home and Community Based Services）页面，经过 extract 之后几乎只剩下网站菜单。"
  - "它的服务列表放在一个叫 flex-menu 的元素里，而删除菜单的规则把它整个扔掉了。"

- en: "Second, two sources disagree. The JACC web page caps services at 1,156 dollars a month. The state's 2026 side-by-side table, and the team's summary built from it, say 1,090. Both are 2026, so \"prefer the newest year\" cannot settle it."
  zh:
  - "第二，两份来源互相矛盾。"
  - "JACC 网页说服务上限是每月 1,156 美元。"
  - "州政府 2026 年的项目对照表，以及团队据此整理的摘要，写的却是 1,090。"
  - "两份都是 2026 年的，所以“优先用最新年份”这条规则也没法裁定。"

- en: "Third, that same table hides its program names. They survive extraction, in the table's second row. But when the chunker splits a big table, it repeats only the first row. So the chunk that holds 1,090 dollars never says JACC."
  zh:
  - "第三，同一张表格把项目名称藏起来了。"
  - "项目名称在 extract 之后还在，就在表格的第二行。"
  - "但 chunk 容器切分大表格时，只重复第一行。"
  - "所以装着 1,090 美元的那个 chunk 里，根本没有 JACC 这个词。"

- en: "Also open: nothing re-runs this pipeline on a schedule yet, and the team's summary is updated by hand."
  zh:
  - "另外还没解决的：目前没有任何机制定期重跑这条 pipeline，团队的摘要也是手动更新的。"

- en: "Three questions to test yourself. Why does extract hash the text and not the downloaded file? Why is the heading path stamped on every chunk? And when one new PDF is added to the list, which containers do real work on the next run?"
  zh:
  - "三个问题，检验一下自己。"
  - "为什么 extract 对文本算 hash，而不是对下载的文件？"
  - "为什么每个 chunk 上都要盖上标题路径？"
  - "如果清单里新加一份 PDF，下次运行时哪些容器会真正干活？"

- en: "Next episode: what happens when a question arrives, and how retrieve finds the right 5 passages among these 232."
  zh:
  - "下一集：一个问题进来之后会发生什么，以及 retrieve 如何从这 232 段里找到正确的 5 段。"
