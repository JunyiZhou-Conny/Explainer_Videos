# zh narration for S01-S09 (part 1, group g1: build the index — chunk, embed, load), sentence-aligned to
# script.md v2: one zh sentence per English sentence (explainer.voice.split_sentences; 82 SAY lines, 203
# sentences). Terms and rules: ../GLOSSARY.md, ../glossary.yaml (binding).
# Subtitles only: there is no Chinese voice in this series, so no say: and no anchors (rule D2); the zh line is
# shown on the English timing, so each sentence keeps the English order of ideas and about its length (D8).
# Underscore names are written the way the SAY speaks them, with a Chinese noun (rule A6: GCP project 这个变量,
# chunk type 用 char-split, chunk overlap 参数, service disabled, permission denied). No brackets and no symbols
# the checker refuses (B2, B3). Numbers as on screen, without thousands separators (C1: 7808, 7458, 8248,
# 14228, 3072); S01's story beats in digits too (11 本书, 10 本, 10 页). Commands sit at the end of a clause,
# after a full-width colon (G3). Sentences never open with an artifact or a lower-case kept-English word (A5).
# The five-question ponder lines (S06[3], S07[3], S08[12]) give nothing away (A9).
# en_display: the English subtitle line where the SAY spells an artifact as words (rule D4: llm-rag,
# llm-service-account(.json), .gitignore, SERVICE_DISABLED, PERMISSION_DENIED, GCP_PROJECT, --rm, /app,
# /secrets, /.venv, /data, docker-volumes/, outputs/, llm-rag-cli, .dockerignore, localhost:8000, --chunk ...
# --chat, --chunk_type char-split / recursive-split, chunk_overlap, gemini-embedding-001, HNSW); null = the
# SAY text.
S01:
- en: "Here's the question this tutorial asks a language model: how is Tolminc cheese made? Tolminc is a real Alpine cheese, but the answer we want lives in one particular text."
  zh:
  - "这个教程要问语言模型一个问题：Tolminc 奶酪是怎么做的？"
  - "Tolminc 是一种真实的阿尔卑斯奶酪，但我们要的答案在某一篇特定的文本里。"
- en: "The knowledge base is eleven books: ten old cheese books from Project Gutenberg, and the instructor's short story, a fictional tale. A model trained before that story existed has never read it, so it answers from somewhere else. How do we make it answer from this story, without retraining it?"
  zh:
  - "知识库一共是 11 本书：10 本 Project Gutenberg 上讲奶酪的老书，加上授课老师写的一个短篇故事，一个虚构的故事。"
  - "在这个故事出现之前训练的模型从没读过它，所以它的回答来自别处。"
  - "怎样让它根据这个故事回答，又不用重新训练？"
- en: "The lecture lists four weaknesses: stale training data, no specialized knowledge, hallucination, and no sources. RAG, retrieval augmented generation, goes after the first two."
  zh:
  - "课上列出了四个弱点：训练数据过时、缺少专业知识、幻觉，以及没有出处。"
  - "RAG，也就是检索增强生成，针对的是前两个。"
- en: "Paste all eleven books into the prompt, and you get garbage. Fine-tune the model, and it's slow; that's lecture 8. Or let a librarian hand it the ten most relevant pages: an open-book exam. That's RAG."
  zh:
  - "把 11 本书全贴进 prompt，得到的是一堆垃圾。"
  - "微调模型呢，又很慢；那是第 8 讲的内容。"
  - "或者让一位图书管理员把最相关的 10 页递给它：一场开卷考试。"
  - "这就是 RAG。"
- en: "The lecture's map of RAG techniques is crowded, but it starts from four questions. What is an embedding, a vector database, a query, the context? This video answers all four."
  zh:
  - "课上那张 RAG 技术全景图很拥挤，但它是从四个问题出发的。"
  - "什么是 embedding、向量数据库、查询，以及上下文？"
  - "这期视频四个都会回答。"
- en: "Open the README beside this video. Top left, the tracker shows its step; top right, the gray tag points to the lecture slides. When the yellow your-turn tag appears, pause and run the command; extra commands aren't in the README."
  zh:
  - "把 README 打开，放在视频旁边。"
  - "左上角的进度条显示当前步骤；右上角的灰色标签指向课件。"
  - "看到黄色的 your turn 标签，就暂停，自己跑一遍命令；额外的命令 README 里没有。"
- en: "We recorded without a Google key. Docker, chunking and the database ran for real; the embeddings are the staff's recorded vectors. Where the code calls Google, you see the command, the real error, and what to look for."
  zh:
  - "我们录制时没有 Google 的密钥。"
  - "Docker、分块和数据库都是真实运行的；embedding 用的是课程团队留下的向量。"
  - "凡是代码调用 Google 的地方，你会看到命令、真实的报错，以及该看什么。"
S02:
- en: "Here's RAG in five boxes. The user's question goes to the RAG code, which asks a vector database for related texts. The code joins question and texts into one full prompt, and the model's response goes back. The database never talks to the model."
  zh:
  - "用五个方框讲清 RAG。"
  - "用户的问题先到 RAG 代码，代码去向量数据库里要相关的文本。"
  - "代码把问题和这些文本拼成一个完整的 prompt，模型的回答再送回去。"
  - "数据库从不和模型直接对话。"
- en: "Open the RAG box and you get two lanes. On top, books are cut into chunks, an embedding model turns each chunk into a vector, and the vectors go into the database. Below, the question goes through the same model, and only its vector reaches the database."
  zh:
  - "打开 RAG 这个方框，里面是两条通道。"
  - "上面，先把书切成 chunk，embedding 模型把每个 chunk 变成一个向量，向量再存进数据库。"
  - "下面，问题经过同一个模型，只有它的向量会到达数据库。"
- en: "This is the pipeline slide from lecture, with three phases. Indexing is the whole top lane. Retrieval brings the context to the prompt, and the model does augmentation and generation."
  zh:
  - "这就是课上那页讲 pipeline 的课件，分三个阶段。"
  - "索引阶段就是上面整条通道。"
  - "检索阶段把上下文带进 prompt，模型负责增强和生成。"
- en: "The README calls the two lanes step 1 and step 2, and gives each box one flag of cli.py: chunk, embed and load on top, query and chat below."
  zh:
  - "README 把两条通道叫作 Step 1 和 Step 2，并给每个方框配了 cli.py 的一个参数：上面是 --chunk、--embed 和 --load，下面是 --query 和 --chat。"
  en_display:
  - "The README calls the two lanes step 1 and step 2, and gives each box one flag of cli.py: --chunk, --embed and --load on top, --query and --chat below."
- en: "Two rules. The top lane runs once, offline, and it's slow. The bottom lane runs for every question. And both lanes must use the same embedding model, or the question and the chunks don't live in the same space."
  zh:
  - "两条规则。"
  - "上面的通道只跑一次，离线跑，而且很慢。"
  - "下面的通道每个问题都要跑一次。"
  - "而且两条通道必须用同一个 embedding 模型，不然问题和这些 chunk 就不在同一个空间里。"
- en: "Where does each box run? The chunker runs in your own container. Both models run at Google: you pay for the text you send, with your key, and nothing keeps running there. The database runs in a second container, with its files on your laptop."
  zh:
  - "每个方框在哪儿运行？"
  - "分块器在你自己的 container 里运行。"
  - "两个模型都在 Google 那边运行：你用自己的密钥，按发送的文本付费，那边没有任何东西一直开着。"
  - "数据库在第二个 container 里运行，文件放在你的笔记本上。"
- en: "Every step is one python cli.py command, inside that first container. So first, let's get it running."
  zh:
  - "每一步都是一条 python cli.py 命令，在第一个 container 里运行。"
  - "所以，先把它跑起来。"
S03:
- en: "Prerequisites first: Docker. This extra check prints its versions; the script needs docker compose, with a space. On a Mac your prompt looks different; on Windows, use WSL or Git Bash."
  zh:
  - "先看 Prerequisites 一节：Docker。"
  - "这个额外检查会打印它的版本号；脚本要的是中间带空格的 docker compose。"
  - "在 Mac 上，提示符看起来不一样；在 Windows 上，用 WSL 或 Git Bash。"
- en: "The README links the repo but doesn't print the clone command, so here it is. Then, as an extra, make a secrets folder beside the clone, and keep the clone's name exactly L-L-M rag. Pause and do both, in your course folder."
  zh:
  - "README 给了 repo 的链接，但没写 clone 命令，所以命令在这里。"
  - "然后额外做一件事：在 clone 旁边建一个 secrets 目录，并且让 clone 的名字一字不差地叫 llm-rag。"
  - "暂停一下，在你的课程目录里把两件事都做了。"
  en_display:
  - null
  - "Then, as an extra, make a secrets folder beside the clone, and keep the clone's name exactly llm-rag."
  - null
- en: "Now the service account, in the Google Cloud console. Create one called L-L-M service account, and grant it two roles: Storage Admin, and Gemini Enterprise Agent Platform User. Open its keys tab, add a JSON key, and save it in secrets as L-L-M service account dot JSON."
  zh:
  - "接下来是服务账号，在 Google Cloud 控制台里。"
  - "建一个叫 llm-service-account 的账号，授予它两个角色：Storage Admin，还有 Gemini Enterprise Agent Platform User。"
  - "打开它的 KEYS 标签页，添加一个 JSON 密钥，存进 secrets 目录，命名为 llm-service-account.json。"
  en_display:
  - null
  - "Create one called llm-service-account, and grant it two roles: Storage Admin, and Gemini Enterprise Agent Platform User."
  - "Open its keys tab, add a JSON key, and save it in secrets as llm-service-account.json."
- en: "That key spends your project's money; the git ignore file has no secrets line, so it's safe only beside the repo. Remember lecture 4's three gates: the key says who you are, the role what you may do, and the API must be switched on."
  zh:
  - "这个密钥花的是你项目的钱；.gitignore 文件里没有 secrets 这一行，所以它只有放在 repo 旁边才安全。"
  - "还记得第 4 讲的三道关卡吗：密钥说明你是谁，角色说明你能做什么，API 还必须打开。"
  en_display:
  - "That key spends your project's money; the .gitignore file has no secrets line, so it's safe only beside the repo."
  - null
- en: "Two small slips. Nothing here uses Cloud Storage, so the Agent Platform role is what matters. And the README never says to enable the Vertex AI API; without it, the first embedding call fails with service disabled, after 5 retries. Pause and do it all now: account, roles, key, and API."
  zh:
  - "两个小疏漏。"
  - "这里没有任何东西用到 Cloud Storage，所以真正要紧的是 Agent Platform 这个角色。"
  - "而且 README 一直没说要启用 Vertex AI API；没有它，第一次 embedding 调用就会失败，重试 5 次后报 service disabled。"
  - "现在就暂停，全部弄好：账号、角色、密钥和 API。"
  en_display:
  - null
  - null
  - "And the README never says to enable the Vertex AI API; without it, the first embedding call fails with SERVICE_DISABLED, after 5 retries."
  - null
- en: "Step 1 of the next section: cd L-L-M rag. An extra look shows the scripts, the compose file, cli.py, and the commit this video was recorded on."
  zh:
  - "下一节的第 1 步：cd llm-rag。"
  - "额外看一眼，能看到这些脚本、compose 文件、cli.py，以及这期视频录制时用的 commit。"
  en_display:
  - "Step 1 of the next section: cd llm-rag."
  - null
- en: "Step 2: in your editor, set GCP project on line 7 to your own Project ID, the ID, not the name. Leave line 8 alone. Skip this, and your calls go to the course's project and fail. Pause and edit."
  zh:
  - "第 2 步：在编辑器里，把第 7 行的 GCP project 变量改成自己的项目 ID，是 ID，不是项目名称。"
  - "第 8 行别动。"
  - "跳过这一步，你的调用就会发到课程的项目上，然后失败。"
  - "暂停一下，改好它。"
  en_display:
  - "Step 2: in your editor, set GCP_PROJECT on line 7 to your own Project ID, the ID, not the name."
  - null
  - null
  - null
S04:
- en: "Lecture 4 put two containers on one network; lecture 3 brought a key in through a mount. Today: both at once, with one command."
  zh:
  - "第 4 讲把两个 container 放在一个网络上；第 3 讲通过挂载把密钥带了进来。"
  - "今天：两件事一起做，只用一条命令。"
- en: "The script, docker-shell.sh, exports three values: your project, the key's path inside the container, and the image name. Then it calls docker compose run, with dash dash r m, for that one service."
  zh:
  - "这个脚本 docker-shell.sh 导出三个值：你的项目、密钥在 container 里的路径，还有 image 名。"
  - "然后它调用 docker compose run，加上 --rm，只跑那一个服务。"
  en_display:
  - null
  - "Then it calls docker compose run, with --rm, for that one service."
- en: "The compose file draws the whole picture: one network, by name, and the CLI service on it, with an image built from this folder if missing."
  zh:
  - "这个 compose 文件把整张图都画出来了：一个网络，按名字指定，上面是 CLI 服务，image 没有的话就用这个目录构建。"
- en: "Two mounts put the repo onto slash app and secrets onto slash secrets. Two slots take the script's values, and the service depends on Chroma."
  zh:
  - "两个挂载把这个 repo 放到 /app，把 secrets 放到 /secrets。"
  - "两个空位接收脚本给的值，这个服务还依赖 Chroma。"
  en_display:
  - "Two mounts put the repo onto /app and secrets onto /secrets."
  - null
- en: "The Chroma service runs the database from Docker Hub, under a fixed name. It publishes port 8000 to your laptop, keeps its data in the docker volumes folder, and lets the course's web tools in."
  zh:
  - "Chroma 服务运行的是来自 Docker Hub 的数据库，用一个固定的名字。"
  - "它把 port 8000 发布到你的笔记本上，把数据放在 docker-volumes 目录里，还让课程的网页工具连进来。"
  en_display:
  - null
  - "It publishes port 8000 to your laptop, keeps its data in the docker-volumes/ folder, and lets the course's web tools in."
- en: "From the Dockerfile: the virtual environment lives in slash dot venv, outside slash app, so the code mount can't hide it. Edit cli.py on your laptop and rerun; no rebuild."
  zh:
  - "再看 Dockerfile：虚拟环境在 /.venv，在 /app 外面，所以代码的挂载盖不住它。"
  - "在笔记本上改 cli.py，再跑一次就行；不用重新构建。"
  en_display:
  - "From the Dockerfile: the virtual environment lives in /.venv, outside /app, so the code mount can't hide it."
  - null
- en: "Step 3: sh docker-shell.sh. Compose pulls Chroma's image, creates the network, and creates the Chroma container first."
  zh:
  - "第 3 步：sh docker-shell.sh。"
  - "Compose 会 pull Chroma 的 image，建好网络，并且先建 Chroma 的 container。"
- en: "Then this, which looks like an error but isn't. Compose first asks Docker Hub for an image called L-L-M rag CLI, finds none, and builds it instead."
  zh:
  - "然后是这个：看起来像报错，其实不是。"
  - "Compose 先去 Docker Hub 找一个叫 llm-rag-cli 的 image，没找到，就改为自己构建。"
  en_display:
  - null
  - "Compose first asks Docker Hub for an image called llm-rag-cli, finds none, and builds it instead."
- en: "The build took 81 seconds here. Its context was 112 megabytes, mostly git history that still holds an old copy of the staff's database. With no docker ignore file, the image keeps it."
  zh:
  - "这里构建用了 81 秒。"
  - "构建上下文有 112 MB，大部分是 git 历史，里面还留着课程团队数据库的一份旧拷贝。"
  - "因为没有 .dockerignore 文件，image 会把它留下来。"
  en_display:
  - null
  - null
  - "With no .dockerignore file, the image keeps it."
- en: "Then the banner: Python 3.12.15 and uv 0.13.1, at the time of recording. It says activated before it activates: cosmetic."
  zh:
  - "然后是横幅：Python 3.12.15 和 uv 0.13.1，都是录制时的版本。"
  - "它在激活之前就说已经激活了：只是显示问题。"
- en: "You're at the container's prompt. The part after the at sign is the container's ID; it changes every run. Pause, and get to this prompt."
  zh:
  - "你现在到了 container 的提示符。"
  - "提示符里 @ 符号后面是 container ID；每次运行都会变。"
  - "暂停一下，走到这个提示符。"
S05:
- en: "Check the picture with extras: open a second laptop terminal and cd into L-L-M rag. The docker ps command shows Chroma with port 8000 published. But the CLI container isn't called L-L-M rag CLI: compose run ignores that name."
  zh:
  - "用额外检查核对这张图：在笔记本上开第二个终端，cd 进 llm-rag。"
  - "用 docker ps 这条命令可以看到 Chroma，port 8000 已经发布出去了。"
  - "但 CLI container 并不叫 llm-rag-cli：compose run 会忽略这个名字。"
  en_display:
  - "Check the picture with extras: open a second laptop terminal and cd into llm-rag."
  - null
  - "But the CLI container isn't called llm-rag-cli: compose run ignores that name."
- en: "And docker inspect, with the name from docker ps, lists the mounts. The repo is on slash app, secrets on slash secrets, and the docker volumes folder on Chroma's slash data."
  zh:
  - "再用 docker inspect，带上 docker ps 给出的名字，就能列出挂载。"
  - "这个 repo 在 /app，secrets 在 /secrets，docker-volumes 目录在 Chroma 的 /data。"
  en_display:
  - null
  - "The repo is on /app, secrets on /secrets, and the docker-volumes/ folder on Chroma's /data."
- en: "Inside the container, your Project ID and the key's path arrived. Our secrets folder is empty, with no key; yours should list the JSON file."
  zh:
  - "在 container 里，你的项目 ID 和密钥的路径都传进来了。"
  - "我们的 secrets 目录是空的，没有密钥；你的应该能列出那个 JSON 文件。"
- en: "The CLI finds Chroma by name, through the network's phone book. From your laptop, the heartbeat comes through localhost port 8000, the published door for you and your browser."
  zh:
  - "CLI 通过网络的电话簿，按名字找到 Chroma。"
  - "在你的笔记本上，心跳通过 localhost:8000 回来，这就是发布出去的那扇门，给你和你的浏览器用。"
  en_display:
  - null
  - "From your laptop, the heartbeat comes through localhost:8000, the published door for you and your browser."
- en: "Docker already created Chroma's data folder on your laptop, owned by root, with the database file in it. On Linux, deleting it later will need sudo."
  zh:
  - "Docker 已经在你的笔记本上建好了 Chroma 的数据目录，属主是 root，数据库文件就在里面。"
  - "在 Linux 上，以后删它要用 sudo。"
- en: "Now two traps, hit on purpose. Trap one: typing the compose command yourself. Both variables come out blank, and even chunking dies at startup, where cli.py creates its Google client, looking for a key file with no name. Always start through the script."
  zh:
  - "接下来是两个陷阱，我们故意踩一下。"
  - "陷阱一：自己敲 compose 命令。"
  - "两个变量都是空的，连分块都在启动时就挂了：cli.py 在那里创建 Google 客户端，去找一个没有名字的密钥文件。"
  - "一定要通过脚本启动。"
- en: "Trap two: a clone with another name, like the folder a zip download gives you. The compose file mounts a folder named L-L-M rag, so Docker creates an empty one, owned by root, over your code. Keep the name, and delete the stray folder."
  zh:
  - "陷阱二：clone 用了别的名字，比如下载 zip 包解压出来的那种目录。"
  - "这个 compose 文件挂载的是名叫 llm-rag 的目录，所以 Docker 会建一个空目录，属主是 root，盖在你的代码上。"
  - "名字保持不变，再把多出来的那个目录删掉。"
  en_display:
  - null
  - "The compose file mounts a folder named llm-rag, so Docker creates an empty one, owned by root, over your code."
  - null
- en: "One last oddity: the image tag called latest, and three version numbers that don't match; a team should pin a tag. Pause and try these checks; your key in slash secrets matters most."
  zh:
  - "最后一个怪现象：image 的 tag 叫 latest，而三个版本号对不上；团队应该 pin 一个固定的 tag。"
  - "暂停一下，试试这些检查；最要紧的是你放在 /secrets 里的密钥。"
  en_display:
  - null
  - "Pause and try these checks; your key in /secrets matters most."
S06:
- en: "Indexing starts with chunking. One vector for a whole book averages its topics, so every question fetches the whole book. Sending 11 books each time is slow, costly, and gives garbage. A chunk is small enough to find, and to paste."
  zh:
  - "建索引从分块开始。"
  - "一整本书只用一个向量，会把书里的话题平均掉，于是每个问题都会取回整本书。"
  - "每次都发 11 本书，又慢又贵，得到的还是垃圾。"
  - "一个 chunk 小到可以被找到，也小到可以贴进去。"
- en: "Step 1 is a link: the README's chunk visualizer. Open it in Chrome and play with the sliders; here's the idea it shows."
  zh:
  - "第 1 步是一个链接：README 里的 chunk 可视化工具。"
  - "在 Chrome 里打开，拖拖滑块；它展示的想法是这样的。"
- en: "Character splitting is a ruler. Lines 185 and 186 set windows of 350 characters, overlapping by 20. The separator is empty, so it counts characters, not words, stepping 330 at a time."
  zh:
  - "按字符切分就是一把尺子。"
  - "第 185 和 186 行设定了 350 个字符的窗口，相邻窗口重叠 20 个。"
  - "分隔符是空的，所以它数的是字符，不是单词，每次前进 330 个。"
- en: "The instructor's story is 7,808 characters long. Windows of 350 that overlap by 20: how many chunks?"
  zh:
  - "授课老师的故事长 7808 个字符。"
  - "窗口大小 350，重叠 20：会切出多少个 chunk？"
- en: "The first window takes 350 characters, and each one after it adds 330 new ones. 7,458 more characters need 23 more windows: 24 chunks."
  zh:
  - "第一个窗口取 350 个字符，之后每个窗口新增 330 个。"
  - "剩下的 7458 个字符还要 23 个窗口：一共 24 个 chunk。"
- en: "Step 2: python cli.py, dash dash chunk, chunk type char split. It reads 11 books and prints each book's chunk count; the story gets 24. No key needed: this branch never calls Google. Pause and run it."
  zh:
  - "第 2 步：python cli.py --chunk，chunk type 用 char-split。"
  - "它读入 11 本书，打印每本书的 chunk 数；故事得到 24 个。"
  - "不需要密钥：代码里的这个分支从不调用 Google。"
  - "暂停一下，自己跑一遍。"
  en_display:
  - "Step 2: python cli.py --chunk --chunk_type char-split."
  - null
  - null
  - null
- en: "An extra line count of the chunk files: 24 for the story, and 8,248 in total."
  zh:
  - "额外数一下 chunk 文件的行数：故事是 24 行，一共 8248 行。"
- en: "An extra look at the seam. Chunk 0 stops two letters into the word accomplish. Chunk 1 backs up 20 characters, to the last letter of things, so accomplish is whole again. The lecture's pieces sit end to end, with no overlap."
  zh:
  - "额外看一眼接缝。"
  - "第 0 个 chunk 停在 accomplish 这个词的前两个字母上。"
  - "第 1 个 chunk 往回退 20 个字符，退到 things 的最后一个字母，所以 accomplish 又完整了。"
  - "课上的例子里，切出的块首尾相接，没有重叠。"
- en: "The chunk files land in outputs, on your laptop, and git ignores them. Row 0 of a Gutenberg book is the Project Gutenberg header: these books start with a header and end with a license, both chunked like the rest."
  zh:
  - "这些 chunk 文件落在你笔记本上的 outputs 目录里，git 会忽略它们。"
  - "一本 Gutenberg 书的第 0 行，是 Project Gutenberg 的开头声明：这些书开头是声明，结尾是许可证，两者都和正文一样切成了 chunk。"
  en_display:
  - "The chunk files land in outputs/, on your laptop, and git ignores them."
  - null
S07:
- en: "Recursive splitting gets only a chunk size, the same 350. No overlap is given."
  zh:
  - "递归切分只给了 chunk 大小，还是 350。"
  - "没有指定重叠。"
- en: "It works like scissors that look for the best gap. First a blank line between paragraphs, then a line break, then a space, and only as a last resort, a single character. So every cut falls between words."
  zh:
  - "它就像一把会找最佳缝隙的剪刀。"
  - "先找段落之间的空行，再找换行，再找空格，实在不行才切在单个字符上。"
  - "所以每个切点都落在单词之间。"
- en: "Step 3: the same command with chunk type recursive split. The story now makes 35 chunks, and an extra line count gives 14,228 in total. Pause and run it."
  zh:
  - "第 3 步：同一条命令，chunk type 换成 recursive-split。"
  - "故事现在切出 35 个 chunk，额外数一下行数，一共 14228 个。"
  - "暂停一下，自己跑一遍。"
  en_display:
  - "Step 3: the same command with --chunk_type recursive-split."
  - null
  - null
- en: "Same chunk size, 350. So why 14,228 chunks instead of 8,248?"
  zh:
  - "同样的 chunk 大小，350。"
  - "那为什么是 14228 个 chunk，而不是 8248 个？"
- en: "Look at the first chunks. Chunk 1 starts again with Chapter One, repeating the end of chunk 0. The splitter's library default is an overlap of up to 200 characters, which the README never mentions. Cutting at boundaries also makes chunks shorter."
  zh:
  - "看看前几个 chunk。"
  - "第 1 个 chunk 又从 Chapter One 开始，重复了第 0 个 chunk 的结尾。"
  - "这个切分器所在的库，默认值是最多重叠 200 个字符，README 从没提过。"
  - "在边界处切开，也会让 chunk 变短。"
- en: "Overlap is insurance against cutting an idea in half. But every repeated character is embedded, stored, and paid for. If you want a different value, set chunk overlap yourself."
  zh:
  - "重叠是一份保险，防止把一个意思切成两半。"
  - "但每个重复的字符都要向量化、存储，还要付钱。"
  - "想要别的值，就自己设置 chunk overlap 参数。"
  en_display:
  - null
  - null
  - "If you want a different value, set chunk_overlap yourself."
- en: "The lecture's point is that ideal chunks follow the document's own structure. Recursive splitting goes part of the way, using paragraphs. Semantic chunking, in part 2, goes further."
  zh:
  - "课上的观点是：理想的 chunk 应该顺着文档自身的结构。"
  - "递归切分做到了一部分，靠的是段落。"
  - "第二部分的语义分块走得更远。"
S08:
- en: "Next, the embedding model. It turns each chunk into one vector, a list of numbers, so similar meanings point in similar directions: in this sketch, curd near curd, license text elsewhere."
  zh:
  - "接下来是 embedding 模型。"
  - "它把每个 chunk 变成一个向量，也就是一串数字，让意思相近的指向相近的方向：在这张示意图里，讲凝乳的挨着讲凝乳的，许可证文本在别处。"
- en: "The personality game from lecture makes this concrete. Five scores make each person a five-number vector. Cosine similarity compares only the angle, and picks the first candidate."
  zh:
  - "课上的性格游戏把这件事讲得很具体。"
  - "五个分数把每个人变成一个五维向量。"
  - "余弦相似度只比较夹角，选中的是第一个候选人。"
- en: "The dot product also counts length, and would pick the second candidate, whose arrow is longer. So a measure is a choice; for text, cosine is the usual one."
  zh:
  - "点积还会算上长度，会选中第二个候选人，也就是箭头更长的那个。"
  - "所以度量是一个选择；对文本来说，常用的是余弦。"
- en: "The tutorial's model, Gemini embedding 001, natively returns 3,072 numbers; the code asks for the first 256, a prefix the model is trained to make useful alone."
  zh:
  - "教程用的模型 gemini-embedding-001 原生返回 3072 个数；代码只要前 256 个，模型训练时就让这段前缀单独也能用。"
  en_display:
  - "The tutorial's model, gemini-embedding-001, natively returns 3,072 numbers; the code asks for the first 256, a prefix the model is trained to make useful alone."
- en: "Chunks go to the model in batches of 100. On an API error, it retries up to 5 times, doubling the wait from 5 seconds."
  zh:
  - "这些 chunk 每批 100 个发给模型。"
  - "遇到 API 错误，它最多重试 5 次，等待时间从 5 秒开始逐次翻倍。"
- en: "Your question will use this same model, later. Chunks now, questions later: one model."
  zh:
  - "你的问题之后也会用这同一个模型。"
  - "现在是 chunk，之后是问题：同一个模型。"
- en: "Step 1: python cli.py, dash dash embed, chunk type char split: the first call to Google. On our machine it reads the first book, then stops at the missing key file. On yours, it runs."
  zh:
  - "第 1 步：python cli.py --embed，chunk type 用 char-split：第一次调用 Google。"
  - "在我们的机器上，它读入第一本书，然后停住了：没有密钥文件。"
  - "在你的机器上，它能跑通。"
  en_display:
  - "Step 1: python cli.py --embed --chunk_type char-split: the first call to Google."
  - null
  - null
- en: "With your key, look for each book's file, a 5-second pause, a table with an embedding column, and new embeddings files beside the chunks."
  zh:
  - "有密钥的话，要找的是每本书的文件、5 秒的停顿、一张带 embedding 列的表，以及 chunk 旁边新出现的 embeddings 文件。"
- en: "If yours fails, or keeps retrying, read the error. Key file not found: check its name in secrets. Permission denied: fix the Project ID or the role, then exit and start the script again. Service disabled: switch on the API."
  zh:
  - "如果你那边失败了，或者一直在重试，就去读报错。"
  - "找不到密钥文件：检查 secrets 目录里它的名字。"
  - "报 permission denied：改好项目 ID 或角色，然后退出，重新运行脚本。"
  - "报 service disabled：把 API 打开。"
  en_display:
  - null
  - null
  - "PERMISSION_DENIED: fix the Project ID or the role, then exit and start the script again."
  - "SERVICE_DISABLED: switch on the API."
- en: "Step 2 does the same for recursive split. Pause and run both, with your key: about 89 and 148 calls, cents by our estimate. Check the current price list."
  zh:
  - "第 2 步对 recursive-split 做同样的事。"
  - "暂停一下，用你的密钥两条都跑一遍：大约 89 次和 148 次调用，按我们的估算只要几美分。"
  - "具体以现行的价目表为准。"
  en_display:
  - "Step 2 does the same for recursive-split."
  - null
  - null
- en: "The video goes on with the staff's own outputs, once committed and still in every clone's history. Their chunk files match ours byte for byte, so their vectors are what this command makes."
  zh:
  - "视频接下来用课程团队自己的输出，它们曾经 commit 过，至今还在每个 clone 的历史里。"
  - "他们的 chunk 文件和我们的逐字节相同，所以他们的向量就是这条命令会生成的向量。"
- en: "An extra check on the story's vectors: 24 rows of 256 numbers, with lengths from 0.369 to 0.402, not 1."
  zh:
  - "额外检查一下故事的向量：24 行，每行 256 个数，长度在 0.369 到 0.402 之间，不是 1。"
- en: "Our collection compares by cosine, and these arrows are shorter than 1. Does that change which chunks count as nearest?"
  zh:
  - "我们的 collection 按余弦来比较，而这些箭头的长度都不到 1。"
  - "这会改变哪些 chunk 算是最近的吗？"
- en: "No: cosine only sees the angle. With straight-line distance, Chroma's default, or a dot product, length would leak into the ranking: the game's lesson."
  zh:
  - "不会：余弦只看夹角。"
  - "要是用直线距离，也就是 Chroma 的默认值，或者用点积，长度就会渗进排名：这就是那个游戏的教训。"
S09:
- en: "An ordinary database answers precise questions, like a price between 10 and 50, but it can't find rows whose meaning is like a question. A vector database can."
  zh:
  - "普通数据库回答的是精确的问题，比如价格在 10 到 50 之间，但它找不到意思和问题相近的行。"
  - "向量数据库可以。"
- en: "Each chunk becomes a record: an ID, the text, metadata with book, author and year, and the vector. The ID hashes the book's name plus the row number, so it's stable."
  zh:
  - "每个 chunk 变成一条记录：一个 ID，文本，包含书名、作者和年份的元数据，还有向量。"
  - "这个 ID 是对书名加行号做哈希得到的，所以是稳定的。"
- en: "Records go into a collection, one per chunk type. The load step deletes it and creates it again, with cosine as its measure: every load is a full rebuild."
  zh:
  - "记录放进一个 collection，每种 chunk type 一个。"
  - "而 load 这一步先删掉它，再重新创建，用余弦作为度量：每次 load 都是完全重建。"
- en: "Comparing a question with every vector is slow at scale. So the database builds an index, in these slides' sense: a layered graph called H-N-S-W, where a search hops down in a few steps."
  zh:
  - "拿问题和每个向量逐一比较，数据量一大就很慢。"
  - "所以数据库会建一个索引，就是这几页课件说的那种：一张叫 HNSW 的分层图，搜索几步就能一层层跳下来。"
  en_display:
  - null
  - "So the database builds an index, in these slides' sense: a layered graph called HNSW, where a search hops down in a few steps."
- en: "Step 1: python cli.py, dash dash load, chunk type char split. On our first run there were no embeddings yet: it made an empty collection and found 0 files. If you see 0, your embed step didn't finish."
  zh:
  - "第 1 步：python cli.py --load，chunk type 用 char-split。"
  - "我们第一次运行时还没有 embedding：它建了一个空的 collection，找到 0 个文件。"
  - "如果你看到 0，说明你的 embed 那一步没跑完。"
  en_display:
  - "Step 1: python cli.py --load --chunk_type char-split."
  - null
  - null
- en: "On the staff's recorded vectors, the same command deletes that empty collection and reads 11 files with an embedding column. It inserts 8,248 records, in batches of 500."
  zh:
  - "用课程团队留下的向量，同一条命令会删掉那个空的 collection，读入 11 个带 embedding 列的文件。"
  - "它插入 8248 条记录，每批 500 条。"
- en: "Step 2 loads recursive split, 14,228 records. Pause and run both loads."
  zh:
  - "第 2 步加载 recursive-split，14228 条记录。"
  - "暂停一下，两次 load 都跑一遍。"
  en_display:
  - "Step 2 loads recursive-split, 14,228 records."
  - null
- en: "An extra check: both collections now have dimension 256, fixed by the first insert."
  zh:
  - "额外检查一下：两个 collection 现在的维度都是 256，由第一次插入决定。"
- en: "And one book has no author or year: a small slip cuts its file name at the first dot. Split off only the extension, delete that book's old files in outputs, then chunk, embed and load again."
  zh:
  - "还有一本书没有作者和年份：一个小疏漏，代码在第一个点就把文件名截断了。"
  - "只去掉扩展名，删掉 outputs 目录里这本书的旧文件，然后重新分块、向量化、加载。"
  en_display:
  - null
  - "Split off only the extension, delete that book's old files in outputs/, then chunk, embed and load again."
- en: "The docker volumes folder on your laptop now holds a 60-megabyte SQLite file and two index folders, one per collection, owned by root. The README calls it persistent."
  zh:
  - "你笔记本上的 docker-volumes 目录里，现在有一个 60 MB 的 SQLite 文件和两个索引目录，每个 collection 一个，属主都是 root。"
  - "README 说它是持久化的。"
  en_display:
  - "The docker-volumes/ folder on your laptop now holds a 60-megabyte SQLite file and two index folders, one per collection, owned by root."
  - null
- en: "Step 3 is a link to the course's Chroma UI. Opened in Chrome, it reads your local database through port 8000; Chroma's settings allow that one site."
  zh:
  - "第 3 步是一个链接，指向课程的 Chroma UI。"
  - "在 Chrome 里打开，它会通过 port 8000 读取你本地的数据库；Chroma 的设置放行了这一个网站。"
- en: "The top lane is done: the index is built. In part 2, we ask it questions."
  zh:
  - "上面这条通道完成了：索引建好了。"
  - "第二部分，我们来向它提问。"
