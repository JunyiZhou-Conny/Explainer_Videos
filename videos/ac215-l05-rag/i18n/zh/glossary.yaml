# Chinese (zh-CN) glossary and translation rules for ac215-l05-rag (AC215 lecture 5, Introduction to RAG:
# a follow-along of dlops-io/llm-rag, branch main @ e17a39f), code-switching version, SUBTITLES ONLY.
# Audience: Chinese-speaking AC215 grad students who read technical English fluently; register of a Chinese
# MLOps TA running a lab section. Precedents and source of the shared decisions: the series pilot
# videos/ac215-l01-vms-venvs/i18n/zh and the container lectures videos/ac215-l02-containers-1,
# ac215-l03-mega-pipeline and ac215-l04-flexible-workflow-ports (i18n/zh: the subtitles-only rule set this
# file follows). Every term L1-L4 already decided keeps their form; what is new here is the RAG vocabulary
# (chunking, embeddings, the vector database, query, filters, the prompt, the lecture's advanced RAG, A3)
# and the pins of build/review_spoken.md item 16 (lane 通道, ruler 尺子, seismograph 地震仪, one phrase for
# "a small slip", Step 1 / Step 2 kept), which script.md's header asks this stage to apply.
# There is NO Chinese voice in this series: the Chinese lines are subtitles on the English timing (the bilingual
# band of output/<id>.zh-en.mp4, <id>.zh.srt, <id>.zh-en.srt / .ass). So no say:, no anchors, no readings, no
# durations, no rules about how numbers or symbols are spoken (L1's C2-C5 and F1-F6 are dropped): only display
# rules. But `python -m explainer.i18n check` still applies its voice hygiene to the displayed line when a
# sentence has no say: (brackets, maths symbols, letter_letter names, Latin words not listed here, a missing
# half-width space): rules A6, B3 and D3 are how the Chinese line stays clean without say:.
# Human-readable copy in Chinese: GLOSSARY.md (keep the two in sync).
# terms[].zh_subtitle = the display form (Chinese subtitle line; titles use the written forms of A4);
# terms[].first_use = an example sentence for the translators, as SNN[k]：<one Chinese sentence for one English
# sentence of block k>; each one passes the checker;
# rules are tagged [A1]..[I2]: A terms, B typography, C numbers, D narration file, G subtitles, H titles and
# companions, I toolkit notes. (L1's E on-screen strings and F voice rules do not apply: nothing on screen is
# translated in this series, and there is no voice.)
# Read by: python -m explainer.i18n check (Latin words allowed in the Chinese line: every Latin word of
# zh_subtitle and first_use, plus allowed_spoken_latin, which lists the words as the checker's regex
# [A-Za-z][A-Za-z'.-]* cuts them: gemini-embedding-001 is gemini-embedding-, gemini-3.1-flash-lite is gemini- and
# flash-lite, /.venv is venv, .gitignore is gitignore, $contains is contains, AC215 is AC) and
# explainer/subtitles.py, for EVERY video (2-3 word English phrases of `en` are kept on one English line;
# 2-7 character Chinese headwords of zh_subtitle are registered in jieba, so zh_subtitle holds terms, not
# example phrases).
video: ac215-l05-rag
lang: zh-CN (mainland Simplified Chinese)
audience: 'Chinese-speaking AC215 (MLOps & LLMOps) grad students who know Python and basic ML and have used an LLM, read technical English fluently, did L1 (a VM, venvs, uv), L2 (a given Dockerfile, image vs container, Docker Hub), L3 (a service-account key mounted from ../secrets, bind mounts) and L4 (docker-shell.sh, container networks, ports, Compose); new to retrieval, embeddings and vector databases. They follow along on their own laptop with their clone of dlops-io/llm-rag open in ~/AC215/llm-rag, beside ~/AC215/secrets. Register of a Chinese MLOps TA running a lab section.'
voice: none          # subtitles only (video.yaml: Chinese = i18n/zh/narration/*.yaml on the English timing)
policy: 'The Mandarin of a Chinese MLOps TA walking a lab section through the steps, code-switching only where such a speaker really does, written as subtitles under an English narration. The viewers are Chinese-speaking AC215 grad students who read technical English fluently and already say 起一个 container, 构建 image, pull 下来, 把 repo clone 下来, 发布一个 port, 写 prompt, 调 embedding 模型, 把书切成 chunk, 建一个 collection, 取 top K. Every choice passes three tests: what is said in a real lab section; the standard, searchable Chinese name (the Chinese RAG, LangChain, Chroma, Docker and Google Cloud literature: 检索增强生成, 分块, 向量, 向量数据库, 索引, 元数据, 余弦相似度, 最近邻, 幻觉, 微调, 重排序, 混合检索); and consistency with the series (L1 decided the shared words, L2-L4 the container, key and network words). (1) Artifacts verbatim: what the viewer types or matches on screen (commands, flags, chunk-type values, file and folder names, paths, image, container, collection and model names, environment variables, console labels and role names, terminal text and error names, the on-screen tags, README headings and the README''s Step 1 / Step 2, words quoted from the books) is copied letter for letter, never translated, inflected or quoted; the exceptions the checker forces are names with an underscore and the characters [ ] ( ) = < > +, written the way the narration says them (A6, B3). Nothing on screen is translated in this series: terminal output, code panels, README cards, the console drawing, the browser pictures, tags, trackers, lecture tags and the pause-and-ponder cards stay English; only the narration is. (2) Lab-speech English, a closed list: from L1 venv, root, repo, clone, commit, pin; from L2-L4 container, image, Dockerfile, base image, tag, pull, pipeline, prompt (an LLM prompt only), API, ID, port, localhost; new in L5 chunk (the noun: a piece of text), embedding (the noun: the model and its output), collection, top K, system prompt and input prompt, LLM, CLI, agent. (3) Everything else in standard Chinese: 检索增强生成, 检索, 生成, 增强, 分块, 切分, 切分器, 分块器, 向量, 向量化, 查询向量, 向量数据库, 记录, 元数据, 索引, 建索引, 维度, 批, 相似度, 余弦相似度, 余弦距离, 点积, 直线距离, 夹角, 长度, 方向, 最近邻, 分数, 排序, 排名, 结果, 距离阈值, 过滤, 元数据过滤, 文档过滤, 关键词过滤, 关键词排序, 上下文, 回答, 知识库, 语言模型, 模型, 权重, 微调, 重新训练, 幻觉, 窗口, 重叠, 分隔符, 段落, 百分位, 阈值, 语义分块, 查询改写, 混合检索, 倒数排名融合, 重排序, 检索器, 候选, 服务账号, 密钥, 角色, 项目 ID, 启用, 计费, 网络, 挂载, 服务, 心跳, 构建, 构建上下文, 提示符, 目录, 终端, 脚本, 参数, 函数, 变量. (4) The video''s metaphors by meaning, one word each: 方框 (box), 通道 (lane), 图书管理员 and 开卷考试 (librarian, open-book exam), 尺子 (ruler, char-split), 剪刀 (scissors, recursive-split), 地震仪 (seismograph, semantic-split), 接缝 (seam), 保险 (insurance), 替身 (stand-in), 锚点 (the slides'' anchor), 性格游戏 (the personality game), from L4 关卡 (gates), 电话簿 (phone book) and 门 (a published host port). (5) Written register for titles, meta.yaml and companion docs: 容器, 镜像, 仓库, 克隆, 提交, 端口, 提示词, 系统提示词, 文本块, 嵌入向量, 嵌入模型, 集合（collection）, 智能体（agent）. (6) The bilingual band puts the English sentence under every Chinese line, so the Chinese line carries no glosses and no brackets at all (the checker forbids them without say:). (7) The toolkit''s constraints are part of the policy: one Chinese sentence per English sentence (140 blocks, 358 sentences), a checker-clean display line (D3), an en_display wherever the SAY spells an artifact out as words (D4). Mainland Simplified Chinese; relaxed, clear lab-section speech, never slangy.'
rules:
- '[A1] Code-switching scope. English stays in three places only. (a) Artifacts, copied letter for letter: commands and subcommands (git clone, mkdir secrets, ls, cd llm-rag, cd ..., git diff, git status, git pull, sh docker-shell.sh, docker compose run --rm, docker compose down, docker compose build, docker compose version, docker ps, docker ps -a, docker inspect, docker images, exit, sudo, python cli.py), the flags of cli.py (--chunk, --embed, --load, --query, --chat, --get; --chunk_type by A6) and the chunk-type values (char-split, recursive-split, semantic-split), file and folder names and paths (cli.py, docker-shell.sh, docker-compose.yml, Dockerfile, .gitignore, .dockerignore, llm-service-account.json, outputs, docker-volumes, secrets, ~/AC215, /app, /secrets, /data, /.venv), names (llm-rag, llm-rag-cli, llm-service-account, latest, char-split-collection, recursive-split-collection, semantic-split-collection, gemini-embedding-001, gemini-3.1-flash-lite, your-project-id, the code names query, config, documents and $contains), environment variables (GCP_PROJECT by A6), console labels and role names (KEYS, JSON, Storage Admin, Gemini Enterprise Agent Platform User, Agent Platform, Vertex AI User), terminal text and error names (service disabled and permission denied by A6), the on-screen tags when the narration names them (your turn, extra; A11), README headings and the README overview''s Step 1 / Step 2 (A7), and the words quoted from the books and the lecture (accomplish, things, Chapter One, Italian, The Complete Book of Cheese, the Chester question; A10). (b) Products, organisations, the course and names: RAG, Self-RAG, Google, Google Cloud, Cloud Storage, Vertex AI, Vertex AI API, Gemini, Docker, Docker Hub, Docker Compose, Compose, Chroma, Chroma UI, SQLite, HNSW, Chrome, Git, Git Bash, WSL, Linux, Mac, Windows, Python, uv, pipenv, Project Gutenberg, JSON, AC215, MLOps Learning, Tolminc, Mara, Chester, student, app, root. (c) A closed list of words Chinese MLOps engineers say in English in a lab section: from L1 venv, root, repo, clone, commit, pin; from L2-L4 container, image, Dockerfile, base image, tag, pull, pipeline, prompt (an LLM prompt only), API, ID, port, localhost; new here chunk (A3), embedding (A3), collection (A3), top K (A3), system prompt and input prompt (A3), LLM, CLI (the CLI container, the CLI service), agent (A13). A word joins (c) only if lab speech really uses the English and the Chinese is stiff, ambiguous or collides with another term. Never English for flavour: no chunking, splitting, splitter, vector, vector database, record, metadata, index, dimension, batch, similarity, distance, score, rank, ranking, nearest neighbors, filter, keyword, context, retrieval, retriever, generation, response, knowledge base, hallucination, fine-tuning, weights, window, overlap, separator, threshold, percentile, query (A3), heartbeat, network, mount, service, service account, key, role, build, script, folder, terminal, flag, function.'
- '[A2] container and image (as L2-L4). The subtitles say container and image, as a TA does in the lab: 两个 container, CLI container, Chroma 的 container, 构建 image, Chroma 的 image, image 名; measure word 个. Titles, chapter names, meta.yaml and docs write 容器 and 镜像 (A4). Never 镜像 in a subtitle. base image stays (its Python base included → 包括它的 Python base image); tag stays (the image tag called latest → image 的 tag 叫 latest; a team should pin a tag → 团队应该 pin 一个固定的 tag); pull stays (Compose pulls Chroma''s image → Compose 先 pull Chroma 的 image; No pull, no build → 不 pull，也不构建; a git pull → git pull 一次). build → 构建, rebuild an image → 重新构建 (no rebuild → 不用重新构建), the build context → 构建上下文 (never just 上下文, which is the RAG context, A7).'
- '[A3] The RAG words (new in this lecture). chunk (the noun, a piece of text) stays: 一个 chunk, 24 个 chunk, chunk 文件, chunk 大小 (chunk size), chunk 数 (chunk count), chunk 边界 (chunk boundaries), chunk 0 → 第 0 个 chunk when it opens a sentence (A5); chunking (the process) → 分块, chunker → 分块器, chunk (the verb) → 分块 / 切成 chunk; splitting → 切分, splitter → 切分器, character splitting → 按字符切分, recursive splitting → 递归切分, semantic chunking → 语义分块 (semantic splitting → 语义切分); the chunk-type values stay as on screen (char-split, recursive-split, semantic-split). embedding (the noun) stays: embedding 模型, embedding 调用, 256 个 embedding 值, embedding 列; the files embeddings-*.jsonl → embeddings 文件; embed (the verb) → 向量化 (each window is embedded → 每个窗口都要向量化; embedded, stored, and paid for → 向量化、存储，还要付钱); vector → 向量, a list of numbers → 一串数字, query vector → 查询向量, dimension → 维度, a 256-number vector → 256 维的向量. vector database → 向量数据库, an ordinary database → 普通数据库, record → 记录, metadata → 元数据, collection stays (Chroma''s word: 一个 collection, 两个 collection), index → 索引, build an index → 建索引, the index folders → 索引目录, insert → 插入, a full rebuild of a collection → 完全重建, rebuild the index → 重建索引. query (noun and verb) → 查询 (a query returns K results → 一次查询返回 K 个结果; querying means → 查询就是), the question → 问题, top K stays (K stays a letter), nearest neighbors → 最近邻, score → 分数, sort → 排序, rank / ranking → 排名 / 排序, results → 结果, distance threshold → 距离阈值, similarity → 相似度, cosine similarity → 余弦相似度, cosine distance → 余弦距离, cosine (the measure) → 余弦, dot product → 点积, straight-line distance → 直线距离, angle → 夹角, length → 长度, direction → 方向, measure → 度量. filter → 过滤 (noun: 过滤条件 where a count needs it: 两个过滤条件), metadata filter → 元数据过滤, document filter → 文档过滤, the book filter → 按书过滤, keyword filter / keyword ranking → 关键词过滤 / 关键词排序. RAG and Self-RAG stay; retrieval augmented generation → 检索增强生成, retrieval / retrieve → 检索, retriever → 检索器, generation → 生成, augmentation → 增强, context → 上下文, knowledge base → 知识库, the full prompt → 完整的 prompt, the final prompt → 最终的 prompt, system prompt stays, the input prompt (the code''s INPUT_PROMPT) → input prompt, the model''s response → 模型的回答, language model → 语言模型, LLM stays, the model → 模型, weights → 权重, retrain → 重新训练, fine-tune → 微调, hallucination → 幻觉, stale training data → 训练数据过时, no specialized knowledge → 缺少专业知识, no sources → 没有出处, grounded answers → 有依据的回答, naive retrieval / naive RAG → 朴素检索 / 朴素 RAG, advanced → 进阶, lever → 手段, pre-retrieval / post-retrieval stage → 检索前 / 检索后阶段, query rewriting → 查询改写, hybrid search → 混合检索, reciprocal rank fusion → 倒数排名融合, re-ranking → 重排序, candidates → 候选. The README''s flags named as steps keep the flag word: the load step → load 这一步, your embed step → 你的 embed 那一步, the chunk step → chunk 这一步, in chat → 到了 chat 这一步, both loads → 两次 load, both chat commands → 两条 chat 命令, every load → 每次 load; the same actions as plain verbs are Chinese (chunk, embed and load again → 重新分块、向量化、加载; we built the index: chunk, embed, load → 我们建好了索引：分块、向量化、加载).'
- '[A4] Written vs spoken pairs. Subtitles say repo / clone / commit / container / image / base image / tag / pull / port / prompt / system prompt / chunk / embedding / collection / agent; titles, chapter names, meta.yaml and the companion docs write 仓库 / 克隆 / 提交 / 容器 / 镜像 / 基础镜像 / 标签 / 拉取 / 端口 / 提示词 / 系统提示词 / 文本块 / 嵌入向量 (嵌入模型) / 集合（collection） / 智能体（agent）, with the English in brackets at a core concept''s first use there (brackets are fine outside the narration). The repo as a subject is 这个 repo. Commands are unaffected (git clone, docker compose pull stay).'
- '[A5] Writing artifacts. Copied verbatim (case, dots, slashes, hyphens unchanged); never translated, inflected, quoted, put in 《》 or code formatting. Add a Chinese head noun where it helps: docker-shell.sh 这个脚本, docker-compose.yml 这个文件 / 这个 compose 文件, docker ps 这条命令, llm-rag 目录, secrets 目录, outputs 目录, docker-volumes 目录, --rm 参数, char-split 这个 chunk type, KEYS 标签页, Storage Admin 这个角色, query 函数, generate text embeddings 这个函数. Never start a sentence with an artifact or a lower-case kept-English word: put a Chinese word first (用 docker ps 这条命令……; 这个 repo 在 /app……; 第 0 个 chunk……; 而 load 这一步……; 所谓 embedding，就是……; 那 semantic-split 行吗？), which also keeps the subtitle from opening on a lower-case word. A product name, an upper-case acronym (RAG, LLM, CLI, HNSW, API) and README may open a sentence (RAG，也就是检索增强生成……; Compose 先 pull……; Chroma 先过滤……; CLI 按名字找到 Chroma……; README 把两条通道叫作 Step 1 和 Step 2……).'
- '[A6] Names with an underscore, as L3 and L4. The checker reads the display line as speech when there is no say:, and it rejects letter_letter (a voice would read 下划线). The SAY never speaks these names with their underscore either. So the Chinese line writes such a name the way the narration says it: the underscore becomes a space, lower case as in the SAY, always with a Chinese head noun or in a slot that makes it a name; or names it by its role where the English only points at it. Table: GCP_PROJECT → GCP project 这个变量 (set GCP project on line 7 → 把第 7 行的 GCP project 变量改成……); --chunk_type and its value → chunk type 用 char-split / 用 recursive-split 这个 chunk type (so python cli.py --chunk --chunk_type char-split is written 第 2 步：python cli.py --chunk，chunk type 用 char-split。); chunk_overlap → chunk overlap 参数; generate_text_embeddings → generate text embeddings 这个函数; SERVICE_DISABLED → service disabled (报 service disabled); PERMISSION_DENIED → permission denied (报 permission denied); INPUT_PROMPT → input prompt; SYSTEM_INSTRUCTION → system prompt (the SAY''s word); GOOGLE_APPLICATION_CREDENTIALS → 密钥的路径 (the SAY says the key''s path); n_results → 结果数. The English line gives the literal through en_display (D4). When the toolkit lets display lines keep underscores (I1), replace the spaced forms with the literals from this table.'
- '[A7] Disambiguation pairs. 第 k 步 (a README tracker step: Step 3: sh docker-shell.sh → 第 3 步：sh docker-shell.sh) vs Step 1 / Step 2 (the README overview''s two lane names, S02[3], kept English so they never look like a tracker step) vs 阶段 (the lecture''s phases: 索引阶段, 检索阶段, 检索前阶段). chunk (a piece) vs 分块 (the process) vs chunk 这一步 (the --chunk step) vs chunk type (the flag''s value, A6). 切分 (splitting) vs 分块 (chunking) vs 切 / 切开 (a single cut) vs 切点 (where a cut falls). 索引 (the index; also 建索引, the lecture''s Indexing phase → 索引阶段) vs 目录 (any folder: 索引目录 = the index folders) vs 书的目录 (a book''s table of contents, S12[7]: never bare 目录). 向量 (vector) vs embedding (the model and its output as a concept) vs 向量化 (embed). 相似度 (higher is better) vs 距离 (smaller is closer) vs 分数 (the lecture''s scores). 查询 (query) vs 问题 (the user''s question) vs 提问 (ask). prompt (an LLM prompt) vs 提示符 (the shell prompt: the container''s prompt → container 的提示符) vs 提示 (a hint). 上下文 (the RAG context) vs 构建上下文 (Docker''s build context, S04[8]). 窗口 (a ruler window, a sentence window) vs 终端 (a second laptop terminal) vs 门 (a published host port, L4). 过滤 (filter) vs 忽略 (git ignores) vs 去掉 (strip). 关键词过滤 vs 关键词排序 (S12[6], S15[2]). 记录 (a record in a collection) vs 行 (a row of a chunk file, row 0 → 第 0 行) vs 录制 (our recording) vs 课程团队留下的 (the staff''s recorded vectors and run). 重新构建 (an image) vs 重建 (a collection or the index) vs 重新训练 (the model) vs 微调 (fine-tune) vs 重新启动 (restart the app). 加载 (load into the database) vs pull (an image) vs 下载 (a zip download) vs 读入 (reads 11 files). 模型 vs embedding 模型 vs LLM vs 语言模型, as the English says. 授课老师 (the instructor) vs 课程团队 (the staff) vs 课上 (the lecture) vs 课件 (the lecture slides). 服务 (a Compose service) vs 服务账号 (service account). 密钥 (the key file) vs 关键词 (keyword). 标签 (an on-screen tag: your turn 标签) vs tag (the image tag latest) vs 标签页 (the console''s KEYS tab). 结果 (results) vs 回答 (the response) vs 输出 (the staff''s outputs) vs outputs 目录. 通道 (lane) vs 网络 (the Docker network) vs pipeline (the lecture''s pipeline slide). 方框 (a box of the diagram) vs container. 锚点 (the slides'' anchor) vs 替身 (the stand-in query). 计费 / 付费 (billing, paying) vs 调用 (a call: 89 次调用).'
- '[A8] Register: a TA running a lab section. Short instructions, colloquial verbs (装, 跑, 删, 切, 改, 敲, 贴, 拼); address the viewer as 你 (one-to-one follow-along; never 您, 大家, 同学们); 我们 is us at recording time (我们录制时没有 Google 的密钥). Chinese word order; restructure freely inside a sentence. No translationese: no 让我们… (use 我们来… / 先…), no 这就是为什么… (use 所以…), few 被 passives, no chains of 一个…的. No internet slang. Carry the spoken rhythm by meaning: Here''s the question → 这个教程要问的问题是; Here''s RAG in five boxes → 用五个方框讲清 RAG; That''s RAG → 这就是 RAG; Two rules → 两条规则; Two traps, hit on purpose → 两个陷阱，我们故意踩一下; One last oddity → 最后一个怪现象; Then this, which looks like an error but isn''t → 然后是这个：看起来像报错，其实不是; Back another day → 改天回来; Now a search → 现在来搜索; Now generation → 接下来是生成; So where''s the system prompt? → 那 system prompt 在哪儿？; Remember the opening question? → 还记得开头那个问题吗？; Back to chunking → 回到分块; No. → 不行。 (S14) / 不会： (S08); The lecture goes further → 课上走得更远; Time to tear down → 该拆掉了; One last lesson → 最后一个教训; And the four questions? → 那四个问题呢？; a paid call → 一次要付费的调用.'
- '[A9] Precision. Translate hedges exactly: only 只, every 每个, all 全部, about 大约, up to 最多, at most 最多, by our estimate 按我们的估算, may / can 可能, never 从不 / 一直没, whenever 只要, however far 不管多远, relevant or not 不管相关不相关, very uneven 很不均匀. at the time of recording is always 录制时 and never dropped (Python 3.12.15, uv 0.13.1). Counts, sizes, distances, scores, line, step and row numbers match the screen exactly (C1). Errata are gentle and always followed by the fix, all with one phrase: a small slip → 一个小疏漏 (A small slip first: → 先说一个小疏漏：; a harmless slip → 一个无害的小疏漏; Two small slips. → 两个小疏漏。; a small slip, with a one-line fix → 一个小疏漏，改一行就能修好). Ponder questions (S06[3], S07[3], S08[12], S12[1], S14[4]) ask without answering, and the wording must not give the answer away: S06[3] must not say 24; S07[3] must not mention overlap or the library default; S08[12] must not say no or that cosine ignores length; S12[1] must not name the book or say the filter wins; S14[4] must not say semantic-split needs the API or a key. Money: you pay for the text you send → 按你发送的文本付费; that key spends your project''s money → 这个密钥花的是你项目的钱; cents by our estimate → 按我们的估算只要几美分; Check the current price list → 以现行的价目表为准; you paid only for what you sent → 你只为发送过的内容付了费. Vertex AI bills the text sent and returned: never say a bill is per call (89 次调用 counts calls, not money).'
- '[A10] Names. Products, companies and course names stay Latin (A1 b); 哈佛 only in titles and the description. Course: AC215; lecture n → 第 n 讲 (that''s lecture 8 → 那是第 8 讲的内容; lecture 4''s three gates → 第 4 讲的三道关卡); next lecture → 下节课; the lecture → 课上 (the lecture lists → 课上列出了; from lecture → 课上的); the lecture slides → 课件; a slide → 那一页课件 (the pipeline slide from lecture → 课上那页讲 pipeline 的课件; in these slides'' sense → 就是这几页课件说的那种索引); part 1 / part 2 → 第一部分 / 第二部分; this video → 这期视频. The instructor → 授课老师 (never a name); the instructor''s short story → 授课老师写的短篇故事; the staff → 课程团队 (L3); the staff''s recorded vectors → 课程团队留下的向量; the course''s project → 课程的项目; the course''s web tools → 课程的网页工具; the course folder → 课程目录 (~/AC215). Books are named by title only, never by author (The Complete Book of Cheese stays: it is the filter value on screen); Tolminc, Mara and Chester stay; Project Gutenberg stays, Gutenberg alone too. Text quoted from the books and the lecture stays as on screen: the cut words accomplish and things, Chapter One, the filter string Italian (包含 Italian 的 chunk; the word Italian → Italian 这个词), the RRF example question Chester went to the bank of the river in the morning (its point is the word bank, so it is not translated). The question the tutorial asks and the query-rewriting example are the narration''s own questions and are translated (how is Tolminc cheese made? → Tolminc 奶酪是怎么做的？; where do dolphins live → “海豚住在哪里”). The user names student, app and root, and the placeholder your-project-id stay; a container ID is never read out.'
- '[A11] The screen stays English. This series translates the narration only: terminal output and prompts, terminal titles, code panels (comments included), README cards and chips, the tracker (README › Run Container, step k of N), the lecture tag (Lecture 5 · slides A16–A19), the console drawing, the browser frames of the course''s web tools, the diagrams'' labels, tags (your turn, extra, illustration, our illustration, recorded · the staff''s vectors, real run · no key, lecture example, erratum, at the time of recording, your numbers will differ, concept · not in the tutorial''s code, preview · L06, your project pays) and the ponder cards are all English, and the scenes need no language changes. So when the narration names an on-screen tag, the subtitle names it as the screen shows it: 黄色的 your turn 标签 (L2-L4); the gray lecture tag → 灰色标签; extra commands → 额外的命令. Everything the narration says in its own words is translated: an extra check → 额外检查, the tracker → 进度条, code panels → 代码面板. Narration paraphrasing the README says README 里说……; README headings the narration names stay English (Prerequisites 一节); the next section → 下一节.'
- '[A12] Mainland Simplified Chinese only: 默认, 程序, 代码, 文件, 目录, 数据库, 服务器, 网络, 内存, 磁盘, 脚本, 视频, 用户名, 信息, 账号, 地址, 索引, 向量, 元数据, 默认值, 幻觉, 微调; never 預設, 程式, 程式碼, 檔案, 資料夾, 資料庫, 伺服器, 網路, 記憶體, 磁碟, 腳本, 影片, 使用者, 帳號, 索引值, 矢量 (for a vector).'
- '[A13] Series words (the ac215-video skill''s list) in this lecture. embedding and prompt join the spoken list here (A3); agent is spoken twice (S16[5] next lecture runs this command with an agent → 下节课会用一个 agent 来跑这条命令; S16[9] Next time: agents. → 下节课：agent。; written 智能体（agent）); pipeline once (the lecture''s pipeline slide, S02[2]); port only as port 8000 (L4: port 8000, 发布; 端口 in writing); container, image, Dockerfile, commit, pull and repo as L1-L4. Not spoken in this script: volume (it appears only inside the folder name docker-volumes, an artifact: docker-volumes 目录, never 卷 and never volume), PATH, endpoint (the heartbeat is 心跳, not an endpoint), LoRA (fine-tuning is 微调, lecture 8), CI, push.'
- '[B1] Spacing. One half-width space between Chinese and Latin letters, digits or artifacts (输入 exit, Python 3.12.15, 第 7 行, port 8000, 24 个 chunk, 0.8 以上, 112 MB, secrets 目录, container 里, top K 的, 5% 的). The checker reports a missing space on every displayed sentence. Spaces inside an artifact stay as they are (docker compose down); never add one inside an artifact. No space next to full-width punctuation (……cd 进 llm-rag。, 用户 app，). Never fake a no-break space with U+00A0 / U+202F.'
- '[B2] Punctuation. Full-width ，。、；：？！“”…… in Chinese text, also next to artifacts (输入 exit。). Lists use 、 (--chunk、--embed 和 --load). No brackets of any kind, neither （） nor () nor 《》 nor 【】 nor [] nor <>: the checker rejects them on a line with no say:, and the bilingual band needs no gloss. “” only for a quoted thought, word or translated question in Chinese (“海豚住在哪里”); artifacts, tag names, book titles, quoted book words and terminal text are never quoted. No 。？！ inside one Chinese sentence (one per English sentence): use ，；： instead (S01[0]: 这个教程要问语言模型一个问题：Tolminc 奶酪是怎么做的？ is one sentence). A full-width colon after 第 N 步 when a description follows, and after 陷阱一 / 陷阱二, 第一题 … 第五题. Questions keep ？.'
- '[B3] Symbols the checker rejects (= < > + → ← ^ ≤ ≥ × ÷ ≈, == != +=, a digit followed by !, brackets, letter_letter): never copied into the Chinese line; said in words or written another way. documents[0] → documents 的第 0 项; load() → load 这个词 (it prints the word load → 它打印的是 load 这个词); one minus the similarity → 1 减去相似度; one half divided by its rank → 二分之一除以它的排名; 8000:8000 never needed (port 8000); 3,072 → 3072 (C1). Allowed and kept as on screen: / in paths (/app, /secrets, /data, /.venv, ~/AC215), . in file names and versions, : in localhost:8000, - in flags and names (--rm, --chunk, docker ps -a, char-split), @ (@ 符号后面), $ in $contains, % in 5%.'
- '[C1] Numbers in display text. Arabic digits for everything that echoes the screen, the terminal, the code or the lecture''s numbers, without thousands separators, as the terminal prints them (8248, 14228, 1355, 7808, 3072; also the computed 7458): step numbers (第 1 步, 第 3 步), line numbers (第 7 行, 第 8 行, 第 185 和 186 行, 第 40 行, 第 372 行), row and chunk numbers (第 0 行, 第 0 个 chunk, 第 1 个 chunk), variants (第 4 种, 第 1 到 3 种), counts (11 本书, 11 个文件, 24 个 chunk, 35 个, 64 个, 10 个结果, 10 条记录, 25 个候选, 256 个数, 每批 100 个, 每批 500 条, 重试 5 次, 89 次和 148 次调用, 528 次, 22 个文件), scores and distances (0.57、0.77、0.43、0.93; 0.8; 0.369 到 0.402; 0 到 0.16; 0.28 到 0.31; 0.75、0.67、0.42), dimension 256, port 8000, versions, sizes, times, dates. The story beats of S01 follow the same rule (11 本书, 10 本来自 Project Gutenberg 的老书, 最相关的 10 页). Chinese numerals for small narrative counts and ordinals the screen does not show: 两条通道, 五个方框, 四个弱点, 四个问题, 三个阶段, 两条规则, 两个陷阱, 两个角色, 三个值, 两个挂载, 三个版本号, 两个 collection, 两条警告, 三个段落, 三个手段, 两个问号, 第一个窗口, 第一本书, 第二个候选人, 第一部分 / 第二部分, 第一题……第五题, 陷阱一 / 陷阱二. When the English uses a word for a number the screen shows as a digit, follow the screen; when the screen shows nothing, follow the English (both → 两条都 / 两个都; all four → 四个都; all three steps → 三步一起).'
- '[C2] Units, versions, percentages and dates. Sizes as on screen with a half-width space: 112 MB, 60 MB, 826 MB, 2.11 GB, 82 MB. Times: 81 秒, 5 秒, 10 到 20 分钟, 大约 2.5 分钟. Versions with their name: Python 3.12.15, uv 0.13.1, Docker 29.8.2, Compose 5.6.0; model IDs as in the code (gemini-embedding-001, gemini-3.1-flash-lite). the 95th percentile → 第 95 百分位; the biggest 5 percent → 最大的 5%; one half → 二分之一; 1 (a vector''s length) → 1. Dates: 2026 年 10 月 16 日 (October 16, 2026). Money: cents → 几美分, never a number of yuan or dollars.'
- '[D1] Sentence alignment (explainer/i18n.py). One entry per SAY line of script.md in narration/*.yaml (140 blocks); `en` byte-equal to the SAY line; `zh` has exactly one item per English sentence as split by explainer.voice.split_sentences (358 in this script). Restructure only inside a sentence; never merge or split. Short sentences keep their own item: Two rules. → 两条规则。; Two small slips. → 两个小疏漏。; Pause and edit. → 暂停一下，改好它。; It''s never sent. → 它从来没被发出去。; No weights moved. → 权重一个都没动。; None. → 一个都没有。; No. → 不行。; Can semantic split? → 那 semantic-split 行吗？; How many mention Tolminc? → 有多少提到 Tolminc？; That''s RAG. → 这就是 RAG。; Next time: agents. → 下节课：agent。. Run python -m explainer.i18n check videos/ac215-l05-rag --lang zh until it prints OK.'
- '[D2] No say:, no anchors. There is no Chinese voice: never write say: (the display line is the only text) and never write anchors: (they only place animation beats for a Chinese-voiced render). The subtitles are timed by the English audio; the toolkit pairs each Chinese sentence with its English sentence by position.'
- '[D3] A checker-clean display line. With no say:, every displayed sentence must pass explainer.i18n.spoken_problems: no brackets (B2), no maths symbols (B3), no letter_letter names (A6), no digit followed by !, no clause ending in 种 followed by ，。！？ (rephrase: 每种 chunk type 一个。 is fine, 有多少种。 is not: 一共几种？ → 一共有几个？), a half-width space between Hanzi and Latin or digits (B1), each sentence ending in 。！？ or …… (optionally followed by ” or 」), and every Latin word in this glossary (zh_subtitle, first_use or allowed_spoken_latin). The checker cuts words with the regex [A-Za-z][A-Za-z''.-]*: gemini-embedding-001 is gemini-embedding-, gemini-3.1-flash-lite is gemini- and flash-lite, /.venv is venv, .gitignore is gitignore, $contains is contains, AC215 is AC, localhost:8000 is localhost, docker ps -a is docker and ps. A Latin word it reports is either an English word to translate (the usual case) or a missing artifact: add the artifact to allowed_spoken_latin, cut the same way, and to the matching term. Plurals are not listed on purpose (chunks, IDs, collections, embeddings only as the file prefix): a reported plural is an English inflection to remove (A7 of L1: 10 条记录的 ID, 两个 collection).'
- '[D4] The English line (en_display). In the bilingual band the English line shows the SAY sentence, which spells artifacts out for the voice. Every such sentence gets an en_display item with the literal on-screen form, otherwise word for word the SAY sentence; null for the other sentences of the block. This script''s spoken forms → literals (review_spoken item 16): L-L-M rag → llm-rag; L-L-M rag CLI → llm-rag-cli; L-L-M service account → llm-service-account; L-L-M service account dot JSON → llm-service-account.json; the git ignore file → the .gitignore file; docker ignore file → .dockerignore file; GCP project → GCP_PROJECT; service disabled / Service disabled → SERVICE_DISABLED; Permission denied → PERMISSION_DENIED; dash dash r m → --rm; slash app / slash secrets / slash data / slash dot venv → /app / /secrets / /data / /.venv; the docker volumes folder → the docker-volumes/ folder; outputs (the folder) → outputs/; localhost port 8000 → localhost:8000; docker ps dash a → docker ps -a; chunk, embed and load … query and chat (S02[3]) → --chunk, --embed and --load … --query and --chat; python cli.py, dash dash chunk / embed / load / query / chat → python cli.py --chunk / --embed / --load / --query / --chat; chunk type char split / recursive split / semantic split → --chunk_type char-split / recursive-split / semantic-split (a bare char split / recursive split / semantic split naming the value → char-split / recursive-split / semantic-split); chunk overlap → chunk_overlap; Gemini embedding 001 → gemini-embedding-001; Gemini 3.1 Flash Lite → gemini-3.1-flash-lite; H-N-S-W → HNSW; an extra command called get / The get command → an extra command called --get / The --get command; the word load → load(); documents, item zero → documents[0]; contains (S12[6]) → $contains; generate text embeddings → generate_text_embeddings; the semantic split collection → the semantic-split-collection. Blocks (scan of the v2 script; block[sentences], 0-based; re-run the scan if the script changes): S02[3:0] S03[1:1, 2:1-2, 3:0, 4:2, 5:0, 6:0] S04[1:1, 3:0, 4:1, 5:0, 7:1, 8:2] S05[0:0,2, 1:1, 3:1, 6:1, 7:1] S06[5:0, 8:0] S07[2:0, 5:2] S08[3:0, 6:0, 8:2-3, 9:0] S09[3:1, 4:0, 6:0, 8:1, 9:0] S10[1:1, 3:1, 5:0] S11[5:0-1, 7:0, 8:0] S12[6:2, 7:0] S13[2:1, 6:0] S14[4:1, 5:2, 6:0, 7:2] S16[2:1]. Underscore names (A6) are restored to their literal in en_display only; the Chinese line keeps the spaced form. The English video''s own .srt is unaffected.'
- '[D5] Content parity. Each Chinese sentence translates its English sentence and nothing more: no added commands, flags, glosses, Chinese console names or explanations; 额外 only where the English marks an extra; no Chinese gloss of a kept-English term (the English line is right below); no answer added to a ponder question (A9).'
- '[D6] Fixed patterns. Pause and run it. → 暂停一下，自己跑一遍。 Pause and do both, in your course folder. → 暂停一下，在你的课程目录里把两件事都做了。 Pause and do it all now: account, roles, key, and API. → 现在就暂停，全部弄好：账号、角色、密钥和 API。 Pause and edit. → 暂停一下，改好它。 Pause, and get to this prompt. → 暂停一下，走到这个提示符。 Pause and try these checks; … → 暂停一下，试试这些检查；…… Pause and run both, with your key: … → 暂停一下，用你的密钥两条都跑一遍：…… Pause and run both loads. → 暂停一下，两次 load 都跑一遍。 Pause and restart. → 暂停一下，重新启动。 pause and run both → 暂停一下，两条都跑一遍 Pause: run both chat commands with your key, then try the tool. → 暂停一下：用你的密钥把两条 chat 命令都跑一遍，再试试这个工具。 Pause and try it, with your key. → 暂停一下，用你的密钥试试。 Pause and tear down now, so … → 现在就暂停，把它拆掉，这样…… When the yellow your-turn tag appears, pause and run the command → 看到黄色的 your turn 标签，就暂停，自己跑一遍命令; extra commands aren''t in the README → 额外的命令 README 里没有. An extra check: / Two extra checks: / An extra look / An extra line count / an extra command called --get / Afterwards, an extra: / extras → 额外检查一下：/ 两个额外检查：/ 额外看一眼 / 额外数一下行数 / 一条叫 --get 的额外命令 / 之后再加一个额外步骤：/ 额外检查. This one isn''t in the README / Leaving isn''t in the README. → README 里没有这一步 / 怎么离开，README 里没写。 Step N: / Step N is a link … → 第 N 步：/ 第 N 步是一个链接……; Steps 1 and 2: → 第 1 步和第 2 步：; Step 1 of the next section: → 下一节的第 1 步：. With your key, look for … → 有密钥的话，要找的是……; If yours fails, or keeps retrying, read the error. → 如果你那边失败了，或者一直在重试，就去读报错。 at the time of recording → 录制时. A small slip … → 一个小疏漏…… (A9). Five questions to test yourself. → 五道题，自测一下。 One: … Five: → 第一题：……第五题： The answers are in the exercises → 答案在练习里, every command is in the study guide, in the MLOps Learning repo → 每条命令都在学习指南里，就在 MLOps Learning 这个 repo 里. Next time: agents. → 下节课：agent。 In part 2, … / Part 2 asks it questions. → 第二部分，……/ 第二部分向它提问。'
- '[D7] Files. narration/g1.yaml = S01-S09 (part 1, build the index), narration/g2.yaml = S10-S16 (part 2, ask the index), the parts of video.yaml; each starts with a comment header (what it covers, the rules it applies: A6 spaced names, B3 written-out symbols, C1 digits without separators, D4 en_display, no say:/anchors) and keeps the script order. Strings in double quotes; YAML-escape a literal double quote or backslash.'
- '[D8] Length on the English timing. The Chinese is read while the English is heard, and the band switches where the English pieces switch (a Chinese piece that would read faster than 9 units a second gets at most 1 s more). Keep each Chinese sentence about as long to read as the English is to hear: as a rule of thumb at most about 2 units per English word (a CJK character 1, a Latin character 0.55), so cut filler connectives and repeated subjects, never content. Long artifacts count (llm-service-account.json is 13.2 units, Gemini Enterprise Agent Platform User 20.4, semantic-split-collection 14.3, The Complete Book of Cheese 14.9): do not repeat them where the English does not; after the first mention in a block, use a short reference (这个角色, 这本书, 这个 collection).'
- '[G1] Widths. Bilingual band: a Chinese line holds at most 30 units, the English line 96 characters; the Chinese-only sidecar (.zh.srt) holds 22 units a line, 2 lines a cue. Write clauses of at most about 24 units, separated by ，；：, so the splitter has clean places to cut; avoid a clause longer than 30 units with no punctuation (the role name Gemini Enterprise Agent Platform User alone is 20 units: give it its own clause).'
- '[G2] Cue endings: the toolkit drops a cue-final 。，、；： and keeps ？！…… and a closing ” (subtitles.strip_end). Do not end a sentence on an artifact plus a full stop if a Chinese word can close it (……放进 secrets 目录。 reads better than ……放进 secrets。, but both are valid).'
- '[G3] Commands are never broken. The splitter treats a space between two Latin words in a Chinese line as a good cut, so python cli.py --chunk can land on two lines, which a viewer cannot copy. Put a whole command at the end of a clause after a full-width colon (第 3 步：sh docker-shell.sh。; 第 2 步：python cli.py --chunk，chunk type 用 char-split。), at most one command per cue, with little Chinese around it. A command too long for one line or containing an underscore name is not written out in full: name it as the SAY does (the clone command → clone 命令; python cli.py --chunk --embed --load --chunk_type semantic-split → README 里的命令，用 semantic-split 把三步一起跑) and let the terminal and the English line show it. Check every cue with a command in the rendered .zh.srt.'
- '[H1] Titles (meta.yaml). Video, part and chapter titles in the written register (A4: 容器, 镜像, 仓库, 端口, 提示词, 文本块, 嵌入向量); questions keep their question mark; the English colon structure is kept (切书：一把尺子; 加载：……; 对话：……; 语义分块：……); commands, flags, chunk types, folder and file names stay as they are (meta.yaml is not checked; brackets and underscores are fine there). Core-concept chapters carry their English short name for search, as L1 and L3 (嵌入向量（embedding）, 提示词（prompt）). Introduction to RAG → RAG 入门; part 1 build the index → 建索引, part 2 ask the index → 查询索引; chunk, embed, load → 分块、向量化、加载; naive → 朴素.'
- '[H2] Description (Bilibili / YouTube): two or three sentences, written register, terms of this glossary: this is the AC215 lecture 5 follow-along of dlops-io/llm-rag; what the viewer does and learns (one script starts two containers, the CLI and ChromaDB; char-split and recursive-split chunking and the hidden overlap; embeddings as directions, cosine similarity vs Chroma''s cosine distance, one model for both lanes; collections, records and the HNSW index on the laptop''s disk; filters act before ranking; the system prompt that is never sent; semantic chunking and the lecture''s query rewriting, hybrid search and re-ranking); English narration with Chinese and bilingual subtitles, captures dated 2026-10-16, recorded without a Google key, so the embeddings are the staff''s committed vectors and the Google calls show the command, the real error and what to look for.'
- '[H3] Companions: i18n/zh/README.md (and exercises.md / digest.md if made) are translated with this glossary in the written register (仓库, 克隆, 提交, 容器, 镜像, 基础镜像, 端口, 提示词, 系统提示词, 文本块（chunk）, 嵌入向量（embedding）, 嵌入模型, 集合（collection）, 向量数据库, 元数据, 索引, 余弦相似度, 余弦距离, 最近邻, 检索增强生成（RAG）, 语义分块, 重叠（overlap）, 服务账号, 智能体（agent）); brackets and underscores are fine there (not checked). Headings and <summary>答案</summary> are translated. A term table at the end: English | the term used here | common variants (嵌入 / 向量化 / 嵌入向量, 文本块 / 切块 / 分片, 集合, 向量库, 召回 for retrieval in industry speech, 重排 / 精排 for re-ranking, 提示词 / 提示, 词元 for token).'
- '[H4] Code and commands stay byte-identical in the companions: code blocks, commands, file names and inline `code` are unchanged; only # comments and the prose around them are translated.'
- '[I1] (request, open since L3) explainer.i18n check applies its voice hygiene (_SPOKEN_BAD: brackets, maths symbols, letter_letter names) to the display line when a sentence has no say:. For a subtitles-only video (this series; video.yaml has no languages.zh.voice and the glossary says voice: none) those checks guard nothing and force A6 and B3 (here: GCP project 变量 for GCP_PROJECT, chunk type 用 char-split for --chunk_type char-split, documents 的第 0 项 for documents[0], load 这个词 for load()). Proposal: skip _SPOKEN_BAD for display-only sentences when the glossary''s voice is none (keep the Latin-word, spacing and sentence-end checks). Then A6 and B3 become: literals verbatim.'
- '[I2] (todo, from L1 I3) explainer/subtitles.py''s _cuts treats a space between Latin words in a Chinese line as a good cut, so commands can be split (G3). Proposal: in a Chinese line, treat a run of Latin tokens separated only by spaces as unbreakable unless it alone exceeds a line.'
