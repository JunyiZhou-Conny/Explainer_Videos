# Two or three sentences (rule H2), written register. Facts: README sections of dlops-io/llm-rag (branch main,
# commit e17a39f) as in video.yaml; 11 books (ten from Project Gutenberg and the instructor's short story, never
# named by its author); two containers started by sh docker-shell.sh (llm-rag-cli and chromadb/chroma);
# char-split 350/20 (8248 chunks) and recursive-split 350 with the library's hidden overlap of up to 200
# (14228 chunks); gemini-embedding-001 asked for 256 numbers, cosine distance in Chroma, an HNSW index in
# docker-volumes/; Chroma applies the where filter before ranking; SYSTEM_INSTRUCTION is defined but never sent;
# semantic-split needs the API at --chunk; S15 is the lecture's query rewriting, hybrid search (RRF) and
# re-ranking, ideas only. Captures dated 2026-10-16 (ASSETS.md), recorded without a Google key: the vectors
# loaded are the staff's committed embeddings (68e0bde), and the Google calls show the command, the real
# no-key error and what to look for. Paste the chapter timestamps from output/chapters.txt and the study
# guide, tutorial repo and Ed links (video.yaml course:) under it when uploading.
description: |
  AC215（哈佛 MLOps & LLMOps）第 5 讲“RAG 入门”的跟练视频：照着 dlops-io/llm-rag 的 README，用一个脚本启动两个容器（命令行容器和 ChromaDB 向量数据库），把 11 本讲奶酪的书分块、向量化并加载进 Chroma，再用同一个嵌入模型把问题变成查询向量，取回最近邻，拼进提示词交给 Gemini 回答。你会弄清检索增强生成（RAG）的两条通道，按字符切分和递归切分（以及默认藏着的重叠），嵌入向量、余弦相似度和 Chroma 的余弦距离，集合（collection）、记录和存在你磁盘上的 HNSW 索引，为什么过滤先于排序，提示词里那个从没发出去的系统提示词，以及语义分块和课上讲的查询改写、混合检索与重排序。英文旁白，配中文和中英双语字幕；终端输出录于 2026-10-16，录制时没有 Google 密钥，所以加载的是课程团队提交过的向量，调用 Google 的步骤展示命令、缺少密钥时的真实报错和该看什么。
