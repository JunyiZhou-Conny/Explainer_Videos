    #   in S09-S12; removed again in 58dd602 but still in every clone's history);
    #   96d5fd7 = the Tolminc book before 85bba32 replaced it (the stale-index beat, S16);
    #   pipenv = last year's version, which still sent SYSTEM_INSTRUCTION (S13).
    - {repo: dlops-io/llm-rag, branch: main, commit: 68e0bdecba017b506c7646d710b1fbf1bc6b31fc,
       sections: ["llmrag/outputs/embeddings-*.jsonl"]}
