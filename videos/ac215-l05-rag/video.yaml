  - {file: scenes/s08_embed.py,      cls: Embeddings,        title: "Meaning as direction: embeddings"}
  - {file: scenes/s09_load.py,       cls: LoadChroma,        title: "Load: records, an index, a folder on your disk"}
  - {file: scenes/s10_persist.py,    cls: IndexSurvives,     title: "Exit, and the index survives"}
  - {file: scenes/s11_query.py,      cls: NearestNeighbours, title: "Asking the database: rank and cut"}
  - {file: scenes/s12_filters.py,    cls: FiltersFirst,      title: "Filters come first"}
  - {file: scenes/s13_chat.py,       cls: FinalPrompt,       title: "Chat: the prompt is the whole trick"}
