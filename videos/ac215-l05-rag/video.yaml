audience: "AC215 student who has done L1–L4 (VMs and uv, Dockerfiles and Docker Hub, a service-account key mounted from ../secrets, docker-shell.sh, container networks, ports and Compose); knows Python and basic ML and has used an LLM, but has never built a retrieval system or used a vector database; watching with their own clone of llm-rag open, pausing to run each command"
voice: {backend: kokoro, voice: af_heart, speed: 0.9}
# Chinese: subtitles only (i18n/zh/narration/*.yaml on the English timing), no Chinese voice;
# build with --burn for the copy with bilingual subtitles burned in (output/<id>.zh-en.mp4).
