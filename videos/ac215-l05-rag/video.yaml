id: ac215-l05-rag
title: "AC215 · Lecture 5 — Introduction to RAG (follow-along: llm-rag)"
papers: []                     # not a paper: a course tutorial walkthrough
course:
  name: "AC215 · MLOps & LLMOps (Harvard, Fall 2026)"
  lecture: 5
  lecture_title: "Introduction to RAG"
  ed: https://edstem.org/us/courses/97373/lessons/182195/
  repos:
    - {repo: dlops-io/llm-rag, branch: main, commit: e17a39f35bc07b440f573def480adaf4703f8b91,
       sections: ["What you'll build", "Prerequisites", "Setup GCP Service Account", "Run LLM RAG Container",
                  "Chunk Documents", "Generate Embeddings", "Load Embeddings into Vector Database",
                  "Query the Vector Database", "Chat with LLM",
                  "Advanced RAG: Semantic Chunking (Semantic Splitting)"]}
