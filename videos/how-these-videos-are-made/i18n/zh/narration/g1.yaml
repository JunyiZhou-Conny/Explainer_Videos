# Narration of S01-S04, zh-CN, sentence-aligned to script.md (one zh sentence per English sentence,
# as split by explainer.voice.split_sentences). Rules and terms: i18n/zh/GLOSSARY.md.
# First use: the bilingual subtitles of the English video (output/<id>.zh-en.srt / .ass, timing
# from the English voice). Later the Chinese-voiced version reads the same files; say: and anchors
# are added then (rule D2, after a timing pass with python -m explainer.script ... --lang zh).
# en_display: English subtitle line with digits instead of the spoken decimal (rule G3).

S01:
- en: "Here's what a paused frame looked like in an early draft of one of these videos, about tic-tac-toe, for kids around 12. Look at the line on the right: 4 times 3 times 2, and then 12."
  zh:
  - "在其中一期视频的早期草稿里，暂停下来的画面是这样的：那期讲井字棋，给 12 岁左右的孩子看。"
  - "看右边这一行：4 乘 3 乘 2，然后是 12。"

- en: "Pause for a moment. If you were 12, what would you think went wrong here?"
  zh:
  - "先暂停一下。"
  - "如果你 12 岁，你会觉得这里哪儿出错了？"

- en: "It looks like bad multiplication, but the math was right. The 12 was a running count on its way to 24, sitting on the formula's line. The layout lied. And the reviewer who caught it wasn't a child. It was an AI, pretending to be a 12-year-old."
  zh:
  - "看起来像是乘法算错了，但数学其实没错。"
  - "这个 12 是个还没数完的计数，要数到 24，却摆在了算式那一行上。"
  - "是排版在撒谎。"
  - "而发现问题的评审，并不是孩子。"
  - "它是一个 AI，假扮成 12 岁的孩子。"

- en: "Now the strange part. Almost everything in these videos was made by AI agents: the script, the animation code, and the checks. And none of them can hear the narration, or press play. So how do they know any of it works?"
  zh:
  - "奇怪的地方来了。"
  - "这些视频里几乎所有东西都是 AI 智能体做的：脚本、动画代码，还有各种检查。"
  - "可它们没有一个能听见旁白，也没法按下播放键。"
  - "那它们怎么知道这些行不行？"

- en: "This video covers the pipeline, who did what, how work gets checked without eyes or ears, the Chinese versions, what still needs a human, and what to improve next."
  zh:
  - "这期视频会讲：整条流水线，谁做了什么，没有眼睛和耳朵怎么检查，中文版，哪些事仍然需要人，以及下一步改进什么。"

S02:
- en: "It started with one person, the user: a researcher with more papers to read than time. The look comes from 3Blue1Brown, whose videos are animated in Manim, where every frame is drawn by code. The idea for this project came from a post by Andrej Karpathy, as quoted in the first request."
  zh:
  - "事情要从一个人说起，也就是这位用户：一位论文多到读不过来的研究者。"
  - "视频的风格学的是 3Blue1Brown：这个频道的视频用 Manim 做动画，每一帧都是用代码画出来的。"
  - "这个项目源于 Andrej Karpathy 的一条帖子，第一个请求里引用了它。"

- en: "The user's own words go further: our brain is a neural net, and training it takes hardship. AI is patient, they said, but they were doing a lot of cognitive offloading: letting the AI do the thinking for them."
  zh:
  - "用户自己的话说得更进一步：我们的大脑就是一个神经网络，训练它是要吃苦的。"
  - "用户说，AI 很有耐心，可自己却在做大量的“认知卸载”：让 AI 替自己思考。"

- en: "A video should be a mentor, showing how papers connect, because they're never isolated. And video is only a first step: the next is something interactive, where the learner has to make things."
  zh:
  - "视频应该像一位导师，讲清楚论文之间的联系，因为论文从来不是孤立的。"
  - "而视频只是第一步：下一步是能交互的东西，学习的人得亲手做出点什么。"

- en: "Then came four requests. A privacy paper from a friend, which the user hadn't read, to keep the test fair. A tic-tac-toe video, for a middle-school kid. Chinese versions of both. And this video."
  zh:
  - "接下来是四个请求。"
  - "一篇朋友发来的、讲隐私的论文，用户自己没读过，这样测试才公平。"
  - "一期井字棋视频，给一个初中生看。"
  - "这两期的中文版。"
  - "还有这期视频。"

S03:
- en: "The team: one human, the user. One AI agent: Claude Code. Under it, 183 sub-agents in 46 workflow runs, before this video. A workflow is a script the agent writes to launch sub-agents, each with one job. And tools, like a synthetic voice for each language and a speech recognizer."
  zh:
  - "团队：一个真人，就是用户。"
  - "一个 AI 智能体：Claude Code。"
  - "它手下有 183 个子智能体，来自 46 次工作流运行，都在这期视频之前。"
  - "所谓工作流，就是智能体写的一段程序，用来启动子智能体，每个只干一件事。"
  - "还有各种工具，比如每种语言各一个合成语音，以及一个语音识别模型。"

- en: "The user decided what was worth learning, and for whom. They uploaded 36 PDFs, gave the tic-tac-toe counts to explain, like 255,168 games, and supplied the program that video teaches. It already worked. The agent only changed a zero into the letter O, and rewrote the comments."
  zh:
  - "值得学什么、讲给谁听，是用户定的。"
  - "用户上传了 36 个 PDF，给出了井字棋那期要讲的那些数，比如 255,168 种对局，还提供了视频里讲解的那个程序。"
  - "程序本来就能用。"
  - "智能体只是把一个数字 0 改成了字母 O，又重写了注释。"

- en: "The agent did the rest. It wrote the toolkit that runs the pipeline, and made all but two of over a hundred commits, the project's saved versions. In under a week, work stopped at least six times on usage limits. Twice, it then sat idle for hours after the limit reset, until the user nudged it."
  zh:
  - "剩下的都是智能体做的。"
  - "它写了驱动整条流水线的工具包；一百多个 commit 里，除了两个，全是它提交的，commit 就是项目存下的版本。"
  - "不到一周，工作因为用量上限至少停了六次。"
  - "其中有两次，额度恢复之后它又闲了好几个小时，直到用户催了一下。"

- en: "From request to final cut, the privacy video took about six hours, and tic-tac-toe just over three. The Chinese versions took far longer: 16 hours, and about two days. Drawing the final frames took under half an hour each. The rest went to translating, rounds of review and fixes, a subtitle tool reworked four times, and waiting. And the cost on screen is what the whole session had cost by October 7th, at the public pay-per-use price: all four requests, not one video."
  zh:
  - "从请求到成片，差分隐私那期用了大约六个小时，井字棋那期三个多小时。"
  - "中文版花的时间长得多：分别是 16 个小时和大约两天。"
  - "最终画面的渲染，每期都不到半小时。"
  - "其余的时间，都花在了翻译，一轮又一轮的评审和修改，返工了四次的字幕工具上，还有就是等待。"
  - "屏幕上的费用，是整个会话截至 10 月 7 日的花费，按公开的按量计费价格计算：涵盖全部四个请求，不是一期视频。"

S04:
- en: "The pipeline is a chain of files: a paper, a catalog entry, a digest with page numbers, a script, animation code, and the video. Every step leaves a file behind, so you can stop, review, and resume."
  zh:
  - "这条流水线是一串文件：论文、目录条目、带页码的论文笔记，再到脚本、动画代码和视频。"
  - "每一步都留下一个文件，所以随时可以停下、检查，再接着做。"

- en: "Each file gets checked. Agents cataloging the papers read them, not just their names, and found that 4 of the 36 PDFs were the wrong papers. And the privacy digest even lists the paper's own mistakes."
  zh:
  - "每个文件都要检查。"
  - "给论文编目录的智能体不光看文件名，还读了内容，结果发现 36 个 PDF 里有 4 个其实是别的论文。"
  - "差分隐私论文的笔记里，甚至列出了论文本身的错误。"

- en: "In the script, each beat pairs a show line, the picture, with a say line: the exact words the voice will speak. The animation code reads those words straight from this file. It's written for the ear: nine factorial is spelled out in words."
  zh:
  - "在脚本里，每一小段都是一行画面说明，配一行台词：台词就是语音要一字不差念出来的话。"
  - "动画代码直接从这个文件里读取这些台词。"
  - "脚本是写给耳朵听的：九的阶乘要用文字写出来。"

- en: "So other agents review the script before any animation: a sentence takes seconds to fix, but a finished scene has to be drawn again. The agent wrote that rule into its own guide on day one. Minutes later, it started six sub-agents building scenes while the review was still running. Eleven minutes after that, one review came back with changes to the script, so all six were stopped. Writing the rule down was not enough: the workflow itself has to wait for the review."
  zh:
  - "所以在做任何动画之前，先让别的智能体评审脚本：改一句话只要几秒钟，场景做完了再改，就得整个重画。"
  - "第一天，智能体就把这条规则写进了自己的工作指南。"
  - "几分钟后，评审还在进行，它就启动了六个子智能体去做场景。"
  - "11 分钟后，一份要求改脚本的评审意见回来了，于是六个全被叫停。"
  - "光把规则写下来还不够：工作流本身必须等评审结束。"
