# Bilibili metadata for the release (tools/release_episode.py → PUBLISH.json → the Mac publish worker)
publish:
  title_zh: "AC215 第21讲跟练 · 用 GitHub Actions 做 CI：一次 push，六台全新的机器"
  description_zh: |
    哈佛 AC215（MLOps & LLMOps，2026 秋）第 21 讲教程的逐步跟练，照着 dlops-io/cheese-app-ci-cd 的 README 第 5 部分（GitHub Actions Remote CI）一步一步做：
    上半场：为什么本地的 pre-commit 钩子不够（只在装了它的电脑上运行，--no-verify 还能跳过），pre-receive / post-receive 与 GitHub 上的对应做法，
    CI 循环和课件里的五段流水线，读懂 .github/workflows/ci.yml：触发条件、六个 job 组成的依赖图，然后 push 到你自己的仓库、在 Actions 页看结果。
    下半场：逐个打开每个 job 的日志——镜像只构建一次、以 artifact 传给每台全新的 runner，exit code 决定成败（Black 阻断、Flake8 只提示），
    unit / integration / system 三个测试 job，Test Summary 为什么在 lint 失败时仍然显示全部通过；用 pre-commit 修好格式让流水线变绿，
    亲手演示 --no-verify 被 CI 拦下，Slack 通知与仓库 secret，以及分支保护。
    每个 job 都在全新的独立机器上实时运行并录下真实输出；GitHub 网页部分为根据 workflow 文件绘制的示意图。本讲不需要云资源。
    英文旁白，中英双语字幕。

    教程仓库：https://github.com/dlops-io/cheese-app-ci-cd
    学习笔记（全部命令、真实输出和练习答案）：https://github.com/JunyiZhou-Conny/MLOps_Learning/blob/main/guides/L21-cicd-github-actions.md

    课程与教程内容来自 Harvard AC215 课程组（Pavlos Protopapas 等）；本视频是个人学习用的非官方讲解，引用课件只注明页码，不展示课件。
  tags_zh: [AC215, MLOps, CI/CD, GitHub Actions, Docker, pytest, pre-commit, 哈佛, 教程跟练]
  tid: 231
