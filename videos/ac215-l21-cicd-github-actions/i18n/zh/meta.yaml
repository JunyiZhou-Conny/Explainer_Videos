# Two or three sentences (rule H2), written register, consistent with video.yaml's publish.description_zh but without
# the course-credit line's names (A16). Facts: script.md v2 (S01-S16, two parts: S01-S07 / S08-S16); README of
# dlops-io/cheese-app-ci-cd @ b8458ff (main, the only branch, still the head on 2026-11-06), Part 5 step by step and the
# optional Part 6; every job of ci.yml ran live on a fresh stand-in machine with an empty Docker, cross-checked with act;
# the GitHub pages are drawings from the workflow file, tagged illustration; no cloud, no keys, the Slack secret is a
# placeholder; five pause-and-ponder cards and five test-yourself questions. Paste the chapter timestamps from
# output/chapters.txt under it when uploading.
description: |
  AC215（哈佛 MLOps & LLMOps）第 21 讲“CI/CD 与 GitHub Actions（二）”的跟练视频，对照课件逐页讲解，并照着 dlops-io/cheese-app-ci-cd 的 README 第 5 部分（GitHub Actions Remote CI）一步一步做：上半场先讲为什么本地的 pre-commit 钩子不是团队的保证、课上的 pre-receive / post-receive 远程钩子在 GitHub.com 上对应什么，再把 .github/workflows/ci.yml 读成“事件 → 工作流 → job → 步骤”，看懂触发条件和六个 job 的依赖图，然后推送到你自己的仓库，在 Actions 页看第一次运行变红。
  下半场逐个 job 打开日志：镜像只构建一次、作为 artifact 传给每台全新的 runner，退出码决定成败（Black 阻断、Flake8 只提示），unit / integration / system 三个测试 job，以及为什么 lint 失败时 Test Summary 仍说全部通过；再用 pre-commit 修好格式让流水线变绿，亲手用 --no-verify 绕过本地钩子、看 CI 把它拦下，配置 Slack 通知的仓库机密，并用分支保护（可选的第 6 部分）把报告变成门禁。
  英文旁白，配中文和中英双语字幕；每个 job 都在全新的独立机器上实时运行并录下真实输出，GitHub 网页部分是根据工作流文件绘制的示意图；本讲不需要云资源，也不需要任何密钥。
