# explainer/build.py for the subtitles' chapters and the zh descriptions): video title, part titles, chapter
# titles keyed by scene file stem (as video.yaml's scenes), and the Bilibili / YouTube description.
# Titles follow GLOSSARY.md rule H1: written register (仓库, 推送, 钩子, 流水线, 工作流, 机密, 门禁, 分支保护; A4; job, runner,
# artifact and webhook stay English in both registers), the English colon structure kept (本地难题：--no-verify;
# 分支保护：从报告到门禁), commands, tools and names as they are (GitHub Actions, --no-verify, Slack, Test Summary), questions
# keep their question mark (流水线什么时候醒来？), and S16 follows the series' 回顾 pattern. 跟练 = follow-along. The title
# is in substance video.yaml's publish.title_zh ("AC215 第21讲跟练 · 用 GitHub Actions 做 CI：一次 push，六台全新的机器"),
# in the series pattern of the other meta.yaml titles (AC215 · 第 n 讲：…（跟练：…）); the Bilibili upload uses publish.title_zh.
# SERIES RULE (A16): no title, chapter or description names the instructor.
