- '[A15] Git, branches and pull requests. branch → 分支 (L1, L4; main → main 分支 where a head noun helps, never opening a sentence; a feature branch → feature 分支; the branch tip → 分支最新的 commit; the branch filter → 分支过滤; a temporary merge of your branch into main → 把你的分支临时合并进 main); pull request → PR (A1 c: 开一个 PR, 打开 PR, 这个 PR 变红, 关闭它的 PR; written 拉取请求（PR）); fork → fork (L11); origin → origin (L11); set-url → git remote set-url origin verbatim; the remote → 远程; working tree / working copy → 工作区 (L09; clean → 干净的); staged copy → 暂存的那份 (L09 暂存); the commit message → commit 信息; the head of main → main 的最新 commit; pinned commit → pin 住的 commit (L4); undid a bug planted in class → 撤销了课上埋的一个 bug; branch protection → 分支保护; a rule for main → 一条针对 main 的规则; classic rule → classic 规则; rulesets → rulesets (GitHub''s current page label); required status checks → 必需的状态检查 (GitHub''s Chinese docs); the picker → 选择列表; the merge button stays locked → 合并按钮一直锁着.'
- '[A16] The lecture, the course and the slides. Course: AC215; lecture n → 第 n 讲 (lecture 9 → 第 9 讲; Lecture 21 → 第 21 讲; lecture 23 → 第 23 讲); the lecture → 课上 (the lecture''s chain → 课上的那条链; the lecture''s catch → 课上指出的问题; the lecture''s motivation → 课上的动机; the lecture''s command → 课上的那条命令; the lecture''s gate → 课上说的门禁); the slide → 课件 (Slide 21 draws it as a loop → 课件第 21 页把它画成一个循环; slide 31 → 课件第 31 页; in three slides → 用三页课件); four sections → 四节; slide by slide → 一页一页; step by step → 一步一步; class / in class → 课上 (the bug from class → 课上那个 bug; demo class 1 verbatim); Milestone 5 → Milestone 5 (L09 milestone); the exercises → 练习; the study guide → 学习指南. SERIES RULE: no subtitle, title, chapter or description names the instructor; the narration never does (it says 课上, 课件 and README).'
- '[A17] The series list (the ac215-video skill''s list) in this video: container and image (S02, S08-S10, S13); Dockerfile (S08); port (S10); pipeline (S01-S05, S11, S13); commit (S01, S02, S04, S06, S12, S13); push (throughout); CI (S02, S03, S13); repo (throughout). volume, venv, PATH, endpoint, embedding, prompt, agent and LoRA do not occur in this script.'
- '[B1] Spacing. One half-width space between Chinese and Latin letters, digits or artifacts (第 21 讲, 第 0 阶段, 120 列, 6 个 job, 11 个测试, 退出码 125, 大约 176 MB, 10 秒, port 9000, push 到 main, 在 runner 上, ci.yml 里, Python 3.11). The checker reports a missing space on every displayed sentence. Spaces inside an artifact stay as they are (Lint and Format Check, pre-commit run --all-files, nothing to commit, working tree clean), never added inside one. No space next to full-width punctuation (……ci.yml。, 退出码 3：). No U+00A0 / U+202F.'
- '[B2] Punctuation. Full-width ，。、；：？！“”…… in Chinese text, also next to artifacts. Lists use 、 (Black、Flake8; unit、integration、system; 行尾空白、文件结尾、YAML、大文件、JSON、合并冲突标记和私钥). The paths the SAY reads with commas are written as paths (dot github, workflows → .github/workflows; dot git, hooks → .git/hooks; feature, test protection → feature/test-protection). No brackets of any kind: （）, (), 《》, 【】, [], <>; the checker rejects them in a line without say:, and the band needs no glosses. “” only for translated quotations (rare here; artifacts, labels and quoted log text never get quotation marks; the ASCII quotes inside a typed command stay). Inside one Chinese sentence (one English sentence) no 。？！: use ，；：. No ASCII ? or ! outside quoted log text.'
- '[B3] Symbols the checker rejects (= < > + → ← ^ ≤ ≥ × ÷ ≈, == != +=, a digit followed by !, brackets, letter_letter, ${{ }}): never in the Chinese line; written in words (A6). 2 times z → 2 乘 z; main -> main → main 到 main; enabled=true → enabled 为 true; *** → 三个星号. Kept from the screen and accepted: dots in file names and versions (ci.yml, utils.py, service.py, Python 3.11, GitHub.com), hyphens in names and flags (cheese-app-api, pre-commit, post-receive, continue-on-error, --no-verify, --all-files, ubuntu-latest), colons in YAML keys and addresses (runs-on: ubuntu-latest, localhost:9000), slashes in paths and branch names (.github/workflows, actions/checkout, feature/login).'
- '[C1] Numbers in display text. Arabic digits for everything that echoes the screen, the terminal, the logs, the README or the slides: counts (6 个 job, 11 个测试, 10 passed, 5 passed, 1 failed, 9 passed, 2 failed, 3 passed, 11 passed, 7 项卫生检查 or 七项 where the SAY counts things the screen does not number, 两个警告, 三次 push, 三遍), widths (120 列), ports (9000), exit codes (0, 1, 3, 125), sizes (176 MB), times (10 秒, 大约 2 分钟, 大约 6 分钟计费, 一天), the run numbers (run 1, run 2, run 3), stages (第 0 阶段, 第 1 阶段, 第 2 阶段), lectures (第 9 讲, 第 21 讲, 第 23 讲), slides (课件第 21 页, 第 31 页), README parts (Part 5, Part 6), Milestone 5, the distance demo (3 和 4, 1 和 2, 大约 7, 不是 5, 2 乘 z). Small counts the SAY says as words and the screen does not number may be Chinese numerals (两个, 三个, 四个 job 并排, 五台机器, 六台机器, 七项卫生检查, 四节). Ponder answers as in the English (None → 一个也没有; One → 一次).'
- '[C2] Units, versions and dates. 176 megabytes → 176 MB; about 2 minutes → 大约 2 分钟; about 6 billed minutes → 大约 6 分钟的计费时间; 10 seconds → 10 秒; one day → 一天. Python 3.11 is the only version the SAY says (S03[4], from the README); no other tool version is written in the Chinese line (versions sit on screen with the at the time of recording tag). No price, quota or money amount anywhere. Commit ids (b8458ff and the others), container ids, timestamps, client addresses and the 40-character github.sha never go into a subtitle (the SAY says the commit ID → commit ID). The Slack webhook address, any token or key is never written: Slack webhook URL is the secret''s name, not its value.'
- '[D1] Sentence alignment (explainer/i18n.py). One entry per SAY line of script.md in narration/*.yaml (140 blocks); `en` byte-equal to the SAY line; `zh` has exactly one item per English sentence as split by explainer.voice.split_sentences (371 in this script: 162 in S01-S07, 209 in S08-S16). Restructure only inside a sentence; never merge or split. Short sentences keep their own item: Quick test. → 小测验。; How many now? → 现在呢？; None. → 一个也没有。; Push it. → 把它 push 上去。 (never a lower-case opening, A5); Both are true. → 两句都是真的。; All tests passed. → All tests passed。; Open it. → 打开它。; Click it, … → 点开它，……'
- '[D2] No say:, no anchors. There is no Chinese voice: never write say: (the display line is the only text) and never write anchors: (they only place animation beats for a Chinese-voiced render). The subtitles are timed by the English audio; the toolkit pairs each Chinese sentence with its English sentence by position.'
- '[D3] A checker-clean display line. With no say:, every displayed sentence must pass explainer.i18n.spoken_problems: no brackets (B2), no maths symbols (B3), no letter_letter names (A6), no ! after a digit, no clause ending in 种 followed by ，。！？, a half-width space between Hanzi and Latin letters or digits (B1), each sentence ending in 。！？ or …… (optionally followed by ” or 」), and every Latin word listed in this glossary (zh_subtitle, first_use or allowed_spoken_latin). The checker cuts words with [A-Za-z][A-Za-z''.-]* and ignores one-letter words: ci.yml stays whole, .github/workflows is github and workflows, --no-verify is no-verify, Flake8 is Flake, AC215 is AC, localhost:9000 is localhost.'
- '[D4] The English line (en_display). In the bilingual band the English line shows the SAY sentence, which spells artifacts out for the voice. Every such sentence gets an en_display item with the literal on-screen form, otherwise word for word the SAY sentence; null for the other sentences of the block. Table (script.md "Notes for scene authors", Subtitle display for the i18n stage): git add dot → git add .; git commit, dash m, Add CI pipeline → git commit -m "Add CI pipeline"; git remote, dash v → git remote -v; pre-commit run, all files → pre-commit run --all-files; git commit, no verify, dash m, quick fix → git commit --no-verify -m "quick fix"; no verify (the flag) → --no-verify; git status, short → git status --short; docker load, dash i → docker load -i; curl, dash f → curl -f; network host → --network host; runs on, ubuntu latest → runs-on: ubuntu-latest; if always → if: always(); continue on error → continue-on-error; C I dot yaml → ci.yml; dot github, workflows → .github/workflows; dot git, hooks → .git/hooks; utils dot py / service dot py → utils.py / service.py; GitHub output → $GITHUB_OUTPUT; Slack webhook URL → SLACK_WEBHOOK_URL; localhost 9000 → localhost:9000; feature login → feature/login; feature, test protection → feature/test-protection; def broken, assert False → def broken(): assert False; test broken → test_broken; actions checkout → actions/checkout; cheese app API → cheese-app-api; cheese app API, colon, the commit ID → cheese-app-api:<commit ID>; GitHub dot com → GitHub.com; Settings, Branches → Settings → Branches; Settings, Secrets and variables, Actions → Settings → Secrets and variables → Actions; enabled, true or false → enabled=true / enabled=false; three stars → ***; the api folder → api/; files under src → src/; Detect private key → detect-private-key; Intentionally break tests → "Intentionally break tests". Only the artifact changes; the rest of the English sentence stays word for word.'
- '[D5] Content parity. Each Chinese sentence translates its English sentence only: no added commands, flags, glosses, Chinese screen names or explanations; kept-English words get no Chinese explanation (the English line is right below); ponder questions get no answers (A10). Head words A5 needs (这个, 命令, 目录, 文件, 分支, 这一步, 标签页, 页面) carry no content. An extra in the English is 额外 (marked extra → 标成 extra; These steps are extras → 这些步骤都是额外的).'
- '[D6] Fixed patterns (L9-L20''s, extended). The tracker names the README step, code panels name their file and lines, and a yellow tag, your turn, means pause and run it. → 进度条标出 README 的哪一步，代码面板标出文件和行号，黄色的 your turn 标签表示暂停一下，自己跑一遍。 Pause and run it. → 暂停一下，自己跑一遍。 Pause and set yours up. → 暂停一下，把你的设置好。 Pause and push yours. → 暂停一下，push 你自己的。 Pause and open yours. → 暂停一下，打开你自己的。 Pause and try it on yours. → 暂停一下，在你自己的 repo 上试一试。 you can just watch → 你只看就行; Quick test. → 小测验。 Your turn to predict. → 轮到你来预测。 Predict before the run. → 先预测，再看 run。 A question, before the colors come in. → 颜色出来之前，先问一个问题。 Test yourself, pausing on each. → 自测一下，每道题都暂停想一想。 One: … Five: → 第一题：……第五题：; Answers are in the exercises and the study guide. → 答案在练习和学习指南里。; A small slip → 有一个小疏漏; a small gap → 一个小缺口; A small note → 说明一点; A kind note → 提一句; One honest note → 如实说一句; An extra check / extra command / extra run → 一个额外检查 / 一条额外命令 / 一次额外运行; Two extra checks first → 先做两个额外检查; the bell, not the gate → 是铃，不是门禁; the suitcase → 行李箱; shunted aside → 被旁路到一边; the second witness → 第二个证人; one turn of the loop → 循环转一圈; the local conundrum → 本地难题; And here is the hook, … → 开头那个谜题，……'
- '[D7] Files. narration/g1.yaml = S01-S07 (part 1: red run and green summary, hooks stay on your laptop, the CI loop and the workflow file, when the pipeline wakes up, six jobs and one graph, push to a repo of your own, watch the run; 57 blocks, 162 sentences), narration/g2.yaml = S08-S16 (part 2: build once and every job starts empty, exit codes, three test jobs, the summary, red to green, --no-verify, webhooks secrets and Slack, branch protection, non-determinism and recap; 83 blocks, 209 sentences), matching video.yaml''s two parts; each file opens with a comment (coverage; the rules used: A6 the spoken forms of the rejected artifacts, A13 the verbatim log text, D4 en_display, A16 the instructor rule, no say: / anchors:), entries in script order. Double-quoted strings; literal double quotes (git commit -m "Add CI pipeline") and backslashes escaped for YAML.'
- '[D8] Length on the English timing. The Chinese is read while the English plays; the band switches where the English switches. Each Chinese sentence should be readable in the time its English sentence is heard: at most about 2 units per English word (a Hanzi counts 1, a Latin letter 0.55), so drop redundant connectives and repeated subjects, never content. Long artifacts cost length too (git commit --no-verify -m "quick fix" 21, Require a pull request before merging 21, pre-commit run --all-files 14.9, job Lint and Format Check failed 17, nothing to commit, working tree clean 19, Secrets and variables 11.5): do not repeat what the English does not; after the first time use the short head noun the English uses (lint 这个 job, 汇总, 检查那一步).'
- '[D9] Keep the English clause order (series lesson, ac215-video skill). The toolkit pairs Chinese and English clause by clause; a condition the English puts last but the Chinese puts first swaps meaning between two neighbouring cues. Keep conditions, purposes and time phrases where the English has them: … and exits with 1 if any result isn''t success → ……只要有一个结果不是 success，就以 1 退出 is WRONG (condition first) → ……并以 1 退出，只要有任何一个结果不是 success; non-determinism enters every stage when the code trains a model → 不确定性会进入每一个阶段，只要代码要训练模型; Add lint and format to needs and to the check if you want it counted → 把 lint and format 加进 needs 和检查里，如果你想让它算数的话; The steps below a failed step don''t run, unless they ask to run always → 失败步骤下面的步骤都不会运行，除非它们要求总是运行. Where the English opens with if, when, on, in, then or so, the Chinese opens the same way.'
- '[G1] Width. Bilingual band: a Chinese line at most 30 units, an English line 96 characters; .zh.srt cues 22 units a line, 2 lines. Keep clauses under about 24 units, separated by ，；：、 so the cutter has clean cuts; never a clause over 30 units without a mark. The long artifacts (D8) take a clause of their own; the job lists (S05[0]), the hygiene list (S13[8]), the Slack payload list (S14[2]) and the console path (S14[3]) get a mark between every item.'
- '[G2] Cue ends: the toolkit strips 。，、；： at the end of each cue and keeps ？！…… and a closing ” (subtitles.strip_end). Prefer ending a clause on a Chinese word rather than on artifact + 。 where the English allows (……在 .github/workflows 里。 reads better than ……workflows。); quoted log text (All tests passed, nothing to commit, working tree clean, permission denied, pull access denied, Everything up-to-date, 10 passed) may close a sentence as it does in the English.'
- '[G3] Names and commands are never split. The cutter treats a space between two Latin words in a Chinese line as a good cut, so git commit --no-verify -m "quick fix", pre-commit run --all-files, git remote set-url origin, git checkout -b feature/test-protection, Lint and Format Check, Build Docker Image, Test Summary, Run unit tests, Load Docker image, Check test results, New repository secret, Secrets and variables, Require status checks to pass, Require a pull request before merging, nothing to commit, working tree clean, pull access denied and Everything up-to-date could land on two lines. Put them at a clause end, after a full-width colon or 、, with little Chinese around them, at most one long label or command per cue; after the .zh.srt is rendered, check every cue with a command, a job or step name or a log phrase.'
- '[H1] Titles (meta.yaml). Video, part and chapter titles in the written register (A4: 仓库, 克隆, 提交, 推送, 容器, 镜像, 钩子, 流水线, 工作流, 机密, 分支保护, 门禁, 退出码); job, runner, artifact, webhook, CI, CD stay English; questions keep their question mark (流水线什么时候醒来？); the English colon structure is kept (本地难题：--no-verify; 分支保护：从报告到门禁); commands, tools and names as they are (GitHub Actions, --no-verify, Slack, Test Summary, cheese-app-ci-cd); meta.yaml is not read by the checker, so brackets are fine there. The video title uses the series pattern AC215 · 第 n 讲：…（跟练：…）, in substance the same as video.yaml''s publish.title_zh (用 GitHub Actions 做 CI：一次 push，六台全新的机器; push is the publish title''s own word and stays). S16 follows the series'' 回顾 pattern.'
- '[H2] Description (Bilibili / YouTube): two or three sentences, written register, this glossary''s terms: the follow-along of AC215 lecture 21 against the slides and README Part 5 step by step (local hooks vs remote hooks, the CI loop, reading ci.yml as event → workflow → job → step, triggers, the six-job graph, pushing to a repository of your own; the build-once image as an artifact, exit codes, Black blocking and Flake8 advisory, three test jobs, why Test Summary says all passed on a red run, the fix with pre-commit, --no-verify caught by CI, the Slack secret, branch protection, Part 6 optional); English narration with Chinese and bilingual subtitles; every job ran live on a fresh machine and the GitHub pages are drawings from the workflow file; no cloud. Never the instructor''s name (A16).'
- '[H3] Companions: i18n/zh/README.md (and exercises.md / digest.md if made) are translated with this glossary in the written register (A4: 仓库, 克隆, 提交, 推送, 容器, 镜像, 钩子（hook）, 流水线（pipeline）, 工作流, 事件, 触发条件, 步骤, 依赖, 并行, 条件执行, 退出码, 持续集成（CI）, 持续部署（CD）, 拉取请求（PR）, 机密（secret）, 分支保护, 必需的状态检查, 覆盖率, 暂存, 工作区); job, runner, artifact, webhook stay English; brackets and underscores are fine there (not checked). Headings and <summary>答案</summary> are translated. A closing term table: English | this video | other common renderings (job: job / 作业 / 任务; runner: runner / 运行器; artifact: artifact / 工件 / 构件 / 产物; workflow: 工作流; secret: secret / 机密 / 密钥; pull request: PR / 拉取请求 / 合并请求; branch protection: 分支保护 / 分支保护规则; status check: 状态检查; webhook: webhook / 网络钩子).'
- '[H4] Code and commands in companions stay byte for byte: code blocks, commands, file names, YAML keys and inline `code` are unchanged; only # comments and the prose around them are translated.'
- '[I1] (request, open since L3) explainer.i18n check applies the voice hygiene of the display line when a sentence has no say: (_SPOKEN_BAD: brackets, maths symbols, letter_letter names, the 种 rule). For a subtitles-only video (this series; video.yaml has no languages.zh.voice, this glossary says voice: none) these checks protect nothing and force A6 and B3 (here $GITHUB_OUTPUT, SLACK_WEBHOOK_URL, if: always(), test_broken, def broken(): assert False, cheese-app-api:${{ github.sha }}, enabled=true, main -> main, ***). Proposal: skip _SPOKEN_BAD for display-only sentences when the glossary says voice: none (keep the Latin-word, spacing and sentence-end checks).'
- '[I2] (open, from L1 I3) explainer/subtitles.py _cuts treats a space between Latin words in a Chinese line as a good cut, so job names, step names, log phrases and commands can be split (G3). Proposal: in a Chinese line, treat a run of Latin words joined only by spaces as unbreakable unless it alone exceeds a line.'
- '[I3] (note) explainer/subtitles.py reads every video''s glossary.yaml: 2-3 word English phrases of each term''s en are kept on one English line, and the 2-7 character Chinese headwords of zh_subtitle are registered in jieba, for all videos'' subtitles. So en and zh_subtitle list real terms only (no sentences); example sentences go to first_use and note.'
terms:
# --- S01 · Red run, green summary
- en: 'run / workflow run / the whole run / run 1 / run 2 / run 3 / the demo run / red / green'
  zh_subtitle: 'run / run 1 / run 2 / run 3 / 红 / 绿 / 变红 / 变绿 / 运行（书面）'
  first_use: 'S01[1]：五台机器是绿的，一台是红的，整个 run 就是红的。'
  note: 'A1 c, A3: a workflow run is run in lab speech (这个 run 红了); the numbered runs as the video labels them (run 1, run 2, run 3); the demo run → 演示 commit 那次 run; your first run → 你的第一个 run; turn red / green → 变红 / 变绿; any failed job turns the whole run red → 任何一个失败的 job 都会让整个 run 变红. Written 运行 (A4). Never opens a sentence (A5).'
- en: 'job / jobs / six jobs / lint job / check job / test job'
  zh_subtitle: 'job / 六个 job / 检查 job / 测试 job'
  first_use: 'S01[1]：而同一个文件从头跑到尾，结尾是这样的：job Lint and Format Check failed。'
  note: 'A1 c, A3: new lab-speech word, kept in both registers (A4). measure word 个; the lint job → lint 这个 job; every check job → 每个检查 job; the three test jobs → 三个测试 job; Each job starts on an empty machine → 每个 job 都从一台空机器开始. The quoted log line stays verbatim (A13).'
- en: 'log / one log says / success / All tests passed'
  zh_subtitle: '日志 / success / All tests passed'
  first_use: 'S01[0]：不久之后，有一份日志写着：unit tests，success。'
  note: 'A13: the job result words and the summary line are quoted from the screen, so verbatim (All tests passed。 as its own sentence). open its log → 打开它的日志; go through the log → 把日志看一遍.'
- en: 'pipeline / the pipeline says / the pipeline failed / CI Pipeline'
  zh_subtitle: 'pipeline / CI Pipeline / 流水线（书面）'
  first_use: 'S01[1]：这条 pipeline 说每个测试都通过了，而它自己失败了。'
  note: 'Series word (L3, L15); never opens a sentence (A5: 这条 pipeline……). CI Pipeline is the workflow''s name (verbatim). Written 流水线（pipeline）(A4).'
- en: 'machine / fresh machine / a brand-new machine / nobody owns / empty machine'
  zh_subtitle: '机器 / 全新的机器 / 空机器'
  first_use: 'S01[3]：今天它们搬到 GitHub 上，每次 push 到 main 都会运行，跑在不属于任何人的全新机器上。'
  note: 'A3. Five machines green, one red → 五台机器绿，一台红; which machine said no → 是哪台机器说了不; two of these six machines disagree → 这六台机器里有两台意见不一.'
- en: 'summary / the summary / Test Summary / hear / listens only to the tests'
  zh_subtitle: '汇总 / Test Summary / 听见 / 只听测试的'
  first_use: 'S01[2]：那么，是哪台机器说了不，汇总又为什么没听见？'
  note: 'A7: the summary → 汇总; the job name Test Summary when the SAY names it; the summary listens only to the tests → 汇总只听测试 job 的; This time the summary heard it → 这一次，汇总听见了.'
- en: 'Lecture 21 / four sections / remote Git hooks / GitHub webhooks / slide by slide / step by step'
  zh_subtitle: '第 21 讲 / 四节 / 远程 Git hook / GitHub webhook / 一页一页 / 一步一步'
  first_use: 'S01[4]：第 21 讲分四节：远程 Git hook、GitHub webhook、持续集成和持续部署。'
  note: 'A16, A9. We follow it slide by slide, and the README Part 5 step by step → 我们一页一页地跟着课件走，一步一步地做 README 的 Part 5.'
- en: 'continuous integration / CI / continuous deployment / CD'
  zh_subtitle: 'CI / CD / 持续集成 / 持续部署'
  first_use: 'S02[8]：这一步搬家，就是持续集成。'
  note: 'A9: spelled-out → 持续集成 / 持续部署; the letters when the SAY says CI / CD. leaves the tests to CI → 把测试留给 CI. Written 持续集成（CI）/ 持续部署（CD）.'
- en: 'follow along / fresh clone / Docker running / GitHub account / a repository of your own / no bill'
  zh_subtitle: '跟着做 / clone / GitHub 账号 / 你自己的 repo / 账单'
  first_use: 'S01[5]：不用云，也不用密钥；在公开 repo 上，也不会有账单。'
  note: 'L1, L18: repo, clone stay; To follow along, you need … → 要跟着做，你需要……; a repository of your own → 一个你自己的 repo; Docker running → 让 Docker 开着.'
- en: 'tracker / README step / code panels name their file and lines / yellow tag / your turn / pause and run it'
  zh_subtitle: '进度条 / 代码面板 / 行号 / your turn 标签'
  first_use: 'S01[6]：进度条标出 README 的哪一步，代码面板标出文件和行号，黄色的 your turn 标签表示暂停一下，自己跑一遍。'
  note: 'A11, D6, as L9-L20.'
- en: 'drawings / illustration / GitHub pages'
  zh_subtitle: '示意图 / illustration 标签 / GitHub 的页面'
  first_use: 'S01[6]：你会看到的 run，都是在这里的全新机器上真跑出来的；GitHub 的页面是示意图，上面也都标明了。'
  note: 'A11: the GitHub pages are drawings → GitHub 的页面是示意图; marked illustration → 标着 illustration; Every log line in them is real → 里面每一行日志都是真的. Never suggest a hosted run was captured (series rule).'
# --- S02 · Hooks stay on your laptop
- en: 'hook / Git hook / local Git hooks / pre-commit hook / pre-push hook / this repo''s set'
  zh_subtitle: 'hook / Git hook / 本地 Git hook / pre-commit hook / pre-push hook / 钩子（书面）'
  first_use: 'S02[0]：一个 pre-push hook 会在你的 commit 离开之前运行。'
  note: 'L09: hook stays, written 钩子（hook）. A pre-commit hook runs on your laptop, before the commit even exists → pre-commit hook 在你的笔记本上运行，那时 commit 还根本不存在 (never opening with the lower-case name: 一个 pre-commit hook……); this repo''s set → 这个 repo 的那一套. A7: not the hook of the video.'
- en: 'remote hooks / server-side hooks / pre-receive / update / post-receive / the server that receives the push'
  zh_subtitle: '远程 hook / 服务器端 / pre-receive / update / post-receive / 接收 push 的服务器'
  first_use: 'S02[3]：这时就轮到远程 hook 了：它们运行在接收 push 的服务器上。'
  note: 'A9, A1 a: the hook names verbatim. A pre-receive hook runs before the push is accepted, so it can refuse it → 一个 pre-receive hook 在 push 被接受之前运行，所以它可以拒绝这次 push; The update hook does the same, one branch at a time → update hook 也一样，只是一次一个分支; the post-receive bell → post-receive 这只铃 (A7).'
- en: 'refuse / say no / accepted / report / it can no longer say no'
  zh_subtitle: '拒绝 / 说不 / 接受 / 报告'
  first_use: 'S02[4]：它能报告，但已经没法说不了。'
  note: 'L09 说不. A post-receive hook runs after the code is in, for integration tests, notifications and clean-up → 一个 post-receive hook 在代码进来之后运行，用来跑集成测试、发通知和做清理.'
- en: 'chain / hygiene checks / seven hygiene checks / Black / Flake8 / 120 columns / files under src'
  zh_subtitle: '链 / 卫生检查 / Black / Flake8 / 120 列 / src 下的文件'
  first_use: 'S02[1]：这里是那条链，换成了这个 repo 的方框：七项卫生检查，然后是 Black，然后是 Flake8，都是 120 列，而且只查 src 下的文件。'
  note: 'L09 卫生检查; the hook chain is the picture V1 (链). Black and Flake8 capitalised as the SAY and ci.yml''s step names write them (L09 wrote the commands black / flake8; commands stay lower-case). The lecture''s chain ends with tests → 课上那条链最后是测试; This repo''s hooks run none: it leaves the tests to CI → 这个 repo 的 hook 一个测试都不跑：它把测试留给了 CI.'
- en: 'the lecture''s catch / pre-commit install / a teammate''s laptop / unchecked / depend on the laptop'
  zh_subtitle: '课上指出的问题 / pre-commit install / 队友的笔记本 / 没经过检查'
  first_use: 'S02[2]：课上指出的问题是：hook 只在有人跑过 pre-commit install 的机器上运行。'
  note: 'A teammate''s laptop without them sends its commit through unchecked → 队友的笔记本没装它们，commit 就没经过检查直接发出去了; So the checks depend on the laptop → 所以检查做不做，取决于是哪台笔记本.'
- en: 'One honest note / GitHub dot com / Actions / branch protection / two pieces'
  zh_subtitle: '如实说一句 / GitHub.com / Actions / 分支保护'
  first_use: 'S02[5]：如实说一句：GitHub.com 不会运行你自己写的 pre-receive 脚本。'
  note: 'A10 (series phrase), D4 (GitHub dot com → GitHub.com). It gives you two pieces instead: Actions, which runs after the push, and branch protection, which can say no → 它给你的是另外两样东西：Actions，在 push 之后运行；还有分支保护，它能说不.'
- en: 'webhook / webhooks / a chat / acts only inside Git'
  zh_subtitle: 'webhook / 聊天工具'
  first_use: 'S02[6]：要告诉聊天工具发生了什么，课上用的是 webhook。'
  note: 'A1 c, A14. And hooks act only inside Git → 而 hook 只在 Git 内部起作用.'
- en: 'motivation / shared repository'
  zh_subtitle: '动机 / 共享的 repo'
  first_use: 'S02[7]：然后你 push 了，到了共享的 repo 上，根本没有东西去跑它们。'
  note: 'A16: Now the lecture''s motivation, in three slides → 接下来是课上的动机，用了三页课件; the checks fire on every commit → 每次 commit 都会触发检查.'
- en: 'build a container / check the code / summarize the tests / same idea, new home'
  zh_subtitle: '构建 container / 检查代码 / 汇总测试'
  first_use: 'S02[8]：想法不变，只是换了个家：每台笔记本每次 push 到 main，都会跑。'
  note: 'So the checks move to the server → 所以检查搬到了服务器上. That move is continuous integration → 这一步搬家，就是持续集成.'
# --- S03 · The CI loop and the workflow file
- en: 'a series of scripts / integrate changes continuously / test automatically / enforce coding standards / static analysis'
  zh_subtitle: '一系列脚本 / 持续集成变更 / 自动测试 / 编码规范 / 静态分析'
  first_use: 'S03[0]：它们持续地集成变更，自动测试，强制执行编码规范，还做静态分析。'
  note: 'A9.'
- en: 'faster releases / better code / easier teamwork / a twist'
  zh_subtitle: '发布更快 / 代码更好 / 协作更容易 / 转折'
  first_use: 'S03[1]：机器学习会带来一个转折；我们最后再回来讲。'
  note: 'A9. In ordinary software → 在普通软件里.'
- en: 'loop / developers / codebase / built / tested / notifications / question mark'
  zh_subtitle: '循环 / 开发者 / 代码库 / 通知 / 问号'
  first_use: 'S03[2]：开发者把代码 commit 到代码库；代码库先构建，再测试；通知再流回开发者。'
  note: 'A9, A16: Slide 21 draws it as a loop → 课件第 21 页把它画成一个循环; For now, the way back is a question mark → 现在，回来的那条路还是个问号.'
- en: 'five stages / triggers / pass or fail'
  zh_subtitle: '五个阶段 / 触发 / 通过还是失败'
  first_use: 'S03[3]：课程的 pipeline 有五个阶段。'
  note: 'A commit triggers it, the container is built, Black and Flake8 check the code, the tests run, and a summary reports pass or fail → 一个 commit 触发它，构建 container，Black 和 Flake8 检查代码，跑测试，最后汇总报告通过还是失败.'
- en: 'README Part 5 / GitHub Actions / Remote CI / Python 3.11 / production'
  zh_subtitle: 'Part 5 / GitHub Actions / Remote CI / Python 3.11 / 生产环境'
  first_use: 'S03[4]：现在看 README 的 Part 5：GitHub Actions，Remote CI。'
  note: 'A7, C2: README parts as the tracker writes them. It says all CI tests run inside Docker containers using Python 3.11, the same as production → 它说所有 CI 测试都在用 Python 3.11 的 Docker container 里运行，和生产环境一样; This repo has no production yet → 这个 repo 还没有生产环境; take it as the same image you would deploy → 就把它理解成你要部署的那个 image.'
- en: 'workflow / workflow file / workflows folder / ci.yml / .github/workflows / root of the repository / subfolder'
  zh_subtitle: '工作流 / 工作流文件 / workflows 目录 / ci.yml / .github/workflows / 根目录 / 子目录'
  first_use: 'S03[5]：只有一个文件 ci.yml，在 repo 根目录的 .github/workflows 里。'
  note: 'A3 (GitHub''s Chinese docs, L07, L15), D4 (C I dot yaml, dot github, workflows). GitHub looks only there; a workflow in a subfolder never runs → GitHub 只看那里；放在子目录里的工作流永远不会运行.'
- en: 'extra / not in the README / list the workflows folder'
  zh_subtitle: 'extra / 额外'
  first_use: 'S03[5]：这一步 README 里没有，是额外的：列出 workflows 目录。'
  note: 'D5, D6, A11: an extra → 额外的; the GREY extra tag → extra 标签.'
- en: 'name / CI Pipeline / the key named on / events / jobs / runs-on: ubuntu-latest'
  zh_subtitle: 'name / on / 事件 / jobs / runs-on: ubuntu-latest'
  first_use: 'S03[6]：名叫 on 的那个键，列出了启动它的事件。'
  note: 'A1 a, A5, D4 (runs on, ubuntu latest → runs-on: ubuntu-latest). Open it → 打开它; The file gives the workflow a name, CI Pipeline → 文件给工作流起了个名字：CI Pipeline; Under jobs, each job gets its own machine → 在 jobs 下面，每个 job 都有自己的机器.'
- en: 'step / steps / run in order / shell script under run / reusable action under uses / actions/checkout'
  zh_subtitle: '步骤 / run / uses / action / actions/checkout'
  first_use: 'S03[7]：在一个 job 里，步骤按顺序运行。'
  note: 'A3, A7: step → 步骤; run and uses are the YAML keys (run 这个键 / uses 下面); a reusable action → 一个可复用的 action; actions checkout, which copies your repository onto the machine → actions/checkout，它把你的 repo 拷到这台机器上.'
- en: 'grammar / event, workflow, jobs, steps'
  zh_subtitle: '语法 / 事件、工作流、job、步骤'
  first_use: 'S03[7]：事件、工作流、job、步骤：这就是全部的语法。'
  note: 'A3: the four levels named the same way everywhere (S03, S16).'
# --- S04 · When does the pipeline wake up?
- en: 'wake up / trigger / triggers / push / pull request / main / develop'
  zh_subtitle: '醒来 / 触发条件 / push / PR / main 分支 / develop 分支'
  first_use: 'S04[0]：这条 pipeline 什么时候会醒来？'
  note: 'A3, A15: pull request → PR in subtitles (written 拉取请求（PR）). The slide says on every push or pull request → 课件说每次 push 或 PR 都会; The file is more precise: pushes to main or develop, and pull requests into main or develop → 文件写得更精确：push 到 main 或 develop，以及合并进 main 或 develop 的 PR; Push to main, and a runner wakes up → push 到 main，就有一台 runner 醒来 (an imperative opening with Push: 往 main 上 push……).'
- en: 'branch / feature branch / feature/login / branch filter / branch tip'
  zh_subtitle: '分支 / feature 分支 / feature/login / 分支过滤 / 分支最新的 commit'
  first_use: 'S04[3]：那三次 push，一个 run 也不会启动：因为有分支过滤。'
  note: 'A15, D4 (feature login → feature/login). Push to a feature branch, and nothing happens → 往 feature 分支上 push，什么也不会发生; on any other branch, the pipeline waits for your pull request → 在其他任何分支上，pipeline 都会等你的 PR; One when the pull request opens, and one more for every later push while it stays open → PR 打开时一次，之后它开着的时候，每 push 一次再加一次.'
- en: 'temporary merge / the commit ID / each merge is tested / what will land'
  zh_subtitle: '临时合并 / commit ID / 合并'
  first_use: 'S04[4]：GitHub 会把你的分支临时合并进 main，job 看到的 commit ID 指的就是这次合并。'
  note: 'A15, C2: the commit ID → commit ID (never SHA, never a hash). And it doesn''t test your branch tip → 而且它测的不是你分支最新的 commit; What will land is what gets tested → 将要合进去的，就是被测试的.'
- en: 'compute / private repositories / counts against your plan / public ones run free / branch filter / one build shared by every job / an image kept one day'
  zh_subtitle: '算力 / 私有 repo / 套餐额度 / 免费'
  first_use: 'S04[5]：在私有 repo 上，每个 run 都计入你的套餐额度；公开的免费。'
  note: 'A3, A9, C2 (no price). The lecture warns that integrating often costs compute → 课上提醒，频繁集成要花算力.'
- en: 'the bell, not the gate / accepted your push / undo the push / timing'
  zh_subtitle: '铃 / 门禁 / 撤销'
  first_use: 'S04[6]：它是铃，不是门禁：一个红的 run 撤销不了这次 push。'
  note: 'A7, D6: picture words; the run starts after GitHub has accepted your push → run 是在 GitHub 接受了你的 push 之后才开始的.'
- en: 'A small note / A small slip / a small gap / A kind note'
  zh_subtitle: '说明一点 / 有一个小疏漏 / 一个小缺口 / 提一句'
  first_use: 'S04[1]：说明一点：文件顶上的注释说只有 main，触发条件写的却是 main 和 develop。'
  note: 'A10, D6: one phrase each for the whole video.'
- en: 'Quick test / How many runs start / How many now / ponder'
  zh_subtitle: '小测验'
  first_use: 'S04[2]：小测验。'
  note: 'A10, D6: the question gives no hint (no zero, no filter). You push three commits to feature login → 你往 feature/login 上 push 了三个 commit; How many runs start? → 会启动几个 run？; How many now? → 现在呢？'
# --- S05 · Six jobs, one graph
- en: 'job ID / job name / Build Docker Image / Lint and Format Check / Unit Tests / Integration Tests / System Tests / Test Summary'
  zh_subtitle: 'ID / Build Docker Image / Lint and Format Check / Unit Tests / Integration Tests / System Tests / Test Summary'
  first_use: 'S05[1]：记住这些名字：GitHub 显示的是名字，不是 ID，而保护 main 的时候要用到它们。'
