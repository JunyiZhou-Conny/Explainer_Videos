# Chinese (zh-CN) glossary and translation rules for ac215-l21-cicd-github-actions (AC215 lecture 21, Automating
# Software Development: CI/CD with GitHub Actions II; the FULL follow-along of dlops-io/cheese-app-ci-cd @ b8458ff, main,
# the only branch and still the head on 2026-11-06, README "Part 5: GitHub Actions (Remote CI)" step by step and the
# optional "Part 6: Branch Protection", slide by slide against SLIDES.md), code-switching version, SUBTITLES ONLY.
# Audience: Chinese-speaking AC215 grad students who read technical English fluently; register of a Chinese MLOps TA
# running a lab section.
# Precedents and sources of the shared decisions: the series pilot videos/ac215-l01-vms-venvs/i18n/zh (repo, clone,
# commit, 分支, 录制时, your turn); the container lectures ac215-l02-containers-1 to ac215-l04-flexible-workflow-ports
# (container, image, tag, Dockerfile, port, localhost, 构建, 缓存, 无害, push, permission denied, 退出码); ac215-l03 (pipeline,
# 阶段); ac215-l07 / ac215-l15 (工作流); ac215-l09-ci-testing, the SAME repo's Parts 1-4 (hook, linter, lint, 门禁, 说不,
# 卫生检查, 私钥, 合并冲突标记, 暂存, 工作区, 覆盖率, 收集, 跳过, 测试客户端, 单元测试 / 集成测试 / 系统测试, 测试金字塔,
# 有一个小疏漏, pre-commit run --all-files, test 下划线 broken, def broken, Part 5, 持续集成); ac215-l11 (fork, origin, main 分支);
# ac215-l14 and ac215-l18 (the file layout this one follows: rules A-I, term tables per scene, D4 en_display, D9 clause
# order; 说明一点, 提一句, 如实说一句, 进度条, 额外, 示意图). Every form they fixed is kept.
# What is new here is the GitHub Actions vocabulary (workflow, event, trigger, job, step, runner, artifact, needs,
# if always, continue-on-error, secret, webhook, PR, branch protection, status check) and the lecture's server-side
# hooks (pre-receive, update, post-receive). Lab speech keeps job, runner, artifact, secret, webhook, PR, run and
# action in English (A1 c); 工作流, 步骤, 事件, 触发条件, 依赖, 并行, 分支保护, 状态检查 are the standard Chinese words of
# GitHub's own Chinese docs and of Chinese CI practice (A3).
# The script's metaphor list (script.md "Notes for scene authors", last item) is followed with one exception: "gate"
# stays 门禁 as in L09 (same repo, same picture; 关卡 is L04's three auth gates), so "the bell, not the gate" is
# 是铃，不是门禁. suitcase → 行李箱, shunt → 旁路 as proposed; "success tokens" → 三个 success (A13), not 结果令牌.
# There is NO Chinese voice in this series (docs/AC215_SERIES.md rule 8): the Chinese lines are subtitles on the
# English timing (the bilingual band of output/<id>.zh-en.mp4, <id>.zh.srt, <id>.zh-en.srt / .ass). So no say:,
# no anchors, no readings, no durations: only display rules. But `python -m explainer.i18n check` still applies
# its voice hygiene to the displayed line when a sentence has no say: (brackets, maths symbols, letter_letter
# names, Latin words not listed here, a missing half-width space): rules A6, B3 and D3 are how the Chinese line
# stays clean without say:. This lecture's underscored, bracketed or templated artifacts ($GITHUB_OUTPUT,
# SLACK_WEBHOOK_URL, if: always(), test_broken, def broken(): assert False, cheese-app-api:${{ github.sha }},
# enabled=true, main -> main) are written the way the narration says them; the English line shows the literal.
# SERIES RULE: the instructor's name never appears in a subtitle, a title or the description (A16); no real-looking
# webhook URL, token, key or id anywhere (the Slack secret is a placeholder: C2).
# Human-readable copy in Chinese: GLOSSARY.md (keep the two in sync; its term tables come from this file's data).
# terms[].zh_subtitle = the display form (Chinese subtitle line; titles use the written forms of A4);
# terms[].first_use = an example sentence for the translators, as SNN[k]：<one Chinese sentence for one English
# sentence of SAY block k of scene SNN, k from 0>; each one passes the checker; the narration files reuse them;
# terms[].note = usage (English → Chinese) and the rule tags.
# rules are tagged [A1]..[I3]: A terms, B typography, C numbers, D narration file, G subtitles, H titles and
# companions, I toolkit notes. (L1's E on-screen strings and F voice rules do not apply: nothing on screen is
# translated in this series, and there is no voice.)
# Read by: python -m explainer.i18n check (Latin words allowed in the Chinese line: every Latin word of
# zh_subtitle and first_use, plus allowed_spoken_latin, which lists the words as the checker's regex
# [A-Za-z][A-Za-z'.-]* cuts them: ci.yml stays whole, .github/workflows is github and workflows, --no-verify is
# no-verify, localhost:9000 is localhost, actions/checkout is actions and checkout, feature/test-protection is feature
# and test-protection, AC215 is AC, Flake8 is Flake) and explainer/subtitles.py, for EVERY video (2-3 word English
# phrases of `en` are kept on one English line; 2-7 character Chinese headwords of zh_subtitle are registered in
# jieba, so en and zh_subtitle hold terms, not example phrases).
video: ac215-l21-cicd-github-actions
lang: zh-CN (mainland Simplified Chinese)
audience: 'Chinese-speaking AC215 (MLOps & LLMOps) grad students who know Python and basic ML, read technical English fluently, did L1-L20 (Docker images and containers, -p HOST:CONTAINER, docker save and load, and above all L09: this same repo''s Parts 1-4, the FastAPI toy, black vs flake8 at 120 columns, the three pytest levels inside the image, the silent skip, pre-commit install with its seven hygiene hooks), saw Lecture 21 (remote Git hooks, webhooks, CI, CD), and are new to GitHub Actions: workflows, events and triggers, jobs and steps, runners, artifacts, the needs graph, if: always(), continue-on-error, repository secrets and branch protection; they follow along with a fresh clone of cheese-app-ci-cd, Docker running, a GitHub account and a repository of their own, pausing to run every step. No cloud and no keys; Actions minutes are free on public repositories. Register of a Chinese MLOps TA running a lab section.'
voice: none          # subtitles only (video.yaml: Chinese = i18n/zh/narration/*.yaml on the English timing)
policy: 'The Mandarin of a Chinese MLOps TA walking a lab section through the steps, code-switching only where such a speaker really does, written as subtitles under an English narration. The viewers already say 把 repo clone 下来, 构建 image, 起一个 container, 跑一下 pytest, 装个 hook, commit 被拦了, CI 挂了; this lecture adds push 到 main, 开一个 PR, 这个 job 红了, 整个 run 挂了, 换一台全新的 runner, 上传 artifact, docker load 一下, 加一个 secret, 配一个 webhook, 把 main 保护起来. Every choice passes three tests: what is said in a real lab section; the standard, searchable Chinese name (GitHub''s Chinese docs and Chinese CI practice: 工作流, 事件, 触发, 步骤, 依赖, 并行, 条件执行, 分支保护, 状态检查, 持续集成, 持续部署, 静态分析, 编码规范, 退出码; the Chinese Git literature: 分支, 合并, 暂存, 工作区); and consistency with the series (L1-L20 and above all L09, the same repo''s Parts 1-4: every form they fixed is kept). (1) Artifacts verbatim: what the viewer types or matches on screen (commands, flags, file and folder names, paths, image and branch names, job and step names from ci.yml, console labels, README headings, log and error text the narration quotes) is copied letter for letter, never translated, inflected or quoted; the exceptions the checker forces (an underscore, = < > + $ or brackets inside the artifact) are written the way the narration says them (A6) and the English line shows the literal (D4). Nothing on screen is translated in this series: terminal output, job-log panels, step lists, the run graph, code panels, README cards, the GitHub page drawings, tags, trackers, lecture tags, the pipeline strip and the pause-and-ponder cards stay English; only the narration is. (2) Lab-speech English, a closed list (A1 c): from the series repo, clone, commit, push, fork, origin, container, image, tag, Dockerfile, port, localhost, pipeline, hook, lint, linter, shell, root, bug, pin, ID, CI, API, JSON, YAML, URL; new here job, runner, artifact, action, run, secret, webhook, PR, CD. (3) Everything else in standard Chinese (A3, A7-A10, A13-A15). (4) The video''s pictures by meaning, one word each: 门禁 (a gate: a step reading an exit code, and the lecture''s gate that can refuse), 铃 (the bell: Actions reports after the push), 行李箱 (the image suitcase, V5), 旁路 (continue-on-error shunting a failure aside), 证人 (act, the second witness), 循环 (the CI loop, slide 21), 链 (the hook chain, V1), 开头那个谜题 (the hook of the video: red run, green summary; never hook). (5) Written register for titles, meta.yaml and companion docs: 仓库, 克隆, 提交, 推送, 容器, 镜像, 钩子（hook）, 流水线（pipeline）, 工作流, 持续集成（CI）, 持续部署（CD）, 拉取请求（PR）, 机密（secret）, 分支保护; job, runner and artifact stay English there too (video.yaml''s publish.description_zh does so). (6) The bilingual band puts the English sentence under every Chinese line, so the Chinese line carries no glosses and no brackets at all (the checker forbids them without say:). (7) The toolkit''s constraints are part of the policy: one Chinese sentence per English sentence (140 blocks, 371 sentences), a checker-clean display line (D3), an en_display wherever the SAY spells an artifact out as words (D4), the English clause order kept (D9). Mainland Simplified Chinese; relaxed, clear lab-section speech, never slangy.'
rules:
- '[A1] Code-switching scope. English stays in three places only. (a) Artifacts, copied letter for letter: commands as typed or named (git clone, git status, git add ., git commit -m "Add CI pipeline", git push, git remote -v, git remote set-url origin, git diff, git status --short, git restore, git checkout -b feature/test-protection, git push origin feature/test-protection, git commit --no-verify -m "quick fix", pip install pre-commit, pre-commit install, pre-commit run --all-files, docker save, docker load -i, docker images, docker ps, curl -f, act), flags (--no-verify, --all-files, --network host, -f, -i, -b, -v, -m), file and folder names (ci.yml, .github/workflows, .git/hooks, utils.py, service.py, Dockerfile, api, src, tests), branch names (main, develop, feature/login, feature/test-protection), the image name cheese-app-api, YAML keys as keys (on, jobs, runs-on: ubuntu-latest, steps, run, uses, needs, continue-on-error, name), actions (actions/checkout), job names (Build Docker Image, Lint and Format Check, Unit Tests, Integration Tests, System Tests, Test Summary) and step names from ci.yml (Load Docker image, Run unit tests, Run Black formatter check, Run Flake8 linter, Check test results, Send Slack notification …), the workflow name CI Pipeline, commit messages (demo class 1, Add CI pipeline, Format utils.py with Black, quick fix, Intentionally break tests), console labels (Actions, Settings, Branches, Secrets and variables, New repository secret, Require a pull request before merging, Require status checks to pass), README headings (Part 5, Part 6, GitHub Actions, Remote CI, Push to GitHub), log and error text the SAY quotes (job Lint and Format Check failed, All tests passed, nothing to commit, working tree clean, Everything up-to-date, permission denied, pull access denied, would reformat, 1 file would be reformatted, success, failure, skipped, 11 passed, 1 failed). (b) Names of products, tools and companies (GitHub, GitHub Actions, GitHub.com, Git, Docker, Docker Hub, Buildx, Slack, Jenkins, Python, FastAPI, pytest, Black, Flake8, pre-commit, act, Ubuntu, YAML, JSON, XML, HTML). (c) Lab-speech words, the closed list of the policy (2): repo, clone, commit, push, fork, origin, container, image, tag, Dockerfile, port, localhost, pipeline, hook, lint, linter, shell, root, bug, pin, ID, CI, CD, API, JSON, YAML, URL; new in L21 job, runner, artifact, action, run (a workflow run), secret, webhook, PR. Anything not in (a)-(c) is Chinese.'
- '[A2] container, image and the laptop, as L2-L20. The subtitles say container, image, port, tag (构建 image, 起一个 container, 发布 port 9000, 同一个 tag), measure word 个; titles, chapter names, meta.yaml and companion docs write 容器, 镜像, 端口 (A4). build → 构建 (the build job → build 这个 job; Build Container, the slide box → 课件的 Build Container); builds the image once → 只构建一次 image; rebuilds from scratch → 从头重建; tagged with the commit ID → 用 commit ID 打 tag; cheese app API, colon, the commit ID → cheese-app-api，冒号，再加 commit ID (A6); Docker save folds the image into one file → 用 docker save 把 image 打成一个文件; unpacked → 拆出来; the default builder → 默认的构建器; caching → 缓存; Buildx stays; laptop → 笔记本 (your laptop → 你的笔记本; a teammate''s laptop → 队友的笔记本); in the background → 在后台; publishes port 9000 on the runner → 把 port 9000 发布到 runner 上; mapped → 映射; network host → --network host (A1 a); shares the runner''s network → 共用 runner 的网络; stop and remove the container → 停掉并删除 container; the container''s user, app → container 的用户 app; as root → 以 root 身份.'
- '[A3] GitHub Actions words (new in this lecture). workflow → 工作流 (GitHub''s Chinese docs; L07 and L15 used it; the workflow file → 工作流文件; your workflow → 你的工作流; enable workflows → 启用工作流; disable the workflow → 停用工作流); event → 事件 (This push is the event → 这次 push 就是事件); trigger / triggers → 触发 / 触发条件; wake up (the pipeline, a runner) → 醒来; job → job (A1 c: 一个 job, 六个 job, lint 这个 job, 每个检查 job, 三个测试 job; the whole job fails → 整个 job 失败; L09''s one-off 整个任务 is superseded: here job is a GitHub object on screen in every scene); step → 步骤 (a step, the Black step → Black 这一步; the coverage step → 覆盖率那一步; the upload step → 上传那一步; the check step → 检查那一步; the Slack step → Slack 那一步); runner → runner (a GitHub-hosted machine: 一台 runner; a runner wakes up → 一台 runner 醒来); machine → 机器 (a fresh machine / a brand-new machine → 一台全新的机器; an empty machine → 一台空机器; the build machine → 构建用的机器; thrown away → 被扔掉); run (noun, a workflow run) → run (A1 c: 整个 run, 一个红的 run, run 1 / run 2 / run 3, the demo run → 演示 commit 那次 run; your run → 你的 run); run (verb) → 运行 / 跑; action → action (a reusable action → 一个可复用的 action; actions/checkout verbatim); artifact → artifact (A1 c; artifact sharing → artifact 共享; the artifact store → artifact 存储; kept one day / for one day → 保留一天; expires → 过期); needs → needs (the key; its needs line → 它的 needs 那一行; each needs line draws one arrow → 每一行 needs 画出一条箭头; dependencies → 依赖); in parallel → 并行; side by side → 并排; graph → 图 (the job graph → job 依赖图; the run graph → run 的图); stage → 阶段 (Stage 0 → 第 0 阶段); conditional execution → 条件执行; parallel execution → 并行执行; network modes → 网络模式; unique image tags → 唯一的 image tag; key concepts → 关键概念; log → 日志 (open its log → 打开它的日志; the job log → job 日志); the Actions tab → Actions 标签页; in progress → 进行中; checkmark → 对勾; red X → 红叉; skipped → 跳过 (the step list''s word skipped stays when quoted: A13); re-run → 重新运行; billed minutes → 计费分钟; rounded up → 向上取整; counts against your plan → 计入你的套餐额度; paid plan → 付费套餐; public / private repository → 公开 / 私有 repo.'
- '[A4] Written vs spoken pairs. Subtitles say repo / clone / commit / push / container / image / hook / pipeline / secret / PR; titles, chapter names, meta.yaml and the companion docs write 仓库 / 克隆 / 提交 / 推送 / 容器 / 镜像 / 钩子（hook）/ 流水线（pipeline）/ 机密（secret）/ 拉取请求（PR）, the core concepts with their English name in brackets the first time (brackets are allowed outside the subtitles). job, runner, artifact, webhook, CI, CD stay English in both registers (video.yaml''s publish.description_zh writes 六个 job, runner, artifact); 工作流, 步骤, 事件, 门禁, 分支保护, 状态检查, 持续集成, 持续部署, 退出码, 行李箱, 铃 are the same in both registers. follow-along → 跟练. Commands, code names, headings and log text are not affected.'
- '[A5] Writing artifacts. Copied verbatim (case, dots, slashes, hyphens, colons unchanged); never translated, inflected, quoted, put in 《》 or code formatting. Add a Chinese head noun where it helps: ci.yml 这个文件, workflows 目录, .github/workflows 里, .git/hooks 里, api 目录, src 下的文件, utils.py 文件, main 分支, develop 分支, feature/login 分支, Black 这一步, Flake8 这一步, Lint and Format Check 这个 job, Test Summary 这个 job, Load Docker image 这一步, Actions 标签页, Settings 页面, Slack webhook URL 这个 secret, on 这个键, needs 那一行. A sentence never opens with a lower-case artifact or kept-English word (pipeline, job, runner, artifact, webhook, secret, git, docker, pre-commit, pre-push, pre-receive, post-receive, curl, act, needs, on, main, ci.yml, utils.py, detect-private-key): put a Chinese word first (这条 pipeline……; 一个 pre-push hook……; 用 docker save……; 这个 detect-private-key……; 名叫 on 的那个键……). Git and Docker as the SAY capitalises them (Git add dot …, Docker save …) open a sentence as 用 git add . ……, 用 docker save ……'
- '[A6] Artifacts the checker rejects. With no say:, the checker reads the display line as speech and rejects letter_letter names, = < > + and brackets of any kind. So these are never copied into the Chinese line; they are written the way the narration says them, and the English line shows the literal through en_display (D4): $GITHUB_OUTPUT → GitHub output (写进 GitHub output); SLACK_WEBHOOK_URL → Slack webhook URL (一个叫 Slack webhook URL 的仓库 secret); if: always() → if always (标着 if always 的两个步骤; 在检查那一步加上 if always); cheese-app-api:${{ github.sha }} / cheese-app-api:<commit ID> → cheese-app-api，冒号，再加 commit ID; enabled=true / enabled=false → enabled 为 true 或 false; test_broken → test 下划线 broken (L09''s form); def broken(): assert False → def broken，assert False; main -> main → main 到 main; *** → 三个星号; Settings → Branches → Settings 里的 Branches; Settings → Secrets and variables → Actions → Settings，Secrets and variables，Actions (the series'' comma-separated console path); the README''s IDs lint-and-format, unit-tests … → README 里的 ID. Accepted as on screen: runs-on: ubuntu-latest, continue-on-error: false / true, git commit -m "Add CI pipeline", git commit --no-verify -m "quick fix" (ASCII quotes inside the command), localhost:9000, Python 3.11, .github/workflows.'
- '[A7] Words to keep apart. hook (a Git hook: pre-commit, pre-push, pre-receive, update, post-receive) → hook ≠ the hook of the video (the opening puzzle: And here is the hook, on your own push / And here is the hook, answered) → 开头那个谜题 (never hook there). gate → 门禁 (L09; a step that reads an exit code, and the lecture''s gate that refuses) ≠ bell → 铃 (a report after the push: It''s the bell, not the gate → 它是铃，不是门禁; the post-receive bell → post-receive 这只铃; ring this bell → 打这个铃) ≠ L04''s 关卡 (not used). the summary / Test Summary → 汇总 / Test Summary (the job name when the SAY names it) ≠ summarize the tests → 汇总测试 ≠ the PR. Part 5 / Part 6 (the README''s parts, as the tracker writes them) ≠ part 1 / part 2 of this video → 第一部分 / 第二部分 (before part 6 → 在做 Part 6 之前; In part 2 → 在第二部分). run (a workflow run) → run ≠ run (the YAML key under a step) → run 这个键 ≠ to run → 运行 / 跑. step → 步骤 ≠ Stage 0 / stages (act''s) → 第 0 阶段 / 阶段 ≠ the five stages of the course''s pipeline → 五个阶段 ≠ README step k → 第 k 步. merge → 合并 (a temporary merge → 一次临时合并; the merge button → 合并按钮) ≠ merge markers → 合并冲突标记 (L09). the lecture → 课上 ≠ the slide → 课件 ≠ the README → README. integration (CI) → 集成 ≠ Integration Tests (the job) ≠ integration tests → 集成测试. test → 测试 ≠ Test Summary ≠ test (the name prefix) → test 开头. token (S11 success tokens) → success (三个 success), not L09''s model token.'
- '[A8] Register: a TA running a lab section. Short instructions, colloquial verbs (跑, 推, 敲, 改, 删, 点, 开, 拦, 挂, 变红, 变绿, 收拾); address the viewer as 你 (one-to-one follow-along; never 您, 大家, 同学们); 我们 is us at recording time (我们在这里跑过这个文件的每个 job; 这条信息是我们写的). Chinese word order inside a clause; the English clause order is kept (D9). No translationese: not 让我们…… (say 我们来…… / 先……), not 这就是为什么…… (say 所以……), few 被, no strings of 一个……的. No internet slang. Carry the spoken rhythm by meaning: Time to push → 该 push 了; Quick test → 小测验; Look closely → 仔细看; Keep that gap in mind → 把这个缺口记在心里; So that''s the whole rule → 这就是全部规则; Both are true → 两句都是真的; nothing happens → 什么也不会发生.'
- '[A9] The lecture''s CI vocabulary (slides 13-34). continuous integration → 持续集成 (when the SAY spells it; CI when it says CI); continuous deployment → 持续部署 (CD when it says CD); a series of scripts that run automatically whenever the code changes → 一系列在代码变化时自动运行的脚本; integrate changes continuously → 持续地集成变更; test automatically → 自动测试; enforce coding standards → 强制执行编码规范; static analysis / static code analysis → 静态分析 / 静态代码分析; faster releases, better code, easier teamwork → 发布更快、代码更好、协作更容易; developers → 开发者; the codebase → 代码库; notifications → 通知; the loop → 循环 (slide 21; one turn of the loop → 循环转一圈; the loop goes around once more → 循环再转一圈); the shared repository → 共享的 repo; compute → 算力 (integrating often costs compute → 频繁集成要花算力); remote CI server → 远程 CI 服务器; server-side → 服务器端; the local conundrum → 本地难题 (slides 29-31; the slide title''s spelling is not mentioned); non-determinism → 不确定性; version everything → 一切都做版本管理; automate retraining and testing → 自动化重新训练和测试; monitor → 监控; roll out with care → 谨慎上线; automates the release → 把发布自动化; a twist → 一个转折.'
- '[A10] Precision. Translate hedges and quantifiers exactly: only 只, every 每个 / 每次, each 每个 / 各, all 全部 / 所有, none 一个也没有, about 大约, never 从不 / 永远不, still 还 / 仍然, already 已经, again 又 / 再, first 先, exactly 正好 / 完全, anyway 反正 / 照样, literally 字面上, too 也, separately 分别. at the time of recording → 录制时 (no tool version is spoken; the tags stay on screen). Counts, codes, sizes and times match the screen (C1). Keep 我们的 / 你的 (yours will differ). Errata and slide-vs-capture differences are said as gently and briefly as the English, one phrase each for the whole video, as L5 and L9-L20: A small slip → 有一个小疏漏 (S06 nothing to commit; S08 Buildx caching; S15 names, not IDs); a small gap / One more gap → 一个小缺口 / 还有一个缺口 (S10 the coverage reports; S13 the pinned Black); A small note → 说明一点 (S04 the comment says main only); A kind note → 提一句 (S07 the README''s all-green screenshot); One honest note → 如实说一句 (S02 GitHub.com and pre-receive). Never as correcting anyone. Ponder questions (S04[2], S07[4], S08[8], S11[6], S13[10]) ask only, without hints: S04[2] does not say zero or branch filter; S07[4] does not say yes or landed; S08[8] does not say pull access denied or 125; S11[6] does not say lint or All tests passed; S13[10] does not say none or local hook. The answers use the question''s own words (None → 三次 push 一次也没有 / 一个也没有; Yes, it''s on main → 在，它在 main 上).'
- '[A11] The screen stays English. This series translates the narration only: terminal output and prompts (student@laptop:~/cheese-app-ci-cd$), job-log panels (Job name › Step name) and their exit badges, the step lists, the run graph (V4) and its badges, act''s output, code panels (comments included), README cards and the RECORDED screenshot transcription, the GitHub page drawings (Actions tab, Settings › Secrets, Settings › Branches), the Slack card, the trackers (README › Part 5: GitHub Actions (Remote CI), step k of N, captions · extra and · Part 4 · L09), the pipeline strip (Commit → Build Container → Lint and Format → Test → Summary), the lecture tags (Lecture 21 · slides a–b), tags (your turn, extra, illustration, illustration · from our live runs, recorded · README screenshot, live · stand-in runner, erratum, at the time of recording, the GOLD cost tags) and the pause-and-ponder cards. When the SAY names one of them, the subtitle names it as the screen writes it: 黄色的 your turn 标签, 标着 illustration, extra 标签.'
