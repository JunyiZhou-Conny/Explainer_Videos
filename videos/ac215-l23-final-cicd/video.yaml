# Bilibili metadata for the release (tools/release_episode.py → PUBLISH.json → the Mac publish worker)
publish:
  title_zh: "AC215 第23讲跟练 · 最终部署与课程回顾：用 Ansible 把 Cheese App 部署到一台 EC2，再让一条 commit 自动重新部署"
  description_zh: |
    哈佛 AC215（MLOps & LLMOps，2026 秋）第 23 讲（Final Deployment and Review）的逐页、逐步跟练。课件讲的是 Google Cloud 版本，本视频跟着课程的 AWS 版教程 dlops-io/cheese-app-aws 做，并逐一对照两边的名词。
    上半场照着 README 从头到尾手动部署：IAM policy、user、access key 和 EC2 key pair，读懂 Ansible 的 inventory、play、task 和 module，
    启动部署工具容器时遇到的三个问题（Linux 上 sh 是 dash、Helm 源的证书、README 没提到的 SECRETS_DIR）以及修法，ansible>=9.0.0 其实是一个重定向，
    通过挂载的 Docker socket 在你自己电脑上构建镜像，用一个时间戳 tag 推到 ECR，创建并配置 EC2，五个容器和 nginx 这一扇前门。
    下半场：课件里的 CI/CD 循环、continuous delivery 与 continuous deployment 的区别，读懂 ci_cd_aws.yml——commit message 里的两道筛子、四个 repository secret、runner 做了什么，
    把一个 tag 从 runner 一路跟到服务器上重新创建的容器；README 的删除命令其实什么也删不掉，所以给出完整的手动收尾清单；最后把整门课的每一讲放回这台服务器上做回顾。
    本次录制没有 AWS 账号：笔记本上的步骤全部真实运行，README 里的每条 ansible-playbook 命令照原样执行到真实的第一个报错为止；控制台、服务器和 GitHub 页面为标注的示意图，从不伪造输出。
    本讲会让一台 EC2 服务器持续计费直到手动删除，视频用金色标签标出每个计费点（不写具体金额，请以官方价格页为准）。
    英文旁白，中英双语字幕。

    教程仓库：https://github.com/dlops-io/cheese-app-aws
    学习笔记（全部命令、真实输出和练习答案）：https://github.com/JunyiZhou-Conny/MLOps_Learning/blob/main/guides/L23-final-cicd-deployment.md

    课程与教程内容来自 Harvard AC215 课程组（Pavlos Protopapas 等）；本视频是个人学习用的非官方讲解，引用课件只注明页码，不展示课件。
  tags_zh: [AC215, MLOps, CI/CD, AWS, EC2, Ansible, GitHub Actions, Docker, 部署, 哈佛, 教程跟练]
  tid: 231
