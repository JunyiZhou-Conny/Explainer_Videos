id: ac215-l23-final-cicd
title: "AC215 · Lecture 23 — Final deployment and review: Ansible on one EC2 server, then a commit that redeploys (follow-along: cheese-app-aws)"
papers: []                     # not a paper: a course tutorial walkthrough
course:
  name: "AC215 · MLOps & LLMOps (Harvard, Fall 2026)"
  lecture: 23
  lecture_title: "Final Deployment and Review"
  ed: https://edstem.org/us/courses/97373/lessons/166048/
  repos:
    # Series decision (issue #125): L23 follows the AWS variant, as L15 did. main is the only branch;
    # still the head on 2026-11-08 (assets/terminal/laptop/01-x-ls-remote.txt). The README never
    # mentions the workflow; the video follows it after the README, every step marked extra.
    - {repo: dlops-io/cheese-app-aws, branch: main, commit: 5950118b0ed97c12c799920846d3eb70b1a47385,
       sections: ["API's to enable in AWS before you begin", "Setup AWS Keys for Authentication",
                  "Create AWS EC2 Key Pair", "Deployment Setup", "Deployment Steps",
                  "Create Empty ECR Repositories", "Build and Push Docker Containers to AWS ECR (Elastic Container Registry)",
                  "Create Compute Instance (VM) Server in GCP", "Provision Compute Instance in GCP",
                  "Setup Docker Containers in the  Compute Instance", "Configure Nginx file for Web Server",
                  "Setup Webserver on the Compute Instance", "Delete the Compute Instance / Persistent disk",
                  ".github/workflows/ci_cd_aws.yml (not in the README)"]}
    # context only: the Google Cloud version the lecture slides describe (slides 17-20); nothing is captured from it
    - {repo: dlops-io/cheese-app-v4, branch: main, commit: 033f18713b9e1e7985a3080e85edab3ff01cefef,
       sections: ["context only: Cheese App - Automation (the GCP CI/CD version of the slides)"]}
  guide: https://github.com/JunyiZhou-Conny/MLOps_Learning/blob/main/guides/L23-final-cicd-deployment.md
audience: "AC215 student who has done L1-L22 (Docker images and docker-shell.sh scripts with bind mounts, pipenv, the cheese app's frontend, API and Chroma vector DB, L15's IAM users, access keys and ECR on AWS, L20's deployment container, L21's GitHub Actions, L22's Kubernetes as the GCP path), new to Ansible (inventory, playbooks, plays, tasks, modules), EC2 instances, security groups and key pairs, and a workflow that deploys; watching with their clone of cheese-app-aws open, Docker running, their own AWS account with billing — this lecture runs an EC2 server until it is deleted by hand (GOLD tags without amounts + teardown checklist) — and a GitHub repository of their own for part 2"
voice: {backend: kokoro, voice: af_heart, speed: 0.9}
