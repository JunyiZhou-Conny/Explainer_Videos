  zh_subtitle: '第五 / /RUN-DEPLOY-APP / \run-deploy-app / 练习'
  first_use: 'S16[10]：第五：下面哪几个会触发部署？'
  note: 'A6, D4 (slash run deploy app in capitals → /RUN-DEPLOY-APP; backslash run deploy app → \run-deploy-app). Update readme, fix typo slash run tests, slash run deploy app in capitals, and backslash run deploy app. → update readme、fix typo /run-tests、大写的 /RUN-DEPLOY-APP，还有 \run-deploy-app。 And is this pipeline delivery or deployment? → 还有，这条 pipeline 是持续交付还是持续部署？ Answers are in the exercises. → 答案在练习里。'
