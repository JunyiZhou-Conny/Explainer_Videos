  first_use: 'S16[7]：第二：为什么 sh docker-shell.sh 在 Ubuntu 上失败，在 Mac 上却能用？'
  note: 'A12, D4. And what did that unquoted pip install actually do? → 那条没加引号的 pip install 到底做了什么？ Three: where do the tasks of a localhost play run, and of an appserver play? → 第三：localhost 的 play 里的 task 在哪里运行，appserver 的 play 呢？ And why can the toolbox fill the disk of your laptop? → 为什么工具箱容器能把你笔记本的磁盘填满？'
- en: 'four / follow one timestamp from the date command to a running container / how does the server choose between the variable and the file'
