  note: 'A8 (commands verbatim). Then plain docker build, docker tag and docker push for the frontend, and the same for the other two images. → 然后对前端就是普通的 docker build、docker tag 和 docker push，另外两个 image 也一样。'
- en: 'the toolbox only deploys / same toolbox, same socket / slash deployment / slash root slash dot SSH / no app folders'
  zh_subtitle: '/deployment / /root/.ssh / 应用目录'
  first_use: 'S13[7]：所以工具箱容器只负责部署。'
  note: 'D4 (slash deployment → /deployment; slash root slash dot S S H → /root/.ssh). Compared with your laptop: same toolbox, same socket. → 和你的笔记本相比：同一个工具箱容器，同一个 socket。 But the deployment folder sits at slash deployment, the keys at slash root slash dot SSH, and no app folders. → 但 deployment 目录在 /deployment，密钥在 /root/.ssh，也没有应用目录。'
- en: 'the SSH key / writes an SSH config / your key as AC215 underscore 2024 dot pem / with mode 600 / copies both into the deployment folder / on the runner only / never committed'
  zh_subtitle: 'SSH 密钥 / SSH 配置 / 权限 600'
  first_use: 'S13[8]：最后是 SSH 密钥。'
  note: 'A3, A10 (here the real SSH key → SSH 密钥). The step writes an SSH config, and your key as AC215 underscore 2024 dot pem, with mode 600. → 这一步写出一份 SSH 配置，把你的密钥写成 ac215_2024.pem，权限 600。 It copies both into the deployment folder, on the runner only, never committed. → 它把两个文件都拷进 deployment 目录，只在 runner 上，从不 commit。'
# ---------------------------------------------------------------- S14 Follow one tag to the server
- en: 'the deploy step / runs the toolbox on the runner / with the socket, two folders, and five environment variables / docker tag among them'
  zh_subtitle: '部署这一步 / 五个环境变量'
  first_use: 'S14[0]：部署这一步在 runner 上运行工具箱容器，带上 socket、两个目录和五个环境变量，其中就有 Docker tag 变量。'
  note: 'A9 (docker tag, the variable → Docker tag 变量; en_display DOCKER_TAG).'
- en: 'inside, one long command / fix permissions / log in to ECR / run deploy setup containers with the new tag / then deploy setup webserver / each link runs only if the one before succeeded'
  zh_subtitle: '一长串命令 / 权限 / 一环'
  first_use: 'S14[1]：每一环只有在前一环成功时才运行。'
  note: 'A5, D9. Inside, one long command: fix permissions, log in to ECR, run deploy setup containers with the new tag, then deploy setup webserver. → 里面是一长串命令：修好权限，登录 ECR，用新 tag 运行 deploy-setup-containers，再运行 deploy-setup-webserver。'
- en: 'run by hand, as an extra / prints the tag and lists the key / stops at the ECR login / our placeholder key / neither playbook runs'
  zh_subtitle: '手动跑 / 占位密钥'
  first_use: 'S14[2]：两个 playbook 都没有运行。'
  note: 'A3, A13. Run by hand, as an extra, it prints the tag and lists the key, then stops at the ECR login with our placeholder key. → 作为额外步骤手动跑一下，它打印出 tag，列出密钥，然后在 ECR 登录这一步，因为我们的占位密钥停了下来。'
- en: 'follow one tag / the date stamps it on the runner / it reaches Ansible as an extra variable / beats anything the playbook sets / the server pulls the three images at that tag'
  zh_subtitle: 'extra vars / 优先级 / 跟着'
  first_use: 'S14[3]：它作为 extra vars 进入 Ansible，优先级高于 playbook 里设的任何值，所以服务器会按这个 tag pull 那三个 image。'
  note: 'A5 (extra variable → extra vars, the feature''s name). Follow one tag. → 跟着一个 tag 走。 The date stamps it on the runner. → 日期在 runner 上给它盖上时间戳。'
- en: 'each container is recreated / the old one stops / the new one starts / a short gap between'
  zh_subtitle: '重新创建 / 空档'
  first_use: 'S14[4]：然后每个 container 都被重新创建：旧的停掉，新的启动，中间有一小段空档。'
  note: 'A6.'
- en: 'the slides deploy to a Kubernetes cluster / as in lecture 22 / a rolling update / starts new pods before the old ones go / one machine can only swap / it doesn''t roll'
  zh_subtitle: 'Kubernetes 集群 / 滚动更新 / Pod / 替换'
  first_use: 'S14[5]：一台机器只能直接替换；它滚动不起来。'
  note: 'A6 (L22: 集群, Pod; rolling update → 滚动更新). The slides deploy to a Kubernetes cluster, where, as in lecture 22, a rolling update starts new pods before the old ones go. → 课件部署到一个 Kubernetes 集群上，在那里，和第 22 讲一样，滚动更新会先启动新的 Pod，再让旧的离开。'
- en: 'commit four things / your server address on line 30 / CI deploys whatever is committed / step 9 undone / the Helm fix / the Chroma pin / git add dot / keep the repository private'
  zh_subtitle: 'git add . / Chroma 的 pin / 私有'
  first_use: 'S14[6]：执行 git add . 也会把你的账号 ID 和 NextAuth secret 一起提交上去，所以 repo 要保持私有。'
  note: 'A9, D4 (git add dot → git add .; Next auth secret → NEXTAUTH_SECRET). Commit four things. → 要 commit 四样东西。 Your server address on line 30: CI deploys whatever is committed. → 第 30 行填你服务器的地址：CI 部署的是 commit 进去的任何东西。 Step 9 undone: line 4 on, line 7 off. → 撤销第 9 步：打开第 4 行，关掉第 7 行。 The Helm fix. → Helm 的修复。 The Chroma pin. → Chroma 的 pin。'
- en: 'the slide''s three commands / with this repo''s keyword / git add dot / git commit with slash run deploy app in the message / git push / pause, and push'
  zh_subtitle: 'git commit / git push / 关键词'
  first_use: 'S14[7]：然后是课件上的三条命令，换上这个 repo 的关键词：git add .、git commit，信息里写上 /run-deploy-app，再 git push。'
  note: 'A16, D4 (git commit → git commit -m "…" only in en_display), D6. Pause, and push. → 暂停一下，push。'
- en: 'a green run / every step that ran exited with zero / not that the app works / reload your site / find the new tag in the server''s image column'
  zh_subtitle: '绿色的 run / 退出码 / 重新加载'
  first_use: 'S14[8]：一次绿色的 run，意思是每个跑过的步骤都以 0 退出，并不代表应用能用。'
  note: 'A6, A15. Reload your site, and find the new tag in the server''s image column. → 重新加载你的网站，再到服务器的 image 那一列里找新的 tag。'
- en: 'in the lecture''s words / is typing slash run deploy app continuous delivery, or continuous deployment / what would make it the other'
  zh_subtitle: '用课上的话说 / 持续交付 / 持续部署'
  first_use: 'S14[9]：用课上的话说：敲 /run-deploy-app，算持续交付，还是持续部署？'
  note: 'A12 (ponder: no hint; neither word is favoured). What would make it the other? → 怎样才能让它变成另一个？'
- en: 'delivery / a person decides each release by typing the keyword / nothing is tested first / deploy every merge to main / behind the tests from lecture 21 / Milestone 5'
  zh_subtitle: '持续交付 / 合并 / Milestone 5'
  first_use: 'S14[10]：持续交付。'
  note: 'A12 (the answer in the question''s words: Delivery. → 持续交付。), A16 (Milestone 5 stays, L21). A person decides each release by typing the keyword, and nothing is tested first. → 每次发布都由一个人敲关键词来决定，而且之前什么都没测试。 Deploy every merge to main, behind the tests from lecture 21, and it becomes continuous deployment. → 把每次合并到 main 都部署出去，前面挡着第 21 讲的测试，它就变成了持续部署。 That is Milestone 5. → 这就是 Milestone 5。'
# ---------------------------------------------------------------- S15 The delete that deletes nothing
- en: 'back to the README / its last step: delete / the same playbook with cluster state equals absent / the when lines / which of these three tasks run'
  zh_subtitle: '删除 / cluster state 设为 absent / when 行'
  first_use: 'S15[0]：它用 cluster state 设为 absent 来跑同一个 playbook。'
  note: 'A9, B3 (cluster_state=absent → cluster state 设为 absent; en_display cluster_state=absent; the when lines → when 行), A12 (ponder: no hint). Back to the README, for its last step: delete. → 回到 README，看它的最后一步：删除。 Look at the when lines. → 看看那些 when 行。 Which of these three tasks run? → 这三个 task 里，哪些会运行？'
- en: 'run it exactly as written / security group, skipping / EBS volume, skipping / the instance task has no when line / no attribute group ID / before any AWS call'
  zh_subtitle: 'skipping / EBS volume / no attribute group ID / 实例那个 task'
  first_use: 'S15[1]：然后实例那个 task 没有 when 行，结果失败了：no attribute group ID。'
  note: 'A1 c (volume), A9 (group_id → group ID), A15 (skipping as printed). Run it exactly as written. → 完全照写的来跑。 Security group, skipping. → 安全组，skipping。 EBS volume, skipping. → EBS volume，skipping。 That is before any AWS call. → 这发生在任何 AWS 调用之前。'
- en: 'the skipped task never set the security group / trips over it / the removal needs a volume ID / only a create run registers / no task terminates the instance / clean up by hand'
  zh_subtitle: '被跳过的 task / volume ID / 手动清理'
  first_use: 'S15[2]：所以要手动清理。'
  note: 'A4, A5. The skipped task never set the security group, so the instance task trips over it. → 被跳过的 task 从来没有设好安全组，所以实例那个 task 被它绊倒了。 Even past that, the removal needs a volume ID that only a create run registers, and no task terminates the instance. → 就算过了这一关，删除还需要一个只有创建时才会 register 的 volume ID，而且没有任何 task 去终止实例。'
- en: 'in the EC2 console / terminate the instance / delete the 50 gigabyte volume, which outlives it / the security group and your key pair / cost is one of the lecture''s challenges for CD / bills until you do this'
  zh_subtitle: '终止实例 / 50 GB 的 volume / 成本 / 挑战'
  first_use: 'S15[3]：在 EC2 控制台里，终止实例，然后删除那个 50 GB 的 volume，它会比实例活得久，再删掉安全组和你的密钥对。'
  note: 'A4, A16. Cost is one of the lecture''s challenges for CD, and this server bills until you do this. → 成本是课上说的 CD 的挑战之一，而这台服务器会一直计费，直到你做完这些。'
- en: 'in ECR, delete the three repositories / in IAM, deactivate and delete the access key / the user and the policy if you made them only for this / on GitHub, delete the four secrets'
  zh_subtitle: '停用 / 删除仓库 / 四个 secret'
  first_use: 'S15[4]：在 IAM 里，先停用再删除访问密钥，还有用户和策略，如果它们只是为这一讲建的。'
  note: 'A3 (deactivate → 停用, L15), D9 (the condition last, as the English). In ECR, delete the three repositories. → 在 ECR 里，删掉那三个仓库。 On GitHub, delete the four secrets. → 在 GitHub 上，删掉那四个 secret。'
- en: 'on your laptop / remove the toolbox image / two and a half gigabytes / keep or restore your edited files'
  zh_subtitle: '2.5 GB / 恢复'
  first_use: 'S15[5]：在你的笔记本上，删掉工具箱容器的 image，2.5 GB，你改过的文件可以留着，也可以恢复原样。'
  note: 'C2 (two and a half gigabytes → 2.5 GB).'
# ---------------------------------------------------------------- S16 The course on one server, and recap
- en: 'the lecture ends with a review of the course / on the server you deployed'
  zh_subtitle: '课程回顾'
  first_use: 'S16[0]：这一讲最后是整门课的回顾，就在你部署的这台服务器上。'
  note: 'A16.'
- en: 'virtual machines and containers / a shared bucket / the images the senior developer pushed by hand / the runner pushes them now'
  zh_subtitle: '虚拟机 / bucket / 资深开发者'
  first_use: 'S16[1]：还有那位资深开发者手动 push 的 image：现在由 runner 来 push。'
  note: 'A1 c (bucket), A2 (virtual machine → 虚拟机, L1), C1. Virtual machines and containers, lectures 1 and 2. → 虚拟机和 container，第 1 讲和第 2 讲。 A shared bucket, lecture 3. → 一个共享的 bucket，第 3 讲。'
- en: 'the solution architecture / execute / hold state / retrieval / agents / labeling and fine tuning / ready-made models through Bedrock / the cheese classifier trained earlier, as a file'
  zh_subtitle: '解决方案架构 / 检索 / agent / 标注 / 微调 / 现成的模型 / 分类器'
  first_use: 'S16[2]：解决方案架构：前端和 API 负责执行；ECR 和磁盘保存状态。'
  note: 'A1 c (agent, L6, L7), A16. Retrieval, lecture 5, is the loader and Chroma; agents, lectures 6 and 7. → 检索，第 5 讲，就是加载器和 Chroma；agent，第 6 讲和第 7 讲。 Labeling and fine tuning aren''t here: the API calls ready-made models through Bedrock, plus the cheese classifier trained earlier, as a file. → 标注和微调不在这里：API 通过 Bedrock 调用现成的模型，再加上之前训练好的奶酪分类器，以文件的形式。'
- en: 'training and pipelines / sit beside this server / the API and frontend containers / the CI loop / routing / today''s nginx'
  zh_subtitle: '训练 / pipeline / CI 循环 / 路由'
  first_use: 'S16[3]：训练和 pipeline，第 13 讲和第 15 讲，在这台服务器旁边。'
  note: 'A1 c, A16. The API and frontend containers, lecture 18. → API 和前端的 container，第 18 讲。 The CI loop, lectures 9 and 21. → CI 循环，第 9 讲和第 21 讲。 Routing, lectures 20 and 22: today''s nginx. → 路由，第 20 讲和第 22 讲：就是今天的 nginx。'
