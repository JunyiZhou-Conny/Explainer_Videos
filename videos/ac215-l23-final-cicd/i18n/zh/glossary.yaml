# Chinese (zh-CN) glossary and translation rules for ac215-l23-final-cicd (AC215 lecture 23, Final Deployment and
# Review; the FULL follow-along of dlops-io/cheese-app-aws @ 5950118 (main, the only branch, no tags, still the head on
# the recording day 2026-11-08), the whole README top to bottom ("API's to enable in AWS before you begin" to "Delete the
# Compute Instance / Persistent disk") and then .github/workflows/ci_cd_aws.yml, which the README never mentions, slide by
# slide against SLIDES.md; the slides speak Google Cloud (cheese-app-v4 @ 033f187 is their context only), the video follows
# the AWS variant by series decision, as L15 did), code-switching version, SUBTITLES ONLY.
# Audience: Chinese-speaking AC215 grad students who read technical English fluently; register of a Chinese MLOps TA
# running a lab section.
# Precedents and sources of the shared decisions: the series pilot videos/ac215-l01-vms-venvs/i18n/zh (repo, clone,
# commit, 分支, 录制时, your turn, 镜像 = container image only, 虚拟机); the container lectures ac215-l02 to ac215-l04
# (container, image, tag, Dockerfile, port, push, pull, registry, 构建, 挂载, Docker 网络, volume); ac215-l05-rag (Chroma,
# 向量数据库, collection); ac215-l09-ci-testing (编码规范, 静态分析); ac215-l10-cloud-connect (加载器, 替身, 令牌);
# ac215-l14-serverless-deployment (部署, 实例, 角色; the file layout: rules A-I, term tables per scene, D4 en_display, D9
# clause order); ac215-l15-vertex-ml-workflows, the series' AWS precedent (IAM 用户, 策略, 访问密钥, 账号 ID, 区域, ECR 仓库
# ≠ repo, 停用, 凭据, 身份检查, socket, push); ac215-l16-exam (安全组); ac215-l20-deployment-pulumi (playbook, provision,
# 工具箱, 一次性的加载器, 说明一点, 有一个小疏漏, 如实说一句-style honesty, the A9 checker rules); ac215-l21-cicd-github-actions
# (job, runner, action, run, secret, 工作流, 步骤, 持续集成, 持续部署, 发布, 循环, 代码库, 开发者, 通知, Milestone 5);
# ac215-l22-kubernetes-cloud (Kubernetes 集群, Pod, Ingress). Every form they fixed is kept where it agrees with this
# video's captures.
# What is new here is Ansible (play, task, inventory, hosts, recap, register, extra vars kept in English; module → 模块),
# EC2 (实例, 安全组, 密钥对, 系统映像 for the AMI, 公有 IP 地址, 终止, 附加, the EBS volume), the lecture's continuous
# delivery (持续交付) next to continuous deployment, and the script's picture words (script.md "Notes for scene authors":
# sieve → 筛子, badge → 徽章, toolbox → 工具箱容器, front door → 前门, release button → 发布按钮), all used every time.
# There is NO Chinese voice in this series (docs/AC215_SERIES.md rule 8): the Chinese lines are subtitles on the
# English timing (the bilingual band of output/<id>.zh-en.mp4, <id>.zh.srt, <id>.zh-en.srt / .ass). So no say:,
# no anchors, no readings, no durations: only display rules. But `python -m explainer.i18n check` still applies
# its voice hygiene to the displayed line when a sentence has no say: (brackets, maths symbols, letter_letter
# names, Latin words not listed here, a missing half-width space): rules A9, B3 and D3 are how the Chinese line
# stays clean without say:. This lecture's rejected artifacts (ci_cd_aws.yml, head_commit, cluster_state=absent,
# DOCKER_TAG, AWS_SSH_KEY, NEXTAUTH_SECRET, EXTERNAL_IP, group_id, failed=0, ansible>=9.0.0, here-string (<<<)) are
# written the way the narration says them (A9, B3); ac215_2024 passes as written.
# SERIES RULE: the instructor's name never appears in a subtitle, a title or the description (A16); no staff name, no
# staff branch, no real-looking key, account id, ARN or IP.
# Human-readable copy in Chinese: GLOSSARY.md (keep the two in sync; both are generated from the same term data).
# terms[].zh_subtitle = the display form (Chinese subtitle line; titles use the written forms of A7);
# terms[].first_use = an example sentence for the translators, as SNN[k]：<one Chinese sentence for one English
# sentence of SAY block k of scene SNN, k from 0>; each one passes the checker; the narration files reuse them;
# terms[].note = usage (English → Chinese) and the rule tags.
# rules are tagged [A1]..[I3]: A terms, B typography, C numbers, D narration file, G subtitles, H titles and
# companions, I toolkit notes. (L1's E on-screen strings and F voice rules do not apply: nothing on screen is
# translated in this series, and there is no voice.)
# Read by: python -m explainer.i18n check (Latin words allowed in the Chinese line: every Latin word of
# zh_subtitle and first_use, plus allowed_spoken_latin, which lists the words as the checker's regex
# [A-Za-z][A-Za-z'.-]* cuts them: us-east-1 is us-east-, ac215_2024.pem is ac and pem, deploy-setup-containers.yml:151
# is deploy-setup-containers.yml) and explainer/subtitles.py, for EVERY video (2-3 word English phrases of `en` are kept
# on one English line; 2-7 character Chinese headwords of zh_subtitle are registered in jieba, so zh_subtitle holds
# terms, not example phrases).
video: ac215-l23-final-cicd
lang: zh-CN (mainland Simplified Chinese)
audience: 'Chinese-speaking AC215 (MLOps & LLMOps) grad students who know Python and basic ML, read technical English fluently, did L1-L22 (Docker images and containers, docker-shell.sh scripts with bind mounts, pipenv inside images; the cheese app''s Next.js frontend, FastAPI api-service, Chroma and the vector-db loader; L15 on AWS: IAM users, policies, access keys, ECR and the AWS CLI; L20''s deployment toolbox driving Pulumi; L21''s GitHub Actions: workflows, jobs, steps, runners and repository secrets; L22''s Kubernetes as the Google Cloud path), saw Lecture 23 (Final Deployment and Review, which speaks Google Cloud), and are new to Ansible (inventory, playbooks, plays, tasks, modules, the recap), EC2 instances, security groups, key pairs, EBS volumes and a workflow that deploys; they follow along with a clone of cheese-app-aws, Docker running, their own AWS account with billing (an EC2 server bills until it is deleted by hand) and, for part 2, a GitHub repository of their own, pausing to run every step. Register of a Chinese MLOps TA running a lab section.'
voice: none          # subtitles only (video.yaml: Chinese = i18n/zh/narration/*.yaml on the English timing)
policy: 'The Mandarin of a Chinese MLOps TA walking a lab section through a deployment, code-switching only where such a speaker really does, written as subtitles under an English narration. The viewers already say 把 repo clone 下来, 构建 image, 起一个 container, push 到 ECR, 建一个 IAM 用户, 挂上策略, 下载访问密钥, 进工具箱容器, 跑一下 playbook, push 到 main, 这个 job 被跳过了, runner 上跑, 加一个 secret; this lecture adds 建一个密钥对, 开安全组, 起一台 EC2 实例, 填 inventory, 一个 play 里有几个 task, 看 recap 里 failed 是不是 0, 报 UNREACHABLE, 挂 Docker socket, 打一个时间戳 tag, 用 extra vars 传进去, 两道筛子, 按发布按钮, 终止实例, 手动清理. Every choice passes three tests: what is said in a real lab section; the standard, searchable Chinese name (AWS''s Chinese console and docs: IAM 用户, 策略, AWS 托管策略, 访问密钥, 私有访问密钥, 密钥对, 安全组, 实例, 系统映像, 区域, 公有 IP 地址, 终止, 停用, 附加; the Ansible Chinese docs: 模块, 主机, 声明式; Chinese CI/CD practice: 持续集成, 持续交付, 持续部署, 发布, 工作流, 步骤, 滚动更新, 数据漂移); and consistency with the series (L1-L22, above all L15, the AWS precedent, L20, the deployment toolbox, and L21, GitHub Actions: every form they fixed is kept). (1) Artifacts verbatim: what the viewer types or matches on screen (commands, flags, file and folder names, paths, the keyword and commit messages, image, network and user names, console labels, the workflow''s step names, the recap counters, error text the narration quotes) is copied letter for letter, never translated, inflected or quoted; the exceptions the checker forces (an underscore between letters, = > or brackets) are written the way the narration says them (A9) and the English line shows the literal (D4). Nothing on screen is translated in this series: terminal output, code panels, README cards, trackers, tags, console and GitHub drawings, the V1-V8 set pieces, the lecture tags and the pause-and-ponder cards stay English; only the narration is. (2) Lab-speech English, a closed list (A1 c). (3) Everything else in standard Chinese (A2-A6, A10-A12). (4) The video''s pictures by meaning, one word each, every time (script.md''s metaphor table): 筛子 (sieve), 徽章 (the badge: the access key), 钥匙 (the key glyph: the key pair), 工具箱容器 (toolbox), 前门 (front door: nginx), 发布按钮 (release button), 保险库 (the vault on GitHub), 总图 (the lecture''s map), 替身 (stand-in, L10, L20), 一环 (a link of the && chain). (5) Written register for titles, meta.yaml and companion docs: 容器, 镜像, 仓库, 端口, 镜像仓库（registry）, 提交, 提交信息, 推送, 机密（secret）, 流水线, 工作流, 置备（provisioning）. (6) The bilingual band puts the English sentence under every Chinese line, so the Chinese line carries no glosses and no brackets at all (the checker forbids them without say:). (7) The toolkit''s constraints are part of the policy: one Chinese sentence per English sentence (136 blocks, 360 sentences), a checker-clean display line (D3), an en_display wherever the SAY spells an artifact out as words (D4), the English clause order kept (D9). Mainland Simplified Chinese; relaxed, clear lab-section speech, never slangy.'
rules:
- '[A1] Code-switching scope. English stays in three places only. (a) Artifacts, copied letter for letter: commands as typed or named (git clone, git add ., git commit, git push, cd src/deployment, chmod 400, sed, sh docker-shell.sh, bash docker-shell.sh, aws sts get-caller-identity, aws configure, pip install, docker build, docker tag, docker push, docker login, docker run -it, docker system prune -a, the six README commands ansible-playbook deploy-docker-images.yml -i inventory.yml, ansible-playbook deploy-create-instance.yml -i inventory.yml --extra-vars cluster_state=present, ansible-playbook deploy-provision-instance.yml -i inventory.yml, ansible-playbook deploy-setup-containers.yml -i inventory.yml, ansible-playbook deploy-setup-webserver.yml -i inventory.yml, and the delete with cluster_state=absent, the last two only as A9 allows), flags (-i, -f, -a, -it, set -e), file and folder names (docker-shell.sh, inventory.yml, nginx.conf, .docker-tag, Dockerfile, deploy-setup-containers.yml:151, ac215_2024.pem, the CSV, the pem file; ci_cd_aws.yml as A9), paths (/app, /secrets, /home, /mnt/disk-1, /deployment, /root/.ssh, /frontend-react, /api/, /api/newsletters, /newsletters, .github/workflows, src, ..), the keyword and messages (/run-, /run-deploy-app, \run-deploy-app, /RUN-DEPLOY-APP, /deploy-app, /run-tests, fix typo /run-tests, update readme), names the viewer creates or matches (CheeseAppECRPolicy, deployment-ac215-user, cheese-app-ac215-key-pair, ac215_2024, cheese-app-deployment, appnetwork, the hosts appserver, all and localhost, the user ubuntu, us-east-1, t2.large, latest), the workflow''s step name Run Deployment Container and the GitHub labels Settings, Secrets and variables, Actions, the README''s GCP console, the recap counters (ok, changed, unreachable, failed, skipped) and the quoted terminal text (A15). (b) Products and proper names (the products row of the term table). (c) Lab-speech English, a closed list: from the series repo, clone, commit, push, pull, origin, main, container, image, tag, Dockerfile, port, localhost, registry, bucket, pipeline, shell, root, socket, pin, prune, collection, agent, job, runner, secret (GitHub''s repository secrets, L21), action, run, playbook, provision (L20), ID, IP, API, JSON, YAML, URL, CSV, SSH, HTTPS, CI, CD, Ingress and Pod (L22); new in this lecture play, task, inventory, hosts, recap, register, extra vars, here string, volume (the EBS volume; the series word). Nothing else is code-switched.'
- '[A2] container, image, port, the toolbox and the laptop, as L1-L22. The subtitles say container, image, port (起一个 container, 构建 image, port 80), measure words 个 container / 个 image / 台服务器 / 块磁盘; the app images → 应用 image; the base image → 基础 image; a throwaway container → 一个一次性的 container; the loader → 加载器 (L10, L20); the deployment container → 部署 container (S02 only, the lecture''s word); the toolbox → 工具箱容器, every time (script.md''s metaphor table; L20 wrote 工具箱, this script fixes the longer form so the toolbox is never mistaken for a toolset): inside the toolbox → 在工具箱容器里, the toolbox image → 工具箱容器的 image; your laptop → 你的笔记本; your laptop''s Docker → 你笔记本上的 Docker; the Docker engine → Docker 引擎; the Docker socket → Docker socket; a Docker network → Docker 网络 (L4, L10); the vector database → 向量数据库; the frontend / the API / the API service → 前端 / API / API 服务; the vector DB tool → 向量数据库工具; the data disk → 数据磁盘; virtual machine → 虚拟机 (S16, L1). Titles, chapter names, meta.yaml and companion docs write 容器, 镜像, 端口 (A7).'
- '[A3] AWS identity and keys (L15''s forms; AWS''s Chinese console and docs). IAM user → IAM 用户 (create a user → 创建一个用户); policy → 策略 (create a policy from this JSON → 用这段 JSON 创建一个策略; your own ECR policy → 你自己的 ECR 策略); policies AWS manages → AWS 托管策略; attach a policy → 挂上 (L15); full access → 完全访问权限; access key → 访问密钥; access key ID → 访问密钥 ID; the secret key / secret access key → 私有访问密钥 (AWS''s Chinese name; never 秘密密钥); key pair → 密钥对; private key → 私钥; SSH key → SSH 密钥; the two secrets on the laptop (the access key and the key pair) → 两份密钥 (≠ GitHub''s secret, A10); account → 账号 (series form; AWS''s console says 账户: the series wins); account ID → 账号 ID; the author''s account ID → 作者的账号 ID; identity check → 身份检查; who it is → 自己的身份; credentials → 凭据; the security token → 安全令牌 (the token is invalid → 安全令牌无效); placeholder → 占位符 / 占位密钥 / 占位名; region → 区域; the IAM console / the EC2 console / the AWS console → IAM 控制台 / EC2 控制台 / 控制台; third party service → 第三方服务 (the SAY paraphrases the console''s use case); deactivate → 停用 (L15); role → 角色 (L14, L15); OIDC → OIDC (never 开放身份连接 in a subtitle). Picture words (policy 4): the badge → 徽章 (the access key), the key → 钥匙 (the key pair''s glyph), the vault → 保险库, a copy → 副本 (a second / third copy → 第二份 / 第三份副本).'
- '[A4] EC2, the server and money. instance → 实例 (an EC2 instance → 一个 EC2 实例; the instance task → 实例那个 task); the server → 服务器 (one EC2 server → 一台 EC2 服务器; a real server → 真实的服务器); security group → 安全组 (L16); ports open to anyone → 对所有人开放; disk → 磁盘 (two 100 gigabyte disks of its own → 自带两块 100 GB 的磁盘; the second disk → 第二块磁盘; a spare disk → 一块备用磁盘); volume → volume (the EBS volume, the 50 gigabyte volume, a volume ID → EBS volume, 50 GB 的 volume, volume ID; A1 c); attach a disk → 附加 (AWS''s word; ≠ 挂载, which is mount); mount → 挂载; format → 格式化; machine image (the AMI) → 系统映像 (A10); public IP address → 公有 IP 地址; terminate → 终止 (≠ 停止 / 删除: terminate the instance → 终止实例); billing → 结算 (an AWS account with billing → 开通了结算的 AWS 账号); the meter runs / bills → 计费 (by the hour → 按小时; bills until you do this → 会一直计费，直到你做完这些); storage → 存储 (cost storage → 产生存储费用); cost → 成本; clean up by hand → 手动清理; the GOLD tags stay English on screen and no amount is ever written.'
- '[A5] Ansible (new in this lecture; the Ansible Chinese docs where engineers use them, English where they do not). Ansible → Ansible; playbook → playbook (L20; a playbook is a list of plays → 一个 playbook 就是一串 play; the provision playbook → provision 那个 playbook; five playbooks → 五个 playbook); play → play (a localhost play / an appserver play → localhost 的 play / appserver 的 play); task → task (an ordered list of tasks → 按顺序执行的一串 task; 11 tasks → 11 个 task; task 1 / task 2 → 第 1 个 task / 第 2 个 task; the attach task → 附加那个 task); module → 模块 (each task calls one module → 每个 task 调用一个模块; the Docker module of Ansible → Ansible 的 Docker 模块; an old module name → 一个旧的模块名); inventory → inventory (the inventory graph → inventory 图; the machines in an inventory → inventory 里的那些机器); hosts → hosts (the hosts line → hosts 这一行; under appserver hosts → 放在 appserver 的 hosts 下面); one host → 一台主机; the recap → recap (every run ends with a recap → 每次运行最后都有一个 recap); register → register (the Ansible keyword); extra variable / extra vars → extra vars (it reaches Ansible as an extra variable → 它作为 extra vars 进入 Ansible; beats anything the playbook sets → 优先级高于 playbook 里设的任何值); the when lines → when 行; a syntax check → 语法检查; gathering facts → Gathering Facts (the task name as printed); describe a state → 描述一个状态; declarative → 声明式; infrastructure → 基础设施; set up by Ansible → 由 Ansible 配置好; provision → provision (L20: the provision playbook; written 置备（provisioning）); each link of the && chain → 一环 (each link runs only if the one before succeeded → 每一环只有在前一环成功时才运行); idempotent is never said (跑两次，第二次会报 ok).'
- '[A6] CI/CD and GitHub Actions (the lecture''s words and L21''s forms). continuous integration → 持续集成; continuous delivery → 持续交付; continuous deployment → 持续部署 (the workflow named continuous integration and continuous deployment → 这个工作流叫持续集成和持续部署; Delivery. → 持续交付。); CI / CD / CI CD → CI / CD / CI/CD; the CI half / the CD half → CI 那一半 / CD 那一半; the loop → 循环; the codebase → 代码库; developers → 开发者; build / test / release / deploy / monitor → 构建 / 测试 / 发布 / 部署 / 监控; release → 发布 (presses release → 按下发布按钮; the release button → 发布按钮); notifications → 通知; automated tests → 自动化测试; coding standards → 编码规范; static analysis → 静态分析; defects → 缺陷; data quality / model performance / metrics / tolerance / data drift → 数据质量 / 模型性能 / 指标 / 容差 / 数据漂移; the workflow / the workflow file → 工作流 / 工作流文件 (L21); job → job; step → 步骤 (L21; the last step → 最后一步; the deploy step → 部署这一步); runner → runner (a fresh Ubuntu machine → 一台全新的 Ubuntu 机器); action → action (an action from AWS → 一个来自 AWS 的 action); a run / a green run → run / 一次绿色的 run; the color of the run → run 的颜色; the keyword → 关键词; condition → 条件; contains → 包含; skipped → 跳过 (paraphrase) / skipping (quoted); the sieve → 筛子 (two sieves → 两道筛子; the first sieve → 第一道筛子; bounces off → 被弹回去); head commit → head commit (A9); the match ignores case → 匹配不区分大小写; merge → 合并 (deploy every merge to main → 把每次合并到 main 都部署出去); recreated → 重新创建; rolling update → 滚动更新; pods → Pod (L22); a Kubernetes cluster → Kubernetes 集群; Milestone 5 → Milestone 5 (L21).'
- '[A7] Written vs spoken pairs. Subtitles say repo / clone / commit / push / container / image / port / registry / secret / pipeline / provision; titles, chapter names, meta.yaml and the companion docs write 仓库 / 克隆 / 提交 / 推送 / 容器 / 镜像 / 端口 / 镜像仓库（registry）/ 机密（secret）/ 流水线 / 置备（provisioning）, each gloss once per document; commit message → commit 信息 in subtitles, 提交信息 in titles. runner, playbook, play, task, inventory, job and Ansible stay English in both registers (L20, L21; video.yaml''s publish.description_zh does so). Products stay as they are everywhere.'
- '[A8] Writing artifacts. Copied verbatim (case, dots, slashes, hyphens, colons unchanged); never translated, inflected, quoted, put in 《》 or code formatting. Add a Chinese head noun where it helps: deployment 目录, secrets 目录, nginx.conf 文件, .docker-tag 文件, appnetwork 网络, CheeseAppECRPolicy 这个策略, Run Deployment Container 这一步, update readme 这条信息, deploy-setup-containers.yml 这个 playbook. A lower-case command, tool, flag, path word or file name never opens a Chinese sentence (as the English never does): Curl can''t verify … → 这里 curl 验证不了……; AWS STS get caller identity shows it → 运行 aws sts get-caller-identity 就能看到它; Git add dot also commits … → 执行 git add . 也会……; The runner is … → 这个 runner 是……; A playbook is … → 一个 playbook 就是……; Head commit means … → 所谓 head commit，指的是……; The recap says … → 这次的 recap 显示……. A path or a keyword that starts with / may open a sentence (/run-deploy-app 两道筛子都能通过), as may a capitalised name (Gathering Facts, Port 443 as the English writes it).'
- '[A9] Artifacts the checker rejects. With no say:, the checker reads the display line as speech and rejects letter_letter names, maths symbols (= < > + and friends) and brackets of any kind. So these are written the way the narration says them, and the English line carries the literal (D4): ci_cd_aws.yml → ci cd aws.yml; head_commit → head commit; cluster_state=absent / present → cluster state 设为 absent / present; DOCKER_TAG → Docker tag 变量 (never just tag, which is the image tag); AWS_SSH_KEY → AWS SSH key; NEXTAUTH_SECRET → NextAuth secret; EXTERNAL_IP / external_ip → external IP (Could not resolve hostname external IP); group_id → group ID (no attribute group ID); failed=0 / failed=1 → failed 为 0 / failed 为 1; ansible>=9.0.0 → never written: 大于号, 等号 (S06); here-string (<<<) → here string; --extra-vars → extra vars. Allowed as written, because the checker accepts them: ac215_2024 and ac215_2024.pem (a digit, not a letter, before the underscore), /run-, \run-deploy-app, /RUN-DEPLOY-APP, .., /root/.ssh, set -e, -it, git add ., deploy-setup-containers.yml:151, CI/CD.'
- '[A10] Words to keep apart. 镜像 = container image only (L1 A6): the AMI is 系统映像, a Debian or apt mirror never appears. repo (Git: this repository, your own GitHub repository) ≠ 仓库 (an ECR repository: three private repositories, delete the three repositories → 三个私有仓库, 删掉那三个仓库) ≠ registry (your ECR registry → 你的 ECR registry). secret (GitHub''s repository secrets: add four, delete the four secrets → 加四个 secret, 删掉那四个 secret) ≠ 两份密钥 (S02, S16: the access key and the key pair on the laptop) ≠ /secrets (the folder) ≠ 私有访问密钥 (the AWS secret access key) ≠ NextAuth secret (A9). 密钥 (a real key: access key, key pair, SSH key, signing key → 签名密钥) ≠ 钥匙 (the key glyph of V3 and the picture: the key opens the SSH door) ≠ 徽章. 挂载 (mount a folder, a disk, the socket) ≠ 附加 (attach an EBS disk) ≠ 挂上 (attach a policy) ≠ 注册路由 (the API mounts its routes). 提示符 (the shell prompt, S05; never prompt, which the series keeps for LLM prompts). 发布 (release, the lecture''s box) ≠ 部署 (deploy) ≠ 交付 (delivery: always 持续交付 as the lecture''s term). 终止 (terminate an instance) ≠ 删除 (delete a volume, a group, a key) ≠ 停用 (deactivate an access key). 状态 (a state Ansible modules describe; the disk holds state) ≠ 状态码 (HTTP status 410, 200). task (Ansible) ≠ 任务 (not used). 主机 (one host, the same host) ≠ hosts (the playbook line). 总图 (the lecture''s map) ≠ 架构 (the solution architecture → 解决方案架构, S16).'
- '[A11] Register: a TA running a lab section. Short instructions, colloquial verbs (跑, 起, 停, 开, 敲, 改, 填, 存, 拷, 删, 挑, 收拾); address the viewer as 你 (never 您, 大家, 同学们); 我们 is us at recording time (ours is a placeholder → 我们的是占位符; our machine → 我们的机器; our stand-ins → 我们的替身). Chinese word order inside a clause; the English clause order is kept (D9). No translationese: not 让我们…… (say 我们来…… / 先……), not 这就是为什么…… (say 所以…… / 这也是为什么…… only where the English says that''s also why), few 被, no strings of 一个……的. No internet slang. Carry the rhythm by meaning: Surprise 1 → 意外 1; Then → 然后; Last → 最后; Next → 接下来; Once more, the path. → 再把这条路走一遍。; Two sieves, one sentence. → 两道筛子，一句话。; One character. → 就差一个字符。; Predict: → 预测一下：.'
- '[A12] Precision, errata, the honest framing and ponders. Translate hedges and quantifiers exactly: only 只, every 每个 / 每次, each 每个 / 各, all 全部 / 所有, about 大约, never 从不 / 永远不, still 还 / 仍然, already 已经, again 又 / 再, first 先, exactly 正好 / 原样 (exactly as written → 完全照写的来; exactly as the README writes it → 照 README 写的原样), too 也, may 可能, at the time of recording → 录制时 (no tool version is written; the chip stays on screen). Keep 我们的 / 你的 (Ours is unreachable … → 我们的是 UNREACHABLE……; On yours → 在你的服务器上; With your keys → 用你的密钥). Errata and slide-vs-capture differences are said as gently and briefly as the English, one phrase each for the whole video: A small slip: → 有一个小疏漏：(S08, the key switch); A small gap → 一个小出入 (S03, the key-pair name); A kind note: → 说明一点：(S08, the GCP heading); the slides speak Google Cloud → 课件讲的是 Google Cloud (never 课件错了: they describe the GCP version); Its keyword belongs to the Google Cloud repo → 它的关键词属于 Google Cloud 那个 repo. The honesty sentence (S01[4]) is as plain as the English, said once, no apology; every later first error is just the next line (Our first real error: → 我们第一个真实的报错：). Untested claims stay hedged exactly (We couldn''t test whether … → 我们没法测试……; We didn''t test whether … → ……我们没有测试; tries to attach → 尝试附加). Ponder questions (S06[1], S10[2], S12[3], S14[9], S15[0]) ask only, without hints: S06[1] names neither socket nor engine; S10[2] does not say strip or replace; S12[3] does not say sieve; S14[9] favours neither word; S15[0] does not say skipping. A question. → 想一想。; Predict: → 预测一下：; Your turn. → 轮到你了。. The answers use the question''s own words (Your laptop''s. → 你笔记本的。; Slash newsletters. → /newsletters。; Build and push only. → 只构建和 push。; Delivery. → 持续交付。).'
- '[A13] The screen stays English. This series translates the narration only: terminal output and prompts (student@laptop:~/cheese-app-aws/src/deployment$, root@<container id>:/app#), terminal titles (laptop, cheese-app-deployment), code panels (comments included), README cards, the trackers (README › Before you deploy, README › Deployment Steps, ci_cd_aws.yml · not in the README, step k of N, · extra), the lecture tags (Lecture 23 · slides a–b), the tags (your turn, extra, extra · stand-in on the laptop, the workflow''s own commands, run by hand, illustration, erratum, at the time of recording, the GOLD cost tags, the chips), the console and GitHub drawings, the V1-V8 set pieces, the recap tiles and the pause-and-ponder and test-yourself cards are English; no scene changes for Chinese. When the SAY names a screen element, the subtitle copies it or names it: your turn → your turn; marked illustration → 标着 illustration; the tracker → 进度条; the image column → image 那一列; the inventory graph → inventory 图. The narration''s own words are translated: extra → 额外 (These first commands are extra → 最开始这几条命令是额外的; An extra check → 一个额外检查; Extra: → 额外一步： / 额外说明：; Two extras → 两个额外步骤); a stand-in → 替身; drawings → 示意图.'
- '[A14] Mainland Simplified Chinese only: 默认, 程序, 代码, 文件, 目录, 服务器, 网络, 脚本, 视频, 用户, 信息, 配置, 账号, 密钥, 令牌, 凭据, 参数, 变量, 日志, 浏览器, 网页, 磁盘, 链接, 重定向, 证书, 实例, 默认; never 預設, 程式, 程式碼, 檔案, 資料夾, 伺服器, 網路, 腳本, 影片, 使用者, 訊息, 組態, 帳號, 金鑰, 權杖, 憑證, 參數, 變數, 日誌, 瀏覽器, 磁碟, 連結, 重新導向.'
- '[A15] Errors, status codes and terminal words. Short terminal text the narration quotes stays verbatim, with the screen''s case, without the screen''s quotes, backticks or trailing ! (the viewer looks for it): credentials file not found, redirection unexpected, Gathering Facts, AWS was not able to validate the provided access credentials, UNREACHABLE, Could not resolve hostname external IP (A9), no attribute group ID (A9), skipping, ok, failed, unreachable, Gone (status 410 → 状态码 410 Gone; answers 200 → 返回 200). Translated: what the SAY paraphrases rather than quotes (the security token is invalid → 安全令牌无效, the screen says The security token included in the request is invalid; docker login received an empty password → docker login 收到的是一个空密码; a syntax error on line 13 → 第 13 行有语法错误; it stops → 它就停了; fails → 失败了; Docker refuses without a terminal → 没有终端的话 Docker 会拒绝; exited with zero → 以 0 退出). Never quoted: request ids, dates, headers, container ids, digests, the CSV and pem text, commit ids.'
- '[A16] The lecture, the course and the slides. Course: AC215; lecture n → 第 n 讲 (as in lecture 15 → 和第 15 讲一样; lectures 9 and 21 → 第 9 讲和第 21 讲; lectures 13 and 15 → 第 13 讲和第 15 讲); the course''s last lecture → 这门课的最后一讲; the lecture → 课上 (The lecture lists five things to automate → 课上列了五件要自动化的事; the lecture''s loop → 课上的循环; the lecture''s plan → 课上的计划; the lecture''s routing → 课上的路由; in the lecture''s words → 用课上的话说; one of the lecture''s challenges → 课上说的挑战之一); the lecture''s three parts → 三节 (L21''s 四节); motivation → 动机; the review / the version in the review → 回顾 / 回顾部分的版本; the slides / the slide → 课件 (The slides say: → 课件上说：; the tutorial slide → 教程那一页课件; the slide''s three commands → 课件上的三条命令); part 1 / part 2 (the video''s parts) → 第 1 部分 / 第 2 部分; step n (README steps and the tracker) → 第 n 步; step 9 of 15 (the Docker build) → 15 步里的第 9 步; Milestone 5 → Milestone 5; the exercises → 练习; the author (of the script''s account id) → 作者. SERIES RULE: the instructor''s name never appears in a subtitle, a title, a chapter name or the description; this script never names the instructor, the staff, or the people on slide 4; a later revision that does says the instructor → 授课老师, and the masked ‹instructor› on screen is never written into a subtitle. No staff branch is named.'
- '[A17] The series list (the ac215-video skill''s list) in this video: container (S02, S09-S12, S14, S16) and image (S02, S04-S07, S09, S11-S16) as A2; Dockerfile (S06, S13); port (S04, S06, S08-S10); volume (S15, the EBS volume); pipeline (S02, S16); repo (S01-S03, S10-S16; ECR repositories are 仓库, A10); commit (S01-S03, S10-S14); push / pull (S01-S03, S07, S09, S11-S14, S16); registry (S02, S13); bucket (S16); SSH (S03, S04, S08, S09, S13, S16); CI / CD (S11-S16); agent (S16); prompt (S05, the shell prompt → 提示符, A10); endpoint, embedding, LoRA, venv, PATH (not in this script; if a revision says them, they stay English as in the series).'
- '[B1] Spacing. One half-width space between Chinese and Latin letters, digits or artifacts (第 23 讲, 第 3 步, 第 13 行, port 80, 50 GB, 2.5 GB, 39 个 commit, 11 个 task, 返回 200, 状态码 410, 在 /secrets 里, 跑 ansible-playbook, 第 9 到 11 行). The checker reports a missing space on every displayed sentence. Spaces inside an artifact stay as they are (AWS was not able to validate the provided access credentials, fix typo /run-tests, Secrets and variables), never added inside one. No space next to full-width punctuation (……/api/。, 返回 200：). No U+00A0 / U+202F.'
- '[B2] Punctuation. Full-width ，。、；：？！“”…… in Chinese text, also next to artifacts. Lists use 、 (S3、EC2 和 Bedrock; port 22、80 和 443; git add .、git commit). The paths the SAY reads with commas are written as paths (dot github, workflows → .github/workflows; slash secrets, AC215 underscore 2024 dot pem → /secrets/ac215_2024.pem; settings, secrets and variables, actions → Settings，Secrets and variables，Actions, the three labels as a click path). No brackets of any kind: （）, (), 《》, 【】, [], <>; the checker rejects them in a line without say:. “” only for translated quotations; artifacts, keywords, commit messages and quoted terminal text never get quotation marks. Inside one Chinese sentence (one English sentence) no 。？！: use ，；：. No ASCII ? or ! in the Chinese line. Questions keep ？. The ASCII colon, slash, backslash, dot and hyphen inside an artifact stay (deploy-setup-containers.yml:151, \run-deploy-app, .docker-tag, /run-).'
- '[B3] Symbols the checker rejects (= < > + → ← ^ ≤ ≥ × ÷ ≈, == != +=, a digit followed by !, brackets, letter_letter): never in the Chinese line; written in words (A9). the greater than sign → 大于号; an equals sign → 等号; cluster state equals absent → cluster state 设为 absent; failed, 1 / failed, zero → failed 为 1 / failed 为 0; here string (<<<) → here string; the && chain → 一长串命令 / 一环.'
- '[C1] Numbers in display text. Arabic digits for everything that echoes the screen, the terminal, the code, the README or the slides: counts the screen shows (39 个 commit, 33 个, 11 个 task, 38 个 task, 15 步里的第 9 步), ports (22, 80, 443, 3000, 8000, 9000), status codes (200, 410), line numbers (第 4 行, 第 7 行, 第 9 到 11 行, 第 13 行, 第 17 行, 第 24 行, 第 26 行, 第 30 行, 第 36 行, 第 37 行, 第 43 到 46 行, 第 151 行), sizes (50 GB, 100 GB, 2.5 GB), file modes (400, 600), lectures (第 1 讲 … 第 23 讲), steps (第 1 步 … 第 14 步), surprises (意外 1 / 2 / 3), Ansible 6, 2024 年, Milestone 5, us-east-1, t2.large. Small counts the SAY says in words that the screen does not show as digits are Hanzi: 三个 image, 三个仓库, 三个 AWS 托管策略, 九个 ECR 操作, 两份密钥, 两个变量, 四个 AWS 变量, 四个 secret, 四样东西, 五个 playbook, 五个 container, 五个环境变量, 五件事, 两道筛子, 三个 commit, 三条命令, 三个文件, 三节, 两块磁盘, 一个字符, 一台服务器, 第二块磁盘, 第三份副本; the test-yourself set keeps the SAY''s One: … Five: → 第一：……第五：; about a dozen → 十几.'
- '[C2] Units, versions and dates. 50 gigabytes → 50 GB; two and a half gigabytes → 2.5 GB; down to the second → 精确到秒; by the hour → 按小时; Chroma version 1 → 版本 1; an older version → 一个更早的版本; Ansible 6 → Ansible 6; an old Python → 旧版 Python; chosen in 2024 → 2024 年选的. Tool versions are on screen only (at the time of recording → 录制时); none is written in a subtitle. Never write a timestamp, a commit id, a container id or an account id.'
- '[D1] Sentence alignment (explainer/i18n.py). One entry per SAY line of script.md in narration/*.yaml (136 blocks); `en` byte-equal to the SAY line; `zh` has exactly one item per English sentence as split by explainer.voice.split_sentences (360 in this script v2: part 1 S01-S10 83 blocks, 213 sentences; part 2 S11-S16 53 blocks, 147 sentences). Short English sentences stay short Chinese sentences (One character. → 就差一个字符。; A question. → 想一想。; Your laptop''s. → 你笔记本的。; Your turn. → 轮到你了。; Build and push only. → 只构建和 push。; Delivery. → 持续交付。; Test yourself. → 自测一下。; The Helm fix. → Helm 的修复。; The Chroma pin. → Chroma 的 pin。).'
- '[D2] No say:, no anchors. There is no Chinese voice: never write say: (the display line is the only text) and never write anchors: (they only place animation beats for a Chinese-voiced render). The subtitles are timed by the English audio; the toolkit pairs each Chinese sentence with its English sentence and cuts both at matching clause marks.'
- '[D3] A checker-clean display line. With no say:, every displayed sentence must pass explainer.i18n.spoken_problems: no brackets (B2), no maths symbols (B3), no letter_letter names (A9), no ! after a digit, no clause ending in 种 followed by ，。！？ (write 种类 or rephrase), every Latin word listed in this glossary (zh_subtitle, first_use or allowed_spoken_latin), a half-width space between Hanzi and Latin or digits; and must end with 。！？ (or …… ), with no 。！？ inside.'
- '[D4] The English line (en_display). In the bilingual band the English line shows the SAY sentence, which spells artifacts out for the voice. Every such sentence gets an en_display item with the literal on-screen form, otherwise word for word the SAY sentence; null for the other sentences of the block. Table (script.md "Notes for scene authors", Subtitle display for the i18n stage, all of it): ansible playbook, deploy docker images, dash i, inventory dot yaml → ansible-playbook deploy-docker-images.yml -i inventory.yml (and deploy provision instance / deploy setup containers / deploy setup webserver → ansible-playbook deploy-provision-instance.yml / deploy-setup-containers.yml / deploy-setup-webserver.yml where the SAY names the command); S H, docker shell dot S H → sh docker-shell.sh; bash docker shell dot S H → bash docker-shell.sh; docker shell dot S H → docker-shell.sh; slash run dash → /run-; slash run deploy app → /run-deploy-app; backslash run deploy app → \run-deploy-app; slash run deploy app in capitals → /RUN-DEPLOY-APP; slash deploy app → /deploy-app; slash run tests → /run-tests; fix typo slash run tests → fix typo /run-tests; update readme → update readme; slash secrets → /secrets; slash app → /app; slash home → /home; slash deployment → /deployment; slash root slash dot S S H → /root/.ssh; slash M N T slash disk 1 → /mnt/disk-1; slash frontend react → /frontend-react; slash API slash → /api/; slash API → /api; slash API slash newsletters → /api/newsletters; slash newsletters → /newsletters; dot docker tag → .docker-tag; docker tag (the variable) → DOCKER_TAG; C I C D AWS dot yaml → ci_cd_aws.yml; inventory dot yaml → inventory.yml; nginx dot conf → nginx.conf; dot dots → ..; dot github, workflows → .github/workflows; AWS S T S get caller identity → aws sts get-caller-identity; docker system prune, dash a → docker system prune -a; dash f → -f; dash I T → -it; docker run, dash I T → docker run -it; set dash e → set -e; change mode 400 → chmod 400; git add dot → git add .; git commit → git commit -m "…" (S14[7]); AC215 underscore 2024 dot pem → ac215_2024.pem; AC215 underscore 2024 → ac215_2024; cheese app AC215 key pair → cheese-app-ac215-key-pair; deployment AC215 user → deployment-ac215-user; cheese app E C R policy → CheeseAppECRPolicy; cheese app deployment → cheese-app-deployment; cluster state equals absent → cluster_state=absent; head commit → head_commit; E C R / E C 2 / E B S / S S H / C S V / S T S / O I D C → ECR / EC2 / EBS / SSH / CSV / STS / OIDC; U S East 1 → us-east-1; T 2 large → t2.large; external I P → EXTERNAL_IP; AWS S S H key → AWS_SSH_KEY; Next auth secret → NEXTAUTH_SECRET; status 410 → 410; here string → here-string (<<<); the tag latest → latest; the when lines → the when: lines; line 151 → deploy-setup-containers.yml:151; G C P → GCP; public I P address → public IP address; I P → IP. Not restored: the README step numbers, port numbers, lecture numbers (already digits). The English video''s own .srt is not affected.'
- '[D5] Content parity. Each Chinese sentence translates its English sentence only: no added commands, flags, glosses, Chinese screen names or explanations; kept-English words get no Chinese explanation (the English line is right below); ponder questions get no answers (A12). Head words A8 needs (这个, 命令, 文件, 目录, 变量, 这一步, 这条信息) carry no content. An extra in the English is 额外.'
- '[D6] Fixed patterns (L9-L22''s, extended). The tracker names the README step, and your turn means pause and run it. → 进度条标出 README 的哪一步，your turn 表示暂停一下，自己跑一遍。 Pause and run it. → 暂停一下，自己跑一遍。 Pause and run step 6. → 暂停一下，跑第 6 步。 Step 8: pause and run … → 第 8 步：暂停一下，运行……。 Pause, and get to this prompt yourself. → 暂停一下，自己走到这个提示符。 Pause, comment out line 4 and turn on line 7. → 暂停一下，注释掉第 4 行，打开第 7 行。 Pause, create an empty private one, point origin at it, and push main. → 暂停一下，建一个空的私有 repo，把 origin 指向它，再 push main。 Pause, and push. → 暂停一下，push。 Name it …, and pause to create it → 把它命名为……，暂停一下，把它创建好. A question. → 想一想。 Predict: → 预测一下：. Your turn. → 轮到你了。 Test yourself. → 自测一下。 One: … Five: → 第一：……第五：. Step n: → 第 n 步：. Surprise n: → 意外 n：. Extra: → 额外一步：(an action) / 额外说明：(an explanation). Extra checks: → 额外检查：. A small slip: → 有一个小疏漏：. A kind note: → 说明一点：. Our first real error: → 我们第一个真实的报错：. Ours …; on yours … → 我们的……；在你的……. Picture words (policy 4): sieve → 筛子; badge → 徽章; key (glyph) → 钥匙; toolbox → 工具箱容器; front door → 前门; release button → 发布按钮; vault → 保险库; map → 总图; stand-in → 替身; link → 一环.'
- '[D7] Files. narration/g1.yaml = S01-S10 (part 1, deploy by hand: the hook, the map in AWS words, the policy, user and two keys, Ansible in one picture, the toolbox''s three surprises, whose Docker, three images and one timestamp, create and provision the server, five containers on one network, nginx as the one front door); narration/g2.yaml = S11-S16 (part 2: CI, CD and who presses release, two sieves, secrets and the runner, one tag to the server, the delete that deletes nothing, the course review and recap). Each file starts with a comment naming its scenes and the script version it was made from (script.md v2, 2026-11-08).'
- '[D8] Length on the English timing. The Chinese is read while the English plays; the band switches where the English switches. Each Chinese sentence should be readable in the time its English sentence is heard: at most about 2 units per English word (a Hanzi counts 1, a Latin letter 0.55), so drop redundant connectives and repeated subjects, never content. Long artifacts cost length too (ansible-playbook deploy-docker-images.yml -i inventory.yml 30, AWS was not able to validate the provided access credentials 34, Could not resolve hostname external IP 21, aws sts get-caller-identity 15, deploy-setup-containers.yml:151 17, cheese-app-ac215-key-pair 14, credentials file not found 15): do not repeat what the English does not; after the first time use the short form (这个 playbook, 这个文件, 这个报错, 这条信息, 这个 tag).'
- '[D9] Keep the English clause order (series lesson, ac215-video skill). The toolkit pairs Chinese and English clause by clause; a condition the English puts last but the Chinese puts first swaps meaning between two neighbouring cues. Keep conditions, purposes and time phrases where the English has them: Change two now: the key pair name, unless yours already matches → 现在改两处：密钥对的名字，除非你的已经对上了; AWS STS get caller identity shows it, once your keys work → 运行 aws sts get-caller-identity 就能看到它，前提是你的密钥能用; the user and the policy if you made them only for this → 还有用户和策略，如果它们只是为这一讲建的; a docker tag variable in the toolbox''s environment wins; otherwise, the dot docker tag file → 工具箱容器环境里的 Docker tag 变量优先；否则就用 .docker-tag 文件; It starts on every push to main, but the job runs only if … → 每次 push 到 main 它都会启动，但这个 job 只在……时才运行; this server bills until you do this → 这台服务器会一直计费，直到你做完这些. Where the English opens with if, with, without, once, then or so (S06[4].0, S07[6].0, S08[2].2, S08[2].3, S09[3].1), the Chinese opens the same way.'
- '[G1] Width. Bilingual band: a Chinese line at most 30 units, an English line 96 characters; .zh.srt cues 22 units a line, 2 lines. Keep clauses under about 24 units, separated by ，；：、 so the cutter has clean cuts; never a clause over 30 units without a mark. The long artifacts (D8) take a clause of their own; the playbook commands (S07[3], S08[6], S09[4], S10[5]), the quoted AWS error (S08[2]) and the long lists (S03[4], S06[0], S11[2], S13[1], S14[1], S16[5]) get a comma at each English clause break.'
- '[G2] Cue ends: the toolkit strips 。，、；： at the end of each cue and keeps ？！…… and a closing ” (subtitles.strip_end). Prefer ending a clause on a Chinese word rather than on artifact + 。 where the English allows (……放进 deployment 目录里。 reads better than ……deployment。); the quoted terminal text (credentials file not found, redirection unexpected, AWS was not able to validate the provided access credentials) and the keyword may close a sentence as they do in the English.'
- '[G3] Names and commands are never split. The cutter treats a space between two Latin words in a Chinese line as a good cut, so ansible-playbook deploy-docker-images.yml -i inventory.yml, aws sts get-caller-identity, docker system prune -a, docker run -it, sh docker-shell.sh, bash docker-shell.sh, git add ., AWS was not able to validate the provided access credentials, Could not resolve hostname external IP, credentials file not found, redirection unexpected, no attribute group ID, Run Deployment Container, Secrets and variables, EC2 Instance Connect, fix typo /run-tests, update readme and cluster state 设为 absent could land on two lines. Put them at a clause end, after a full-width colon or 、, with little Chinese around them, at most one long label per cue; after the .zh.srt is rendered, check every cue with a command, an error phrase or a label.'
- '[H1] Titles (meta.yaml). Video, part and chapter titles in the written register (A7: 容器, 镜像, 仓库, 提交, 提交信息, 机密（secret）, 置备（provisioning））; questions keep their question mark; the English colon structure is kept (启动工具箱容器：三个意外; 唯一的前门：nginx); commands, tools and names as they are (Ansible, EC2, ECR, nginx, GitHub Actions, runner); meta.yaml is not read by the checker, so brackets are fine there. The video title uses the series pattern AC215 · 第 n 讲：…（跟练：…）, in substance the same as video.yaml''s publish.title_zh (最终部署与课程回顾：用 Ansible 把 Cheese App 部署到一台 EC2，再让一条 commit 自动重新部署). The core-concept chapters carry their English short name once where the Chinese is not the usual search word (置备（provisioning）; 机密（secret）). The recap follows the series 回顾 pattern. No title names the instructor (A16).'
- '[H2] Description (Bilibili / YouTube): two or three sentences, written register, this glossary''s terms: the follow-along of AC215 lecture 23 against the slides (which speak Google Cloud) and the AWS repo cheese-app-aws''s README step by step (part 1 by hand: the IAM policy, user, access key and key pair, Ansible''s inventory / play / task / module, the toolbox''s three surprises and ansible>=9.0.0, the socket, one timestamp tag pushed to ECR, the EC2 server and its provisioning, five containers and nginx as the only front door; part 2: the lecture''s CI/CD loop, continuous delivery vs continuous deployment, the workflow''s two sieves, the four repository secrets, the runner, the tag followed to recreated containers, the delete that deletes nothing and the manual clean-up, the course review), the honest-errors framing (no AWS account on the recording machine), the GOLD costs. No instructor name (A16); the course credit line with names lives only in video.yaml''s publish block.'
- '[H3] Companions: i18n/zh/README.md (and exercises.md / digest.md if made) are translated with this glossary in the written register (A7: 仓库, 克隆, 提交, 推送, 容器, 镜像, 端口, 镜像仓库（registry）, 机密（secret）, 流水线, 工作流, 置备（provisioning）, 持续交付, 持续部署, 安全组, 密钥对, 访问密钥, 系统映像), each gloss once per document.'
- '[H4] Code and commands in companions stay byte for byte: code blocks, commands, file names and inline `code` are unchanged; only # comments and the prose around them are translated.'
- '[I1] (request, open since L3) explainer.i18n check applies the voice hygiene of the display line when a sentence has no say: (_SPOKEN_BAD: brackets, maths symbols, letter_letter names, the 种 rule). For a subtitles-only video (this series; this glossary says voice: none) the display could be allowed brackets, = and underscores, which would let ci_cd_aws.yml, head_commit, DOCKER_TAG and cluster_state=absent be written literally. Until then A9 and B3 apply.'
- '[I2] (open, from L1 I3) explainer/subtitles.py _cuts treats a space between Latin words in a Chinese line as a good cut, so commands, error phrases and labels can be split (G3). Proposal: in a Chinese line, treat a run of Latin words joined only by spaces as one token.'
- '[I3] (note) explainer/subtitles.py reads every video''s glossary.yaml: 2-3 word English phrases of each term''s en are kept on one English line, and the 2-7 character Chinese headwords of zh_subtitle are registered in jieba, for all videos'' subtitles. So every zh_subtitle here holds terms separated by " / ", never example phrases.'
terms:
# ---------------------------------------------------------------- S01 Thirty-three commits, one backslash
- en: 'repository / commits / the same message / slash run deploy app / a button / pushed to main / rebuilds the app / redeploys a server'
  zh_subtitle: 'repo / commit / commit 信息 / /run-deploy-app / 按钮 / push 到 main / 重新构建 / 重新部署'
  first_use: 'S01[0]：这个 repo 有 39 个 commit，其中 33 个带着同一条信息：/run-deploy-app。'
  note: 'A1 c, D4 (slash run deploy app → /run-deploy-app). commit message → commit 信息 (written 提交信息, A7). That sentence is a button. → 这句话就是一个按钮。 Pushed to main, it rebuilds the app and redeploys a server. → push 到 main 以后，它会重新构建应用，再重新部署一台服务器。 The keyword is never put in quotation marks (B2).'
- en: 'the slash leans the other way / a different sentence / nothing runs at all / one character'
  zh_subtitle: '斜杠 / 反斜杠 / 另一句话 / 一个字符'
  first_use: 'S01[1]：有一次，斜杠倒向了另一边。'
  note: 'policy 4. To the workflow, that is a different sentence, and nothing runs at all. → 对工作流来说，那是另一句话，什么都不会运行。 One character. → 就差一个字符。 The backslash keyword is written \run-deploy-app where the SAY names it (S12[6], S16[10]).'
- en: 'how does a sentence deploy a server / why did one character stop it / by the end of part 2 / push that sentence yourself'
  zh_subtitle: '部署 / 第 2 部分 / 你自己'
  first_use: 'S01[2]：一句话是怎么部署一台服务器的，一个字符又为什么拦住了它？'
  note: 'D9: the two questions stay one sentence with one ？ at the end. By the end of part 2, you''ll push that sentence yourself. → 到第 2 部分结束时，你会亲手 push 这句话。'
- en: 'the course''s last lecture / final deployment and review / three parts / motivation / a playful prediction web page / our reading of it / runs somewhere / stays current'
  zh_subtitle: '最后一讲 / 最终部署与回顾 / 三节 / 动机 / 预测网页 / 保持最新'
  first_use: 'S01[3]：这是这门课的最后一讲：最终部署与回顾，分三节。'
  note: 'A16. Its motivation is a playful prediction web page; our reading of it: even a toy prediction app is only useful when it runs somewhere, and stays current. → 它的动机是一个好玩的预测网页；我们的理解是：哪怕是一个玩具级的预测应用，也只有在某个地方跑着、并且保持最新时才有用。 The slide''s page, its title and the people on it are never described further (series rule).'
- en: 'this recording machine has no AWS account / ran for real / talks to AWS / exactly as the README writes it / up to its real first error / drawings / marked illustration'
  zh_subtitle: '录制用的机器 / AWS 账号 / 真实运行 / 真实的第一个报错 / 示意图 / illustration'
  first_use: 'S01[4]：我们录制用的这台机器没有 AWS 账号。'
  note: 'A12 (the honesty sentence, said once, plain, no apology). Everything on the laptop ran for real. → 笔记本上的一切都是真实运行的。 Every command that talks to AWS ran exactly as the README writes it, up to its real first error. → 每条和 AWS 打交道的命令，都照 README 写的原样跑了，一直跑到它真实的第一个报错。 The consoles, the server and GitHub are drawings, marked illustration. → 控制台、服务器和 GitHub 都是示意图，标着 illustration。 Never 服务器打印出, never 部署成功 (series rule).'
- en: 'your own AWS account with billing / a GitHub repository / runs a server until you delete it / the tracker / your turn / pause and run it'
  zh_subtitle: '结算 / 计费 / 进度条 / your turn / 暂停一下'
  first_use: 'S01[5]：这一讲会让一台服务器一直运行，直到你删掉它。'
  note: 'A4, D6. You need Docker, your own AWS account with billing, and for part 2, a GitHub repository. → 你需要 Docker、一个你自己的、开通了结算的 AWS 账号，第 2 部分还需要一个 GitHub repo。 The tracker names the README step, and your turn means pause and run it. → 进度条标出 README 的哪一步，your turn 表示暂停一下，自己跑一遍。'
# ---------------------------------------------------------------- S02 The final map, in AWS words
- en: 'the lecture''s map / the dev team / commits to GitHub / GitHub Actions builds and deploys to the cloud / users reach the app'
  zh_subtitle: '总图 / 开发团队 / 云 / 用户'
  first_use: 'S02[0]：这是课上的总图。'
  note: 'A16, policy 4 (the map → 总图, every time; chapter 课上的总图). The dev team commits to GitHub, GitHub Actions builds and deploys to the cloud, and users reach the app there. → 开发团队把代码 commit 到 GitHub，GitHub Actions 负责构建并部署到云上，用户在那里访问应用。'
- en: 'the app as one chain / from data to frontend'
  zh_subtitle: '一条链 / 数据 / 前端'
  first_use: 'S02[1]：在它上面，是画成一条链的应用，从数据一直到前端。'
  note: 'A16. Above it → 在它上面.'
- en: 'the slides speak Google Cloud / the AWS repository / as in lecture 15 / in AWS words / Kubernetes cluster / one EC2 server / image registry / three repositories / Ansible playbooks'
  zh_subtitle: '课件 / AWS 的说法 / Kubernetes 集群 / EC2 服务器 / registry / ECR 仓库 / Ansible playbook'
  first_use: 'S02[2]：课件讲的是 Google Cloud；我们跟的是 AWS 的 repo，和第 15 讲一样。'
  note: 'A3, A6, A10, A16, D4 (E C 2 → EC2, E C R → ECR). Now the same map in AWS words. → 现在把同一张总图换成 AWS 的说法。 The Kubernetes cluster becomes one EC2 server running Docker containers. → Kubernetes 集群变成了一台跑着 Docker container 的 EC2 服务器。 The image registry becomes ECR, with three repositories. → image registry 变成了 ECR，里面有三个仓库。 Pulumi becomes Ansible playbooks. → Pulumi 变成了 Ansible 的 playbook。 Never say the slides are wrong: they describe the Google Cloud version (A12).'
- en: 'the service account key / two secrets / an IAM access key / an EC2 key pair / the keyword / the ingress / one nginx container at the front door'
  zh_subtitle: '服务账号密钥 / 两份密钥 / 访问密钥 / 密钥对 / 关键词 / Ingress / 前门'
  first_use: 'S02[3]：服务账号密钥变成了两份密钥：一个 IAM 访问密钥和一个 EC2 密钥对。'
  note: 'A3, A6, A10 (two secrets on the laptop → 两份密钥; GitHub''s repository secrets → secret, S13), policy 4 (front door → 前门). The keyword becomes slash run deploy app, and the ingress becomes one nginx container at the front door. → 关键词变成了 /run-deploy-app，Ingress 变成了站在前门的一个 nginx container。 Ingress capitalised as L22 wrote the Kubernetes object.'
- en: 'no Kubernetes and no Pulumi / one server, set up by Ansible / no machine learning lane'
  zh_subtitle: '一台服务器 / 机器学习那条线'
  first_use: 'S02[4]：这里没有 Kubernetes，也没有 Pulumi：一台服务器，由 Ansible 配置好，也没有机器学习那条线。'
  note: 'A5 (set up → 配置好).'
- en: 'five things to automate / pipeline jobs / model training / frontend and backend deployment / always together / building and pushing containers / three app images'
  zh_subtitle: '自动化 / pipeline / job / 模型训练 / 前端 / 后端 / 应用 image'
  first_use: 'S02[5]：课上列了五件要自动化的事。'
  note: 'A1 c, A16, C1. For this repo: pipeline jobs and model training, no, those were lecture 15. → 对这个 repo 来说：pipeline 的 job 和模型训练，没有，那是第 15 讲的事。 Frontend and backend deployment, yes, always together. → 前端和后端的部署，有，而且总是一起。 Building and pushing containers, yes: three app images. → 构建和 push container，有：三个应用 image。'
- en: 'the lecture''s plan / a deployment container / let GitHub Actions run it / cheese app deployment / invoke the command line / ansible playbook commands / one long command'
  zh_subtitle: '部署 container / cheese-app-deployment / 命令行 / ansible-playbook / 一长串命令'
  first_use: 'S02[6]：课上的计划是：我们已经有了一个部署 container，那就让 GitHub Actions 来运行它。'
  note: 'A2, D4 (cheese app deployment → cheese-app-deployment). Here it''s called cheese app deployment. → 在这里，它叫 cheese-app-deployment。 The slides say: invoke the command line in that container. → 课件上说：在那个 container 里调用命令行。 Here, that means ansible playbook commands. → 在这里，就是 ansible-playbook 命令。 In part 1 you type them; in part 2, they arrive as one long command. → 第 1 部分由你来敲；第 2 部分，它们会作为一长串命令送过来。'
# ---------------------------------------------------------------- S03 A policy, a user and two keys
- en: 'these first commands are extra / no clone step / one branch / unchanged since we pinned it / inside src / the deployment folder'
  zh_subtitle: '额外 / clone / 分支 / src 目录 / deployment 目录'
  first_use: 'S03[0]：最开始这几条命令是额外的；README 里没有 clone 这一步。'
  note: 'A1 c, A13 (extra → 额外). One branch, unchanged since we pinned it, and inside src, the deployment folder. → 只有一个分支，从我们固定版本以来没有变过；src 里面就是 deployment 目录。 The commit id is never written (series rule).'
- en: 'the list of APIs to enable / inside a comment / nothing to switch on / Bedrock models / US East 1 / chosen in 2024'
  zh_subtitle: '要启用的 API / 注释 / Bedrock / 模型 / us-east-1 / 区域'
  first_use: 'S03[1]：要启用的 API 列表写在一段注释里；在 AWS 上没有什么需要打开的。'
  note: 'A3, D4 (U S East 1 → us-east-1). One check: the API calls Bedrock models in US East 1, chosen in 2024, so check your account can still use them. → 检查一下：API 调用的是 us-east-1 里的 Bedrock 模型，那是 2024 年选的，所以确认一下你的账号还能用它们。'
- en: 'the IAM console / create a policy from this JSON / one identity check / nine ECR actions / log in, push and pull / on any resource'
  zh_subtitle: 'IAM 控制台 / 策略 / 身份检查 / ECR 操作 / 资源'
  first_use: 'S03[2]：第 2 步，在 IAM 控制台里：用这段 JSON 创建一个策略。'
  note: 'A3 (L15: policy → 策略). It allows one identity check and nine ECR actions, to log in, push and pull, on any resource. → 它允许一次身份检查和九个 ECR 操作，用来登录、push 和 pull，对任何资源都适用。'
- en: 'cheese app ECR policy / the JSON parses / can''t create a repository / make three by hand'
  zh_subtitle: 'CheeseAppECRPolicy / 解析 / 手动创建'
  first_use: 'S03[3]：把它命名为 CheeseAppECRPolicy，暂停一下，把它创建好；一个额外检查表明这段 JSON 能正常解析。'
  note: 'A8, D4 (cheese app E C R policy → CheeseAppECRPolicy). It can''t create a repository, so you''ll make three by hand later. → 它不能创建仓库，所以稍后你要手动建三个。 repository here is an ECR repository → 仓库 (A10).'
- en: 'create a user / deployment AC215 user / three policies AWS manages / full access / S3, EC2 and Bedrock / your own ECR policy'
  zh_subtitle: 'IAM 用户 / 用户 / deployment-ac215-user / AWS 托管策略 / 完全访问权限'
  first_use: 'S03[4]：第 3 步：创建一个用户，deployment-ac215-user。'
  note: 'A3, D4 (deployment AC215 user → deployment-ac215-user). It gets three policies AWS manages: full access to S3, EC2 and Bedrock. → 给它挂上三个 AWS 托管策略：S3、EC2 和 Bedrock 的完全访问权限。 And your own ECR policy. → 再加上你自己的 ECR 策略。 The managed policy names stay on screen only.'
- en: 'create an access key / third party service / download the CSV file / a secrets folder beside your clone / not inside it / can never be committed'
  zh_subtitle: '访问密钥 / 第三方服务 / CSV 文件 / secrets 目录 / 旁边'
  first_use: 'S03[5]：第 4 步：为第三方服务创建一个访问密钥，再下载 CSV 文件。'
  note: 'A3 (the SAY paraphrases the console''s use case, so it is translated: 第三方服务), D4 (C S V → CSV). Save it in a secrets folder beside your clone, not inside it, so it can never be committed. → 把它存进你 clone 旁边的一个 secrets 目录里，不是 clone 里面，这样它就永远不会被 commit。'
- en: 'create an EC2 key pair / pem file / the badge / the AWS API / the key / the SSH door of your server'
  zh_subtitle: '密钥对 / pem 文件 / 徽章 / 钥匙 / SSH 的门'
  first_use: 'S03[6]：第 5 步：创建一个 EC2 密钥对，把它的 pem 文件也存到那里。'
  note: 'A3, policy 4 (V3: the badge → 徽章; the key glyph → 钥匙; the real keys stay 密钥, A10). The badge talks to the AWS API; the key opens the SSH door of your server. → 徽章负责和 AWS 的 API 打交道；钥匙打开你服务器的 SSH 门。'
- en: 'an extra check shows a small gap / the README names the key pair / the code expects / AC215 underscore 2024 / in three files / easiest fix / that name'
  zh_subtitle: '小出入 / cheese-app-ac215-key-pair / ac215_2024 / ac215_2024.pem / 最省事的修法'
  first_use: 'S03[7]：代码在三个文件里要的是 ac215_2024。'
  note: 'A9 (ac215_2024 passes the checker: no letter right before the underscore), A12 (a small gap → 一个小出入, said once), D4 (AC215 underscore 2024 dot pem → ac215_2024.pem; cheese app AC215 key pair → cheese-app-ac215-key-pair). An extra check shows a small gap. → 一个额外检查暴露出一个小出入。 The README names the key pair cheese app AC215 key pair. → README 把密钥对叫作 cheese-app-ac215-key-pair。 Easiest fix: use that name, so the file is AC215 underscore 2024 dot pem. → 最省事的修法：就用这个名字，这样文件就是 ac215_2024.pem。'
- en: 'change mode 400 / SSH refuses a private key that others can open'
  zh_subtitle: 'chmod 400 / 私钥 / 拒绝'
  first_use: 'S03[8]：额外一步：对 pem 文件执行 chmod 400。'
  note: 'A8, D4 (change mode 400 → chmod 400). S S H refuses a private key that others can open. → SSH 会拒绝一个别人也能打开的私钥。'
# ---------------------------------------------------------------- S04 Ansible in one picture
- en: 'deployment setup / a new tool / described the infrastructure you want / an ordered list of tasks / the machines in an inventory / modules describe a state / plenty of shell commands'
  zh_subtitle: 'Ansible / 基础设施 / task / inventory / 模块 / 状态 / shell 命令'
  first_use: 'S04[0]：Ansible 按顺序执行一串 task，对象是 inventory 里的那些机器。'
  note: 'A5. Step 6, deployment setup, brings a new tool: Ansible. → 第 6 步，部署准备，带来一个新工具：Ansible。 Pulumi, in lecture 20, described the infrastructure you want. → 第 20 讲的 Pulumi，描述的是你想要的基础设施。 Many of its modules describe a state; this repo also runs plenty of shell commands. → 它的很多模块描述的是一个状态；这个 repo 也跑了不少 shell 命令。'
- en: 'a playbook is a list of plays / names its hosts / holds tasks / each task calls one module / the hosts line / localhost means inside your toolbox / appserver means on the server, over SSH'
  zh_subtitle: 'playbook / play / hosts / task / 模块 / localhost / appserver'
  first_use: 'S04[1]：一个 playbook 就是一串 play。'
  note: 'A5, A8 (playbook never opens a sentence bare: 一个 playbook……). Each play names its hosts and holds tasks, and each task calls one module. → 每个 play 写明它的 hosts，里面装着 task，每个 task 调用一个模块。 The hosts line decides where tasks run: localhost means inside your toolbox; appserver means on the server, over SSH. → hosts 这一行决定 task 在哪里运行：localhost 表示在你的工具箱容器里；appserver 表示在服务器上，通过 SSH。'
- en: 'that inventory, as one file / logs in as the user ubuntu / line 4 / the key for GitHub Actions / commented out / take your keys from the environment / nothing to type'
  zh_subtitle: 'inventory.yml / ubuntu 用户 / 第 4 行 / 注释掉 / 环境变量'
  first_use: 'S04[2]：Ansible 以 ubuntu 用户的身份登录。'
  note: 'A5, C1. Here is that inventory, as one file. → 这就是那个 inventory，写成一个文件。 Line 4 points at the key for GitHub Actions; line 7, commented out, at the key on your laptop. → 第 4 行指向给 GitHub Actions 用的密钥；第 7 行被注释掉了，指向你笔记本上的密钥。 Lines 9 to 11 take your keys from the environment: nothing to type. → 第 9 到 11 行从环境变量里取你的密钥：什么都不用填。'
- en: 'the region / a T 2 large instance / the key pair name / marked change this / an Ubuntu machine image / disk names and sizes'
  zh_subtitle: '区域 / 实例 / t2.large / 系统映像 / 磁盘'
  first_use: 'S04[3]：然后是这台机器：区域 us-east-1，一个 t2.large 实例。'
  note: 'A4, A10 (machine image → 系统映像, AWS''s Chinese name for an AMI; never 镜像, which is the container image only), D4 (T 2 large → t2.large). The key pair name, marked change this. → 密钥对的名字，标着 change this。 An Ubuntu machine image for that region, and the disk names and sizes. → 一个那个区域的 Ubuntu 系统映像，还有磁盘的名字和大小。'
- en: 'the README''s four bullets / change two now / Next auth secret / a random value of your own / the host on line 30 comes later'
  zh_subtitle: '四个要点 / NextAuth secret / 随机值 / 第 30 行'
  first_use: 'S04[4]：README 的四个要点指的正是这几行。'
  note: 'A9 (NEXTAUTH_SECRET → NextAuth secret; en_display NEXTAUTH_SECRET), C1. Change two now: the key pair name, unless yours already matches, and line 24, the Next auth secret, to a random value of your own. → 现在改两处：密钥对的名字，除非你的已经对上了；还有第 24 行，NextAuth secret，改成你自己的一个随机值。 The host on line 30 comes later. → 第 30 行的 host 稍后再填。'
- en: 'every run ends with a recap / success means failed and unreachable stay at zero / a declarative task run twice / reports ok the second time'
  zh_subtitle: 'recap / failed / unreachable / ok / 声明式'
  first_use: 'S04[5]：每次运行最后都有一个 recap；成功的意思是 failed 和 unreachable 都保持为 0。'
