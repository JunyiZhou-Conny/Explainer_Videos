# titles keyed by scene file stem (as video.yaml's scenes), and the Bilibili / YouTube description.
# Titles follow GLOSSARY.md rule H1: written register (容器, 镜像, 仓库, 提交, 提交信息, 机密（secret）,
# 置备（provisioning）; A7; runner, playbook, Ansible, EC2, ECR and nginx stay as they are), the English colon structure
