- en: "Step 4: sudo apt install git. This time apt really installs things. It lists what it will add and asks, do you want to continue? Type Y and press enter. The list depends on your VM; if git is already there, apt says so. Pause and run it."
  zh:
  - "第 4 步：sudo apt install git。"
  - "这次 apt 是真的要装东西了。"
  - "它会列出要添加的东西，然后问你：要继续吗？"
  - "输入 Y，按回车。"
  - "列表因 VM 而异；如果已经有 git，apt 会直接告诉你。"
  - "暂停一下，自己跑一遍。"
- en: "Step 5: clone the repo. Type git clone, then the address; copy it from the README. Git copies the whole repo, with its history, into a new folder, simple-translate, in your home directory."
  zh:
  - "第 5 步：把 repo clone 下来。"
  - "输入 git clone，再加上地址；地址从 README 里复制。"
  - "它会把整个 repo 连同历史，复制到一个新目录 simple-translate 里，就在你的 home 目录下。"
  say:
