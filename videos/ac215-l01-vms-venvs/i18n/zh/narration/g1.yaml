- en: "Now the command from the start of the video, without sudo or any flag; it isn't in the README either. Again, pip refuses: this environment is externally managed. The hint says: install with apt, or create a virtual environment. Its last note even names a way around it."
  zh:
  - "现在跑视频开头那条命令，不带 sudo，也不带任何参数；它也不在 README 里。"
  - "还是一样，pip 拒绝了：这个环境是 externally managed。"
  - "提示说：用 apt 安装，或者建一个虚拟环境。"
  - "它最后一句甚至给出了绕过去的办法。"
- en: "Why refuse? Picture how Python finds an import. This extra one-liner prints the list called sys dot path: the folders Python searches. Think of them as shelves. On every import, Python scans from the top shelf down, and takes the first match."
  zh:
  - "为什么要拒绝？"
  - "先想想 Python 怎么找 import 的东西。"
  - "这条额外的一行命令打印 sys.path 这个列表，也就是 Python 会搜索的那些目录。"
  - "把它们想成一层层的架子。"
  - "每次 import，Python 都从最上面一层往下找，拿第一个对上的。"
  say:
  - null
  - null
  - "这条额外的一行命令打印 sys 点 path 这个列表，也就是 Python 会搜索的那些目录。"
  - null
  - null
