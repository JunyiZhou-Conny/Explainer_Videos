S07:
- en: "Step 10, the last one: delete the VM. As the README says, a running VM keeps charging, even when idle. So why delete it, and not just stop it?"
  zh:
  - "第 10 步，也是最后一步：把 VM 删掉。"
  - "README 也说了，运行中的 VM 会一直计费，闲着也一样。"
  - "那为什么要删除，而不只是停止？"
- en: "Stopping ends the billing for CPU and memory, but the disk still exists, so it keeps billing, and so would a reserved IP address."
  zh:
  - "停止之后，CPU 和内存不再计费，但磁盘还在，所以还在计费；预留的 IP 地址也一样。"
- en: "Deleting removes the VM, and by default its boot disk goes with it. That's a setting on the boot disk, and it's on unless you changed it. And the meter stops. Select your instance, click Delete, and pause until it's gone."
  zh:
  - "删除会移除这台 VM，而且默认启动磁盘也一起删掉。"
  - "这是启动磁盘的一个设置，你没改过就是开着的。"
  - "计价器也就停了。"
  - "选中你的实例，点 Delete，暂停视频，等它删完。"
- en: "Then check two pages: VM instances and Disks should both be empty. With the gcloud tool on your laptop, two extra commands do the same: gcloud compute instances list, and gcloud compute disks list. Neither is in the README."
  zh:
  - "然后检查两个页面：VM instances 和 Disks 都应该是空的。"
  - "笔记本上装了 gcloud 命令行工具的话，两条额外的命令也能查：gcloud compute instances list，还有 gcloud compute disks list。"
  - "这两条 README 里都没有。"
