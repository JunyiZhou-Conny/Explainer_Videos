S08:
- en: "Back to our puzzle: two projects, two versions of httpx, one shared shelf. The fix is to give each project its own toolbox. That toolbox is a virtual environment."
  zh:
  - "回到刚才那个问题：两个项目，两个版本的 httpx，却只有一层公用的架子。"
  - "解决办法是给每个项目一个自己的工具箱。"
  - "这个工具箱，就是虚拟环境。"
- en: "A virtual environment is just a folder, usually called dot venv, with three parts. First, a bin folder with a python inside. It's usually not a copy, just a link to a real interpreter somewhere else."
  zh:
  - "虚拟环境其实就是一个目录，名字通常是 .venv，分三个部分。"
  - "第一，一个 bin 目录，里面有个 python。"
  - "它通常不是拷贝，只是个软链接，指向别处真正的解释器。"
  say:
  - "虚拟环境其实就是一个目录，名字通常是点 venv，分三个部分。"
  - null
  - null
  en_display:
  - "A virtual environment is just a folder, usually called .venv, with three parts."
  - null
  - null
- en: "Second, its own site-packages folder, empty when uv makes it. Site-packages is the usual name; Debian calls its system ones dist-packages. This is where this project's packages go, and only this project's."
  zh:
  - "第二，它自己的 site-packages 目录，uv 刚建好时是空的。"
  - "一般叫 site-packages；Debian 把系统的叫 dist-packages。"
  - "这个项目的包就装在这里，而且只装这个项目的。"
  say:
  - "第二，它自己的 site packages 目录，uv 刚建好时是空的。"
  - "一般叫 site packages；Debian 把系统的叫 dist packages。"
  - null
- en: "Third, a small config file, pyvenv.cfg. When Python starts from the venv's bin folder, it reads this file. It says: you're in a venv, so use my site-packages, and leave the system's out."
  zh:
  - "第三，一个小配置文件：pyvenv.cfg。"
  - "Python 从 venv 的 bin 目录启动时，会读这个文件。"
  - "它说：你在 venv 里，所以用我的 site-packages，系统的不算。"
  say:
  - "第三，一个小配置文件：pyvenv 点 cfg。"
  - null
  - "它说：你在 venv 里，所以用我的 site packages，系统的不算。"
- en: "Here's the difference on the shelves. Started from the venv, Python builds a different list. The standard library still comes from the real interpreter it links to. But both dist-packages shelves from the system are gone, and the venv's own shelf takes their place."
  zh:
  - "看看架子上的区别。"
  - "从 venv 启动的 Python，建出的列表不一样。"
  - "标准库还是来自它软链接指向的那个真正的解释器。"
  - "但系统的两层 dist-packages 架子都没了，换成 venv 自己的那层。"
  say:
  - null
  - null
  - null
  - "但系统的两层 dist packages 架子都没了，换成 venv 自己的那层。"
- en: "Same engine, different toolbox. And the toolboxes don't mix: packages in the venv are invisible to the system Python, and the other way round."
  zh:
  - "引擎还是那个引擎，工具箱换了一个。"
  - "而且两个工具箱互不相干：venv 里的包，系统 Python 看不见，反过来也一样。"
- en: "Remember pip's hint? It suggested python3 dash m venv, the classic way to make one. Today, uv makes it for us, and does a lot more."
  zh:
  - "还记得 pip 的提示吗？"
  - "它建议用 python3 -m venv，这是建 venv 的经典做法。"
  - "今天用 uv 来建，它还能做更多。"
  say:
  - null
  - "它建议用 python3 杠 m venv，这是建 venv 的经典做法。"
  - null
  en_display:
  - null
  - "It suggested python3 -m venv, the classic way to make one."
  - null
- en: "What a venv doesn't isolate: the operating system, system libraries written in C, and drivers. Those are jobs for a whole machine, like our VM, or a container, next lecture."
  zh:
  - "有些东西 venv 隔离不了：操作系统、用 C 写的系统库，还有驱动。"
  - "这些要交给一整台机器，比如我们的 VM，或者交给容器，下节课再讲。"
- en: "After uv sync, we'll open the real folder and find all three parts."
  zh:
  - "跑完 uv sync，我们打开真正的目录，找齐这三个部分。"
S09:
- en: "Part 2 starts on a fresh VM, same settings, and the meter runs again. Fresh matters: this system Python never sees pip. Create it and SSH in; if the name is taken, the old VM is still being deleted, so wait a minute. Pause until your terminal is open."
  zh:
  - "第二部分换一台全新的 VM，设置不变，计价器又开始跳了。"
  - "全新很重要：pip 从来没碰过这个系统 Python。"
  - "建好后 SSH 进去；名称被占用的话，说明旧 VM 还在删除，等一分钟就好。"
  - "暂停视频，等你的终端打开。"
- en: "Then the same four commands: apt-get update, install git, clone, and cd. Pause until your prompt ends in simple-translate."
  zh:
  - "接着还是那四条：apt-get update、装 git、clone 和 cd。"
  - "暂停视频，直到提示符以 simple-translate 结尾。"
  say:
  - "接着还是那四条：apt get update、装 git、clone 和 cd。"
  - "暂停视频，直到提示符以 simple translate 结尾。"
- en: "Step 7 installs uv in one line. First, curl downloads a script: it follows redirects, stays quiet but shows errors, and fails on an HTTP error instead of handing an error page to the shell."
  zh:
  - "第 7 步一行命令就能装好 uv。"
  - "先用 curl 下载一个脚本：它会跟随重定向，安静运行但仍然显示错误，遇到 HTTP 错误就直接失败，而不是把错误页面交给 shell。"
- en: "The vertical bar is a pipe: it hands the script straight to the shell, so you're running code from the internet: uv's official installer, which you can read first."
  zh:
  - "这根竖线是管道：它把脚本直接交给 shell，所以你运行的是网上来的代码，也就是 uv 的官方安装脚本，你可以先读一遍。"
- en: "Pause and run it. It installs uv, version 0.13.0 at the time of recording, and uvx, into dot local slash bin in your home folder."
  zh:
  - "暂停一下，自己跑一遍。"
  - "它会装上 uv，录制时的版本是 0.13.0，还有 uvx，都装到你 home 目录下的 .local/bin 里。"
  say:
  - null
  - "它会装上 uv，录制时的版本是零点十三点零，还有 uvx，都装到你 home 目录下的点 local 斜杠 bin 里。"
  en_display:
  - null
  - "It installs uv, version 0.13.0 at the time of recording, and uvx, into .local/bin in your home folder."
- en: "Let's try uv, with an extra check. Command not found. But we just installed it."
  zh:
  - "试一下 uv，这是个额外检查。"
  - "报 command not found。"
  - "可我们明明刚装好。"
- en: "When you type a command, the shell walks a list of folders called PATH, left to right, and runs the first match. None contains uv, and the shell only knows the PATH it started with."
  zh:
  - "你输入一个命令，shell 就去一个叫 PATH 的目录列表里，从左到右找，运行第一个匹配的。"
  - "哪个目录都没有 uv，而 shell 只认它启动时的 PATH。"
- en: "The installer's last lines, and step 8, give two options: reload your shell, or source the env file. A reload means a new SSH window, back in your home folder, so you'd cd into simple-translate again. Sourcing is quicker: it puts that folder first in PATH. Pause and run the source line."
  zh:
  - "安装脚本最后几行和第 8 步给了两个办法：重新加载 shell，或者 source env 文件。"
  - "重新加载就是新开一个 SSH 窗口，回到 home 目录，所以要重新 cd 进 simple-translate。"
  - "用 source 更快：它把那个目录放到 PATH 最前面。"
  - "暂停一下，跑一遍 source 那条命令。"
  say:
  - null
  - "重新加载就是新开一个 SSH 窗口，回到 home 目录，所以要重新 cd 进 simple translate。"
  - null
  - null
- en: "Then two extra checks: uv reports its version, and which uv points into that folder."
  zh:
  - "再做两个额外检查：uv 能报出版本，which uv 也指向那个目录。"
- en: "Why source, and not sh? Plain sh would change a child shell that exits at once; source changes this one. The installer also made your startup files run this env file, so next time you connect, uv is found by itself."
  zh:
  - "为什么用 source，不用 sh？"
  - "直接用 sh，改的是马上就退出的子 shell；source 改的是当前这个 shell。"
  - "安装脚本还让你的启动文件运行这个 env 文件，所以下次连上来，直接就能找到 uv。"
- en: "So what is uv? One fast tool that replaces several: the venv module, pip, pip-tools for locking, pyenv for installing Pythons, and pipx."
  zh:
  - "那 uv 到底是什么？"
  - "一个很快的工具，顶替好几个：venv 模块和 pip，锁版本的 pip-tools，装 Python 的 pyenv，还有 pipx。"
  say:
  - null
  - "一个很快的工具，顶替好几个：venv 模块和 pip，锁版本的 pip tools，装 Python 的 pyenv，还有 pipx。"
S10:
- en: "Step 9 is uv sync, and it reads pyproject.toml, so let's read it first. The name is app. Two dependencies: art, version 6.5 or newer, and googletrans, exactly 4.0.2. Greater-or-equal means a range; double equals, one version. Line 6 is a range again: Python 3.13 or newer."
  zh:
  - "第 9 步是 uv sync，它会读 pyproject.toml，所以我们先来读一下。"
  - "项目名是 app。"
  - "两个依赖：art，6.5 及以上；googletrans，正好是 4.0.2。"
  - "大于等于表示一个范围；双等号表示一个确定的版本。"
  - "第 6 行又是一个范围：Python 3.13 及以上。"
  say:
  - "第 9 步是 uv sync，它会读 pyproject 点 toml，所以我们先来读一下。"
  - null
  - "两个依赖：art，六点五及以上；googletrans，正好是四点零点二。"
  - null
  - "第 6 行又是一个范围：Python 三点十三及以上。"
- en: "Now predict. This VM has Python 3.11. The project asks for 3.13 or newer. What will uv sync do? Fail, use 3.11 anyway, or something else?"
  zh:
  - "先预测一下。"
  - "这台 VM 上是 Python 3.11。"
  - "项目要求 3.13 及以上。"
  - "那 uv sync 会怎么做？"
  - "直接失败，照样用 3.11，还是做点别的？"
  say:
  - null
  - "这台 VM 上是 Python 三点十一。"
  - "项目要求三点十三及以上。"
  - null
  - "直接失败，照样用三点十一，还是做点别的？"
- en: "Pause and run uv sync. Instead of failing, uv downloads its own Python: CPython 3.15.0, at the time of recording. Then it creates a virtual environment in dot venv. If uv can't find a pyproject.toml, cd into simple-translate first."
  zh:
  - "暂停一下，跑一遍 uv sync。"
  - "它没有失败，而是下载了 uv 自己的 Python：CPython 3.15.0，这是录制时的版本。"
  - "然后它在 .venv 里建了一个虚拟环境。"
  - "如果 uv 找不到 pyproject.toml，先 cd 进 simple-translate。"
  say:
  - null
  - "它没有失败，而是下载了 uv 自己的 Python：C Python 三点十五点零，这是录制时的版本。"
  - "然后它在点 venv 里建了一个虚拟环境。"
  - "如果 uv 找不到 pyproject 点 toml，先 cd 进 simple translate。"
  en_display:
  - null
  - null
  - "Then it creates a virtual environment in .venv."
  - null
- en: "Here's what happened. Picture Python versions on a number line. The constraint lights up everything from 3.13 onward. First, uv looks for an interpreter it already has: its own downloads, then the system's. Debian's 3.11.2 lands outside the range, so it can't be used."
  zh:
  - "来看看刚才发生了什么。"
  - "把 Python 的各个版本画在一条数轴上。"
  - "这个约束点亮了从 3.13 往后的所有版本。"
  - "首先，uv 会找它已经有的解释器：先找自己下载过的，再找系统的。"
  - "Debian 的 3.11.2 落在范围外面，所以用不了。"
  say:
  - null
  - null
  - "这个约束点亮了从三点十三往后的所有版本。"
  - null
  - "Debian 的三点十一点二落在范围外面，所以用不了。"
- en: "So uv downloads one. Which one? Not 3.13, but the newest release in the range, which was 3.15.0 when we recorded. It lives in uv's own folder in your home, and the venv's python links to it."
  zh:
  - "所以 uv 要下载一个。"
  - "下载哪一个呢？"
  - "不是 3.13，而是范围内最新的版本，我们录制时是 3.15.0。"
  - "它装在你 home 目录下 uv 自己的目录里，venv 的 python 就软链接到它。"
  say:
  - null
  - null
  - "不是三点十三，而是范围内最新的版本，我们录制时是三点十五点零。"
  - null
- en: "That's the catch: a constraint is not a pin. Before Python 3.15 came out, this same command gave people 3.14. Watch this video next year, and you may get something newer still."
  zh:
  - "问题就在这儿：约束不是 pin。"
  - "在 Python 3.15 出来之前，同样这条命令装的是 3.14。"
  - "明年再看这个视频的话，你拿到的可能是更新的版本。"
  say:
  - null
  - "在 Python 三点十五出来之前，同样这条命令装的是三点十四。"
  - null
- en: "On Debian 13, the story changes. Its system Python, 3.13.5, is already inside the range. So uv simply uses it, with no download, and the venv's python links to the system one. Same command, different Debian, different Python."
  zh:
  - "到了 Debian 13，情况就不一样了。"
  - "它的系统 Python 是 3.13.5，本来就在范围里。"
  - "所以 uv 直接用它，不用下载，venv 的 python 就软链接到系统的那个。"
  - "同一条命令，不同的 Debian，不同的 Python。"
  say:
  - null
  - "它的系统 Python 是三点十三点五，本来就在范围里。"
  - null
  - null
- en: "To get the same Python everywhere, pin it. The command uv python pin 3.13, not in the README, writes a small file called dot python version, and the range shrinks to the 3.13 series. Don't run it now: your next uv sync would rebuild the venv, and the rest of the video wouldn't match. It's in the exercises."
  zh:
  - "想在哪儿都用同一个 Python，就把它 pin 住。"
  - "这条命令是 uv python pin 3.13，README 里没有；它会写一个小文件，叫 .python-version，范围就缩小到 3.13 系列。"
  - "现在先别跑：下次 uv sync 会重建 venv，视频后面的内容就对不上了。"
  - "这个放在练习里了。"
  say:
  - null
  - "这条命令是 uv python pin 三点十三，README 里没有；它会写一个小文件，叫点 python version，范围就缩小到三点十三系列。"
  - null
  - null
  en_display:
  - null
  - "The command uv python pin 3.13, not in the README, writes a small file called .python-version, and the range shrinks to the 3.13 series."
  - null
  - null
S11:
- en: "Now the packages. A quick puzzle: pyproject.toml lists 2 dependencies, and in part 1, pip installed 12 packages for them. How many will uv install?"
  zh:
  - "接下来看包。"
  - "先出个小题：pyproject.toml 列了 2 个依赖，第一部分里，pip 为它们装了 12 个包。"
  - "那 uv 会装几个？"
  say:
  - null
  - "先出个小题：pyproject 点 toml 列了两个依赖，第一部分里，pip 为它们装了 12 个包。"
  - null
- en: "It's 11: one fewer than part 1. It resolved 13 and installed 11, each with a plus sign and an exact version. So where did the other 9 come from, and which one went missing?"
  zh:
  - "是 11 个：比第一部分少一个。"
  - "解析了 13 个，装了 11 个，每个都带一个加号和精确版本。"
  - "另外 9 个从哪儿来，少的又是哪一个？"
- en: "Packages have dependencies of their own; this extra command, uv tree, draws them. Our googletrans needs httpx, an HTTP library, which needs anyio, certifi, httpcore, h2, and more. Two wishes grow into a tree."
  zh:
  - "包自己也有依赖；这条额外的命令，uv tree，会把它们画出来。"
  - "我们的 googletrans 需要 httpx，一个 HTTP 库；它又需要 anyio、certifi、httpcore、h2，还有更多。"
  - "两个愿望，长成了一棵树。"
- en: "Resolving means choosing one exact version for every package in the tree, versions that all fit together. Then uv writes them to a new file, uv.lock, with download addresses and checksums. The pyproject.toml file is your wish list. The uv.lock file is the receipt."
  zh:
  - "所谓解析，就是给依赖树里的每个包选定一个精确版本，而且这些版本要彼此兼容。"
  - "然后 uv 把它们写进一个新文件 uv.lock，连同下载地址和校验和。"
  - "这个 pyproject.toml 文件是你的愿望清单。"
  - "而 uv.lock 文件是购物小票。"
  say:
  - null
  - "然后 uv 把它们写进一个新文件 uv 点 lock，连同下载地址和校验和。"
  - "这个 pyproject 点 toml 文件是你的愿望清单。"
  - "而 uv 点 lock 文件是购物小票。"
- en: "So why 13 resolved? It's 11 packages, plus the app itself, which uv doesn't download. The 13th is in uv.lock, which covers every Python the project allows, not just ours. In it, anyio needs typing extensions, but only on Python older than 3.15."
  zh:
  - "那为什么解析了 13 个？"
  - "是 11 个包，加上这个应用本身，uv 不用下载它。"
  - "第 13 个在 uv.lock 里：它覆盖了项目允许的每一个 Python，不只是我们这个。"
  - "文件里写着，anyio 需要 typing-extensions，但只在低于 3.15 的 Python 上。"
  say:
  - null
  - null
  - "第 13 个在 uv 点 lock 里：它覆盖了项目允许的每一个 Python，不只是我们这个。"
  - "文件里写着，anyio 需要 typing extensions，但只在低于三点十五的 Python 上。"
  en_display:
  - null
  - null
  - null
  - "In it, anyio needs typing-extensions, but only on Python older than 3.15."
- en: "On our 3.15, it's skipped, so 11. Part 1 ran on Python 3.11, so pip installed it: 12. And on Debian 13, with Python 3.13, uv installs 12 too."
  zh:
  - "在我们的 3.15 上跳过了，所以是 11 个。"
  - "第一部分是 Python 3.11，所以 pip 装了它：12 个。"
  - "而 Debian 13 用的是 Python 3.13，uv 也装了 12 个。"
  say:
  - "在我们的三点十五上跳过了，所以是 11 个。"
  - "第一部分是 Python 三点十一，所以 pip 装了它：12 个。"
  - "而 Debian 13 用的是 Python 三点十三，uv 也装了 12 个。"
- en: "Here's why the receipt matters. Two students run uv sync a week apart. Without a shared lock, each resolves fresh and may get different versions deep in the tree. With the same uv.lock, they get exactly the same packages."
  zh:
  - "再说说小票为什么重要。"
  - "两个同学隔一周各跑一次 uv sync。"
  - "没有共用的 lock 文件，各自从头解析，树的深处就可能版本不同。"
  - "有了同一个 uv.lock，他们拿到的包就完全一样。"
  say:
  - null
  - null
  - null
  - "有了同一个 uv 点 lock，他们拿到的包就完全一样。"
- en: "Two extra checks. First, ls dash a shows two new things: the dot venv folder, and uv.lock. And git status says uv.lock is untracked. It was made here; it didn't come with the repo."
  zh:
  - "两个额外检查。"
  - "第一，ls -a 显示多了两样东西：.venv 目录和 uv.lock。"
  - "而 git status 说，uv.lock 还没被跟踪。"
  - "它是这里生成的，不是 repo 自带的。"
