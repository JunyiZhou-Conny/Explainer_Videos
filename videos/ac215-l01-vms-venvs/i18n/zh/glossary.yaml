- en: Step 3 / step 3 of 10 / line 25 / lines 32 to 37
  zh_subtitle: 第 3 步 / 第 3 步，共 10 步 / 第 25 行 / 第 32 到 37 行
  zh_spoken: ''
  first_use: S02：第 32 到 37 行会接住那次调用的任何错误。
  note: 'No say: needed (edge reads 第 3 步); 行 is a polyphone: listen (F6).'
- en: 'counts: 2 dependencies / 2 packages / installed 12 / installed 11 / resolved 13 / the other 9 / over a hundred packages'
  zh_subtitle: 2 个依赖 / 2 个包 / 装了 12 个 / 装了 11 个 / 解析了 13 个 / 另外 9 个 / 一百多个软件包
