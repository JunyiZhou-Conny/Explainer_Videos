# ---- Versions, codes and numbers
- en: 'Python versions: 3.10 / 3.11 / 3.11.2 / 3.12 / 3.13 / 3.13.5 / 3.14 / 3.15 / 3.15.0'
  zh_subtitle: 3.10 / 3.11 / 3.11.2 / 3.12 / 3.13 / 3.13.5 / 3.14 / 3.15 / 3.15.0
