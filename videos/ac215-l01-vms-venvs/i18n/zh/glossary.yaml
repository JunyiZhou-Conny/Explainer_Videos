  zh_spoken: 零点十三 / 零点十三点零 / 零点十三点三 / 零点二十七点二 / 零点二十八 / 零点二十八点一 / 四点零点二 / 六点五 / 二十三点零点一
  first_use: 'S05：我们的 googletrans 需要 0.27.2 及以上的 httpx（say: 零点二十七点二）。'
  note: As C2.
- en: 'codes: 429 / PEP 668 / AC215 / Python 3 / googletrans 4'
  zh_subtitle: 429 / PEP 668 / AC215 / Python 3 / googletrans 4
  zh_spoken: 四二九 / PEP 六六八 / AC 二一五 / Python 三 / googletrans 四
  first_use: 'S06：原因是状态码 429（say: 四二九）。'
