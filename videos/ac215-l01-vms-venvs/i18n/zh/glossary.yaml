# Chinese (zh-CN) glossary and translation rules for ac215-l01-vms-venvs (AC215 lecture 1, a follow-along
# of dlops-io/simple-translate), code-switching version. Audience: Chinese-speaking AC215 grad students who read
# technical English fluently; register of a Chinese MLOps TA running a lab session.
# Precedents: videos/dwork2006-calibrating-noise/i18n/zh (closest register) and videos/tictactoe-255168/i18n/zh.
# Merges build/review_spoken.md finding S16 (the proposed rows: display = the literal token; say: changed from
# dot/slash/dash to 点/斜杠/杠; shelf 书架 → 架子, receipt 收据 → 购物小票) and the U-S-R note of review_merge_log.
# Voice: edge zh-CN-XiaoyiNeural (toolkit default). The readings are NOT measured yet: edge could not be reached
# from the environment this was written in (rule F5, item I2).
# Human-readable copy in Chinese: GLOSSARY.md (keep the two in sync).
# terms[].zh_subtitle = display form (Chinese subtitle line and on-screen labels);
# terms[].zh_spoken = what the voice says, i.e. the narration.yaml say: form ("" = same as zh_subtitle);
# rules are tagged [A1]..[I4]: A terms, B typography, C numbers, D narration file, E on-screen strings,
# F TTS, G subtitles, H titles/companions, I toolkit work.
# Read by: python -m explainer.i18n check (Latin words allowed in spoken text: every Latin word of zh_spoken,
# zh_subtitle and first_use, plus allowed_spoken_latin) and explainer/subtitles.py (2-3 word English phrases
# of `en` are kept on one English line; 2-7 character Chinese headwords of zh_subtitle are registered in jieba).
video: ac215-l01-vms-venvs
lang: zh-CN (mainland Simplified Chinese)
audience: 'Chinese-speaking AC215 (MLOps & LLMOps) grad students who know Python and basic ML, read technical English fluently, and are new to cloud VMs, virtual environments and uv; they follow along on their own VM. Register of a Chinese MLOps TA running a lab session.'
voice:
  backend: edge
  voice: zh-CN-XiaoyiNeural
  speed: 1.0
policy: 'The Mandarin of a Chinese MLOps TA walking a lab session through the steps, code-switching only where such a speaker really does. The audience are Chinese-speaking AC215 grad students who read technical English fluently and already say 开一台 VM, SSH 进去, 把 repo clone 下来, 激活 venv, uv sync 一下. Every choice passes three tests: what is said in a real lab session; the standard, searchable Chinese name used by the GCP Chinese console and Chinese technical docs; and a reading the Mandarin voice (edge zh-CN-XiaoyiNeural) gets right. (1) Artifacts verbatim: what the viewer types or matches on screen (commands, flags, file and folder names, paths, package names, variables and config keys, names in the code, terminal text and error classes, the English console''s buttons and pages, the README''s section headings) is copied letter for letter into subtitles and labels and spoken in English, with . read 点, / read 斜杠, a flag''s - read 杠, and /usr read ''user'' as the English does; never translated, inflected or quoted. Terminal output, code panels, README quotes and the schematic console stay English; only the explanation is translated. (2) Follow the English: virtual machine → 虚拟机, VM → VM, virtual environment → 虚拟环境, venv → venv; plus a closed list of words Chinese engineers say in English in a lab anyway: shell, root, repo, clone, commit, import, traceback, lock 文件, pin, hypervisor, and the quoted error text externally managed. (3) Everything else in standard Chinese: 终端, 提示符, 命令, 参数, 目录, home 目录, 包, 软件包, 依赖, 包管理器, 解释器, 标准库, 软链接, 环境变量, 管道, 激活, 隔离, 解析, 约束, 范围, 校验和, 容器, 镜像, 接口, 状态码, 限流; GCP concepts with the Chinese console''s names: 区域, 可用区, 机器类型, 启动磁盘, 外部 IP, 结算, 计费. (4) The video''s own metaphors by meaning, one word each: 架子 (一层), 罐子, 公用厨房 and 掌勺的, 工具箱, 门, 愿望清单 and 购物小票, 计价器, 约束不是 pin. (5) Readings as Chinese engineers say them: versions as integer groups (三点十一点二), status codes, PEP numbers and the course number digit by digit (四二九, PEP 六六八, AC 二一五), all in say:. (6) The bilingual subtitles put the English sentence under the Chinese (artifacts the SAY line spells out get their literal form back through en_display), so the Chinese line carries no English glosses; there are exactly three subtitle-only glosses: hypervisor（虚拟机监控器）, externally managed（由外部管理）, 外部 IP（也就是公网 IP）. (7) The toolkit''s constraints are part of the policy: one Chinese sentence per English sentence (118 blocks, 391 sentences), anchors that keep the animation in sync, and a say: field wherever the display is not what the voice should read. Mainland Simplified Chinese; relaxed, clear lab-session speech, never slangy.'
rules:
- '[A1] Code-switching scope. English stays in three places only. (a) Artifacts: literal text the viewer types or looks for on screen. Commands and subcommands (sudo, apt, apt-get, git, pip, pip3, python3, uv, uvx, curl, sh, source, which, ls, cd, gcloud, deactivate, pipenv, uv sync / run / add / tree / python pin), flags (-t, -a, -m, --break-system-packages, --locked), file and folder names (pyproject.toml, uv.lock, .venv, cli.py, pyvenv.cfg, Pipfile.lock, os-release, .python-version, ~/.local/bin, /usr/local), package names (googletrans, art, httpx, anyio, certifi, httpcore, h2, idna, typing-extensions, argparse, asyncio), variables and config keys (PATH, VIRTUAL_ENV, sys.path, site-packages, dist-packages, requires-python, include-system-site-packages, home, prompt), names in the code (Translator, Namespace, main, raise_exception), terminal text and error classes (externally managed, command not found, ModuleNotFoundError, requirement already satisfied), the English console''s buttons and pages (Create instance, VM instances, Disks, SSH, Authorize, Delete, Enable), and the README''s section headings. (b) Products, organisations, the course and names: Google Cloud, GCP, Compute Engine, Debian, Ubuntu, Python, CPython, GitHub, PyPI, Docker, AWS, AC215, Tutorial 0, simple-translate, MLOps Learning, cheese app, JSON, HTTPS, API key, CPU, PEP 668, student. (c) A closed list: VM and venv (following the English, A2), plus the words Chinese engineers say in English in a lab session anyway: shell, root, repo, clone, commit, import, traceback, lock 文件, pin, hypervisor. A new word joins (c) only if Chinese MLOps engineers say it in English in a lab, the Chinese is stiff, ambiguous or collides with another term, and the voice reads it correctly (F5). Everything else is Mandarin (term tables). Never English for flavour: no package, dependency, endpoint, flag, folder, terminal, interpreter, container, image, billing, region, zone.'
- '[A2] Follow the English. virtual machine → 虚拟机, VM → VM; virtual environment → 虚拟环境, venv → venv. Use the full or the short form wherever the English does; definitions always use the full form. Never shorten to 虚拟 or 环境. S01''s ''the word virtual twice'' is the word 虚拟 twice in Chinese. Measure words: 一台 VM / 一台虚拟机, 一个 venv / 一个虚拟环境.'
- '[A3] Exactly three subtitle-only glosses, each at first use: hypervisor（虚拟机监控器） (S03), externally managed（由外部管理） (S01), 外部 IP（也就是公网 IP） (S03). At the end of a clause, never inside a noun phrase; display only, never in say:; an anchor after a gloss needs an explicit anchors: entry (D2). No English glosses on Chinese terms: the English sentence is right below. All three are in part 1; part 2 does not repeat them.'
- '[A4] Written vs spoken pairs. Narration and subtitles say repo / clone / commit / 点; labels, chapter titles, meta.yaml and the companion docs write 仓库 / 克隆 / 提交 / 点击. ''The repo'' as a subject is 这个 repo. Commands are unaffected (git clone stays).'
- '[A5] Writing artifacts. Artifacts are copied verbatim into subtitles and labels (case, dots, slashes, hyphens and underscores unchanged) and read in English (readings: F3); never translated, inflected, quoted, put in 《》 or in code formatting. Add a Chinese head noun where it helps: uv sync 这条命令, pyproject.toml 这个文件, PATH 这个环境变量, .venv 目录, --locked 参数, googletrans 这个包. Never start a sentence with an artifact; put a Chinese word first (而 pipenv shell…, 这个 pyproject.toml 文件…, 输入 uv sync…), for the subtitle and for the voice.'
- '[A6] Disambiguation pairs. 镜像 = container image only, never a Debian mirror (软件源) or a GCP OS image (系统映像). 目录 = folder (.venv 目录, bin 目录); apt''s package catalog is 软件包列表, not 目录. 包 (a Python package, pip/uv) vs 软件包 (an apt package). 依赖 (what pyproject.toml lists) vs 包 (what gets installed). lock 文件 / 锁定 (uv.lock, --locked, locking exact versions) vs pin (uv python pin, 约束不是 pin). 约束 (the >= 3.13 range) vs 精确版本. 提示符 (prompt) vs 提示 (hint, pip''s suggestion). 参数 (flags, command-line arguments) vs 选项 (argparse options, S02 only). 错误 (generic: 两个错误, 第一个错误) vs 异常 (a Python exception) vs 报错 (the error message on screen). 激活 (activate) vs 启用 (enable an API) vs 启动 (start). 停止 (Stop: the disk stays and bills) vs 删除 (Delete). 结算 (Billing, a project with billing on) vs 计费 (billed per second). 外部 IP vs 预留的 IP 地址. home 目录 (~, yours) vs /usr (the system''s, read ''user'', never translated as 用户). 应用 (the app, the concept) vs app (the literal name = "app"). 软链接 vs 链接 (a web link). 解析 serves both resolve and parse (S02); for dependencies say the full 解析依赖. 架子 (shelf, one sys.path folder) vs 工具箱 (toolbox, a venv''s own shelf) vs 工具 (tool, uv itself).'
- '[A7] English words inside Chinese never inflect: no plurals, tenses, articles or possessive ''s (很多包, 两个 venv, uv 的, README 的). Measure words: 一台 VM, 一个 venv, 一个 repo, 一条命令, 一个参数, 一个包, 一个依赖, 一个文件, 一个目录, 一层架子, 一个罐子, 一扇门, 一张小票, 一份愿望清单, 一个 lock 文件, 一个 shell, 一个 traceback, 一行代码 / 一行输出, 一个提示符. Plurals with 这些 / 很多 / 几个, never 们.'
- '[A8] Register: a TA running a lab session. Short instructions, colloquial verbs (装, 跑, 删, 点, 输入); address the viewer as 你 (a one-to-one follow-along; never 您, 大家, 同学们); 我们 is us at recording time (我们录的时候，Google 拒绝了请求). Chinese word order; restructure freely inside a sentence. No translationese: no 让我们… (use 我们来… / 先…), no 这就是为什么… (use 所以…), few 被 passives and chains of 一个…的. No internet slang (yyds, 绝绝子, 一键三连). Carry the spoken rhythm by meaning: Here''s the catch → 问题就在这儿; Now, honestly → 说实话; To be fair → 公平地说; quick and dirty → 简单粗暴; for real → 这次是真的; Fresh matters → 全新很重要.'
- '[A9] Precision. Translate hedges exactly: by default 默认, usually 通常, may 可能, only 只, every 每个, exactly 正好, or newer 及以上, older than 低于, over a hundred 一百多个. ''at the time of recording'' is always 录制时 and never dropped: it tells the viewer the version will change. Versions, counts, line and step numbers match the screen exactly. Errata are gentle (一个小错误) and always followed by the fix. Ponder questions (S05, S10, S11, S13) ask without answering; the wording must not give the answer away (S10 must not say uv will download one).'
- '[A10] Names. Products, companies and course names stay Latin (Google, GitHub, Debian, Ubuntu, Docker, AWS, PyPI, Astral, MLOps Learning, cheese app); 哈佛 only in the titles and description. The username student, the VM name ac215-l01 and the project name app stay. Course: AC215 (say: AC 二一五); Lecture 1 is 第 1 讲 in writing and 今天这节课 in speech; next lecture → 下节课; the L2 tag → 第 2 讲 (L2 where it does not fit); Tutorial 0 stays; part 1 / part 2 → 第一部分 / 第二部分.'
- '[A11] Artifacts verbatim, explanations in Chinese. Terminal output, prompts, the terminal title (ssh · ac215-l01), code panels (comments included: they are the real files the viewer cloned), README quote cards (grey quote, README.md · line N), the schematic console''s English UI text and the README''s section headings (Installing App on VM Manually, Installing App on VM using UV) stay English; only the notes, tags, captions and metaphors around them are translated. Narration paraphrasing the README says README 里说…….'
- '[A12] Mainland Simplified Chinese only: 默认, 程序, 代码, 文件, 目录, 服务器, 网络, 内存, 磁盘, 脚本, 视频, 用户名, 信息; never 預設, 程式, 程式碼, 檔案, 資料夾, 伺服器, 網路, 記憶體, 磁碟, 腳本, 影片, 使用者.'
- '[B1] Spacing. One half-width space between Chinese and Latin letters, digits or artifacts, in subtitles, labels, docs and say: (输入 sudo apt-get update, .venv 目录, PATH 里, 第 3 步, 11 个包, Python 3.11.2, home 目录). The checker reports a missing space in say:, and lexicon respellings need it. Spaces inside an artifact stay as they are (uv python pin 3.13); never add one inside an artifact. No space next to full-width punctuation (……cd simple-translate。). Never fake a no-break space with U+00A0 / U+202F (norm() turns it into a plain space).'
- '[B2] Punctuation. Full-width ，。、；：？！（）“”…… in Chinese text, also next to artifacts (输入 python3 cli.py。). Lists use 、 (anyio、certifi、httpcore、h2). “” only for Chinese tag names (“轮到你了”标签, “额外”标签) and the word “虚拟”; artifacts are never quoted. No 。？！ inside one Chinese sentence (one per English sentence); use ，；： instead. A full-width colon after 第 N 步. Labels have no final 。; questions keep ？. A command''s own quotes, pipe and equals signs appear only on screen; subtitles describe them in words (这根竖线).'
- '[B3] Artifacts and symbols in subtitles. No backticks or code font. A code fragment that is one piece on screen is shown as is (raise_exception=True, python3 -m venv, ls -a, --locked); a relation or operator is said in words: include-system-site-packages 是 false, prompt 是 app; Python 3.13 及以上 (never >=3.13); 大于等于, 双等号; 低于 3.15. Paths as on screen (.local/bin, /usr/local, .venv/bin/activate); ~ appears only in labels and in 这个波浪号.'
- '[B4] Fonts. The toolkit pairs the house fonts with Noto Sans / Serif / Sans Mono CJK SC (explainer/i18n.py CJK_FONTS); Chinese inside a mono label falls back to Noto Sans Mono CJK SC while artifacts keep the house mono. No italics for Chinese (set upright under i18n.active() where the English uses slant=ITALIC); bold is fine.'
- '[C1] Numbers in display text. Arabic digits for everything that echoes the screen, terminal or code: step numbers (第 3 步), line numbers (第 25 行), counts (2 个依赖, 装了 12 个, 11 个包, 解析了 13 个, 另外 9 个), versions, status codes, years. Chinese numerals for small narrative counts and discourse ordinals: 两个项目, 三个部分, 四种方式, 前两级, 一个小错误, 三个额外检查, 五道题, 第一 / 第二 / 第三 (S08''s three parts), 第一部分 / 第二部分, 第一题…第五题. over a hundred → 一百多个.'
- '[C2] Reading versions (say:). Integer groups joined by 点: 3.11.2 三点十一点二, 3.10 三点十, 3.13 三点十三, 3.13.5 三点十三点五, 3.15.0 三点十五点零, 0.13.0 零点十三点零, 0.27.2 零点二十七点二, 0.28.1 零点二十八点一, 0.13.3 零点十三点三, 4.0.2 四点零点二, 6.5 六点五, 23.0.1 二十三点零点一. That is what a version means (3.10 is newer than 3.9 and sits after it on the S10 number line) and how Python people say it; edge reads decimals (三点一零, 三点一一), so every sentence with a version gets say:. The display keeps the digits.'
- '[C3] Codes digit by digit. HTTP status 429 → 四二九 (like 四零四); PEP 668 → PEP 六六八; AC215 → AC 二一五; ac215-l01 → AC 二一五 L 零一; e2-small → e2 small. Major versions as integers: Python 3 → Python 三, googletrans 4 → googletrans 四, Debian 12 → Debian 十二 (edge does it). The date 2026-10-12 is on screen only.'
- '[C4] 两 vs 二. Display 2 个依赖 / 2 个包, say: 两个依赖 / 两个包 (edge says 二个; the tic-tac-toe video measured 二局). A 2 inside a version or a name is 二 (零点二十七点二, e2, h2). Narrative 两 written in characters is unaffected.'
- '[C5] Symbol readings: >= 大于等于; == 双等号; = in code 等于, in config 是; < 低于; | 竖线 (管道); ~ 波浪号; / 斜杠; . in file names, domains and sys.path 点; a flag''s leading - 杠 (-t 杠 t, ls -a ls 杠 a, python3 -m venv python3 杠 m venv); a long flag''s -- is not read (--locked → locked 参数); a hyphen inside a name is not read (apt-get → apt get); brackets are not read: say 外面带括号.'
- '[D1] Sentence alignment (explainer/i18n.py). One entry per SAY line in narration/*.yaml (118 blocks); `en` byte-equal to the SAY line; `zh` has exactly one item per English sentence as split by explainer.voice.split_sentences (391 in this script). Restructure only inside a sentence; never merge or split. Short sentences get their own item: Why refuse? → 为什么要拒绝？; Command not found. → 报 command not found。; ModuleNotFoundError. → 报 ModuleNotFoundError。; What happens? → 会怎么样？; Does it work? → 能导入吗？; What changed? → 变了什么？; Now predict. → 先预测一下。; Something to ponder. → 来想一个问题。 Run python -m explainer.i18n check videos/ac215-l01-vms-venvs --lang zh before any TTS.'
- '[D2] Anchors. Every vo.wait_until phrase that points at an artifact, number, version or term gets an anchors: entry, targeting the display form (pyproject.toml, uv.lock, .venv, PATH, 第 9 步, 429). The target must first occur in the intended sentence: AlignedClip.time_of takes the first sentence of the block that contains it. Artifacts repeat a lot here (uv.lock and pyproject.toml often two or three times per block), so add a neighbouring Chinese word to the target where needed (而 uv.lock, 读 pyproject.toml). Timing is estimated by character position in the display sentence: a long Latin artifact counts every letter as a character but is spoken much faster (source .venv/bin/activate is 25 characters, about 2 s spoken), so later words are estimated late: aim earlier; where say: is longer than the display (三点十一点二 for 3.11.2, 四二九) the opposite holds. Check against word times (Whisper). Where Chinese word order swaps two anchored phrases, the scene waits in the Chinese order under i18n.active().'
- '[D3] Timing. VoiceScene waits for the Chinese clip: longer audio holds the frame, shorter audio leaves silence after fixed-length animations. Keep each block within ±15% of the English: drop redundant connectives, never content. Versions, artifacts and say: expansions lengthen the Chinese; watch S10, S11 and S14 (already slow in English). Check before rendering: python -m explainer.script videos/ac215-l01-vms-venvs/script.md --lang zh (it also fills the TTS cache for the render).'
- '[D4] Content parity. Each Chinese sentence translates its English sentence and nothing more: no added commands, flags, Chinese console names or term explanations; 额外 only where the English marks an extra. The only additions are the three subtitle glosses (A3).'
- '[D5] Fixed spoken patterns. Pause and run it. → 暂停一下，自己跑一遍。 Pause and try it. → 暂停一下，试试看。 Pause here, and get your VM to this point. → 先在这里暂停，把你的 VM 也弄到这一步。 Pause, and catch up to here. → 暂停一下，跟上进度。 Pause until … → 暂停视频，等到…… (等你的终端打开 / 直到提示符以 simple-translate 结尾 / 等它删完). pause to run both / all three → 暂停一下，两条都跑一遍 / 三条都跑一遍. Pause and do it now, before you forget. → 现在就暂停去删，免得忘了。 Something to ponder. → 来想一个问题。 Now predict. → 先预测一下。 A quick puzzle: → 先出个小题：. This command isn''t from the README → 这条命令不是 README 里的. An extra check: / Two extra checks. / Last, an extra: → 额外检查一下： / 两个额外检查。 / 最后再加一个额外步骤：. a small mistake in the README, with an easy fix → README 里有一个小错误，改起来很简单. Step N: → 第 N 步：. Before you go, five questions to test yourself. → 最后，留五道题给你自测。 One: … Five: → 第一题：…… 第五题：. The answers are in the exercises. → 答案在练习里。 Next time: containers. → 下节课：容器。 The card header 暂停想一想 comes from the toolkit (explainer/locales/zh.yaml); the card question is at most two lines and ends in ？; timer seconds unchanged.'
- '[E1] Labels are Chinese: short noun phrases using the narration''s word (架子, 工具箱, 公用厨房, 愿望清单, 小票, 约束不是 pin, 计价器, 门), with → · ≈ allowed. Artifacts inside labels stay (~ = 你的 home 目录, import httpx, 2 个依赖). Labels carry no small English: the English sentence is in the subtitle.'
- '[E2] What stays English on screen (A11): terminal output and prompts, the terminal title, code panels (comments included), the quoted text of README cards, the schematic console''s UI text (page names, buttons, form field names, the confirm dialog ''Delete ac215-l01? …''), the browser address bar, the README section headings, file / package / command chips, the path labels on shelves and doors, version chips. Such strings that go through tr() get identity entries in strings.yaml (section headings, console text, quotes), so build/i18n/missing.zh.json lists only real gaps; code-panel comments get no entries (the Code hook only translates comments that have one).'
- '[E3] README tracker. The head stays as in the README: README › Installing App on VM Manually / README › Installing App on VM using UV. The caption ''step k of N: label'' → 第 k 步，共 N 步：label; '' · extra'' → '' · 额外''. Labels: section A 创建 VM / SSH 登录 / apt-get update / 安装 git / 克隆仓库 / cd / 安装 pip / 安装包 / 运行 / 删除 VM; section B steps 7-10 安装 uv / 重新加载 shell / uv sync / 激活, the rest as in A. Implementation: ideally ReadmeTracker translates the template and the label separately (I1); until then, one re: key per label (''re:step (\d+) of (\d+): Install git'' → ''第 \1 步，共 \2 步：安装 git'') plus one per label with '' · extra''.'
- '[E4] Panel headers. code_panel''s ''path · lines a–b'' / ''path · line n'' via two re: keys: ''re:(.+) · lines (\d+)–(\d+)'' → ''\1 · 第 \2–\3 行'', ''re:(.+) · line (\d+)'' → ''\1 · 第 \2 行''. Custom PANEL headers are translated: uv installer · its last lines → uv 安装脚本 · 最后几行; uv.lock · lines 5–12 (generated on your VM) → uv.lock · 第 5–12 行（在你的 VM 上生成）; ~/.profile line 29 · ~/.bashrc line 115 · added by the installer → ~/.profile 第 29 行 · ~/.bashrc 第 115 行 · 由安装脚本添加. README card headers (README.md · line 62) use the first kind.'
- '[E5] Tag table: ▶ your turn → ▶ 轮到你了; extra · not in the README → 额外 · README 里没有; illustration → 示意; what if → 假设; expected output → 预期输出; real capture · 2026-10-12 → 实际输出 · 2026-10-12; at the time of recording → 录制时; erratum → 勘误; preview → 预览; today → 今天; L2 → 第 2 讲; first time only → 仅首次; package list varies by VM → 软件包列表因 VM 而异; copy it from here → 从这里复制; copy from the README, quotes included → 从 README 复制，连引号一起; your username here → 这里是你的用户名; ~ = your home folder → ~ = 你的 home 目录; not in the repo → 仓库里没有; no activation needed → 不用激活; not executable → 不可执行; just read: no pipenv on this VM → 只看不跑：这台 VM 没装 pipenv; optional · needs the gcloud CLI on your laptop → 可选 · 笔记本上要装 gcloud 命令行工具.'
- '[E6] Unscoped single letters, digits and symbols (Y, ?, 1, 2, 3, L2, xx) never go into strings.yaml: tr() would rewrite every identical string in every scene. Use scene-scoped keys where needed (''s10_which_python|?'': ''？'').'
- '[E7] Colours. Where a scene colours an English sub-string (t2c), the Chinese label must contain that sub-phrase''s Chinese verbatim; artifacts do not change, so colours keyed on them (art, googletrans, uv.lock, .venv/bin) survive. English CAPS emphasis becomes colour or bold on the Chinese.'
- '[E8] Width. A CJK glyph is about 1 em: fit each Chinese label to the English label''s box rather than reuse its font_size; if it does not fit, shorten the Chinese, never cut an artifact. Terminals and code panels keep the English width, rows and positions.'
- '[F1] Voice. The narrator is edge zh-CN-XiaoyiNeural (speed 1.0), the toolkit''s zh default (explainer/build.py DEFAULT_VOICES), so video.yaml needs no languages.zh.voice. In the other two videos it read embedded English words and numbers reliably (an ASR round trip of 417 sentences found no systematic misreading), which is what this artifact-heavy video needs. Publishing: the free Edge endpoint is not licensed for published videos; with AZURE_SPEECH_KEY and AZURE_SPEECH_REGION set the toolkit routes the same voice through the official Azure AI Speech API; the TTS cache is keyed per backend, so the published version re-synthesizes every sentence (re-run D2 and D3). edge takes no custom SSML or pinyin: fix misreadings by rewording or a lexicon.zh.yaml respelling.'
- '[F2] When say: is required. The display text contains any of: a dot in a file name, domain or sys.path (pyproject.toml, uv.lock, cli.py, pyvenv.cfg, Pipfile.lock, translate.googleapis.com); / or ~ in a path (.local/bin, .venv/bin/activate); a flag''s leading - (-t, ls -a, -m) or -- (--break-system-packages, --locked); an underscore (VIRTUAL_ENV, raise_exception); = == >= < | or brackets; a hyphen inside a name (apt-get, python3-pip, site-packages, dist-packages, simple-translate, typing-extensions, pip-tools, e2-small, ac215-l01, .python-version); a CamelCase error name (ModuleNotFoundError); a version number (C2); a code read digit by digit (429, PEP 668, AC215, C3); a 2 before a measure word (C4); a subtitle gloss (A3); usr (read U S R) or xx (read x x). No say: needed for plain commands and names (uv, pip, apt, sudo, git, venv, PATH, Debian 12), 第 3 步, 第 25 行, or counts other than 2.'
- '[F3] Reading table (say:). pyproject.toml pyproject 点 toml; uv.lock uv 点 lock; cli.py cli 点 py; pyvenv.cfg pyvenv 点 cfg; Pipfile.lock Pipfile 点 lock; sys.path sys 点 path; translate.googleapis.com translate 点 googleapis 点 com; .venv 点 venv; .venv/bin/activate 点 venv 斜杠 bin 斜杠 activate; .local/bin 点 local 斜杠 bin; .python-version 点 python version; /usr/local user local; /usr/lib user lib; usr U S R; ~ 波浪号; -t 杠 t; ls -a ls 杠 a; python3 -m venv python3 杠 m venv; --break-system-packages break system packages; --locked locked; VIRTUAL_ENV virtual env; raise_exception=True raise exception 等于 True; include-system-site-packages = false include system site packages 是 false; apt-get apt get; python3-pip python3 pip; site-packages site packages; dist-packages dist packages; simple-translate simple translate; typing-extensions typing extensions; pip-tools pip tools; e2-small e2 small; ac215-l01 AC 二一五 L 零一; AC215 AC 二一五; gcloud g cloud; ModuleNotFoundError Module Not Found Error; xx x x; 429 四二九; PEP 668 PEP 六六八; versions: C2.'
- '[F4] Lexicon. With EXPLAINER_LANG=zh only explainer/lexicon.zh.yaml is loaded (the shared lexicon.yaml is not, so the English entries for uv''s, README''s, sys and pipx do nothing here). Respellings are say:-only and the respelled text is the TTS cache key; matching is case-sensitive and whole-word (a CJK neighbour counts as a boundary), so every Latin word in say: has spaces on both sides (B1). Add an entry only after a listening failure; prepared candidates: README → read me, PATH → path, venv → v env, sudo → soo doo, pyenv → py env, pipx → pip x, uvx → uv x. Never put zh fixes into lexicon.yaml; never change displayed text for the sake of the voice.'
- '[F5] Measurement status and the listening list. When this glossary was written (2026-10-12) edge could not be synthesized in this environment: Bing''s WebSocket handshake returned 403 (the same endpoint''s HTTPS voice list worked), and the toolkit''s EdgeBackend does not hand the HTTPS proxy to aiohttp (I2). So the readings above come from the two precedents and from how Chinese engineers talk, not from measurement. After the first synthesis, run the ASR round trip (faster-whisper large-v3-turbo, language zh) and listen to these, riskiest first: pin (valid pinyin, may come out as 拼; if so, say 固定版本 throughout: 约束不是固定版本, 把它固定下来, and the S10 label likewise; not 锁定, which is the lock-file word); 行 (第 25 行, 那一行, 行号, 最后一行 may come out as xíng; if so, 代码第 25 行, 那句输出); venv, README, PATH (may be spelled out); sudo, repo, curl, gcloud, googletrans, googleapis, pyproject, toml, pyenv, pipx, uvx, MLOps, CPython; python3 and pip3 (expected python 三, pip 三); Module Not Found Error; every version say: (三点十一点二); 四二九, PEP 六六八, AC 二一五. Homophone or case differences in the transcript are fine, and so are Whisper''s own faults (truncated long sentences, names spelled differently).'
- '[F6] Polyphones to check by ear: 行 (háng: 第 25 行, 那一行, 行号, 一行命令; the most frequent here), 重 (chóng: 重新, 重建, 重跑, 重连), 长 (zhǎng: 长成一棵树), 载 (zài: 下载), 得 (děi: 你得先 cd), 还 (hái), 空 (kōng: 空的), 数 (shù: 数轴), 种 (zhǒng: 一种语言), 调 (diào: 调用), 为 (wèi: 因为), 处 (chǔ: 处理). Fix whole words by rewording, never with a per-character rule.'
- '[G1] Bilingual format. Chinese on top (larger), the English SAY sentence below (smaller), paired by narration.yaml, timed by the Chinese audio. Widths in toolkit units: a CJK character 1, a Latin character 0.55 (source .venv/bin/activate ≈ 13.8, include-system-site-packages ≈ 15.4). Write clauses of at most about 24 units; the code splits at 30 (bilingual) and 22 (Chinese-only track).'
- '[G2] Cue endings: drop a cue-final 。，、；：, keep ？！…… and a closing ”） (done in the toolkit, subtitles.strip_end).'
- '[G3] English line (en_display). The SAY lines speak artifacts as words (dot venv, user local, dash t, the locked flag, virtual env, raise exception equals True, sys dot path, translate dot googleapis dot com, x x, U-S-R), so every such sentence gets a hand-written en_display that shows the literal on-screen form (.venv, /usr/local, -t, --locked, VIRTUAL_ENV, raise_exception=True, sys.path, translate.googleapis.com, xx, usr), matching the Chinese line and the picture. Sentences without one show the SAY text. The English video''s own .srt is unaffected.'
- '[G4] Commands are never broken. The subtitle splitter treats a space between two Latin words in a Chinese line as a good cut, so sudo apt-get update, uv python pin 3.13 or source .venv/bin/activate can be split over two lines, which a viewer cannot copy. In writing: put a whole command at the end of a clause after a full-width colon (第 3 步：输入 sudo apt-get update。), at most one command per cue, with little Chinese around it; check every cue with a command in the preview. Toolkit item: I3.'
- '[H1] Titles (meta.yaml). Video, part and chapter titles as in the term table: written register (仓库, 克隆, 提交), questions keep their question mark, the ''uv sync: …'' colon structure is kept, commands and file names stay. Core-concept chapters carry the English short name for search: 租一台电脑：虚拟机（VM）, 虚拟环境（venv）到底是什么.'
- '[H2] Description (Bilibili / YouTube): one paragraph saying this is the AC215 lecture 1 follow-along (simple-translate''s first two walkthroughs), what the viewer learns, links to the study guide, the exercises and the English README, the core terms in both languages (虚拟机 VM, 虚拟环境 venv, lock 文件 uv.lock, 约束 constraint, pin, 解析 resolve, externally managed, PEP 668), and the zh-CN console equivalents (H3). Tags: AC215, MLOps, uv, 虚拟环境, 虚拟机, Python, GCP, 跟练.'
- '[H3] Companions: i18n/zh/README.md and exercises.md (digest.md likewise if made), translated with this glossary and typography in the written register (仓库, 克隆, 提交, 软链接（符号链接）, 幂等, 传递依赖). Headings and <summary>答案</summary> are translated. Two tables at the end: a term table (English | the term used here | common variants: 符号链接, 间接依赖, 锁文件, 端点, 速率限制) and the zh-CN console equivalents (Create instance 创建实例, VM instances VM 实例, Disks 磁盘, Authorize 授权, Delete 删除, Stop 停止, Enable 启用, Billing 结算, Region 区域, Zone 可用区, Machine type 机器类型, Boot disk 启动磁盘, External IP 外部 IP).'
- '[H4] Code and commands stay byte-identical: code blocks, commands, file names and inline `code` in the companions are unchanged; only # comments and the prose around them are translated (comments may be translated there, since they do not quote the repo''s files).'
- '[I1] (todo) ReadmeTracker (explainer/devops.py) builds its caption as one string f"step {k} of {N}: {label}", so strings.yaml needs one re: key per label (E3). Proposal: translate the template (locales/zh.yaml: "step {k} of {n}: {label}": "第 {k} 步，共 {n} 步：{label}"), the label and the '' · extra'' suffix separately with tr(), only under i18n.active(), so the English video is frame-identical.'
- '[I2] (todo) explainer/voice.py''s EdgeBackend does not pass HTTPS_PROXY to edge_tts.Communicate (aiohttp ignores the proxy environment by default), so behind a mandatory proxy it waits until the timeout; pass proxy=os.environ.get("HTTPS_PROXY"). Even with it, on 2026-10-12 Bing answered the WebSocket handshake with 403 in this environment (the HTTPS voice list worked), so zh synthesis has to run on a machine that reaches Bing directly, or through Azure (F1). The bilingual review session (2026-10-12) hit the same 403 after a minute of retries; its egress proxy documents WebSocket upgrades as unsupported, so no setting fixes it there. Its duration check is a model estimate instead (narration/*.yaml headers).'
- '[I3] (todo) explainer/subtitles.py''s _cuts treats a space between Latin words in a Chinese line as a good cut, so commands get split (G4). The two- or three-word commands in this glossary''s en fields (uv sync, uv python pin, git status, pipenv shell) protect English lines only. Proposal: in a Chinese line, treat a run of Latin tokens separated only by spaces as unbreakable unless it alone exceeds a line.'
- '[I4] (note) python -m explainer.i18n check checks say: (else the display text) for brackets, maths symbols (= < > …), names with underscores, missing CJK-Latin spaces, and Latin words not in this glossary''s spoken / subtitle / first-use forms or allowed_spoken_latin. It treats a dotted form like pyproject.toml as one word, so once say: writes pyproject 点 toml, both pyproject and toml must be in this glossary (they are). It does not check: whether a version''s say: matches the display, a 2 before 个 (C4), or Latin words in labels.'
terms:
# ---- VMs, virtual environments, containers
- en: virtual machine / VM
  zh_subtitle: 虚拟机（定义句、概念句）/ VM（具体那台机器、操作步骤、标签）；量词：一台
  zh_spoken: 虚拟机 / VM
  first_use: S01：虚拟机就是一整台你租来、用完就扔的电脑。S01 梯子：在云端 VM 上手动安装
  note: 'Follow the English (A2): virtual machine → 虚拟机, VM → VM. Lab speech says 开一台 VM / SSH 进 VM / 把 VM 删掉; definitions and the S01 pun on ''virtual'' need 虚拟机. Labels prefer the short VM.'
- en: virtual environment / venv
  zh_subtitle: 虚拟环境（定义句、概念句）/ venv（简称、操作语境）；量词：一个
  zh_spoken: 虚拟环境 / venv
  first_use: S01：虚拟环境就是给一个项目专用的一套 Python 包。S08：虚拟环境其实就是一个目录，通常叫 .venv
  note: 'Follow the English: virtual environment → 虚拟环境, venv → venv; Chinese engineers say both. Never shorten to 虚拟 or 环境 (环境 stays for the externally managed environment and 环境变量). The voice''s reading of ''venv'' is unverified (F5).'
- en: hypervisor
  zh_subtitle: hypervisor（首次字幕括注：虚拟机监控器）
  zh_spoken: hypervisor
  first_use: S03：有一种软件叫 hypervisor（虚拟机监控器），它把这台机器切成一片一片。V1 标签：hypervisor
  note: Cloud people say it in English; the textbook name 虚拟机监控器 is a one-time subtitle-only gloss (A3) for search.
- en: server / data center / slice of a server / virtual CPUs / memory / disk / storage network
  zh_subtitle: 服务器 / 数据中心 / 一片（切出来的一块）/ 虚拟 CPU / 内存 / 磁盘 / 存储网络
  zh_spoken: ''
  first_use: S03：虚拟机就是 Google 某个数据中心里，一台真实服务器切出来的一片。
  note: '磁盘 matches the GCP Chinese console (启动磁盘, the Disks page); not 硬盘.'
- en: operating system / OS / OS tools / system libraries (C) / drivers / GPU drivers
  zh_subtitle: 操作系统 / 系统工具 / 用 C 写的系统库 / 驱动 / GPU 驱动
  zh_spoken: ''
  first_use: S08：有些东西 venv 隔离不了：操作系统、用 C 写的系统库，还有驱动。
  note: 'Label ''OS tools'' → 系统工具; speech never shortens 操作系统 to OS.'
- en: container / image / Docker / Dockerfile / Docker image
  zh_subtitle: 容器 / 镜像 / Docker / Dockerfile / Docker 镜像；标签：容器 · 第 2 讲
  zh_spoken: 容器 / 镜像 / Docker / Dockerfile
  first_use: S15：这一层就是容器，下节课讲。S15：今天做的一切，都打包进一个镜像。
  note: 'Standard Chinese. 镜像 means a container image only: Debian mirrors / package sources are 软件源, and a GCP OS image (never spoken) is 系统映像 (A6).'
# ---- Cloud console and billing
- en: Google Cloud / GCP / console / project / Compute Engine / Compute Engine API / enable
  zh_subtitle: Google Cloud（标签可写 GCP）/ 控制台 / 项目 / Compute Engine / Compute Engine API / 启用
  zh_spoken: Google Cloud / 控制台 / 项目 / Compute Engine / Compute Engine API / 点 Enable
  first_use: S03：在控制台里，先确认选中的是你在 Tutorial 0 建的项目，然后打开 Compute Engine，再进 VM instances。
  note: 'Product names stay English; 控制台, 项目, 启用 are the GCP Chinese console''s words. Buttons are named in English (点 Enable, next entry).'
- en: 'console buttons and pages: Create instance / VM instances / Disks / SSH / Authorize / Delete / Stop / Enable'
  zh_subtitle: 示意控制台上保持英文原样；字幕：点 Create instance / 点 SSH / 点 Authorize / 点 Delete / VM instances 页面 / Disks 页面
  zh_spoken: 点 Create instance / 点 SSH / 点 Authorize / 点 Delete / VM instances / Disks
  first_use: S03：点 Create，等绿勾出现，再点 SSH。要是让你授权这次连接，就点 Authorize。
  note: 'What the viewer clicks is named in English, as on the schematic console and in the README''s links. The zh-CN console equivalents (创建实例, VM 实例, 磁盘, 授权, 删除, 停止, 启用) go in the companion README and the description only (H3). Speech says 点, writing says 点击.'
- en: instance / select your instance
  zh_subtitle: 实例
  zh_spoken: ''
  first_use: S07：选中你的实例，点 Delete，暂停视频，等它删完。
  note: 'GCP Chinese console: 虚拟机实例. select your instance → 选中你的实例.'
- en: name / region / zone / machine type / boot disk
  zh_subtitle: 名称 / 区域 / 可用区 / 机器类型 / 启动磁盘
  zh_spoken: ''
  first_use: S03：区域和可用区，就是这台机器实际放在哪里。机器类型决定 CPU 和内存，e2-small 就够用了。启动磁盘选 Debian 12。
  note: 'The standard names in the GCP (and AWS) Chinese docs and console: region 区域, zone 可用区. Speech does not add the English (the English line has it). The schematic form keeps its English field names (E2).'
- en: external IP (address) / Ephemeral / reserved IP address / static IP
  zh_subtitle: 外部 IP（首次字幕括注：也就是公网 IP）/ 临时 / 预留的 IP 地址
  zh_spoken: 外部 IP / 预留的 IP 地址
  first_use: S03：保留外部 IP（也就是公网 IP），它默认就是开着的。S07：预留的 IP 地址也一样一直在计费。
  note: '外部 IP matches the console''s External IPv4; Chinese engineers more often say 公网 IP, glossed once in the subtitle (A3).'
- en: billing / a project with billing on / billed by the second / charging / costs money / estimate
  zh_subtitle: 结算（开通了结算的项目）/ 计费（按秒计费）/ 在花钱 / 费用估算
  zh_spoken: ''
  first_use: S01：一个开通了结算的 Google Cloud 项目。S03：CPU 和内存在 VM 运行期间按秒计费，闲着也照样算。
  note: 'The GCP Chinese console calls Billing 结算 (结算账号); 计费 is the verb. Speech never says ''billing''.'
- en: the meter / cost meter / the meter starts / never stops on its own / stops where it is
  zh_subtitle: 计价器（金色表盘）；计价器开始跳了；自己不会停；停在原处
  zh_spoken: ''
  first_use: S03：从这一刻起，计价器就开始跳了。
  note: 'A taxi meter (打表): it runs while the VM exists. The dial has no digits, so no amounts are said.'
- en: 'Stop vs Delete / delete, don''t stop'
  zh_subtitle: 停止 / 删除；章节：要删除，别只停止
  zh_spoken: ''
  first_use: S07：为什么要删除，而不只是停止？
  note: '停止 = shut down (the disk stays and keeps billing); 删除 = gone, boot disk included.'
- en: SSH / SSH in / SSH window / SSH session / authorize the connection
  zh_subtitle: SSH / SSH 进去 / SSH 窗口 / SSH 会话 / 授权这次连接
  zh_spoken: SSH / SSH 进去 / SSH 窗口
  first_use: S03：然后点 SSH……浏览器里会打开一个终端，已经登录到你的新 VM 上了。
  note: Read as letters; never 安全外壳.
- en: gcloud / the gcloud tool / gcloud compute instances list / gcloud compute disks list
  zh_subtitle: gcloud 命令行工具 / gcloud compute instances list / gcloud compute disks list
  zh_spoken: g cloud 命令行工具 / g cloud compute instances list / g cloud compute disks list
  first_use: S07：如果你笔记本上装了 gcloud 命令行工具，两条额外的命令也能做同样的检查。
  note: 'say: writes ''g cloud'' (how Chinese engineers say it; the joined spelling is a risk).'
- en: Tutorial 0 / service account / keys / a web browser / laptop
  zh_subtitle: Tutorial 0 / 服务账号 / 密钥 / 浏览器 / 笔记本电脑（口语：笔记本）
  zh_spoken: Tutorial 0 / 服务账号 / 密钥 / 浏览器 / 笔记本
  first_use: S01：开始之前，先做完 Tutorial 0。今天不用服务账号，也不用密钥，有个浏览器就行。
  note: 'Tutorial 0 is the course''s name for it; 服务账号 is the GCP Chinese console term.'
# ---- Terminal, shell and apt
- en: terminal / command / one-liner / output / type / press enter
  zh_subtitle: 终端 / 命令 / 一行命令 / 输出 / 输入 / 按回车
  zh_spoken: ''
  first_use: S04：第 3 步：输入 sudo apt-get update。
  note: type → 输入 (not 键入); one-liner → 一行命令.
- en: shell / child shell / subshell / parent shell / reload your shell / this shell only
  zh_subtitle: shell / 子 shell / 父 shell / 重新加载 shell / 只对当前这个 shell 有效
  zh_spoken: shell / 子 shell / 父 shell
  first_use: S09：安装脚本最后几行和第 8 步给了两个办法：重新加载 shell，或者 source 一下 env 文件。
  note: 'Chinese engineers say ''shell'' (外壳 / 壳层 are never used).'
- en: prompt / your prompt now starts with app / your username
  zh_subtitle: 提示符 / 提示符以 app 开头 / 用户名
  zh_spoken: ''
  first_use: S04：注意看提示符：冒号后面现在显示你所在的目录。S12：你的提示符现在以 app 开头，外面带括号。
  note: '提示符 (prompt) is never 提示 (hint). The subtitle says 以 app 开头，外面带括号 rather than showing (app), so no say: is needed.'
- en: root / administrator / full administrator rights / sudo / run as administrator
  zh_subtitle: root / 管理员 / 管理员权限 / sudo
  zh_spoken: root / 管理员 / sudo
  first_use: S01：它是我们的，而且我们有 root 权限，也就是完整的管理员权限。S04：sudo 让它以管理员身份运行。
  note: 'root and sudo stay English; full administrator rights → 完整的管理员权限, run as administrator → 以管理员身份运行. The voice''s ''sudo'' is unverified (F5).'
- en: apt / apt-get / package manager
  zh_subtitle: apt / apt-get / 包管理器
  zh_spoken: apt / apt get / 包管理器
  first_use: S04：Debian 的包管理器是 apt，sudo 让它以管理员身份运行。S04：其中 apt-get 稳定、适合写进脚本，用在 Dockerfile 和自动化构建里；短一点的 apt 手敲起来更友好。
  note: 'say: writes ''apt get'' (hyphens inside names are not read, F3).'
- en: package catalog / list of packages that exist / Debian package / package sources / Debian mirrors
  zh_subtitle: 软件包列表 / 软件包 / 软件源；标签：Debian 软件源
  zh_spoken: ''
  first_use: S04：而 update 会下载软件包列表：有哪些包、各自最新是什么版本。在 Google 的 VM 上会多几行，那是 Google 自己的软件源。
  note: 'What apt manages is a 软件包. ''catalog'' is never 目录 (= folder), ''mirror'' never 镜像 (= container image), see A6.'
- en: home folder / home directory / ~ / the wavy tilde
  zh_subtitle: home 目录 / ~ / 波浪号；标签：~ = 你的 home 目录
  zh_spoken: home 目录 / 波浪号
