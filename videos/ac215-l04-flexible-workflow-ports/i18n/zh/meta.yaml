description: |
  AC215（哈佛 MLOps & LLMOps）第 4 讲“容器 II-b”的跟练视频，分两部分：第一部分照着 dlops-io/mega-pipeline 的 flexible-workflow 分支，建立自己的服务账号、密钥和存储桶，弄清一次调用要过的三道关卡（密钥、角色、API），读懂每个组件的 docker-shell.sh 和它的四种模式，再分清在本地构建镜像和从 Docker Hub 拉取镜像，看懂 run 为什么可能交给你一个 2025 年 2 月的 Python 3.8 镜像，以及怎样不让旧密钥混进镜像。第二部分用 dlops-io/port_toy 讲清容器网络和端口：每个容器都有自己的 localhost，在自建网络上靠名字互相找到，发布的端口、监听的端口和临时端口各是什么，-p 127.0.0.1:8090:9100 的三段怎么读，最后用 Docker Compose 把同一个应用写成一个 docker-compose.yml，并分清 Ctrl+C、down、up -d 和 up -d --build。英文旁白，配中文和中英双语字幕；README 的每条命令都按原样、按顺序出现，终端输出录于 2026-10-14，录制时没有 Google 账号，所以调用 Google 的步骤展示命令、缺少密钥时的真实报错和该看什么。
