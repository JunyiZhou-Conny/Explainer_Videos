# Chinese (zh-CN) glossary and translation rules for ac215-l04-flexible-workflow-ports (AC215 lecture 4,
# Containers II-b: a follow-along of dlops-io/mega-pipeline, branch flexible-workflow, and dlops-io/port_toy),
# code-switching version, SUBTITLES ONLY.
# Audience: Chinese-speaking AC215 grad students who read technical English fluently; register of a Chinese
# MLOps TA running a lab section. Precedents and source of the shared decisions: the series pilot
# videos/ac215-l01-vms-venvs/i18n/zh and the two container lectures before this one,
# videos/ac215-l02-containers-1/i18n/zh and videos/ac215-l03-mega-pipeline/i18n/zh (the subtitles-only
# rule set this file follows). Every term L1-L3 already decided keeps their form; what is new here is the
# networking vocabulary of part 2 (A13) and the words of the flexible workflow (service account, gates,
# build or pull, docker-shell.sh).
# There is NO Chinese voice in this series: the Chinese lines are subtitles on the English timing (the bilingual
# band of output/<id>.zh-en.mp4, <id>.zh.srt, <id>.zh-en.srt / .ass). So no say:, no anchors, no readings, no
# durations, no rules about how numbers or symbols are spoken: only display rules. But
# `python -m explainer.i18n check` still applies its voice hygiene to the displayed line when a sentence has no
# say: (brackets, maths symbols, letter_letter names, Latin words not listed here, a missing half-width space):
# rule D3 is how the Chinese line stays clean without say:.
# Human-readable copy in Chinese: GLOSSARY.md (keep the two in sync).
# terms[].zh_subtitle = the display form (Chinese subtitle line; titles use the written forms of A4);
# terms[].first_use = an example sentence for the translators, as SNN：<one Chinese sentence for one English
# sentence of that block>; each one passes the checker;
# rules are tagged [A1]..[I2]: A terms, B typography, C numbers, D narration file, G subtitles, H titles and
# companions, I toolkit notes. (L1's E on-screen strings and F voice rules do not apply: nothing on screen is
# translated in this series, and there is no voice.)
# Read by: python -m explainer.i18n check (Latin words allowed in the Chinese line: every Latin word of
# zh_subtitle and first_use, plus allowed_spoken_latin, which lists the words as the checker's regex cuts them:
# group-01 is the token group-, amd64 is amd, input-….mp3 is input- and mp, /secrets/mega-pipeline.json is
# secrets and mega-pipeline.json) and explainer/subtitles.py (2-3 word English phrases of `en` are kept on one
# English line; 2-7 character Chinese headwords of zh_subtitle are registered in jieba for every video, so
# zh_subtitle holds terms, not example phrases).
video: ac215-l04-flexible-workflow-ports
lang: zh-CN (mainland Simplified Chinese)
audience: 'Chinese-speaking AC215 (MLOps & LLMOps) grad students who know Python and basic ML, read technical English fluently, did L1 (a VM, venvs, uv), L2 (a given Dockerfile, image vs container, the layer cache, Docker Hub, platforms) and L3 (the five-container mega-pipeline with the course key, bind mounts, uv add); new to owning a service account, wrapper scripts, build-or-pull workflows, container networks, ports and Compose. They follow along on their own laptop with two clones open (mega-pipeline on flexible-workflow, port_toy). Register of a Chinese MLOps TA running a lab section.'
voice: none          # subtitles only (video.yaml: Chinese = i18n/zh/narration/*.yaml on the English timing)
policy: 'The Mandarin of a Chinese MLOps TA walking a lab section through the steps, code-switching only where such a speaker really does, written as subtitles under an English narration. The viewers are Chinese-speaking AC215 grad students who read technical English fluently and already say 起一个 container, 构建 image, pull 下来, push 到 Docker Hub, 把 repo clone 下来, stash 一下, 发布一个 port. Every choice passes three tests: what is said in a real lab section; the standard, searchable Chinese name (Docker, Git and Google Cloud Chinese docs); and consistency with the series (L1 decided the shared words; L2 and L3 the container words). (1) Artifacts verbatim: what the viewer types or matches on screen (commands, flags, file and folder names, paths, image, package and network names, config and Compose keys, environment variables, IAM role names, terminal text and error names, console labels, the on-screen tags, README headings) is copied letter for letter, never translated, inflected or quoted; the exceptions the checker forces are names with an underscore and the characters + < > ( ) =, written the way the narration says them (A6, B3). Nothing on screen is translated in this series: terminal output, code panels, README cards, tags and the tracker stay English; only the narration is. (2) Lab-speech English, a closed list: from L1 VM, venv, shell, root, repo, clone, commit, import, pin; from L2/L3 container, image, Dockerfile, base image, registry, tag (打 tag), push, pull, bucket, pipeline, bind mount, prompt (an LLM prompt only), API, ID; new in L4 port (with host port and container port), localhost, stash, checkout, token (an LLM token only), assert. (3) Everything else in standard Chinese: 构建, 重新构建, 构建步骤 k, 构建器, 层, 缓存, 挂载, 目录, 工作区目录, 组件目录, 终端, 提示符, 脚本, 模式, 参数, 环境变量, 包, 软件包, 分支, 已跟踪, 未跟踪, 被忽略, 服务账号, 密钥, 访问令牌, 角色, 权限, 启用, 结算, 计费, 组件, 阶段, 组名, 网络, 子网, 地址, 连接, 数据包, 发布, 监听, 映射, 请求, 回复, 服务 (a Compose service), 键 (a Compose key), 进程, 信号, 退出码, 前台, 后台, 重新创建. (4) The video''s metaphors by meaning, one word each: 配方 (recipe, from L2), 路标 (signpost, from L3), 窗 (the bind mount, from L3), 盒子 (box), 三堆 and 墙 (piles and walls at a branch switch), 关卡 (gate), 小电脑 (little computer), 局域网 (home network), 电话簿 (phone book), 导轨 (rail), 临街的门 and 房间 (street door and room: host port and container port). (5) Written register for titles, meta.yaml and companion docs: 仓库, 克隆, 提交, 容器, 镜像, 基础镜像, 镜像仓库, 存储桶, 推送, 拉取, 绑定挂载, 端口. (6) The bilingual band puts the English sentence under every Chinese line, so the Chinese line carries no glosses and no brackets at all (the checker forbids them without say:). (7) The toolkit''s constraints are part of the policy: one Chinese sentence per English sentence (156 blocks, 363 sentences), a checker-clean display line (D3), an en_display wherever the SAY spells an artifact out as words (D4). Mainland Simplified Chinese; relaxed, clear lab-section speech, never slangy.'
rules:
- '[A1] Code-switching scope. English stays in three places only. (a) Artifacts, copied letter for letter: commands and subcommands (git clone, git branch, git fetch origin, git checkout, git stash, git stash -u, git diff, git log, grep, ls, cd, cd .., chmod, winpty, exit, python cli.py, ./docker-shell.sh, docker-shell.sh dev / run / prod, docker build, docker run, docker images, docker image rm, docker inspect, docker exec, docker ps, docker ps -a, docker logs, docker login, docker network create, docker network ls, docker network inspect, docker buildx use default, buildx build, docker compose up, up -d, up -d --build, docker compose down, docker compose ps, docker compose ps -a, docker compose exec, docker compose logs -f, docker run hello-world, gcloud config set project, gcloud services enable, uv add, uv sync, pipenv shell, curl, sh), flags (--branch, -u, --help, --rm, --name, --build, --use, -v, -e, -p, -it, -a, -f, -d), file and folder names (Dockerfile, docker-shell.sh, cli.py, pyproject.toml, uv.lock, mega-pipeline.json, docker-compose.yml, .gitignore, .dockerignore, Pipfile, README.md, test.mp3, secrets/, /app, /secrets, /secrets/mega-pipeline.json, /home/app/.venv), branch, image, builder, network, container and account names (main, flexible-workflow, pipenv-flexible-workflow, mega-pipeline, dlops, dlops-io, multi-arch, default, toynet, gateway, processor, hello-world, mega-pipeline-sa), the placeholders the captures use (your-project-id, your-team-bucket, group-01), the modes of docker-shell.sh (dev, run, prod), Compose keys (build, ports, environment, volumes, networks; container_name and depends_on by A6), environment variables (PORT; underscore names by A6), IAM role names (Storage Admin, Agent Platform User, Cloud Speech Client, Cloud Translation API User, Vertex AI User), the apt package ffmpeg (S07, as L3), terminal text and error names (DefaultCredentialsError, AssertionError, Using local image, Local image not found, Creating a Pipfile, the input device is not a TTY, port is already allocated, Empty reply from server, Conflict, Hello from Docker, Exited, ok), the on-screen tags when the narration names them (your turn, extra; A11), the browser button Send and README headings (Get the Code, How to Run a Component, Quick Reference, Prerequisites, Handy commands). The exceptions are names with an underscore and literals the checker rejects (A6, B3). (b) Products, organisations, the course and names: Google, Google Cloud, Cloud Storage, Speech-to-Text, Text-to-Speech, Vertex AI, Gemini, IAM, Docker, Docker Engine, Docker Hub, Docker Compose, Compose, BuildKit, buildx, Git, Git BASH, GitHub, Python, pipenv, uv, gcloud, ElevenLabs, Linux, Mac, Windows, Apple Silicon, amd64, arm64, JSON, IP, AC215, Tutorial 0, MLOps Learning, student, app. (c) A closed list of words Chinese MLOps engineers say in English in a lab section: from L1 VM, venv, shell, root, repo, clone, commit, import, pin; from L2 and L3 container, image, Dockerfile, base image, registry, tag (打 tag), push, pull, bucket, pipeline, bind mount, prompt (an LLM prompt only; the shell prompt is 提示符), API, ID; new here port (host port, container port; A13), localhost, stash (stash 一下, 还在 stash 里), checkout (checkout 成功了; the act of the git checkout command), token (an LLM token only: Gemini 按 token 计费), assert (the Python statement: assert 会拦住你). A word joins (c) only if lab speech really uses the English and the Chinese is stiff, ambiguous or collides with another term. Never English for flavour: no layer, build, cache, mount (the verb), builder, key, credentials, service account, role, permission, gate, network, subnet, address, connection, packet, publish, listen, mapping, request, reply, service (Compose), key (YAML), process, signal, exit code, folder, terminal, script, mode, branch, untracked, ignored, stage, component, flag.'
- '[A2] container and image (as L2 and L3). The subtitles say container and image, as a TA does in the lab: 起一个 container, 构建 image, image 里, container 退出时, 本地 image, Docker Hub 上的 image; measure word 个 (一个 container, 两个 image, 五个 image). Titles, chapter names, meta.yaml and companion docs write 容器 and 镜像 (A4). Never 镜像 in a subtitle (it is also the everyday word for a mirror). base image stays (书面 基础镜像); registry stays (书面 镜像仓库); a Docker Hub repository is 仓库 only in written text (L2). image name → image 名; the dlops image → dlops 的 image; a stale image → 过期的 image; finished images → 做好的 image.'
- '[A3] The rest of Docker in Chinese. build → 构建 (构建 image, 在本地构建, 这次构建); rebuild → 重新构建; build step k (BuildKit''s [k/5], the TEAL badge) → 构建步骤 k, number after the noun, so it never looks like a README step (第 k 步, A7); layer → 层 (系统层, apt 那一层, COPY 那一层); cache → 缓存, cached → 用了缓存 (the terminal word CACHED stays); full log → 完整日志; writing out the image (exporting) → 写出 image; builder → 构建器 (L2), a build engine → 构建引擎, processor types (CPU kinds, S06, S09) → 处理器类型 / 多种处理器 (never processor, which is the port_toy container, A7); mount (verb) → 挂载, both mounts → 两个挂载; bind mount (noun) stays; window (the bind mount, L3) → 窗; run → 运行 / 跑; start a container → 启动 container / 起一个 container; exit → 退出 (the command exit stays); removed → 删掉; recreate → 重新创建; publish (an image) → 发布 (push 到 Docker Hub), publish (a port) → 发布 (A13): the English uses one word for both, so does the Chinese; pull → pull (L2), push → push, tag → tag / 打 tag, log in → 登录; using local image / local image not found: quote the terminal text as it is.'
- '[A4] Written vs spoken pairs. Subtitles say repo / clone / commit / container / image / base image / registry / bucket / bind mount / push / pull / port; titles, chapter names, meta.yaml and the companion docs write 仓库 / 克隆 / 提交 / 容器 / 镜像 / 基础镜像 / 镜像仓库 / 存储桶 / 绑定挂载 / 推送 / 拉取 / 端口. The repo as a subject is 这个 repo. Commands are unaffected (git clone, docker push stay).'
- '[A5] Writing artifacts. Copied verbatim (case, dots, slashes, hyphens unchanged); never translated, inflected, quoted, put in 《》 or code formatting. Add a Chinese head noun where it helps: docker-shell.sh 这个脚本, uv sync 这条命令, secrets 目录, --rm 参数, toynet 这个网络, PORT 变量, volumes 这个键, Storage Admin 这个角色, COPY 那一行. Never start a sentence with an artifact or a kept-English word: put a Chinese word first (输入 docker ps……; 用 -p……; 这个 docker-shell.sh……; 而 git stash……; 在 gateway 里面……), which also keeps the subtitle from opening on a lower-case word. A product name, and README (the course''s word for the file), may open a sentence (Docker 拒绝了……; Compose 构建了两个 image……; Text-to-Speech 不需要角色; README 的提示解决的是第一个原因……).'
- '[A6] Names with an underscore, as L3. The checker reads the display line as speech when there is no say:, and it rejects letter_letter (a voice would read 下划线). The SAY never speaks these names with their underscore either. So the Chinese line writes such a name the way the narration says it: the underscore becomes a space, lower case as in the SAY, always with a Chinese head noun so it reads as a name; or names it by its role where the English only points at it. Table: transcribe_audio → transcribe audio (目录 / 组件 / image); generate_text → generate text; synthesis_audio_en → synthesis audio en (the SAY spells E-N for the voice); translate_text → translate text; synthesis_audio → synthesis audio; input_audios → input audios 目录; text_prompts → text prompts; text_prompts/group-01 → text prompts 下的 group-01; port_toy → port toy (这个 repo / 目录); port_toy-gateway → port toy 加上 -gateway; GOOGLE_APPLICATION_CREDENTIALS → 指向密钥的那个变量 / 路标; GEMINI_MODEL → Gemini 模型变量; PROCESSOR_PORT → processor port 这个变量 (the gateway''s processor port → gateway 的 processor port 变量); DOCKER_USERNAME → 脚本里的 Docker Hub 用户名; container_name → container name 这个键; depends_on → depends on 这个键; group_name → 组名. A command that contains such a name (cd transcribe_audio, cd ../generate_text, cd port_toy) is never written out in the Chinese line: describe it (cd 进 transcribe audio 目录; cd 进 port toy), and the English line gives the literal command through en_display (D4). When the toolkit lets display lines keep underscores (I1), replace the spaced forms with the literals from this table.'
- '[A7] Disambiguation pairs. 第 k 步 (a README tracker step; also the port_toy README''s Step 1-4 sections, as the English says step) vs 构建步骤 k (a BuildKit build step). processor (the port_toy container, a name, stays English) vs 处理器 (a CPU: two processor types → 两种处理器). gateway (the container, a name) vs 关卡 (the gates of S05). 门 (S05: the API doors; part 2: a street door on the laptop = a host port) vs 房间 (a room inside a container = a container port) vs 窗 (a bind mount) vs 窗口 (a terminal or browser window) vs Windows (the OS). 盒子 (a container or an image as a box) vs 配方 (the recipe: Dockerfile, pyproject.toml, uv.lock). 路标 (the key variable in S06; the image tag in S02) vs tag (the tag itself) vs 标签 (an on-screen video tag: your turn 标签). 密钥 (the JSON key file) vs 访问令牌 (the short-lived token made from it; Docker Hub''s access token) vs token (an LLM token: Gemini 按 token 计费) vs 键 (a Compose / YAML key: volumes 这个键). 服务账号 (service account) vs 账号 (a Google or Docker Hub account) vs 服务 (a Compose service; also gcloud services → 服务). 身份 (who you are, gate 1) vs 角色 (what you may do, gate 2) vs 启用 (an API switched on, gate 3). 发布 (publish: a port with -p, or images to Docker Hub) vs 监听 (listen) vs 映射 (the mapping docker ps shows). host port vs container port vs 临时 port (the ephemeral source port, S12). localhost (one machine''s own name for itself) vs 127.0.0.1 (the loopback address, said as digits) vs 0.0.0.0 (所有地址). 网络 (a Docker network) vs 局域网 (the home-network picture) vs 子网 (its address range). 地址 (an IP address) vs 名字 (a container name the phone book resolves). 已跟踪 / 未跟踪 / 被忽略 (Git''s three piles) vs 拒绝 (Git refuses a checkout). 丢弃 (git checkout -- . discards edits) vs 收起来 (git stash puts them away) vs 删除 (rm, docker image rm). 构建 (build) vs 生成 (generate: the Gemini step). 转写 vs 翻译 vs 合成, 上传 / 下载 (to and from the bucket) vs push / pull (to and from Docker Hub), as L3. 退出 (exit a container) vs 停止 (Ctrl-C stops) vs 删除 (down removes) vs 清理 (clean up) vs 拆掉 (tear down). 退出码 (exit code / exit status) vs 状态码 (HTTP status, L1). 应用 (the app, a concept, L1) vs 生效 (apply a change: 再执行 up -d 让它生效). 工作区目录 (the workspace ~/AC215) vs 工作目录 (WORKDIR, L3) vs 组件目录 (a component folder). 提示符 (the shell prompt) vs prompt (a Gemini prompt) vs 提示 (a hint; gcloud 提示……). 错误 (generic) vs 异常 (a Python exception) vs 报错 (the message on screen), as L1.'
- '[A8] Register: a TA running a lab section. Short instructions, colloquial verbs (装, 跑, 删, 敲, 输入, 改, 切, 挪); address the viewer as 你 (one-to-one follow-along; never 您, 大家, 同学们); 我们 is us at recording time (我们录制时没有 Google 账号). Chinese word order; restructure freely inside a sentence. No translationese: no 让我们… (use 我们来… / 先…), no 这就是为什么… (use 所以…), few 被 passives, no chains of 一个…的. No internet slang. Carry the spoken rhythm by meaning: One honest limit → 有一点先说清楚; Look closely at → 仔细看; Here''s why → 原因是这样的; Starting fresh? → 从头开始？; Two puzzles → 两个谜题; the first puzzle, solved → 第一个谜题，解开了; It does, but quietly → 确实失败了，只是悄无声息; without a word → 一声不吭地; the first wall falls → 第一堵墙倒了; Nothing changed → 什么都没变; One aside → 补充一句; Back in the container → 回到 container 里; To finish → 最后; Why do this? → 为什么要这么做？'
- '[A9] Precision. Translate hedges exactly: only 只, every 每个, at once 马上, about 大约 / 约, nearly all 几乎全部, under 不到, or newer 及以上, may 可能, can take minutes 可能要几分钟, never 绝不 / 从不, almost 几乎, however old 不管多旧. at the time of recording is always 录制时 and never dropped (Docker Engine 29.8.2, Python 3.14.8). Versions, sizes, counts, ports, addresses, line, step and build-step numbers match the screen exactly. Errata are gentle and always followed by the fix: a small slip 一个小疏漏, a small gap 一个小缺口, a small inaccuracy 一个小小的不准确, two small slips 两个小疏漏. Ponder questions (S05, S08, S13, S14; the S07 question "Did it call Gemini?") ask without answering, and the wording must not give the answer away: S05 must not say which gate fails; S08 must not name Python 3.8; S13 must not say nobody answers; S14 must not say which variable or that no rebuild is needed. Money: bill your project / your project pays → 记在你项目的账上 / 你的项目付钱; Speech-to-Text bills per audio minute → 按音频分钟数计费; Gemini bills per token → 按 token 计费. The bind-mount wording of L3 A7 is binding: the key is never copied (从不复制), /secrets only shows it while the container runs.'
- '[A10] Names. Products, companies and course names stay Latin (A1 b); 哈佛 only in titles and the description. Course: AC215; lecture n → 第 n 讲 (in lecture 3 → 在第 3 讲里; your clone from lecture 3 → 你第 3 讲的 clone); next lecture → 下节课; this lecture → 这节课; part 1 / part 2 → 第一部分 / 第二部分; Tutorial 0 stays; the instructor → 授课老师 (never a name: the instructor''s group name only inside unchanged capture lines); the course''s project and bucket → 课程的项目和 bucket; the other tutorial → 另一个教程; this course''s tool before uv → 这门课在 uv 之前用的工具. The user names student, app and root, the placeholders your-project-id, your-team-bucket and group-01 stay; a container ID is never read out; a teammate → 队友; a real team → 真正的团队; your team → 你们组 (teams are the course''s groups).'
- '[A11] The screen stays English. This series translates the narration only: terminal output and prompts, terminal titles, code panels (comments included), README cards and chips, the tracker (README › section, step k of N; port_toy README › …), tags (your turn, extra, illustration, expected, erratum, recorded without a key, at the time of recording, stand-in file · not a real key, your numbers will differ, your project pays), captions, the schematic console and the port_toy page are all English, and the scenes need no language changes. So when the narration names an on-screen tag, the subtitle names it as the screen shows it: 黄色的 your turn 标签, 灰色的 extra 标签 (L1 wrote 轮到你了 because it planned translated on-screen tags; L2 and L3 have none). Everything the narration says in its own words is translated: an extra check → 额外检查, the tracker → 进度条, code panels → 代码面板, the full log → 完整日志. Narration paraphrasing the README says README 里说……; a README heading the narration names stays English (Quick Reference 那一节, How to Run 那一节的第 2 步, Handy commands 里的命令, Prerequisites 一节).'
- '[A12] Mainland Simplified Chinese only: 默认, 程序, 代码, 文件, 目录, 服务器, 网络, 内存, 磁盘, 脚本, 视频, 用户名, 信息, 账号, 令牌, 地址, 端口 (written register); never 預設, 程式, 程式碼, 檔案, 資料夾, 伺服器, 網路, 記憶體, 磁碟, 腳本, 影片, 使用者, 帳號, 權杖, 連接埠.'
- '[A13] port and the networking words (new in this lecture). port joins the closed list: the series list (ac215-video skill) keeps it in English, L3 A13 said later lectures take it from that list, and this lecture''s screen and commands are full of it (the PORTS column, the PORT variable, the ports key, port is already allocated, the README''s Step 2: Check the ports and Step 3: Change the ports), so the subtitle word matches what the viewer looks at. Measure word 个 (一个 port, 三个 port 号码 → 三个 port 数字); port 9200 or 9200 这个 port, as the English orders it; 监听 9200 where the English says listens on 9200. host port and container port stay as the pair the README names the fields of -p with (IP 地址、host port、container port); host alone only in host 那一侧 (host side first). localhost stays (a literal host name): whose localhost → 谁的 localhost; its own localhost → 自己的 localhost. Everything else of networking in Chinese: network → 网络; a network you create → 你自己创建的网络; Docker''s default network → Docker 的默认网络; built-in networks → 内置网络; subnet → 子网; address / IP address → 地址 / IP 地址; every address → 所有地址; this laptop only → 只限这台笔记本; connection → 连接; connect / can''t connect → 连 / 连不上; the connection was refused → 连接被拒绝; packet → 数据包; publish (a port) → 发布; published → 发布出去的; listen / listening → 监听; internal only → 只在内部; mapping → 映射; temporary port → 临时 port; destination → 目的地; request → 请求; reply → 回复; hostname → 主机名; other machines on your network → 你所在网络里的其他机器; bind (a port, S16) → 绑定. Written register (titles, meta.yaml, docs): 端口, 端口映射, 发布的端口, 监听端口, 临时端口 (the README''s ephemeral source port: 临时源端口), 宿主机端口 / 容器端口 beside host port / container port.'
- '[A14] Series words this script does not use. Of the series list, volume appears only as the Compose key volumes (an artifact: volumes 这个键; the gateway''s folder is mounted, 挂载, never a volume in Chinese); PATH never comes up (the path of a file is 路径: build paths from pwd → 用 pwd 拼出路径; the key''s path → 密钥的路径); agent appears only inside the role name Agent Platform User; endpoint, embedding, LoRA and CI are not spoken. L5 (ChromaDB, embeddings) takes them from the list.'
- '[B1] Spacing. One half-width space between Chinese and Latin letters, digits or artifacts (输入 docker ps, Python 3.14, 第 9 行, port 9200, 8090 号门, 1.48 GB, secrets 目录, container 里). The checker reports a missing space on every displayed sentence. Spaces inside an artifact stay as they are (docker compose up -d); never add one inside an artifact. No space next to full-width punctuation (……cd 进 port toy。, 用户 app，). Never fake a no-break space with U+00A0 / U+202F.'
- '[B2] Punctuation. Full-width ，。、；：？！“”…… in Chinese text, also next to artifacts (输入 exit。). Lists use 、 (Dockerfile、pyproject.toml 和 uv.lock). No brackets of any kind, neither （） nor () nor 《》 nor 【】 nor <>: the checker rejects them on a line with no say:, and the bilingual band needs no gloss. “” only for a quoted thought or word in Chinese (问它“你是谁”); artifacts, tag names and terminal text are never quoted. No 。？！ inside one Chinese sentence (one per English sentence): use ，；： instead. A full-width colon after 第 N 步 and 构建步骤 N when a description follows. Questions keep ？.'
- '[B3] Symbols the checker rejects (= < > + → ← ^ ≤ ≥ × ÷ ≈, == != +=, a digit followed by !, brackets, letter_letter): never copied into the Chinese line; said in words or written another way. Ctrl+C → Ctrl-C (the other common way to write the key, and what the checker accepts; the English line shows Ctrl+C through en_display); chmod +x → 用 chmod 加上可执行权限 / chmod 那一步; the <your-project-id> placeholder → 占位符, its angle brackets → 尖括号; $(pwd) → pwd; git checkout -- . → git checkout 加上 -- 和一个点 (a lone dot among full-width marks is unreadable, L2); 3.14 or newer → 3.14 及以上 (never >=3.14); Hello from Docker! → Hello from Docker (the ! dropped: the sentence ends with 。). Allowed and kept as on screen: / in paths (/secrets/mega-pipeline.json, cd ..), . in file names and addresses (127.0.0.1, 127.0.0.11, 0.0.0.0), : in an address with a port (localhost:8090, -p 127.0.0.1:8095:9100), - in flags and names, @ (@ 符号后面), * never needed (git branch: 星号在 flexible-workflow 上).'
- '[C1] Numbers in display text. Arabic digits for everything that echoes the screen, the terminal or the code: step numbers (第 2 步, 第 5 步), build steps (构建步骤 2), line numbers (第 7 行, 第 8 和第 9 行, 第 13 和第 14 行, 第 53 行), gate numbers (第 1 关, 第 2 关, 第 3 关: the gates carry numbers on screen), ports (8090, 8091, 8095, 9100, 9200, 9300, 55620), addresses (127.0.0.1, 127.0.0.11, 0.0.0.0), exit codes (退出码 0, 退出码 137), user ID, versions, sizes, times, dates, group-01. Chinese numerals for small narrative counts and ordinals: 两个谜题, 三个值, 五个文件, 四个角色, 五个 API, 三道关卡, 三堆, 两个原因, 两扇窗, 两个 image, 两个 container, 三个额外检查, 第一个谜题, 第一部分 / 第二部分, 第一题……第五题. When the English uses a word for a number the screen shows as a digit, follow the screen; when the screen shows nothing, follow the English (all five → 五个都跑一遍; both → 两个都).'
- '[C2] Units, versions, ports and dates. Sizes as on screen with a half-width space: 1.48 GB, 约 200 MB. Times: 8 秒, 约 50 秒, 不到 1 秒, 约 20 秒, 每个 container 10 秒, 可能要几分钟. Versions with their name: Python 3.8.17, Python 3.14, 3.14.8, Docker Engine 29.8.2, uv 0.13.0. Ranges: 3.14 及以上. Ports and addresses as digits, never in Chinese numerals: port 9200, 8090 号门, 9100 号房间, 127.0.0.1, 0.0.0.0, 127.0.0.11; an address with a port as on screen: localhost:8090 (the SAY says localhost 8090). Dates: 2025 年 2 月 18 日 (February 18, 2025), 2025 年 2 月 (February 2025).'
- '[D1] Sentence alignment (explainer/i18n.py). One entry per SAY line of script.md in narration/*.yaml (156 blocks); `en` byte-equal to the SAY line; `zh` has exactly one item per English sentence as split by explainer.voice.split_sentences (363 in this script). Restructure only inside a sentence; never merge or split. Short sentences keep their own item: Ponder this. → 来想一想。; Pause and run it. → 暂停一下，自己跑一遍。; Two puzzles. → 两个谜题。; Three piles. → 分成三堆。; Nothing. → 什么都没有。; Run it. → 运行它。; Here''s why. → 原因是这样的。; No. → 没有。; To test yourself. → 自测一下。. Run python -m explainer.i18n check videos/ac215-l04-flexible-workflow-ports --lang zh until it prints OK.'
- '[D2] No say:, no anchors. There is no Chinese voice: never write say: (the display line is the only text) and never write anchors: (they only place animation beats for a Chinese-voiced render). The subtitles are timed by the English audio; the toolkit pairs each Chinese sentence with its English sentence by position.'
- '[D3] A checker-clean display line. With no say:, every displayed sentence must pass explainer.i18n.spoken_problems: no brackets (B2), no maths symbols (B3), no letter_letter names (A6), no digit followed by !, no clause ending in 种 followed by ，。！？ (rephrase: 两种方式。 → 有两种方式拿到。 or 两个办法。), a half-width space between Hanzi and Latin or digits (B1), each sentence ending in 。！？ or …… (optionally followed by ” or 」), and every Latin word in this glossary (zh_subtitle, first_use or allowed_spoken_latin). The checker cuts words with the regex [A-Za-z][A-Za-z''.-]*: group-01 is group-, amd64 is amd, arm64 is arm, input-….mp3 is input- and mp, /home/app/.venv is home, app and .venv is venv, Ctrl-C is one word. A Latin word it reports is either an English word to translate (the usual case) or a missing artifact: add the artifact to allowed_spoken_latin, cut the same way, and to the matching term.'
- '[D4] The English line (en_display). In the bilingual band the English line shows the SAY sentence, which spells artifacts out for the voice. Every such sentence gets an en_display item with the literal on-screen form, otherwise word for word the SAY sentence; null for the other sentences of the block. This script''s spoken forms → literals: dash dash branch → --branch; git stash dash u → git stash -u; git checkout dash dash dot → git checkout -- .; git branch: star, flexible-workflow → git branch: * flexible-workflow; test dot mp3 → test.mp3; input, dash, something, dot mp3 → input-something.mp3; dash v / dash e / dash p / dash u / dash i t / dash a / dash f → -v / -e / -p / -u / -it / -a / -f; up dash d → up -d; dash dash r m / dash dash name / dash dash build / dash dash use → --rm / --name / --build / --use; chmod plus x → chmod +x; slash app / slash secrets → /app / /secrets; file slash secrets slash mega-pipeline.json → File /secrets/mega-pipeline.json; default credentials error → DefaultCredentialsError; text prompts, slash group-01 → text_prompts/group-01 (a path the viewer looks for); the at sign → @; T-T-Y → TTY; localhost 8090 → localhost:8090; pipenv flexible workflow → pipenv-flexible-workflow; port toy, dash gateway → port_toy-gateway; Control C → Ctrl+C; dash p 127.0.0.1, 8095, 9100 → -p 127.0.0.1:8095:9100. Blocks (scan of the v2 script; re-run it if the script changes): S03[0,8,9] S04[6,7] S06[4,5,8,9,10] S07[0,2,8,13] S08[9] S09[0,2,3,6] S11[0,3,4,5] S12[0] S13[10] S14[3] S15[1,2,3,8,10,11] S16[0,1,2,4,6,9]. Underscore names (A6) are restored to their literal in en_display only inside a path or command the viewer types or looks for (text_prompts/group-01, port_toy-gateway, synthesis_audio_en in S07[8] may stay spoken); a plain mention keeps the SAY''s spoken form on both lines (transcribe audio, port toy, container name, depends on, the gateway''s processor port). The English video''s own .srt is unaffected.'
- '[D5] Content parity. Each Chinese sentence translates its English sentence and nothing more: no added commands, flags, glosses, Chinese console names or explanations; 额外 only where the English marks an extra; no Chinese gloss of a kept-English term (the English line is right below).'
- '[D6] Fixed patterns. Pause and run it. → 暂停一下，自己跑一遍。 Pause and run both. → 暂停一下，两条都跑一遍。 Pause and run them. → 暂停一下，把它们跑一遍。 Pause and try dev and run yourself. → 暂停一下，自己试试 dev 和 run。 Pause and switch your own clone. → 暂停一下，把你自己的 clone 也切过去。 Pause and edit them. → 暂停一下，把它们改好。 Pause, and set up your account, key and APIs. → 暂停一下，把账号、密钥和 API 都设置好。 Pause, and run all five with your key, checking the bucket after each. → 暂停一下，用你的密钥把五个都跑一遍，每跑完一个就看看 bucket。 Pause and check yours. → 暂停一下，检查你自己的。 Pause, and create yours. → 暂停一下，创建你自己的网络。 Pause and start both. → 暂停一下，把两个都启动。 Pause, send a message, and leave both running. → 暂停一下，发一条消息，两个都别停。 Pause, and test from both sides. → 暂停一下，从两边都试一试。 Pause and move your gateway''s door. → 暂停一下，把你的 gateway 的门也挪过去。 Pause and fix yours. → 暂停一下，把你的也修好。 Pause and clean up. → 暂停一下，清理干净。 Pause, and run the whole cycle. → 暂停一下，把整个流程跑一遍。 Pause and shut it down. → 暂停一下，把它关掉。 Pause at the yellow your-turn tag → 看到黄色的 your turn 标签就暂停; gray extra tags mark commands the README doesn''t have → 灰色的 extra 标签表示 README 里没有的命令. An extra check / Two extra checks / Three extra checks inside / Another handy command / An extra … → 一个额外检查 / 两个额外检查 / 在里面做三个额外检查 / 再来一条 Handy commands 里的命令 / 额外的……. Ponder this. → 来想一想。 Step N: / Step N, … → 第 N 步：/ 第 N 步，……. With your key, look for … → 有密钥的话，要找的是……; With your key, you''d see … → 有密钥的话，你会看到……. A small slip: / A small gap: / Another small gap: / A small inaccuracy: / Two small slips. → 一个小疏漏：/ 一个小缺口：/ 还有一个小缺口：/ 一个小小的不准确：/ 两个小疏漏。 One aside: → 补充一句： To test yourself. → 自测一下。 One: … Five: → 第一题：……第五题： Answers are in the exercises. → 答案在练习里。 Next lecture, … → 下节课，…… In part 2: … → 第二部分：…… Every command is also in the study guide. → 每条命令也都在学习指南里。'
- '[D7] Files. narration/g1.yaml = S01-S09 (part 1, mega-pipeline flexible-workflow), narration/g2.yaml = S10-S16 (part 2, port_toy), the parts of video.yaml; each starts with a comment header (what it covers, the rules it applies: A6 spaced names, B3 written-out symbols, D4 en_display, no say:/anchors) and keeps the script order. Strings in double quotes; YAML-escape a literal double quote or backslash.'
- '[D8] Length on the English timing. The Chinese is read while the English is heard, and the band switches where the English pieces switch (a Chinese piece that would read faster than 9 units a second gets at most 1 s more). Keep each Chinese sentence about as long to read as the English is to hear: as a rule of thumb at most about 2 units per English word (a CJK character 1, a Latin character 0.55), so cut filler connectives and repeated subjects, never content. Long artifacts count (DefaultCredentialsError is 12.7 units, /secrets/mega-pipeline.json 14.9, Cloud Translation API User 14.3): do not repeat them where the English does not; quote a long terminal message by its key words (报 DefaultCredentialsError：找不到 /secrets/mega-pipeline.json 这个文件).'
- '[G1] Widths. Bilingual band: a Chinese line holds at most 30 units, the English line 96 characters; the Chinese-only sidecar (.zh.srt) holds 22 units a line, 2 lines a cue. Write clauses of at most about 24 units, separated by ，；：, so the splitter has clean places to cut; avoid a clause longer than 30 units with no punctuation.'
- '[G2] Cue endings: the toolkit drops a cue-final 。，、；： and keeps ？！…… and a closing ” (subtitles.strip_end). Do not end a sentence on an artifact plus a full stop if a Chinese word can close it (……的 toynet 网络。 reads better than ……toynet。, but both are valid).'
- '[G3] Commands are never broken. The splitter treats a space between two Latin words in a Chinese line as a good cut, so docker network create toynet can land on two lines, which a viewer cannot copy. Put a whole command at the end of a clause after a full-width colon (第 2 步：git fetch origin。), at most one command per cue, with little Chinese around it; a command too long for one line (git clone --branch flexible-workflow with its URL, the docker run lines of S11, gcloud services enable with its five APIs) is not written out in full: name it as the SAY does (git clone，加上 --branch flexible-workflow; 用 gcloud services enable 这条命令把五个都打开) and let the terminal and the English line show it. Check every cue with a command in the rendered .zh.srt.'
- '[H1] Titles (meta.yaml). Video, part and chapter titles in the written register (A4: 容器, 镜像, 仓库, 克隆, 拉取, 推送, 端口, 存储桶); questions keep their question mark; the English colon structure is kept (docker-shell.sh：……, Compose：……); commands, mode names, folder and file names stay as they are, underscores included (meta.yaml is not checked; brackets are fine there). Containers II-b → 容器 II-b (L2 容器 I, L3 容器 II). The chapters follow the English sense, not word for word: S07 five honest errors → 五个真实的报错 (one of the five is a silent exit 0, still a real outcome), S09 a stowaway key → 偷渡的密钥, S12 ports on the wire → 线路上的端口, S15 declared → 声明式写法.'
- '[H2] Description (Bilibili / YouTube): two or three sentences, written register, terms of this glossary: this is the AC215 lecture 4 follow-along of dlops-io/mega-pipeline (branch flexible-workflow) and dlops-io/port_toy; what the viewer does and learns (own service account, key and bucket; the three gates; docker-shell.sh and its modes; build or pull and the stale image; keeping the key out of images; per-container localhost, names on a Docker network, published vs listening ports, -p; Compose); English narration with Chinese and bilingual subtitles, captures dated 2026-10-14, no Google account at recording time.'
- '[H3] Companions: i18n/zh/README.md (and exercises.md / digest.md if made) are translated with this glossary in the written register (仓库, 克隆, 提交, 容器, 镜像, 基础镜像, 镜像仓库, 存储桶, 推送, 拉取, 端口, 端口映射, 绑定挂载（bind mount）, 服务账号, 访问令牌, 临时源端口); brackets and underscores are fine there (not checked). Headings and <summary>答案</summary> are translated. A term table at the end: English | the term used here | common variants (端口 / port, 宿主机端口, 容器端口, 镜像仓库 / 注册表, 服务帐号 → 服务账号, 优雅停止).'
- '[H4] Code and commands stay byte-identical in the companions: code blocks, commands, file names and inline `code` are unchanged; only # comments and the prose around them are translated.'
- '[I1] (request, open since L3) explainer.i18n check applies its voice hygiene (_SPOKEN_BAD: brackets, maths symbols, letter_letter names) to the display line when a sentence has no say:. For a subtitles-only video (this series; video.yaml has no languages.zh.voice and the glossary says voice: none) those checks guard nothing and force A6 and B3 (here: Ctrl-C for Ctrl+C, chmod described, port toy for port_toy). Proposal: skip _SPOKEN_BAD for display-only sentences when the glossary''s voice is none (keep the Latin-word, spacing and sentence-end checks). Then A6 and B3 become: literals verbatim (port_toy 目录, Ctrl+C, chmod +x).'
- '[I2] (todo, from L1 I3) explainer/subtitles.py''s _cuts treats a space between Latin words in a Chinese line as a good cut, so commands can be split (G3). Proposal: in a Chinese line, treat a run of Latin tokens separated only by spaces as unbreakable unless it alone exceeds a line.'
terms:
# ---------------------------------------------------------------- containers, images, build or pull
- en: 'container / containers / a container calls a database container'
  zh_subtitle: 'container / 容器（书面）'
  first_use: 'S02：直接通信的 container，第二部分再讲。'
  note: 'Lab speech (A2, as L2 and L3), measure word 个. Titles, meta.yaml and docs write 容器 (A4).'
- en: 'image / images / local image / the Docker Hub image / the dlops image / finished images'
  zh_subtitle: 'image / 本地 image / 镜像（书面）'
  first_use: 'S01：这条命令来自这节课的 README，在一台从没构建过这个 image 的笔记本上运行：本地没有 image，它就从 Docker Hub pull 一个下来。'
  note: 'Lab speech (A2). Never 镜像 in a subtitle; written register 镜像. image name → image 名; finished images → 做好的 image.'
- en: 'stale image / a February 2025 Python 3.8 image / any local image of that name wins'
  zh_subtitle: '过期的 image / 过期的镜像（书面）'
  first_use: 'S08：实际上，只要本地有同名的 image，不管多旧都会被用上；否则它运行 Docker Hub 上的 image，只在第一次 pull。'
  note: 'stale → 过期的 (L1: 过期的 lock 文件). Chapter S08: dev、run 和一个过期的镜像.'
- en: 'build / build locally / builds / rebuild / a fresh build / the build'
  zh_subtitle: '构建 / 在本地构建 / 重新构建 / 这次构建'
  first_use: 'S08：所以要在本地构建，不带参数或者用 dev；run 只用于你们组从这个分支 push 到你们自己 Docker Hub 账号下的 image。'
  note: 'A3. docker build, buildx build stay. Never build in a subtitle except inside a command or a mode description that quotes the screen.'
- en: 'build or pull / pull / pulls / pulled only the first time / and everyone else pulls'
  zh_subtitle: 'pull / 构建还是 pull / 拉取（书面）'
  first_use: 'S02：后来，一个人把做好的 image 发布到 Docker Hub，其他人都直接 pull。'
  note: 'Lab speech (L2): pull 下来, pull 一个. Written 拉取 (title: 构建还是拉取？).'
- en: 'push / publish / publishes / check what it would publish'
  zh_subtitle: 'push / 发布 / 推送（书面）'
  first_use: 'S09：第 4 步，prod，负责发布。'
  note: 'push stays (L2, L3); publish images → 发布 (the English uses publish for ports too, A13: 发布一个 port). Written 推送.'
- en: 'tag / look closely at the tag / under one tag / signpost'
  zh_subtitle: 'tag / 路标'
  first_use: 'S02：仔细看这个 tag。'
  note: 'tag stays (L2: 打 tag); 标签 is reserved for on-screen video tags (A7). The tag as a signpost → 路标 (L3''s word for the key variable; the same metaphor).'
- en: 'it''s a signpost to one particular image / nothing promises it matches the commit you have'
  zh_subtitle: '路标'
  first_use: 'S02：它是一个路标，指向某一个特定的 image：某一天、用某个版本的配方构建出来的。'
  note: 'Nothing promises it matches the commit you have → 没有任何东西保证它和你手上的 commit 对得上.'
- en: 'recipe / the recipe in Git / not your recipe / some version of the recipe'
  zh_subtitle: '配方'
  first_use: 'S02：项目早期，每个人都用 Git 里的配方自己构建。'
  note: 'L2''s word for the Dockerfile as a recipe; here the recipe card is Dockerfile + pyproject.toml + uv.lock (V1). Not 菜谱.'
- en: 'registry / pulls from the registry'
  zh_subtitle: 'registry / 镜像仓库（书面）'
  first_use: 'S08：一个小小的不准确：README 的概述说 run 会从 registry pull。'
  note: 'L2. Written 镜像仓库.'
- en: 'Docker Hub / Docker Hub account / Docker username / dlops / dlops images'
  zh_subtitle: 'Docker Hub / Docker Hub 账号 / Docker Hub 用户名 / dlops / dlops 的 image'
  first_use: 'S06：第 10 行是密钥在 container 里的路径；第 13 行是 Docker Hub 账号的名字，dlops。'
  note: 'DOCKER_USERNAME → 脚本里的 Docker Hub 用户名 (A6). dlops (the course''s Docker Hub account) vs dlops-io (the GitHub org).'
- en: 'base image / pulls the base image / the Python base image'
  zh_subtitle: 'base image / 基础镜像（书面）'
  first_use: 'S11：你第一次构建时，还会 pull Python 的 base image。'
  note: 'L2: base image stays in subtitles, written 基础镜像.'
- en: 'build step / build step 2 / the system packages / writing out the image'
  zh_subtitle: '构建步骤 / 构建步骤 2 / 系统软件包 / 写出 image'
  first_use: 'S06：有两步占了几乎全部时间：构建步骤 2，也就是系统软件包，还有写出 image；第一次构建还会 pull base image。'
  note: 'A3, A7: BuildKit''s [k/5] is always 构建步骤 k; 第 k 步 is a README step.'
- en: 'layer / system layer / apt layer / copy layer / cached / reuses from the cache'
  zh_subtitle: '层 / 系统层 / apt 那一层 / COPY 那一层 / 缓存 / 用了缓存'
  first_use: 'S07：接下来，synthesis audio en 只用 8 秒就构建好了，它的系统层用了缓存。'
  note: 'L3. the copy line → COPY 那一行; only the copy layer is new → 只有 COPY 那一层是新的.'
- en: 'full log / the full log shows'
