  zh_subtitle: 'GPU Available / 空列表'
  first_use: 'S13[5]：任务跑起来了，日志里 GPU Available 后面是一个空列表。'
  note: 'A10: must not say image or CUDA. A7: GPU Available as printed (en_display GPU Available: []). You add the accelerator to the CPU block → 你在 CPU 那一段里加上加速器. Why? → 为什么？'
- en: 'line 31 sets a CPU image, which has no CUDA / attached, idle, and still billed / exercise 5'
  zh_subtitle: '闲着 / 计费 / 练习 5'
  first_use: 'S13[6]：这块 T4 挂着、闲着，照样计费。'
  note: 'Line 31 sets a CPU image, which has no CUDA → 第 31 行设的是 CPU image，里面没有 CUDA. Exercise 5 lets you try it → 练习 5 让你自己试一试.'
# ---------------------------------------------------------------- S14: two GPUs, one model
- en: 'multi-GPU training / three shapes / one machine with one GPU / one machine with several / several machines / the mirrored strategy / creates one, but only to count GPUs'
  zh_subtitle: '多 GPU 训练 / 三种形态 / MirroredStrategy'
  first_use: 'S14[0]：课上讲的最后一个想法是多 GPU 训练，有三种形态：一台机器一块 GPU，一台机器多块 GPU，以及多台机器。'
  note: 'B4: 三种形态 inside a clause. Today is the middle one, the mirrored strategy → 今天讲中间那种，也就是 MirroredStrategy (exam: the class name written; en_display stays as said). The single-GPU trainer also creates one, but only to count GPUs → 单 GPU 的训练脚本也会创建一个，但只是用来数 GPU.'
- en: 'an identical copy of the model / called a replica / a global batch of 64 / one step''s worth / two halves of 32 / computes gradients on its half'
  zh_subtitle: '拷贝 / 副本 / 全局 batch / 梯度'
  first_use: 'S14[1]：每块 GPU 上都有一份一模一样的模型拷贝，叫作副本。'
  note: 'Here is the idea → 思路是这样的. A global batch of 64, one step''s worth, splits into two halves of 32 → 64 的全局 batch，也就是一步的量，被分成两半，每半 32. Each GPU computes gradients on its half → 每块 GPU 在自己那一半上算梯度.'
- en: 'averaged across a link called all-reduce / take the same step / variables created inside the scope are mirrored / one synced copy per GPU / a model built outside is not mirrored'
  zh_subtitle: 'all-reduce / 取平均 / 复制 / strategy.scope / 同步'
  first_use: 'S14[1]：两份梯度通过一条叫 all-reduce 的连线取平均，两份拷贝走同样的一步，所以一直保持一致。'
  note: 'Variables created inside the scope are mirrored, one synced copy per GPU; a model built outside is not mirrored → 在 strategy.scope 里创建的变量会被复制，每块 GPU 一份同步的拷贝；在外面构建的模型不会被复制 (A2: 复制, never 镜像; A6 strategy.scope).'
- en: 'review cli-multi-gpu.sh first, in README order / one n1-standard-32 machine with two T4s / for 5 epochs / its TensorFlow image is older, 2.14 / cli.sh uses 2.17'
  zh_subtitle: 'cli-multi-gpu.sh / n1-standard-32 / 2.14 / 2.17'
  first_use: 'S14[2]：它申请一台 n1-standard-32 机器，带两块 T4，训练 5 个 epoch。'
  note: 'Review cli-multi-gpu.sh first, in README order; pause and open it → 按 README 的顺序，先看 cli-multi-gpu.sh；暂停一下，打开它 (A18). A small slip: its TensorFlow image is older, 2.14, where cli.sh uses 2.17 → 有一个小疏漏：它的 TensorFlow image 比较老，是 2.14，而 cli.sh 用的是 2.17.'
- en: 'the multi-GPU trainer / the lecture''s three changes / creates the mirrored strategy / multiplies the batch size by the number of replicas / builds and compiles the model inside the scope / Model fit is unchanged'
  zh_subtitle: '多 GPU 训练脚本 / 三处改动 / 乘以 / 副本数 / 编译'
  first_use: 'S14[3]：它把 batch 大小乘以副本数。'
  note: 'Then review the multi-GPU trainer; pause and open it → 然后看多 GPU 训练脚本；暂停一下，打开它. These are the lecture''s three changes → 这就是课上讲的三处改动. It creates the mirrored strategy → 它创建 MirroredStrategy. And it builds and compiles the model inside the scope of the strategy → 并且在 strategy.scope 里构建、编译模型. Model fit is unchanged → 而 model.fit 没变 (A18).'
- en: 'a batch size flag of 32 / 936 training images / steps per epoch / images each GPU sees per step'
  zh_subtitle: 'batch 大小参数 / 每个 epoch / 每一步'
  first_use: 'S14[4]：两块 GPU，batch 大小参数是 32，一共 936 张训练图片。'
  note: 'A6: --batch_size → batch 大小参数 (en_display --batch_size=32). A10: must not say 64 or 15. How many steps per epoch, and how many images does each GPU see per step? → 每个 epoch 有多少步，每块 GPU 每一步看到多少张图片？'
- en: 'the global batch is 64 / 15 steps, the last one partial / 32 images per GPU on each full step / the learning rate stays at 0.001 / two GPUs are not twice as fast / start-up, image pull and download don''t shrink'
  zh_subtitle: '全局 batch / 学习率 / 启动 / 拉取'
  first_use: 'S14[5]：全局 batch 是 64，所以是 15 步，最后一步不满，每个完整的步里每块 GPU 拿 32 张。'
  note: 'Two caveats → 有两点要注意. The learning rate stays at 0.001 while the batch doubles → 学习率还是 0.001，而 batch 翻了一倍. And two GPUs are not twice as fast, because start-up, image pull and download don''t shrink → 而且两块 GPU 不会快一倍，因为启动、拉取 image 和下载都不会变短.'
- en: 'quota for two T4s and 32 virtual CPUs of custom training / the biggest machine of the lecture / check the pricing page first / Here it fails like cli.sh'
  zh_subtitle: '虚拟 CPU / 价目页 / sh cli-multi-gpu.sh'
  first_use: 'S14[6]：你需要所在区域里自定义训练的配额：两块 T4 和 32 个虚拟 CPU。'
  note: 'A gold tag: this is the biggest machine of the lecture, so check the pricing page first → 金色标签：这是这节课最大的机器，所以先看价目页. If your quota came through, pause and run sh cli-multi-gpu.sh → 如果你的配额批下来了，暂停一下，跑 sh cli-multi-gpu.sh (G3). Here it fails like cli.sh, with no active account → 在这里，它和 cli.sh 一样，因为没有激活的账号而失败.'
# ---------------------------------------------------------------- S15: the missing model, shutdown, recap
- en: 'one launcher the README never mentions / cli.py / the Python SDK route / as an extra run / only cli.sh sets the region variable / the missing key file'
  zh_subtitle: 'cli.py / SDK / region 变量 / 启动方式'
  first_use: 'S15[0]：还有一种 README 从没提过的启动方式：cli.py，走 Python SDK 的路线。'
  note: 'As an extra run, it fails at once, because only cli.sh sets the region variable → 额外跑一下，它马上就失败了，因为只有 cli.sh 设置了 region 变量 (A6: GCP_REGION; en_display the GCP_REGION variable). Export it, and it fails at the missing key file → export 之后，它又卡在缺失的密钥文件上.'
- en: 'where is the trained model / the machine is deleted, and the weights with it / nothing calls model save / the model dir flag is ignored / lecture 15 saves the model to a bucket / exercise 4'
  zh_subtitle: 'model.save / model dir 参数 / 练习 4'
  first_use: 'S15[1]：脚本结束时，机器被删掉，权重也跟着没了：没有任何地方调用 model.save，model dir 参数也被忽略了。'
  note: 'A6: model_dir → model dir 参数 (en_display the --model-dir flag); D4 model save → model.save. And where is the trained model? → 那训练好的模型在哪儿？ Lecture 15 saves the model to a bucket; exercise 4 does it today → 第 15 讲会把模型存进 bucket；练习 4 今天就做.'
- en: 'Time to shut down / work through the list / no custom job is running or pending / remove the tarball and experiment folders / docker ps shows nothing left / disconnect the Colab runtimes / delete the model trainer key / rotate your W and B key, which traveled in a job'
  zh_subtitle: '收尾 / 清单 / docker ps / 断开 / 删除 / 轮换'
  first_use: 'S15[2]：该收尾了；暂停一下，照着清单一项项做。'
  note: 'From inside the cockpit, or in the console, make sure no custom job is running or pending → 在驾驶舱里或者控制台上，确认没有自定义任务还在运行或者排队. Remove the tarball and experiment folders too → 也把 tar 包和实验目录删掉. Then exit; an extra docker ps shows nothing left → 然后 exit；额外跑一下 docker ps，什么都没剩. Finish the last W and B run, and disconnect the Colab runtimes → 结束最后一个 W&B run，断开 Colab 的运行时. At the end of term, delete the model trainer key and rotate your W and B key, which traveled in a job → 学期结束时，删掉 model-trainer 的密钥，并轮换你的 W&B 密钥，因为它跟着任务出去过 (G1).'
- en: 'the whole lecture on one map / a run is only as useful as what it keeps / curves need a callback / config goes into wandb init / only the tarball travels / run as the service agent / one GPU needs three switches / two GPUs split the batch and average gradients'
  zh_subtitle: '一张地图 / 服务代理 / 开关'
  first_use: 'S15[3]：一个 run 有多大用处，取决于它存下了什么。'
  note: 'The whole lecture on one map → 整节课都在一张地图上. Curves need a callback; config goes into wandb init → 曲线要靠 callback；config 要放进 wandb.init. Only the tarball travels, into Google''s image, run as the service agent, your key in its arguments → 只有 tar 包会被带过去，装进 Google 的 image，以服务代理的身份运行，你的密钥就在它的参数里. One GPU needs three switches; two GPUs split the batch and average gradients → 一块 GPU 要三个开关；两块 GPU 分开 batch，再平均梯度.'
- en: '5 questions to test yourself / One / Two / Three / Four / Five / what travels / who submits, who runs / split, averaged, and created inside the scope'
  zh_subtitle: '自测题 / 第一题 / 第五题'
  first_use: 'S15[4]：第一题：两张表都没写下来的是什么？'
  note: 'D6: 5 questions to test yourself → 五道自测题. Two: what travels to Vertex AI, and what never does? → 第二题：什么会被带到 Vertex AI，什么从来不会？ Three: why is the config empty? → 第三题：为什么 config 是空的？ Four: who submits, who runs, and where does your key end up? → 第四题：谁提交，谁运行，你的密钥最后到了哪里？ Five: with two GPUs, what is split, averaged, and created inside the scope? → 第五题：用两块 GPU 时，什么被分开、什么被平均、什么在 strategy.scope 里创建？'
- en: 'Answers are in the exercises / lecture 14 serves containers without servers / lecture 15 saves this model and chains the steps / hardware rented, and a log of what you rented it for'
  zh_subtitle: '练习 / 第 14 讲 / 第 15 讲 / 租来的硬件'
  first_use: 'S15[5]：接下来，第 14 讲不用自己管服务器就把 container 部署成服务，第 15 讲会保存这个模型，并把各个步骤串起来。'
  note: 'Answers are in the exercises → 答案在练习里 (D6). Hardware rented, and a log of what you rented it for → 硬件租到了，还有一份记录，写着你租它做了什么.'
