# Chinese (zh-CN) glossary and translation rules for ac215-l13-training-workflows (AC215 lecture 13, Advanced
# Training Workflows; a follow-along of the lecture's two Colab notebooks, A "Cheese Classification Models" and B
# "Experiment Tracking with W&B", and of dlops-io/model-training @ b9aee1c, README Prerequisites to OPTIONAL: Multi GPU
# Training, with the two one-line Dockerfile fixes the README does not contain), code-switching version, SUBTITLES ONLY.
# Audience: Chinese-speaking AC215 grad students who read technical English fluently; register of a Chinese MLOps TA
# running a lab section.
# Precedents and sources of the shared decisions: the series pilot videos/ac215-l01-vms-venvs/i18n/zh (repo, clone,
# commit, pin, shell, root, lock 文件, 笔记本 for the laptop, 软件源 for a Debian mirror, 横幅, 录制时, API key); the
# container lectures L02-L04 (container, image, base image, tag, Dockerfile, 层, 构建, 模拟运行, entrypoint); ac215-l03 and
# ac215-l10 (服务账号, 密钥, 密钥文件, 凭据, 角色, bucket, 挂载, 替身); ac215-l05-rag (权重, 配额, 一个小疏漏 for every
# erratum); ac215-l06-agents-1 (Colab, notebook, 单元格, 运行时, Secrets 面板, Notebook access, 区域, SDK, OpenAI 密钥 →
# here W&B 密钥); ac215-l07 (离线, 课程团队, diff); ac215-l08-llm-finetuning (epoch, batch, loss, 学习率, 微调, 冻结,
# 任务 for a job); ac215-l09-ci-testing (随机种子, 划分, %, the D6 fixed patterns); ac215-l11-data-labeling-versioning
# (the latest follow-along sibling and the model for this file's structure: label for the class labels, the error rule,
# 授课老师, the instructor rule) and, for the lecture's own vocabulary, the exam edition of THIS lecture,
# videos/ac215-l13-exam/i18n/zh (run, 活跃的 run, callback, config, 账本, 一行, 系统图表, 曲线, 包, tar 包, 依赖, 模块,
# 预构建的训练 image, 任务, 自定义任务, 提交, 无服务器训练, 租用, 策略, 副本, 复制 for mirrored, 梯度, all-reduce,
# 全局 batch, 每个副本的 batch, worker pool, 机器类型, 区域; and A6's spaced forms: install requires, find packages,
# init 文件, strategy.scope). Every form those files fixed is kept; what is new here is the notebook vocabulary
# (单元格编号, 划分, 随机种子, 训练集 / 验证集 / 测试集, 微调过的 / 冻结的 MobileNet, 实验目录, Unix 时间), the W&B setup words
# (API key, User Settings, secret, Notebook access, 离线模式, 抽屉, 散落的字典, run ID), the console and identity words
# (配额, 服务代理, 徽章, 加速器, GPU 那一段), the build words (软件源, 归档源, no installation candidate, set -e, 横幅,
# 驾驶舱), the job words (worker pool spec, 任务规格, 十六进制, 分配机器, shell 历史, 轮换, Secret Manager) and the
# multi-GPU words (三种形态, 全局 batch 64, 每块 GPU 32 张).
# The task's suggested English list (container, image, bucket, W&B, run, epoch, batch size, GPU, Vertex AI, custom job,
# service account, tarball, wheel) was weighed against the series: container, image, bucket, W&B, run, epoch, batch,
# GPU and Vertex AI stay English; service account → 服务账号 (L3, L10, L11), tarball → tar 包 and custom job → 自定义任务
# (the exam edition of this lecture, L08's 任务), batch size → batch 大小 (L08, exam), because series consistency wins
# where an earlier episode already decided a Chinese form; wheel is not in this script. Decisions in GLOSSARY.md.
# There is NO Chinese voice in this series (docs/AC215_SERIES.md rule 8): the Chinese lines are subtitles on the
# English timing (the bilingual band of output/<id>.zh-en.mp4, <id>.zh.srt, <id>.zh-en.srt / .ass). So no say:, no
# anchors, no readings, no durations: only display rules. But `python -m explainer.i18n check` still applies its voice
# hygiene to the displayed line when a sentence has no say: (brackets, maths symbols, letter_letter names, Latin words
# not listed here, a missing half-width space): rules A6, B3 and D3 are how the Chinese line stays clean without say:.
# SERIES RULE: the instructor's name never appears in a subtitle, a title or the description (A17).
# Human-readable copy in Chinese: GLOSSARY.md (keep the two in sync; its term tables are generated from this file's
# terms).
# terms[].zh_subtitle = the display form (Chinese subtitle line; titles use the written forms of A13);
# terms[].first_use = an example sentence for the translators, as SNN[k]：<one Chinese sentence for one English
# sentence of SAY block k of scene SNN, k from 0>; each one passes the checker; the narration files reuse them;
# terms[].note = rules. Rules are tagged [A1]..[I2]: A terms, B typography, C numbers, D narration file, G subtitles,
# H titles and companions, I toolkit notes. (L1's E on-screen strings and F voice rules do not apply: nothing on screen
# is translated in this series, and there is no voice.)
# Read by: python -m explainer.i18n check (Latin words allowed in the Chinese line: every Latin word of zh_subtitle and
# first_use, plus allowed_spoken_latin, which lists the words as the checker's regex [A-Za-z][A-Za-z'.-]* cuts them:
# n1-standard-4 is n and standard-, us-central1 is us-central, x86 64 is x, T4 is T, sh -x is sh, -U is U, 0.15.11 has
# no word, W&B is W and B) and explainer/subtitles.py, for EVERY video (2-3 word English phrases of `en` are kept on one
# English line; 2-7 character Chinese headwords of zh_subtitle are registered in jieba, so zh_subtitle holds terms, not
# example phrases).
video: ac215-l13-training-workflows
lang: zh-CN (mainland Simplified Chinese)
audience: 'Chinese-speaking AC215 (MLOps & LLMOps) grad students who know Python and basic ML, read technical English fluently, did L1-L11 (a GCP project with billing, Docker images and containers, docker-shell.sh scripts with bind mounts, Colab training and fine-tuning from L8, the L10 service-account key in a sibling secrets/ folder, buckets, L11''s versioned dataset), and are new to experiment tracking by hand and with W&B, the W&B run lifecycle, turning a notebook into a pip-installable package, Vertex AI custom jobs and prebuilt training images, the identity that submits a job versus the one that runs it, GPU quotas and data-parallel multi-GPU training; they follow along with two Colab copies (notebooks A and B), a clone of model-training, a free W&B account and a GCP project open (this lecture''s Vertex AI jobs bill the project while they run). Register of a Chinese MLOps TA running a lab section.'
voice: none          # subtitles only (video.yaml: Chinese = i18n/zh/narration/*.yaml on the English timing)
policy: 'The Mandarin of a Chinese MLOps TA walking a lab section through two notebooks and one repo, code-switching only where such a speaker really does, written as subtitles under an English narration. The viewers already say 把 repo clone 下来, 起一个 container, 构建 image, 建一个 bucket, 建一个服务账号, 跑 15 个 epoch, batch 大小 32, loss 降下来, 开一个 notebook, 开一个 run, 加一个 callback, config 里; this lecture adds 存一份 notebook 拷贝, 切到 GPU 运行时, 加一个 secret, 拿 run ID 区分, 打 tar 包, 提交一个自定义任务, 申请 GPU 配额, 看 worker pool spec, 换 base image, 做 all-reduce. Every choice passes three tests: what is said in a real lab section; the standard, searchable Chinese name (Google Cloud''s Chinese docs: 服务账号, 服务代理, 配额, 区域, 加速器, 角色; TensorFlow''s Chinese docs: 分布式策略, 副本, 梯度; the ML literature: 实验追踪, 可复现, 微调, 冻结, 训练集, 验证集, 测试集, 随机种子, 学习率; Debian: 软件源, 归档); and consistency with the series (L1-L11 and the exam edition of this lecture: every form they fixed is kept). (1) Artifacts verbatim: what the viewer types or matches on screen (commands, flags, file and folder names, paths, package, image and container names, the service-account name, role names, env vars, console labels, Colab menu items, W&B project and run names, the notebooks'' column names, error text, printed status lines, README headings, versions) is copied letter for letter, never translated, inflected or quoted; the exceptions the checker forces (an underscore, =, < >, + or brackets inside the artifact) are written the way the narration says them (A6) and the English line shows the literal (D4). Nothing on screen is translated in this series: terminal output and prompts, code panels, notebook frames and their stored outputs, README cards, the schematic console, W&B and Colab drawings, the training map, the ledger, the badges, the switchboard, the replicas picture, tags, trackers, lecture tags and the pause-and-ponder cards stay English; only the narration is. (2) Lab-speech English, a closed list: from L1-L11 repo, clone, commit, pin, root, shell, container, image, base image, tag (an image tag), Dockerfile, entrypoint, bucket, API, API key, ID, JSON, CLI, SDK, endpoint, diff, Colab, notebook, pipeline, label (a class label, L11); from L08 and the exam edition epoch, batch, loss, run, callback, config, all-reduce, worker pool; new here release (a GitHub release), secret (a Colab secret), zip, dict, worker pool spec, scope (strategy.scope). (3) Everything else in standard Chinese: 实验追踪, 可复现, 可追责, 记账, 杠杆, 路线图, 里程碑, 基线模型, 账本, 一行, 产物, 托管, 地图, 单元格, 运行时, 数据集, 划分, 训练集, 验证集, 测试集, 随机种子, 微调, 冻结, 做法, 实验目录, 辅助函数, 权重, 结构, 训练历史, 指标, 准确率, 百分点, 系统图表, 曲线, 抽屉, 字典, 离线模式, 替身, 包, tar 包, 依赖, 模块, 命令行参数, 预构建的 image, 任务, 自定义任务, 无服务器训练, 租用, 计费, 机器, 机器类型, 区域, 配额, 服务账号, 服务代理, 密钥, 密钥文件, 角色, 徽章, 驾驶舱, 软件源, 归档源, 横幅, 架构, 模拟运行, 环境变量, 子进程, 十六进制, 加速器, 任务规格, shell 历史, 轮换, 日志, 策略, 副本, 同步, 梯度, 平均, 全局 batch, 学习率, 虚拟 CPU, 收尾. (4) The video''s metaphors by meaning, one word each: 杠杆 (levers), 账本 / 一行 (the ledger and its rows), 地图 (the training map), 这条线 (a lane), 点亮 (light), 抽屉 (the config drawer), 散落的字典 (the loose dictionary), 驾驶舱 (the cockpit), 铭牌 (setup.py as the label pip reads), 徽章 / 挂绳 (badges, the lanyard), 另一栋楼 (a different building), 开关 (switches), 租 (rent). (5) Written register for titles, meta.yaml and companion docs: 仓库, 容器, 镜像, 存储桶, 运行（run）, 回调（callback）, 配置（config）, 轮次（epoch）, 批次（batch）, 训练任务, 自定义训练任务（custom job）, 无服务器训练（serverless training）, 服务账号, 服务代理, 配额, tar 包. (6) The bilingual band puts the English sentence under every Chinese line, so the Chinese line carries no glosses and no brackets at all (the checker forbids them without say:). (7) No person''s name: the instructors → 授课老师 (A17). (8) The toolkit''s constraints are part of the policy: one Chinese sentence per English sentence (106 blocks, 351 sentences), a checker-clean display line (D3), an en_display wherever the SAY spells an artifact out as words (D4), the English clause order kept (D9). Mainland Simplified Chinese; relaxed, clear lab-section speech, never slangy.'
rules:
- '[A1] Code-switching scope. English stays in three places only. (a) Artifacts, copied letter for letter: commands and subcommands as typed (git clone, git diff, sh docker-shell.sh, sh package-trainer.sh, sh cli.sh, sh -x cli.sh, sh cli-multi-gpu.sh, docker run, docker ps, gcloud, gcloud auth list, gsutil, pip, pip list, uv, tar, echo, export, exit), flags (-U, --accelerator-type as the screen shows it; the underscored ones as A6 writes them: model dir, batch size flag), file and folder names and paths (model-training, secrets, /secrets, docker-shell.sh, Dockerfile, setup.py, task.py, package-trainer.sh, cli.sh, cli-multi-gpu.sh, cli.py, pyproject.toml, uv.lock, model-trainer.json, init 文件 for __init__.py, trainer 目录), the module (python -m trainer.task), calls as the narration names them (wandb.init, wandb.config, wandb.finish, wandb.run.save, model.fit; config.update as 一次 update), package and image names (wandb, requests, TensorFlow, scikit-learn, google-cloud-sdk, google-cloud-cli, model-training-cli), Debian code names (bullseye, bookworm), the service-account name (model-trainer), role names (Storage Admin, AI Platform Admin, Vertex AI Administrator), console, Colab and W&B labels (Workbench, Training, Pipelines, Custom jobs, User Settings, Notebook access, Save a copy in Drive), the W&B projects (cheese-app-demo, cheese-training-vertex-ai), the run name 2 block (A6), machine types (n1-standard-4, n1-standard-32), the region (us-central1), architectures (amd64, x86 64: A6), status codes (404, 401, 403), versions (0.31.0, 0.22.2, 0.15.11, 2.14, 2.17), the error and status text the SAY quotes as printed (404 Not Found, no installation candidate, api key not configured, API key must be 40 characters long, yours was 2, Training Job Complete, GPU Available: A7), the lecture''s name for the cockpit (Model Trainer CLI Container), the FROM line, set -e, and the on-screen tags when the narration names them (your turn, extra, recorded, stand-in; A11). (b) Products, organisations, the course and names: AC215, Weights & Biases (first use) and W&B, Google, Google Cloud, Vertex AI, Vertex, Colab, GitHub, Git, Docker, Docker Desktop, Debian, Linux, Mac, Apple Silicon, TensorFlow, Python, MLflow, CUDA, Unix, Secret Manager, MobileNet, Tesla T4, T4, GPU, CPU, JSON, README, Cheese App. (c) A closed list of words Chinese engineers say in English in a lab section: from L1-L11 repo, clone, commit, pin, root, shell, container, image, base image, tag, Dockerfile, entrypoint, bucket, API, API key, ID, JSON, CLI, SDK, endpoint, diff, Colab, notebook, pipeline, label; from L08 and the exam edition epoch, batch, loss, run, callback, config, all-reduce, worker pool; new here release (a GitHub release), secret (a Colab secret: the panel says Secrets), zip, dict (a plain dict, as printed), worker pool spec (the flag''s own word), scope (only in strategy.scope). A word joins (c) only when lab speech really uses the English and the Chinese is stiff or collides with another term (run: 运行 collides with the verb; secret: 密钥 is the key itself; dict: the proof prints dict). Never English for flavour: experiment tracking, reproducibility, ledger, row, folder, split, seed, fine-tuned, frozen, recipe, helper, weights, metrics, accuracy, curves, system charts, drawer, dictionary, offline mode, stand-in, package, tarball, dependency, module, flag, prebuilt image, job, custom job, serverless training, quota, service account, service agent, key, role, badge, cockpit, mirror, archive, banner, architecture, environment variable, accelerator, job spec, shell history, rotate, logs, strategy, replica, gradient, global batch, learning rate, teardown are Chinese (A3, A4, A5).'
- '[A2] Docker and the build, as L2-L11. The subtitles say container and image (the container → 这个 container; Google''s prebuilt TensorFlow image → Google 预构建的 TensorFlow image; the CPU image / the GPU image → CPU image / GPU image; your image never travels → 你的 image 从来不会被带过去), measure word 个; titles, chapter names, meta.yaml and companion docs write 容器 and 镜像 (A13). build → 构建 (it builds → 构建成功; the build stops at line 18 → 构建停在第 18 行; rebuild the image → 重新构建 image); step 2 of 14 → 14 步里的第 2 步; the base → base image (switches the base to bookworm → 把 base image 换成 bookworm); the FROM line → FROM 那一行; amd64 is emulated → amd64 要模拟运行 (L2); the banner → 横幅 (L1); the entrypoint → entrypoint (L11: the entrypoint has no set -e → entrypoint 里没有 set -e); mounts your code and secrets → 挂载你的代码和 secrets; the cockpit (the lecture''s Model Trainer CLI Container, our name for model-training-cli) → 驾驶舱 (our cockpit on your laptop → 你笔记本上的驾驶舱; exit any old cockpit, which holds the name → 先退出旧的驾驶舱，名字还被它占着, L11); the cockpit''s prompt is root → root. mirror (Debian) → 软件源 (L1: 镜像 is never a Debian mirror): the Debian mirror → Debian 软件源, its security mirror → 它的安全更新源, an archive → 归档源; MirroredStrategy''s mirrored → 复制 (A7, exam).'
- '[A3] Experiment-tracking words (the exam edition''s, plus the notebooks''). experiment tracking → 实验追踪; the home-made tracker → 自己动手做的实验追踪工具; a tracker made of folders → 用目录做的实验追踪工具; reproducibility and accountability → 可复现和可追责; bookkeeping → 记账 (the bookkeeping that shows whether it helped → 能看出它有没有用的记账); run (W&B) → run (A7): a run, five runs, its run → 一个 run / 五个 run / 它的 run; the last run → 最后一个 run; run ID → run ID; the run''s config → 这个 run 的 config; finish the run → 结束这个 run; ledger → 账本, row → 一行 (the five rows become five runs → 这五行变成了五个 run); one shared epoch axis → 同一条 epoch 轴; project (W&B) → 项目 (in one project, cheese-app-demo → 都在同一个项目 cheese-app-demo 里); curves → 曲线; loss and accuracy → loss 和准确率; system charts → 系统图表; callback → callback (code that model.fit calls after every epoch → model.fit 在每个 epoch 之后调用的代码; the W&B callback → W&B 的 callback); config → config; the config drawer → config 抽屉; a new, loose dictionary → 一个新的、散落在外的字典; a plain dict → 一个普通的 dict; points the name at → 让这个名字指向; empty → 空的; keys (of a config) → 键 (all four keys → 全部四个键); execution time → 执行时间; offline mode → 离线模式 (L07); the three-line pattern → 三行的写法; start / watch / finish → 开启 / 盯住 / 结束; the API key → API key (L1); user settings on W&B → W&B 的 User Settings; the key icon → 钥匙图标; a secret named exactly as on screen → 一个 secret，名字和画面上一字不差; notebook access on → 打开 Notebook access (L06); signs in → 登录; settings and scores → 设置和分数; the metric files → 指标文件; the model, its weights, its structure, its history and its metrics → 模型、权重、结构、训练历史和指标; seven things: environment, code, data, model, metrics, artifacts and notes → 七样东西：环境、代码、数据、模型、指标、产物和笔记 (exam: 笔记 ≠ 笔记本); logs → 日志; hosted → 托管 (hosted for you → 帮你托管; host it yourself → 自己托管).'
- '[A4] Notebook and dataset words (new in this lecture). notebook A / notebook B → notebook A / notebook B (never notebook A''s: the folder from notebook A → notebook A 的那个目录); cell n → 第 n 个单元格 (the cells, L06; cells 64 and 66 → 第 64 和第 66 个单元格; through cell 32 → 一直到第 32 个单元格; the training cells → 训练的单元格); the runtime → 运行时 (switch the runtime to a GPU → 把运行时切到 GPU; disconnect the Colab runtimes → 断开 Colab 的运行时); save a copy → 另存一份 (never 副本, A7); the course page → 课程页面; stored outputs → 保存下来的输出; the dataset cells → 数据集的单元格; photos → 照片 (1,156 cheese photos → 1156 张奶酪照片); a GitHub release → 一个 GitHub release; labels → label (four cheese labels → 四个奶酪 label; the labels line → label 那一行; a label map → label 映射; L11 A3); the split → 划分 (both splits → 两次划分); to train / validate / test → 训练 / 验证 / 测试 (936 to train → 936 张用来训练; the test set → 测试集; validation set → 验证集); the validation percent / test percent → validation percent / test percent (A6); no seed → 没有随机种子 (L09); graded on → 拿来评分; points (of accuracy) → 个百分点 (one photo is worth 0.86 points → 一张照片值 0.86 个百分点); leads by two photos → 领先两张照片; the winning margin → 领先的差距; fine-tuning / freezing → 微调 / 冻结 (L08); the fine-tuned MobileNet / the frozen MobileNet → 微调过的 MobileNet / 冻结的 MobileNet; recipe → 做法; crowns → 选出……当冠军 (crowns the fine-tuned MobileNet → 选出的冠军是微调过的 MobileNet); the opening / the hook → 开头; a folder named after the current Unix time → 一个以当前 Unix 时间命名的目录; the helper from cell 12 → 第 12 个单元格里的辅助函数; gathers into one table → 汇总成一张表; its top row → 第一行; the best model → 最好的模型; becomes text before sorting → 排序前变成了文本; sorts strings → 按字符串排序; the experiment folders → 实验目录; megabytes of weights per model → 每个模型的权重有多少 MB; a zip → 一个 zip 包; the five training cells → 五个训练单元格; executes → 跑.'
- '[A5] Serverless-training and packaging words (the exam edition''s, plus the follow-along''s). the second half of the lecture → 课的后半部分; Google Cloud''s machine learning platform → Google Cloud 的机器学习平台; three console entries → 控制台里的三个入口 (Workbench, Training, Pipelines verbatim); the custom jobs tab → Custom jobs 标签页; serverless training → 无服务器训练; rent the hardware → 租用硬件 (rent the machine → 租机器; a machine you rent for the length of one job → 一台只租一个任务那么久的机器); nobody sets up a server → 没人去搭服务器; billing stops → 计费就停了; you just don''t manage its lifetime → 你只是不用管它的生命周期; flags → 命令行参数 / 参数 (hard-coded choices → 写死的选项); a tarball → tar 包 (one compressed archive → 一个压缩归档文件; a 4 kilobyte tarball → 一个 4 KB 的 tar 包); packs → 打包; uploads → 上传; job → 任务 (exam, L08: Vertex AI job → Vertex AI 任务; a custom job → 一个自定义任务; the job''s machine / VM → 任务的机器; the job spec → 任务规格); asks Vertex AI for a job → 向 Vertex AI 申请一个任务; prebuilt image → 预构建的 image; installs → 安装; durable → 持久的 (written somewhere durable → 写到某个持久的地方); the internet → 网上; setup.py as the label pip uses → pip 看的铭牌 (never 标签: 标签 is for on-screen tags); declared dependency → 声明的依赖; pinned to 0.15.11 → pin 在 0.15.11; the trainer → 训练脚本 (the repo''s trainer → repo 的训练脚本; the multi-GPU trainer → 多 GPU 训练脚本; Part 2 ships the trainer → 第二部分要把训练脚本送出去); the package script → 打包脚本; eight entries → 八个条目; a fixed name → 固定的文件名; overwrites → 覆盖; the typo → 错字; travels → 被带过去 / 跟着走 (exam); a stand-in → 替身 (L3, L11; tagged as a stand-in → 标成替身; our signed-out stand-in → 我们没有登录的替身); the job''s first step → 任务的第一步; a plain Python 3.10 container → 一个普通的 Python 3.10 container; their helpers → 它们的辅助依赖; cannot even print its help → 连帮助信息都打不出来; the job log → 任务日志; its shape → 它的样子; the code''s own print lines → 代码自己的 print 语句; a stray None → 一个多出来的 None; a gap → 一段空白; the model dir flag is ignored → model dir 参数被忽略了; model save → model.save.'
- '[A6] Artifacts the checker rejects. With no say:, the checker reads the display line as speech and rejects letter_letter names, = < > + and brackets of any kind. So these artifacts are never copied into the Chinese line; they are written the way the narration says them, and the English line shows the literal through en_display (D4). Table: validation_percent / test_percent → validation percent / test percent (the cell sets the validation percent to 0.2 → 这个单元格把 validation percent 设成 0.2); 2_block → 2 block (the two block run / cell → 2 block 那个 run / 那个单元格); mobilenetv2_train_base_True / _False → never written (the SAY says both MobileNet runs → 两个 MobileNet 的 run); train_base → train base (a flag); --model-dir / model_dir → model dir 参数; --batch_size → batch 大小参数 (exam; a batch size flag of 32 → batch 大小参数是 32); --wandb_key → 密钥参数 (the key flag defaults to the text 16 → 密钥参数默认是文本 16); WANDB_KEY → never written (the SAY says your W and B key / the key → 你的 W&B 密钥 / 密钥); GCP_REGION → region 变量 (only cli.sh sets the region variable → 只有 cli.sh 设置了 region 变量); api_key not configured → api key not configured (the error, A7); x86_64 → x86 64; __init__.py → init 文件; find_packages() → find packages (its find packages call → 它的 find packages 调用); wandb.config = {...} and the ${#WANDB_KEY} of the echo are never written (the SAY says the assignment → 这次赋值; the same echo → 同样的 echo); strategy.scope() → strategy.scope; model.save() → model.save; wandb.run.save("test") → wandb.run.save 加上 test 这个词 (the SAY: run save with the word test). When the toolkit lets display lines keep these characters (I1), the literals may replace the spoken forms.'
- '[A7] Error messages and printed status text. This lecture''s viewer matches each error on screen, and every one the SAY quotes is a short contiguous piece of the printed line, so it stays verbatim in the Chinese line with a Chinese frame around it: 404 Not Found (返回 404 Not Found), no installation candidate (google-cloud-sdk 报 no installation candidate), api key not configured (A6; 报 api key not configured), API key must be 40 characters long, yours was 2 (报：API key must be 40 characters long, yours was 2), the printed line Training Job Complete (the SAY says training job complete; written with the code''s capitals, as the screen prints it), GPU Available (its log says GPU available, with an empty list → 日志里 GPU Available 后面是一个空列表). This differs from L11 A7, which translated long lower-case paraphrases; here no SAY paraphrase is longer than the printed words. What the SAY says in its own words is translated: fails with no active account → 因为没有激活的账号而失败 (the printed line is You do not currently have an active account selected; 激活的 keeps it apart from 活跃的 run, A8); gcloud cannot open the key file → gcloud 打不开密钥文件; importing TensorFlow fails → import TensorFlow 失败; the upload fails → 上传失败; fails at the missing key file → 卡在缺失的密钥文件上; gets a 403 on your bucket → 访问你的 bucket 时报 403. Status codes as digits (报 404, 返回 401). Never a paraphrase that changes the cause.'
- '[A8] Disambiguation pairs. run (the noun: a W&B run) ≠ 跑 / 运行 (the verb: 跑一遍, 运行你的训练脚本) ≠ 训练 (training). 任务 (a Vertex AI job) ≠ 第 n 步 (a tracker step, a build step) ≠ 进程. 提交 (submit a job; the quota request: 提交申请) ≠ commit (stays English: one commit in October 2025 → 2025 年 10 月的一次 commit). 副本 (a tf.distribute replica, one per GPU; replica count in the worker pool spec, which there counts machines: one replica, meaning one machine → 一个副本，也就是一台机器) ≠ 拷贝 (an identical copy of the model; save a copy of the notebook → 另存一份; a copy of the files → 一份拷贝) ≠ 复制 (mirrored). 密钥 (a key: the service-account JSON key, the W&B key) ≠ 密钥文件 (the file model-trainer.json) ≠ API key (W&B''s name for its key, said once in S04) ≠ secret (the Colab secret that holds it) ≠ secrets 目录 (the folder) ≠ Secret Manager (the product). 服务账号 (a service account) ≠ 服务代理 (the Vertex AI service agent, a service account Google manages) ≠ 身份 (the identity) ≠ 账号 (a W&B account; no active account → 没有激活的账号). 徽章 (a badge in S11''s picture) ≠ 标签 (only the on-screen tags: your turn 标签, extra 标签, 金色标签; the image tag is tag) ≠ 铭牌 (setup.py as the label pip reads) ≠ label (a cheese label). 活跃的 run (exam) ≠ 激活的账号 (gcloud) ≠ activated (the printed word, S08). 项目 (a Google Cloud project; a W&B project) ≠ repo (the code) ≠ 里程碑 (the course project''s milestone). 目录 (a folder: the experiment folder, secrets 目录) ≠ 归档 (an archive) ≠ tar 包 (the tarball). 笔记本 (your laptop) ≠ notebook (Colab) ≠ 笔记 (notes, one of the seven things). 软件源 (a Debian mirror) ≠ 镜像 (written image) ≠ 复制 (mirrored). 一段 (the GPU block / CPU block of cli.sh: GPU 那一段) ≠ 2 block (the run name). 线 (a lane of the map) ≠ 一行 (a ledger row) ≠ 第 n 行 (a line number). 日志 (logs) ≠ 记录 (a log the run keeps, the verb log) ≠ 账本. 驾驶舱 (the cockpit) ≠ 控制台 (the Google Cloud console). 第 n 个场景 (scene n) ≠ 第 n 讲 (lecture n) ≠ 第一部分 / 第二部分 (the video''s parts) ≠ 练习 n (exercise n) ≠ 第 n 个里程碑.'
- '[A9] Register: a TA running a lab section. Short instructions, colloquial verbs (开, 跑, 存, 切, 填, 改, 删, 敲, 贴, 打包, 传, 交, 收拾); the viewer is 你 (one-to-one follow-along; never 您, 大家, 同学们); 我们 is us at recording time (our stand-in → 我们的替身; we can''t run Vertex here → 我们这里跑不了 Vertex). Chinese word order inside a clause; clause order follows the English (D9). No translationese: no 让我们… (use 我们来… / 先…), no 这就是为什么… (use 所以…), few 被 passives, no chains of 一个…的. No internet slang. Carry the spoken rhythm by meaning: Here is the map → 这是地图; Here is a first answer → 先给第一个答案; Now the home-made tracker → 现在看自己动手做的实验追踪工具; Watch the name → 盯住这个名字; The proof → 证据; Here is the idea → 思路是这样的; Hold that question → 先记着这个问题; Two caveats → 有两点要注意; One more → 还有一点; Time to shut down → 该收尾了; Today it won''t build → 今天它构建不了; Today we light both → 今天两条线都点亮.'
- '[A10] Precision. Translate hedges and quantifiers exactly: only 只, every 每个 / 每次, all 全部, exactly 正好 / 一字不差, about 大约, may 可能, at once 马上, never 从不 / 绝不, by default 默认, partly 部分, still 还是 / 照样, anyway 照样, either way 不管哪种. at the time of recording is always 录制时 and never dropped (S04 0.31.0 vs 0.22.2; S08 the security mirror; S13 both GPU images). The pinned wandb 0.15.11 is said as pin 住 (pinned → pin 在 0.15.11; this old wandb pin → 这个老的 wandb pin), never 录制时. Counts, versions, line numbers, status codes, sizes and percentages match the screen exactly; ours vs yours is kept (40 for our placeholder → 我们的占位密钥是 40). Errata are gentle and always followed by the fix, with one phrase for every one, as L5, L9-L11: A small slip → 有一个小疏漏 (S03 both splits, S03 the string sort, S08 the README copy of docker-shell.sh, S08 activated, S10 the README''s GPU-first order, S14 the older image); To put it kindly, not with this code → 说得客气点，用这份代码做不到. The honest note of S07 (no Google credentials, no W&B account, no GPU, no browser; the key in the listing is an obviously invalid stand-in moved out before the container starts; each cloud step shows the failure a misplaced key gives; successes come from named sources) is said as plainly as the English, never apologetic and never hidden. Ponder and quick-predict questions (S03[2], S04[4], S05[2], S06[5], S07[7], S08[3], S09[5], S10[4], S11[2], S12[4], S13[5], S14[4]) ask without answering, and the wording must not give the answer away: S03[2] must not name the test percent; S04[4] must not say callback; S05[2] must not say empty; S06[5] must not name Colab or the job''s container; S07[7] must not say zero; S08[3] must not say line 2, FROM or bullseye; S09[5] must not say which one; S10[4] must not name who; S11[2] must not name the service agent; S12[4] must not list items; S13[5] must not say image or CUDA; S14[4] must not say 64 or 15. The answers in the next block keep the English order and give the answer first, as the English does.'
- '[A11] The screen stays English. This series translates the narration only: terminal output and prompts, terminal titles, code panels (comments included), notebook frames and stored outputs, README cards, the seven trackers (Notebook A › Cheese Classification Models, model-training › Run Container …), the lecture tags (Lecture 13 · slides a–b), tags (your turn, extra, extra · local stand-in, extra · clean-up, illustration, recorded, stand-in, erratum, at the time of recording, the GOLD cost tags), chips (replace this with yours …), the schematic console, Colab and W&B drawings, the training map, the ledger, the config drawer, the tarball trip, the three badges, the GPU switchboard, the replicas picture and the pause-and-ponder and quick-predict cards are English, and the scenes need no language changes. When the narration names an on-screen tag, the subtitle names it as the screen shows it or by its colour: a gold tag → 金色标签; a yellow tag → 黄色标签; tagged as a stand-in → 标成替身. Everything the narration says in its own words is translated: the map → 地图, the ledger → 账本, an extra → 额外检查 / 额外跑一下 / 额外步骤, the honest note → 如实说一句, the badges → 徽章, the switches → 开关, the chip lights → 芯片亮起来.'
- '[A12] Mainland Simplified Chinese only: 默认, 程序, 代码, 文件, 目录, 数据, 数据集, 服务器, 网络, 脚本, 视频, 用户, 信息, 账号, 密钥, 凭据, 函数, 参数, 内存, 进程, 子进程, 变量, 字典, 单元格, 浏览器, 网页, 软件源, 归档, 架构, 模拟, 配额, 加速器, 日志; never 預設, 程式, 程式碼, 檔案, 資料夾, 資料, 資料集, 伺服器, 網路, 腳本, 影片, 使用者, 訊息, 帳號, 金鑰, 憑證, 函式, 引數, 記憶體, 行程, 變數, 字典檔, 儲存格, 瀏覽器, 鏡像站, 封存, 架構, 模擬, 配額 in traditional forms.'
- '[A13] Written vs spoken pairs. Subtitles say repo / clone / commit / container / image / bucket / notebook / run / callback / config / epoch / batch / loss / worker pool; titles, chapter names, meta.yaml and the companion docs write 仓库 / 克隆 / 提交 / 容器 / 镜像 / 存储桶 / Colab 笔记本（notebook）/ 运行（run）/ 回调（callback）/ 配置（config）/ 轮次（epoch）/ 批次（batch）/ 损失（loss）/ 工作器池（worker pool）, with the English in brackets at the first use of a core concept (brackets are fine outside the narration). 实验追踪, 无服务器训练, 服务账号, 服务代理, 配额, 密钥, tar 包, 训练任务, 自定义训练任务（custom job）, 全局批次, 副本, 梯度 are the same in both (subtitles say 任务 and 自定义任务; written 训练任务). Titles add the English short name once for search where video.yaml''s publish.title_zh does (W&B, Vertex AI, MirroredStrategy, serverless training).'
- '[A14] The cloud and identity words, as L3, L10 and L11. the console → 控制台; enable the Vertex AI API → 启用 Vertex AI API; GPU quota → GPU 配额 (L5; an allowance per region → 每个区域的额度; request → 申请; filter for → 筛选; set a new limit → 设一个新的上限; approval may take hours or be refused → 审批可能要好几个小时，也可能被拒); region → 区域 (exam, L06); a secrets folder → 一个 secrets 目录; beside the repo, never inside it → 放在 repo 旁边，绝不放在里面; the identity → 身份; service account → 服务账号 (a service account called model-trainer → 一个叫 model-trainer 的服务账号); roles → 角色 (with Storage Admin, AI Platform Admin and Vertex AI Administrator → 角色是 Storage Admin、AI Platform Admin 和 Vertex AI Administrator); one JSON key → 一个 JSON 密钥; the key file → 密钥文件; Google credentials → Google 凭据; the service agent → 服务代理 (your project''s Vertex AI service agent → 你项目的 Vertex AI 服务代理; a service account Google manages → 由 Google 管理的服务账号); by default the job runs as it → 任务默认以它的身份运行; can open buckets in the same project → 能打开同一个项目里的 bucket; grant access → 授予访问权限; who submits, who runs → 谁提交，谁运行; badges → 徽章, the middle lanyard → 中间那根挂绳, a different building altogether → 完全是另一栋楼; carried by hand → 手动带进去; your private bucket → 你的私有 bucket; a bucket with your own name → 用你自己的名字建一个 bucket; our placeholder → 我们的占位名 / 我们的占位密钥; it exists nowhere → 它根本不存在; it belongs to someone else → 它属于别人; the instructors'' bucket → 授课老师的 bucket; anyone who can view jobs in this project → 这个项目里能查看任务的任何人; the job spec keeps its arguments → 任务规格会保存它的参数; shell history → shell 历史; typed inline → 直接敲在命令里; a dedicated key → 一把专用的密钥; rotate → 轮换; Secret Manager stays; billing → 计费 (a Google Cloud project with billing → 一个开通了结算的 Google Cloud 项目, L11); cost money → 花钱; the pricing page → 价目页 (L09); provisioned → 分配好; your project pays → 你的项目就一直付费.'
- '[A15] GPU and multi-GPU words (the exam edition''s tf.distribute set, plus the switchboard). the accelerator → 加速器 (one T4 in the worker pool spec → worker pool spec 里的一块 T4; you add the accelerator to the CPU block → 你在 CPU 那一段里加上加速器); three switches must agree → 三个开关必须一致; the chip lights only when all three are on → 芯片只在三个都打开时才会亮; TensorFlow built for GPUs, with CUDA, the GPU libraries → 为 GPU 构建的 TensorFlow，带 CUDA，也就是 GPU 的库; the GPU block / CPU block → GPU 那一段 / CPU 那一段 (A8); uncomment / comment out → 取消注释 / 注释掉; commented out → 被注释掉了; overridden → 被覆盖; attached, idle, and still billed → 挂着、闲着，照样计费; used or not → 不管用没用; multi-GPU training → 多 GPU 训练; three shapes → 三种形态 (inside a clause, B4); the mirrored strategy → MirroredStrategy (written as the class, exam; en_display stays as said); creates one, but only to count GPUs → 也会创建一个，但只是用来数 GPU; an identical copy of the model → 一份一模一样的模型拷贝; called a replica → 叫作副本; a global batch of 64 → 64 的全局 batch; one step''s worth → 一步的量; splits into two halves of 32 → 分成两半，每半 32; computes gradients on its half → 在自己那一半上算梯度; averaged across a link called all-reduce → 通过一条叫 all-reduce 的连线取平均; take the same step → 走同样的一步; stay identical → 保持一致; variables created inside the scope are mirrored → 在 strategy.scope 里创建的变量会被复制; one synced copy per GPU → 每块 GPU 一份同步的拷贝; a model built outside is not mirrored → 在外面构建的模型不会被复制; multiplies the batch size by the number of replicas → 把 batch 大小乘以副本数; builds and compiles the model inside the scope of the strategy → 在 strategy.scope 里构建并编译模型; steps per epoch → 每个 epoch 多少步; the last one partial → 最后一步不满; images per GPU → 每块 GPU 的图片数; the learning rate stays at 0.001 → 学习率还是 0.001; start-up, image pull and download don''t shrink → 启动、拉取 image 和下载都不会变短; 32 virtual CPUs → 32 个虚拟 CPU; the biggest machine of the lecture → 这节课最大的机器; GPU measure word 块 (两块 T4, 每块 GPU, 一块 GPU).'
- '[A16] Shell and environment words, as L1, L10 and L11. export → export (export it in the terminal → 在终端里 export 它); an exported variable → export 过的变量; exists only in that shell and its children → 只存在于那个 shell 和它的子进程里; the terminal → 终端 (a new one → 一个新的终端); its length → 它的长度; the prompt → 提示符; set -e, exit on error → set -e，也就是出错就退出; carries on anyway → 照样往下走; inside the cockpit → 在驾驶舱里; slash secrets is empty → /secrets 是空的, our sandbox → 我们的沙盒; came through → 都传进来了; the architecture → 架构; on a Mac too → 在 Mac 上也一样; a label, not a fact → 只是一句话，不是事实 (A8: never 标签 here); a trace with sh -x → 用 sh -x 跟踪一遍; random hex → 随机的十六进制串; the arguments → 参数 (builds the arguments → 拼出参数; the job''s arguments → 任务的参数); in plain text → 明文; git ignores it → Git 会忽略它; belongs to root → 属于 root; on our Linux engine → 在我们的 Linux 引擎上; on Docker Desktop, to you → 在 Docker Desktop 上属于你.'
- '[A17] The lecture, the course and the instructors. Course: AC215; lecture n → 第 n 讲 (lecture 11 → 第 11 讲; lecture 14 / 15 → 第 14 讲 / 第 15 讲); the lecture → 课上 (from the lecture → 课上的; the lecture''s list of seven → 课上列的七样; the lecture''s three changes → 课上讲的三处改动; the lecture shows the pattern → 课上把这个写法画成; what the lecture calls … → 课上叫作……); the second half of the lecture → 课的后半部分; the course page → 课程页面; the course pin → 课程 pin 住的版本 (L11); the Cheese App roadmap → Cheese App 的路线图; your third milestone → 你的第三个项目里程碑; scene n → 第 n 个场景; part 1 / part 2 → 第一部分 / 第二部分; exercise n → 练习 n; the exercises → 练习; the study guide → 学习指南. SERIES RULE: the instructor''s name never appears in a subtitle, a title, a chapter name or the description. The narration says the instructors → 授课老师 (run by the instructors → 由授课老师跑的; the instructors'' run on one Tesla T4 → 授课老师在一块 Tesla T4 上的那次运行; the instructors'' bucket → 授课老师的 bucket); the masked ‹instructor› of the screen is never written. The placeholders your-bucket-placeholder, your-gcp-project, ‹team›, ‹W&B user› and the PLACEHOLDER key are never written in a subtitle (the SAY never says them); the README''s names (cheese-app-trainer, ac215-project, cheese-app-models) are never written either (the SAY says the README''s name → README 里的名字).'
- '[A18] Sentence openings. Never start a Chinese sentence with a lower-case artifact or kept-English word (wandb.init, wandb.config, model.fit, setup.py, task.py, cli.sh, cli.py, docker-shell.sh, sh cli.sh, tar, gcloud, requests, repo, run, callback, config, container, image, bucket, notebook, epoch, batch): put a Chinese word first (调用 wandb.init……; 这个 callback……; 命令 tar……; 而 requests……; 先看 setup.py……; 第一个 run……). The English sentences that open with such a word were already rewritten in the script (The call wandb init…, Its find packages call…), so this mostly bites where the Chinese reorders a clause. A capitalized name, product or code word may open a sentence (W&B, Weights & Biases, Vertex AI, Colab, Google, GitHub, Docker, Debian, TensorFlow, MobileNet, MLflow, Python, Git, README, Notebook A, Line 2 → 第 2 行), and so may a number that opens the English sentence (Zero → 0；, 5 questions → 五道自测题, C1).'
- '[B1] Spacing. One half-width space between Chinese and Latin letters, digits or artifacts (开一个 run, 第 13 讲, 1156 张, 68.97% 的, 两块 T4, 第 31 个单元格, 第 8 行和第 9 行, 返回 404, 录制时是 0.31.0, 大约 510 MB, 2025 年 10 月). The checker reports a missing space on every displayed sentence. Spaces inside an artifact stay as they are (sh docker-shell.sh, git diff, pip list, python -m trainer.task); never add one inside an artifact. No space next to full-width punctuation (……cli.sh。, 报 404，). Never fake a no-break space with U+00A0 / U+202F.'
- '[B2] Punctuation. Full-width ，。、；：？！“”…… in Chinese text, also next to artifacts. Lists use 、 (Workbench、Training 和 Pipelines; 环境、代码、数据; gcloud、gsutil 和 uv). No brackets of any kind, neither （） nor () nor 《》 nor 【】 nor [] nor <> (the checker rejects them on a line with no say:); the README''s notes in brackets → 方括号里的注释 (the word, not the characters). “” only for a quoted thought or a word the narration quotes as a word (the word test → test 这个词: no quotes needed); artifacts, labels, error text and tag names are never quoted. No 。？！ inside one Chinese sentence (one per English sentence): use ，；： instead. Questions keep ？. The English half-width comma inside the quoted error API key must be 40 characters long, yours was 2 stays as printed.'
- '[B3] Symbols the checker rejects (= < > + → ← ^ ≤ ≥ × ÷ ≈, == != +=, a digit followed by !, brackets, letter_letter): never copied into the Chinese line; written the way the narration says them (A6). Allowed and kept as on screen: / in paths (/secrets), . in file names, calls and versions (setup.py, model-trainer.json, wandb.init, model.fit, 0.15.11, 68.97), : only as full-width punctuation, - in flags and names (-U, sh -x, n1-standard-4, us-central1, google-cloud-cli, cli-multi-gpu.sh, all-reduce, scikit-learn), & in W&B and Weights & Biases, % after a number (68.97%, 10%: L09). Multiplication and division are said in words (乘以, 除以, 乘).'
- '[B4] The 种 trap. The checker rejects a clause ending in 种 directly before ，。！？. Write 哪种做法 / 三种形态 / 这种方式 with a noun after 种, never 哪一种？ or 三种。.'
- '[C1] Numbers in display text. Arabic digits, with no thousands separator, for everything that echoes the screen, the code, the notebooks or a digit in the SAY: counts and sizes (1156 张照片, 936 / 104 / 116 张, 1040 张, 4016 字节, 22 个包, 40 个字符, 47 个字符, 长度是 0, 64 的全局 batch, 32 张, 15 步, 936 张训练图片, 32 个虚拟 CPU, 4 KB, 510 MB, 10 到 104 MB), percentages and scores (68.97%, 62.93, 67.24, 9.5%, 68%, 10%, 0.86 个百分点, 0.2, 0.001), cells (第 12 / 13 / 31 / 32 / 34 / 52 / 54 / 55 / 56 / 62 / 63 / 64 / 66 个单元格), lines and steps (第 2 行, 第 4 行, 第 8 行和第 9 行, 第 18 行, 第 31 行, 第 37 行, 第 153 行, 14 步里的第 2 步, 第 8 步), epochs the SAY writes as digits (10 个 epoch, 15 个 epoch, 5 个 epoch), status codes (404, 401, 403), versions (0.31.0, 0.22.2, 0.15.11, 2.14, 2.17, Python 3.10), Debian 11 / 12, lectures (第 11 / 13 / 14 / 15 讲), scenes (第 7 / 9 / 10 / 11 个场景), exercises (练习 1, 练习 4, 练习 5), the date (2025 年 10 月), 5 分钟, Part 1 / Part 2 as the SAY writes digits → 第一部分 / 第二部分 (the series form, L11). Chinese numerals for small narrative counts the SAY spells as words: 两个 notebook, 两张表, 五个模型, 三个杠杆, 七样东西, 四个奶酪 label, 五个文件, 两张照片, 五个 run, 两把密钥, 三行, 三个入口, 三步, 两个事实, 两个额外检查, 三个角色, 三枚徽章, 八个条目, 三个开关, 两块 GPU, 两块 T4, 两半, 三处改动, 两点要注意, 一块 T4, 一台机器, 一个副本, 五道自测题, 第一题 … 第五题, 第一个 / 第二个 / 第三个, 两次 / 第三次. When the English uses a digit for a count, follow the English (5 questions → 五道自测题 is the series'' fixed pattern, D6).'
- '[C2] Units, versions and dates. Versions with their name or with 录制时: wandb 0.31.0 today vs 0.22.2 stored (录制时是 0.31.0，而保存下来的那次运行用的是 0.22.2); the wandb pin 0.15.11 → pin 在 0.15.11 (no 录制时: the SAY says pinned); the image tags 2.14 and 2.17 are fixed names (较老的 2.14, cli.sh 用的是 2.17). Sizes: 4 kilobyte → 4 KB; about 510 megabytes → 大约 510 MB; 10 to 104 megabytes → 10 到 104 MB; 4,016 bytes → 4016 字节. Durations: about 5 minutes → 大约 5 分钟; may take hours → 可能要好几个小时. Dates: in October 2025 → 2025 年 10 月 (no day). Money is never quantified (no prices, no cents in this video; a gold tag → 金色标签; adds to the bill → 会增加费用).'
- '[D1] Sentence alignment (explainer/i18n.py). One entry per SAY line of script.md in narration/*.yaml (106 blocks); `en` byte-equal to the SAY line; `zh` has exactly one item per English sentence as split by explainer.voice.split_sentences (351 in this script: S01 15, S02 15, S03 26, S04 26, S05 20, S06 20, S07 27 = 149 in part 1; S08 26, S09 27, S10 25, S11 25, S12 25, S13 19, S14 29, S15 26 = 202 in part 2). Restructure only inside a sentence; never merge or split. Short sentences keep their own item: Hold that question. → 先记着这个问题。 (S01); Remember their order. → 记住它们的顺序。 (S03); Here is the map. → 这是地图。 (S02); Today we light both. → 今天两条线都点亮。 (S02); Watch the name. → 盯住这个名字。 (S05); Something to ponder. → 来想一个问题。; A quick prediction. → 快速预测一下。 (S06); Pause and run it. / Pause and do it. → 暂停一下，自己跑一遍。 / 暂停一下，照着做。; Pause and run it again. → 暂停一下，再跑一遍。 (S08); Then the full command. → 然后是完整的命令。 (S10); One honest note. → 如实说一句。 (S07); Here is the idea. → 思路是这样的。 (S14); Two caveats. → 有两点要注意。 (S14); Model fit is unchanged. → 而 model.fit 没变。 (S14, A18); The proof … → 证据……; 5 questions to test yourself. → 五道自测题。 Run python -m explainer.i18n check videos/ac215-l13-training-workflows --lang zh until it prints OK.'
- '[D2] No say:, no anchors. There is no Chinese voice: never write say: (the display line is the only text) and never write anchors: (they only place animation beats for a Chinese-voiced render). The subtitles are timed by the English audio; the toolkit pairs each Chinese sentence with its English sentence by position, and every scene keeps its English vo.wait_until anchors.'
- '[D3] A checker-clean display line. With no say:, every displayed sentence must pass explainer.i18n.spoken_problems: no brackets (B2), no maths symbols (B3), no letter_letter names (A6), no digit followed by !, no clause ending in 种 followed by ，。！？ (B4), a half-width space between Hanzi and Latin or digits (B1), each sentence ending in 。！？ or …… (optionally followed by ” or 」), and every Latin word in this glossary (zh_subtitle, first_use or allowed_spoken_latin). The checker cuts words with the regex [A-Za-z][A-Za-z''.-]* and ignores one-letter words: W&B is W and B, T4 is T, n1-standard-4 is n and standard-, us-central1 is us-central, x86 64 is x, sh -x is sh, -U is U, python -m trainer.task is python and trainer.task, 2 block is block, 0.15.11 and 68.97% have no word, model-trainer.json, cli-multi-gpu.sh, google-cloud-cli, cheese-app-demo and cheese-training-vertex-ai stay whole. A Latin word it reports is either an English word to translate (the usual case) or a missing artifact: add the artifact to allowed_spoken_latin, cut the same way, and to the matching term. Plurals are left out on purpose (no runs, notebooks, epochs, GPUs, buckets, images, jobs, keys, cells, labels): a plural it reports is an English inflection to drop (五个 run, 两个 notebook, 15 个 epoch, 两块 GPU, 四个奶酪 label, 两个 GPU image); the only plurals allowed are inside artifacts: the console labels Custom jobs and Pipelines, the column name epochs and characters inside the quoted error.'
- '[D4] The English line (en_display). In the bilingual band the English line shows the SAY sentence, which spells artifacts out for the voice. Every such sentence gets an en_display item with the literal on-screen form, otherwise word for word the SAY sentence; null for the other sentences of the block. Table (SAY → en_display): W and B → W&B (every sentence that says it, the series form of L06-L08 and the exam); Weights and Biases, W and B for short → Weights & Biases, W&B for short; wandb init → wandb.init; wandb config → wandb.config; wandb finish → wandb.finish; model fit → model.fit; run save with the word test → wandb.run.save with the word test; the two block run / cell → the 2_block run / cell; the validation percent → validation_percent; the test percent → test_percent; the dash U flag → the -U flag; cheese app demo → cheese-app-demo; cheese training vertex AI → cheese-training-vertex-ai; the model training repo → the model-training repo; model trainer (the service account, its key) → model-trainer; set dash e → set -e; Slash secrets → /secrets; python dash m trainer dot task → python -m trainer.task; its find packages call → its find_packages() call; its own init file → its own __init__.py; sh dash x → sh -x; x86 64 → x86_64; api key not configured → api_key not configured; training job complete → Training Job Complete; GPU available, with an empty list → GPU Available: [], an empty list; the region variable → the GCP_REGION variable; the model dir flag → the --model-dir flag; a batch size flag of 32 → --batch_size=32; the key flag → the --wandb_key flag; the mirrored strategy stays as said (the class is on screen); model save → model.save. Dotted names the SAY already writes literally (docker-shell.sh, setup.py, task.py, cli.sh, cli.py, uv.lock, pyproject.toml, model-trainer.json, google-cloud-sdk) need no en_display. The English video''s own .srt is unaffected.'
- '[D5] Content parity. Each Chinese sentence translates its English sentence and nothing more: no added commands, flags, glosses, Chinese console names or explanations; 额外 only where the English marks an extra (an extra check, two extras, as an extra run, the first fix, an extra); no Chinese gloss of a kept-English term (the English line is right below). The licensed changes: writing an artifact as the screen shows it where the SAY shortens or spells it (A6, D4), the error capitals (A7) and the instructor rule (A17).'
- '[D6] Fixed patterns (L9-L11''s, extended). Pause and run it. → 暂停一下，自己跑一遍。 pause and run it → 暂停一下，自己跑一遍 Pause and run them. / pause and run them → 暂停一下，把它们跑一遍 pause and set it up → 暂停一下，把它配好 Pause and add yours. → 暂停一下，加上你自己的。 Pause and do it. / pause and do it → 暂停一下，照着做 pause and do both → 暂停一下，两件都做了 pause and make it → 暂停一下，建好它 / 暂停一下，改好它 (a folder / a fix) Pause and create yours. / pause and create it → 暂停一下，建一个你自己的 pause and edit yours → 暂停一下，改成你自己的 pause and open it → 暂停一下，打开它 pause and look for yours → 暂停一下，找找你的 Pause and check yours → 暂停一下，检查你的 Pause and open your project. → 暂停一下，打开你的项目。 pause and work through the list → 暂停一下，照着清单一项项做 Now pause and run the five training cells. → 现在暂停一下，把五个训练单元格跑一遍。 Pause and train the five models. → 暂停一下，把五个模型训练一遍。 pause and run through the predictions → 暂停一下，一直跑到预测那几个单元格 Pause and run it again. → 暂停一下，再跑一遍。 Pause and run it a third time → 暂停一下，跑第三遍 A yellow tag means pause and run it → 黄色标签的意思是：暂停一下，自己跑一遍 Something to ponder. → 来想一个问题。 Something to ponder: / Something to ponder, with … → 来想一个问题： / 来想一个问题，用…… A quick prediction. → 快速预测一下。 A gold tag: / A gold tag first: → 金色标签： / 先看金色标签： One honest note. → 如实说一句。 A small slip: → 有一个小疏漏： at the time of recording → 录制时 an extra / Extra checks: / Two extras show … → 额外步骤 / 额外检查： / 两个额外检查显示…… the study guide has every command → 每条命令都在学习指南里 5 questions to test yourself. → 五道自测题。 One: … Five: → 第一题：…… 第五题： Answers are in the exercises. → 答案在练习里。 Here it fails like cli.sh → 在这里，它和 cli.sh 一样失败 With yours / With your key → 换成你的密钥 Part 1 is done → 第一部分完成了 Time to shut down → 该收尾了.'
- '[D7] Files. narration/g1.yaml = S01-S07 (part 1: the hook, the levers and the map, notebook A''s folder tracker, notebook B and W&B, the three lines and the config assignment, serverless training, the setup: clone, API, quota, secrets, service account, bucket, W&B key), narration/g2.yaml = S08-S15 (part 2: the two Dockerfile fixes, the tarball, the one command and its key, who submits and who runs, what the job prints, three switches for a GPU, two GPUs and MirroredStrategy, the missing model, shutdown and recap), the parts of video.yaml; each starts with a comment header (what it covers, the rules it applies: A6 spoken forms of underscored artifacts, A7 errors, D4 en_display, A17 the instructor rule, no say:/anchors) and keeps the script order. Strings in double quotes; YAML-escape a literal double quote or backslash.'
- '[D8] Length on the English timing. The Chinese is read while the English is heard, and the band switches where the English pieces switch (a Chinese piece that would read faster than 9 units a second gets at most 1 s more). Keep each Chinese sentence about as long to read as the English is to hear: as a rule of thumb at most about 2 units per English word (a CJK character 1, a Latin character 0.55), so cut filler connectives and repeated subjects, never content. Long artifacts count (API key must be 40 characters long, yours was 2 about 26 units, Vertex AI Administrator about 13, cheese-training-vertex-ai about 14, Model Trainer CLI Container about 15, google-cloud-cli about 9, cli-multi-gpu.sh about 9): do not repeat them where the English does not; after the first mention in a block, use a short reference (这个报错, 这个角色, 这个项目, 驾驶舱, 这个包, 这个脚本).'
- '[D9] Keep the English clause order (a series lesson, ac215-video skill). The toolkit pairs Chinese and English clause by clause, so a Chinese sentence that puts a condition or a reason first when the English puts it last swaps meaning between two neighbouring cues. Conditions, reasons and time adverbials sit where the English has them: Approval may take hours or be refused; cli.sh runs on CPU without it → 审批可能要好几个小时，也可能被拒；没有它，cli.sh 也能在 CPU 上跑; Leave both active, and you submit two jobs with the same name → 两段都留着，你就会提交两个同名的任务; It builds, about 5 minutes here, longer on Apple Silicon, where amd64 is emulated → 它构建成功了，这里大约 5 分钟，在 Apple Silicon 上更久，因为 amd64 要模拟运行; Only the package script → 只要重跑打包脚本 (answer first, as the English).'
- '[G1] Widths. Bilingual band: a Chinese line holds at most 30 units, the English line 96 characters; the Chinese-only sidecar (.zh.srt) holds 22 units a line, 2 lines a cue. Write clauses of at most about 24 units, separated by ，；：、, so the splitter has clean places to cut; avoid a clause longer than 30 units with no punctuation. The honest note of S07, the long tarball sentence of S06[3], the replica sentence of S14[1] and the shutdown list of S15[2] get a comma at every English clause break.'
- '[G2] Cue endings: the toolkit drops a cue-final 。，、；： and keeps ？！…… and a closing ” (subtitles.strip_end). Do not end a sentence on an artifact plus a full stop where a Chinese word can close it (……放进 secrets 目录里。 reads better than ……secrets。; both are valid).'
- '[G3] Commands are never broken. The splitter treats a space between two Latin words in a Chinese line as a good cut, so sh docker-shell.sh, sh package-trainer.sh, sh cli-multi-gpu.sh, python -m trainer.task, git diff, pip list, gcloud auth list or the quoted error could land on two lines, which a viewer cannot copy or match. Put a whole command at the end of a clause after a full-width colon or a verb (现在跑 sh docker-shell.sh；; 然后运行：python -m trainer.task；), at most one command per cue, with little Chinese around it; the error API key must be 40 characters long, yours was 2 gets a clause of its own after a colon. Check every cue with a command in the rendered .zh.srt.'
- '[H1] Titles (meta.yaml). Video, part and chapter titles in the written register (A13: 容器, 镜像, 仓库, 存储桶, 运行, 回调, 配置, 训练任务, 自定义训练任务, 无服务器训练, 服务账号, 服务代理); questions keep their question mark; the English colon structure is kept; commands, tools, class names and file names stay as they are (W&B, Vertex AI, MirroredStrategy, setup.py); meta.yaml is not checked, so brackets are fine there. The video title follows the series pattern AC215 · 第 n 讲：…（跟练：…）and the exam edition''s name for the lecture (Advanced Training Workflows → 进阶训练工作流); video.yaml''s publish.title_zh (高级训练流程：W&B 实验追踪、Vertex AI 无服务器训练与多 GPU) is the Bilibili upload title and is not changed here. The core-concept chapters carry the English short name for search where the Chinese is not the usual search word: 运行（run）, 无服务器训练（serverless training）, MirroredStrategy. The metaphors keep their picture: a run is a record, a job is a rented machine → 运行是一份记录，任务是一台租来的机器; rent the machine, not the server → 租机器，不租服务器; the cockpit that won''t build → 构建不了的驾驶舱. The recap chapter is the series'' 收尾 pattern (The missing model, teardown and recap → 缺席的模型、收尾与回顾). No title names the instructor (A17).'
- '[H2] Description (Bilibili / YouTube): two or three sentences: this is the AC215 lecture 13 follow-along of the lecture''s two Colab notebooks and dlops-io/model-training; what the viewer does and learns (notebook A''s experiment folder and why the two notebooks crowned different winners: an unseeded split, unequal epochs; W&B runs on one axis, why only the run with a callback draws curves, why wandb.config = {...} leaves the config empty, the init / callback / finish pattern; serverless training as renting the machine for the training step; the setup: Vertex AI API, GPU quota, service account, bucket, W&B key; the model-training-cli container through today''s two Dockerfile fixes, which only submits; the tarball, sh cli.sh, the key inside --args, who submits and who runs, what the job prints and what W&B shows; three switches for a GPU; MirroredStrategy''s split, all-reduce and strategy.scope(); shutdown, with the trained model not saved yet); English narration with Chinese and bilingual subtitles, every README command verbatim and in order, captures on a machine without a Google account (the cloud successes are shown as recorded, with their sources), Vertex AI jobs billed to the viewer''s project while they run (gold tags without amounts, a full shutdown checklist). Written register, terms of this glossary; consistent with video.yaml''s publish.description_zh, but with no instructor name (A17).'
- '[H3] Companions: i18n/zh/README.md (and exercises.md if made) are translated with this glossary in the written register (容器, 镜像, 仓库, 克隆, 存储桶, 运行（run）, 回调（callback）, 配置（config）, 轮次（epoch）, 批次（batch）, 实验追踪, 可复现, 无服务器训练, 训练任务, 自定义训练任务（custom job）, 服务账号, 服务代理, 配额, 密钥, tar 包, 副本, 全局批次, 梯度); brackets and underscores are fine there (not checked). Headings and <summary>答案</summary> are translated. A term table at the end: English | the term used here | common variants (run / 运行; callback / 回调; experiment tracking: 实验追踪 / 实验跟踪; custom job: 自定义任务 / 自定义作业 (Google Cloud''s Chinese docs); service agent: 服务代理 / 服务代理账号; quota: 配额; tarball: tar 包 / 压缩包; serverless: 无服务器; replica: 副本; all-reduce: all-reduce / 全归约; global batch: 全局 batch / 全局批次; mirror (Debian): 软件源 / 镜像源; rotate: 轮换).'
- '[H4] Code and commands stay byte-identical in the companions: code blocks, commands, file names and inline `code` are unchanged; only # comments and the prose around them are translated.'
- '[I1] (request, open since L3) explainer.i18n check applies its voice hygiene (_SPOKEN_BAD: brackets, maths symbols, letter_letter names, the 种 rule) to the display line when a sentence has no say:. For a subtitles-only video (this series; video.yaml has no languages.zh.voice and this glossary says voice: none) those checks guard nothing and force A6, B3 and B4; this lecture''s underscored names (validation_percent, 2_block, train_base, model_dir, batch_size, api_key, x86_64, GCP_REGION, __init__.py, find_packages()) are the cost here. Proposal: skip _SPOKEN_BAD for display-only sentences when the glossary''s voice is none (keep the Latin-word, spacing and sentence-end checks).'
- '[I2] (todo, from L1 I3) explainer/subtitles.py''s _cuts treats a space between Latin words in a Chinese line as a good cut, so commands and quoted errors can be split (G3). Proposal: in a Chinese line, treat a run of Latin tokens separated only by spaces as unbreakable unless it alone exceeds a line.'
terms:
# ---------------------------------------------------------------- S01: two tables, two winners
- en: 'notebook / two notebooks from this lecture / notebook A / notebook B / run by the instructors'
  zh_subtitle: 'notebook / notebook A / notebook B / 授课老师'
  first_use: 'S01[0]：这节课的两个 notebook，都是授课老师跑过的：同样的数据 pipeline，同样的 1156 张奶酪照片，同样的五个模型。'
  note: 'notebook stays (L06, exam); the instructors → 授课老师 (A17, never a name). notebook A / B as the screen titles them; never notebook A''s (the folder from notebook A → notebook A 的那个目录).'
- en: 'data pipeline / cheese photos'
  zh_subtitle: '数据 pipeline / 奶酪照片 / 模型'
  first_use: 'S03[1]：跑数据集的单元格：1156 张照片，来自一个 GitHub release，有四个奶酪 label。'
  note: 'pipeline stays (series); photos → 照片 (L11); C1: 1,156 → 1156.'
- en: 'crowns / the fine-tuned MobileNet / the frozen MobileNet / percent / winner'
  zh_subtitle: 'MobileNet / 微调过的 / 冻结的 / 冠军'
  first_use: 'S01[0]：Notebook A 选出的冠军是微调过的 MobileNet，准确率 68.97%。'
  note: 'fine-tuned / frozen → 微调过的 / 冻结的 (L08). percent → % (L09, B3). Notebook B crowns the frozen MobileNet, also at 68.97 percent, and puts the fine-tuned one at 62.93 → notebook B 选出的冠军是冻结的 MobileNet，也是 68.97%，而微调过的那个只有 62.93。 A18: a line may open with Notebook A / Notebook B capitalized, as the English sentence does; mid-sentence notebook A / B in lower case, as the screen titles them.'
- en: 'recipe / fine-tuning or freezing / the epochs column / Hold that question'
  zh_subtitle: '做法 / 微调 / 冻结 / epochs 这一列'
  first_use: 'S01[1]：那么哪种做法更好，微调还是冻结？'
  note: 'B4: 哪种做法 (a noun after 种). One clue is visible: look at the epochs column → 有一条线索看得见：看 epochs 这一列 (the column header as on screen). Hold that question → 先记着这个问题. part of it is in what the table never wrote down → 另一部分在这张表从没写下的东西里.'
- en: 'packed into a 4 kilobyte tarball / a machine you rent for the length of one job / from one command'
  zh_subtitle: 'Colab / tar 包 / 4 KB / 租 / 任务 / 命令'
  first_use: 'S01[2]：它被打进一个 4 KB 的 tar 包，在一台只租一个任务那么久的机器上训练，只用一条命令。'
  note: 'tarball → tar 包 (exam); job → 任务 (exam, L08); rent → 租 (A5).'
- en: 'W and B / W&B / Weights and Biases / your W and B key'
  zh_subtitle: 'W&B / Weights & Biases / W&B 密钥'
  first_use: 'S01[2]：这条命令里带着你的 W&B 密钥。'
  note: 'The SAY writes W and B; the Chinese line and en_display write W&B (D4). First full name in S02[3]: 课程用的是 Weights & Biases，简称 W&B，它帮你托管。 key → 密钥 (L06''s OpenAI 密钥), except W&B''s own API key (S04[2]).'
- en: 'follow along / a free T4 GPU / a free account on W and B / a Google Cloud project with billing'
  zh_subtitle: '跟着做 / 拷贝 / 免费的 T4 GPU / W&B 账号 / 开通了结算的 Google Cloud 项目'
  first_use: 'S01[3]：跟着做，你需要两份 Colab 拷贝，带免费的 T4 GPU，一个免费的 W&B 账号、Docker，以及一个开通了结算的 Google Cloud 项目。'
  note: 'copy → 拷贝 (A8, never 副本). billing → 结算 (L11).'
- en: 'cost money while they run / gold tags mark each point, without amounts / a yellow tag / the study guide'
  zh_subtitle: '花钱 / 金色标签 / 黄色标签 / 学习指南'
  first_use: 'S01[3]：Vertex AI 任务运行时会花钱；金色标签标出每一个计费点，不写金额。'
  note: 'A yellow tag means pause and run it, and the study guide has every command → 黄色标签的意思是：暂停一下，自己跑一遍；每条命令都在学习指南里 (D6).'
- en: 'two words from the lecture / reproducibility / accountability'
  zh_subtitle: '可复现 / 可追责'
  first_use: 'S01[3]：今天的两个关键词，来自课上：可复现和可追责。'
  note: 'The words are on screen in English (A11); the Chinese line says them in Chinese (exam).'
# ---------------------------------------------------------------- S02: three levers and a missing row
- en: 'three levers / pull the third one / bookkeeping'
  zh_subtitle: '杠杆 / 硬件 / 租用 / 记账'
  first_use: 'S02[0]：课上从让深度学习变好的三个杠杆讲起：更多数据、更好的模型、更快的硬件。'
  note: 'Exam S08[6]''s wording. Today we pull the third one: you rent hardware → 今天拉第三个：你去租硬件. And you add the bookkeeping that shows whether it helped → 再加上能看出它有没有用的记账.'
- en: 'the Cheese App roadmap / the dashed box / experiment tracking / baseline models / your third milestone'
  zh_subtitle: 'Cheese App / 路线图 / 虚线框 / 实验追踪 / 基线模型 / 里程碑'
  first_use: 'S02[1]：在 Cheese App 的路线图上，围住实验追踪和基线模型的那个虚线框，就是今天。'
  note: 'Your third milestone asks for exactly this → 你的第三个项目里程碑要的正是这个 (A17).'
- en: 'each piece of an experiment / code to GitHub / data to the versioning from lecture 11 / pyproject.toml and uv.lock / have no home yet'
  zh_subtitle: '版本管理 / pyproject.toml / uv.lock / 权重 / 指标 / 日志'
  first_use: 'S02[2]：代码放 GitHub，数据放第 11 讲的版本管理，环境放 pyproject.toml 和 uv.lock。'
  note: 'versioning → 版本管理 (L11). Weights, metrics and logs have no home yet → 权重、指标和日志还没有地方放.'
- en: 'a complete run should keep seven things / environment / code / data / model / metrics / artifacts / notes'
  zh_subtitle: '七样东西 / 环境 / 代码 / 数据 / 模型 / 指标 / 产物 / 笔记'
  first_use: 'S02[2]：一个完整的 run 应该存下七样东西：环境、代码、数据、模型、指标、产物和笔记。'
  note: 'Exam''s list; 笔记 ≠ 笔记本 (A8). S12[4] the lecture''s list of seven → 课上列的七样.'
- en: 'hosted for you / MLflow / host it yourself'
  zh_subtitle: '托管 / MLflow'
  first_use: 'S02[3]：MLflow 是常见的选择，用在你必须自己托管的时候。'
  note: 'Weights and Biases, W and B for short → Weights & Biases，简称 W&B (en_display, D4).'
- en: 'the map / the Colab lane / the repo lane / fills a folder and uploads it / streams its runs / packs the code'
  zh_subtitle: '地图 / 这条线 / 点亮 / 目录 / 上传'
  first_use: 'S02[4]：上面是 Colab 这条线：notebook A 把文件装进一个目录再上传，notebook B 把它的 run 实时传到 W&B。'
  note: 'Here is the map → 这是地图; Below, the repo lane: your laptop packs the code, a bucket holds it, Vertex AI runs it, and the run reports to W&B → 下面是 repo 这条线：你的笔记本打包代码，bucket 存着它，Vertex AI 运行它，这个 run 向 W&B 汇报. Today we light both → 今天两条线都点亮. lane → 线 ≠ 一行 (A8).'
# ---------------------------------------------------------------- S03: a tracker made of folders
- en: 'the course page / save a copy / switch the runtime to a GPU / stored outputs / one Tesla T4'
  zh_subtitle: '课程页面 / 另存一份 / 运行时 / 保存下来的输出 / Tesla T4'
  first_use: 'S03[0]：从课程页面打开 notebook A，另存一份，把运行时切到 GPU；暂停一下，把它配好。'
  note: 'save a copy → 另存一份 (never 副本, A8); runtime → 运行时 (L06). Its stored outputs show the instructors'' run on one Tesla T4 → 它保存下来的输出，是授课老师在一块 Tesla T4 上的那次运行.'
- en: 'the dataset cells / one GitHub release / four cheese labels / Remember their order'
  zh_subtitle: '单元格 / GitHub release / label / 顺序'
  first_use: 'S03[1]：记住它们的顺序。'
  note: 'cell → 单元格 (L06); release stays (A1 c); labels → label (L11 A3). four cheese labels → 四个奶酪 label (C1, no plural).'
- en: 'the split / 936 to train / 104 to validate / 116 to test / training set / validation set / test set'
  zh_subtitle: '划分 / 训练 / 验证 / 测试 / 训练集 / 验证集 / 测试集'
  first_use: 'S03[1]：然后是划分：936 张用来训练，104 张用来验证，116 张用来测试。'
  note: 'L09: split → 划分. Pause and run them → 暂停一下，把它们跑一遍 (D6).'
- en: 'validation percent / test percent / the cell sets / 0.2 / What did the code actually do'
  zh_subtitle: 'validation percent / test percent / 单元格'
  first_use: 'S03[2]：这个单元格把 validation percent 设成 0.2，可验证集只有 1156 张里的 104 张。'
  note: 'A6: validation_percent / test_percent → spaced (en_display restores). A10: the ponder block must not name the test percent. What did the code actually do? → 这段代码实际上做了什么？'
- en: 'both splits use the test percent / 10 percent of 1,156 / the remaining 1,040 / copied into the repo trainer / A small slip'
  zh_subtitle: '两次划分 / 剩下的 / 小疏漏 / 训练脚本'
  first_use: 'S03[3]：两次划分用的都是 test percent。'
  note: '10 percent of 1,156 is 116 for testing, then 10 percent of the remaining 1,040 is 104, the validation set → 1156 的 10% 是 116 张，用来测试；剩下 1040 张的 10% 是 104 张，也就是验证集. A small slip, copied into the repo trainer → 一个小疏漏，还被复制进了 repo 的训练脚本 (A10, A5).'
- en: 'the home-made tracker / Cell 31 / a folder named after the current Unix time / the helper from cell 12'
  zh_subtitle: '实验追踪工具 / Unix 时间 / 辅助函数 / 第 31 个单元格'
  first_use: 'S03[4]：第 31 个单元格建了一个目录，用当前的 Unix 时间命名。'
  note: 'Now the home-made tracker → 现在看自己动手做的实验追踪工具. A Chinese line may open with 第 n 个单元格 (Cell 31 → 第 31 个单元格, A18).'
- en: 'the model / its weights / its structure / its history / its metrics / Pause and train the five models'
  zh_subtitle: '权重 / 结构 / 训练历史 / 指标'
  first_use: 'S03[4]：每个模型训练完，第 12 个单元格里的辅助函数就往目录里放五个文件：模型、权重、结构、训练历史和指标。'
  note: 'D6: Pause and train the five models → 暂停一下，把五个模型训练一遍.'
- en: 'gathers the metric files into one table / picks its top row as the best model / run through the predictions'
  zh_subtitle: '指标文件 / 第一行 / 最好的模型 / 预测'
  first_use: 'S03[5]：第 54 个单元格把指标文件汇总成一张表，第 56 个单元格把第一行当成最好的模型；暂停一下，一直跑到预测那几个单元格。'
  note: 'top row → 第一行 (a table row; ≠ the ledger''s 一行 only by context).'
- en: 'accuracy becomes text before sorting / 9.5 percent would rank above 68 percent'
  zh_subtitle: '准确率 / 文本 / 按字符串排序'
  first_use: 'S03[5]：有一个小疏漏：准确率在排序前变成了文本，所以按字符串排序；9.5% 会排在 68% 前面。'
  note: 'A10: the erratum phrase. accuracy → 准确率 (exam).'
- en: 'a first answer / settings and scores / which 116 photos were the test set / no seed / graded on a different 116'
  zh_subtitle: '设置 / 分数 / 随机种子 / 评分'
  first_use: 'S03[6]：划分没有随机种子，所以每次运行都拿不同的 116 张来评分。'
  note: 'L09: seed → 随机种子. Here is a first answer → 先给第一个答案. The folder keeps settings and scores, but not which 116 photos were the test set → 这个目录存了设置和分数，却没存哪 116 张照片是测试集.'
- en: 'one photo is worth 0.86 points / the winner in notebook A / leads by two photos'
  zh_subtitle: '百分点 / 冠军 / 领先'
  first_use: 'S03[6]：一张照片值 0.86 个百分点，而 notebook A 的冠军只领先两张照片。'
  note: 'points of accuracy → 个百分点 (A4).'
- en: 'sign in with cell 62 / your own project and bucket / any bucket of yours works / scene 7 creates one'
  zh_subtitle: '登录 / 项目 / bucket / 第 7 个场景'
  first_use: 'S03[7]：用第 62 个单元格登录，在第 63 个单元格里填上你自己的项目和 bucket，再跑第 66 个单元格。'
  note: 'Any bucket of yours works; scene 7 creates one → 你的任何一个 bucket 都行；第 7 个场景会建一个 (A17).'
- en: 'those files now sit in your bucket / 10 to 104 megabytes of weights per model / plus a copy'
  zh_subtitle: '金色标签 / MB / 拷贝'
  first_use: 'S03[7]：金色标签：这些文件现在放在你的 bucket 里，每个模型 10 到 104 MB 的权重，外加一份拷贝。'
  note: 'D6: A gold tag: → 金色标签：. copy → 拷贝 (A8).'
# ---------------------------------------------------------------- S04: runs on a shared axis
- en: 'its first cell installs it / the dash U flag / whatever is newest / an extra check / signed-out stand-in / at the time of recording / the stored run'
  zh_subtitle: '-U 参数 / 最新版 / 额外检查 / 替身 / 录制时'
  first_use: 'S04[0]：它的第一个单元格安装 W&B，-U 参数的意思是装最新版。'
  note: 'An extra check in our signed-out stand-in shows 0.31.0 at the time of recording, while the stored run used 0.22.2 → 在我们没有登录的替身里额外检查一下：录制时是 0.31.0，而保存下来的那次运行用的是 0.22.2 (A10, C2). en_display: the -U flag (D4).'
- en: 'through cell 32 / downloads a zip of about 510 megabytes you never use / delete that line'
  zh_subtitle: 'zip 包 / 510 MB'
  first_use: 'S04[1]：数据相关的单元格，一直到第 32 个，都和 notebook A 一样，但其中一个还会下载一个大约 510 MB、你根本用不上的 zip 包。'
  note: 'zip stays (A1 c). You may delete that line; then pause and run them → 你可以删掉那一行，然后暂停一下，把它们跑一遍.'
- en: 'API key / the user settings on W and B / the key icon / add a secret named exactly as on screen / notebook access on'
  zh_subtitle: 'API key / User Settings / 钥匙图标 / secret / Notebook access'
  first_use: 'S04[2]：在 W&B 的 User Settings 里复制你的 API key。'
  note: 'API key stays (L1, W&B''s own word); secret stays (the Colab Secrets panel, L06); Notebook access verbatim (L06). In Colab, open the key icon and add a secret named exactly as on screen, with notebook access on → 在 Colab 里打开钥匙图标，添加一个 secret，名字和画面上一字不差，并打开 Notebook access. Pause and add yours → 暂停一下，加上你自己的. Cell 34 signs in with it → 第 34 个单元格用它登录.'
- en: 'the five training cells / starts its run with wandb init / in one project, cheese app demo'
  zh_subtitle: 'wandb.init / 项目 / cheese-app-demo'
  first_use: 'S04[3]：每个单元格都用 wandb.init 开启自己的 run，都在同一个项目 cheese-app-demo 里。'
  note: 'D4: wandb init → wandb.init, cheese app demo → cheese-app-demo. Each starts … → 每个单元格都…… (A18, never a lower-case opening).'
- en: 'the ledger / the five rows become five runs / one shared epoch axis'
  zh_subtitle: '账本 / 一行 / epoch 轴'
  first_use: 'S04[3]：在账本里，这五行变成了五个 run，共用一条 epoch 轴。'
  note: 'Exam''s ledger and row.'
- en: 'the two block run / model fit call / what do the other four lack'
  zh_subtitle: '2 block / 曲线 / model.fit'
  first_use: 'S04[4]：可是只有 2 block 那个 run 有曲线。'
  note: 'A6: 2_block → 2 block (en_display the 2_block run). Compare its model fit call with another cell''s → 把它的 model.fit 调用和另一个单元格的比一比. A10: the ponder sentence must not say callback: 来想一个问题：另外四个缺了什么？'
- en: 'a callback / code that model fit calls after every epoch / the W and B callback / epoch by epoch / system charts / your curves'
  zh_subtitle: 'callback / epoch / loss / 准确率 / 系统图表'
  first_use: 'S04[5]：一个 callback：model.fit 在每个 epoch 之后调用的代码。'
  note: 'Only the two block cell passes the W and B callback, so only its loss and accuracy arrive, epoch by epoch → 只有 2 block 那个单元格传了 W&B 的 callback，所以只有它的 loss 和准确率一个 epoch 一个 epoch 地传过来. Without one, wandb init gives you system charts, never your curves → 没有 callback，wandb.init 只给你系统图表，从不给你的曲线.'
