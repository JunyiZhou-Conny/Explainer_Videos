- en: 'sh cli.sh / the first line is real / the Vertex AI endpoint in us-central1 / no active account / an extra auth list / gcloud reports the job as created'
  zh_subtitle: 'sh cli.sh / endpoint / 激活的账号 / gcloud auth list / 创建'
