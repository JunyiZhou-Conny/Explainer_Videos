# Bilibili metadata for the release (tools/release_episode.py → PUBLISH.json → the Mac publish worker)
publish:
  title_zh: "AC215 第13讲跟练 · 高级训练流程：W&B 实验追踪、Vertex AI 无服务器训练与多 GPU"
  description_zh: |
    哈佛 AC215（MLOps & LLMOps，2026 秋）第 13 讲教程的逐条命令跟练：上半场在 Colab 里跟着两个 notebook 训练五个 cheese 分类模型，
    先看手写的 experiment_<时间戳>/ 文件夹怎样记录每个 run、为什么同一个 notebook 的两份运行结果选出了不同的最佳模型，
    再用 Weights & Biases（W&B）把 run 放到同一条坐标轴上：为什么只有带 callback 的 run 有曲线、为什么 wandb.config = {...} 会让 config 变成空的，
    以及 init / callback / finish 三行的正确写法；然后讲清 serverless training 的思路，照着 dlops-io/model-training 的 README
    准备 Vertex AI API、GPU quota、service account、bucket 和 W&B key。
    下半场构建本地 model-training-cli 容器（包括今天会遇到的两处 Dockerfile 报错和两行修复），证明它只负责提交、从不训练；
    把 trainer 打包成 trainer.tar.gz 上传到 GCS，用 sh cli.sh 提交 Vertex AI custom job，用 sh -x 看清 W&B key 怎样藏在 --args 里，
    分清提交 job 的身份和运行 job 的身份，看 job 能打印什么、W&B 能显示什么，再看 GPU 需要一致的三个开关，
    以及 MirroredStrategy 的数据并行：拆分 global batch、all-reduce 梯度、在 strategy.scope() 里建模型。
    边看边暂停，在自己的电脑上跑每一条命令；本讲的 Vertex AI 训练任务在运行期间会产生实际费用，视频用金色标签标出每个计费点（不写具体金额，请以官方价格页为准），结尾有完整收尾清单。
    英文旁白，中英双语字幕。

    教程仓库：https://github.com/dlops-io/model-training
    Colab Notebook A：https://colab.research.google.com/drive/1h6xRhjILxaUosXlZ5ZC1NZbP0AOHALTl
    Colab Notebook B：https://colab.research.google.com/drive/1aAE5vR9r6Syh4heZboDbQNZS048VToxS
    学习笔记（全部命令、真实输出和练习答案）：https://github.com/JunyiZhou-Conny/MLOps_Learning/blob/main/guides/L13-training-workflows.md

    课程与教程内容来自 Harvard AC215 课程组（Pavlos Protopapas 等）；本视频是个人学习用的非官方讲解，引用课件只注明页码，不展示课件。
  tags_zh: [AC215, MLOps, 实验追踪, Weights & Biases, Vertex AI, 无服务器训练, 多GPU, TensorFlow, 哈佛, 教程跟练]
  tid: 231
