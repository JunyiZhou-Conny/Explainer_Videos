# explainer/build.py for the subtitles' chapters and the zh descriptions): video title, part titles, chapter
# titles keyed by scene file stem (as video.yaml's scenes), and the Bilibili / YouTube description.
# Titles follow GLOSSARY.md rule H1: written register (容器, 镜像, 仓库, 虚拟机（VM）, 堆栈（stack）, 命名空间（namespace）,
# 标签（label）; A4), the English colon structure kept (期望状态：会自己回来的 Pod; deploy_k8s：配置和 23 个资源的计划;
# pulumi up：建什么，按什么顺序), commands, tools, object kinds and names as they are (Kubernetes, GKE, kubectl, Pulumi,
# Pod, Deployment, Service, deploy_k8s, pulumi up), the core-concept chapters with their English short name once for
# search (控制平面（control plane）, 期望状态（desired state）), questions keep their question mark, and S16 in the
# series' 收尾 pattern. 跟练 = follow-along; Scaling → 扩展.
# The title agrees in substance with video.yaml's publish.title_zh ("AC215 第22讲跟练 · 扩展：云上的 Kubernetes——先手动
# 体验一个测试集群，再用 Pulumi 把奶酪 App 部署到 GKE"), in the series pattern of the other meta.yaml titles; the Bilibili
# upload itself uses publish.title_zh.
# SERIES RULE (A16): no title, chapter or description names the instructor, and none names the unmerged staff branch.
# meta.yaml is not read by `explainer.i18n check`, so brackets and underscores are fine here.
