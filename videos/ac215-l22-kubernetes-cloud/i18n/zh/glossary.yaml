# Chinese (zh-CN) glossary and translation rules for ac215-l22-kubernetes-cloud (AC215 lecture 22, Scaling:
# Kubernetes (cloud); the FULL follow-along of dlops-io/cheese-app-v3 @ 3ecef56 (main, 2025-11-28, unchanged on the
# recording day 2026-11-07; the course site links main), README sections "Create Simple Kubernetes Cluster Tutorial",
# "Deployment with Scaling using Kubernetes", "Create & Deploy Cluster" and the Kubernetes half of "Debugging
# Containers", slide by slide against SLIDES.md), code-switching version, SUBTITLES ONLY.
# Audience: Chinese-speaking AC215 grad students who read technical English fluently; register of a Chinese MLOps TA
# running a lab section.
# Precedents and sources of the shared decisions: the series pilot videos/ac215-l01-vms-venvs/i18n/zh (VM, 虚拟机,
# SSH 进去, 控制台, 可用区, 区域, 外部 IP, 结算 / 计费, repo, clone, commit, pin, 录制时, your turn); the container
# lectures ac215-l02 to ac215-l04 (container, image, tag, Dockerfile, port, push, pull, registry, 构建, 网络, 电话簿,
# 挂载); ac215-l05-rag (Chroma, 向量数据库, chunk, embedding); ac215-l10-cloud-connect (加载器, 服务账号, 角色, 令牌,
# 替身, 如实说一句, 有一个小疏漏); ac215-l13 / ac215-l16-exam (副本, 自动扩缩器, 负载均衡器, 单点故障); ac215-l18 (前端,
# 后端, 浏览器, 请求, 状态码, 前缀, 根路径, 想一想); and above all ac215-l20-deployment-pulumi, the same repo's single-VM
# deployment just before this one (the file layout this one follows: rules A-I, term tables per scene, D4
# en_display, D9 clause order; 工具箱, 修复 1 / 修复 2, 本地 backend, stack, state, config, provider, stack reference,
# 期望状态, 资源, 计划, 输出, 指示灯, 计费表, Invalid grant: account not found, Pulumi access token must be set,
# No credentialed accounts, Created stack dev). Every form they fixed is kept where it agrees with this video's
# captures.
# What is new here is the Kubernetes vocabulary. Chinese engineers say the API object kinds in English (Pod,
# Deployment, ReplicaSet, Service, Job, Ingress, PVC), plus namespace, label, selector, requests, kubeconfig, Ingress
# controller, API server, etcd, kubelet, kube-proxy, containerd (A1 c); the architecture and the asks use the
# standard words of the Kubernetes Chinese docs and the GKE Chinese console (集群, 节点, 工作节点, 控制平面, 调度器,
# 控制器, 节点池, 副本, 期望状态, 自愈, 故障转移, 负载均衡, 负载均衡器, 扩展, 自动扩缩器, 编排, 私有网络, 子网, 路由器,
# NAT 网关; A3, A8). The script's metaphor list (script.md "Notes for scene authors", last item) is followed as
# given: 大脑, 双手, 指示灯, 恒温器, 贴纸, 套索, 一扇门加一位前台, 计费表, 拉杆, 工具箱, 手动切换.
# There is NO Chinese voice in this series (docs/AC215_SERIES.md rule 8): the Chinese lines are subtitles on the
# English timing (the bilingual band of output/<id>.zh-en.mp4, <id>.zh.srt, <id>.zh-en.srt / .ass). So no say:,
# no anchors, no readings, no durations: only display rules. But `python -m explainer.i18n check` still applies
# its voice hygiene to the displayed line when a sentence has no say: (brackets, maths symbols, letter_letter
# names, Latin words not listed here, a missing half-width space): rules A6, B3 and D3 are how the Chinese line
# stays clean without say:. This lecture's underscored or symbolic artifacts (deploy_images, deploy_k8s,
# setup_containers.py, create_cluster.py, ip_address, nginx_ingress_ip, app_url, ROOT_PATH, PULUMI_ACCESS_TOKEN,
# --replicas=4, <pod-name>, EXTERNAL-IP <pending>, the plan's + 23) are written the way the narration says them;
# the English line carries the literal (D4).
# SERIES RULE: the instructor's name never appears in a subtitle, a title or the description (A16). Nor does the
# unmerged staff branch (script.md: "never named or shown"; committed text writes work/‹staff›).
# Human-readable copy in Chinese: GLOSSARY.md (keep the two in sync; its term tables come from this file's data).
# terms[].zh_subtitle = the display form (Chinese subtitle line; titles use the written forms of A4);
# terms[].first_use = an example sentence for the translators, as SNN[k]：<one Chinese sentence for one English
# sentence of SAY block k of scene SNN, k from 0>; each one passes the checker; the narration files reuse them;
# terms[].note = usage (English → Chinese) and the rule tags.
# rules are tagged [A1]..[I3]: A terms, B typography, C numbers, D narration file, G subtitles, H titles and
# companions, I toolkit notes. (L1's E on-screen strings and F voice rules do not apply: nothing on screen is
# translated in this series, and there is no voice.)
# Read by: python -m explainer.i18n check (Latin words allowed in the Chinese line: every Latin word of
# zh_subtitle and first_use, plus allowed_spoken_latin, which lists the words as the checker's regex
# [A-Za-z][A-Za-z'.-]* cuts them: us-east1-c is us-east and c, cheese-app-v3 is cheese-app-v, AC215 is AC,
# web.default.svc.cluster.local stays whole) and explainer/subtitles.py, for EVERY video (2-3 word English phrases
# of `en` are kept on one English line; 2-7 character Chinese headwords of zh_subtitle are registered in jieba, so
# zh_subtitle holds terms, not example phrases).
video: ac215-l22-kubernetes-cloud
lang: zh-CN (mainland Simplified Chinese)
audience: 'Chinese-speaking AC215 (MLOps & LLMOps) grad students who know Python and basic ML, read technical English fluently, did L1-L21 (cloud VMs, SSH and deleting what you create; Docker images, containers, ports, docker-shell.sh, Docker networks and container names; service accounts and JSON keys in secrets/ next to the repo; the cheese app''s API, frontend, vector DB and loader locally in L18; and L20: the same repo''s deployment toolbox with its two one-line fixes, Pulumi stacks and state, preview / up / destroy, the deploy_images stack with timestamp tags and a stack reference, the cheese app on one VM behind nginx), saw Lecture 22 (Scaling: Kubernetes (cloud), 45 slides), and are new to orchestration, the control plane and worker nodes, kubectl, Pods, Deployments, ReplicaSets, Services, labels and selectors, namespaces, Jobs, PVCs, node pools and the cluster autoscaler, Ingress and its controller, Helm, kubeconfig, Workload Identity, private nodes and Cloud NAT, sslip.io; they follow along with cheese-app-v3 cloned next to their secrets/ folder, Docker running and a GCP project with billing, pausing to run every step. Real money is involved (a test cluster in part 1; a regional GKE cluster with nodes, a load balancer, NAT and two disks in part 2). Register of a Chinese MLOps TA running a lab section.'
voice: none          # subtitles only (video.yaml: Chinese = i18n/zh/narration/*.yaml on the English timing)
policy: 'The Mandarin of a Chinese MLOps TA walking a lab section through a Kubernetes deployment, code-switching only where such a speaker really does, written as subtitles under an English narration. The viewers already say 开一台 VM, SSH 进去, 把 repo clone 下来, 起一个 container, 构建 image, push 到 registry, 进工具箱, 跑 pulumi up, 先看 preview, 切 stack, 存 state; this lecture adds 建一个集群, 加节点, 起一个 Pod, 写一个 Deployment, 挂一个 Service, 打 label, 按 selector 找 Pod, 切 namespace, 加 -n, 跑一个 Job, 申请 requests, 扩到 3 个副本, 节点池自动扩缩, 配 Ingress, 走 Ingress controller, 装 Helm chart, 连 kubeconfig, 拿 get-credentials, exec 进 Pod, 看 Job 的日志, 跑 destroy. Every choice passes three tests: what is said in a real lab section; the standard, searchable Chinese name (the Kubernetes Chinese docs and the GKE Chinese console: 集群, 节点, 工作节点, 控制平面, 调度器, 控制器, 节点池, 副本, 期望状态, 自愈, 负载均衡器, 自动扩缩器, 区域集群, 私有网络, 子网, NAT 网关, 服务账号, 防火墙规则, 转发规则; general engineering: 编排, 故障转移, 负载均衡, 扩展, 主机名, 重定向, 占位符, 弃用警告); and consistency with the series (L1-L21 and the exam editions, above all L20: every form they fixed is kept). (1) Artifacts verbatim: what the viewer types or matches on screen (commands, flags, file and folder names, paths and URLs, Kubernetes object names, namespaces, labels, image names, cluster names, zones and regions, env vars, console labels, the README headings named as headings, status words, error and log text the narration quotes) is copied letter for letter, never translated, inflected or quoted; the exceptions the checker forces (an underscore, = < > + or brackets inside the artifact) are written the way the narration says them (A6) and the English line shows the literal (D4). Nothing on screen is translated in this series: terminal output, code panels, README cards, the EXPECTED panel, the schematic console and browser windows, the V1-V8 set pieces, the AsksChecklist, tags, trackers, lecture tags and the pause-and-ponder and test-yourself cards stay English; only the narration is. (2) Lab-speech English, a closed list (A1 c): from the series repo, clone, commit, pin, container, image, tag, Dockerfile, port, bucket, registry, push, pull, shell, URL, API, ID, IP, DNS, JSON, YAML, VM, SSH, CPU, GB, stack, state, config, provider, backend, stack reference; new here Pod, Deployment, ReplicaSet, Service, Job, Ingress, Ingress controller, PVC, namespace, label, selector, requests, kubeconfig, API server, controller manager, dispatcher, Helm chart. (3) Everything else in standard Chinese (A3, A7-A10, A14, A15). (4) The video''s pictures by meaning, one word each, every time (script.md metaphor list): 大脑 (the control plane), 双手 (the kubelet), 指示灯 (the four lamps on the V1 picture), 恒温器 (the controller loop), 贴纸 (a label sticker; the Service''s list of Pods wearing it), 套索 (a selector), 一扇门加一位前台 (one load balancer with the Ingress controller behind it), 计费表 (the meter), 拉杆 / 手动切换 (the S01 switch-over by hand), 工具箱 (the deployment toolbox), 替身 (the kind stand-in, as L10 and L20), 舵手 (helmsman). (5) Written register for titles, meta.yaml and companion docs: 仓库, 克隆, 容器, 镜像, 端口, 虚拟机（VM）, 镜像仓库（registry）, 堆栈（stack）, 命名空间（namespace）, 标签（label）, 资源请求（requests）; Pod, Deployment, Service, Ingress, Job, kubectl stay English there too (video.yaml''s publish.description_zh does so). (6) The bilingual band puts the English sentence under every Chinese line, so the Chinese line carries no glosses and no brackets at all (the checker forbids them without say:). (7) The toolkit''s constraints are part of the policy: one Chinese sentence per English sentence (151 blocks, 333 sentences), a checker-clean display line (D3), an en_display wherever the SAY spells an artifact out as words (D4), the English clause order kept (D9). Mainland Simplified Chinese; relaxed, clear lab-section speech, never slangy.'
rules:
- '[A1] Code-switching scope. English stays in three places only. (a) Artifacts, copied letter for letter: commands as typed or named (kubectl get all, kubectl get all --all-namespaces, kubectl get nodes, kubectl get pods, kubectl get services, kubectl get componentstatuses, kubectl version, kubectl version --client, kubectl apply -f, kubectl delete, kubectl scale, kubectl exec, kubectl logs, kubectl describe, rollout status, port-forward, hostname, env, gcloud auth list, gcloud container clusters create / delete / list / get-credentials, gcloud compute disks list, gcloud compute forwarding-rules list, gcloud compute firewall-rules list, docker-shell.sh, git log, pulumi stack init dev, pulumi config, pulumi config set, pulumi preview --stack dev, pulumi preview --stack dev --refresh, pulumi up --stack dev -y, pulumi up --stack dev --refresh -y, pulumi destroy --stack dev --refresh -y, pulumi login --local; the command words get all, get nodes, get pods, apply, delete, scale, exec when the SAY names them), flags (-n, -f, -y, -c, --refresh, --stack dev, --all-namespaces, --region, --zone, --num-nodes; --replicas=4 as A6), file and folder names (deploy-k8s-tic-tac-toe.yml, docker-shell.sh, docker-shell.bat, Dockerfile, deployment.json, Pulumi.dev.yaml, nginx.conf, secrets, src, deployment; the underscored ones as the SAY says them, A6), Kubernetes object, namespace and label names (web, run: web, default, kube-system, cheese-app-namespace, cheese-app-cluster-namespace, cheese-app-cluster, cheese-app-ingress, frontend, vector-db, api, vector-db-loader, wait-for-chromadb, api-ksa, hello-job, kubernetes as the Service''s name), clusters, zones and regions (test-cluster, us-east1-c, us-central1), image names (dlops/tic-tac-toe, cheese-app-deployment), the registry repository cheese-app-repository, DNS names and hosts (web.default.svc.cluster.local, sslip.io, IP.sslip.io), paths (/api-service, /api-service/status), ports (80, 3000, 8000, 8080, 9000, 31366), status codes and words (200 OK, 404 Not Found, 502, 503, Pending, Running, Completed, ContainerCreating, Ready, active, healthy, rolled out, Succeeded), the config keys (gcp:project, setupSSL), console labels and roles (Kubernetes Engine, Compute Engine, Service Account Admin), the README headings named as headings (Create Cluster, Create & Deploy Cluster, Deployment with Scaling using Kubernetes, Preview, Try some kubectl commands), the log, error and code text the narration quotes (A13). (b) Products and proper names: Kubernetes, GKE, kubectl, kind, Helm, etcd, kubelet, kube-proxy, containerd, Google, Google Cloud, Google Container Registry, Artifact Registry, Vertex AI, Cloud NAT, Workload Identity, Docker, Docker Hub, Debian, bullseye, bookworm, Windows, WSL, Pulumi, Chroma, TensorFlow, nginx, GitHub Actions, AC215, RAG, Milestone 5, dlops. (c) Lab-speech English, a closed list: the series'' repo, clone, commit, pin, container, image, tag, Dockerfile, port, bucket, registry, push, pull, shell, URL, API, ID, IP, DNS, JSON, YAML, VM, SSH, CPU, GB, and L20''s stack, state, config, provider, backend (Pulumi''s state backend only), stack reference; new in this lecture Pod, Deployment, ReplicaSet, Service, Job, Ingress, Ingress controller, PVC, namespace, label, selector, requests (the Pod''s resource requests only, A7), kubeconfig, API server, controller manager, dispatcher (the kubectl package), Helm chart. Nothing else is code-switched.'
- '[A2] container, image, port, VM and the laptop, as L1-L21. The subtitles say container, image, port, VM (起一个 container, 构建 image, port 8080, 一台 VM); measure words 个 container / 个 image / 个 Pod / 个 Service / 台 VM / 台机器 / 个节点 / 块磁盘; virtual machine → 虚拟机 (an ordinary virtual machine → 一台普通的虚拟机), VM → VM; machine → 机器; server → 服务器 (several servers → 多台服务器); the laptop → 笔记本; the toolbox → 工具箱 (the container keeps its English name cheese-app-deployment on screen). Titles, chapter names, meta.yaml and companion docs write 容器, 镜像, 端口, 虚拟机（VM） (A4).'
- '[A3] Kubernetes architecture and the cloud (Kubernetes Chinese docs, GKE Chinese console, L1, L16, L20). Kubernetes → Kubernetes (never K8s in a subtitle; deploy k8s is a folder, A6); orchestrator → 编排工具; orchestration → 编排; cluster → 集群 (a cluster of machines → 由多台机器组成的集群; a test cluster → 测试集群; the kind cluster → 这个 kind 集群; a regional cluster → 区域集群); node → 节点 (two nodes → 两个节点; node 1 / node 2 → 节点 1 / 节点 2); worker / worker node → 工作节点; control plane → 控制平面 (the brain → 大脑; run by Google → 由 Google 运行); the two planes → 两个平面; the parts → 各个组件; API server → API server; etcd → etcd (the memory of the cluster → 集群的记忆); scheduler → 调度器 (also when S05[7] lists it by name); controllers → 控制器 (the ReplicaSet controller → ReplicaSet 控制器); controller manager → controller manager (S05[7], a Pod''s name); kubelet → kubelet (the hands of the API server → API server 的双手); kube proxy → kube-proxy; container runtime → container 运行时; containerd → containerd; node pool → 节点池 (a pool of one or two nodes → 一个有一到两个节点的节点池); the cloud provider → 云平台 (S06[7]; never provider, which is Pulumi''s, A7); load balancer → 负载均衡器; the cloud load balancer → 云负载均衡器; external IP → 外部 IP; public addresses → 公网地址; private network → 私有网络; subnet → 子网; router → 路由器; NAT gateway → NAT 网关; Cloud NAT → Cloud NAT; network → 网络; firewall rules → 防火墙规则; forwarding rules → 转发规则; disks → 磁盘 (a cloud disk → 一块云磁盘); node auto repair → 节点自动修复; zone → 可用区 (zone us east 1 c → 可用区 us-east1-c; the zone flag → --zone 参数); region → 区域 (the region → 区域; the region flag → --region 参数); the console → 控制台; billing → 结算; costs money by the hour → 按小时收费; the pricing calculator → 价格计算器; the cluster fee → 集群管理费.'
- '[A4] Written vs spoken pairs. Subtitles say repo / container / image / port / VM / registry / stack / state / namespace / label / requests; titles, chapter names, meta.yaml and the companion docs write 仓库 / 容器 / 镜像 / 端口 / 虚拟机（VM）/ 镜像仓库（registry）/ 堆栈（stack）/ 命名空间（namespace）/ 标签（label）/ 资源请求（requests）, each gloss once per document. Pod, Deployment, ReplicaSet, Service, Job, Ingress, PVC, kubectl, Helm stay English everywhere (the Kubernetes Chinese docs keep the kinds in English, and so does publish.description_zh). Products stay as they are everywhere (Kubernetes, GKE, Pulumi, Helm, kind, Workload Identity, Cloud NAT, sslip.io).'
- '[A5] Writing artifacts. Copied verbatim (case, dots, slashes, hyphens, colons unchanged); never translated, inflected, quoted, put in 《》 or code formatting. Add a Chinese head noun where it helps: web 这个 Deployment, kubernetes 这个 Service, vector-db 这个 Service, cheese-app-namespace 这个 namespace, run: web 这个 label, --region 参数, secrets 目录, deploy k8s 目录, Create Cluster 这一步, Create & Deploy Cluster 这一节. A lower-case command, tool, flag, object or file name never opens a Chinese sentence (as the English never does), and the script''s own sentences that open with a capitalised tool name get a Chinese opener in Chinese: Etcd is the memory → 其中 etcd 是……; Kube proxy routes → 节点上还有 kube-proxy……; Get nodes. → 命令 get nodes。; Apply only hands → 命令 apply 只是……; Hostname prints → 命令 hostname 打印……; The gcloud tool → 工具 gcloud……; The web Service → 名叫 web 的 Service; The nginx controller answers → 回答的是 nginx controller; The deployment key goes → 把 deployment 的密钥放进……; Bullseye becomes bookworm → 把 bullseye 换成 bookworm.'
- '[A6] Artifacts the checker rejects. With no say:, the checker reads the display line as speech and rejects letter_letter names, maths symbols (+ = < > → and friends) and brackets of any kind. So these are never copied into the Chinese line; they are written the way the narration says them, and the English line carries the literal (D4): deploy_images → deploy images (目录); deploy_k8s → deploy k8s; setup_containers.py → setup containers; create_cluster.py → create cluster; ip_address → ip address; nginx_ingress_ip → nginx ingress ip; app_url → app URL; ROOT_PATH → ROOT PATH 变量; PULUMI_ACCESS_TOKEN must be set → Pulumi access token must be set (as L20); --replicas=4 → replicas 设成 4; <pod-name> → pod name 占位符 and its angle brackets → 尖括号 (never the characters); EXTERNAL-IP <pending> → 外部 IP 显示 pending; plus 4 / plus 23 to create → 要创建 4 个 / 要创建 23 个; NoneType object is not subscriptable keeps the screen''s words without its quotes; Create & Deploy Cluster keeps its & (the checker accepts it). Allowed as written, because the checker accepts them: run: web, gcp:project, web.default.svc.cluster.local, IP.sslip.io, -n cheese-app-namespace, -c wait-for-chromadb, us-east1-c, dlops/tic-tac-toe, /api-service/status, docker-shell.sh.'
- '[A7] Words to keep apart. Service (the Kubernetes object: the web Service → 名叫 web 的 Service; by the Service name → 按 Service 名字) ≠ 服务 (generic: Google''s services, Pulumi''s cloud service → 它自己的云服务) ≠ 服务账号 (service account) ≠ Kubernetes 服务账号 (the API''s Kubernetes service account, api-ksa). Deployment (the object; the Deployment object → Deployment 对象) ≠ 部署 (the verb and the activity: deploy the app → 部署应用; deployment means a way of deploying → 这里的“部署”指一种部署方式) ≠ deployment (the service account and the folder, artifacts: deployment 账号, deployment 目录). label (Kubernetes labels: 打 label, run: web 这个 label) ≠ 标签 (the GREY / YELLOW tags on screen: 灰色标签, your turn 标签). controller → 控制器 (the control plane''s controllers, the ReplicaSet controller) ≠ Ingress controller / nginx controller (the NGINX Ingress controller, kept English, so the two never blur). requests (the Pod''s resource requests: by their requests → 按 requests; needs requests → 需要 requests; asks for a quarter CPU → 申请四分之一个 CPU) ≠ 请求 (HTTP requests: requests spread across copies → 请求分散到各个副本上). state → state only for Pulumi''s state (the same state bucket → 同一个 state bucket) ≠ 状态 (the cluster''s state in etcd: its state and configuration → 它的状态和配置) ≠ 期望状态 (desired state). provider → provider only for Pulumi (a Kubernetes provider → 一个 Kubernetes provider) ≠ 云平台 (the cloud provider the controllers ask). config → config for Pulumi''s config (three config keys → 三个 config 键) ≠ 配置 (generic) ; config 键 (a key name) ≠ 密钥 (a key file). Job (the Kubernetes object) ≠ 任务 (not used). copies / replicas → 副本 (L13, L16) both; replicas 4 is A6. scale → 扩展 (the ask: Scaling → 扩展) / 扩到 (scale the frontend to 3 → 把前端扩到 3 个) / 缩回 (scale back to 2 → 缩回 2 个); autoscaler → 自动扩缩器 (L16); Pod autoscaler → Pod 自动扩缩器; the node layer → 节点这一层. output → 输出 (Pulumi outputs, the cluster outputs → 集群输出; the outputs block → 那一段输出) ≠ 打印 (a command prints → 打印). namespace → namespace (never 命名空间 in a subtitle; A4 for titles). region → 区域 ≠ zone → 可用区. node → 节点 ≠ Node.js (not said). the folder (a namespace is a folder for objects → 装对象的目录; the folders on the VM disk → VM 磁盘上的目录).'
- '[A8] Kubernetes objects and desired state (new in this lecture). Pod → Pod (Pods are mortal → Pod 是会死的; a throwaway Pod → 一个用完即弃的 Pod; the loader Pod → 加载器 Pod); Deployment → Deployment (says what runs in a Pod, how many copies, and to keep them running → 说明 Pod 里跑什么、跑几个副本、并保持它们一直运行); ReplicaSet → ReplicaSet (owns → 拥有); the template / the Pod template → 模板 / Pod 模板; a hash of the Pod template → Pod 模板的哈希值; a short random suffix → 一个随机的短后缀; Service → Service (says how traffic reaches them, and lets Pods die → 说明流量怎么到达它们，Pod 死了也没关系); label → label; selector → selector (the lasso → 套索); finds its Pods by that label, not by name → 按这个 label 找到自己的 Pod，而不是按名字; namespace → namespace (folders for objects → 装对象的目录); Job → Job (retries a failed run a few times, and once it succeeds, it stays done → 运行失败会重试几次，一旦成功，就保持完成状态); persistent volume claim / disk claim → PVC; Ingress → Ingress; Ingress rule → Ingress 规则; Ingress controller → Ingress controller; Helm → Helm (installs → 安装); kubeconfig → kubeconfig (an entry in your kubeconfig → kubeconfig 里的一条记录); Workload Identity → Workload Identity (swaps it for gcp service at the door → 在门口把它换成 gcp-service); binding → 绑定; identity → 身份; object → 对象; a wish → 一个愿望 (hands a wish to the API server → 把一个愿望交给 API server; stores your wish in etcd → 把你的愿望存进 etcd); desired state → 期望状态; declared → 声明的 (keeps them the way you declared → 让它们保持你声明的样子); the loop: observe, compare, act → 观察、比较、行动; like a thermostat → 就像恒温器; Declare the result, don''t script the steps → 声明结果，别去写步骤的脚本; self-healing → 自愈; a restart, not a hot standby → 是重启，不是热备; rollout → rollout status (the command) / rolled out (the status word); the grammar command, type, name, flags → 命令、类型、名字、参数.'
- '[A9] Register: a TA running a lab section. Short instructions, colloquial verbs (跑, 起, 建, 删, 开, 敲, 改, 加, 换, 挑, 看一圈, 连上, 进到, 扩到, 缩回, 收拾); address the viewer as 你 (one-to-one follow-along; never 您, 大家, 同学们; your project''s Milestone 5 → 你们项目的 Milestone 5 is the one plural, the course team project); 我们 is us at recording time (ours stops at once → 我们的马上就停了; our recording machine → 我们录制用的机器; our estimate → 我们的估算). Chinese word order inside a clause; the English clause order is kept (D9). No translationese: not 让我们…… (say 我们来…… / 先……), not 这就是为什么…… (say 所以……), few 被, no strings of 一个……的. No internet slang. Spoken rhythm by meaning: Let''s open the cluster → 我们把集群打开看看; Now follow the arrows → 现在顺着箭头走; Back to the night-time problem → 回到半夜那个问题; Follow one click → 跟着一次点击走; Then the big one → 然后是重头戏; Keep in mind → 记住; Next → 接下来; Then → 然后; Last → 最后; Run it again → 再跑一次.'
