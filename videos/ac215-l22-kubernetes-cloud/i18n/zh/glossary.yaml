ast 1 c → --zone us-east1-c; docker-shell.sh line 13 → docker-shell.sh:13; google cloud SDK → google-cloud-sdk; google cloud CLI → google-cloud-cli; get credentials → get-credentials; region flag → --region; zone flag → --zone; port forward → port-forward; the S R C folder → src; kube proxy → kube-proxy; test cluster, two nodes → test-cluster --num-nodes 2; Component statuses → componentstatuses; plus 4 / plus 23 to create → + 4 / + 23 to create; pod name in angle brackets → <pod-name>; the quoted errors (no active account, connection refused, invalid grant, account not found → invalid_grant: Invalid grant: account not found, none type is not subscriptable → ''NoneType'' object is not subscriptable, namespace not found → namespaces "cheese-app-cluster-namespace" not found, no credentialed accounts → No credentialed accounts, created stack dev → Created stack ''dev'', multi attach → Multi-Attach). Not restored: the README step headings (said as written already), port numbers, Milestone 5, docker-shell.bat. The English video''s own .srt is not affected. In zh all of these artifacts stay English (A1, A6).'
- '[D5] Content parity. Each Chinese sentence translates its English sentence only: no added commands, flags, glosses, Chinese screen names or explanations; kept-English words get no Chinese explanation (the English line is right below); ponder questions get no answers (A10). Head words A5 needs (这个, 命令, 工具, 参数, 目录, 文件, 变量, 这一节, 这一步) carry no content. An extra in the English is 额外.'
- '[D6] Fixed patterns (L9-L21''s, extended). The tracker names the README step, code panels name their file and lines, and your turn means pause and run it. → 进度条标出 README 的哪一步，代码面板标出文件和行号，your turn 表示暂停一下，自己跑一遍。 A grey tag in the corner names the lecture slides. → 角落里的灰色标签标出课件的页码。 Pause here and start your toolbox; … → 在这里暂停一下，启动你的工具箱；…… Pause and run yours; → 暂停一下，跑你的； Pause and try all five. → 暂停一下，五条都试一试。 Pause: on GKE, … → 暂停一下：在 GKE 上，…… Pause and try it. / Pause and try them. → 暂停一下，试一试。 Pause, check that your test cluster is gone, … → 暂停一下，确认你的测试集群已经没了，…… Pause and run your preview: → 暂停一下，跑你的 preview： Pause and start yours; → 暂停一下，启动你的； Pause and open your app URL. → 暂停一下，打开你的 app URL。 Pause and check. → 暂停一下，检查一遍。 otherwise, pause and run it → 否则就暂停一下，跑一遍. A question card (no "A question." in this script; if a revision adds it) → 想一想。 Test yourself. → 自测一下。 Answers are in the exercises and the study guide. → 答案在练习和学习指南里。 Failover: … Load balancing: … Scaling: … → 故障转移：……负载均衡：……扩展：…… That ticks failover / load balancing / scaling → 这就勾上了故障转移 / 负载均衡 / 扩展. First: / Second, / Third, (S03) → 第一步：/ 第二步，/ 第三步，. Fix 2 → 修复 2. A small slip: → 有一个小疏漏：; A small note: → 说明一点：; A small surprise: → 有个小意外：; One honest note: → 如实说一句：; A word of warning: → 提醒一句：; An extra check → 一个额外检查; ours … ; yours … → 我们的……；你的……. Picture words (policy 4): the brain → 大脑; the hands → 双手; lamps → 指示灯; the thermostat → 恒温器; a sticker / wearing its label → 贴纸 / 贴着它的 label; the lasso → 套索; one door with a receptionist → 一扇门，门后有一位前台; the meter runs → 计费表就开始走了; the lever / switch over by hand → 拉杆 / 手动切换; the toolbox → 工具箱; the stand-in → 替身; helmsman → 舵手.'
- '[D7] Files. narration/g1.yaml = S01-S08 (part 1, Kubernetes by hand: the 2 a.m. hook and the three asks, the orchestrator and the fleet, the cluster''s anatomy and kubectl''s grammar, the toolbox fixed twice, the test cluster and the stand-in, tic-tac-toe''s Deployment and Service, self-healing Pods, labels, Services, DNS, namespaces and the delete); narration/g2.yaml = S09-S16 (part 2, the cheese app as code: the blueprint and its costs, setup and the images stack, deploy k8s config and the 23-resource plan, pulumi up''s order and identity, the journey of one click, kubectl on the app and the outputs, logs and scaling at two levels, destroy, audit and recap). Each file starts with a comment naming its scenes and the script version it was made from (script.md v2, 2026-11-07).'
- '[D8] Length on the English timing. The Chinese is read while the English plays; the band switches where the English switches. Each Chinese sentence should be readable in the time its English sentence is heard: at most about 2 units per English word (a Hanzi counts 1, a Latin letter 0.55), so drop redundant connectives and repeated subjects, never content. Long artifacts cost length too (pulumi up --stack dev --refresh -y 17.6, pulumi destroy --stack dev --refresh -y 20.4, gcloud container clusters create test-cluster 23, gcloud container clusters get-credentials cheese-app-cluster 30, -n cheese-app-namespace 12, cheese-app-cluster-namespace 15, web.default.svc.cluster.local 16.5, Invalid grant: account not found 17.6, NoneType object is not subscriptable 19, Pulumi access token must be set 17.6, Deployment with Scaling using Kubernetes 22.5): do not repeat what the English does not; after the first time use the short form (这个 namespace, 这个集群, 这个 Service, 这个参数, 这个报错).'
- '[D9] Keep the English clause order (series lesson, ac215-video skill). The toolkit pairs Chinese and English clause by clause; a condition the English puts last but the Chinese puts first swaps meaning between two neighbouring cues. Keep conditions, purposes and time phrases where the English has them: If one of them crashes in the night, who restarts it? → 如果其中一个半夜崩了，谁来重启它？; Docker could restart a crashed container, but only on that one machine: if the machine itself failed, … → Docker 能重启崩掉的 container，但只限那一台机器：如果机器本身挂了，……; Skip it if you did it in lecture 20, with one condition we meet next; otherwise, … → 如果你在第 20 讲做过，可以跳过，但有一个条件，我们接下来会讲；否则……; You see this if the images stack never finished pulumi up in this same state bucket → 你会看到这个，如果 images stack 从来没有在同一个 state bucket 里跑完 pulumi up (the Chinese keeps the if-clause second, as the English); Delete the lecture 20 machine too, if it still runs → 第 20 讲那台机器也删掉，如果它还在运行; Scale back to 1 when you are done → 缩回 1 个，等你用完以后. Where the English opens with if, with, without, while, when, on, in, once, then or so (S01[0].1, S02[4], S04[3], S05[2], S07[8], S08[4], S12[9], S14[2]), the Chinese opens the same way.'
- '[G1] Width. Bilingual band: a Chinese line at most 30 units, an English line 96 characters; .zh.srt cues 22 units a line, 2 lines. Keep clauses under about 24 units, separated by ，；：、 so the cutter has clean cuts; never a clause over 30 units without a mark. The long artifacts (D8) take a clause of their own; S02[0], S03[1], S03[4], S05[0], S06[0], S07[1], S09[4], S11[3], S12[6], S14[1], S14[2], S14[6] and S16[3] get a comma at each English clause break.'
- '[G2] Cue ends: the toolkit strips 。，、；： at the end of each cue and keeps ？！…… and a closing ” (subtitles.strip_end). Prefer ending a clause on a Chinese word rather than on artifact + 。 where the English allows (……放进 secrets 目录里。 reads better than ……secrets。); the quoted terminal text (pull access denied, No credentialed accounts, no active account, connection refused, 200 OK, 404 Not Found, Created stack dev) may close a sentence as it does in the English.'
- '[G3] Names and commands are never split. The cutter treats a space between two Latin words in a Chinese line as a good cut, so pulumi up --stack dev --refresh -y, pulumi destroy --stack dev --refresh -y, pulumi preview --stack dev --refresh, pulumi stack init dev, gcloud container clusters create test-cluster, gcloud container clusters delete test-cluster, gcloud container clusters get-credentials cheese-app-cluster, gcloud auth list, kubectl apply -f, kubectl get services, -n cheese-app-namespace, Create & Deploy Cluster, Deployment with Scaling using Kubernetes, Invalid grant: account not found, NoneType object is not subscriptable, Pulumi access token must be set, No credentialed accounts, Service Account Admin, Workload Identity, Ingress controller, API server and controller manager could land on two lines. Put them at a clause end, after a full-width colon or 、, with little Chinese around them, at most one long label per cue; after the .zh.srt is rendered, check every cue with a command, a log phrase or a role name.'
- '[H1] Titles (meta.yaml). Video, part and chapter titles in the written register (A4: 容器, 镜像, 仓库, 虚拟机（VM）, 堆栈（stack）, 命名空间（namespace）, 标签（label）); questions keep their question mark; the English colon structure is kept (期望状态：会自己回来的 Pod; deploy_k8s：配置和 23 个资源的计划; pulumi up：建什么，按什么顺序); commands, tools, object kinds and names as they are (Kubernetes, GKE, kubectl, Pulumi, Pod, Deployment, Service, Ingress, deploy_k8s, pulumi up; meta.yaml is not read by the checker, so underscores and brackets are fine there). The video title uses the series pattern AC215 · 第 n 讲：…（跟练：…）, in substance the same as video.yaml''s publish.title_zh (扩展：云上的 Kubernetes——先手动体验一个测试集群，再用 Pulumi 把奶酪 App 部署到 GKE). The core-concept chapters carry their English short name once where the Chinese is not the usual search word (期望状态（desired state）; 控制平面（control plane）). The recap follows the series 收尾 pattern (Destroy, audit, recap → destroy、清点残留与回顾). No title names the instructor (A16).'
- '[H2] Description (Bilibili / YouTube): two or three sentences, written register, this glossary''s terms: the follow-along of AC215 lecture 22 against the slides and the README step by step (part 1 by hand: why one VM needs someone to restart containers at night, the three asks failover / load balancing / scaling, the cluster''s control plane and worker nodes, the toolbox''s two one-line fixes, a test cluster with kubectl on a labelled kind stand-in, tic-tac-toe''s Deployment and Service, labels, self-healing Pods, cluster DNS and namespaces, then delete; part 2 as code: the cheese app''s blueprint on GKE, the images stack and deploy_k8s, the 23-resource plan and the order pulumi up builds in, Workload Identity, one click from sslip.io through the load balancer and the NGINX Ingress controller to the Pods, kubectl on the app with the README''s outdated namespace corrected, scaling at two levels, destroy and the audit), the honest-errors framing (no Google account on the recording machine), the GOLD costs. No instructor name (A16); the course credit line with names lives only in video.yaml''s publish block.'
- '[H3] Companions: i18n/zh/README.md (and exercises.md / digest.md if made) are translated with this glossary in the written register (A4: 仓库, 克隆, 容器, 镜像, 端口, 虚拟机（VM）, 镜像仓库（registry）, 堆栈（stack）, 状态（state）, 命名空间（namespace）, 标签（label）, 资源请求（requests）, 集群, 节点, 控制平面, 调度器, 控制器, 节点池, 负载均衡器, 自动扩缩器, 服务账号, 密钥), each gloss once per document. Close with a term table: English | the word used here | other common renderings (namespace: namespace / 命名空间 / 名字空间; label: label / 标签; selector: selector / 选择算符 / 选择器; control plane: 控制平面 / 控制面; requests: requests / 资源请求; autoscaler: 自动扩缩器 / 自动伸缩; PVC: PVC / 持久卷申领).'
- '[H4] Code and commands in companions stay byte for byte: code blocks, commands, file names and inline `code` are unchanged; only # comments and the prose around them are translated.'
- '[I1] (request, open since L3) explainer.i18n check applies the voice hygiene of the display line when a sentence has no say: (_SPOKEN_BAD: brackets, maths symbols, letter_letter names, the 种 rule). For a subtitles-only video (this series; video.yaml has no Chinese voice) the display could be allowed brackets and underscores, which would let deploy_k8s, ROOT_PATH, --replicas=4 and <pod-name> be written literally. Until then A6 and B3 apply.'
- '[I2] (open, from L1 I3) explainer/subtitles.py _cuts treats a space between Latin words in a Chinese line as a good cut, so commands, log phrases and role names can be split (G3). Proposal: in a Chinese line, treat a run of Latin words joined only by spaces as one token.'
- '[I3] (note) explainer/subtitles.py reads every video''s glossary.yaml: 2-3 word English phrases of each term''s en are kept on one English line, and the 2-7 character Chinese headwords of zh_subtitle are registered in jieba, for all videos'' subtitles. So every zh_subtitle here holds terms separated by " / ", never example phrases.'
terms:
# ---------------------------------------------------------------- S01 Who restarts it at 2 a.m.?
- en: 'a small app on one virtual machine / a web server in front / two APIs behind it / crashes in the night / who restarts it'
  zh_subtitle: '虚拟机 / Web 服务器 / 半夜 / 崩了 / 重启'
  first_use: 'S01[0]：如果其中一个半夜崩了，谁来重启它？'
  note: 'A2, A3, D9 (the if-clause first, as the English). Here is a small app on one virtual machine: a web server in front, a frontend and two APIs behind it → 这是一台虚拟机上的一个小应用：前面一台 Web 服务器，后面是一个前端和两个 API.'
- en: 'two in the morning / the app owner / the operator / logs in over SSH / restarts it by hand'
  zh_subtitle: '凌晨两点 / 应用负责人 / 运维 / 手动'
  first_use: 'S01[1]：凌晨两点，一个 API container 崩了。'
  note: 'A16 (the story''s roles, never a name), C1. The app owner finds out when users complain, and the operator logs in over SSH and restarts it by hand → 应用负责人要等用户投诉才知道，运维通过 SSH 登录进去，手动重启它.'
- en: 'Docker could restart a crashed container / only on that one machine / the whole site waited for you'
  zh_subtitle: '整个网站 / 机器本身'
  first_use: 'S01[2]：在第 20 讲里，Docker 能重启崩掉的 container，但只限那一台机器：如果机器本身挂了，整个网站就只能等你来救。'
  note: 'A16, D9.'
- en: 'several servers / three machines / a backup copy beside each API / original'
  zh_subtitle: '多台服务器 / 备份 / 原件'
  first_use: 'S01[3]：于是应用负责人要多台服务器。'
  note: 'The operator answers with three machines, and a backup copy beside each API → 运维给了三台机器，每个 API 旁边再放一个备份. Each backup sits on the same machine as its original → 每个备份都和它的原件在同一台机器上 (P1, S01[4]: the question names neither disk nor machine failure, A10).'
- en: 'one failed disk or network / both copies at once / switch over by hand / the lever'
  zh_subtitle: '故障 / 手动切换 / 拉杆'
  first_use: 'S01[5]：是机器本身：一块坏掉的磁盘或一次网络故障，会同时带走两份。'
  note: 'A10 (the answer uses the question''s words), D6 (switch over by hand → 手动切换; never 拉闸, which means the opposite; the GREY lever on screen is 拉杆). And even when a backup survives, a person still has to switch over by hand → 就算备份活下来了，还是得有人手动切换.'
- en: 'three jobs done with nobody awake / failover / load balancing / scaling / a working copy takes over / requests spread across copies / more copies when traffic grows'
  zh_subtitle: '故障转移 / 负载均衡 / 扩展 / 副本 / 流量'
  first_use: 'S01[6]：负载均衡：请求分散到各个副本上。'
  note: 'A3, A7 (requests here are HTTP requests → 请求), A16 (three jobs → 三件事; the three asks → 三个诉求). The lecture wants three jobs done with nobody awake. → 课上要的是，没人醒着也能把三件事做好。 Failover: a working copy takes over. → 故障转移：一个正常的副本接手。 Scaling: more copies when traffic grows. → 扩展：流量变大时就多开副本。 The checklist on screen stays English (A11).'
- en: 'this card stays in the corner / tick each item / the tool for all three'
  zh_subtitle: '卡片 / 勾上 / Kubernetes'
  first_use: 'S01[7]：三件事用的工具都是 Kubernetes。'
  note: 'A11. This card stays in the corner, and we tick each item once we see what does the job → 这张卡片会留在角落里，等我们看到是谁在做这件事，就勾上一项.'
# ---------------------------------------------------------------- S02 From one box to a fleet
- en: 'an orchestrator / a cluster of machines / keeps them the way you declared / Greek for helmsman / Helm borrows it'
  zh_subtitle: '编排工具 / 集群 / 声明 / 舵手 / Helm'
  first_use: 'S02[0]：Kubernetes 是一个编排工具：它在一个由多台机器组成的集群上运行 container，并让它们保持你声明的样子。'
  note: 'A3, A8, D6. The name is Greek for helmsman, and Helm, a tool in part 2, borrows it → 这个名字在希腊语里是舵手的意思，第 2 部分用到的工具 Helm 也借了这个词.'
- en: 'one Docker engine / many machines called nodes / one control plane coordinates them'
  zh_subtitle: 'Docker 引擎 / 节点 / 控制平面 / 协调'
  first_use: 'S02[1]：右边，很多台机器，叫作节点，分担这些 container，由一个控制平面来协调。'
  note: 'A3. On the left, one machine runs every container on one Docker engine → 左边，一台机器在一个 Docker 引擎上跑所有 container.'
- en: 'a word of warning / a way of deploying / the Deployment object'
  zh_subtitle: '提醒一句 / 部署方式 / Deployment 对象'
  first_use: 'S02[2]：提醒一句：这里的“部署”指一种部署方式，不是我们后面要见到的 Deployment 对象。'
  note: 'A7 (部署 ≠ Deployment), B2 (the one translated quotation), A10.'
- en: 'the tools gain kubectl / the GKE auth plugin / which the slides do not list'
  zh_subtitle: 'kubectl / GKE 认证插件 / 课件'
  first_use: 'S02[3]：我们的工具箱里已经有它了，还有 Helm 和 GKE 认证插件，这两个课件上没列。'
  note: 'A14, A16. Now the same app goes to a cluster, and the tools gain kubectl → 现在同一个应用搬到集群上，工具里多了 kubectl.'
- en: 'to follow along / costs money by the hour / each part ends by deleting it'
  zh_subtitle: '跟着做 / 按小时收费 / 结算'
  first_use: 'S02[4]：集群按小时收费，所以每个部分最后都会把它删掉。'
  note: 'A3. To follow along: cheese app version 3 with your secrets folder beside it, Docker, and a Google Cloud project with billing → 跟着做需要：cheese-app-v3，旁边放着你的 secrets 目录，再加上 Docker，以及一个开通了结算的 Google Cloud 项目.'
- en: 'the tracker names the README step / code panels name their file and lines / your turn means pause and run it / a grey tag in the corner names the lecture slides'
  zh_subtitle: '进度条 / 代码面板 / 行号 / 灰色标签 / 页码'
  first_use: 'S02[5]：进度条标出 README 的哪一步，代码面板标出文件和行号，your turn 表示暂停一下，自己跑一遍。'
  note: 'A11, D6. A grey tag in the corner names the lecture slides. → 角落里的灰色标签标出课件的页码。'
- en: 'one honest note / our recording machine has no Google account / first honest error / what yours prints'
  zh_subtitle: '如实说一句 / 录制用的机器 / 报错'
  first_use: 'S02[6]：如实说一句：我们录制用的机器没有 Google 账号。'
  note: 'A10, A13: the sandbox framing, said once, plain. What runs on a machine you own is real; every Google step stops at its first honest error, and we say what yours prints → 在自己的机器上能跑的都是真的；每个 Google 步骤都停在它第一个真实的报错处，我们会告诉你，你那边会输出什么.'
- en: 'we follow main / the branch the course site links / this November 2025 commit / Git log tells you'
  zh_subtitle: 'main / 分支 / 课程网站 / commit'
  first_use: 'S02[7]：我们跟的是 main，也就是课程网站链接的分支，用的是 2025 年 11 月的这个 commit。'
  note: 'A16, C2. Git log tells you which one you have. → 用 git log 就能看出你手上是哪一个。 (A5: never git log at the sentence start).'
- en: 'the lecture''s warm-up by hand / deploys the cheese app as code'
  zh_subtitle: '热身 / 奶酪应用 / 写成代码'
  first_use: 'S02[8]：第 2 部分把奶酪应用写成代码来部署。'
  note: 'A15, A16. Part 1 does the lecture''s warm-up by hand. → 第 1 部分手动做课上的热身。'
# ---------------------------------------------------------------- S03 Inside a cluster: brain and workers
- en: 'let''s open the cluster / draws it in three steps / worker nodes / an ordinary virtual machine'
  zh_subtitle: '工作节点 / 普通的虚拟机 / 第一步'
  first_use: 'S03[0]：第一步：一个控制平面，箭头指向几个工作节点，每个节点都是一台普通的虚拟机。'
  note: 'A3, A9, A16. Let''s open the cluster. → 我们把集群打开看看。 The lecture draws it in three steps. → 课上分三步画它。'
- en: 'the two planes get names / the control plane is the brain / Google runs it / the workers carry your containers / a pool of one or two nodes'
  zh_subtitle: '大脑 / 节点池 / 承载'
  first_use: 'S03[1]：控制平面是大脑。'
  note: 'A3, D6 (the brain → 大脑). Second, the two planes get names. → 第二步，两个平面有了名字。 On GKE, Google runs it, and you never see its machines. → 在 GKE 上，它由 Google 运行，你永远看不到它的机器。 The workers carry your containers: for the cheese app, a pool of one or two nodes. → 工作节点承载你的 container：对奶酪应用来说，是一个有一到两个节点的节点池。'
- en: 'the API server / the single entry point / etcd is the memory of the cluster / its state and configuration'
  zh_subtitle: 'API server / 入口 / 记忆 / 状态 / 配置'
  first_use: 'S03[2]：其中 etcd 是集群的记忆：存着集群的状态和配置。'
  note: 'A5 (Etcd opens the English sentence; the Chinese gets 其中), A7 (状态 here is the cluster''s state, not Pulumi''s state). Third, the parts. → 第三步，各个组件。 The API server is the single entry point; every other part talks only to it. → API server 是唯一的入口；其他组件都只和它通信。'
- en: 'the scheduler picks a node for each new Pod / the controllers keep watching / fix any difference / what you asked for and what runs / ask the cloud for nodes and addresses'
  zh_subtitle: '调度器 / 控制器 / 差异 / 云平台'
  first_use: 'S03[3]：调度器给每个新 Pod 挑一个节点。'
  note: 'A3, A7. The controllers keep watching and fix any difference between what you asked for and what runs; some of them ask the cloud for nodes and addresses → 控制器一直在盯着，把你要求的和实际运行的之间的任何差异修正过来；其中一些会向云平台要节点和地址.'
- en: 'the kubelet is the hands of the API server / kube proxy routes traffic for Services / a container runtime / grouped in Pods'
  zh_subtitle: 'kubelet / 双手 / kube-proxy / container 运行时 / Pod'
  first_use: 'S03[4]：每个工作节点上，kubelet 是 API server 的双手：它负责启动和停止 container。'
  note: 'A3, A5 (Kube proxy routes … → 节点上还有 kube-proxy，为 Service 转发流量，container 运行时负责运行 container，这些 container 按 Pod 分组), D4 (kube proxy → kube-proxy), D6.'
- en: 'a small note / the slide names Docker as the runtime / line 52 of create cluster dot py / they run unchanged'
