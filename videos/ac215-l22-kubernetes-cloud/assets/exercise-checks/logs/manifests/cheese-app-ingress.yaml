# B8: the Ingress of setup_loadbalancer.py:62-117 written as YAML (same name, namespace, annotations,
# class, host rule, paths, path types, backends). HOST_PLACEHOLDER is replaced at run time by
# <controller node IP>.sslip.io, as setup_loadbalancer.py:60 builds it from the load balancer's IP.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cheese-app-ingress
  namespace: cheese-app-namespace
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: HOST_PLACEHOLDER
    http:
      paths:
      - path: /api-service
        pathType: Prefix
        backend: {service: {name: api, port: {number: 9000}}}
      - path: /
        pathType: Prefix
        backend: {service: {name: frontend, port: {number: 3000}}}
