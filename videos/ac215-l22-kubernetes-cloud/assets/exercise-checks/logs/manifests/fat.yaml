# B6/C6: Pods that each request 3 CPUs (the frontend's 250m / 2Gi request, made big enough to fill a
# stand-in node: every kind node reports the session machine's 4 CPUs)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fat
spec:
  replicas: 1
  selector:
    matchLabels: {run: fat}
  template:
    metadata:
      labels: {run: fat}
    spec:
      containers:
      - name: fat
        image: busybox:1.36
        command: ["sleep", "3600"]
        resources:
          requests: {cpu: "3"}
