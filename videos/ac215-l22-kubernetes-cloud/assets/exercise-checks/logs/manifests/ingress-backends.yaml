# B8: stand-ins for the frontend and the API: traefik/whoami answers every request with its Pod name and
# the request line and Host header it received. Names, labels and ports as in setup_containers.py
# (Deployment + ClusterIP Service `frontend` on 3000, `api` on 9000, namespace cheese-app-namespace).
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: cheese-app-namespace}
spec:
  selector: {matchLabels: {run: frontend}}
  template:
    metadata: {labels: {run: frontend}}
    spec:
      containers:
      - {name: frontend, image: "traefik/whoami:v1.10.3", args: ["--port", "3000"], ports: [{containerPort: 3000}]}
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: cheese-app-namespace}
spec:
  type: ClusterIP
  ports: [{port: 3000, targetPort: 3000, protocol: TCP}]
  selector: {run: frontend}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: cheese-app-namespace}
spec:
  selector: {matchLabels: {run: api}}
  template:
    metadata: {labels: {run: api}}
    spec:
      containers:
      - {name: api, image: "traefik/whoami:v1.10.3", args: ["--port", "9000"], ports: [{containerPort: 9000}]}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: cheese-app-namespace}
spec:
  type: ClusterIP
  ports: [{port: 9000, targetPort: 9000, protocol: TCP}]
  selector: {run: api}
