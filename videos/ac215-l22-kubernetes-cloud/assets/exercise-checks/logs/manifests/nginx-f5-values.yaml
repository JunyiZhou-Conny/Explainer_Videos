# B8: the Helm values of setup_loadbalancer.py:19-44, with TWO changes for the stand-in: the controller's
# Service is a NodePort (kind has no cloud load balancer; on GKE it is type LoadBalancer), and IPv6 is off
# (the session machine's kernel has no IPv6: with it on, nginx stops at `socket() [::]:80 failed (97:
# Address family not supported by protocol)`; a GKE node does not need this).
controller:
  disableIPV6: true
  service:
    type: NodePort
  resources:
    requests: {memory: 128Mi, cpu: 100m}
    limits: {memory: 256Mi, cpu: 200m}
  replicaCount: 1
  ingressClass:
    name: nginx
    create: true
    setAsDefaultIngress: true
