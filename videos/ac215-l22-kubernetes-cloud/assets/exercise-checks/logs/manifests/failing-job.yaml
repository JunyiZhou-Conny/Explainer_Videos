# C5: the same Job settings (backoffLimit 3, restartPolicy Never), with a container that always fails
apiVersion: batch/v1
kind: Job
metadata:
  name: always-fails
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: loader
        image: busybox:1.36
        command: ["sh", "-c", "echo attempt on $(hostname); exit 1"]
