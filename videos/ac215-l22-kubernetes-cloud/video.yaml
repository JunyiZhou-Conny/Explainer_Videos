# Bilibili metadata for the release (tools/release_episode.py → PUBLISH.json → the Mac publish worker).
# Draft written with the brief; the finishing step checks it against the final cut.
publish:
  title_zh: "AC215 第22讲跟练 · 扩展：云上的 Kubernetes——先手动体验一个测试集群，再用 Pulumi 把奶酪 App 部署到 GKE"
  description_zh: |
    哈佛 AC215（MLOps & LLMOps，2026 秋）第 22 讲教程的逐条命令跟练，照着 dlops-io/cheese-app-v3 的 README 一步一步做，并对照课件逐页讲解。
    上半场（手动体验 Kubernetes）：为什么一台 VM 需要有人半夜去重启容器；failover、load balancing、scaling 三个诉求；
    集群的组成：control plane（API server、etcd、scheduler、controllers）与 worker node（kubelet、kube-proxy、containerd、Pod）；
    部署工具箱容器（录制当天 Dockerfile 仍需两处一行修改才能构建）；用 gcloud 创建测试集群，用 kubectl 查看；
    部署 tic-tac-toe：Deployment 与 Service、label 与 selector、被删掉又自己回来的 Pod、cluster DNS、namespace，最后删除集群。
    下半场（用 Pulumi 部署奶酪 App 到 GKE）：VPC 与 Cloud NAT、私有节点、node pool；deploy_images 与 deploy_k8s 两个 stack，
    23 个资源的计划与创建顺序；Workload Identity；一次点击的完整路径：sslip.io → 负载均衡 → NGINX Ingress → Service → Pod；
    kubectl 查看应用、进入 Pod、读 Job 日志（README 调试命令里的 namespace 已过时）；Pod 与节点两层扩展、resource requests、
    Pending 与自动扩容、ReadWriteOnce 磁盘为什么限制 API 扩展；pulumi destroy 与残留资源检查。
    录制环境没有 Google 账号：每个云端步骤都展示到它真实的第一个报错为止；kubectl 命令在一个明确标注的本地替身集群（kind，不是 GKE）上真实运行。边看边暂停，在自己的项目里跑每一条命令；集群按小时计费，每一部分结尾都有删除步骤。
    英文旁白，中英双语字幕。

    教程仓库：https://github.com/dlops-io/cheese-app-v3
    学习笔记（全部命令、真实输出和练习答案）：https://github.com/JunyiZhou-Conny/MLOps_Learning/blob/main/guides/L22-kubernetes-cloud.md

    课程与教程内容来自 Harvard AC215 课程组（Pavlos Protopapas 等）；本视频是个人学习用的非官方讲解，引用课件只注明页码，不展示课件。
  tags_zh: [AC215, MLOps, Kubernetes, GKE, Pulumi, kubectl, 云部署, 扩展, 哈佛, 教程跟练]
  tid: 231
