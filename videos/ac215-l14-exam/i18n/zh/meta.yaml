description: |
  AC215（哈佛 MLOps & LLMOps）第 14 讲“无服务器部署”的考前精讲版，为第 4 次小测准备：不逐条跟练 README，而是用动画把小测考的机制讲透，并以演示仓库 dlops-io/serverless-deployment 和 dlops-io/model-deployment 的代码和 README 原文为依据。内容包括：按容器的生命周期区分 Cloud Run 服务（service）和作业（job）、空闲时间只让常驻的资源计费（虚拟机、最小实例数、端点副本）而请求数和时长只影响按用量计费的账单、部署函数交出的是源代码和入口点而部署服务交出的是镜像、“谁能调用”与“以谁的身份运行”的区别（服务账号不需要密钥），以及把预处理放在端点（endpoint）上、注册同时做预处理和推理的 serving 函数，让一次部署就能更新或回滚所有客户端；中间穿插三道新的选择题，最后用七条规则回顾。英文旁白，配中文和中英双语字幕；视频不做任何现场运行，每个面板都是仓库源码或我们自己的示意图。
