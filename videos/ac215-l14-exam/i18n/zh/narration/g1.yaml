# zh narration for S01-S08 (the whole exam edition in one file; the GLOSSARY's g1 / g2 split is only a division
# of labour), sentence-aligned to script.md v1: one zh sentence per English sentence
# (explainer.voice.split_sentences; 66 SAY lines, 191 sentences). Terms and rules: ../GLOSSARY.md,
# ../glossary.yaml (binding).
# Subtitles only: there is no Chinese voice, so no say: and no anchors (rule D2); the zh line is shown on the
# English timing, so each sentence keeps the English order of clauses and about its length (D8, D9: S02[9] and
# S08[0] open with 如果 where the English opens with if; S07[0] keeps the condition after the claim; S08[3] puts
# each product first; S05[6] pairs each log with its failure in one clause).
# Underscore names are written the way the SAY speaks them (rule A6: hello 下划线 http, preprocess image,
# serving function, serving default, bytes inputs; min_replica_count as 最小副本数); no brackets and no symbols
# the checker refuses (B3: 224 乘 224, 0 到 1 之间, 源代码加入口点). Numbers as the SAY writes them (C1).
# The ponder lead-ins (S02[7], S03[6], S06[6], S07[4]) give nothing away (A9).
# en_display: the English subtitle line where the SAY spells an artifact as words (rule D4: translation-audio,
# hello_http, translation-demo-runtime, preprocess_image, serving_function, bytes_inputs, serving_default);
# null = the SAY text.
S01:
- en: "Here is a Cloud Run job called translation audio. It uses the same image as a translation web app that works perfectly. We press Execute, and the job starts."
  zh:
  - "这是一个叫 translation-audio 的 Cloud Run job。"
  - "它用的 image 和一个运行得好好的翻译 web 应用一样。"
  - "我们点 Execute，这个 job 就开始了。"
  en_display:
  - "Here is a Cloud Run job called translation-audio."
  - null
  - null
- en: "Minutes pass. Nothing lands in the output bucket, and the job never says it is done. It runs straight into the task timeout we gave it. 5 minutes, and the platform stops it."
  zh:
  - "几分钟过去了。"
  - "输出 bucket 里什么也没有，这个 job 也从来不说自己完成了。"
  - "它一头撞上我们设的任务超时。"
  - "5 分钟，平台把它停掉了。"
- en: "The clue is the last line of the Dockerfile: its default command starts the web server. The README's troubleshooting table even lists the symptom: a job that starts a server instead of finishing."
  zh:
  - "线索在 Dockerfile 的最后一行：它的默认命令会启动 web 服务器。"
  - "README 的故障排查表甚至列出了这个症状：一个 job 启动了服务器，而不是跑完。"
- en: "Same image, same code. So why does the web app work, while the job never ends? Hold that question."
  zh:
  - "同一个 image，同一份代码。"
  - "那为什么 web 应用能用，这个 job 却永远不结束？"
  - "先记着这个问题。"
- en: "For the quiz, this lecture comes down to five ideas. Service or job. Who pays for idle time. What you hand over to deploy. Who may call your code, and who it runs as. And the model endpoint: where preprocessing lives, and which function it calls."
  zh:
  - "对这次小测来说，这一讲归结为五个考点。"
  - "是 service 还是 job。"
  - "谁为空闲时间付钱。"
  - "部署时你要交出什么。"
  - "谁能调用你的代码，它又以谁的身份运行。"
  - "还有模型 endpoint：预处理放在哪里，它调用哪个函数。"
- en: "The gray tag, top right, names the lecture slide behind each idea."
  zh:
  - "右上角的灰色标签，标出每个考点背后的那页课件。"
S02:
- en: "The lecture says Cloud Run runs a container as a service or a job. The demo app shows both: one image, two startup commands, serve or batch."
  zh:
  - "课上说，Cloud Run 可以把一个 container 作为 service 或 job 来运行。"
  - "这个演示应用两种都有：一个 image，两个启动命令，serve 或 batch。"
- en: "Serve starts gunicorn, a web server, on the port Cloud Run gives it, 8080 by default. Then it waits, and answers each request that arrives."
  zh:
  - "这个 serve 命令启动 gunicorn，一个 web 服务器，跑在 Cloud Run 给它的 port 上，默认是 8080。"
  - "然后它就等着，来一个请求就回答一个。"
- en: "That shape is a service. It has a URL, adds instances when traffic rises, and can scale to zero when it stops. It never finishes on purpose: listening is its job."
  zh:
  - "这种形状就是 service。"
  - "它有 URL，流量上来时加实例，流量停了可以缩容到零。"
  - "它本来就不会结束：监听就是它的本职工作。"
- en: "Batch has a different shape. It reads the passage, translates it, generates speech, saves the files, and exits. If a step fails, it exits with status 1, so the execution shows failed, not a false success."
  zh:
  - "而 batch 是另一种形状。"
  - "它读入那段文字，翻译它，生成语音，保存文件，然后退出。"
  - "如果某一步失败，它以退出码 1 退出，所以这次执行显示失败，而不是假的成功。"
- en: "The README calls this a job: no URL, nothing waiting for requests. Something starts it, and it runs to completion."
  zh:
  - "README 把这叫做 job：没有 URL，没有东西在等请求。"
  - "有东西启动它，它就一直跑到完成。"
- en: "Now the hook. The job inherited the image's default command, serve, so it started a web server and waited for requests that never come. The fix: the command python, with the batch arguments. Same image, and now the strip ends."
  zh:
  - "现在回到开头。"
  - "这个 job 继承了 image 的默认命令，也就是 serve，所以它启动了 web 服务器，等着永远不会来的请求。"
  - "修复：命令用 python，再加上 batch 参数。"
  - "同一个 image，现在时间条有了尽头。"
- en: "Who presses start? In the README, you click Execute. For a nightly run, the usual trigger is Cloud Scheduler, which this README does not use."
  zh:
  - "谁来按开始？"
  - "在 README 里，是你点 Execute。"
  - "如果要每晚运行，常用的触发器是 Cloud Scheduler，不过这个 README 没有用它。"
- en: "Try one. A container indexes new documents and exits, once an hour. Read the lifecycle, not the product names."
  zh:
  - "来试一道。"
  - "一个 container 给新文档建索引，然后退出，每小时一次。"
  - "看生命周期，别看产品名。"
- en: "B, a job on a Cloud Scheduler timetable: it runs to completion and costs nothing between runs. A pays for an instance all hour, and an idle service's CPU is throttled, so the loop stalls. C breaks the service contract: an instance that exits has crashed. D works, but the VM is paid for all hour while it idles. Why that matters is next."
  zh:
  - "选 B，按 Cloud Scheduler 时间表运行的 job：它跑到完成，两次运行之间不花钱。"
  - "A 整个小时都在为一个实例付钱，而且空闲的 service 的 CPU 会被节流，所以循环会卡住。"
  - "C 违反了 service 的约定：一个退出了的实例就是崩溃了。"
  - "D 能用，但这台 VM 整个小时都要付钱，哪怕它闲着。"
  - "为什么这很重要，下面就讲。"
- en: "So the rule: if the question says it runs, writes its output and exits, or that it runs every night, pick a job. If it says it answers requests, has a URL, or listens on a port, pick a service."
  zh:
  - "所以规则是：如果题目说它运行、写出结果然后退出，或者说它每晚运行，选 job。"
  - "如果题目说它回答请求、有 URL，或者监听一个 port，选 service。"
S03:
- en: "The lecture promises you pay only while your code runs. Let's make that exact: two meters, one day. The yellow ticks are requests."
  zh:
  - "课上承诺，只有代码运行时你才付钱。"
  - "我们把它说准确：两个计价器，一天。"
  - "黄色刻度是请求。"
- en: "The top row is a virtual machine. Its meter runs from boot to shutdown, requests or not. The gold shading is idle time, and you pay for all of it."
  zh:
  - "上面一行是一台虚拟机。"
  - "它的计价器从开机走到关机，不管有没有请求。"
  - "金色阴影是空闲时间，这些你全部都要付钱。"
- en: "The bottom row is a function, or a Cloud Run service with request-based billing and minimum instances 0, as in the README. Its meter moves only with invocations and how long each one runs."
  zh:
  - "下面一行是一个函数，或者一个按请求计费、最小实例数为 0 的 Cloud Run service，和 README 里一样。"
  - "它的计价器只随调用次数和每次运行多长时间而动。"
- en: "Now stretch the quiet gaps between requests. The VM meter grows, because idle hours are still provisioned hours. The function meter does not move at all: no requests, no charge."
  zh:
  - "现在把请求之间的安静间隔拉长。"
  - "VM 的计价器往上涨，因为空闲的小时仍然是预配的小时。"
  - "函数的计价器完全不动：没有请求，就没有费用。"
- en: "Zero idle cost has a price, and slide 16 names it: the cold start. After a quiet stretch, the first request waits while an instance starts. The README's remedy is minimum instances. Set it to 1, and a warm instance stays on for the first request, with its own meter running."
  zh:
  - "零空闲成本是有代价的，课件第 16 页点出了它：冷启动。"
  - "安静一阵之后，第一个请求要等一个实例启动。"
  - "README 的办法是最小实例数。"
  - "把它设成 1，就有一个热实例一直开着等第一个请求，它自己的计价器也在走。"
- en: "That always-on instance now sits in the VM row. So does next lecture's Vertex AI endpoint: its deploy call asks for a minimum replica count of 1, which the README calls the part that costs money."
  zh:
  - "这个常驻实例现在就落在 VM 那一行。"
  - "下一讲的 Vertex AI endpoint 也一样：它的部署调用要求最小副本数为 1，README 说这就是花钱的部分。"
- en: "Test it on a new case. Twice as many requests, each just as long, in the same days. Which bill changes?"
  zh:
  - "换个新情况试试。"
  - "请求数翻倍，每个一样长，天数不变。"
  - "哪份账单会变？"
- en: "B, only the function's. Watch: every request splits in two, and the function meter climbs, since every invocation and its running time are billed. The VM meter does not move, because it bills provisioned hours: A is backwards, and C is wrong. D confuses no minimum charge with free work."
  zh:
  - "选 B，只有函数的。"
  - "看：每个请求一分为二，函数的计价器往上涨，因为每次调用和它的运行时间都要计费。"
  - "VM 的计价器不动，因为它按预配的时长计费：A 说反了，C 是错的。"
  - "D 把没有最低收费和免费干活混为一谈。"
- en: "So the rule is not, serverless is cheap. The rule is: is anything always on? Idle time moves only the bills of always-on things. Request count and duration move only the pay-per-use bill."
  zh:
  - "所以规则不是：serverless 很便宜。"
  - "规则是：有没有什么东西一直开着？"
  - "空闲时间只影响常驻资源的账单。"
  - "请求数和时长只影响按用量计费的账单。"
S04:
- en: "Next, what you hand over. The lecture deploys one translate app four ways: virtual machine or serverless, code file or container. Earlier lectures filled the VM row. Today fills the serverless row."
  zh:
  - "接下来，你要交出什么。"
  - "课上用四种方式部署同一个翻译应用：虚拟机或 serverless，代码文件或 container。"
  - "前面几讲填好了 VM 那一行。"
  - "今天填 serverless 那一行。"
- en: "For a function you hand over a source file, its requirements file, and one name. The file is main.py: an HTTP handler called hello underscore HTTP, which reads the text and two language codes from the request."
  zh:
  - "部署函数，你交出一个源文件、它的 requirements 文件，再加一个名字。"
  - "这个文件是 main.py：一个叫 hello 下划线 http 的 HTTP 处理函数，它从请求里读出文本和两个语言代码。"
  en_display:
  - null
  - "The file is main.py: an HTTP handler called hello_http, which reads the text and two language codes from the request."
- en: "That name is the entry point: the Python function the framework should call. Not the file name, and not the service name."
  zh:
  - "这个名字就是入口点：框架应该调用的那个 Python 函数。"
  - "不是文件名，也不是 service 名称。"
- en: "Then Google builds. Cloud Build installs the requirements, configures the Functions Framework, and publishes an image to Artifact Registry. This happens once, at build time, not on every request."
  zh:
  - "然后由 Google 构建。"
  - "Cloud Build 安装依赖，配置 Functions Framework，再把一个 image 发布到 Artifact Registry。"
  - "这只在构建时发生一次，不是每个请求都来一次。"
- en: "The framework finds your function by that name. Type main as the entry point, and there is nothing called main to find. The function build fails, and its build logs tell you why."
  zh:
  - "框架靠这个名字找到你的函数。"
  - "入口点填 main，就找不到任何叫 main 的东西。"
  - "函数构建失败，构建日志会告诉你原因。"
- en: "Slide 11 says a function runs without managing containers. You do not manage one, but Google still builds one. And the slides' Cloud Functions are now Cloud Run functions."
  zh:
  - "课件第 11 页说，运行函数不用管理 container。"
  - "你不用管理它，但 Google 照样会构建一个。"
  - "课件里的 Cloud Functions 现在叫 Cloud Run functions。"
- en: "For a Cloud Run service, you hand over a finished image by its URL. Deploying it builds nothing: the image was built beforehand. Its Dockerfile picks the base Python, the default port, 8080, and the startup command. You control all three."
  zh:
  - "部署 Cloud Run service，你交出一个现成的 image，给出它的 URL。"
  - "部署它什么也不构建：这个 image 事先就构建好了。"
  - "它的 Dockerfile 选定了基础 Python、默认 port 8080，以及启动命令。"
  - "这三样都由你控制。"
- en: "Both are called through an HTTPS URL. The function takes new inputs through its query string, with no redeploy."
  zh:
  - "两者都通过 HTTPS URL 调用。"
  - "函数通过查询字符串接收新的输入，不用重新部署。"
- en: "Both end as the same thing: a container instance on Cloud Run. A function is a container you did not write. On the quiz, source plus an entry point means a function. Your own image, or your own startup command, means a service."
  zh:
  - "两者最后都是同一样东西：Cloud Run 上的一个 container 实例。"
  - "函数就是一个不用你自己写的 container。"
  - "在小测上，源代码加入口点，就是函数。"
  - "你自己的 image，或者你自己的启动命令，就是 service。"
S05:
- en: "Every deployed service faces two permission questions, and the README keeps them separate. Who may call our public app? And what may the running app access?"
  zh:
  - "每个部署好的 service 都面对两个权限问题，README 把它们分开处理。"
  - "谁能调用我们的公开应用？"
  - "运行中的应用又能访问什么？"
- en: "The left door is the caller. With public access allowed, any browser's request gets in. Without it, a caller with no permission is turned away with a 403, before your code even runs."
  zh:
  - "左边的门是调用方。"
  - "允许公开访问时，任何浏览器的请求都能进来。"
  - "不允许的话，没有权限的调用方会被 403 挡回去，你的代码根本不会运行。"
- en: "The right door is who your code is when it calls out. The web app wears a service account badge, translation demo runtime, with two roles: Agent Platform User and Service Usage Consumer. You do not create or download a key."
  zh:
  - "右边的门是你的代码向外调用时的身份。"
  - "这个 web 应用戴着服务账号工牌 translation-demo-runtime，有两个角色：Agent Platform User 和 Service Usage Consumer。"
  - "你不用创建或下载密钥。"
  en_display:
  - null
  - "The web app wears a service account badge, translation-demo-runtime, with two roles: Agent Platform User and Service Usage Consumer."
  - null
- en: "The code just asks for default credentials, and on Cloud Run the platform hands it a token for the attached account. No key file anywhere."
  zh:
  - "代码只是请求默认凭据，而在 Cloud Run 上平台会把所挂账号的 token 交给它。"
  - "哪里都没有密钥文件。"
- en: "One more arrow, from you. To attach that badge to a service, your own identity needs Service Account User on it. That is a deployment permission, separate from what the badge itself may do."
  zh:
  - "还有一个箭头，来自你。"
  - "要把这个工牌挂到一个 service 上，你自己的身份需要这个账号的 Service Account User 角色。"
  - "这是部署权限，和工牌本身能做什么是两回事。"
- en: "The job gets its own badge. It has the same two Agent Platform roles, plus Storage Object Viewer on the input bucket and Storage Object Creator on the output bucket. The web app's account needs no bucket roles, because its audio goes straight to the browser. One badge per workload."
  zh:
  - "这个 job 有自己的工牌。"
  - "它有同样的两个 Agent Platform 角色，另外在输入 bucket 上有 Storage Object Viewer，在输出 bucket 上有 Storage Object Creator。"
  - "这个 web 应用的账号不需要任何 bucket 角色，因为它的音频直接发给浏览器。"
  - "一个工作负载一个工牌。"
- en: "Slide 16 warns that serverless is harder to debug. The README says where to look: build logs when a function build fails, service logs when a request fails, and the job's execution logs. A finished build is not proof that it works."
  zh:
  - "课件第 16 页提醒，serverless 更难调试。"
  - "README 说了去哪看：函数构建失败看构建日志，请求失败看 service 日志，还有 job 的执行日志。"
  - "构建成功不代表它能用。"
- en: "The rule: public access answers who may call, and a refused caller is stopped before your code runs. The service account answers what your code may touch. When your own code is denied, fix the badge's roles, not the caller."
  zh:
  - "规则是：公开访问回答谁能调用，被拒绝的调用方在你的代码运行之前就被挡住了。"
  - "服务账号回答你的代码能碰什么。"
  - "当你自己的代码被拒绝时，修的是工牌的角色，不是调用方。"
S06:
- en: "To serve a trained model, the next lecture uses a Vertex AI endpoint, and the quiz asks where its preprocessing should live. Picture two clients: a phone app, and a web page."
  zh:
  - "要部署一个训练好的模型，下一讲用的是 Vertex AI endpoint，小测问的是它的预处理应该放在哪里。"
  - "想象两个客户端：一个手机应用，一个网页。"
- en: "Each client carries the same gear: decode the JPEG, scale the pixels to between 0 and 1, and resize to 224 by 224. Only then does it send numbers to the model. That is two copies of one recipe, in two code bases."
  zh:
  - "每个客户端都带着同一个齿轮：解码 JPEG，把像素缩放到 0 到 1 之间，再 resize 到 224 乘 224。"
  - "然后它才把数字发给模型。"
  - "这是同一份配方的两个副本，在两个代码库里。"
- en: "The lecture calls this client-side brittleness. Every client preprocesses slightly differently, and a model trained on one recipe quietly receives another."
  zh:
  - "课上把这叫做客户端的脆弱性。"
  - "每个客户端的预处理都略有不同，用一份配方训练的模型，悄悄收到了另一份。"
- en: "Now move the gear into the endpoint. Clients send raw JPEG bytes, wrapped as base64, because JSON cannot carry raw bytes. The preprocessing travels with the model, so every client gets exactly the preprocessing used in training."
  zh:
  - "现在把齿轮挪进 endpoint。"
  - "客户端发送原始的 JPEG 字节，用 base64 包起来，因为 JSON 装不了原始字节。"
  - "预处理跟着模型走，所以每个客户端得到的，正好是训练时用的预处理。"
- en: "Look at the repo's own client. It reads the image files, base64 encodes them, and calls predict. No resizing, no normalizing. That is a thin client."
  zh:
  - "看这个 repo 自己的客户端。"
  - "它读入图片文件，做 base64 编码，然后调用 predict。"
  - "不 resize，不归一化。"
  - "这就是瘦客户端。"
- en: "Now ship a bad resize in version 2. Both clients break at once. Roll back to version 1, and both are healthy at the same instant. One deployment fixed everyone, with no client release."
  zh:
  - "现在在版本 2 里发布一个有问题的 resize。"
  - "两个客户端同时坏掉。"
  - "回滚到版本 1，两个客户端在同一瞬间恢复正常。"
  - "一次部署修好了所有人，不用发布任何客户端。"
- en: "Now put the gears back on the clients. What does the same rollback cost?"
  zh:
  - "现在把齿轮放回客户端。"
  - "同样的回滚要付出什么代价？"
- en: "Two releases: a phone update waiting in app store review, and a web deploy. They land at different times, and in between, the clients disagree."
  zh:
  - "两次发布：一个等着应用商店审核的手机更新，再加一次网页部署。"
  - "它们上线的时间不同，在这中间，两个客户端的结果不一致。"
- en: "The rule: when the question says several clients, one place to update or roll back, and no client release, put preprocessing at the endpoint. Preprocessing on the clients means every client is re-released in lockstep."
  zh:
  - "规则是：当题目说有好几个客户端，要在一个地方更新或回滚，而且不用发布客户端时，把预处理放在 endpoint。"
  - "预处理放在客户端，就意味着每个客户端都要同步重新发布。"
S07:
- en: "Preprocessing at the endpoint works only if the endpoint calls the right function. Here is the chain: JPEG bytes, decode, convert to floats, resize, the model, and four probabilities, one per cheese."
  zh:
  - "把预处理放在 endpoint，只有在 endpoint 调用了正确的函数时才有用。"
  - "这条链是：JPEG 字节，解码，转成浮点数，resize，模型，最后是四个概率，每种奶酪一个。"
- en: "In the repo, preprocess image does the first three steps, for one image. It returns an image, not an answer."
  zh:
  - "在这个 repo 里，preprocess image 做前三步，一次处理一张图。"
  - "它返回的是一张图片，不是答案。"
  en_display:
  - "In the repo, preprocess_image does the first three steps, for one image."
  - null
- en: "The serving function takes a batch of strings, maps preprocess image over each one, then calls the model. Preprocessing and inference, in one function. Its argument, bytes inputs, is the key clients use. Exam questions may call this function serve: not the web app's serve command, but the function that preprocesses, then predicts."
  zh:
  - "这个 serving function 接收一批字符串，对每一个都套用 preprocess image，然后调用模型。"
  - "预处理和推理，在同一个函数里。"
  - "它的参数 bytes inputs，就是客户端要用的键。"
  - "考题可能把这个函数叫做 serve：不是 web 应用的 serve 命令，而是先预处理、再预测的那个函数。"
  en_display:
  - "The serving_function takes a batch of strings, maps preprocess_image over each one, then calls the model."
  - null
  - "Its argument, bytes_inputs, is the key clients use."
  - null
- en: "The export registers it under the name serving default, and the model server calls whatever sits behind that name. The slide saves it with a different call; the idea is the same."
  zh:
  - "导出时把它注册在 serving default 这个名字下面，模型服务器调用的就是这个名字背后的东西。"
  - "课件用另一种调用来保存它；道理是一样的。"
  en_display:
  - "The export registers it under the name serving_default, and the model server calls whatever sits behind that name."
  - null
- en: "Before we try plugs, one last check. A phone app sends float arrays, a new web client sends JPEG bytes, and the team wants one place to fix preprocessing. What should they register?"
  zh:
  - "试插头之前，最后检查一次。"
  - "一个手机应用发送浮点数组，一个新的网页客户端发送 JPEG 字节，团队想只在一个地方修预处理。"
  - "他们应该注册什么？"
- en: "Try B first: register preprocess image alone. A request comes back as a 224 by 224 image. Nothing was classified."
  zh:
  - "先试 B：只注册 preprocess image。"
  - "请求返回的是一张 224 乘 224 的图片。"
  - "根本没有做分类。"
  en_display:
  - "Try B first: register preprocess_image alone."
  - null
  - null
- en: "A and D keep the raw model. It demands float tensors, so JPEG bytes no longer fit. The server only turns base64 back into bytes. The gears jump back onto every client: two copies to keep in sync."
  zh:
  - "A 和 D 保留原始模型。"
  - "它要的是浮点张量，所以 JPEG 字节插不进去。"
  - "服务器只会把 base64 变回字节。"
  - "齿轮又跳回了每个客户端：两个副本要保持同步。"
- en: "C, the serving function: bytes go in, probabilities come out. The phone app switches to sending bytes once; after that, one exported version holds the recipe, and every fix or rollback is one deployment. The repo's test step loads serving default and feeds it bytes inputs, as the server will."
  zh:
  - "选 C，serving function：字节进去，概率出来。"
  - "手机应用改成发送字节，只需一次；之后，一个导出的版本就装着配方，每次修复或回滚都是一次部署。"
  - "这个 repo 的测试步骤加载 serving default，喂给它 bytes inputs，和服务器的做法一样。"
  en_display:
  - "C, the serving_function: bytes go in, probabilities come out."
  - null
  - "The repo's test step loads serving_default and feeds it bytes_inputs, as the server will."
- en: "This echoes the function's entry point: the platform calls exactly the name you registered, and nothing downstream can fix a wrong one."
  zh:
  - "这和函数的入口点是同一个道理：平台只调用你注册的那个名字，名字错了，下游什么也补救不了。"
- en: "The rule: register the function that does preprocessing and inference. Preprocessing alone returns images, and the raw model makes every client preprocess."
  zh:
  - "规则是：注册那个做预处理和推理的函数。"
  - "单独的预处理返回的是图片，原始模型会让每个客户端自己预处理。"
S08:
- en: "Seven rules for Tuesday. One: read the lifecycle. If it listens, it is a service; if it runs and exits, it is a job, started on demand or by Cloud Scheduler. Two: idle time costs only what is always on. Three: pay-per-use bills invocations and execution time, and zero idle cost buys you cold starts."
  zh:
  - "周二的七条规则。"
  - "第一：看生命周期。"
  - "如果它在监听，它就是 service；如果它运行完就退出，它就是 job，按需启动或者由 Cloud Scheduler 启动。"
  - "第二：空闲时间只让一直开着的东西花钱。"
  - "第三：按用量计费，计的是调用次数和执行时间，零空闲成本换来的是冷启动。"
- en: "Four: a function is source, requirements and an entry point, and Google builds the image; a service is your own image. Five: who may call it is not who it runs as, and the runtime service account needs no key."
  zh:
  - "第四：函数是源代码、依赖和入口点，image 由 Google 构建；service 是你自己的 image。"
  - "第五：谁能调用它，不等于它以谁的身份运行，运行时的服务账号也不需要密钥。"
- en: "Six: preprocess at the endpoint, so one deployment updates or rolls back every client. Seven: register the serving function that preprocesses and then calls the model, because the platform calls exactly the name you register."
  zh:
  - "第六：在 endpoint 做预处理，这样一次部署就能更新或回滚每个客户端。"
  - "第七：注册先预处理、再调用模型的 serving function，因为平台只调用你注册的那个名字。"
- en: "Which one to use? The next lecture's rule of thumb: Vertex AI to serve a trained model in production, Cloud Run when the model is part of a broader app. And remember the costs on slide 16: vendor lock-in, cold starts, harder debugging."
  zh:
  - "该用哪一个？"
  - "下一讲的经验法则：Vertex AI 用来在生产环境部署训练好的模型，Cloud Run 用在模型只是更大应用一部分的时候。"
  - "还要记住课件第 16 页说的代价：厂商锁定、冷启动、更难调试。"
- en: "That's the lecture in seven rules. Good luck on Tuesday."
  zh:
  - "这就是这一讲的七条规则。"
  - "周二小测加油。"
