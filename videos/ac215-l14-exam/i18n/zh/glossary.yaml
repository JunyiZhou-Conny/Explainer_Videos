# Chinese (zh-CN) glossary and translation rules for ac215-l14-exam (AC215 lecture 14, Serverless Deployment, EXAM
# EDITION for Quiz 4: a 12-15 minute concept-first explainer, no README walk and no captures; evidence panels from
# dlops-io/serverless-deployment @ 46cc62f and dlops-io/model-deployment @ cf0b7c7), code-switching version, SUBTITLES
# ONLY. Audience: Chinese-speaking AC215 grad students the day before Quiz 4 who read technical English fluently;
# register of a Chinese MLOps TA running a review session the day before the quiz. Precedents and source of the shared
# decisions: the series pilot videos/ac215-l01-vms-venvs/i18n/zh (repo, 服务账号, 密钥, 虚拟机 / VM, 计价器, 计费), the
# container lectures ac215-l02-containers-1 to ac215-l04-flexible-workflow-ports (container, image, port, token, bucket,
# 部署, 请求, 构建, 退出码), ac215-l07-agent-harness (web 服务器, 日志) and the latest finished episode
# ac215-l08-llm-finetuning (endpoint, 客户端, 凭据, 运行时, and the rule layout A1-I3 this file follows). Every term L1-L8
# already decided keeps its form; what is new here is the serverless vocabulary (A3): service vs job and the lifecycle,
# the two meters, what a function and a service hand over, the two doors of identity, preprocessing at the endpoint and
# the serving signature; plus service, job, serverless and resize in the closed English list (A1 c).
# There is NO Chinese voice in this series: the Chinese lines are subtitles on the English timing (the bilingual band of
# output/<id>.zh-en.mp4, <id>.zh.srt, <id>.zh-en.srt / .ass). So no say:, no anchors, no readings, no durations: only
# display rules. But `python -m explainer.i18n check` still applies its voice hygiene to the displayed line when a
# sentence has no say: (brackets, maths symbols, letter_letter names, Latin words not listed here, a missing half-width
# space): rules A6, B3 and D3 are how the Chinese line stays clean without say:.
# Human-readable copy in Chinese: GLOSSARY.md (keep the two in sync; both term tables come from the same data).
# terms[].zh_subtitle = the subtitle form (titles and companions use A4's written register); terms[].first_use = one
# example sentence (SNN[k]: scene SNN, SAY block k counted from 0), each one passes the checker; terms[].note = rules.
# Read by: python -m explainer.i18n check (Latin words allowed in a subtitle line: every Latin word of zh_subtitle and
# first_use, plus allowed_spoken_latin) and explainer/subtitles.py (2-3 word English phrases of `en` are kept on one
# English line; 2-7 character Chinese headwords of zh_subtitle are registered in jieba; I3).
video: ac215-l14-exam
lang: zh-CN (mainland Simplified Chinese)
audience: 'Chinese-speaking AC215 (MLOps & LLMOps) grad students the day before Quiz 4: they did L1-L13 (a VM, containers, docker run with a published port, a service-account key in secrets/, a Vertex AI training job), saw Lecture 14 and skimmed the serverless-deployment README, and want to answer conceptual multiple-choice questions on serverless deployment and say why each wrong option is wrong. They watch on a laptop with no clone open. Register of a Chinese MLOps TA running a review session the day before the quiz.'
voice: none          # subtitles only (video.yaml: Chinese = i18n/zh/narration/*.yaml on the English timing)
policy: 'The Mandarin of a Chinese MLOps TA running a review session the day before Quiz 4, code-switching only where such a speaker really does, written as subtitles under an English narration. The viewers already say 起一个 container, 构建 image, 开一个 port, 建一个 bucket, 调一个 endpoint; this video adds 部署成一个 Cloud Run service, 跑一个 job, serverless 部署, resize 到 224 乘 224. Every choice passes three tests: what is said in a real review session; the standard, searchable Chinese name (Google Cloud''s Chinese docs and the Chinese engineering literature: 函数, 入口点, 实例, 冷启动, 最小实例数, 缩容到零, 按请求计费, 预配, 服务账号, 默认凭据, 预处理, 推理, 签名, 回滚, 瘦客户端); and consistency with the series (L1 decided 虚拟机 / VM, 计价器, 计费, 服务账号, 密钥; L2-L4 container, image, port, bucket, 部署, 构建, 退出码; L7 web 服务器, 日志; L8 endpoint, 客户端, 凭据: every form they fixed is kept). (1) Artifacts verbatim: what the viewer matches on screen (the app''s commands serve and batch, file names, the job and account names, role names, the console word Execute, 403, the method predict, gunicorn) is copied letter for letter, never translated, inflected or quoted; the exceptions the checker forces are names with an underscore, written the way the narration says them (A6). Nothing on screen is translated in this series: code panels, README excerpts, console chips, lecture tags, set-piece labels, the exam map, the rule cards and the ponder cards stay English; only the narration is. (2) Lab-speech English, a closed list: from L1 repo; from L2-L4 container, image, port, token, Dockerfile, bucket; from L8 endpoint; new here service and job (the Cloud Run resource types, as the quiz options say them), serverless and resize. (3) Everything else in standard Chinese (A3). (4) The video''s metaphors by meaning, one word each: 时间条 (the lifecycle strip), 计价器 (meter), 金色阴影, 门 (doors), 工牌 (badge), 齿轮 (gear), 配方 (recipe), 插头 / 插座 (plug / socket). (5) Written register for titles, meta.yaml and companion docs: 容器, 镜像, 仓库, 存储桶, 服务（service）, 作业（job）, 无服务器（serverless）, 端点（endpoint）. (6) The bilingual band puts the English sentence under every Chinese line, so the Chinese line carries no glosses and no brackets at all. (7) Exam register: 考点, 题目, 选项, 选 B, 规则是：; the ponder lead-ins never give the answer, and the course''s practice questions are never quoted (A9). (8) The toolkit''s constraints are part of the policy: one Chinese sentence per English sentence (66 blocks, 191 sentences), a checker-clean display line (D3), an en_display wherever the SAY spells an artifact out as words (D4), the English clause order kept (D9). Mainland Simplified Chinese; relaxed, clear review-session speech, never slangy.'
rules:
- '[A1] Code-switching scope. English stays in three places only. (a) Artifacts, copied letter for letter: the app''s commands and the command in the job fix (serve, batch, python), file names (Dockerfile, main.py, requirements.txt only on screen; the SAY says the requirements file → requirements 文件), the job and account names as on screen (translation-audio, translation-demo-runtime), the console words the narration names (Execute), role names (Agent Platform User, Service Usage Consumer, Service Account User, Storage Object Viewer, Storage Object Creator), the status code 403, code names written the way the SAY says them (A6: hello 下划线 http, preprocess image, serving function, serving default, bytes inputs), the method predict, the package gunicorn, the format names (JPEG, JSON, base64). (b) Products, organisations, the course: AC215, Google, Google Cloud, Cloud Run, Cloud Run functions, Cloud Functions, Functions Framework, Cloud Build, Artifact Registry, Cloud Scheduler, Vertex AI, Agent Platform, Docker, Python, README, HTTP, HTTPS, URL, CPU, VM. (c) Words Chinese MLOps engineers really say in English, a closed list: from L1 repo; from L2-L4 container, image, port, token, Dockerfile, bucket; from L8 endpoint; new in this video service and job (the two Cloud Run resource types, as the quiz options say them), serverless and resize. A word joins (c) only when lab speech really uses the English and the Chinese is stilted or collides with another term. Never English for flavour: function, entry point, cold start, instance, billing, idle, invocation, preprocessing, inference, signature, rollback, client, deployment and everything in A3 are Chinese.'
- '[A2] container and image (as L2-L8). The subtitles say container and image: 一个 container 实例, 同一个 image, 现成的 image; measure word 个. build → 构建, publish → 发布, base Python → 基础 Python. Titles, chapter names and meta.yaml write 容器 and 镜像 (A4).'
- '[A3] The serverless vocabulary (new in this video). Lifecycle: service and job stay (A1 c), lifecycle → 生命周期, runs to completion → 跑到完成, exits → 退出, exit status → 退出码, execution → 执行, listen → 监听, request → 请求, instance → 实例, traffic → 流量, scale to zero → 缩容到零, trigger → 触发器, every night → 每晚, on demand → 按需, timetable → 时间表, task timeout → 任务超时, default command → 默认命令, startup command → 启动命令, web server → web 服务器, web app → web 应用. Billing: meter → 计价器 (L01), billed → 计费, bill → 账单, request-based billing → 按请求计费, pay-per-use → 按用量计费, invocation → 调用 / 调用次数, execution time → 执行时间, idle → 空闲, provisioned → 预配, virtual machine → 虚拟机 / VM, cold start → 冷启动, minimum instances → 最小实例数, warm instance → 热实例, always on → 一直开着 / 常驻, minimum replica count → 最小副本数, no minimum charge → 没有最低收费. Hand-over: function → 函数 (product, Python function and serving function alike), entry point → 入口点, hand over → 交出, source file → 源文件, source → 源代码, requirements → 依赖 (the file: requirements 文件), HTTP handler → HTTP 处理函数, query string → 查询字符串, build → 构建, build time → 构建时, build logs → 构建日志, deploy → 部署, redeploy → 重新部署. Identity: permission → 权限, caller → 调用方, public access → 公开访问, service account → 服务账号, role → 角色, key → 密钥, default credentials → 默认凭据, identity → 身份, deployment permission → 部署权限, workload → 工作负载, log → 日志, debug → 调试. Model endpoint: preprocessing → 预处理, inference → 推理, client → 客户端, thin client → 瘦客户端, client-side brittleness → 客户端的脆弱性, decode → 解码, normalize → 归一化, bytes → 字节, tensor → 张量, probability → 概率, roll back → 回滚, version → 版本, release / ship → 发布, app store review → 应用商店审核, register → 注册, export → 导出, model server → 模型服务器, signature → 签名, rule of thumb → 经验法则, vendor lock-in → 厂商锁定. The video''s metaphors by meaning, one word each: 时间条 (the lifecycle strip), 计价器 (meter), 金色阴影 (gold shading), 门 (doors), 工牌 (badge), 齿轮 (gear), 配方 (recipe), 插头 / 插座 (plug / socket).'
- '[A4] Written vs spoken. The subtitles say container / image / repo / bucket / token / endpoint / service / job / serverless / resize; titles, chapter names, meta.yaml and companion docs write 容器 / 镜像 / 仓库 / 存储桶 / 词元（token）/ 端点（endpoint）/ 服务（service）/ 作业（job）/ 无服务器（serverless）/ 调整尺寸（resize）, with the English in brackets at the first use of a core concept (brackets are fine outside the narration). 作业 follows Google Cloud''s Chinese docs (Cloud Run 作业) and appears in writing only. Commands and code names are unaffected.'
- '[A5] Writing artifacts. Copied letter for letter; never translated, inflected, quoted or put in 《》. Add a Chinese head noun where it helps: 这个 serve 命令, batch 参数, service 名称, service 日志, Agent Platform 角色. No sentence opens with an artifact or a lower-case kept-English word (serve, batch, gunicorn, job, service, serverless, resize, repo, endpoint): put a Chinese word first (这个 serve 命令……; 而 batch 是……; 是 service 还是 job; 这个 repo……; 这个 job……). Capitalized names and acronyms (Cloud Run, Cloud Build, Google, README, Dockerfile, JSON, VM, Vertex AI) may open a sentence, and so may the option letters A-D.'
- '[A6] Names with an underscore (as L3-L8). With no say:, the checker reads the display line as spoken text and rejects letter_letter, brackets and =. So the Chinese line writes them the way the narration says them: hello_http → hello 下划线 http (the SAY spells the underscore out because the exact name is the point; lower case as on screen); preprocess_image → preprocess image; serving_function → serving function; serving_default → serving default; bytes_inputs → bytes inputs; min_replica_count → 最小副本数 (the SAY says it as prose). The English line gets the literal form through en_display (D4).'
- '[A7] Words to keep apart. service (the Cloud Run resource) ≠ 服务账号 (service account) ≠ the service name (service 名称). serve (the web app''s command, S01-S02) ≠ serve (the exam''s name for the serving function, S07[2]); the SAY separates them and so does the subtitle (不是 web 应用的 serve 命令，而是……). batch (the app''s command) ≠ 一批字符串 (a batch of strings, S07). 函数 is one word on purpose for the product, the Python function and the serving function (S07[8] ties the entry point to serving default). job ≠ 任务 (L08''s 微调任务, L13''s training job) ≠ 作业 (written register only). 执行 (a job''s execution) ≠ 运行 (runs). 实例 (instance) ≠ 版本 (version) ≠ 修订版本 (revision, screen only). 发布 (ship a version, publish an image, release a client) ≠ 部署 (deploy). 调用 (invoke, call) ≠ 调用方 (caller). 计费 (billed) ≠ 账单 (a bill) ≠ 付钱 (pay). 预处理 (preprocessing) ≠ 处理. 规则 (the exam rule) ≠ 考点 (one of the five ideas). 课件 (the slides) ≠ 课上 (the lecture) ≠ 下一讲 (next lecture). repo (the demo repo) ≠ 代码库 (code bases, S06[1]).'
- '[A8] Register: a TA running a review session the day before the quiz. Short, direct sentences; exam words where the English is about the quiz (考点, 题目, 选项, 选 B, 考题, 小测, 规则是：); the viewer is 你 (never 您, 大家, 同学们); 我们 is the video (我们点 Execute). Chinese word order inside a clause; clause order follows the English (D9). No translationese: not 让我们…… (say 我们来……, 先……), not 这就是为什么…… (say 所以……), few 被 sentences. No internet slang. Carry the spoken rhythm by meaning: Try one → 来试一道; Test it on a new case → 换个新情况试试; Now the hook → 现在回到开头; Hold that question → 先记着这个问题; Watch → 看; Which one to use? → 该用哪一个？; Good luck on Tuesday → 周二小测加油.'
- '[A9] Precision. Translate the quantifiers: only 只, every 每个 / 每次, all 全部, at once 同时, exactly 正好 / 完全, never 从不 / 永远不. Numbers exactly as said (C1). Slide-versus-repo differences are said kindly and briefly, as the SAY does (the slides'' Cloud Functions are now Cloud Run functions; the slide saves it with a different call). Ponder questions: three cards plus one line (S02[7] Try one; S03[6] Test it on a new case; S06[6] What does the same rollback cost?; S07[4] Before we try plugs, one last check). The lead-in and the stem never give the answer away: S02[7] must not hint at a job or Cloud Scheduler; S03[6] must not say which bill moves; S06[6] must not mention two releases or the app store; S07[4] must not name the serving function. The reveal opens with the letter as the English does (B, … → 选 B，……; Try B first → 先试 B). The course''s practice questions are never quoted, here or anywhere in i18n/zh.'
- '[A10] Names. Products, companies and the course keep Latin script (A1 b); 哈佛 only in titles and descriptions. Course: AC215; the lecture → 课上; the slides → 课件; slide n → 课件第 n 页; next lecture → 下一讲; earlier lectures → 前面几讲; the instructor → 授课老师, never named (the SAY never names anyone). The service-account email, project ids, bucket paths and image tags are on screen only and never written in a Chinese line. The cheese names are on screen only.'
- '[A11] The screen stays English. This series translates only the narration: code panels (comments included), README excerpts and excerpt chips, the schematic console chips, the lecture tags (Lecture 14 · slide 14), V1-V6''s labels, the exam map, the exam-rule cards, the ponder cards and their reasons, the tags (illustration) and the recap rows are English, and the scenes need no language changes. Where the narration names something on screen, the subtitle writes it as shown (我们点 Execute; translation-demo-runtime); what the narration says in its own words is translated (the gray tag → 灰色标签, the yellow ticks → 黄色刻度, the gold shading → 金色阴影).'
- '[A12] Mainland Simplified Chinese only: 默认, 程序, 代码, 文件, 网络, 视频, 信息, 账号, 函数, 参数, 字段, 配置, 内存, 日志, 部署, 实例; never 預設, 程式, 程式碼, 檔案, 網路, 影片, 帳號, 函式, 引數, 欄位, 組態, 記憶體, 日誌, 部署 in traditional forms.'
- '[A13] The series list (the ac215-video skill''s list) in this video. container and image throughout; Dockerfile (S01, S04); port (S02, S04); token once (S05[3]); bucket (S01, S05); endpoint (S01, S03, S06-S08); repo (S06, S07). pipeline, volume, venv, PATH, prompt, embedding, CI and agent (only in the role and product name Agent Platform) are not in this script. Kept English and new here (A1 c): service, job, serverless, resize.'
- '[B1] Spacing. One half-width space between Hanzi and Latin letters, digits or an artifact (输出 bucket, 退出码 1, 课件第 16 页, 224 乘 224, 默认 port 8080, 被 403 挡回去). The checker reports a missing space on every displayed sentence. Spaces inside an artifact as they are (Cloud Run, Service Usage Consumer). No space next to full-width punctuation. Never U+00A0 / U+202F.'
- '[B2] Punctuation. Chinese uses full-width ，。、；：？！“”……, also next to an artifact. Lists use 、 (厂商锁定、冷启动、更难调试). No brackets of any kind. “” only for a translated quotation; artifacts, screen words and role names are never quoted. One Chinese sentence (for one English sentence) has no 。？！ inside: use ，；：. The recap''s ordinals take a full-width colon (第一：看生命周期。).'
- '[B3] Symbols the checker rejects (= < > + → × ÷ ≈, brackets, letter_letter, a digit followed by !): never in the Chinese line; say them in words. 224 by 224 → 224 乘 224; between 0 and 1 → 0 到 1 之间; source plus an entry point → 源代码加入口点. Allowed and kept as on screen: . in main.py, - in translation-audio and translation-demo-runtime.'
- '[C1] Numbers. Digits for what the SAY writes as digits (8080, 403, 224 乘 224, 5 分钟, 退出码 1, 版本 1 / 版本 2, 最小实例数为 0 / 设成 1, 课件第 11 页 / 第 16 页). Small narrative counts the SAY writes as words use Hanzi: 五个考点, 两个启动命令, 两个计价器, 四种方式, 两个权限问题, 两个角色, 两个客户端, 三步 / 前三步, 四个概率, 七条规则, 三样. Recap ordinals in Hanzi: 第一 … 第七. No prices or free-tier numbers (the script has none).'
- '[C2] Units and times. 5 minutes → 5 分钟; once an hour → 每小时一次; all hour → 整个小时; one day → 一天; Tuesday → 周二. Hashes, image tags, project ids and the commit are never read out.'
- '[D1] Sentence alignment (explainer/i18n.py). In narration/*.yaml every SAY line of script.md has one entry (66 blocks); `en` equals the SAY line byte for byte; `zh` has exactly as many items as explainer.voice.split_sentences finds English sentences (191 in this script). Restructure only inside a sentence; never merge or split sentences. Short sentences are items of their own: Minutes pass. → 几分钟过去了。; Hold that question. → 先记着这个问题。; Service or job. → 是 service 还是 job。; Now the hook. → 现在回到开头。; Try one. → 来试一道。; Which bill changes? → 哪份账单会变？; Each recap rule that is its own English sentence is its own item. Run `python -m explainer.i18n check videos/ac215-l14-exam --lang zh` until it prints OK.'
- '[D2] No say:, no anchors. There is no Chinese voice: never write say: and never write anchors:. The subtitles are timed by the English audio; the toolkit pairs each Chinese sentence with its English one by position.'
- '[D3] A checker-clean display line. With no say:, every displayed sentence must pass explainer.i18n.spoken_problems: no brackets (B2), no maths symbols (B3), no letter_letter names (A6), no ! after a digit, no clause ending in 种 followed by ，。！？ (三种办法 inside a clause is fine; 两种都有 is fine), a half-width space between Hanzi and Latin letters or digits (B1), each sentence ending in 。！？ or ……, and every Latin word listed in this glossary (zh_subtitle, first_use or allowed_spoken_latin). The checker cuts words with [A-Za-z][A-Za-z''.-]* and ignores one-letter words: base64 is base, main.py stays whole, translation-audio and translation-demo-runtime stay whole, the option letters A-D are ignored. A Latin word it reports is either English to translate (usually) or a missing artifact: add the artifact, cut the same way, to allowed_spoken_latin and to its term. Plurals are left out on purpose (no instances, requests, clients, roles, images, containers): a plural it reports is an English inflection to drop. The product names Cloud Run functions, Cloud Functions and Functions Framework are the only plurals allowed.'
- '[D4] The English line (en_display). The bilingual band shows the SAY sentence, and the SAY spells some artifacts out as words for the voice. Every such sentence gets an en_display item with the literal on-screen form, the rest word for word as the SAY; the other sentences of the block are null. Spoken form → literal: translation audio → translation-audio (S01[0]); hello underscore HTTP → hello_http (S04[1]); translation demo runtime → translation-demo-runtime (S05[2]); preprocess image → preprocess_image (S07[1], S07[2], S07[5]); serving function → serving_function (S07[2], S07[7], S08[2] optional: the recap may keep the words); bytes inputs → bytes_inputs (S07[2], S07[7]); serving default → serving_default (S07[3], S07[7]). Not restored: minimum replica count (prose), the requirements file (prose), main.py, 8080, 403 (already literal). The English video''s own .srt is unaffected.'
- '[D5] Content parity. Each Chinese sentence translates its English sentence only: no added commands, glosses, Chinese screen names or explanations; kept-English words get no Chinese explanation (the English line is right below); ponder questions get no answers (A9). The head words A5 needs (这个, 这次, 而, 是) carry no content.'
- '[D6] Fixed phrases. Try one. → 来试一道。 Test it on a new case. → 换个新情况试试。 Before we try plugs, one last check. → 试插头之前，最后检查一次。 B, … → 选 B，……; C, the serving function: … → 选 C，serving function：…… Try B first: … → 先试 B：…… So the rule: … / The rule: … → 所以规则是：…… / 规则是：…… Read the lifecycle, not the product names. → 看生命周期，别看产品名。 A function is a container you did not write. → 函数就是一个不用你自己写的 container。 the platform calls exactly the name you registered → 平台只调用你注册的那个名字 (S07[8] and S08[2]). Seven rules for Tuesday. → 周二的七条规则。 One: … Seven: … → 第一：……第七：…… Good luck on Tuesday. → 周二小测加油。'
- '[D7] Files. narration/g1.yaml = S01-S04 (the hook, service or job, the two meters, what you hand over; 34 blocks, 103 sentences), narration/g2.yaml = S05-S08 (identity and logs, preprocessing, the serving signature, the recap; 32 blocks, 88 sentences). The video has no parts; the two files only split the work. Each file opens with a comment (coverage; the rules it applies: A6 spaced names, B3 symbols in words, C1 numbers, D4 en_display, no say: / anchors:) and keeps the script''s order. Double-quoted strings; escape a literal double quote or backslash for YAML.'
- '[D8] Length on the English timing. The Chinese is read while the English plays; the band switches where the English cues switch. Each Chinese sentence should read in about the time the English sentence is heard: at most about 2 units per English word (a Hanzi counts 1, a Latin letter 0.55), so drop redundant connectives and repeated subjects, never content. Long artifacts cost length too (translation-demo-runtime 13.2 units, Service Usage Consumer 12.7, Storage Object Creator 12.1): don''t repeat them where the English doesn''t; after the first mention use a short reference (这个账号, 这个函数, 这个 job).'
- '[D9] Keep the English clause order (a series lesson, ac215-video skill). The toolkit pairs Chinese and English clause by clause, so a Chinese sentence that puts a condition first when the English puts it last swaps meaning between two neighbouring cues. Conditions, purposes and time adverbials sit where the English has them: Preprocessing at the endpoint works only if the endpoint calls the right function → 把预处理放在 endpoint，只有在 endpoint 调用了正确的函数时才有用; Vertex AI to serve a trained model in production, Cloud Run when the model is part of a broader app → Vertex AI 用来在生产环境部署训练好的模型，Cloud Run 用在模型只是更大应用一部分的时候; build logs when a function build fails, service logs when a request fails → 函数构建失败看构建日志，请求失败看 service 日志 (here both clauses keep their pair together, so the order inside each pair may follow Chinese). Where the English opens with if (S02[9], S08[0]), the Chinese does too.'
- '[G1] Width. Bilingual band: Chinese line at most 30 units, English line 96 characters; Chinese-only subtitles (.zh.srt) 22 units a line, 2 lines a cue. Write clauses of at most about 24 units separated by ，；： so the splitter has clean cut points; give the role names and translation-demo-runtime a clause of their own.'
- '[G2] Cue endings: the toolkit strips a cue''s final 。，、；： and keeps ？！…… and a closing ” (subtitles.strip_end). Prefer a Chinese word over ''artifact + full stop'' at the end of a sentence where it reads as well.'
- '[G3] Never split a name. The splitter treats a space between two Latin words in a Chinese line as a good cut point, so Service Usage Consumer or Cloud Run functions could land on two lines. Put such names at the end of a clause, after a full-width colon or 、, with little Chinese around them, and check every cue with a role name in the rendered .zh.srt.'
- '[H1] Titles (meta.yaml). Video and chapter titles use the written register (A4: 容器, 镜像, 服务, 作业, 端点, 无服务器); questions keep their question mark; the English colon structure is kept (服务还是作业：……; 注册 serve：……); code names stay as they are (meta.yaml is not read by the checker, so brackets are fine). Core-concept chapters carry their English short name for search where the Chinese is not the usual search word (作业（job）, 服务（service）, 端点（endpoint）), as L1-L8 do. exam edition → 考前精讲版 (the series'' wording for the Quiz 4 exam editions; follow-along → 跟练). Serverless Deployment → 无服务器部署.'
- '[H2] Description (Bilibili / YouTube): two or three sentences, written register, this glossary''s terms: AC215 lecture 14''s exam edition for Quiz 4, concept-first, with the demo repos dlops-io/serverless-deployment and dlops-io/model-deployment as evidence; what it teaches (Cloud Run service vs job by lifecycle; who pays for idle time; what a function and a service hand over; who may call vs who it runs as; preprocessing at the endpoint and the serving signature); English narration with Chinese and bilingual subtitles; no live runs: every panel is the repos'' source or our drawing. Never a person''s name, never the practice questions.'
- '[H3] Companions: i18n/zh/README.md (and exercises.md if made) are translated with this glossary in the written register (A4). Close with a term table: English | the word used here | other common renderings (serverless: 无服务器 / Serverless; service: 服务; job: 作业 / 任务; function: 函数 / 云函数; entry point: 入口点 / 入口函数; cold start: 冷启动; minimum instances: 最小实例数; scale to zero: 缩容到零; service account: 服务账号 / 服务帐号; preprocessing: 预处理; inference: 推理; signature: 签名; rollback: 回滚; thin client: 瘦客户端; endpoint: 端点 / 终端节点).'
- '[H4] Code and commands in the companions stay byte for byte: code blocks, commands, file names and inline `code` are unchanged; only # comments and the surrounding prose are translated.'
- '[I1] (Request, open since L3) `explainer.i18n check` applies its spoken-text hygiene (_SPOKEN_BAD) to the display line when a sentence has no say:. For a subtitles-only video (voice: none here) those checks protect nothing and force A6 and B3 (here: hello_http, preprocess_image, serving_function, serving_default, bytes_inputs). Proposal: when the glossary''s voice is none, skip _SPOKEN_BAD for display-only sentences (keep the Latin-word, spacing and sentence-end checks).'
- '[I2] (To do, from L1 I3) `_cuts` in explainer/subtitles.py treats a space between Latin words in a Chinese line as a good cut point, so a name can be split (G3). Proposal: in a Chinese line, treat a run of Latin words separated only by spaces as unbreakable unless it alone exceeds a line.'
- '[I3] (Note) explainer/subtitles.py reads every video''s glossary.yaml: the 2-3 word English alternatives of each term''s en field are kept on one English line, and the 2-7 character Chinese headwords of zh_subtitle are registered in jieba, in every video''s subtitles. The en and zh_subtitle fields of this file therefore list real terms only (no sentences).'
terms:
# ---------------------------------------------------------------- The hook: a job that never finishes
- en: 'Cloud Run job / job / a job / the job''s execution / Execute'
  zh_subtitle: 'Cloud Run job / job / 执行 / Execute'
  first_use: 'S01[0]：这是一个叫 translation-audio 的 Cloud Run job。'
  note: 'A3: job stays (the Cloud Run resource type, the word the quiz options use); measure word 个; never 任务 here (任务 stays for L08''s tuning job and L13''s training job) and never 作业 in a subtitle (written register only, A4). execution → 执行 (the job''s execution → 这次执行). The console button Execute stays (We press Execute → 我们点 Execute). A lower-case job never opens a sentence (A5).'
- en: 'translation audio / translation-audio / the same image / a translation web app that works perfectly'
  zh_subtitle: 'translation-audio / 翻译 web 应用'
  first_use: 'S01[0]：它用的 image 和一个运行得好好的翻译 web 应用一样。'
  note: 'The SAY says the job name as words; the subtitle writes it as on screen (translation-audio) and en_display restores it (D4). web app → web 应用 (L07: web 服务器); app → 应用.'
- en: 'task timeout / the output bucket / the platform stops it / 5 minutes'
  zh_subtitle: '任务超时 / 输出 bucket / 平台'
  first_use: 'S01[1]：它一头撞上我们设的任务超时。'
  note: 'The console field is Task timeout (on screen, English); the narration''s own words → 任务超时. the output bucket → 输出 bucket (bucket stays, L03). 5 minutes, and the platform stops it → 5 分钟，平台把它停掉了.'
- en: 'Dockerfile / default command / startup command / web server / troubleshooting table / symptom'
  zh_subtitle: 'Dockerfile / 默认命令 / 启动命令 / web 服务器 / 故障排查表'
  first_use: 'S01[2]：线索在 Dockerfile 的最后一行：它的默认命令会启动 web 服务器。'
  note: 'CMD in prose → 默认命令; startup command → 启动命令 (two startup commands → 两个启动命令). web server → web 服务器 (L07). the README''s troubleshooting table → README 的故障排查表.'
- en: 'Hold that question / five ideas / the quiz / exam questions / Tuesday'
  zh_subtitle: '考点 / 小测 / 考题 / 周二'
  first_use: 'S01[4]：对这次小测来说，这一讲归结为五个考点。'
  note: 'Exam register (A8): idea (a quiz topic) → 考点; the quiz → 小测 (Quiz 4 is on screen only); exam questions → 考题; the question (a quiz item) → 题目; option → 选项; Tuesday → 周二. Hold that question → 先记着这个问题. Good luck on Tuesday → 周二小测加油.'
- en: 'the gray tag / the lecture slide / slide n / the slides'
  zh_subtitle: '灰色标签 / 课件 / 课件第 n 页'
  first_use: 'S01[5]：右上角的灰色标签，标出每个考点背后的那页课件。'
  note: 'A10: the slides → 课件; slide 16 → 课件第 16 页 (Slide 11 says → 课件第 11 页说); the lecture → 课上; next lecture → 下一讲. The tag itself (Lecture 14 · slide 14) stays English (A11).'
# ---------------------------------------------------------------- Service or job: the lifecycle
- en: 'Cloud Run service / service / a service / the service contract / Every deployed service'
  zh_subtitle: 'Cloud Run service / service'
  first_use: 'S02[2]：这种形状就是 service。'
  note: 'A3: service stays (the Cloud Run resource type, as the quiz options say it); measure word 个; written register 服务（service）(A4). the service contract → service 的约定. Keep apart from service account → 服务账号 (A7) and from the service name → service 名称. A lower-case service never opens a sentence: Service or job. → 是 service 还是 job。'
- en: 'lifecycle / shape / Read the lifecycle, not the product names / runs to completion / exits / never finishes on purpose'
  zh_subtitle: '生命周期 / 形状 / 跑到完成 / 退出'
  first_use: 'S02[7]：看生命周期，别看产品名。'
  note: 'The video''s key test, one wording in S02 and S08: read the lifecycle → 看生命周期. shape (of a strip) → 形状. runs to completion → 跑到完成; exits → 退出; It never finishes on purpose: listening is its job → 它本来就不会结束：监听就是它的本职工作.'
- en: 'serve / batch / two startup commands / the demo app / the batch arguments / the command python'
  zh_subtitle: 'serve / batch / 演示应用 / batch 参数 / python'
  first_use: 'S02[0]：这个演示应用两种都有：一个 image，两个启动命令，serve 或 batch。'
  note: 'A1 a: serve and batch are the app''s commands, written as on screen; they never open a sentence (这个 serve 命令……; 而 batch 是另一种形状). batch here is the command ≠ a batch of strings (一批字符串, S07) (A7). the batch arguments → batch 参数; the command python → 命令用 python.'
- en: 'gunicorn / port / 8080 by default / listening / listens on a port / request / requests / answers each request'
  zh_subtitle: 'gunicorn / port / 监听 / 请求'
  first_use: 'S02[1]：然后它就等着，来一个请求就回答一个。'
  note: 'gunicorn stays (package name, lower case: never opens a sentence). port stays (L2-L4); the default port, 8080 → 默认 port 8080. listen → 监听; request → 请求 (L02).'
- en: 'URL / instances / adds instances when traffic rises / scale to zero / traffic'
  zh_subtitle: 'URL / 实例 / 流量 / 缩容到零'
  first_use: 'S02[2]：它有 URL，流量上来时加实例，流量停了可以缩容到零。'
  note: 'instance → 实例 (an instance that exits has crashed → 一个退出了的实例就是崩溃了). scale to zero → 缩容到零; traffic → 流量. URL stays.'
- en: 'exits with status 1 / exit 0 / the execution shows failed / a false success'
  zh_subtitle: '退出码 / 失败'
  first_use: 'S02[3]：如果某一步失败，它以退出码 1 退出，所以这次执行显示失败，而不是假的成功。'
  note: 'L03: exit status → 退出码 (以退出码 1 退出). The strip''s exit 0 / exit 1 labels stay English (A11).'
- en: 'the hook / inherited / the fix / the strip ends'
  zh_subtitle: '开头 / 继承 / 时间条'
  first_use: 'S02[5]：这个 job 继承了 image 的默认命令，也就是 serve，所以它启动了 web 服务器，等着永远不会来的请求。'
  note: 'Now the hook → 现在回到开头. The fix: … → 修复：…… strip (the V1 lifecycle strip) → 时间条 (Same image, and now the strip ends → 同一个 image，现在时间条有了尽头).'
- en: 'Cloud Scheduler / trigger / a nightly run / every night / on demand / timetable'
  zh_subtitle: 'Cloud Scheduler / 触发器 / 每晚 / 按需 / 时间表'
  first_use: 'S02[6]：如果要每晚运行，常用的触发器是 Cloud Scheduler，不过这个 README 没有用它。'
  note: 'Cloud Scheduler stays (product). trigger → 触发器; nightly / every night → 每晚; on demand → 按需; a Cloud Scheduler timetable → Cloud Scheduler 的时间表. Who presses start? → 谁来按开始？'
- en: 'Try one / B, … / the right option / throttled / the loop stalls / crashed'
  zh_subtitle: '选项 / 节流 / 卡住 / 崩溃'
  first_use: 'S02[8]：A 整个小时都在为一个实例付钱，而且空闲的 service 的 CPU 会被节流，所以循环会卡住。'
  note: 'Ponder answers open with the letter: B, a job … → 选 B，……; the letters A-D stay (one-letter words are ignored by the checker). throttled → 节流; stalls → 卡住. Try one. → 来试一道。 (A9: the lead-in never hints at the answer).'
- en: 'So the rule / the rule / pick a job / pick a service'
  zh_subtitle: '规则'
  first_use: 'S02[9]：所以规则是：如果题目说它运行、写出结果然后退出，或者说它每晚运行，选 job。'
  note: 'The exam-rule cards are English on screen (A11); the SAY''s the rule → 规则 (So the rule: → 所以规则是：; The rule: → 规则是：). pick → 选. Keep the English clause order (D9): the if-clause stays first here because the English puts it first.'
# ---------------------------------------------------------------- Who pays for idle time: two meters
- en: 'two meters / meter / the gold shading / the yellow ticks / one day'
  zh_subtitle: '计价器 / 金色阴影 / 黄色刻度'
  first_use: 'S03[0]：我们把它说准确：两个计价器，一天。'
  note: 'L01: the meter → 计价器 (its meter runs → 它的计价器一直在走; climbs → 往上涨; does not move → 不动). V2''s labels stay English on screen (A11).'
- en: 'virtual machine / VM / the VM row / from boot to shutdown / provisioned hours / provisioned time'
  zh_subtitle: '虚拟机 / VM / 预配的时长 / 开机 / 关机'
  first_use: 'S03[1]：它的计价器从开机走到关机，不管有没有请求。'
  note: 'L01: virtual machine → 虚拟机 (definition sentences), VM → VM (the machine, the row); measure word 台. provisioned → 预配 (Google Cloud''s Chinese docs): idle hours are still provisioned hours → 空闲的小时仍然是预配的小时.'
- en: 'idle time / idle / idle gaps / quiet gaps / zero idle cost'
  zh_subtitle: '空闲时间 / 空闲 / 间隔 / 零空闲成本'
  first_use: 'S03[3]：现在把请求之间的安静间隔拉长。'
  note: 'idle → 空闲 (idle time → 空闲时间; Zero idle cost has a price → 零空闲成本是有代价的).'
- en: 'function / a function / the function meter / Cloud Run functions / Cloud Functions'
  zh_subtitle: '函数 / Cloud Run functions / Cloud Functions'
  first_use: 'S03[3]：函数的计价器完全不动：没有请求，就没有费用。'
  note: 'A3: function (the serverless product, a Python function, the serving function) → 函数, one word on purpose: the video ties the entry point and the serving function together (S07[8]). The product names stay as written (A1 b): Cloud Run functions (today''s name), Cloud Functions (the slides'' name); And the slides'' Cloud Functions are now Cloud Run functions → 还有，课件里的 Cloud Functions 现在叫 Cloud Run functions. No 云函数.'
- en: 'request-based billing / billed / bill / which bill changes / pay-per-use bill / costs nothing between runs'
  zh_subtitle: '按请求计费 / 计费 / 账单 / 按用量计费'
  first_use: 'S03[2]：下面一行是一个函数，或者一个按请求计费、最小实例数为 0 的 Cloud Run service，和 README 里一样。'
  note: 'L01: billed → 计费; bill (noun) → 账单 (Which bill changes? → 哪份账单会变？); pay-per-use → 按用量计费 (the pay-per-use bill → 按用量计费的那份账单); request-based billing → 按请求计费 (the README''s Request-based is on screen).'
- en: 'invocations / every invocation / execution time / running time / how long each one runs'
  zh_subtitle: '调用 / 调用次数 / 执行时间 / 运行时间'
  first_use: 'S03[2]：它的计价器只随调用次数和每次运行多长时间而动。'
  note: 'invocation → 调用 (every invocation and its running time → 每次调用和它的运行时间); invocations (as a count) → 调用次数; execution time → 执行时间.'
- en: 'cold start / minimum instances / minimum instances 0 / a warm instance / always on / always-on instance'
  zh_subtitle: '冷启动 / 最小实例数 / 热实例 / 常驻'
  first_use: 'S03[4]：零空闲成本是有代价的，课件第 16 页点出了它：冷启动。'
  note: 'cold start → 冷启动 (standard). minimum instances → 最小实例数 (Set it to 1 → 设成 1); max instances → 最大实例数 (screen only). a warm instance → 热实例. always on → 一直开着; always-on things → 常驻资源; the always-on instance → 常驻实例.'
- en: 'Vertex AI endpoint / endpoint / minimum replica count / deploy call / the part that costs money'
  zh_subtitle: 'Vertex AI endpoint / endpoint / 最小副本数 / 部署调用'
  first_use: 'S03[5]：下一讲的 Vertex AI endpoint 也一样：它的部署调用要求最小副本数为 1，README 说这就是花钱的部分。'
  note: 'L08: endpoint stays (written 端点（endpoint）, A4). The SAY says min_replica_count as words → 最小副本数 (prose; no en_display needed). the part that costs money → 花钱的部分.'
- en: 'serverless / serverless is cheap / no minimum charge / free work'
  zh_subtitle: 'serverless / 最低收费'
  first_use: 'S03[8]：所以规则不是：serverless 很便宜。'
  note: 'A1 c (new): serverless stays in the subtitles, as Chinese engineers say it (serverless 部署; written 无服务器（serverless）, A4). no minimum charge → 没有最低收费; free work → 免费干活 (D confuses no minimum charge with free work → D 把没有最低收费和免费干活混为一谈).'
# ---------------------------------------------------------------- Function or container: what you hand over
- en: 'hand over / deploy / deployment / redeploy / the serverless row'
  zh_subtitle: '交出 / 部署 / 重新部署'
  first_use: 'S04[0]：课上用四种方式部署同一个翻译应用：虚拟机或 serverless，代码文件或 container。'
  note: 'hand over → 交出 (What you hand over → 你要交出什么). deploy → 部署 (L02); redeploy → 重新部署; one deployment → 一次部署. code file → 代码文件. the VM row / the serverless row → VM 那一行 / serverless 那一行.'
- en: 'source file / source / requirements file / requirements / main.py / one name'
  zh_subtitle: '源文件 / 源代码 / requirements 文件 / 依赖 / main.py'
  first_use: 'S04[1]：部署函数，你交出一个源文件、它的 requirements 文件，再加一个名字。'
  note: 'main.py stays (file name, A1 a). the requirements file → requirements 文件 (requirements.txt is on screen); Cloud Build installs the requirements → 安装依赖; source plus an entry point → 源代码加入口点.'
- en: 'hello underscore HTTP / hello_http / an HTTP handler / two language codes'
  zh_subtitle: 'hello 下划线 http / HTTP 处理函数 / 语言代码'
  first_use: 'S04[1]：这个文件是 main.py：一个叫 hello 下划线 http 的 HTTP 处理函数，它从请求里读出文本和两个语言代码。'
  note: 'A6: the checker rejects hello_http; the SAY spells the underscore out (hello underscore HTTP) because the exact name is the point, so the subtitle does too: hello 下划线 http (lower case, as on screen); en_display hello_http (D4).'
- en: 'entry point / the framework / Not the file name, and not the service name'
  zh_subtitle: '入口点 / 框架 / 文件名 / service 名称'
  first_use: 'S04[2]：这个名字就是入口点：框架应该调用的那个 Python 函数。'
  note: 'entry point → 入口点 (Google Cloud''s Chinese docs; the README''s --entry-point is on screen). Type main as the entry point → 入口点填 main.'
- en: 'Cloud Build / Functions Framework / Artifact Registry / publishes an image / build time / build'
  zh_subtitle: 'Cloud Build / Functions Framework / Artifact Registry / 构建 / 构建时'
  first_use: 'S04[3]：这只在构建时发生一次，不是每个请求都来一次。'
  note: 'Products stay (A1 b). build → 构建 (L02; Then Google builds → 然后由 Google 构建); publishes → 发布; at build time → 在构建时.'
- en: 'build logs / service logs / the job''s execution logs / The function build fails'
  zh_subtitle: '构建日志 / service 日志 / 执行日志 / 构建失败'
  first_use: 'S04[4]：函数构建失败，构建日志会告诉你原因。'
  note: 'log → 日志 (L07: 服务器日志). build logs → 构建日志; service logs → service 日志; execution logs → 执行日志.'
- en: 'without managing containers / Google still builds one'
  zh_subtitle: '管理 container'
  first_use: 'S04[5]：你不用管理它，但 Google 照样会构建一个。'
  note: 'Slide 11''s claim, said kindly (A9). manage → 管理.'
- en: 'a finished image by its URL / builds nothing / built beforehand / base Python / default port / You control all three'
  zh_subtitle: '现成的 image / 基础 Python / 默认 port'
  first_use: 'S04[6]：它的 Dockerfile 选定了基础 Python、默认 port 8080，以及启动命令。'
  note: 'image and container stay (A2). base Python → 基础 Python (cf. base image, A2). You control all three → 这三样都由你控制.'
- en: 'HTTPS URL / query string / new inputs / with no redeploy'
  zh_subtitle: 'HTTPS / 查询字符串 / 输入'
  first_use: 'S04[7]：函数通过查询字符串接收新的输入，不用重新部署。'
  note: 'query string → 查询字符串 (the URL with its query string is on screen).'
- en: 'a container instance / A function is a container you did not write'
  zh_subtitle: 'container 实例'
  first_use: 'S04[8]：函数就是一个不用你自己写的 container。'
  note: 'The scene''s one-line lesson, said the same way in S04 and S08 (Google builds the image → image 由 Google 构建).'
# ---------------------------------------------------------------- Who may call it, who it runs as, where to look
- en: 'permission / two permission questions / public app / caller / the left door / the right door'
  zh_subtitle: '权限 / 公开应用 / 调用方 / 门'
  first_use: 'S05[1]：左边的门是调用方。'
  note: 'V4''s metaphor by meaning: door → 门 (the left door → 左边的门). caller → 调用方; calls out → 向外调用. permission → 权限.'
- en: 'public access / Allow public access / 403 / turned away / before your code even runs'
  zh_subtitle: '公开访问 / 403'
  first_use: 'S05[1]：不允许的话，没有权限的调用方会被 403 挡回去，你的代码根本不会运行。'
  note: 'public access → 公开访问 (the console toggle Allow public access stays on screen). a 403 → 403 (digits, C1). turned away / stopped → 挡回去 / 挡住.'
- en: 'service account / badge / translation demo runtime / roles / Agent Platform User / Service Usage Consumer'
  zh_subtitle: '服务账号 / 工牌 / translation-demo-runtime / 角色 / Agent Platform User / Service Usage Consumer'
  first_use: 'S05[2]：这个 web 应用戴着一个服务账号工牌 translation-demo-runtime，有两个角色：Agent Platform User 和 Service Usage Consumer。'
  note: 'L01/L05: service account → 服务账号, role → 角色; role names verbatim (A1 a). V4''s badge → 工牌 (one metaphor, one word). The SAY says the account as words; the subtitle writes translation-demo-runtime and en_display restores it (D4). The full email is on screen only.'
- en: 'key / You do not create or download a key / No key file anywhere / default credentials / token / the attached account'
  zh_subtitle: '密钥 / 密钥文件 / 默认凭据 / token'
  first_use: 'S05[3]：哪里都没有密钥文件。'
  note: 'key → 密钥 (series); default credentials → 默认凭据 (L08: credentials → 凭据); token stays (L2-L4). the platform hands it a token → 平台会给它一个 token.'
- en: 'identity / your own identity / Service Account User / to attach / a deployment permission'
  zh_subtitle: '身份 / Service Account User / 挂到 / 部署权限'
  first_use: 'S05[4]：这是部署权限，和工牌本身能做什么是两回事。'
  note: 'identity → 身份 (who it runs as → 以谁的身份运行). attach (a badge) → 挂到. Service Account User verbatim.'
- en: 'Storage Object Viewer / Storage Object Creator / input bucket / output bucket / One badge per workload'
  zh_subtitle: 'Storage Object Viewer / Storage Object Creator / 输入 bucket / 输出 bucket / 工作负载'
  first_use: 'S05[5]：一个工作负载一个工牌。'
  note: 'Role names verbatim; give Agent Platform User and the Storage roles a clause of their own (G1). workload → 工作负载.'
- en: 'harder to debug / debugging / A finished build is not proof that it works'
  zh_subtitle: '调试 / 构建成功'
  first_use: 'S05[6]：构建成功不代表它能用。'
  note: 'debug → 调试 (harder debugging → 更难调试).'
# ---------------------------------------------------------------- Where preprocessing lives
- en: 'preprocessing / preprocess / a trained model / serve a model'
  zh_subtitle: '预处理 / 训练好的模型'
  first_use: 'S06[0]：想象两个客户端：一个手机应用，一个网页。'
  note: 'preprocessing → 预处理 (standard). To serve a trained model → 要部署一个训练好的模型 (serve a model → 部署模型; the command serve stays, A7).'
- en: 'client / clients / a phone app / a web page / thin client / client release'
  zh_subtitle: '客户端 / 手机应用 / 网页 / 瘦客户端 / 客户端发布'
  first_use: 'S06[4]：这就是瘦客户端。'
  note: 'L08: client → 客户端. thin client → 瘦客户端 (standard). client release → 发布客户端 (no client release → 不用发布任何客户端); re-released in lockstep → 同步重新发布.'
- en: 'gear / recipe / two copies / code bases'
  zh_subtitle: '齿轮 / 配方 / 副本 / 代码库'
  first_use: 'S06[1]：这是同一份配方的两个副本，在两个代码库里。'
  note: 'V5''s metaphor: gear → 齿轮; the recipe → 配方. code base → 代码库 (≠ repo, which stays for the demo repo: the repo''s own client → 这个 repo 自己的客户端).'
- en: 'decode the JPEG / scale the pixels to between 0 and 1 / resize / 224 by 224 / normalize'
  zh_subtitle: '解码 / JPEG / 像素 / resize / 224 乘 224 / 归一化'
  first_use: 'S06[1]：每个客户端都带着同一个齿轮：解码 JPEG，把像素缩放到 0 到 1 之间，再 resize 到 224 乘 224。'
  note: 'A1 c (new): resize stays, as Chinese CV engineers say it (a bad resize → 一个有问题的 resize; No resizing → 不 resize). decode → 解码; normalize → 归一化; scale (the pixels) → 缩放. 224 by 224 → 224 乘 224 (B3).'
- en: 'client-side brittleness / quietly receives another'
  zh_subtitle: '客户端的脆弱性'
  first_use: 'S06[2]：课上把这叫做客户端的脆弱性。'
  note: 'Slide 13''s term → 客户端的脆弱性 (the slide chip stays English, A11).'
- en: 'raw JPEG bytes / base64 / base64 encodes / JSON / predict'
  zh_subtitle: '原始字节 / 字节 / base64 / JSON / predict'
  first_use: 'S06[3]：客户端发送原始的 JPEG 字节，用 base64 包起来，因为 JSON 装不了原始字节。'
  note: 'bytes → 字节; base64 stays; base64 encodes them → 做 base64 编码; calls predict → 调用 predict (the method name, A1 a).'
- en: 'version 1 / version 2 / roll back / rollback / ship / healthy'
  zh_subtitle: '版本 / 回滚 / 发布 / 恢复正常'
  first_use: 'S06[5]：回滚到版本 1，两个客户端在同一瞬间恢复正常。'
  note: 'roll back → 回滚; ship (a version) → 发布; version 2 → 版本 2. What does the same rollback cost? → 同样的回滚要付出什么代价？ (the ponder line: no answer, A9).'
- en: 'app store review / a web deploy / the clients disagree'
  zh_subtitle: '应用商店审核 / 网页部署 / 不一致'
  first_use: 'S06[7]：它们上线的时间不同，在这中间，两个客户端的结果不一致。'
  note: 'app store review → 应用商店审核; land → 上线; disagree → 结果不一致.'
# ---------------------------------------------------------------- Register serve: preprocess, then model
- en: 'the chain / decode / convert to floats / four probabilities / one per cheese / classified'
  zh_subtitle: '解码 / 浮点数 / 概率 / 奶酪 / 分类'
  first_use: 'S07[0]：这条链是：JPEG 字节，解码，转成浮点数，resize，模型，最后是四个概率，每种奶酪一个。'
  note: 'probability → 概率; classified → 分类 (Nothing was classified → 根本没有做分类). The cheese names are on screen only.'
- en: 'preprocess image / preprocess_image / returns an image, not an answer'
  zh_subtitle: 'preprocess image / 图片'
  first_use: 'S07[1]：在这个 repo 里，preprocess image 做前三步，一次处理一张图。'
  note: 'A6: preprocess_image → preprocess image (as the SAY); en_display preprocess_image (D4).'
- en: 'serving function / serving_function / a batch of strings / maps over each one / inference / bytes inputs'
  zh_subtitle: 'serving function / 一批字符串 / 推理 / bytes inputs / 键'
  first_use: 'S07[2]：预处理和推理，在同一个函数里。'
  note: 'A6: serving_function → serving function, bytes_inputs → bytes inputs (as the SAY; en_display restores both). inference → 推理. a batch of strings → 一批字符串 (A7: not the batch command). the key clients use → 客户端要用的键. maps preprocess image over each one → 对每一个调用 preprocess image.'
- en: 'serve (the exam''s name) / the function that preprocesses, then predicts / predict'
  zh_subtitle: 'serve / 预测'
  first_use: 'S07[2]：考题可能把这个函数叫做 serve：不是 web 应用的 serve 命令，而是先预处理、再预测的那个函数。'
  note: 'A7: serve has two meanings in this video and the SAY separates them: the web app''s serve command (S01-S02) vs the exam''s name for the serving function. predict → 预测.'
- en: 'serving default / serving_default / export / registers / the model server / SavedModel / signature'
  zh_subtitle: 'serving default / 导出 / 注册 / 模型服务器 / 签名'
  first_use: 'S07[3]：导出时把它注册在 serving default 这个名字下面，模型服务器调用的就是这个名字背后的东西。'
  note: 'A6: serving_default → serving default; en_display serving_default. register → 注册; export → 导出; the model server → 模型服务器; signature (serving signature, quiz word) → 签名 / serving 签名 (written 签名（signature）). SavedModel on screen only. The slide saves it with a different call → 课件用另一种调用来保存它.'
- en: 'plugs / socket / the raw model / float arrays / float tensors / no longer fit'
  zh_subtitle: '插头 / 插座 / 原始模型 / 浮点数组 / 浮点张量'
  first_use: 'S07[6]：它要的是浮点张量，所以 JPEG 字节插不进去。'
  note: 'V6''s metaphor: plug → 插头, socket → 插座 (Before we try plugs → 试插头之前). the raw model → 原始模型; tensor → 张量; float arrays → 浮点数组.'
- en: 'the test step / feeds it bytes inputs / one exported version'
  zh_subtitle: '测试步骤 / 导出的版本'
  first_use: 'S07[7]：这个 repo 的测试步骤加载 serving default，喂给它 bytes inputs，和服务器的做法一样。'
  note: 'A5: the sentence opens with 这个 repo (repo never opens a sentence bare).'
- en: 'the platform calls exactly the name you registered / downstream'
  zh_subtitle: '平台 / 下游'
  first_use: 'S07[8]：这和函数的入口点是同一个道理：平台只调用你注册的那个名字，名字错了，下游什么也补救不了。'
  note: 'The bridge sentence (S07[8], S08[2]) ties 入口点 and serving default: same wording both times (平台只调用你注册的那个名字).'
# ---------------------------------------------------------------- Seven rules for Tuesday
- en: 'Seven rules / One: … Seven: / Which one to use? / rule of thumb'
  zh_subtitle: '七条规则 / 第一 / 经验法则'
  first_use: 'S08[0]：周二的七条规则。'
  note: 'Ordinals in the recap: One: → 第一：… Seven: → 第七：. rule of thumb → 经验法则.'
- en: 'Vertex AI / serve a trained model in production / part of a broader app'
  zh_subtitle: 'Vertex AI / 生产环境 / 更大的应用'
  first_use: 'S08[3]：下一讲的经验法则：Vertex AI 用来在生产环境部署训练好的模型，Cloud Run 用在模型只是更大应用一部分的时候。'
  note: 'D9: keep the English order, product first in each clause (Vertex AI 用来……，Cloud Run 用在……的时候); never move the when-clause in front of its product.'
- en: 'vendor lock-in / cold starts / harder debugging'
  zh_subtitle: '厂商锁定 / 冷启动 / 更难调试'
  first_use: 'S08[3]：还要记住课件第 16 页说的代价：厂商锁定、冷启动、更难调试。'
  note: 'Slide 16''s three costs, listed with 、 (B2).'
