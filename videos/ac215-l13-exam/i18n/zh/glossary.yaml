- en: 'custom job / shows running / close the laptop for the night / third question'
  zh_subtitle: '自定义任务 / 第三题'
  first_use: 'S07[8]：你的自定义任务显示 RUNNING，你合上笔记本过夜。'
  note: 'A9: the question block never says where the job runs. The state as on screen: RUNNING.'
- en: 'keeps running on its own machine until it finishes or fails / the CLI container only submitted it / W&B only logs; it never drives training / nothing on your laptop holds the job''s state'
  zh_subtitle: 'CLI / container / 状态'
  first_use: 'S07[9]：A：CLI container 只负责提交。'
  note: 'Answer first: 答案是 B：它在自己的机器上一直跑，直到完成或失败 (D9). C：W&B 只负责记录，从不驱动训练。 D：你笔记本上没有任何东西保存着任务的状态。'
- en: 'training takes longer than the request / submit a durable job, return its id, and poll / W&B only watches'
  zh_subtitle: '轮询'
  first_use: 'S07[10]：题目说训练要跑得比请求还久，就想：提交一个持久的任务，返回它的 ID，然后轮询。'
  note: 'Second sentence: W&B 只是在旁边看着。'
# ---------------------------------------------------------------- Six rules for Tuesday
- en: 'Six rules for Tuesday / Rule one / Rule six'
  zh_subtitle: '规则 / 第一条 / 周二'
  first_use: 'S08[0]：周二要记住的六条规则。'
  note: 'Rule one: … → 第一条：callback 每个 epoch 往活跃的 run 写一条记录；init 开启一个 run，finish 关闭它。 The rules say exactly what the takeaways said (D5).'
- en: 'separate strategies make separate models / split across the replicas in sync / a durable job with an id / an archived snapshot plus the record that points at it'
  zh_subtitle: '独立的策略'
  first_use: 'S08[5]：第六条：数据版本，就是归档的快照，加上指向它的记录。'
- en: 'three levers / more data / better models / faster hardware / the bookkeeping that shows whether it helped / Good luck on Tuesday'
  zh_subtitle: '杠杆 / 硬件 / 记账'
  first_use: 'S08[6]：课上一开始讲了让深度学习变好的三个杠杆：更多数据、更好的模型、更快的硬件。'
  note: 'Today was the hardware lever, plus the bookkeeping that shows whether it helped → 今天讲的是硬件这个杠杆，再加上能看出它有没有用的记账. Good luck on Tuesday. → 祝你周二考试顺利。'
