# Chinese (zh-CN) glossary and translation rules for ac215-l13-exam (AC215 lecture 13, Advanced Training Workflows, the
# EXAM EDITION: a 12-15 minute, concept-first explainer for a student whose Quiz 4 is on Tuesday; five mechanisms drawn
# as diagrams (V1 the W&B run ledger, V2 what pip unwraps from the trainer package, V3 MirroredStrategy vs separate
# machines, V4 the global batch splitter, V5 request lifetimes vs a durable Vertex AI job) with code panels from
# dlops-io/model-training @ b9aee1c and the lecture's Experiment Tracking notebook as evidence; three quiz-style ponder
# cards; no README tracker, no captures, nothing typed or run), code-switching version, SUBTITLES ONLY.
# Audience: Chinese-speaking AC215 grad students the day before the quiz, who read technical English fluently; register
# of a Chinese MLOps TA running a review session (答疑 / 考前串讲) the day before the quiz.
# Precedents and source of the shared decisions: the series pilot videos/ac215-l01-vms-venvs/i18n/zh (repo, clone,
# commit, pin, lock 文件, shell, 笔记本, 服务账号, 密钥), the container lectures L02-L04 (container, image, bucket, 层,
# 退出码, the subtitles-only rule set), ac215-l05-rag (权重, token, 一个小疏漏), ac215-l06-agents-1 (notebook, SDK,
# 区域, Colab's screen words), ac215-l07-agent-harness (diff, 坑, 基线, 课程团队, the rule layout A1-I3) and the latest
# finished episode ac215-l08-llm-finetuning (epoch, batch, loss, trainer, 梯度, 优化器, 学习率, 微调任务 → job = 任务,
# the D1-D9 / G1-G3 toolchain rules). Every term L1-L8 already decided keeps its form; what is new here is the
# experiment-tracking vocabulary (run, callback, logger, config, 活跃的 run, 历史记录, 账本), the packaging vocabulary
# (包, tar 包, 依赖, 模块, 导入路径, 预构建的训练 image), the tf.distribute vocabulary (策略, 副本, all-reduce, 分片,
# worker, 全局 batch, 每个副本的 batch), the job vocabulary (持久的任务, 请求处理函数, 请求超时, 服务器实例, 轮询,
# 无服务器训练, worker pool) and the exam vocabulary (题目, 选项, 错误选项, 第一题, 答案是 C, 题目说……就想……).
# There is NO Chinese voice in this series: the Chinese lines are subtitles on the English timing (the bilingual band of
# output/<id>.zh-en.mp4, <id>.zh.srt, <id>.zh-en.srt / .ass). So no say:, no anchors, no readings, no durations: only
# display rules. But `python -m explainer.i18n check` still applies its voice hygiene to the displayed line when a
# sentence has no say: (brackets, maths symbols, letter_letter names, Latin words not listed here, a missing half-width
# space): rules A6, B3 and D3 are how the Chinese line stays clean without say:.
# Human-readable copy in Chinese: GLOSSARY.md (keep the two in sync; both term tables come from the same data).
# terms[].zh_subtitle = the subtitle form (titles and companions use A4's written register); terms[].first_use = one
# example sentence (SNN[k]: scene SNN, SAY block k counted from 0), each one passes the checker; terms[].note = rules.
# Read by: python -m explainer.i18n check (Latin words allowed in a subtitle line: every Latin word of zh_subtitle and
# first_use, plus allowed_spoken_latin) and explainer/subtitles.py (2-3 word English phrases of `en` are kept on one
# English line; 2-7 character Chinese headwords of zh_subtitle are registered in jieba; I3).
video: ac215-l13-exam
lang: zh-CN (mainland Simplified Chinese)
audience: 'Chinese-speaking AC215 (MLOps & LLMOps) grad students the day before Quiz 4: they sat Lecture 13 and skimmed the model-training README, know Keras model.fit, epochs and batches and what a GCS bucket is (L10-L11), have not necessarily run a Vertex AI job or trained on two GPUs, and watch to answer conceptual multiple-choice questions on W&B runs and callbacks, packaging for a Vertex AI custom job, MirroredStrategy vs MultiWorkerMirroredStrategy, global vs per-replica batch size and durable training jobs, and to say why each wrong option is wrong. Nothing is typed along. Register of a Chinese MLOps TA running a review session the day before the quiz.'
voice: none          # subtitles only (video.yaml: Chinese = i18n/zh/narration/*.yaml on the English timing)
policy: 'The Mandarin of a Chinese MLOps TA running a review session the day before the quiz (考前串讲): code-switching only where such a speaker really does, written as subtitles under an English narration. The viewers already say 起一个 container, 建一个 bucket, 跑 2 个 epoch, batch 大小 4, loss 降下来, 看 notebook; this video adds 开一个 run, 活跃的 run, 加一个 callback, 用 logger 记指标, config 里, 做 all-reduce, 每个 worker, 一个 worker pool. Every choice passes three tests: what is said in a real review session; the standard, searchable Chinese name (the Chinese TensorFlow and Google Cloud documentation and the ML literature: 实验追踪, 可复现, 回调, 依赖, 模块, 导入路径, 分布式策略, 副本, 梯度, 分片, 全局批次, 无服务器, 请求超时, 轮询); and consistency with the series (L1-L8: every form they fixed is kept: repo, bucket, image, container, notebook, epoch, batch, loss, 权重, 梯度, 优化器, 学习率, 区域, 密钥, 笔记本 for a laptop, 任务 for a job). (1) Artifacts verbatim: what the viewer matches on screen and in the exam options (function and class names, file and folder names, the command, module paths, error text, job states, config keys) is copied letter for letter, never translated, inflected or quoted; the exceptions the checker forces are names with an underscore and the characters = + < > | ( ) [ ] ×, written the way the narration says them (A6, B3). Nothing on screen is translated in this series: code panels, diagram labels, tags, the ponder (multiple-choice) cards and the YELLOW takeaway lines stay English; only the narration is. (2) Lab-speech English, a closed list: from the series repo, pin, lock 文件, container, image, bucket, ID, CLI, pipeline, notebook, SDK, API (L1-L6), epoch, batch (a training batch only), loss (L08); new in this video run (a W&B run, the noun only), callback, logger, config (a run''s config), all-reduce, worker (a machine in TF config), worker pool. (3) Everything else in standard Chinese: 实验追踪, 可复现, 训练工作流, 账本, 一行, 指针, 活跃的 run, 封存, 历史记录, 指标, 系统图表, 准确率, 曲线, 环境, 代码, 数据, 产物, 笔记, 数据版本, 快照, 版本记录, 内容哈希, 密钥, 命令行参数, 包, tar 包, 打包脚本, 依赖, 模块, 导入路径, 安装, 预构建的训练 image, 任务, 训练任务, 自定义任务, 提交, 轮询, 状态, 计费, 机器, 机器类型, 区域, 策略, 副本, 同步, 梯度, 平均, 更新, 分片, 权重, 优化器变量, 全局 batch, 每个副本的 batch, 托盘, 请求处理函数, 请求超时, 服务器线程, 服务器实例, 回收, 代理, 客户端超时, 生命周期, 无服务器训练, 硬件, 题目, 选项, 错误选项, 答案, 规则. (4) The video''s metaphors by meaning, one word each: 账本 (the ledger), 一行 (a row), 笔 (the pen = the callback), 指针 (the wandb.run pointer), 挂锁 / 封存 (the padlock, sealing), 购物清单 (the shopping list = install_requires), 扫描 (the find_packages scanner), 孤岛 (islands), 连线 (the wire), 托盘 and 一份 (the tray and its slices), 旋钮 (the dial), 时钟 (a clock = a lifetime), 工单 (the job ticket), 引擎 (an engine), 杠杆 (levers). (5) Written register for titles, meta.yaml and companion docs: 仓库, 容器, 镜像, 存储桶, 运行（run）, 回调（callback）, 配置（config）, 轮次（epoch）, 批次（batch）, 全局批次, 每副本批次, 副本（replica）, 训练任务, 自定义训练任务（custom job）; class and function names stay. (6) The bilingual band puts the English sentence under every Chinese line, so the Chinese line carries no glosses and no brackets at all (the checker forbids them without say:). (7) No person''s name: the narration says the lecture and the lecture''s notebook → 课上 / 课上的 notebook (A10). (8) The toolkit''s constraints are part of the policy: one Chinese sentence per English sentence (73 blocks, 176 sentences), a checker-clean display line (D3), an en_display wherever the SAY spells an artifact out as words (D4), the English clause order kept (D9). Mainland Simplified Chinese; relaxed, clear review-session speech, never slangy.'
rules:
- '[A1] Code-switching scope. English stays in three places only. (a) Artifacts, copied letter for letter: function, method and attribute names as the narration names them (wandb.init, wandb.run, wandb.run.finish, wandb.log, init, finish, log, fit, callbacks, strategy.scope, dataset.batch), class names (WandbMetricsLogger, WandbCallback, MirroredStrategy, MultiWorkerMirroredStrategy, OneDeviceStrategy, ModuleNotFoundError), file and folder names (setup.py, task.py, augment.py, package, trainer, init 文件 for __init__.py, pyproject 文件), the module and command (trainer.task, python -m trainer.task, gcloud ai custom-jobs create, import augment, pip), names written the way the SAY says them (A6: install requires, find packages, num replicas in sync, num workers, TF config), the machine type n1-standard-32, error text (ModuleNotFoundError; you must call init before log, translated as the SAY paraphrases it, A9), the job states as the screen shows them (QUEUED, PENDING, RUNNING, SUCCEEDED), the pointer''s None, package names (wandb, TensorFlow, scikit-learn, requests). (b) Products, organisations, the course and names: AC215, Weights & Biases (first use) and W&B, Google, Vertex AI, Vertex, Keras, TensorFlow, Python, PyPI, Docker, GitHub, gcloud, GPU, CPU, T4. (c) Words Chinese MLOps engineers really say in English in a review session, a closed list: from the series repo, pin, lock 文件, container, image, bucket, ID, CLI, pipeline, notebook (L1-L6), epoch, batch (a training batch only), loss (L08); new in this video run (a W&B run, the noun only), callback, logger, config (a run''s config), all-reduce, worker (one machine in TF config), worker pool (the Vertex AI spec''s word). A word joins (c) only when review-session speech really uses the English and the Chinese is stilted or collides with another term (run: 运行 collides with the verb; config: the screen and the exam options say config; all-reduce: 全归约 is never said). Never English for flavour: experiment tracking, reproducibility, ledger, row, pointer, history, metrics, charts, curves, accuracy, environment, data version, snapshot, hash, key, flag, package, tarball, dependency, module, import path, install, prebuilt image, job, submit, poll, state, strategy, replica, gradient, shard, weights, global batch, request handler, timeout, server instance, serverless, question, option, answer and rule are Chinese (A3): 实验追踪, 可复现, 账本, 一行, 指针, 历史记录, 指标, 系统图表, 曲线, 准确率, 环境, 数据版本, 快照, 内容哈希, 密钥, 命令行参数, 包, tar 包, 依赖, 模块, 导入路径, 安装, 预构建的训练 image, 任务, 提交, 轮询, 状态, 策略, 副本, 梯度, 分片, 权重, 全局 batch, 请求处理函数, 请求超时, 服务器实例, 无服务器训练, 题目, 选项, 答案, 规则.'
- '[A2] container and image (as L2-L8). The subtitles say container and image: 你自己的 Docker image, 预构建的训练 image, CLI container; measure word 个. Titles, chapter names, meta.yaml and companion docs write 容器, 镜像 (A4). mirrored / a mirror (tf.distribute) is never 镜像 in a subtitle (A7): it is 复制 (每块 GPU 上复制一份) and the class name MirroredStrategy stays.'
- '[A3] The vocabulary new in this video. Experiment tracking: experiment tracking → 实验追踪, track → 追踪, tracker → 实验追踪工具 (never 进度条: L08''s on-screen tracker does not exist here), reproducibility / accountability → 可复现 / 可追责 (only if said; the slide words are on screen in English), run (W&B) → run, a training run → 训练 run, the run record / a run''s record → run 的记录, ledger → 账本, row → 一行 / 这一行 / 第一行, active run → 活跃的 run, the pointer → 指针, points at → 指向, falls back to nothing → 变回空, open (a run) → 开 / 开启, finish → finish (the call) / 关闭 (closes it), seal → 封存, sealed → 封存了, config → config, config value → 一个 config 值, system charts → 系统图表, CPU and memory → CPU 和内存, loss chart → loss 图, accuracy → 准确率, curves → 曲线, metrics → 指标, log (verb) → 记录 / 写入, logger → logger, callback → callback, pen → 笔, history entry → 一条历史记录 / 一条记录 (ticks → 条), per epoch / per batch → 每个 epoch / 每个 batch, deprecated → 已弃用, replacement → 替代品 / 替代. Run record contents: environment → 环境, code → 代码, data → 数据, model → 模型, artifacts → 产物, notes → 笔记 (≠ 笔记本, A7), versioning system → 版本管理系统, data version → 数据版本, archived snapshot → 归档的快照, version record → 版本记录, content hash → 内容哈希, a fixed release → 一个固定版本. Packaging: package (Python) → 包, the package folder → package 目录, the trainer folder / package → trainer 目录 / trainer 包, init file → init 文件, setup.py keeps two lists → 两张清单, install requires → install requires, shopping list → 购物清单, Python Package Index → PyPI, pinned → pin 了版本的, find packages → find packages, scanner → 扫描, tar → 打包, tarball → tar 包, compress → 压缩, packaging script → 打包脚本, job script → 提交任务的脚本, module → 模块, a teammate''s module → 队友写的模块, made-up example → 编的例子, import path → 导入路径, dependency → 依赖, install → 安装, travel → 跟着走 / 带过去, prebuilt training image → 预构建的训练 image, job machine → 跑任务的机器, unwrap → 解开. tf.distribute: strategy → 策略, training hardware → 训练硬件, machine → 机器 (一台机器), GPU measure word 块 (两块 T4 GPU), replica → 副本, in sync → 同步, one copy per GPU → 每块 GPU 一份, mirrored → 复制, optimizer variable → 优化器变量, training step → 训练步 / 一步, slice → 一份, gradient → 梯度, averaged → 取平均, the same update → 同一份更新, all-reduce stays, shard → 分片, separate models → 独立的模型, wire → 连线, islands → 孤岛, worker stays, index → 索引, worker pool stays, naming trap → 命名陷阱. Batch: global batch → 全局 batch, per replica batch → 每个副本的 batch, tray → 托盘, slices → 一份一份, dial → 旋钮, batch by n → 按 n 分 batch, divided by → 除以, times → 乘以, the batch size flag → batch 大小参数, data pipeline → 数据 pipeline. Jobs: web app → 网页应用, retrain button → 重新训练的按钮, request handler / handler → 请求处理函数 / 处理函数, request timeout → 请求超时, server thread → 服务器线程, server instance → 服务器实例, recycles → 回收, proxies → 代理, client timeout → 客户端超时, clock → 时钟, lifetime → 生命周期, engine → 引擎, execute → 执行, durable job → 持久的任务, custom job → 自定义任务, submit → 提交 (≠ commit, A7), job id → 任务 ID, poll → 轮询, states → 状态, billed → 计费, serverless training → 无服务器训练, rented → 租用, ticket → 工单, region → 区域 (L06), display name → 名字, machine type → 机器类型, replica count → 副本数. Exam: exam edition → 考前版, quiz → 小测, quiz-style question → 小测风格的题, question → 题目 / 题, option → 选项, wrong option → 错误选项, answer → 答案, rule → 规则 / 第 n 条, ruled out → 排除, takeaway → 结论. The video''s metaphors by meaning, one word each (policy 4).'
- '[A4] Written vs spoken. The subtitles say repo / container / image / bucket / notebook / run / callback / config / epoch / batch / loss / worker pool; titles, chapter names, meta.yaml and companion docs write 仓库 / 容器 / 镜像 / 存储桶 / Colab 笔记本（notebook）/ 运行（run）/ 回调（callback）/ 配置（config）/ 轮次（epoch）/ 批次（batch）/ 损失（loss）/ 工作器池（worker pool）, with the English in brackets at the first use of a core concept (brackets are fine outside the narration); 全局批次 / 每副本批次 for global / per-replica batch; 训练任务 and 自定义训练任务（custom job）for the Vertex AI job (Google Cloud''s Chinese documentation says 作业; the series says 任务 since L08). W&B, Weights & Biases, Vertex AI, class names, function names and setup.py stay in writing too.'
- '[A5] Writing artifacts. Copied letter for letter (case, dots, slashes, hyphens unchanged); never translated, inflected, quoted, put in 《》 or code formatting. Add a Chinese head noun where it helps: package 目录, trainer 目录, trainer 包, init 文件, pyproject 文件, lock 文件, 训练脚本 task.py, 模块 augment.py, n1-standard-32 机器. No sentence opens with an artifact or a lower-case kept-English word: put a Chinese word first (这个 callback……; 而 find packages……; 其中 install requires……; 调用 wandb.init……; 这个 run……; 用 strategy.scope……), so no subtitle starts in lower case. Capitalized names, acronyms, class names and option letters (W&B, Weights & Biases, Vertex AI, Keras, Python, Google, GitHub, MirroredStrategy, ModuleNotFoundError, A：, B：) may open a sentence.'
- '[A6] Names with an underscore and code expressions (as L3-L8). With no say:, the checker reads the display line as the spoken text and rejects letter_letter, brackets, < > | and =; the SAY never reads these names with their underscores either. So the Chinese line writes them the way the narration says them, with a Chinese head noun or in an obvious name slot: install_requires → install requires; find_packages() → find packages; __init__.py → init 文件; num_replicas_in_sync → num replicas in sync (or 同步的副本数 where the SAY says the number of replicas in sync); num_workers → num workers; TF_CONFIG → TF config; strategy.scope() → strategy.scope; wandb.run.finish() → wandb.run.finish; WandbMetricsLogger() → WandbMetricsLogger; x × y → x 乘 y. The class names and dotted names carry no underscore and are written literally (MirroredStrategy, wandb.init, dataset.batch). The English line gets the literal form through en_display (D4).'
- '[A7] Words to keep apart. run (the noun: a W&B run, a row of the ledger) ≠ 跑 / 运行 (the verb: 跑完, 运行 python -m trainer.task) ≠ 训练 (training). 记录 (to log; a history entry: 一条记录) ≠ 版本记录 (the data version record) ≠ 账本 (the ledger) ≠ run 的记录 (what a run holds). 活跃的 run (the active run, wandb.run) ≠ 当前这一行 (said only of the picture). 任务 (a Vertex AI job: 训练任务, 自定义任务, 持久的任务) ≠ 工单 (the ticket picture) ≠ 进程 / 线程 (not a job). 提交 (submit a job) ≠ commit (L01, stays English) ≠ 上传 (upload). 包 (a Python package: trainer 包; a tar 包) ≠ package 目录 (the folder package/) ≠ bucket. 安装 (pip install) ≠ 上传 (the tarball upload) ≠ 带过去 (travel): uploaded ≠ installed is S04''s point. 依赖 (dependencies from PyPI) ≠ 模块 (your own .py files). 副本 (a tf.distribute replica, one per GPU) ≠ 拷贝 / 一份 (a copy of the weights, a slice of the batch) ≠ 副本数 (the replica count: Vertex''s REPLICA_COUNT counts machines, num workers counts GPUs; always say which, S05). worker (a machine in TF config) ≠ num workers (GPUs on one machine) ≠ worker pool (Vertex''s machine group). 机器 (a VM) ≠ 服务器 (the web server in S07). 分片 (a shard of the dataset per machine) ≠ 一份 (a slice of one batch per replica). image (subtitle) ≠ 镜像 (written image) ≠ 复制 (mirrored, A2). 笔记本 (the laptop) ≠ notebook (the lecture''s notebook) ≠ 笔记 (notes, a run-record item). 内存 (CPU memory in the system charts) ≠ 显存 (not said here). 题目 / 题 (a quiz question) ≠ 问题 (a question in general; Hold that thought → 先记着). 课上 (the lecture) ≠ 课件 (the slides) ≠ 课上的 notebook (the lecture''s notebook). 时钟 (a lifetime, S07) ≠ 超时 (a timeout). 区域 (region) ≠ 位置.'
- '[A8] Register: a TA in a review session the day before the quiz. Short, clear sentences with spoken verbs (开, 关, 写, 记, 传, 打包, 交, 切, 乘, 分); the viewer is 你 (never 您, 大家, 同学们); 我们 is the video (我们过几分钟再回来). Chinese word order inside a clause; clause order follows the English (D9). No translationese: not 让我们…… (say 我们来……, 先……), not 这就是为什么…… (say 所以……), few 被 sentences (封存, not 被封存 where the subject is clear), no stacked 一个……的. No internet slang. Carry the spoken rhythm by meaning: Now the batch. → 再看 batch。; Now the hook. → 回到开头。; Last mechanism. → 最后一个机制。; One run, six entries. → 一个 run，六条记录。; Batch by 128. → 按 128 分 batch。; Each GPU gets 16. → 每块 GPU 拿到 16 个。; Here is the key fact. → 关键在这里。; One word on data. → 关于数据，说一句。'
- '[A9] Precision. Translate the quantifiers: only 只, every 每个 / 每次, all 全部, at once 马上 / 立刻, never 从不, exactly 正是, whichever 不管哪个. The quiz facts are stated exactly as the English states them; never soften (one per epoch → 每个 epoch 一条, not 大约; a callback with no active run fails at once → 马上就报错) and never add a fact the English does not say. The error the SAY paraphrases (you must call init before log) is translated as paraphrased (你必须先调用 init，再 log); the exact strings with the wandb 0.15.11 chip are on screen in English. Pause-and-ponder: three questions (S02[9], S06[4], S07[8]); the line under a ponder card asks and never answers or hints: S02[9] must not name the logger or callbacks (Three options can be ruled out with what you know already → 有三个选项，用你已经知道的就能排除); S06[4] must not multiply; S07[8] must not say where the job runs. The answer blocks (S03[0], S06[5], S07[9]) give the letter first (答案是 C：……), then each wrong option with its letter (A：……) in the English order.'
- '[A10] Names. Products, companies and the course keep Latin script (A1 b); 哈佛 only in titles and descriptions. Course: AC215; Lecture 13 → 第 13 讲; the lecture → 课上; the lecture slides → 课件; the lecture''s notebook → 课上的 notebook; the lecture''s roadmap → 课上的路线图; Quiz 4 → Quiz 4 (only in titles and descriptions; the SAY says Tuesday → 周二); this video → 这期视频; the exam edition → 考前版. No person''s name is written or read out (the instructor is never named in this script); no W&B key, project id, entity or job id: the job id is ‹job-id› on screen only. The W&B project cheese-training-vertex-ai and the run name are on screen and never said.'
- '[A11] The screen stays English. This series translates only the narration: code panels (comments included), diagram labels, chips, the gray lecture tags (Lecture 13 · slides a–b), the tags (illustration, concept · lecture only, example · not in the repo, wandb 0.15.11), the multiple-choice ponder cards and their RED reasons, the YELLOW takeaway lines and the recap rules are English, and the scenes need no language changes. Where the narration names something on screen, the subtitle writes it as shown (None, RUNNING, n1-standard-32); what the narration says in its own words is translated (the gray tag → 灰色标签, the pen → 笔, the pointer → 指针, the tray → 托盘).'
- '[A12] Mainland Simplified Chinese only: 默认, 程序, 代码, 文件, 目录, 数据, 数据集, 网络, 脚本, 视频, 信息, 账号, 函数, 参数, 内存, 优化器, 线程, 实例, 进程; never 預設, 程式, 程式碼, 檔案, 資料夾, 資料, 資料集, 網路, 腳本, 影片, 帳號, 函式, 引數, 記憶體, 最佳化器, 執行緒, 執行個體 in traditional forms.'
- '[A13] The series list (the ac215-video skill''s list) in this video. repo (S02, S05, S07), bucket (S02, S04, S07), image (S04, S07), container (S07[9]), notebook (S03), ID (S07), CLI (S07[9]), pipeline (S06[3], data pipeline), pin (S04[2]), lock 文件 (S02[1]); token, prompt, endpoint, volume, venv, PATH, port, agent, adapter, LoRA, Dockerfile and commit are not in this script. Not in the series list but kept here (A1 c, new): run, callback, logger, config, all-reduce, worker, worker pool; epoch, batch and loss as L08.'
- '[B1] Spacing. One half-width space between Hanzi and Latin letters, digits or an artifact (开一个 run, 第 13 讲, 两块 T4 GPU, 8 个副本, 按 128 分 batch, package 目录, init 文件, 32 乘 4 等于 128). The checker reports a missing space on every displayed sentence. Spaces inside an artifact as they are (python -m trainer.task, gcloud ai custom-jobs create, import augment); never add one inside an artifact. No space next to full-width punctuation (……trainer.task。; W&B，……). Never U+00A0 / U+202F.'
- '[B2] Punctuation. Chinese uses full-width ，。、；：？！“”……, also next to an artifact. Lists use 、 (TensorFlow、scikit-learn 和 requests; 环境、代码、数据; QUEUED、PENDING、RUNNING、SUCCEEDED). No brackets of any kind: （）, (), 《》, 【】, [], <> (the checker rejects them without say:). “” only for an idea or a quoted phrase the narration quotes as words (题目说“这个”，就想“那个”); artifacts, class names, states and error names are never quoted. One Chinese sentence (for one English sentence) has no 。？！ inside: use ，；：. Option letters take a full-width colon (A：一个名字只是给这一行贴个标签。; 答案是 C：……). The takeaway formula keeps its colon: 题目说 X，就想：Y。'
- '[B3] Symbols the checker rejects (= < > + → ← ^ ≤ ≥ × ÷ ≈, == != +=, a digit followed by !, brackets, letter_letter): never copied into the Chinese line; say them in words (A6). 32 times 4 is 128 → 32 乘 4 等于 128; divided by → 除以; global = per-replica × replicas → 全局 batch 等于每个副本的 batch 乘以副本数; 2 × 32 → 2 乘 32. Allowed and kept as on screen: . and / in names (setup.py, wandb.run.finish, trainer.task, dataset.batch, strategy.scope), - in commands and names (python -m, custom-jobs, n1-standard-32, scikit-learn, all-reduce), & in W&B and Weights & Biases.'
- '[C1] Numbers in displayed text. Everything that echoes a number on screen, in the code or written as digits in the SAY uses Arabic digits with no thousands separator: lectures (第 13 讲), counts the SAY writes in digits (8 个副本, 16 个, 2 个, 128, 4 块 GPU, 32), sizes, times. Small narrative counts the SAY writes as words use Hanzi: 七样, 四个调用, 五个地方, 三步, 两张清单, 两块 T4, 两份, 两台机器, 三种形态, 四个实验, 两个 epoch, 四个 epoch, 六条记录, 第三到第六条, 第一到第四条, 三个选项, 三次, 六条规则, 一个小时, 三个杠杆; rules and rows: 第一条 … 第六条, 第一行, 第二行. Option letters A to D and the step numbers stay Latin (答案是 B).'
- '[C2] Units, versions, names and days. No version is spoken (wandb 0.15.11 is on the PURPLE chip only). Days: Tuesday → 周二 (Six rules for Tuesday → 周二要记住的六条规则; Good luck on Tuesday → 祝你周二考试顺利). Time: an hour → 一个小时; a few minutes → 几分钟. The machine type as on screen (n1-standard-32; the SAY says n1 standard 32, en_display restores). Money is never quantified (billed only while it runs → 只在运行时计费).'
- '[D1] Sentence alignment (explainer/i18n.py). In narration/*.yaml every SAY line of script.md has one entry (73 blocks); `en` equals the SAY line byte for byte; `zh` has exactly as many items as explainer.voice.split_sentences finds English sentences (176 in this script: S01 16, S02 25, S03 31, S04 25, S05 22, S06 22, S07 25, S08 10). Restructure only inside a sentence; never merge or split sentences. Short sentences are items of their own: First question. → 第一题。; Second question. → 第二题。; Third question. → 第三题。; Now the batch. → 再看 batch。; Now the hook. → 回到开头。; Last mechanism. → 最后一个机制。; Batch by 128. → 按 128 分 batch。; Each GPU gets 16. → 每块 GPU 拿到 16 个。; Where are the curves? → 曲线去哪了？; One run, six entries. → 一个 run，六条记录。 Run `python -m explainer.i18n check videos/ac215-l13-exam --lang zh` until it prints OK.'
- '[D2] No say:, no anchors. There is no Chinese voice: never write say: and never write anchors:. The subtitles are timed by the English audio; the toolkit pairs each Chinese sentence with its English one by position (S08''s vo.wait_until("Rule one") anchors are English-only).'
- '[D3] A checker-clean display line. With no say:, every displayed sentence must pass explainer.i18n.spoken_problems: no brackets (B2), no maths symbols (B3), no letter_letter names (A6), no ! after a digit, no clause ending in 种 followed by ，。！？, a half-width space between Hanzi and Latin letters or digits (B1), each sentence ending in 。！？ or …… (optionally followed by ” or 」), and every Latin word listed in this glossary (zh_subtitle, first_use or allowed_spoken_latin). The checker cuts words with [A-Za-z][A-Za-z''.-]* and ignores one-letter words: W&B is W and B (ignored), T4 is T (ignored), python -m is python and m, n1-standard-32 is n and standard-, wandb.run.finish, trainer.task, dataset.batch, strategy.scope, scikit-learn, all-reduce and custom-jobs stay whole. A Latin word it reports is either an English word to translate (usually) or a missing artifact: add the artifact, cut the same way, to allowed_spoken_latin and to its term. Plurals are left out on purpose (no runs, callbacks as a noun, epochs, GPUs, workers as a noun): a plural it reports is an English inflection to drop (两个 run, 两个 epoch, 四块 GPU, 所有 worker); the only plural artifacts are fit''s argument callbacks and the name num workers.'
- '[D4] The English line (en_display). The bilingual band shows the SAY sentence, and the SAY spells artifacts out as words for the voice. Every such sentence gets an en_display item with the literal on-screen form, the rest word for word as the SAY; the other sentences of the block are null. Spoken form → literal (script.md''s header list plus this glossary''s additions): wandb dot init → wandb.init; wandb dot run → wandb.run; wandb dot run dot finish → wandb.run.finish(); wandb dot log → wandb.log; Wandb Metrics Logger → WandbMetricsLogger; Wandb Callback → WandbCallback; setup dot py → setup.py; task dot py → task.py; augment dot py → augment.py; install requires → install_requires; find packages → find_packages(); python dash m trainer dot task → python -m trainer.task; trainer dot task → trainer.task; Module Not Found Error → ModuleNotFoundError; One Device Strategy → OneDeviceStrategy; Mirrored Strategy → MirroredStrategy; Multi Worker Mirrored Strategy → MultiWorkerMirroredStrategy; TF config → TF_CONFIG; num replicas in sync → num_replicas_in_sync; num workers → num_workers; strategy dot scope → strategy.scope(); dataset dot batch → dataset.batch; gcloud AI custom jobs create → gcloud ai custom-jobs create; n1 standard 32 → n1-standard-32; W and B → W&B; Weights and Biases → Weights & Biases. Underscore names (A6) are restored to their literal form only in en_display; the Chinese line keeps the spaced form. The English video''s own .srt is unaffected.'
- '[D5] Content parity. Each Chinese sentence translates its English sentence only: no added commands, flags, glosses, Chinese screen names or explanations; kept-English words get no Chinese explanation (the English line is right below); ponder questions get no answers (A9); takeaways say exactly what the YELLOW line says. The few head words A5 needs (这个, 其中, 而, 调用) carry no content. Python Package Index → PyPI is the same name, not a gloss.'
- '[D6] Fixed phrases. If the question says X, think Y. → 题目说 X，就想：Y。 (every takeaway; S01[4]''s if the question says this, think that → 题目说这个，就想那个). First / Second / Third question. → 第一题。 / 第二题。 / 第三题。 Pause here if you want. → 想停的话，就在这里暂停。 The answer is C: … → 答案是 C：…… A: … → A：…… Hold that thought; we come back to it in a few minutes. → 先记着，过几分钟我们再回来。 Here is … → 这是……; Here is the key fact. → 关键在这里。 Now four experiments. → 现在做四个实验。 First, … / Second: … / Third: … / Fourth: … → 第一个，…… / 第二个：…… / 第三个：…… / 第四个：…… One detail: … → 有个细节：…… One naming trap: … → 还有一个命名陷阱：…… One word on data. → 关于数据，说一句。 The fix: … → 修法：…… Last mechanism. → 最后一个机制。 The right design: … → 正确的设计：…… Rule one: … → 第一条：…… Six rules for Tuesday. → 周二要记住的六条规则。 Good luck on Tuesday. → 祝你周二考试顺利。'
- '[D7] Files. narration/g1.yaml = S01-S08 (one part; 73 blocks, 176 sentences), video.yaml''s single part; the file opens with a comment (coverage; the rules it applies: A6 spaced names, B3 symbols in words, C1 numbers, D4 en_display, D6 fixed phrases, no say: / anchors:) and keeps the script''s order. Double-quoted strings; escape a literal double quote or backslash for YAML.'
- '[D8] Length on the English timing. The Chinese is read while the English plays; the band switches where the English cues switch (a Chinese piece that reads faster than 9 units/s gets at most 1 s more). Each Chinese sentence should read in about the time the English sentence is heard: at most about 2 units per English word (a Hanzi counts 1, a Latin letter 0.55), so drop redundant connectives and repeated subjects, never content. Long artifacts cost length too (MultiWorkerMirroredStrategy 14.9 units, gcloud ai custom-jobs create 14.3, WandbMetricsLogger 9.9, ModuleNotFoundError 10.5): don''t repeat them where the English doesn''t; after the first mention in a block, use a short reference (这个策略, 这条命令, 这个 logger, 这个报错).'
- '[D9] Keep the English clause order (a series lesson, ac215-video skill). The toolkit pairs Chinese and English clause by clause, so a Chinese sentence that puts a condition first when the English puts it last swaps meaning between two neighbouring cues. Conditions, purposes and time adverbials sit where the English has them: the trainer imports them although setup.py never names them → 训练脚本照样能 import 它们，虽然 setup.py 从没写过; Inside the request handler, it dies at the request timeout → 放在请求处理函数里，它会在请求超时的时候死掉; it keeps running on its own machine until it finishes or fails → 它在自己的机器上一直跑，直到完成或失败. The takeaway formula keeps its English order (题目说……，就想……).'
- '[G1] Width. Bilingual band: Chinese line at most 30 units, English line 96 characters; Chinese-only subtitles (.zh.srt) 22 units a line, 2 lines a cue. Write clauses of at most about 24 units separated by ，；： so the splitter has clean cut points; avoid an unpunctuated clause over 30 units (MultiWorkerMirroredStrategy and gcloud ai custom-jobs create get a clause of their own).'
- '[G2] Cue endings: the toolkit strips a cue''s final 。，、；： and keeps ？！…… and a closing ” (subtitles.strip_end). Prefer a Chinese word over ''artifact + full stop'' at the end of a sentence where it reads as well (……放进 trainer 目录。 reads steadier than ……放进 trainer。; both are valid).'
- '[G3] Never split a command or a long class name. The splitter treats a space between two Latin words in a Chinese line as a good cut point, so python -m trainer.task or gcloud ai custom-jobs create could land on two lines. Put the whole command at the end of a clause, after a full-width colon (然后 Vertex 运行：python -m trainer.task。; 就是一条命令：gcloud ai custom-jobs create，……), at most one command per cue, with little Chinese around it. Check every cue with a command in the rendered .zh.srt.'
- '[H1] Titles (meta.yaml). Video and chapter titles use the written register (A4: 运行, 回调, 镜像, 批次, 训练任务); questions keep their question mark; the English colon structure is kept; class names, function names and file names stay as they are (meta.yaml is not read by the checker, so brackets are fine there). Core-concept chapters carry their English short name for search where the Chinese is not the usual search word (运行（run）, 回调（callback）, 全局批次（global batch）), as L1, L3, L5-L8 do. Advanced Training Workflows → 进阶训练工作流; exam edition → 考前版 (as 跟练 = follow-along). The metaphors keep their picture (the run with no curves → 没有曲线的运行; training that outlives the request → 比请求活得更久的训练; six rules for Tuesday → 周二要记住的六条规则).'
- '[H2] Description (Bilibili / YouTube): two or three sentences, written register, this glossary''s terms: AC215 lecture 13''s exam edition, for the night before Quiz 4; what it teaches (W&B runs, init / finish and the callback that writes one history entry per epoch into the active run; packaging for a Vertex AI custom job and why ModuleNotFoundError appears although every dependency installed; MirroredStrategy vs MultiWorkerMirroredStrategy and TF_CONFIG; global vs per-replica batch; submitting long training as a durable job; one aside on data versions); that every mechanism is an animated diagram with code from dlops-io/model-training as evidence and three quiz-style questions; English narration with Chinese and bilingual subtitles. No person''s name.'
- '[H3] Companions: i18n/zh/README.md (if made) is translated with this glossary in the written register (A4). Close with a term table: English | the word used here | other common renderings (run: run / 运行; callback: callback / 回调; active run: 活跃的 run / 当前运行; experiment tracking: 实验追踪 / 实验跟踪; replica: 副本; global batch: 全局 batch / 全局批次; all-reduce: all-reduce / 全归约; shard: 分片; custom job: 自定义任务 / 自定义作业; serverless: 无服务器; poll: 轮询; import path: 导入路径 / 模块搜索路径).'
- '[H4] Code and commands in the companions stay byte for byte: code blocks, commands, file names and inline `code` are unchanged; only # comments and the surrounding prose are translated.'
- '[I1] (Request, open since L3) `explainer.i18n check` applies its spoken-text hygiene (_SPOKEN_BAD: brackets, maths symbols, letter_letter names) to the display line when a sentence has no say:. For a subtitles-only video (voice: none here) those checks protect nothing and force A6 and B3 (here: install_requires, find_packages(), __init__.py, num_replicas_in_sync, num_workers, TF_CONFIG, strategy.scope(), ×). Proposal: when the glossary''s voice is none, skip _SPOKEN_BAD for display-only sentences (keep the Latin-word, spacing and sentence-end checks).'
- '[I2] (To do, from L1 I3) `_cuts` in explainer/subtitles.py treats a space between Latin words in a Chinese line as a good cut point, so a command can be split (G3). Proposal: in a Chinese line, treat a run of Latin words separated only by spaces as unbreakable unless it alone exceeds a line.'
- '[I3] (Note) explainer/subtitles.py reads every video''s glossary.yaml: the 2-3 word English alternatives of each term''s en field are kept on one English line, and the 2-7 character Chinese headwords of zh_subtitle are registered in jieba, in every video''s subtitles. The en and zh_subtitle fields of this file therefore list real terms only (no sentences).'
terms:
# ---------------------------------------------------------------- The hook: a run with no curves
- en: 'training run / run / the run exists / a run that finished without a single error'
  zh_subtitle: 'run / 训练 run'
  first_use: 'S01[0]：这是一个训练 run，跑完了，一个报错都没有。'
  note: 'A1 c, new: run (the noun: a W&B run, one row of the ledger) stays English, because 运行 collides with the verb (A7): 一个 run, 这个 run, 新的 run, 两个 run, 活跃的 run, run 的记录. The verb run → 跑 / 运行 (跑完, 运行 python -m trainer.task). Written register 运行（run）(A4).'
- en: 'Weights and Biases / W and B / W&B / wandb / the wandb SDK'
  zh_subtitle: 'Weights & Biases / W&B / wandb'
  first_use: 'S01[0]：任务成功了，这个 run 也在 Weights & Biases 里。'
  note: 'First use Weights & Biases, then W&B (the SAY''s W and B; en_display W&B, D4). wandb is the package and SDK as on screen. W&B may open a sentence.'
- en: 'config / its config / system charts / CPU and memory'
  zh_subtitle: 'config / 系统图表 / 内存'
  first_use: 'S01[0]：它的 config 在，系统图表也在。'
  note: 'config (a run''s config, wandb.config) stays (A1 c); config value → config 值. memory in the system charts is CPU memory → 内存 (A7). Written register 配置（config）.'
- en: 'loss chart / accuracy chart / curves / Where are the curves?'
  zh_subtitle: 'loss 图 / 准确率 / 曲线'
  first_use: 'S01[1]：但是没有 loss 图，也没有准确率图。'
  note: 'loss stays (L08); accuracy → 准确率; chart → 图; curves → 曲线 (Where are the curves? → 曲线去哪了？). Hold that thought; we come back to it in a few minutes → 先记着，过几分钟我们再回来 (D6).'
- en: 'the gray tag / the lecture slides / the lecture''s roadmap / experiment tracking / baseline models / data collection'
  zh_subtitle: '灰色标签 / 课件 / 路线图 / 实验追踪 / 基线模型 / 数据收集'
  first_use: 'S01[2]：角落里的灰色标签，标出每个想法背后的课件。'
  note: 'A10: the lecture → 课上; the slides → 课件; the roadmap → 课上的路线图 (S01[2]: 在课上的路线图里，实验追踪很早就搭好，和基线模型一起，紧跟在数据收集之后). baseline → 基线 (L07).'
- en: 'exam edition / training workflow / quietly breaks / five places'
  zh_subtitle: '考前版 / 训练工作流 / 悄悄出错'
  first_use: 'S01[3]：这是第 13 讲的考前版。'
  note: 'exam edition → 考前版 (as follow-along → 跟练). The five places: run 的记录、包、GPU、batch，还有任务本身.'
- en: 'rule / if the question says this, think that / quiz-style question / pick an answer / wrong option'
  zh_subtitle: '规则 / 题目 / 小测 / 选项 / 错误选项'
  first_use: 'S01[4]：每一部分都以一条规则收尾：题目说这个，就想那个。'
  note: 'D6: the takeaway formula 题目说 X，就想：Y. quiz-style question → 小测风格的题; wrong option → 错误选项 (hear why each wrong option is wrong → 听听每个错误选项错在哪).'
- en: 'reproducibility / accountability / what produced this result / can I repeat it'
  zh_subtitle: '可复现 / 可追责'
  first_use: 'S01[5]：题目说实验追踪，就想：这个结果是怎么来的，我能不能重复出来？'
  note: 'The slide words Reproducibility / Accountability are on screen in English (A11) and not said. The lecture names the reason to track at all → 课上讲了为什么要追踪.'
# ---------------------------------------------------------------- What a run records
- en: 'environment / code / data / model / metrics / artifacts / notes'
  zh_subtitle: '环境 / 代码 / 数据 / 模型 / 指标 / 产物 / 笔记'
  first_use: 'S02[0]：课上列了七样：环境、代码、数据、模型、指标、产物，还有你的笔记。'
  note: 'artifacts → 产物; notes → 笔记 (≠ 笔记本, the laptop, A7). What should a run record hold? → 一个 run 的记录该存些什么？'
- en: 'GitHub / a versioning system / the pyproject file / the lock file / weights, metrics and logs'
  zh_subtitle: 'GitHub / 版本管理系统 / pyproject 文件 / lock 文件 / 权重 / 日志'
  first_use: 'S02[1]：代码在 GitHub，数据在版本管理系统里，环境在 pyproject 文件和 lock 文件里。'
  note: 'lock 文件 (L01); weights → 权重 (L05). get a question mark → 打了个问号.'
- en: 'data version / archived snapshot / version record / content hash / a fixed release of the data'
  zh_subtitle: '数据版本 / 快照 / 版本记录 / 内容哈希 / 固定版本'
  first_use: 'S02[2]：数据版本是一对东西：bucket 里归档的快照，加上给它命名的版本记录，两者靠内容哈希连起来。'
  note: 'The one-beat aside (Q1''s concept, never its wording). bucket stays (series). This trainer instead downloads a fixed release of the data → 这个训练脚本下载的是一个固定版本的数据; never writes it into the config → 也从不写进 config. Rule six (S08[5]) uses the same words: 归档的快照，加上指向它的记录.'
- en: 'ledger / a ledger in which every training run is one row / row / recording by hand'
  zh_subtitle: '账本 / 一行'
  first_use: 'S02[3]：想象一个账本，每个训练 run 是其中一行。'
  note: 'V1''s metaphor: ledger → 账本, row → 一行 / 这一行 / 第一行 / 第二行. Recording by hand gets forgotten → 手动记录总会忘.'
- en: 'the repo trainer / task.py / four calls / logs in / key / passed as a flag'
  zh_subtitle: '训练脚本 / task.py / 登录 / 密钥 / 命令行参数'
  first_use: 'S02[4]：repo 里的训练脚本 task.py，用四个调用和这个账本打交道。'
  note: 'key → 密钥 (L01); flag → 命令行参数; never written in the code → 从不写在代码里. No key value ever (A10).'
- en: 'wandb.init / init / opens a new row / project / name / a new init'
  zh_subtitle: 'wandb.init / init / 项目 / 名字'
  first_use: 'S02[5]：调用 wandb.init 会开一个新行，带上项目、名字和 config：学习率、epoch 数、batch 大小和模型名。'
  note: 'init / finish / log are the calls as the SAY says them (A1 a): 新的 init, 再 init 一次, 在 init 之后创建. en_display wandb dot init → wandb.init (D4). The four config keys are said in words and translated (学习率、epoch 数、batch 大小和模型名); the screen shows learning_rate, epochs, batch_size, model_name.'
- en: 'active run / the pointer called wandb.run / points at it / follows the pointer'
  zh_subtitle: '活跃的 run / 指针 / wandb.run'
  first_use: 'S02[5]：它还把这一行设成活跃的 run，叫 wandb.run 的指针现在就指向它。'
  note: 'The quiz term: active run → 活跃的 run, always the same (never 当前运行 or 激活的 run). whichever row is active right now → 不管此刻哪一行是活跃的.'
- en: 'wandb.run.finish / finish / seals the row / sealed / falls back to nothing / None / execution time'
  zh_subtitle: 'wandb.run.finish / finish / 封存 / None / 执行时间'
