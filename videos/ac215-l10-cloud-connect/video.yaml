# Bilibili metadata for the release (tools/release_episode.py → PUBLISH.json → the Mac publish worker)
publish:
  title_zh: "AC215 第10讲跟练 · 连接云端：Service Account 认证、Docker 网络与 CORS"
  description_zh: |
    哈佛 AC215（MLOps & LLMOps，2026 秋）第 10 讲教程的逐条命令跟练：照着 dlops-io/cheese-app-v0 的 README，
    创建 Service Account 和 JSON 密钥，理解 secrets 文件夹约定和 bind mount（宿主机路径 vs 容器路径的两个世界），
    看 ADC 如何按三个位置找到密钥、把它换成一小时有效的 bearer token，用 principal × role × resource 的 IAM 格子读懂每一个 403；
    在 Docker 里跑起 ChromaDB + FastAPI + Next.js 三个容器（包括 api-service 脚本在已有网络上中断的真实坑和修法），
    分清容器名 DNS 和 localhost、`-p 3200:3000` 的两个端口号，跟着浏览器亲自发出的三个跨域请求看 CORS 白名单怎样放行和拦截，
    最后验证 docker compose down 之后向量数据为什么还在，以及 GCS 作为它的云端版本。
    边看边暂停，在自己的电脑上跑每一条命令；本讲的 Vertex AI 调用会产生实际费用，视频用金色标签标出每个计费点，结尾有完整收尾清单。
    英文旁白，中英双语字幕。

    教程仓库：https://github.com/dlops-io/cheese-app-v0
    学习笔记（全部命令、真实输出和练习答案）：https://github.com/JunyiZhou-Conny/MLOps_Learning/blob/main/guides/L10-cloud-connect-cheese-app-v0.md

    课程与教程内容来自 Harvard AC215 课程组（Pavlos Protopapas 等）；本视频是个人学习用的非官方讲解，引用课件只注明页码，不展示课件。
  tags_zh: [AC215, MLOps, 云计算, 认证, Service Account, Docker网络, CORS, RAG, 哈佛, 教程跟练]
  tid: 231
