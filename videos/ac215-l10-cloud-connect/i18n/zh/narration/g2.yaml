# zh narration for S10-S15 (part 2, group g2: addresses and Docker DNS, the frontend and its ports, the browser
# and CORS, the agent and the tuned model, what survives, teardown and recap), sentence-aligned to script.md: one
# zh sentence per English sentence (explainer.voice.split_sentences). Terms and rules: ../GLOSSARY.md,
# ../glossary.yaml.
# Subtitles only: there is no Chinese voice in this series, so no say: and no anchors (rule D2); the zh line is
# shown on the English timing, so each sentence keeps the English order of ideas (A8, D8): condition and time
# clauses stay where the English puts them (filtered by author, 前提是 Gemini 选了那个工具; unless you add a
# prefix -> 除非你加一个前缀, last).
# Artifacts the checker does not allow in a displayed line are described in words (rule A6); commands sit after a
# full-width colon at the end of a clause (G3: 用一条额外的命令：docker network connect; 然后运行：npm run dev).
# The instructor's name is never written (A10): the instructor's project -> 授课老师的项目; Step 5 -> 第 5 步是微调过的
# 奶酪模型. The ponders (S10, S12, S14) ask without answering (A9).
# en_display: the English subtitle line where the SAY spells an artifact as words (rule D4: llm-rag-chromadb:8000,
# localhost:8000 / 9000 / 3000 / 3200, localhost:9000/docs, Local: http://localhost:3000, -p 3200:3000,
# Ctrl-C, localhost:3200/finetunechat, us location, --rm, /data, docker-volumes, /secrets); null = the SAY text.
S10:
- en: "Part 2 starts with addresses; every command in this scene is an extra. The loader dials the database by name: llm-rag-chromadb, port 8000. Your browser will ring localhost 8000, through a door in the laptop wall. One server, two addresses. Why can they not swap?"
  zh:
  - "第二部分从地址讲起；这一段的每条命令都是额外的。"
  - "加载器按名字拨数据库：llm-rag-chromadb:8000。"
  - "你的浏览器会打给 localhost:8000，穿过笔记本墙上的一扇门。"
  - "一个服务器，两个地址。"
  - "为什么它们不能互换？"
  en_display:
  - null
  - "The loader dials the database by name: llm-rag-chromadb:8000."
  - "Your browser will ring localhost:8000, through a door in the laptop wall."
  - null
  - null
- en: "Each container is its own house, with its own localhost. Inside a container, localhost means that container. Names work through Docker DNS, a phone book on each street. IP addresses change when containers restart, but names do not. This extra inspect shows the API's IP address on its street. Yours will differ, which is the point: dial names, not IP addresses. And your laptop is not on any street, so it has no phone book: that name means nothing to your browser."
  zh:
  - "每个 container 都是自己的一栋房子，有自己的 localhost。"
  - "在 container 里面，localhost 指的就是这个 container。"
  - "名字靠的是 Docker DNS，也就是每条街上的一本电话簿。"
  - "IP 地址在 container 重启时会变，名字却不会。"
  - "这次额外的 inspect 显示了 API 在它那条街上的 IP 地址。"
  - "你的会不一样，这正是重点：拨名字，不要拨 IP 地址。"
  - "而你的笔记本不在任何一条街上，所以它没有电话簿：这个名字对你的浏览器毫无意义。"
- en: "Now the proof. From inside the API container, ask for the database by name. The answer: name or service not known. The API's street has no entry for that name."
  zh:
  - "现在来证明。"
  - "从 API container 里面，按名字问数据库。"
  - "回答是：Name or service not known。"
  - "API 那条街的电话簿里，没有这个名字的条目。"
  en_display:
  - null
  - null
  - "The answer: Name or service not known."
  - null
- en: "Something to ponder. Suppose you want the API itself to query the database. What address would it use, and what must change on the map for that name to resolve?"
  zh:
  - "来想一个问题。"
  - "假设你想让 API 自己去查询数据库。"
  - "它会用什么地址，地图上又要改什么，这个名字才能解析？"
- en: "Put the database on the API's street as well, with an extra docker network connect, and the same name answers with Chroma's version. Docker DNS works on a shared street. And localhost 8000, from inside the API? Connection refused. Inside the API, nothing listens on 8000."
  zh:
  - "把数据库也放到 API 那条街上，用一条额外的命令：docker network connect，同一个名字就会答出 Chroma 的版本。"
  - "Docker DNS 在共用的街道上就管用。"
  - "那在 API 里面访问 localhost:8000 呢？"
  - "Connection refused。"
  - "在 API 里面，8000 上没有任何东西在监听。"
  en_display:
  - null
  - null
  - "And localhost:8000, from inside the API?"
  - null
  - null
- en: "Then disconnect it: that was only an experiment. Nothing in this app needs that shortcut, because the browser makes every call. One small slip: the frontend's config still forwards its docs path to a container name that does not exist here. For the API docs, use localhost 9000 slash docs, as the README says."
  zh:
  - "然后把它断开：刚才只是个实验。"
  - "这个应用里没有任何东西需要这条捷径，因为每个调用都是浏览器发的。"
  - "有一个小疏漏：前端的配置还在把 docs 路径转发给一个这里并不存在的 container 名。"
  - "API 文档请用 localhost:9000/docs，照 README 说的。"
  en_display:
  - null
  - null
  - null
  - "For the API docs, use localhost:9000/docs, as the README says."
S11:
- en: "Leave the API running, and open a new terminal in the frontend folder. Run its shell script; pause and do it. The image holds just Node and a shell, so you run npm yourself; the hash sign means you are root."
  zh:
  - "让 API 继续跑着，在前端目录里打开一个新终端。"
  - "运行它的 shell 脚本；暂停一下，照着做。"
  - "这个 image 只有 Node 和一个 shell，所以 npm 要你自己跑；井号表示你是 root。"
- en: "Then npm install: 773 packages at the time of recording, plus deprecation warnings. They land in your folder through the mount, so our capture could step out and back in without losing them. Then npm run dev. The Next.js server says ready, version 14.2.4 at the time of recording, and prints the line that fools everyone: local, localhost 3000. Pause and run both."
  zh:
  - "接着是 npm install：录制时装了 773 个包，外加一些弃用警告。"
  - "它们通过挂载落到你的目录里，所以我们录制时可以退出再进来，也不会丢。"
  - "然后运行：npm run dev。"
  - "Next.js 服务器显示 Ready，录制时版本是 14.2.4，还打印出那行谁都会上当的：Local: http://localhost:3000。"
  - "暂停一下，两条都跑一遍。"
  en_display:
  - null
  - null
  - null
  - "The Next.js server says ready, version 14.2.4 at the time of recording, and prints the line that fools everyone: Local: http://localhost:3000."
  - null
- en: "In a second terminal, three extra checks. First, predict: will localhost 3000 answer from your laptop? No, it fails to connect. From your laptop, localhost 3200 answers with the RAG app. And from inside the container, localhost 3000 answers with the same page. Now open localhost 3200 in your browser; the README suggests Chrome. Pause and look."
  zh:
  - "在第二个终端里，做三个额外检查。"
  - "先预测一下：在你的笔记本上，localhost:3000 会有回应吗？"
  - "不会，连不上。"
  - "从你的笔记本访问 localhost:3200，回应的是 RAG 应用。"
  - "而在 container 里面，localhost:3000 回应的是同一个页面。"
  - "现在在浏览器里打开 localhost:3200；README 建议用 Chrome。"
  - "暂停一下，看一看。"
  en_display:
  - null
  - "First, predict: will localhost:3000 answer from your laptop?"
  - null
  - "From your laptop, localhost:3200 answers with the RAG app."
  - "And from inside the container, localhost:3000 answers with the same page."
  - "Now open localhost:3200 in your browser; the README suggests Chrome."
  - null
- en: "That is the tunnel. The flag dash p, 3200 colon 3000, means host port 3200 forwards to container port 3000. The Next server listens on 3000 inside its own house, and your browser knocks on 3200 outside. One server, two addresses. An extra docker ps shows the same door."
  zh:
  - "这就是隧道。"
  - "参数 -p 3200:3000 的意思是：host port 3200 转发到 container port 3000。"
  - "Next.js 服务器在它自己的房子里监听 3000，而你的浏览器在外面敲 3200 的门。"
  - "一个服务器，两个地址。"
  - "额外跑一下 docker ps，能看到同一扇门。"
  en_display:
  - null
  - "The flag -p 3200:3000 means host port 3200 forwards to container port 3000."
  - null
  - null
  - null
- en: "Port numbers come in three bands. The low ones belong to the system, like 80 and 443. Pick yours from the middle band: 3000, 3200, 8000, and 9000. The top band holds throw-away ports for outgoing calls."
  zh:
  - "所有 port 号分成三段。"
  - "低段的属于系统，比如 80 和 443。"
  - "你自己的从中段挑：3000、3200、8000 和 9000。"
  - "高段放的是出站调用用的临时 port。"
- en: "0.0.0.0 has now appeared twice, as two different facts. Inside the container, the tunnel arrives at the street side, not at the loopback, so the API server listens on every side. Docker publishes on every side of your laptop, unless you add a prefix. The ports lecture wrote 127.0.0.1 before its port, but this app writes none. So these doors face your Wi-Fi too, and anyone on that network can knock. Adding 127.0.0.1 before the host port closes that side."
  zh:
  - "0.0.0.0 已经出现两次了，说的是两件不同的事。"
  - "在 container 里面，隧道到达的是临街的一侧，而不是回环接口，所以 API 服务器在每一侧都监听。"
  - "Docker 会在你笔记本的每一侧都发布，除非你加一个前缀。"
  - "讲 port 的那一讲在 port 前面写了 127.0.0.1，这个应用却没写。"
  - "所以这些门也朝着你的 Wi-Fi，同一个网络上的任何人都能来敲门。"
  - "在 host port 前面加上 127.0.0.1，就能关上那一侧。"
S12:
- en: "This setting, baked into the JavaScript your browser downloads, gives the page the API's address. So it must be one your browser can reach: localhost 9000, never a container name."
  zh:
  - "这个配置被打包进浏览器下载的 JavaScript 里，告诉页面 API 的地址。"
  - "所以它必须是你的浏览器能访问到的地址：localhost:9000，绝不能是 container 名。"
  en_display:
  - null
  - "So it must be one your browser can reach: localhost:9000, never a container name."
- en: "Step 1 of 5, text chunking, runs in your browser, with no bill. Step 2, the database UI, connects to localhost 8000. Pause and try both. Our extra listing is empty; yours shows two collections."
  zh:
  - "5 步里的第 1 步是文本分块，在你的浏览器里跑，不产生费用。"
  - "第 2 步是数据库界面，连到 localhost:8000。"
  - "暂停一下，两个都试试。"
  - "我们额外列出来的是空的；你的会显示两个 collection。"
  en_display:
  - null
  - "Step 2, the database UI, connects to localhost:8000."
  - null
  - null
- en: "Step 3, the chat, has a gold tag: one embedding and one Gemini answer per question. Pause, pick a collection, and ask one. On your machine, it makes three calls. Call one: the API asks Google, and 256 numbers come back."
  zh:
  - "第 3 步是对话，带一个金色标签：每个问题一次 embedding，加一次 Gemini 回答。"
  - "暂停一下，选一个 collection，问一个问题。"
  - "在你的机器上，它会发起三次调用。"
  - "第一个调用：API 去问 Google，拿回 256 个数。"
- en: "Call two asks the database for the 10 nearest chunks. An origin is scheme, host and port, so a page from 3200 calling 8000 crosses origins."
  zh:
  - "第二个调用向数据库要 10 个最近的 chunk。"
  - "一个 origin 由协议、主机和 port 组成，所以来自 3200 的页面去调 8000，就是跨域。"
- en: "By default, a browser will not let a page see replies from another origin. A server can allow named origins; that is CORS, and it keeps other websites from reading your local services. So the browser first sends a preflight with the page's origin. The database checks its guest list, the course's site and localhost 3200, and returns a pass, or nothing. Your browser is the bouncer: no pass, no query."
  zh:
  - "默认情况下，浏览器不让页面看到来自别的 origin 的回复。"
  - "服务器可以放行指定的 origin，这就是 CORS，它能防止别的网站读取你本地的服务。"
  - "所以浏览器先发一个预检请求，带上页面的 origin。"
  - "数据库查它的白名单，上面是课程的网站和 localhost:3200，然后返回一张通行证，或者什么都不给。"
  - "你的浏览器就是保安：没有通行证，就没有查询。"
  en_display:
  - null
  - null
  - null
  - "The database checks its guest list, the course's site and localhost:3200, and returns a pass, or nothing."
  - null
- en: "Call three sends the question and ten chunks to the API, and the answer returns. An extra curl writes its own Origin header. Both preflights get 200 OK, but only 3200 gets a pass; to a browser, no pass is a refusal."
  zh:
  - "第三个调用把问题和 10 个 chunk 发给 API，回答随后返回。"
  - "额外用 curl 自己写一个 Origin 请求头。"
  - "两个预检请求都拿到 200 OK，但只有 3200 拿到了通行证；对浏览器来说，没有通行证就是拒绝。"
- en: "Something to ponder. You republish the frontend on port 3300. Which of the three calls fails, and does curl care?"
  zh:
  - "来想一个问题。"
  - "你把前端重新发布到 port 3300。"
  - "三个调用里哪一个会失败，curl 又在不在乎？"
- en: "Call one works: the API allows any origin. Call two never leaves the browser. Call three waits for it, so it is never sent. And curl ignores it all. CORS is enforced by the browser, configured by the server, and keyed on the page's origin. Even 127.0.0.1, port 3200, is a different origin from localhost 3200, so open the app at localhost."
  zh:
  - "第一个调用能成功：API 允许任何 origin。"
  - "第二个调用根本出不了浏览器。"
  - "第三个调用在等它，所以永远不会发出去。"
  - "而 curl 对这一切都不理会。"
  - "CORS 由浏览器执行，由服务器配置，按页面的 origin 来判断。"
  - "就连 127.0.0.1:3200 和 localhost:3200 也是不同的 origin，所以要用 localhost 打开这个应用。"
  en_display:
  - null
  - null
  - null
  - null
  - null
  - "Even 127.0.0.1:3200 is a different origin from localhost:3200, so open the app at localhost."
- en: "Look for an answer and ten references, with book, author and distance. Last thought: CORS decides which page may see a reply; nothing here decides who may call. An unprotected AI endpoint, spending your key, is running on your laptop."
  zh:
  - "要看的是一个回答和 10 条参考来源，带着书名、作者和距离。"
  - "最后想一点：CORS 决定的是哪个页面能看到回复；这里没有任何东西决定谁能调用。"
  - "一个没有任何保护、用你的密钥花钱的 AI endpoint，正跑在你的笔记本上。"
S13:
- en: "Step 4 is the cheese expert agent: the chat's three calls, with one twist. Gemini first picks a retrieval tool: search by author, or search by content. The API turns the search text into an embedding. Then your browser queries the database, filtered by author if Gemini chose that tool. The API loops up to five times, and Gemini may call a fun fact tool on the server. A gold tag: one agent question costs one embedding and three to seven generation calls. Pause, pick a collection, and ask it something."
  zh:
  - "第 4 步是奶酪专家 agent：还是对话的三个调用，只多了一个变化。"
  - "Gemini 先挑一个检索工具：按作者搜索，或者按内容搜索。"
  - "API 把搜索文本变成一个 embedding。"
  - "然后你的浏览器查询数据库，按作者过滤，前提是 Gemini 选了那个工具。"
  - "API 最多循环五次，Gemini 还可能调用服务器上的趣闻工具。"
  - "金色标签：一个 agent 问题要花一次 embedding 调用，外加 3 到 7 次生成调用。"
  - "暂停一下，选一个 collection，随便问它点什么。"
- en: "Look for an answer ending in a highlighted fun fact paragraph."
  zh:
  - "要看的是一个回答，结尾有一段高亮的趣闻。"
- en: "Step 5 is the fine-tuned cheese model. The README says to swap in your own endpoint, the one your fine-tuning run printed in lecture 8. Pause and paste yours. The server reloads by itself, because this file sits under the api folder. Its neighbor, the agent tools file, is not watched; for that one, press control C and start the server again."
  zh:
  - "第 5 步是微调过的奶酪模型。"
  - "README 说要换成你自己的 endpoint，就是你在第 8 讲微调时打印出来的那个。"
  - "暂停一下，贴上你自己的。"
  - "服务器会自己重新加载，因为这个文件在 api 目录下面。"
  - "它旁边的 agent 工具文件没有被监视；至于那个文件，要按 Ctrl-C，再把服务器重新启动。"
  en_display:
  - null
  - null
  - null
  - null
  - "Its neighbor, the agent tools file, is not watched; for that one, press Ctrl-C and start the server again."
- en: "Then open localhost 3200 slash finetunechat and ask the same question. Here the part 1 puzzle gets its answer. With the default, the endpoint path points into the instructor's project, where your account has no role, so expect a 403, or a not-found error. This call also uses a second client, in the U S location, because tuned models need it. A final gold tag: calls to a tuned model are billed to whichever project owns the endpoint. Pause and try it; without your own endpoint, expect a 403, or a not-found error. If your own endpoint returns 404 instead, see the base URL note in the study guide."
  zh:
  - "然后打开 localhost:3200/finetunechat，问同一个问题。"
  - "第一部分的那个谜题，在这里揭晓答案。"
  - "用默认值的话，endpoint 路径指向授课老师的项目，你的账号在那里没有角色，所以预计会是 403，或者“找不到”的错误。"
  - "这个调用还用了第二个客户端，位于 us 区域，因为微调过的模型需要它。"
  - "最后一个金色标签：调用微调过的模型，费用记在拥有这个 endpoint 的项目上。"
  - "暂停一下，试一试；没有你自己的 endpoint 的话，预计会是 403，或者“找不到”的错误。"
  - "要是你自己的 endpoint 返回 404，请看学习指南里关于基础地址的说明。"
  en_display:
  - "Then open localhost:3200/finetunechat and ask the same question."
  - null
  - null
  - "This call also uses a second client, in the us location, because tuned models need it."
  - null
  - null
  - null
S14:
- en: "Time to shut down, and see what survives. In the API and frontend terminals, press control C, then type exit. Pause and do it. Both containers ran with dash dash rm, so an extra docker ps shows only the database left."
  zh:
  - "该关掉了，看看什么能留下来。"
  - "在 API 和前端的终端里，按 Ctrl-C，然后输入 exit。"
  - "暂停一下，照着做。"
  - "两个 container 都是用 --rm 跑的，所以额外跑一下 docker ps，只剩下数据库。"
  en_display:
  - null
  - "In the API and frontend terminals, press Ctrl-C, then type exit."
  - null
  - "Both containers ran with --rm, so an extra docker ps shows only the database left."
- en: "Now the README's stop command, docker compose down, inside llm-rag. Pause and run it. The database and its network are removed. Two warnings say variables are not set, because we ran this outside the shell script, and Compose fills those blanks from your shell. That is the mechanism from part 1, caught in the wild. Something to ponder: the database is gone, but are your embeddings gone too? And what would make them gone?"
  zh:
  - "现在是 README 的停止命令 docker compose down，在 llm-rag 里运行。"
  - "暂停一下，自己跑一遍。"
  - "数据库和它的网络都被删掉了。"
  - "两条警告说变量没有设置，因为我们是在 shell 脚本之外跑的这条命令，Compose 就用你 shell 里的值来填这些空。"
  - "这就是第一部分讲的那个机制，这次在现实里撞上了。"
  - "来想一个问题：数据库没了，可你的 embedding 也没了吗？"
  - "那什么才会让它们消失？"
- en: "No. An extra listing shows the database file still on disk, in a folder on your laptop, mounted into the container at slash data. Containers come and go; mounted folders stay. An extra restart brings the database back over that same folder. Deleting the docker volumes folder is what loses your embeddings. A fresh load rebuilds cleanly, because the loader deletes and then recreates each collection."
  zh:
  - "不会。"
  - "额外列一下目录，可以看到数据库文件还在磁盘上，在你笔记本上的一个目录里，挂载到 container 里的 /data。"
  - "一个个 container 来来去去，挂载的目录却留下来。"
  - "额外重启一次，数据库就在同一个目录上重新回来了。"
  - "删掉 docker-volumes 目录，才会丢掉你的 embedding。"
  - "重新加载一次也能干净地重建，因为加载器会先删掉、再重新创建每个 collection。"
  en_display:
  - null
  - "An extra listing shows the database file still on disk, in a folder on your laptop, mounted into the container at /data."
  - null
  - null
  - "Deleting the docker-volumes folder is what loses your embeddings."
  - null
- en: "The cloud version of a mounted folder is a storage bucket, a folder any authorized machine can see. Its folders are only name prefixes. The storage client takes no key path, so ADC finds the same key, and a storage role allows it to write to the bucket."
  zh:
  - "挂载目录的云端版本就是 bucket，一个任何有权限的机器都能看到的目录。"
  - "它的目录其实只是名字前缀。"
  - "存储客户端没有传入密钥路径，所以 ADC 会找到同一个密钥，再由一个存储角色允许它往 bucket 里写。"
- en: "This app never calls a bucket, which is why Storage Admin sat gray; next lecture uses one. The lecture gives four rules. Grant object admin, not full admin. Keep buckets private. Prefix their globally unique names. And delete what you no longer need, because storage and downloads cost money."
  zh:
  - "这个应用从不调用 bucket，所以 Storage Admin 一直是灰的；下节课会用到一个。"
  - "课上给了四条规则。"
  - "只授予对象管理员角色，不要给完整的管理员角色。"
  - "让 bucket 保持私有。"
  - "给它们全球唯一的名字加上前缀。"
  - "还有，不再需要的就删掉，因为存储和下载都要花钱。"
S15:
- en: "If you tried the restart, run docker compose down once more. An extra command removes the shared network. Pause, and leave your machine clean."
  zh:
  - "如果你试过重启，就再跑一次：docker compose down。"
  - "额外跑一条命令，删掉共用的网络。"
  - "暂停一下，把你的机器收拾干净。"
- en: "This lecture started nothing in the cloud. What stays behind is the key, and a leaked key can spend your money. Delete keys you no longer use, and their local files. If one reaches GitHub, delete it in IAM at once; last lecture's private key hook would catch it first, once added to your repo."
  zh:
  - "这一讲在云上什么都没启动。"
  - "留下来的是密钥，而泄露的密钥会花掉你的钱。"
  - "不再用的密钥要删掉，连同它们的本地文件。"
  - "如果有密钥被推到了 GitHub，马上在 IAM 里删掉它；上节课那个检测私钥的 hook 会先拦住它，前提是你把它加进了自己的 repo。"
- en: "The whole lecture, on one map. Your code's badge and key buy a one-hour ticket at Google's token desk. One IAM cell lets that badge call Gemini. A mount carries the key to slash secrets. Containers dial names; your browser dials localhost, through doors like 3200 to 3000, open to your Wi-Fi too. The browser stitches three calls past the CORS bouncer, and the vectors survive in a mounted folder."
  zh:
  - "整节课，放在一张地图上。"
  - "你代码的工牌和密钥，在 Google 的令牌柜台换来一张一小时有效的票。"
  - "一个 IAM 格子让这个工牌能调用 Gemini。"
  - "一个挂载把密钥送到 /secrets。"
  - "各个 container 拨名字；你的浏览器拨 localhost，穿过 3200 到 3000 这样的门，这些门也对你的 Wi-Fi 敞开。"
  - "浏览器经过 CORS 保安，把三个调用串在一起；向量则留在一个挂载的目录里。"
