  - "A mount carries the key to /secrets."
  - null
  - null
- en: "When something breaks, find its layer. A credentials error: the path or the mount. A 401: no valid token. A 403: role, project, or API. A CORS line: the origin. A taken port: the doors. A dying script: line 14."
  zh:
  - "出了问题，先找它在哪一层。"
  - "凭据错误：路径或者挂载。"
  - "401：没有有效的令牌。"
  - "403：角色、项目，或者 API。"
  - "一行 CORS 报错：origin。"
  - "被占用的 port：门。"
  - "脚本挂了：第 14 行。"
- en: "5 questions to test yourself. One: the three places ADC looks; which does this tutorial fill? Two: why slash secrets, not your Mac? Three: why can the loader's name and your browser's localhost not swap? Four: on port 3300, which call breaks first, and why does the API survive? Five: a 403 has three causes; how do you tell them apart?"
  zh:
  - "五道自测题。"
  - "第一题：ADC 找的三个位置；这个教程填的是哪一个？"
  - "第二题：为什么是 /secrets，而不是你的 Mac？"
  - "第三题：加载器的名字和你浏览器的 localhost，为什么不能互换？"
  - "第四题：在 port 3300 上，哪个调用最先出问题，API 又为什么没事？"
  - "第五题：403 有三种原因；你怎么区分它们？"
