# zh narration for S01-S09 (part 1, group g1: service accounts, the key and its mount, the vector database,
# ADC, IAM, the API), sentence-aligned to script.md: one zh sentence per English sentence
# (explainer.voice.split_sentences). Terms and rules: ../GLOSSARY.md, ../glossary.yaml.
# Subtitles only: there is no Chinese voice in this series, so no say: and no anchors (rule D2); the zh line
# is shown on the English timing, so each sentence keeps the English order of ideas (A8, D8): no condition or
# time clause moved to the front where the English puts it last.
# Artifacts the checker does not allow in a displayed line are written as the SAY says them (rule A6):
# GOOGLE_APPLICATION_CREDENTIALS -> Google application credentials 这个变量; GCP_PROJECT -> GCP project 这个变量;
# uvicorn_server -> uvicorn server; x86_64 -> x86.
# The instructor rule (A10): the instructor -> 授课老师, never a name and never the on-screen mask.
# en_display: the English subtitle line where the SAY spells an artifact as words (rule D4: -p 3200:3000,
# localhost:9000, llm-service-account@your-gcp-project.iam.gserviceaccount.com, Sign in with Google, IAM & Admin, -v, /secrets,
# GOOGLE_APPLICATION_CREDENTIALS, llm-service-account.json, .json.json, cheese-app-v0/secrets,
# DefaultCredentialsError, GCP_PROJECT, char-split, recursive-split, char-split-collection, JSON Web Token,
# set -e, uvicorn_server, localhost:9000/docs); null = the SAY text.
S01:
- en: "Here is a cheese chatbot, running on your laptop. You ask it how Tolminc cheese is made. An answer appears, with ten book passages as references."
  zh:
  - "这是一个奶酪聊天机器人，跑在你的笔记本上。"
  - "你问它 Tolminc 奶酪是怎么做的。"
  - "答案出来了，附带 10 段书里的原文作为参考来源。"
- en: "Behind that one answer, your browser makes three calls. Two go to a Python server on port 9000, and one goes to a database on port 8000. Behind both server calls, Google does the heavy lifting. So who checks that it is really you? And how does a web page find a database inside a container?"
  zh:
  - "在这一个回答背后，你的浏览器发起了三次调用。"
  - "其中两次打到 port 9000 上的一个 Python 服务器，一次打到 port 8000 上的一个数据库。"
  - "这两个服务器调用的背后，都是 Google 在干重活。"
  - "那么，谁来确认真的是你？"
  - "还有，网页怎么找到 container 里的数据库？"
- en: "Three small riddles hide in this app. The flag dash p, 3200 colon 3000, has two numbers; why? And localhost 9000: which machine is that? And llm-rag-chromadb is only a name; where is its address? Each one gets its answer today. Then the real question arrives: once anything can knock, who is allowed in?"
  zh:
  - "这个应用里藏着三个小谜题。"
  - "参数 -p 3200:3000 里有两个数字，为什么？"
  - "还有这里的 localhost:9000，指的是哪台机器？"
  - "而 llm-rag-chromadb 只是一个名字，它的地址在哪儿？"
  - "每个谜题今天都会揭晓答案。"
  - "然后真正的问题来了：既然谁都能来敲门，谁才能进来？"
  en_display:
  - null
  - "The flag -p 3200:3000 has two numbers; why?"
  - "And localhost:9000: which machine is that?"
  - null
  - null
  - null
- en: "To follow along you need your clone of cheese-app-v0, Docker Desktop, and a Google Cloud project with billing. This lecture makes real, paid calls to Vertex AI; a gold tag marks each one, and the video ends by shutting everything down. The tracker in the top left follows the README in six stages, from setup to shutdown. A yellow your-turn tag means pause and run it, and a gray extra tag marks a check that is not in the README. Every command is in the study guide, linked below."
  zh:
  - "跟着做需要你 clone 的 cheese-app-v0、Docker Desktop，以及一个开通了结算的 Google Cloud 项目。"
  - "这一讲会真的发起付费的 Vertex AI 调用；每一处都有金色标签标出，视频最后会把一切都关掉。"
  - "左上角的进度条按六个阶段跟着 README 走，从准备一直到关闭。"
  - "看到黄色的 your turn 标签，就暂停，自己跑一遍；灰色的 extra 标签表示这个检查 README 里没有。"
  - "每条命令都在学习指南里，链接在下方。"
S02:
- en: "First, the map, which stays with us all lecture. Your laptop is one house, and every house has its own loopback address, localhost, which always means this machine. Docker lays two private streets inside it, one per network. Three services will stand on them: the vector database with its loader, the API server, and the web frontend. Each house lights up when its container starts."
  zh:
  - "首先是地图，它会陪我们走完这一讲。"
  - "你的笔记本是一栋房子，每栋房子都有自己的回环地址 localhost，它永远指这台机器。"
  - "Docker 在里面铺了两条私有的街道，一个网络一条。"
  - "会有三个服务站在这些街上：向量数据库和它的加载器、API 服务器，还有网页前端。"
  - "每栋房子都会在它的 container 启动时亮起来。"
- en: "Your browser stands on the laptop floor, outside every street. Across the public street sits Google's building, with a guarded door. Now, who calls whom? The loader calls Google and the database. The API calls Google. Your browser calls everything else. And the API never talks to the database; the README says so itself. Part 2 shows why the browser does so much."
  zh:
  - "你的浏览器站在笔记本的地面上，不在任何一条街上。"
  - "公共街道对面是 Google 的大楼，门口有人把守。"
  - "那么，谁打给谁？"
  - "加载器打给 Google 和数据库。"
  - "API 打给 Google。"
  - "你的浏览器打给其余所有服务。"
  - "而 API 从不和数据库说话；README 自己就是这么写的。"
  - "第二部分会讲为什么浏览器要干这么多活。"
- en: "Time to type. The README's prerequisites are short: have Docker installed, and clone this repository. The README gives no address, so here is the repo's address. Pause, and clone it."
  zh:
  - "该动手敲了。"
  - "README 的前置条件很短：装好 Docker，再 clone 这个仓库。"
  - "README 没给地址，所以这里给出 repo 的地址。"
  - "暂停一下，把它 clone 下来。"
- en: "An extra git log shows the commit this video uses, from October 8th, 2026; if yours is newer, details may differ. An extra listing shows llm-rag, api-service, and frontend-ai-chatbot: one folder per house."
  zh:
  - "额外跑一下 git log，可以看到这个视频用的 commit，日期是 2026 年 10 月 8 日；你的要是更新，细节可能不一样。"
  - "再额外列一下目录：llm-rag、api-service 和 frontend-ai-chatbot，一栋房子一个目录。"
- en: "One small gap. The app's own home page animates a hosted version, with a web server on a cloud machine. The files for that setup were deleted from the repo. You are running the local version, and this map draws exactly what you run."
  zh:
  - "有一个小疏漏。"
  - "这个应用自己的主页上，动画演示的是一个托管版本，Web 服务器跑在一台云端机器上。"
  - "那套部署的文件已经从 repo 里删掉了。"
  - "你跑的是本地版本，而这张地图画的正是你跑的东西。"
S03:
- en: "The second prerequisite creates an identity, but not for you. A service account is an identity for software. Its email looks like this badge: llm-service-account, at your project. Code wears it to call Google, with no login screen."
  zh:
  - "第二个前置条件是创建一个身份，但不是给你用的。"
  - "服务账号就是给软件用的身份。"
  - "它的邮箱就像这张工牌：llm-service-account，后面是你的项目。"
  - "代码戴着它去调用 Google，不需要登录界面。"
  en_display:
  - null
  - null
  - "Its email looks like this badge: llm-service-account@your-gcp-project.iam.gserviceaccount.com."
  - null
- en: "A metered public call gets an API key. An app acting for a consenting user gets OAuth, the sign in with Google flow. Our code calls Vertex AI in your own project, so it gets a service account. The rule's last line says code outside Google should use federation. That needs someone to vouch for your code, as GitHub does for code in GitHub Actions. A laptop has nobody, so the course hands you a key file instead."
  zh:
  - "按量计费的公开调用用 API key。"
  - "替一个同意授权的用户办事的应用，用 OAuth，也就是用 Google 账号登录的那套流程。"
  - "我们的代码在你自己的项目里调用 Vertex AI，所以它用服务账号。"
  - "规则最后一行说，Google 之外的代码应该用身份联合。"
  - "这需要有人为你的代码担保，就像 GitHub 为 GitHub Actions 里的代码担保那样。"
  - "笔记本没有人来担保，所以课程改为直接给你一个密钥文件。"
  en_display:
  - null
  - "An app acting for a consenting user gets OAuth, the Sign in with Google flow."
  - null
  - null
  - null
  - null
- en: "Open IAM and Admin, then Service accounts. Create one named llm-service-account. Grant it two roles, bundles of permissions: Storage Admin, and Gemini Enterprise Agent Platform User. The second role was formerly called Vertex AI User; it is the same role underneath. Pause and create yours."
  zh:
  - "打开 IAM & Admin，再进 Service accounts。"
  - "建一个，名字叫 llm-service-account。"
  - "给它授予两个角色，也就是权限的集合：Storage Admin，和 Gemini Enterprise Agent Platform User。"
  - "第二个角色以前叫 Vertex AI User，本质上还是同一个角色。"
  - "暂停一下，建一个你自己的。"
  en_display:
  - "Open IAM & Admin, then Service accounts."
  - null
  - null
  - null
  - null
- en: "Two notes on the slides. The slides' demo account, with one storage role, is next week's. And this app never touches storage; that role rides along from the fine-tuning lecture. Grant both anyway, as the README says. The lecture's rule, least privilege, meaning only the access you need, would grant less; part 2 comes back to it."
  zh:
  - "关于课件，说两点。"
  - "课件里那个只有一个存储角色的演示账号，是下周的。"
  - "而且这个应用从来不碰存储；那个角色是从微调那一讲带过来的。"
  - "不过两个都要授予，照 README 说的做。"
  - "课上的规则是最小权限，意思是只给你需要的权限，照它来会授予得更少；第二部分还会回到这一点。"
- en: "On the account's Keys tab, add a key, choose JSON, and a file downloads. Pause and make yours. Inside are your project, the account's email, a token address, and a private key. That private key is the whole secret. It is one factor, something you have: it works anywhere, with no second step, until deleted or disabled. Treat this file like a password, never like config."
  zh:
  - "在这个账号的 KEYS 标签页添加一个密钥，选 JSON，就会下载一个文件。"
  - "暂停一下，做一个你自己的。"
  - "里面有你的项目、这个账号的邮箱、一个令牌地址，还有一个私钥。"
  - "这个私钥就是全部的秘密。"
  - "它只是单一因素，属于你持有的东西：在哪儿都能用，不需要第二步，直到被删除或停用。"
  - "把这个文件当密码看待，绝不要当配置。"
S04:
- en: "The README says to copy the key into a secrets folder. Which one? The API's script answers on line 8. The path starts where you run it, in api-service. It climbs up twice and lands on the secrets folder, beside the repo, not inside it."
  zh:
  - "README 说把密钥复制到一个 secrets 目录。"
  - "哪一个？"
  - "API 的脚本在第 8 行给出了答案。"
  - "路径从你运行它的地方开始，也就是 api-service。"
  - "它往上爬两级，落在 secrets 目录，就在 repo 旁边，而不是里面。"
- en: "Then a dash v flag mounts that host folder at slash secrets, inside the container. The Google application credentials variable, which tells Google's library where the key is, points to slash secrets, a path inside the container. Two filesystems, one folder, and that variable only makes sense after the mount."
  zh:
  - "接着，一个 -v 参数把这个宿主机目录挂载到 /secrets，在 container 里面。"
  - "Google application credentials 这个变量告诉 Google 的库密钥在哪儿，它指向 /secrets，一个 container 里的路径。"
  - "两个文件系统，一个目录，而这个变量只有在挂载之后才有意义。"
  en_display:
  - "Then a -v flag mounts that host folder at /secrets, inside the container."
  - "The GOOGLE_APPLICATION_CREDENTIALS variable, which tells Google's library where the key is, points to /secrets, a path inside the container."
  - null
- en: "The loader's compose file builds the same portal from its own folder: up two levels, same secrets. The lecture's slide climbs only once, because its repos sit one level shallower. Always count the climbs from where the script sits."
  zh:
  - "加载器的 compose 文件从自己的目录出发，搭了同一个传送门：往上两级，同一个 secrets 目录。"
  - "课件上的那一页只往上爬一级，因为它的 repo 浅一层。"
  - "永远要数清往上爬了几级，从脚本所在的位置数起。"
- en: "Make the folder beside your clone, as an extra, then move the download in and rename it llm-service-account dot json. Check that name: hidden extensions can leave dot json dot json. An extra tree view shows the README's layout. Pause and match it."
  zh:
  - "在你的 clone 旁边建好这个目录，这是额外步骤，然后把下载的文件移进去，改名为 llm-service-account.json。"
  - "检查一下名字：隐藏的扩展名可能让它变成 .json.json。"
  - "额外用 tree 看一下，是 README 里的目录结构。"
  - "暂停一下，把你的也摆成这样。"
  en_display:
  - "Make the folder beside your clone, as an extra, then move the download in and rename it llm-service-account.json."
  - "Check that name: hidden extensions can leave .json.json."
  - null
  - null
- en: "Now a quiet trap: the repo's gitignore has no rule for secrets. Nothing protects a key inside the repo."
  zh:
  - "接下来是一个不显眼的陷阱：这个 repo 的 .gitignore 里没有任何关于 secrets 的规则。"
  - "没有任何东西保护放在 repo 里面的密钥。"
- en: "Something to ponder. Suppose you save the key inside the repo, in cheese-app-v0 slash secrets, and run the API script from api-service. What is in slash secrets, and what happens on the first embedding call?"
  zh:
  - "来想一个问题。"
  - "假设你把密钥存在 repo 里面，也就是 cheese-app-v0/secrets，然后在 api-service 里运行 API 脚本。"
  - "这时 /secrets 里有什么，第一次 embedding 调用又会怎样？"
  en_display:
  - null
  - "Suppose you save the key inside the repo, in cheese-app-v0/secrets, and run the API script from api-service."
  - "What is in /secrets, and what happens on the first embedding call?"
- en: "The cursor still climbs twice, to a folder that does not exist. Docker does not complain; it silently creates that folder, empty. So slash secrets is empty, and the first embedding call fails with a default credentials error: file not found. Meanwhile your key sits in a git tree that nothing protects."
  zh:
  - "路径还是往上爬两级，爬到一个不存在的目录。"
  - "Docker 不会抱怨；它会悄悄地创建这个目录，空的。"
  - "所以 /secrets 是空的，第一次 embedding 调用会失败，报 DefaultCredentialsError：找不到文件。"
  - "而你的密钥正躺在一个没有任何保护的 git 目录树里。"
  en_display:
  - null
  - null
  - "So /secrets is empty, and the first embedding call fails with a DefaultCredentialsError: file not found."
  - null
S05:
- en: "Last prerequisite: the Docker network. The README's command inspects it quietly, and creates it only if that fails. Pause and run it."
  zh:
  - "最后一个前置条件：Docker 网络。"
  - "README 的命令先悄悄检查它，只有检查失败才创建。"
  - "暂停一下，自己跑一遍。"
- en: "What happens if you run it again, as an extra? Nothing: no error, no second network. A command that is safe to run twice is called idempotent. Remember this shape."
  zh:
  - "额外再跑一次会怎样？"
  - "什么都不会发生：不报错，也不会多出第二个网络。"
  - "一条跑两次也安全的命令，叫作幂等的。"
  - "记住这个套路。"
- en: "In llm-rag, the shell script ships with a default project that is not yours. Update the GCP project variable to your own project ID; we use the sed tool, you use any editor. Pause and edit it."
  zh:
  - "在 llm-rag 里，shell 脚本自带一个默认项目，而那不是你的项目。"
  - "把 GCP project 这个变量改成你自己的项目 ID；我们用 sed，你用任何编辑器都行。"
  - "暂停一下，改好它。"
  en_display:
  - null
  - "Update the GCP_PROJECT variable to your own project ID; we use the sed tool, you use any editor."
  - null
- en: "Now the README's command: sh docker-shell.sh. Pause and run it. Compose pulls Chroma, creates a network called llm-rag-network, and starts the database on it. Every service in this file joins it automatically. The line that says pull access denied is harmless: that image is not on Docker Hub, so Compose builds it locally. The container's architecture is x86 here; Apple Silicon says aarch64."
  zh:
  - "现在是 README 的命令：sh docker-shell.sh。"
  - "暂停一下，自己跑一遍。"
  - "Compose 拉取 Chroma，创建一个叫 llm-rag-network 的网络，然后在上面启动数据库。"
  - "这个文件里的每个服务都会自动加入它。"
  - "那行 pull access denied 是无害的：这个 image 不在 Docker Hub 上，所以 Compose 在本地构建它。"
  - "这里 container 的架构是 x86；Apple Silicon 上会显示 aarch64。"
- en: "Two extra checks inside. The key file shows up in slash secrets, through the portal. And both variables are set, copied by Compose from the launching script, which is why you always start there."
  zh:
  - "在里面做两个额外检查。"
  - "密钥文件出现在 /secrets 里，是穿过传送门来的。"
  - "两个变量也都设好了，是 Compose 从启动它的脚本那里复制过来的，所以永远要从这个脚本启动。"
  en_display:
  - null
  - "The key file shows up in /secrets, through the portal."
  - null
- en: "One honest note about this recording. This machine has no Google account. The key file you just saw is an obviously invalid stand-in. It is there so the folder listings match the README, and it was removed before the cloud steps. So from here on, every cloud call fails exactly the way a missing key fails. It is the most common mistake in this lecture, so learn it on sight. Every success you should expect is tagged recorded, with its source."
  zh:
  - "关于这次录制，如实说一句。"
  - "这台机器没有 Google 账号。"
  - "你刚才看到的密钥文件，是一个明显无效的替身。"
  - "放它是为了让目录列表和 README 对得上，云端步骤之前就删掉了。"
  - "所以从这里开始，每个云端调用的失败方式，都和缺少密钥时一模一样。"
  - "这是这一讲最常见的错误，所以一眼就要认出来。"
  - "你接下来该看到的每一个成功结果，都标着 recorded，并注明出处。"
S06:
- en: "Inside the container, the README's first command does three jobs: it chunks, embeds and loads, with char split. The ID in the prompt changes every run. Chunking runs for real: 11 books, and the Tolminc book becomes 24 chunks."
  zh:
  - "进了 container，README 的第一条命令做三件事：用 char-split 分块、向量化、加载。"
  - "提示符里的 ID 每次运行都会变。"
  - "分块是真的跑了：11 本书，Tolminc 那本书切成了 24 个 chunk。"
  en_display:
  - "Inside the container, the README's first command does three jobs: it chunks, embeds and loads, with char-split."
  - null
  - null
- en: "A gold tag first. The embed step sends every chunk to Google's embedding model, about 7 million characters across both runs, by our estimate. That bills your project; check the current pricing page."
  zh:
  - "先看一个金色标签。"
  - "向量化这一步会把每个 chunk 发给 Google 的 embedding 模型，两次运行加起来大约 700 万个字符，这是我们的估算。"
  - "这会向你的项目计费；请查看当前的价目页。"
- en: "The embed step stops while building the header named Authorization. Despite the name, it carries proof of who you are, a bearer token, which needs a key. Default credentials error: the key file was not found. No key, no token: the first cloud request dies at authentication. The next scene builds that chain."
  zh:
  - "向量化这一步在构建名为 Authorization 的请求头时停了下来。"
  - "别看它叫这个名字，它装的其实是你的身份证明，也就是一个 bearer token，而这需要密钥。"
  - "DefaultCredentialsError：找不到密钥文件。"
  - "没有密钥就没有令牌：第一个云端请求死在了身份验证这一步。"
  - "下一段就来搭这条链。"
  en_display:
  - null
  - null
  - "DefaultCredentialsError: the key file was not found."
  - null
  - null
- en: "With a real key, the run continues: it embeds every book, creates the char split collection, and finishes inserting. Pause and run it; with your key, it takes a while."
  zh:
  - "有真实密钥的话，运行会继续：向量化每一本书，创建 char-split-collection，最后完成插入。"
  - "暂停一下，自己跑一遍；用你的密钥，这要花一阵子。"
  en_display:
  - "With a real key, the run continues: it embeds every book, creates the char-split-collection, and finishes inserting."
  - null
- en: "The second command does the same with recursive split. Pause and run it, then type exit. An extra count shows 8,248 chunks for char split and 14,228 for recursive split, at the time of recording. Recursive split makes more chunks, mostly from a default overlap of up to 200 characters, and it cuts at paragraph and word breaks."
  zh:
  - "第二条命令用 recursive-split 做同样的事。"
  - "暂停一下，自己跑一遍，然后输入 exit。"
  - "额外数一下：char-split 有 8248 个 chunk，recursive-split 有 14228 个，这是录制时的数字。"
  - "递归切分产生的 chunk 更多，主要是因为默认最多 200 个字符的重叠，而且它在段落和单词之间的断点处切。"
  en_display:
  - "The second command does the same with recursive-split."
  - null
  - "An extra count shows 8,248 chunks for char-split and 14,228 for recursive-split, at the time of recording."
  - null
- en: "The chunk files land on your laptop through the app mount. One small slip shows here. A book title is cut at its first dot, so its chunks get no author, and the agent's author filter never finds them. The fix is a Python function, splitext. Last, one real Tolminc chunk: the kind of passage the chat hands to Gemini."
  zh:
  - "这些 chunk 文件通过 /app 这个挂载落到你的笔记本上。"
  - "这里有一个小疏漏。"
  - "书名在第一个点处被截断了，所以它的 chunk 没有作者，agent 的作者过滤永远找不到它们。"
  - "修法是一个 Python 函数：splitext。"
  - "最后，看一个真实的 Tolminc chunk：就是对话交给 Gemini 的那种段落。"
- en: "The README says ChromaDB keeps running after you exit, and an extra docker ps confirms it, on port 8000. An extra curl asks for its version: 1.0.0, at the time of recording. Stopping it comes at the very end."
  zh:
  - "README 说 ChromaDB 在你退出之后还会继续跑，额外跑一下 docker ps 就能确认，就在 port 8000 上。"
  - "再额外 curl 一下它的版本：录制时是 1.0.0。"
  - "关掉它放在最后。"
S07:
- en: "So what failed? The API's Google client is built from a project and a location, nothing else. No code in this repo opens the key file; a library does, by a convention called application default credentials, or ADC."
  zh:
  - "那么，到底是什么失败了？"
  - "API 的 Google 客户端只用一个项目和一个区域来构建，别的什么都没有。"
  - "这个 repo 里没有代码去打开密钥文件；打开它的是一个库，靠的是一个叫应用默认凭据的约定，简称 ADC。"
- en: "ADC looks in three places, in order. First, the file named by the Google application credentials variable: a service account key, as in this tutorial. Second, a login file the gcloud tool writes for you, as a person. Third, the metadata server, when your code runs inside Google's cloud. ADC moves to the next place only when the one before is not set. Inside these containers, only the first place exists."
  zh:
  - "ADC 按顺序看三个位置。"
  - "第一，Google application credentials 这个变量指定的文件：一个服务账号密钥，就像这个教程里的。"
  - "第二，gcloud 工具为你本人写的一个登录文件。"
  - "第三，元数据服务器，在你的代码跑在 Google 的云里时才有。"
  - "ADC 转到下一个位置，只有一种情况：前一个没有设置。"
  - "在这些 container 里，只有第一个位置存在。"
  en_display:
  - null
  - "First, the file named by the GOOGLE_APPLICATION_CREDENTIALS variable: a service account key, as in this tutorial."
  - null
  - null
  - null
  - null
- en: "The library writes a small note, a JSON web token, and signs it with your private key. It sends that note to Google's token desk, at the address in your key file. Google holds the matching public key, so it checks your signature without ever seeing the private one. Back comes an access token, valid for about an hour. That token rides on every request as a bearer header. Your private key never leaves your machine; only the short-lived ticket travels."
  zh:
  - "这个库写一张小纸条，也就是一个 JSON Web Token，用你的私钥签名。"
  - "它把这张纸条送到 Google 的令牌柜台，地址就写在你的密钥文件里。"
  - "Google 手里有配对的公钥，所以不用看到私钥，就能验证你的签名。"
  - "换回来的是一个访问令牌，有效期大约一小时。"
  - "这个令牌跟着每个请求走，作为 bearer 请求头。"
  - "你的私钥从不离开你的电脑；在路上跑的只有那张短期有效的票。"
  en_display:
  - "The library writes a small note, a JSON Web Token, and signs it with your private key."
  - null
  - null
  - null
  - null
  - null
- en: "When the hour runs out, the library gets a new one. The lecture's OAuth diagram ends at this same desk, minus the consent screen: no person is there."
  zh:
  - "一小时用完，库会再换一个新的。"
  - "课上那张 OAuth 图也终止在同一个柜台，只是少了授权同意页面：这里没有人。"
- en: "Here is ADC caught in the act. With slash secrets empty, an extra one-line Python check asks ADC who we are. The variable is set, so ADC opens that path, finds no file, and stops right there, with the same error. A wrong path never falls back to the other two places. With your key in place, it names your service account instead."
  zh:
  - "来看 ADC 被抓个现行。"
  - "在 /secrets 为空的情况下，额外用一行 Python 检查问 ADC 我们是谁。"
  - "变量设了，所以 ADC 打开那个路径，找不到文件，就停在那里，报同一个错误。"
  - "错误的路径永远不会退回到另外两个位置。"
  - "密钥放好了，它就会说出你的服务账号。"
  en_display:
  - null
  - "With /secrets empty, an extra one-line Python check asks ADC who we are."
  - null
  - null
  - null
- en: "One common mix-up: setting that variable on your Mac authenticates nothing inside a container, where the path must exist. That is why the scripts set a container path, and mount the host folder separately."
  zh:
  - "一个常见的误解：在你的 Mac 上设这个变量，对 container 里面的身份验证毫无作用，那里这个路径必须存在。"
  - "所以脚本设的是 container 里的路径，再单独挂载宿主机目录。"
S08:
- en: "Authentication proved who your code is. Authorization decides what it may do, and where. Google calls this IAM: a grid of identities, roles, and resources. Your service account holds the Gemini user role in your project, and that green cell does the work. Storage Admin sits beside it, granted but never used by this app."
  zh:
  - "身份验证证明了你的代码是谁。"
  - "授权决定它能做什么，在哪里做。"
  - "Google 把这叫 IAM：一个由身份、角色和资源组成的格子。"
  - "你的服务账号在你的项目里持有 Gemini 用户这个角色，真正起作用的是那个绿色的格子。"
  - "Storage Admin 在它旁边，授予了，但这个应用从来没用过。"
- en: "Three requests test three cells. IAM checks the resource the request names; for an embedding, the client writes that name from your project variable. An embedding in your own project is allowed. The same call with the script's unedited default project is refused with a 403, because your account has no role there. That is why you edit both scripts. The third arrow waits for part 2."
  zh:
  - "三个请求检验三个格子。"
  - "IAM 检查的是请求里点名的资源；对 embedding 来说，这个名字是客户端根据你的 GCP project 这个变量写出来的。"
  - "在你自己项目里的 embedding 是允许的。"
  - "同样的调用换成脚本里没改过的默认项目，会以 403 被拒绝，因为你的账号在那里没有角色。"
  - "所以两个脚本都要改。"
  - "第三根箭头留到第二部分。"
- en: "A default credentials error, or a 401, means no valid token: check the path, the mount, and the file name. A 403 means authentication worked, but authorization failed. The cause: a missing role, the wrong project, or an API that is not enabled."
  zh:
  - "DefaultCredentialsError 或者 401，意思是没有有效的令牌：检查路径、挂载和文件名。"
  - "403 的意思是身份验证通过了，但授权失败了。"
  - "原因：缺了角色、项目不对，或者 API 没有启用。"
  en_display:
  - "A DefaultCredentialsError, or a 401, means no valid token: check the path, the mount, and the file name."
  - null
  - null
- en: "That last cause is a small gap: no README here says to enable the Vertex AI API. If you never did, the 403 says so, and one extra gcloud command fixes it."
  zh:
  - "最后这个原因是一个小疏漏：这里没有哪个 README 说要启用 Vertex AI API。"
  - "如果你从没启用过，403 会直接说出来，一条额外的 gcloud 命令就能修好。"
- en: "Something to ponder. Your key works for embeddings. Now you paste the instructor's endpoint, which begins with projects and a long number. Which part decides whose IAM is checked: the project variable, the project inside your key, or the endpoint path?"
  zh:
  - "来想一个问题。"
  - "你的密钥用来做 embedding 没问题。"
  - "现在你贴上授课老师的 endpoint，它以 projects 和一长串数字开头。"
  - "哪一部分决定检查谁的 IAM：GCP project 这个变量、密钥里的项目，还是 endpoint 路径？"
- en: "The path. Not the key's project: that only says where the badge was issued. Not the variable: the endpoint path already names a project, and that name wins. It is someone else's project, where your account has no role, so it is a 403; part 2 draws it."
  zh:
  - "是路径。"
  - "不是密钥里的项目：那只说明工牌是在哪儿签发的。"
  - "也不是那个变量：endpoint 路径本身已经点名了一个项目，以这个名字为准。"
  - "那是别人的项目，你的账号在那里没有角色，所以是 403；第二部分会把它画出来。"
S09:
- en: "Last stretch of part 1, the API. In the api-service folder, make the second project-name edit. Pause and do it."
  zh:
  - "第一部分的最后一段：API。"
  - "在 api-service 目录里，做第二处项目名的修改。"
  - "暂停一下，照着做。"
- en: "Then the README's command, sh docker-shell.sh. Pause and run it. It dies at once: the network already exists."
  zh:
  - "然后是 README 的命令：sh docker-shell.sh。"
  - "暂停一下，自己跑一遍。"
  - "它马上就挂了：网络已经存在。"
- en: "This is the biggest slip in the repo, and not your fault. Line 14 creates the network unconditionally, and set dash e, on line 4, stops the script at the first error. So it fails whenever the network exists, even right after the README's own network step. The fix is the shape you met earlier: make line 14 the README's inspect-or-create command. Pause and make that edit in your editor; the sed is ours, an extra."
  zh:
  - "这是这个 repo 里最大的疏漏，不是你的错。"
  - "第 14 行无条件地创建网络，而第 4 行的 set -e 会让脚本在第一个错误处停下。"
  - "所以它一碰到网络已经存在就会失败，哪怕刚跑完 README 自己建网络的那一步。"
  - "修法就是前面见过的那个套路：把第 14 行换成 README 那条先检查、不存在再创建的命令。"
  - "暂停一下，在你的编辑器里改好；sed 是我们的做法，算额外步骤。"
  en_display:
  - null
  - "Line 14 creates the network unconditionally, and set -e, on line 4, stops the script at the first error."
  - null
  - null
  - null
- en: "Run the script again. The first build installs 170 pinned packages from Pipfile.lock, which took about three minutes at the time of recording. You land in the pipenv shell. Type uvicorn server, and the API starts on port 9000, listening on 0.0.0.0. Pause and run both."
  zh:
  - "再跑一次脚本。"
  - "第一次构建会从 Pipfile.lock 安装 170 个 pin 住的包，这在录制时花了大约三分钟。"
  - "你会进到 pipenv shell 里。"
  - "输入 uvicorn server，API 就在 port 9000 上启动，监听 0.0.0.0。"
  - "暂停一下，两条都跑一遍。"
  en_display:
  - null
  - null
  - null
  - "Type uvicorn_server, and the API starts on port 9000, listening on 0.0.0.0."
  - null
- en: "The server started cleanly with an empty secrets folder, because the Google client does not look for credentials until its first request. In a second terminal, an extra curl asks for an embedding and gets a 500. The server log shows the same default credentials error, raised while building the bearer header. A green startup is not an authenticated startup."
  zh:
  - "服务器在 secrets 目录为空的情况下也顺利启动了，因为 Google 客户端要到第一个请求时才去找凭据。"
  - "在第二个终端里，额外用 curl 请求一个 embedding，得到的是 500。"
  - "服务器日志里是同一个 DefaultCredentialsError，在构建 bearer 请求头时抛出。"
  - "启动是绿的，不代表身份验证过了。"
  en_display:
  - null
  - null
  - "The server log shows the same DefaultCredentialsError, raised while building the bearer header."
  - null
- en: "With a real key, the same request returns a list of 256 numbers, the embedding. That length must match the loader's, or the database queries fail. And the whole chain lights up, through to a 200."
  zh:
  - "有真实密钥的话，同样的请求会返回一个 256 个数的列表，也就是 embedding。"
  - "这个长度必须和加载器的一致，否则数据库查询会失败。"
  - "整条链也会一路亮起来，一直到 200。"
- en: "The README's last step here: open localhost 9000 slash docs in your browser. Pause and look. Extra curls show the docs page and the README's five routes, plus one more at the root."
  zh:
  - "README 在这里的最后一步：在浏览器里打开 localhost:9000/docs。"
  - "暂停一下，看一看。"
  - "额外跑几次 curl，能看到文档页和 README 里的五个路由，外加根路径上的一个。"
  en_display:
  - "The README's last step here: open localhost:9000/docs in your browser."
  - null
  - null
- en: "On your machine, with a real key, the auth chain is now complete, and the API answers on your laptop. Leave it running. Part 2 asks two questions: how does a web page find this API, and who else can?"
  zh:
  - "在你的机器上，有真实密钥的话，身份验证的链条现在就完整了，API 在你的笔记本上应答。"
  - "让它一直跑着。"
  - "第二部分问两个问题：网页怎么找到这个 API，还有谁也能找到它？"
