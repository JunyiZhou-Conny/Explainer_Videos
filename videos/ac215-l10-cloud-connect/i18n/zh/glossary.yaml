# Chinese (zh-CN) glossary and translation rules for ac215-l10-cloud-connect (AC215 lecture 10, Connecting to the
# Cloud: Networking, Authentication & Storage; a follow-along of dlops-io/cheese-app-v0 @ cb6fb94, README
# Prerequisites, Build the Vector DB, Run API Service Container, Run Frontend Container, the five UI steps and the
# shutdown), code-switching version, SUBTITLES ONLY.
# Audience: Chinese-speaking AC215 grad students who read technical English fluently; register of a Chinese
# MLOps TA running a lab section. Precedents and sources of the shared decisions: the series pilot
# videos/ac215-l01-vms-venvs/i18n/zh (repo, clone, commit, pin, 录制时); the container and cloud lectures
# ac215-l02-containers-1, ac215-l03-mega-pipeline (服务账号, 密钥, 凭据, 应用默认凭据 + ADC, 访问令牌,
# 身份验证 vs 授权, IAM 角色, bind mount, 挂载, bucket / 存储桶, 前缀) and ac215-l04-flexible-workflow-ports (port,
# host port, container port, localhost, 网络, 电话簿, 发布, 门, 监听, 临时 port, 结算 vs 计费, 启用); ac215-l05-rag
# (the same llm-rag stack: chunk, embedding, collection, agent, 分块, 向量化, char-split, docker-volumes 目录,
# llm-service-account, the role names, 一个小疏漏); ac215-l06-agents-1 (工具, 函数调用, 区域); ac215-l08-llm-finetuning
# (endpoint, 微调); ac215-l09-ci-testing (the latest sibling and the model for this file's structure: Ctrl-C,
# the detect-private-key hook, D6 fixed patterns). Every term L1-L9 already decided keeps their form; what is
# new here is the identity chain (badge, JSON key, JWT, token desk, bearer token, ticket, metadata server,
# federation), the IAM grid and the 401 / 403 reading, the map of houses, streets and doors (Docker DNS,
# loopback, 0.0.0.0, port bands) and the browser words (origin, cross-origin, CORS, preflight, guest list, pass).
# The BRIEF's glossary heads-up (BRIEF.md:678-681) proposed keeping service account, key, token, ADC, IAM,
# principal, role, CORS, preflight, origin, mount, port, localhost, Docker DNS, endpoint, embedding, bucket and
# prefix in English. Series consistency wins where L3-L8 already decided a Chinese form: 服务账号, 密钥, 访问令牌,
# 角色, 挂载, 前缀 (A1, decisions in GLOSSARY.md); preflight takes the standard 预检请求 (A3). The rest of the
# heads-up is followed.
# There is NO Chinese voice in this series (docs/AC215_SERIES.md rule 8): the Chinese lines are subtitles on the
# English timing (the bilingual band of output/<id>.zh-en.mp4, <id>.zh.srt, <id>.zh-en.srt / .ass). So no say:,
# no anchors, no readings, no durations: only display rules. But `python -m explainer.i18n check` still applies
# its voice hygiene to the displayed line when a sentence has no say: (brackets, maths symbols, letter_letter
# names, Latin words not listed here, a missing half-width space): rules A6, B3 and D3 are how the Chinese line
# stays clean without say:.
# SERIES RULE: the instructor's name never appears in a subtitle, a title or the description (A10).
# Human-readable copy in Chinese: GLOSSARY.md (keep the two in sync).
# terms[].zh_subtitle = the display form (Chinese subtitle line; titles use the written forms of A4);
# terms[].first_use = an example sentence for the translators, as SNN[k]：<one Chinese sentence for one English
# sentence of SAY block k of scene SNN, k from 0>; each one passes the checker; the narration files reuse them;
# rules are tagged [A1]..[I2]: A terms, B typography, C numbers, D narration file, G subtitles, H titles and
# companions, I toolkit notes. (L1's E on-screen strings and F voice rules do not apply: nothing on screen is
# translated in this series, and there is no voice.)
# Read by: python -m explainer.i18n check (Latin words allowed in the Chinese line: every Latin word of
# zh_subtitle and first_use, plus allowed_spoken_latin, which lists the words as the checker's regex
# [A-Za-z][A-Za-z'.-]* cuts them: cheese-app-v0 is cheese-app-v, x86 is x, aarch64 is aarch, localhost:9000/docs
# is localhost and docs, .json.json is json.json, -p is p) and explainer/subtitles.py, for EVERY video (2-3 word
# English phrases of `en` are kept on one English line; 2-7 character Chinese headwords of zh_subtitle are
# registered in jieba, so zh_subtitle holds terms, not example phrases).
video: ac215-l10-cloud-connect
lang: zh-CN (mainland Simplified Chinese)
audience: 'Chinese-speaking AC215 (MLOps & LLMOps) grad students who know Python and basic ML, read technical English fluently, did L1-L9 (a GCP project, venvs and uv, Docker images and containers, bind mounts, Compose, published ports, the L5 RAG stack, L8 fine-tuning, the L9 pre-commit gate), and are new to service accounts and JSON keys, ADC, IAM, networking between containers and the host browser, and CORS; they follow along on their own laptop with their clone of cheese-app-v0 open and a GCP project with billing (this lecture''s embedding and chat calls bill it). Register of a Chinese MLOps TA running a lab section.'
voice: none          # subtitles only (video.yaml: Chinese = i18n/zh/narration/*.yaml on the English timing)
policy: 'The Mandarin of a Chinese MLOps TA walking a lab section through the steps, code-switching only where such a speaker really does, written as subtitles under an English narration. The viewers already say 把 repo clone 下来, 起一个 container, 构建 image, 发布一个 port, 调 embedding 模型, 建一个 collection, 建一个 bucket, 调一个 endpoint, 装个 hook; this lecture adds 建一个服务账号, 下载 JSON 密钥, 走 ADC, 换一个 bearer token, 查 IAM, 报 403, 跨域, 配 CORS, 发预检请求, 看 origin, 走 Docker DNS. Every choice passes three tests: what is said in a real lab section; the standard, searchable Chinese name (Google Cloud''s Chinese docs: 服务账号, 应用默认凭据, 访问令牌, 元数据服务器, 身份联合, 最小权限; MDN''s Chinese web docs: 跨域, 同源, 预检请求, 请求头; the networking literature: 回环地址, 幂等); and consistency with the series (L1 decided the shared words, L2-L4 the container, key and network words, L5 the RAG words, L8 endpoint, L9 the last conventions: every form they fixed is kept). (1) Artifacts verbatim: what the viewer types or matches on screen (commands, flags, file and folder names, paths, image, container, network and collection names, addresses and ports, the service-account name, role names, console labels, error and terminal text, HTTP status codes, header names, README headings, the on-screen tags) is copied letter for letter, never translated, inflected or quoted; the exceptions the checker forces (an underscore, =, < >, + or brackets inside the artifact) are written the way the narration says them (A6) and the English line shows the literal (D4). Nothing on screen is translated in this series: terminal output, code panels, README cards, the console and browser drawings, the IAM grid, the map, tags, trackers, lecture tags and the pause-and-ponder cards stay English; only the narration is. (2) Lab-speech English, a closed list: from L1-L9 repo, clone, commit, pin, root, shell, container, image, Dockerfile, tag, pull, port, host port, container port, localhost, bind mount, bucket, API, ID, bug, chunk, embedding, collection, agent, LLM, endpoint, hook; new in L10 IAM (already the series'' IAM 角色), ADC (with 应用默认凭据 on first use), OAuth, API key, bearer token, JSON Web Token, CORS, origin, Docker DNS, Wi-Fi. (3) Everything else in standard Chinese: 服务账号, 身份, 工牌, 邮箱, 密钥, JSON 密钥, 私钥, 公钥, 签名, 凭据, 应用默认凭据, 访问令牌, 令牌, 令牌地址, 令牌柜台, 票, 身份验证, 授权, 角色, 权限, 授予, 资源, 项目, 项目 ID, 启用, 结算, 计费, 最小权限, 身份联合, 担保, 元数据服务器, 登录文件, 因素, 网络, 回环地址, 回环接口, 街道, 房子, 门, 隧道, 地址, IP 地址, 发布, 监听, 转发, 跨域, 同源, 预检请求, 请求头, 白名单, 通行证, 保安, 挂载, 宿主机, 目录, 文件系统, 传送门, 幂等, 分块, 向量化, 向量数据库, 加载器, 前端, 服务器, 客户端, 路由, 文档页, 弃用警告, 包, 重新加载, 微调, 区域, 工具, 检索工具, 生成调用, 前缀, 存储客户端. (4) The video''s pictures by meaning, one word each: 房子 (a house: the laptop, each container), 街道 (a street: a Docker network), 地面 (the laptop floor), Google 的大楼 (Google''s building), 有人把守的门 (the guarded door), 门 (a published port), 隧道 (the -p tunnel), 电话簿 (Docker DNS, from L4), 工牌 (the service account''s badge), 纸条 (the JWT note), 令牌柜台 (the token desk), 票 (the one-hour ticket), 传送门 (the bind mount portal), 格子 (an IAM cell), 保安 (the browser as bouncer), 白名单 (CORS''s guest list), 通行证 (the CORS pass), 小谜题 (the three riddles). (5) Written register for titles, meta.yaml and companion docs: 仓库, 克隆, 提交, 容器, 镜像, 端口, 存储桶, 绑定挂载, 数据卷, 服务账号（Service Account）, 应用默认凭据（ADC）, 访问令牌, 跨源资源共享（CORS）, 嵌入向量（embedding）, 集合（collection）, 智能体（agent）. (6) The bilingual band puts the English sentence under every Chinese line, so the Chinese line carries no glosses and no brackets at all (the checker forbids them without say:). (7) The toolkit''s constraints are part of the policy: one Chinese sentence per English sentence (90 blocks, 382 sentences), a checker-clean display line (D3), an en_display wherever the SAY spells an artifact out as words (D4). Mainland Simplified Chinese; relaxed, clear lab-section speech, never slangy.'
rules:
- '[A1] Code-switching scope. English stays in three places only. (a) Artifacts, copied letter for letter: commands and subcommands (git clone, git log, ls, mkdir, mv, tree, sed, sed -i, sh docker-shell.sh, docker network inspect, docker network create, docker network ls, docker network connect, docker network disconnect, docker network rm, docker ps, docker inspect, docker exec, docker compose down, docker compose up, python cli.py, pipenv shell, uvicorn server (A6), curl, exit, npm install, npm run dev, gcloud), flags (-p, -v, -e, --rm, -H), file and folder names and paths (cheese-app-v0, llm-rag, api-service, frontend-ai-chatbot, secrets, /secrets, /app, /data, docker-shell.sh, docker-compose.yml, Pipfile.lock, llm-service-account.json, .gitignore, docker-volumes, api 目录), image, container, network and collection names (llm-rag-cli, llm-rag-chromadb, cheese-app-network, llm-rag-network, char-split-collection, recursive-split-collection), chunk-type values (char-split, recursive-split), addresses and ports (localhost:8000, localhost:9000, localhost:9000/docs, localhost:3000, localhost:3200, localhost:3200/finetunechat, llm-rag-chromadb:8000, 0.0.0.0, 127.0.0.1, port 80, 443, 3000, 3200, 3300, 8000, 9000), the service-account name (llm-service-account), role names (Storage Admin, Gemini Enterprise Agent Platform User, Vertex AI User), console labels (IAM & Admin, Service accounts, KEYS, JSON), error and terminal text (DefaultCredentialsError, pull access denied, Name or service not known, Connection refused, Ready, Local, 200 OK), HTTP status codes (200, 401, 403, 500), header names (Authorization, Origin), code names as the narration says them (splitext, set -e), architectures (x86, aarch64), versions, and the on-screen tags when the narration names them (your turn, extra, recorded; A11). The exceptions are artifacts the checker rejects (A6). (b) Products, organisations, the course and names: Google, Google Cloud, Vertex AI, Gemini, Docker, Docker Desktop, Docker Hub, Compose, Chroma, ChromaDB, GitHub, GitHub Actions, Python, Node, npm, Next.js, JavaScript, Chrome, Mac, Apple Silicon, Wi-Fi, JSON, IP, DNS, RAG, AC215, Tolminc, student, app, root. (c) A closed list of words Chinese engineers say in English in a lab section: from L1-L9 repo, clone, commit, pin, root, shell, container, image, tag, pull, port, host port, container port, localhost, bind mount, bucket, API, ID, bug, chunk, embedding, collection, agent, LLM, endpoint, hook; new in L10 IAM, ADC, OAuth, API key, bearer token, JSON Web Token, CORS, origin, Docker DNS. A word joins (c) only if lab speech really uses the English and the Chinese is stiff, ambiguous or collides with another term (不记名令牌 for bearer token is a dictionary word nobody says; 源 alone is ambiguous next to 数据源 and 源代码, while 跨域 and 同源 are the everyday compounds; Docker 的 DNS is said as Docker DNS). Never English for flavour: no service account, key, token (alone), role, mount, network, prefix, preflight, project, permission, authentication, authorization, request, header, volume, server, client, frontend, database, loader, tool, route.'
- '[A2] Docker and the map, as L2-L5. The subtitles say container and image (起一个 container, image 里, 构建 image), measure word 个; titles, chapter names, meta.yaml and companion docs write 容器 and 镜像 (A4). network → 网络 (Docker 网络; two private streets, one per network → 两条私有的街道，一个网络一条); Compose → Compose, the compose file → compose 文件, service → 服务 (Every service in this file joins it → 这个文件里的每个服务都会自动加入); mount → 挂载, bind mount stays (L3), the portal → 传送门 (this video''s picture of a bind mount), host → 宿主机 (the host folder → 宿主机目录), two filesystems, one folder → 两个文件系统，一个目录; build → 构建, builds it locally → 在本地构建; dash dash rm → --rm; the container''s ID in the prompt → 提示符里的 ID; the hash sign → 井号; you are root → 你是 root; Docker volumes folder → docker-volumes 目录 (L5), mounted folders → 挂载的目录, slash data → /data, Containers come and go; mounted folders stay → container 来来去去，挂载的目录留下来.'
- '[A3] The identity and cloud words (new in this lecture, on L3-L5''s base). service account → 服务账号 (never 服务帐号; L1-L5); an identity for software → 给软件用的身份; badge → 工牌 (the email badge); key / key file / JSON key → 密钥 / 密钥文件 / JSON 密钥; private key → 私钥, public key → 公钥, signature / signs → 签名; credentials → 凭据; application default credentials → 应用默认凭据, ADC stays (first use: 一个叫应用默认凭据的约定，简称 ADC; then ADC); the metadata server → 元数据服务器; a login file the gcloud tool writes → gcloud 工具为你写的一个登录文件; access token → 访问令牌 (L3, L4: never token alone for it), the token → 令牌 (No key, no token → 没有密钥就没有令牌), a token address → 一个令牌地址, Google''s token desk → Google 的令牌柜台, the one-hour ticket / short-lived ticket → 一小时有效的票 / 短期有效的票; bearer token stays (the HTTP scheme name, as the Authorization header carries it), bearer header → bearer 请求头; a JSON web token → JSON Web Token; authentication → 身份验证, authorization → 授权 (L3; never 认证 alone, which blurs the two); IAM stays, the grid → 格子 (a grid of identities, roles and resources → 一个由身份、角色和资源组成的格子; that green cell → 那个绿色的格子); role → 角色, bundles of permissions → 权限的集合, grant → 授予; resource → 资源; project → 项目, project ID → 项目 ID; enable an API → 启用 API (L4); billing → 结算, bills / billed → 计费 (L4); least privilege → 最小权限; federation → 身份联合 (Google: workload identity federation → 工作负载身份联合); vouch → 担保; API key and OAuth stay; the sign in with Google flow → 用 Google 账号登录的流程; consent screen → 授权同意页面; one factor, something you have → 一个因素，你持有的东西; a password, never config → 当密码，绝不当配置; stand-in → 替身 (L3, L5).'
- '[A4] Written vs spoken pairs. Subtitles say repo / clone / commit / container / image / port / bucket / bind mount / embedding / collection / agent; titles, chapter names, meta.yaml and the companion docs write 仓库 / 克隆 / 提交 / 容器 / 镜像 / 端口 / 存储桶 / 绑定挂载 / 嵌入向量（embedding）/ 集合（collection）/ 智能体（agent）. 服务账号 is the same in both; titles add （Service Account） once for search, as video.yaml''s publish.title_zh writes it in English. ADC is written 应用默认凭据（ADC）, CORS 跨源资源共享（CORS） (MDN''s Chinese), volumes 数据卷. The README''s own repository wording (clone this repository) → clone 这个仓库 (quoting the README).'
- '[A5] Writing artifacts. Copied verbatim (case, dots, slashes, hyphens, colons unchanged); never translated, inflected, quoted, put in 《》 or code formatting. Add a Chinese head noun where it helps: secrets 目录, api 目录, compose 文件, docker-volumes 目录, -v 参数, -p 3200:3000 这个参数, llm-rag-network 这个网络, char-split-collection 这个 collection, Authorization 请求头, Origin 请求头, Storage Admin 这个角色, KEYS 标签页, GCP project 这个变量. Never start a sentence with a lower-case artifact or kept-English word (localhost, llm-rag-chromadb, cheese-app-v0, api-service, docker ps, curl, sed, npm, sh docker-shell.sh, uvicorn server, char-split, /secrets, -p, -v, container, image, port, chunk, embedding, collection, agent, endpoint, origin, bucket, bearer token): put a Chinese word first (这时 localhost……; 在 api-service 目录里……; 参数 -p 3200:3000……; 一个个 container……; 所有 port 号……; 这个 origin……; 额外跑一下 docker ps……). A capitalized name, product or code word may open a sentence (Docker, Compose, Google, Gemini, IAM, ADC, CORS, OAuth, README, Chroma, ChromaDB, Next.js), and so may a status code or number that opens the English sentence (403 的意思是……; 5 道自测题 is written 五道自测题, C1). When the SAY shortens a command the screen shows in full, write it as the screen shows it.'
- '[A6] Artifacts the checker rejects. With no say:, the checker reads the display line as speech and rejects letter_letter names, = < > + and brackets of any kind. So these artifacts are never copied into the Chinese line; they are written the way the narration says them, and the English line shows the literal through en_display (D4). Table: GCP_PROJECT → GCP project 这个变量 (L5); GOOGLE_APPLICATION_CREDENTIALS → Google application credentials 这个变量 (the SAY names it; L5 said 密钥的路径 because its SAY did); uvicorn_server → uvicorn server; x86_64 → x86 (as the SAY says it); --chunk_type, get_book_by_author, search_content, NEXT_PUBLIC_BASE_API_URL and $(pwd)/../../secrets are never named by the SAY and never written; -v HOST:CONTAINER → -v 参数，宿主机路径在前，container 路径在后 (only if needed); Ctrl+C → Ctrl-C (both lines, as L9); application_default_credentials.json → gcloud 写的登录文件 (as the SAY). When the toolkit lets display lines keep these characters (I1), the literals may replace the descriptions.'
- '[A7] Disambiguation pairs. 身份验证 (authentication: who) vs 授权 (authorization: what, where) vs 授予 (grant a role) vs 授权同意页面 (OAuth consent screen). 访问令牌 / 令牌 (the access token) vs bearer token (the same token as it rides in the header: use bearer token only where the English says bearer) vs JSON Web Token (the signed note, never 令牌 alone) vs token in an LLM sense (not in this lecture). 密钥 (the JSON key file / the service-account key) vs 私钥 (the private key inside it) vs 公钥 (Google''s copy) vs API key (a different credential, S03 only). 服务账号 (the account) vs 身份 (identity, the general idea) vs 工牌 (the badge picture). 项目 (a GCP project) vs repo (the code) vs 应用 (the app). 网络 (a Docker network) vs 街道 (the picture of one) vs Wi-Fi (your laptop''s network) vs 公共街道 (the internet in the map). 门 (a published port) vs 有人把守的门 (Google''s door) vs 隧道 (the -p forward). 回环地址 (localhost as an address) vs 回环接口 (the loopback side a server listens on, S11) vs 临街的一侧 (the street side). 地址 (address) vs IP 地址 vs 名字 (a container name). 挂载 (mount) vs bind mount (the Docker mode) vs 传送门 (the picture). 第一部分 / 第二部分 (the video''s parts, S01 part 2, S03 part 2, S08 part 1 / part 2) vs README 的六节 (the six README sections the trackers follow) vs 第 n 步 (the README''s and the app''s numbered steps: Step 1 of 5 → 5 步里的第 1 步) vs 第 n 讲 (lectures). 调用 (a call: three calls, call one) vs 请求 (a request) vs 查询 (a database query). 一个小疏漏 (every erratum, as L5 and L9) vs 陷阱 (a trap: the gitignore, the 0.0.0.0 doors) vs 误解 (a mix-up, S07). 区域 (a location, L6) vs 地址 (an address). 白名单 (CORS''s guest list) vs 通行证 (the pass a reply carries) vs 保安 (the browser).'
- '[A8] Register: a TA running a lab section. Short instructions, colloquial verbs (装, 跑, 删, 敲, 改, 贴, 拨, 打给, 敲门, 关掉, 收拾); address the viewer as 你 (one-to-one follow-along; never 您, 大家, 同学们); 我们 is us at recording time (we use the sed tool → 我们用 sed). Chinese word order; restructure freely inside a sentence, but keep the English order of clauses (the band pairs zh and en clause by clause; never turn a main-clause-first sentence into 如果……，就……). No translationese: no 让我们… (use 我们来… / 先…), no 这就是为什么… (use 所以… / 也正因为这样…), few 被 passives, no chains of 一个…的. No internet slang. Carry the spoken rhythm by meaning: Time to type → 该动手敲了; Now the proof → 现在来证明; Here is ADC caught in the act → 来看 ADC 被抓个现行; One honest note about this recording → 关于这次录制，如实说一句; Last stretch of part 1 → 第一部分的最后一段; This is the biggest slip in the repo, and not your fault → 这是这个 repo 里最大的疏漏，不是你的错; Then the real question arrives → 然后真正的问题来了; A green startup is not an authenticated startup → 启动是绿的，不代表身份验证过了; When something breaks, find its layer → 出了问题，先找它在哪一层.'
- '[A9] Precision. Translate hedges exactly: only 只, every 每个, all 全部, about 大约, by our estimate 按我们的估算, up to 最多, at least 至少, by default 默认, at once 马上 / 立刻, unconditionally 无条件地, silently 悄悄地, never 从不 / 永远不, until deleted or disabled 直到被删除或停用. at the time of recording is always 录制时 and never dropped (8248 and 14228 chunks; 1.0.0; about three minutes for 170 packages; 773 packages; 14.2.4). Counts, versions, ports, status codes and sizes match the screen exactly. Errata are gentle and always followed by the fix, with one phrase for every one, as L5 and L9: One small gap / One small slip / a small gap → 有一个小疏漏 / 一个小疏漏 (S02 the deleted hosted files, S06 the title cut at its first dot, S08 no README step enables the Vertex AI API, S10 the docs path); the biggest slip → 最大的疏漏 (S09 line 14), and not your fault → 不是你的错. The honest framing of S05 (this machine has no Google account; the key in the listings is an obviously invalid stand-in, removed before the cloud steps; every success is tagged recorded with its source) is said as plainly as the English, never apologetic and never hidden. Ponder questions (S04, S08, S10, S12, S14) ask without answering, and the wording must not give the answer away (S04 must not say empty; S08 must not say the path wins; S10 must not say put the database on the API''s street; S12 must not say call two; S14 must not say no).'
- '[A10] Names. Products, companies and course names stay Latin (A1 b). Course: AC215; lecture n → 第 n 讲 (lecture 8 → 第 8 讲); the fine-tuning lecture → 微调那一讲; the ports lecture → 讲 port 的那一讲 (L4); last lecture → 上节课 (L9); next lecture / next week → 下节课 / 下周; the lecture / the slides → 课上 / 课件; the lecture''s rule → 课上的规则; the lecture''s OAuth diagram → 课上那张 OAuth 图; the course → 课程, the course''s site → 课程的网站; the author → 作者. SERIES RULE: the instructor''s name never appears in a subtitle, a title, a chapter name or the description. The narration says the instructor → 授课老师 (the instructor''s endpoint → 授课老师的 endpoint; the instructor''s project → 授课老师的项目). The README''s fifth UI heading carries the instructor''s name: it is never written; its step is said as the SAY says it (Step 5 is the fine-tuned cheese model → 第 5 步是微调过的奶酪模型), and the tracker on screen masks the name as ‹instructor›. Tolminc stays (the cheese, capitalized). The user app, student, root and the repo, folder, image, container and network names stay.'
- '[A11] The screen stays English. This series translates the narration only: terminal output and prompts, terminal titles, code panels (comments included), README cards, the six trackers (README › Prerequisites & Service Account, step k of N), the lecture tags (Lecture 10 · slides a–b), tags (your turn, extra, our editor, illustration, recorded, the GOLD cost tags), the schematic console and browser drawings, the map, the ADC ladder, the IAM grid, the CORS flow and the pause-and-ponder cards are all English, and the scenes need no language changes. So when the narration names an on-screen tag, the subtitle names it as the screen shows it: 黄色的 your turn 标签, 灰色的 extra 标签, 标着 recorded. Everything the narration says in its own words is translated: a gold tag → 金色标签, the tracker → 进度条, an extra → 额外检查 / 额外跑一下 / 作为额外步骤, the map → 地图, the grid → 格子, the bouncer → 保安.'
- '[A12] Mainland Simplified Chinese only: 默认, 程序, 代码, 文件, 目录, 服务器, 网络, 脚本, 视频, 用户, 信息, 配置, 凭据, 进程, 字段, 对象, 函数, 账号, 密钥, 令牌, 文档, 浏览器, 网页; never 預設, 程式, 程式碼, 檔案, 資料夾, 伺服器, 網路, 腳本, 影片, 使用者, 訊息, 組態, 憑證, 物件, 函式, 帳號, 金鑰, 權杖, 瀏覽器, 網頁.'
- '[A13] The browser and networking words (new in this lecture, on L4''s base). port stays (一个 port; port 9000 or 9000 这个 port, as the English orders it); host port and container port stay as the pair (L4: host port 3200 转发到 container port 3000); localhost stays (its own localhost → 自己的 localhost; inside a container, localhost means that container → 在 container 里面，localhost 指的就是这个 container); loopback address → 回环地址, the loopback (where a server listens) → 回环接口; every side → 每一侧, the street side → 临街的一侧; listen / listening on → 监听; publish → 发布 (L4); forwards → 转发; tunnel → 隧道; door → 门 (a door in the laptop wall → 笔记本墙上的一扇门; these doors face your Wi-Fi too → 这些门也朝着你的 Wi-Fi); knock → 敲门; dial → 拨, ring → 打给; a name → 名字 (dials the database by name → 按名字拨数据库; dial names, not IP addresses → 拨名字，不要拨 IP 地址); Docker DNS stays, a phone book on each street → 每条街上的一本电话簿 (L4''s 电话簿); IP address → IP 地址; the three port bands → 三段 (the low ones → 低段, the middle band → 中段, the top band → 高段, throw-away ports for outgoing calls → 出站连接用的临时 port); prefix (127.0.0.1 before the host port) → 前缀. origin stays (the page''s origin → 页面的 origin; named origins → 指定的 origin; An origin is scheme, host and port → 一个 origin 由协议、主机和 port 组成); crosses origins / cross-origin calls → 跨域 / 跨域调用; CORS stays; preflight → 预检请求 (MDN; the English line says preflight); the Origin header → Origin 请求头; guest list → 白名单 (publish.description_zh says CORS 白名单); a pass → 通行证; the bouncer → 保安; no pass, no query → 没有通行证，就没有查询; enforced by the browser, configured by the server, keyed on the page''s origin → 由浏览器执行，由服务器配置，按页面的 origin 判断; the browser is the integrator → 浏览器负责把一切串起来 (chapter title 浏览器才是集成者).'
- '[A14] The RAG, agent and model words, as L5, L6 and L8. chunk stays (a chunk, 24 个 chunk), chunking → 分块, chunks, embeds and loads → 分块、向量化、加载, the embed step → 向量化这一步 (never embed alone opening a sentence), embedding stays (the model, the call, the vector: embedding 模型, embedding 调用, a list of 256 numbers, the embedding → 一个 256 个数的列表，也就是 embedding), collection stays (two collections → 两个 collection; pick a collection → 选一个 collection), char split / recursive split → char-split / recursive-split (the CLI values, as L5), the char split collection → char-split-collection; overlap → 重叠, paragraph and word breaks → 段落和单词之间的断点; the vector database → 向量数据库, the database → 数据库, the loader → 加载器 (the llm-rag CLI container), Chroma / ChromaDB as the SAY says; nearest chunks → 最近的 chunk; the author filter → 作者过滤; agent stays (the cheese expert agent → 奶酪专家 agent; the agent tools file → agent 工具文件); tool → 工具, retrieval tool → 检索工具, search by author / search by content → 按作者搜索 / 按内容搜索, the fun fact tool → 趣闻工具, a highlighted fun fact paragraph → 一段高亮的趣闻; generation calls → 生成调用; loops up to five times → 最多循环五次; Gemini stays; endpoint stays (L8: the endpoint your fine-tuning run printed → 你在第 8 讲微调时打印出来的 endpoint; the endpoint path → endpoint 路径; an unprotected AI endpoint → 一个没有保护的 AI endpoint); fine-tuned / tuned model → 微调过的模型; location → 区域 (L6; the U S location → us 区域); the server reloads by itself → 服务器会自己重新加载; not watched → 没有被监视.'
- '[B1] Spacing. One half-width space between Chinese and Latin letters, digits or artifacts (输入 exit, port 9000, 403, 256 个数, 第 14 行, /secrets 里, 录制时是 1.0.0, Next.js 14.2.4, 2026 年 10 月 8 日). The checker reports a missing space on every displayed sentence. Spaces inside an artifact stay as they are (docker compose down, sh docker-shell.sh); never add one inside an artifact. No space next to full-width punctuation (……localhost:9000/docs。, 是 403，). Never fake a no-break space with U+00A0 / U+202F.'
- '[B2] Punctuation. Full-width ，。、；：？！“”…… in Chinese text, also next to artifacts (输入 exit。). Lists use 、 (项目、账号的邮箱、令牌地址). Terminal text keeps its own form (200 OK, Name or service not known, pull access denied), copied as printed. No brackets of any kind, neither （） nor () nor 《》 nor 【】 nor [] nor <>: the checker rejects them on a line with no say:, and the bilingual band needs no gloss. ‹instructor› is never written in a subtitle (A10). “” only for a quoted thought or word in Chinese; artifacts, labels and tag names are never quoted. No 。？！ inside one Chinese sentence (one per English sentence): use ，；： instead (a two-part question becomes one question: /secrets 里有什么，第一次 embedding 调用又会怎样？ is written 这时 /secrets 里有什么，……). Questions keep ？.'
- '[B3] Symbols the checker rejects (= < > + → ← ^ ≤ ≥ × ÷ ≈, == != +=, a digit followed by !, brackets, letter_letter): never copied into the Chinese line; written the way the narration says them (A6). Allowed and kept as on screen: / in paths (/secrets, cheese-app-v0/secrets, localhost:9000/docs, localhost:3200/finetunechat), . in file names, versions and addresses (llm-service-account.json, .json.json, Pipfile.lock, Next.js, 0.0.0.0, 127.0.0.1), : inside an address or a port mapping (localhost:8000, -p 3200:3000), - in flags and names (--rm, -v, set -e, Ctrl-C, char-split), & in the console label IAM & Admin, # is written 井号.'
- '[C1] Numbers in display text. Arabic digits for everything that echoes the screen, the terminal, the code or the slides: counts (11 本书, 24 个 chunk, 8248 个, 14228 个 without a thousands separator, 170 个包, 773 个包, 10 段原文 / 10 个最近的 chunk, 256 个数, 5 步, 3 到 7 次生成调用, 最多 200 个字符, 700 万个字符), ports and addresses (80, 443, 3000, 3200, 3300, 8000, 9000, 0.0.0.0, 127.0.0.1), status codes (200, 401, 403, 500), line numbers (第 4 行, 第 8 行, 第 14 行), versions (1.0.0, 14.2.4), the date (2026 年 10 月 8 日), the README and app steps (第 1 步 … 第 5 步; 5 步里的第 1 步), lecture numbers (第 8 讲). Chinese numerals for small narrative counts the screen does not show as digits: 三次调用, 三个小谜题, 两个数字, 两条街道, 三个服务, 三个位置, 两个角色, 两个文件系统, 两个地址, 两个 collection, 三段, 两条警告, 四条规则, 一个因素, 一小时, 大约三分钟, 往上爬两级, 第一 / 第二 / 第三, 第一个调用 / 第二个 / 第三个, 五道自测题, 第一题 … 第五题, 第一部分 / 第二部分, 六节 (the README''s six sections), 最多循环五次. When the English uses a word for a number the screen shows as a digit, follow the screen (ten book passages, shown as 10 GREY rows → 10 段书里的原文; ten references → 10 条参考来源).'
- '[C2] Units, versions and dates. Versions with their name or with 录制时: ChromaDB 1.0.0 (its version: 1.0.0, at the time of recording → 它的版本：录制时是 1.0.0), Next.js 14.2.4 (version 14.2.4 at the time of recording → 录制时版本是 14.2.4). Durations: 大约一小时, 大约三分钟, 一小时有效. Characters: 大约 700 万个字符, 最多 200 个字符. Dates: from October 8th, 2026 → 2026 年 10 月 8 日的. Status codes as digits with 返回 / 报 / 一个: 返回 403, 报 500, 一个 401.'
- '[D1] Sentence alignment (explainer/i18n.py). One entry per SAY line of script.md in narration/*.yaml (90 blocks); `en` byte-equal to the SAY line; `zh` has exactly one item per English sentence as split by explainer.voice.split_sentences (382 in this script). Restructure only inside a sentence; never merge or split. Short sentences keep their own item: No. → 不会。 (S14); The path. → 是路径。 (S08); One small gap. → 有一个小疏漏。 (S02); Two notes on the slides. → 关于课件，说两点。 (S03); Pause and look. → 暂停一下，看一看。; Now the proof. → 现在来证明。 (S10); Which one? → 哪一个？ (S04); Remember this shape. → 记住这个套路。 (S05); One server, two addresses. → 一个服务器，两个地址。 (S10, S11); Time to type. → 该动手敲了。 (S02). Run python -m explainer.i18n check videos/ac215-l10-cloud-connect --lang zh until it prints OK.'
- '[D2] No say:, no anchors. There is no Chinese voice: never write say: (the display line is the only text) and never write anchors: (they only place animation beats for a Chinese-voiced render). The subtitles are timed by the English audio; the toolkit pairs each Chinese sentence with its English sentence by position.'
- '[D3] A checker-clean display line. With no say:, every displayed sentence must pass explainer.i18n.spoken_problems: no brackets (B2), no maths symbols (B3), no letter_letter names (A6), no digit followed by !, no clause ending in 种 followed by ，。！？, a half-width space between Hanzi and Latin or digits (B1), each sentence ending in 。！？ or …… (optionally followed by ” or 」), and every Latin word in this glossary (zh_subtitle, first_use or allowed_spoken_latin). The checker cuts words with the regex [A-Za-z][A-Za-z''.-]*: cheese-app-v0 is cheese-app-v, x86 is x, aarch64 is aarch, localhost:9000/docs is localhost and docs, -p 3200:3000 is p, set -e is set and e, llm-rag-chromadb:8000 is llm-rag-chromadb, Next.js is Next.js. A Latin word it reports is either an English word to translate (the usual case) or a missing artifact: add the artifact to allowed_spoken_latin, cut the same way, and to the matching term.'
- '[D4] The English line (en_display). In the bilingual band the English line shows the SAY sentence, which spells artifacts out for the voice. Every such sentence gets an en_display item with the literal on-screen form, otherwise word for word the SAY sentence; null for the other sentences of the block. Table (SAY → en_display): The flag dash p, 3200 colon 3000 → The flag -p 3200:3000; dash p, 3200 colon 3000 → -p 3200:3000; localhost 9000 / localhost 8000 / localhost 3000 / localhost 3200 → localhost:9000 / localhost:8000 / localhost:3000 / localhost:3200 (also in the ponder and recap questions); localhost 9000 slash docs → localhost:9000/docs; localhost 3200 slash finetunechat → localhost:3200/finetunechat; llm-rag-chromadb, port 8000 → llm-rag-chromadb:8000; llm-service-account, at your project → llm-service-account@your-gcp-project.iam.gserviceaccount.com (the badge''s text); llm-service-account dot json → llm-service-account.json; dot json dot json → .json.json; slash secrets → /secrets; cheese-app-v0 slash secrets → cheese-app-v0/secrets; slash data → /data; a dash v flag → a -v flag; The Google application credentials variable → The GOOGLE_APPLICATION_CREDENTIALS variable; the GCP project variable → the GCP_PROJECT variable; a default credentials error → a DefaultCredentialsError; with char split / with recursive split → with char-split / with recursive-split; the char split collection → the char-split-collection; for char split / for recursive split → for char-split / for recursive-split; set dash e → set -e; Type uvicorn server → Type uvicorn_server; local, localhost 3000 → Local: http://localhost:3000; dash dash rm → --rm; press control C → press Ctrl-C; IAM and Admin → IAM & Admin; the sign in with Google flow → the Sign in with Google flow; a JSON web token → a JSON Web Token; in the U S location → in the us location; Storage Admin and the role names stay as they are. The x86 of S05 stays x86 (the SAY''s word; the screen prints x86_64). The commas the SAY puts around a spelled command for the voice (dash p, 3200 colon 3000,) are dropped in en_display. The English video''s own .srt is unaffected.'
- '[D5] Content parity. Each Chinese sentence translates its English sentence and nothing more: no added commands, flags, glosses, Chinese console names or explanations; 额外 only where the English marks an extra; no Chinese gloss of a kept-English term (the English line is right below). The licensed changes: writing an artifact as the screen shows it where the SAY shortens or spells it (A5, A6, D4), and the instructor rule (A10).'
- '[D6] Fixed patterns (L9''s, extended). Pause and run it. → 暂停一下，自己跑一遍。 Pause and run both. → 暂停一下，两条都跑一遍。 Pause and do it. → 暂停一下，照着做。 Pause, and clone it. → 暂停一下，把它 clone 下来。 Pause and create yours. → 暂停一下，建一个你自己的。 Pause and make yours. → 暂停一下，做一个你自己的。 Pause and match it. → 暂停一下，把你的也摆成这样。 Pause and edit it. → 暂停一下，改好它。 Pause and make that edit in your editor → 暂停一下，在你的编辑器里改好 Pause and look. → 暂停一下，看一看。 Pause and try both. → 暂停一下，两个都试试。 Pause, pick a collection, and ask one. → 暂停一下，选一个 collection，问一个问题。 Pause, pick a collection, and ask it something. → 暂停一下，选一个 collection，随便问它点什么。 Pause and paste yours. → 暂停一下，贴上你自己的。 Pause and try it → 暂停一下，试一试 Pause, and leave your machine clean. → 暂停一下，把你的机器收拾干净。 A yellow your-turn tag means pause and run it, and a gray extra tag marks a check that is not in the README. → 看到黄色的 your turn 标签，就暂停，自己跑一遍；灰色的 extra 标签表示这个检查 README 里没有。 every command in this scene is an extra → 这一段的每条命令都是额外的 an extra / as an extra → 额外跑一下 / 作为额外步骤 / 额外检查. Something to ponder. → 来想一个问题。 Something to ponder: → 来想一个问题： A gold tag first. → 先看一个金色标签。 A gold tag: → 金色标签： A final gold tag: → 最后一个金色标签： at the time of recording → 录制时 Every command is in the study guide, linked below. → 每条命令都在学习指南里，链接在下方。 5 questions to test yourself. → 五道自测题。 One: … Five: → 第一题：…… 第五题： Answers are in the exercises, commands in the study guide. → 答案在练习里，命令在学习指南里。 Next lecture: → 下节课： Time to type. → 该动手敲了。'
- '[D7] Files. narration/g1.yaml = S01-S09 (part 1: service accounts, the key and the mount, the vector DB, ADC, IAM, the API), narration/g2.yaml = S10-S15 (part 2: addresses, the frontend and its ports, CORS, the agent and the tuned model, persistence, shutdown and recap), the parts of video.yaml; each starts with a comment header (what it covers, the rules it applies: A6 described artifacts, D4 en_display, A10 the instructor rule, no say:/anchors) and keeps the script order. Strings in double quotes; YAML-escape a literal double quote or backslash.'
- '[D8] Length on the English timing. The Chinese is read while the English is heard, and the band switches where the English pieces switch (a Chinese piece that would read faster than 9 units a second gets at most 1 s more). Keep each Chinese sentence about as long to read as the English is to hear: as a rule of thumb at most about 2 units per English word (a CJK character 1, a Latin character 0.55), so cut filler connectives and repeated subjects, never content. Long artifacts count (Gemini Enterprise Agent Platform User is about 20 units, llm-service-account.json about 13, localhost:3200/finetunechat about 15, docker network connect about 12): do not repeat them where the English does not.'
- '[G1] Widths. Bilingual band: a Chinese line holds at most 30 units, the English line 96 characters; the Chinese-only sidecar (.zh.srt) holds 22 units a line, 2 lines a cue. Write clauses of at most about 24 units, separated by ，；：, so the splitter has clean places to cut; avoid a clause longer than 30 units with no punctuation. The long role name gets its own clause (……两个角色：Storage Admin，和 Gemini Enterprise Agent Platform User。).'
- '[G2] Cue endings: the toolkit drops a cue-final 。，、；： and keeps ？！…… and a closing ” (subtitles.strip_end). Do not end a sentence on an artifact plus a full stop if a Chinese word can close it (……放在 secrets 目录里。 reads better than ……secrets。).'
- '[G3] Commands are never broken. The splitter treats a space between two Latin words in a Chinese line as a good cut, so docker compose down or docker network connect can land on two lines, which a viewer cannot copy. Put a whole command at the end of a clause after a full-width colon (README 的停止命令：docker compose down。; 然后输入 exit。), at most one command per cue, with little Chinese around it. A command that does not fit one line or contains A6 characters is described in its parts, as the SAY does (the README''s inspect-or-create network command → README 那条先检查、不存在再创建的命令; the docker exec probes → 从 API container 里面按名字问数据库). Check every cue with a command in the rendered .zh.srt.'
- '[H1] Titles (meta.yaml). Video, part and chapter titles in the written register (A4: 容器, 镜像, 仓库, 端口, 存储桶, 数据卷, 服务账号（Service Account）, 应用默认凭据（ADC）, 智能体（agent）); questions keep their question mark; the English colon structure is kept; commands, tools, file names and status codes stay as they are (localhost, -p, IAM, CORS, Docker DNS, bearer token, JSON, 403); meta.yaml is not checked, so brackets are fine there. The video title agrees with video.yaml''s publish.title_zh (连接云端：Service Account 认证、Docker 网络与 CORS) in the series pattern AC215 · 第 n 讲：…（跟练：…）. The core-concept chapters carry the English short name for search: 给代码一个身份：服务账号（Service Account）, 应用默认凭据（ADC）：从密钥文件到 bearer token, 浏览器才是集成者（CORS）. The scene that shares an English title with L1-L9 shares its Chinese (Tear down, recap, and what''s next → 收尾、回顾和下节预告). No title names the instructor (A10).'
- '[H2] Description (Bilibili / YouTube): two or three sentences: this is the AC215 lecture 10 follow-along of dlops-io/cheese-app-v0; what the viewer does and learns (a service account and its JSON key in secrets/ outside every repo, the bind mount from the host path to /secrets, ADC''s three places and the key-to-bearer-token exchange, the IAM cell behind a 403, three containers on Docker networks, container names vs localhost and the two numbers of -p 3200:3000, the api-service script''s network abort and its fix, three cross-origin calls and the CORS allow-list, what survives docker compose down, buckets next); English narration with Chinese and bilingual subtitles, every README command verbatim and in order, captures dated 2026-10-19/20 on a machine without a Google account (the cloud successes are shown as recorded, with their sources), the Vertex AI calls bill the viewer''s project (gold tags, a full shutdown checklist). Written register, terms of this glossary; consistent with video.yaml''s publish.description_zh, but with no instructor name (A10).'
- '[H3] Companions: i18n/zh/README.md (and exercises.md / digest.md if made) are translated with this glossary in the written register (容器, 镜像, 仓库, 克隆, 提交, 端口, 存储桶, 绑定挂载, 数据卷, 服务账号（Service Account）, 密钥, 应用默认凭据（ADC）, 访问令牌, 身份验证, 授权, 跨源资源共享（CORS）, 预检请求, 嵌入向量（embedding）, 集合（collection）, 智能体（agent）); brackets and underscores are fine there (not checked). Headings and <summary>答案</summary> are translated. A term table at the end: English | the term used here | common variants (服务帐号 / 服务账户, 应用默认凭证, 访问令牌 / access token, 不记名令牌 for bearer token, 认证 for authentication, 源 for origin, 跨域资源共享 for CORS, preflight for 预检请求, 绑定挂载, 卷 / 数据卷, 存储桶 / bucket, 端点 / 接入点 for endpoint, 智能体).'
- '[H4] Code and commands stay byte-identical in the companions: code blocks, commands, file names and inline `code` are unchanged; only # comments and the prose around them are translated.'
- '[I1] (request, open since L3) explainer.i18n check applies its voice hygiene (_SPOKEN_BAD: brackets, maths symbols, letter_letter names) to the display line when a sentence has no say:. For a subtitles-only video (this series; video.yaml has no languages.zh.voice and this glossary says voice: none) those checks guard nothing and force A6 and B3. Proposal: skip _SPOKEN_BAD for display-only sentences when the glossary''s voice is none (keep the Latin-word, spacing and sentence-end checks). Then A6 shrinks to the literals: GCP_PROJECT, GOOGLE_APPLICATION_CREDENTIALS, uvicorn_server, x86_64.'
- '[I2] (todo, from L1 I3) explainer/subtitles.py''s _cuts treats a space between Latin words in a Chinese line as a good cut, so commands can be split (G3). Proposal: in a Chinese line, treat a run of Latin tokens separated only by spaces as unbreakable unless it alone exceeds a line.'
terms:
# ---------------------------------------------------------------- S01: the hook, the riddles, the follow-along
- en: 'cheese chatbot / an answer / ten book passages / references / how Tolminc cheese is made'
  zh_subtitle: '奶酪聊天机器人 / 回答 / 原文 / 参考来源 / Tolminc 奶酪'
  first_use: 'S01[0]：答案出来了，附带 10 段书里的原文作为参考来源。'
  note: 'A1 b: Tolminc stays, capitalized. ten book passages (on screen as 10 GREY rows) → 10 段书里的原文 (C1). No answer text is ever shown; never invent one.'
- en: 'three calls / call / a Python server on port 9000 / a database on port 8000 / Google does the heavy lifting'
  zh_subtitle: '三次调用 / 调用 / Python 服务器 / port 9000 / 数据库 / port 8000'
  first_use: 'S01[1]：其中两次打到 port 9000 上的一个 Python 服务器，一次打到 port 8000 上的一个数据库。'
  note: 'Behind both server calls, Google does the heavy lifting → 这两个服务器调用的背后，都是 Google 在干重活. Call one / two / three (S12) → 第一个调用 / 第二个调用 / 第三个调用 (C1).'
- en: 'who checks that it is really you / a web page finds a database inside a container'
  zh_subtitle: '网页 / 谁来确认'
  first_use: 'S01[1]：那么，谁来确认真的是你？'
  note: 'The hook question; kept as a question (B2).'
- en: 'riddles / three small riddles / the flag dash p, 3200 colon 3000 / two numbers / which machine is that / only a name / where is its address'
  zh_subtitle: '小谜题 / -p 3200:3000 / 两个数字 / 哪台机器 / 名字 / 地址'
  first_use: 'S01[2]：参数 -p 3200:3000 里有两个数字，为什么？'
  note: 'A5: an artifact never opens a sentence (参数 -p 3200:3000……; 这里的 localhost:9000，指的是哪台机器？; 而 llm-rag-chromadb 只是一个名字，它的地址在哪儿？). D4: dash p, 3200 colon 3000 → -p 3200:3000; localhost 9000 → localhost:9000. once anything can knock, who is allowed in → 既然谁都能来敲门，谁才能进来.'
- en: 'follow along / your clone of cheese-app-v0 / Docker Desktop / a Google Cloud project with billing'
  zh_subtitle: '跟着做 / cheese-app-v0 / Docker Desktop / 开通了结算的 Google Cloud 项目'
  first_use: 'S01[3]：跟着做，你需要自己 clone 的 cheese-app-v0、Docker Desktop，以及一个开通了结算的 Google Cloud 项目。'
  note: 'billing → 结算, the act of billing → 计费 (L4).'
- en: 'real, paid calls / Vertex AI / a gold tag / shutting everything down / bills your project / the current pricing page'
  zh_subtitle: '付费调用 / Vertex AI / 金色标签 / 关掉 / 计费 / 价目页'
  first_use: 'S01[3]：这一讲会真的发起付费的 Vertex AI 调用；每一处都有金色标签标出，视频最后会把一切都关掉。'
  note: 'A11: the GOLD cost tag is named by its colour (金色标签); its English text stays on screen. That bills your project; check the current pricing page → 这会向你的项目计费；请查看当前的价目页.'
- en: 'the tracker in the top left / the README''s six sections / the yellow your-turn tag / a gray extra tag / the study guide'
  zh_subtitle: '进度条 / 六节 / your turn 标签 / extra 标签 / 学习指南'
  first_use: 'S01[3]：看到黄色的 your turn 标签，就暂停，自己跑一遍；灰色的 extra 标签表示这个检查 README 里没有。'
  note: 'A11, D6, as L2-L9. The tracker in the top left follows the README''s six sections → 左上角的进度条跟着 README 的六节走 (节 for a README section, A7).'
# ---------------------------------------------------------------- S02: the map
- en: 'the map / house / your laptop is one house / loopback address / localhost / always means this machine'
  zh_subtitle: '地图 / 房子 / 回环地址 / localhost / 这台机器'
  first_use: 'S02[0]：你的笔记本是一栋房子，每栋房子都有自己的回环地址 localhost，它永远指这台机器。'
  note: 'A13. Each house lights up when its container starts → 每个 container 启动时，它那栋房子就会亮起来. laptop → 笔记本 (L5).'
- en: 'street / two private streets / one per network / network / the public street'
  zh_subtitle: '街道 / 私有的街道 / 网络 / 公共街道'
  first_use: 'S02[0]：Docker 在里面铺了两条私有的街道，一个网络一条。'
  note: 'A2, A7: 网络 is the Docker network, 街道 its picture; on any street / on its street → 在任何一条街上 / 在它那条街上.'
- en: 'service / three services / the vector database with its loader / the API server / the web frontend'
  zh_subtitle: '服务 / 向量数据库 / 加载器 / API 服务器 / 前端'
  first_use: 'S02[0]：会有三个服务站在这些街上：向量数据库和它的加载器、API 服务器，还有网页前端。'
  note: 'loader → 加载器 (the llm-rag CLI container that chunks, embeds and loads, A14). the frontend → 前端.'
- en: 'the laptop floor / outside every street / Google''s building / a guarded door / who calls whom'
  zh_subtitle: '地面 / Google 的大楼 / 有人把守的门 / 谁打给谁'
  first_use: 'S02[1]：公共街道对面是 Google 的大楼，门口有人把守。'
  note: 'Your browser stands on the laptop floor, outside every street → 你的浏览器站在笔记本的地面上，不在任何一条街上. The API never talks to the database; the README says so itself → API 从不和数据库说话，README 自己就是这么写的. Part 2 shows why → 第二部分会讲为什么 (A7).'
- en: 'prerequisites / have Docker installed / clone this repository / the repo''s address / Time to type'
  zh_subtitle: '前置条件 / 装好 Docker / 仓库 / repo 地址'
  first_use: 'S02[2]：README 的前置条件很短：装好 Docker，再 clone 这个仓库。'
  note: 'A4: the README''s repository → 仓库 (quoting it). The README gives no address, so here is the repo''s address → README 没给地址，所以这里给出 repo 的地址 (L9). Pause, and clone it → 暂停一下，把它 clone 下来 (D6).'
- en: 'git log / the commit this video uses / October 8th, 2026 / if yours is newer, details may differ'
  zh_subtitle: 'git log / commit / 2026 年 10 月 8 日'
  first_use: 'S02[3]：额外跑一下 git log，可以看到这个视频用的 commit，日期是 2026 年 10 月 8 日；你的要是更新，细节可能不一样。'
  note: 'C2. An extra git log → 额外跑一下 git log (A11).'
- en: 'an extra listing / llm-rag / api-service / frontend-ai-chatbot / one folder per house'
  zh_subtitle: 'llm-rag / api-service / frontend-ai-chatbot / 目录'
  first_use: 'S02[3]：再额外列一下目录：llm-rag、api-service 和 frontend-ai-chatbot，一栋房子一个目录。'
  note: 'Folder names verbatim (A1 a); folder → 目录 (L1).'
- en: 'One small gap / a hosted version / a web server on a cloud machine / deleted from the repo / the local version'
  zh_subtitle: '小疏漏 / 托管版本 / Web 服务器 / 云端机器 / 本地版本'
  first_use: 'S02[4]：这个应用自己的主页上，动画演示的是一个托管版本，Web 服务器跑在一台云端机器上。'
  note: 'A9: One small gap. → 有一个小疏漏。 this map draws exactly what you run → 这张地图画的正是你跑的东西.'
# ---------------------------------------------------------------- S03: an identity for code
- en: 'identity / service account / an identity for software / Code wears it / no login screen'
  zh_subtitle: '身份 / 服务账号 / 登录界面'
  first_use: 'S03[0]：服务账号就是给软件用的身份。'
  note: 'A3: 服务账号 (L1-L5; never 服务帐号; titles add （Service Account）, A4). The second prerequisite creates an identity, but not for you → 第二个前置条件是创建一个身份，但不是给你用的. Code wears it to call Google → 代码戴着它去调用 Google.'
- en: 'badge / its email / llm-service-account, at your project'
  zh_subtitle: '工牌 / 邮箱 / llm-service-account'
  first_use: 'S03[0]：它的邮箱就像这张工牌：llm-service-account，后面是你的项目。'
  note: 'D4: llm-service-account, at your project → llm-service-account@your-gcp-project.iam.gserviceaccount.com (the badge''s text; the @ address is never written in the Chinese line). The badge is this video''s picture (policy 4).'
- en: 'API key / a metered public call / OAuth / an app acting for a consenting user / the sign in with Google flow'
  zh_subtitle: 'API key / OAuth / 按量计费的公开调用 / 用 Google 账号登录'
  first_use: 'S03[1]：按量计费的公开调用用 API key。'
  note: 'A3. An app acting for a consenting user gets OAuth, the sign in with Google flow → 替一个同意授权的用户办事的应用，用 OAuth，也就是用 Google 账号登录的那套流程. D4: Sign in with Google.'
- en: 'federation / code outside Google / vouch / GitHub Actions / a laptop has nobody / the course hands you a key file'
  zh_subtitle: '身份联合 / 担保 / GitHub Actions / 密钥文件'
  first_use: 'S03[1]：规则最后一行说，Google 之外的代码应该用身份联合。'
  note: 'That needs someone to vouch for your code, as GitHub does for code in GitHub Actions → 这需要有人为你的代码担保，就像 GitHub 为 GitHub Actions 里的代码担保那样. A laptop has nobody → 笔记本没有人来担保.'
- en: 'IAM and Admin / Service accounts / create one named llm-service-account'
  zh_subtitle: 'IAM & Admin / Service accounts'
  first_use: 'S03[2]：打开 IAM & Admin，再进 Service accounts。'
  note: 'Console labels verbatim (A1 a, D4: IAM and Admin → IAM & Admin). Create one named llm-service-account → 建一个，名字叫 llm-service-account.'
- en: 'role / two roles / bundles of permissions / grant / Storage Admin / Gemini Enterprise Agent Platform User'
  zh_subtitle: '角色 / 权限 / 授予 / Storage Admin / Gemini Enterprise Agent Platform User'
  first_use: 'S03[2]：给它授予两个角色，也就是权限的集合：Storage Admin，和 Gemini Enterprise Agent Platform User。'
  note: 'A3. Role names as the console shows them (A1 a); the long one gets its own clause (G1). Your service account holds the Gemini user role (S08) → 你的服务账号持有 Gemini 用户这个角色.'
- en: 'Vertex AI User / formerly called / the same role underneath'
  zh_subtitle: 'Vertex AI User / 以前叫'
  first_use: 'S03[2]：第二个角色以前叫 Vertex AI User，本质上还是同一个角色。'
  note: 'As L5 and L8.'
- en: 'the slides / the slides'' demo account / next week''s / rides along from the fine-tuning lecture / least privilege'
  zh_subtitle: '课件 / 演示账号 / 最小权限 / 微调那一讲'
  first_use: 'S03[3]：课上的规则是最小权限，意思是只给你需要的权限，照它来会授予得更少；第二部分还会回到这一点。'
  note: 'A10. Two notes on the slides. → 关于课件，说两点。 The slides'' demo account, with one storage role, is next week''s → 课件里那个只有一个存储角色的演示账号，是下周的. that role rides along from the fine-tuning lecture → 那个角色是从微调那一讲带过来的. Grant both anyway, as the README says → 不过两个都要授予，照 README 说的做.'
- en: 'key / JSON key / the account''s Keys tab / add a key / choose JSON / a file downloads'
  zh_subtitle: '密钥 / JSON 密钥 / KEYS 标签页 / JSON'
  first_use: 'S03[4]：在这个账号的 KEYS 标签页添加一个密钥，选 JSON，就会下载一个文件。'
  note: 'A3: 密钥 (L3-L5), never key. The tab label as the console drawing shows it (KEYS, L5). Pause and make yours → 暂停一下，做一个你自己的 (D6).'
- en: 'your project / the account''s email / a token address / a private key / the whole secret'
  zh_subtitle: '项目 / 邮箱 / 令牌地址 / 私钥'
  first_use: 'S03[4]：里面有你的项目、这个账号的邮箱、一个令牌地址，还有一个私钥。'
  note: 'That private key is the whole secret → 这个私钥就是全部的秘密.'
- en: 'one factor / something you have / works anywhere / no second step / until deleted or disabled / like a password, never like config'
  zh_subtitle: '因素 / 你持有的东西 / 密码 / 配置'
  first_use: 'S03[4]：把这个文件当密码看待，绝不要当配置。'
  note: 'It is one factor, something you have: it works anywhere, with no second step, until deleted or disabled → 它只是单一因素，属于你持有的东西：在哪儿都能用，不需要第二步，直到被删除或停用.'
# ---------------------------------------------------------------- S04: two filesystems, one folder
- en: 'secrets folder / the API''s script answers on line 8 / climbs up twice / beside the repo, not inside it'
  zh_subtitle: 'secrets 目录 / 第 8 行 / 往上爬两级'
  first_use: 'S04[0]：它往上爬两级，落在 secrets 目录，就在 repo 旁边，而不是里面。'
  note: 'The README says to copy the key into a secrets folder. Which one? → README 说把密钥复制到一个 secrets 目录。哪一个？ The path starts where you run it, in api-service → 路径从你运行它的地方开始，也就是 api-service.'
- en: 'dash v flag / mounts / host folder / slash secrets / inside the container / the portal / two filesystems, one folder'
  zh_subtitle: '-v 参数 / 挂载 / 宿主机目录 / /secrets / 传送门 / 文件系统'
  first_use: 'S04[1]：接着，一个 -v 参数把这个宿主机目录挂载到 container 里的 /secrets。'
  note: 'A2. D4: a dash v flag → a -v flag; slash secrets → /secrets. that variable only makes sense after the mount → 这个变量只有在挂载之后才有意义.'
- en: 'the Google application credentials variable / tells Google''s library where the key is / a path inside the container'
  zh_subtitle: 'Google application credentials 这个变量 / Google 的库 / container 里的路径'
  first_use: 'S04[1]：Google application credentials 这个变量告诉 Google 的库密钥在哪儿，它指向 /secrets，一个 container 里的路径。'
  note: 'A6: GOOGLE_APPLICATION_CREDENTIALS is never written; the English line has it (D4). Later mentions: 这个变量.'
- en: 'the loader''s compose file / builds the same portal / up two levels / the lecture''s slide climbs only once / count the climbs'
  zh_subtitle: 'compose 文件 / 往上两级 / 数清往上爬了几级'
  first_use: 'S04[2]：加载器的 compose 文件从自己的目录出发，搭了同一个传送门：往上两级，同一个 secrets 目录。'
  note: 'Always count the climbs from where the script sits → 永远从脚本所在的位置开始，数清往上爬了几级. its repos sit one level shallower → 它的 repo 浅一层.'
- en: 'make the folder / move the download in / rename it llm-service-account dot json / hidden extensions / dot json dot json / tree view / the README''s layout'
  zh_subtitle: 'llm-service-account.json / 隐藏的扩展名 / .json.json / tree / 目录结构'
  first_use: 'S04[3]：检查一下名字：隐藏的扩展名可能让它变成 .json.json。'
  note: 'D4: llm-service-account dot json → llm-service-account.json; dot json dot json → .json.json. An extra tree view shows the README''s layout → 额外用 tree 看一下，是 README 里的目录结构. Pause and match it → 暂停一下，把你的也摆成这样 (D6).'
- en: 'a quiet trap / the repo''s gitignore / no rule for secrets / nothing protects a key inside the repo'
  zh_subtitle: '陷阱 / .gitignore / 规则'
  first_use: 'S04[4]：接下来是一个不显眼的陷阱：这个 repo 的 .gitignore 里没有任何关于 secrets 的规则。'
  note: 'A7: 陷阱, not 疏漏 (the English calls it a trap).'
- en: 'Something to ponder / suppose / cheese-app-v0 slash secrets / the first embedding call'
  zh_subtitle: '来想一个问题 / cheese-app-v0/secrets / 第一次 embedding 调用'
  first_use: 'S04[5]：这时 /secrets 里有什么，第一次 embedding 调用又会怎样？'
  note: 'D6. A9: the question never says empty. D4: cheese-app-v0 slash secrets → cheese-app-v0/secrets.'
- en: 'Docker does not complain / silently creates that folder, empty / a default credentials error / file not found'
  zh_subtitle: '悄悄地 / 空目录 / DefaultCredentialsError / 找不到文件'
  first_use: 'S04[6]：所以 /secrets 是空的，第一次 embedding 调用会失败，报 DefaultCredentialsError：找不到文件。'
  note: 'The error class as printed (L3); a default credentials error → DefaultCredentialsError in both lines (D4). The cursor still climbs twice, to a folder that does not exist → 路径还是往上爬两级，爬到一个不存在的目录. Meanwhile your key sits in a git tree that nothing protects → 而你的密钥正躺在一个没有任何保护的 git 目录树里.'
# ---------------------------------------------------------------- S05: the network, the compose file, Chroma
- en: 'the Docker network / the README''s command inspects it quietly / creates it only if that fails / cheese-app-network'
  zh_subtitle: 'Docker 网络 / 检查 / 创建 / cheese-app-network'
  first_use: 'S05[0]：README 的命令先悄悄检查它，只有检查失败才创建。'
  note: 'G3: the long one-liner is never written in a subtitle; S09 calls it README 那条先检查、不存在再创建的命令. Last prerequisite: the Docker network → 最后一个前置条件：Docker 网络.'
- en: 'idempotent / safe to run twice / no error, no second network / Remember this shape'
  zh_subtitle: '幂等 / 套路'
  first_use: 'S05[1]：一条跑两次也安全的命令，叫作幂等的。'
  note: 'The standard Chinese term (幂等), what every Chinese backend engineer says. Remember this shape → 记住这个套路; the shape you met earlier (S09) → 前面见过的那个套路.'
- en: 'the GCP project variable / a default project that is not yours / your own project ID / the sed tool / any editor'
  zh_subtitle: 'GCP project 这个变量 / 项目 ID / sed / 编辑器'
  first_use: 'S05[2]：把 GCP project 这个变量改成你自己的项目 ID；我们用 sed，你用任何编辑器都行。'
  note: 'A6 (L5): GCP_PROJECT → GCP project 这个变量; the project variable (S08) → 同一个变量 / GCP project 这个变量. The scene''s our editor tag stays English (A11).'
- en: 'sh docker-shell.sh / Compose pulls Chroma / llm-rag-network / every service in this file joins it'
