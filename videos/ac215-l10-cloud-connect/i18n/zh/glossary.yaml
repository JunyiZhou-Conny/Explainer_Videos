  first_use: 'S11[2]：先预测一下：在你的笔记本上，localhost:3000 会有回应吗？'
  note: 'No, it fails to connect → 不会，连不上. the README suggests Chrome → README 建议用 Chrome.'
- en: 'the tunnel / host port 3200 forwards to container port 3000 / the Next server listens on 3000 / your browser knocks on 3200 outside'
  zh_subtitle: '隧道 / host port / container port / 转发 / 敲门'
  first_use: 'S11[3]：参数 -p 3200:3000 的意思是：host port 3200 转发到 container port 3000。'
  note: 'A13 (L4). That is the tunnel → 这就是隧道. An extra docker ps shows the same door → 额外跑一下 docker ps，能看到同一扇门.'
- en: 'three bands / the low ones belong to the system / 80 and 443 / the middle band / the top band / throw-away ports for outgoing calls'
  zh_subtitle: '三段 / 低段 / 中段 / 高段 / 临时 port'
  first_use: 'S11[4]：所有 port 号分成三段。'
  note: 'A13, A5 (a sentence never opens with port). Pick yours from the middle band → 你自己的从中段挑.'
- en: '0.0.0.0 / every side / the street side, not the loopback / a prefix / 127.0.0.1 before the host port / your Wi-Fi / anyone on that network can knock'
  zh_subtitle: '每一侧 / 临街的一侧 / 回环接口 / 前缀 / 127.0.0.1 / Wi-Fi'
  first_use: 'S11[5]：所以这些门也朝着你的 Wi-Fi，同一个网络上的任何人都能来敲门。'
  note: 'A13. 0.0.0.0 has now appeared twice, as two different facts → 0.0.0.0 已经出现两次了，说的是两件不同的事 (a number may open the sentence, A5). The ports lecture wrote 127.0.0.1 before its port, but this app writes none → 讲 port 的那一讲在 port 前面写了 127.0.0.1，这个应用却没写. Adding 127.0.0.1 before the host port closes that side → 在 host port 前面加上 127.0.0.1，就能关上那一侧.'
# ---------------------------------------------------------------- S12: the browser and CORS
- en: 'this setting / baked into the JavaScript your browser downloads / never a container name'
  zh_subtitle: '配置 / 打包进 / JavaScript'
  first_use: 'S12[0]：这个配置被打包进浏览器下载的 JavaScript 里，告诉页面 API 的地址。'
  note: 'L4: 打包进. So it must be one your browser can reach → 所以它必须是你的浏览器能访问到的地址.'
- en: 'Step 1 of 5 / text chunking / no bill / the database UI / Our extra listing is empty / yours shows two collections'
  zh_subtitle: '第 1 步 / 文本分块 / 数据库界面'
  first_use: 'S12[1]：5 步里的第 1 步是文本分块，在你的浏览器里跑，不产生费用。'
  note: 'A7, C1. Pause and try both → 暂停一下，两个都试试 (D6).'
- en: 'the chat / one embedding and one Gemini answer per question / pick a collection / Call one'
  zh_subtitle: '对话 / 第一个调用'
  first_use: 'S12[2]：暂停一下，选一个 collection，问一个问题。'
  note: 'L5: chat → 对话. Call one: the API asks Google, and 256 numbers come back → 第一个调用：API 去问 Google，拿回 256 个数.'
- en: 'origin / scheme, host and port / crosses origins / cross-origin'
  zh_subtitle: 'origin / 协议 / 主机 / 跨域'
  first_use: 'S12[3]：一个 origin 由协议、主机和 port 组成，所以来自 3200 的页面去调 8000，就是跨域。'
  note: 'A13. Call two asks the database for the 10 nearest chunks → 第二个调用向数据库要 10 个最近的 chunk.'
- en: 'By default, a browser will not let a page see replies from another origin / named origins / CORS / other websites'
  zh_subtitle: '回复 / 指定的 origin / CORS / 别的网站'
  first_use: 'S12[4]：服务器可以放行指定的 origin，这就是 CORS，它能防止别的网站读取你本地的服务。'
  note: 'A13. By default, a browser will not let a page see replies from another origin → 默认情况下，浏览器不让页面看到来自别的 origin 的回复.'
- en: 'preflight / with the page''s origin / its guest list / the course''s site / a pass, or nothing / the bouncer / no pass, no query'
  zh_subtitle: '预检请求 / 白名单 / 课程的网站 / 通行证 / 保安'
  first_use: 'S12[4]：你的浏览器就是保安：没有通行证，就没有查询。'
  note: 'A13: preflight → 预检请求 (MDN). So the browser first sends a preflight with the page''s origin → 所以浏览器先发一个预检请求，带上页面的 origin. The database checks its guest list, the course''s site and localhost 3200, and returns a pass, or nothing → 数据库查它的白名单，上面是课程的网站和 localhost:3200，然后返回一张通行证，或者什么都不给.'
- en: 'Call three / an extra curl writes its own Origin header / 200 OK / only 3200 gets a pass / to a browser, no pass is a refusal'
  zh_subtitle: '第三个调用 / Origin 请求头 / 200 OK / 拒绝'
  first_use: 'S12[5]：两个预检请求都拿到 200 OK，但只有 3200 拿到了通行证；对浏览器来说，没有通行证就是拒绝。'
  note: 'An extra curl writes its own Origin header → 额外用 curl 自己写一个 Origin 请求头.'
- en: 'You republish the frontend on port 3300 / Which of the three calls fails / does curl care'
  zh_subtitle: 'port 3300 / 重新发布'
  first_use: 'S12[6]：三个调用里哪一个会失败，curl 又在不在乎？'
  note: 'A9: the question never names call two. You republish the frontend on port 3300 → 你把前端重新发布到 port 3300.'
- en: 'Call one works: the API allows any origin / never leaves the browser / never sent / enforced by the browser, configured by the server, keyed on the page''s origin'
  zh_subtitle: '由浏览器执行 / 由服务器配置 / 按页面的 origin 判断'
  first_use: 'S12[7]：CORS 由浏览器执行，由服务器配置，按页面的 origin 来判断。'
  note: 'Call two never leaves the browser → 第二个调用根本出不了浏览器. And curl ignores it all → 而 curl 对这一切都不理会.'
- en: 'an answer and ten references, with book, author and distance / CORS decides which page may see a reply / who may call / an unprotected AI endpoint, spending your key'
  zh_subtitle: '书名 / 作者 / 距离 / AI endpoint'
  first_use: 'S12[8]：一个没有任何保护、用你的密钥花钱的 AI endpoint，正跑在你的笔记本上。'
  note: 'Last thought: CORS decides which page may see a reply; nothing here decides who may call → 最后想一点：CORS 决定的是哪个页面能看到回复；这里没有任何东西决定谁能调用.'
# ---------------------------------------------------------------- S13: the agent and the tuned model
- en: 'the cheese expert agent / with one twist / a retrieval tool / search by author / search by content / filtered by author'
  zh_subtitle: '奶酪专家 agent / 检索工具 / 按作者搜索 / 按内容搜索 / 按作者过滤'
  first_use: 'S13[0]：Gemini 先挑一个检索工具：按作者搜索，或者按内容搜索。'
  note: 'A14. Step 4 is the cheese expert agent: the chat''s three calls, with one twist → 第 4 步是奶酪专家 agent：还是对话的三个调用，只多了一个变化.'
- en: 'loops up to five times / a fun fact tool on the server / a highlighted fun fact paragraph'
  zh_subtitle: '最多循环五次 / 趣闻工具 / 趣闻'
  first_use: 'S13[1]：要看的是一个回答，结尾有一段高亮的趣闻。'
  note: 'The API loops up to five times, and Gemini may call a fun fact tool on the server → API 最多循环五次，Gemini 还可能调用服务器上的趣闻工具.'
- en: 'one agent question costs one embedding and three to seven generation calls'
  zh_subtitle: '生成调用 / agent 问题'
  first_use: 'S13[0]：金色标签：一个 agent 问题要花一次 embedding 调用，外加 3 到 7 次生成调用。'
  note: 'C1 (the gold tag shows the digits).'
- en: 'the fine-tuned cheese model / swap in your own endpoint / the one your fine-tuning run printed in lecture 8'
  zh_subtitle: '微调过的奶酪模型 / 第 8 讲'
  first_use: 'S13[2]：README 说要换成你自己的 endpoint，就是你在第 8 讲微调时打印出来的那个。'
  note: 'A10, A14: Step 5 is the fine-tuned cheese model → 第 5 步是微调过的奶酪模型 (the README heading, with the instructor''s name, is never written). Pause and paste yours → 暂停一下，贴上你自己的.'
- en: 'The server reloads by itself / this file sits under the api folder / the agent tools file / not watched / press control C'
  zh_subtitle: '重新加载 / api 目录 / agent 工具文件 / 监视 / Ctrl-C'
  first_use: 'S13[2]：服务器会自己重新加载，因为这个文件在 api 目录下面。'
  note: 'D4: control C → Ctrl-C (L9). Its neighbor, the agent tools file, is not watched → 它旁边的 agent 工具文件没有被监视.'
- en: 'localhost 3200 slash finetunechat / the part 1 puzzle / the default points into the instructor''s project'
  zh_subtitle: 'localhost:3200/finetunechat / 谜题 / 授课老师的项目'
  first_use: 'S13[3]：第一部分的那个谜题，在这里揭晓答案。'
  note: 'A10. With the default, the endpoint path points into the instructor''s project, where your account has no role, so you get a 403 → 用默认值的话，endpoint 路径指向授课老师的项目，你的账号在那里没有角色，所以你会拿到 403.'
- en: 'a second client / in the U S location / tuned models need it / billed to whichever project owns the endpoint'
  zh_subtitle: '第二个客户端 / us 区域 / 微调过的模型'
  first_use: 'S13[3]：这个调用还用了第二个客户端，位于 us 区域，因为微调过的模型需要它。'
  note: 'A14, D4: in the U S location → in the us location. A final gold tag: calls to a tuned model are billed to whichever project owns the endpoint → 最后一个金色标签：调用微调过的模型，费用记在拥有这个 endpoint 的项目上. without your own endpoint, expect the 403 → 没有你自己的 endpoint 的话，看到的会是 403.'
# ---------------------------------------------------------------- S14: what survives
- en: 'Time to shut down / press control C, then type exit / dash dash rm / only the database left'
  zh_subtitle: '关掉 / --rm'
  first_use: 'S14[0]：两个 container 都是用 --rm 跑的，所以额外跑一下 docker ps，只剩下数据库。'
  note: 'D4: dash dash rm → --rm. Time to shut down, and see what survives → 该关掉了，看看什么能留下来.'
- en: 'docker compose down / the README''s stop command / two warnings / variables are not set / Compose fills those blanks from your shell / caught in the wild'
  zh_subtitle: 'docker compose down / 警告 / 没有设置'
  first_use: 'S14[1]：两条警告说变量没有设置，因为我们是在 shell 脚本之外跑的这条命令，Compose 就用你 shell 里的值来填这些空。'
  note: 'L5. Now the README''s stop command, docker compose down, inside llm-rag → 现在是 README 的停止命令，在 llm-rag 里：docker compose down (G3).'
- en: 'are your embeddings gone too / what would make them gone'
  zh_subtitle: 'embedding'
  first_use: 'S14[1]：数据库没了，可你的 embedding 也没了吗？'
  note: 'A9: the question never says no.'
- en: 'the database file still on disk / the docker volumes folder / slash data / Containers come and go; mounted folders stay / an extra restart / deletes and then recreates each collection'
  zh_subtitle: '数据库文件 / docker-volumes 目录 / /data / 重新启动'
  first_use: 'S14[2]：一个个 container 来来去去，挂载的目录却留下来。'
  note: 'L5. No. → 不会。 Deleting the docker volumes folder is what loses your embeddings → 删掉 docker-volumes 目录，才会丢掉你的 embedding.'
- en: 'a storage bucket / a folder any authorized machine can see / name prefixes / the storage client takes no key path / a storage role'
  zh_subtitle: 'bucket / 前缀 / 存储客户端 / 存储角色'
  first_use: 'S14[3]：挂载目录的云端版本就是 bucket，一个任何有权限的机器都能看到的目录。'
  note: 'A3, A4 (L3): bucket in subtitles, 存储桶 in writing; prefix → 前缀. Its folders are only name prefixes → 它的目录其实只是名字前缀.'
- en: 'four rules / object admin, not full admin / keep buckets private / globally unique names / storage and downloads cost money / Storage Admin sat gray'
  zh_subtitle: '四条规则 / 对象管理员 / 私有 / 全球唯一'
  first_use: 'S14[4]：只授予对象管理员角色，不要给完整的管理员角色。'
  note: 'D5: the SAY does not name the role IDs, so neither does the Chinese. This app never calls a bucket, which is why Storage Admin sat gray → 这个应用从不调用 bucket，所以 Storage Admin 一直是灰的.'
