# Bilibili metadata for the release (tools/release_episode.py → PUBLISH.json → the Mac publish worker)
publish:
  title_zh: "AC215 第18讲跟练 · API 与前端：FastAPI 服务、简单网页和 React 应用，一步一步在本地跑起奶酪 App"
  description_zh: |
    哈佛 AC215（MLOps & LLMOps，2026 秋）第 18 讲教程的逐条命令跟练，照着 dlops-io/cheese-app-v1 和 cheese-app-v2 的 README 一步一步做：
    上半场（API）：先用 cheese-app-v1 在容器里用 uvicorn 跑起 FastAPI，讲清 server 与 app、0.0.0.0、--reload 和 -p 9000:9000，
    把一个 Python 函数变成 URL（/square_root、422、307、/docs），再用 http-server 提供静态网页；
    然后进入 cheese-app-v2：四个容器、一个 Docker network，把奶酪书的 14,356 个 chunk 载入 Chroma，
    启动 API，看懂 /healthz 与 /readyz、router 与 prefix、/api/docs，聊天记录怎样存成文件，最后跑通 pytest。
    下半场（前端）：为什么需要前端框架，用 Vite 跑 React 开发服务器，看懂 Vite proxy 怎样让浏览器只访问一个 origin、API 因此不需要 CORS；
    用 nginx 生产镜像（331 MB → 94.8 MB）、docker compose 一条命令启动整个 App，并完整清理；
    最后切到 2025 分支跑课件讲的 Simple Frontend，亲眼看 CORS preflight 和 307 重定向。
    对照课件逐页讲解：technical architecture、一次请求的逐跳路径、API 设计模式与 MCP、single-page app 与组件。
    录制当天仓库的 main 分支更新了两次，视频说明了跟随哪个 commit。边看边暂停，在自己的电脑上跑每一条命令；Gemini 调用需要你自己的 key。
    英文旁白，中英双语字幕。

    教程仓库：https://github.com/dlops-io/cheese-app-v1 · https://github.com/dlops-io/cheese-app-v2
    学习笔记（全部命令、真实输出和练习答案）：https://github.com/JunyiZhou-Conny/MLOps_Learning/blob/main/guides/L18-apis-frontend.md

    课程与教程内容来自 Harvard AC215 课程组（Pavlos Protopapas 等）；本视频是个人学习用的非官方讲解，引用课件只注明页码，不展示课件。
  tags_zh: [AC215, MLOps, FastAPI, React, Vite, Docker, CORS, nginx, 哈佛, 教程跟练]
  tid: 231
