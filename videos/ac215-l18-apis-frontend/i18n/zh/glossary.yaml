- '[C2] Units, versions and dates. 10 gigabytes → 10 GB; 331 megabytes → 331 MB; about 95 → 大约 95 (the SAY drops the unit; keep it so: 生产的大约 95); about four and a half gigabytes → 大约 4.5 GB; over 4 gigabytes → 超过 4 GB; 600 seconds → 600 秒; about nine seconds later → 大约 9 秒后; a one-hour cache / for an hour → 一小时的缓存 / 一小时; five point zero → 5.0; 58 percent → 58%. No tool version is spoken (versions sit on screen with the at the time of recording tag); never write Python, Node, Vite or nginx versions into the Chinese line. No price, quota or money amount anywhere. Hashes, container ids, PIDs, UUID values, session ids, commit ids (ce03a10, 447b5c3, e98fa55, 14f2a14) and project ids never go into a Chinese line (the SAY says none of them).'
- '[D1] Sentence alignment (explainer/i18n.py). One entry per SAY line of script.md in narration/*.yaml (159 blocks); `en` byte-equal to the SAY line; `zh` has exactly one item per English sentence as split by explainer.voice.split_sentences (349 in this script: 197 in S01-S09, 152 in S10-S16). Restructure only inside a sentence; never merge or split. Short sentences keep their own item: Nginx does. → 是 nginx。; Wait: … → 等：……; No. → 不能。; The origin. → 是 origin。; Backend APIs. → Backend APIs。; Part 2: the frontend. → 第 2 部分：前端。; Step 2: API server. → 第 2 步：API server。; Step 2: npm run dev. → 第 2 步：npm run dev。; Step 3: chat. → 第 3 步：chat。; Step 4: exit. → 第 4 步：exit。; You restarted nothing. → 你什么都没重启。; It will not start. → 它起不来。; Two extras. → 两个额外实验。; Keep this container running. → 让这个 container 一直跑着。; Today, that whole right-hand side runs on your laptop. → 今天，整个右半边都在你的笔记本上跑。. Re-run `python -m explainer.i18n check videos/ac215-l18-apis-frontend --lang zh` until it prints OK.'
- '[D2] No say:, no anchors. There is no Chinese voice: never write say: (the display line is the only text) and never write anchors: (they only place animation beats for a Chinese-voiced render). The subtitles are timed by the English audio; the toolkit pairs each Chinese sentence with its English sentence by position.'
- '[D3] A checker-clean display line. With no say:, every displayed sentence must pass explainer.i18n.spoken_problems: no brackets (B2), no maths symbols (B3), no letter_letter names (A6), no ! after a digit, no clause ending in 种 followed by ，。！？ (每种聊天模式 inside a clause is fine), a half-width space between Hanzi and Latin letters or digits (B1), each sentence ending in 。！？ or …… (optionally followed by ” or 」), and every Latin word listed in this glossary (zh_subtitle, first_use or allowed_spoken_latin). The checker cuts words with [A-Za-z][A-Za-z''.-]* and ignores one-letter words: api.service:app is api.service and app, localhost:9000 is localhost, /api/llm/chats is api, llm and chats, /readyz is readyz, cheese-app-v2 is cheese-app-v, src/frontend-react is src and frontend-react, --reload is reload, docker-shell.sh, vite.config.js, ml-workflow.json and App.jsx stay whole, AC215 is AC, v1 is v (ignored), Invalid grant: account not found is four words. A Latin word it reports is either an English word to translate (usually) or a missing artifact: add the artifact, cut the same way, to allowed_spoken_latin and to its term. Plurals and inflections are left out on purpose (no routes, routers, requests, containers, images, chunks, embeddings, sessions, components, origins, probes, headers): a plural it reports is an English inflection to drop (三个聊天 router, 14,356 个 chunk). The only plurals allowed are artifacts and names: newsletters and chats (in /api/newsletters, /api/llm/chats, get newsletters, newsletters.html), books (Cheese books), APIs (Backend APIs), modules (node modules), WatchFiles, Podcasts is never needed (播客).'
- '[D4] The English line (en_display). In the bilingual band the English line shows the SAY sentence, which spells artifacts out for the voice. Every such sentence gets an en_display item with the literal on-screen form, otherwise word for word the SAY sentence; null for the other sentences of the block. Table (script.md "Notes for scene authors", Subtitle display for the i18n stage): sh docker-shell.sh → sh docker-shell.sh (unchanged); slash api → /api; slash docs → /docs; api dot service colon app → api.service:app; host 0.0.0.0 → --host 0.0.0.0; reload → --reload (only where it names the flag: S03[6]); square root → square_root (the route); x equals 2 and y equals 10 → x=2&y=10; x equals 3 and y equals 4 → x=3&y=4; five point zero → 5.0; service dot py, index dot html, main dot js, main dot jsx, App dot jsx, api dot js, vite dot config dot js, cli dot py, settings dot py, newsletters dot html, chat dot html → the file names; cheese app API service → cheese-app-api-service; change into src, vector db / api service / frontend react → cd src/vector-db / cd src/api-service / cd src/frontend-react; change into cheese app v2, src, frontend simple → cd cheese-app-v2/src/frontend-simple; healthz / readyz → /healthz / /readyz; slash api, square root → /api/square_root; slash api, newsletters → /api/newsletters; slash api, docs → /api/docs; slash api, llm, chats → /api/llm/chats; get status → get_status; node modules → node_modules; tagged prod → tagged :prod; Git switch 2025 → git switch 2025; docker compose up with build → docker compose up --build; Control C → Ctrl+C; access control allow origin, star → access-control-allow-origin: *; API server → api_server; uvicorn server → uvicorn_server; localhost 9000 / 3000 / 8080 → localhost:9000 / localhost:3000 / localhost:8080; type y for yes → type y; plain def → plain def; ml workflow key → ml-workflow key (the file is ml-workflow.json); persistent folder → persistent-folder (S02[6], S07[2], S07[7]). Not restored: the quoted log phrases (they are already the literal), the README step numbers, port numbers, 0.0.0.0 and 127.0.0.1. The English video''s own .srt is not affected.'
- '[D5] Content parity. Each Chinese sentence translates its English sentence only: no added commands, flags, glosses, Chinese screen names or explanations; kept-English words get no Chinese explanation (the English line is right below); ponder questions get no answers (A10). Head words A5 needs (这个, 命令, 参数, 目录, 文件, 标签页, 模式, 分支) carry no content. An extra in the English is 额外; marked extra → 标成 extra.'
- '[D6] Fixed patterns (L9-L14''s, extended). The tracker in the corner names the README step, code panels name their file and lines, and a yellow tag, your turn, means pause and run it. → 角落里的进度条标出 README 的哪一步，代码面板标出文件和行号，黄色的 your turn 标签表示暂停一下，自己跑一遍。 Pause and run it. → 暂停一下，自己跑一遍。 Pause and clone them. → 暂停一下，clone 下来。 Pause and try it. → 暂停一下，试一试。 Pause and open it. → 暂停一下，打开看看。 Pause and run them. → 暂停一下，跑一遍。 Pause while yours loads. → 暂停一下，等你的加载完。 so pause and start it → 所以暂停一下，先把它跑起来; Pause and start it. → 暂停一下，把它启动起来。 Pause and try both. → 暂停一下，两个都试试。 Pause and click through. → 暂停一下，挨个点一遍。 pause to match each one → 暂停一下，逐个对上; Pause and try one call from the docs page. → 暂停一下，在文档页上试一次调用。 in the docs, pause and try … → 在文档页里，暂停一下，试试……; Steps 2 and 3: pause, run … → 第 2、3 步：暂停一下，运行……; Test yourself, pausing on each. → 自测一下，每道题都暂停想一想。 One: … Five: → 第一题：……第五题：; A small slip: → 有一个小疏漏：; A small note: → 说明一点：; One kind note: → 提一句：; One honest note: → 如实说一句：; So, a quick test. → 那么，快速测一下。; Two extras. / Two extras: → 两个额外实验。 / 两个额外实验：; An extra look → 额外看一眼; An extra listing → 额外列一下; An extra curl → 额外用 curl; An extra check → 一个额外检查; An extra experiment → 一个额外实验; As extras → 额外地; Step n: → 第 n 步：; Part 2: the frontend. → 第 2 部分：前端。; In a new terminal → 在一个新终端里; in a second terminal, in the same folder → 在第二个终端里，同一个目录下; the permission slip → 许可条; the courier → 信使; three and a half → 第 3.5 步; step zero, the preflight → 第 0 步，预检; the phone book → 电话簿; the leaves of this tree → 这棵树的叶子; stamps out → 批量生成; the lecture''s first / second trip → 课上的第一趟 / 第二趟; one origin, no permission needed → 同一个 origin，不需要许可.'
- '[D7] Files. narration/g1.yaml = S01-S09 (part 1, the API: the hook, the blueprint and your folders, v1''s server and app, a function becomes a URL, the simple frontend, v2''s vector DB, the API alive then ready, screens decide the routes, a chat is a file; 89 blocks, 197 sentences), narration/g2.yaml = S10-S16 (part 2, the frontend: React with Vite, one origin, nginx in production, Compose and clean-up, branch 2025, CORS and the preflight, recap; 70 blocks, 152 sentences), matching video.yaml''s two parts; each file opens with a comment (coverage; the rules used: A6 the spoken forms of the underscored names and query strings, A13 the verbatim log text, D4 en_display, A16 the instructor rule, no say: / anchors:), entries in script order. Double-quoted strings; literal double quotes and backslashes escaped for YAML.'
- '[D8] Length on the English timing. The Chinese is read while the English plays; the band switches where the English switches. Each Chinese sentence should be readable in the time its English sentence is heard: at most about 2 units per English word (a Hanzi counts 1, a Latin letter 0.55), so drop redundant connectives and repeated subjects, never content. Long artifacts cost length too (cheese-app-v2/src/frontend-simple 19, access-control-allow-origin 15.4, Invalid grant: account not found 17.6, Application startup complete 15.4, docker compose up --build 13.8, cheese-app-api-service 12.1, host not found in upstream 13.8): do not repeat what the English does not; after the first time use the short form (这个 container, 这个 router, 这个探针, 这个文件).'
- '[D9] Keep the English clause order (series lesson, ac215-video skill). The toolkit pairs Chinese and English clause by clause; a condition the English puts last but the Chinese puts first swaps meaning between two neighbouring cues. Keep conditions, purposes and time phrases where the English has them: Remove those by name if you need the disk. → 按名字把它们删掉，如果你需要这块磁盘空间的话。; The JavaScript runs in your browser, on the laptop, and … → 这段 JavaScript 跑在你的浏览器里，也就是笔记本上，而……; Left to Docker on Linux, they would belong to root → 交给 Linux 上的 Docker 去建，它们会属于 root. Where the English opens with if, with, without, while, when, in, then or so (S03[12].1, S04[6], S06[1].1, S07[2].1, S08[6].1, S09[5].2, S10[6], S13[2], S15[0]), the Chinese opens the same way.'
- '[G1] Width. Bilingual band: a Chinese line at most 30 units, an English line 96 characters; .zh.srt cues 22 units a line, 2 lines. Keep clauses under about 24 units, separated by ，；：、 so the cutter has clean cuts; never a clause over 30 units without a mark. The long artifacts (D8) take a clause of their own; S01[3], S03[6], S07[2], S08[1], S10[6], S11[1], S14[4] and S16[1] get a comma at each English clause break.'
- '[G2] Cue ends: the toolkit strips 。，、；： at the end of each cue and keeps ？！…… and a closing ” (subtitles.strip_end). Prefer ending a clause on a Chinese word rather than on artifact + 。 where the English allows (……放进 secrets 目录里。 reads better than ……secrets。); the quoted log text (Invalid grant: account not found, host not found in upstream, 26 passed) may close a sentence as it does in the English.'
- '[G3] Names and commands are never split. The cutter treats a space between two Latin words in a Chinese line as a good cut, so Application startup complete, Invalid grant: account not found, Internal Server Error, host not found in upstream, docker compose up --build, sh docker-shell.sh, npm run dev, npm run check, git switch 2025, git stash pop, Cheese books, Review the code, Review the app and Vertex AI User could land on two lines. Put them at a clause end, after a full-width colon or 、, with little Chinese around them, at most one long label per cue; after the .zh.srt is rendered, check every cue with a command, a log phrase or a heading.'
- '[H1] Titles (meta.yaml). Video, part and chapter titles in the written register (A4: 容器, 镜像, 仓库, 端口, 卷, 源（origin）, 跨域资源共享); questions keep their question mark; the English colon structure is kept (v1：一个服务器、一个应用、一个端口; 生产环境：用 nginx 取代 Vite); commands, tools and names as they are (FastAPI, uvicorn, React, Vite, nginx, CORS, Compose, 2025); meta.yaml is not read by the checker, so brackets are fine there. The video title uses the series pattern AC215 · 第 n 讲：…（跟练：…）, in substance the same as video.yaml''s publish.title_zh (API 与前端：FastAPI 服务、简单网页和 React 应用). The core-concept chapters carry their English short name once where the Chinese is not the usual search word (同一个源（origin）; CORS 与预检请求 needs none). The recap follows the series 收尾 pattern (Tear down, recap, and what''s next → 收尾清理、回顾和下节预告). No title names the instructor (A16).'
- '[H2] Description (Bilibili / YouTube): two or three sentences, written register, this glossary''s terms: the follow-along of AC215 lecture 18 against the slides and the two READMEs step by step (cheese-app-v1: FastAPI under uvicorn in a container, api.service:app, 0.0.0.0, --reload, a function as a URL with 422 / 307 / docs, static pages from http-server; cheese-app-v2: four containers on one network, 14,356 chunks into Chroma, /healthz vs /readyz, routers under /api, chats as files, pytest; the React app with Vite, the dev-server proxy and one origin, the nginx production image, docker compose and the full clean-up; branch 2025''s simple frontend with CORS, the preflight and a 307); English narration with Chinese and bilingual subtitles; main moved twice on the recording day and the video says which commit it follows; everything runs on the laptop and only the Gemini and embedding calls use the viewer''s key. In agreement with video.yaml''s publish.description_zh, but never a person''s name (A16).'
- '[H3] Companions: i18n/zh/README.md (and exercises.md / digest.md if made) are translated with this glossary in the written register (A4: 仓库, 克隆, 容器, 镜像, 端口, 卷（volume）, 镜像仓库（registry）, 前端, 后端, 服务器, 应用, 路由, 路由器（router）, 前缀, 中间件, 查询字符串, 类型提示, 校验, 重定向, 静态文件, 存活探针, 就绪探针, 会话 ID（session ID）, 单页应用, 组件, 开发服务器, 代理, 源（origin）, 同源策略, 跨域资源共享（CORS）, 预检请求, 多阶段构建, 构建缓存); brackets and underscores are fine there (not checked). Headings and <summary>答案</summary> are translated. A closing term table: English | this video | other common renderings (router: router / 路由器; route: 路由 / 路由规则; middleware: 中间件; query string: 查询字符串 / 查询参数; type hint: 类型提示 / 类型注解; liveness / readiness probe: 存活探针 / 就绪探针, 存活检查 / 就绪检查; single-page app: 单页应用 / SPA; component: 组件; dev server: 开发服务器; proxy: 代理 / 反向代理; origin: 源 / 来源 / 域; same-origin policy: 同源策略; CORS: 跨域资源共享 / 跨域; preflight: 预检请求; deep link: 深层链接; named volume: 命名卷; build cache: 构建缓存; multi-stage build: 多阶段构建).'
- '[H4] Code and commands in companions stay byte for byte: code blocks, commands, file names and inline `code` are unchanged; only # comments and the prose around them are translated.'
- '[I1] (request, open since L3) explainer.i18n check applies the voice hygiene of the display line when a sentence has no say: (_SPOKEN_BAD: brackets, maths symbols, letter_letter names, the 种 rule). For a subtitles-only video (this series; video.yaml has no languages.zh.voice, this glossary says voice: none) these checks protect nothing and force A6 and B3 (here square_root, get_status, api_server, uvicorn_server, node_modules, x=2&y=10, Ctrl+C). Proposal: skip _SPOKEN_BAD for display-only sentences when the glossary says voice: none (keep the Latin-word, spacing and sentence-end checks).'
- '[I2] (open, from L1 I3) explainer/subtitles.py _cuts treats a space between Latin words in a Chinese line as a good cut, so log phrases, headings and commands can be split (G3). Proposal: in a Chinese line, treat a run of Latin words joined only by spaces as unbreakable unless it alone exceeds a line.'
- '[I3] (note) explainer/subtitles.py reads every video''s glossary.yaml: 2-3 word English phrases of each term''s en are kept on one English line, and the 2-7 character Chinese headwords of zh_subtitle are registered in jieba, for all videos'' subtitles. So en and zh_subtitle list real terms only (no sentences); example sentences go to first_use and note.'
terms:
# ---------------------------------------------------------------- S01 Who answered on port 3000?
- en: 'request / port 3000 / frontend / backend / the API''s server / listens on port 9000'
  zh_subtitle: '请求 / port 3000 / 前端 / 后端 / 服务器 / 监听'
  first_use: 'S01[0]：可你看是谁应答的：uvicorn，也就是 API 的服务器，而 API 监听的是 port 9000。'
  note: 'A1 c, A2, A3: port stays (L2-L4); frontend / backend → 前端 / 后端 (L16). Here is a request to port 3000, where this app''s frontend runs → 这是一个发往 port 3000 的请求，这个应用的前端就跑在那里. It asks for two newsletters and gets them → 它要两条简报，也拿到了 (newsletters → 简报, A15).'
- en: 'last year''s version / called port 9000 directly / permission slip / access control allow origin, star'
  zh_subtitle: '去年的版本 / 许可条 / access-control-allow-origin / 星号'
  first_use: 'S01[1]：它的页面直接调用 port 9000，每个回答都带着一张许可条：access-control-allow-origin，星号。'
  note: 'Picture word (policy 4): permission slip → 许可条, every time (S01, S11, S14, S16). The header is written as on screen, the star as the SAY says it (B2); en_display shows access-control-allow-origin: * (D4). Last year''s version of this app worked differently → 这个应用去年的版本不是这样工作的. This year''s API sends no such slip at all → 今年的 API 根本不发这种许可条.'
- en: 'who carried the request / from 3000 to 9000 / need permission'
  zh_subtitle: '送过去 / 许可'
  first_use: 'S01[2]：那么，是谁把请求从 3000 送到 9000 的，去年的页面又为什么需要许可？'
  note: 'The hook question; the answer (S11) is 信使 / Vite 代理. permission → 许可 (permission granted → 许可了; no permission needed → 不需要许可).'
- en: 'six numbered steps / forward / map into a container / run a function / respond / show it / three and a half / the courier'
  zh_subtitle: '六个编号步骤 / 转发 / 映射 / 运行函数 / 响应 / 显示 / 第 3.5 步 / 信使'
  first_use: 'S01[3]：我们加上课上从没画出的一步：第 3.5 步，信使。'
  note: 'A16, D6: The lecture draws one chat message as six numbered steps: request, forward, map into a container, run a function, respond, show it → 课上把一条聊天消息画成六个编号步骤：请求、转发、映射进 container、运行函数、响应、显示. three and a half → 第 3.5 步; the courier → 信使 (the picture; Vite in S11, nginx in S12).'
- en: 'the lecture''s blueprint / zoom out / the same three ports / the right-hand side / well, not really, we need to build it'
  zh_subtitle: '蓝图 / 拉远 / 右半边'
  first_use: 'S01[4]：课上先说应用已经准备好了，接着又承认：其实还没有，我们得把它建出来。'
  note: 'The lecture''s spoken aside is translated (it is not a string the viewer matches; the English line carries the quote); the script''s note to keep the quoted slide phrases English is followed for code and log text only (A13, S09[0]). Zoom out, and this is the lecture''s blueprint for the whole app, with the same three ports → 拉远一点看，这就是课上整个应用的蓝图，还是那三个端口. Today we build the right-hand side, on your laptop → 今天我们在你的笔记本上，把右半边建出来.'
- en: 'clone both repositories / keep Docker running / about 10 gigabytes / your Google key / the chat answers'
  zh_subtitle: 'clone / repo / 10 GB / Google 密钥 / 聊天的回答'
  first_use: 'S01[5]：要跟着做，先把两个 repo 都 clone 下来，让 Docker 一直开着，再腾出大约 10 GB。'
  note: 'L1: repo, clone stay. Your Google key matters only for the chat answers → 你的 Google 密钥只在聊天的回答上用得到 (A14, A15).'
- en: 'tracker / README step / code panels name their file and lines / yellow tag / your turn / pause and run it'
  zh_subtitle: '进度条 / 代码面板 / 行号 / your turn 标签'
  first_use: 'S01[6]：角落里的进度条标出 README 的哪一步，代码面板标出文件和行号，黄色的 your turn 标签表示暂停一下，自己跑一遍。'
  note: 'A11, D6, as L9-L14, extended by the code panels clause.'
# ---------------------------------------------------------------- S02 The blueprint, and your folders
- en: 'where this lecture sits / course project / machine learning pipeline / the app / backend API'
  zh_subtitle: '课程项目 / 机器学习 pipeline / 应用 / 后端 API'
  first_use: 'S02[0]：课程项目已经有了它的机器学习 pipeline，还缺的是应用：一个后端 API 和一个前端。'
  note: 'First, where this lecture sits → 先看这一讲在哪儿 (A9). pipeline stays (L13).'
- en: 'technical architecture / one layer at a time / developers / users / outside the cloud / labeled with its protocol and port'
  zh_subtitle: '技术架构 / 一层一层 / 开发者 / 用户 / 云外 / 协议'
  first_use: 'S02[1]：课上把系统画成一张技术架构图，也就是蓝图，一层一层地画。'
  note: 'Developers, users, GitHub and Colab sit outside the cloud, Vertex AI inside, and every arrow is labeled with its protocol and port → 开发者、用户、GitHub 和 Colab 在云外，Vertex AI 在云里，每个箭头都标着它的协议和端口 (port in the picture''s labels: 端口 is fine here too, but the subtitles keep port elsewhere: write 协议和 port).'
- en: 'bucket / a registry of images / persistent disk / cluster / NGINX in front / vector database'
  zh_subtitle: 'bucket / registry / 持久化磁盘 / 集群 / NGINX / 向量数据库'
  first_use: 'S02[2]：右边是一个集群：最前面是 NGINX，应用在 3000，API 在 9000，向量数据库在 8000。'
  note: 'A14: registry stays (L2, L16; written 镜像仓库（registry））; cluster → 集群; persistent disk → 持久化磁盘. The lecture''s NGINX is upper case; the image and the tool on the laptop are nginx (A1 b). Then come a bucket, a registry of images and a persistent disk → 接着是一个 bucket、一个存 image 的 registry 和一块持久化磁盘.'
- en: 'folder rule / one Git folder per app / one folder per service under src / secrets outside the Git folder / empty folders'
  zh_subtitle: '目录规则 / Git 目录 / 服务 / src / secrets / 空目录'
  first_use: 'S02[4]：课上的目录规则：每个应用一个 Git 目录，src 下每个服务一个目录，secrets 放在 Git 目录之外。'
  note: 'A7: service → 服务 here. Version 1 even keeps empty folders for the services it does not run; version 2 holds only its three → v1 甚至给它不跑的服务也留了空目录；v2 只放它自己的三个.'
- en: 'clone or download / our spelling / Pause and clone them'
  zh_subtitle: 'git clone / 我们的写法'
  first_use: 'S02[5]：README 写的是 clone 或下载，git clone 是我们的写法。'
  note: 'D6: Steps 1 and 2: clone both repositories → 第 1、2 步：把两个 repo 都 clone 下来; Pause and clone them → 暂停一下，clone 下来. The tag extra · our spelling stays on screen (A11).'
- en: 'create secrets and persistent folder yourself / left to Docker on Linux / belong to root / could not write there / your ml workflow key'
  zh_subtitle: 'secrets / persistent-folder / root / ml-workflow.json'
  first_use: 'S02[6]：第 3 步：在 clone 旁边，自己建好 secrets 和 persistent-folder 两个目录。'
  note: 'D4: persistent folder → persistent-folder; D9: Left to Docker on Linux, they would belong to root, and the container could not write there → 交给 Linux 上的 Docker 去建，它们会属于 root，container 就没法往里写. Your ml workflow key goes into secrets → 你的 ml-workflow.json 密钥放进 secrets 目录.'
- en: 'the day we recorded / the main branch moved twice / main as you clone it today / a branch called 2025'
  zh_subtitle: '录制当天 / main 分支 / 2025 分支'
  first_use: 'S02[7]：有一件事在我们录制当天变了：v2 的 main 分支动了两次。'
  note: 'A10, A16: We follow main as you clone it today → 我们跟着你今天 clone 到的 main 分支走. The simple frontend the lecture teaches now sits on a branch called 2025, which we visit at the end → 课上讲的简单前端现在放在一个叫 2025 的分支上，我们最后会去看. No commit id in the subtitles (C2).'
# ---------------------------------------------------------------- S03 v1: a server, an app, a port
- en: 'browser / server / response / a port picks which program / the default 80 and 443 / the address'
  zh_subtitle: '浏览器 / 服务器 / 响应 / 程序 / 默认的 80 和 443 / 地址'
  first_use: 'S03[0]：浏览器发出一个请求，服务器回一个响应。'
