- '[B1] Spacing. One half-width space between Chinese and Latin letters, digits or artifacts (第 18 讲, 第 3 步, 第 3.5 步, port 9000, 状态码 200, 返回 422, 25 个操作, 26 passed, 14,356 个 chunk, 大约 10 GB, 331 MB, 58%, 600 秒, 大约 9 秒, 打开 localhost:9000, 跑 npm run dev, v1 的习惯). The checker reports a missing space on every displayed sentence. Spaces inside an artifact stay as they are (Cheese books, Review the code, Application startup complete, docker compose up --build), never added inside one. No space next to full-width punctuation (……localhost:3000。, 返回 503：). No U+00A0 / U+202F.'
- '[B2] Punctuation. Full-width ，。、；：？！“”…… in Chinese text, also next to artifacts. Lists use 、 (Ask、Identify 和 Cheese books; HTML、CSS、JavaScript; 第 1、2、4 步). The paths the SAY reads with commas are written as paths (change into src, vector db → 进到 src/vector-db; slash api, llm, chats → /api/llm/chats; slash api, docs → /api/docs). No brackets of any kind: （）, (), 《》, 【】, [], <>; the checker rejects them in a line without say:, and the band needs no glosses. “” only for translated quotations (the lecture''s aside in S01[4] is translated, not quoted); artifacts, tags and quoted log text never get quotation marks. Inside one Chinese sentence (one English sentence) no 。？！: use ，；：. No ASCII ? or ! in the Chinese line. Questions keep ？. Test-yourself numbers take a full-width colon (第一题：……). The ASCII colon, slash, dot and asterisk inside an artifact stay (api.service:app, localhost:9000, Invalid grant: account not found, /api/docs, App.jsx); the star of access-control-allow-origin: * is said 星号, as the SAY says star.'
