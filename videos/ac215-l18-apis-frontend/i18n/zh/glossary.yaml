# Chinese (zh-CN) glossary and translation rules for ac215-l18-apis-frontend (AC215 lecture 18, APIs + Frontend;
# the FULL follow-along of dlops-io/cheese-app-v1 @ ce03a10 and dlops-io/cheese-app-v2: main @ 447b5c3 as a student
# clones it on 2026-11-05, the "Production images" extras from e98fa55's README, and Tutorial 24 with last year's
# vector DB and API from branch 2025 = 14f2a14, which main dropped that morning; ASSETS.md "Which commit"),
# code-switching version, SUBTITLES ONLY. Audience: Chinese-speaking AC215 grad students who read technical English
# fluently; register of a Chinese MLOps TA running a lab section.
# Precedents and sources of the shared decisions: the series pilot videos/ac215-l01-vms-venvs/i18n/zh (repo, clone,
# commit, 分支, 录制时); the container lectures ac215-l02-containers-1 to ac215-l04-flexible-workflow-ports
# (container, image, tag, Dockerfile, port, localhost, 发布, 监听, 构建, 缓存, 警告, 无害, 网络, 电话簿, registry, stash,
# docker system prune, volume kept as in "volumes 这个键"); ac215-l05-rag (chunk, embedding, Chroma, 向量数据库);
# ac215-l06-agents-1 (agent, session); ac215-l09-ci-testing (路由, 处理函数, 校验, 横幅, uvicorn, FastAPI, pytest, lint,
# Ctrl-C); ac215-l10-cloud-connect (加载器, 回环地址, Docker 网络, 电话簿, 请求头, 服务账号, 角色, 小疏漏, uvicorn server,
# 前置条件, 替身, 如实说明); ac215-l11-data-labeling-versioning (entrypoint, the erratum phrase 一个小疏漏, 授课老师);
# ac215-l14-serverless-deployment (the file layout this one follows: rules A-I, term tables per scene, D4 en_display,
# D9 clause order; 请求, 状态码, 方法, 退出码, 你的笔记本, 同学, 额外, 进度条, your turn 标签); and the exam edition
# ac215-l16-exam (浏览器, 前端, 静态文件, 一趟 / 两趟, 一跳, 代理, 隧道, 网络接口, 0.0.0.0 vs 127.0.0.1, Nginx,
# 生产环境 / 开发环境, 相对路径, registry). Every form they fixed is kept where it agrees with this video's captures.
# The BRIEF's glossary heads-up (BRIEF.md "Notes", Chinese glossary heads-up) proposed keeping some 45 words in English
# (route, request, response, status code, header, network, bind mount, probe, liveness, readiness, frontend, backend,
# component, single-page app, dev server, proxy, preflight, build, branch …). Series consistency wins where an earlier
# lecture fixed a Chinese form (路由 L9/L10, 请求 / 响应 / 状态码 L14, 请求头 L10, 网络 L4/L10, 挂载 L2-L4, 构建 L2,
# 分支 L1, 前端 / 后端 / 代理 L16, 向量数据库 L5); the rest follows the standard Chinese web and Kubernetes vocabulary
# (探针, 存活, 就绪, 组件, 单页应用, 开发服务器, 预检, 中间件); router, origin, session ID, volume, stash, CORS, JSX and the
# products stay English (decisions in GLOSSARY.md "关键决定").
# There is NO Chinese voice in this series (docs/AC215_SERIES.md rule 8): the Chinese lines are subtitles on the
# English timing (the bilingual band of output/<id>.zh-en.mp4, <id>.zh.srt, <id>.zh-en.srt / .ass). So no say:,
# no anchors, no readings, no durations: only display rules. But `python -m explainer.i18n check` still applies
# its voice hygiene to the displayed line when a sentence has no say: (brackets, maths symbols, letter_letter
# names, Latin words not listed here, a missing half-width space): rules A6, B3 and D3 are how the Chinese line
# stays clean without say:. This lecture's underscored names (square_root, get_status, api_server, uvicorn_server,
# node_modules) and the query strings (x=2&y=10) are written the way the narration says them; Ctrl+C is Ctrl-C.
# SERIES RULE: the instructor's name never appears in a subtitle, a title or the description (A16).
# Human-readable copy in Chinese: GLOSSARY.md (keep the two in sync; its term tables come from this file's data).
# terms[].zh_subtitle = the display form (Chinese subtitle line; titles use the written forms of A4);
# terms[].first_use = an example sentence for the translators, as SNN[k]：<one Chinese sentence for one English
# sentence of SAY block k of scene SNN, k from 0>; each one passes the checker; the narration files reuse them;
# terms[].note = usage (English → Chinese) and the rule tags.
# rules are tagged [A1]..[I3]: A terms, B typography, C numbers, D narration file, G subtitles, H titles and
# companions, I toolkit notes. (L1's E on-screen strings and F voice rules do not apply: nothing on screen is
# translated in this series, and there is no voice.)
# Read by: python -m explainer.i18n check (Latin words allowed in the Chinese line: every Latin word of
# zh_subtitle and first_use, plus allowed_spoken_latin, which lists the words as the checker's regex
# [A-Za-z][A-Za-z'.-]* cuts them: api.service:app is api.service and app, localhost:9000 is localhost,
# /api/llm/chats is api, llm and chats, cheese-app-v2 is cheese-app-v, --reload is reload, docker-shell.sh and
# vite.config.js stay whole, AC215 is AC) and explainer/subtitles.py, for EVERY video (2-3 word English phrases of
# `en` are kept on one English line; 2-7 character Chinese headwords of zh_subtitle are registered in jieba, so
# zh_subtitle holds terms, not example phrases).
video: ac215-l18-apis-frontend
lang: zh-CN (mainland Simplified Chinese)
audience: 'Chinese-speaking AC215 (MLOps & LLMOps) grad students who know Python and basic ML, read technical English fluently, did L1-L17 (Docker images and containers, -p HOST:CONTAINER, bind mounts and docker-shell.sh, a Docker network and container names, L5''s chunk → embed → Chroma pipeline, L13''s cheese CNN, L15''s ml-workflow.json key in secrets/, a GCP project with Vertex AI on), saw Lecture 18 (both decks, APIs and Frontend), and are new to uvicorn (the server) vs FastAPI (the app), api.service:app, --host 0.0.0.0, --reload, a function becoming a URL (query string, 422, 307, /docs), static files from http-server, routers and prefixes, liveness vs readiness probes, chats kept as files behind a session ID, a single-page app with Vite and React Router, the dev-server proxy and one origin, the nginx production image, Docker Compose, and CORS with its preflight; they follow along with clones of cheese-app-v1 and cheese-app-v2 open, Docker running and about 10 GB free, pausing to run every step. Everything runs on the laptop; only the Gemini and embedding calls on Vertex AI use their key. Register of a Chinese MLOps TA running a lab section.'
voice: none          # subtitles only (video.yaml: Chinese = i18n/zh/narration/*.yaml on the English timing)
policy: 'The Mandarin of a Chinese MLOps TA walking a lab section through the steps, code-switching only where such a speaker really does, written as subtitles under an English narration. The viewers already say 把 repo clone 下来, 起一个 container, 构建 image, 发布一个 port, 进到 container 的 shell 里, 跑 pytest, 看横幅, 按 Ctrl-C, 报 500; this lecture adds 起 uvicorn, 加一个路由, 挂一个 router, 看 /api/docs, /readyz 返回 503, 带上 session ID, 放进一个 volume, 同一个 origin, 走 Vite 代理, 打 prod 的 tag, 先发一个预检, stash 一下. Every choice passes three tests: what is said in a real lab section; the standard, searchable Chinese name (MDN''s and the Chinese web literature: 前端, 后端, 浏览器, 服务器, 请求, 响应, 状态码, 请求头, 路由, 中间件, 装饰器, 类型提示, 查询字符串, 重定向, 静态文件, 缓存, 强制刷新, 单页应用, 组件, 框架, 开发服务器, 构建工具, 代理, 预检请求, 同源策略, 跨域; the Kubernetes Chinese docs: 探针, 存活, 就绪, 集群; the Docker Chinese literature: 挂载, 网络, 构建缓存, 多阶段构建); and consistency with the series (L1-L17 and the exam editions: every form they fixed is kept). (1) Artifacts verbatim: what the viewer types or matches on screen (commands, flags, file and folder names, paths and URLs, container, network, image and volume names, package and tool names, env vars, the README headings named as headings, the app''s tabs and modes, error and log text the narration quotes, status codes) is copied letter for letter, never translated, inflected or quoted; the exceptions the checker forces (an underscore, = & + or brackets inside the artifact) are written the way the narration says them (A6) and the English line shows the literal (D4). Nothing on screen is translated in this series: terminal output, code panels, README cards, the schematic browser windows, the V1-V8 set pieces, tags, trackers, lecture tags and the pause-and-ponder cards stay English; only the narration is. (2) Lab-speech English, a closed list (A1 c): from the series repo, clone, commit, container, image, tag, Dockerfile, port, localhost, bucket, registry, pipeline, chunk, embedding, agent, session, stash, volume, shell, lint, URL, API, ID, JSON, HTML, CSS, DNS, CNN, RAG, UUID, MCP; new here router, origin, session ID, outlet, div, body, CORS, JSX. (3) Everything else in standard Chinese (A3, A7-A10, A14). (4) The video''s pictures by meaning, one word each: 许可条 (the permission slip: access-control-allow-origin), 信使 (the courier, step 3.5: Vite or nginx forwarding /api), 电话簿 (Docker DNS, as L4 and L10), 一趟 (a trip, as L16), 一跳 (a hop), 蓝图 (the lecture''s technical-architecture drawing), 这棵树的叶子 (the 25 operations), 窗口 (the outlet), 外壳 (the app shell), 第 0 步 (the preflight). (5) Written register for titles, meta.yaml and companion docs: 仓库, 克隆, 容器, 镜像, 端口, 卷（volume）, 源（origin）, 跨域资源共享（CORS）, 预检请求, 存活探针, 就绪探针, 镜像仓库（registry）. (6) The bilingual band puts the English sentence under every Chinese line, so the Chinese line carries no glosses and no brackets at all (the checker forbids them without say:). (7) The toolkit''s constraints are part of the policy: one Chinese sentence per English sentence (159 blocks, 349 sentences), a checker-clean display line (D3), an en_display wherever the SAY spells an artifact out as words (D4), the English clause order kept (D9). Mainland Simplified Chinese; relaxed, clear lab-section speech, never slangy.'
rules:
- '[A1] Code-switching scope. English stays in three places only. (a) Artifacts, copied letter for letter: commands as typed or named (sh docker-shell.sh, git clone, git switch 2025, git stash pop, git log, docker ps, docker system prune, docker compose down, docker compose up --build, npm run dev, npm run check, http-server, pytest, curl, exit, y; the banner commands api_server and uvicorn_server as the SAY says them: API server, uvicorn server, A6), flags (--host 0.0.0.0, --reload, --build), file and folder names (service.py, settings.py, cli.py, chat.py, index.html, main.js, main.jsx, App.jsx, api.js, vite.config.js, newsletters.html, chat.html, docker-shell.sh, ml-workflow.json, llm-service-account.json, src, api, secrets, persistent-folder, images, and the paths src/vector-db, src/api-service, src/frontend-react, cheese-app-v2/src/frontend-simple; node modules as the SAY says node_modules, A6), repositories and folders (cheese-app-v1, cheese-app-v2, frontend-simple), container, network and image names (cheese-app-api-service, cheese-app-network, cheese-app-vector-db; the tag prod), the module address api.service:app, URLs and paths (localhost:9000, localhost:3000, localhost:8080, /, /docs, /api, /api/docs, /api/newsletters, /api/llm/chats, /healthz, /readyz; square root and get status as the SAY says square_root and get_status, A6), ports (80, 443, 3000, 5173, 8000, 8080, 9000, the README slip 900), addresses (0.0.0.0, 127.0.0.1), methods (GET, POST, OPTIONS), status codes (200, 307, 404, 422, 500, 502, 503), the response header access-control-allow-origin, the type float, the HTML words div, body, script (as tags), root (the div''s id and the Linux owner), the README headings the SAY names by their exact name (Backend APIs, Review the code, Review the app, Docker Cleanup, Home page, Newsletter feature, Chat feature), the chat modes and tabs (Ask, Identify, Cheese books, Recent), the docs operation get newsletters and its limit, the log, error and code text the narration quotes (Application startup complete, startup complete, CNN model is loading, Invalid grant: account not found, Internal Server Error, Newsletter not found, host not found in upstream, How is cheese made, use Gemini to generate text, Welcome to AC215, 26 passed, up to date), the class label parmigiano and the cheese Tolminc, the branch names main and 2025, the tag latest, and the screen tag your turn (A11). (b) Products, organizations, courses and names: AC215, Google, Google Cloud, Vertex AI, Vertex AI API, Vertex AI User, Gemini, GitHub, Git, Colab, Docker, Docker Compose, Compose, Chroma, TensorFlow, FastAPI, uvicorn, StatReload, WatchFiles, http-server, Node, npm, React, React Router, Vite, nginx and the lecture''s NGINX, Kubernetes, pytest, curl, Linux, README, HTTP, REST API, JSON, HTML, CSS, JavaScript, DNS, CNN, RAG, MCP, UUID, JSX, MB, GB. (c) Words Chinese engineers say in English in a lab section, a closed list: from the series repo, clone, commit, container, image, tag, Dockerfile, port, localhost, bucket, registry, pipeline, chunk, embedding, agent, session, stash, volume, shell, lint, URL, API, ID; new in this lecture router (FastAPI''s APIRouter and React Router''s router: 路由器 is network hardware in L16, and 路由 is the route), origin (源 alone reads as "source"; written 源（origin）, A4), session ID (the X-Session-ID header), outlet (React Router''s Outlet, glossed once by the narration''s own window metaphor), CORS, JSX. A word enters (c) only when the lab section really says it in English and the Chinese is stiff, ambiguous or collides with another word. Never English for flavor: request, response, route, status code, header, server, browser, frontend, backend, middleware, decorator, type hint, query string, redirect, network, interface, loopback, tunnel, mount, build, build cache, cache, hard refresh, probe, liveness, readiness, cluster, component, framework, single-page app, dev server, build tool, proxy, preflight, deep link, asset, template, stage, branch, warning, thread, process, and everything in A3, A7-A10 and A14 are Chinese.'
- '[A2] container, image, port and the laptop, as L2-L17. The subtitles say container, image, port (起一个 container, 构建 image, 发布 port 9000), measure word 个; titles, chapter names, meta.yaml and companion docs write 容器, 镜像, 端口 (A4). builds the image → 构建 image; a container that removes itself on exit → 一个退出时自动删除的 container; mounts your code → 挂载你的代码; publishes port 9000 to 9000 → 把 port 9000 发布到 9000 (3000 to port 5173 → 把 3000 发布到 port 5173; 8080 to port 80 → 把 8080 发布到 port 80); the published port → 发布的 port; mapped into the container → 映射进 container; joins the network → 加入网络; the container list → container 列表; the image list → image 列表; tagged prod → 打上 prod 这个 tag; every tagged image → 每个打了 tag 的 image; the dev image / production image → 开发 image / 生产 image; the network → 网络 (a Docker network → 一个 Docker 网络, L4/L10); the phone book → 电话簿 (L4/L10; the script''s 通讯录 suggestion is not taken, series consistency); a named volume → 一个命名的 volume; your laptop → 你的笔记本; listen → 监听; every interface → 所有网络接口; the loopback → 回环地址 (L10); the tunnel → 隧道 (L16); bind mount → 挂载 (mounts secrets without write access → 以只读方式挂载 secrets); build cache → 构建缓存; first build takes a while → 第一次构建要一阵子; two stages → 两个阶段 (written 多阶段构建 in companions); disk → 磁盘 (free about 10 gigabytes → 腾出大约 10 GB; if you need the disk → 如果你需要这块磁盘空间).'
- '[A3] Server and app, request and response (the API half, new in this lecture). browser → 浏览器; server → 服务器 (the API''s server → API 的服务器; uvicorn is the server → uvicorn 是服务器; a page server → 一个提供页面的服务器); the app → 应用 (FastAPI is the app inside it → FastAPI 是它里面的应用; a fresh app → 一个新的应用; the real app → 真正的应用); request → 请求; response → 响应 (a server sends a response → 服务器回一个响应); answer / reply (of an API) → 回答 / 回复 (every answer carried … → 每个回答都带着……; the reply → 回复); forward → 转发; status 200 → 状态码 200 (says 200 → 返回 200); route → 路由 (one route → 一个路由; a group of routes → 一组路由; the demo route → 演示路由); router → router (A1 c; a router each → 各一个 router; three chat routers → 三个聊天 router); prefix → 前缀; mounted at → 挂在……下; decorator / decorated function → 装饰器 / 加了装饰器的函数; handler → 处理函数 (the lecture''s chat handler → 课上的聊天处理函数); middleware → 中间件 (CORS middleware → CORS 中间件); query string → 查询字符串; arguments (of a function) → 参数; the defaults → 默认值; type hint → 类型提示 (the float type hint → float 类型提示); validation → 校验 (L9); documentation → 文档; the docs page → 文档页 (L10); operations (of the API) → 操作; redirect → 重定向 (points to the slash version → 指向带斜杠的版本); trailing slash → 结尾的斜杠; the root (path) → 根路径; JSON stays (the JSON comes back → JSON 再传回来); welcome → 欢迎语 (but Welcome to AC215 verbatim); the reloader → 重载器 (StatReload, WatchFiles verbatim); restarts the app → 重启应用; swaps in → 换上; startup → 启动 (start-up waits → 启动要等); a background thread → 一个后台线程; threads → 线程; does not block → 不会阻塞; the process → 进程; the model loads → 模型在加载; the cheese classifier → 奶酪分类器; probe → 探针 (two probes → 两个探针; the probes stay at the root → 探针还留在根路径); alive / liveness → 活着 / 存活; ready / readiness → 就绪 (no readiness probe → 没有就绪探针; restart on liveness, send traffic on readiness → 看存活决定重启，看就绪决定放流量); traffic → 流量.'
- '[A4] Written vs spoken pairs. Subtitles say repo / clone / container / image / port / volume / registry / router / origin / CORS; titles, chapter names, meta.yaml and the companion docs write 仓库 / 克隆 / 容器 / 镜像 / 端口 / 卷（volume）/ 镜像仓库（registry）/ 路由器（router，只在必要时；通常写 router）/ 源（origin）/ 跨域资源共享（CORS）, the core concepts with their English name in brackets the first time (brackets are allowed outside the subtitles). 前端, 后端, 服务器, 浏览器, 请求, 路由, 探针, 存活, 就绪, 代理, 预检请求, 单页应用, 组件, 生产环境, 开发服务器, 许可条, 信使, 电话簿 are the same in both registers. APIs + Frontend → API 与前端; follow-along → 跟练. Commands, code names, headings and log text are not affected.'
- '[A5] Writing artifacts. Copied verbatim (case, dots, slashes, hyphens, colons unchanged); never translated, inflected, quoted, put in 《》 or code formatting. Add a Chinese head noun where it helps: service.py 文件, api 目录, src 目录, secrets 目录, persistent-folder 目录, images 目录, cheese-app-v2 目录, compose 文件, docker-shell 脚本, Recent 标签页, Ask 模式, prod 这个 tag, get status 后面, cheese-app-api-service 的 port 9000, float 类型提示, script 标签, main 分支, 2025 分支. A sentence never opens with a lower-case artifact or kept-English word (uvicorn, nginx, http-server, pytest, curl, npm, docker, git, main, router, origin, session, volume, stash, chunk, embedding, localhost, api.service:app, service.py, main.js, src, /healthz, /readyz, /api, --host, --reload): put a Chinese word first (这里 uvicorn……; 是 nginx。; 命令 docker system prune……; 参数 --host 0.0.0.0……; 现在 /healthz……; 而 /readyz……; 在 main 分支上……; 这个 origin……). Upper-case names, products, headings and code words may open a sentence (FastAPI, Vite, Chroma, React, Compose, Kubernetes, StatReload, TensorFlow, Gemini, API, CORS, JSON, HTML, Review the code, Backend APIs, Application startup complete, Ask, Identify, Home page), and so may a digit (2025 分支……, 26 passed). When the narration shortens a command on screen, the subtitle follows the narration (sh docker-shell.sh, then http-server inside the container → sh docker-shell.sh，然后在 container 里跑 http-server).'
- '[A6] Artifacts the checker rejects. With no say:, the checker reads the display line as speech and rejects letter_letter names, = < > + and brackets of any kind. So these are never copied into the Chinese line; they are written the way the narration says them, and the English line shows the literal through en_display (D4): square_root → square root (the route and the function: 打开 square root，带上结尾的斜杠; /api 下的 square root; README 的 square root 函数); get_status → get status; api_server → API server; uvicorn_server → uvicorn server (L10); node_modules → node modules (把 node modules 放在一个命名的 volume 里; node modules 这个 volume); x=2&y=10 → x 等于 2，y 等于 10; x=3&y=4 → x 等于 3，y 等于 4; Ctrl+C → Ctrl-C (L9, L14); max-age=600 → 600 秒 (the SAY never names the header). The checker accepts, and the subtitle copies: api.service:app, localhost:9000, /api/llm/chats, --host 0.0.0.0, --reload, docker compose up --build, cheese-app-v2/src/frontend-simple, access-control-allow-origin, Invalid grant: account not found, 14,356, 58%, 5.0, 4.5 GB, 331 MB. The X-Session-ID header is never named by the SAY (a session ID → session ID).'
- '[A7] Words to keep apart. route → 路由 ≠ router → router (FastAPI''s and React Router''s) ≠ 路由表 (React Router''s route table in main.jsx; L16''s VPC route tables are another video) ≠ 路由器 (never: network hardware). server → 服务器 (uvicorn, http-server, nginx, Vite''s dev server → 开发服务器) ≠ service → 服务 (one folder per service → 每个服务一个目录; the same four services → 同样四个服务; MCP service → MCP 服务) ≠ cheese-app-api-service (the container name, verbatim). the app → 应用 (FastAPI''s app, the cheese app) ≠ app (the variable in api.service:app, verbatim) ≠ App.jsx. page → 页面 ≠ screen → 页面 too (the lecture starts from the screens → 课上从页面出发: one word) ≠ Home page (the heading, verbatim) ≠ landing page → 首页. trip → 一趟 (the lecture''s first trip → 课上的第一趟; an extra round trip → 多跑一趟) ≠ hop / step → 一步 (six numbered steps → 六个编号步骤; step 3.5 → 第 3.5 步; step zero → 第 0 步) ≠ README step → 第 n 步. proxy → 代理 (a proxy rule → 一条代理规则; the Vite proxy → Vite 代理; the proxy target → 代理目标) ≠ courier → 信使 (the picture). origin → origin ≠ source (of data) → 来源 ≠ src (verbatim). header → 请求头 / 响应头 (a custom header → 一个自定义请求头; the permission header → 许可头, the picture''s word) ≠ the page header → 页头 (React''s header component). shell (docker-shell, opens a shell → 开一个 shell) ≠ the app shell → 外壳 (React). build → 构建 (builds the image; a production build → 一次生产构建; the Vite build → Vite 构建) ≠ built files → 构建好的文件. cache → 缓存 (http-server''s one-hour cache; the browser cache) ≠ build cache → 构建缓存. check → 检查 ≠ npm run check (verbatim) ≠ format check → 格式检查. stage (Dockerfile) → 阶段 ≠ step → 步. key → 密钥 (your Google key → 你的 Google 密钥; the ml workflow key → ml-workflow.json 这个密钥; a second key name → 另一个密钥名) ≠ API key (not said). folder → 目录 (L1-L17) ≠ the Git folder → Git 目录. version 1 / version 2 → v1 / v2 (cheese app version 1 → cheese-app-v1, the repo) ≠ the version (of a tool) → 版本. main (the branch) → main 分支 ≠ main.js / main.jsx. warning → 警告 ≠ error → 错误 ≠ the README slip → 小疏漏.'
- '[A8] The frontend half (new in this lecture). frontend / backend → 前端 / 后端; HTML for structure, CSS for style and JavaScript for behavior → HTML 管结构，CSS 管样式，JavaScript 管行为; a page → 一个页面; one HTML page per feature → 每个功能一个 HTML 页面; header, script and style → 页头、脚本和样式; footer → 页脚; every click loads a whole page → 每次点击都要加载整个页面; a single-page app → 一个单页应用; component → 组件; framework → 框架 (Why a framework → 为什么要框架); markup → 标记; JSX stays; the shell → 外壳; a block that changes with each page → 中间一块随页面变化; the outlet → outlet，也就是……那扇窗口 (the window where the current page appears → 显示当前页面的那扇窗口); route table → 路由表; a star that catches everything else → 一个兜住其余一切的星号; development server → 开发服务器; build tool → 构建工具; dependencies → 依赖 (installs the dependencies → 安装依赖; up to date verbatim); a div called root → 一个叫 root 的 div; the browser picks the page, not the server → 挑页面的是浏览器，不是服务器; relative path → 相对路径 (L16); local storage → localStorage (the browser API, as code); static files → 静态文件 (L16); serves this folder → 提供这个目录; sample data → 示例数据; a paragraph → 一个段落; snippet → 代码片段; refresh / hard refresh → 刷新 / 强制刷新; cache files for an hour → 把文件缓存一小时; deep link → 深层链接; asset → 静态资源 (a missing asset → 缺失的静态资源); the nginx template → nginx 模板; the production slide → 课上的生产环境那页; only the outside changes → 只有外面变了; a lint, a format check and a production build → 一次 lint、一次格式检查和一次生产构建.'
- '[A9] Register: a TA running a lab section. Short instructions, colloquial verbs (跑, 起, 停, 开, 敲, 改, 贴, 加, 存, 拷, 删, 点, 挑, 收拾); address the viewer as 你 (one-to-one follow-along; never 您, 大家, 同学们); 我们 is us at recording time (we follow main → 我们跟着 main 分支走; ours shows a placeholder → 我们的是一个占位符; our recording''s key file → 我们录制用的密钥文件). Chinese word order inside a clause; the English clause order is kept (D9). No translationese: not 让我们…… (say 我们来…… / 先……), not 这就是为什么…… (say 所以…… / 这就是 README 写 0.0.0.0 的原因), few 被, no strings of 一个……的. No internet slang. Carry the spoken rhythm by meaning: First, where this lecture sits → 先看这一讲在哪儿; Zoom out → 拉远一点看; So, a quick test → 那么，快速测一下; Now the hook''s answer → 现在来回答开头的问题; Two extras → 两个额外实验; Another extra → 再一个额外实验; Last, the tests → 最后是测试; Before you go → 走之前.'
- '[A10] Precision. Translate hedges and quantifiers exactly: only 只, every 每个 / 每次, each 每个 / 各, all 全部 / 所有, at once 马上, right away 马上, almost 几乎 / 差不多, about 大约, never 从不 / 从没, still 还 / 仍然, already 已经, again 又 / 再, first 先 / 一开始, exactly 正好, by itself 自己, too 也. at the time of recording → 录制时 (no tool version is spoken; the tags stay on screen); the day we recorded / the recording day → 我们录制当天 / 录制当天; our recording → 我们的录制. Counts, ports, codes, sizes and times match the screen (C1). Keep 我们的 / 你的 (yours will differ). Errata and the slide-vs-capture differences are said as gently and briefly as the English, with one phrase each for the whole video, as L5 and L9-L14: A small slip: → 有一个小疏漏：(S03 the README path misses src; S05 the same; S13 port 900); A small note: → 说明一点：(S05 the old whole-body snippet; S06 chat''s fixed question; S09 the README''s 403/404 table; S14 routes already in the code); One kind note: → 提一句：(S03 the slide''s localhost 9000 inside the container); One honest note: → 如实说一句：(S06, the series phrase, L10-L14). Never as correcting anyone. The sandbox framing (S06[2]) is as plain as the English, no apology. Ponder questions (S03[12], S07[9], S11[4], S12[7], S15[10]) ask only, without hints: S03[12] does not say yes, no, loopback or network interface; S07[9] does not say wait or loading; S11[4] does not say DNS or no; S12[7] does not say name lookup or exit; S15[10] does not say origin or proxy. The answers use the question''s own words (Inside, yes … no → 在 container 里面，可以……不行; Wait → 等; No. → 不能。; The origin. → 是 origin。).'
- '[A11] The screen stays English. This series translates the narration only: terminal output and prompts, terminal titles (laptop, laptop · second tab, laptop · new terminal), code panels (comments included), README cards and RECORDED / EXPECTED panels, the trackers (README › Tutorial: Backend APIs, step k of N, captions like branch 2025 · 14f2a14 and earlier README · extra), the lecture tags (Lecture 18 · slides a–b (APIs)), tags (your turn, extra, extra · our spelling, illustration, expected · …, recorded · …, erratum, at the time of recording, the GOLD cost tags and disk chips, your editor, or edit the file), the schematic browser windows, the V1-V8 set pieces (the numbered request trace, the architecture map, server and app, the route tree, the two localhosts, the probe lamps, the chat file, one shell) and the pause-and-ponder and test-yourself cards are English; no scene changes for Chinese. When the SAY names a screen tag, the subtitle copies it or names it by colour: 黄色的 your turn 标签; 金色标签; 进度条. The narration''s own words are translated: the tracker → 进度条; an extra → 额外 (an extra curl → 额外用 curl; an extra listing → 额外列一下; an extra look → 额外看一眼; an extra experiment → 一个额外实验; marked extra → 标成 extra, because that is the tag on screen); code panels name their file and lines → 代码面板标出文件和行号; the README card → README 卡片.'
