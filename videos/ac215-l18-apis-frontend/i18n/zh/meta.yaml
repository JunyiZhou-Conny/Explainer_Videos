# Chinese (zh-CN) metadata for ac215-l18-apis-frontend (read by explainer/i18n.py meta(), used by
# explainer/build.py for the subtitles' chapters and the zh descriptions): video title, part titles, chapter
# titles keyed by scene file stem (as video.yaml's scenes), and the Bilibili / YouTube description.
# Titles follow GLOSSARY.md rule H1: written register (容器, 镜像, 仓库, 端口, 源（origin）, 预检请求; A4), the English
# colon structure kept (v1：一个服务器、一个应用、一个端口; 生产环境：用 nginx 取代 Vite), commands, tools and names as
# they are (FastAPI, uvicorn, React, Vite, nginx, CORS, 2025), questions keep their question mark, the one core
# concept whose Chinese is not the usual search word carries its English short name once (同一个源（origin）), and
# S16 follows the series' 收尾 pattern. 跟练 = follow-along; APIs + Frontend → API 与前端 (as video.yaml's
# publish.title_zh "AC215 第18讲跟练 · API 与前端：FastAPI 服务、简单网页和 React 应用，一步一步在本地跑起奶酪 App",
# in the series pattern of the other meta.yaml titles; the Bilibili upload itself uses publish.title_zh).
# SERIES RULE (A16): no title, chapter or description names the instructor.
# meta.yaml is not read by `explainer.i18n check`, so brackets are fine here.
title: "AC215 · 第 18 讲：API 与前端——FastAPI 服务、简单网页和 React 应用（跟练：cheese-app-v1 + cheese-app-v2）"

parts:
  part1: "AC215 · 第 18 讲（上）：API——从一个 Python 函数到四个容器的后端"
  part2: "AC215 · 第 18 讲（下）：前端——React、同一个源、nginx 和去年的 CORS"

