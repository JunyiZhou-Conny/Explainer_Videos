# Chinese subtitles for 项目周记 E5 (the narration is English; these lines are only shown),
# sentence-aligned to script.md. Rules: ../GLOSSARY.md.

S01:
- en: Here is a bug in our prototype. A student has a referral to an ear, nose and throat specialist, valid until January twenty-second. Their parent opens the booking page, leaves it open past that moment, and presses submit. By the agent's reading of the code, the expired referral is attached anyway, and the tracker shows the specialist as booked, never expired.
  zh:
  - 这是我们原型里的一个 bug。
  - 一个学生拿到了耳鼻喉专科的转诊，有效期到 1 月 22 日。
  - 家长打开预约页面，一直开着，过了有效期才点提交。
  - 按 agent 对代码的分析，过期的转诊照样被关联上，进度页显示已预约专科，而不是已过期。
- en: All 245 existing tests passed; none of them books after the expiry. The code even carries a comment saying expired referrals are left alone. No person had noticed. On Friday afternoon an agent reported it, after trying every order of a few actions in a small world. This episode is about how an agent can prove a change is right before anyone looks.
  zh:
  - 现有的 245 个测试全部通过；没有一个是在过期之后预约的。
  - 代码里甚至有一行注释，说过期的转诊保持不变。
  - 没有人注意到。
  - 周五下午，一个 agent 报告了它：它在一个很小的世界里，试遍了几种操作的所有顺序。
  - 这一集讲的是：在有人看之前，agent 怎么证明一个改动是对的。
S02:
- en: Every change to the app's data goes through one function, called the reducer. It takes the current state and a single action, such as book, confirm, reschedule, cancel or complete, and returns the next state. The booking page checks the referral when it draws, but the booking reaches the reducer later. So the order of events matters, and time passing is an event too.
  zh:
  - App 数据的每一次变化，都要经过同一个函数，叫 reducer。
  - 它拿到当前状态和一个操作，比如预约、确认、改期、取消、完成，然后返回下一个状态。
  - 预约页面在画出来的时候检查转诊，但预约要过一会儿才到 reducer。
  - 所以事件的顺序很重要，时间流逝也是一个事件。
- en: 'A test follows a path someone chose. The bug lives on a path nobody chose: first time passes, then the booking goes through.'
  zh:
  - 测试走的是某人选好的一条路。
  - bug 藏在一条没人选的路上：先是时间过去，然后预约成功。
- en: A test checks the cases someone thought of. What checks the ones nobody thought of?
  zh:
  - 测试检查的是有人想到的情况。
  - 那没人想到的情况，谁来检查？
S03:
- en: 'Build a small world instead: two referrals, three specialist slots, and a clock with just two moments, right after the referrals are written and an hour after they expire. From the starting state there are thirteen possible moves. Make each one, then every move from each result, layer by layer, merging any state you''ve already seen. In this world that is 13,898 states, reached in about a second, and every one of them comes from the real reducer, not a copy.'
  zh:
  - 换个办法，搭一个很小的世界：两张转诊、三个专科时段，还有一个只有两个时刻的时钟，一个是转诊刚开出来，一个是过期后一小时。
  - 从起点出发，第一步有 13 种可能。
  - 每一种都走一遍，再从每个结果出发走下一步，一层一层往下，遇到见过的状态就合并。
  - 在这个世界里一共是 13,898 个状态，大约一秒走完，而且每一个都来自真正的 reducer，不是复制品。
- en: 'Four rules are checked at every state and a fifth on every step, all written in plain language, such as one referral backs at most one live appointment, and an expired referral is never newly attached. Because the search goes layer by layer, the first broken rule it meets comes with the shortest story that breaks it. Here, two steps: time passes, then book with that referral.'
  zh:
  - 每个状态检查四条规则，每一步再检查第五条，全部用大白话写成，比如一张转诊最多对应一个有效预约，过期的转诊不会被新关联上。
  - 因为搜索是一层一层进行的，遇到的第一条被打破的规则，给出的就是打破它的最短步骤。
  - 这里是两步：时间过去，然后用这张转诊预约。
S04:
- en: 'Why did it slip through? Booking looks only at the referral''s stored status. Expired is never stored; it is only worked out for the screen. And the page checks when it draws, not when you submit. The agent did not change the product code. It recorded the bug as a known finding and left the fix to a person: compare the expiry date inside the reducer, or check again on submit.'
  zh:
  - 它为什么没被发现？
  - 预约只看转诊里存着的状态。
  - 已过期这个状态从来不存，只是显示的时候算出来。
  - 而且页面在画出来时检查，不是在你提交时检查。
  - agent 没有改产品代码。
  - 它把这个 bug 记成已知发现，把修法留给人来定：在 reducer 里比较有效期，或者提交时再检查一次。
- en: 'The rule was not loosened to make the check pass. And the check is built to fail in two ways: if any new rule breaks, and if this known bug ever disappears. That second failure reminds whoever fixes it to delete the note, so the note can never hide the bug if it comes back.'
  zh:
  - 规则没有为了让检查通过而放宽。
  - 而且检查会在两种情况下失败：任何一条新规则被打破，或者这个已知的 bug 消失了。
  - 第二种失败会提醒修好它的人把这条记录删掉，免得这个 bug 哪天回来时被它挡住。
S05:
- en: Why would an agent break its own code on purpose?
  zh:
  - agent 为什么要故意把自己的代码改坏？
- en: Because a check you have never seen fail proves nothing. Maybe it can't fail at all. So the agent broke the reducer five times on purpose, in five different ways, and ran the check after each. All five were caught, each with a story of two steps or fewer, and each breakage was then undone. It is a hand-made version of what testers call mutation testing; the classic paper on it is from 1978.
  zh:
  - 因为一个你从没见过它失败的检查，什么也证明不了。
  - 也许它根本就不会失败。
  - 所以 agent 故意把 reducer 改坏了五次，五种不同的改法，每次改完都跑一遍检查。
  - 五次都被抓到了，每次的复现都不超过两步，改坏的地方随后都改了回去。
  - 这是测试人员所说的变异测试的手工版；这方面的经典论文发表于 1978 年。
S06:
- en: 'The idea is old and serious. In 2015 Amazon described checking its designs this way, using TLA+, a language created by Leslie Lamport. In one database service it found a data-loss bug whose shortest story was thirty-five steps long, a bug that had passed design reviews, code reviews and testing. Ours is tiny by comparison, two steps in a one-second check, but it is the same move: let a machine walk every order a person would never try.'
  zh:
  - 这个思路由来已久，也很严肃。
  - 2015 年，Amazon 介绍了他们用这种方法检查设计，用的是 TLA plus，一种由 Leslie Lamport 创造的语言。
  - 在一个数据库服务里，它找到了一个会丢数据的 bug，最短的复现有 35 步，而这个 bug 之前通过了设计审查、代码审查和测试。
  - 我们的相比之下很小，一秒钟的检查里只有两步，但做的是同一件事：让机器去走人永远不会去试的每一种顺序。
S07:
- en: 'The second tool drives the app itself, the way a parent would. From a saved demo state, the agent starts its own copy of the app and its own browser. Then it clicks through: open the referral, choose an in-network clinic, pick a time, submit, wait for pending, open the tracker. It finds each control by its role and accessible name, the label a screen reader announces, and waits for the page to settle after each step.'
  zh:
  - 第二个工具直接操作 App，就像家长那样。
  - agent 从一份保存好的演示状态出发，启动自己的一份 App 和自己的浏览器。
  - 然后它一步步点：打开转诊，选一家网络内的诊所，选时间，提交，等待待确认，打开进度页。
  - 它按角色和无障碍名称来找每一个控件，也就是读屏软件念出来的那个名字，并且每一步之后都等页面安静下来。
- en: 'Right means two things at once: the screen says the specialist is booked, and the saved data says the referral now points to that new appointment. Each run is required to keep evidence: screenshots, the saved state, and no browser errors. When a step fails, it says which buttons it could see instead. And when it''s done, it shuts down only what it started.'
  zh:
  - 做对了，要两件事同时成立：屏幕上显示专科已预约，保存的数据里转诊也指向了这个新预约。
  - 每次运行都必须留下证据：截图、保存的状态，以及没有浏览器报错。
  - 某一步失败时，它会告诉你它能看到哪些按钮。
  - 结束时，它只关掉自己启动的东西。
S08:
- en: 'Both tools came from trying two skills in a public plugin called pstack, on Friday afternoon, in two commits twenty-seven minutes apart. Anthropic''s own advice for Claude Code says the same thing plainly: give the agent a check to run, or you become the test suite.'
  zh:
  - 这两个工具都来自一个公开插件 pstack 里的两个 skill，是周五下午试用时做的，两次提交相隔 27 分钟。
  - Anthropic 自己给 Claude Code 的建议说得很直白：给 agent 一个能跑的检查，否则你自己就成了测试。
- en: 'What waits for you: choosing the fix for the expired referral, and trying the app-driving tool on your own laptop; so far it has only run in the cloud. And the pull request is still a draft. The last episode asked whether layers can stand in for a human review. Here are two more: a check that tries every order, and an agent that uses the real app.'
  zh:
  - 等你来做的事：选定过期转诊的修法，以及在你自己的电脑上试一下这个操作 App 的工具；目前它只在云端跑过。
  - 这个 PR 也还是草稿。
  - 上一集问的是：层层叠加的检查，能不能代替人工审查。
  - 这里又多了两层：一个试遍所有顺序的检查，和一个真的去用 App 的 agent。
S09:
- en: 'So: one tool walks every order of actions in a small world and hands back the shortest story that breaks a rule. The other uses the real app like a parent and keeps the evidence. The first was checked by breaking it on purpose; the second, by running every flow end to end.'
  zh:
  - 所以：一个工具在小世界里走遍所有操作顺序，交回打破规则的最短复现。
  - 另一个工具像家长一样真的去用 App，并留下证据。
  - 第一个是靠故意改坏来检验的；第二个是靠把每个流程从头到尾跑一遍。
- en: Three questions. What does the exhaustive check try that an ordinary test doesn't? Why break your own code on purpose? And why does the check fail when the bug gets fixed?
  zh:
  - 三个问题。
  - 穷举检查试了哪些普通测试不会试的东西？
  - 为什么要故意把自己的代码改坏？
  - 为什么 bug 修好以后，检查反而会失败？
- en: 'Next: before any backend code is written, how do you choose the backend?'
  zh:
  - 下一集：在写任何后端代码之前，后端怎么选？
