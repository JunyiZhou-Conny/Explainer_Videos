publish:
  title_zh: "项目周记 E5 · agent 怎么证明自己改对了：穷举每一种顺序，再真的去点一遍"
  description_zh: |
    我的创业项目（给中国家长和在美留学生的就医导航原型）每周 PR 的概念讲解，第 5 集。
    一个没人发现过的 bug：转诊过期以后，页面还开着时提交，过期的转诊照样被关联上，245 个测试全部通过。agent 是怎么找到它的？在一个很小的世界里试遍所有操作顺序（约 1.4 万个状态，不到一秒），每个状态都检查五条规则，并给出最短的复现；为什么要故意把自己的代码改坏五次（从没见过失败的检查什么也证明不了）；亚马逊怎样用同样的思路找到 35 步才出现的数据丢失 bug；第二个工具怎样像家长一样操作真实的 App、留下证据；以及还有什么在等人来决定。
    所有案例都是虚构的；不是医疗建议。英文旁白，中英双语字幕。
  tags_zh: [AI, AI agent, 软件工程, 软件测试, 形式化验证, Claude, 创业, 科普]
  tid: 231
