papers: []                     # not a paper: a course tutorial walkthrough
course:
  name: "AC215 · MLOps & LLMOps (Harvard, Fall 2026)"
  lecture: 3
  lecture_title: "Containers II"
  ed: https://edstem.org/us/courses/97373/lessons/166033/
  repos:
    - {repo: dlops-io/mega-pipeline, branch: main, commit: c6bbc9ba88984e1234b68ccf5cdf7c00f7e9accc,
       sections: ["Clone this Repository", "Connecting the Pipeline Components", "GCS Bucket Details",
                  "GCP Credentials File", "Time to Build — The Five Components",
                  "Quick Reference — Running Each Component", "Appendix",
                  "transcribe_audio/README.md", "generate_text/README.md", "synthesis_audio_en/README.md",
                  "translate_text/README.md", "synthesis_audio/README.md"]}
