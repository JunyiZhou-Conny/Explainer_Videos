description: |
  AC215（哈佛 MLOps & LLMOps）第 3 讲“容器 II”的跟练视频：照着 dlops-io/mega-pipeline 的 README 自己写 Dockerfile，构建并运行五个组件的镜像，把一段录音变成英文和法文播客，五个容器之间只靠一个 Cloud Storage 存储桶传递数据。你会弄清绑定挂载（bind mount）把什么直接写进你的笔记本、为什么 uv add 之后要退出并重新构建镜像、服务账号密钥和应用默认凭据（ADC）怎样让代码调用 Google Cloud，以及怎样用 .dockerignore 把密钥挡在镜像之外。英文旁白，配中文和中英双语字幕；终端输出录于 2026-10-13，录制时没有课程密钥，所以调用 Google 的步骤只展示命令和该看什么。
