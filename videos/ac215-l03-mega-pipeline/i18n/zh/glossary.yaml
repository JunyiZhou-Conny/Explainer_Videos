- en: 'import / imports / module / modules / comes with Python'
  zh_subtitle: 'import / 导入 / 模块 / Python 自带'
  first_use: 'S03：前几个 import 是 Python 自带的，但两个 Google Cloud 模块和 ffmpeg 不是。'
