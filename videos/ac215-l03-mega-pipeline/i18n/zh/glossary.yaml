- en: 'compilers / libraries / Google''s libraries'
  zh_subtitle: '编译器 / 库 / Google 的库'
  first_use: 'S06：最大的一层就是那个 RUN，比其他层大得多：842 MB 的编译器、ffmpeg 和它们的库。'
  note: ''
- en: 'help / dash dash help / the help text / the README''s block / line for line'
  zh_subtitle: '帮助 / --help / 帮助文本 / README 里那段 / 逐行一致'
  first_use: 'S08：第 9 步：python cli.py --help。'
  note: 'ask cli.py for its help → 让 cli.py 打印帮助.'
