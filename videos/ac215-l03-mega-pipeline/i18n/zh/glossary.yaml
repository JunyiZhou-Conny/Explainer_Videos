# Chinese (zh-CN) glossary and translation rules for ac215-l03-mega-pipeline (AC215 lecture 3, Containers II,
# a follow-along of dlops-io/mega-pipeline), code-switching version, SUBTITLES ONLY.
# Audience: Chinese-speaking AC215 grad students who read technical English fluently; register of a Chinese
# MLOps TA running a lab section. Precedent and source of the shared decisions:
# videos/ac215-l01-vms-venvs/i18n/zh (the series pilot); every term L1 already decided keeps L1's form unless
# a rule below says why not (A2, A11).
# There is NO Chinese voice in this series: the Chinese lines are subtitles on the English timing (the bilingual
# band of output/<id>.zh-en.mp4, <id>.zh.srt, <id>.zh-en.srt / .ass). So no say:, no anchors, no readings, no
# durations: only display rules. But `python -m explainer.i18n check` still applies its voice hygiene to the
# displayed line when a sentence has no say: (brackets, maths symbols, letter_letter names, Latin words not
# listed here, a missing half-width space): rule D3 is how the Chinese line stays clean without say:.
# Human-readable copy in Chinese: GLOSSARY.md (keep the two in sync).
# terms[].zh_subtitle = the display form (Chinese subtitle line; titles use the written forms of A4);
# terms[].first_use = an example sentence for the translators (each one passes the checker);
# rules are tagged [A1]..[I2]: A terms, B typography, C numbers, D narration file, G subtitles, H titles and
# companions, I toolkit notes. (L1's E on-screen strings and F voice rules do not apply: nothing on screen is
# translated in this series, and there is no voice.)
# Read by: python -m explainer.i18n check (Latin words allowed in the Chinese line: every Latin word of
# zh_subtitle and first_use, plus allowed_spoken_latin, which lists the words as the checker's regex cuts them:
# group-01 is the token group-, MP3 is MP, cli_11.py is cli and py) and explainer/subtitles.py (2-3 word English
# phrases of `en` are kept on one English line; 2-7 character Chinese headwords of zh_subtitle are registered in
# jieba for every video, so zh_subtitle holds terms, not example phrases).
video: ac215-l03-mega-pipeline
lang: zh-CN (mainland Simplified Chinese)
audience: 'Chinese-speaking AC215 (MLOps & LLMOps) grad students who know Python and basic ML, read technical English fluently, did L1 (a VM, venvs, uv) and L2 (a given Dockerfile, image vs container, the layer cache, Docker Hub), and now write their own Dockerfiles; they follow along on their own laptop with the mega-pipeline README open. Register of a Chinese MLOps TA running a lab section.'
voice: none          # subtitles only (video.yaml: Chinese = i18n/zh/narration/*.yaml on the English timing)
policy: 'The Mandarin of a Chinese MLOps TA walking a lab section through the steps, code-switching only where such a speaker really does, written as subtitles under an English narration. The viewers are Chinese-speaking AC215 grad students who read technical English fluently and already say 起一个 container, 构建 image, 把 repo clone 下来, push 到 Docker Hub, 激活 venv. Every choice passes three tests: what is said in a real lab section; the standard, searchable Chinese name (Docker and Google Cloud Chinese docs); and consistency with the series pilot (L1). (1) Artifacts verbatim: what the viewer types or matches on screen (commands, flags, file and folder names, paths, package names, config keys, Dockerfile instructions, terminal text and error names, the on-screen tags, README headings) is copied letter for letter, never translated, inflected or quoted; the one exception the checker forces is a name with an underscore, written the way the narration says it (A6). Nothing on screen is translated in this series: terminal output, code panels, README cards, tags and the tracker stay English; only the narration is. (2) Lab-speech English, a closed list: L1''s venv, shell, root, repo, clone, commit, import, traceback, lock 文件, plus, for the container lectures, container, image, Dockerfile, bucket, pipeline, bind mount, push, tag (打 tag), prompt (an LLM prompt only), API, ID. (3) Everything else in standard Chinese: 构建, 重新构建, 构建步骤 k, 构建上下文, 构建参数, 层, 可写层, 缓存, 挂载, 工作目录, 指令, 配置卡片, 目录, 终端, 提示符, 包, 软件包, 依赖, 激活, 解析, 密钥, 服务账号, 凭据, 应用默认凭据, 访问令牌, 身份验证, 授权, 客户端, 请求, 对象名, 前缀, 阶段, 组件, 组名, 排行榜, 转写, 合成, 翻译, 播客. (4) The video''s metaphors by meaning, one word each: 柜子 and 抽屉 (the bucket), 窗 (the bind mount), 路标 (the key variable), 取件单 (a long-running operation), 包裹 and 多米诺骨牌 (from L2), 清单 and 小票 (pyproject.toml and uv.lock, from L1). (5) Written register for titles, meta.yaml and companion docs: 仓库, 克隆, 提交, 容器, 镜像, 存储桶, 推送, 绑定挂载. (6) The bilingual band puts the English sentence under every Chinese line, so the Chinese line carries no glosses and no brackets at all (the checker forbids them without say:). (7) The toolkit''s constraints are part of the policy: one Chinese sentence per English sentence (158 blocks, 310 sentences), a checker-clean display line (D3), an en_display wherever the SAY spells an artifact out as words (D4). Mainland Simplified Chinese; relaxed, clear lab-section speech, never slangy.'
rules:
- '[A1] Code-switching scope. English stays in three places only. (a) Artifacts, copied letter for letter: commands and subcommands (git clone, cd, cd .., ls, ls -a, cat, grep, echo, which, readlink, curl, sh, pip install uv, uv --version, uv init --bare, uv add, uv sync, python cli.py, docker version, docker build, docker run, docker images, docker history, docker image ls, docker image rm, docker image prune, docker login, docker tag, docker push, git status, git check-ignore, git add -f, chown, winpty, exit), flags (--rm, -ti, -v, -t, -d, -u, -g, -s, -p, -f, --download, --transcribe, --upload, --generate, --translate, --synthesis, --help, --bare, --version), file and folder names (Dockerfile, .dockerignore, .gitignore, pyproject.toml, uv.lock, cli.py, main.py, cli_11.py, mega-pipeline.json, README.md, secrets/, /app, /home/app/.venv, /secrets), package names (google-cloud-storage, google-cloud-speech, ffmpeg-python, google-genai, google-cloud-texttospeech, google-cloud-translate, requests, build-essential, ffmpeg, curl, pip, uv), Dockerfile instructions (FROM, ARG, ENV, RUN, USER, WORKDIR, COPY), config keys (requires-python), terminal text and error names (command not found, ModuleNotFoundError, No module named google, DefaultCredentialsError, permission denied, cannot access, No such file or directory, the input device is not a TTY, CACHED, None, download, Transcribing, Uploading), the on-screen tags when the narration names them (your turn, extra; A11) and README headings (Appendix). The one exception is a name with an underscore (A6). (b) Products, organisations, the course and names: Google, Google Cloud, Cloud Storage, Speech-to-Text, Text-to-Speech, Vertex AI, Gemini 2.5 Flash Lite, IAM, ADC, Docker, Docker Desktop, Docker Engine, Docker Hub, VS Code, Git, Git BASH, PowerShell, Canvas, GitHub, Debian, Python, PyPI, Unicode, MP3, FLAC, ElevenLabs, macOS, Linux, Windows, Mac, AC215, Tutorial 0, MLOps Learning, mega-pipeline, dlops-io, group-01, student, app. (c) A closed list of words Chinese MLOps engineers say in English in a lab section: from L1 venv, shell, root, repo, clone, commit, import, traceback, lock 文件; new in the container lectures container, image, Dockerfile, bucket, pipeline, bind mount, push, tag (打 tag), prompt (an LLM prompt only; the shell prompt is 提示符), API, ID. A word joins (c) only if lab speech really uses the English and the Chinese is stiff, ambiguous or collides with another term. Never English for flavour: no layer, build, cache, mount (the verb), key, token, credentials, service account, client, request, package, dependency, folder, terminal, stage, component, drawer, leaderboard.'
- '[A2] container and image. The subtitles say container and image, as a TA does in the lab: 起一个 container, 构建 image, image 里, container 退出时; measure word 个 (一个 container, 五个 image). Titles, chapter names, meta.yaml and companion docs write 容器 and 镜像 (A4): that is what L1 wrote in its four preview sentences (which were written register in effect) and what Docker''s Chinese docs use. Never 镜像 in a subtitle (it is also the everyday word for a Debian mirror, which L1 calls 软件源). container ID → container ID / container 的 ID; image name → image 名; the official Python 3.12 image → 官方的 Python 3.12 image; five images → 五个 image (no plural).'
- '[A3] The rest of Docker in Chinese. build → 构建 (构建 image, 这次构建); rebuild → 重新构建; build step k (BuildKit''s [k/5], the TEAL badge "build step k") → 构建步骤 k, number after the noun, so it never looks like a README step (第 k 步, A7); build steps 1 to 3 → 构建步骤 1 到 3; the five build steps → 五个构建步骤; build context → 构建上下文; build argument (ARG) → 构建参数; layer → 层 (一层, 不产生层, 同一层里); writable layer → 可写层; the throwaway layer → 用完就扔的那一层 (L1: 用完就扔); cache → 缓存, cached / come from the cache → 用缓存 (the terminal word CACHED stays); live view → 实时视图; full log → 完整日志; instruction → 指令 (RUN 指令); config card (L2''s picture) → 配置卡片; mount (verb) → 挂载 (把当前目录挂载到 /app); bind mount (the noun) stays; working folder (WORKDIR) → 工作目录; run → 运行 / 跑; start a container → 启动 container / 起一个 container; exit → 退出 (the command exit stays); removed on exit → 退出时被删掉; push → push, tag → 打 tag, log in → 登录, untagged → 没有 tag 的.'
- '[A4] Written vs spoken pairs. Subtitles say repo / clone / commit / container / image / bucket / bind mount / push; titles, chapter names, meta.yaml and the companion docs write 仓库 / 克隆 / 提交 / 容器 / 镜像 / 存储桶 / 绑定挂载 / 推送. The repo as a subject is 这个 repo. Commands are unaffected (git clone, docker push stay).'
- '[A5] Writing artifacts. Copied verbatim (case, dots, slashes, hyphens unchanged); never translated, inflected, quoted, put in 《》 or code formatting. Add a Chinese head noun where it helps: uv sync 这条命令, pyproject.toml 这个文件, .dockerignore 文件, secrets 目录, --rm 参数, ffmpeg-python 这个包, FROM 那一行, RUN 指令. Never start a sentence with an artifact or a kept-English word: put a Chinese word first (输入 docker build……; 这个 pyproject.toml……; 而 git status……; 用 -v……), which also keeps the subtitle from opening on a lower-case word.'
- '[A6] Names with an underscore. The checker reads the display line as speech when there is no say:, and it rejects letter_letter (a voice would read 下划线). The SAY never speaks these names with their underscore either: it says transcribe audio, text prompts, uv project environment, the key variable. So the Chinese line writes such a name the way the narration says it: the underscore becomes a space, lower case as in the SAY, always with a Chinese head noun so it reads as a name (transcribe audio 目录 / 组件 / image / 的 README; text prompts 抽屉; uv project environment 这个变量); or names it by its role where the English only points at it (第 10 行那个变量, 组件 A, 组名). Table: transcribe_audio → transcribe audio; generate_text → generate text; synthesis_audio_en → synthesis audio en (the SAY spells E-N for the voice); translate_text → translate text; synthesis_audio → synthesis audio; input_audios → input audios; text_prompts → text prompts; text_paragraphs → text paragraphs; text_audios → text audios; text_translated → text translated; output_audios → output audios; group_name → 组名; GOOGLE_APPLICATION_CREDENTIALS → 指向密钥的那个变量 / 第 10 行的变量; UV_PROJECT_ENVIRONMENT → uv project environment 这个变量 / 第 9 行那个变量; VIRTUAL_ENV → venv 变量; GEMINI_MODEL → Gemini 模型变量; DEBIAN_PACKAGES → 构建参数; long_running_recognize → 长时间运行的 recognize 调用; the ElevenLabs key file → 一个密钥文件. A command that contains such a name (cd transcribe_audio, docker build -t transcribe_audio .) is never written out in the Chinese line: describe it (cd 进 transcribe audio 目录；docker build，加上 -t 和 image 名), and the English line gives the literal command through en_display (D4). cli_11.py passes the checker (an underscore before a digit) and stays as is. The object name text_prompts/group-01/input-….txt is described in parts (前缀 text prompts，加上组名 group-01，再加上 input- 开头的文件名). When the toolkit lets display lines keep underscores (I1), replace the spaced forms with the literals from this table.'
- '[A7] Disambiguation pairs. 第 k 步 (a README tracker step) vs 构建步骤 k (a BuildKit build step). 目录 (any folder, always in terminal talk, never 文件夹, as L1) vs 抽屉 (a bucket prefix in the cabinet picture) vs 前缀 (the prefix as a string). bucket (the Cloud Storage bucket) vs 柜子 (its drawing). 包 (a Python package: uv add, pip) vs 软件包 (an apt / Debian package); 依赖 (what pyproject.toml lists) vs 包 (what gets installed): 要了 3 个包，装了 26 个. 提示符 (the shell prompt) vs prompt (the Gemini prompt, S12) vs 提示 (a hint, a note). 参数 (flags and printed arguments; never flag) vs 构建参数 (ARG) vs 变量 / 环境变量 (ENV). 密钥 (the key file, the service-account key) vs 访问令牌 (the short-lived token made from it; also Docker Hub''s access token) vs 凭据 (credentials, what the auth library looks for). 身份验证 (authentication: who is calling) vs 授权 (authorization: may it do this). 服务账号 vs 账号 (a Google or Docker Hub account). 层 (an image layer) vs 可写层 (the container''s). 复制 (COPY, the copy step) vs 挂载 (the mount): the mount never copies; a file written under /app is 直接写进你笔记本上的目录, never 复制回去 / 同步回去. 构建 (build) vs 生成 (generate: the Gemini step). 转写 (transcribe) vs 翻译 (translate) vs 合成 (synthesize). 上传 / 下载 (to and from the bucket) vs push (to Docker Hub). 退出 (exit the container) vs 删除 (docker image rm, a removed container) vs 清理 (clean up). 组名 (group name) vs 用户名 (user name). 播客稿 (the podcast script B writes) vs 脚本 (a program: 附加脚本, 安装脚本). 小票 (the receipt = uv.lock, from L1) vs 取件单 (the ticket stub = a long-running operation). 清单 (the list = pyproject.toml, from L1''s 愿望清单) vs 软件包列表 (apt''s package lists). 窗 / 这扇窗 (the bind-mount metaphor) vs 窗口 (a terminal or editor window) vs Windows (the OS). 路标 (the key variable) vs 关键行 (the landmarks of the full log). 错误 (generic) vs 异常 (a Python exception) vs 报错 (the message on screen), as L1.'
- '[A8] Register: a TA running a lab section. Short instructions, colloquial verbs (装, 跑, 删, 敲, 输入, 改); address the viewer as 你 (one-to-one follow-along; never 您, 大家, 同学们); 我们 is us at recording time (我们录的时候没有课程密钥). Chinese word order; restructure freely inside a sentence. No translationese: no 让我们… (use 我们来… / 先…), no 这就是为什么… (use 所以…), few 被 passives, no chains of 一个…的. No internet slang. Carry the spoken rhythm by meaning: Here''s the chain when it works → 正常情况下，链条是这样的; One honest limit → 有一点先说清楚; so all is well → 所以没问题; Surprise one → 第一个意外; Speed round → 快速过一遍; races through → 飞快地走完; Now the trap → 现在来看那个坑; for real → 这次是真的; Better still → 更好的办法是; Welcome back → 欢迎回来; Two asides → 补充两句; guard it like a credit card → 像保管信用卡一样保管它.'
- '[A9] Precision. Translate hedges exactly: only 只, every 每个, at once 马上, up to 最多, about 大约 / 约, under 不到, or newer 及以上, may 可以 / 可能, usually 通常, never 从不 / 永远不. at the time of recording is always 录制时 and never dropped (uv 0.13.0, Python 3.15.0, Docker Engine 29). Versions, sizes, counts, line, step and build-step numbers match the screen exactly. Errata are gentle and always followed by the fix: a small mistake 一个小错误, a small slip 一个小疏漏, one harmless slip 一个无害的小疏漏, a small gap 一个小缺口. Ponder questions (S02, S06, S07, S12, S14) ask without answering, and the wording must not give the answer away (S12 must not say uv downloads a Python; S14 must not say the key is inside). The mount wording of A7 is binding (the script''s rule: nothing travels along the window). Billing: billed to the course''s project → 记在课程项目的账上, not yours → 不是你的.'
- '[A10] Names. Products, companies and course names stay Latin (A1 b); 哈佛 only in titles and the description. Course: AC215; lecture n → 第 n 讲 (as in lecture 2 → 和第 2 讲一样); last lecture → 上节课; next lecture → 下节课; this lecture → 这节课; part 1 / part 2 → 第一部分 / 第二部分; Tutorial 0 stays; the instructor → 授课老师 (never a name; the README heading that names him is not quoted); the staff → 课程团队; last year''s solution → 去年的参考答案 (its branch: solution 分支); later tutorials → 后面的教程. The user names student and app, the group name group-01 and the component letters A to E stay; a container ID is never read out.'
- '[A11] The screen stays English. This series translates the narration only: terminal output and prompts, terminal titles, code panels (comments included), README cards and chips, the tracker (README › transcribe_audio, step k of N), tags (your turn, extra, illustration, expected, erratum, recorded without the key, billed to the course project, at the time of recording, stand-in file · not a real key), captions and the with your key, look for cards are all English, and the scenes need no language changes. So when the narration names an on-screen tag, the subtitle names it as the screen shows it: 黄色的 your turn 标签, 灰色的 extra 标签 (L1 wrote “轮到你了” because it planned translated on-screen tags; L3 has none). Everything the narration says in its own words is translated: an extra check → 额外检查, the tracker → 进度条, code panels → 代码面板. Narration paraphrasing the README says README 里说…….'
- '[A12] Mainland Simplified Chinese only: 默认, 程序, 代码, 文件, 目录, 服务器, 网络, 内存, 磁盘, 脚本, 视频, 用户名, 信息, 账号, 令牌; never 預設, 程式, 程式碼, 檔案, 資料夾, 伺服器, 網路, 記憶體, 磁碟, 腳本, 影片, 使用者, 帳號, 權杖.'
- '[A13] Series words this script does not use. The series list of lab-speech English (the ac215-video skill) also keeps port, volume, PATH, endpoint, embedding, agent, LoRA and CI in English; none of them is spoken here (the -v flag makes a bind mount, never a volume; path is the plain word 路径, a relative path 相对路径; PATH the variable never comes up). Later lectures take them from that list, and L1''s 接口 for endpoint gives way to it there, as 容器 / 镜像 do here (A2).'
- '[B1] Spacing. One half-width space between Chinese and Latin letters, digits or artifacts (输入 docker build, Python 3.12, 第 9 行, 26 个包, 1.35 GB, secrets 目录, container 里). The checker reports a missing space on every displayed sentence. Spaces inside an artifact stay as they are (uv init --bare); never add one inside an artifact. No space next to full-width punctuation (……cd mega-pipeline。, 用户 app，). Never fake a no-break space with U+00A0 / U+202F.'
- '[B2] Punctuation. Full-width ，。、；：？！“”…… in Chinese text, also next to artifacts (输入 exit。). Lists use 、 (google-cloud-storage、google-cloud-speech、ffmpeg-python). No brackets of any kind, neither （） nor () nor 《》 nor 【】: the checker rejects them on a line with no say:, and the bilingual band needs no gloss. “” only for a quoted thought or word in Chinese (问它“我是谁”); artifacts and tag names are never quoted. No 。？！ inside one Chinese sentence (one per English sentence): use ，；： instead. A full-width colon after 第 N 步 and 构建步骤 N when a description follows. Questions keep ？.'
- '[B3] Symbols. The checker rejects maths symbols on a line with no say: (= < > + → ← ^ ≤ ≥ × ÷ ≈, == != +=), a digit followed by !, and letter_letter names (A6). So relations are said in words: requires-python 是 3.11 及以上 (never >=3.11), 最低版本 3.12, 一个 1 在括号里 → 带括号的 1. A command whose literal holds quotes, brackets or = (docker run --rm -ti -v "$(pwd):/app" …, the requires-python line, the docker login line) is never copied into the Chinese line: name its parts (docker run，加上 --rm、-ti、带挂载的 -v，再加上 image 名), and the English line shows it through en_display only where the SAY spells it. Allowed and kept as on screen: / in paths (/home/app/.venv, secrets/), . in file names, - in flags and names, && (用 && 串起来), @ (@ 符号后面), $ never needed. ~ is not used.'
- '[C1] Numbers in display text. Arabic digits for everything that echoes the screen, the terminal or the code: step numbers (第 7 步, 第 10 到 12 步), build steps (构建步骤 2), line numbers (第 21 行, 第 5 到 10 行, 第 84 到 91 行), counts on screen (26 个包, 237 个软件包, 1 个包, 3 个包 when set against 26), user ID 1000, group-01, versions, sizes, times, the date. Chinese numerals for small narrative counts and ordinals: 五个组件, 五个 image, 四处变化, 三个动作, 两个额外检查, 两个意外, 三个常见原因, 六个代码块, 第一个阶段, 第一部分 / 第二部分, 第一题…第五题. When the English uses a word for a number the screen shows as a digit, follow the screen (three packages asked for, and 26 installed → 要了 3 个包，装了 26 个); when the screen shows nothing, follow the English (all three → 三条都跑一遍).'
- '[C2] Units and versions. Sizes as on screen with a half-width space: 1.35 GB, 1.48 GB, 842 MB, 205 MB, 105 MB, 约 845 MB, 约 138 KB, 82 字节, 0 字节 (zero bytes). Times: 46.9 秒, 0.6 秒, 不到 10 秒, 最多 90 秒, 最多 300 秒. Versions with their name: Python 3.11.2, Python 3.12, Python 3.14, 3.15.0, uv 0.13.0, Docker Engine 29, Debian 12, Gemini 2.5 Flash Lite. Ranges of versions: 3.13 及以上, 3.14 或更新. Dates: 2026 年 10 月 20 日 (October 20, 2026).'
- '[D1] Sentence alignment (explainer/i18n.py). One entry per SAY line of script.md in narration/*.yaml (158 blocks); `en` byte-equal to the SAY line; `zh` has exactly one item per English sentence as split by explainer.voice.split_sentences (310 in this script). Restructure only inside a sentence; never merge or split. Short sentences keep their own item: Ponder this. → 来想一想。; Pause and run it. → 暂停一下，自己跑一遍。; Welcome back. → 欢迎回来。; Time to clean up. → 该清理了。. Run python -m explainer.i18n check videos/ac215-l03-mega-pipeline --lang zh until it prints OK.'
- '[D2] No say:, no anchors. There is no Chinese voice: never write say: (the display line is the only text) and never write anchors: (they only place animation beats for a Chinese-voiced render). The subtitles are timed by the English audio; the toolkit pairs each Chinese sentence with its English sentence by position.'
- '[D3] A checker-clean display line. With no say:, every displayed sentence must pass explainer.i18n.spoken_problems: no brackets (B2), no maths symbols, no letter_letter names (A6), no digit followed by !, no clause ending in 种 followed by ，。！？ (rephrase: 三种情况。), a half-width space between Hanzi and Latin or digits (B1), each sentence ending in 。！？ or …… (optionally followed by ” or 」), and every Latin word in this glossary (zh_subtitle, first_use or allowed_spoken_latin). The checker cuts words with the regex [A-Za-z][A-Za-z''.-]*: group-01 is the word group-, MP3 is MP, /home/app/.venv is home, app and venv. A Latin word it reports is either an English word to translate (the usual case) or a missing artifact: add the artifact to allowed_spoken_latin, cut the same way, and to the matching term.'
- '[D4] The English line (en_display). In the bilingual band the English line shows the SAY sentence, which spells artifacts out for the voice (dash dash r m, dash t i, dash v, slash app, slash home slash app slash dot venv, secrets slash mega-pipeline dot json, dot gitignore, dot dockerignore, secrets slash, uv dash dash version, uv init dash dash bare, python cli.py dash dash help / download / transcribe / upload, dash d / dash t / dash u, git add dash f, cd dot dot, main dot py, ffmpeg dash python, transcribe dash audio, input dash something dot t x t, T-T-Y, E-N, double ampersands, the at sign). Every such sentence gets an en_display item with the literal on-screen form (--rm, -ti, -v, /app, /home/app/.venv, secrets/mega-pipeline.json, .gitignore, .dockerignore, secrets/, uv --version, uv init --bare, python cli.py --help, -d, -t, -u, git add -f, cd .., main.py, ffmpeg-python, transcribe-audio, input-….txt, TTY, synthesis_audio_en, &&, @), otherwise word for word the SAY sentence; null for the other sentences of the block. Underscore names (A6) are restored to their literal in en_display only inside a command the viewer types (cd transcribe_audio, docker build -t transcribe_audio .); a plain mention keeps the SAY''s spoken form on both lines. The English video''s own .srt is unaffected.'
- '[D5] Content parity. Each Chinese sentence translates its English sentence and nothing more: no added commands, flags, glosses, Chinese console names or explanations; 额外 only where the English marks an extra; no Chinese gloss of a kept-English term (the English line is right below).'
- '[D6] Fixed patterns. Pause and run it. → 暂停一下，自己跑一遍。 …, and pause to run it. → ……，然后暂停，自己跑一遍。 Pause, and catch up to here. / Pause and catch up. → 暂停一下，跟上进度。 Pause, and get to this point. → 暂停一下，跟到这一步。 Pause and make the change. → 暂停一下，把它改好。 Pause and run all three (steps). → 暂停一下，三步都跑一遍。 Pause to run X, then exit and rebuild. → 暂停一下，跑 X，然后退出、重新构建。 Pause now and write it: → 现在暂停，把它写出来： Pause at the yellow your-turn tag → 看到黄色的 your turn 标签就暂停. a gray extra tag marks a command not in the README → 灰色的 extra 标签表示这条命令 README 里没有. An extra check, not in the README → 一个额外检查，README 里没有. Two extra checks. → 两个额外检查。 Another extra: → 再加一个额外检查： Two more extras. → 再做两个额外检查。 Last extra: → 最后一个额外检查： An extra tip: → 额外提示一句： Ponder this. → 来想一想。 The ponder''s answer, for real: → 刚才那道题的答案，这次是真的： Step N: → 第 N 步： Steps 8 and 9: → 第 8 和第 9 步： Steps 10 to 12: → 第 10 到 12 步： With your key, look for … → 有密钥的话，要找的是…… A small mistake: → 一个小错误： Five questions to test yourself. → 五道自测题。 One: … Five: → 第一题：…… 第五题： Answers are in the exercises; every command is in the study guide. → 答案在练习里；每条命令都在学习指南里。 Next lecture: → 下节课： Welcome back. → 欢迎回来。'
- '[D7] Files. narration/g1.yaml = S01-S07 (part 1), narration/g2.yaml = S08-S15 (part 2), as in L1; each starts with a comment header (what it covers, the rules it applies: A6 spaced names, D4 en_display, no say:/anchors) and keeps the script order. Strings in double quotes; YAML-escape a literal double quote or backslash.'
- '[D8] Length on the English timing. The Chinese is read while the English is heard, and the band switches where the English pieces switch (a Chinese piece that would read faster than 9 units a second gets at most 1 s more). Keep each Chinese sentence about as long to read as the English is to hear: as a rule of thumb at most about 2 units per English word (a CJK character 1, a Latin character 0.55), so cut filler connectives and repeated subjects, never content. Long artifacts (google-cloud-texttospeech is 14.3 units) count: do not repeat them where the English does not.'
- '[G1] Widths. Bilingual band: a Chinese line holds at most 30 units, the English line 96 characters; the Chinese-only sidecar (.zh.srt) holds 22 units a line, 2 lines a cue. Write clauses of at most about 24 units, separated by ，；：, so the splitter has clean places to cut; avoid a clause longer than 30 units with no punctuation.'
- '[G2] Cue endings: the toolkit drops a cue-final 。，、；： and keeps ？！…… and a closing ” (subtitles.strip_end). Do not end a sentence on an artifact plus a full stop if a Chinese word can close it (……的 ffmpeg 程序。 reads better than ……ffmpeg。, but both are valid).'
- '[G3] Commands are never broken. The splitter treats a space between two Latin words in a Chinese line as a good cut, so uv init --bare or python cli.py --download can land on two lines, which a viewer cannot copy. Put a whole command at the end of a clause after a full-width colon (第 9 步：python cli.py --help。), at most one command per cue, with little Chinese around it; a command too long for one line (uv add google-cloud-storage google-cloud-speech ffmpeg-python, about 30 units) is not written out in the Chinese line: say 用一条 uv add 命令把三个包都加上 and let the terminal and the English line show it. Check every cue with a command in the rendered .zh.srt.'
- '[H1] Titles (meta.yaml). Video, part and chapter titles in the written register (A4: 容器, 镜像, 存储桶, 仓库, 克隆); questions keep their question mark; the English colon structure is kept (uv add：……, generate_text：……); commands, folder and file names stay as they are, underscores included (meta.yaml is not checked). The core-concept chapter carries the English short name for search: 谁在调用？密钥与应用默认凭据（ADC）. Containers II → 容器 II (so Containers I is 容器 I in L2).'
- '[H2] Description (Bilibili / YouTube): two or three sentences: this is the AC215 lecture 3 follow-along of dlops-io/mega-pipeline; what the viewer builds and learns (five Dockerfiles, the bucket as the only link, the bind mount, the uv add → exit → rebuild loop, the key and ADC, .dockerignore); English narration with Chinese and bilingual subtitles, captures dated 2026-10-13, Google calls shown as the command and what to look for. Written register, terms of this glossary.'
- '[H3] Companions: i18n/zh/README.md (and exercises.md / digest.md if made) are translated with this glossary in the written register (仓库, 克隆, 提交, 容器, 镜像, 存储桶, 推送, 绑定挂载（bind mount）, 构建上下文, 应用默认凭据（ADC）, 长时间运行的操作); brackets and underscores are fine there (not checked). Headings and <summary>答案</summary> are translated. A term table at the end: English | the term used here | common variants (镜像层, 绑定挂载, 存储桶, 服务帐号 → 服务账号, LRO).'
- '[H4] Code and commands stay byte-identical in the companions: code blocks, commands, file names and inline `code` are unchanged; only # comments and the prose around them are translated.'
- '[I1] (request) explainer.i18n check applies its voice hygiene (_SPOKEN_BAD: brackets, maths symbols, letter_letter names) to the display line when a sentence has no say:. For a subtitles-only video (this series; video.yaml has no languages.zh.voice and the glossary says voice: none) those checks guard nothing and force A6 and B3. Proposal: skip _SPOKEN_BAD for display-only sentences when the glossary''s voice is none (keep the Latin-word, spacing and sentence-end checks). Then A6 becomes: underscore names verbatim (transcribe_audio 目录), by the A6 table.'
- '[I2] (todo, from L1 I3) explainer/subtitles.py''s _cuts treats a space between Latin words in a Chinese line as a good cut, so commands can be split (G3). Proposal: in a Chinese line, treat a run of Latin tokens separated only by spaces as unbreakable unless it alone exceeds a line.'
terms:
# ---------------------------------------------------------------- containers, images, builds
- en: 'container / containers / in its own container / inside the container / five containers'
  zh_subtitle: 'container / 容器（书面）'
  first_use: 'S01：五个程序，各自在自己的 container 里，把它变成英文和法文的播客，彼此之间从不发一条消息。'
  note: 'Lab speech (A2), measure word 个. Titles, meta.yaml and docs write 容器 (A4), as L1 did. Never 集装箱.'
- en: 'image / images / five images / the image''s Python / the official Python 3.12 image'
  zh_subtitle: 'image / 镜像（书面）'
  first_use: 'S01：你要自己写 Dockerfile，而且要构建五个 image，而不是一个。S05：第 1 行从 Debian 12 上的官方 Python 3.12 image 开始。'
  note: 'Lab speech (A2). Never 镜像 in a subtitle (also the everyday word for a mirror); written register 镜像. image name → image 名; the image''s own Python → image 自带的 Python.'
- en: 'container ID / the container''s ID / user ID 1000'
  zh_subtitle: 'container ID / 用户 ID 1000'
  first_use: 'S07：@ 符号后面是 container 的 ID，每次运行都不一样。'
  note: 'ID stays (lab speech). Never read the ID itself.'
- en: 'Dockerfile / write the Dockerfile / a file named Dockerfile, with no extension'
  zh_subtitle: 'Dockerfile / 一个名叫 Dockerfile、没有扩展名的文件'
  first_use: 'S05：第 4 步是这节课的核心：这里没有 Dockerfile，所以你要自己写，一块一块地拼起来。'
  note: 'A file name and the course''s word; measure word 个. Plural Dockerfiles → 这些 Dockerfile (A7 of L1: no inflection).'
- en: 'build / builds the image / the build / rebuild / rebuild the image'
  zh_subtitle: '构建 / 重新构建 / 这次构建'
  first_use: 'S06：第 5 步构建 image。S11：README 给的办法是：退出，然后用同一条 docker build 命令重新构建 image。'
  note: 'A3. The command docker build stays. Not build in a subtitle (except inside the command).'
- en: 'build step / build step 2 / build steps 1 to 3 / the five build steps'
  zh_subtitle: '构建步骤 / 构建步骤 2 / 构建步骤 1 到 3 / 五个构建步骤'
  first_use: 'S06：构建步骤 2 是我们那个大 RUN：apt 装了 237 个软件包，下载了 205 MB，然后 pip 装好 uv，一共 46.9 秒。'
  note: 'BuildKit''s [k/5], the TEAL badge build step k. Number after the noun; a README step is always 第 k 步 (A7).'
- en: 'build context / the build context'
  zh_subtitle: '构建上下文'
  first_use: 'S06：最后一个点代表当前目录，也就是构建上下文。'
  note: 'Docker''s Chinese docs. L2''s picture: the parcel (包裹).'
- en: 'build argument / ARG / a variable that exists only during the build'
  zh_subtitle: '构建参数 / 只在构建期间存在的变量'
  first_use: 'S05：第 3 行声明了一个构建参数，一个只在构建期间存在的变量：Debian 软件包 build-essential 和 ffmpeg。'
  note: 'Kept apart from 参数 (flags) and 环境变量 (ENV). Its name DEBIAN_PACKAGES is never written (A6).'
- en: 'layer / one layer / no layers / the biggest layer / one fat layer / B''s big layer'
  zh_subtitle: '层 / 一层 / 不产生层 / 最大的一层 / 一个特别大的层'
  first_use: 'S05：和第 2 讲一样，它们只写在配置卡片上，不产生层。S13：所以 Docker 直接复用了 B 的那个大层。'
  note: '层 is what Chinese engineers say (镜像层 in writing). Never layer in a subtitle.'
- en: 'writable layer / a thin writable layer / the throwaway layer / thrown away on exit'
  zh_subtitle: '可写层 / 一层薄薄的可写层 / 用完就扔的那一层'
  first_use: 'S07：和第 2 讲一样，container 会在上面加一层薄薄的可写层，--rm 让它在退出时被扔掉。'
  note: 'throwaway → 用完就扔 (L1''s word for the VM). on the container''s throwaway layer → 在 container 那层用完就扔的可写层上.'
- en: 'cache / cached / come from the cache / CACHED'
  zh_subtitle: '缓存 / 用缓存 / 直接用缓存 / CACHED'
  first_use: 'S06：构建步骤 1 到 3 直接用缓存。S11：构建步骤 2 和 3 用了缓存。'
  note: 'The terminal word CACHED stays when the narration points at it.'
- en: 'live view / compact live view / full log / landmarks'
  zh_subtitle: '实时视图 / 精简的实时视图 / 完整日志 / 关键行'
  first_use: 'S06：你的终端显示的是精简的实时视图；这里是完整日志里的几处关键行。'
  note: 'landmarks → 关键行, not 路标 (the signpost metaphor, S09).'
- en: 'instruction / RUN instruction / chained with double ampersands'
  zh_subtitle: '指令 / RUN 指令 / 用 && 串起来'
  first_use: 'S05：第 12 到 21 行是一条 RUN 指令，用 && 串起来，所以只产生一层。'
  note: 'en_display writes && for double ampersands (D4).'
- en: 'Dockerfile instructions: FROM / ARG / ENV / RUN / USER / WORKDIR / COPY / the FROM line / the copy line'
  zh_subtitle: 'FROM / ARG / ENV / RUN / USER / WORKDIR / COPY / FROM 那一行 / COPY 那一行'
  first_use: 'S05：先敲 FROM 那一行，再把 README 的六个代码块按顺序复制到下面。'
  note: 'Verbatim; the copy step → 复制那一步 or COPY 那一步, never 挂载 (A7).'
- en: 'config card / card-only lines / writes on the config card'
  zh_subtitle: '配置卡片 / 只写配置卡片的那几行'
  first_use: 'S11：只写配置卡片的那几行显示 0 字节。'
  note: 'L2''s picture of the image config.'
- en: 'working folder / WORKDIR / make /app the working folder'
  zh_subtitle: '工作目录 / WORKDIR'
  first_use: 'S05：第 23 和 24 行切换到这个用户，并把 /app 设成工作目录。'
  note: ''
- en: 'user app / user ID 1000 / owns /app / running as root / security risk'
  zh_subtitle: '用户 app / 用户 ID 1000 / 拥有 /app / 用 root 运行 / 安全风险'
  first_use: 'S05：最后，它创建一个叫 app 的用户，用户 ID 1000，拥有 /app：README 里说，用 root 运行有安全风险。'
  note: 'root stays (L1).'
- en: 'run / runs the image / start a new container / a fresh container / exit / removed'
  zh_subtitle: '运行 / 跑 / 启动 container / 起一个新的 container / 退出 / 被删掉'
  first_use: 'S11：输入 exit，container 连同那层用完就扔的可写层一起被删掉，26 个包也跟着没了。'
  note: 'The command exit stays.'
- en: 'bind mount / mount / mounts the current folder onto /app / the mount'
  zh_subtitle: 'bind mount / 挂载 / 挂载到 / 绑定挂载（书面）'
  first_use: 'S01：bind mount 开了一扇通往你笔记本的窗。S07：用 -v 把当前目录，也就是 pwd，挂载到 /app 上。'
  note: 'The noun stays (lab speech, Docker''s mode name); the verb is 挂载. Never say the mount copies (A7).'
- en: 'dash v / dash dash r m / dash t i / pwd / the current folder / quotes included'
  zh_subtitle: '-v / --rm / -ti / pwd / 当前目录 / 连引号一起'
  first_use: 'S07：输入 docker run，加上 --rm、-ti、带挂载的 -v，再加上 image 名。'
  note: 'The literal -v "$(pwd):/app" is never written in Chinese (B3); en_display carries the flags.'
- en: 'Docker / Docker Desktop / Docker Engine / docker version'
  zh_subtitle: 'Docker / Docker Desktop / Docker Engine / docker version'
  first_use: 'S01：我们录制用的是一台 Debian 12 笔记本，录制时是 Docker Engine 29。'
  note: 'On a Mac or Windows, Docker Desktop runs the containers → 在 Mac 或 Windows 上，由 Docker Desktop 来跑 container.'
- en: 'docker build / docker run / docker images / docker history / docker image ls / docker image rm / docker image prune'
  zh_subtitle: 'docker build / docker run / docker images / docker history / docker image ls / docker image rm / docker image prune'
  first_use: 'S15：然后暂停，用 docker image rm 删掉这五个 image，这也是额外步骤。'
  note: 'Verbatim. A full docker build or docker run line with an image name is not written in Chinese (A6, B3).'
- en: 'Docker Hub / push / tag / log in / access token / untagged / user name'
  zh_subtitle: 'Docker Hub / push / 打 tag / 登录 / 访问令牌 / 没有 tag 的 / 用户名'
  first_use: 'S14：先在那里创建一个访问令牌，然后登录、打 tag、push。'
  note: 'Written register 推送 (A4). untagged → 没有 tag 的. The placeholders USER NAME and ACCESS TOKEN are never typed out.'
- en: 'dot dockerignore / dot gitignore / secrets slash'
  zh_subtitle: '.dockerignore / .gitignore / secrets/'
  first_use: 'S14：解决办法第 2 讲也推荐过，在这里算额外步骤：一个叫 .dockerignore 的文件，只有一行：secrets/。'
  note: 'en_display: .dockerignore, .gitignore, secrets/ (D4).'
- en: 'Git BASH / winpty / the input device is not a T-T-Y / put winpty in front'
  zh_subtitle: 'Git BASH / winpty / the input device is not a TTY / 在前面加上 winpty'
  first_use: 'S07：在 Windows 上，这些命令要在 Git BASH 里跑，pwd 两边的引号要保留；如果 docker run 报 the input device is not a TTY，就在前面加上 winpty。'
  note: 'The error text verbatim with TTY (en_display TTY for T-T-Y).'
# ---------------------------------------------------------------- Python, uv, packages
- en: 'uv / uv init dash dash bare / uv add / uv sync / uv dash dash version / the installer / restart your terminal'
  zh_subtitle: 'uv / uv init --bare / uv add / uv sync / uv --version / 安装脚本 / 重启终端'
  first_use: 'S04：现在是这一步本身：uv init --bare。'
  note: 'uv stays (L1). command not found stays. installed uv 0.13.0 at the time of recording → 录制时装的是 uv 0.13.0. The project name uv init writes is transcribe-audio (uv turns the folder''s underscore into a hyphen): write it verbatim, 项目名叫 transcribe-audio (no underscore, so the checker accepts it; listed in allowed_spoken_latin).'
- en: 'pyproject.toml / uv.lock / the list / the receipt / lock file'
  zh_subtitle: 'pyproject.toml / uv.lock / 清单 / 小票 / lock 文件'
  first_use: 'S08：清单 pyproject.toml 和小票 uv.lock 都在 /app 里，所以它们直接写进了你的笔记本。'
  note: 'L1''s metaphors: wish list 愿望清单 / receipt 购物小票（简称小票）. lock 文件 as L1 (never 锁文件).'
- en: 'package / packages / Debian packages / apt''s package lists'
  zh_subtitle: '包 / Debian 软件包 / 软件包列表'
  first_use: 'S05：它更新 Debian，装上我们要的软件包，再在同一层里删掉 apt 的软件包列表，所以它们不占空间。'
