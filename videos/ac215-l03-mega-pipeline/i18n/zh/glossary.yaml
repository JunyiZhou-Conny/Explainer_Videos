- en: 'system Python / Debian''s system Python / the image''s own Python / uv''s own Python / uv''s folder'
  zh_subtitle: '系统 Python / Debian 的系统 Python / image 自带的 Python / uv 下载的 Python / uv 的目录'
  first_use: 'S05：和第 1 讲里 Debian 的系统 Python 不同，这个 Python 属于 image，所以 pip 可以往里装。'
