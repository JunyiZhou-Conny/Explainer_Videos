- en: 'pip / upgrades pip / pip install uv'
  zh_subtitle: 'pip / 升级 pip / pip install uv'
  first_use: 'S05：然后它升级 pip，再用 pip 装上 uv。'
  note: ''
- en: 'ffmpeg / ffmpeg dash python / build essential / curl / the ffmpeg program'
  zh_subtitle: 'ffmpeg / ffmpeg-python / build-essential / curl / ffmpeg 程序'
  first_use: 'S08：这个包叫 ffmpeg-python；单单一个 ffmpeg 是另一个项目。'
  note: 'en_display: ffmpeg-python for ffmpeg dash python.'
- en: 'package names: google-cloud-storage / google-cloud-speech / ffmpeg-python / google-genai / google-cloud-texttospeech / google-cloud-translate / requests'
  zh_subtitle: 'google-cloud-storage / google-cloud-speech / google-genai / google-cloud-texttospeech / google-cloud-translate / requests'
  first_use: 'S13：运行它，加上 storage 和 text to speech：一共 24 个包。'
