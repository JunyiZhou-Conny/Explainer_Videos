# zh narration for S01-S08 (the single part, group g1: the L15 exam edition, pipelines as DAGs, .output edges,
# maximum safe overlap, enforcing order, Model Registry / endpoint / deploy / predict, the cheese app pipeline and
# SageMaker Pipelines, seven rules), sentence-aligned to script.md v2: one zh sentence per English sentence
# (explainer.voice.split_sentences; 76 SAY lines, 186 sentences). Terms and rules: ../GLOSSARY.md, ../glossary.yaml
# (binding).
# Subtitles only: there is no Chinese voice in this series, so no say: and no anchors (rule D2); the zh line is shown
# on the English timing, so each sentence keeps the English order of ideas and about its length (D8, D9: S02[8] and
# S08[0] keep "until" after "nothing runs", S06[3] keeps the condition after the reuse, S06[4] keeps "while deployed"
# after the payment, S06[8] keeps "until" after "not callable").
# Underscore names and code expressions are written the way the SAY speaks them (rule A6: square root, bytes inputs,
# sync 设为 True, .after, .outputs 在方括号里写上输出的名字); no brackets and no symbols the checker refuses (B2, B3:
# 2 加 3 加 10 加 1, 224 乘 224). Numbers as digits where the SAY writes digits (C1: 凌晨 1 点, 75 分钟, 16 分钟, 5 秒).
# Sentences never open with an artifact or a lower-case kept-English word, except the recap label .after： (A5).
# Fixed phrases of the ponders and takeaways from D6 (来做一题 / 想停的话，就在这里暂停 / 答案是 B / 题目说……，就想：……);
# the ponder lead-ins (S03[8], S04[7], S05[7]) give nothing away (A9).
# en_display: the English subtitle line where the SAY spells an artifact as words (rule D4: .output,
# .outputs["name"], .after(), @dsl.component, @dsl.pipeline, kfp, dependentTasks, square-2, sync=True, bytes_inputs,
# raw.zip, clean.zip, the model/ folder, cheese-app-endpoint, base64, the Keras ExportArchive, the DSL, and
# "background & jobs" for S05[1]); null = the SAY text.

S01:
- en: "Three nightly jobs on a clock. Prepare the data at 1 in the morning. Train at 2. Deploy at 3. For months, it works."
  zh:
  - "时钟上排着每晚的三个任务。"
  - "凌晨 1 点准备数据。"
  - "2 点训练。"
  - "3 点部署。"
  - "几个月来，一切正常。"
- en: "Then one night, preparation takes 75 minutes. At 2, training starts anyway, on a file that is only half written. At 3, deployment ships whatever training produced."
  zh:
  - "后来有一晚，准备数据花了 75 分钟。"
  - "2 点，训练照样开始，读的是一个只写了一半的文件。"
  - "3 点，部署把训练出来的东西发布了出去。"
- en: "Every job exits with status zero. Nothing failed. And the endpoint now serves a model trained on half the data. Nothing was right either."
  zh:
  - "每个任务的退出码都是 0。"
  - "没有一个失败。"
  - "而 endpoint 现在提供的，是一个只用一半数据训练出来的模型。"
  - "可也没有一个是对的。"
- en: "The lecture opens on the same problem: four steps of the cheese app, each run by a person at a terminal. How do we execute these steps? Can we automate this flow?"
  zh:
  - "课上也从同一个问题讲起：cheese app 的四个步骤，每一步都由一个人在终端上运行。"
  - "这些步骤要怎么执行？"
  - "能不能把这个流程自动化？"
- en: "To automate it, you need a different instruction. Not: train at 2. Instead: train when preparation has finished. That is what a pipeline is for."
  zh:
  - "要自动化，你需要一条不同的指令。"
  - "不是：2 点训练。"
  - "而是：准备数据完成之后再训练。"
  - "这正是 pipeline 的用处。"
- en: "Here is the plan: graphs, wires, overlap, order, deployment, and the cheese app."
  zh:
  - "接下来的安排：图、连线、重叠、顺序、部署，还有 cheese app。"
- en: "The gray tag, top right, names the slides behind each idea. Nothing here is a live run."
  zh:
  - "右上角的灰色标签，标出每个想法背后的课件页。"
  - "这里没有任何现场运行。"
- en: "If an option schedules steps at fixed times, think race: a clock knows nothing about data."
  zh:
  - "选项要是在固定时间调度步骤，就想：竞态，时钟对数据一无所知。"
S02:
- en: "Workflow management, in the lecture's words, knows which step needs which. The structure that records this is a directed acyclic graph, or DAG."
  zh:
  - "工作流管理，用课上的话说，知道哪一步需要哪一步。"
  - "记录这件事的结构叫有向无环图，也就是 DAG。"
- en: "Directed, because data flows one way, from producer to consumer. Acyclic, because no step ever waits on itself. Tasks are the nodes; data dependencies are the edges."
  zh:
  - "有向，是因为数据只朝一个方向流，从生产者流到消费者。"
  - "无环，是因为没有哪一步会等它自己。"
  - "这些 task 就是节点；数据依赖就是边。"
- en: "Vertex AI Pipelines runs these graphs for you. You describe the graph with Kubeflow Pipelines, the K F P library, and there is no Kubernetes to manage. Today's console calls it Agent Platform."
  zh:
  - "Vertex AI Pipelines 替你运行这些图。"
  - "你描述这个图用的是 Kubeflow Pipelines，也就是 kfp 这个库，而且不用你管 Kubernetes。"
  - "现在的控制台把它叫作 Agent Platform。"
  en_display:
  - null
  - "You describe the graph with Kubeflow Pipelines, the kfp library, and there is no Kubernetes to manage."
  - null
- en: "Here is the toy pipeline from the slides and the demo repo. Three Python functions marked d s l dot component: square, add and square root. A fourth, marked d s l dot pipeline, wires them together."
  zh:
  - "这是课件和示例 repo 里的那个玩具 pipeline。"
  - "三个标了 @dsl.component 的 Python 函数：square、add 和 square root。"
  - "第四个标了 @dsl.pipeline，把它们连起来。"
  en_display:
  - null
  - "Three Python functions marked @dsl.component: square, add and square root."
  - "A fourth, marked @dsl.pipeline, wires them together."
- en: "When the pipeline function runs, the component calls compute nothing. Calling square on a, the pipeline's input, which defaults to 3, creates a task: a node in the graph, with an empty output socket. No number yet."
  zh:
  - "在 pipeline 函数运行时，这些 component 调用什么都不算。"
  - "在 a 上调用 square，a 是 pipeline 的输入，默认值是 3，这会创建一个 task：图里的一个节点，带着一个空的输出插口。"
  - "还没有数字。"
- en: "Line by line, four calls drop four nodes. Square is called twice, so one component gives two tasks; the second is named square 2. The function ran once, and produced only a graph."
  zh:
  - "一行一行地，四个调用放下四个节点。"
  - "这里 square 被调用了两次，所以一个 component 产生了两个 task；第二个叫 square-2。"
  - "这个函数只跑了一次，产出的只有一个图。"
  en_display:
  - null
  - "Square is called twice, so one component gives two tasks; the second is named square-2."
  - null
- en: "The compiler presses that graph into a YAML file. The Vertex AI SDK, the lecture's remote control, submits it as a pipeline job. Your laptop compiles and submits. Vertex executes."
  zh:
  - "编译器把这个图压成一个 YAML 文件。"
  - "Vertex AI SDK，也就是课上说的遥控器，把它提交成一个 pipeline 任务。"
  - "你的笔记本负责编译和提交。"
  - "执行的是 Vertex。"
- en: "Only now, on Google's machines, does each task get a container, and do numbers appear."
  zh:
  - "直到这时，在 Google 的机器上，每个 task 才有了 container，数字才出现。"
- en: "If an option says calling train in the pipeline function trains the model, think again: it only creates a task. Nothing runs until the compiled job runs."
  zh:
  - "选项要是说，在 pipeline 函数里调用 train 就会训练模型，再想想：它只是创建了一个 task。"
  - "什么都不会运行，要等到编译好的任务真正运行。"
S03:
- en: "Look at the add call. For x, it passes the first square task, dot output. For y, the second task, dot output. So what is being passed?"
  zh:
  - "看这个 add 调用。"
  - "对 x，它传的是第一个 square task 的 .output。"
  - "对 y，传的是第二个 task 的 .output。"
  - "那传的到底是什么？"
  en_display:
  - null
  - "For x, it passes the first square task, .output."
  - "For y, the second task, .output."
  - null
- en: "Not a number. Dot output is a placeholder for a value that exists only after the upstream task succeeds. Plugging it in draws a wire."
  zh:
  - "不是一个数。"
  - "这里的 .output 是一个占位符，代表一个只有上游 task 成功之后才存在的值。"
  - "把它接上，就画出了一根连线。"
  en_display:
  - null
  - ".output is a placeholder for a value that exists only after the upstream task succeeds."
  - null
- en: "The compiled YAML writes down each wire twice: add's dependent tasks list square and square 2, and each input names its producer task."
  zh:
  - "编译出来的 YAML 把每根连线写了两遍：add 的 dependentTasks 列出 square 和 square-2，每个输入也写明了它的生产者 task。"
  en_display:
  - "The compiled YAML writes down each wire twice: add's dependentTasks list square and square-2, and each input names its producer task."
- en: "At run time, square turns green, and only then does 9 ride the wire into add. One argument gave add both its data and its dependency."
  zh:
  - "运行的时候，square 变绿，然后 9 才顺着连线进入 add。"
  - "一个参数，就同时给了 add 数据和依赖。"
- en: "With several outputs, you name the one you want: dot outputs, with the output's name in brackets."
  zh:
  - "有多个输出时，就点名要哪一个：用 .outputs，在方括号里写上输出的名字。"
  en_display:
  - "With several outputs, you name the one you want: .outputs[\"name\"], with the output's name in brackets."
- en: "Now the contrast. Often the output is itself a path: the file this run wrote. With the wire, train gets that exact path, after prep succeeds. Hard-code a path instead, and there is no wire: train starts right away, alongside prep."
  zh:
  - "再看对比。"
  - "输出本身常常就是一个路径：这次运行写出的文件。"
  - "有了连线，train 拿到的正是那个路径，而且是在 prep 成功之后。"
  - "改成把路径写死，就没有连线：train 马上开始，和 prep 一起跑。"
- en: "The file there is last week's, and the step succeeds on stale data. A guessed path looks like a dependency to you, not to the pipeline."
  zh:
  - "那里的文件是上周的，这一步在过期数据上成功了。"
  - "猜出来的路径在你看来像依赖，在 pipeline 看来不是。"
- en: "For order without data, dot after adds a dashed edge: the task waits for the other one to succeed, but nothing travels down it."
  zh:
  - "要只管顺序、不传数据，就用 .after 加一条虚线边：这个 task 会等另一个成功，但边上什么都不传。"
  en_display:
  - "For order without data, .after() adds a dashed edge: the task waits for the other one to succeed, but nothing travels down it."
- en: "Try one. Pause here if you want."
  zh:
  - "来做一题。"
  - "想停的话，就在这里暂停。"
- en: "B. Naming the output hands over this run's file, and creates the wait. A hard-codes a path: no edge, so train may start at once and read last run's file."
  zh:
  - "答案是 B。"
  - "点名这个输出，就把这次运行的文件传了过去，也建立了等待。"
  - "A 把路径写死了：没有边，所以 train 可能马上开始，读到上一次运行的文件。"
- en: "C waits, but it reads a path you assumed, not the one split reported. D fails before anything runs: with two outputs, K F P refuses plain dot output."
  zh:
  - "C 会等，但它读的是你假设的路径，不是 split 报告的那个。"
  - "D 在任何东西运行之前就失败了：有两个输出时，kfp 不接受单独的 .output。"
  en_display:
  - null
  - "D fails before anything runs: with two outputs, kfp refuses plain .output."
- en: "If the question says dot output, think: waits for success, and gets this run's value. A hard-coded or guessed path: no edge, maybe stale. Dot after: order, but no data."
  zh:
  - "题目说 .output，就想：等上游成功，拿到这次运行的值。"
  - "写死或猜出来的路径：没有边，可能过期。"
  - ".after：有顺序，没有数据。"
  en_display:
  - "If the question says .output, think: waits for success, and gets this run's value."
  - null
  - ".after(): order, but no data."
S04:
- en: "Back to the toy graph. No path of wires connects the two square tasks, so Vertex is free to run them at the same time."
  zh:
  - "回到那个玩具图。"
  - "两个 square task 之间没有连线组成的路径，所以 Vertex 可以同时运行它们。"
- en: "Add is a join. Its YAML lists both squares as dependent tasks, so it starts only when the second one finishes."
  zh:
  - "这个 add 是一个汇合点。"
  - "它的 YAML 把两个 square 都列为 dependentTasks，所以它只在第二个完成之后才开始。"
  en_display:
  - null
  - "Its YAML lists both squares as dependentTasks, so it starts only when the second one finishes."
- en: "The same shape, one size up: one preprocessing task, two trainings that read its output, and a comparison that reads both models."
  zh:
  - "同样的形状，放大一号：一个预处理 task，两个读它输出的训练，再加一个读两个模型的比较。"
- en: "A task lights up when every incoming wire carries a token. Both trainings start together, and the comparison starts exactly when the slower one ends."
  zh:
  - "一个 task 亮起来，要等每根输入连线都带上值。"
  - "两个训练一起开始，比较正好在慢的那个结束时开始。"
- en: "Add an edge the data does not need: same answer, longer run."
  zh:
  - "加一条数据不需要的边：答案一样，跑得更久。"
- en: "Replace those wires with guessed paths, and the comparison starts at time zero and reads half-finished results. That is a race."
  zh:
  - "把这些连线换成猜出来的路径，比较就会在 0 时刻开始，读到没算完的结果。"
  - "这就是竞态。"
- en: "Maximum safe overlap means exactly the edges the data needs, no more and no fewer. The run then lasts its longest path. If an upstream task fails, the join never runs."
  zh:
  - "最大安全重叠的意思是：数据需要的边，一条不多，一条也不少。"
  - "这样一次运行的时长就等于它的最长路径。"
  - "如果上游有 task 失败，汇合点就永远不会运行。"
- en: "Your turn to compute one. Pause here if you want."
  zh:
  - "轮到你算一题。"
  - "想停的话，就在这里暂停。"
- en: "B, 16 minutes. The longest path is ingest, clean, the big training, and compare. 2, plus 3, plus 10, plus 1. The small training and the report overlap with the big one."
  zh:
  - "答案是 B，16 分钟。"
  - "最长路径是 ingest、clean、大的那个训练和 compare。"
  - "2 加 3 加 10 加 1。"
  - "小的那个训练和 report 都和大的那个重叠。"
- en: "A adds every task in sequence. D runs the two trainings one after the other. C ignores the edges: training needs clean data, and compare waits for both models."
  zh:
  - "A 把所有 task 依次加起来。"
  - "D 让两个训练一个接一个地跑。"
  - "C 忽略了这些边：训练需要清洗过的数据，compare 要等两个模型。"
- en: "If there is no path of wires between two steps, think parallel. If a step consumes several outputs, it waits for all of them."
  zh:
  - "两个步骤之间要是没有连线组成的路径，就想：并行。"
  - "一个步骤要是用到多个输出，就会等齐所有输出。"
S05:
- en: "Now the sequence: preprocess, train, deploy. Here are four ways to make each step wait, on one clock."
  zh:
  - "现在说顺序：预处理、训练、部署。"
  - "这里有四种让每一步等待的办法，放在同一个时钟上。"
- en: "Lane one, cron offsets. Lane two, background ampersands. Lane three, an event starts training when preprocessing writes its output, and deploy takes the best model in the tracker. Lane four, pipeline edges."
  zh:
  - "第一条泳道：cron 错开时间。"
  - "第二条泳道：后台的 &。"
  - "第三条泳道：一个事件在预处理写出输出时启动训练，部署取实验追踪工具里最好的模型。"
  - "第四条泳道：pipeline 的边。"
  en_display:
  - null
  - "Lane two, background & jobs."
  - null
  - null
- en: "Roll the length of preprocessing. 40 minutes. Then 75. Then 55."
  zh:
  - "掷一下骰子，决定预处理要多久。"
  - "40 分钟。"
  - "然后 75。"
  - "然后 55。"
- en: "The clock lane is fine at 40, and broken at 75: training reads a half-written file. The background lane is broken on every roll, because nothing waits."
  zh:
  - "时钟那条泳道在 40 没问题，75 就出错：训练读到一个写了一半的文件。"
  - "后台那条泳道每次都出错，因为什么都不等。"
- en: "The tracker lane fails twice. The event can fire on the first file, before preprocessing is done. And the tracker's best model is the best of all runs, not this run's. Only the edge lane is right on every roll. It just stretches."
  zh:
  - "追踪工具那条泳道错在两处。"
  - "这个事件可能在第一个文件写出来时就触发，那时预处理还没做完。"
  - "而且追踪工具里最好的模型，是所有运行里最好的，不是这次运行的。"
  - "只有边那条泳道每一次都是对的。"
  - "它只是被拉长了。"
- en: "The cheese app pipeline does exactly this: processing after collection, training after processing, deployment after training, each with dot after."
  zh:
  - "这个 cheese app 的 pipeline 正是这样做的：采集之后处理，处理之后训练，训练之后部署，每一步都用 .after。"
  en_display:
  - "The cheese app pipeline does exactly this: processing after collection, training after processing, deployment after training, each with .after()."
- en: "In the compiled YAML they become dependent tasks. And the README says it plainly: each step starts only after the previous one succeeds."
  zh:
  - "在编译出来的 YAML 里，它们变成了 dependentTasks。"
  - "README 也说得很直白：每一步都要等上一步成功之后才开始。"
  en_display:
  - "In the compiled YAML they become dependentTasks."
  - null
- en: "One more, a subtle one. Some steps only launch work on another machine. Remember exactly what an edge waits for. Pause here if you want."
  zh:
  - "再来一题，有点绕。"
  - "有些步骤只是在另一台机器上启动工作。"
  - "记清楚一条边到底在等什么。"
  - "想停的话，就在这里暂停。"
- en: "B. An edge waits for the task, and this task succeeded after 5 seconds. The pipeline never sees the job it launched, so A is wrong, and deploy may ship the previous model."
  zh:
  - "答案是 B。"
  - "一条边等的是 task，而这个 task 5 秒后就成功了。"
  - "这个 pipeline 从来看不到它启动的任务，所以 A 是错的，deploy 可能把上一个模型发布出去。"
- en: "C: dot after needs no data. D: dot after is enforced, written into the YAML as a dependent task."
  zh:
  - "C：.after 不需要数据。"
  - "D：.after 是强制执行的，会作为 dependentTasks 的一项写进 YAML。"
  en_display:
  - "C: .after() needs no data."
  - "D: .after() is enforced, written into the YAML as a dependent task."
- en: "The repo's training step is such a launcher. With sync set to true, it waits for its job, and fails if the job fails, so deploy never runs on a failed training. A recent commit made that wait explicit."
  zh:
  - "这个 repo 的训练步骤就是这种只负责启动的步骤。"
  - "把 sync 设为 True 之后，它会等自己的任务，任务失败它也失败，所以 deploy 永远不会在失败的训练之后运行。"
  - "最近一次 commit 把这个等待写明了。"
  en_display:
  - null
  - "With sync=True, it waits for its job, and fails if the job fails, so deploy never runs on a failed training."
  - null
- en: "If an option uses cron offsets, background commands, or the best model from the tracker, think race or wrong model. Edges from preprocess to train to deploy are correct by construction."
  zh:
  - "选项要是用 cron 错开时间、后台命令，或者追踪工具里最好的模型，就想：竞态，或者部署错了模型。"
  - "从预处理到训练再到部署的边，从结构上就保证了正确。"
S06:
- en: "The lecture draws deployment in five steps: get the saved model, update its signature, upload it to a bucket, register it, and deploy it to an endpoint."
  zh:
  - "课上把部署画成五步：拿到保存的模型，更新它的签名，上传到 bucket，注册，再部署到 endpoint。"
- en: "The signature step moves preprocessing into the model: decode the JPEG, convert to floats, resize to 224 by 224, then call the model. The slides save it one way, the repo with the Keras export archive."
  zh:
  - "签名这一步把预处理搬进模型里：解码 JPEG，转成浮点数，缩放到 224 乘 224，再调用模型。"
  - "课件用一种方式保存，repo 用的是 Keras 的 ExportArchive。"
  en_display:
  - null
  - "The slides save it one way, the repo with the Keras ExportArchive."
- en: "Registering creates a catalog card. It records where the files are, and which container serves them. Nothing is running, and it costs nothing. Can you call it? Not yet."
  zh:
  - "注册就是建一张目录卡片。"
  - "它记录文件在哪里，以及由哪个 container 来提供服务。"
  - "什么都没在运行，也不花钱。"
  - "能调用它吗？"
  - "还不能。"
- en: "Next, the endpoint: an address. The repo reuses cheese app endpoint if it exists, or creates it."
  zh:
  - "接下来是 endpoint：一个地址。"
  - "这个 repo 会复用 cheese-app-endpoint，如果它已经存在；不存在就新建一个。"
  en_display:
  - null
  - "The repo reuses cheese-app-endpoint if it exists, or creates it."
- en: "Deploy slides a machine under that address and sends it all the traffic. From now on, you pay for that machine while it is deployed, even when nobody calls it."
  zh:
  - "部署就是在这个地址下面放一台机器，把全部流量都给它。"
  - "从现在起，你要为这台机器付钱，只要它还部署着，即使没人调用它。"
- en: "To predict, the client wraps each JPEG in base 64, under the key bytes inputs. The signature unfolds it, the model returns four scores, and the largest names the cheese."
  zh:
  - "预测时，客户端把每张 JPEG 用 base64 编码，放在 bytes inputs 这个键下面。"
  - "签名把它解开，模型返回四个分数，最大的那个说出是哪种奶酪。"
  en_display:
  - "To predict, the client wraps each JPEG in base64, under the key bytes_inputs."
  - null
- en: "Cleanup undeploys the model, so the machine stops, then deletes the endpoint. The registry card and the bucket files stay."
  zh:
  - "清理时先取消部署模型，机器就停了，然后删除 endpoint。"
  - "注册的那张卡片和 bucket 里的文件都还在。"
- en: "The pipeline's deploy step makes the same two calls. And by the slides' rule of thumb, Cloud Run fits when the model is one part of a bigger app."
  zh:
  - "这个 pipeline 的部署步骤做的也是这两个调用。"
  - "而按课件的经验法则，Cloud Run 适合模型只是一个更大应用的一部分的时候。"
- en: "If the question says registered, think: not callable until it is deployed to an endpoint. If it says deployed, think: a machine is billing until you undeploy it. Then delete the endpoint too."
  zh:
  - "题目说已注册，就想：还不能调用，要等部署到一个 endpoint 上。"
  - "题目说已部署，就想：机器一直在计费，直到你取消部署。"
  - "然后把 endpoint 也删掉。"
S07:
- en: "Now the whole cheese app pipeline: collector, processor, training, deploy. Each gets a green check as it succeeds."
  zh:
  - "现在看完整的 cheese app pipeline：采集器、处理器、训练、部署。"
  - "每一步成功时，都会打上一个绿色的勾。"
- en: "Two kinds of steps. The collector and processor are container components that pull published images from a registry, Docker Hub in this repo, the Artifact Registry on the slides, because Google's machines cannot see your laptop. Training and deploy are Python components that call the Vertex AI SDK."
  zh:
  - "两类步骤。"
  - "采集器和处理器是 container component，从 registry 拉取发布好的 image，这个 repo 用的是 Docker Hub，课件上是 Artifact Registry，因为 Google 的机器看不到你的笔记本。"
  - "训练和部署是 Python component，调用的是 Vertex AI SDK。"
- en: "So why dot after, and not dot output? The steps never call each other. Each reads from the bucket and writes back: raw zip, clean zip, then the model folder. The pipeline only decides when each step starts."
  zh:
  - "那为什么用 .after，而不用 .output？"
  - "这些步骤从不互相调用。"
  - "每一步都从 bucket 读，再写回去：raw.zip、clean.zip，然后是 model 目录。"
  - "这个 pipeline 只决定每一步什么时候开始。"
  en_display:
  - "So why .after(), and not .output?"
  - null
  - "Each reads from the bucket and writes back: raw.zip, clean.zip, then the model/ folder."
  - null
- en: "So deploy finds the model by name, in the model folder, and the edges make that name safe. Delete one, and deploy may grab last run's model: the stale read from earlier."
  zh:
  - "所以 deploy 按名字在 model 目录里找模型，而这些边保证了这个名字是安全的。"
  - "删掉一条，deploy 就可能拿到上一次运行的模型：也就是前面说的读到过期数据。"
  en_display:
  - "So deploy finds the model by name, in the model/ folder, and the edges make that name safe."
  - null
- en: "One difference from the slides: on the main branch today, training downloads its own dataset, so these edges carry order, not data."
  zh:
  - "和课件有一处不同：现在的 main 分支上，训练会自己下载数据集，所以这些边传的是顺序，不是数据。"
- en: "On AWS, SageMaker Pipelines runs the same idea. The training step's input points at the processing step's output property, and that reference is the edge."
  zh:
  - "在 AWS 上，SageMaker Pipelines 用的是同一个思路。"
  - "训练步骤的输入指向处理步骤的输出属性，这个引用就是边。"
- en: "Shuffle the pipeline's list of steps, and the graph does not move: order comes from the references."
  zh:
  - "把 pipeline 的步骤列表打乱，图也不会动：顺序来自引用。"
- en: "If the question says SageMaker Pipelines, think: the same DAG. Referencing a step's properties makes the edge."
  zh:
  - "题目说 SageMaker Pipelines，就想：同一个 DAG。"
  - "引用一个步骤的属性，就造出了边。"
S08:
- en: "Seven rules. One: pipelines are DAGs. Calling a component creates a task, a node. Nothing runs until the compiled job runs."
  zh:
  - "七条规则。"
  - "第一条：pipeline 是 DAG。"
  - "调用一个 component 就创建一个 task，即一个节点。"
  - "什么都不会运行，要等到编译好的任务真正运行。"
- en: "Two: dot output, or a named output, makes the edge and passes this run's value. Three: a guessed path makes no edge, and may be stale."
  zh:
  - "第二条：.output，或者一个有名字的输出，会造出边，并传递这次运行的值。"
  - "第三条：猜出来的路径不会造出边，还可能是过期的。"
  en_display:
  - "Two: .output, or a named output, makes the edge and passes this run's value."
  - null
- en: "Four: dot after orders without data. Five: no path between tasks means parallel, a join waits for all its inputs, and the run lasts its longest path."
  zh:
  - "第四条：.after 只排顺序，不传数据。"
  - "第五条：task 之间没有路径就是并行，汇合点要等齐所有输入，一次运行的时长等于它的最长路径。"
  en_display:
  - "Four: .after() orders without data."
  - null
- en: "Six: order comes from edges, not clocks, and a step that launches work must wait for it."
  zh:
  - "第六条：顺序来自边，不来自时钟；启动了工作的步骤必须等它完成。"
- en: "Seven: upload to the Model Registry, create an endpoint, deploy, then predict. Billing starts at deploy. SageMaker builds the same DAG from step properties."
  zh:
  - "第七条：上传到 Model Registry，创建一个 endpoint，部署，然后预测。"
  - "计费从部署开始。"
  - "SageMaker 用步骤属性搭出同一个 DAG。"
- en: "And the lecture's chain: a recipe in the D S L, printed as YAML, submitted by the SDK, run on the Kubeflow engine, and managed by Vertex AI Pipelines, with no Kubernetes to set up."
  zh:
  - "还有课上的那条链：用 DSL 写的配方，印成 YAML，由 SDK 提交，在 Kubeflow 引擎上运行，由 Vertex AI Pipelines 托管，不用自己搭 Kubernetes。"
  en_display:
  - "And the lecture's chain: a recipe in the DSL, printed as YAML, submitted by the SDK, run on the Kubeflow engine, and managed by Vertex AI Pipelines, with no Kubernetes to set up."
- en: "When you are done, undeploy and delete the endpoint. Good luck on the quiz."
  zh:
  - "用完之后，取消部署，再删除 endpoint。"
  - "祝你小测顺利。"
