description: |
  AC215（哈佛 MLOps & LLMOps）第 15 讲“Vertex AI 上的机器学习工作流”的考前版，写给 Quiz 4 前一天的你：不跟着敲命令，而是把小测考的机制各画成一张动画图——在 kfp 里，pipeline 是由任务（task）和数据依赖组成的有向无环图（DAG），在 @dsl.pipeline 里调用组件只是创建任务；上游任务的 .output / .outputs 既传递这次运行的值，又造出依赖边，写死或猜出来的路径没有边、可能读到过期数据，.after 只排顺序不传数据；没有路径相连的任务并行运行，汇合点要等齐所有输入，一次运行的时长等于最长路径；预处理 → 训练 → 部署的顺序要靠 pipeline 的边来保证，而不是 cron 错开时间、后台命令或从实验追踪工具里挑最好的模型；部署则是上传到模型注册表（Model Registry）、创建端点（endpoint）、部署（从这一步开始计费）、预测，最后取消部署并删除端点。每个机制都以 dlops-io/ml-workflow 和 model-deployment 仓库里的代码为依据，结尾用 cheese app 的四步 pipeline（数据采集 → 数据处理 → 模型训练 → 模型部署）串起来，并说明 AWS 上的 SageMaker Pipelines 是同一个 DAG 思路；片中有三道小测风格的选择题，逐个讲清每个错误选项错在哪。英文旁白，配中文和中英双语字幕。
