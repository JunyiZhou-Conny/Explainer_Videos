  note: 'bucket stays (L3; written 存储桶). upload → 上传; register → 注册; deploy → 部署 (L2).'
- en: 'signature / serving signature / decode / floats / resize'
  zh_subtitle: '签名 / 解码 / 浮点数 / 缩放'
  first_use: 'S06[1]：签名这一步把预处理搬进模型里：解码 JPEG，转成浮点数，缩放到 224 乘 224，再调用模型。'
  note: 'serving signature → 签名 (written 服务签名). B3: 224 by 224 → 224 乘 224. The signature unfolds it → 签名把它解开.'
- en: 'Keras export archive / ExportArchive'
  zh_subtitle: 'Keras / ExportArchive'
  first_use: 'S06[1]：课件用一种方式保存，repo 用的是 Keras 的 ExportArchive。'
  note: 'The SAY says Keras export archive; the subtitle writes the class name ExportArchive (en_display: the Keras ExportArchive, D4). tf.saved_model.save is on the slide panel only (never in a subtitle: underscores, A6).'
- en: 'Model Registry / catalog card / registry card'
  zh_subtitle: 'Model Registry / 目录卡片'
  first_use: 'S06[2]：注册就是建一张目录卡片。'
  note: 'Model Registry stays (product name; written 模型注册表（Model Registry）). catalog card (the V5 picture) → 目录卡片; the registry card → 注册的那张卡片. Kept apart from registry (L2: a Docker image registry, S07[1]) (A7). Nothing is running, and it costs nothing. → 什么都没在运行，也不花钱。 Can you call it? → 能调用它吗？ Not yet. → 还不能。'
- en: 'address / reuse / cheese app endpoint'
  zh_subtitle: '地址 / 复用 / cheese-app-endpoint'
  first_use: 'S06[3]：这个 repo 会复用 cheese-app-endpoint，如果它已经存在；不存在就新建一个。'
  note: 'cheese app endpoint → cheese-app-endpoint (the endpoint''s display name, en_display, D4). Next, the endpoint: an address. → 接下来是 endpoint：一个地址。 No endpoint id is ever written (A10).'
- en: 'deploy / traffic / billing / machine'
  zh_subtitle: '流量 / 机器 / 计费'
  first_use: 'S06[4]：部署就是在这个地址下面放一台机器，把全部流量都给它。'
  note: 'traffic → 流量; billing → 计费 (L13); you pay for that machine → 你要为这台机器付钱. Money is never quantified (no price is said).'
- en: 'predict / prediction / client / base 64 / bytes inputs / scores'
  zh_subtitle: '预测 / 客户端 / base64 / 键 / bytes inputs / 分数'
  first_use: 'S06[5]：预测时，客户端把每张 JPEG 用 base64 编码，放在 bytes inputs 这个键下面。'
  note: 'base 64 → base64 (en_display, D4); bytes inputs → bytes inputs (A6; en_display bytes_inputs). The four probability bars carry the tag README example; the class is never named (the README does not say which cheese).'
- en: 'cleanup / undeploy / delete'
  zh_subtitle: '清理 / 取消部署 / 删除'
  first_use: 'S06[6]：清理时先取消部署模型，机器就停了，然后删除 endpoint。'
  note: 'undeploy → 取消部署 (the Vertex AI Chinese documentation''s term); delete → 删除.'
- en: 'Cloud Run / rule of thumb'
  zh_subtitle: 'Cloud Run / 经验法则'
  first_use: 'S06[7]：而按课件的经验法则，Cloud Run 适合模型只是一个更大应用的一部分的时候。'
  note: 'The pipeline''s deploy step makes the same two calls. → pipeline 里的部署步骤做的也是这两个调用。'
- en: 'registered / callable / deployed'
  zh_subtitle: '已注册 / 可调用 / 已部署'
  first_use: 'S06[8]：题目说已部署，就想：机器一直在计费，直到你取消部署。'
  note: 'S06''s takeaway, D6 and D9 (English order: billing, then until). If the question says registered, think: not callable until it is deployed to an endpoint. → 题目说已注册，就想：还不能调用，要等部署到一个 endpoint 上。'
