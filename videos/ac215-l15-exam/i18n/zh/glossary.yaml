# Chinese (zh-CN) glossary and translation rules for ac215-l15-exam (AC215 lecture 15, ML Workflows with Vertex AI,
# EXAM EDITION: a 12-15 minute concept-first review for the day before Quiz 4; no captures, no README walkthrough,
# nothing run; mechanisms as animated diagrams, code and README panels from dlops-io/ml-workflow @ 3730009,
# model-deployment @ cf0b7c7 and ml-workflow-aws @ f165c6e as evidence, three new multiple-choice ponders), code-switching
# version, SUBTITLES ONLY. Audience: Chinese-speaking AC215 grad students who read technical English fluently; register
# of a Chinese MLOps TA running a review session the day before the quiz (考前串讲). Precedents and source of the shared
# decisions: the series pilot videos/ac215-l01-vms-venvs/i18n/zh (repo, commit, 笔记本 for a laptop), the container
# lectures L2-L4 (container, image, registry, bucket, 退出码, 部署, 配方, the subtitles-only rule set), L05-L07 (工作流,
# 图 / 边 / 节点), ac215-l08-llm-finetuning (endpoint, 托管, the rule layout A1-I3 this file follows) and the sibling exam
# edition ac215-l13-exam (考前版, 小测, 任务 for a job, 提交, 计费, 连线 for the wire, 实验追踪工具, the D6 fixed phrases
# of the ponders and takeaways). Every term L1-L13 already decided keeps its form; what is new here is the pipeline
# vocabulary (A3): DAG, task, component in the closed English list; 有向无环图, 节点, 边, 依赖, 占位符, 上游, 汇合点,
# 并行, 最大安全重叠, 最长路径, 竞态, 过期数据, 写死, 编译, 签名, 注册, 取消部署 in Chinese.
# There is NO Chinese voice in this series: the Chinese lines are subtitles on the English timing (the bilingual band of
# output/<id>.zh-en.mp4, <id>.zh.srt, <id>.zh-en.srt / .ass). So no say:, no anchors, no readings, no durations: only
# display rules. But `python -m explainer.i18n check` still applies its voice hygiene to the displayed line when a
# sentence has no say: (brackets, maths symbols, letter_letter names, Latin words not listed here, a missing half-width
# space): rules A6, B3 and D3 are how the Chinese line stays clean without say:.
# Human-readable copy in Chinese: GLOSSARY.md (keep the two in sync; both term tables come from the same data).
# terms[].zh_subtitle = the subtitle form (titles and companions use A4's written register); terms[].first_use = one
# example sentence (SNN[k]: scene SNN, SAY block k counted from 0), each one passes the checker; terms[].note = rules.
# Read by: python -m explainer.i18n check (Latin words allowed in a subtitle line: every Latin word of zh_subtitle and
# first_use, plus allowed_spoken_latin) and explainer/subtitles.py (2-3 word English phrases of `en` are kept on one
# English line; 2-7 character Chinese headwords of zh_subtitle are registered in jieba; I3).
video: ac215-l15-exam
lang: zh-CN (mainland Simplified Chinese)
audience: 'An AC215 (MLOps & LLMOps) grad student the day before Quiz 4: sat or skimmed Lecture 15, knows Python, has seen Docker and the cheese app''s collector, processor and trainer in earlier lectures (L2-L4 containers and buckets, L13 Vertex AI custom jobs), may never have run ml-workflow or model-deployment, and watches on a laptop with no clone open to answer conceptual multiple-choice questions on pipelines as DAGs, task.output edges, parallelism, enforcing order and model deployment, and to say why each wrong option is wrong. Register of a Chinese MLOps TA running a review session the day before the quiz.'
voice: none          # subtitles only (video.yaml: Chinese = i18n/zh/narration/*.yaml on the English timing)
policy: 'The Mandarin of a Chinese MLOps TA running a review session the day before the quiz (考前串讲): code-switching only where such a speaker really does, written as subtitles under an English narration. The viewers already say 起一个 container, 建一个 bucket, 推一个 image 到 registry, 调一个 endpoint, 提交一个任务; this video adds 一个 DAG, 创建一个 task, 写一个 component, 上游 task 的 .output, 用 .after 排顺序. Every choice passes three tests: what is said in a real review session; the standard, searchable Chinese name (the Chinese Vertex AI, Kubeflow and algorithms literature: 有向无环图, 节点, 边, 依赖, 上游, 占位符, 并行, 最长路径, 竞态, 编译, 签名, 注册, 部署, 取消部署, 流量, 预测, 计费); and consistency with the series (L1-L13: every form they fixed is kept: repo, commit, container, image, registry, bucket, pipeline, SDK, endpoint, 笔记本 for a laptop, 退出码, 部署, 工作流, 图 / 边 / 节点, 任务 for a job, 提交, 计费, 连线, 实验追踪工具, 小测, 考前版). (1) Artifacts verbatim: what the viewer matches on screen and in the exam options (kfp calls and attributes .output, .outputs, .after, @dsl.component, @dsl.pipeline, the YAML key dependentTasks, the toy''s function and task names, the illustration''s task names, file names raw.zip and clean.zip, the endpoint name cheese-app-endpoint, the request key, class names) is copied letter for letter, never translated, inflected or quoted; the exceptions the checker forces are names with an underscore and the characters = ( ) [ ] " written the way the narration says them (A6, B3). Nothing on screen is translated in this series: code and README panels, diagram labels, chips, tags, the multiple-choice ponder cards, the YELLOW takeaway cards and the seven rule rows stay English; only the narration is. (2) Lab-speech English, a closed list: from the series repo, commit, container, image, registry, bucket, pipeline, SDK, CLI (L1-L6), endpoint (L08); new in this video DAG, task (a node of a pipeline graph, kfp''s PipelineTask), component (a kfp component; container component, Python component). (3) Everything else in standard Chinese: 工作流, 工作流管理, 有向无环图, 有向, 无环, 图, 节点, 边, 依赖, 数据依赖, 生产者, 消费者, 步骤, 函数, 调用, 输入, 输出, 占位符, 上游, 成功, 失败, 连线, 插口, 编译, 编译器, 提交, 执行, 运行, 任务, 训练任务, 机器, 写死, 路径, 过期数据, 顺序, 并行, 汇合点, 预处理, 训练, 比较, 最大安全重叠, 最长路径, 竞态, 时钟, 调度, 错开时间, 后台命令, 事件, 触发, 实验追踪工具, 排行榜, 泳道, 骰子, 数据采集器, 数据处理器, 部署, 签名, 解码, 浮点数, 缩放, 注册, 目录卡片, 地址, 复用, 流量, 计费, 预测, 客户端, 键, 分数, 清理, 取消部署, 删除, 经验法则, 属性, 引用, 步骤列表, 配方, 托管, 题目, 选项, 答案, 规则, 小测. (4) The video''s metaphors by meaning, one word each: 时钟 (the cron clock), 连线 (the wire), 插口 (the output socket), 遥控器 (the SDK, the lecture''s remote control), 压成 (the compiler presses the graph), 汇合点 (a join), 泳道 (V4''s lanes), 骰子 (the die), 目录卡片 (the registry''s catalog card), 地址 (the endpoint), 配方 (the recipe in the DSL). (5) Written register for titles, meta.yaml and companion docs: 仓库, 容器, 镜像, 镜像仓库（registry）, 存储桶, 端点（endpoint）, 有向无环图（DAG）, 任务（task）, 组件（component）, 模型注册表（Model Registry）, 服务签名; pipeline, DAG and kfp stay. (6) The bilingual band puts the English sentence under every Chinese line, so the Chinese line carries no glosses and no brackets at all (the checker forbids them without say:). (7) No person''s name; no project id, bucket name, endpoint id or key (A10). (8) The toolkit''s constraints are part of the policy: one Chinese sentence per English sentence (76 blocks, 186 sentences), a checker-clean display line (D3), an en_display wherever the SAY spells an artifact out as words (D4), the English clause order kept (D9). Mainland Simplified Chinese; clear, unhurried review-session speech, never slangy.'
rules:
- '[A1] Code-switching scope. English stays in three places only. (a) Artifacts, copied letter for letter: kfp calls and attributes as the narration names them (.output, .outputs, .after, @dsl.component, @dsl.pipeline, kfp), the YAML key dependentTasks, the toy''s names (square, add, square root, square-2, a), the illustration''s task names when the SAY names the task (prep, train, split, compare, ingest, clean, report, deploy), the file names raw.zip and clean.zip, the model folder (model 目录), the endpoint name cheese-app-endpoint, the request key bytes inputs, the parameter sync and its value True, class names (ExportArchive), the branch main, base64, the tag names (illustration, README example, slide 37, main today). (b) Names of products, organisations and the course: AC215, Google, Google Cloud, Vertex AI, Vertex AI Pipelines, Kubeflow, Kubeflow Pipelines, Kubernetes, Agent Platform, Model Registry, Artifact Registry, Cloud Run, Docker, Docker Hub, Keras, TensorFlow, Python, YAML, JPEG, AWS, SageMaker, SageMaker Pipelines, GitHub, README, DSL, SDK. (c) Lab-speech English, a closed list: repo, commit, container, image, registry, bucket, pipeline, SDK, CLI (series), endpoint (L08), and new here DAG, task, component (container component, Python component). Everything else is Chinese.'
- '[A2] container, image, registry (as L2-L13). The subtitles say container, image, registry: 每个 task 才有了 container; 发布好的 image; 从 registry 拉取; measure word 个. Titles, chapter names, meta.yaml and companion docs write 容器, 镜像, 镜像仓库（registry）(A4). Model Registry is a product name and never shortened to registry in a subtitle (A7).'
- '[A3] The pipeline vocabulary (new in this video). Graph: workflow management → 工作流管理, directed acyclic graph → 有向无环图 (once, S02[0]), DAG stays, directed / acyclic → 有向 / 无环, graph → 图, node → 节点, edge → 边, dependency / data dependency → 依赖 / 数据依赖, producer / consumer → 生产者 / 消费者, step → 步骤 / 一步, task stays, component stays, pipeline function → pipeline 函数, call / calling → 调用, creates a task → 创建一个 task, compiler / compile → 编译器 / 编译, the compiled YAML → 编译出来的 YAML, submit → 提交, pipeline job → pipeline 任务, executes → 执行, the compiled job → 编译好的任务. Wires: placeholder → 占位符, upstream → 上游, succeeds → 成功, wire → 连线, output socket → 输出插口, plug in → 接上, at run time → 运行的时候, a named output → 有名字的输出, hard-code → 写死, a guessed path → 猜出来的路径, stale data → 过期数据, last run''s → 上一次运行的, this run → 这次运行, order without data → 只管顺序、不传数据, a dashed edge → 虚线边. Overlap: in parallel → 并行, join → 汇合点, token (the value on a wire) → 值, lights up → 亮起来, maximum safe overlap → 最大安全重叠, longest path → 最长路径, race → 竞态, half-finished → 没算完, half-written → 写了一半. Order: preprocess / train / deploy → 预处理 / 训练 / 部署, lane → 泳道, cron offsets → cron 错开时间, background commands / ampersands → 后台命令 / 后台的 &, event → 事件, fire → 触发, tracker → 实验追踪工具 (then 追踪工具), leaderboard → 排行榜, roll → 掷骰子, stretches → 被拉长, launcher → 只负责启动的步骤, correct by construction → 从结构上就保证了正确, the previous model → 上一个模型. Deployment: signature → 签名, decode → 解码, floats → 浮点数, resize → 缩放, upload → 上传, register → 注册, catalog card → 目录卡片, address → 地址, reuse → 复用, traffic → 流量, billing → 计费, predict → 预测, client → 客户端, key → 键, scores → 分数, cleanup → 清理, undeploy → 取消部署, delete → 删除, rule of thumb → 经验法则. AWS: step → 步骤, property → 属性, reference → 引用, list of steps → 步骤列表. Exam: quiz → 小测, question → 题目, option → 选项, answer → 答案, rule → 规则 / 第 n 条, takeaway → 结论.'
- '[A4] Written vs spoken. The subtitles say repo / commit / container / image / registry / bucket / endpoint / task / component; titles, chapter names, meta.yaml and companion docs write 仓库 / 提交 / 容器 / 镜像 / 镜像仓库（registry）/ 存储桶 / 端点（endpoint）/ 任务（task）/ 组件（component）, with the English in brackets at the first use of a core concept (brackets are fine outside the narration). pipeline, DAG, kfp, Model Registry stay in writing too (written gloss 有向无环图（DAG）, 模型注册表（Model Registry）).'
- '[A5] Writing artifacts. Copied letter for letter (case, dots, slashes, hyphens unchanged); never translated, inflected, quoted, put in 《》 or code formatting. Add a Chinese head noun where it helps: model 目录, bytes inputs 这个键, kfp 这个库, main 分支, pipeline 函数. No sentence opens with an artifact or a lower-case kept-English word: put a Chinese word first (这里的 .output……; 这些 task……; 这里 square……; 这个 add……; 这个 repo……; 这个 cheese app 的 pipeline……; 在 pipeline 函数运行时……; 把 sync 设为 True……; 用 .after……), so no subtitle starts in lower case or with a dot. Capitalized names and acronyms (Vertex, Google, README, DAG, YAML, SageMaker, Cloud Run, AWS) and the option letters A-D may open a sentence; so may the recap label .after： in S03[11] (as L13''s rule rows).'
- '[A6] Names with an underscore and code expressions (as L3-L13). With no say:, the checker reads the display line as the spoken text and rejects letter_letter, brackets, quotes inside brackets and =; the SAY never reads these names with their underscores or brackets either. So the Chinese line writes them the way the narration says them: square_root → square root; bytes_inputs → bytes inputs; sync=True → sync 设为 True; .after() → .after; .outputs["name"] → .outputs，在方括号里写上输出的名字 (S03[4]); train_cnn / train_tree are never in a subtitle (the SAY says the big training / the small training → 大的那个训练 / 小的那个训练); tf.saved_model.save and aip.PipelineJob are on screen only. The English line restores the literal forms with en_display (D4).'
- '[A7] Words to keep apart. task (a node of the pipeline graph; stays English) ≠ 任务 (a job: a cron 任务, the pipeline 任务 the SDK submits, the 训练任务 a step launches, 编译好的任务): the P3 answer depends on it (边等的是 task；pipeline 看不到它启动的任务). step (步骤, the README''s and slides'' word for a pipeline stage) ≠ task (the kfp object) — use what the SAY says. 连线 (a wire, the drawn data edge) ≠ 边 (an edge of the graph; a dashed .after edge is a 虚线边, not a 连线). 值 (the value token riding a wire) ≠ token (the LLM token; not used). registry (a Docker image registry, S07[1]) ≠ Model Registry (the product, S06, S08) ≠ 注册 (the act of registering). 部署 (deploy, the act) ≠ deploy (the task name in S05[8], S05[10], S07[3]). 运行的时候 (at run time) ≠ 运行时 (a runtime; not used) ≠ 这次运行 (a pipeline run, the noun). 笔记本 (laptop) ≠ notebook (not used). 提交 (submit) ≠ commit (stays). 竞态 (a race condition) ≠ 赛跑 (never). 汇合点 (a join) ≠ 连接 (never). 并行 (parallel) ≠ 平行 (never). 插口 (a drawn socket) ≠ 套接字 (never).'
- '[A8] Register: a TA in a review session the day before the quiz. Short, clear sentences with spoken verbs (调用, 创建, 接上, 等, 传, 跑, 读, 写, 部署, 删); the viewer is 你 (never 您, 大家, 同学们); 我们 is not needed (this video runs nothing). Chinese word order inside a clause; clause order follows the English (D9). No translationese: not 让我们…… (say 我们来…… or 先……), not 这就是为什么…… (say 所以……), few 被 sentences (S05[4] 它只是被拉长了 is fine), no stacked 一个……的. No internet slang. Carry the spoken rhythm by meaning: Nothing failed. → 没有一个失败。; Not a number. → 不是一个数。; No number yet. → 还没有数字。; Vertex executes. → 执行的是 Vertex。; Then 75. → 然后 75。; It just stretches. → 它只是被拉长了。; Not yet. → 还不能。'
- '[A9] Precision. Translate the quantifiers: only 只, every 每个 / 每次 / 每一步, all 全部, exactly 正好 / 正是, never 永远不 / 从不, twice 两次 / 两遍, at once 马上. The quiz facts are stated exactly as the English states them; never soften and never add a fact the English does not say: the edge waits for the task (S05[8]); a join waits for all its inputs (S04[10], S08[2]); the run lasts its longest path (S04[6]); billing starts at deploy (S08[4]); registered is not callable (S06[8]). Pause-and-ponder: three questions (S03[8], S04[7], S05[7]); the line under a ponder card asks and never answers or hints (S05[7]''s Remember exactly what an edge waits for → 记清楚一条边到底在等什么 must not say task or job). The answer blocks (S03[9], S04[8], S05[8]) give the letter first (答案是 B。), then each wrong option with its letter in the English order. The practice questions Q11-Q13 are never quoted in any Chinese file. Slide conflicts are said kindly in one clause (和课件有一处不同：……; 课件用一种方式保存，repo 用的是……).'
- '[A10] Names. Products, companies and the course keep Latin script (A1 b); 哈佛 only in titles and descriptions. Course: AC215; Lecture 15 → 第 15 讲; the lecture → 课上 / 课上的说法; the slides → 课件; the demo repo → 示例 repo; the course staff → 课程团队 (commit authors); Quiz 4 → Quiz 4 only in titles and descriptions (the SAY says the quiz → 小测); this video → 这期视频; exam edition → 考前版. No person''s name is written or read out (the instructor is never mentioned in this script). No project id, project number, bucket name, endpoint id, W&B entity or key: placeholders gs://my-bucket/… and <ENDPOINT_ID> are on screen only and never said.'
- '[A11] The screen stays English. This series translates only the narration: code and README panels (comments included), diagram labels (task nodes, lanes, the clock, the leaderboard rows, the registry card, the endpoint plate, the probability bars), chips and tags (illustration, README example, slide 37, main today, kfp 2.14.6 · read, not run, value baked in at compile time), the gray lecture tags (Lecture 15 · slides a–b), the multiple-choice ponder cards and their RED reason lines, the YELLOW takeaway cards, the S01 lines Nothing failed. / Nothing was right. and the seven rule rows are English, and the scenes need no language changes. Where the narration names something on screen, the subtitle writes it as shown; what the narration says in its own words is Chinese (灰色标签, 右上角, 绿色的勾, 第一条泳道).'
- '[A12] Mainland Simplified Chinese only: 默认, 程序, 代码, 文件, 目录, 数据, 数据集, 网络, 脚本, 视频, 信息, 函数, 参数, 调用, 节点, 依赖, 并行, 部署, 计费, 客户端; never 預設, 程式, 程式碼, 檔案, 資料夾, 資料, 資料集, 網路, 腳本, 影片, 訊息, 函式, 引數, 呼叫, 節點, 相依性, 平行處理, 部署 in traditional forms, 計費, 用戶端.'
- '[A13] The series list (the ac215-video skill''s list) in this video. pipeline (throughout), endpoint (S01, S06, S08), container (S02[7], S07[1]), image and registry (S07[1]), bucket (S06, S07), repo (S02[3], S06, S05[10]), commit (S05[10]), SDK (S02[6], S07[1], S08[5]); token is not used (the value marker is 值, A7); prompt, volume, venv, PATH, agent, port, epoch, batch, loss are not in this script. New in the closed list here (A1 c): DAG, task, component.'
- '[B1] Spacing. One half-width space between Hanzi and Latin letters, digits or an artifact (凌晨 1 点, 2 点, 75 分钟, 16 分钟, 5 秒, 224 乘 224, 第 15 讲, 一个 task, 这里的 .output, model 目录, main 分支). The checker reports a missing space on every displayed sentence. Spaces inside an artifact as they are (Vertex AI Pipelines, Cloud Run, bytes inputs); never add one inside an artifact. No space next to full-width punctuation (……square-2，……; …….output。). Never U+00A0 / U+202F.'
- '[B2] Punctuation. Chinese uses full-width ，。、；：？！“”……, also next to an artifact. Lists use 、 (square、add 和 square root; 图、连线、重叠、顺序、部署; raw.zip、clean.zip，然后是 model 目录). No brackets of any kind: （）, (), 《》, 【】, [], <> (the checker rejects them without say:, and the bilingual band needs no glosses). “” only for an idea or a quoted phrase in Chinese; artifacts, tag names, the README line and screen words are never quoted. One Chinese sentence (for one English sentence) has no 。？！ inside: use ，；：. Option letters take a full-width colon or comma (C：.after 不需要数据。; 答案是 B，16 分钟。).'
- '[B3] Symbols the checker rejects (= < > + → ← ^ ≤ ≥ × ÷ ≈, == != +=, a digit followed by !, brackets, letter_letter): never copied into the Chinese line; say them in words (A6). 2, plus 3, plus 10, plus 1 → 2 加 3 加 10 加 1; 224 by 224 → 224 乘 224; sync=True → sync 设为 True; .outputs["name"] → .outputs 加上输出的名字 in words; .after() → .after. Allowed and kept as on screen: . in names (raw.zip, clean.zip, .output, .after, @dsl.component), - in names (square-2, cheese-app-endpoint), @, and & (S05[1]''s 后台的 &; not rejected by the checker).'
- '[C1] Numbers in displayed text. Everything that echoes a number on screen or written as digits in the SAY uses Arabic digits: times (凌晨 1 点, 2 点, 3 点), durations (75 分钟, 40 分钟, 16 分钟, 5 秒), the toy''s values as the SAY says them (3, 9; the screen''s 9.0, 16.0, 25.0, 5.0 are said 9, 16, 25, 5), counts the SAY writes in digits (2 加 3 加 10 加 1), sizes (224 乘 224), lectures (第 15 讲). Small counts the SAY says as words stay Chinese numerals: four steps → 四个步骤, three nightly jobs → 三个任务, two trainings → 两个训练, five steps → 五步, four scores → 四个分数, seven rules → 七条规则, twice → 两次 / 两遍; exit status zero → 退出码都是 0 (a printed value). Rule numbers in S08: One: … Seven: → 第一条：…… 第七条：.'
- '[C2] Units, versions, names and times. No version is spoken (kfp 2.14.6 is on the PURPLE chip only). Times: 1 in the morning → 凌晨 1 点 (never a.m., never 1:00 in the subtitle); at 2 → 2 点; time zero → 0 时刻; minutes → 分钟; seconds → 秒. Money is never quantified (you pay for that machine → 你要为这台机器付钱; a machine is billing → 机器一直在计费). The endpoint machine type is on screen only.'
- '[D1] Sentence alignment (explainer/i18n.py). In narration/*.yaml every SAY line of script.md has one entry (76 blocks); `en` equals the SAY line byte for byte; `zh` has exactly as many items as explainer.voice.split_sentences finds English sentences (186 in this script: S01 23, S02 24, S03 28, S04 24, S05 34, S06 21, S07 17, S08 15). Restructure only inside a sentence; never merge or split sentences. Short sentences are items of their own: Train at 2. → 2 点训练。; Deploy at 3. → 3 点部署。; Nothing failed. → 没有一个失败。; No number yet. → 还没有数字。; Vertex executes. → 执行的是 Vertex。; Not a number. → 不是一个数。; Try one. → 来做一题。; B. → 答案是 B。; 40 minutes. → 40 分钟。; Then 75. → 然后 75。; It just stretches. → 它只是被拉长了。; Can you call it? → 能调用它吗？; Not yet. → 还不能。; Seven rules. → 七条规则。. Run `python -m explainer.i18n check videos/ac215-l15-exam --lang zh` until it prints OK.'
- '[D2] No say:, no anchors. There is no Chinese voice: never write say: and never write anchors:. The subtitles are timed by the English audio; the toolkit pairs each Chinese sentence with its English one by position.'
- '[D3] A checker-clean display line. With no say:, every displayed sentence must pass explainer.i18n.spoken_problems: no brackets (B2), no maths symbols (B3), no letter_letter names (A6), no ! after a digit, no clause ending in 种 followed by ，。！？, a half-width space between Hanzi and Latin letters or digits (B1), each sentence ending in 。！？ or …… (optionally followed by ” or 」), and every Latin word listed in this glossary (zh_subtitle, first_use or allowed_spoken_latin). The checker cuts words with [A-Za-z][A-Za-z''.-]* and ignores one-letter words: .output is output, @dsl.component is dsl.component, square-2 is square-, cheese-app-endpoint stays whole, raw.zip stays whole, base64 is base, AC215 is AC; the option letters A-D and the toy''s input a are ignored.'
- '[D4] The English line (en_display). The bilingual band shows the SAY sentence, and the SAY spells artifacts out as words for the voice. Every such sentence gets an en_display item with the literal on-screen form, the rest word for word as the SAY; the other sentences of the block are null. Spoken form → literal (script.md''s i18n en_display list): dot output → .output; dot outputs, with the output''s name → .outputs["name"]; dot after → .after(); d s l dot component → @dsl.component; d s l dot pipeline → @dsl.pipeline; the K F P library / K F P → the kfp library / kfp; the D S L → the DSL; dependent tasks → dependentTasks; square 2 → square-2; sync set to true → sync=True; bytes inputs → bytes_inputs; raw zip / clean zip → raw.zip / clean.zip; the model folder → the model/ folder; cheese app endpoint → cheese-app-endpoint; base 64 → base64; the Keras export archive → the Keras ExportArchive. Optional (decide in the narration step, keep consistent): background ampersands → background & jobs. Keep the sentence otherwise byte-identical to the SAY.'
- '[D5] Content parity. Each Chinese sentence translates its English sentence only: no added commands, flags, glosses, Chinese screen names or explanations; kept-English words get no Chinese explanation (the English line is right below); ponder questions get no answers (A9); takeaways say exactly what the YELLOW card says. The few head words A5 needs (这里的, 这些, 这个, 用, 把) and 答案是 before a bare answer letter carry no content.'
- '[D6] Fixed phrases (shared with ac215-l13-exam). If the question says X, think Y. → 题目说 X，就想：Y。 If an option says / uses / schedules … → 选项要是……，就想：……。 think again → 再想想. Try one. → 来做一题。 Your turn to compute one. → 轮到你算一题。 One more, a subtle one. → 再来一题，有点绕。 Pause here if you want. → 想停的话，就在这里暂停。 B. → 答案是 B。 B, 16 minutes. → 答案是 B，16 分钟。 A … / C … / D … → A……；C……；D……. Now the contrast. → 再看对比。 Here is the plan: … → 接下来的安排：…… Here is … → 这是……; Back to the toy graph. → 回到那个玩具图。 Seven rules. → 七条规则。 One: … → 第一条：…… Good luck on the quiz. → 祝你小测顺利。'
- '[D7] Files. narration/g1.yaml = S01-S08 (one part; 76 blocks, 186 sentences), video.yaml''s single part; the file opens with a comment (coverage; the rules it applies: A6 spaced names, B3 symbols in words, C1 numbers, D4 en_display, D6 fixed phrases, no say: / anchors:) and keeps the script''s order. Double-quoted strings; escape a literal double quote or backslash for YAML (the en_display .outputs[\"name\"]).'
- '[D8] Length on the English timing. The Chinese is read while the English plays; the band switches where the English cues switch (a Chinese piece that reads faster than 9 units/s gets at most 1 s more). Each Chinese sentence should read in about the time the English sentence is heard: at most about 2 units per English word (a Hanzi counts 1, a Latin letter 0.55), so drop redundant connectives and repeated subjects, never content. Long artifacts cost length (cheese-app-endpoint 10.5 units, Vertex AI Pipelines 10, Kubeflow Pipelines 10, @dsl.component 7.7): don''t repeat them where the English doesn''t; after the first mention in a block, use a short reference (这个 endpoint, 这个库, 它).'
- '[D9] Keep the English clause order (a series lesson, ac215-video skill). The toolkit pairs Chinese and English clause by clause, so a Chinese sentence that puts a condition first when the English puts it last swaps meaning between two neighbouring cues. Conditions, purposes and time adverbials sit where the English has them: The repo reuses cheese app endpoint if it exists, or creates it → 这个 repo 会复用 cheese-app-endpoint，如果它已经存在；不存在就新建一个; a machine is billing until you undeploy it → 机器一直在计费，直到你取消部署; the comparison starts exactly when the slower one ends → 比较正好在慢的那个结束时开始; Cloud Run fits when the model is one part of a bigger app → Cloud Run 适合模型只是一个更大应用的一部分的时候. Takeaways keep their two halves in order (题目说……，就想：……).'
- '[G1] Width. Bilingual band: Chinese line at most 30 units, English line 96 characters; Chinese-only subtitles (.zh.srt) 22 units a line, 2 lines a cue. Write clauses of at most about 24 units separated by ，；： so the splitter has clean cut points; avoid an unpunctuated clause over 30 units (S07[1] and S08[5], the two longest sentences, are written as lists of short clauses).'
- '[G2] Cue endings: the toolkit strips a cue''s final 。，、；： and keeps ？！…… and a closing ” (subtitles.strip_end). Prefer a Chinese word over ''artifact + full stop'' at the end of a sentence where it reads as well (……进入 add。 is fine; ……然后是 model 目录。 reads steadier than ……model/。).'
- '[G3] Never split a name. The splitter treats a space between two Latin words in a Chinese line as a good cut point, so Vertex AI Pipelines, Kubeflow Pipelines, SageMaker Pipelines, Agent Platform, Model Registry, Artifact Registry, Docker Hub, Cloud Run, square root or bytes inputs could land on two lines. Put such a name at the end of a clause or after a full-width punctuation mark, with little Chinese around it, and check every cue that contains one in the rendered .zh.srt.'
- '[H1] Titles (meta.yaml). Video and chapter titles use the written register (A4: 端点, 有向无环图, 模型注册表); questions keep their question mark; the English colon structure is kept (task.output：……; 强制顺序：……); kfp names and file names stay as they are (meta.yaml is not read by the checker, so brackets are fine there). Core-concept chapters carry their English short name for search where the Chinese is not the usual search word (有向无环图（DAG）, 最大安全重叠（maximum safe overlap）, 端点（endpoint）), as L1, L3, L5-L13 do. ML Workflows with Vertex AI → Vertex AI 上的机器学习工作流; exam edition → 考前版 (as 跟练 = follow-along). The metaphors keep their picture (the 2 a.m. race → 凌晨两点的竞态; the wire that makes an edge → 造出边的那根连线; edges, not clocks → 靠边，不靠时钟; seven rules for the quiz → 小测要记住的七条规则).'
- '[H2] Description (Bilibili / YouTube): two or three sentences, written register, this glossary''s terms: AC215 lecture 15''s exam edition, for the day before Quiz 4; what it teaches (a pipeline as a DAG of tasks and data edges in kfp; .output / .outputs passing this run''s value and making the edge, hard-coded paths and .after; maximum safe overlap and the longest path; enforcing preprocess → train → deploy with edges, not cron, background commands or the tracker''s best model; Model Registry → endpoint → deploy → predict, and the ml-workflow pipeline; SageMaker Pipelines as the same DAG); that every mechanism is an animated diagram with code from the dlops-io repos as evidence and three quiz-style questions; English narration with Chinese and bilingual subtitles. No person''s name.'
- '[H3] Companions: i18n/zh/README.md (if made) is translated with this glossary in the written register (A4). Close with a term table: English | the word used here | other common renderings (pipeline: pipeline / 流水线 / 管道; DAG: 有向无环图; task: task / 任务; component: component / 组件; edge: 边 / 依赖边; placeholder: 占位符; join: 汇合点 / 汇聚节点; maximum safe overlap: 最大安全重叠 / 最大并行; longest path: 最长路径 / 关键路径; race: 竞态 / 竞争条件; stale data: 过期数据 / 陈旧数据; endpoint: 端点 / 终端节点; Model Registry: 模型注册表 / 模型仓库; undeploy: 取消部署 / 解除部署; signature: 服务签名).'
- '[H4] Code and commands in the companions stay byte for byte: code blocks, file names and inline `code` are unchanged; only # comments and the surrounding prose are translated.'
- '[I1] (Request, open since L3) `explainer.i18n check` applies its spoken-text hygiene (_SPOKEN_BAD: brackets, maths symbols, letter_letter names) to the display line when a sentence has no say:. For a subtitles-only video (voice: none here) those checks protect nothing and force A6 and B3 (here: square_root, bytes_inputs, sync=True, .after(), .outputs["name"]). Proposal: when the glossary''s voice is none, skip _SPOKEN_BAD for display-only sentences (keep the Latin-word, spacing and sentence-end checks).'
- '[I2] (To do, from L1 I3) `_cuts` in explainer/subtitles.py treats a space between Latin words in a Chinese line as a good cut point, so a product name can be split (G3). Proposal: in a Chinese line, treat a run of Latin words separated only by spaces as unbreakable unless it alone exceeds a line.'
- '[I3] (Note) explainer/subtitles.py reads every video''s glossary.yaml: the 2-3 word English alternatives of each term''s en field are kept on one English line, and the 2-7 character Chinese headwords of zh_subtitle are registered in jieba, in every video''s subtitles. The en and zh_subtitle fields of this file therefore list real terms only (no sentences).'
terms:
# ---------------------------------------------------------------- The 2 a.m. race / 开头：凌晨两点的竞态
- en: 'nightly jobs / job / cron job / pipeline job / training job'
  zh_subtitle: '任务 / 每晚的任务 / 时钟'
  first_use: 'S01[0]：时钟上排着每晚的三个任务。'
  note: 'job → 任务 (L13, the sibling exam edition: 任务 for a job): a cron job → cron 任务, the pipeline job the SDK submits → pipeline 任务, the job a training step launches → 训练任务 / 它的任务, the compiled job → 编译好的任务. Kept apart from task, which stays English (A7). For months, it works → 几个月来，一切正常.'
- en: 'prepare the data / preparation / preprocessing / preprocess / at 1 in the morning'
  zh_subtitle: '准备数据 / 预处理 / 凌晨'
  first_use: 'S01[0]：凌晨 1 点准备数据。'
  note: 'S01''s preparation → 准备数据 (the night story); from S04 on preprocessing / preprocess → 预处理 (Q-style wording: 预处理、训练、部署). Times: 1 in the morning → 凌晨 1 点; Train at 2. → 2 点训练。; Deploy at 3. → 3 点部署。 (C2: digits, 点; never a.m.).'
- en: 'half written / a half-written file / half the data / ships whatever training produced'
  zh_subtitle: '写了一半 / 一半的数据'
  first_use: 'S01[1]：2 点，训练照样开始，读的是一个只写了一半的文件。'
  note: 'half-written → 写了一半 (S01, S05[3]); half-finished results → 没算完的结果 (S04[5]); trained on half the data → 只用一半数据训练出来的.'
- en: 'exit status / status zero / exit 0'
  zh_subtitle: '退出码 / 失败'
  first_use: 'S01[2]：每个任务的退出码都是 0。'
  note: '退出码 (L2-L4). The pair is parallel and short: Nothing failed. → 没有一个失败。 Nothing was right either. → 可也没有一个是对的。 The GREEN / RED lines on screen stay English (A11).'
- en: 'endpoint / serves a model / the model'
  zh_subtitle: 'endpoint / 模型'
  first_use: 'S01[2]：而 endpoint 现在提供的，是一个只用一半数据训练出来的模型。'
  note: 'endpoint stays (series list; first used in L08): 一个 endpoint, 这个 endpoint, 删除 endpoint. Written register 端点（endpoint）(A4). serves → 提供 / 对外提供.'
- en: 'the cheese app / four steps / a person at a terminal / Data Collector / Data Processor / Model Training / Model Deploy'
  zh_subtitle: 'cheese app / 步骤 / 终端'
  first_use: 'S01[3]：课上也从同一个问题讲起：cheese app 的四个步骤，每一步都由一个人在终端上运行。'
  note: 'cheese app stays (the course project''s name, L4-L8). The slide tiles (1 Data Collector, 2 Data Processor, 3 Model Training, 4 Model Deploy, CLI) are on screen in English (A11). step → 步骤 / 一步 / 每一步.'
- en: 'automate / execute / this flow'
  zh_subtitle: '执行 / 自动化 / 流程'
  first_use: 'S01[3]：能不能把这个流程自动化？'
  note: 'The slide''s two questions, translated as questions (the headline on screen stays English): How do we execute these steps? → 这些步骤要怎么执行？'
- en: 'pipeline / instruction'
  zh_subtitle: 'pipeline / 指令'
  first_use: 'S01[4]：这正是 pipeline 的用处。'
  note: 'pipeline stays (series list, L3; L13): 一个 pipeline, 这个 pipeline, pipeline 函数, pipeline 任务. Written register also keeps pipeline (L3''s titles do: pipeline 与你的第一个 Dockerfile). Not: train at 2. → 不是：2 点训练。 Instead: train when preparation has finished. → 而是：准备数据完成之后再训练。'
- en: 'graphs / wires / overlap / order / deployment'
  zh_subtitle: '图 / 连线 / 重叠 / 顺序 / 部署'
  first_use: 'S01[5]：接下来的安排：图、连线、重叠、顺序、部署，还有 cheese app。'
  note: 'graph → 图, edge → 边, node → 节点 (L07''s decision). wire → 连线 (L13''s word for the wire). deploy / deployment → 部署 (L2).'
- en: 'gray tag / lecture tag / live run / illustration'
  zh_subtitle: '灰色标签 / 课件 / 现场运行'
  first_use: 'S01[6]：这里没有任何现场运行。'
  note: 'A11: tag names as on screen (illustration, README example, slide 37, main today, kfp 2.14.6 · read, not run); the narration''s own words in Chinese: 灰色标签, 右上角. names the slides behind each idea → 标出每个想法背后的课件页.'
- en: 'race / race condition / fixed times / schedule'
  zh_subtitle: '竞态 / 时钟 / 调度'
  first_use: 'S01[7]：选项要是在固定时间调度步骤，就想：竞态，时钟对数据一无所知。'
  note: 'race (condition) → 竞态 (the standard term, 竞态条件 in the written register): 这就是竞态 (S04[5]); think race or wrong model → 就想：竞态，或者部署错了模型 (S05[11]). Never 赛跑 (the picture is a race, the concept is a race condition).'
# ---------------------------------------------------------------- A pipeline is a graph / pipeline 是一张图：task 是节点，依赖是边
- en: 'workflow management / workflow'
  zh_subtitle: '工作流管理 / 工作流'
  first_use: 'S02[0]：工作流管理，用课上的话说，知道哪一步需要哪一步。'
  note: 'workflow → 工作流 (L06; L13''s 训练工作流). ML Workflows (the lecture title) → 机器学习工作流 (H1).'
- en: 'directed acyclic graph / DAG / DAGs / pipelines are DAGs'
  zh_subtitle: '有向无环图 / DAG'
  first_use: 'S02[0]：记录这件事的结构叫有向无环图，也就是 DAG。'
  note: 'A1 c, new: DAG stays (the quiz word; say it in every rule: pipeline 是 DAG; 同一个 DAG); directed acyclic graph → 有向无环图 (the standard term) once, S02[0]. Written register 有向无环图（DAG）.'
- en: 'directed / acyclic / producer / consumer'
  zh_subtitle: '有向 / 无环 / 生产者 / 消费者'
  first_use: 'S02[1]：有向，是因为数据只朝一个方向流，从生产者流到消费者。'
  note: 'Acyclic, because no step ever waits on itself. → 无环，是因为没有哪一步会等它自己。 producer task → 生产者 task (S03[2]).'
- en: 'task / tasks / node / nodes'
  zh_subtitle: 'task / 节点'
  first_use: 'S02[1]：这些 task 就是节点；数据依赖就是边。'
  note: 'A1 c, new: task stays (kfp''s word and the quiz''s: calling a component creates a task; PipelineTask): 一个 task, 两个 task, 上游 task, 预处理 task. Kept apart from 任务 = a job (A7): the edge waits for the task, not for the job the task launched (S05[8]). Written register 任务（task）where the context makes it unambiguous, else task.'
- en: 'edge / edges / data dependency / data dependencies / dependency'
  zh_subtitle: '边 / 数据依赖 / 依赖'
  first_use: 'S03[3]：一个参数，就同时给了 add 数据和依赖。'
  note: 'edge → 边 (L07): 一条边, 这些边, 虚线边, 数据不需要的边, 边上. dependency → 依赖 (L13).'
- en: 'Vertex AI Pipelines / Kubeflow Pipelines / K F P / kfp / Kubernetes / Agent Platform / console'
  zh_subtitle: 'Vertex AI Pipelines / Kubeflow Pipelines / kfp / Kubernetes / Agent Platform / 控制台'
  first_use: 'S02[2]：你描述这个图用的是 Kubeflow Pipelines，也就是 kfp 这个库，而且不用你管 Kubernetes。'
  note: 'Product names in Latin script (A1 b, A10). K F P → kfp (the package name as on screen; en_display: the kfp library, D4). Today''s console calls it Agent Platform. → 现在的控制台把它叫作 Agent Platform。 Vertex runs / executes → Vertex 运行 / 执行.'
- en: 'toy pipeline / demo repo / slides'
  zh_subtitle: '玩具 pipeline / 示例 repo / 课件'
  first_use: 'S02[3]：这是课件和示例 repo 里的那个玩具 pipeline。'
  note: 'toy → 玩具 (玩具 pipeline, 玩具图 S04[0]: Back to the toy graph. → 回到那个玩具图。). repo stays (L1).'
- en: 'component / Python function / d s l dot component / d s l dot pipeline'
  zh_subtitle: 'component / Python 函数 / @dsl.component / @dsl.pipeline'
  first_use: 'S02[3]：三个标了 @dsl.component 的 Python 函数：square、add 和 square root。'
  note: 'A1 c, new: component stays (kfp''s word, on screen as @dsl.component): 一个 component, component 调用. Written register 组件（component）. d s l dot component / d s l dot pipeline → @dsl.component / @dsl.pipeline (en_display, D4). A fourth, marked d s l dot pipeline, wires them together. → 第四个标了 @dsl.pipeline，把它们连起来。'
- en: 'square / add / square root / square 2 / pipeline input'
  zh_subtitle: 'square / add / square root / square-2'
  first_use: 'S02[5]：这里 square 被调用了两次，所以一个 component 产生了两个 task；第二个叫 square-2。'
  note: 'The toy''s function and task names stay as on screen (A1 a); square_root → square root (A6); square 2 → square-2 (en_display). The values: on screen 9.0, 16.0, 25.0, 5.0; the SAY and the subtitle say 9, 16, 25, 5 (C1). Calling square on a, the pipeline''s input, which defaults to 3 → 在 a 上调用 square，a 是 pipeline 的输入，默认值是 3.'
- en: 'pipeline function / component call / calling a component'
  zh_subtitle: 'pipeline 函数 / 调用'
  first_use: 'S02[4]：在 pipeline 函数运行时，这些 component 调用什么都不算。'
  note: 'A5: no sentence opens with lower-case pipeline: 在 pipeline 函数运行时 (a time adverbial with a Chinese head word). The function ran once, and produced only a graph. → 这个函数只跑了一次，产出的只有一个图。'
- en: 'output socket / socket'
  zh_subtitle: '输出插口 / 数字'
  first_use: 'S02[4]：还没有数字。'
  note: 'socket (the drawn socket on a task node) → 插口; plug it in → 接上 (S03[1]). Never 套接字 (that is a network socket).'
- en: 'compiler / compile / YAML file / compiled YAML'
  zh_subtitle: '编译器 / 编译 / YAML 文件'
  first_use: 'S02[6]：编译器把这个图压成一个 YAML 文件。'
  note: 'YAML stays; the compiled YAML → 编译出来的 YAML; writes down → 写下 (S03[2]). Your laptop compiles and submits. → 你的笔记本负责编译和提交。'
- en: 'Vertex AI SDK / remote control / submit'
  zh_subtitle: 'Vertex AI SDK / 遥控器 / 提交 / pipeline 任务'
  first_use: 'S02[6]：Vertex AI SDK，也就是课上说的遥控器，把它提交成一个 pipeline 任务。'
  note: 'SDK stays (L6). submit → 提交 (L13; ≠ commit, which stays English, A7). aip.PipelineJob is on screen only; a pipeline job → pipeline 任务.'
- en: 'laptop / machine / Google machines'
  zh_subtitle: '笔记本 / 机器 / container'
  first_use: 'S02[7]：直到这时，在 Google 的机器上，每个 task 才有了 container，数字才出现。'
  note: 'laptop → 笔记本 (L1; never notebook, which is a Jupyter notebook). machine → 机器 (一台机器). container stays (L2). Vertex executes. → 执行的是 Vertex。'
- en: 'compiled job'
  zh_subtitle: '编译好的任务'
  first_use: 'S02[8]：什么都不会运行，要等到编译好的任务真正运行。'
  note: 'The S02 takeaway: If an option says calling train in the pipeline function trains the model, think again: it only creates a task. → 选项要是说，在 pipeline 函数里调用 train 就会训练模型，再想想：它只是创建了一个 task。 (D6).'
# ---------------------------------------------------------------- task.output: the wire that makes an edge / .output：造出边的那根连线
- en: 'dot output / placeholder / upstream task / succeed'
  zh_subtitle: '.output / 占位符 / 上游 / 成功'
  first_use: 'S03[1]：这里的 .output 是一个占位符，代表一个只有上游 task 成功之后才存在的值。'
  note: 'dot output → .output (en_display .output, D4); never translated, never opens a sentence (A5: 这里的 .output, 第一个 square task 的 .output). upstream → 上游; succeeds → 成功; Not a number. → 不是一个数。'
- en: 'wire / plug in / path of wires'
  zh_subtitle: '连线 / 接上'
  first_use: 'S03[1]：把它接上，就画出了一根连线。'
  note: 'wire → 连线 (measure word 根); 9 rides the wire into add → 9 顺着连线进入 add. path of wires → 连线组成的路径 (S04[0], S04[10]). The PINK solid / dashed edges are pictures; the words stay 连线 and 边.'
- en: 'dependent tasks / dependentTasks / producer task'
  zh_subtitle: 'dependentTasks / 生产者 task'
  first_use: 'S03[2]：编译出来的 YAML 把每根连线写了两遍：add 的 dependentTasks 列出 square 和 square-2，每个输入也写明了它的生产者 task。'
  note: 'dependent tasks → dependentTasks (the YAML key, en_display, D4); in the compiled YAML they become dependent tasks → 在编译出来的 YAML 里，它们变成了 dependentTasks (S05[6]).'
- en: 'run time / turns green / argument'
  zh_subtitle: '变绿'
  first_use: 'S03[3]：运行的时候，square 变绿，然后 9 才顺着连线进入 add。'
  note: 'At run time → 运行的时候 (never 运行时, which is a runtime, L08). green check → 绿色的勾 (S07[0]).'
- en: 'dot outputs / output name / several outputs / named output'
  zh_subtitle: '.outputs / 输出的名字'
  first_use: 'S03[4]：有多个输出时，就点名要哪一个：用 .outputs，在方括号里写上输出的名字。'
  note: 'dot outputs → .outputs (en_display .outputs["name"], D4; the brackets and quotes cannot be in the Chinese line, B3, so the Chinese says them in words). a named output → 一个有名字的输出 (S08[1]).'
- en: 'hard-code / hard-coded path / guessed path / this run'
  zh_subtitle: '写死 / 路径 / 这次运行'
  first_use: 'S03[5]：改成把路径写死，就没有连线：train 马上开始，和 prep 一起跑。'
  note: 'hard-code → 写死; guess → 猜 (a guessed path → 猜出来的路径); a path you assumed → 你假设的路径. this run → 这次运行 (the noun run of a pipeline run is said in Chinese here: there is no W&B run in this video, unlike L13); this run''s value / file → 这次运行的值 / 文件; last run''s → 上一次运行的.'
- en: 'stale data / stale read / last run'
  zh_subtitle: '过期数据 / 过期'
  first_use: 'S03[6]：那里的文件是上周的，这一步在过期数据上成功了。'
  note: 'stale → 过期 (maybe stale → 可能是过期的). the stale read from earlier → 前面说的读到过期数据 (S07[3]). A guessed path looks like a dependency to you, not to the pipeline. → 猜出来的路径在你看来像依赖，在 pipeline 看来不是。'
- en: 'prep / train / split / compare / ingest / clean / report / deploy (task names)'
  zh_subtitle: 'prep / train / split / compare / ingest / clean / report'
  first_use: 'S03[9]：A 把路径写死了：没有边，所以 train 可能马上开始，读到上一次运行的文件。'
  note: 'The illustration''s neutral task names stay as on screen when the SAY names the task (train starts right away → train 马上开始); when the SAY says the activity (training, the comparison, the big training) it is Chinese (训练, 比较, 大的那个训练). train_cnn / train_tree are on screen only. deploy as a task name in S05[8] / S05[10] → deploy; as an activity → 部署.'
- en: 'dot after / dashed edge / ordering edge'
  zh_subtitle: '.after / 虚线边 / 顺序'
  first_use: 'S03[7]：要只管顺序、不传数据，就用 .after 加一条虚线边：这个 task 会等另一个成功，但边上什么都不传。'
  note: 'dot after → .after (en_display .after(), D4; no brackets in the Chinese line, B3). Dot after: order, but no data. → .after：有顺序，没有数据。 is the one place a sentence may open with the artifact (a recap label, as L13''s rule rows); elsewhere 用 .after.'
- en: 'ponder / option / answer / multiple choice'
  zh_subtitle: '选项 / 答案 / 暂停'
  first_use: 'S03[8]：想停的话，就在这里暂停。'
  note: 'D6 fixed phrases (L13): Try one. → 来做一题。 Your turn to compute one. → 轮到你算一题。 One more, a subtle one. → 再来一题，有点绕。 B. → 答案是 B。 B, 16 minutes. → 答案是 B，16 分钟。 A / C / D open their sentences with the bare letter (C 会等，但……; D 在……).'
- en: 'hand over / plain dot output / refuse'
  zh_subtitle: '等待 / 拒绝'
  first_use: 'S03[10]：D 在任何东西运行之前就失败了：有两个输出时，kfp 不接受单独的 .output。'
  note: 'The kfp error text is on the PURPLE-chipped panel only (A11), never quoted in a subtitle. Naming the output hands over this run''s file, and creates the wait. → 点名这个输出，就把这次运行的文件传了过去，也建立了等待。'
- en: 'takeaway / takeaway card'
  zh_subtitle: '题目 / 选项 / 结论'
  first_use: 'S03[11]：题目说 .output，就想：等上游成功，拿到这次运行的值。'
  note: 'D6 (L13): If the question says X, think Y. → 题目说 X，就想：Y。 If an option says / uses / schedules … → 选项要是……，就想：……. The YELLOW takeaway card stays English (A11); the subtitle translates the SAY.'
# ---------------------------------------------------------------- Maximum safe overlap / 最大安全重叠
- en: 'in parallel / parallel'
  zh_subtitle: '同时 / 并行'
  first_use: 'S04[10]：两个步骤之间要是没有连线组成的路径，就想：并行。'
  note: 'parallel → 并行 (never 平行). Vertex is free to run them at the same time → Vertex 可以同时运行它们.'
- en: 'join / join task'
  zh_subtitle: '汇合点 / 输入'
  first_use: 'S04[1]：这个 add 是一个汇合点。'
  note: 'join (a task with several incoming edges) → 汇合点; a join waits for all its inputs → 汇合点要等齐所有输入 (S08[2]). Never 连接 (that is a SQL join).'
- en: 'preprocessing task / training / comparison'
  zh_subtitle: '预处理 / 训练 / 比较'
  first_use: 'S04[2]：同样的形状，放大一号：一个预处理 task，两个读它输出的训练，再加一个读两个模型的比较。'
  note: 'training (one training run) → 训练 (两个训练, 大的那个训练, 小的那个训练); comparison → 比较; compare as a task name stays (C ignores the edges … compare waits for both models → compare 要等两个模型).'
- en: 'light up / incoming wire / value token'
  zh_subtitle: '亮起来 / 值'
  first_use: 'S04[3]：一个 task 亮起来，要等每根输入连线都带上值。'
  note: 'token here is the value marker riding a wire → 值 (A7: never token, which is the LLM token in this series). The comparison starts exactly when the slower one ends → 比较正好在慢的那个结束时开始.'
- en: 'extra edge / half-finished results / time zero'
  zh_subtitle: '边 / 0 时刻 / 竞态'
  first_use: 'S04[4]：加一条数据不需要的边：答案一样，跑得更久。'
  note: 'Replace those wires with guessed paths → 把这些连线换成猜出来的路径; starts at time zero → 在 0 时刻就开始. That is a race. → 这就是竞态。'
- en: 'maximum safe overlap'
  zh_subtitle: '最大安全重叠'
  first_use: 'S04[6]：最大安全重叠的意思是：数据需要的边，一条不多，一条也不少。'
  note: 'maximum safe overlap → 最大安全重叠 (the quiz''s phrase, translated literally so it can be matched; written register 最大安全重叠（maximum safe overlap）in the chapter title, H1).'
- en: 'longest path / the run lasts its longest path'
  zh_subtitle: '最长路径'
  first_use: 'S04[6]：这样一次运行的时长就等于它的最长路径。'
  note: 'longest path → 最长路径 (the SAY never says critical path; do not add 关键路径). The longest path is ingest, clean, the big training, and compare. → 最长路径是 ingest、clean、大的那个训练和 compare。'
- en: 'upstream failure / fail / failed task'
  zh_subtitle: '失败 / 上游'
  first_use: 'S04[6]：如果上游有 task 失败，汇合点就永远不会运行。'
  note: 'fail → 失败 (a failed training → 失败的训练; fails if the job fails → 任务失败它也失败).'
- en: 'minutes / plus / in sequence'
  zh_subtitle: '分钟 / 加 / 依次 / 一个接一个'
  first_use: 'S04[8]：2 加 3 加 10 加 1。'
  note: 'B3: plus → 加 (never +). 16 minutes → 16 分钟. A adds every task in sequence. → A 把所有 task 依次加起来。 D runs the two trainings one after the other. → D 让两个训练一个接一个地跑。 overlap with → 和……重叠.'
# ---------------------------------------------------------------- Enforcing order: edges, not clocks / 强制顺序：靠边，不靠时钟
- en: 'sequence / preprocess / train / deploy'
  zh_subtitle: '顺序 / 预处理 / 训练 / 部署'
  first_use: 'S05[0]：现在说顺序：预处理、训练、部署。'
  note: 'Q-style chain → 预处理、训练、部署 (the same words in S05[11] and the S08 rules).'
- en: 'lane / clock lane / background lane / tracker lane / edge lane'
  zh_subtitle: '泳道'
  first_use: 'S05[1]：第一条泳道：cron 错开时间。'
  note: 'V4''s four lanes → 泳道 (第一条泳道 … 第四条泳道; 时钟那条泳道, 后台那条泳道, 追踪工具那条泳道, 边那条泳道). The lane labels on screen stay English (A11).'
- en: 'cron / cron offsets'
  zh_subtitle: 'cron / 错开时间'
  first_use: 'S05[11]：选项要是用 cron 错开时间、后台命令，或者追踪工具里最好的模型，就想：竞态，或者部署错了模型。'
  note: 'cron stays (the tool''s name, ORANGE clock); cron offsets → cron 错开时间; a cron job → cron 任务.'
- en: 'background ampersand / background command'
  zh_subtitle: '后台 / 后台命令'
  first_use: 'S05[1]：第二条泳道：后台的 &。'
  note: '& is said in the SAY (background ampersands) and shown on screen; the Chinese line writes & (not rejected by the checker) and 后台; en_display candidate: Lane two, background & jobs. (D4; decided in narration step). The background lane is broken on every roll, because nothing waits. → 后台那条泳道每次都出错，因为什么都不等。'
- en: 'event / fire / trigger'
  zh_subtitle: '事件 / 触发'
  first_use: 'S05[4]：这个事件可能在第一个文件写出来时就触发，那时预处理还没做完。'
  note: 'event → 事件; fire / trigger → 触发.'
- en: 'tracker / best model / leaderboard'
  zh_subtitle: '实验追踪工具 / 追踪工具 / 排行榜'
  first_use: 'S05[4]：而且追踪工具里最好的模型，是所有运行里最好的，不是这次运行的。'
  note: 'tracker → 实验追踪工具 at first use (S05[1]), then 追踪工具 (L13 A3: tracker → 实验追踪工具, never 进度条). The leaderboard is on screen only; the GREY dashed old run and today''s model stay English labels.'
- en: 'roll / die'
  zh_subtitle: '骰子 / 掷'
  first_use: 'S05[2]：掷一下骰子，决定预处理要多久。'
  note: 'Roll the length of preprocessing. → 掷一下骰子，决定预处理要多久。 40 minutes. → 40 分钟。 Then 75. → 然后 75。 Then 55. → 然后 55。 on every roll → 每一次都.'
- en: 'stretch / broken'
  zh_subtitle: '拉长 / 出错'
  first_use: 'S05[4]：它只是被拉长了。'
  note: 'broken → 出错 (fine at 40, broken at 75 → 40 没问题，75 就出错). The tracker lane fails twice. → 追踪工具那条泳道错在两处（two failure modes, not two rolls）。'
- en: 'collector / processor / collection / processing / data collector / data processor'
  zh_subtitle: '数据采集器 / 数据处理器 / 采集 / 处理'
  first_use: 'S05[5]：这个 cheese app 的 pipeline 正是这样做的：采集之后处理，处理之后训练，训练之后部署，每一步都用 .after。'
  note: 'The steps by meaning: collector / processor → 数据采集器 / 数据处理器 (S07[1]: 采集器和处理器 after the first), collection / processing → 采集 / 处理. The image names dlops/cheese-app-data-collector etc. are on screen only.'
- en: 'README'
  zh_subtitle: 'README'
  first_use: 'S05[6]：README 也说得很直白：每一步都要等上一步成功之后才开始。'
  note: 'README stays (A1 b); the quoted README line is on screen in English, the subtitle translates the SAY''s paraphrase.'
- en: 'launch / launcher / another machine'
  zh_subtitle: '启动'
  first_use: 'S05[8]：一条边等的是 task，而这个 task 5 秒后就成功了。'
  note: 'The P3 point, said exactly (A9): the edge waits for the task, never the job: 边等的是 task；pipeline 从来看不到它启动的任务. launcher → 只负责启动的步骤 (The repo''s training step is such a launcher. → 这个 repo 的训练步骤就是这种只负责启动的步骤。).'
- en: 'sync set to true / failed training'
  zh_subtitle: 'sync / 训练任务'
  first_use: 'S05[10]：把 sync 设为 True 之后，它会等自己的任务，任务失败它也失败，所以 deploy 永远不会在失败的训练之后运行。'
  note: 'sync set to true → sync 设为 True (A6; en_display sync=True, D4; True as on screen at model.py:62).'
- en: 'commit / course staff'
  zh_subtitle: 'commit / 课程团队'
  first_use: 'S05[10]：最近一次 commit 把这个等待写明了。'
  note: 'commit stays (L1). The commit author is never named: the course staff → 课程团队 (A10). explicit → 写明 / 显式.'
- en: 'correct by construction / wrong model / previous model'
  zh_subtitle: '错的模型'
  first_use: 'S05[11]：从预处理到训练再到部署的边，从结构上就保证了正确。'
  note: 'correct by construction → 从结构上就保证了正确. deploy may ship the previous model → deploy 可能把上一个模型发布出去.'
# ---------------------------------------------------------------- Registry, endpoint, deploy, predict / Model Registry、endpoint、部署与预测
- en: 'deployment / saved model / upload / register / bucket'
