  - {file: scenes/s02_graph.py,    cls: TasksAndEdges,      title: "A pipeline is a graph"}
  - {file: scenes/s03_output.py,   cls: OutputWire,         title: "task.output: the wire that makes an edge"}
  - {file: scenes/s04_overlap.py,  cls: SafeOverlap,        title: "Maximum safe overlap"}
  - {file: scenes/s05_order.py,    cls: EdgesNotClocks,     title: "Enforcing order: edges, not clocks"}
