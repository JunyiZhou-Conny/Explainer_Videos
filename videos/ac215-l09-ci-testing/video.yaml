# Bilibili metadata for the release (tools/release_episode.py → PUBLISH.json → the Mac publish worker)
publish:
  title_zh: "AC215 第9讲跟练 · CI 与单元测试：pytest、pre-commit，提交前的质量门"
  description_zh: |
    哈佛 AC215（MLOps & LLMOps，2026 秋）第 9 讲教程的逐条命令跟练：照着 dlops-io/cheese-app-ci-cd 的 README，
    在 Docker 镜像里跑 unit / integration / system 三层 pytest 测试，理解测试金字塔和 hermetic 测试、"skipped 不等于 passed" 的陷阱，
    用 black 和 flake8 分清格式化工具和 linter（以及 120 列宽度为什么必须统一），安装 pre-commit 钩子，亲眼看一次提交被拦下再被放行。
    下半场跟着客座讲座的 babykev 项目：uv 锁定环境、just check 一条命令当门禁、覆盖率 94% 仍然放过一个 bug，
    最后用 hypothesis 属性测试把反例收缩出来。边看边暂停，在自己的电脑上跑每一条命令；本讲全程本地运行，不需要云资源。
    英文旁白，中英双语字幕。

    教程仓库：https://github.com/dlops-io/cheese-app-ci-cd
    客座讲座项目：https://github.com/rahuldave/babykev
    学习笔记（全部命令、真实输出和练习答案）：https://github.com/JunyiZhou-Conny/MLOps_Learning/blob/main/guides/L09-ci-testing-precommit.md

    课程与教程内容来自 Harvard AC215 课程组（Pavlos Protopapas 等），客座讲座内容来自 Rahul Dave；本视频是个人学习用的非官方讲解，引用课件只注明页码，不展示课件。
  tags_zh: [AC215, MLOps, CI, 单元测试, pytest, pre-commit, 代码质量, 测试金字塔, 哈佛, 教程跟练]
  tid: 231
