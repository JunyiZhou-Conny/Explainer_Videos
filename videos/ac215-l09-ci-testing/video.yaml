  lecture: 9
  lecture_title: "Automating Software Development: CI, unit testing"
  ed: https://edstem.org/us/courses/97373/lessons/166034/
  repos:
    - {repo: dlops-io/cheese-app-ci-cd, branch: main, commit: b8458ff0cc1898700b32a873b4665f43f50df71e,
       sections: ["Part 1: Understanding the Codebase", "Part 2: Identifying Code Quality Issues",
                  "Part 3: Testing with Pytest", "Part 4: Automating with Pre-commit Hooks",
                  "Docker Cleanup"]}
    - {repo: rahuldave/babykev, branch: main, commit: 4a14085bb25620f37dca5c2bfeb27843c82dbe9e,
