  - {file: scenes/s06_pytest.py,          cls: PytestInside,    title: "pytest, under the hood"}
  - {file: scenes/s07_container_tests.py, cls: TestsInImage,    title: "Tests inside the shipping image"}
  - {file: scenes/s08_silent_skip.py,     cls: SilentSkip,      title: "The system test and the silent skip"}
  - {file: scenes/s09_precommit.py,       cls: PreCommitGate,   title: "The gate on your machine"}
  - {file: scenes/s10_babykev.py,         cls: OneCommand,      title: "Guest lecture: uv, just, and two failing tests"}
  - {file: scenes/s11_just_check.py,      cls: JustCheck,       title: "One command is the gate"}
  - {file: scenes/s12_green_wrong.py,     cls: GreenButWrong,   title: "All green, and the mask is wrong"}
  - {file: scenes/s13_properties.py,      cls: PropertyTests,   title: "Properties, not examples"}
  - {file: scenes/s14_ci.py,              cls: HooksThenCI,     title: "Hooks are local; CI checks again"}
  - {file: scenes/s15_recap.py,           cls: Recap,           title: "Tear down, recap, and what's next"}
