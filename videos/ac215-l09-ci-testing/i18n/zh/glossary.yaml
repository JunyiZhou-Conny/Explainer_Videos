# Chinese (zh-CN) glossary and translation rules for ac215-l09-ci-testing (AC215 lecture 9, Automating Software
# Development: CI, unit testing; a follow-along of dlops-io/cheese-app-ci-cd @ b8458ff, README Parts 1-4 and
# Docker Cleanup, and of the guest lecture's rahuldave/babykev walk, steps 00-05b), code-switching version,
# SUBTITLES ONLY.
# Audience: Chinese-speaking AC215 grad students who read technical English fluently; register of a Chinese
# MLOps TA running a lab section. Precedents and sources of the shared decisions: the series pilot
# videos/ac215-l01-vms-venvs/i18n/zh (venv, lock 文件, pin, 录制时), the container lectures
# videos/ac215-l02-containers-1, ac215-l03-mega-pipeline and ac215-l04-flexible-workflow-ports (container, image,
# 构建, 层, 缓存, 挂载, port, the subtitles-only rule set this file follows) and ac215-l05-rag (the latest
# sibling: one phrase for every erratum, 一个小疏漏; names with an underscore written as the narration says
# them). Every term L1-L5 already decided keeps their form; what is new here is the testing and code-quality
# vocabulary (unit / integration / system test, hermetic, the gate, hooks, formatter vs linter, coverage,
# fixtures and markers, property tests) and babykev's model words (mask, token, state, question).
# There is NO Chinese voice in this series (docs/AC215_SERIES.md rule 8): the Chinese lines are subtitles on the
# English timing (the bilingual band of output/<id>.zh-en.mp4, <id>.zh.srt, <id>.zh-en.srt / .ass). So no say:,
# no anchors, no readings, no durations: only display rules. But `python -m explainer.i18n check` still applies
# its voice hygiene to the displayed line when a sentence has no say: (brackets, maths symbols, letter_letter
# names, Latin words not listed here, a missing half-width space): rules A6, B3 and D3 are how the Chinese line
# stays clean without say:.
# Human-readable copy in Chinese: GLOSSARY.md (keep the two in sync).
# terms[].zh_subtitle = the display form (Chinese subtitle line; titles use the written forms of A4);
# terms[].first_use = an example sentence for the translators, as SNN[k]：<one Chinese sentence for one English
# sentence of SAY block k of scene SNN, k from 0>; each one passes the checker;
# rules are tagged [A1]..[I2]: A terms, B typography, C numbers, D narration file, G subtitles, H titles and
# companions, I toolkit notes. (L1's E on-screen strings and F voice rules do not apply: nothing on screen is
# translated in this series, and there is no voice.)
# Read by: python -m explainer.i18n check (Latin words allowed in the Chinese line: every Latin word of
# zh_subtitle and first_use, plus allowed_spoken_latin, which lists the words as the checker's regex
# [A-Za-z][A-Za-z'.-]* cuts them: flake8 is flake, step-05a is step- and a, ls -la is ls and la, -ra is ra,
# .env is env, localhost:9000 is localhost) and explainer/subtitles.py, for EVERY video (2-3 word English phrases
# of `en` are kept on one English line; 2-7 character Chinese headwords of zh_subtitle are registered in jieba, so
# zh_subtitle holds terms, not example phrases).
video: ac215-l09-ci-testing
lang: zh-CN (mainland Simplified Chinese)
audience: 'Chinese-speaking AC215 (MLOps & LLMOps) grad students who know Python and basic ML, read technical English fluently, did L1-L4 (a VM, venvs and uv, Docker images and containers, docker-shell.sh and the entrypoint pattern), and have never written a pytest test, run black or flake8 on purpose, or installed a git hook; they follow along on their own laptop with their clones of cheese-app-ci-cd and (part 2) babykev open. Nothing in this lecture needs the cloud. Register of a Chinese MLOps TA running a lab section.'
voice: none          # subtitles only (video.yaml: Chinese = i18n/zh/narration/*.yaml on the English timing)
policy: 'The Mandarin of a Chinese MLOps TA walking a lab section through the steps, code-switching only where such a speaker really does, written as subtitles under an English narration. The viewers are Chinese-speaking AC215 grad students who read technical English fluently and already say 把 repo clone 下来, 构建 image, 起一个 container, 跑一下 pytest, 装个 hook, 跑一下 lint, commit 被拦了, CI 挂了. Every choice passes three tests: what is said in a real lab section; the standard, searchable Chinese name (the Chinese pytest, Git and software-testing literature: 单元测试, 集成测试, 系统测试, 冒烟测试, 验收测试, 测试金字塔, 覆盖率, 格式化, 暂存, 断言, 属性测试, 反例); and consistency with the series (L1 decided the shared words, L2-L5 the container and Docker words). (1) Artifacts verbatim: what the viewer types or matches on screen (commands, flags, file and folder names, paths, image, container and tool names, recipe names, step tags, config keys, error codes, terminal text and the README''s Part / Option names) is copied letter for letter, never translated, inflected or quoted; the exceptions the checker forces (an underscore, =, < >, + or brackets inside the artifact) are written the way the narration says them (A6) and the English line shows the literal (D4). Nothing on screen is translated in this series: terminal output, code panels, README cards, tags, the trackers, the lecture tags, the gate table and the pause-and-ponder cards stay English; only the narration is. (2) Lab-speech English, a closed list: from L1-L5 venv, root, repo, clone, commit, pin, container, image, Dockerfile, tag, port, localhost, API, ID, bug; new in L9 hook, linter, lint, hermetic, fixture, parametrize, marker, assert, recipe, mask, causal mask, token, milestone, CI. (3) Everything else in standard Chinese: 测试, 单元测试, 集成测试, 系统测试, 冒烟测试, 验收测试, 测试金字塔, 边界, 门禁, 门禁表, 闸机, 格式化工具, 格式化, 格式检查, 问题 (a finding), 宽度, 覆盖率, 覆盖率下限, 收集, 收集器, 摘要, 容差, 跳过, 排除, 暂存, 重新暂存, 工作区, 历史, 交接链, 卫生检查, 私钥, 合并冲突标记, 配置, 配置文件, lock 文件 (L1), 依赖组, 运行时依赖, 开发工具, 包管理器, 命令运行器, 类型检查器, 诊断, 文档, 属性测试, 反例, 收缩, 状态, 问题 (a babykev question), 兄弟问题, 序列, 逐位相同, 参数, 冒烟测试, 服务器, 接口, 处理函数, 路由, 校验, 测试客户端, 黑盒, 退出码, 构建, 重新构建, 层, 缓存, 挂载, 凭据, 计费. (4) The video''s pictures by meaning, one word each: 门禁 (the gate), 闸机 (the turnstile), 历史 (the HISTORY vault), 托盘 (the three trays of inputs), 边界 (the hermetic border), 网线 / 那根线 (the network wire), 收集器 (the collector sweep), 交接链 (the hand-over chain), 烟雾报警器 (the smoke detector), 日记 (a test rewritten to match a bug). (5) Written register for titles, meta.yaml and companion docs: 容器, 镜像, 仓库, 克隆, 提交, 钩子（hook）, 代码检查工具（linter）, 质量门 / 门禁, 封闭测试（hermetic）, 掩码（mask）. (6) The bilingual band puts the English sentence under every Chinese line, so the Chinese line carries no glosses and no brackets at all (the checker forbids them without say:). (7) The toolkit''s constraints are part of the policy: one Chinese sentence per English sentence (92 blocks, 335 sentences), a checker-clean display line (D3), an en_display wherever the SAY spells an artifact out as words (D4). Mainland Simplified Chinese; relaxed, clear lab-section speech, never slangy.'
rules:
- '[A1] Code-switching scope. English stays in three places only. (a) Artifacts, copied letter for letter: commands and subcommands (git clone, cd, ls -la, sh docker-shell.sh, uvicorn api.service:app, curl, exit, docker ps, docker ps -a, docker build, docker run --rm, docker container ls, docker system prune, docker image ls, pip install black flake8, pip install pre-commit, pre-commit install, pre-commit run, pre-commit run --all-files, pre-commit uninstall, git commit, git commit --no-verify, git log, git diff, git add -u, git status, git switch --detach, sed -i, uv sync --locked, uv run pytest, uv run ty check, ty, just, just setup, just check, just test, just test -m system, just fmt, just types, just smoke local, yamllint, hadolint, docker build), flags (--rm, --reload, --max-line-length, --check, --diff, -ra, --network host, --all-files, --locked, --detach, -m system, --no-verify, -u, -i), file and folder names (cheese-app-ci-cd, docker-shell.sh, pytest.ini, utils.py, service.py, pyproject.toml, .git, .env, walk.md, tests, tests/unit/, tests/system/, api, src), image, container and tool names (cheese-app-api:local, api-server, pytest, black, flake8, ruff, ty, uv, just, pre-commit, hypothesis, yamllint, hadolint, pipx, curl, sed, torch, uvicorn), code names as the narration says them (power, pytest.raises, pytest.approx, assert, def broken, assert False, TypeError, branch mask, ones like, segment ID, distance, client), error codes and terminal text (F401, CACHED, 11 passed, 10 passed, 1 warning, 21 passed, 1 warning, 5 passed, 1 passed, 4 skipped, SKIPPED, API not running at localhost:9000, Skipped, Failed, files were modified by this hook, nothing to commit, 2 failed, 50 passed, 92 passed, 1 failed, 102 passed, 8 failed, 95 passed, 1 deselected, 1 passed, 103 deselected, WRONG, command not found, Application startup complete, externally-managed-environment, files were modified), config words (line-length, DEV, health), babykev''s step tags (step-00, step-01, step-02, step-03, step-04, step-04b, step-05, step-05a, step-05b; A10), the README''s Part and Option names as the trackers write them (Part 2, Part 3, Part 4, Part 5, Option B, Option 2, Option 3; A7), and the on-screen tags when the narration names them (your turn, extra; A11). The exceptions are artifacts the checker rejects (A6). (b) Products, organisations, the course and names: Docker, Docker Desktop, Git, GitHub, Python, FastAPI, Homebrew, Linux, Mac, CPU, JSON, HTML, URL, GET, Hugging Face Hub, AC215, cheese, babykev, Rahul Dave, app, root. (c) A closed list of words Chinese engineers say in English in a lab section: from L1-L5 venv, root, repo, clone, commit, pin, container, image, Dockerfile, tag, port, localhost, API, ID, bug; new in L9 hook (装 hook，hook 文件), linter and lint (跑 lint), hermetic, fixture, parametrize, marker, assert, recipe (a just recipe), mask and causal mask, token, milestone (the course project''s milestones), CI. A word joins (c) only if lab speech really uses the English and the Chinese is stiff, ambiguous or collides with another term (钩子 sounds like a textbook; 代码检查工具 is long and also covers type checkers; 封闭 / 密封测试 is not an established term; 夹具 and 参数化 are textbook pytest words nobody says aloud; 标记 collides with the trays and the mask cells; 配方 is the series word for a Dockerfile; 掩码 is fine in writing but every ML lab says mask). Never English for flavour: no test, unit test, system test, smoke, coverage, gate, formatter, format, collect, skip, stage, history, lockfile, type checker, property test, counter example, shrink, server, endpoint, handler, layer, cache, build.'
- '[A2] Docker, as L2-L5. The subtitles say container and image (起一个 container, 构建 image, image 里, 打包进 image), measure word 个; titles, chapter names, meta.yaml and companion docs write 容器 and 镜像 (A4). build → 构建, rebuild → 重新构建, Build again → 再构建一次; cached / all cached → 全是缓存 (the terminal word CACHED stays); layer → 层 (one fat layer → 一个很厚的层; four thin copy lines → 四行薄薄的 COPY); bake into the image → 打包进 image (as L4); mount → 挂载 (your files are not mounted → 你的文件没有挂载进这个 container); the entrypoint → entrypoint (docker-entrypoint.sh, as on screen; 这个 entrypoint); exit code → 退出码; detached → 在后台; host → 宿主机 (as L2: on the host → 在宿主机上).'
- '[A3] Testing words (new in this lecture). test → 测试 (测试文件, 测试目录, 测试集 for a suite); unit test → 单元测试; integration test → 集成测试; system test → 系统测试; smoke test / the smoke → 冒烟测试; acceptance test → 验收测试; testing pyramid → 测试金字塔; kind of test → 哪一类测试 / 类型; hermetic stays (一个测试是 hermetic 的；不 hermetic 的测试；the hermetic claim → hermetic 的说法), written 封闭测试（hermetic）; border → 边界 (the hermetic border → 这条边界; on the border picture → 在边界图上); executable specification → 可执行的规格说明; trays → 托盘 (normal, edge, invalid → 正常、边缘、非法; edges → 边缘情况); collect / collected → 收集, collector → 收集器; discovery by convention → 按约定发现测试; the -ra summary → -ra 的摘要; skip / skipped → 跳过 (the printed SKIPPED / Skipped stay); deselect → 排除 (the printed deselected stays); select on purpose → 特意选中; assert stays, assert rewriting → assert 会被改写; tolerance → 容差; fixture and parametrize stay; marker stays (labels for selecting tests → 用来挑选测试的记号); test client → 测试客户端; module global → 模块级的全局变量; in process → 在同一个进程里; property test → 属性测试; hypothesis (the tool, lower case as on screen) stays; draw any shape → 随便抽形状; counter example → 反例; shrink → 收缩; the smallest witness → 最小的证据; coverage → 覆盖率 (the measure, the run and the report: 跑覆盖率, 覆盖率 94%), coverage floor / the floor → 覆盖率下限 / 下限; necessary, never sufficient → 必要，但永远不充分.'
- '[A4] Written vs spoken pairs. Subtitles say repo / clone / commit / container / image / hook / linter / hermetic / mask; titles, chapter names, meta.yaml and the companion docs write 仓库 / 克隆 / 提交 / 容器 / 镜像 / 钩子（hook）/ 代码检查工具（linter）/ 封闭测试（hermetic）/ 掩码（mask）. The gate is 门禁 in subtitles and docs; the publish title and meta.yaml''s title say 提交前的质量门 (video.yaml publish.title_zh), so 质量门 is the title word and 门禁 the running word. The README''s own repository wording (clone or download from your repository) → 从你的仓库 clone 或下载 (quoting the README).'
- '[A5] Writing artifacts. Copied verbatim (case, dots, slashes, hyphens unchanged); never translated, inflected, quoted, put in 《》 or code formatting. Add a Chinese head noun where it helps: pytest.ini 这个配置文件, utils.py 里, api 目录, tests 目录, .git 里, .env 文件, hook 文件, setup 这个 recipe, detect-private-key 这个 hook, --reload 参数, just test 这条命令. Never start a sentence with a lower-case artifact or kept-English word (pytest, black, flake8, hypothesis, babykev, just check, walk.md, step-05a, hermetic, mask, git, cheese, utils.py, --reload, entrypoint, commit, clone): put a Chinese word first (这时 pytest……; 文件已经被 black 改写过了; 按 walk.md……; 到了 step-05a……; 所谓 hermetic……; 有一个 mask……; 参数 --reload……; 这个 entrypoint……; 先 clone……; 前面 cheese 的 repo……; 在 babykev 那边……). A capitalized name, product or code word may open a sentence (Part 2, Option B, README, Git, Docker, CI, Dockerfile), and so may a terminal count that opens the English sentence (1 passed, 4 skipped……; 5 passed……; 8 failed, 95 passed……). When the SAY shortens a command the screen shows in full, write it as the screen shows it (docker-shell again → docker-shell.sh).'
- '[A6] Artifacts the checker rejects. With no say:, the checker reads the display line as speech and rejects letter_letter names, = < > + and brackets of any kind. So these artifacts are never copied into the Chinese line; they are written the way the narration says them, and the English line shows the literal through en_display (D4). Table: (3, 4) → x 是 3，y 是 4; GET /euclidean_distance/?x=3&y=4 → GET euclidean distance，x 是 3，y 是 4; power(3, 2) → power，参数是 3 和 2; --max-line-length=120 → --max-line-length 设成 120; test_*.py → 文件名以 test 下划线开头; Test* → 类名以 Test 开头; test_* → 函数名以 test 下划线开头 / test 下划线加星号; test_broken → test 下划线 broken; def broken(): assert False → def broken，内容是 assert False; DEV=1 → DEV 设成 1; Ctrl+C → Ctrl-C (both lines); line-length = 100 → line-length 设成 100; torch.ones_like → torch 的 ones like; branch_mask → branch mask. When the toolkit lets display lines keep these characters (I1), the literals may replace the descriptions.'
- '[A7] Disambiguation pairs. Part 2 / Part 3 / Part 4 / Part 5 and Option B / Option 2 / Option 3 (the cheese README''s parts and options, as the trackers write them) vs 第一部分 / 第二部分 (the video''s two parts) vs step-00 … step-05b (babykev''s tags) vs 第 k 步 (never used: the trackers'' step k of N stay English on screen). 门禁 (the gate) vs 闸机 (the turnstile drawing) vs L4''s 关卡 (the three auth gates: a different picture). 边界 (the hermetic border) vs 边缘 (edge inputs). 问题 (a flake8 / ruff finding; a babykev question; a ponder question: the context always tells, and the gate table''s rows are 一行) vs 报错 (an error message) vs bug. 格式化工具 (a formatter) vs linter vs 类型检查器 (a type checker). 格式化 (format) vs 格式检查 (format check, fmt --check) vs lint. 暂存 (stage, git add) vs 提交 / commit. 跳过 (skip) vs 排除 (deselect) vs 失败 (fail). 覆盖率 (coverage) vs 下限 (the floor). 状态 (babykev''s state tokens) vs 问题 (its questions) vs 兄弟问题 (a sibling question). 一类测试 (a kind of test) vs 类 (a Python class: 类名以 Test 开头; the whole class). 测试集 (a suite) vs 测试目录 (a test folder). 依赖 (dependencies) vs 依赖组 (groups) vs 包 (packages: 38 个包). 配置 (a config) vs 设置 (a setting; a .env file''s settings). 凭据 (credentials, S01 and S15) vs 密钥 (secrets in a .env file; private keys are 私钥).'
- '[A8] Register: a TA running a lab section. Short instructions, colloquial verbs (装, 跑, 删, 敲, 改, 拦, 挂, 卸掉); address the viewer as 你 (one-to-one follow-along; never 您, 大家, 同学们); 我们 is us at recording time. Chinese word order; restructure freely inside a sentence, but keep the English order of clauses (the band pairs zh and en clause by clause). No translationese: no 让我们… (use 我们来… / 先…), no 这就是为什么… (use 所以… / 也正因为这样…), few 被 passives, no chains of 一个…的. No internet slang. Carry the spoken rhythm by meaning: Time to type → 该动手敲了; Watch the trap → 看好这个陷阱; Now watch it bite → 现在看它咬人; Proof the gate grew teeth → 证明门禁长了牙; Now the lesson → 现在说正题; Now the limit → 再说局限; First, honesty → 先说实话; State the rule once instead → 换个办法：把规则写一次; cuts both ways → 是一把双刃剑; a floor is a gate, not a goal → 下限是门禁，不是目标; Rebuild, or you test the past → 要么重新构建，要么你测的就是过去.'
- '[A9] Precision. Translate hedges exactly: only 只, every 每个, all 全部, about 大约, roughly 大约, under a second 不到一秒, up to 最多, at least 至少, by default 默认, on purpose 有意 / 故意, for now 暂时, never 从不 / 永远不. at the time of recording is always 录制时 and never dropped (about a minute; 26.10.1 and 7.4.1; pytest 9''s 1 warning; 4.7.0; 0.13.2 and 1.59.0; 38 packages and torch 2.14.1; about 95 MB; the harmless warnings). Counts, versions, widths, percentages and sizes match the screen exactly. Errata are gentle and always followed by the fix, with one phrase for every one, as L5: a small gap / slip → 一个小疏漏 (the README''s returns 5.0); the README runs the tests immediately → README 接着马上就跑测试; does not quite manage that → 还没完全做到. The platform note of S13 is said as kindly as the English (1 failed, 102 passed on this Linux CPU, all 103 on the author''s Mac; never babykev''s bug or the student''s mistake). Ponder questions (S06, S08, S09, S12, S13) ask without answering, and the wording must not give the answer away (S08 must not say skip; S09 must not say black already fixed the file; S12 must not say no).'
- '[A10] Names. Products, companies and course names stay Latin (A1 b); 哈佛 when the SAY says Harvard (S01) and in titles and the description. Course: AC215; lecture n → 第 n 讲 (lecture 2 → 第 2 讲, lecture 3 → 第 3 讲, lecture 21 → 第 21 讲); next lecture → 下节课; the lecture → 课上; the guest lecture → 客座讲座, by Rahul Dave → Rahul Dave 的客座讲座 (narration only, once); the instructor → 授课老师 (a Harvard instructor → 哈佛的一位授课老师); the author → 作者. babykev''s steps are written as their tags, as on screen: step zero zero → step-00, Step 1 / 2 / 3 / 5 → step-01 / step-02 / step-03 / step-05, Steps 4 and 4 b → step-04 和 step-04b, Step five a / five b → step-05a / step-05b; a tag never opens a sentence (到了 step-05a……; 接着 step-02：……). The walk (babykev-walk''s walk.md) → walk.md; as the walk records → walk.md 里有记录. milestone stays (milestone 5; 你做 milestone 时). The user app, the server name api-server, the image cheese-app-api:local and the repo names stay.'
- '[A11] The screen stays English. This series translates the narration only: terminal output and prompts, terminal titles, code panels (comments included), README cards, the six trackers (README › Part 1: Understanding the Codebase, step k of N), the lecture tags (Lecture 9 · slides a–b), tags (your turn, extra, illustration, recorded), the gate table, the mask grids and the pause-and-ponder cards are all English, and the scenes need no language changes. So when the narration names an on-screen tag, the subtitle names it as the screen shows it: 黄色的 your turn 标签, 灰色的 extra 标签. Everything the narration says in its own words is translated: an extra → 额外检查 / 额外步骤 / 作为额外的一次运行, the tracker → 进度条, the gate table → 门禁表, the turnstile → 闸机, four gray dots → 四个灰点, the headline → 标题行.'
- '[A12] Mainland Simplified Chinese only: 默认, 程序, 代码, 文件, 目录, 服务器, 网络, 脚本, 视频, 用户, 信息, 配置, 凭据, 进程, 字段, 对象, 函数, 类, 模块, 变量, 文档; never 預設, 程式, 程式碼, 檔案, 資料夾, 伺服器, 網路, 腳本, 影片, 使用者, 訊息, 組態, 憑證, 行程, 物件, 函式, 模組, 變數, 文件 for docs in the Taiwan sense.'
- '[A13] Model words (babykev, S12-S13). mask stays (一个 mask; 错的 mask; written 掩码（mask）); causal mask stays; token stays (两个状态 token; 6 个 token 的图); state → 状态; question → 问题; sibling question → 兄弟问题 (a sibling pair → 兄弟问题的一对); sequence → 序列; packs … into one sequence → 打包进同一个序列; the forbidden cell → 禁止的格子; rows 5 and 6 → 第 5 行和第 6 行; segment ID stays; bit for bit equal → 逐位相同, bit exactness across machines → 跨机器逐位一致; sums in a different order → 求和的顺序不一样; half a billion parameters → 5 亿参数; nothing is trained → 什么都没训练; an untrained score → 没训练过的模型的分数; how confident it is → 有多大把握; scored as half confident → 被打成了一半的把握; rounded probabilities → 四舍五入后的概率; the model stack → 整套模型依赖; a public model host → 公开的模型托管平台.'
- '[B1] Spacing. One half-width space between Chinese and Latin letters, digits or artifacts (输入 git commit, Python 3.9, port 9000, 11 passed, 94%, 26 个测试, 第 5 行, .git 里, hook 文件, 1 GB). The checker reports a missing space on every displayed sentence. Spaces inside an artifact stay as they are (pre-commit run --all-files); never add one inside an artifact. No space next to full-width punctuation (……pre-commit uninstall。, 是 hermetic，). Percentages are written without a space before %: 0%, 49.4%, 90%, 94%, 100%. Never fake a no-break space with U+00A0 / U+202F.'
- '[B2] Punctuation. Full-width ，。、；：？！“”…… in Chinese text, also next to artifacts (输入 exit。). Lists use 、 (测试、格式化工具、linter). Terminal text keeps its own half-width comma (10 passed, 1 warning; 1 passed, 4 skipped), copied as printed. No brackets of any kind, neither （） nor () nor 《》 nor 【】 nor [] nor <>: the checker rejects them on a line with no say:, and the bilingual band needs no gloss. “” only for a quoted thought or word in Chinese; artifacts and tag names are never quoted. No 。？！ inside one Chinese sentence (one per English sentence): use ，；： instead (a two-part question becomes one question: 这时 pytest 实际打印了什么，这四个测试又是不是 hermetic 的？). Questions keep ？.'
- '[B3] Symbols the checker rejects (= < > + → ← ^ ≤ ≥ × ÷ ≈, == != +=, a digit followed by !, brackets, letter_letter): never copied into the Chinese line; written the way the narration says them (A6). Allowed and kept as on screen: / in paths (tests/unit/, tests/system/), . in file names and code names (pytest.ini, pytest.raises, api.service), : inside an image name or an address (cheese-app-api:local, api.service:app, localhost:9000), - in flags and names (--all-files, -ra, step-05a, Ctrl-C), * is avoided (test 下划线加星号), % after a number (94%).'
- '[C1] Numbers in display text. Arabic digits for everything that echoes the screen, the terminal, the code or the slides: counts (10 个这样的测试, 26 个测试, 11 passed, 22 个测试, 这 4 个, 70 个问题, 32 个, 37 个, 38 个包, 6 条诊断, 9 个测试, 50 个, 88 个, 15 个奶酪问题, 15 个里答对了 6 个, 4686 种形状 without a thousands separator, 1 到 6 个 token, 最多 4 个问题), widths (88, 120, 79, 95 个字符, 100), ports, versions, sizes, percentages, the date (2025 年 11 月), the step tags, README Part / Option numbers, rows (第 5 行和第 6 行), 6 段 / 4 段 / 1 段 (the trackers: the English says 6 sections). Chinese numerals for small narrative counts the screen does not show as digits: 一行代码, 两个嫌疑人, 三个托盘, 三条路, 四列, 九个 hook, 七个卫生检查, 六个 hook 通过, 两个没东西可查, 四个 hook, 三次 curl, 两个额外步骤, 两种门禁风格, 两个工具, 一处不同, 两行, 六行, 五道自测题, 第一题 … 第五题, 第一部分 / 第二部分. When the English uses a word for a number the screen shows as a digit, follow the screen (Ten of those → 10 个这样的测试; four tests on screen as 4 skipped → 这 4 个).'
- '[C2] Units, versions and dates. Sizes as on screen with a half-width space and the English unit: 95 MB, 1 GB, 1.15 GB, 1.84 GB (megabytes / gigabytes are never written out). Versions with their name: Python 3.9, Python 3.13.16, pytest 9, black 26.10.1, flake8 7.4.1 (said as 分别是 26.10.1 和 7.4.1), pre-commit 4.7.0, uv 0.13.2, just 1.59.0, torch 2.14.1. Percentages with a digit and %: 0%, 49.4%, 90%, 94%, 100%; 0 percent → 0%. Ranges: Python 3.9 及以上 (or newer). Durations: 30 秒, 不到一秒, 大约一分钟. Dates: from November 2025 → 2025 年 11 月的.'
- '[D1] Sentence alignment (explainer/i18n.py). One entry per SAY line of script.md in narration/*.yaml (92 blocks); `en` byte-equal to the SAY line; `zh` has exactly one item per English sentence as split by explainer.voice.split_sentences (335 in this script). Restructure only inside a sentence; never merge or split. Short sentences keep their own item: No. → 不会。 (S06, S09) / 不能。 (S12); Why does it skip? → 为什么会跳过？; Now the lesson. → 现在说正题。; Now the limit. → 再说局限。; Hold that thought. → 先记住这一点。; It is never committed. → 它永远不能 commit。; Two rows join the table. → 表里又多了两行。; 6 of 15 right. → 15 个里答对了 6 个。. Run python -m explainer.i18n check videos/ac215-l09-ci-testing --lang zh until it prints OK.'
- '[D2] No say:, no anchors. There is no Chinese voice: never write say: (the display line is the only text) and never write anchors: (they only place animation beats for a Chinese-voiced render). The subtitles are timed by the English audio; the toolkit pairs each Chinese sentence with its English sentence by position.'
- '[D3] A checker-clean display line. With no say:, every displayed sentence must pass explainer.i18n.spoken_problems: no brackets (B2), no maths symbols (B3), no letter_letter names (A6), no digit followed by !, no clause ending in 种 followed by ，。！？, a half-width space between Hanzi and Latin or digits (B1), each sentence ending in 。！？ or …… (optionally followed by ” or 」), and every Latin word in this glossary (zh_subtitle, first_use or allowed_spoken_latin). The checker cuts words with the regex [A-Za-z][A-Za-z''.-]*: flake8 is flake, step-05a is step- and a, ls -la is ls and la, -ra is ra, .env is env, --no-verify is no-verify, cheese-app-api:local is cheese-app-api and local. A Latin word it reports is either an English word to translate (the usual case) or a missing artifact: add the artifact to allowed_spoken_latin, cut the same way, and to the matching term.'
- '[D4] The English line (en_display). In the bilingual band the English line shows the SAY sentence, which spells artifacts out for the voice. Every such sentence gets an en_display item with the literal on-screen form, otherwise word for word the SAY sentence; null for the other sentences of the block. Table (SAY → en_display): the point 3 comma 4 / the distance of 3 comma 4 → (3, 4); pytest dot raises / pytest dot approx → pytest.raises / pytest.approx; raises a type error → raises a TypeError; get euclidean distance, with x 3 and y 4 → GET /euclidean_distance/?x=3&y=4; power of 3 and 2 → power(3, 2); ls dash l a → ls -la; uvicorn api dot service colon app, host 0.0.0.0, port 9000, with reload → uvicorn api.service:app --host 0.0.0.0 --port 9000 --reload; application startup complete → Application startup complete; control C → Ctrl-C; dash dash rm → --rm; docker ps dash a → docker ps -a; The reload flag → The --reload flag; cheese-app-api tagged local → cheese-app-api:local; flake8, max line length 120, on the api folder → flake8 --max-line-length=120 api/; in check and diff mode → in --check --diff mode; externally managed environment → externally-managed-environment; files named test underscore something, classes named Test, functions named test underscore → files named test_*.py, classes named Test*, functions named test_*; dash r a → -ra; def broken, assert False → def broken(): assert False; test underscore star → test_*; test underscore broken → test_broken; pytest tests slash unit → pytest tests/unit/; with DEV equals 1 → with DEV=1; docker run with network host, pytest tests slash system → docker run --network host, pytest tests/system/; skipped, API not running at localhost 9000 → SKIPPED, API not running at localhost:9000; dot git → .git; pre-commit run, dash dash all dash files → pre-commit run --all-files; git add dash u → git add -u; sed dash i → sed -i; git switch, dash dash detach → git switch --detach; step zero zero → step-00; uv sync, dash dash locked → uv sync --locked; line length 100 → line-length = 100; dot env file → .env file; Steps 4 and 4 b → Steps 4 and 4b; torch dot ones like → torch.ones_like; branch mask → branch_mask; Step five a / five b → Step 5a / Step 5b; non hermetic → non-hermetic; just test, dash m system → just test -m system; git commit, dash dash no verify → git commit --no-verify; the detect private keys hook → the detect-private-key hook; dash dash no verify → --no-verify. The commas the SAY puts around a spelled command for the voice (dash a, / dash u, / dash r a,) are dropped in en_display. The English video''s own .srt is unaffected.'
- '[D5] Content parity. Each Chinese sentence translates its English sentence and nothing more: no added commands, flags, glosses, Chinese console names or explanations; 额外 only where the English marks an extra; no Chinese gloss of a kept-English term (the English line is right below). The licensed changes: writing an artifact as the screen shows it where the SAY shortens or spells it (A5, A6, D4: docker-shell again → docker-shell.sh; Locked means → 加上 --locked，意思是), and the babykev step tags (A10).'
- '[D6] Fixed patterns. Pause and run it. → 暂停一下，自己跑一遍。 Pause and run both. → 暂停一下，两条都跑一遍。 Pause and run them. / Pause and run these. → 暂停一下，把它们都跑一遍。 / 暂停一下，把这些都跑一遍。 Pause and run both forms. → 暂停一下，两种写法都跑一遍。 Pause and do it. → 暂停一下，照着做。 pause and try it / pause and try the first → 暂停一下，试一试 / 暂停一下，试试第一次 pause and print yours → 暂停一下，打印你自己的 pause and walk the loop → 暂停一下，把这个循环走一遍 Pause and run the smoke. → 暂停一下，跑一下冒烟测试。 When the yellow your-turn tag appears, pause and run the command. → 看到黄色的 your turn 标签，就暂停，自己跑这条命令。 A gray extra tag marks a check not in the README. → 灰色的 extra 标签表示这个检查 README 里没有。 An extra … not in the README: → 额外……，README 里没有这一步： an extra (step, check, run) → 额外跑一下 / 额外检查 / 额外步骤 / 作为额外的一次运行 / 是额外的. Something to ponder. / Something to ponder: → 来想一个问题。 / 来想一个问题： A quick ponder: → 快速想一下： Something to ponder before we run it. → 跑之前，先想一个问题。 Hold that thought. → 先记住这一点。 hold that number → 先记住这个数字 at the time of recording → 录制时 5 questions to test yourself. → 五道自测题。 One: … Five: → 第一题：…… 第五题： The answers are in the exercises, and every command is in the study guide. → 答案在练习里，每条命令都在学习指南里。 Every command is in the study guide, linked below. → 每条命令都在学习指南里，链接在下方。 Next lecture brings … → 下节课会用到…… Before the recap, clean up. → 回顾之前，先清理。'
- '[D7] Files. narration/g1.yaml = S01-S09 (part 1: the cheese-app-ci-cd tutorial, README Parts 1-4), narration/g2.yaml = S10-S15 (part 2: the guest lecture''s babykev, then the README''s Docker Cleanup), the parts of video.yaml; each starts with a comment header (what it covers, the rules it applies: A6 described artifacts, D4 en_display, no say:/anchors) and keeps the script order. Strings in double quotes; YAML-escape a literal double quote or backslash.'
- '[D8] Length on the English timing. The Chinese is read while the English is heard, and the band switches where the English pieces switch (a Chinese piece that would read faster than 9 units a second gets at most 1 s more). Keep each Chinese sentence about as long to read as the English is to hear: as a rule of thumb at most about 2 units per English word (a CJK character 1, a Latin character 0.55), so cut filler connectives and repeated subjects, never content. Long artifacts count (uvicorn api.service:app is about 13 units, externally-managed-environment about 17, pre-commit run --all-files about 15): do not repeat them where the English does not.'
- '[G1] Widths. Bilingual band: a Chinese line holds at most 30 units, the English line 96 characters; the Chinese-only sidecar (.zh.srt) holds 22 units a line, 2 lines a cue. Write clauses of at most about 24 units, separated by ，；：, so the splitter has clean places to cut; avoid a clause longer than 30 units with no punctuation.'
- '[G2] Cue endings: the toolkit drops a cue-final 。，、；： and keeps ？！…… and a closing ” (subtitles.strip_end). Do not end a sentence on an artifact plus a full stop if a Chinese word can close it (……打包进一个 image 的 Dockerfile。 is fine; ……检查 api 目录。 reads better than ……api。).'
- '[G3] Commands are never broken. The splitter treats a space between two Latin words in a Chinese line as a good cut, so pre-commit run --all-files or just test -m system can land on two lines, which a viewer cannot copy. Put a whole command at the end of a clause after a full-width colon (想让它们照样跑一遍，就用 pre-commit run --all-files。; 一条命令就建好环境：uv sync --locked。), at most one command per cue, with little Chinese around it. A command that does not fit one line or contains A6 characters is described in its parts, as the SAY does (uvicorn api.service:app，host 是 0.0.0.0，port 是 9000，加上 --reload; docker run --rm，加上 image 名，再加 pytest tests/unit/). Check every cue with a command in the rendered .zh.srt.'
- '[H1] Titles (meta.yaml). Video, part and chapter titles in the written register (A4: 容器, 镜像, 仓库, 克隆, 提交, 钩子, 质量门 / 门禁, 掩码); questions keep their question mark; the English colon structure is kept; commands, tools and file names stay as they are (pytest, black, flake8, pre-commit, uv, just, just check, CI); meta.yaml is not checked, so brackets are fine there. The video title agrees with video.yaml''s publish.title_zh (CI 与单元测试：pytest、pre-commit，提交前的质量门) in the series pattern AC215 · 第 n 讲：…（跟练：…）. The core-concept chapter carries the English short name for search: 三类测试与一道门禁（hermetic）. The scene that shares an English title with L1-L4 shares its Chinese (Tear down, recap, and what''s next → 收尾、回顾和下节预告).'
- '[H2] Description (Bilibili / YouTube): two or three sentences: this is the AC215 lecture 9 follow-along of dlops-io/cheese-app-ci-cd and the guest lecture''s rahuldave/babykev; what the viewer does and learns (unit / integration / system tests inside the image, the testing pyramid and hermetic tests, skipped is not passed, black vs flake8 and the width of 120, pre-commit refusing a commit; one lockfile and one command just check, 94% coverage and a wrong mask, a hypothesis property test shrinking the counter-example, markers for non-hermetic tests, CI); English narration with Chinese and bilingual subtitles, every README command verbatim and in order, captures dated 2026-10-19, nothing billable. Written register, terms of this glossary; consistent with video.yaml''s publish.description_zh.'
- '[H3] Companions: i18n/zh/README.md (and exercises.md / digest.md if made) are translated with this glossary in the written register (容器, 镜像, 仓库, 克隆, 提交, 钩子（hook）, 代码检查工具（linter）, 格式化工具, 封闭测试（hermetic）, 覆盖率, 测试金字塔, 属性测试, 反例, 掩码（mask）, 锁文件 / lock 文件); brackets and underscores are fine there (not checked). Headings and <summary>答案</summary> are translated. A term table at the end: English | the term used here | common variants (钩子, 代码检查工具 / 静态检查, 格式化器, 夹具 for fixture, 参数化 for parametrize, 标记 for marker, 密封测试, 基于属性的测试, 质量门禁, 持续集成 for CI).'
- '[H4] Code and commands stay byte-identical in the companions: code blocks, commands, file names and inline `code` are unchanged; only # comments and the prose around them are translated.'
- '[I1] (request, open since L3) explainer.i18n check applies its voice hygiene (_SPOKEN_BAD: brackets, maths symbols, letter_letter names) to the display line when a sentence has no say:. For a subtitles-only video (this series; video.yaml has no languages.zh.voice and this glossary says voice: none) those checks guard nothing and force A6 and B3. Proposal: skip _SPOKEN_BAD for display-only sentences when the glossary''s voice is none (keep the Latin-word, spacing and sentence-end checks). Then A6 shrinks to the literals: test_broken, --max-line-length=120, DEV=1, torch.ones_like, branch_mask, line-length = 100.'
- '[I2] (todo, from L1 I3) explainer/subtitles.py''s _cuts treats a space between Latin words in a Chinese line as a good cut, so commands can be split (G3). Proposal: in a Chinese line, treat a run of Latin tokens separated only by spaces as unbreakable unless it alone exceeds a line.'
terms:
# ---------------------------------------------------------------- the opening: the bug, the gate, the follow-along
- en: 'commit / git commit / a commit / commit again / no commit made / enters history'
  zh_subtitle: 'commit / git commit / 历史 / 提交（书面）'
  first_use: 'S01[1]：你输入 git commit。'
  note: 'Lab speech (A1 c, from L1). a real commit enters history → 一个真正的 commit 进入了历史 (the HISTORY vault); no commit made / no commit exists → 没有生成 commit / commit 没有生成; It is never committed → 它永远不能 commit. Written 提交 (A4).'
- en: 'gate / a gate / the gate table / the turnstile / anything that can fail and stop you'
  zh_subtitle: '门禁 / 门禁表 / 闸机 / 质量门（标题）'
  first_use: 'S01[1]：课上给能说不的东西起了个名字：门禁，也就是任何会失败、能拦住你的东西。'
  note: 'New in L9. 门禁 is the running word in subtitles and docs (CI 门禁 is everyday Chinese engineering speech); 质量门 only in the title (publish.title_zh). Kept apart from L4''s 关卡 (A7). the gate grew teeth → 门禁长了牙; outside the turnstile → 在闸机外面; the gate table is full → 门禁表填满了.'
- en: 'say no / refuse / refusal / the gate refuses / is refused / blocks a commit'
  zh_subtitle: '说不 / 拒绝 / 拦下'
  first_use: 'S01[1]：今天我们就在你的电脑上搭一个门禁，看着它拒绝一次 commit。'
  note: 'The commit fails twice → 这次 commit 被拦了两道; blocks a commit → 拦下 commit.'
- en: 'machine learning system / the model is a few tiles in a big grid / engineering'
  zh_subtitle: '机器学习系统 / 工程'
  first_use: 'S01[2]：先退一步看：在一个机器学习系统里，模型只是一大张格子里的几块；其余都是工程。'
  note: 'tiles → 几块 (of a grid → 一大张格子里).'
- en: 'no cloud, no credentials, no bill / billable / credentials'
  zh_subtitle: '凭据 / 计费'
  first_use: 'S01[3]：不用云，不用凭据，没有账单：一切都在你的笔记本上跑，这正是重点。'
  note: 'credentials → 凭据 (S01, S15: next lecture brings cloud credentials → 下节课会用到云上的凭据); Nothing today was billable → 今天没有任何计费.'
- en: 'the tracker / 6 sections / the yellow your-turn tag / a gray extra tag / the study guide'
  zh_subtitle: '进度条 / your turn 标签 / extra 标签 / 学习指南'
  first_use: 'S01[4]：看到黄色的 your turn 标签，就暂停，自己跑这条命令。'
  note: 'A11, D6, as L2-L5. 6 sections today → 今天一共 6 段 (C1).'
- en: 'bug / the buggy line / the wrong square root / revert / the repo''s log'
  zh_subtitle: 'bug / 有 bug 的那一行 / revert / log'
  first_use: 'S02[0]：接着课堂演示把那个错的平方根混了进去，后来又被 revert 拿掉了。'
  note: 'bug is lab speech (A1 c). the revert (the commit that undid it) → revert, as git log shows it; the repo''s own log → 这个 repo 自己的 log; An extra git log → 额外跑一下 git log.'
- en: 'distance / origin / square root / radius / overshoots the circle'
  zh_subtitle: '距离 / 原点 / 平方根 / 半径'
  first_use: 'S02[1]：有 bug 的那一行返回 50 的平方根，大约 7.07：冲出了这个圆。'
  note: 'the square root of x squared plus y squared → x 的平方加 y 的平方，再开平方; the point 3 comma 4 → 一个点：x 是 3，y 是 4 (A6).'
- en: 'executable specification / two suspects / believe the test, fix the code / a diary'
  zh_subtitle: '可执行的规格说明 / 嫌疑人 / 日记'
  first_use: 'S02[2]：测试就是可执行的规格说明，这个测试本来会在任何人看到演示之前就说不。'
  note: 'The lecture''s rule → 课上的规则; fix the code, not the tests → 改代码，不改测试 (S10).'
- en: 'three trays / normal / edge / invalid / zero exponents / infinity / not a number'
  zh_subtitle: '托盘 / 正常 / 边缘 / 非法 / 边缘情况 / 无穷大 / 非数值'
  first_use: 'S02[4]：课上把输入分进三个托盘：正常、边缘和非法。'
  note: 'edge → 边缘 (never 边界, which is the hermetic border, A7); the invalid tray from earlier → 前面那个非法输入的托盘.'
- en: 'power function / power / 2 to the power 3 / squaring x / a type error / TypeError'
  zh_subtitle: 'power 函数 / power / TypeError'
  first_use: 'S02[4]：对这里的 power 函数来说，2 的 3 次方是正常输入；指数为零、无穷大和非数值都是边缘情况。'
  note: 'The function name stays (A1 a). power of 3 and 2 → power，参数是 3 和 2 (A6); a type error → TypeError (the exception the test names).'
# ---------------------------------------------------------------- kinds of test
- en: 'test / tests / test file / test folder / suite / the test run'
  zh_subtitle: '测试 / 测试文件 / 测试目录 / 测试集'
  first_use: 'S02[2]：有一个现成的测试早就知道正确答案。'
  note: 'A3. Never test in a subtitle except inside an artifact (tests/unit/, tests 目录, test 下划线 broken). per suite → 每个测试集; both suites together → 两个测试集一起跑.'
- en: 'unit test / unit tests / a unit test'
  zh_subtitle: '单元测试'
  first_use: 'S03[0]：单元测试完全绕开应用，只单独调用这一个函数。'
  note: 'A3. Same in writing.'
- en: 'integration test / integration tests / the integration suite'
  zh_subtitle: '集成测试'
  first_use: 'S03[1]：集成测试把我们自己的几个部分连起来。'
  note: 'A3. The system test file calls itself integration tests → 这个 repo 的系统测试文件管自己叫集成测试.'
- en: 'system test / system tests / the system row / the system command'
  zh_subtitle: '系统测试'
  first_use: 'S03[2]：系统测试把运行中的程序当成一个黑盒。'
  note: 'A3. marked system (the marker) → 标上了 system; the system row → 系统测试这一行.'
- en: 'smoke test / the smoke / just smoke local'
  zh_subtitle: '冒烟测试 / just smoke local'
