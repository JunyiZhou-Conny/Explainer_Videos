# Chinese (zh-CN) metadata for ac215-l14-serverless-deployment (read by explainer/i18n.py meta(), used by
# explainer/build.py for the subtitles' chapters and the zh descriptions): video title, part titles, chapter
# titles keyed by scene file stem (as video.yaml's scenes), and the Bilibili / YouTube description.
# Titles follow GLOSSARY.md rule H1: written register (容器, 镜像, 仓库, 克隆, 端口, 存储桶, 无服务器, 函数, 服务, 作业,
# 端点; A4), the English colon structure kept (开始之前：项目、区域、克隆仓库; 第 1 部分：写一个函数), commands, tools and
# names as they are (localhost, Cloud Run, ADC, helper), the core-concept chapters with their English short name once
# for search (查询字符串（query string）, 服务（service）, 作业（job）), and S16 in the series' 收尾 pattern. 跟练 =
# follow-along; Serverless Deployment → 无服务器部署 (as the exam edition ac215-l14-exam).
# The title agrees in substance with video.yaml's publish.title_zh ("AC215 第14讲跟练 · Serverless 部署：Cloud Run
# function、service 与 job，一步一步部署到云端"), in the series pattern of the other meta.yaml titles; the Bilibili upload
# itself uses publish.title_zh.
# SERIES RULE (A16): no title, chapter or description names the instructor.
