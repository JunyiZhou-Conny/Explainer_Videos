# Two or three sentences (rule H2), written register, consistent with video.yaml's publish.description_zh but
# without the course-credit line's names (A16). Facts: README @ 46cc62f (Before you begin, Parts 1-4, Clean up);
# script.md v2 (S01-S16); captures on a machine without a Google account, so the cloud successes are shown from the
# README's own recording and tagged; the local function stand-in and the docker checks tagged extra; billable Cloud
# Run resources, buckets and Gemini speech calls (GOLD tags, the clean-up checklist in S16); five pause-and-ponder
# cards and five test-yourself questions. Paste the chapter timestamps from output/chapters.txt under it when
# uploading.
description: |
  AC215（哈佛 MLOps & LLMOps）第 14 讲“无服务器部署：Cloud Functions 与 Cloud Run”的跟练视频，对照课件逐页讲解，并照着 dlops-io/serverless-deployment 的 README 从“开始之前”到收尾一步一步做：先把一个翻译处理函数部署成 Cloud Run 函数（main.py、requirements.txt 和入口点，看 Cloud Build 怎样把代码变成镜像，入口点填错时在日志里看到什么），用查询字符串调用它；再用一条 docker run 在本地跑起预构建的翻译网页，讲清 PORT、0.0.0.0 和 -p 8086:8080，把同一个镜像部署成 Cloud Run 服务，读懂最小 / 最大实例数、并发数、按请求计费、修订版本（revision）以及 tag 与 digest 的区别。
  下半场区分“谁能调用它”和“它以谁的身份运行”：挂上不需要密钥的运行时服务账号，打开 Gemini 语音合成，用应用默认凭据（ADC）和服务账号模拟（impersonation）在本地开发；再把同一个镜像跑成 Cloud Run 作业（job）：两个私有存储桶和按桶授权、Container command 加 11 个独立参数、执行后的 attempt 目录和作为回执的 manifest，最后用 gcloud 覆盖参数和 helper 脚本从终端提交任务，逐项清理所有计费资源，并用课上的四种部署方式和三个缺点（冷启动、控制和调试受限、厂商锁定）收尾。
  英文旁白，配中文和中英双语字幕；录制机器没有 Google 账号，所以云端操作的结果取自 README 自己的录制记录并标明出处；本讲会在你自己的项目里创建计费的云资源，视频用金色标签标出每个计费点，结尾有完整的收尾清单。
