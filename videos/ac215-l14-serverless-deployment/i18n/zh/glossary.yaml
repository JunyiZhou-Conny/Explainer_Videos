  note: 'A10: the honest framing, said plainly. So every gcloud box runs until its first honest error, the console is drawn, and cloud results come from the README''s own recording → 所以每个 gcloud 命令框都跑到它遇到的第一个真实报错为止，控制台是画出来的，云端的结果来自 README 自己的录制记录 (G1: a comma at every clause).'
