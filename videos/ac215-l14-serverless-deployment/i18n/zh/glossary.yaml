  note: 'A14: region → 区域 (L06, L13); Toronto → 多伦多 (the region id is on screen only); us-central1 stays. The speech model later uses us-central1, a separate setting for part 3 → 后面的语音模型用 us-central1，这是第 3 部分里一个单独的设置.'
- en: 'worksheet / the web service / two runtime accounts / two buckets you name'
