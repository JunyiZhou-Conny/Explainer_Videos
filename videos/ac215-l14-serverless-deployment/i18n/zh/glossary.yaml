  note: 'A14. Then the terminal setup, starting with gcloud auth login, a browser sign-in; an extra auth list shows no accounts yet → 然后是终端设置，先跑 gcloud auth login，这是浏览器登录；额外跑一下 auth list，现在还没有账号 (G3: one command per clause).'
