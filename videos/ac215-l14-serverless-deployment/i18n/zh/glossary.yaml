# Chinese (zh-CN) glossary and translation rules for ac215-l14-serverless-deployment (AC215 lecture 14, Serverless
# Deployment: Cloud Functions, Cloud Run; the FULL follow-along of dlops-io/serverless-deployment, README @ 46cc62f on
# main, the commit the course link serves on 2026-11-04 and the exam edition quotes, Before you begin, Parts 1-4 and
# Clean up; the course map's older pin 4eaf343 is context only, ASSETS.md "Which commit"), code-switching version,
# SUBTITLES ONLY. Audience: Chinese-speaking AC215 grad students who read technical English fluently; register of a
# Chinese MLOps TA running a lab section.
# Precedents and sources of the shared decisions: the series pilot videos/ac215-l01-vms-venvs/i18n/zh (repo, clone,
# commit, pin, lock 文件, 虚拟机 / VM, 计价器, 计费, 结算, 录制时); the container lectures ac215-l02-containers-1 to
# ac215-l04-flexible-workflow-ports (container, image, tag, digest, Dockerfile, port, localhost, 发布, 监听, 网络接口, 构建,
# 日志, 清理, 指纹); ac215-l03-mega-pipeline (服务账号, 密钥, 凭据, 应用默认凭据 + ADC, bucket / 存储桶, 前缀, 替身);
# ac215-l06-agents-1 (区域, 回执); ac215-l08-llm-finetuning (endpoint, 客户端, 运行时); ac215-l10-cloud-connect (IAM,
# 工牌, 访问令牌 / 令牌, 身份); ac215-l11-data-labeling-versioning (manifest, entrypoint, the erratum phrase 一个小疏漏,
# 授课老师, the file layout this one follows); ac215-l13-training-workflows (worker, pipeline, 训练任务, 模拟运行,
# Agent Platform as the console's new name for Vertex AI); and the sibling exam edition ac215-l14-exam (the serverless
# vocabulary: service, job, serverless, 函数, 入口点, 实例, 冷启动, 缩容到零, 按请求计费, 最小实例数, 调用方, 门, 工牌,
# 计价器, 厂商锁定). Every form they fixed is kept where it agrees with this video's captures; what is new here is the
# walk itself: the console's labels, revision, task, chip, attempt, impersonate, the container contract (PORT,
# 0.0.0.0, the two start-up slots), concurrency, quota project, the bucket wizard and the job's argument list.
# The BRIEF's glossary heads-up (BRIEF.md "Notes", Chinese glossary heads-up) proposed keeping function, entry point,
# instance, cold start, scale to zero, concurrency, min/max instances, request-based billing, execution, service
# account, runtime identity, role, prefix and query string in English as well. Series consistency wins where the
# exam edition or L1-L13 already decided a Chinese form (函数, 入口点, 实例, 冷启动, 缩容到零, 最小实例数, 按请求计费,
# 执行, 服务账号, 角色, 前缀 L3, 查询字符串 L4); the rest of the heads-up is followed (decisions in GLOSSARY.md).
# There is NO Chinese voice in this series (docs/AC215_SERIES.md rule 8): the Chinese lines are subtitles on the
# English timing (the bilingual band of output/<id>.zh-en.mp4, <id>.zh.srt, <id>.zh-en.srt / .ass). So no say:,
# no anchors, no readings, no durations: only display rules. But `python -m explainer.i18n check` still applies
# its voice hygiene to the displayed line when a sentence has no say: (brackets, maths symbols, letter_letter
# names, Latin words not listed here, a missing half-width space): rules A6, B3 and D3 are how the Chinese line
# stays clean without say:. This lecture's underscored names (hello_http, translation_demo, ENABLE_SPEECH,
# GOOGLE_CLOUD_PROJECT, GOOGLE_CLOUD_LOCATION, run_job.py) and Ctrl+C are written the way the narration says them.
# SERIES RULE: the instructor's name never appears in a subtitle, a title or the description (A16).
# Human-readable copy in Chinese: GLOSSARY.md (keep the two in sync; its term tables come from this file's data).
# terms[].zh_subtitle = the display form (Chinese subtitle line; titles use the written forms of A4);
# terms[].first_use = an example sentence for the translators, as SNN[k]：<one Chinese sentence for one English
# sentence of SAY block k of scene SNN, k from 0>; each one passes the checker; the narration files reuse them;
# terms[].note = usage (English → Chinese) and the rule tags.
# rules are tagged [A1]..[I3]: A terms, B typography, C numbers, D narration file, G subtitles, H titles and
# companions, I toolkit notes. (L1's E on-screen strings and F voice rules do not apply: nothing on screen is
# translated in this series, and there is no voice.)
# Read by: python -m explainer.i18n check (Latin words allowed in the Chinese line: every Latin word of
# zh_subtitle and first_use, plus allowed_spoken_latin, which lists the words as the checker's regex
# [A-Za-z][A-Za-z'.-]* cuts them: us-central1 is us-central, run-001 is run-, amd64 is amd, Ctrl-C stays whole,
# --no-invoker-iam-check is no-invoker-iam-check, main.py and manifest.json stay whole) and explainer/subtitles.py, for
# EVERY video (2-3 word English phrases of `en` are kept on one English line; 2-7 character Chinese headwords of
# zh_subtitle are registered in jieba, so zh_subtitle holds terms, not example phrases).
video: ac215-l14-serverless-deployment
lang: zh-CN (mainland Simplified Chinese)
audience: 'Chinese-speaking AC215 (MLOps & LLMOps) grad students who know Python and basic ML, read technical English fluently, did L1-L13 (a GCP project with billing, Docker images and containers, docker run -p and PORT, a service-account JSON key in secrets/, uv, last week''s Vertex AI training job), saw Lecture 14, and are new to Cloud Run functions (what the console wants, what Cloud Build makes of it, the entry point), the container contract on Cloud Run, min / max instances, concurrency and request-based billing, revisions, tag vs digest, the runtime service account vs public access, ADC with impersonation, Cloud Run jobs with a container command and separate arguments, and job outputs proven by a manifest; they follow along with their clone of serverless-deployment open, Docker running, gcloud installed and their own project selected, pausing to run every step (this lecture creates billable Cloud Run resources and buckets and calls a paid speech model). Register of a Chinese MLOps TA running a lab section.'
voice: none          # subtitles only (video.yaml: Chinese = i18n/zh/narration/*.yaml on the English timing)
policy: 'The Mandarin of a Chinese MLOps TA walking a lab section through the steps, code-switching only where such a speaker really does, written as subtitles under an English narration. The viewers already say 把 repo clone 下来, 起一个 container, 构建 image, 打 tag, 看 digest, 发布一个 port, 建一个 bucket, 建一个服务账号, 走 ADC, 调一个 endpoint, 报 403; this lecture adds 部署成一个 Cloud Run service, 跑一个 job, serverless 部署, 等 revision 就绪, 1 个 task, 按 Enter 生成一个 chip, 新的 attempt 目录, impersonate 运行时账号, 看 manifest. Every choice passes three tests: what is said in a real lab section; the standard, searchable Chinese name (Google Cloud''s Chinese docs and console: 函数, 入口点, 实例, 冷启动, 最小实例数, 最大实例数, 并发, 按请求计费, 区域, 服务账号, 角色, 主账号, 配额项目, 组织政策, 软删除, 禁止公开访问, 统一访问, 存储类别; the Chinese engineering literature: 处理函数, 装饰器, 查询字符串, 网络接口, 环境变量, 线程, 主进程, 模拟运行, 厂商锁定); and consistency with the series (L1-L13 and the exam edition: every form they fixed is kept). (1) Artifacts verbatim: what the viewer types or matches on screen (commands, flags, file and folder names, the service, job and account names, role and API names, the console''s labels and buttons, the app''s buttons, the demo strings, status codes, regions, README headings when named as headings) is copied letter for letter, never translated, inflected or quoted; the exceptions the checker forces (an underscore, + or brackets inside the artifact) are written the way the narration says them (A6) and the English line shows the literal (D4). Error messages the narration paraphrases are translated (A7); the terminal and the English line carry the literal. Nothing on screen is translated in this series: terminal output, code panels, README cards, the schematic console forms, the V1-V8 set pieces, tags, trackers, lecture tags, the argument chips and the pause-and-ponder cards stay English; only the narration is. (2) Lab-speech English, a closed list: from L1-L13 repo, clone, commit, pin, container, image, tag, digest, Dockerfile, port, localhost, bucket, endpoint, entrypoint, worker, pipeline, manifest, URL, API, ID, JSON, IAM, ADC; from the exam edition serverless, service, job; new here revision, task, chip, attempt, impersonate, master (gunicorn''s), helper, dry run. (3) Everything else in standard Chinese (A3, A13-A15). (4) The video''s pictures by meaning, one word each: 地图 (the lecture''s 2x2 map, its 格 cells), 门 (the -p door and the two identity doors), 管道 (the -p pipe), 计价器 (the meter), 工牌 (the runtime account''s badge), 回执 (the manifest as receipt), 空位 (a concurrency slot), 位置 (an argument or start-up slot), 传送带 (the argv conveyor, SHOW only). (5) Written register for titles, meta.yaml and companion docs: 仓库, 克隆, 容器, 镜像, 端口, 存储桶, 端点（endpoint）, 无服务器（serverless）, 服务（service）, 作业（job）, 修订版本（revision）, 任务（task）, 服务账号模拟（impersonation）, 清单文件（manifest）. (6) The bilingual band puts the English sentence under every Chinese line, so the Chinese line carries no glosses and no brackets at all (the checker forbids them without say:). (7) The toolkit''s constraints are part of the policy: one Chinese sentence per English sentence (159 blocks, 357 sentences), a checker-clean display line (D3), an en_display wherever the SAY spells an artifact out as words (D4), the English clause order kept (D9). Mainland Simplified Chinese; relaxed, clear lab-section speech, never slangy.'
rules:
- '[A1] Code-switching scope. English stays in three places only. (a) Artifacts, copied letter for letter: commands and subcommands as typed or named (git clone, git log, gcloud auth login, auth list, export, docker run, docker top, docker ps, curl, uv sync --frozen, uv tree, python, gcloud), flags the SAY names (--rm only on screen; --no-invoker-iam-check, --frozen, --wait, -m, --args only on screen), file and folder names (main.py, requirements.txt only on screen: the SAY says the requirements file → requirements 文件; Dockerfile, passage.txt, translated.txt, speech.wav, manifest.json, tutorial, function, app, secrets), service, job and account names (translate-function, translation-demo, translation-audio, translation-demo-runtime, translation-audio-job, and the display name Translation demo runtime), the image''s commands and module as the SAY says them (A6: translation demo serve, translation demo, batch, serve), the handler''s names (hello 下划线 http: A6; text, source, destination, translate), role names (Agent Platform User, Service Usage Consumer, Service Account User, Service Account Token Creator, Service Account Admin, Storage Object Viewer, Storage Object Creator; Token Creator as the SAY shortens it), API names (Agent Platform API, IAM Service Account Credentials API), environment variables (PORT; ENABLE SPEECH, GOOGLE CLOUD PROJECT, GOOGLE CLOUD LOCATION: A6), console labels and buttons the narration names (Cloud Run, Services, Jobs, Write a function, Create service, Create job, Allow public access, Create, Source editor, Function entry point, Save and redeploy, service details, Observability, Logs, Deploy container, Deploy one revision from an existing container image, Request-based billing, Revision History, API Library, Done, Security, View diff & redeploy, Serve this revision immediately, Deploy changes, Cloud Storage, Buckets, Confirm, Standard, Storage URI, Container command, Container arguments, Execute job immediately, Execute, History, Tasks, View logs, More detail), the app''s buttons (Translate, Play audio), the demo strings (good afternoon everyone, Bonjour à tous, Bienvenido a AC215), language codes (zh-cn, en, fr), regions (us-central1; Toronto is translated: 多伦多), the run prefixes (run-001, run-002: D4), status codes (200, 400, 403, 405, 500, 503), the printed status word complete and the helper''s printed downloaded results, versions (Python 3.12, 3.10), architectures (amd64: D4; Apple Silicon), ports and addresses (8080, 8086, 9090, 0.0.0.0, localhost 8086), the keys Enter and Ctrl-C (A6), and the on-screen tags when the narration names them (your turn; A11). (b) Products, organisations, the course and names: AC215, Google, Google Cloud, Cloud Run, Cloud Run functions, Cloud Functions, Functions Framework, Cloud Build, Artifact Registry, Cloud Storage, Storage (the SAY''s short form), Agent Platform, Vertex AI, Gemini, Flask, gunicorn, googletrans, Docker, Git, Python, uv, README, Cheese App, HTTP, CPU, MiB, VM. (c) A closed list of words Chinese engineers say in English in a lab section: from L1-L13 repo, clone, commit, pin, container, image, tag, digest, Dockerfile, port, localhost, bucket, endpoint, entrypoint (Docker''s ENTRYPOINT slot), worker, pipeline, manifest, URL, API, ID, JSON, IAM, ADC; from the exam edition serverless, service, job; new in L14 revision (the console''s word and tab; Chinese docs 修订版本 is stiff in speech), task (a job''s unit: 1 个 task, the Tasks tab; 任务 is L13''s training job), chip (the console''s input pill: 生成一个 chip, 11 个 chip), attempt (attempt 目录, as the tracker says Attempt folder), impersonate (模拟 is taken by emulation, L13), master (gunicorn''s master process, beside worker), helper (helper 脚本), dry run. A word joins (c) only if lab speech really uses the English and the Chinese is stiff, ambiguous or collides with another term. Never English for flavour: function, entry point, instance, cold start, scale to zero, concurrency, minimum / maximum instances, request-based billing, execution, service account, role, prefix, query string, handler, decorator, interface, thread, timeout, retry, soft delete, quota project, principal, receipt, rollout and everything in A3 and A13-A15 are Chinese.'
- '[A2] container, image and the laptop, as L2-L13. The subtitles say container and image (起一个 container, 同一个 image, 教程的公开 image, 共享的公开 image), measure word 个; titles, chapter names, meta.yaml and companion docs write 容器 and 镜像 (A4). containerized → 容器化的 (a containerized web app → 一个容器化的 web 应用: the adjective is the standard term, container stays the noun). build → 构建 (at build time → 构建时; every deploy runs a build → 每次部署都会跑一次构建; build page → 构建页面; build logs → 构建日志; nothing was built → 什么都没构建); publish an image → 发布 image (L2); digest stays (L2: same bytes, same digest → 同样的字节，同样的 digest; deploy by digest → 按 digest 部署); tag stays (the console took a tag, a movable label → 控制台拿到的是一个 tag，一个可以移动的标签); fingerprint → 指纹 (L2); built for amd64 → 为 amd64 构建; under emulation → 模拟运行 (L13); publish port 8086 to 8080 → 把 port 8086 发布到 8080 (L4: 发布); remove when done → 用完就删; listen → 监听 (L4); every network interface → 所有网络接口 (L4); connections from outside the container → container 外面来的连接; the door → 门 (L4, L10: 这扇门, 8086 在外面，8080 在里面); the pipe → 管道 (the SAY''s word for the -p mapping in S07: keep the pipe at 8080 → 管道还接在 8080; pipe to 9090 → 管道接到 9090); refused → 被拒绝; the connection resets → 连接被重置; your laptop → 你的笔记本 (never 电脑 alone for the laptop of the running example); a classmate → 同学, their laptop → 同学的笔记本; the main process → 主进程 (gunicorn is the main process); a master and a worker → 一个 master 和一个 worker (gunicorn''s own words, A1 c); 1 worker, 4 threads → 1 个 worker，4 个线程; shuts down cleanly → 干净地退出.'
- '[A3] The serverless vocabulary, as the exam edition. serverless stays (A1 c; the promise of serverless → serverless 的承诺; The lecture''s serverless → 课上讲的 serverless; written 无服务器（serverless）, A4); service stays for the Cloud Run resource (a web service → web service; the function bills as a Cloud Run service → 按 Cloud Run service 计费; the service runs in Toronto → 这个 service 跑在多伦多; written 服务（service））; job stays for the Cloud Run resource (as a service or a job → 作为 service 或者 job; That is a job. → 这就是 job。; written 作业（job））; function → 函数 (the product, the Python function and the HTTP function alike: Part 1: a function. → 第 1 部分：一个函数。; an HTTP function called … → 一个叫……的 HTTP 函数; the Python function the framework should call → 框架应该调用的那个 Python 函数); the product names stay (Cloud Run functions, Cloud Functions, Functions Framework); entry point → 入口点 (the console field Function entry point stays; ≠ Docker''s entrypoint, A7); instance → 实例 (in each instance → 在每个实例里; an instance of your app → 你应用的一个实例; keeps an instance warm → 让一个实例一直热着); cold start → 冷启动; scales by itself → 会自动扩缩; scaling → 扩缩; scales to zero → 缩容到零; minimum 0 instances and maximum 2 → 最小实例数 0，最大实例数 2 (a minimum of 1 → 最小实例数设成 1; a higher minimum → 调高最小实例数; Raise the maximum → 调高最大实例数; the ceiling → 上限; what does a minimum instance buy → 最小实例能买到什么); concurrency → 并发数 (Concurrency 4 → 并发数 4; 4 concurrent requests per instance → 每个实例 4 个并发请求; raise concurrency together with the threads → 把并发数和线程数一起调高); a slot (concurrency) → 空位 (8 slots → 8 个空位; wait for a free slot → 等一个空位); request → 请求 (a request arrives → 请求来了; served → 处理); traffic → 流量; request-based billing → 按请求计费 (the console option Request-based billing stays when the narration selects it: 选 Allow public access 和 Request-based billing); instance-based billing → 按实例计费; billed → 计费; bills idle time → 空闲时间也计费; the meter → 计价器 (L1; the meter moves → 计价器在走); pay only when your code runs → 只在代码运行时付钱; for money → 但要花钱; billable → 要计费; a paid model call → 一次付费的模型调用; paid work → 付费的工作; rent a virtual machine → 租一台虚拟机 (L1); a rented machine → 租来的机器; billed all night → 整晚都在计费; no servers to set up → 不用搭服务器; costly hardware → 昂贵的硬件; finite work → 有限的工作; exits → 退出; execution → 执行 (open the execution → 打开这次执行; each execution → 每次执行; a successful Spanish execution → 一次成功的西班牙语执行); Execute (the console button) stays; the timeout fails it → 超时把它判为失败; the vendor lock-in downside → 厂商锁定; the lecture''s three downsides → 课上说的三个缺点: 冷启动、控制和调试受限、厂商锁定.'
- '[A4] Written vs spoken pairs. Subtitles say repo / clone / container / image / port / bucket / endpoint / serverless / service / job / revision / task / chip / impersonate / manifest; titles, chapter names, meta.yaml and the companion docs write 仓库 / 克隆 / 容器 / 镜像 / 端口 / 存储桶 / 端点（endpoint）/ 无服务器（serverless）/ 服务（service）/ 作业（job，Google Cloud 中文文档的 Cloud Run 作业）/ 修订版本（revision）/ 任务（task）/ 服务账号模拟（impersonation）/ 清单文件（manifest）, with the English in brackets at the first use of a core concept (brackets are fine outside the narration). 函数, 入口点, 实例, 冷启动, 服务账号, 应用默认凭据, 计价器 and 回执 are the same in both. Serverless Deployment → 无服务器部署; follow-along → 跟练. Commands, code names and console labels are unaffected.'
- '[A5] Writing artifacts. Copied verbatim (case, dots, slashes, hyphens, colons unchanged); never translated, inflected, quoted, put in 《》 or code formatting. Add a Chinese head noun where it helps: translate-function 这个 service, translation-demo 这个 service, translation-audio 这个 job, main.py 第 12 行, requirements 文件, tutorial 下的 app 目录, secrets 目录, results 目录, run-001 目录, Security 标签页, Tasks 标签页, Revision History 页面, Play audio 按钮, Agent Platform User 这个角色, --wait 参数, PORT 变量, gcloud 命令框, helper 脚本. Never start a sentence with a lower-case artifact or kept-English word (serverless, service, job, revision, task, chip, attempt, impersonate, repo, container, image, tag, digest, port, bucket, endpoint, entrypoint, manifest, export, curl, gunicorn, googletrans, gcloud, uv, docker ps, main.py, serve, batch, translate-function, translation-demo, us-central1, run-001, -m, --wait): put a Chinese word first (这个 job……; 一个 revision……; 命令 docker ps……; 然后 gunicorn……; 新版的 googletrans……; 这个 --wait 参数……; 把两个 bucket 名字 export 出来……; 这个 run-001……). A capitalized name, product, console label or code word may open a sentence (Cloud Run, Cloud Build, Docker, Google, Python, README, Service Usage Consumer, Container command, Execute job immediately, ENABLE SPEECH, PORT, ADC), and so may a number that opens the English sentence (Two instances → 两个实例: C1). When the SAY shortens a command the screen shows in full, write it as the SAY does (docker run, remove when done, publish port 8086 to 8080 → docker run，用完就删，把 port 8086 发布到 8080).'
- '[A6] Artifacts the checker rejects. With no say:, the checker reads the display line as speech and rejects letter_letter names, = < > + and brackets of any kind. So these are never copied into the Chinese line; they are written the way the narration says them, and the English line shows the literal through en_display (D4). Table: hello_http → hello 下划线 http (as the exam edition: the SAY spells the underscore out because the exact name is the point; lower case as on screen; target hello underscore HTTP → target 设成 hello 下划线 http); translation_demo serve → translation demo serve; the module translation_demo → translation demo (the argument chips -m, translation_demo, batch → -m、translation demo、batch); ENABLE_SPEECH / GOOGLE_CLOUD_PROJECT / GOOGLE_CLOUD_LOCATION → ENABLE SPEECH / GOOGLE CLOUD PROJECT / GOOGLE CLOUD LOCATION (capitals as on screen); Ctrl+C → Ctrl-C (L9''s form); run_job.py is never named by the SAY (the helper → helper 脚本). Kept literally because the checker accepts them: %20, zh-cn, run-001 / run-002, amd64, --no-invoker-iam-check, uv sync --frozen, translated.txt, speech.wav, manifest.json, passage.txt, gs:// prefixes (the SAY never reads one aloud), 0.0.0.0. YOUR_PROJECT_ID, YOUR_INPUT_BUCKET and the other README placeholders are never written (the SAY says the placeholder → 占位符; your project ID → 你的项目 ID). When the toolkit lets display lines keep these characters (I1), the literals may replace the spoken forms.'
- '[A7] Words to keep apart. service (the Cloud Run resource) ≠ 服务账号 (service account) ≠ 外部服务 (an outside service: the translation provider, S02 and S06) ≠ service 名称 (the service name) ≠ service details (the console page, verbatim). serve (the app''s command, S07 and S12) ≠ 处理 (requests are served → 请求被处理; more than it can serve → 超过它能处理的). function → 函数 ≠ function 目录 (the folder tutorial/function, S03) ≠ Functions Framework (the product). entry point → 入口点 (the function''s, S04-S05) ≠ entrypoint (Docker''s ENTRYPOINT slot, S07 and S13, kept English) ≠ Container command (the console field, which fills the entrypoint slot). command → 命令 (Docker''s CMD slot: a command, translation demo serve → 一个命令，translation demo serve; the command slot → 命令那个位置; the default command → 默认命令; the command left alone → 命令不动) ≠ gcloud 命令 (a gcloud command) ≠ 命令框 (a README command box). slot → 位置 (two start-up slots → 两个启动位置; the second slot → 第二个位置) ≠ 空位 (a concurrency slot, A3). job ≠ 训练任务 (L13''s Vertex AI training job, S02 and S12) ≠ task (one unit of a job) ≠ 作业 (written register only). 执行 (an execution, to execute) ≠ 运行 (runs) ≠ 跑 (lab speech for run). revision ≠ 版本 (a deployed version → 部署出去的一个版本; Python 3.12 → Python 3.12 这个版本) ≠ 旧版 README (the older README at 4eaf343). 发布 (publish an image, publish a port) ≠ 部署 (deploy) ≠ 上线 (the rollout: wait for the rollout → 等它上线). override → 覆盖参数 (execute with overrides → 带覆盖参数执行; the overrides replace the whole argument list → 覆盖参数会替换整个参数列表) ≠ overwrite → 覆盖 with an object (cannot overwrite them → 不能覆盖它们; Is the first result overwritten? → 第一次的结果会被覆盖吗？). flag: a command-line flag → 参数 (the wait flag → --wait 参数; a flag you leave out → 你漏掉的参数) ≠ the speech flag ENABLE SPEECH → 开关 (the app checks the flag → 应用会检查开关; without the speech flag → 不开语音开关). label: a movable label (what a tag is) → 标签 ≠ the on-screen tags (金色标签, your turn 标签) — both 标签, the context tells them apart. 门 (the -p door, S07; the two identity doors, S09) ≠ 管道 (the -p pipe, S07). key → 密钥 (a JSON key, no key file) ≠ the key Enter (按 Enter) ≠ private key → 私钥. 区域 (a Google Cloud region) ≠ 语言 (source and destination are languages, not regions → source 和 destination 是语言，不是区域). 仓库 (an Artifact Registry repository the gcloud deploy may create, S06) ≠ repo (the git repository you clone). 目录 (a real folder) ≠ 前缀 (run-001 is a prefix you chose, not a real directory → 你自己选的前缀，不是真的目录). 日志 (logs) ≠ Logs (the console page, verbatim). 回执 (the manifest as receipt) ≠ 摘要 (the job''s JSON summary).'
- '[A8] The Part 1 and Part 2 mechanics (new in this lecture). handler → 处理函数 (the tutorial''s handler → 教程的处理函数; HTTP handler → HTTP 处理函数: exam); decorator → 装饰器 (marks … → 把它标成……); request → 请求 (from the request → 从请求里); default → 默认值 (each with a default → 每个都有默认值; its default steps aside → 它的默认值就让开了; the default in Spanish → 默认是西班牙语); by position / by name → 按位置 / 按名字 (passes source second, by position → 按位置把 source 放在第二个); would swap → 会对调; library → 库 (L8); asynchronous → 异步; the framework → 框架 (the Functions Framework by name stays); three inputs → 三样输入; dependencies → 依赖; the requirements → 依赖 (the requirements file → requirements 文件: exam); installs … once → 装一次; configures → 配置; looks up your function by the entry point name → 按入口点的名字找到你的函数; a small Flask app → 一个小的 Flask 应用; the port Cloud Run provides → Cloud Run 给的 port; This layer → 这一层; prints nothing while it serves → 运行期间什么都不打印; That silence is normal → 这种安静是正常的; logs only errors → 只记录错误; query string → 查询字符串 (L4: append → 加上); the question mark → 问号 (no ASCII ? inside a Chinese sentence); ampersands → & 符号; split the pairs → 分隔每一对; an encoded space → 编码后的空格; Each pair fills one line of the handler → 每一对填进处理函数的一行; the provider timed out → 服务方超时了; client → 客户端 (L8); server log → 服务器日志; raised from line 12 of main.py → 从 main.py 第 12 行抛出; A retry → 一次重试; unofficial → 非官方的; wraps → 包装; a finished build → 构建成功; the placeholder → 占位符; the project ID check → 项目 ID 检查; a real-format ID → 格式正确的 ID; sign in → 登录; More detail box → More detail 框 (README''s collapsible, verbatim); not necessarily a new machine → 不一定是一台新机器; No fixed idle time predicts it → 没有哪个固定的空闲时长能预测它. Part 2: the two start-up slots (A7); Docker runs the entrypoint, then the command → Docker 先运行 entrypoint，再运行命令; arguments you pass replace the command → 你传的参数会替换命令; takes its port from the PORT variable → 从 PORT 变量里取 port; replaces itself with gunicorn → 把自己替换成 gunicorn; How did Python turn into gunicorn? → Python 是怎么变成 gunicorn 的？; no Python is left → 一个 Python 进程都不剩; sends JSON in a post request → 用一个 POST 请求发送 JSON; JSON posts → JSON 的 POST 请求; decodes that escape → 把那个转义解码; method not allowed → 方法不允许 (A13); A made-up language → 一种编造的语言; Play audio is disabled → Play audio 是禁用的; set PORT to 9090 → 把 PORT 设成 9090; The right-hand number must be where the app listens → 右边那个数字必须是应用监听的地方; Cloud Run sets PORT and knocks on it → Cloud Run 会设置 PORT，再去敲这扇门; 512 mebibytes → 512 MiB; 1 CPU → 1 个 CPU; a 120 second timeout → 120 秒的超时.'
- '[A9] Register: a TA running a lab section. Short instructions, colloquial verbs (装, 跑, 删, 敲, 改, 贴, 填, 点, 选, 勾, 拉, 存, 传, 拷, 收拾); address the viewer as 你 (one-to-one follow-along; never 您, 大家, 同学们); 我们 is us at recording time (we deploy → 我们部署; our stand-in → 我们的替身; While we recorded → 我们录制时). Chinese word order inside a clause; restructure freely inside a sentence, but keep the English order of clauses (D9). No translationese: no 让我们… (use 我们来… / 先…), no 这就是为什么… (use 所以… / 也正因为这样…), few 被 passives, no chains of 一个…的. No internet slang. Carry the spoken rhythm by meaning: First, where this lecture sits → 先看这一讲的位置; And notice what we deploy → 再注意我们部署的是什么; Two small notes → 两个小提示; About this recording → 关于这次录制; What runs your function? → 是什么在运行你的函数？; Google builds a container anyway → Google 照样会构建一个 container; Extra checks agree → 额外检查也对得上; One extra experiment → 再做一个额外实验; Why 4? → 为什么是 4？; Who is it? → 那是谁？; So, a quick test → 那么，快速测一下; Here is the speech path → 来看语音这条链路; Now the other mistake → 再看另一种错误; The order matters → 顺序很重要; Console only so far? → 到现在只用了控制台？; Stuck on a step? → 卡在哪一步了？; Here is the whole map → 来看整张地图; Three additions → 补充三点; First half done → 上半场完成.'
- '[A10] Precision. Translate hedges and quantifiers exactly: only 只, every 每个 / 每次, each 每个 / 每一, all 全部 / 全, at once 同时, normally 一般, may 可能, for a while 一段时间, once 一次 / 一旦, exactly as 完全照着, never 从不 / 永远不会, not necessarily 不一定, still 还 / 仍然, too 也, separate 单独的 / 两回事, again 又 / 再. at the time of recording is always 录制时 and never dropped (no tool version is spoken in this script; the tags stay on screen); the recording / the README''s recording → 录制记录 / README 的录制记录 (the README''s own GIFs and recorded panels); While we recorded → 我们录制时; our captured 503 → 我们录到的 503. Counts, ports, status codes, line numbers, sizes and times match the screen exactly (C1). Ours vs yours is kept (yours will differ → 你的会不一样). Errata and slide-versus-capture differences are gentle and brief, as the SAY says them, with one phrase for every erratum, as L5, L9-L13: A small gap → 有一个小疏漏 (S10: the README promises Service Account User in section 3.3, which grants Token Creator); the kind notes of S02 (the course page links to sections the rewritten README no longer has; the course map''s older commit), S04 (Cloud Functions are now Cloud Run functions; the older README said 3.10; the lecture''s sketch passes source by position) and S09 (Agent Platform is the console''s current name for Vertex AI) are said as plainly as the English, never as a correction of anyone. The honest framing of S03[7] (this machine has no Google account and no project; every gcloud box runs until its first honest error; the console is drawn; cloud results come from the README''s own recording) is said as plainly as the English, never apologetic and never hidden. Ponder questions (S05[6], S08[6], S09[2], S13[9], S14[6]) ask without answering, and the wording must not give the answer away: S05[6] must not say logs, revision start or that the build succeeds; S08[6] must not say 8, wait or refused; S09[2] must not say no, other door or identity; S13[9] must not say -m, entrypoint or not found; S14[6] must not say attempt, new folder or no. The reveal answers with the question''s own verb (Does the build fail? … Installing the requirements works → 装依赖没问题; Does that let it call Agent Platform? No. → 不能。; Is the first result overwritten? No. → 不会。).'
- '[A11] The screen stays English. This series translates the narration only: terminal output and prompts, terminal titles, code panels (comments included), README cards and RECORDED panels, the trackers (README › 1.2 Supply the code, step k of N), the lecture tags (Lecture 14 · slides a–b), tags (your turn, extra, extra · local stand-in, extra · Docker''s analogue, illustration, recorded · <source>, erratum, at the time of recording, the GOLD cost tags, chips like needs your project · no output shown, yours will differ, same terminal as your exports), the schematic console forms, the V1-V8 set pieces (the 2x2 map, the instance strip, the build line, the query-to-arguments drawing, the port envelope, the identity doors, the lifecycle strips, the attempt folders), the argument chips and the pause-and-ponder and test-yourself cards are all English, and the scenes need no language changes. When the narration names an on-screen tag or label, the subtitle names it as the screen shows it or by its colour: a yellow tag, your turn → 黄色的 your turn 标签; a gold tag → 金色标签; a green check → 绿勾; a red mark → 红色标记. Everything the narration says in its own words is translated: the tracker → 进度条, an extra → 额外 (an extra listing → 额外列一下目录; extra checks → 额外检查; Our extra laptop run → 我们在笔记本上额外跑的一次; our git clone is extra → 我们的 git clone 是额外的), the map → 地图, stand-in (in prose) → 替身 (as an extra local stand-in → 作为额外的本地替身; Our local stand-in → 我们的本地替身), the gcloud boxes → gcloud 命令框, the gcloud alternative → gcloud 替代做法 (never opening a sentence: The gcloud alternative … → 用 gcloud 的替代做法，……), Docker''s version → Docker 版本的实验 (the extra · Docker''s analogue panel).'
- '[A12] Mainland Simplified Chinese only: 默认, 程序, 代码, 文件, 目录, 服务器, 网络, 接口, 脚本, 视频, 用户, 信息, 配置, 凭据, 进程, 线程, 对象, 账号, 密钥, 令牌, 函数, 参数, 变量, 内存, 日志, 部署, 实例, 浏览器, 网页, 软删除, 存储; never 預設, 程式, 程式碼, 檔案, 資料夾, 伺服器, 網路, 介面, 腳本, 影片, 使用者, 訊息, 組態, 憑證, 行程, 執行緒, 物件, 帳號, 金鑰, 權杖, 函式, 引數, 變數, 記憶體, 日誌, 實例, 瀏覽器.'
- '[A13] Errors, status codes and terminal words. The series keeps short terminal text verbatim and translates what the SAY paraphrases (L11 A7); the terminal and the English line carry the literal. Table (SAY → Chinese): main.py should contain a function named translate, but it found hello underscore HTTP → main.py 里应该有一个叫 translate 的函数，但它找到的是 hello 下划线 http (MissingTargetException stays on screen); method not allowed → 方法不允许 (405); speech is disabled → 语音已关闭 (503); Google credentials are unavailable → Google 凭据不可用 (503); executable not found → 找不到可执行文件; the connection resets → 连接被重置; the URL answers 403 → 这个 URL 返回 403; the client got status 500 → 客户端收到状态码 500; with status 200 → 状态码 200; exits with status 1 → 以退出码 1 退出; exited with 0 → 以 0 退出 (exit status → 退出码, exam); A missing identity or a denied call each has its own message → 缺身份，或者调用被拒，各有各的报错信息; the message → 报错信息; an honest failure → 一次如实的失败; its first honest error → 它遇到的第一个真实报错. Kept as printed: status codes as digits (200, 400, 403, 405, 500, 503), the status word complete (状态 complete; the manifest, saying complete → 写着 complete 的 manifest), the helper''s printed line downloaded results, the job''s exit code numbers.'
- '[A14] Identity, IAM and the cloud words (new and from L3, L10, L13). Two questions, two doors: who may call our public app → 谁可以调用我们的公开应用; what the running app may access → 运行中的应用可以访问什么; the first door / the other door → 第一扇门 / 另一扇门; admits callers → 只放调用方进来; Calling out → 往外调用; as whatever identity the service runs as → 以这个 service 运行时的身份; runs as → 以……的身份运行; who it runs as → 它以谁的身份运行; attach (an account) → 挂上 (Attaching the account → 挂上这个账号; until you attach one → 在你挂上一个之前); the project''s default compute account → 项目的默认计算账号; public access → 公开访问 (the console option Allow public access stays); invoker → 调用方 (gcloud spells it no invoker IAM check → gcloud 里写成 --no-invoker-iam-check: D4); an organization policy → 组织政策; forbids → 禁止; service account → 服务账号 (L3); runtime account / runtime service account → 运行时账号 / 运行时服务账号; the job''s account / the web account → job 的账号 / web service 的账号; the account''s email → 账号的邮箱; badge → 工牌 (L10, exam: on Cloud Run, the badge supplies it → 在 Cloud Run 上，由工牌提供); role → 角色 (project roles → 项目级角色; both bindings are on the whole project → 两条绑定都在整个项目上; per bucket → 按 bucket); grant → 授予 / 授权 (both grants → 两条授权; all four grants → 全部四条授权); permission → 权限; a permission of yours → 你自己的一项权限; your deployment right → 你的部署权限 (exam); rights → 权限 (separate rights to upload, execute and see results → 上传、执行和查看结果各要单独的权限); quota project → 配额项目 (charge calls to a quota project → 把调用记到一个配额项目上; the project whose quota and bill they count against → 也就是这些调用占用哪个项目的配额、记到哪个项目的账单上); principal fields → 主账号字段 (Google Cloud''s Chinese console: 主账号); preselected role → 预选的角色; Project owners → 项目所有者; a restricted project → 受限的项目; course staff → 课程组; key → 密钥 (L1, L3: no key to create or download → 不用创建也不用下载密钥; no key file → 不需要密钥文件; a JSON key sat in a secrets folder → 一个 JSON 密钥放在 secrets 目录里); private key → 私钥; token → 令牌 (L10, L11: asks Google''s auth library for a token → 向 Google 的身份验证库要一个令牌; short-lived tokens → 短期令牌; the exam edition''s one English token is not followed: this video has three token sentences and L10''s 令牌 is the series form); auth library → 身份验证库; Application Default Credentials → 应用默认凭据 (L3; That lookup is … → 这个查找过程就是应用默认凭据); ADC stays (a Cloud Run token or a laptop file → Cloud Run 上的令牌，或者笔记本上的文件); impersonate stays (your laptop impersonates it → 你的笔记本会 impersonate 它; impersonating the runtime account → impersonate 运行时账号); sign in as yourself → 以你自己的身份登录; an application default login → 一次 application-default login (the gcloud subcommand, on screen); gcloud auth login → gcloud auth login (a browser sign-in → 浏览器登录; It logs in the gcloud tool, not the app → 它登录的是 gcloud 命令行工具，不是应用); the sign-in → 登录 (the missing sign-in → 缺了登录; with your sign-in → 有了你的登录); never in Git or the image → 永远不进 Git，也不进 image; the gcloud tool → gcloud 命令行工具 (L1); the console → 控制台; enable the APIs → 启用 API; a region → 区域 (L06, L13; Toronto → 多伦多; us-central1 stays); a separate setting / two different settings → 一个单独的设置 / 两个不同的设置; project ID → 项目 ID; display name → 显示名称; billing → 结算 (a project with billing → 开通了结算的项目; billing is on → 结算已开通); bill → 账单; Cloud Storage → Cloud Storage, Storage (the SAY''s short form) stays; a globally unique name → 全局唯一的名字 (L3); class Standard → 存储类别选 Standard; public access prevention → 禁止公开访问; uniform access → 统一访问; default soft delete → 软删除保持默认; soft delete → 软删除 (Soft-deleted files → 软删除的文件); a private bucket → 一个私有 bucket; input bucket / output bucket → 输入 bucket / 输出 bucket; the sample passage → 示例段落; copy its Storage URI → 复制它的 Storage URI; prefix → 前缀 (L3); object → 对象; source archives → 源代码归档.'
- '[A15] The job words (new in this lecture). A job has no URL → 一个 job 没有 URL; its disk vanishes when it exits → 它的磁盘在退出时就没了; input comes from Storage and results go back there → 输入从 Storage 来，结果也回到那里; a remote container cannot see a file on your laptop → 远程的 container 看不到你笔记本上的文件; a translated audio edition → 一份翻译后的有声版本; take its input, translate it, speak it, save the files and exit → 拿到输入、翻译、朗读、保存文件，然后退出; two programs → 两个程序; serve keeps listening, with no end → serve 一直监听，没有尽头; batch walks four steps and exits → batch 走完四步就退出; this shape → 这种形状 (exam); task stays (1 task → 1 个 task; the task finished → task 完成了; Tasks, View logs → Tasks 里的 View logs); task timeout → task 超时 (the exam edition''s 任务超时 is the same field: here task stays English because the video also counts tasks and opens the Tasks tab, and 任务 is L13''s training job); 0 retries → 0 次重试; a retry repeats paid work → 一次重试会重复付费的工作; chip stays (Enter to make a chip → 按 Enter 生成一个 chip; each its own chip → 每个值一个 chip; Paste all eleven into one chip → 把 11 个值全贴进一个 chip; eleven argument chips → 11 个参数 chip; Each chip is one item of the argument list → 每个 chip 就是参数列表里的一项); the argument list → 参数列表; values → 值; arguments → 参数; Container command fills the entrypoint slot, which this image left empty → 它填的是 entrypoint 那个位置，这个 image 把它留空了; together they take the command slot''s place → 合在一起占掉命令那个位置; input URI and your passage → input URI 和你的段落; source en, destination fr → source en，destination fr; output URI and your prefix → output URI 和你的前缀; looks for a module with that whole sentence as its name → 去找一个以这一整句为名字的模块; The name is cut at the first dot → 名字在第一个点那里被截断; dash m becomes the program → -m 就成了要运行的程序; comma separated → 用逗号隔开; with command python → 命令用 python; a green check in History → History 里的一个绿勾; a red mark → 红色标记; History tells the truth → History 说的是真话; a JSON summary → 一段 JSON 摘要; the output and manifest locations → 输出和 manifest 的位置; a folder with a random name → 一个名字随机的目录; attempt stays (A new attempt folder lands beside the first → 一个新的 attempt 目录出现在第一个旁边); create-only → 只创建、不覆盖 (create-only uploads → 只创建的上传); written last → 最后才写; the receipt → 回执 (L06; It is the receipt. → 它就是回执。; the receipt again → 又是回执); Files without a manifest prove nothing → 没有 manifest 的文件什么都证明不了; not exactly once → 不是恰好一次; download with the icons → 用下载图标下载; executes with wait → 带 --wait 执行; a results folder → 一个 results 目录; copies the output down → 把输出拷下来; stream your app''s logs → 实时显示你应用的日志; overrides → 覆盖参数 (A7); for this execution only → 只对这次执行有效; a new path and Spanish → 一个新路径，再加上西班牙语; The saved job still says French → 保存的 job 里还是法语; is not taken from it → 不会从它那里补上; the helper → helper 脚本 (combines all three → 把这三步合在一起; its plan → 它的计划); dry run stays (An extra dry run → 额外跑一次 dry run); a fresh run folder named by the time and a random part → 一个新的 run 目录，用时间加一段随机字符命名; Run for real → 真跑的时候; stops at the first failure → 遇到第一个失败就停.'
- '[A16] The lecture, the course and the slides. Course: AC215; lecture n → 第 n 讲 (Lecture 1 → 第 1 讲; in lecture 3 → 第 3 讲里; Lectures 1 and 2 → 第 1 讲和第 2 讲); the lecture → 课上 (The lecture calls it → 课上说它是; the lecture''s promise → 课上的承诺; the lecture''s map → 课上的地图; the lecture''s three downsides → 课上说的三个缺点; the lecture''s file cell → 课上那个代码文件的格子); the slide / the slides → 课件 (the slide''s step → 课件上那一步; the lecture''s sketch → 课件上的示意代码); earlier lectures → 前几讲; last week → 上周; next week / Next lecture → 下周 / 下一讲; the course project → 课程项目; the prototype phase → 原型阶段; milestone 3 → 里程碑 3; the Cheese App → Cheese App (its backend → 后端); the course page → 课程页面; the course link → 课程链接; the course map → 课程地图 (the MLOps_Learning map, written without its underscore); course staff → 课程组; the worksheet → 工作表 (the README''s table of names); the README''s checkpoint → README 的检查点; the README''s four parts → README 的四个部分; Part n → 第 n 部分 (the README''s parts, digits as its headings); Section 3.3 → 3.3 节; Step n → 第 n 步; the study guide → 学习指南. SERIES RULE: the instructor''s name never appears in a subtitle, a title, a chapter name or the description; this SAY never mentions the instructor (it says the README''s recording, the course''s recording); if a later edit does, the instructor → 授课老师, and the masked ‹instructor› of the screen is never written.'
- '[A17] The series list (the ac215-video skill''s list) in this video: container and image throughout; Dockerfile (S03 only); port (S05, S07, S08, S11); bucket (S01, S03, S10, S12-S16); endpoint (S02, S06, S16); repo (S03, S11, S15); entrypoint (S07, S13); pipeline (S02, S16); commit (S02, S03); pin (S04, S05); tag and digest (S07, S08); manifest (S14-S16); worker (S07). volume, venv, PATH, prompt, embedding, agent, LoRA, push and CI are not in this script (Agent Platform is a product name; uv is the tool; the lock file → lock 文件, L1).'
- '[B1] Spacing. One half-width space between Chinese and Latin letters, digits or artifacts (第 1 讲, 第 4 步, 3.3 节, port 8080, 状态码 200, 返回 403, 4 个线程, 512 MiB, 120 秒, 5 分钟, 41 个包, 11 个 chip, 第 12 行, 跑 uv sync --frozen, 打开 Source editor). The checker reports a missing space on every displayed sentence. Spaces inside an artifact stay as they are (Cloud Run, Allow public access, Service Usage Consumer, uv sync --frozen); never add one inside an artifact. No space next to full-width punctuation (……Bonjour à tous。, 返回 503：). Never fake a no-break space with U+00A0 / U+202F.'
- '[B2] Punctuation. Full-width ，。、；：？！“”…… in Chinese text, also next to artifacts. Lists use 、 (Cloud Run、Services、Write a function; 冷启动、控制和调试受限、厂商锁定; -m、translation demo、batch). The console paths the SAY reads with commas are joined with 、 or 里的 / 下的 (Cloud Run, Jobs, Deploy container → Cloud Run 里 Jobs 下的 Deploy container; Observability, Logs → Observability 下的 Logs). No brackets of any kind, neither （） nor () nor 《》 nor 【】 nor [] nor <>: the checker rejects them on a line with no say:, and the bilingual band needs no gloss. “” only for a translated quotation; artifacts, labels and tag names are never quoted. No 。？！ inside one Chinese sentence (one per English sentence): use ，；： instead; an ASCII ? or ! never appears in a Chinese line (the query string''s question mark → 问号). Questions keep ？. The ordinals of the test-yourself questions take a full-width colon (第一题：……).'
- '[B3] Symbols the checker rejects (= < > + → ← ^ ≤ ≥ × ÷ ≈, == != +=, a digit followed by !, brackets, letter_letter): never in the Chinese line; written in words (A6). 2x2 → 四格; plus → 加 (your project ID plus translation input → 你的项目 ID 加上 translation input; its running time plus one speech call → 运行时间再加一次语音调用); Ctrl+C → Ctrl-C. Allowed and kept as on screen: . in file names, versions and addresses (main.py, manifest.json, 3.12, 0.0.0.0), - in names and flags (translate-function, us-central1, zh-cn, run-001, --no-invoker-iam-check, --frozen, --wait, -m), % in %20, & in View diff & redeploy and the & 符号 of the query string, / in gs:// (on screen only), à in Bonjour à tous.'
- '[C1] Numbers in display text. Arabic digits for everything that echoes the screen, the terminal, the code, the README or the slides: ports (8080, 8086, 9090), addresses (0.0.0.0, localhost 8086), status codes (200, 400, 403, 405, 500, 503), exit codes (1, 0), line numbers (第 12 行), sizes and resources (512 MiB, 1 个 CPU), times (120 秒, 5 分钟), counts the screen shows (1 个 worker, 4 个线程, 4 个并发请求, 最小实例数 0, 最大实例数 2, 8 个空位, 41 个包, 1 个 task, 0 次重试, 11 个值 / 11 个 chip / 11 个参数: the screen shows eleven chips and the gcloud box eleven values, so eleven is written 11 throughout, also in S16''s fourth question), the 5,000-character limit (5000 个字符), the README''s Parts, Sections and Steps (第 1 部分, 4.2 节, 第 3 步), lectures (第 1 讲, 第 3 讲), milestone 3 (里程碑 3), %20, Python 3.12 / 3.10, run-001 / run-002, AC215. Chinese numerals for small narrative counts the SAY spells as words and the screen does not show as digits: 四种部署方式, 四个部分, 三个已经做完, 两个小提示, 两个运行时账号, 两个 bucket, 七条 export, 四步 (the function''s four steps; batch walks four steps), 三样输入, 两个精确的 pin, 三个地方, 三个环境变量 / 那三个变量, 两个角色, 两个问题, 两扇门, 三条命令, 两条新命令, 六个直接依赖, 两级, 四行短句, 两条授权, 全部四条授权, 三个文件, 十个人 (Ten people), 两个实例 (Two instances: the SAY''s word), 最后两个, 补充三点, 三个缺点, 五道题 / 第一题 … 第五题, 上半场. When the English uses a digit for a count, follow the English (Concurrency 4 → 并发数 4; A minimum of 1 → 最小实例数设成 1).'
- '[C2] Units, versions and dates. 512 mebibytes → 512 MiB; a 120 second timeout → 120 秒的超时; 5 minutes → 5 分钟; after 5 minutes → 5 分钟后; for a while → 一段时间; all night → 一整晚; under 5,000 characters → 不超过 5000 个字符. Python 3.12 / 3.10 as the README and the old README write them (pick Python 3.12 → 选 Python 3.12; the older README said 3.10 → 旧版 README 写的是 3.10). No tool version is spoken (they sit on screen with the at the time of recording tag). No prices, free-tier numbers or currency amounts anywhere (the script has none; check the pricing page → 去看定价页面, on screen only). Hashes, digests, image tags, execution ids, the commit and project ids are never written in a Chinese line.'
- '[D1] Sentence alignment (explainer/i18n.py). One entry per SAY line of script.md in narration/*.yaml (159 blocks); `en` byte-equal to the SAY line; `zh` has exactly one item per English sentence as split by explainer.voice.split_sentences (357 in this script: 174 in S01-S08, 183 in S09-S16). Restructure only inside a sentence; never merge or split. Short sentences keep their own item: Before you begin. → 开始之前。; Part 1: a function. → 第 1 部分：一个函数。; Part 2. / Part 3. / Part 4. → 第 2 部分。 / 第 3 部分。 / 第 4 部分。; Why 4? → 为什么是 4？; Who is it? → 那是谁？; No. → 不能。 (S09) / 不会。 (S14); Step 3: translate. → 第 3 步：翻译。; That is a job. → 这就是 job。; Nothing was built this time. → 这次什么都没构建。; The order matters. → 顺序很重要。; It is the receipt. → 它就是回执。; Clean up. → 收尾清理。; Three additions. → 补充三点。; Stuck on a step? → 卡在哪一步了？; Run the terminal setup first. → 先把终端设置跑一遍。. Run python -m explainer.i18n check videos/ac215-l14-serverless-deployment --lang zh until it prints OK.'
- '[D2] No say:, no anchors. There is no Chinese voice: never write say: (the display line is the only text) and never write anchors: (they only place animation beats for a Chinese-voiced render). The subtitles are timed by the English audio; the toolkit pairs each Chinese sentence with its English sentence by position.'
- '[D3] A checker-clean display line. With no say:, every displayed sentence must pass explainer.i18n.spoken_problems: no brackets (B2), no maths symbols (B3), no letter_letter names (A6), no ! after a digit, no clause ending in 种 followed by ，。！？ (四种部署方式 inside a clause is fine), a half-width space between Hanzi and Latin letters or digits (B1), each sentence ending in 。！？ or ……, and every Latin word listed in this glossary (zh_subtitle, first_use or allowed_spoken_latin). The checker cuts words with [A-Za-z][A-Za-z''.-]* and ignores one-letter words: us-central1 is us-central, run-001 is run-, amd64 is amd, %20 has no word, 0.0.0.0 has none, Ctrl-C stays whole, main.py stays whole. A Latin word it reports is either English to translate (usually) or a missing artifact: add the artifact, cut the same way, to allowed_spoken_latin and to its term. Plurals and inflections are left out on purpose (no instances, requests, services, jobs, chips, tokens, roles, images, containers, impersonates, impersonating): a plural it reports is an English inflection to drop. Product names with their own plural are the only exceptions (Cloud Run functions, Cloud Functions, Functions Framework, Services, Jobs, Buckets, Tasks, Logs, View logs, Container arguments, Deploy changes as console labels).'
- '[D4] The English line (en_display). In the bilingual band the English line shows the SAY sentence, which spells artifacts out for the voice. Every such sentence gets an en_display item with the literal on-screen form, otherwise word for word the SAY sentence; null for the other sentences of the block. Table (SAY → en_display, script.md "Subtitle display for the i18n stage"): hello underscore HTTP → hello_http (S04[5], S04[8], S05[5], S05[7]); Z H dash C N → zh-cn (S06[3]); percent 20 → %20 (S06[2]); run zero zero one / two → run-001 / run-002 (S12[6], S12[7], S14[3], S15[1], S15[3]); translated dot txt / speech dot wav / manifest dot json / passage dot txt → translated.txt / speech.wav / manifest.json / passage.txt (S14[3], S15[1], S15[6]); translation demo serve → translation_demo serve (S07[4]); Dash m, translation demo, batch → -m, translation_demo, batch (S13[6]); no invoker IAM check → --no-invoker-iam-check (S09[1]); uv sync with frozen → uv sync --frozen (S11[5]); ENABLE SPEECH / GOOGLE CLOUD PROJECT / GOOGLE CLOUD LOCATION → ENABLE_SPEECH / GOOGLE_CLOUD_PROJECT / GOOGLE_CLOUD_LOCATION (S10[3]); A M D 64 → amd64 (S07[2]); Control C → Ctrl+C (S07[10]); dash m (S13[10]) → -m. Not restored: localhost 8086 (the SAY''s spoken address; the screen shows localhost:8086, the English line may keep the SAY), publish port 8086 to 8080 (prose), the requirements file (prose), translation input (prose), gs prefixes (never spoken), main.py and the status codes (already literal). The English video''s own .srt is unaffected.'
- '[D5] Content parity. Each Chinese sentence translates its English sentence only: no added commands, flags, glosses, Chinese screen names or explanations; kept-English words get no Chinese explanation (the English line is right below); ponder questions get no answers (A10). Head words A5 needs (这个, 命令, 参数, 目录, 按钮, 标签页) carry no content. An extra in the English is 额外; the extra of a list (Three additions) is 补充.'
- '[D6] Fixed patterns (L9-L13''s, extended). A tracker in the corner names the README step, and a yellow tag, your turn, means pause and run it. → 角落里的进度条标出 README 的哪一步，黄色的 your turn 标签表示暂停一下，自己跑一遍。 Pause and run it. → 暂停一下，自己跑一遍。 Pause and run them with your real ID. → 暂停一下，用你真实的 ID 把它们跑一遍。 Pause and clone it. → 暂停一下，clone 下来。 Pause and do it. → 暂停一下，照着做。 pause and create yours → 暂停一下，建一个你自己的 Pause and try a few. → 暂停一下，多试几个。 Pause and try it. → 暂停一下，试一试。 Pause and deploy yours. → 暂停一下，部署你自己的。 Pause and sign in → 暂停一下，登录 Pause, run it, then … → 暂停一下，跑起来，然后…… Pause and create it. → 暂停一下，建好它。 Pause, upload and copy the URI. → 暂停一下，上传，再复制 URI。 Pause and create the account and both grants. → 暂停一下，把账号和两条授权都建好。 pause and build it → 暂停一下，把它建好 Pause and run your job. → 暂停一下，跑你的 job。 Pause and run it with your names. → 暂停一下，用你的名字跑一遍。 Pause and delete them all now. → 暂停一下，现在全部删掉。 Test yourself, pausing on each. → 自测一下，每道题都暂停想一想。 One: … Five: → 第一题：…… 第五题： A gold tag: → 金色标签： A small gap: → 有一个小疏漏： Extra checks: / Extra checks agree. → 额外检查： / 额外检查也对得上。 An extra listing → 额外列一下目录 Now the gcloud alternative. → 再看 gcloud 替代做法。 The gcloud alternative … → 用 gcloud 的替代做法，…… Step n: → 第 n 步： Section n.m: → n.m 节： The checkpoint: / The README''s checkpoint: → 检查点： / README 的检查点： So, a quick test. → 那么，快速测一下。 Now the other mistake. → 再看另一种错误。 That is the first of three places to look. → 这是三个要看的地方里的第一个。 So, the third place to look. → 那么，第三个要看的地方。 Same bytes, same digest → 同样的字节，同样的 digest the receipt → 回执 at the time of recording → 录制时 First half done → 上半场完成 Next lecture: → 下一讲：'
- '[D7] Files. narration/g1.yaml = S01-S08 (part 1: the hook and the map, before you begin, the function, what runs it, calling it, the prebuilt image on the laptop, the same image as a service; 79 blocks, 174 sentences), narration/g2.yaml = S09-S16 (part 2: the two doors and the runtime account, speech, local development with ADC, the job and two buckets, command and arguments, execute and collect, the terminal and the helper, clean up and recap; 80 blocks, 183 sentences), the parts of video.yaml; each starts with a comment header (what it covers, the rules it applies: A6 spoken forms of underscored artifacts, A13 translated errors, D4 en_display, A16 the instructor rule, no say:/anchors) and keeps the script order. Strings in double quotes; YAML-escape a literal double quote or backslash.'
- '[D8] Length on the English timing. The Chinese is read while the English plays; the band switches where the English cues switch. Each Chinese sentence should read in about the time the English sentence is heard: at most about 2 units per English word (a Hanzi counts 1, a Latin letter 0.55), so drop redundant connectives and repeated subjects, never content. Long artifacts cost length too (Deploy one revision from an existing container image 27 units, IAM Service Account Credentials API 19.3, Service Account Token Creator 16, translation-demo-runtime 13.2, Service Usage Consumer 12.7, Storage Object Creator 12.1): don''t repeat them where the English doesn''t; after the first mention use a short reference (这个账号, 这个函数, 这个 service, 这个 job, 这个角色).'
- '[D9] Keep the English clause order (a series lesson, ac215-video skill). The toolkit pairs Chinese and English clause by clause, so a Chinese sentence that puts a condition first when the English puts it last swaps meaning between two neighbouring cues. Conditions, purposes and time adverbials sit where the English has them: the meter moves only while requests are served → 计价器只在处理请求的时候走 (one clause, either order); A copy of your app appears when a request arrives and disappears when the traffic stops → 你应用的一个副本在请求来时出现，在流量停下时消失; The helper prints downloaded results only after it finds a complete manifest → 这个 helper 脚本只有在找到完整的 manifest 之后，才打印 downloaded results; Choose Allow public access, so anyone with the URL may call it, then Create → 选 Allow public access，这样谁拿到 URL 都能调用它，然后点 Create. Where the English opens with if, with, while or without (S05[6].2, S06[6], S08[5], S10[7], S10[7].1, S13[11]), the Chinese does too.'
- '[G1] Widths. Bilingual band: a Chinese line holds at most 30 units, the English line 96 characters; the Chinese-only sidecar (.zh.srt) holds 22 units a line, 2 lines a cue. Write clauses of at most about 24 units, separated by ，；：、, so the splitter has clean places to cut; avoid a clause longer than 30 units with no punctuation. Give the long console labels and role names (A6, D8) a clause of their own; the honest note of S03[7] and the long S09[3], S12[4], S13[1] and S13[6] sentences get a comma at every English clause break.'
- '[G2] Cue endings: the toolkit drops a cue-final 。，、；： and keeps ？！…… and a closing ” (subtitles.strip_end). Do not end a sentence on an artifact plus a full stop if a Chinese word can close it (……放在 secrets 目录里。 reads better than ……secrets。); the demo strings (Bonjour à tous, Bienvenido a AC215) may close a sentence as the English does.'
- '[G3] Never split a name or a command. The splitter treats a space between two Latin words in a Chinese line as a good cut, so Allow public access, Save and redeploy, Service Account User, Serve this revision immediately, uv sync --frozen or gcloud auth login could land on two lines. Put such names at the end of a clause, after a full-width colon or 、, with little Chinese around them, at most one long label per cue, and check every cue with a console label, a role name or a command in the rendered .zh.srt.'
- '[H1] Titles (meta.yaml). Video, part and chapter titles in the written register (A4: 容器, 镜像, 仓库, 克隆, 端口, 存储桶, 无服务器, 函数, 服务, 作业, 修订版本, 端点); questions keep their question mark; the English colon structure is kept (开始之前：项目、区域、克隆仓库; 第 1 部分：写一个函数); commands, tools and names stay as they are (localhost, Cloud Run, ADC, helper); meta.yaml is not checked, so brackets are fine there. The video title follows the series pattern AC215 · 第 n 讲：…（跟练：…）and agrees in substance with video.yaml''s publish.title_zh (Serverless 部署：Cloud Run function、service 与 job), written in the meta register (无服务器部署：Cloud Run 上的函数、服务与作业). Core-concept chapters carry the English short name once for search where the Chinese is not the usual search word (查询字符串（query string）, 服务（service）, 作业（job）). The recap chapter keeps the series'' 收尾 pattern (Clean up, and what serverless costs → 收尾清理，以及无服务器的代价). No title names the instructor (A16).'
- '[H2] Description (Bilibili / YouTube): two or three sentences, written register, this glossary''s terms: the AC215 lecture 14 follow-along of dlops-io/serverless-deployment, slide by slide and README step by step (Before you begin, Parts 1-4, Clean up); what the viewer does and learns (a translation handler deployed as a Cloud Run function with main.py, requirements.txt and the entry point, what Cloud Build makes of it, calling it with a query string; the prebuilt image under docker run with PORT, 0.0.0.0 and -p 8086:8080; the same image as a service with min 0 / max 2 / concurrency 4 and request-based billing, revisions, tag vs digest; who may call it vs who it runs as, a runtime service account with no key, speech with Gemini, local development with ADC and impersonation; the same image as a job with two private buckets, per-bucket grants, a container command and eleven arguments, the manifest as receipt, --args overrides and the helper; clean-up; the lecture''s four ways to deploy and three downsides); English narration with Chinese and bilingual subtitles; a recording machine without a Google account (cloud successes shown from the README''s own recording, tagged), billable resources in the viewer''s project (gold tags, a full clean-up checklist). Consistent with video.yaml''s publish.description_zh, but never a person''s name (A16).'
- '[H3] Companions: i18n/zh/README.md (and exercises.md / digest.md if made) are translated with this glossary in the written register (A4: 仓库, 克隆, 容器, 镜像, 端口, 存储桶, 无服务器, 函数, 入口点, 服务（service）, 作业（job）, 修订版本（revision）, 任务（task）, 实例, 并发, 最小实例数, 按请求计费, 冷启动, 服务账号, 运行时服务账号, 角色, 应用默认凭据（ADC）, 服务账号模拟（impersonation）, 配额项目, 软删除, 前缀, 清单文件（manifest）, 回执, 厂商锁定); brackets and underscores are fine there (not checked). Headings and <summary>答案</summary> are translated. A term table at the end: English | the term used here | common variants (serverless: 无服务器 / Serverless; function: 函数 / 云函数; entry point: 入口点 / 入口函数; service: 服务; job: 作业 / 任务; revision: 修订版本 / 版本; instance: 实例; cold start: 冷启动; concurrency: 并发 / 并发数; scale to zero: 缩容到零 / 缩到零; request-based billing: 按请求计费; service account: 服务账号 / 服务帐号; impersonation: 服务账号模拟 / 身份模拟; quota project: 配额项目; principal: 主账号 / 主体; soft delete: 软删除; endpoint: 端点 / 终端节点; vendor lock-in: 厂商锁定 / 供应商锁定).'
- '[H4] Code and commands stay byte-identical in the companions: code blocks, commands, file names and inline `code` are unchanged; only # comments and the prose around them are translated.'
- '[I1] (request, open since L3) explainer.i18n check applies its voice hygiene (_SPOKEN_BAD: brackets, maths symbols, letter_letter names, the 种 rule) to the display line when a sentence has no say:. For a subtitles-only video (this series; video.yaml has no languages.zh.voice and this glossary says voice: none) those checks guard nothing and force A6 and B3 (here: hello_http, translation_demo, the three environment variables, Ctrl+C). Proposal: skip _SPOKEN_BAD for display-only sentences when the glossary''s voice is none (keep the Latin-word, spacing and sentence-end checks).'
- '[I2] (todo, from L1 I3) explainer/subtitles.py''s _cuts treats a space between Latin words in a Chinese line as a good cut, so console labels, role names and commands can be split (G3). Proposal: in a Chinese line, treat a run of Latin tokens separated only by spaces as unbreakable unless it alone exceeds a line.'
- '[I3] (note) explainer/subtitles.py reads every video''s glossary.yaml: the 2-3 word English alternatives of each term''s en field are kept on one English line, and the 2-7 character Chinese headwords of zh_subtitle are registered in jieba, in every video''s subtitles. The en and zh_subtitle fields of this file therefore list real terms only (no sentences); example phrases live in first_use and note.'
terms:
# ---------------------------------------------------------------- S01 It works on localhost
- en: 'translation page / running on your laptop / choose French / press Translate / Bonjour à tous'
  zh_subtitle: '翻译页面 / 笔记本 / 法语 / Translate / Bonjour à tous'
  first_use: 'S01[0]：输入 good afternoon everyone，选法语，点 Translate，它就回答：Bonjour à tous。'
  note: 'A1 a: the demo strings stay as typed and shown (good afternoon everyone, Bonjour à tous, Bienvenido a AC215); the app''s buttons stay (Translate, Play audio). Languages are translated: French 法语, Spanish 西班牙语, Greek 希腊语, Hindi 印地语, simplified Chinese 简体中文. your laptop → 你的笔记本 (A2). Here is a translation page running on your laptop → 这是一个在你笔记本上跑着的翻译页面.'
- en: 'send the address to a classmate / localhost 8086 / localhost always means this machine'
  zh_subtitle: '地址 / 同学 / localhost'
  first_use: 'S01[1]：在同学的笔记本上，localhost 8086 什么也找不到，因为 localhost 永远指这台机器，而他那台上什么都没跑。'
  note: 'localhost stays (L4); localhost 8086 is written as the SAY says it (D4: not restored). Now send the address to a classmate → 现在把地址发给一个同学.'
- en: 'rent a virtual machine / public address / billed all night / nobody translates anything'
  zh_subtitle: '虚拟机 / 公网地址 / 计费'
  first_use: 'S01[2]：第 1 讲给过一个办法：租一台虚拟机。'
  note: 'L1: virtual machine → 虚拟机; billed → 计费 (A3); public address → 公网地址 (L1''s 外部 IP 也就是公网 IP). The page gets a public address, but the machine is billed all night, while nobody translates anything → 页面有了公网地址，可机器整晚都在计费，而根本没人在翻译.'
- en: 'today''s question / public URL / cost nothing while nobody is using it'
  zh_subtitle: 'URL / 公网 URL'
  first_use: 'S01[3]：这个页面能不能有一个公网 URL，没人用的时候又一分钱不花？'
  note: 'So here is today''s question → 所以今天的问题是. cost nothing → 一分钱不花 (no amount, C2).'
- en: 'serverless / the promise of serverless / a copy of your app / when a request arrives / when the traffic stops'
  zh_subtitle: 'serverless / 副本 / 请求 / 流量'
  first_use: 'S01[4]：这就是 serverless 的承诺。'
  note: 'A3: serverless stays, lower case, never opens a sentence; never 无服务器 in a subtitle (the BRIEF''s 无服务器-beside-serverless would need brackets; the English line is right below), written register 无服务器（serverless）(A4). A copy of your app appears when a request arrives and disappears when the traffic stops → 你应用的一个副本在请求来时出现，在流量停下时消失 (D9).'
- en: 'runs as a job / a private bucket / speaks it in French / saves its files and exits'
  zh_subtitle: 'job / 私有 bucket / 退出'
  first_use: 'S01[4]：到最后，同一个 image 还会作为一个 job 来跑。'
  note: 'A3, A15: job stays (the Cloud Run resource; written 作业（job））; measure word 个. It takes a passage from a private bucket, speaks it in French, saves its files and exits → 它从一个私有 bucket 里取一段文字，用法语读出来，保存文件，然后退出.'
- en: 'to follow along / your clone / the gcloud tool / your own project with billing'
  zh_subtitle: '跟着做 / gcloud 命令行工具 / 结算'
  first_use: 'S01[5]：要跟着做，先准备好你的 clone、Docker、gcloud 命令行工具，还有你自己开通了结算的项目。'
  note: 'L1: the gcloud tool → gcloud 命令行工具; billing → 结算 (a project with billing), the act → 计费 (A14). your clone → 你的 clone.'
- en: 'tracker / README step / yellow tag / your turn / pause and run it'
  zh_subtitle: '进度条 / your turn 标签'
  first_use: 'S01[6]：角落里的进度条标出 README 的哪一步，黄色的 your turn 标签表示暂停一下，自己跑一遍。'
  note: 'A11, D6, as L2-L13: the tag text your turn stays as on screen; Pause and run it → 暂停一下，自己跑一遍.'
- en: 'console steps / gcloud boxes / gcloud alternative / alternatives, not extra steps'
  zh_subtitle: '控制台 / gcloud 命令框 / 替代做法'
  first_use: 'S01[6]：先照着控制台的步骤做；gcloud 命令框是替代做法，不是额外的步骤。'
  note: 'A11: the gcloud boxes → gcloud 命令框; the gcloud alternative → gcloud 替代做法 (Now the gcloud alternative → 再看 gcloud 替代做法, D6); extra → 额外.'
# ---------------------------------------------------------------- S02 One app, four ways to deploy it
- en: 'prototype phase / course project / where deployment begins'
  zh_subtitle: '原型阶段 / 课程项目 / 部署'
  first_use: 'S02[0]：先看这一讲的位置：在课程项目的原型阶段里，部署就从这里开始。'
  note: 'A16. First, where this lecture sits → 先看这一讲的位置.'
- en: 'Cheese App / four parts / Model deploy / milestone 3'
  zh_subtitle: 'Cheese App / 模型部署 / 里程碑 3'
  first_use: 'S02[1]：Cheese App 的四个部分，已经做完三个。'
  note: 'Cheese App stays (the course project''s name). Model deploy is left → 还剩模型部署; milestone 3 asks you to deploy your model or API with Cloud Functions or Cloud Run → 里程碑 3 要求你用 Cloud Functions 或 Cloud Run 部署你的模型或 API (C1: 里程碑 3).'
- en: 'the lecture / the slides / the lecture''s serverless / costly hardware / the step that needs it'
  zh_subtitle: '课上 / 课件 / 昂贵的硬件'
  first_use: 'S02[2]：课上讲的 serverless：代码只在需要时运行，不用搭服务器，昂贵的硬件只给需要它的那一步。'
  note: 'A16: the lecture → 课上; the slides / slide → 课件; the lecture tag (Lecture 14 · slides a–b) stays on screen.'
- en: 'Vertex AI training job / last week / next week / endpoints and pipelines'
  zh_subtitle: '训练任务 / 上周 / 下周 / endpoint / pipeline'
  first_use: 'S02[3]：上周的 Vertex AI 训练任务就是一例；今天讲函数和 Cloud Run；下周讲 endpoint 和 pipeline。'
  note: 'A7: training job → 训练任务 (L13), never job (the Cloud Run resource). endpoint (L8) and pipeline (L13) stay; no plural (D3). function → 函数 (A3).'
- en: 'map / one app, four ways to deploy it / what you hand over / where it runs / a rented machine'
  zh_subtitle: '地图 / 部署方式 / 代码文件 / 租来的机器'
  first_use: 'S02[4]：横着看你交出的是什么，一个代码文件还是一个 container；竖着看它在哪儿跑，一台租来的机器还是 serverless。'
  note: 'The lecture''s 2x2 map → 课上的地图 / 四格图; its cells → 格 (the file cell → 代码文件那一格); hand over → 交出 (exam). Its map is one app, four ways to deploy it → 它的地图是一个应用，四种部署方式. Lectures 1 and 2 filled the top row; today fills the bottom → 第 1 讲和第 2 讲填了上面一行；今天填下面一行.'
- en: 'the README''s four parts / bottom row / Part 1 / Parts 2 to 4 / a web service'
  zh_subtitle: '第 1 部分 / web service'
  first_use: 'S02[5]：第 2 到第 4 部分交出的是一个 image，先作为 web service，再作为 job。'
  note: 'A16: the README''s Part n → 第 n 部分 (digits, as its headings). A3: a web service (the Cloud Run service) → web service; the web account (S13) → web service 的账号. Part 1 hands over a file → 第 1 部分交出的是一个文件.'
- en: 'translation model / an outside service / the application code around it / backend'
  zh_subtitle: '翻译模型 / 外部服务 / 应用代码 / 后端'
  first_use: 'S02[6]：部署的不是翻译模型，那是一个外部服务在跑，而是它外面的应用代码。'
  note: 'A7: an outside service → 外部服务 (not the Cloud Run service). And notice what we deploy → 再注意我们部署的是什么. Your Cheese App backend will play that role → 你的 Cheese App 后端会扮演这个角色.'
- en: 'two small notes / the course page / the rewritten README / the course link / the older commit / the course map'
  zh_subtitle: '课程页面 / 课程链接 / commit / 课程地图'
  first_use: 'S02[7]：而且我们跟的是课程链接现在指向的 README，不是课程地图里那个旧的 commit。'
  note: 'A10: kind notes, said plainly. Two small notes → 两个小提示. The course page links to sections the rewritten README no longer has, so start at the top → 课程页面链接到的几节，重写后的 README 已经没有了，所以从头开始. The commit is never written (C2).'
# ---------------------------------------------------------------- S03 Before you begin
- en: 'Before you begin / course project / project ID / display name / command boxes'
  zh_subtitle: '项目 ID / 显示名称 / 命令框'
  first_use: 'S03[0]：选好你的课程项目，核对它的项目 ID，不要只看显示名称；命令框里要的是 ID。'
