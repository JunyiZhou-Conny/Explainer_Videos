  note: 'An extra listing shows older files at the root, including main.py and a Dockerfile, which the README never uses; don''t build them → 额外列一下目录，根目录下有一些旧文件，包括 main.py 和一个 Dockerfile，README 从来不用它们；别去构建. A7: the function folder → function 目录 ≠ 函数.'
