  first_use: 'S13[6]：-m、translation demo、batch，input URI 和你的段落，source en，destination fr，output URI 和你的前缀。'
  note: 'A6, D4: en_display Dash m, translation demo, batch → -m, translation_demo, batch (the rest of the sentence as the SAY). The opening -m is not a lower-case word (A5).'
- en: 'a task timeout of 5 minutes / 0 retries / a retry repeats paid work'
  zh_subtitle: 'task 超时 / 重试'
  first_use: 'S13[7]：然后是同样的三个变量、5 分钟的 task 超时、0 次重试，因为一次重试会重复付费的工作。'
  note: 'A15: task timeout → task 超时 (exam''s 任务超时, same field). On Security, choose the job''s account by its email → 在 Security 里，按邮箱选 job 的账号.'
- en: 'Execute job immediately / unchecked / build it'
  zh_subtitle: 'Execute job immediately'
  first_use: 'S13[7]：Execute job immediately 不要勾选，然后点 Create；暂停一下，把它建好。'
  note: 'A1 a, D6.'
- en: 'paste all eleven into one chip / a module / that whole sentence / cut at the first dot'
  zh_subtitle: '模块 / 第一个点'
  first_use: 'S13[8]：把 11 个值全贴进一个 chip，Python 就会去找一个以这一整句为名字的模块。'
  note: 'A15. The name is cut at the first dot → 名字在第一个点那里被截断.'
- en: 'the other mistake / leave Container command empty / what does the container try to run'
  zh_subtitle: 'Container command'
  first_use: 'S13[9]：你把 11 个参数 chip 都填了，却把 Container command 留空。'
  note: 'Ponder P4 (A10): Now the other mistake. → 再看另一种错误。 What does the container try to run? → 这个 container 会试着运行什么？ The lead-in must not say -m, entrypoint or not found.'
- en: 'the default command / with no entrypoint / dash m becomes the program / executable not found'
  zh_subtitle: '默认命令 / 可执行文件'
  first_use: 'S13[10]：参数替换了默认命令，又没有 entrypoint，-m 就成了要运行的程序。'
  note: 'A7, A13: Docker''s version fails: executable not found → 在 Docker 里复现的版本失败了：找不到可执行文件 (the tag extra · Docker''s analogue stays on screen). en_display dash m → -m.'
- en: 'with nothing changed / starts the web server / the timeout fails it after 5 minutes'
  zh_subtitle: 'web 服务器'
  first_use: 'S13[11]：如果什么都不改，这个 job 会启动 web 服务器，一直等到 5 分钟后超时把它判为失败。'
  note: 'A3, D9: with nothing changed opens. web server → web 服务器 (L07). The gcloud alternative passes the same eleven values, comma separated, with command python → 用 gcloud 的替代做法，传的是同样的 11 个值，用逗号隔开，命令用 python.'
# ---------------------------------------------------------------- S14 Execute it and collect the files
- en: 'Execute / a green check / History'
  zh_subtitle: 'Execute / History / 绿勾'
  first_use: 'S14[0]：录制记录显示它成功了，History 里有一个绿勾。'
  note: 'A11, A15. Section 4.4: open the job and select Execute → 4.4 节：打开这个 job，点 Execute.'
- en: 'a red mark / exits with status 1 / an honest failure / History tells the truth'
  zh_subtitle: '红色标记 / 退出码 1'
  first_use: 'S14[1]：红色标记意味着什么？'
  note: 'A13: Our extra laptop run without the speech flag exits with status 1, an honest failure, so History tells the truth → 我们在笔记本上额外跑了一次，不开语音开关，它以退出码 1 退出，这是一次如实的失败，所以 History 说的是真话.'
- en: 'open the execution / Tasks / View logs / a JSON summary / status complete'
  zh_subtitle: 'Tasks / View logs / JSON 摘要 / complete'
  first_use: 'S14[2]：它最后的输出是一段 JSON 摘要，里面有输出和 manifest 的位置、状态 complete，还有那几个文件。'
  note: 'A13, A15: complete is the printed status word. Step 2: open the execution, then Tasks, View logs → 第 2 步：打开这次执行，再点 Tasks 里的 View logs. The job exits; it has no web URL → 这个 job 会退出；它没有 web URL.'
- en: 'a folder with a random name / attempt / attempt folder'
  zh_subtitle: 'attempt 目录'
  first_use: 'S14[3]：里面是一个名字随机的目录。'
  note: 'A1 c, A15: attempt stays (the tracker says Attempt folder). Step 3: open your output bucket, then run zero zero one → 第 3 步：打开你的输出 bucket，再打开 run-001 (en_display).'
- en: 'translated dot txt / speech dot wav / manifest dot json / three files'
  zh_subtitle: 'translated.txt / speech.wav / manifest.json'
  first_use: 'S14[3]：第 4 步：三个文件：translated.txt、speech.wav 和 manifest.json。'
  note: 'A6, D4: the file names literal; en_display the same.'
- en: 'the order matters / create-only / written last / the receipt / manifest'
  zh_subtitle: '回执 / manifest'
  first_use: 'S14[4]：每次上传都是只创建、不覆盖，而写着 complete 的 manifest 最后才写。'
  note: 'A15: manifest stays (L11); receipt → 回执 (L06). The order matters. → 顺序很重要。 It is the receipt. → 它就是回执。'
- en: 'the third place to look / exited with 0 / the work is complete / prove nothing'
  zh_subtitle: '第三个地方'
  first_use: 'S14[5]：绿勾说明进程以 0 退出；manifest 说明工作完成了。'
  note: 'D6: So, the third place to look. → 那么，第三个要看的地方。 Files without a manifest prove nothing → 没有 manifest 的文件什么都证明不了.'
- en: 'execute the same job again / same arguments / is the first result overwritten'
  zh_subtitle: '覆盖'
  first_use: 'S14[6]：同一个 job 再执行一次，参数不变。'
  note: 'Ponder P5 (A10): Is the first result overwritten? → 第一次的结果会被覆盖吗？ The lead-in must not say attempt, new folder or no.'
- en: 'a new attempt folder / create-only uploads / not exactly once / why retries are 0'
  zh_subtitle: '恰好一次'
  first_use: 'S14[7]：一个新的 attempt 目录出现在第一个旁边，只创建的上传也不能覆盖。'
  note: 'A15: No. → 不会。 But it is not exactly once: a retry repeats paid work, which is why retries are 0 → 但这不是恰好一次：一次重试会重复付费的工作，所以重试设成 0.'
- en: 'download the text and the audio / the icons / running time / one speech call'
  zh_subtitle: '下载图标 / 运行时间 / 语音调用'
  first_use: 'S14[8]：金色标签：每次执行按运行时间计费，再加一次语音调用。'
  note: 'B3: plus → 加. Step 5: download the text and the audio with the icons → 第 5 步：用下载图标下载文本和音频. Pause and run your job → 暂停一下，跑你的 job.'
- en: 'executes with wait / a results folder / copies the output down / the wait flag / stream your app''s logs'
  zh_subtitle: '--wait / results 目录'
  first_use: 'S14[9]：这个 --wait 参数不会实时显示你应用的日志。'
  note: 'A5, A7: the wait flag → --wait 参数 (a head word first). The gcloud alternative executes with wait, makes a results folder, and copies the output down → 用 gcloud 的替代做法，会带 --wait 执行，建一个 results 目录，再把输出拷下来.'
- en: 'the README''s checkpoint / the task finished / the process stopped / its files remain'
  zh_subtitle: '进程'
  first_use: 'S14[10]：README 的检查点：task 完成了，进程停了，它的文件留在 Storage 里。'
  note: 'A15, A16.'
# ---------------------------------------------------------------- S15 From the terminal, then the helper
- en: 'new work from the terminal / a permission of yours / overrides / its own right'
  zh_subtitle: '覆盖参数 / 权限'
  first_use: 'S15[0]：先说你自己的一项权限：带覆盖参数运行 job 需要单独的权限，和 job 账号的角色无关。'
  note: 'A7: override → 覆盖参数 (≠ overwrite → 覆盖). Section 4.5: new work from the terminal → 4.5 节：从终端提交新的工作.'
- en: 'console only so far / the terminal setup / under 5,000 characters / passage dot txt / the sample'
  zh_subtitle: 'passage.txt / 示例'
  first_use: 'S15[1]：存一段短文，不超过 5000 个字符，作为 repo 根目录下的 passage.txt，或者直接复制示例。'
  note: 'C1, D4: en_display passage dot txt → passage.txt. Console only so far? → 到现在只用了控制台？ Run the terminal setup first. → 先把终端设置跑一遍。'
- en: 'export both bucket names / run zero zero two / stops at the placeholder again'
  zh_subtitle: 'run-002 / 占位符'
  first_use: 'S15[1]：把两个 bucket 名字 export 出来，再把它上传到 run-002 下；它又会停在占位符那里。'
  note: 'A5: export never opens a sentence; en_display run-002.'
- en: 'execute the existing job with overrides / the whole argument list / for this execution only / not taken from it'
  zh_subtitle: '执行'
  first_use: 'S15[2]：保存的 job 里还是法语，而且你漏掉的参数不会从它那里补上。'
  note: 'A7, A15: Step 3: execute the existing job with overrides → 第 3 步：带覆盖参数执行已有的 job. They replace the whole argument list for this execution only: a new path and Spanish → 它们会替换整个参数列表，只对这次执行有效：一个新路径，再加上西班牙语.'
- en: 'make the results folder / copy run zero zero two down / a successful Spanish execution'
  zh_subtitle: 'results 目录'
  first_use: 'S15[3]：README 的录制记录显示一次成功的西班牙语执行。'
  note: 'Step 4: after it succeeds, make the results folder and copy run zero zero two down → 第 4 步：成功之后，建好 results 目录，把 run-002 拷下来 (en_display).'
- en: 'the helper / combines all three / an extra dry run / its plan / a fresh run folder'
  zh_subtitle: 'helper 脚本 / dry run / 计划'
  first_use: 'S15[4]：4.6 节：helper 脚本把这三步合在一起。'
  note: 'A1 c, A6: the helper → helper 脚本 (run_job.py on screen only). An extra dry run shows its plan → 额外跑一次 dry run，能看到它的计划. It uploads to a fresh run folder named by the time and a random part, executes with the eleven arguments, and downloads → 它上传到一个新的 run 目录，用时间加一段随机字符命名，再带着 11 个参数执行，然后下载.'
- en: 'run for real / prints each gcloud command / stops at the first failure / your names'
  zh_subtitle: 'gcloud 命令'
  first_use: 'S15[5]：真跑的时候，它会在运行每条 gcloud 命令之前先打印出来，遇到第一个失败就停。'
  note: 'D6: Pause and run it with your names → 暂停一下，用你的名字跑一遍.'
- en: 'the result folder / play speech dot wav / downloaded results / a complete manifest / the receipt again'
  zh_subtitle: 'downloaded results / 完整的 manifest'
  first_use: 'S15[6]：这个 helper 脚本只有在找到完整的 manifest 之后，才会打印 downloaded results：又是回执。'
  note: 'A13, D9: the printed line downloaded results stays. Step 2: open the result folder and play speech dot wav → 第 2 步：打开结果目录，播放 speech.wav (en_display).'
# ---------------------------------------------------------------- S16 Clean up, and what serverless costs
- en: 'clean up / download what you want to keep / delete translate-function and translation-demo'
  zh_subtitle: '收尾清理 / 删除'
  first_use: 'S16[0]：第 2 步：删掉 translate-function 和 translation-demo，再删 job。'
  note: 'Clean up. → 收尾清理。 (L2 清理; the series'' 收尾). Step 1: download what you want to keep → 第 1 步：把想留的东西下载下来.'
- en: 'once nothing uses them / the function''s image / still there after the service is gone'
  zh_subtitle: '运行时账号'
  first_use: 'S16[1]：第 4 步：Artifact Registry 里那个函数的 image，service 删了它还在。'
  note: 'Step 3: delete your buckets and the two runtime accounts once nothing uses them → 第 3 步：等没有东西再用它们，就删掉你的 bucket 和两个运行时账号. Pause and delete them all now → 暂停一下，现在全部删掉.'
- en: 'three additions / soft-deleted files / source archives / keep the shared public image'
  zh_subtitle: '源代码归档 / 共享的公开 image'
  first_use: 'S16[2]：软删除的文件还会计费一段时间；构建还会留下源代码归档和日志。'
  note: 'A14, D5: Three additions. → 补充三点。 And keep the shared public image; others use it → 还有，留着那个共享的公开 image；别人也在用.'
- en: 'stuck on a step / troubleshooting table / symptoms and checks'
  zh_subtitle: '故障排查表 / 症状'
  first_use: 'S16[3]：README 最后有一张故障排查表，列出症状和检查方法。'
  note: 'Stuck on a step? → 卡在哪一步了？ (exam: troubleshooting table → 故障排查表).'
- en: 'the whole map / handed over a file / scales to zero / exits with a receipt'
  zh_subtitle: '缩容到零'
  first_use: 'S16[4]：第 2 到第 4 部分交出的是一个 image：一个能缩容到零的 service，和一个带着回执退出的 job。'
  note: 'A3: scale to zero → 缩容到零 (exam). Here is the whole map → 来看整张地图. Part 1 handed over a file, and Cloud Build made the image → 第 1 部分交出的是一个文件，image 由 Cloud Build 来做.'
- en: 'the lecture''s three downsides / cold starts / keeps an instance warm / for money'
  zh_subtitle: '缺点 / 热实例'
  first_use: 'S16[5]：冷启动：最小实例数设成 1，能让一个实例一直热着，但要花钱。'
  note: 'A3: Now the lecture''s three downsides, and our answers → 现在看课上说的三个缺点，和我们的回答.'
- en: 'build logs / service logs / the job''s logs and manifest'
  zh_subtitle: '构建日志 / service 日志'
  first_use: 'S16[6]：控制和调试受限：有三个地方可看，构建日志、service 日志，以及 job 的日志和 manifest。'
  note: 'A3, D6: one wording with S10[8] and S05[8].'
- en: 'vendor lock-in / ran on your laptop / only the console, the permissions and the build'
  zh_subtitle: '厂商锁定'
  first_use: 'S16[7]：厂商锁定：image 和 Functions Framework 都在你的笔记本上跑过；只有控制台、权限和构建是 Google 的。'
  note: 'A3: vendor lock-in → 厂商锁定 (exam).'
- en: 'next lecture / a Vertex AI endpoint / a trained model / then pipelines'
  zh_subtitle: '下一讲 / 训练好的模型'
  first_use: 'S16[8]：下一讲：给训练好的模型建一个 Vertex AI endpoint，然后是 pipeline。'
  note: 'A16, D3: no plural.'
- en: 'test yourself / pausing on each / place parts 1 and 2 on the lecture''s map / who builds the image'
  zh_subtitle: '自测 / 题'
  first_use: 'S16[9]：自测一下，每道题都暂停想一想。'
  note: 'D6, B2: One: … Five: → 第一题：…… 第五题：. One: place parts 1 and 2 on the lecture''s map → 第一题：把第 1 和第 2 部分放到课上的地图上. What do you hand over, and who builds the image? → 你交出的是什么，image 又是谁构建的？ The cards stay English on screen; the questions are answered nowhere in i18n/zh.'
- en: 'which two settings make the meter run / a minimum instance buys / no key file / neither'
  zh_subtitle: '最小实例 / 密钥文件'
  first_use: 'S16[10]：第二题：哪两个设置会让计价器在没人用的时候也走，最小实例又能买到什么？'
  note: 'Three: who may call it, and who it runs as → 第三题：谁可以调用它，它又以谁的身份运行. Which setting answers each, and why is no key file needed? → 各由哪个设置回答，为什么不需要密钥文件？ Four: why does the job set a command and eleven separate arguments, and what happens with neither? → 第四题：为什么这个 job 要设一个命令和 11 个独立的参数，两个都不设会怎样？ Five: name the lecture''s three downsides of serverless, and what this tutorial gives you for each → 第五题：说出课上讲的 serverless 的三个缺点，以及这个教程针对每一个给了你什么.'
