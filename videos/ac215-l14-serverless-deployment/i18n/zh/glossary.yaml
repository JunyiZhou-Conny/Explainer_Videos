- en: 'clone the repository / clone or download / git clone / git log / the commit we follow'
  zh_subtitle: 'repo / git clone / git log / commit'
  first_use: 'S03[3]：README 写的是 clone 或下载，所以我们的 git clone 是额外的，显示我们所跟 commit 的 git log 也是。'
  note: 'Step 4: clone the repository → 第 4 步：把 repo clone 下来; Pause and clone it → 暂停一下，clone 下来 (D6). A11: extra → 额外.'
