# Bilibili metadata for the release (tools/release_episode.py → PUBLISH.json → the Mac publish worker)
publish:
  title_zh: "AC215 第14讲跟练 · Serverless 部署：Cloud Run function、service 与 job，一步一步部署到云端"
  description_zh: |
    哈佛 AC215（MLOps & LLMOps，2026 秋）第 14 讲教程的逐条命令跟练，照着 dlops-io/serverless-deployment 的 README 四个部分一步一步做：
    上半场把一个 6 行的翻译 handler 写成 Cloud Run function（main.py、requirements.txt 和 entry point，看 Cloud Build 怎样把代码变成镜像），
    用 query string 调用它；再用一条 docker run 在本地跑起预构建的翻译网页，讲清 PORT、0.0.0.0 和 -p 8086:8080，
    然后把同一个镜像部署成 Cloud Run service，看懂 min/max instances、concurrency、按请求计费、revision 和 tag 与 digest。
    下半场给服务挂上运行时 service account（不用下载 key），打开 Gemini 语音合成，用 ADC 和 impersonation 在本地开发；
    再把同一个镜像跑成 Cloud Run job：两个私有 bucket、按桶授权、container command 与 11 个独立参数、执行后的 attempt 文件夹和 manifest，
    最后用 gcloud 参数覆盖和 helper 脚本从终端提交任务，并逐项清理所有计费资源。
    对照课件逐页讲解：四种部署方式、冷启动、按用量计费的前提、调试在哪里看日志、vendor lock-in。
    边看边暂停，在自己的电脑上跑每一条命令；本讲会创建计费的云资源，视频用金色标签标出计费点，结尾有完整收尾清单。
    英文旁白，中英双语字幕。

    教程仓库：https://github.com/dlops-io/serverless-deployment
    学习笔记（全部命令、真实输出和练习答案）：https://github.com/JunyiZhou-Conny/MLOps_Learning/blob/main/guides/L14-serverless-deployment.md

    课程与教程内容来自 Harvard AC215 课程组（Pavlos Protopapas 等）；本视频是个人学习用的非官方讲解，引用课件只注明页码，不展示课件。
  tags_zh: [AC215, MLOps, Serverless, Cloud Run, Cloud Functions, 云部署, Docker, GCP, 哈佛, 教程跟练]
  tid: 231
