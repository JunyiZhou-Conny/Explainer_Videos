     en: "Forget winning: in how many orders can the board fill up?"}
  - {id: c05, at: "6:0.5", dur: 3.6, kind: number,   # cue 18.1
     zh: "从 9 一直乘到 1，叫 9 的阶乘：362,880",
     en: "Multiplying all the way down to 1 is called nine factorial: 362,880."}
  - {id: c06, at: "7:3", dur: 3.8, kind: question,   # cue 19.4
     zh: "比 255,168 还多：多出来的对局从哪儿来？",
     en: "More than 255,168: where do the extra games come from?"}

