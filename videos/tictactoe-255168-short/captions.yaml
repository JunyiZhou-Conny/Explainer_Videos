# Caption track of the tic-tac-toe short. There is no voice: these 30 lines and the picture carry
# everything. One short sentence per caption, Chinese and English, each a claim, a question, a number
# or a name (never a description of the picture). The plan they sit in is script.md, which quotes
# every line verbatim.
#
# Format: explainer/captions.py (the short-format toolkit). One key per scene file stem, a list of
# captions each; `at` is the grid position inside that scene, "bar:beat" counted from 0 at the
# scene's first downbeat (100 BPM: a beat is 0.6 s, a bar 2.4 s); `dur` is seconds on screen. The
# `# cue` comment is the same moment in the bar.beat numbering of script.md (bars from 1 across the
# whole short). Captions are timed for reading, not snapped to the beat: each starts half a beat
# after the picture event it names (c06: on the beat) and stays up 3.0-4.0 s. `kind` (question /
# claim / number / name) is for reviewers; the toolkit ignores it.
#
# Burned in after rendering, outside the camera, so camera moves never drag them, and one rendered
# picture serves both masters (video.yaml: captions.layouts = zh-first for Bilibili, en-first for
# YouTube); every word label inside the picture is bilingual. The zh-first layout upper-cases the en
# line. 10¹²⁰ and 10⁸⁰ are Unicode superscripts in the en lines (Noto Sans Mono and Noto Serif have
# them); Noto Serif CJK SC does not, so the zh lines say 10 的 120 次方, the glossary's form.
#
# Text rules: the long video's binding glossary (videos/tictactoe-255168/i18n/zh/GLOSSARY.md). X, O
# and code names stay English; 种 for counting different games, 局 for one game or a tally; 第 N 步;
# 空格子; 幽灵对局 (in “” where it is named); 9 的阶乘 (the symbol 9! only in on-screen maths); 撤销;
# 判断输赢; 递归 / 回溯; 平局; 国际象棋; a half-width space between CJK and Latin letters or digits;
# full-width punctuation; no 。 or ， at the end of a caption (glossary G2), ？ kept; never ！ or !
# right after a digit.
#
# Check after every edit: python3 videos/tictactoe-255168-short/assets/check_short.py
# (it recomputes every number, replays every board, and checks widths, overlaps, the picture-only
# share and the glossary rules against script.md and video.yaml).

s01_open:                     # S01 · cold open and title (starts on bar 1)
  - {id: c01, at: "3:0.5", dur: 3.5, kind: question,   # cue 4.1
     zh: "井字棋有多少种不同的对局？",
     en: "How many different games of tic-tac-toe are there?"}
  - {id: c02, at: "5:0.5", dur: 3.6, kind: claim,   # cue 6.1
     zh: "最后的棋盘一样，顺序不同：算两种对局",
     en: "Same final board, different order: two different games."}
  - {id: c03, at: "7:0.5", dur: 3.4, kind: claim,   # cue 8.1
     zh: "翻转或旋转后的对局，也分开算",
     en: "Flipped or turned games count separately too."}

