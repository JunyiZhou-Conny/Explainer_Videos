s07_ledger:                     # S07 · Act IV: 255,168, explained (starts on bar 70)
  - {id: c21, at: "0:0.5", dur: 3.6, kind: question,   # cue 70.1+
     zh: "255,168 种对局，怎么变成了 362,880？",
     en: "How do 255,168 games become 362,880?"}
  - {id: c22, at: "7:0.5", dur: 4.0, kind: claim,   # cue 77.1+
     zh: "乘上各自被算的次数，加起来又是 9 的阶乘",
     en: "Multiply each by how often it was counted, and add: nine factorial again."}
  - {id: c23, at: "10:0.5", dur: 3.5, kind: number,   # cue 80.1+
     zh: "先走的 X 赢了一半多一点的对局",
     en: "X, who goes first, wins just over half of all games."}

