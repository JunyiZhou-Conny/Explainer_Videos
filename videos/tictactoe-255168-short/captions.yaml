# Caption track of the tic-tac-toe short. There is no voice: these 29 lines and the picture carry
# everything. One short sentence per caption, Chinese and English, each a claim, a question, a number
# or a name (never a description of the picture). The plan they sit in is script.md, which quotes
# every line verbatim, with its time.
#
# Format: explainer/captions.py (the short-format toolkit). One key per scene file stem, a list of
# captions each; `at` is the grid position inside that scene, "bar:beat" counted from 0 at the
# scene's first downbeat (100 BPM: a beat is 0.6 s, a bar 2.4 s); `dur` is seconds on screen. The
# `# cue` comment is the same moment in the bar.beat numbering of script.md (bars from 1 across the
# whole short; "4.1+" is half a beat after 4.1). Captions are timed for reading, not snapped to the
# beat: most start half a beat after the picture event they name, a question starts on the beat that
# raises it, and each stays up 3.0-4.0 s while its evidence is still on screen. `kind` (question /
# claim / number / name) is for reviewers; the toolkit ignores it.
#
# Burned in after rendering, outside the camera, so camera moves never drag them, and one rendered
# picture serves both masters (video.yaml: captions.layouts = zh-first for Bilibili, en-first for
# YouTube); every word label inside the picture is bilingual. The zh-first layout upper-cases the en
# line. 10¹²⁰ and 10⁸⁰ are Unicode superscripts in the en lines (Noto Sans Mono and Noto Serif have
# them); Noto Serif CJK SC does not, so the zh lines say 10 的 120 次方, the glossary's form (the strip
# labels add 1 后面跟着 120 个零, glossary H3).
#
# Text rules: the long video's binding glossary (videos/tictactoe-255168/i18n/zh/GLOSSARY.md). X, O
# and code names stay English; 种 for counting different games, 局 for one game or a tally; 第 N 步;
# 空格子; 真实的对局; 提前结束; 幽灵对局 (in “” where it is named); 9 的阶乘 (the symbol 9! only in
# on-screen maths); 撤销; 判断输赢 (in “” after a verb); 整棵树; 平局; 双方都不失误; 国际象棋; a
# half-width space between CJK and Latin letters or digits; full-width punctuation; no 。 or ， at the
# end of a caption (glossary G2), ？ kept; never ！ or ! right after a digit.
#
# Check after every edit: python3 videos/tictactoe-255168-short/assets/check_short.py
# (it recomputes every number, replays every board, and checks widths, rates, overlaps, the
# picture-only share and the glossary rules against script.md and video.yaml).

s01_open:                     # S01 · cold open and title (starts on bar 1)
  - {id: c01, at: "3:0.5", dur: 3.5, kind: question,   # cue 4.1+
     zh: "井字棋有多少种不同的对局？",
     en: "How many different games of tic-tac-toe are there?"}
  - {id: c02, at: "4:3", dur: 3.4, kind: question,   # cue 5.4
     zh: "最后的棋盘一样：算一种对局，还是两种？",
     en: "Same final board: one game or two?"}
  - {id: c03, at: "6:3.5", dur: 3.6, kind: claim,   # cue 7.4+
     zh: "顺序不同，或棋盘翻转、旋转：都算不同的对局",
     en: "A different order, or a flipped or turned board: a different game."}

s02_fill:                     # S02 · Act I: fill the board (starts on bar 12)
  - {id: c04, at: "0:0.5", dur: 3.6, kind: question,   # cue 12.1+
     zh: "先不管输赢，填满棋盘有多少种顺序？",
     en: "Forget winning: in how many orders can the board fill up?"}
  - {id: c05, at: "6:0.5", dur: 3.6, kind: number,   # cue 18.1+
     zh: "从 9 一直乘到 1，叫 9 的阶乘：362,880",
     en: "Multiplying from 9 down to 1 is called nine factorial: 362,880."}
  - {id: c06, at: "7:3", dur: 3.8, kind: question,   # cue 19.4
     zh: "比 255,168 还多：9 的阶乘多算了什么？",
     en: "More than 255,168: what did nine factorial count too often?"}

s03_ghosts:                     # S03 · Act II: games stop early (starts on bar 21)
  - {id: c07, at: "1:1.5", dur: 3.3, kind: claim,   # cue 22.2+
     zh: "真实的对局，有人赢了就结束",
     en: "A real game ends as soon as someone wins."}
  - {id: c08, at: "5:0.5", dur: 3.4, kind: number,   # cue 26.1+
     zh: "9 的阶乘把这一局算了 24 次",
     en: "Nine factorial counted this one game 24 times."}
  - {id: c09, at: "6:3.5", dur: 3.5, kind: name,   # cue 27.4+
     zh: "这些编出来的对局，叫“幽灵对局”",
     en: "These made-up games are called ghost games."}
  - {id: c10, at: "8:3.5", dur: 3.0, kind: claim,   # cue 29.4+
     zh: "一局最早也要到第 5 步才结束",
     en: "The earliest a game can end is move 5."}
  - {id: c11, at: "10:1.5", dur: 3.6, kind: claim,   # cue 31.2+
     zh: "结束得越早，身后拖着的幽灵对局就越多",
     en: "The earlier a game ends, the more ghost games it drags along."}

