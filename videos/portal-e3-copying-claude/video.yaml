  title_zh: "项目周记 E3 · 照着 Claude 抄：我们的聊天页抄了什么、没抄什么、加了什么"
  description_zh: |
    我的创业项目（给中国家长和在美留学生的就医导航原型）每周 PR 的概念讲解，第 3 集。
    分诊聊天页为什么一比一照抄 Claude 的聊天界面？先认识聊天页的各个部分（空白页、建议、输入框、模型菜单、发送/停止键、气泡、操作按钮、回到最新、免责声明）；再看决策 0006 为什么选择「每个界面只照抄一个参考」而不是各取所长；抄了什么（版式、输入框、颜色和衬线字，只在这一页）、没抄什么（标志、侧栏和历史、推理原文、逐字流式）、为了安全和家长加了什么（紧急情况放最前、家长版的 911 说法、跟着复制走的标注、无障碍）；agent 一夜之间怎么重做这一页，又是怎么被一个「发送和停止是同一个按钮」的 bug 绊了两次；最后是主流聊天产品有而我们没有的功能，以及只有我们能做的东西。
    所有案例都是虚构的；不是医疗建议。英文旁白，中英双语字幕。
  tags_zh: [AI, 产品设计, UI设计, 聊天界面, 无障碍, Claude, 创业, 科普]
  tid: 231
