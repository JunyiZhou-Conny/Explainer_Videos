# zh narration for S10-S16 (part 2, group g2: automate the workflow, README B = dlops-io/ml-workflow-aws:
# four terminals to one orchestrator, setup in the console, the collector and processor by hand, local training
# and its two small fixes, build and push to your own ECR, the workflow container and one processing job, the
# pipeline drawn by property references, clean-up, recap and test yourself), sentence-aligned to script.md: one
# zh sentence per English sentence (explainer.voice.split_sentences; 64 SAY lines, 180 sentences).
# Terms and rules: ../GLOSSARY.md, ../glossary.yaml.
# Subtitles only: there is no Chinese voice in this series, so no say: and no anchors (rule D2); the zh line is
# shown on the English timing, so each sentence keeps the English order of clauses (D9): conditions, purposes
# and because / until / if clauses stay where the English puts them (S10[7], S10[8], S13[3], S13[4], S14[0],
# S15[11]).
# Artifacts the checker does not allow in a displayed line are written as the SAY says them (rule A10):
# --data_collector -> 带上 data collector 参数; "<3" -> 小于 3; "*" -> 星号; num_classes is never written.
# Printed short errors stay as printed (A12: AWS not configured, Permission denied); errors the SAY paraphrases
# are Chinese (AWS 拒绝了我们的假密钥, 身份检查失败了, 账号查询失败了).
# Ponder (A14): P4 S15[5] asks without answering; the reveal S15[6] answers with the question's verb (不会。).
# Errata say 有一个小疏漏 / 先说一个小疏漏 (A14: S11[0], S12[6], S13[0]); the honest caveat S15[9] is 如实说明一点.
# processor is English only for the SDK's Processor object in S14[5] (A11); elsewhere 数据处理器 / 处理器.
# The instructor rule (A17): the narration of S10-S16 names no instructor (the lecture -> 课上, the slides -> 课件).
# en_display: the English subtitle line where the SAY spells an artifact as words (rule D4: ml-workflow-aws S10[3];
# ml-workflow-user S10[4]; .csv S10[5], S10[6]; CheeseAppSageMakerExecutionRole / CheeseAppLambdaExecutionRole and
# ARN S10[8]; amd64 S11[1], S13[2]; raw.zip S11[3]; arm64 S11[5], S12[0]; --clean and clean.zip S11[6]; --prepare
# S11[7]; /persistent/model S12[2]; /persistent/model/1 S12[5]; --train, ARN and ml.m5.xlarge S12[8]; || true
# S13[5]; "*" S14[0]; "<3" S14[1]; --data_collector S14[4]; ml.t3.medium and python3 S14[5]; DSL and .output
# S15[0]; DataCollector and raw-data S15[1], S15[2]; DeployModel S15[4], S15[11]; CreateModel S15[8]; raw.zip,
# clean.zip and tfrecords.zip S15[9]; --pipeline S15[10]; cheese-app-endpoint S16[0]); null = the SAY text.
S10:
- en: "Part 2. The lecture draws the problem: four stages, each run by a person at a terminal. How do we execute these steps? And can we automate this flow?"
  zh:
  - "第 2 部分。"
  - "课上画出了问题：四个阶段，每个阶段由一个人守着一个终端来跑。"
  - "这些步骤怎么执行？"
  - "这个流程能不能自动化？"
- en: "The answer is an orchestrator. The lecture uses Vertex AI Pipelines, on Kubeflow. This tutorial uses SageMaker Pipelines, the same idea of managed steps in a graph."
  zh:
  - "答案是一个编排器。"
  - "课上用的是基于 Kubeflow 的 Vertex AI Pipelines。"
  - "这个教程用的是 SageMaker Pipelines，同样是把托管的步骤放进一张图里。"
- en: "Workflow management runs the steps in order, makes a run repeatable, gives each step its machine, and shows it. This repo covers those four. Scheduling waits for lecture 23. And it is managed: no cluster for you to run."
  zh:
  - "工作流管理按顺序运行这些步骤，让每次运行都可重复，给每一步分配机器，还把过程展示出来。"
  - "这个 repo 覆盖了这四项。"
  - "调度要等到第 23 讲。"
  - "而且它是托管的：不用你自己运维集群。"
- en: "Setup, step 1: clone ml workflow AWS. Our git clone is extra again. An extra tree shows four folders under source: three stages and the workflow."
  zh:
  - "环境设置，第 1 步：clone ml-workflow-aws。"
  - "我们的 git clone 又是额外的。"
  - "额外的目录树显示 src 下面有四个目录：三个阶段，加上 workflow。"
  en_display:
  - "Setup, step 1: clone ml-workflow-aws."
  - null
  - null
- en: "Steps 2 to 5 are console work: quick setup for SageMaker AI, and a Unified Studio domain, where you will watch the pipeline. Then your bucket, and a user named ml workflow user, with four policies."
  zh:
  - "第 2 到第 5 步都是控制台操作：SageMaker AI 的快速设置，再加一个 Unified Studio 域，之后你在那里看 pipeline。"
  - "然后是你的 bucket，和一个叫 ml-workflow-user、挂了四个策略的用户。"
  en_display:
  - null
  - "Then your bucket, and a user named ml-workflow-user, with four policies."
- en: "Create an access key for the command line, and download the C S V file. Quick setup and the Studio domain stay in your account: check them when you clean up."
  zh:
  - "为命令行创建一个访问密钥，下载 .csv 文件。"
  - "快速设置和 Studio 域会留在你的账号里：收尾清理时记得检查。"
  en_display:
  - "Create an access key for the command line, and download the .csv file."
  - null
- en: "Steps 6 and 7: install the AWS CLI, then aws configure, and paste the two values from the C S V. From here on, we typed obviously fake placeholders, so AWS answers with real errors."
  zh:
  - "第 6 步和第 7 步：安装 AWS CLI，然后 aws configure，把 .csv 里的两个值贴进去。"
  - "从这里开始，我们输入的都是明显假的占位符，所以 AWS 回的是真实的报错。"
  en_display:
  - "Steps 6 and 7: install the AWS CLI, then aws configure, and paste the two values from the .csv."
  - null
- en: "Step 8 tests the configuration. AWS itself rejects the fake token and the fake key. With yours, these print your account and your buckets. Don't go on until they do."
  zh:
  - "第 8 步测试配置。"
  - "AWS 自己拒绝了假的令牌和假的密钥。"
  - "用你的密钥，这两条会打印出你的账号和你的 bucket。"
  - "别往下走，直到它们打印出来。"
- en: "Step 9 creates two roles: Cheese App SageMaker Execution Role, for every job, and Cheese App Lambda Execution Role. The code builds each A R N from your account number and the exact role name, so spell them exactly, and pause here."
  zh:
  - "第 9 步创建两个角色：CheeseAppSageMakerExecutionRole，给每个任务用；还有 CheeseAppLambdaExecutionRole。"
  - "代码用你的账号 ID 和准确的角色名拼出每个 ARN，所以名字要一字不差，在这里暂停一下。"
  en_display:
  - "Step 9 creates two roles: CheeseAppSageMakerExecutionRole, for every job, and CheeseAppLambdaExecutionRole."
  - "The code builds each ARN from your account number and the exact role name, so spell them exactly, and pause here."
S11:
- en: "Data collector, step 1. A small gap first: all four part 2 scripts name the bucket from the README, so put yours in each one. Then, in this folder, run sh docker-shell.sh. Without keys, the script stops itself: AWS not configured."
  zh:
  - "数据采集器，第 1 步。"
  - "先说一个小疏漏：第 2 部分的四个脚本写的都是 README 里的 bucket 名，所以每个都要换成你的。"
  - "然后在这个目录里跑 sh docker-shell.sh。"
  - "没有密钥，脚本自己就停了：AWS not configured。"
- en: "With keys, it builds in 40 seconds and opens a root shell. Two notes. This script builds for A M D 64, which Apple silicon emulates. And on Ubuntu or Debian, sh is dash, which skips the key check, so run bash docker-shell.sh."
  zh:
  - "有密钥时，它 40 秒就构建完，打开一个 root shell。"
  - "两点说明。"
  - "这个脚本为 amd64 构建，Apple Silicon 上要模拟运行。"
  - "在 Ubuntu 或 Debian 上，sh 就是 dash，它会跳过密钥检查，所以要跑 bash docker-shell.sh。"
  en_display:
  - null
  - null
  - "This script builds for amd64, which Apple silicon emulates."
  - null
- en: "Why a shell? The entry point script has a switch. No arguments: it opens bash, development mode, where you are now. Arguments: it runs them and exits, production mode. The lecture calls that a callable container."
  zh:
  - "为什么是一个 shell？"
  - "这个 entrypoint 脚本里有一个开关。"
  - "没有参数：它就打开 bash，也就是开发模式，你现在就在这里。"
  - "有参数：它就运行它们然后退出，也就是生产模式。"
  - "课上把这叫作可调用的 container。"
- en: "Step 2: the search command, four cheeses, ten images each. It scrapes the web, writes four folders, zips them, and tries to upload raw dot zip. AWS rejects our fake key."
  zh:
  - "第 2 步：search 命令，四种奶酪，每种十张图片。"
  - "它从网上抓取图片，写出四个目录，打成 zip 包，再尝试上传 raw.zip。"
  - "AWS 拒绝了我们的假密钥。"
  en_display:
  - null
  - "It scrapes the web, writes four folders, zips them, and tries to upload raw.zip."
  - null
- en: "Step 3, check your bucket, cannot pass here. An extra listing shows 40 images on disk. On the laptop, a root-owned persistent folder appeared beside the clones."
  zh:
  - "第 3 步，检查你的 bucket，在这里过不去。"
  - "额外列一下目录，磁盘上有 40 张图片。"
  - "在笔记本上，clone 下来的 repo 旁边出现了一个属于 root 的 persistent 目录。"
- en: "Data processor, step 1: the A R M 64 line fails again, and the same swap fixes it."
  zh:
  - "数据处理器，第 1 步：arm64 那一行又失败了，同样对调一下就好。"
  en_display:
  - "Data processor, step 1: the arm64 line fails again, and the same swap fixes it."
- en: "Step 2: python cli.py dash dash clean. A duplicate finder checks each label, finds none among these 40, and the upload of clean dot zip fails. Pause and run it."
  zh:
  - "第 2 步：python cli.py --clean。"
  - "一个查重工具检查每个 label，在这 40 张里一张重复的都没找到，clean.zip 的上传也失败了。"
  - "暂停一下，跑一遍。"
  en_display:
  - "Step 2: python cli.py --clean."
  - "A duplicate finder checks each label, finds none among these 40, and the upload of clean.zip fails."
  - null
- en: "Steps 3 and 4: check your bucket, then dash dash prepare. All 40 images split into 32 for training and 8 for validation, in two real TFRecord files. The upload fails again. Step 5 finds them only on disk."
  zh:
  - "第 3 步和第 4 步：检查你的 bucket，然后 --prepare。"
  - "40 张图片全部划分成 32 张训练、8 张验证，写进两个真实的 TFRecord 文件。"
  - "上传又失败了。"
  - "第 5 步只能在磁盘上找到它们。"
  en_display:
  - "Steps 3 and 4: check your bucket, then --prepare."
  - null
  - null
  - null
- en: "The duty cards from the lecture match: download, then verify, remove duplicates and convert to TFRecords. And the four labels are just the folder names: your search queries, so type them exactly."
  zh:
  - "课上的职责卡片都对得上：下载，然后验证、去重、转成 TFRecords。"
  - "四个 label 就是目录名，也就是你的搜索词，所以要一字不差地输入。"
S12:
- en: "Model training, step 1. Same A R M 64 line, same swap. This image installs from its committed lock, with SageMaker version 2, so it needs no pin."
  zh:
  - "模型训练，第 1 步。"
  - "同样是 arm64 那一行，同样对调。"
  - "这个 image 按 commit 进 repo 的 lock 文件安装，用的是 SageMaker 版本 2，所以不需要 pin。"
  en_display:
  - null
  - "Same arm64 line, same swap."
  - null
- en: "Step 2, local training. TensorFlow 2.20 on the CPU finds the TFRecords from the processor, through the shared folder. Look at the last layer: three outputs. One epoch runs. Its accuracy means nothing yet."
  zh:
  - "第 2 步，本地训练。"
  - "CPU 上的 TensorFlow 2.20 通过共享目录，找到了数据处理器生成的 TFRecords。"
  - "看最后一层：三个输出。"
  - "跑了一个 epoch。"
  - "它的准确率现在还说明不了什么。"
- en: "Then saving fails: permission denied, slash persistent slash model. Pause here for two small fixes."
  zh:
  - "然后保存失败了：Permission denied，/persistent/model。"
  - "在这里暂停一下，做两处小修复。"
  en_display:
  - "Then saving fails: permission denied, /persistent/model."
  - null
- en: "First, line 68 says three classes, while the data has four labels, so gouda gets no target. Change it to 4."
  zh:
  - "第一处，第 68 行写的是三个类别，可数据有四个 label，所以 gouda 没有对应的目标。"
  - "把它改成 4。"
- en: "Second, on Linux, Docker created the persistent folder as root, and this container runs as the app user. Exit, and on your laptop create the folder yourself, or change its owner. Then run step 2 again. Docker Desktop on a Mac avoids this."
  zh:
  - "第二处，在 Linux 上，Docker 以 root 身份创建了 persistent 目录，而这个 container 以 app 用户运行。"
  - "退出，在你的笔记本上自己创建这个目录，或者改它的所有者。"
  - "然后再跑一次第 2 步。"
  - "Mac 上的 Docker Desktop 不会遇到这个问题。"
- en: "It would write to slash persistent slash model slash 1: the persistent folder on your laptop, or the SageMaker model folder inside a training job."
  zh:
  - "它会写到 /persistent/model/1：也就是你笔记本上的 persistent 目录，或者训练任务里 SageMaker 的模型目录。"
  en_display:
  - "It would write to /persistent/model/1: the persistent folder on your laptop, or the SageMaker model folder inside a training job."
- en: "Just before the save sits the signature change from the lecture: decode, convert, resize, inside the model. A small slip: the README gives this job to model deploy. The trainer does it."
  zh:
  - "就在保存之前，是课上讲的签名变化：解码、转换、缩放，都放在模型里。"
  - "有一个小疏漏：README 把这件事交给了模型部署。"
  - "其实是训练脚本做的。"
- en: "Step 3: sh package-trainer.sh packs the package folder and copies it to S3. The tar file is real. The upload fails on our fake key."
  zh:
  - "第 3 步：sh package-trainer.sh 把 package 目录打包，再拷到 S3。"
  - "这个 tar 文件是真的。"
  - "上传因为我们的假密钥失败了。"
- en: "Step 4: python cli.py dash dash train. It asks AWS who you are, to build the role A R N, and stops there. With keys, it starts a training job on M L M5 extra large, and returns at once."
  zh:
  - "第 4 步：python cli.py --train。"
  - "它问 AWS 你是谁，用来拼出角色的 ARN，然后就停在那里。"
  - "有密钥时，它会在 ml.m5.xlarge 上启动一个训练任务，并且马上返回。"
  en_display:
  - "Step 4: python cli.py --train."
  - "It asks AWS who you are, to build the role ARN, and stops there."
  - "With keys, it starts a training job on ml.m5.xlarge, and returns at once."
- en: "Step 5: watch it in the console, under Training, then Training jobs. Its name starts with cheese."
  zh:
  - "第 5 步：在控制台里看，Training 下面的 Training jobs。"
  - "它的名字以 cheese 开头。"
S13:
- en: "Build and push. The README says this step has already been done for you. A small gap: the workflow code pulls both images from the ECR registry of your own account, so you push them yourself, once each."
  zh:
  - "构建并 push。"
  - "README 说这一步已经替你做好了。"
  - "有一个小疏漏：workflow 的代码从你自己账号的 ECR registry 拉取这两个 image，所以你得自己 push，每个一次。"
- en: "That is the second step the lecture gives for your own containers: push the images to a registry the platform can pull from."
  zh:
  - "这正是课上给你自己的 container 列出的第二步：把 image push 到平台能拉取的 registry。"
- en: "Steps 1 to 3 go through Docker Hub: log in, build, push. The Mac line builds A M D 64, because SageMaker runs that."
  zh:
  - "第 1 到第 3 步走 Docker Hub：登录、构建、push。"
  - "Mac 那一行构建 amd64，因为 SageMaker 跑的就是它。"
  en_display:
  - null
  - "The Mac line builds amd64, because SageMaker runs that."
- en: "Step 4 sets five variables. Pasted exactly as written, the first line prints two errors, because export rejects the bracket note, though the region is still set. The account lookup fails on our fake key, and the URI starts with a dot."
  zh:
  - "第 4 步设置五个变量。"
  - "照原样贴进去，第一行会打印两个报错，因为 export 不接受那段方括号注释，不过区域还是设上了。"
  - "账号查询因为我们的假密钥失败了，URI 就以一个点开头。"
- en: "So paste only the value, us-east-1. And if your URI starts with a dot, the account lookup failed: fix your keys first."
  zh:
  - "所以只贴值：us-east-1。"
  - "如果你的 URI 以点开头，就说明账号查询失败了：先修好你的密钥。"
- en: "Step 5 pulls your image. Step 6 creates the repository, and the or true at the end hides the error: the command exits with zero."
  zh:
  - "第 5 步拉取你的 image。"
  - "第 6 步创建仓库，结尾的 || true 把报错藏起来了：命令以 0 退出。"
  en_display:
  - null
  - "Step 6 creates the repository, and the || true at the end hides the error: the command exits with zero."
- en: "Steps 7 to 11 log Docker in to ECR, tag the image, push it, list it, and print the URI. Tag only adds a second name to the same image. Run them on your laptop, not in the workflow container, which has no docker command. Then repeat for the processor image."
  zh:
  - "第 7 到第 11 步：让 Docker 登录 ECR，给 image 打 tag，push，列出来，再打印 URI。"
  - "打 tag 只是给同一个 image 加第二个名字。"
  - "在你的笔记本上跑，别在 workflow container 里跑，那里没有 docker 命令。"
  - "然后对数据处理器的 image 再做一遍。"
S14:
- en: "Automate the data collector, step 1, in the workflow folder. Before you run sh docker-shell.sh, the star problem returns. A lock is committed, but the Dockerfile copies only the Pipfile, so the build would resolve version 3."
  zh:
  - "自动化数据采集器，第 1 步，在 workflow 目录里。"
  - "在你跑 sh docker-shell.sh 之前，星号的问题又回来了。"
  - "虽然 commit 了一个 lock 文件，可 Dockerfile 只复制 Pipfile，所以构建会解析出版本 3。"
  en_display:
  - null
  - "Before you run sh docker-shell.sh, the \"*\" problem returns."
  - null
- en: "The checks show the imports failing. So make the same fix first: less than 3."
  zh:
  - "检查结果显示导入失败了。"
  - "所以先做同样的修复：小于 3。"
  en_display:
  - null
  - "So make the same fix first: \"<3\"."
- en: "Now run sh docker-shell.sh. The banner shows region and bucket, and the who am I check fails. Extras: SageMaker version 2 now, and no docker command. The socket is mounted, but no docker program is inside."
  zh:
  - "现在跑 sh docker-shell.sh。"
  - "横幅显示区域和 bucket，身份检查失败了。"
  - "额外检查：现在是 SageMaker 版本 2，而且没有 docker 命令。"
  - "Docker 的 socket 挂进来了，但里面没有 docker 程序。"
- en: "From here, the SDK is your remote control, as the lecture puts it. Your Python asks, and AWS machines run."
  zh:
  - "从这里开始，SDK 就是你的遥控器，课上就是这么说的。"
  - "你的 Python 发出请求，AWS 的机器去跑。"
- en: "Step 2: python cli.py dash dash data collector. It stops at line 32, a lookup of your account at the top of the file, before the function even starts. Every flag of this CLI needs a working key at import time."
  zh:
  - "第 2 步：带上 data collector 参数，跑 python cli.py。"
  - "它停在第 32 行，那是文件顶部对你账号的一次查询，函数还没开始。"
  - "这个 CLI 的每个参数在导入时都需要一个能用的密钥。"
  en_display:
  - "Step 2: python cli.py --data_collector."
  - null
  - null
- en: "With keys, it builds a processor from your ECR image, on one M L T3 medium. Its entry point is python 3 with the collector cli.py. Then it runs the job with the search arguments, and waits, showing the logs."
  zh:
  - "有密钥时，它用你 ECR 里的 image 建一个 processor，跑在一台 ml.t3.medium 上。"
  - "它的 entrypoint 是 python3 加上采集器的 cli.py。"
  - "然后带着搜索参数运行这个任务，一边等一边显示日志。"
  en_display:
  - "With keys, it builds a processor from your ECR image, on one ml.t3.medium."
  - "Its entry point is python3 with the collector cli.py."
  - null
- en: "This is production mode. SageMaker puts its own command in front of the arguments. Same image, same cli.py, on a machine you never log in to. The job acts as the role, not with your key."
  zh:
  - "这就是生产模式。"
  - "SageMaker 在参数前面放上它自己的命令。"
  - "同一个 image，同一个 cli.py，跑在一台你从来不用登录的机器上。"
  - "这个任务以角色的身份运行，用的不是你的密钥。"
- en: "Step 3: watch it under Processing, then Processing jobs."
  zh:
  - "第 3 步：在 Processing 下面的 Processing jobs 里看。"
S15:
- en: "Now the whole pipeline. The slides write steps in the Kubeflow D S L, wired by dot output and compiled to YAML. Here: SageMaker step classes, property references and JSON."
  zh:
  - "现在看整条 pipeline。"
  - "课件用 Kubeflow 的 DSL 写步骤，用 .output 连起来，再编译成 YAML。"
  - "这里是 SageMaker 的步骤类、属性引用和 JSON。"
  en_display:
  - null
  - "The slides write steps in the Kubeflow DSL, wired by .output and compiled to YAML."
  - null
- en: "First, caching, for 30 days. The first step is a processing step named data collector, with one declared output, raw data."
  zh:
  - "首先是缓存，30 天。"
  - "第一步是一个叫 DataCollector 的处理步骤，声明了一个输出：raw-data。"
  en_display:
  - null
  - "The first step is a processing step named DataCollector, with one declared output, raw-data."
- en: "The second step, the processor, takes as input a property of the collector: its raw data output, S3 URI. Not a string: a reference, and it draws an edge."
  zh:
  - "第二步是数据处理器，它的输入是采集器的一个属性：它的 raw-data 输出的 S3 URI。"
  - "不是字符串，而是一个引用，它画出一条边。"
  en_display:
  - "The second step, the processor, takes as input a property of the collector: its raw-data output, S3 URI."
  - null
- en: "Training takes the TFRecords output of the processor the same way, and the model step takes the trained model artifacts. Each reference draws one more edge."
  zh:
  - "训练用同样的方式拿处理器的 TFRecords 输出，模型步骤拿训练出来的模型产物。"
  - "每个引用都多画出一条边。"
- en: "Last, the Lambda step named deploy model takes the model name from the model step. Then the pipeline lists all five steps, creates the deploy Lambda from your laptop, upserts its definition, and starts it."
  zh:
  - "最后，叫 DeployModel 的 Lambda 步骤从模型步骤拿模型名。"
  - "然后这个 pipeline 列出全部五个步骤，从你的笔记本创建负责部署的 Lambda，upsert 它的定义，再启动它。"
  en_display:
  - "Last, the Lambda step named DeployModel takes the model name from the model step."
  - null
- en: "Something to ponder. Reverse the list of steps in the Pipeline call. Does the run order change?"
  zh:
  - "想一想。"
  - "把 Pipeline 调用里的步骤列表倒过来。"
  - "运行顺序会变吗？"
- en: "No. The order comes from the references: each input names the output of another step. The list is a set of steps, not a schedule."
  zh:
  - "不会。"
  - "顺序来自引用：每个输入都指向另一个步骤的输出。"
  - "这个列表是一组步骤，不是一份时间表。"
- en: "An extra, built offline and never sent: the JSON definition from the SDK. Five steps, each edge a get on a property of another step. Upsert sends this."
  zh:
  - "一个额外的东西，离线生成、从没发出去：SDK 生成的 JSON 定义。"
  - "五个步骤，每条边都是对另一个步骤某个属性的一次 Get。"
  - "Upsert 发送的就是它。"
- en: "The lecture draws four steps. Here, deploy splits in two. Create model makes the model, and a Lambda, a small function AWS runs on demand, creates or updates the endpoint."
  zh:
  - "课上画的是四个步骤。"
  - "在这里，部署拆成了两步。"
  - "CreateModel 创建模型，而一个 Lambda，也就是 AWS 按需运行的小函数，负责创建或更新 endpoint。"
  en_display:
  - null
  - null
  - "CreateModel makes the model, and a Lambda, a small function AWS runs on demand, creates or updates the endpoint."
- en: "One honest caveat. The edges set the order, but files also travel by fixed names through the bucket: raw, clean and tfrecords dot zip. We could not check, without an account, how the training job finds its data on SageMaker."
  zh:
  - "如实说明一点。"
  - "边决定顺序，但文件也会按固定的名字经过 bucket 传递：raw.zip、clean.zip 和 tfrecords.zip。"
  - "没有账号，我们没法检查训练任务在 SageMaker 上是怎么找到它的数据的。"
  en_display:
  - null
  - "The edges set the order, but files also travel by fixed names through the bucket: raw.zip, clean.zip and tfrecords.zip."
  - null
- en: "Step 1: python cli.py dash dash pipeline stops at the same line 32. With keys, it prints that the pipeline started. Step 2: in Unified Studio, under Build, ML Pipelines, you would see this graph."
  zh:
  - "第 1 步：python cli.py --pipeline 停在同样的第 32 行。"
  - "有密钥时，它会打印 pipeline 已经启动。"
  - "第 2 步：在 Unified Studio 里，Build 下面的 ML Pipelines，你会看到这张图。"
  en_display:
  - "Step 1: python cli.py --pipeline stops at the same line 32."
  - null
  - null
- en: "If every step succeeds, caching skips unchanged steps for 30 days, so the collector won't scrape again. And a green deploy model only means the Lambda asked: wait until the endpoint is in service."
  zh:
  - "如果每一步都成功，缓存会在 30 天内跳过没变的步骤，所以采集器不会再抓取一遍。"
  - "而且绿色的 DeployModel 只说明 Lambda 发出了请求：要等到 endpoint 进入服务状态。"
  en_display:
  - null
  - "And a green DeployModel only means the Lambda asked: wait until the endpoint is in service."
- en: "Step 3 tests each component with its own flag. Here, all four stop at that line. With keys, model deploy makes yet another endpoint."
  zh:
  - "第 3 步用各自的参数分别测试每个组件。"
  - "在这里，四个都停在那一行。"
  - "有密钥时，模型部署又会建一个新的 endpoint。"
S16:
- en: "Before you leave, clean up. List your endpoints and delete every one: the timestamped ones from part 1, and cheese app endpoint. Then delete their configurations and models."
  zh:
  - "走之前，先收尾清理。"
  - "列出你的 endpoint，全部删掉：第 1 部分那些带时间戳的，还有 cheese-app-endpoint。"
  - "然后删掉它们的配置和模型。"
  en_display:
  - null
  - "List your endpoints and delete every one: the timestamped ones from part 1, and cheese-app-endpoint."
  - null
- en: "Empty and delete both buckets. Delete the two ECR repositories, the deploy Lambda functions, and the cheese pipeline."
  zh:
  - "清空并删除两个 bucket。"
  - "删除两个 ECR 仓库、负责部署的 Lambda 函数，还有 cheese 的 pipeline。"
- en: "Deactivate and delete the access keys, and the users and roles you no longer need. Finally, check the SageMaker AI domain and the Unified Studio domain you created."
  zh:
  - "停用并删除访问密钥，还有不再需要的用户和角色。"
  - "最后，检查你创建的 SageMaker AI 域和 Unified Studio 域。"
- en: "The lecture ends on a factory: your Python is the recipe, and SageMaker Pipelines runs it. Today's pictures: a key on the laptop and a role in the cloud. A star is not a pin. Preprocessing sits in the client or in the model. Three pieces stand behind an endpoint, and references draw the edges."
  zh:
  - "课上最后讲的是一座工厂：你的 Python 是配方，SageMaker Pipelines 来运行它。"
  - "今天的几幅图：笔记本上的一把密钥，云端的一个角色。"
  - "星号不是 pin。"
  - "预处理放在客户端，或者放在模型里。"
  - "站在 endpoint 背后的是三样东西，而引用画出了边。"
- en: "Under it, part 1 in four commands. Prepare packs the model, deploy builds the model, configuration and endpoint. Predict sends the numbers, and delete turns off the meter."
  zh:
  - "在它下面，是用四条命令走完的第 1 部分。"
  - "其中 prepare 打包模型，deploy 建出模型、配置和 endpoint。"
  - "而 predict 发送那些数字，delete 关掉计价器。"
- en: "Test yourself. Your laptop and the endpoint both reach S3: which identity does each use? And why do the option 2 exports never reach the part 1 container?"
  zh:
  - "自测一下。"
  - "你的笔记本和 endpoint 都会访问 S3：各自用的是哪个身份？"
  - "为什么选项 2 的 export 永远到不了第 1 部分的 container？"
- en: "Name the three things deploy creates. Which one is the address, and which one bills while nobody calls it? Where does preprocessing sit in part 1, and in the part 2 trainer, and why move it into the model?"
  zh:
  - "说出 deploy 创建的三样东西。"
  - "哪一个是地址，哪一个在没人调用时也在计费？"
  - "预处理在第 1 部分里放在哪里，在第 2 部分的训练脚本里又放在哪里，为什么要挪进模型？"
- en: "Which lines make training wait for the processor? Which two one-line fixes did today need, and which would an Apple silicon Mac skip? The answers are in the exercises, and lecture 23 triggers the pipeline from GitHub."
  zh:
  - "哪几行让训练等着数据处理器？"
  - "今天需要哪两处一行修复，Apple Silicon 的 Mac 会跳过哪一处？"
  - "答案在练习里，第 23 讲会从 GitHub 触发这个 pipeline。"
