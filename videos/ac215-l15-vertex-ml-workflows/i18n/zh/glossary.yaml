# Chinese (zh-CN) glossary and translation rules for ac215-l15-vertex-ml-workflows (AC215 lecture 15, ML Workflows:
# model deployment and ML pipelines; the FULL follow-along, slide by slide and README step by step, of the AWS
# tutorials dlops-io/model-deployment-aws (README A, main @ 077f4db) and dlops-io/ml-workflow-aws (README B, main @
# f165c6e), both re-checked with git ls-remote on 2026-11-05 (ASSETS.md "Which commits"); the lecture's slides speak
# Vertex AI on Google Cloud, the video follows the course's AWS version by series decision), code-switching version,
# SUBTITLES ONLY. Audience: Chinese-speaking AC215 grad students who read technical English fluently; register of a
# Chinese MLOps TA running a lab section.
# Precedents and sources of the shared decisions: the series pilot videos/ac215-l01-vms-venvs/i18n/zh (repo, clone,
# commit, pin, lock 文件, 约束, 解析器, 计价器, 计费, 结算, 录制时, root, shell, Pipfile / pipenv as is); the container
# lectures L2-L4 (container, image, tag, Dockerfile, 构建, 拉取, 清理); L3 (服务账号, 密钥, 凭据, bucket, 替身); L6 (区域);
# L8 (endpoint, 客户端, 缓存, 挂载, epoch, 坑); L10 (IAM, 令牌, 身份); L11 (label, entrypoint, the erratum phrase 一个小
# 疏漏); L13 (训练任务, 训练脚本, tar 包, 模拟运行, notebook, release, 划分, 准确率); L14 (角色, 挂上, 实例, serverless,
# 缩容到零, 以…的身份运行, 占位符, 真实报错, 额外列一下目录, the file layout this one follows); and the sibling exam edition
# videos/ac215-l15-exam (pipeline, registry, DAG, SDK, CLI, 签名, 服务签名, 预处理, 缩放, 浮点数, 模型注册表, 地址, 遥控器,
# 工厂 / 配方, 属性, 引用, 步骤, 边, 图, 工作流管理, 托管, 调度, 数据采集器, 数据处理器, 经验法则, 触发). Every form they fixed
# is kept where it agrees with this video's captures. What is new here is AWS: IAM 用户, 策略, 访问密钥, ARN, 账号 ID, 域,
# 快速设置, endpoint 配置, ECR 仓库, Lambda 步骤, 处理任务, 属性引用, and the kept-English push, upsert, stub, socket.
# BRIEF.md's "Chinese glossary heads-up" asked to keep user, role, access key, policy, endpoint configuration, step,
# Processing job, Training job, property reference, cache and signature in English; series consistency and AWS's
# Chinese console win for those (GLOSSARY.md 关键决定), the rest of the heads-up is followed.
# There is NO Chinese voice in this series (docs/AC215_SERIES.md rule 8): the Chinese lines are subtitles on the
# English timing (the bilingual band of output/<id>.zh-en.mp4, <id>.zh.srt, <id>.zh-en.srt / .ass). So no say:,
# no anchors, no readings, no durations: only display rules. `python -m explainer.i18n check` still applies its voice
# hygiene to the displayed line (brackets, maths symbols, letter_letter names, Latin words not listed here, a missing
# half-width space): rules A10, B3 and D3 are how the Chinese line stays clean without say:.
# SERIES RULE: the instructor's name never appears in a subtitle, a title or the description (A17).
# Human-readable copy in Chinese: GLOSSARY.md (keep the two in sync; its term tables come from this file's data).
# terms[].zh_subtitle = the display form (Chinese subtitle line; titles use the written forms of A8);
# terms[].first_use = an example sentence for the translators, as SNN[k]：<one Chinese sentence for one English
# sentence of SAY block k of scene SNN, k from 0>; terms[].note = usage (English → Chinese), the rule tags, and
# "More:" further example sentences. Together first_use and the More: sentences give one checked draft for each of
# the script's 390 sentences, labelled by block (not by position inside the block); the narration files reuse them.
# rules are tagged [A1]..[I3]: A terms, B typography, C numbers, D narration file, G subtitles, H titles and
# companions, I toolkit notes. (L1's E on-screen strings and F voice rules do not apply: nothing on screen is
# translated in this series, and there is no voice.)
# Read by: python -m explainer.i18n check (Latin words allowed in the Chinese line: every Latin word of zh_subtitle
# and first_use, plus allowed_spoken_latin, which lists the words as the checker's regex [A-Za-z][A-Za-z'.-]* cuts
# them: us-east-1 is us-east-, ml.m5.xlarge is ml.m and xlarge, arm64 is arm, python3 is python, --prepare is
# prepare) and explainer/subtitles.py, for EVERY video (2-3 word English phrases of `en` are kept on one English line;
# 2-7 character Chinese headwords of zh_subtitle are registered in jieba, so zh_subtitle holds terms, not phrases).
video: ac215-l15-vertex-ml-workflows
lang: zh-CN (mainland Simplified Chinese)
audience: 'Chinese-speaking AC215 (MLOps & LLMOps) grad students who know Python and basic ML, read technical English fluently,
  did L1-L14 (Docker images and docker-shell.sh scripts with bind mounts, pipenv and lock files, the cheese collector, processor
  and TFRecords, the L13 trainer package and managed training job, L14''s Cloud Run), saw Lecture 15 (which speaks Vertex
  AI), and are new to AWS: IAM users, access keys and roles, S3, SageMaker models, endpoint configurations and endpoints,
  ECR, Lambda and SageMaker Pipelines; they follow along with clones of model-deployment-aws and ml-workflow-aws open, Docker
  running, the AWS CLI v2 installed and their own AWS account with billing, pausing to run every step (this lecture''s endpoints,
  jobs and pipeline steps bill). Register of a Chinese MLOps TA running a lab section.'
voice: none          # subtitles only (video.yaml: Chinese = i18n/zh/narration/*.yaml on the English timing)
policy: 'The Mandarin of a Chinese MLOps TA walking a lab section through the steps, code-switching only where such a speaker
  really does, written as subtitles under an English narration. The viewers already say 把 repo clone 下来, 起一个 container, 构建
  image, 打 tag, 建一个 bucket, 调一个 endpoint, 跑一条 pipeline, pin 住版本, 看 lock 文件; this lecture, the series'' first on AWS, adds
  一个 IAM 用户和一个角色, 访问密钥, 复制 ARN, 一个 S3 bucket, endpoint 配置, push 到 ECR, upsert pipeline 的定义, 换成一个 stub. Every choice passes
  three tests: what is said in a real lab section; the standard, searchable Chinese name (AWS''s Chinese console and docs:
  IAM 用户, 角色, 策略, 访问密钥, 区域, 域, 快速设置, 停用, 实例; TensorFlow and the Chinese ML literature: 签名, 预处理, 缩放, 归一化, 浮点数, 概率, 准确率, 计算图,
  权重, 导出; the workflow literature: 编排器, 工作流管理, 托管, 调度, 缓存, 属性引用, 步骤, 边); and consistency with the series (L1-L14 and the sibling
  exam edition ac215-l15-exam: every form they fixed is kept where it agrees with this video''s captures). (1) Artifacts verbatim:
  what the viewer types or matches on screen (commands, flags, file and folder names, user, role and bucket names, the pipeline''s
  step names, console labels, the model''s labels, short printed errors, regions and instance types, README headings when
  named as headings) is copied letter for letter, never translated, inflected or quoted; names the checker rejects (underscores,
  < > + and brackets) are written the way the narration says them (A10) and the English line shows the literal (D4). Nothing
  on screen is translated in this series: terminals, code panels, README cards, RECORDED panels, the schematic console forms,
  the V1-V8 set pieces, tags, trackers, the lecture tags (which live only as long as their redrawn picture), chips and the
  pause-and-ponder cards stay English; only the narration is. (2) Lab-speech English, a closed list (A1 c). (3) Everything
  else in standard Chinese (A3-A7). (4) The video''s pictures by meaning, one word each: 计价器 (the meter), 墙 (the container
  wall the exports fall off), 前门 (the model''s signature as a front door), 遥控器 (the SDK, the lecture''s remote control), 工厂
  / 配方 (the lecture''s factory and recipe), 这条线 (the client-to-endpoint wire), 职责卡片 (the lecture''s duty cards). (5) Written
  register for titles, meta.yaml and companion docs (A8). (6) The bilingual band puts the English sentence under every Chinese
  line, so the Chinese line carries no glosses and no brackets. (7) The toolkit''s constraints are part of the policy: one
  Chinese sentence per English sentence (139 blocks, 390 sentences), a checker-clean display line (D3), an en_display wherever
  the SAY spells an artifact out as words (D4), the English clause order kept (D9). Mainland Simplified Chinese; relaxed,
  clear lab-section speech, never slangy. SERIES RULE: the instructor''s name never appears in a subtitle, a title or the
  description (A17).'
rules:
- '[A1] Code-switching scope. English stays in three places only. (a) Artifacts, copied letter for letter: commands as typed
  or named (git clone, git log, git status, aws configure, aws sagemaker list-endpoints, chmod, sh docker-shell.sh, bash docker-shell.sh,
  sh package-trainer.sh, pipenv lock, export, python cli.py --prepare / --deploy / --predict / --delete / --clean / --train
  / --pipeline, the search command), file and folder names (cli.py, docker-shell.sh, package-trainer.sh, Pipfile, Pipfile.lock,
  Dockerfile, model.tar.gz, raw.zip, clean.zip, tfrecords.zip, artifacts, variables, persistent, /persistent/model, /persistent/model/1,
  src, workflow, package), names the viewer creates or matches (model-deployment, ml-workflow-user, SageMakerExecutionRole,
  CheeseAppSageMakerExecutionRole, CheeseAppLambdaExecutionRole, ml-workflow-aws, cheese-app-endpoint, the step names DataCollector,
  CreateModel, DeployModel and the declared output raw-data), console labels and buttons the SAY names (Endpoints, Delete,
  Training, Training jobs, Processing, Processing jobs, Build, ML Pipelines), README headings named as headings (Run Container),
  short printed errors and messages (exec format error, Unable to locate credentials, AWS not configured, Permission denied),
  regions and instance types (us-east-1, ml.m5.xlarge, ml.t3.medium), architectures (arm64, amd64), the model''s labels (brie,
  gruyere, gouda, parmigiano), json (the typed output format), the key Enter, versions (Python 3.9, TensorFlow 2.18 / 2.20,
  Serving 2.13, SageMaker 版本 2 / 3), the on-screen tags when the narration names them (your turn). (b) Products, organisations
  and the course: AC215, AWS, S3, IAM, SageMaker, SageMaker AI, SageMaker Pipelines, Unified Studio, ECR, Lambda, Docker,
  Docker Hub, Docker Desktop, TensorFlow, TensorFlow Serving, Kubeflow, Vertex AI, Vertex AI Pipelines, Google Cloud, Cloud
  Run, GitHub, Git, Python, PyTorch, CUDA, Ubuntu, Debian, Linux, Mac, Apple Silicon, Intel, README, Cheese App, and the format
  and data names SavedModel, TFRecord(s), JSON, YAML, JPEG, RGB, DSL, ARN, URI, S3 URI, CSV (written .csv 文件). (c) A closed
  list of words Chinese engineers say in English in a lab section: from L1-L14 and the exam edition repo, clone, commit, pin,
  container, image, tag, Dockerfile, bucket, endpoint, entrypoint, pipeline, registry, notebook, release, label, epoch, shell,
  root, serverless, SDK, CLI, URL, URI, API, ID, IAM; new in L15 push (push 一个 image; the README''s Build & Push), upsert
  (the SDK call; 插入或更新 is stiff), stub (the S3 capture stub; 桩 is unknown in lab speech; ≠ 替身), socket (the mounted Docker
  socket), processor (the SDK''s Processor object, S14 only; ≠ 数据处理器). A word joins (c) only if lab speech really uses the
  English and the Chinese is stiff, ambiguous or collides with another term. Never English for flavour: user, role, policy,
  access key, key, credentials, token, region, domain, account, trust, signature, preprocessing, artifact, cache, step, property
  reference, edge, graph, orchestrator, workflow, processing job, training job, endpoint configuration (the configuration
  part), instance, model registry, stand-in, emulation, resolver, constraint and everything in A3-A7 are Chinese.'
- '[A2] container, image, registry, as L2-L14 and the exam edition. The subtitles say container, image, registry (起一个 container;
  同一个 image; 基础 image; 推理 image; ECR registry), measure word 个; titles, chapter names, meta.yaml and companion docs write
  容器, 镜像, 镜像仓库（registry） (A8). build → 构建 (at build time → 构建时; the plain build → 普通的构建; the unpinned build → 没 pin 的构建);
  push stays (A1 c: 构建并 push; push 到平台能拉取的 registry); pull → 拉取; tag stays (打 tag; Tag only adds a second name to the same
  image → 打 tag 只是给同一个 image 加第二个名字); the base image → 基础 image; the serving container / the AWS serving image → 负责推理的 container
  / AWS 的推理 image; the workflow container → workflow container; the CLI container → CLI container (written CLI 容器); the ECR
  repository → 仓库 / ECR 仓库 (≠ repo, A11); emulation → 模拟运行 (L13, L14); Intel style laptop → Intel 架构的笔记本; your laptop → 你的笔记本
  (never 电脑 alone); the Docker socket → Docker 的 socket; is mounted → 挂进来了 / 挂载 (L8); bind mount / the shared folder → 共享目录.'
- '[A3] The AWS identity words (new in the series; AWS''s Chinese console and docs, kept consistent with L3, L10, L14). IAM
  user → IAM 用户 (user → 用户: the users and roles you no longer need → 不再需要的用户和角色); role → 角色 (L14; IAM 角色; a role named SageMakerExecutionRole
  → 一个叫 SageMakerExecutionRole 的角色); policy → 策略 (three policies → 三个策略; the SageMaker and S3 policies → SageMaker 和 S3 的策略;
  the AWS-managed policy names are screen only); attach → 挂上; access key → 访问密钥 (Create access keys and save both → 创建访问密钥，两个都存好;
  deactivate → 停用); key → 密钥 (L1, L3, L14: the user key → 用户的密钥; your two keys → 你的两个密钥; a key on your laptop → 笔记本上的一把密钥;
  fake key → 假密钥; placeholder key → 占位密钥); credentials → 凭据 (L3: no credentials → 没有凭据; cannot find credentials → 找不到凭据);
  token → 令牌 (L10, L11, L14: the fake token → 假的令牌); ARN stays (A R N, en_display ARN; never 资源名称 in a subtitle); trusted
  by SageMaker → 信任 SageMaker; acts as the role → 以这个角色的身份运行 (L14''s runs as); signs each request → 给每个请求签名 (a verb, S03 only;
  ≠ the model''s 签名, A11); identity → 身份 (two identities → 两个身份; which identity → 哪个身份); account → 账号 (series and mainland
  form, A16; AWS''s console says 账户: the series wins; your account → 你的账号; account number → 账号 ID; the account lookup → 账号查询);
  the who am I call / check → 身份查询 / 身份检查 (en_display aws sts get-caller-identity); region → 区域 (L6, L14); domain → 域 (the
  SageMaker AI domain → SageMaker AI 域; a Unified Studio domain → 一个 Unified Studio 域); quick setup → 快速设置; the AWS console
  → AWS 控制台 / 控制台 (L14); console work → 控制台操作; billing → 结算 (an account with billing → 开通了结算的账号), the act → 计费 (bills → 在计费;
  still bill → 还在计费); a name of your own → 你自己的名字; unique across all of AWS → 在整个 AWS 里都是唯一的; never put keys in a script →
  永远不要把密钥写进脚本; option 1 / option 2 → 选项 1 / 选项 2 (the README''s two ways to supply keys); the exports → 那些 export (A1 a: export
  is the command); fall off at the wall → 到墙那里就掉了; rejects → 拒绝.'
- '[A4] The deployment words (Part 1; exam edition where it agrees). preprocessing → 预处理 (where does preprocessing happen
  → 预处理放在哪里做); the client → 客户端; resize → 缩放 (to 224 by 224 → 缩放到 224 乘 224); normalize → 归一化; converts to RGB → 转成 RGB; divides
  by 255 → 除以 255; decode → 解码; floats → 浮点数; raw photo / raw bytes → 原始照片 / 原始字节; a batch of JPEG strings → 一批 JPEG 字符串;
  signature → 签名 (exam; written 服务签名); the model''s front door → 模型的前门 (one picture word, S05 and S12); the serving default
  → serving default (A10); the signature change → 签名变化 / 签名的变化; the SavedModel format → SavedModel 格式; the graph → 计算图; named
  entry points → 有名字的入口 (≠ 入口点 and entrypoint, A11); weights → 权重; export → 导出; the tarball → tar 包 (L13); the artifact →
  产物 (模型产物; same code, different artifact → 代码一样，产物不同); deploy (the CLI step) stays as the SAY''s short name, the act → 部署;
  the SageMaker Model → 模型 (SageMaker 里的模型; a plain model → 一个普通的模型); endpoint configuration → endpoint 配置 (its configuration
  → 它的配置; written 端点配置（endpoint configuration）); endpoint stays (the address you call → 你要调用的地址); instance → 实例 (one instance
  of type ml.m5.xlarge → 一个 ml.m5.xlarge 类型的实例); timestamp → 时间戳; framework version → 框架版本; a model registry → 模型注册表 (exam''s
  written form); serverless stays (no server for you to manage → 不用你管服务器); billing around the clock → 全天候在计费; zero traffic
  → 流量是零; scale to zero → 缩容到零 (L14); a model endpoint / a general container service → 模型 endpoint / 通用的 container 服务; versioning
  → 版本管理; A B testing → A/B 测试; monitoring → 监控; roll back → 回滚; rule of thumb → 经验法则; probabilities → 概率; arg max → argmax;
  accuracy → 准确率; metrics file → 指标文件; index 0 → 索引 0; color channels → 颜色通道; a local stand-in → 本地替身 (L3, L14); the meter
  → 计价器 (L1, L14); turn off the meter → 关掉计价器; naming convention → 命名约定; delete → 删除 (the slides'' one word); angle brackets
  → 尖括号; redirection → 重定向; placeholder → 占位符.'
- '[A5] The build words (S04, S11-S14; L1''s vocabulary). Pipfile, Pipfile.lock and pipenv verbatim; the lock file → lock
  文件 (L1, never 锁文件); lock (the act) → 锁定 (locking and installing packages → 锁定依赖、安装包); pin stays (pinned to one version →
  pin 到一个版本; needs no pin → 不需要 pin; the unpinned build → 没 pin 的构建); star → 星号 (en_display "*"; the star problem → 星号的问题);
  a constraint, not a pin → 约束，不是 pin (L1); the resolver → 解析器; resolve → 解析; the newest release that installs → 能装上的最新版本;
  release (a PyPI release) → 发布版 (≠ a GitHub release, which stays release: S06); less than 3 → 小于 3 (en_display "<3"); fix
  1 / fix 2 → 修复 1 / 修复 2; two one-line fixes → 两处一行修复; swap them → 把两行对调 / 对调; comment out → 注释掉; rewritten package → 重写过的包;
  modules → 模块; the imports → 导入 (fail at import → 在导入时失败; at import time → 导入时); deprecation warnings → 弃用警告; ran out of
  disk → 磁盘满了; the help text → 帮助文本; the test flag → 测试参数 (flag → 参数, L14); about 4 gigabytes → 大约 4 GB; executable → 可执行的;
  the RUN line → RUN 那一行; exec format error stays.'
- '[A6] The workflow words (Part 2; exam edition and L13). stage → 阶段 (the four stages of the Cheese App); step → 步骤 / 一步
  (the README''s steps → 第 n 步); the collector / processor / training stages → 数据采集器 / 数据处理器 / 模型训练 (采集器 / 处理器 after the first
  mention in a block; Data collector, step 1 → 数据采集器，第 1 步); orchestrator → 编排器; workflow management → 工作流管理; repeatable →
  可重复; managed → 托管; cluster → 集群; scheduling → 调度; execute → 执行; automate → 自动化; this flow → 这个流程; a person at a terminal
  → 一个人守着一个终端; the entry point script → entrypoint 脚本 (L11, L13, L14: Docker''s slot) ; a switch → 开关; development mode /
  production mode → 开发模式 / 生产模式; a callable container → 可调用的 container (exam); a root shell → 一个 root shell; scrape → 抓取;
  zips them → 打成 zip 包; a duplicate finder → 查重工具 (never named); remove duplicates → 去重; split → 划分 (32 for training and 8
  for validation → 32 张训练、8 张验证); the duty cards → 职责卡片; search queries → 搜索词; local training → 本地训练; the last layer → 最后一层;
  outputs → 输出; classes → 类别; a target → 目标; the app user → app 用户; owner → 所有者; job: series form 任务 (L13, exam): a training
  job → 训练任务, a SageMaker Processing job → 处理任务, for every job → 给每个任务用, runs the job → 运行这个任务; the console labels Training
  jobs and Processing jobs stay; the SDK is your remote control → SDK 就是你的遥控器 (exam); a processor (the SDK object) → processor
  (A1 c, S14 only); its entry point (the Processor''s entrypoint argument) → 它的 entrypoint; the banner → 横幅; the bracket note
  → 方括号注释; the URI starts with a dot → URI 以一个点开头; or true → || true (D4); exits with zero → 以 0 退出 (L14).'
- '[A7] The pipeline words (S15; the exam edition''s vocabulary). pipeline stays (一条 pipeline; the whole pipeline → 整条 pipeline);
  step → 步骤 (five steps → 五个步骤; a processing step → 处理步骤; the model step → 模型步骤; the Lambda step → Lambda 步骤); the SageMaker
  step classes → SageMaker 的步骤类; property → 属性; reference → 引用; property reference → 属性引用 (never 字符串: Not a string: a reference
  → 不是字符串，而是一个引用); edge → 边 (draws an edge → 画出一条边); graph → 图; caching / cache → 缓存 (L8; for 30 days → 30 天); a declared
  output → 声明的输出; the list of steps → 步骤列表; the run order → 运行顺序; a schedule → 时间表 (≠ 调度, S10); the Kubeflow DSL → Kubeflow
  的 DSL; wired by dot output → 用 .output 连起来; compiled to YAML → 编译成 YAML; the JSON definition → JSON 定义; upsert stays (A1
  c; Upsert opens S15[7] capitalised as in the English); built offline and never sent → 离线生成、从没发出去; each edge a get on a property
  → 每条边都是对某个属性的一次 Get (Get as in the JSON); a Lambda, a small function AWS runs on demand → 一个 Lambda，也就是 AWS 按需运行的小函数; the
  deploy Lambda → 负责部署的 Lambda; creates or updates → 创建或更新; files travel by fixed names through the bucket → 文件按固定的名字经过 bucket
  传递; a green DeployModel → 绿色的 DeployModel; the Lambda asked → Lambda 发出了请求; in service → 进入服务状态 (InService on screen only);
  test each component → 测试每个组件 (≠ the exam''s kfp component); the factory / the recipe → 工厂 / 配方 (exam); triggers → 触发.'
- '[A8] Written vs spoken pairs. Subtitles say repo / clone / container / image / registry / bucket / endpoint / pipeline
  / push / upsert / stub; titles, chapter names, meta.yaml and companion docs write 仓库 / 克隆 / 容器 / 镜像 / 镜像仓库（registry）/ 存储桶
  / 端点（endpoint）/ pipeline / 推送 / upsert（插入或更新）/ 桩（stub）, with the English in brackets at the first use of a core concept
  (brackets are fine outside the narration): 端点配置（endpoint configuration）, 服务签名（serving signature）, 属性引用（property reference）,
