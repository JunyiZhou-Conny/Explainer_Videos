  aws sagemaker list endpoints → aws sagemaker list-endpoints (S09[5]). The English video''s own .srt is unaffected.'
- '[D5] Content parity. Each Chinese sentence translates its English sentence only: no added commands, flags, glosses, Chinese
  screen names or explanations; kept-English words get no Chinese explanation (the English line is right below); ponder questions
  get no answers (A14). Head words A9 needs (这个, 那个, 命令, 参数, 目录, 文件) carry no content. An extra in the English is 额外.'
- '[D6] Fixed patterns (L9-L14''s, extended). A tracker in the corner names the README step, and a yellow tag, your turn,
  means pause and run it. → 角落里的进度条标出 README 的哪一步，黄色的 your turn 标签表示暂停一下，自己跑一遍。 Pause and run it. → 暂停一下，跑一遍。 Pause and run
  yours. → 暂停一下，跑你的。 Pause and clone it. → 暂停一下，clone 下来。 Pause and make yours print it. → 暂停一下，让你的也打印出来。 Pause and make both
  fixes. → 暂停一下，把两处修复都做好。 Pause and run python cli.py dash dash deploy. → 暂停一下，跑 python cli.py --deploy。 pause here (for two
  small fixes) → 在这里暂停一下（，做两处小修复） Step n: → 第 n 步： Steps n and m → 第 n 步和第 m 步 Steps n to m → 第 n 到第 m 步 A small gap: / A
  small slip: → 有一个小疏漏： An extra listing → 额外列一下目录 Two extras: → 两个额外检查： Something to ponder. → 想一想。 With keys, … / With yours,
  … → 有密钥时，…… / 用你的密钥，…… Ours stops … → 我们的停在…… / 我们的马上就停了 Test yourself. → 自测一下。 at the time of recording → 录制时 Before you
  leave, clean up. → 走之前，先收尾清理。'
- '[D7] Files. narration/g1.yaml = S01-S09 (part 1: deploy one model, README A; 75 blocks, 210 sentences), narration/g2.yaml
  = S10-S16 (part 2: automate the workflow, README B; 64 blocks, 180 sentences), the parts of video.yaml; each starts with
  a comment header (what it covers, the rules it applies: A10 spoken forms of rejected artifacts, A12 printed vs paraphrased
  errors, D4 en_display, A14 ponders and errata, A17 the instructor rule, no say:/anchors) and keeps the script order. Strings
  in double quotes; YAML-escape a literal double quote or backslash (the en_display \"*\" and \"<3\").'
- '[D8] Length on the English timing. The Chinese is read while the English plays; the band switches where the English cues
  switch. Each Chinese sentence should read in about the time the English sentence is heard: at most about 2 units per English
  word (a Hanzi counts 1, a Latin letter 0.55), so drop redundant connectives and repeated subjects, never content. Long artifacts
  cost length too (CheeseAppSageMakerExecutionRole 17.6 units, CheeseAppLambdaExecutionRole 15.4, SageMakerExecutionRole 12.1,
  cheese-app-endpoint 10.5, Unified Studio 7.7, SageMaker Pipelines 10.5, Unable to locate credentials 15.4): don''t repeat
  them where the English doesn''t; after the first mention use a short reference (这个角色, 这个 endpoint, 这个任务, 它).'
- '[D9] Keep the English clause order (a series lesson, ac215-video skill). The toolkit pairs Chinese and English clause by
  clause, so a Chinese sentence that puts a condition first when the English puts it last swaps meaning between two neighbouring
  cues. Conditions, purposes and time adverbials sit where the English has them: Don''t go on until they do → 别急着往下走，等它们打印出来再说;
  With your keys, it creates the bucket, or reuses yours if it already exists → 有你的密钥时，它会创建 bucket，如果已经存在，就复用你的; create a
  bucket with a name of your own, because bucket names are unique → 用你自己起的名字建一个 bucket，因为 bucket 名……都是唯一的; You ran four commands
  by hand to deploy one model → 你手动跑了四条命令，部署了一个模型; It is still one machine, billing around the clock, even with zero traffic
  → 它仍然是一台机器，全天候在计费，哪怕流量是零. Where the English opens with if, with, without, before or when (S04[10], S06[2], S13[4], S14[0],
  S15[11]), the Chinese does too.'
- '[G1] Widths. Bilingual band: a Chinese line holds at most 30 units, the English line 96 characters; the Chinese-only sidecar
  (.zh.srt) holds 22 units a line, 2 lines a cue. Write clauses of at most about 24 units, separated by ，；：、, so the splitter
  has clean places to cut; avoid a clause longer than 30 units with no punctuation. Give the long role names and printed messages
  a clause of their own; the long S01[2], S02[6], S03[5], S07[3], S10[8], S13[3] and S15[4] sentences get a comma at every
  English clause break.'
- '[G2] Cue endings: the toolkit drops a cue-final 。，、；： and keeps ？！…… and a closing ” (subtitles.strip_end). Do not end
  a sentence on an artifact plus a full stop if a Chinese word can close it (……写进两个真实的 TFRecord 文件。 reads better than ……TFRecord。);
  printed messages (exec format error, AWS not configured, Unable to locate credentials) may close a sentence as the English
  does.'
- '[G3] Never split a name or a command. The splitter treats a space between two Latin words in a Chinese line as a good cut,
  so SageMaker Pipelines, Unified Studio, TensorFlow Serving, Docker Desktop, Docker Hub, Training jobs, Processing jobs,
  ML Pipelines, sh docker-shell.sh, python cli.py --prepare, aws configure, aws sagemaker list-endpoints, exec format error
  or Unable to locate credentials could land on two lines. Put such names at the end of a clause, after a full-width colon
  or 、, with little Chinese around them, at most one long name per cue, and check every such cue in the rendered .zh.srt.'
- '[H1] Titles (meta.yaml). Video, part and chapter titles in the written register (A8: 容器, 镜像, 仓库, 存储桶, 端点, 端点配置, 镜像仓库, 服务签名,
  属性引用, 处理任务); questions keep their question mark; the English colon structure is kept (--prepare：tar 包里的 SavedModel; --delete：关掉计价器);
  commands, flags and names stay as they are (--prepare, --deploy, --predict, --delete, ECR, SageMaker); meta.yaml is not
  checked, so brackets are fine there. The video title follows the series pattern AC215 · 第 n 讲：…（跟练：…）and agrees in substance
  with video.yaml''s publish.title_zh (ML 工作流：在 AWS SageMaker 上部署模型，再用 SageMaker Pipelines 自动化整条流程); the part titles name
  README A and README B''s repos. ML Workflows → 机器学习工作流 (the exam edition''s Vertex AI 上的机器学习工作流 names the lecture; this
  video follows AWS, so the title says SageMaker). Core-concept chapters carry the English short name once for search where
  the Chinese is not the usual search word (端点配置（endpoint configuration）, 服务签名（serving signature）, 属性引用（property reference）,
  处理任务（Processing job）). The recap chapter keeps the series'' 收尾 pattern. No title names the instructor (A17).'
- '[H2] Description (Bilibili / YouTube): two or three sentences, written register, this glossary''s terms: the AC215 lecture
  15 follow-along, slide by slide, of dlops-io/model-deployment-aws (README A @ 077f4db) and dlops-io/ml-workflow-aws (README
  B @ f165c6e), with the slides'' Vertex AI words mapped onto AWS; what the viewer does and learns (part 1: IAM user, access
  key, execution role and S3 bucket, the two one-line fixes, where preprocessing sits and the serving signature, --prepare''s
  SavedModel in model.tar.gz, --deploy''s model, endpoint configuration and endpoint, --predict''s 150,528 numbers, --delete
  and the endpoint it misses; part 2: the collector, processor and trainer containers by hand, pushing to your own ECR, a
  Processing job from the workflow container, the five-step SageMaker Pipeline drawn by property references, caching and the
  deploy Lambda, clean-up); English narration with Chinese and bilingual subtitles; a recording machine without an AWS account
  (cloud steps up to their first real error, cloud answers from the README''s record or a tagged local stand-in, never faked),
  billable resources in the viewer''s account (gold tags, a clean-up checklist). Consistent with video.yaml''s publish.description_zh,
  but never a person''s name (A17).'
- '[H3] Companions: i18n/zh/README.md (and exercises.md / digest.md if made) are translated with this glossary in the written
  register (A8); brackets and underscores are fine there (not checked). Headings and <summary>答案</summary> are translated.
  A term table at the end: English | the term used here | common variants (IAM user: IAM 用户 / IAM 使用者; role: 角色; policy: 策略
  / 权限策略; access key: 访问密钥 / AK/SK; endpoint: 端点 / 终端节点; endpoint configuration: 端点配置 / 终端节点配置; signature: 服务签名 / 签名; preprocessing:
  预处理; model artifact: 模型产物 / 模型工件; caching: 缓存; property reference: 属性引用; Processing job: 处理任务 / 处理作业; training job: 训练任务
  / 训练作业; orchestrator: 编排器; upsert: upsert / 插入或更新; registry: 镜像仓库 / 注册表; constraint: 约束; resolver: 解析器 / 依赖解析器).'
- '[H4] Code and commands stay byte-identical in the companions: code blocks, commands, file names and inline `code` are unchanged;
  only # comments and the prose around them are translated.'
- '[I1] (request, open since L3) explainer.i18n check applies its voice hygiene (_SPOKEN_BAD: brackets, maths symbols, letter_letter
  names, the 种 rule) to the display line when a sentence has no say:. For a subtitles-only video (this series; video.yaml
  has no languages.zh.voice and this glossary says voice: none) those checks guard nothing and force A10 and B3 (here: --data_collector,
  endpoint_config.json, saved_model.pb, serving_default, get_execution_role, "*", "<3", ×). Proposal: skip _SPOKEN_BAD for
  display-only sentences when the glossary''s voice is none (keep the Latin-word, spacing and sentence-end checks).'
- '[I2] (todo, from L1 I3) explainer/subtitles.py''s _cuts treats a space between Latin words in a Chinese line as a good
  cut, so console labels, product names and commands can be split (G3). Proposal: in a Chinese line, treat a run of Latin
  tokens separated only by spaces as unbreakable unless it alone exceeds a line.'
- '[I3] (note) explainer/subtitles.py reads every video''s glossary.yaml: the 2-3 word English alternatives of each term''s
  en field are kept on one English line, and the 2-7 character Chinese headwords of zh_subtitle are registered in jieba, in
  every video''s subtitles. The en and zh_subtitle fields of this file therefore list real terms only (no sentences); example
  phrases live in first_use and note.'
