# Bilibili metadata for the release (tools/release_episode.py → PUBLISH.json → the Mac publish worker)
publish:
  title_zh: "AC215 第15讲跟练 · ML 工作流：在 AWS SageMaker 上部署模型，再用 SageMaker Pipelines 自动化整条流程"
  description_zh: |
    哈佛 AC215（MLOps & LLMOps，2026 秋）第 15 讲（ML Workflows with Vertex AI）教程的逐条命令跟练。课件讲的是 Vertex AI，本视频跟着课程的 AWS 版教程做，并逐一对照两边的名词。
    上半场照着 dlops-io/model-deployment-aws 的 README：IAM user、access key、SageMaker execution role 和 S3 bucket，用 aws configure 配置凭证，
    构建 CLI 容器时遇到的两处今天才有的问题（arm64 构建行和未固定版本的 sagemaker 解析成 SDK 3）以及两行修复；
    看清 --prepare 产出的 SavedModel、版本文件夹 1/ 和 model.tar.gz，预处理放在客户端还是模型里（serving signature），
    --deploy 创建的 Model、endpoint configuration 和 endpoint，--predict 每张照片发送的 150,528 个数字，以及 --delete 漏掉的 endpoint。
    下半场照着 dlops-io/ml-workflow-aws：从四个人守着四个终端到一条自动化 workflow，手动运行 data collector、data processor 和 model training 三个容器，
    把镜像推到自己的 ECR，在 workflow 容器里提交 SageMaker Processing job，最后读懂由 property reference 连成的五步 SageMaker Pipeline：缓存、Lambda 部署和数据在 bucket 里怎样流动。
    本次录制没有 AWS 账号：本地步骤全部真实运行，云端调用停在真实的第一个报错处，云端结果只用 README 的记录或明确标注的本地替代展示，从不伪造。
    边看边暂停，在自己的电脑上跑每一条命令；本讲的 endpoint、训练和处理任务会产生实际费用，视频用金色标签标出每个计费点（不写具体金额，请以官方价格页为准），结尾有完整收尾清单。
    英文旁白，中英双语字幕。

    教程仓库：https://github.com/dlops-io/model-deployment-aws
    教程仓库：https://github.com/dlops-io/ml-workflow-aws
    学习笔记（全部命令、真实输出和练习答案）：https://github.com/JunyiZhou-Conny/MLOps_Learning/blob/main/guides/L15-vertex-ml-workflows.md

    课程与教程内容来自 Harvard AC215 课程组（Pavlos Protopapas 等）；本视频是个人学习用的非官方讲解，引用课件只注明页码，不展示课件。
  tags_zh: [AC215, MLOps, AWS, SageMaker, SageMaker Pipelines, 模型部署, 机器学习工作流, Docker, 哈佛, 教程跟练]
  tid: 231
