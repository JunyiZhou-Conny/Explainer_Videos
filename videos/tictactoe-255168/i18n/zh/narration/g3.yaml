# Chinese narration for S07, S08, S09 (group g3) of tictactoe-255168.
# One Chinese sentence per English sentence (explainer.voice.split_sentences); glossary: ../GLOSSARY.md.
# say: only where the voice must differ from the subtitle (2 before 条 -> 两, rule F2).
# anchors map mid-sentence vo.wait_until / vo.until phrases of the scene code to the Chinese words
# spoken at that moment (each target is unique in its entry, because time_of takes the first match).
# No en_display: the SAY lines already write numbers as digits and "nine factorial" in words (C2).

S07:
- en: "A great way to understand a program is to break it on purpose. Pause and ponder: what do you think happens if we delete the undo line?"
  zh:
  - "想弄懂一个程序，有个好办法：故意把它改坏。"
  - "暂停想一想：如果删掉“撤销”那一行，你觉得会发生什么？"
  anchors:
    "break it on purpose": "故意把它改坏"
    "delete the undo line": "删掉“撤销”那一行"

- en: "The program prints just 3. Without undo, nothing ever gets erased. The program plays one game, filling the squares in order, until X makes a diagonal on move 7. That's 1. Then it tries X's other choices, but the old X is still there. X lands on the bottom-middle square, and the old diagonal counts as a win again: that's 2. Then the bottom-right square: that's 3. Now the board is full, so there's nothing left to try."
  zh:
  - "程序只输出 3。"
  - "没有了撤销，什么都不会被擦掉。"
  - "程序先下一局，按顺序一格一格地填，直到 X 在第 7 步连成一条对角线。"
  - "这是第 1 局。"
  - "接着它去试 X 的其他下法，可是原来那个 X 还在。"
  - "X 下在下边中间那格，原来那条对角线又算赢了一次：这是第 2 局。"
  - "然后是右下角那格：第 3 局。"
  - "现在棋盘满了，再也没有可以试的了。"
  # "That's 1 / 2 / 3" is the counter going up: ordinals 第 N 局 (算 2 局 would read "counts as 2 games");
  # edge reads 第 2 局 as the ordinal 第二局, so no say: is needed.
  anchors:
    "until X makes": "直到 X"
    "but the old X": "可是原来"
    "and the old diagonal": "原来那条对角线"
    "that's 2": "第 2 局"
    "that's 3": "第 3 局"

- en: "Now put undo back, and delete the winner check instead, so games only stop when the board is full. Pause and predict the answer."
  zh:
  - "现在把“撤销”那一行放回去，改成删掉“判断输赢”，这样对局要等棋盘满了才会停。"
  - "暂停一下，先猜猜答案。"
  anchors:
    "and delete the winner": "改成删掉"
    "so games only stop": "这样对局"

- en: "362,880. That's nine factorial! Without the winner check, the program keeps playing after a win, so it counts all the ghost games. It rediscovered our very first count."
  zh:
  - "362,880。"
  - "这正是 9 的阶乘！"
  - "没有了判断输赢，程序在有人赢了之后还会接着下，所以它把所有幽灵对局都算进去了。"
  - "它自己又找回了我们最早算出的那个数。"
  anchors:
    "so it counts all": "所以它把"

S08:
- en: "Now let's put every line back and run the real program. After a moment, it prints 255,168."
  zh:
  - "现在，我们把每一行都放回去，运行真正的程序。"
  - "过了一小会儿，它输出了 255,168。"
  anchors:
    "put every line back": "把每一行都放回去"
    "it prints": "它输出了"

- en: "Let's split that total by when each game ends. 1,440 end on move 5, and 5,328 on move 6, the same numbers we found by hand. Then the bars shoot up: about 48 thousand end on move 7, and 73 thousand on move 8. Just over half of all games use all 9 moves: about 82 thousand X wins, plus 46,080 draws. Together, that's 255,168."
  zh:
  - "我们按对局在第几步结束，把这个总数拆开来看。"
  - "1,440 局在第 5 步结束，5,328 局在第 6 步结束，和我们手算的结果一样。"
  - "然后柱子一下子升高了：约 4.8 万局在第 7 步结束，7.3 万局在第 8 步结束。"
  - "有一半多一点的对局会下满 9 步：约 8.2 万局是 X 赢，还有 46,080 局是平局。"
  - "加起来就是 255,168。"
  anchors:
    "and 5,328": "5,328 局"
    "the same numbers": "和我们手算"
    "about 48": "约 4.8 万"
    "and 73": "7.3 万"
    "Just over half": "一半多一点"
    "about 82": "约 8.2 万"
    "plus 46,080": "还有"

- en: "And here's how it connects to nine factorial. Remember, nine factorial counted each game that ends on move 5 a total of 24 times, once for each ghost ending. A game ending on move 6 was counted 6 times, and on move 7, twice. Games that end on move 8 or 9 have at most one empty square, so they were counted just once. Multiply each bar by its number, add them up, and you get exactly nine factorial again."
  zh:
  - "再来看看，这和 9 的阶乘有什么关系。"
  - "还记得吗，9 的阶乘把在第 5 步结束的每一局，都算了 24 次，每个幽灵对局算一次。"
  - "在第 6 步结束的一局被算了 6 次，在第 7 步结束的，算了两次。"
  - "在第 8 步或第 9 步结束的对局，最多只剩一个空格子，所以它们只算了一次。"
  - "把每根柱子乘上各自被算的次数，再全部加起来，正好又是 9 的阶乘。"
  anchors:
    "connects to nine": "9 的阶乘"
    "each game that ends": "第 5 步结束"
    "24 times": "24 次"
    "once for each ghost": "每个幽灵对局"
    "and on move 7": "在第 7 步"
    "so they were counted": "所以它们"
    "add them up": "再全部加起来"
    "and you get exactly": "正好又是"

- en: "Who wins the most games? X wins 131,184 of them, O wins 77,904, and 46,080 are draws. X wins in more than half of all possible games, because going first gives X more chances to win."
  zh:
  - "谁赢的对局最多？"
  - "X 赢了 131,184 局，O 赢了 77,904 局，还有 46,080 局是平局。"
  - "在所有可能的对局里，X 赢的超过一半，因为先走让 X 有更多机会赢。"
  anchors:
    "O wins": "O 赢了"
    "and 46,080": "还有"
    "because going first": "因为先走"

- en: "One last puzzle. Which first move for X leads to the most different games: a corner, an edge, or the center? Pause and guess."
  zh:
  - "最后一道题。"
  - "X 的第一步下在哪儿，能下出的不同对局最多：角上、边上，还是中心？"
  - "暂停一下，猜一猜。"
  anchors:
    "first move for X": "第一步"
    "a corner": "角上"
    "an edge": "边上"
    "or the center": "还是中心"

- en: "Surprise: the edge, with 29,592 games. Each corner gives 27,732, and the center the fewest, just 25,872. Why? The center sits on 4 winning lines, a corner on 3, and an edge on just 2. More lines give X more chances to win early, on move 5 or 7, and every early win chops whole branches off the tree."
  zh:
  - "没想到吧：答案是边格，也就是每条边正中间的那一格，有 29,592 种对局。"
  - "每个角格有 27,732，而中心最少，只有 25,872。"
  - "为什么？"
  - "中心在 4 条获胜线上，角格在 3 条上，而边格只在 2 条上。"
  - "线越多，X 越有机会在第 5 步或第 7 步提前赢，而每一次提前赢，都会从树上砍掉一大片分支。"
  say:
  - null
  - null
  - null
  - "中心在 4 条获胜线上，角格在 3 条上，而边格只在两条上。"
  - null
  # the zh-only beat in s08_answer: the four edge squares light up while 边格 is glossed, and the
  # count is pointed at when it is finally said (the English says it right after "the edge")
  anchors:
    "with 29,592": "也就是"
    "29,592 games": "有 29,592"
    "and the center the fewest": "而中心最少"
    "a corner on 3": "角格在 3 条"
    "an edge on just 2": "而边格"
    "and every early win": "而每一次提前赢"

- en: "But careful: more games doesn't mean a better move. Out of all the games that start in the center, X wins about 6 in 10. Starting on an edge, X wins fewer than half."
  zh:
  - "但要小心：能下出的对局多，不代表这一步更好。"
  - "在所有先下中心的对局里，X 每 10 局大约赢 6 局。"
  - "先下边格的话，X 赢不到一半。"

S09:
- en: "So does going first mean X always wins? No. A computer can do more than count. It starts at the bottom of the tree, where every game is finished, and works upward. At every branch it picks the best move: best for X on X's turns, and best for O on O's turns. Doing that, it has solved tic-tac-toe: if both players play perfectly, every game ends in a draw. So every one of X's wins needs a mistake by O somewhere."
  zh:
  - "那么，先走的 X 是不是总能赢？"
  - "不是。"
  - "电脑能做的，不只是统计对局。"
  - "它从树的最底下开始，那里每一局都已经下完，然后一层一层往上推。"
  - "每到一个分支，它都挑最好的一步：轮到 X 时挑对 X 最好的，轮到 O 时挑对 O 最好的。"
  - "这样一来，它就把井字棋彻底算透了：如果双方都不失误，每一局都会是平局。"
  - "所以 X 赢下的每一局，都少不了 O 在某一步的失误。"
  say:   # 的时候: in 轮到 X 时 the ASR loop heard the X as 某
  - null
  - null
  - null
  - null
  - "每到一个分支，它都挑最好的一步：轮到 X 的时候挑对 X 最好的，轮到 O 的时候挑对 O 最好的。"
  - null
  - null
  anchors:
    "and works upward": "然后一层一层"
    "best for X": "轮到 X 时"
    "and best for O": "轮到 O 时"
    "if both players": "如果双方"
    "every game ends": "每一局都会"

- en: "Could we do the same for chess? Not a chance. In 1950, the mathematician and engineer Claude Shannon estimated that chess has at least 10 to the power of 120 possible games. That's a 1 followed by 120 zeros! The whole observable universe has only about 10 to the power of 80 atoms."
  zh:
  - "国际象棋也能这样算吗？"
  - "完全不可能。"
  - "1950 年，数学家兼工程师克劳德·香农估计，国际象棋至少有 10 的 120 次方种可能的对局。"
  - "那可是 1 后面跟着 120 个零！"
  - "而我们能观测到的整个宇宙，也只有大约 10 的 80 次方个原子。"
  anchors:
    "Claude Shannon": "克劳德·香农"
    "at least 10": "至少有"

- en: "So chess programs can't explore every branch. They look only so many moves ahead, then estimate who's winning, using what they learned from millions of practice games. But underneath, it's the same idea you just learned: a tree of moves, explored one branch at a time."
  zh:
  - "所以，国际象棋程序没法探索每一个分支。"
  - "它们只往后看几步，再估计谁更有希望赢，靠的是从几百万局练习中学到的经验。"
  - "但说到底，思路和你刚学的一样：把走法排成一棵树，一个分支一个分支地探索。"
  anchors:
    "then estimate": "再估计"
    "using what they": "靠的是"

- en: "Let's recap. Multiplying the choices gives nine factorial, 362,880 orders. But games stop when someone wins, so many of those orders are ghost games. And a short recursive program counts every real game by trying a move, exploring, and undoing it. The answer is exactly 255,168."
  zh:
  - "我们来小结一下。"
  - "把每一步的选择数乘起来，就得到 9 的阶乘，一共 362,880 种顺序。"
  - "但只要有人赢，对局就会停下，所以这些顺序里有很多都是幽灵对局。"
  - "而一段短短的递归程序，先试走一步，往下探索，再撤销，就把每一局真实对局都统计了一遍。"
  - "答案正好是 255,168。"
  anchors:
    "gives nine factorial": "9 的阶乘"
    "362,880 orders": "362,880"
    "ghost games": "幽灵对局"
    "by trying a move": "先试走一步"
    "and undoing it": "再撤销"
    # zh-only beat in s09_bigger (the method comes first here, the counting after it)
    "counts every real": "就把每一局"

- en: "Now it's your turn. Change the program so it counts only the games X wins, or only the games that end on move 7, or see what happens if O goes first. The program and the challenges are linked in the description. Have fun exploring!"
  zh:
  - "现在，轮到你了。"
  - "改一改程序，让它只统计 X 赢的对局，或者只统计在第 7 步结束的对局，或者看看如果 O 先走会怎样。"
  - "程序和挑战题的链接都在视频简介里。"
  - "动手去探索吧！"
  anchors:
    "or only the games": "或者只统计"
    "or see what happens": "或者看看"
    "if O goes": "如果 O"
