# The "?!" corner tags on squares 7 and 8 stay half-width (no entry), a deliberate exception to B2
# under E1 (fit the English box): corner_tag() centres the tag 0.34 cell right of the square's
# centre, and a full-width ？！ (0.47 wide vs 0.26 at 26 pt) puts its ！ on the far side of the grid
# line between squares 7 and 8 (checked in a test render). Like the caution sign's "!", it is a symbol.
"board full": "棋盘满了"
