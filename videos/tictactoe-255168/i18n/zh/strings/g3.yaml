"edge": "边格"
"center": "中心"
"each corner": "每个角格"
"each edge": "每个边格"
"(4 corners)": "（4 个角格）"
"(4 edges)": "（4 个边格）"
"(1 center)": "（1 个中心）"
# card wording 角格、边格 = the board labels shown under it (E1); the spoken question keeps 角上、边上
"Which first move for X leads to the MOST different games:\ncorner, edge, or center?": "X 的第一步下在哪儿，能下出的不同对局最多：\n角格、边格，还是中心？"
# the card's capitalised MOST: s08_answer finds this word in the translated card and colours it
