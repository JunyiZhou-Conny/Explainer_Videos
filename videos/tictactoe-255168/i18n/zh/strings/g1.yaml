"re:ghost endings counted: (\\d+)": "幽灵对局计数：\\1"
"re:orders shown: (\\d+)": "已列出的顺序：\\1"
"re:places for first O: (\\d+)": "第一个 O 的放法：\\1"
"re:places for second O: (\\d+)": "第二个 O 的放法：\\1"
"count each real game": "每一局真实对局"
"only once": "只算一次"
"X's 3rd mark: move 5": "第 3 个 X：第 5 步"
"X's 3rd mark": "第 3 个 X"          # t2c key of the line above (E3), keeps X_COLOR
# ponder card: card_lines() asserts exactly 4 lines (question + 3 hints)
"How many games end with X winning on move 5?\nHint: (1) Which line?\n(2) In what order does X fill it?\n(3) Where can O's 2 marks go?": "X 在第 5 步赢下的对局有多少种？\n提示：（1）哪条线？\n（2）X 按什么顺序填？\n（3）2 个 O 能放在哪儿？"
"(1) Which line?": "（1）哪条线？"
"(2) In what order does X fill it?": "（2）X 按什么顺序填？"
"(3) Where can O's 2 marks go?": "（3）2 个 O 能放在哪儿？"
"\\text{ lines}": "\\text{ 条线}"
"\\ \\ \\text{games}": "\\ \\ \\text{种}"   # the English spacing (B1): 种 clears the box around 1,440
