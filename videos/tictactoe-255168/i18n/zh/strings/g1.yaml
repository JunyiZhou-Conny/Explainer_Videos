# ------------------------------------------------------------------ S01 · s01_hook.py
"How many different games of tic-tac-toe?": "井字棋有多少种不同的对局？"
"same board, different order  →  different games": "棋盘一样，顺序不同  →  不同的对局"
"turned board  →  a different game too": "旋转过的棋盘  →  也是不同的对局"
"Pause and ponder": "暂停想一想"
"How many different games of tic-tac-toe are there?\nWrite down a guess!": "井字棋一共有多少种不同的对局？\n把你猜的数写下来！"
# the two guesses (no English words, so not in the package; glossary S01 labels: 100？/ 100 万？)
"s01_hook|100?": "100？"
"s01_hook|1,000,000?": "100 万？"
