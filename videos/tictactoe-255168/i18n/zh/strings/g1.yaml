# ------------------------------------------------------------------ S03 · s03_stop.py
"X wins on move 5": "X 在第 5 步赢了"
"never played": "从没下过"
"orders to fill all 9 squares": "填满 9 个格子的顺序"
"orders to fill the 4 empty squares": "填满 4 个空格子的顺序"
# two Text objects, translated as a pair (E4); tag2[0:2] must stay the glyphs of "24"
"this 1 game was counted": "这 1 局被算了"
"24 times in 362,880": "24 次（在 362,880 里）"
"ghost games": "幽灵对局"
"made-up moves after someone already won": "有人赢了之后编出来的走法"
