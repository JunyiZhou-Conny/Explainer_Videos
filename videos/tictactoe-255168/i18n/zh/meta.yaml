# explainer/build.py --lang zh): video title, chapter titles keyed by scene file stem, and the
# Bilibili / YouTube description. Title and chapters are the ones decided in GLOSSARY.md (rule H1 and
# the row 'chapter titles and video title'): 种 when counting distinct games (A8), 9 的阶乘 rather than
# 9! (B3), 只改一行代码 (行 is always code, A10), 是怎么来的 matching the hook label. The glossary gives no
