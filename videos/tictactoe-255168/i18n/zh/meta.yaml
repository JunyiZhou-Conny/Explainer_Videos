# titles are plain Chinese. video.yaml defines no parts, so there are no part titles.
title: "井字棋为什么恰好有 255,168 种对局？"

chapters:
  s01_hook: "到底有多少种对局？"
  s02_fill: "填满棋盘：9 的阶乘"
  s03_stop: "对局会提前结束"
  s04_messy: "手算越来越乱"
  s05_board_code: "教电脑学规则"
  s06_explore: "探索每一局"
  s07_experiments: "只改一行代码"
