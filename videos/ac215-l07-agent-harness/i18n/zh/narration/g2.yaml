# zh narration for S08-S16 (part 2, group g2: the harness takes control — act 3's workflow, approval and checkout,
# act 4's planner, compaction and memory, act 5's skills, act 6's agent system, evaluation, tear-down and recap),
# sentence-aligned to script.md v2: one zh sentence per English sentence (explainer.voice.split_sentences; 87 SAY
# lines, 191 sentences). Terms and rules: ../GLOSSARY.md, ../glossary.yaml (binding); where the glossary gives a
# first-use sentence for a line of this part, that sentence is used as written.
# Subtitles only: there is no Chinese voice in this series, so no say: and no anchors (rule D2); the zh line is
# shown on the English timing, so each sentence keeps the English order of ideas and about its length (D8, D9:
# S09[2] keeps 哈希 before the list, S09[3] puts 批准要算数 before its conditions, S12[5] keeps the refusal before
# 直到……为止, S14[4] lists the events in the English order, S15[2] and S16[6] keep the condition where the English
# has it).
# Underscore names and code expressions are written the way the SAY speaks them (rule A6: approval mode 设为 always
# require, build act 4, get stock, load skill, read skill resource, start order, get order status, assess event,
# harness without trace, propose cart); no brackets and no symbols the checker refuses (B2, B3). Numbers as on
# screen, without thousands separators (C1: 1000, 1200, 3000, 1400, 1600, 15000, 16000, 2400); numbers the SAY says
# as words in Hanzi (C1: 十二条, 三次, 五层, 六次加载, 四次运行, 五个反思问题); money in 美元 (C2: 220.80 美元,
# 50.10 美元, 200 美元的门槛). Printed outcomes as printed (A9: UNRESOLVED, BLOCKED, DECLINED, status 为 saved,
# 状态 placed, status 为 error, Invalid or unauthorized). Commands sit at the end of a clause, after a full-width
# colon (G3: python cli.py --help); the long act 3 and act 6 commands are named as the SAY names them (第 3 幕，
# standard 场景).
# Sentences never open with an artifact or a lower-case kept-English word (A5: 这个 --inspect-run……, 用 docker
# image rm……, 你笔记本上的 outputs 目录……, 比较只在……, 下单的证据……, 全部 4 次运行……). The ponder lines (S09[6],
# S11[2], S12[6]) give nothing away (A9). The customers are 第一位 / 第二位顾客 only; no ID or name appears (A10).
# en_display: the English subtitle line where the SAY spells an artifact as words (rule D4: --fixture, $50.10,
# $220.80, $200 threshold, approval_mode="always_require", status: saved, email transmitted: no, build_act4,
# tasting-planning / vendor-outreach, get_stock, load_skill, read_skill_resource, start_order, get_order_status,
# assess_event, status: error, --inspect-run, manager-approval, approval.requested … run.finished, model.failed,
# context-fixture-1, --prompt-file, python cli.py --help, --rm, docker ps -a, docker image rm, CartCheck,
# harness.without("trace")); null = the SAY text.
# Self-check (2026-10-21): all 191 sentences run through explainer.subtitles.tracks(timing="en") on an estimated
# English timing (2.9 words/s, no renders yet): S08[6], S10[5], S11[3], S12[0], S12[7], S13[3], S13[8], S14[0],
# S14[4], S16[3], S16[4] and S16[5] were reworded so each band piece sits over its own English clause and no
# piece starts a sentence with a lower-case artifact (S14[4] lists the last three events with 、, since the English
# comma after policy.decision allow reads as a list comma). No command is split across .zh.srt lines. Repeat the
# check on the rendered timing before publishing.
# Proofread (2026-10-21, subtitles step 3) against script.md, digest.md and the captures: S08[4] the live model may
# fix it (可能会), S10[4] the setting belongs to the save tool and stays on one .zh.srt line, S11[3] the capsule holds
# the request including the allergy, S12[2] the agent runs the scripts in the folder, S13[4] 分清 for tell apart,
# S16[4] it is the key that stays out of files, commits and shell history; glossary first_use examples synced.
S08:
- en: "Part 2 picks up at the container prompt; if you closed it, rerun the setup and set your key. Remember the move-right arrow: when stakes are high, actions can't be undone, the task is predictable, or you need an audit, give control to code."
  zh:
  - "第二部分从 container 的提示符接着来；如果你把它关了，就重新跑一遍准备步骤，再设置好你的密钥。"
  - "回想一下往右移的那个箭头：风险高、操作无法撤销，任务可预测或者需要审计的时候，就把控制权交给代码。"
- en: "Act 3 does exactly that. The order route is a graph, and Python owns its edges. Confirm, propose, validate, and back to propose only if the report fails, at most twice; then pairings, manager review when required, revalidate and place. Only one node belongs to the model: propose cart, with no tools."
  zh:
  - "第 3 幕做的正是这件事。"
  - "下单路线是一张图，它的边归 Python 管。"
  - "确认、提议、校验，只有报告不通过才退回提议，最多两次；然后是搭配、需要时经理审核，最后重新校验并下单。"
  - "只有一个节点归模型：propose cart 节点，不带任何工具。"
- en: "The README files this under the harness; on the lecture's autonomy spectrum, it sits near structured output: a fixed graph with one model step."
  zh:
  - "README 把它归在 harness 下面；在课上的自主性光谱上，它靠近结构化输出：一张固定的图，只有一步交给模型。"
- en: "Step 1: act 3, scenario standard. With a key, the model proposes quantities; code does the rest: transitions, pricing, validation, placement. Success is a receipt."
  zh:
  - "第 1 步：第 3 幕，standard 场景。"
  - "有密钥的话，模型提议数量；其余的都由代码来做：流转、定价、校验、下单。"
  - "成功就是一张回执。"
- en: "Steps 2 and 3 are the shipping lesson, with a customer's own cart: Comté, Bûcheron and Époisses, to Pennsylvania. Before, the model only records the cart; the harness checks it and stops. After, the revise loop opens, and the live model may fix it."
  zh:
  - "第 2、3 步是运输这一课，用的是一位顾客自己的购物车：Comté、Bûcheron 和 Époisses，寄往宾夕法尼亚。"
  - "改之前，模型只记录购物车；harness 检查它，然后停下。"
  - "改之后，修订循环打开了，在线模型可能会修正它。"
- en: "As an extra, dash dash fixture runs the same path offline, with a script in the model's seat. Attempt 1 has raw-milk Comté, and the rail sends it back; attempt 2 swaps in Taleggio: valid, 50 dollars 10."
  zh:
  - "额外再跑一个：--fixture 离线走同一条路线，模型的位置上坐的是一个脚本。"
  - "第 1 次尝试里有生乳的 Comté，轨道把它退了回去；第 2 次换成 Taleggio：有效，50.10 美元。"
  en_display:
  - "As an extra, --fixture runs the same path offline, with a script in the model's seat."
  - "Attempt 1 has raw-milk Comté, and the rail sends it back; attempt 2 swaps in Taleggio: valid, $50.10."
- en: "One trap: with fixtures, the blocked scenario proposes the same cart three times and ends unresolved, not blocked, so in Colab keep fixtures off for this lesson. Pause and run steps 1 to 3."
  zh:
  - "有个坑：用 fixture 时，blocked 场景会把同一辆购物车一连提议三次，最后是 UNRESOLVED，不是 BLOCKED，所以在 Colab 里，这一课要把 fixture 关掉。"
  - "暂停一下，把第 1 到第 3 步跑一遍。"
  en_display:
  - "One trap: with fixtures, the blocked scenario proposes the same cart three times and ends UNRESOLVED, not BLOCKED, so in Colab keep fixtures off for this lesson."
  - null
S09:
- en: "Step 4 is scripted, so approval is predictable: 60 guests in New York, a valid cart at 220 dollars 80, above the 200 dollar threshold."
  zh:
  - "第 4 步是脚本模拟的，所以审批结果可以预期：纽约 60 位客人，一辆有效的购物车，220.80 美元，超过了 200 美元的门槛。"
  en_display:
  - "Step 4 is scripted, so approval is predictable: 60 guests in New York, a valid cart at $220.80, above the $200 threshold."
- en: "The workflow pauses, and you are the manager: the host answers, never the agent. Type approve."
  zh:
  - "工作流暂停了，你就是经理：回答的是宿主程序，绝不是 agent。"
  - "输入 approve。"
- en: "What did you approve? A fingerprint: the SHA-256 hash, taken over the request, the items, the subtotal, the policy and the product attributes. Stock is left out on purpose: it's rechecked, not approved."
  zh:
  - "你批准的到底是什么？"
  - "一个指纹：SHA-256 哈希，覆盖需求、商品明细、小计、政策和商品属性。"
  - "库存是故意排除在外的：它会被重新检查，而不是被批准。"
- en: "At checkout the cart is validated and hashed again. The approval counts only if the decision is approve, and the ticket matches this checkout and this fingerprint. Change one line, and the hashes differ."
  zh:
  - "结账时，购物车会再校验一次，再算一次哈希。"
  - "批准要算数，决定必须是 approve，而且审批单要对得上这次结账和这个指纹。"
  - "改动一行，哈希就不一样了。"
- en: "Your thinking time doesn't count against the budget."
  zh:
  - "你思考的时间不算进预算。"
- en: "And as an extra, type decline instead: the workflow ends, with no order."
  zh:
  - "再额外试一次，改成输入 decline：工作流结束，没有订单。"
- en: "Something to ponder. The manager approves. Before checkout runs, another order takes most of the Mimolette. What does checkout do, and why doesn't the approval protect this order?"
  zh:
  - "来想一个问题。"
  - "经理批准了。"
  - "在结账执行之前，另一个订单拿走了大部分 Mimolette。"
  - "结账会怎么做，为什么批准保护不了这个订单？"
- en: "Checkout revalidates, finds a stock violation, and blocks. Stock isn't in the fingerprint: an approval authorizes a decision; it doesn't reserve anything. Act 6 shows this for real."
  zh:
  - "结账时重新校验，发现库存违规，就把它拦下了。"
  - "库存不在指纹里：批准授权的是一个决定；它不预留任何东西。"
  - "第 6 幕会把这个真的跑一遍。"
- en: "Step 5: Munster has 0 grams, so attempt 1 fails. One bounded revision swaps in Époisses, and the order places at 50 dollars 10, with zero model calls."
  zh:
  - "第 5 步：Munster 的库存是 0 克，所以第 1 次尝试失败了。"
  - "一次有上限的修订换成了 Époisses，订单以 50.10 美元下单，模型调用为零。"
  en_display:
  - null
  - "One bounded revision swaps in Époisses, and the order places at $50.10, with zero model calls."
- en: "Step 6 is the notebook cell. Its trace and budget layers can come off; validation, approval and revalidation are graph and checkout rules, so they stay."
  zh:
  - "第 6 步是 notebook 单元格。"
  - "它的 trace 层和 budget 层可以拆掉；校验、审批和重新校验是图和结账的规则，所以保留。"
- en: "So an approval binds this exact cart, and checkout revalidates after the pause. Pause and run steps 4 and 5; the cell is for Colab."
  zh:
  - "所以批准绑定的正是这辆购物车，而结账在暂停之后还会重新校验。"
  - "暂停一下，跑第 4、5 步；单元格是给 Colab 用的。"
S10:
- en: "Act 4 is a planner for a longer task: a 40-guest event in New York. The lecture splits memory into long-term and short-term; here that's saved memory and history, plus tasks, approvals and the audit: five kinds of state."
  zh:
  - "第 4 幕是一个规划器，处理更长的任务：纽约一场 40 位客人的活动。"
  - "课上把记忆分成长期和短期；这里对应的是保存的记忆和历史，再加上任务、审批和审计：五种状态。"
- en: "The README asks which of these can authorize an action. Only one: the approval drawer."
  zh:
  - "README 问的是，这些里面哪一个能授权行动。"
  - "只有一个：审批抽屉。"
- en: "Step 1: act 4. Before any model call, the harness prints the first customer's saved memory. Then the planner's tools: assess the event, read the vendor document, draft and save a vendor email, and the to-do tools. No tool writes memory."
  zh:
  - "第 1 步：第 4 幕。"
  - "在任何模型调用之前，harness 就打印出第一位顾客保存的记忆。"
  - "然后是规划器的工具：评估活动、读取供应商的文档、起草和保存给供应商的邮件，以及待办工具。"
  - "没有哪个工具能写记忆。"
- en: "With a key, look for the brief: 1,000 grams each of Comté and Mimolette, and 1,200 of Époisses. The shop has only 900 grams of Époisses: 300 short. A finished task is not an approval, and shop stock is not vendor availability."
  zh:
  - "有密钥的话，要找的是活动说明：Comté 和 Mimolette 各 1000 克，Époisses 1200 克。"
  - "店里的 Époisses 只有 900 克：差 300 克。"
  - "完成的任务不等于批准，店里的库存也不等于供应商有货。"
- en: "Saving the email has approval mode always require, so the framework pauses before the save runs. Act 3 paused a whole workflow; this pauses one tool."
  zh:
  - "保存邮件这个工具，approval mode 设为 always require，所以框架会在保存执行之前暂停。"
  - "第 3 幕暂停的是整个工作流；这里只暂停一个工具。"
  en_display:
  - "Saving the email has approval_mode=\"always_require\", so the framework pauses before the save runs."
  - null
- en: "The output after you approve comes from a scripted extra run. The review shows the vendor address and a body written by code, nut allergy included. Then: status saved, email transmitted no, and the file path."
  zh:
  - "你批准之后的输出，来自一次脚本模拟的额外运行。"
  - "审核里显示供应商地址，和一段由代码写的正文，坚果过敏也写在里面。"
  - "然后：status 为 saved，email transmitted 为 no，文件路径。"
  en_display:
  - null
  - null
  - "Then: status: saved, email transmitted: no, and the file path."
- en: "Then comes the approval-identity warning from the tests: the README predicts it, and it's harmless. Trust the authoritative block. Pause and run step 1."
  zh:
  - "接着是测试里出现过的审批身份警告：README 预告过它，它是无害的。"
  - "以权威结果那一块为准。"
  - "暂停一下，跑第 1 步。"
S11:
- en: "Step 2 runs offline: a scripted planner with compaction, a malicious vendor document, and a test decline. It first seeds twelve synthetic notes of about 15,000 characters."
  zh:
  - "第 2 步离线运行：一个脚本模拟的规划器，带压缩，一份恶意的供应商文档，还有一次测试用的拒绝。"
  - "它先放进十二条合成笔记，每条大约 15000 个字符。"
- en: "The window is 16,000 tokens, with 2,400 kept for the reply. Above 80 percent of the rest, truncation drops the oldest messages until the history is back under half: 26 become 5."
  zh:
  - "窗口是 16000 个 token，其中 2400 个留给回复。"
  - "超过剩下部分的 80% 时，截断会丢掉最旧的消息，直到历史回到一半以下：26 条变成 5 条。"
- en: "Something to ponder. Compaction dropped 21 of 26 messages, and none of the history mentions the nut allergy. How does every call still know about it?"
  zh:
  - "来想一个问题。"
  - "压缩丢掉了 26 条消息里的 21 条，而且历史里没有一条提到坚果过敏。"
  - "那每次调用怎么还会知道这件事？"
- en: "A capsule. Before every call, the harness takes the old one out, compacts, and pins a fresh one from application state. It holds the confirmed request with its nut allergy, the menu, tasks, pending reviews and open work, marked as data, not instructions."
  zh:
  - "一个胶囊。"
  - "每次调用之前，harness 先取出旧胶囊、做压缩，再根据应用状态钉上一个新的。"
  - "里面有已确认的需求，包括坚果过敏，还有菜单、任务、待处理的审核和未完成的工作，都标明是数据，不是指令。"
- en: "That's the lecture's compaction trigger, and what persists where, in code."
  zh:
  - "这就是课上的压缩触发条件，以及什么东西持久保存在哪里，都写成了代码。"
- en: "The vendor document says to ignore the allergy, so it lands in quarantine. The detector is deliberately small; the real guards are the recipient allowlist, and your review."
  zh:
  - "供应商文档要求忽略过敏，所以它被隔离了。"
  - "检测器故意做得很小；真正的防线是收件人白名单，还有你的审核。"
- en: "The drafted email still says nuts. The result: declined, no HTML saved, 7 model calls and 7 compactions."
  zh:
  - "起草的邮件里仍然写着坚果过敏。"
  - "结果：DECLINED，没有保存 HTML，7 次模型调用，7 次压缩。"
  en_display:
  - null
  - "The result: DECLINED, no HTML saved, 7 model calls and 7 compactions."
- en: "Steps 3 and 4 are the optional memory exercise; type them from README line 484, since the ID is masked here. The first command stores a preference for the second customer, and the memory prints before any model call, even without a key. The next visit shows it again; an extra check reads the file."
  zh:
  - "第 3、4 步是可选的记忆练习；照 README 第 484 行输入，因为这里的 ID 被遮住了。"
  - "第一条命令给第二位顾客存一条偏好，记忆在任何模型调用之前就打印出来，即使没有密钥也一样。"
  - "下一次来访时它又会显示出来；额外检查会读取这个文件。"
- en: "The lecture lets the model suggest what's worth remembering. This harness moves even that to the right: only the host writes memory."
  zh:
  - "课上让模型来建议什么值得记住。"
  - "这个 harness 连这一点也移到了右边：只有宿主程序能写记忆。"
- en: "Step 5 is the notebook cell, for Colab: build act 4 adds five layers. Without compaction, the capsule is still re-pinned. Pause and run steps 2 to 4."
  zh:
  - "第 5 步是 notebook 单元格，给 Colab 用：build act 4 加了五层。"
  - "去掉压缩之后，胶囊还是会重新钉上。"
  - "暂停一下，把第 2 到第 4 步跑一遍。"
  en_display:
  - "Step 5 is the notebook cell, for Colab: build_act4 adds five layers."
  - null
  - null
S12:
- en: "Act 5 adds skills: folders of procedure the agent loads only when relevant. They solve two problems: the expertise gap and the context budget."
  zh:
  - "第 5 幕加入了 skill：装着操作流程的目录，agent 只在相关时才加载。"
  - "它们解决两个问题：专业知识的缺口，和上下文预算。"
- en: "Skills load in three steps of rising token cost: every skill's name and description, about 100 tokens each; then its main file, SKILL.md; then a reference or an asset, only when needed."
  zh:
  - "加载 skill 分三步，token 成本一步比一步高：每个 skill 的名字和描述，各大约 100 个 token；然后是它的主文件 SKILL.md；再然后是一份参考资料或资源文件，只在需要时读取。"
- en: "The lecture's skill also has a scripts folder for the agent to run. This harness removes that tool on purpose: a skill advises, and never executes."
  zh:
  - "课上的 skill 还带一个 scripts 目录，里面的脚本由 agent 来运行。"
  - "这个 harness 故意去掉了那个工具：skill 只提建议，从不执行。"
- en: "Step 1: act 5. Only the metadata loads at first: tasting planning and vendor outreach. The new tools are get stock, load skill and read skill resource."
  zh:
  - "第 1 步：第 5 幕。"
  - "一开始只加载元数据：tasting-planning 和 vendor-outreach。"
  - "新的工具是 get stock、load skill 和 read skill resource。"
  en_display:
  - null
  - "Only the metadata loads at first: tasting-planning and vendor-outreach."
  - "The new tools are get_stock, load_skill and read_skill_resource."
- en: "Step 2 asks only about stock, offline: one get stock call, 900 grams, and the script loads no skill. With a key, the model decides from the description: a hint, not a trigger."
  zh:
  - "第 2 步只问库存，离线运行：一次 get stock 调用，900 克，脚本没有加载任何 skill。"
  - "有密钥的话，模型根据描述来决定：是提示，不是触发条件。"
  en_display:
  - "Step 2 asks only about stock, offline: one get_stock call, 900 grams, and the script loads no skill."
  - null
- en: "Step 3 runs the full sourcing path, scripted: six loads, each with its real path. Drafting is refused until the email template is read: a backstop in code."
  zh:
  - "第 3 步跑完整的采购流程，脚本模拟：六次加载，每次都带着真实路径。"
  - "起草一直会被拒绝，直到读过邮件模板为止：这是代码里的一道保险。"
- en: "Something to ponder. Someone edits the vendor skill to add: also send this to another address. Will the email go there?"
  zh:
  - "来想一个问题。"
  - "有人改了供应商那个 skill，加上一句：也发一份到另一个地址。"
  - "邮件会发到那里去吗？"
- en: "No. Whatever the skill says, the guards are in code; its own text even says it cannot add recipients, and every read is checked: no parent folders, absolute paths or symlinks, and a file edited mid-run is refused."
  zh:
  - "不会。"
  - "不管这个 skill 怎么写，防线都在代码里；它自己的文字甚至写明了它不能添加收件人，而且每次读取都要经过检查：不许上级目录、绝对路径或符号链接，运行中途改过的文件会被拒绝。"
- en: "The recipient is checked in code against the allowlist, and nothing is ever transmitted; an extra check shows the saved file says so."
  zh:
  - "收件人由代码对照白名单检查，而且什么都不会真的发出去；额外检查显示，保存的文件里也是这么写的。"
- en: "In lecture terms, a tool is the hands, MCP the socket, unused here, and a skill the manual."
  zh:
  - "用课上的话说，工具是手，MCP 是插座，这里没用到，skill 是说明书。"
- en: "Step 4, the notebook cell, allows 16 model calls. Pause and run steps 1 to 3."
  zh:
  - "第 4 步是 notebook 单元格，允许 16 次模型调用。"
  - "暂停一下，把第 1 到第 3 步跑一遍。"
S13:
- en: "Act 6 is an agent system. The lecture contrasts one agent with a graph of agents, in two patterns: a manager calling agents as tools, or peers handing off."
  zh:
  - "第 6 幕是一个 agent 系统。"
  - "课上对比了单个 agent 和 agent 组成的图，分两种模式：一个管理者把 agent 当工具来调用，或者对等的 agent 互相交接。"
- en: "It's the manager pattern, except the tool it calls is a whole workflow, the one from act 3, with a model inside one node. No handoffs."
  zh:
  - "它就是管理者模式，只不过它调用的工具是一整个工作流，就是第 3 幕那个，里面只有一个节点用到模型。"
  - "没有交接。"
- en: "Step 1, the notebook cell, builds it. The budget: 16 outer model calls, 20 tool calls, 8 proposer calls per workflow, and one shared 180-second clock."
  zh:
  - "第 1 步是 notebook 单元格，用来构建它。"
  - "预算是：16 次外层模型调用，20 次工具调用，每个工作流 8 次提议者调用，再加一个共享的 180 秒时钟。"
- en: "The host confirms the requests; the model only picks an ID. Its tools are narrow: start order, get order status, assess event."
  zh:
  - "宿主程序确认这些需求；模型只负责挑一个 ID。"
  - "工具都很窄：start order、get order status、assess event。"
  en_display:
  - null
  - "Its tools are narrow: start_order, get_order_status, assess_event."
- en: "Step 2: act 6, standard. With a key, tell outer model calls apart from workflow calls; the outer agent cannot approve its own order."
  zh:
  - "第 2 步：第 6 幕，standard 场景。"
  - "有密钥的话，要分清外层模型调用和工作流里的调用；外层 agent 不能批准自己的订单。"
- en: "Step 3 runs offline: two orders sharing one shop. Both carts pass at 220 dollars 80, both pause for a manager, and the test decision approves both."
  zh:
  - "第 3 步离线运行：两个订单共用一家店。"
  - "两辆购物车都以 220.80 美元通过，都暂停等经理，测试用的决定把两个都批准了。"
  en_display:
  - null
  - "Both carts pass at $220.80, both pause for a manager, and the test decision approves both."
- en: "Mimolette and Taleggio start at 3,000 grams each. Request 1 is placed, leaving 1,400. Request 2 reaches revalidation needing 1,600: blocked. That's the ponder from act 3, for real: approval is not placement."
  zh:
  - "Mimolette 和 Taleggio 一开始各有 3000 克。"
  - "订单 1 下单了，剩下 1400 克。"
  - "订单 2 走到重新校验时需要 1600 克：被拦下了。"
  - "这就是第 3 幕那个思考题，真的发生了：批准不等于下单。"
- en: "The final answer is the lecture's response step: the app checks the model's plan and fills in quantities, prices and the status, placed, from the receipt. The blocked order says invalid or unauthorized; the stock lines below give the reason."
  zh:
  - "最终回答就是课上的回复步骤：应用检查模型的计划，再根据回执填上数量、价格和状态 placed。"
  - "被拦下的订单显示 Invalid or unauthorized；下面库存那几行给出了原因。"
  en_display:
  - null
  - "The blocked order says Invalid or unauthorized; the stock lines below give the reason."
- en: "On the autonomy spectrum it's a hybrid, inside out: the agent outside, the fixed graph as its tool. Pause and run steps 2 and 3."
  zh:
  - "在自主性光谱上，它是混合型，只不过里外反过来：外面是 agent，固定的图是它的工具。"
  - "暂停一下，跑第 2、3 步。"
S14:
- en: "Everything between the provider's model and the product is ours: context, harness, tools and skills. So all of it must be tested."
  zh:
  - "服务商的模型和产品之间的一切都是我们的：上下文、harness、工具和 skill。"
  - "所以这些全都要测试。"
- en: "The lecture measures three things: outcome, trajectory and cost. Here they're the outcome and process checks, plus calls and tokens."
  zh:
  - "课上衡量三样东西：结果、轨迹和成本。"
  - "在这里，就是 outcome 检查和 process 检查，再加上调用次数和 token。"
- en: "Evaluation step 1 lists the runs. Every run so far is in one SQLite database, including the failed live ones, with status error."
  zh:
  - "评测第 1 步列出所有运行。"
  - "到目前为止的每次运行都在同一个 SQLite 数据库里，包括失败的在线运行，status 为 error。"
  en_display:
  - null
  - "Every run so far is in one SQLite database, including the failed live ones, with status: error."
- en: "Inspect run takes a run ID: typed literally, it fails, because it's a template. Paste a real one; we use the manager approval run."
  zh:
  - "这个 --inspect-run 要一个 run ID：照字面输入就会失败，因为它是个模板。"
  - "贴一个真实的；我们用 manager-approval 那次运行。"
  en_display:
  - "--inspect-run takes a run ID: typed literally, it fails, because it's a template."
  - "Paste a real one; we use the manager-approval run."
- en: "The events read in order: approval requested with the fingerprint, approval decided by a human, policy decision allow, order placed, run finished. The evidence for order placed is an event, not the prose."
  zh:
  - "事件依次是：approval.requested，带着指纹；approval.decided，由人做出；policy.decision allow、order.placed、run.finished。"
  - "下单的证据是一个事件，不是文字。"
  en_display:
  - "The events read in order: approval.requested with the fingerprint, approval.decided by a human, policy.decision allow, order.placed, run.finished."
  - null
- en: "As an extra, inspect the first failed run: model failed, with the 401. A failure is evidence too."
  zh:
  - "再额外查看第一次失败的运行：model.failed，带着 401。"
  - "失败也是证据。"
  en_display:
  - "As an extra, inspect the first failed run: model.failed, with the 401."
  - null
- en: "Evaluation step 2 starts offline: the act 2 evaluation, scripted, two repeats, labeled context fixture 1. All 4 runs pass, but scripted runs test the machinery, not the model."
  zh:
  - "评测第 2 步先离线跑第 2 幕的评测：脚本模拟，重复两次，label 是 context-fixture-1。"
  - "全部 4 次运行都通过了，但脚本模拟的运行测的是这套机制，不是模型。"
  en_display:
  - "Evaluation step 2 starts offline: the act 2 evaluation, scripted, two repeats, labeled context-fixture-1."
  - null
- en: "Then read the report back, and export the HTML scorecard, to its default path or one you choose."
  zh:
  - "然后把报告读回来，再导出 HTML 记分卡，放到默认路径，或者你自己选的路径。"
- en: "Open it from the outputs folder on your laptop."
  zh:
  - "从你笔记本上的 outputs 目录里打开它。"
- en: "The last command is a template for a database copied from Colab: typed literally, it fails. Labels are immutable: reuse one, and the batch stops. Pause and run evaluation steps 1 and 2."
  zh:
  - "最后一条命令是个模板，给从 Colab 复制过来的数据库用：照字面输入就会失败。"
  - "每个 label 都不可更改：重复用一个，这一批就会停下来。"
  - "暂停一下，跑评测第 1、2 步。"
S15:
- en: "Evaluation step 3 compares two configurations. The lecture warns that a prompt edit can fix one case and break three, so compare per case."
  zh:
  - "评测第 3 步比较两套配置。"
  - "课上提醒，改一次 prompt 可能修好一个用例，又弄坏三个，所以要逐个用例比较。"
- en: "The lecture's improvement loop: see a failure, capture a test case, change one layer, run the suite k times, compare with the baseline, then merge or iterate."
  zh:
  - "课上的改进循环：发现失败，记录成测试用例，只改一层，把测试集跑 k 次，和基线比较，然后合并或者继续迭代。"
- en: "Batch A runs enriched mode on two cases, twice: 4 live runs. Without a key: 0 of 4, with 3 errors and 1 missing. If one fails, fix the key and rerun both with new labels."
  zh:
  - "批次 A 用 enriched 模式跑两个用例，各两次：4 次在线运行。"
  - "没有密钥：4 次里 0 次通过，3 个错误，1 个缺失。"
  - "如果有一批失败了，就修好密钥，用新的 label 把两批都重跑一遍。"
- en: "Copy the prompt file and edit the copy on your laptop: one deliberate change, keeping the confirmed constraint rules."
  zh:
  - "复制 prompt 文件，在你的笔记本上改这份副本：只做一处有意的改动，保留已确认约束的那些规则。"
- en: "Our extra appends a line asking for a price and an action status; diff shows just that line."
  zh:
  - "我们额外追加了一行，要求写出价格和行动状态；用 diff 一看，正好只多了这一行。"
- en: "Batch B runs the same cases and settings, with dash dash prompt file pointing at the copy."
  zh:
  - "批次 B 用同样的用例和设置，再加上 --prompt-file 指向那份副本。"
  en_display:
  - "Batch B runs the same cases and settings, with --prompt-file pointing at the copy."
- en: "Then compare, offline. Changed configuration: prompt. Confounding changes: none. Change code, data or the model, and it says so: the lecture's change-one-layer rule, checked in code."
  zh:
  - "然后离线比较。"
  - "改动的配置：prompt。"
  - "混杂改动：没有。"
  - "改了代码、数据或模型，它都会指出来：这就是课上“只改一层”的规则，由代码来检查。"
- en: "Compare flags a run only when pass or fail flips; here every run errored both times."
  zh:
  - "比较只在通过或失败翻转时才标出一次运行；这里每次运行前后两次都报错。"
- en: "As an extra, comparing two scripted batches reports all four runs unchanged, because fixtures ignore the prompt."
  zh:
  - "再额外比较两个脚本模拟的批次：四次运行全部不变，因为 fixture 不看 prompt。"
- en: "Evaluation step 4 asks what the checks establish. They check properties, like cart validity and approval order; the prose needs your review, with the README's five questions."
  zh:
  - "评测第 4 步问的是，这些检查能证明什么。"
  - "它们检查的是属性，比如购物车是否有效、审批的顺序；文字要靠你来审，用 README 里的五个问题。"
- en: "The lecture lists three judges: code, a model and a human. This tutorial uses two: code, and you. Lean toward code as far as the task allows, as in the harness."
  zh:
  - "课上列了三种评委：代码、模型和人。"
  - "这个教程用了其中两个：代码，和你。"
  - "尽量偏向代码，任务允许多少就偏多少，和 harness 里一样。"
- en: "Report one difference, its evidence, and one limit. And keep your cases: the eval set is the most valuable artifact. Pause and run evaluation step 3."
  zh:
  - "报告一个差异、它的证据，以及一个局限。"
  - "还有，留好你的用例：评测集是最有价值的产物。"
  - "暂停一下，跑评测第 3 步。"
S16:
- en: "The repository map of section 7 ends with python cli.py, dash dash help: every option in one place."
  zh:
  - "第 7 节的 repo 地图最后一条是：python cli.py --help，所有选项都在一个地方。"
  en_display:
  - "The repository map of section 7 ends with python cli.py --help: every option in one place."
- en: "Traces and live memory stay in SQLite. Inventory, orders, tickets and pending workflows last for one process; tasks and history, for one session."
  zh:
  - "所有 trace，以及在线运行写下的记忆，都保存在 SQLite 里。"
  - "库存、订单、审批单和待处理的工作流只存在于一个进程里；任务和历史，只存在于一个 session 里。"
- en: "Now tear down; these steps are extras. Type exit in each container shell; it was started with dash dash rm, so nothing is left in docker ps dash a."
  zh:
  - "现在来拆掉；这几步都是额外的。"
  - "在每个 container 的 shell 里输入 exit；它是用 --rm 启动的，所以 docker ps -a 里什么都不剩。"
  en_display:
  - null
  - "Type exit in each container shell; it was started with --rm, so nothing is left in docker ps -a."
- en: "The outputs folder stays on your laptop. Its trace database holds your prompts and outputs, keys redacted; delete it when you're done."
  zh:
  - "你笔记本上的 outputs 目录会留着。"
  - "里面的 trace 数据库存着你的 prompt 和输出，密钥已经脱敏；用完了就把它删掉。"
- en: "Docker image remove frees most of those 1.77 gigabytes; the base image stays. Then close the terminal that held your key, keep it out of files, commits and your shell history, and watch your usage. In Colab, delete the runtime. Pause, and tear down."
  zh:
  - "用 docker image rm，能腾出那 1.77 GB 里的大部分；留下的是 base image。"
  - "然后关掉存过你密钥的那个终端，别让密钥进文件、commit 和 shell 历史记录，再留意你的用量。"
  - "在 Colab 里，删除运行时。"
  - "暂停一下，把它拆掉。"
  en_display:
  - "docker image rm frees most of those 1.77 gigabytes; the base image stays."
  - null
  - null
  - null
- en: "Here is the action boundary, filled in: budgets and the graph; schemas, the audit and approval on save; the packet, the capsule and host-written memory; Cart Check and revalidation; narrow tools and separate counters."
  zh:
  - "这就是行动边界，现在填好了：预算和图；schema、审计和保存时的审批；上下文包、胶囊和由宿主程序写的记忆；CartCheck 和重新校验；窄工具和分开的计数器。"
  en_display:
  - "Here is the action boundary, filled in: budgets and the graph; schemas, the audit and approval on save; the packet, the capsule and host-written memory; CartCheck and revalidation; narrow tools and separate counters."
- en: "The model proposes, on the left. On the right, the harness decides, and where it matters, so do you."
  zh:
  - "模型提议，在左边。"
  - "在右边，harness 决定；而在关键的地方，你也一样。"
- en: "The README ends with five reflection questions. Pick one run you did, and answer them."
  zh:
  - "README 最后有五个反思问题。"
  - "挑一次你跑过的运行，回答这些问题。"
- en: "Test yourself. What survives harness without trace? Why does retrieved context arrive as data? What is an approval bound to? Which state can authorize an action? And what does a passing fixture batch establish? Pause and try them; answers are in the exercises."
  zh:
  - "自测一下。"
  - "去掉 trace 之后，harness 还剩下什么？"
  - "为什么检索到的上下文要作为数据进来？"
  - "批准绑定的是什么？"
  - "哪一种状态能授权一个行动？"
  - "还有，一批通过的 fixture 运行能证明什么？"
  - "暂停一下，试着答一答；答案在练习里。"
  en_display:
  - null
  - "What survives harness.without(\"trace\")?"
  - null
  - null
  - null
  - null
  - null
- en: "Next, lecture 8 fine-tunes models on Google's Agent Platform, formerly Vertex AI. Lecture 9 tests code with pytest; these 281 tests use unittest, and are a good model."
  zh:
  - "接下来，第 8 讲会在 Google 的 Agent Platform 上微调模型，它以前叫 Vertex AI。"
  - "第 9 讲用 pytest 测试代码；这里的 281 个测试用的是 unittest，是很好的范例。"
