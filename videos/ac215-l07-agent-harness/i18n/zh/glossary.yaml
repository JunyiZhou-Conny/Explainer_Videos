# Chinese (zh-CN) glossary and translation rules for ac215-l07-agent-harness (AC215 lecture 7, LLM: Agents II: a
# follow-along of dlops-io/agent-harness @ e25dfe9, the whole README, and the course's Agent Harness Colab notebook),
# code-switching version, SUBTITLES ONLY. Audience: Chinese-speaking AC215 grad students who read technical English
# fluently; register of a Chinese MLOps TA running a lab section. Precedents and source of the shared decisions: the
# series pilot videos/ac215-l01-vms-venvs/i18n/zh (repo, clone, commit, pin, lock 文件, shell, 笔记本, 来想一个问题), the
# container lectures ac215-l02-containers-1, ac215-l03-mega-pipeline, ac215-l04-flexible-workflow-ports (层, 指纹, 进程,
# shell 历史记录, 拆掉, and the subtitles-only rule set this file follows), ac215-l05-rag (检索, 元数据, 哈希, 通道,
# 一个小疏漏) and ac215-l06-agents-1 (agent, notebook, session, harness, 工具调用, 循环, 规划器, 批准, 回执, 交接, 上下文工程).
# Every term L1-L6 already decided keeps their form; what is new here is the harness vocabulary (A3): harness layers,
# admission and audit, the action boundary, the context packet, the workflow graph, fingerprint-bound approval,
# compaction and the capsule, skills and progressive disclosure, evaluation; plus trace, skill, fixture, label and diff
# in the closed English list. script.md's i18n notes (en_display candidates, chapter metaphors, idioms) and
# build/review_spoken.md items 4, 8, 9, 11 and 17 are applied (A6, D4, D9, H1).
# There is NO Chinese voice in this series: the Chinese lines are subtitles on the English timing (the bilingual
# band of output/<id>.zh-en.mp4, <id>.zh.srt, <id>.zh-en.srt / .ass). So no say:, no anchors, no readings, no
# durations, no rules about how numbers or symbols are spoken (L1's C2-C5 and F1-F6 are dropped): only display
# rules. But `python -m explainer.i18n check` still applies its voice hygiene to the displayed line when a sentence
# has no say: (brackets, maths symbols, letter_letter names, Latin words not listed here, a missing half-width
# space): rules A6, B3 and D3 are how the Chinese line stays clean without say:.
# Human-readable copy in Chinese: GLOSSARY.md (keep the two in sync; both term tables come from the same data).
# terms[].zh_subtitle = the subtitle form (titles and companions use A4's written register); terms[].first_use = one
# example sentence (SNN[k]: scene SNN, SAY block k counted from 0), each one passes the checker; terms[].note = rules.
# Read by: python -m explainer.i18n check (Latin words allowed in a subtitle line: every Latin word of zh_subtitle and
# first_use, plus allowed_spoken_latin) and explainer/subtitles.py (2-3 word English phrases of `en` are kept on one
# English line; 2-7 character Chinese headwords of zh_subtitle are registered in jieba; I3).
video: ac215-l07-agent-harness
lang: zh-CN (mainland Simplified Chinese)
audience: 'Chinese-speaking AC215 (MLOps & LLMOps) grad students who read Python (async/await, dataclasses and decorators at a reading level) and did L1 (uv, pyproject.toml, uv.lock), L2-L4 (containers, docker-shell.sh), L5 (RAG) and L6 (function calling, the agent loop and its cap, MCP, the Colab notebooks'' first harness ideas: an approval gate, Python-owned arithmetic, a receipt); have never built an agent harness. They follow along with their ~/AC215/agent-harness clone open and Docker running, optionally with an OpenAI API key with billing, or in the course''s Agent Harness Colab notebook. Register of a Chinese MLOps TA running a lab section.'
voice: none          # subtitles only (video.yaml: Chinese = i18n/zh/narration/*.yaml on the English timing)
policy: 'The Mandarin of a Chinese MLOps TA walking a lab section through the steps, code-switching only where such a speaker really does, written as subtitles under an English narration. The viewers already say 起一个 container, pull 下来, 把 repo clone 下来, 写 prompt, 这个 agent, 跑一下 notebook, 建一个 session, and L06 introduced harness; this lecture adds 看一下 trace, 加载一个 skill, 用 fixture 跑, 换一个 label, 看 diff. Every choice passes three tests: what is said in a real lab section; the standard, searchable Chinese name (the Chinese agent-engineering literature: 上下文工程, 上下文窗口, 压缩, 截断, 渐进式披露, 白名单, 结构化输出, 测试用例, 评测集, 基线, 交接); and consistency with the series (L1 decided the shared words, L2-L4 the container, key and network words, L5 the RAG words, L6 the agent words: every form they fixed is kept). (1) Artifacts verbatim: what the viewer types or matches on screen (commands, flags, scenario, mode and label values, file and folder names, paths, class and layer names, code values, terminal text, status and event names, the model ID, package names, the cheeses as the shop data prints them, the Colab screen words, README headings, the on-screen tags) is copied letter for letter, never translated, inflected or quoted; the exceptions the checker forces are names with an underscore and the characters = + < > ( ) [ ], written the way the narration says them (A6, B3). Nothing on screen is translated in this series: terminal output, code panels, README cards, recorded-output boxes, the schematic Colab screen, tags, trackers, lecture tags, diagram labels, the V1 table and the ponder cards stay English; only the narration is. (2) Lab-speech English, a closed list: from L1 repo, clone, commit, pin, lock 文件, shell; from L2-L4 container, image, base image, pull, port, API, ID, token, Dockerfile; from L5 prompt, system prompt, LLM, agent, CLI; from L6 notebook, session, schema, SDK, harness; new in L07 trace, skill, fixture, label, diff, run ID. (3) Everything else in standard Chinese: 工具, 工具调用, 循环, 轮, 消息, 层, 环, 准入, 审计, 预算, 兜底, 上下文, 上下文包, 空位, 政策, 规则, 校验, 重新校验, 验证, 检查, 工作流, 图, 节点, 边, 修订, 结账, 购物车, 订单, 下单, 批准, 审批, 审批单, 指纹, 哈希, 回执, 审核, 经理, 宿主程序, 规划器, 记忆, 历史, 状态, 任务, 压缩, 胶囊, 截断, 上下文窗口, 隔离, 白名单, 防线, 检测器, 元数据, 参考资料, 资源文件, 渐进式披露, 管理者模式, 交接, 评测, 测试用例, 测试集, 基线, 批次, 报告, 记分卡, 混杂改动, 评委, 结果, 轨迹, 成本, 证据, 在线, 离线, 脚本模拟. (4) The video''s metaphors by meaning, one word each: 两栏 (two columns), 环 and 内环 (rings), 闸机 (turnstile), 接缝 (seam), 筛子 (sieves), 通道 (lanes, as L5/L6), 轨道 and 站 (rails, stations), 抽屉 (drawers), 胶囊 (capsule), 说明书 and 钥匙 (manuals, keys), 手 and 插座 (hands, socket), 回执 (receipt, L6). (5) Written register for titles, meta.yaml and companion docs: 容器, 镜像, 基础镜像, 仓库, 克隆, 提交, 端口, 提示词, 系统提示词, 智能体（agent）, 会话（session）, Colab 笔记本（notebook）, 技能（skill）, 执行记录（trace）; harness stays harness. (6) The bilingual band puts the English sentence under every Chinese line, so the Chinese line carries no glosses and no brackets at all (the checker forbids them without say:). (7) The toolkit''s constraints are part of the policy: one Chinese sentence per English sentence (155 blocks, 339 sentences), a checker-clean display line (D3), an en_display wherever the SAY spells an artifact out as words (D4), the English clause order kept (D9). Mainland Simplified Chinese; relaxed, clear lab-section speech, never slangy.'
rules:
- '[A1] Code-switching scope. English stays in three places only. (a) Artifacts, copied letter for letter: commands and subcommands (git clone, ls -a, bash docker-shell.sh, docker ps, docker images, docker inspect, docker exec, docker ps -a, docker image rm, exit, python cli.py --help, python cli.py --act 1 --scenario standard, diff; the README''s three read lines only by description), flags (--compare, --show-json, --preview-context, --fixture, --inspect-run, --prompt-file, --model, --rm), scenario and mode values (standard, personalized, preference-override, missing-details, pa-shipping, manager-approval, out-of-stock, two-orders, basic, enriched; the blocked scenario → blocked 场景), labels (context-fixture-1; act2-context-live-1, context-live-a and context-live-b are on screen only), file and folder names and paths (docker-shell.sh, Dockerfile, agent-harness, secrets, docs, outputs, SKILL.md, scripts, tasting-planning, vendor-outreach), class and layer names (Trace, Budget, Context, CartCheck), code values (OK, null, false, true, approve, decline, no cart, error, allow, placed, saved, no), terminal and trace text (Requested tools, Tool call, Maximum of 8 model calls reached, Retrieved context, Invalid or unauthorized, UNRESOLVED, BLOCKED, DECLINED, status, email transmitted), event names (approval.requested, approval.decided, policy.decision, order.placed, run.finished, model.failed), the check-name prefixes outcome and process, the package agent-framework and the model ID gpt-5.6-luna (C2), the README''s words (Inspect the context first, Setup; A11), the Colab screen words (Save a copy in Drive, Notebook access, secret), the on-screen tag the narration names (your turn), and the underscore names and code expressions written the way the SAY says them (A6). (b) Products, organisations, the course and names: AC215, OpenAI, Google, Agent Platform, Vertex AI, Docker, Colab, Drive, Jupyter, Python, SQLite, HTML, HTTPS, JSON, SHA-256, SDK, CLI, MCP, LLM, pytest, unittest, README, the cheeses as the shop data prints them (Comté, Époisses, Bûcheron, Taleggio, Mimolette, Munster, Brie; A10), PA and NY. (c) Words Chinese MLOps engineers really say in English in a lab section, a closed list: from L1 repo, clone, commit, pin, lock 文件, shell; from L2-L4 container, image, base image, pull, port, API, ID, token, Dockerfile; from L5 prompt (an LLM prompt only), system prompt, LLM, agent, CLI; from L6 notebook, session, schema, SDK, harness; new here trace (A3), skill (A3), fixture (A3), label (A3), diff (the command and its output, A3), run ID (A6). A word joins (c) only when lab speech really uses the English and the Chinese is stilted, ambiguous or collides with another term. Never English for flavour: tool, tool call, loop, round, message, workflow, graph, node, edge, layer, ring, admission, audit, budget (the idea), context (the idea), packet, slot, policy, rules, validation, revalidation, verification, checkout, cart, order, approval, ticket, fingerprint, hash, receipt, review, manager, host, planner, memory, history, state, task, compaction, capsule, truncation, window, quarantine, allowlist, guard, detector, metadata, reference, asset, progressive disclosure, evaluation, test case, suite, baseline, batch, repeat, report, scorecard, confounder, judge, outcome, trajectory, cost, evidence, live, offline, scripted, fallback, backstop, turnstile, rail, sieve, lane, drawer and seam are Chinese (A3).'
- '[A2] container and image (as L2-L6). The subtitles say container, image and base image, as a TA does in the lab: 一个 container, 构建 image, base image 已经在机器上了, container ID, container 的 shell; measure word 个. Titles, chapter names, meta.yaml and companion docs write 容器, 镜像, 基础镜像 (A4); never 镜像 in a subtitle. pull stays (your first build also pulls it → 你第一次构建还要先 pull 它). build → 构建 (builds the image → 构建 image; the CLI builds exactly this → CLI 构建的正是这个). mount → 挂载, publish a port → 发布 port, no ports → 没有 port (L4/L5). layer (an image layer) → 层; the layer trick from lecture 2 → 第 2 讲讲过的分层技巧 (L2-L4).'
- '[A3] The harness vocabulary (new in this lecture). The rule: the model proposes; the harness decides → 模型提议；harness 决定 (one wording, S01 and S16); propose / proposal → 提议 (an unvalidated proposal → 未经验证的提议), decide → 决定; the two columns → 两栏 (左边 / 右边); harness stays (L06), harness engineer → harness 工程师, harness engineering → harness 工程, the code around the model → 模型外面的代码. The lecture''s frame (SLIDES.md): the action boundary → 行动边界, five concerns → 五个关注点, Control flow / Tools / Context & memory / Verification / Sub agents → 控制流 / 工具 / 上下文与记忆 / 验证 / 子 agent, who decides → 谁来决定, move right / left → 往右移 / 往左移, stakes are high → 风险高, can''t be undone → 无法撤销, predictable → 可预测, audit → 审计, give control to code → 把控制权交给代码, the six steps Think / Reason / Plan / Execute / Verify / Response → 思考 / 推理 / 规划 / 执行 / 验证 / 回复 (the verify step → 验证步骤, the response step → 回复步骤), hidden reasoning → 隐藏的推理, the invisible layer → 看不见的那一层, the lecture''s stack → 课上的上下文栈, retrieved information → 检索信息, outside data → 外部数据, the two lanes → 两条通道 (system 通道 / user 通道), long-term / short-term memory → 长期 / 短期记忆, compaction trigger → 压缩触发条件, what persists where → 什么持久保存在哪里, skills → skill, progressive disclosure → 渐进式披露 (Discover / Activate / Use resources → 发现 / 激活 / 使用资源), expertise gap → 专业知识缺口, context budget → 上下文预算, the hands / the socket / the manual → 手 / 插座 / 说明书, agent system → agent 系统, single agent → 单个 agent, a graph of agents → 由 agent 组成的图, manager pattern → 管理者模式, agents as tools → 把 agent 当工具, peers → 对等的 agent, handoffs → 交接 (L06), autonomy spectrum → 自主性光谱 (rule-based → 基于规则, structured output → 结构化输出, hybrid → 混合型, full agent autonomy → 完全自主), outcome / trajectory / cost → 结果 / 轨迹 / 成本, judges → 评委, LLM as judge → 让 LLM 当评委, the eval set → 评测集, test case → 测试用例, suite → 测试集, baseline → 基线, improvement loop → 改进循环, change one layer → 只改一层, merge or iterate → 合并或者继续迭代. Act 1: act → 幕 (Act 1 → 第 1 幕, six acts → 六幕), the loop → 循环, round → 轮, messages → 消息, the seam → 接缝, the catalog → 商品清单, scenario → 场景, the ask → 需求, call 1 → 第 1 次调用, input tokens → 输入 token, billed → 计费, the exact message → 确切的消息, the confirmed request → 已确认的需求, trace stays (lab speech: 看一下 trace; the Trace layer; SQLite traces), a structured reply format → 结构化的回复格式. The layers: harness layer → harness 层, ring → 环, the inner ring → 内环, call admission → 调用准入, admitted and counted → 放行并计数, the tool audit → 工具审计, the shop rules → 店铺规则, one feature each → 每层一个功能, slide on / come off → 套上 / 拆掉, turnstile → 闸机, the framework''s fallback → 框架的兜底, loop iterations → 循环迭代, call limits → 调用次数上限, overall time budget → 总的时间预算, reports, never repairs → 只报告，从不修复, a new configuration → 新的配置, a bare loop → 裸循环. Act 2: context → 上下文, mode → 模式 (basic, enriched stay), slots → 空位, shop policies → 店铺政策, retrieved data → 检索到的数据, saved preferences → 保存的偏好, saved taste → 保存的口味, side-by-side table → 并排对比表, verdict → 结论, a tie → 打平, a regression → 退步, single runs → 单次运行, conversation message → 对话消息, the context packet → 上下文包, funk → 浓烈度, a state check → 按州的检查, raw milk → 生乳, a fictional rule → 虚构的规则, case → 用例, repeats → 重复, checkpoints → 检查点, sources → 来源, trust label → 信任标注, shop data → 店铺数据, sieves → 筛子, allergens → 过敏原, the allergy check → 过敏检查, the shipping rule → 运输规则, candidates → 候选, selection → 筛选, validation → 校验, a Python filter → Python 过滤器, vector search → 向量检索 (L05), a user message → user 消息, data, not instructions → 是数据，不是指令, a system rule → 系统规则, evidence → 证据. Act 3: workflow → 工作流 (L06), the order route → 下单路线, graph / edge / node → 图 / 边 / 节点, confirm / propose / validate → 确认 / 提议 / 校验, the revise loop → 修订循环, revision → 修订, pairings → 搭配, manager review → 经理审核, manager approval → 经理审批, revalidate and place → 重新校验并下单, propose cart (the node) → propose cart 节点 (A6), rails → 轨道, station → 站, quantities → 数量, transitions → 流转, pricing → 定价, placement → 下单, receipt → 回执 (L06), attempt → 尝试, a trap → 坑, the shipping lesson → 运输这一课, threshold → 门槛, the manager → 经理, the host → 宿主程序, fingerprint → 指纹 (L02), hash → 哈希 (L05), items → 商品明细, subtotal → 小计, policy → 政策, product attributes → 商品属性, rechecked → 重新检查, checkout → 结账, the decision → 决定, the approval ticket → 审批单, matches → 对得上, approval → 批准 (L06; the process → 审批), authorizes → 授权, reserve → 预留, a stock violation → 库存违规, a bounded revision → 有上限的修订. Act 4: planner → 规划器 (L06), event → 活动, saved memory → 保存的记忆, history → 历史, tasks → 任务, five kinds of state → 五种状态, drawer → 抽屉, the brief → 活动说明, vendor → 供应商, to-do tools → 待办工具, vendor availability → 供应商有货, the review → 审核, a body written by code → 由代码写的正文, authoritative → 权威, compaction → 压缩, a malicious vendor document → 恶意的供应商文档, synthetic notes → 合成笔记, context window → 上下文窗口, truncation → 截断, the oldest messages → 最旧的消息, capsule → 胶囊, application state → 应用状态, pins a fresh one → 钉上一个新的, re-pinned → 重新钉上, the menu → 菜单, pending reviews → 待处理的审核, open work → 未完成的工作, quarantine → 隔离, detector → 检测器, guards → 防线, recipient allowlist → 收件人白名单, memory exercise → 记忆练习, visit → 来访. Act 5: skill stays (lab speech: 写一个 skill, 加载 skill; SKILL.md and skills/ on screen), folders of procedure → 装着操作流程的目录, metadata → 元数据 (L05), main file → 主文件, a reference → 参考资料, an asset → 资源文件, a hint → 提示, a trigger → 触发条件, the full sourcing path → 完整的采购流程, the email template → 邮件模板, a backstop → 保险, recipients → 收件人, parent folders → 上级目录, absolute paths → 绝对路径, symlinks → 符号链接, transmitted → 发出去. Act 6: outer → 外层 (L06), proposer → 提议者, a shared clock → 共享的时钟, narrow tools → 窄工具, inside out → 里外反过来, the app → 应用. Evaluation: evaluation → 评测, a run → 一次运行, run ID stays (A6), events → 事件, a template → 模板, typed literally → 照字面输入, report → 报告, HTML scorecard → HTML 记分卡, label stays (the --label value: label 是 context-fixture-1; labels are immutable → 每个 label 都不可更改), batch → 批次 / 这一批 (Batch A → 批次 A), configuration → 配置, changed configuration → 改动的配置, confounding changes → 混杂改动, flips → 翻转, improved / regressed / unchanged → 改进 / 退步 / 不变, properties → 属性, establish → 证明, artifact (the eval set) → 产物, diff stays. Running modes: live (real model calls, billed per token) → 在线 and offline → 离线, the pair the screen shows (offline · free / live · billed per token): live commands → 在线命令, live runs → 在线运行, the live model → 在线模型, live answers → 在线运行的回答 or 模型的回答, live memory → 在线运行写下的记忆; never 实时 (L03''s live view) and never live in a subtitle; scripted → 脚本模拟的 (a scripted planner → 一个脚本模拟的规划器; scripted runs test the machinery, not the model → 脚本模拟的运行测的是这套机制，不是模型), fixture stays (with fixtures → 用 fixture 时, keep fixtures off → 把 fixture 关掉, a script in the model''s seat → 模型的位置上坐的是一个脚本), ran for real → 真实运行 (L06).'
- '[A4] Written vs spoken. The subtitles say repo / clone / commit / container / image / base image / port / prompt / system prompt / agent / session / notebook / token / pin / lock 文件 / trace / skill / fixture / label; titles, chapter names, meta.yaml and companion docs write 仓库 / 克隆 / 提交 / 容器 / 镜像 / 基础镜像 / 端口 / 提示词 / 系统提示词 / 智能体（agent） / 会话（session） / Colab 笔记本（notebook） / 词元（token） / 固定版本（pin） / 锁文件（lock file） / 执行记录（trace） / 技能（skill） / 测试夹具（fixture） / 标签（label）, with the English in brackets at the first use of a core concept (brackets are fine outside the narration). harness stays harness in writing too (L06 H3). Commands are unaffected (git clone, --fixture, --label).'
- '[A5] Writing artifacts. Copied letter for letter (case, dots, slashes, hyphens, accents unchanged); never translated, inflected, quoted, put in 《》 or code formatting. Add a Chinese head noun where needed: docker-shell.sh 这个脚本, secrets 目录, docs 目录, outputs 目录, scripts 目录, build agent 这个函数, preview order 工具, get catalog 工具, propose cart 节点, missing-details 场景, personalized 场景, standard 场景, blocked 场景, basic 模式, --model 参数, --show-json, docker ps 这条命令. No sentence opens with an artifact or a lower-case kept-English word: put a Chinese word first (所谓 harness……; 这个 harness……; 这个 trace……; 所有 trace……; 这个 skill……; 加载 skill……; 每个 label……; 其中 basic……; 而 enriched……; 先看 docker ps：……; 再看 docker images：……; 用 docker inspect……; 用 docker image rm……; 命令行里的 --model 参数……; 这个 --inspect-run……; 你笔记本上的 outputs 目录……; 比较只在……; 下单的证据……), so no subtitle starts in lower case either. Product names, capitalized acronyms and class names (OpenAI, Docker, Colab, Python, SQLite, SDK, CLI, MCP, LLM, README, AC215, Dockerfile, Trace, Budget, Context, CartCheck, Comté, Mimolette, Munster) may open a sentence.'
- '[A6] Names with an underscore and code expressions (as L3-L6). With no say:, the checker reads the display line as the spoken text and rejects letter_letter, brackets, quotes inside code and =; the SAY never reads these names with their underscores or brackets either. So the Chinese line writes them the way the narration says them: the underscore becomes a space, case as in the SAY, with a Chinese head noun or in an obvious name slot. Mapping: build_agent → build agent 这个函数; preview_order → preview order 工具; get_catalog → get catalog 工具; get_stock → get stock; load_skill → load skill; read_skill_resource → read skill resource; start_order, get_order_status, assess_event → start order、get order status、assess event; build_act4 → build act 4; "order_placed": False → order placed 设为 false; no_cart → no cart; approval_mode="always_require" → approval mode 设为 always require (as L06''s mode 设为 any); OPENAI_API_KEY (the variable and the Colab secret''s name) → OpenAI API key; RUN_ID → run ID; harness.without("trace") → harness without trace (What survives harness without trace? → 去掉 trace 之后，harness 还剩下什么？); .add() / .without() → add 和 without 方法; Context("basic") → basic Context; propose_cart → propose cart 节点; test_chat_view.py → chat view 测试 (the SAY says chat view tests). The English line gets the literal form through en_display (D4). When the toolkit lets display lines keep underscores (I1), swap these spaced forms back to the literal ones.'
- '[A7] Words to keep apart. 笔记本 (laptop) ≠ notebook (Colab, the course notebook) ≠ 笔记 (S11''s synthetic notes). 层 (a harness layer: Trace, Budget …; and an image layer, S02) ≠ 课上看不见的那一层 (the lecture''s invisible layer) ≠ 环 (V3''s rings: a ring is how a layer is drawn). 状态 (application state, five kinds of state) ≠ 州 (a US state: 按州的检查, 宾夕法尼亚 / 纽约) ≠ status (a printed field: status 为 error). 需求 (the customer''s request: the ask, the confirmed request, today''s request, the host confirms the requests) ≠ 请求 (an API or tool request: the trace shows requests and results) ≠ 订单 1 / 订单 2 (Request 1 / Request 2, request-1 / request-2 on screen). 宿主程序 (the host: the application that runs the harness and answers approvals) ≠ host (MCP''s role, L06; not used here). 经理 (the shop''s manager, a human: 你就是经理, 经理审批, 经理审核) ≠ 管理者模式 (the lecture''s manager pattern). 密钥 (an API key) ≠ 钥匙 (a key that unlocks an action: skills are manuals, not keys; the YELLOW key on the approval drawer) ≠ OpenAI API key (the variable, A6). 在线 (live: a real, billed model call) ≠ 实时 (L03''s live view) ≠ 录制 (recording this video: 录制时, 录下来的回答) ≠ 记录 (stored in the run database: the failed run is still recorded → 失败的运行照样会记录下来; records the cart → 记录购物车). 兜底 (the SDK''s fallback, 40 iterations) ≠ 保险 (a backstop in code) ≠ 防线 (the real guards: the allowlist and your review) ≠ 护栏 (the lecture''s guardrails, L06). label (the --label value of an evaluation batch) ≠ 标签 (an on-screen tag: 灰色标签, your turn 标签) ≠ 信任标注 (a packet source''s trust label). 上下文包 (the context packet) ≠ 包 (a package: pin 了版本的包). pin (a version: pin 了版本) ≠ 钉上 (the capsule is pinned, re-pinned → 重新钉上). 轨道 (V5''s rails) ≠ 轨迹 (the lecture''s trajectory) ≠ 路线 (the order route, the cart''s route). 模型 (the model) ≠ 范例 (a good model to copy, S16[9]). 校验 (validate, validation, revalidate → 重新校验: what the shop''s rules decide) ≠ 验证 (verify: the setup, the lecture''s Verify step) ≠ 检查 (check: CartCheck checks the items, the checks, a state check) ≠ 重新检查 (stock is rechecked). 批准 (an approval, to approve; approve and decline as typed values stay) ≠ 审批 (the process: 经理审批, 审批抽屉, 审批单, 审批顺序) ≠ 审核 (a review: manager review, the email review, your review) ≠ 反思 (the README''s reflection questions). 回执 (receipt: proof that an order happened) ≠ 审批单 (the approval ticket) ≠ 指纹 (the fingerprint). 用例 (an evaluation case: 测试用例) ≠ 场景 (a --scenario value). 节 (a README or lecture section: 第 7 节, 七节) ≠ 部分 (a part of the video: 第一部分) ≠ 幕 (an act). 提示 (a hint) ≠ prompt (an LLM prompt) ≠ 提示符 (a shell prompt: this prompt, the container prompt). 活动说明 (the event brief) ≠ 简报 (L06''s newsletter). 行动 (an action: the action boundary, authorize an action) ≠ 操作 (only in an action can''t be undone → 操作无法撤销). 政策 (policy: shop policies, the policy in the fingerprint) ≠ 规则 (rules: the shop rules, the shipping rule, a fictional rule, a system rule). 拆掉 (tear down; a layer comes off) ≠ 删掉 / 删除 (delete the outputs, the runtime) ≠ 去掉 (remove a tool, without compaction → 去掉压缩). 课程团队 (the staff) ≠ 课上 (the lecture) ≠ 课件 (the slides) ≠ 授课老师 (the instructor, never named).'
- '[A8] Register: a TA in a lab section. Short instructions with spoken verbs (跑, 装, 敲, 改, 贴, 删, 拆, 选, 输入); the viewer is 你 (one-to-one follow-along; never 您, 大家, 同学们); 我们 is us at recording time (我们没有密钥). Chinese word order inside a clause; clause order follows the English (D9). No translationese: not 让我们…… (say 我们来……, 先……), not 这就是为什么…… (say 所以……), few 被 sentences, no stacked 一个……的. No internet slang. Carry the spoken rhythm by meaning: Here are two answers → 这是两个回答; The second run printed more → 第二次运行打印了更多内容; Here''s what a key gets you → 下面是有密钥时的样子; Then stock, price, pairings and preview → 然后是库存、价格、搭配和预览; Back to the hook → 回到开头的例子; And where does it go? → 那它放在哪儿？; Yes, and yes. → 是，也是。; No. → 不会。; One trap → 有个坑; A capsule. → 一个胶囊。; Then compare, offline. → 然后离线比较。; No handoffs. → 没有交接。; Trust the last line. → 以最后一行为准。'
- '[A9] Precision. Translate the quantifiers: only 只, every 每个 / 每次, all 全部 / 全都, about 大约, at most 最多, never 从不 / 绝不, even without a key 即使没有密钥. at the time of recording is always 录制时, never dropped. Counts, line numbers, step numbers and versions exactly as on screen (C1). Errata are mild and always followed by the fix, all in one phrase: a small slip → 一个小疏漏 (S06[6]); a harmless slip → 一个无害的小疏漏 (S02[6]). Printed outcomes: where the SAY contrasts or names a run''s printed outcome, write it as printed (ends unresolved, not blocked → 最后是 UNRESOLVED，不是 BLOCKED; The result: declined → 结果：DECLINED; status saved, email transmitted no → status 为 saved，email transmitted 为 no; the status, placed → 状态 placed; with status error → status 为 error); narrative verbs are Chinese (blocks it → 拦下它, the order places → 订单下单了, is placed → 下单了, ends with no order → 结束，没有订单). Pause-and-ponder (S05[8], S07[5], S09[6], S11[2], S12[6]; Something to ponder. → 来想一个问题。, L01/L02) asks and never answers, and the wording must not give it away: S05[8] must not mention the inner ring or say that the original keeps its layers; S07[5] must not mention get catalog, the full shelf or act 3''s workflow; S09[6] must not say revalidation, stock not in the fingerprint or blocked; S11[2] must not mention the capsule; S12[6] must not say the allowlist or that nothing is transmitted. The S01[2] question (no timer) likewise does not hint at the cart check. Money: Every model call is billed per token → 每次模型调用都按 token 计费; billed input tokens → 计费的输入 token; The only cost is OpenAI tokens → 唯一的花费是 OpenAI 的 token.'
- '[A10] Names. Products, companies and the course keep Latin script (A1 b); 哈佛 only in titles and descriptions. Course: AC215; lecture n → 第 n 讲 (Lecture 7 and the README → 第 7 讲和 README; lecture 2''s layer trick → 第 2 讲讲过的分层技巧); the lecture → 课上; the lecture slides → 课件; part 1 / part 2 → 第一部分 / 第二部分; this video → 这期视频; the instructor → 授课老师, never named; the staff → 课程团队; the course notebook / the course Colab → 课程的 notebook / 课程的 Colab. Customers: the first customer / the second customer → 第一位顾客 / 第二位顾客; a customer → 一位顾客; the customers'' IDs and names are never written in any Chinese line or file (the screen shows masked chips; Customer IDs are masked on screen → 顾客 ID 在画面上遮住了; the ID is masked here → 这里的 ID 被遮住了). The cheeses keep the shop data''s product names, with their accents, so the viewer can match them in the output: Comté, Époisses, Bûcheron, Taleggio, Mimolette, Munster, Brie (never 孔泰, 布里, 塔雷吉欧); the kinds are Chinese: a French cheese → 一款法国奶酪, mild cheeses → 温和的奶酪, nut cheeses → 含坚果的奶酪, raw-milk → 生乳的. Places in Chinese (宾夕法尼亚, 纽约); PA and NY only where the screen''s codes are meant. Quoted text the narration translates: the vendor document''s instruction (ignore the allergy → 忽略过敏), the edited skill line (also send this to another address → 也发一份到另一个地址), the README''s checkpoint questions (which of these can authorize an action → 这些里面哪一个能授权行动); the README''s heading words (Inspect the context first) stay. The user name student stays; container IDs, run IDs and fingerprints are never read out.'
- '[A11] The screen stays English. This series translates only the narration: terminal output and prompts, terminal titles, code panels (comments included), README cards and chips, recorded-output boxes, the schematic Colab screen, the editor and browser drawings, the trackers (README › Setup › Start container, step k of N), lecture tags (Lecture 7 · slides 20–24), the V1 table and its mini-map, V2-V8''s labels, the stamps, the extra cards, the tags (your turn, extra, illustration, recorded · the staff''s saved Colab run, expected, no key, scripted, live · billed per token, offline · free, at the time of recording, erratum, your numbers will differ, concept · lecture only) and the ponder and recap cards are English, and the scenes need no language changes. So where the narration names something on screen, the subtitle writes it as shown: 标签写着 your turn (the tag); the gray tag → 灰色标签; Requested tools / Tool call; Retrieved context; Notebook access; Save a copy in Drive. What the narration says in its own words is translated: an extra check → 额外检查, the tracker → 进度条, the two columns → 两栏. README headings stay (Setup, Inspect the context first); a narration paraphrasing the README says README 里说…… / README 问的是…….'
- '[A12] Mainland Simplified Chinese only: 默认, 程序, 代码, 文件, 目录, 数据库, 网络, 脚本, 视频, 信息, 账号, 函数, 参数, 字段, 字符串, 单元格, 运行时, 配置, 日志, 哈希, 符号链接, 白名单; never 預設, 程式, 程式碼, 檔案, 資料夾, 資料庫, 網路, 腳本, 影片, 帳號, 函式, 引數, 欄位, 字串, 儲存格, 執行階段, 組態, 日誌, 雜湊, 符號連結, 允許清單.'
- '[A13] The series list (the ac215-video skill''s list) in this lecture. agent (15 uses) and harness (23) lead; container (10) and image (5) in setup and teardown (A2); base image twice; Dockerfile once (S02[5]); port twice (no port is published, no ports); prompt as an LLM prompt (the prompt file, a prompt edit, your prompts and outputs, Changed configuration: prompt, fixtures ignore the prompt, system prompt) and as a shell prompt (this prompt, the container prompt → 提示符, A7); token as an LLM token (S01, S04, S11, S12, S14); pull once; clone twice; commit once (S16[4] keep it out of files, commits → 别让密钥进文件、commit); session once (S16[1]); notebook many times; schema once (S16[5] schemas → schema). New in the list here: trace, skill, fixture, label, diff. Not in this script: pipeline, endpoint, embedding, volume, venv, PATH (path in the SAY is a file path → 路径), LoRA, CI, push; repo only as the repository map (S16[0] → repo 地图).'
- '[B1] Spacing. One half-width space between Hanzi and Latin letters, digits or an artifact (输入 exit, Python 3.13.16, 第 484 行, 281 个测试, 1.77 GB, 220.80 美元, secrets 目录, basic 模式, Comté 和 Mimolette). The checker reports a missing space on every displayed sentence. Spaces inside an artifact as they are (python cli.py --help, docker image rm); never add one inside an artifact. No space next to full-width punctuation (……bash docker-shell.sh，构建……; ……decline：). A space between @ and Hanzi too (@ 符号后面). Never U+00A0 / U+202F as a fake no-break space.'
- '[B2] Punctuation. Chinese uses full-width ，。、；：？！“”……, also next to an artifact (输入 approve。). Lists use 、 (确认、提议、校验; start order、get order status、assess event). No brackets of any kind: （）, (), 《》, 【】, [], <> (the checker rejects them without say:, and the bilingual band needs no glosses). “” only for an idea or word quoted in Chinese (课上“只改一层”的规则); artifacts, tag names, screen words, terminal text and status names are never quoted. One Chinese sentence (for one English sentence) has no 。？！ inside: use ，；：; prefer one colon per sentence. 第 N 步 takes a full-width colon before its content when the English has one (Step 1: act 4. → 第 1 步：第 4 幕。). Questions keep ？.'
- '[B3] Symbols the checker rejects (= < > + → ← ^ ≤ ≥ × ÷ ≈, == != +=, a digit followed by !, brackets, letter_letter): never copied into the Chinese line; say them in words or rephrase (A6). approval_mode="always_require" → approval mode 设为 always require; "order_placed": False → order placed 设为 false; harness.without("trace") → harness without trace; Context("basic") → basic Context; revisions ≤ 2 → 最多两次; 26 → 5 messages → 26 条变成 5 条; $ and ¢ → 美元 and 美分 (C2). Allowed and kept as on screen: . and / in paths and names (docker-shell.sh, SKILL.md, python cli.py, approval.requested, order.placed), - in flags and names (--compare, --show-json, --rm, docker ps -a, missing-details, context-fixture-1, gpt-5.6-luna, agent-framework, SHA-256), @ (@ 符号后面), % (80%), accents (Comté, Époisses, Bûcheron).'
- '[C1] Numbers in displayed text. Everything that echoes a number on screen, in the terminal, the code, the slides or written as digits in the SAY uses Arabic digits with no thousands separator, as the terminal prints them (1050, 5600, 1200, 6400, 1942, 4540, 21000, 15000, 16000, 2400, 3000, 1400, 1600, 1000): step numbers (第 1 步, 第 2、3 步, 第 1 到第 3 步, 第 2 到第 4 步, Setup 的第 4 步, 评测第 1 步), act numbers (第 1 幕……第 6 幕), call numbers (第 1 次调用, 第 6 次调用), attempts (第 1 次尝试), line numbers (README 第 484 行), lectures and sections (第 2 讲, 第 7 讲, 第 7 节), counts (12 位客人, 60 位客人, 40 位客人, 281 个测试, 9 个 notebook 测试, 12 个 chat view 测试, 8 次模型调用, 20 次工具调用, 16 次模型调用, 40 次循环迭代, 12 次在线运行, 4 次在线运行, 3 个错误, 1 个缺失, 26 条变成 5 条, 21 条, 7 次压缩, 1 条对话消息, 2 条, 4 次运行, 0 次), 401, versions, sizes, times, money, dates. Small narrative counts and ordinals the SAY writes as words use Hanzi: 两个回答, 七节, 六幕, 五个工具, 四层, 五层, 三层筛子, 十二种奶酪, 七种, 两条通道, 三行, 两个问题, 三步, 六次加载, 五种状态, 两种模式, 三种评委, 两个订单, 五个问题, 五个反思问题, 一个胶囊, 十二条合成笔记, 第一位顾客 / 第二位顾客, 第一部分 / 第二部分, 第一个 / 第二个回答, 最多两次, 重复两次, 三次, 零次. The sentence-initial 12 guests stays a digit inside its clause (宾夕法尼亚 12 位客人).'
- '[C2] Units, versions, model IDs, money and dates. Sizes as on screen with a half-width space: 1.77 GB. Times: 38 秒, 大约 100 秒, 120 秒, 180 秒的时钟, 一分钟或更久 (a word in the SAY). Weights: 1050 克, 900 克, 差 300 克, 0 克. Percent: 80%, 一半以下 (back under half). Money as on screen, never converted to yuan: 150 美元, 64 美元, 220.80 美元 (220 dollars 80), 50.10 美元 (50 dollars 10), 200 美元的门槛, 5600 美分, 6400 美分. Versions with their names: Python 3.13.16, agent-framework 1.19.0 (the package as check_sdk prints it). The model ID as in the code, the same on both lines: gpt-5.6-luna (GPT 5.6 Luna in the SAY; en_display, D4); OpenAI alone stays the company. Dates: 2026 年 10 月 20 日 (October 20, 2026). Hashes and IDs are never read out.'
- '[D1] Sentence alignment (explainer/i18n.py). In narration/*.yaml every SAY line of script.md has one entry (155 blocks); `en` equals the SAY line byte for byte; `zh` has exactly as many items as explainer.voice.split_sentences finds English sentences (339 in this script). Restructure only inside a sentence; never merge or split sentences. Short sentences are items of their own: Pause here. → 在这里暂停。; Seven survive. → 七种留了下来。; Type approve. → 输入 approve。; What did you approve? → 你批准的到底是什么？; The manager approves. → 经理批准了。; A capsule. → 一个胶囊。; No. → 不会。; No handoffs. → 没有交接。; Step 1: act 4. → 第 1 步：第 4 幕。; Test yourself. → 自测一下。; Changed configuration: prompt. → 改动的配置：prompt。; Confounding changes: none. → 混杂改动：没有。. Run `python -m explainer.i18n check videos/ac215-l07-agent-harness --lang zh` until it prints OK.'
- '[D2] No say:, no anchors. There is no Chinese voice: never write say: (the display line is the only text) and never write anchors: (anchors only time animation beats for a Chinese-voiced render). The subtitles are timed by the English audio; the toolkit pairs each Chinese sentence with its English one by position.'
- '[D3] A checker-clean display line. With no say:, every displayed sentence must pass explainer.i18n.spoken_problems: no brackets (B2), no maths symbols (B3), no letter_letter names (A6), no ! after a digit, no clause ending in 种 followed by ，。！？ (Seven survive. → 七种留了下来。, never 剩下七种。; This tutorial uses two → 用了其中两个, never 两种。; 十二种奶酪, 五种状态, 两种模式, 哪一种状态 are fine), a half-width space between Hanzi and Latin letters or digits (B1), each sentence ending in 。！？ or …… (optionally followed by ” or 」), and every Latin word listed in this glossary (zh_subtitle, first_use or allowed_spoken_latin). The checker cuts words with [A-Za-z][A-Za-z''.-]* and ignores one-letter words: gpt-5.6-luna is gpt- and luna, SHA-256 is SHA-, AC215 is AC, context-fixture-1 is context-fixture-, act2-context-live-1 is act and context-live-, Comté is Comt, Époisses is poisses, Bûcheron is cheron, docker-shell.sh stays whole, approval.requested stays whole, --compare is compare, Python 3.13.16 is Python. A Latin word it reports is either an English word to translate (usually) or a missing artifact: add the artifact, cut the same way, to allowed_spoken_latin and to its term. Plurals are left out on purpose (no traces, skills, labels, fixtures, tokens, tests, calls, runs): a plural it reports is an English inflection to drop (所有 trace, 两个 skill, 新的 label, 281 个测试).'
- '[D4] The English line (en_display). The bilingual band shows the SAY sentence, and the SAY spells artifacts out as words for the voice. Every such sentence gets an en_display item with the literal on-screen form, the rest word for word as the SAY; the other sentences of the block are null. Spoken form → literal (script.md''s header list, review_spoken item 11, plus this glossary''s additions): python cli.py, dash dash act 1, dash dash scenario standard → python cli.py --act 1 --scenario standard; python cli.py, dash dash help → python cli.py --help; dash dash compare → --compare; dash dash show JSON → --show-json; dash dash preview context → --preview-context; dash dash prompt file → --prompt-file; dash dash fixture → --fixture; dash dash rm → --rm; dash dash inspect run → --inspect-run; docker ps dash a → docker ps -a; Docker image remove → docker image rm; Docker ps / Docker images / Docker inspect (sentence-initial) → docker ps / docker images / docker inspect; build agent → build_agent; preview order → preview_order; order placed set to false → "order_placed" set to False; get catalog → get_catalog; get stock → get_stock; load skill → load_skill; read skill resource → read_skill_resource; start order, get order status, assess event → start_order, get_order_status, assess_event; build act 4 → build_act4; Cart Check → CartCheck; harness without trace → harness.without("trace"); the add and without methods → the .add() and .without() methods; basic Context → Context("basic"); approval mode always require → approval_mode="always_require"; no cart → no_cart; maximum of 8 model calls reached → Maximum of 8 model calls reached; requested tools / tool call → Requested tools / Tool call; inspect the context first → Inspect the context first; the missing details scenario → the missing-details scenario; tasting planning and vendor outreach → tasting-planning and vendor-outreach; context fixture 1 → context-fixture-1; status saved, email transmitted no → status: saved, email transmitted: no; with status error → with status: error; the result: declined → The result: DECLINED (S11[6]); ends unresolved, not blocked → ends UNRESOLVED, not BLOCKED (S08[6]); says invalid or unauthorized → says Invalid or unauthorized (S13[7]); approval requested, approval decided, policy decision allow, order placed, run finished → approval.requested, approval.decided, policy.decision allow, order.placed, run.finished (S14[4]); model failed → model.failed; OpenAI API key (the secret''s name, S03[5]) → OPENAI_API_KEY; GPT 5.6 Luna → gpt-5.6-luna; agent framework 1.19.0 → agent-framework 1.19.0; money: 150 dollar budget → $150 budget, 64 dollars → $64, 220 dollars 80 → $220.80, 50 dollars 10 → $50.10, 200 dollar threshold → $200 threshold. Underscore names (A6) are restored to their literal form only in en_display; the Chinese line keeps the spaced form. SKILL.md stays as written; docker exec stays as typed. The English video''s own .srt is unaffected.'
- '[D5] Content parity. Each Chinese sentence translates its English sentence only: no added commands, flags, glosses, Chinese screen names or explanations; 额外 only where the English says extra; kept-English words get no Chinese explanation (the English line is right below); ponder questions get no answers (A9). The few head words A5 needs (这个, 先看, 再看, 用, 命令行里的) carry no content. the prompt file is prompt 文件, without adding shop_assistant.md; the vendor skill is 供应商那个 skill, without adding vendor-outreach.'
- '[D6] Fixed phrases. Pause and run it. → 暂停一下，跑一遍。 Pause here. → 在这里暂停。 Pause and run both, with your key. → 暂停一下，用你的密钥把两条都跑一遍。 Pause, run steps 2 and 3, and wait for this prompt. → 暂停一下，跑第 2、3 步，等到出现这个提示符。 Pause, and verify your setup either way. → 暂停一下，两条路任选一条，把你的环境验证一遍。 Pause here if you have a key. → 有密钥的话就在这里暂停。 Pause and run steps 8 and 9. → 暂停一下，跑第 8、9 步。 Pause and run steps 1 to 3. → 暂停一下，把第 1 到第 3 步跑一遍。 Pause and run steps 4 and 5; the cell is for Colab. → 暂停一下，跑第 4、5 步；单元格是给 Colab 用的。 Pause and run step 1. → 暂停一下，跑第 1 步。 Pause and run steps 2 to 4. → 暂停一下，把第 2 到第 4 步跑一遍。 Pause and run evaluation steps 1 and 2. → 暂停一下，跑评测第 1、2 步。 Pause and run evaluation step 3. → 暂停一下，跑评测第 3 步。 Pause, and tear down. → 暂停一下，把它拆掉。 Pause and try them; answers are in the exercises. → 暂停一下，试着答一答；答案在练习里。 When a tag says your turn, pause and run the command. → 看到标签写着 your turn，就暂停，自己跑这条命令。 With a key, look for … → 有密钥的话，要找的是…… Without a key, … → 没有密钥的话，…… As an extra, … → 额外再跑一个：…… / 再额外…… Three extras from a second terminal. → 在第二个终端里做三个额外检查。 an extra check reads the file → 额外检查会读取这个文件 Step N: → 第 N 步： Steps 2 and 3 are … → 第 2、3 步是…… Evaluation step N … → 评测第 N 步…… at the time of recording → 录制时. A small slip … → 一个小疏漏…… (A9). Something to ponder. → 来想一个问题。 Yes, and yes. → 是，也是。 Here''s what a key gets you, from the staff''s saved run. → 下面是有密钥时的样子，来自课程团队保存的运行。 Test yourself. → 自测一下。 In part 2, … → 第二部分，…… Part 2 picks up at the container prompt → 第二部分从 container 的提示符接着来.'
- '[D7] Files. narration/g1.yaml = S01-S07 (part 1: one agent: setup, the loop, its layers and its context; 68 blocks, 148 sentences), narration/g2.yaml = S08-S16 (part 2: the harness takes control; 87 blocks, 191 sentences), video.yaml''s two parts; each file opens with a comment (coverage; the rules it applies: A6 spaced names, B3 symbols in words, C1 numbers without separators, C2 money, versions and the model ID, D4 en_display, no say: / anchors:) and keeps the script''s order. Double-quoted strings; escape a literal double quote or backslash for YAML.'
- '[D8] Length on the English timing. The Chinese is read while the English plays; the band switches where the English cues switch (a Chinese piece that reads faster than 9 units/s gets at most 1 s more). Each Chinese sentence should read in about the time the English sentence is heard: at most about 2 units per English word (a Hanzi counts 1, a Latin letter 0.55), so drop redundant connectives and repeated subjects, never content. Long artifacts cost length too (python cli.py --act 1 --scenario standard 22.6 units, approval mode 设为 always require 18.0, Maximum of 8 model calls reached 17.6, read skill resource 10.5, Invalid or unauthorized 12.7): don''t repeat them where the English doesn''t; after the first mention in a block, use a short reference (这条命令, 这个工具, 这个 skill, 这一批, 这个场景).'
- '[D9] Keep the English clause order (a series lesson, ac215-video skill). The toolkit pairs Chinese and English clause by clause, so a Chinese sentence that puts a condition first (如果……，就……) swaps meaning between two neighbouring cues. Conditions, purposes and time adverbials sit where the English has them: an English condition first stays first (If that''s you, shell in … → 如果是这种情况，就……; When a tag says your turn, pause … → 看到标签写着 your turn，就暂停……; Before every call, the harness … → 每次调用之前，harness ……); with the main clause first in English, the Chinese keeps the main clause first or puts the condition inside the same clause with no comma before the main verb (Move right when stakes are high … → 风险高或操作无法撤销时就往右移; Drafting is refused until the email template is read → 起草一直会被拒绝，直到读过邮件模板为止; Pause here if you have a key → 有密钥的话就在这里暂停). Three sentences flagged by review_spoken item 9: S05[0] keeps 循环 in its first cue (如果你写过一个循环，它调用模型并执行工具调用，那你就是 harness 工程师); S09[2] keeps 哈希 before the list (一个指纹：SHA-256 哈希，覆盖需求、商品明细……); S06[2] keeps the taste before its content (……保存的口味：温和的奶酪和无酒精搭配). S14[4]''s event list keeps the English order (approval.requested，带着指纹；approval.decided，由人决定；……).'
- '[G1] Width. Bilingual band: Chinese line at most 30 units, English line 96 characters; Chinese-only subtitles (.zh.srt) 22 units a line, 2 lines a cue. Write clauses of at most about 24 units separated by ，；： so the splitter has clean cut points; avoid an unpunctuated clause over 30 units (python cli.py --act 1 --scenario standard alone is 22.6 units: give it a clause of its own).'
- '[G2] Cue endings: the toolkit strips a cue''s final 。，、；： and keeps ？！…… and a closing ” (subtitles.strip_end). Prefer a Chinese word over ''artifact + full stop'' at the end of a sentence where it reads as well (……进入 agent-harness 目录。 reads steadier than ……进入 agent-harness。; both are valid).'
- '[G3] Never split a command. The splitter treats a space between two Latin words in a Chinese line as a good cut point, so python cli.py --help could land on two lines and the viewer could not copy it. Put the whole command at the end of a clause, after a full-width colon (第 3 步：bash docker-shell.sh，……; 第 1 步：python cli.py --act 1 --scenario standard。; ……最后一条是：python cli.py --help，……), at most one command per cue, with little Chinese around it. Flags said alone (--compare, --show-json, --fixture, --rm) are short enough anywhere. A command too long for a line is named the way the SAY names it (act 3, scenario standard → 第 3 幕，standard 场景), and the terminal and the English line show it. Check every cue with a command in the rendered .zh.srt.'
- '[H1] Titles (meta.yaml). Video, part and chapter titles use the written register (A4: 容器, 端口, 智能体, 技能, 评测); questions keep their question mark; the English colon structure is kept (第 1 幕：……; 评测：……); commands, file names and code names stay as they are (meta.yaml is not read by the checker, so brackets and underscores are fine there). Core-concept chapters carry their English short name for search, as L1, L3, L5 and L6 do: 智能体（agent）, 技能（skill）. LLM: Agents II → LLM 智能体 II (as L6''s 智能体 I); Act n → 第 n 幕; the metaphors keep their picture: sieves and lanes → 筛选与两条通道 (review_spoken 17), rails, not suggestions → 是轨道，不是建议, manuals, not keys → 是说明书，不是钥匙, five drawers → 五个抽屉, the capsule → 胶囊; the harness takes control → harness 接管; harness stays.'
- '[H2] Description (Bilibili / YouTube): two or three sentences, written register, this glossary''s terms: AC215 lecture 7''s follow-along of dlops-io/agent-harness and the course''s Agent Harness Colab notebook; what the viewer does and learns (setup in one container with no ports and the 281 offline tests; the rule the model proposes, the harness decides; Act 1''s loop in real numbers and its four harness layers; Act 2''s context packet; Act 3''s Python-owned workflow graph, fingerprint-bound manager approval and checkout revalidation; Act 4''s compaction, state capsule and host-written memory; Act 5''s progressive disclosure of skills; Act 6''s agent that calls a governed workflow; evaluation evidence from traces, fixture batches and a one-change A/B with --compare); English narration with Chinese and bilingual subtitles; terminal output recorded on 2026-10-20 without an OpenAI key, so offline and scripted commands ran for real, live commands stop at the 401, and the model''s answers are the staff''s saved Colab run. Never the customers'' IDs or names.'
- '[H3] Companions: i18n/zh/README.md (and exercises.md / digest.md if made) are translated with this glossary in the written register (A4: 仓库, 克隆, 提交, 容器, 镜像, 端口, 提示词, 智能体（agent）, 会话（session）, Colab 笔记本（notebook）, 技能（skill）, 执行记录（trace）, 测试夹具（fixture）, 行动边界, 上下文工程, 上下文窗口, 压缩, 胶囊, 渐进式披露, 白名单, 评测集); harness stays English and is explained once at its first use: harness（模型外面那层由代码执行的循环、限制、上下文和检查）. Brackets and underscores are fine there (not checked). Headings and `<summary>答案</summary>` are translated. Close with a term table: English | the word used here | other common renderings (harness: 外壳 / 驾驭框架; trace: 链路追踪 / 轨迹记录; skill: 技能; fixture: 测试夹具 / 固定装置; compaction: 压缩 / 上下文压缩; progressive disclosure: 渐进式披露 / 逐步披露; allowlist: 白名单 / 允许列表; eval set: 评测集 / 评估集; LLM as judge: LLM 评委 / LLM 裁判; handoff: 交接 / 移交; token: 词元 / 令牌).'
- '[H4] Code and commands in the companions stay byte for byte: code blocks, commands, file names and inline `code` are unchanged; only # comments and the surrounding prose are translated.'
- '[I1] (Request, open since L3) `explainer.i18n check` applies its spoken-text hygiene (_SPOKEN_BAD: brackets, maths symbols, letter_letter names) to the display line when a sentence has no say:. For a subtitles-only video (this series; no languages.zh.voice in video.yaml, voice: none in the glossary) those checks protect nothing and force A6 and B3 (here: build_agent, preview_order, get_catalog, get_stock, load_skill, read_skill_resource, start_order, get_order_status, assess_event, build_act4, order_placed, no_cart, approval_mode="always_require", OPENAI_API_KEY, RUN_ID, harness.without("trace"), Context("basic")). Proposal: when the glossary''s voice is none, skip _SPOKEN_BAD for display-only sentences (keep the Latin-word, spacing and sentence-end checks). Then A6 and B3 become: copy the literal form.'
- '[I2] (To do, from L1 I3) `_cuts` in explainer/subtitles.py treats a space between Latin words in a Chinese line as a good cut point, so a command can be split (G3). Proposal: in a Chinese line, treat a run of Latin words separated only by spaces as unbreakable unless it alone exceeds a line.'
- '[I3] (Note) explainer/subtitles.py reads every video''s glossary.yaml: the 2-3 word English alternatives of each term''s en field are kept on one English line, and the 2-7 character Chinese headwords of zh_subtitle are registered in jieba, in every video''s subtitles. The en and zh_subtitle fields of this file therefore list real terms only (no sentences); a later stitch of another video picks them up.'
terms:
# ---------------------------------------------------------------- The rule: the model proposes, the harness decides
- en: 'harness / the harness / harness engineer / harness engineering / the code around the model'
  zh_subtitle: 'harness / harness 工程师 / harness 工程 / 模型外面的代码'
  first_use: 'S01[4]：所谓 harness，就是模型外面的代码：循环、它的限制、它的上下文和它的检查。'
  note: 'A3: stays English in the subtitles and in writing (L06 A3: no settled Chinese term; this lecture''s topic). Lower case, never opens a sentence (A5): 所谓 harness……, 这个 harness……. S05[0] keeps 循环 in its first cue (D9): 如果你写过一个循环，它调用模型并执行工具调用，那你就是 harness 工程师.'
- en: 'the model proposes; the harness decides / propose / proposal / an unvalidated proposal / decide'
  zh_subtitle: '模型提议；harness 决定 / 提议 / 未经验证的提议 / 决定'
  first_use: 'S01[4]：课程的 notebook 用一句话说清了：模型提议；harness 决定。'
  note: 'The video''s rule, one wording everywhere (S01, S16): 模型提议；harness 决定. propose → 提议 (the model proposes quantities → 模型提议数量), decide → 决定; where it matters, so do you → 在关键的地方，你也一样.'
- en: 'two columns / sort every line of output / the model''s part / the harness''s part'
  zh_subtitle: '两栏 / 模型负责的部分 / harness 负责的部分'
  first_use: 'S01[4]：今天我们把输出的每一行，都归到这两栏里。'
  note: 'V1''s two columns (BLUE left, GREEN right): 两栏, 左边 / 右边.'
- en: 'action boundary / five concerns / control flow / context and memory / verification / sub agents / who decides'
  zh_subtitle: '行动边界 / 关注点 / 控制流 / 上下文与记忆 / 验证 / 子 agent'
  first_use: 'S05[6]：现在这两栏变成了课上的行动边界：五个关注点，左边是模型负责的部分，右边是 harness 的。'
  note: 'Slide 22''s table (the rows stay English on screen, A11): action → 行动 (authorize an action → 授权行动), Control flow → 控制流, Tools → 工具, Context & memory → 上下文与记忆, Verification → 验证, Sub agents → 子 agent. filled in → 填好的.'
- en: 'move right / move left / stakes are high / can''t be undone / predictable / need an audit / give control to code'
  zh_subtitle: '往右移 / 往左移 / 风险高 / 无法撤销 / 可预测 / 审计 / 把控制权交给代码'
  first_use: 'S08[0]：回想一下往右移的那个箭头：风险高、操作无法撤销，任务可预测或者需要审计的时候，就把控制权交给代码。'
  note: 'Slides 22-23. an action can''t be undone → 操作无法撤销 (here 操作, the irreversible operation; 行动 elsewhere, A7). Move right when … → 往右移，……时 or one clause 风险高或操作无法撤销时就往右移 (D9).'
- en: 'the six steps / Think / Reason / Plan / Execute / Verify / Response / the verify step / the response step / hidden reasoning'
  zh_subtitle: '思考 / 推理 / 规划 / 执行 / 验证 / 回复 / 验证步骤 / 回复步骤 / 隐藏的推理'
  first_use: 'S05[5]：CartCheck 就是课上的验证步骤。'
  note: 'Slide 21''s strip (English on screen): Think 思考, Reason 推理, Plan 规划, Execute 执行, Verify 验证, Response 回复. not hidden reasoning → 不是隐藏的推理.'
- en: 'agent / an agent / the outer agent / the agent outside / LLM'
  zh_subtitle: 'agent / 外层 agent / LLM'
  first_use: 'S04[0]：第 1 幕从课上的回顾开始：agent 就是一个带着指令和工具的模型，一直运行到任务完成。'
  note: 'Series list (L5, L6): agent stays, measure word 个, never opens a sentence (A5). Written register 智能体（agent）. the model → 模型.'
- en: 'the lecture''s recap / instructions / tools / memory / the lecture''s question / what goes into the model'
  zh_subtitle: '课上的回顾 / 指令 / 工具 / 记忆 / 课上的问题'
  first_use: 'S04[8]：这就是课上的问题：怎么管理进入模型的东西？'
  note: 'L06''s lecture frame: instructions → 指令, tools → 工具, memory → 记忆 (never 内存).'
# ---------------------------------------------------------------- Setup: the container, the key and Docker
- en: 'laptop / your laptop / the clone / secrets folder / one level up / service account'
  zh_subtitle: '笔记本 / secrets 目录 / 上一级 / 服务账号'
  first_use: 'S02[2]：第 1 步在上一级创建 secrets 目录。'
  note: 'L01: laptop → 笔记本 (A7: never notebook). L03-L06: service account → 服务账号. Folder names verbatim + 目录.'
- en: 'container / image / base image / mount / environment variable / publish a port / HTTPS'
  zh_subtitle: 'container / image / base image / 挂载 / 环境变量 / port / 发布 / HTTPS'
  first_use: 'S02[0]：一个 container 挂载这两个目录，密钥以环境变量的形式传进去，不发布任何 port，应用唯一的对外调用是走 HTTPS 去 OpenAI。'
  note: 'A2 (L2-L6): container, image, base image, port stay; mount → 挂载, publish → 发布, environment variable → 环境变量.'
- en: 'key / your key / an OpenAI key / a real key / the placeholder / the placeholder key / exports your key'
  zh_subtitle: '密钥 / OpenAI 密钥 / 真实的密钥 / 占位符 / 占位密钥 / 导出'
  first_use: 'S02[3]：把占位符换成你自己的密钥，或者离线时跳过这一行。'
  note: 'L06: key → 密钥 (never key or 钥匙, A7), the placeholder → 占位符, the placeholder key → 占位密钥; the variable OPENAI_API_KEY as SAY says it: OpenAI API key (A6). Never a key value in any line.'
- en: 'bash docker-shell.sh / builds the image / starts the container / your first build / pulls it / a minute or more'
  zh_subtitle: 'bash docker-shell.sh / 构建 image / 启动 container / 第一次构建 / pull / 一分钟或更久'
  first_use: 'S02[4]：第 3 步：bash docker-shell.sh，构建 image 并启动 container。'
  note: 'Command at the end of a clause after a colon (G3). pull stays (A2): your first build also pulls it → 你第一次构建还要先 pull 它.'
- en: 'Dockerfile / lockfile / the layer trick / layer / copies the code'
  zh_subtitle: 'Dockerfile / lock 文件 / 分层技巧 / 层'
  first_use: 'S02[5]：Dockerfile 先根据 lock 文件安装，再复制代码：这是第 2 讲讲过的分层技巧。'
  note: 'L01: lockfile → lock 文件; L02-L04: layer → 层 (an image layer); the layer trick → 分层技巧. A harness layer is also 层 (A7).'
- en: 'banner / activated / a harmless slip / the at sign / container ID / this prompt / the container prompt'
  zh_subtitle: '横幅 / 已激活 / 一个无害的小疏漏 / @ 符号 / container ID / 提示符'
  first_use: 'S02[6]：横幅说环境已经激活了，可这时脚本还没激活它：一个无害的小疏漏。'
  note: 'L05/L06 word for word: 横幅, @ 符号后面是 container ID; a shell prompt → 提示符 (an LLM prompt stays prompt, A7).'
- en: 'second terminal / docker ps / docker images / docker inspect / configuration / sensitive / integration'
  zh_subtitle: '第二个终端 / docker ps / docker images / docker inspect / 配置 / 敏感信息 / 集成'
  first_use: 'S02[9]：用 docker inspect，能在 container 的配置里看到你的密钥；真实的密钥要当作敏感信息对待。'
  note: 'Commands verbatim, in lower case, never opening a sentence (A5): Docker ps: no ports. → 先看 docker ps：没有 port。; Docker images: … → 再看 docker images：…….'
- en: 'docker exec / shell in / the README''s three lines / hidden / out of your history / keep working in that shell'
  zh_subtitle: 'docker exec / 进到 container 的 shell 里 / 隐藏输入 / 历史记录'
  first_use: 'S02[11]：如果是这种情况，就从第二个终端进到 container 的 shell 里，再输入 README 的那三行：密钥隐藏着输入，也不会留在你的历史记录里。'
  note: 'shell stays (L1). shell in → 进到 container 的 shell 里; your history → 你的历史记录 (shell history → shell 历史记录, L2-L4).'
- en: 'from here on / inside the container'
  zh_subtitle: '从这里开始 / 在 container 里运行'
  first_use: 'S02[7]：从这里开始，每条命令都在 container 里运行。'
# ---------------------------------------------------------------- Verify offline, and Colab
- en: 'verify / offline / check the SDK / installed versions / feature'
  zh_subtitle: '验证 / 离线 / SDK / 安装的版本 / 功能'
  first_use: 'S03[0]：现在在 container 里离线验证。'
  note: 'verify (the setup) → 验证, as the lecture''s Verify step (A7: validate → 校验, check → 检查). true stays (code value).'
- en: 'tests / 281 tests / ending in OK / scripted model responses / the machinery / not the model'
  zh_subtitle: '测试 / 281 个测试 / OK / 脚本模拟的模型回复 / 这套机制'
  first_use: 'S03[1]：它们用的是脚本模拟的模型回复，所以测的是这套机制，不是模型。'
  note: 'scripted → 脚本模拟的 (A3; the on-screen tag scripted stays English, A11). they test the machinery, not the model → 测的是这套机制，不是模型 (S03, S14: one wording).'
- en: 'logs / deliberate failures / an injected audit outage / approval-identity warning / trust the last line'
  zh_subtitle: '日志 / 故意制造的失败 / 注入的审计故障 / 审批身份警告 / 以最后一行为准'
  first_use: 'S03[2]：第 3 步显示日志：故意制造的失败，比如注入的审计故障，还有一个第 4 幕会再遇到的审批身份警告。'
  note: 'the approval-identity warning → 审批身份警告 (S03, S10); Trust the last line. → 以最后一行为准。'
- en: 'model check / the default / a model flag / an environment variable / your account'
  zh_subtitle: '模型检查 / 默认值 / --model 参数 / 环境变量 / 账号'
  first_use: 'S03[3]：命令行里的 --model 参数优先于环境变量，环境变量又优先于这个默认值；如果你的账号用不了它，就设置其中一个。'
  note: 'A model flag is --model on screen: --model 参数 (never opens a sentence, A5). beats → 优先于.'
- en: 'notebook tests / chat view tests / the README''s notebook section'
