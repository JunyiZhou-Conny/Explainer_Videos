<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explainer Studio · 制作进度</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23171717'/%3E%3Cpath d='M10.6 3 5.4 13' stroke='%23DA2D24' stroke-width='2.4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header><div class="bar-in">
  <span class="brand">CONNY<span class="dot">/</span>EXPLAINER STUDIO</span>
  <nav>
    <a class="active" href="./">制作进度</a>
    <a href="library.html">视频库</a>
    <a href="new.html">新视频</a>
    <a href="https://github.com/JunyiZhou-Conny/Explainer_Videos" target="_blank" rel="noopener">GitHub ↗</a>
  </nav>
</div></header>
<main>
  <div class="page-head">
    <div>
      <h1>制作进度</h1>
      <p class="sub">每一集走到哪一步、大约完成多少，以及哪些事在等你。</p>
    </div>
    <div id="fresh" class="fresh"></div>
  </div>
  <div id="app"><p class="empty">加载中…</p></div>
</main>
<script src="app.js"></script>
<script>
const DAY = 864e5;
let S = null, L = null;

const stageOf = key => S.stages.find(s => s.key === key) || S.stages[0];
const shortBranch = b => (b || '').replace(/^(claude|episode)\//, '').replace(/-[a-z0-9]{6}$/, '');
const stale = e => (e.state === 'active' || e.state === 'queued')
  && Date.now() - Date.parse(e.branch_activity_at) > DAY;

function bar(e){
  const at = S.stages.findIndex(s => s.key === e.stage);
  const frac = e.progress ? e.progress.done / e.progress.total : 0;
  const segs = S.stages.map((s, k) => {
    let cls = 'seg' + (s.who !== 'agent' ? ' you' : '');
    if(e.state === 'published' || k < at) cls += ' done';
    else if(k === at && e.state !== 'queued') cls += ' now';
    return `<i class="${cls}" style="--w:${s.weight};--f:${k === at ? frac : 0}" title="${esc(s.label)}"></i>`;
  }).join('');
  return `<div class="bar" role="img" aria-label="当前阶段：${esc(stageOf(e.stage).label)}，约 ${e.percent}%">${segs}</div>`;
}

function statusText(e){
  const st = stageOf(e.stage);
  const part = e.progress ? ` ${e.progress.done}/${e.progress.total}` : '';
  switch(e.state){
    case 'active': return `<b>${esc(st.label)}中${part}</b> · 本阶段 ${span(e.stage_since)}`;
    case 'question': return `<b>等你答复</b> · 卡在「${esc(st.label)}」`;
    case 'queued': return `<b>排队中</b> · 同一会话先做前面的集`;
    case 'paused': return S.stages.findIndex(s => s.key === e.stage) >= S.stages.findIndex(s => s.key === 'ready')
      ? '<b>暂停</b> · 成片已完成' : `<b>暂停</b> · 停在「${esc(st.label)}」`;
    case 'ready': return `<b>成片完成</b> · 等你合并`;
    case 'publishing': return `<b>已打包发布</b> · 等你上传 B 站`;
    default: return `<b>已上 B 站</b>`;
  }
}

function card(e){
  const badges = [];
  if(e.state === 'question') badges.push('<span class="badge you">等你答复</span>');
  else if(e.state === 'paused') badges.push('<span class="badge">⏸ 暂停</span>');
  else if(e.state === 'queued') badges.push('<span class="badge">排队</span>');
  else badges.push('<span class="badge active">制作中</span>');
  if(stale(e)) badges.push('<span class="badge warn" title="这个会话的分支一天多没有推送、检查点或标签变化：可能撞了用量限制、在聊天里等你回复，或被你暂停了。打开那个会话看一眼。">一天多没动静</span>');
  const who = e.claim ? `${esc(e.claim.model)}${e.claim.branch ? ` · <span title="${esc(e.claim.branch)}">${esc(shortBranch(e.claim.branch))}</span>` : ''}` : '未认领';
  const pct = e.state === 'queued' ? '' : `<span class="pct">${e.percent}%</span>`;
  return `<a class="ep ${e.state}${e.state === 'queued' || e.state === 'paused' ? ' dim' : ''}" href="${esc(e.url)}" target="_blank" rel="noopener">
    <div class="ep-top"><span class="ep-code">${esc(e.code || '#' + e.number)}</span><span>${badges.join(' ')}</span></div>
    <div class="ep-title">${esc(e.title)}</div>
    ${bar(e)}
    <div class="ep-status"><span>${statusText(e)}</span>${pct}</div>
    <div class="ep-meta"><span class="who">${who}</span><span>${ago(e.branch_activity_at || e.activity_at)}有动静</span></div>
  </a>`;
}

function todoItem(e){
  const code = esc(e.code || '#' + e.number);
  if(e.state === 'publishing') return `<div class="todo-item">
      <span class="code">${code}</span>
      <div class="what"><b>${esc(e.title)}</b><span>发布包已在 release 上，等你在 Mac 上跑一次上传（每跑一次传一集）。</span></div>
      <div class="act"><a class="btn ghost small" href="${esc(e.url)}" target="_blank" rel="noopener">issue #${e.number}</a></div>
      <div class="cmd"><code>${esc(S.worker_command)}</code><button type="button" data-copy="${esc(S.worker_command)}">复制</button></div>
    </div>`;
  if(e.state === 'ready'){
    const link = e.pr ? `<a class="btn primary small" href="${esc(e.pr.url)}" target="_blank" rel="noopener">打开 PR #${e.pr.number} →</a>`
                      : `<a class="btn primary small" href="${esc(e.url)}" target="_blank" rel="noopener">打开 issue →</a>`;
    return `<div class="todo-item">
      <span class="code">${code}</span>
      <div class="what"><b>${esc(e.title)}</b><span>成片和审查记录都齐了，合并后自动渲染发布。${e.pr?.draft ? '草稿 PR 先点 Ready for review 再 Merge，' : ''}也可以直接让 Claude 替你合并。</span></div>
      <div class="act">${link}</div>
    </div>`;
  }
  return `<div class="todo-item">
      <span class="code">${code}</span>
      <div class="what"><b>${esc(e.title)}</b><span>代理在 issue 里问了你一个问题，答复后它才能继续。</span></div>
      <div class="act"><a class="btn primary small" href="${esc(e.url)}" target="_blank" rel="noopener">去回答 →</a></div>
    </div>`;
}

const CELL = {published: 'published', ready: 'you', publishing: 'you', question: 'you', active: 'active',
              queued: 'queued', paused: 'paused', skip: 'skip', none: 'none'};
const CELL_TEXT = {published: '已上线', ready: '等你合并', publishing: '等你上传', question: '等你答复',
                   active: '制作中', queued: '排队', paused: '暂停', skip: '跳过', none: '未开始'};

function seriesMap(s){
  const c = s.counts, n = k => c[k] || 0;
  const you = n('ready') + n('publishing') + n('question');
  const cells = s.cells.map(x => {
    const tip = x.state === 'skip' ? `${x.code} · ${x.note}`
      : x.state === 'none' ? `${x.code} · 未开始`
      : `${x.code} · ${x.title} — ${CELL_TEXT[x.state]}${x.state === 'active' ? ` · ${stageOf(x.stage).label} · 约 ${x.percent}%` : ''}`;
    const href = x.bilibili?.url || x.url;
    const tag = href ? `a href="${esc(href)}" target="_blank" rel="noopener"` : 'div';
    return `<${tag} class="cell ${CELL[x.state]}" style="--p:${x.state === 'active' ? x.percent : 0}" title="${esc(tip)}"><span>${x.n}</span></${tag.split(' ')[0]}>`;
  }).join('');
  return `<div class="map">
    <div class="map-head"><b>${esc(s.name)}</b>
      <span class="fresh num">已上线 ${n('published')} · 等你 ${you} · 制作中 ${n('active')} · 排队 ${n('queued')} · 暂停 ${n('paused')} · 未开始 ${n('none')}（共 ${s.planned} 讲）</span></div>
    <div class="cells" style="--n:${s.planned}">${cells}</div>
    <div class="legend">
      <span><i class="published"></i>已上 B 站</span><span><i class="you"></i>等你处理</span>
      <span><i class="active"></i>制作中（底部填充=进度）</span><span><i class="queued"></i>排队</span>
      <span><i class="paused"></i>暂停</span><span><i></i>未开始</span><span><i class="skip"></i>跳过</span>
    </div>
  </div>`;
}

function section(id, title, aside, body, attention){
  return `<section class="section" id="${id}">
    <div class="section-h${attention ? ' attention' : ''}"><h2>${title}</h2><span class="aside">${aside || ''}</span></div>
    ${body}</section>`;
}

function grouped(list, cls){
  const bySeries = new Map();
  for(const e of list){ if(!bySeries.has(e.series)) bySeries.set(e.series, []); bySeries.get(e.series).push(e); }
  const names = Object.fromEntries((L?.series || []).map(s => [s.id, s.name]));
  for(const s of S.series) names[s.id] = s.name;
  const many = bySeries.size > 1;
  return [...bySeries].map(([id, eps]) =>
    (many ? `<div class="subhead">${esc(names[id] || '单集')}</div>` : '') +
    `<div class="grid${cls ? ' ' + cls : ''}">${eps.map(card).join('')}</div>`).join('');
}

function render(){
  const eps = S.episodes;
  const doing = eps.filter(e => e.state === 'active' || e.state === 'question');
  const waiting = eps.filter(e => e.state === 'queued' || e.state === 'paused');
  const todo = eps.filter(e => ['question', 'ready', 'publishing'].includes(e.state))
    .sort((a, b) => ['question', 'ready', 'publishing'].indexOf(a.state) - ['question', 'ready', 'publishing'].indexOf(b.state));
  const live = (L?.series || []).flatMap(s => s.episodes.filter(v => v.bilibili).map(v => ({...v, short: s.short})))
    .sort((a, b) => (b.bilibili.pubdate || 0) - (a.bilibili.pubdate || 0));
  const count = st => eps.filter(e => e.state === st).length;

  const stats = `<div class="stats">
    <a class="stat" href="#doing"><b>${doing.length}</b><span>制作中</span></a>
    <a class="stat" href="#wait"><b>${count('queued')}</b><span>排队</span></a>
    <a class="stat" href="#wait"><b>${count('paused')}</b><span>暂停</span></a>
    <a class="stat${todo.length ? ' hot' : ''}" href="#you"><b>${todo.length}</b><span>等你处理</span></a>
    <a class="stat" href="library.html"><b>${L ? L.totals.published : '–'}</b><span>已上 B 站</span></a>
  </div>`;

  const todoBody = todo.length ? `<div class="todo">${todo.map(todoItem).join('')}</div>`
    : '<p class="empty">现在没有需要你处理的事。✓</p>';
  const key = S.stages.map(s => s.who === 'agent' ? s.short : `<b>${s.short}</b>`).join(' → ');
  const doingBody = doing.length
    ? `<p class="stage-key">进度条从左到右：${key}（宽度 ≈ 工作量；加粗的三格是你的动作）</p>${grouped(doing)}`
    : '<p class="empty">没有正在制作的集。</p>';
  const liveRows = live.slice(0, 6).map(v => `<a class="row" href="${esc(v.bilibili.url)}" target="_blank" rel="noopener">
      <span class="code">${esc(v.code || v.short)}</span>
      <span class="t">${esc(v.title)}</span>
      <span class="r">${v.bilibili.pubdate ? clock(new Date(v.bilibili.pubdate * 1000).toISOString()).split(' ')[0] : ''} · B 站 ↗</span></a>`).join('');
  const prs = S.pulls.map(p => `<a class="row" href="${esc(p.url)}" target="_blank" rel="noopener">
      <span class="code">#${p.number}</span><span class="t">${esc(p.title)}<small>${esc(shortBranch(p.branch))}</small></span>
      <span class="r">${p.draft ? '草稿 · ' : ''}${ago(p.updated_at)}</span></a>`).join('');

  const prsOpen = document.querySelector('#prs details')?.open;    // survive the 5-minute refresh
  document.getElementById('app').innerHTML =
    stats +
    section('you', '需要你处理', todo.length ? `${todo.length} 件` : '', todoBody, todo.length > 0) +
    S.series.map(s => section('map-' + s.id, '课程地图', '', seriesMap(s))).join('') +
    section('doing', '制作中', `${doing.length} 集`, doingBody) +
    (waiting.length ? section('wait', '排队与暂停', `${waiting.length} 集`, grouped(waiting, 'tight')) : '') +
    (live.length ? section('live', '最近上线', `<a href="library.html">全部 ${L.totals.published} 个 → 视频库</a>`, `<div class="rows">${liveRows}</div>`) : '') +
    section('prs', '工程', '', `<details class="fold"${prsOpen ? ' open' : ''}><summary>开放中的 PR（${S.pulls.length}）——代码和工具的改动，一般不用管</summary>
      <div class="rows" style="margin-top:10px">${prs || '<p class="empty" style="padding:12px 16px">没有</p>'}</div></details>`);
  freshness(document.getElementById('fresh'), S.generated_at);
}

async function load(){
  clearTimeout(window.__retry);
  try{
    const [s, l] = await Promise.all([loadData('status.json'), loadData('library.json').catch(() => null)]);
    S = s; L = l;
    render();
  }catch(e){
    document.getElementById('app').innerHTML = `<p class="error">进度数据加载失败：${esc(e.message)}；10 秒后自动重试。 <button class="ghost small" onclick="load()">立即重试</button></p>`;
    window.__retry = setTimeout(load, 10000);
  }
}
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-copy]');
  if(b){ ev.preventDefault(); copyText(b, b.dataset.copy); }
});
load();
setInterval(() => { if(!document.hidden) load(); }, 5 * 60 * 1000);
</script>
</body>
</html>
