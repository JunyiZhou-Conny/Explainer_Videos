<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explainer Studio · 看板</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <span class="brand">CONNY<span class="dot">/</span>EXPLAINER STUDIO</span>
  <nav>
    <a class="active" href="./">看板</a>
    <a href="new.html">新视频</a>
    <a href="library.html">视频库</a>
    <a href="https://github.com/JunyiZhou-Conny/Explainer_Videos" target="_blank" rel="noopener">GitHub ↗</a>
  </nav>
</header>
<main>
  <h1>剧集看板</h1>
  <p class="sub">实时读取 GitHub issues 的 <code>state:</code> 标签 —— 这里只是镜子，真相永远在 issue 里。</p>
  <div id="board" class="lanes"><p>加载中…</p></div>
  <div id="prs" style="margin-top:34px;max-width:680px"></div>
</main>
<script>
const REPO = 'JunyiZhou-Conny/Explainer_Videos';
const LANES = [
  ['state:scripting', '制作中'],
  ['state:sample-review', '等你审样片', true],
  ['state:full-review', '等你听全片', true],
  ['blocked:question', '等你答复', true],
  ['state:publishing', '发布中'],
  ['state:published', '已上 B 站'],
];
// fetch with retries: raw.githubusercontent / api.github.com drop connections now and then.
async function fetchJSON(url, tries = 3){
  for(let i = 1; ; i++){
    try{
      const r = await fetch(url);
      if(r.status === 403 || r.status === 429) throw new Error(`GitHub API ${r.status}（未登录限每小时 60 次）`);
      if(!r.ok) throw new Error(`HTTP ${r.status}`);
      return await r.json();
    }catch(e){
      if(i >= tries) throw e;
      await new Promise(res => setTimeout(res, 800 * i));
    }
  }
}
function scheduleRetry(el, msg, fn, secs = 10){
  el.innerHTML = `<p class="error">${msg}；${secs} 秒后自动重试。 <button class="ghost" onclick="load()">立即重试</button></p>`;
  clearTimeout(window.__retryTimer);
  window.__retryTimer = setTimeout(fn, secs * 1000);
}
const STALE_MS = 24 * 3600 * 1000;
function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML;}
function ago(t){
  const m = Math.round((Date.now() - t) / 60000);
  if(m < 60) return `${Math.max(m, 1)} 分钟前`;
  if(m < 1440) return `${Math.round(m / 60)} 小时前`;
  return `${Math.round(m / 1440)} 天前`;
}
function firstLine(body){
  // ">" is kept on purpose: a quote-reply to a protocol comment must not count as a new event.
  return (body || '').split('\n').map(s => s.replace(/^[\s#*_`]+/, '').trim()).find(Boolean) || '';
}
// Reads the AGENTS.md handoff protocol out of issue comments: claims, CHECKPOINT and HANDOFF.
async function loadProtocol(){
  const status = new Map();
  try{
    const comments = await fetchJSON(`https://api.github.com/repos/${REPO}/issues/comments?sort=created&direction=desc&per_page=100`);
    for(const c of comments){
      const n = Number(c.issue_url.split('/').pop());
      const s = status.get(n) || {};
      const line = firstLine(c.body);
      const at = Date.parse(c.created_at);
      const claim = line.match(/^Claiming\.?\s*Model:\s*([^,]+)/i);
      const mark = line.match(/^(CHECKPOINT|HANDOFF)\b\s*([\w-]*)/i);
      if(claim && !s.claim) s.claim = {model: claim[1].trim(), at};
      if(mark && !s.mark) s.mark = {kind: mark[1].toUpperCase(), stage: mark[2], at};
      status.set(n, s);
    }
  }catch(e){ /* the board still renders without protocol details */ }
  return status;
}
function protocolHtml(s, open){
  if(!s || (!s.claim && !s.mark)) return '';
  const parts = [];
  const released = s.mark && s.mark.kind === 'HANDOFF' && (!s.claim || s.mark.at >= s.claim.at);
  if(released) parts.push('已交接，待认领');
  else if(s.claim) parts.push(`认领：${esc(s.claim.model)}`);
  if(s.mark && s.mark.kind === 'CHECKPOINT') parts.push(`检查点 ${esc(s.mark.stage || '')} · ${ago(s.mark.at)}`);
  const last = Math.max(s.claim?.at || 0, s.mark?.at || 0);
  const stale = open && !released && Date.now() - last > STALE_MS;
  return `<div class="meta">${parts.join(' · ')}</div>` + (stale ? '<span class="chip q">可能停滞</span>' : '');
}
async function load(){
  const board = document.getElementById('board');
  try{
    const [rawIssues, protocol, pulls] = await Promise.all([
      fetchJSON(`https://api.github.com/repos/${REPO}/issues?labels=episode&state=all&per_page=100`),
      loadProtocol(),
      fetchJSON(`https://api.github.com/repos/${REPO}/pulls?state=open&per_page=30`).catch(() => null),
    ]);
    const issues = rawIssues.filter(i => !i.pull_request);
    board.innerHTML = '';
    for(const [label, name, attention] of LANES){
      const items = issues.filter(i => i.labels.some(l => l.name === label));
      const lane = document.createElement('div');
      lane.className = 'lane' + (attention && items.length ? ' attention' : '');
      lane.innerHTML = `<h2><span>${name}</span><span class="count">${items.length}</span></h2>`;
      for(const i of items){
        const extra = i.labels.filter(l => !['episode', 'blocked:question', label].includes(l.name)).map(l => `<span class="chip">${esc(l.name)}</span>`).join('');
        const q = i.labels.some(l => l.name === 'blocked:question') && label !== 'blocked:question'
          ? '<span class="chip q">blocked:question</span>' : '';
        lane.insertAdjacentHTML('beforeend', `
          <div class="card">
            <a class="title" href="${i.html_url}" target="_blank" rel="noopener">${esc(i.title)}</a>
            <div class="meta">#${i.number} · ${new Date(i.updated_at).toLocaleDateString('zh-CN')} 更新</div>
            ${protocolHtml(protocol.get(i.number), i.state === 'open' && label !== 'state:published')}
            ${q}${extra}
          </div>`);
      }
      if(!items.length) lane.insertAdjacentHTML('beforeend', '<div class="card meta" style="color:var(--gray)">空</div>');
      board.appendChild(lane);
    }
    const prs = document.getElementById('prs');
    if(pulls){
      prs.innerHTML = `<h2 class="strip-h">进行中的 PR <span style="color:var(--red)">${pulls.length}</span></h2>` +
        (pulls.map(p => `
          <div class="card">
            <a class="title" href="${p.html_url}" target="_blank" rel="noopener">#${p.number} ${esc(p.title)}</a>
            <div class="meta">${esc(p.head.ref)} · ${new Date(p.updated_at).toLocaleDateString('zh-CN')} 更新${p.draft ? ' · 草稿' : ''}</div>
          </div>`).join('') || '<div class="card meta" style="color:var(--gray)">没有开放的 PR</div>');
    } else {
      prs.innerHTML = '<p class="sub">PR 列表这次没加载出来，看板其余部分不受影响。</p>';
    }
  }catch(e){
    scheduleRetry(board, `看板加载失败：${esc(e.message)}`, load);
  }
}
load();
</script>
</body>
</html>
