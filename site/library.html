<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explainer Studio · 视频库</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <span class="brand">CONNY<span class="dot">/</span>EXPLAINER STUDIO</span>
  <nav>
    <a href="./">看板</a>
    <a href="new.html">新视频</a>
    <a class="active" href="library.html">视频库</a>
    <a href="https://github.com/JunyiZhou-Conny/Explainer_Videos" target="_blank" rel="noopener">GitHub ↗</a>
  </nav>
</header>
<main>
  <h1>视频库</h1>
  <p class="sub">实时读取 <code>catalog/videos.json</code>。每个变体都是 release 资产，下载不依赖任何分支。</p>
  <div id="list"><p>加载中…</p></div>
</main>
<script>
const RAW = 'https://raw.githubusercontent.com/JunyiZhou-Conny/Explainer_Videos/main/catalog/';
function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML;}
function dur(s){ if(!s) return ''; s=Math.round(s); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }
function mb(b){ return b ? (b/1048576).toFixed(1) + ' MB' : ''; }
async function load(){
  const el = document.getElementById('list');
  try{
    const cat = await (await fetch(RAW + 'videos.json')).json();
    // The registry is optional: without it, badges say the status is unknown rather than "not on Bilibili".
    const reg = await fetch(RAW + 'bilibili.json').then(r => r.ok ? r.json() : null).catch(() => null);
    const byEp = new Map();
    for(const a of cat.artifacts){
      if(!byEp.has(a.episode)) byEp.set(a.episode, []);
      byEp.get(a.episode).push(a);
    }
    let html = '';
    for(const [ep, arts] of [...byEp.entries()].reverse()){
      const title = arts.find(a => a.title)?.title || ep;
      const bili = reg?.episodes?.[ep];
      const badge = !reg ? '<span class="badge none">B 站状态未知</span>'
        : bili ? `<a class="badge bili" href="https://www.bilibili.com/video/${esc(bili.bvid)}/" target="_blank" rel="noopener">B 站 ↗</a>`
        : '<span class="badge none">未上 B 站</span>';
      html += `<h2 style="margin:26px 0 8px;font-size:1.15rem">${esc(title)} ${badge}</h2>
        <table><tr><th>版本</th><th>时长</th><th>大小</th><th>下载</th></tr>`;
      for(const a of arts){
        html += `<tr>
          <td><span class="variant">${esc(a.variant || '—')}</span></td>
          <td>${dur(a.duration_seconds)}</td>
          <td>${mb(a.bytes)}</td>
          <td><a href="${a.download_url}">MP4</a></td>
        </tr>`;
      }
      html += '</table>';
    }
    const stray = reg?.unmatched || [];
    if(stray.length){
      html += `<h2 style="margin:34px 0 8px;font-size:1.15rem">B 站上有、还没对应到目录的视频</h2>
        <p class="sub">登记表 <code>catalog/bilibili.json</code> 里还没归到某一集。告诉代理它对应哪一集即可。</p><table>`;
      for(const a of stray){
        html += `<tr><td><a href="https://www.bilibili.com/video/${esc(a.bvid)}/" target="_blank" rel="noopener">${esc(a.title)}</a></td>
          <td>${new Date(a.pubdate * 1000).toLocaleDateString('zh-CN')}</td></tr>`;
      }
      html += '</table>';
    }
    el.innerHTML = html || '<p>目录为空。</p>';
  }catch(e){
    el.innerHTML = `<p class="error">目录加载失败：${esc(e.message)}，稍后刷新。</p>`;
  }
}
load();
</script>
</body>
</html>
