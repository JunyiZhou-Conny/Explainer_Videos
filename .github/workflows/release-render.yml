name: Full episode render

# Renders a complete episode.json episode in the cloud and attaches the MP4 as a
# workflow artifact. Trigger it with the `full-render` label on an episode PR, or
# by hand with the episode path. Measured cost: ~5 min render per 5-minute episode
# on the standard runner, plus ~3 min cold setup (seconds when the caches are warm).
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      episode:
        description: Episode directory, e.g. videos/skills-ecosystem
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  render:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'full-render'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3.12-venv libpango1.0-dev libcairo2-dev pkg-config ffmpeg
      - name: Cache the virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('setup/requirements-swiss.txt', 'setup/requirements-dev.txt') }}
      - name: Cache fonts and the TTS model
        uses: actions/cache@v4
        with:
          path: |
            assets/fonts
            assets/tts-models
          key: assets-${{ hashFiles('assets/manifest.json') }}
      - name: Runtime setup
        run: python3.12 tools/setup-runtime
      - name: Pick the episode
        id: pick
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          INPUT: ${{ inputs.episode }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT:-}" ]; then echo "episode=$INPUT" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch --no-tags --depth=1 origin "$BASE"
          slug=$(git diff --name-only "$BASE...$HEAD" | grep '^videos/' | cut -d/ -f2 | sort -u | head -1)
          test -n "$slug" || { echo '::error::No episode directory in this PR.'; exit 1; }
          echo "episode=videos/$slug" >> "$GITHUB_OUTPUT"
      - name: "Full render (validated: duration, audio, captions, script integrity)"
        run: |
          set -euo pipefail
          python3 skill-library/conny-explainer-video/scripts/render.py "${{ steps.pick.outputs.episode }}" --jobs 4
          ls -l "outputs/$(basename "${{ steps.pick.outputs.episode }}")/"
      - name: Upload the episode
        uses: actions/upload-artifact@v4
        with:
          name: episode-${{ github.event.pull_request.number || github.run_id }}
          path: |
            outputs/*/*.mp4
            outputs/*/*.srt
            outputs/*/*.ass
            outputs/*/*.validation.json
            outputs/*/*.chapters.txt
          retention-days: 30
      - name: Tell the PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="Full render finished: download it from this run's artifacts — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          footer=$'\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_'
          gh pr comment ${{ github.event.pull_request.number }} --repo "$GITHUB_REPOSITORY" --body "$body$footer"
