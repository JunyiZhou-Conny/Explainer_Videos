name: Release a video.yaml episode

# The legacy route's twin of episode-release.yml, for the long follow-along videos (the AC215
# series). A 30-minute cut is about 2.5 hours of 1080p rendering on one 4-core runner, so each
# scene renders in its own job; one job then stitches them with explainer.build (bilingual
# subtitles burned into the full cut), measures the result and runs tools/release_episode.py:
# tag episode/<slug>-vN, upload the deliverables with SHA256SUMS and the PUBLISH manifest the
# Mac publish worker executes. Runs in Actions because only its token may create releases.
# Before it spends any runner time it checks REVIEW.md's sign-off line and video.yaml's
# `publish:` block (Bilibili title, description, tags).
on:
  workflow_dispatch:
    inputs:
      episode:
        description: Episode directory, e.g. videos/ac215-l02-containers-1
        required: true
      issue:
        description: The episode's issue number (for the publish worker's report-back)
        required: false

permissions:
  contents: read

env:
  EPISODE: ${{ inputs.episode }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      scenes: ${{ steps.plan.outputs.scenes }}
      latex: ${{ steps.plan.outputs.latex }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Preflight (sign-off, publish block) and the scene list
        id: plan
        run: |
          set -euo pipefail
          if ! [[ "$EPISODE" =~ ^videos/[a-z0-9][a-z0-9-]*$ ]] || [ ! -f "$EPISODE/video.yaml" ]; then
            echo "::error::'$EPISODE' is not a videos/<slug> directory with a video.yaml."; exit 1
          fi
          python -m pip install -q pyyaml
          python tools/release_episode.py "$EPISODE" --preflight | tee -a "$GITHUB_OUTPUT"

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: true
      max-parallel: 10
      matrix:
        scene: ${{ fromJSON(needs.plan.outputs.scenes) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/legacy-runtime
        with:
          latex: ${{ needs.plan.outputs.latex }}
      - name: Render ${{ matrix.scene }} (1080p)
        env:
          SCENE: ${{ matrix.scene }}
        run: .venv/bin/python -m explainer.build "$EPISODE" --only "$SCENE" --render-only --jobs 1
      - name: Keep only what the stitch reads (movie, audio, subtitle and event sidecars, voice stamp)
        env:
          SCENE: ${{ matrix.scene }}
        run: |
          set -euo pipefail
          d="$EPISODE/build/media_h/$SCENE"
          find "$d" -mindepth 1 -type d \( -name partial_movie_files -o -name texts -o -name Tex -o -name images \) \
            -prune -exec rm -rf {} +
          find "$d" -type f | sort
      - uses: actions/upload-artifact@v4
        with:
          name: scene-${{ matrix.scene }}
          path: ${{ inputs.episode }}/build/media_h/${{ matrix.scene }}/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Keep the render log of a failed scene
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.scene }}
          path: ${{ inputs.episode }}/build/logs/
          retention-days: 7

  release:
    needs: [plan, render]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/legacy-runtime
        with:
          latex: "false"
          voice: "false"
      - uses: actions/download-artifact@v4
        with:
          pattern: scene-*
          path: scene-renders
      - name: Put the scene renders where explainer.build looks
        run: |
          set -euo pipefail
          mkdir -p "$EPISODE/build/media_h"
          for d in scene-renders/scene-*; do mv "$d" "$EPISODE/build/media_h/${d#scene-renders/scene-}"; done
          ls "$EPISODE/build/media_h"
      - name: Stitch (the full cut with bilingual subtitles burned in, the clean cut, the parts)
        run: .venv/bin/python -m explainer.build "$EPISODE" --no-render --crf 27 --burn
      - name: Did the release render reproduce the reviewed subtitles?
        run: git diff --stat -- "$EPISODE/output" || true
      - name: Tag, upload and emit the publish manifest
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          issue="${ISSUE#\#}"                       # tolerate "#12"; never interpolate inputs into the shell
          args=( "$EPISODE" )
          if [ -n "$issue" ]; then args+=( --issue "$issue" ); fi
          .venv/bin/python tools/release_episode.py "${args[@]}"
      - name: Tell the episode issue
        if: inputs.issue != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          issue="${ISSUE#\#}"
          slug=$(basename "$EPISODE")
          body="Released: the deliverables and the PUBLISH manifest are on the newest \`episode/$slug\` release. The Mac publish worker uploads to Bilibili on its next run."
          footer=$'\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_'
          gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body$footer"
          gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" \
            --remove-label state:full-review --add-label state:publishing || true
