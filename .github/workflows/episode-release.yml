name: Release episode

# After an episode PR merges (with Conny's listening sign-off recorded in REVIEW.md),
# render the final deliverables and publish them: tag episode/<slug>-vN, upload the MP4,
# subtitles, chapters and SHA256SUMS plus the PUBLISH.md/PUBLISH.json manifest the Mac
# publish worker executes. Runs in Actions because only its token may create releases.
on:
  workflow_dispatch:
    inputs:
      episode:
        description: Episode directory, e.g. videos/git-branches
        required: true
      issue:
        description: The episode's issue number (for the publish worker's report-back)
        required: false

permissions:
  contents: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3.12-venv libpango1.0-dev libcairo2-dev pkg-config ffmpeg
      - name: Cache the virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('setup/requirements-swiss.txt', 'setup/requirements-dev.txt') }}
      - name: Cache fonts and the TTS model
        uses: actions/cache@v4
        with:
          path: |
            assets/fonts
            assets/tts-models
          key: assets-${{ hashFiles('assets/manifest.json') }}
      - name: Runtime setup
        run: python3.12 tools/setup-runtime
      - name: Final render (validated, scored, style-checked)
        run: |
          set -euo pipefail
          python3 skill-library/conny-explainer-video/scripts/render.py "${{ inputs.episode }}" --jobs 4
      - name: Keep the evidence when the render fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-failure-${{ github.run_id }}
          path: |
            outputs/*/golden-diffs/*.png
            outputs/*/*.clean.mp4
          if-no-files-found: ignore
          retention-days: 14
      - name: Tag, upload and emit the publish manifest
        env:
          GH_TOKEN: ${{ github.token }}
          EPISODE: ${{ inputs.episode }}
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          issue="${ISSUE#\#}"                       # tolerate "#12"; never interpolate inputs into the shell
          args=( "$EPISODE" )
          if [ -n "$issue" ]; then args+=( --issue "$issue" ); fi
          .venv/bin/python tools/release_episode.py "${args[@]}"
      - name: Tell the episode issue
        if: inputs.issue != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EPISODE: ${{ inputs.episode }}
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          issue="${ISSUE#\#}"
          slug=$(basename "$EPISODE")
          body="Released: the deliverables and the PUBLISH manifest are on the newest \`episode/$slug\` release. The Mac publish worker uploads to Bilibili on its next run."
          footer=$'\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_'
          gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body$footer"
          gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" \
            --remove-label state:full-review --add-label state:publishing || true
