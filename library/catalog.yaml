# The library: single source of truth for every paper in this repo.
#
#   python tools/ingest.py <pdf> --category <slug>   # add a paper (files the PDF, appends a stub here)
#   python tools/catalog.py                          # validate + regenerate README.md and MAP.md
#
# Paper fields: id (citekey) · title · short_name · authors · year · venue · arxiv · doi ·
#   category (slug below; the PDF lives in library/<category>/<id>.pdf) · tags · pdf ·
#   status (unread | skimmed | reading | read | video) · one_liner · key_ideas ·
#   builds_on (ids of library papers this one directly builds on) · cites (all library papers it cites) ·
#   videos (ids under videos/) · notes (your own words, after reading)

categories:
  privacy/differential-privacy:
    title: Differential privacy
    description: 'Mathematical privacy guarantees for statistics and learning: noise calibrated so that no single
      person''s data changes what can be learned.'
  reinforcement-learning/policy-optimization:
    title: RL · policy optimization (PPO → GRPO → R1 → DAPO)
    description: Core RL algorithms and recipes for training policies, mainly LLMs (PPO, GRPO, R1-style RL with
      rule-based rewards, DAPO); every RL-for-vision paper in the library reuses them.
  reinforcement-learning/rl-for-segmentation:
    title: RL · reasoning segmentation & grounding
    description: Vision-language models trained with GRPO-style RL to reason about a request and then locate the
      target, either as a box plus points that a SAM-family model turns into a mask or as a box alone, covering
      natural and medical images and multi-turn agents.
  reinforcement-learning/rl-for-medical-vqa:
    title: RL · medical visual question answering
    description: RL (GRPO) fine-tuning of vision-language models to answer questions about medical images, using
      rule-based rewards that can be checked automatically, with the goal of generalizing across imaging types.
  reinforcement-learning/rl-for-pathology:
    title: RL · agents for pathology
    description: RL agents for pathology and microscopy images that either choose where to look in gigapixel slides
      (attention glimpses, PPO observation paths, Q-learning from pathologists' gaze) or produce instance segmentations
      rewarded by non-differentiable shape priors.
  segmentation/architectures:
    title: Segmentation · architectures & task definitions
    description: Foundational segmentation networks, pipelines and task definitions (U-Net, nnU-Net, and panoptic
      segmentation with its PQ metric) that the rest of the library builds on.
  segmentation/promptable-foundation-models:
    title: Segmentation · promptable foundation models
    description: Large promptable segmentation models (SAM, SAM 2) that turn clicks, boxes or rough masks into object
      masks; the RL-trained vision-language models use them as a frozen tool or as the source of their reward.
  segmentation/nuclei-instance:
    title: Segmentation · nuclei, cell & gland instances
    description: Methods for separating and classifying individual nuclei in histology and microscopy images, from
      shape representations (StarDist polygons, HoVer-Net distance maps) to learning from point clicks only (Qu
      et al., SC-Net).
  segmentation/topology-aware:
    title: Segmentation · topology-aware losses
    description: Losses and metrics that make a segmentation keep the right connected pieces, holes and branches,
      using persistent homology, soft skeletons (clDice) and Betti matching.
  datasets/computational-pathology:
    title: Datasets · computational pathology
    description: Benchmark datasets and challenges for segmenting and classifying individual glands and nuclei in
      H&E histology (GlaS, PanNuke, Lizard).
