- id: dwork2006calibrating
  title: Calibrating Noise to Sensitivity in Private Data Analysis
  short_name: Laplace mechanism / ε-DP
  authors:
  - Cynthia Dwork
  - Frank McSherry
  - Kobbi Nissim
  - Adam Smith
  year: 2006
  venue: TCC 2006 (LNCS 3876)
  arxiv: ''
  doi: 10.1007/11681878_14
  category: privacy/differential-privacy
  tags:
  - differential-privacy
  - laplace-mechanism
  - sensitivity
  - privacy-budget
  - lower-bounds
  pdf: library/privacy/differential-privacy/dwork2006calibrating.pdf
  status: video
  one_liner: Defines privacy as 'one person's row barely changes the odds of any output' and shows that adding Laplace
    noise scaled to the query's sensitivity achieves it — the founding paper of differential privacy.
  key_ideas:
  - 'ε-indistinguishability: for databases differing in one row, every output''s probability changes by at most
    a factor e^ε'
  - L1 sensitivity S(f) and the Laplace mechanism f(x) + Lap(S(f)/ε), also for adaptive query sequences (privacy
    budget)
  - Non-interactive sanitizers cannot answer most low-sensitivity queries unless n is exponential in d
  builds_on: []
  cites: []
  related_external:
  - Dinur & Nissim 2003 — Revealing information while preserving privacy (reconstruction attacks)
  - 'Blum, Dwork, McSherry & Nissim 2005 — Practical privacy: the SuLQ framework'
  - 'Dwork 2006 — Differential Privacy (ICALP): names the definition'
  - McSherry & Talwar 2007 — the exponential mechanism
  - Abadi et al. 2016 — Deep learning with differential privacy (DP-SGD)
  videos:
  - dwork2006-calibrating-noise
- id: schulman2017ppo
  title: Proximal Policy Optimization Algorithms
  short_name: PPO
  authors:
  - John Schulman
  - Filip Wolski
  - Prafulla Dhariwal
  - Alec Radford
  - et al.
  year: 2017
  venue: arXiv preprint
  arxiv: '1707.06347'
  doi: ''
  category: reinforcement-learning/policy-optimization
  tags:
  - policy-gradient
  - clipped-surrogate-objective
  - trust-region
  - actor-critic
  - continuous-control
  pdf: library/reinforcement-learning/policy-optimization/schulman2017ppo.pdf
  status: unread
  one_liner: PPO trains a decision-making policy by reusing each batch of experience for several gradient steps
    while clipping how far the new policy's action probabilities can move from the old one's, which gives most of
    the stability of trust-region methods with plain first-order optimization.
  key_ideas:
  - 'Clipped surrogate objective: the probability ratio r = pi_new/pi_old is clipped to [1-eps, 1+eps] and the minimum
    of the clipped and unclipped advantage-weighted terms is taken, giving a pessimistic lower bound that removes
    the incentive for overly large policy updates'
  - Alternative adaptive-KL-penalty variant that raises or lowers the penalty coefficient beta to hit a target KL
    divergence between old and new policies
  - 'Practical actor-critic algorithm: N parallel actors collect T-step rollouts, advantages come from truncated
    Generalized Advantage Estimation (GAE), then several epochs of minibatch SGD optimize a combined policy, value,
    and entropy loss; beats A2C/TRPO on MuJoCo and Atari'
  builds_on: []
  cites: []
  video_hook: 'Plot the objective against the probability ratio r and show the flat clipped plateaus outside [1-eps,
    1+eps]: once the policy has moved far enough in the good direction, the gradient switches off, like a leash
    that keeps each update close to the old policy.'
- id: shao2024deepseekmath
  title: 'DeepSeekMath: Pushing the Limits of Mathematical Reasoning in Open Language Models'
  short_name: GRPO / DeepSeekMath
  authors:
  - Zhihong Shao
  - Peiyi Wang
  - Qihao Zhu
  - Runxin Xu
  - et al.
  year: 2024
  venue: arXiv preprint
  arxiv: '2402.03300'
  doi: ''
  category: reinforcement-learning/policy-optimization
  tags:
  - grpo
  - llm-reasoning
  - math-reasoning
  - pretraining-data
  - rlhf
  pdf: library/reinforcement-learning/policy-optimization/shao2024deepseekmath.pdf
  status: unread
  one_liner: DeepSeekMath is a 7B open language model that approaches GPT-4 on competition math, thanks to 120B
    tokens of math text mined from the web and GRPO, a lighter version of PPO that scores each answer against a
    group of answers to the same question instead of training a separate critic network.
  key_ideas:
  - 'DeepSeekMath Corpus: an iterative fastText-classifier pipeline, seeded with OpenWebMath and refined with human
    annotation, mines 120B math tokens from Common Crawl; continued pretraining of DeepSeek-Coder-Base-v1.5 7B reaches
    64.2% GSM8K and 36.2% MATH'
  - 'Group Relative Policy Optimization (GRPO): sample G outputs per question, normalize their rewards within the
    group (subtract mean, divide by std) to get advantages, drop PPO''s value model, and add the KL to a reference
    model directly in the loss, which cuts memory and compute'
  - A unified gradient-coefficient view showing SFT, RFT, DPO, PPO and GRPO as variants of the same RL template
    (data source, reward function, gradient coefficient), plus studies of online vs offline, outcome vs process
    supervision, and iterative RL
  builds_on:
  - schulman2017ppo
  cites:
  - schulman2017ppo
  video_hook: 'For one math question, draw a fan of 8 sampled answers, each with its reward, then slide them onto
    a number line centred on the group mean: answers above the mean are pushed up and those below are pushed down,
    with no critic network anywhere in the picture.'
- id: guo2025deepseekr1
  title: 'DeepSeek-R1: Incentivizing Reasoning Capability in LLMs via Reinforcement Learning'
  short_name: DeepSeek-R1 / R1-Zero
  authors:
  - Daya Guo
  - Dejian Yang
  - Haowei Zhang
  - Junxiao Song
  - et al.
  year: 2025
  venue: arXiv preprint
  arxiv: '2501.12948'
  doi: ''
  category: reinforcement-learning/policy-optimization
  tags:
  - grpo
  - llm-reasoning
  - chain-of-thought
  - rule-based-reward
  - distillation
  - emergent-reasoning
  pdf: library/reinforcement-learning/policy-optimization/guo2025deepseekr1.pdf
  status: unread
  one_liner: DeepSeek-R1 shows that a large language model can learn to reason step by step (checking and revising
    its own work) through reinforcement learning alone, rewarded only for getting the final answer right, with no
    human-written reasoning examples.
  key_ideas:
  - 'DeepSeek-R1-Zero: GRPO applied directly to DeepSeek-V3-Base with no SFT, using only rule-based accuracy and
    format rewards (reasoning inside <think> tags); responses grow longer and self-reflection and verification (the
    ''aha moment'') emerge during training'
  - 'DeepSeek-R1: a multi-stage pipeline (cold-start long-CoT SFT, reasoning RL with a language-consistency reward,
    rejection sampling plus SFT on reasoning and general data, then a final RL stage with helpfulness/harmlessness
    reward models) fixes R1-Zero''s poor readability and language mixing'
  - 'Distillation: R1''s reasoning traces are used to fine-tune smaller Qwen/Llama models that beat their instruction-tuned
    counterparts; an appendix compares GRPO with PPO and finds PPO sensitive to the GAE lambda setting'
  builds_on:
  - shao2024deepseekmath
  cites:
  - schulman2017ppo
  - shao2024deepseekmath
  video_hook: Animate the average response length climbing over thousands of RL steps while sample outputs appear
    above the curve, until the model writes 'Wait, wait. That's an aha moment...' and backtracks to fix its own
    mistake, behaviour nobody taught it.
- id: yu2025dapo
  title: 'DAPO: An Open-Source LLM Reinforcement Learning System at Scale'
  short_name: DAPO
  authors:
  - Qiying Yu
  - Zheng Zhang
  - Ruofei Zhu
  - Yufeng Yuan
  - et al.
  year: 2025
  venue: arXiv preprint
  arxiv: '2503.14476'
  doi: ''
  category: reinforcement-learning/policy-optimization
  tags:
  - grpo
  - long-cot
  - entropy-collapse
  - open-source
  - llm-reasoning
  pdf: library/reinforcement-learning/policy-optimization/yu2025dapo.pdf
  status: unread
  one_liner: DAPO is an openly released recipe of four fixes to GRPO-style reinforcement learning (asymmetric clipping,
    skipping uninformative prompt groups, per-token loss averaging, and a soft penalty for over-long answers) that
    lets Qwen2.5-32B reach 50 on AIME 2024 in half the training steps DeepSeek-R1-Zero needed.
  key_ideas:
  - 'Clip-Higher: decouple the PPO clip range into eps_low and a larger eps_high so low-probability tokens can still
    be boosted, which prevents entropy collapse and keeps exploration alive'
  - 'Dynamic Sampling: over-sample and drop prompt groups whose answers are all correct or all wrong (zero advantage,
    so zero gradient), keeping every batch full of useful signal; KL penalty removed'
  - Token-Level Policy Gradient Loss, which averages over all tokens rather than per sample so long reasoning chains
    are not under-weighted, plus Overlong Reward Shaping (filtering truncated samples and a soft length penalty)
    to cut reward noise; released with verl-based code and the DAPO-Math-17K dataset
  builds_on:
  - schulman2017ppo
  - shao2024deepseekmath
  - guo2025deepseekr1
  cites:
  - schulman2017ppo
  - shao2024deepseekmath
  - guo2025deepseekr1
  video_hook: Show the clipping window on the probability ratio stretching asymmetrically, with the upper edge widened,
    so rare but good tokens (a thin sliver of probability) are finally allowed to grow, while a token-entropy meter
    that was collapsing toward zero recovers.
- id: liu2025segzero
  title: 'Seg-Zero: Reasoning-Chain Guided Segmentation via Cognitive Reinforcement'
  short_name: Seg-Zero
  authors:
  - Yuqi Liu
  - Bohao Peng
  - Zhisheng Zhong
