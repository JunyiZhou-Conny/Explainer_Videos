  pdf: library/reinforcement-learning/rl-for-segmentation/liu2025segzero.pdf
  status: unread
  one_liner: Seg-Zero gets a vision-language model to think out loud about which object a tricky request refers
    to, then output a box and points that a frozen SAM2 turns into a pixel mask; the model is trained only with
    reinforcement learning rewards, with no example reasoning to imitate.
  key_ideas:
  - 'Decoupled architecture: a reasoning MLLM (Qwen2.5-VL) reads the image and query, writes a chain of thought,
    and outputs a bounding box plus two points; a frozen SAM2 segmentation model turns these prompts into the mask'
  - 'Pure GRPO training from the pretrained model with no reasoning annotations (R1-Zero style), on just 9,000 RefCOCOg
    samples, using five rule-based rewards: thinking format, segmentation format (soft/strict), bbox IoU, bbox L1,
    and point L1'
  - 'RL with a reasoning chain generalizes better than SFT, avoids catastrophic forgetting, and shows emergent test-time
    reasoning: Seg-Zero-7B scores 57.5 zero-shot on ReasonSeg, 18% above LISA-7B'
  builds_on:
