    foreground and red background clicks, and SAM2 fills in the mask. Several such attempts are then scored side
    by side, and the higher-IoU ones are pushed up.'
- id: zhu2025lens
  title: 'LENS: Learning to Segment Anything with Unified Reinforced Reasoning'
  short_name: LENS
  authors:
  - Lianghui Zhu
  - Bin Ouyang
  - Yuxuan Zhang
  - Tianheng Cheng
  - et al.
  year: 2025
  venue: AAAI 2026
  arxiv: '2508.14153'
  doi: ''
  category: reinforcement-learning/rl-for-segmentation
  tags:
  - text-prompted-segmentation
  - grpo
  - end-to-end
  - sam2
  - chain-of-thought
  - referring-segmentation
  pdf: library/reinforcement-learning/rl-for-segmentation/zhu2025lens.pdf
  status: unread
  one_liner: LENS segments whatever a sentence describes by having a vision-language model reason step by step and
    pass a rich learned summary of that reasoning straight into SAM, rather than just a box. The model and SAM are
    trained together with reinforcement learning, using rewards for format, box accuracy and mask accuracy.
  key_ideas:
  - A context module links the two models end to end. Learnable context queries are appended after the MLLM's chain
    of thought and box, and a shallow transformer connector projects them into SAM2's prompt space, so errors in
    the box alone no longer decide the mask.
  - Two-stage training. In pretraining alignment only the queries and connector are trained, with a segmentation
    loss, while the MLLM and SAM2 stay frozen. In the RL stage the MLLM and mask decoder are unfrozen.
  - Unified GRPO rewards (format, box IoU, segment IoU) plus a pixel-level segmentation loss. Using Qwen2.5-VL-3B,
    LENS reaches 81.2% average cIoU on RefCOCO/+/g, 58.0 on ReasonSeg and 78.3 on GS-Eval.
  builds_on:
  - shao2024deepseekmath
  - liu2025segzero
  - ravi2024sam2
  cites:
  - schulman2017ppo
  - shao2024deepseekmath
  - guo2025deepseekr1
  - liu2025segzero
  - kirillov2023sam
  - ravi2024sam2
  video_hook: Show two pipes from the reasoning model to SAM. In Seg-Zero only a box's four numbers fit through
    the narrow one, while in LENS a stream of context-query vectors carries the whole chain of thought through the
    wide one. Three reward meters (format, box IoU, mask IoU) light up as the mask sharpens.
- id: huang2025samr1
  title: 'SAM-R1: Leveraging SAM for Reward Feedback in Multimodal Segmentation via Reinforcement Learning'
  short_name: SAM-R1
  authors:
  - Jiaqi Huang
  - Zunnan Xu
  - Jun Zhou
  - Ting Liu
  - et al.
  year: 2025
  venue: arXiv preprint
  arxiv: '2505.22596'
  doi: ''
