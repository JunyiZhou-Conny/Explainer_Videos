  pdf: library/segmentation/topology-aware/stucki2023barcodes.pdf
  status: unread
  one_liner: Pixel-overlap losses like Dice can't tell whether a segmentation has the right number of connected
    pieces and loops in the right places, so this paper uses a tool from algebraic topology (induced matchings of
    persistence barcodes) to pair each topological feature in the prediction with the spatially corresponding feature
    in the ground truth, yielding both a metric and a trainable loss.
  key_ideas:
  - Uses induced matchings (Bauer & Lesnick 2015) by embedding prediction and ground truth into a common comparison
    image, so matched components/cycles are guaranteed to correspond in space, unlike the location-blind Wasserstein
    matching of Hu et al. 2019.
  - Defines the Betti matching error, an interpretable metric that counts unmatched topological features and is
    stricter than the Betti number error (which only compares counts).
  - Makes the matching differentiable as a loss (squared distance between matched birth/death values, added to Dice
    loss) with an efficient algorithm; improves topological scores on six datasets (roads, CREMI neurons, C. elegans,
    synthetic MNIST, colon cells, buildings) while keeping Dice.
  builds_on:
  - hu2019topoloss
  cites:
  - hu2019topoloss
  - clough2019topological
  - shit2021cldice
  video_hook: Show two images with loops, draw their persistence barcodes side by side, and animate Wasserstein
    matching pairing a loop in one corner with an unrelated loop in the opposite corner, then switch to Betti matching
    where each bar only links to the bar whose loop overlaps it in the comparison image.
