  one_liner: Extends the Betti matching topology loss from yes/no (binary) segmentation to images with many labeled
    structures, such as heart chambers or artery vs. vein, by treating each class as its own binary map so that
    connected pieces and holes come out right for every class.
  key_ideas:
  - Splits an N-class prediction into N one-channel (class-vs-rest) tasks, which slices the intractable N-parameter
    persistence module into N 1-parameter ones, so cost grows only linearly with the number of classes; the per-class
    Betti matching losses are summed.
  - Separates the Betti matching loss into matched-feature and unmatched-feature terms and adds a weighting between
    them, which can be tuned to dataset characteristics.
  - Builds multi-class versions of clDice and HuTopo as baselines and, training a residual U-Net, improves Betti
    matching error on ACDC cardiac MRI, Platelet EM, OCTA-500 artery-vein, and TopCoW Circle-of-Willis data.
