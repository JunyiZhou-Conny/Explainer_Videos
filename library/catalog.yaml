  - sam-as-reward
  - asymmetric-clipping
  - multimodal-llm
  pdf: library/reinforcement-learning/rl-for-segmentation/huang2025samr1.pdf
  status: unread
  one_liner: SAM-R1 trains a vision-language model to reason about a tricky request and output a box and points.
    It puts the Segment Anything Model inside the training loop, so each guess is turned into a real mask whose
    overlap with the true mask becomes the reward.
  key_ideas:
  - Qwen2.5-VL-7B outputs its reasoning plus a bounding box and positive/negative points. During RL, SAM2-Large
    turns these into a mask, and mask IoU against ground truth gives a fine-grained reward that supplements format
    and box/point rewards. This closes the pixel-feedback gap in Seg-Zero.
  - A modified GRPO objective, following DAPO. The upper clipping threshold is raised (asymmetric clipping) to allow
    more exploration, and the loss is normalized at the token level across the group to discourage long responses
    with little content.
  - Data-efficient. With only 3k training samples it improves the base model by 34.1% zero-shot on ReasonSeg. Ablations
    show that removing the KL term collapses training.
  builds_on:
  - shao2024deepseekmath
  - guo2025deepseekr1
  - yu2025dapo
  - liu2025segzero
  - ravi2024sam2
  cites:
