- id: you2025segr1
  title: 'Seg-R1: Segmentation Can Be Surprisingly Simple with Reinforcement Learning'
  short_name: Seg-R1
  authors:
  - Zuyao You
  - Zuxuan Wu
  year: 2025
  venue: arXiv preprint
  arxiv: '2506.22624'
  doi: ''
  category: reinforcement-learning/rl-for-segmentation
  tags:
  - grpo
  - sam2-prompting
  - camouflaged-object-detection
  - salient-object-detection
  - zero-shot-referring-segmentation
  - multimodal-llm
  pdf: library/reinforcement-learning/rl-for-segmentation/you2025segr1.pdf
  status: unread
  one_liner: Instead of bolting a mask decoder onto a vision-language model, Seg-R1 teaches the model with reinforcement
    learning to write out a bounding box and a few click points as plain text, which a frozen SAM2 turns into a
    mask, and the model is rewarded by how good that mask is.
  key_ideas:
  - Qwen2.5-VL reasons inside <think> tags and then outputs a box, points and positive/negative labels as ordinary
    tokens. A frozen SAM2 converts these prompts into a mask, so there are no special segmentation tokens and no
    architecture changes.
  - GRPO training with a format reward plus a segmentation reward of 0.7*IoU + 0.3*S-measure. Using S-measure alone
    led to reward hacking.
  - Pure RL (a pre-RL stage on high-resolution DIS5K, then COD10K/CAMO) on about 7k image-mask pairs with no text
    gives .873 S-measure on COD10K. It also transfers zero-shot to referring and reasoning segmentation (71.4 cIoU
    on RefCOCOg, 56.7 gIoU on ReasonSeg). A 1,500-sample FCoT dataset serves as the SFT baseline for comparison.
  builds_on:
  - shao2024deepseekmath
  - ravi2024sam2
  cites:
  - schulman2017ppo
  - shao2024deepseekmath
  - kirillov2023sam
  - ravi2024sam2
  - kirillov2019panoptic
