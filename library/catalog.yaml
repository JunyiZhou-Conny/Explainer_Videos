    misses but sits on another patch of the same disease, and gets partial credit as MedCLIP scores its crop against
    the phrase. A third on healthy lung gets nothing. Then animate how the group-relative advantage bars rearrange.
- id: liu2026medsamagent
  title: 'MedSAM-Agent: Empowering Interactive Medical Image Segmentation with Multi-turn Agentic Reinforcement
    Learning'
  short_name: MedSAM-Agent
  authors:
  - Shengyuan Liu
  - Liuxin Bao
  - Qi Yang
  - Wanting Geng
  - et al.
  year: 2026
  venue: arXiv preprint
  arxiv: '2602.03320'
  doi: ''
  category: reinforcement-learning/rl-for-segmentation
  tags:
  - medical-image-segmentation
  - agentic-rl
  - multi-turn
  - interactive-segmentation
  - process-reward
  - tool-use
  pdf: library/reinforcement-learning/rl-for-segmentation/liu2026medsamagent.pdf
  status: unread
  one_liner: MedSAM-Agent turns a vision-language model into an autonomous annotator. Over several turns it places
    a box, looks at the mask a SAM-style tool returns, adds corrective clicks and decides when to stop. It is trained
    first by imitating simulated expert sessions and then by reinforcement learning that rewards accurate and efficient
    interaction.
  key_ideas:
  - 'Recasts medical segmentation as a multi-step decision process. The policy (Qwen3-VL-8B) chooses among three
    actions: add a box, add a positive or negative click, or stop. A segmentation tool (MedSAM2, SAM2.1 or IMISNet)
    returns a mask, which is overlaid on the image and fed back at each turn.'
  - Hybrid-prompting trajectory synthesis. Box-to-Point and Sequential-Click sessions are simulated, with corrective
    clicks placed at the centroids of the largest false-negative or false-positive regions. Each step must raise
    IoU by a threshold, with retries, and a global IoU filter is applied. This yields 449K SFT cold-start samples.
  - 'GRPO with a clinical-fidelity process reward: format + IoU/Dice quality + a progressive-improvement bonus,
    minus an overshoot penalty and a per-step tool-cost penalty. It reports state-of-the-art results on 21 datasets
    across 6 modalities, and a policy trained with one tool transfers to other tools.'
  builds_on:
  - shao2024deepseekmath
  - ravi2024sam2
  - you2025segr1
  - liu2025segzero
  - huang2025samr1
  cites:
