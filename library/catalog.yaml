  pdf: library/reinforcement-learning/rl-for-segmentation/xu2025medground.pdf
  status: unread
  one_liner: MedGround-R1 teaches a vision-language model to draw a box around the region of a medical image (such
    as a chest X-ray) that a text phrase describes. It uses reinforcement learning with no hand-written reasoning
    examples, and rewards boxes for overlapping the right spot and for containing tissue that matches the description.
  key_ideas:
  - Adapts DeepSeek-R1-style GRPO to medical image grounding (text in, bounding box out) on Qwen2.5-VL. It needs
    only ground-truth boxes, not chain-of-thought annotations.
  - 'Spatial-semantic rewards: a binary spatial reward (IoU > 0.5) plus a continuous semantic reward, the cosine
    similarity in a frozen MedCLIP between the predicted box crop and the referring text. Boxes in the wrong place
    that still show the right kind of finding get more advantage than unrelated ones.'
  - 'Chain-of-Box template: whenever the reasoning in <think> mentions a region, it writes that region''s box coordinates
    inline, so the reasoning moves through image regions. Reports state-of-the-art results on MS-CXR, ChestX-ray8
    and M3D-RefSeg.'
  builds_on:
  - shao2024deepseekmath
  - guo2025deepseekr1
  cites:
  - schulman2017ppo
  - shao2024deepseekmath
  - guo2025deepseekr1
