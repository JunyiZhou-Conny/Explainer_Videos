    ground-truth mask, and the overlap area fills a reward bar that flows back to update the model. Then the PPO
    clipping window is shown stretching further on the upside.
- id: xu2025medground
  title: 'MedGround-R1: Advancing Medical Image Grounding via Spatial-Semantic Rewarded Group Relative Policy Optimization'
  short_name: MedGround-R1
  authors:
  - Huihui Xu
  - Yuanpeng Nie
  - Hualiang Wang
  - Ying Chen
  - et al.
  year: 2025
  venue: arXiv preprint
  arxiv: '2507.02994'
  doi: ''
